<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>6. 復帰摂理から見た第二次世界大戦の結果</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="34" y="38">6.</text>
    <text x="73" y="38" textLength="509" lengthAdjust="spacing">復帰摂理から見た第二次世界大戦の結果</text>
  </g>
  <line x1="72" y1="56" x2="583" y2="56" stroke="currentColor" stroke-width="2.2"/>

  <!-- 第二次大戦 → 天の側の勝利 -->
  <ellipse cx="409.5" cy="128" rx="250" ry="30.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="297" y="128" textLength="143" lengthAdjust="spacing">第二次大戦</text>
    <text x="507.5" y="128" textLength="170" lengthAdjust="spacing">天の側の勝利</text>
  </g>
  <polygon points="386,124 397,124 397,118 409,128.5 397,139 397,133 386,133" fill="#8C949A"/>

  <!-- 結果の三つ -->
  <g font-size="28" dominant-baseline="central">
    <text x="181.5" y="219" text-anchor="middle">①</text>
    <text x="202" y="219" textLength="403" lengthAdjust="spacing">三大祝福復帰の長成的蕩減条件</text>
    <text x="181.5" y="297.5" text-anchor="middle">②</text>
    <text x="202" y="297.5" textLength="172" lengthAdjust="spacing">第二祝福復帰</text>
    <text x="181.5" y="375.5" text-anchor="middle">③</text>
    <text x="201" y="375.5" textLength="286" lengthAdjust="spacing">主権復帰の長成的基台</text>
  </g>
</svg>
