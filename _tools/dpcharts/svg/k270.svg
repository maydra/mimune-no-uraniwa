<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『第二の奇跡（出エ 4:6～7）』</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="146" y="42" text-anchor="end">『</text>
    <text x="146" y="42" textLength="156" lengthAdjust="spacing">第二の奇跡</text>
    <text x="312" y="42" textLength="66" lengthAdjust="spacingAndGlyphs">(出エ</text>
    <text x="394.5" y="42" text-anchor="middle">4</text>
    <text x="409" y="42" text-anchor="middle">:</text>
    <text x="423.5" y="42" text-anchor="middle">6</text>
    <text x="452.5" y="42" text-anchor="middle">～</text>
    <text x="475" y="42" textLength="24" lengthAdjust="spacingAndGlyphs">7)</text>
    <text x="504" y="42">』</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="205.5,150 210.5,150 210.5,274 215,274 208,285.5 201,274 205.5,274"/>
    <polygon points="328.5,150 333.5,150 333.5,274 338,274 331,285.5 324,274 328.5,274"/>
    <polygon points="497.5,150 502.5,150 502.5,274 507,274 500,285.5 493,274 497.5,274"/>
    <polygon points="619.5,150 624.5,150 624.5,274 629,274 622,285.5 615,274 619.5,274"/>
    <polygon points="388.5,204.5 413,204.5 413,189 437.5,213.5 413,238 413,222.5 388.5,222.5"/>
    <polygon points="254,318 278,318 278,315 286.5,320.5 278,326 278,323 254,323"/>
    <polygon points="546,318 568,318 568,315 576.5,320.5 568,326 568,323 546,323"/>
  </g>

  <!-- 上の楕円（白） -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="208.5" cy="126.5" rx="52" ry="24"/>
    <ellipse cx="331.5" cy="126.5" rx="52" ry="24"/>
    <ellipse cx="500.5" cy="126.5" rx="52" ry="24"/>
    <ellipse cx="621.5" cy="126.5" rx="52" ry="24"/>
    <ellipse cx="331.5" cy="320.5" rx="34" ry="28"/>
    <ellipse cx="620.5" cy="320.5" rx="34" ry="28"/>
  </g>
  <!-- らい病の手・堕落した人類（茶） -->
  <g fill="#CF921C" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="208.5" cy="320.5" rx="34" ry="28"/>
    <ellipse cx="500.5" cy="320.5" rx="34" ry="28"/>
  </g>

  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="207" y="126.5" textLength="74" lengthAdjust="spacing">モーセ</text>
    <text x="330.5" y="126.5" textLength="74" lengthAdjust="spacing">モーセ</text>
    <text x="501.5" y="127" textLength="75" lengthAdjust="spacing">天使長</text>
    <text x="622" y="126.5" textLength="74" lengthAdjust="spacing">イエス</text>
    <text x="331.5" y="320.5" font-size="30">手</text>
    <text x="618.5" y="320.5" font-size="26" textLength="50" lengthAdjust="spacing">人類</text>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="208.5" y="320" font-size="30">手</text>
    <text x="499.5" y="320.5" font-size="26" textLength="50" lengthAdjust="spacing">人類</text>
  </g>

  <!-- 矢印の横の字 -->
  <g font-size="23" dominant-baseline="central">
    <text x="130" y="188.5" textLength="72" lengthAdjust="spacing">最初に</text>
    <text x="130" y="217.5" textLength="48" lengthAdjust="spacing">懐に</text>
    <text x="130" y="246.5" textLength="72" lengthAdjust="spacing">入れる</text>
    <text x="250" y="189" textLength="48" lengthAdjust="spacing">再び</text>
    <text x="250" y="217.5" textLength="48" lengthAdjust="spacing">懐に</text>
    <text x="250" y="246.5" textLength="72" lengthAdjust="spacing">入れる</text>
    <text x="514" y="187.5" textLength="72" lengthAdjust="spacing">エバを</text>
    <text x="514" y="216.5" textLength="48" lengthAdjust="spacing">懐に</text>
    <text x="514" y="245.5" textLength="44" lengthAdjust="spacing">抱く</text>
    <text x="634" y="188.5" textLength="48" lengthAdjust="spacing">聖霊</text>
    <text x="634" y="217.5" textLength="48" lengthAdjust="spacing">復帰</text>
  </g>

  <!-- 下の字 -->
  <g font-size="25" dominant-baseline="central">
    <text x="171" y="375.5" textLength="74" lengthAdjust="spacing">らい病</text>
    <text x="280" y="375.5" textLength="130" lengthAdjust="spacing">完全に快復</text>
    <text x="474" y="375.5" textLength="52" lengthAdjust="spacing">堕落</text>
    <text x="593" y="375.5" textLength="52" lengthAdjust="spacing">重生</text>
  </g>
</svg>
