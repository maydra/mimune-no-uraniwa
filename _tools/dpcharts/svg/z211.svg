<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>善悪の果は木の果実か（③食物 ④愛の神 ⑤アダム、エバ）　物質ではなく、生命以上の強力な刺激</title>

  <!-- 善悪の果 -->
  <g>
    <path d="M 295.0,80.3 C 303.8,71.8 314.0,67.9 325.7,67.9 C 349.1,67.9 369.1,87.4 369.1,121.5 C 369.1,152.7 357.8,181.1 340.3,195.3 C 334.5,201.7 325.7,205.9 314.0,205.9 C 306.7,206.7 300.9,209.5 295.0,209.5 C 287.7,209.5 281.9,205.9 274.6,205.9 C 267.3,205.9 261.5,204.5 254.2,198.1 C 235.2,183.9 223.5,155.5 223.5,124.3 C 223.5,93.1 238.1,71.8 260.0,71.2 C 273.1,70.8 284.8,73.2 295.0,80.3 Z" fill="#E8202A" stroke="#111" stroke-width="4.2" stroke-linejoin="round"/>
    <path d="M 293.6,80.3 C 292.9,66.1 289.2,53.3 280.4,43.4" fill="none" stroke="#111" stroke-width="6.6" stroke-linecap="round"/>
    <path d="M 293.6,80.3 C 292.9,66.1 289.2,53.3 280.4,43.4" fill="none" stroke="#8B5A2B" stroke-width="3.7" stroke-linecap="round"/>
    <path d="M 298.0,73.2 C 302.3,60.4 315.5,51.9 333.0,53.3 C 327.2,66.1 314.0,73.2 298.0,73.2 Z" fill="#4CAF50" stroke="#111" stroke-width="1.7" stroke-linejoin="round"/>
  </g>
  <text x="296.5" y="138" font-size="39" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="122" lengthAdjust="spacingAndGlyphs">善悪の果</text>

  <polygon points="424,132 462,132 462,118 498,139.5 462,161 462,146 424,146" fill="#8C949A" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>

  <rect x="548" y="100" width="322.5" height="79.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="579" y="140" font-size="53" dominant-baseline="central" fill="#111" textLength="271" lengthAdjust="spacing">木の果実？</text>

  <g font-size="46" dominant-baseline="central">
    <text y="271.5"><tspan x="256">③</tspan><tspan x="314" textLength="92" lengthAdjust="spacing">食物</tspan><tspan x="417.7">：</tspan><tspan x="451" textLength="277" lengthAdjust="spacing">原罪を遺伝？</tspan></text>
    <text y="361"><tspan x="256">④</tspan><tspan x="315" textLength="138" lengthAdjust="spacing">愛の神</tspan><tspan x="462.7">：</tspan><tspan x="498" textLength="322" lengthAdjust="spacing">死を伴う試み？</tspan></text>
    <text y="450"><tspan x="256">⑤</tspan><tspan x="317" textLength="138" lengthAdjust="spacing">アダム</tspan><tspan x="450.8">、</tspan><tspan x="498.5" textLength="92" lengthAdjust="spacing">エバ</tspan><tspan x="600.7">：</tspan><tspan x="635" textLength="415" lengthAdjust="spacing">死を覚悟してまでも</tspan></text>
    <text x="636" y="507" textLength="368" lengthAdjust="spacing">み言を犯したか？</text>
  </g>

  <rect x="244" y="569" width="837" height="78" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text y="607.5" font-size="46" dominant-baseline="central" fill="#111"><tspan x="273" textLength="275" lengthAdjust="spacing">物質ではなく</tspan><tspan x="546.8">、</tspan><tspan x="594" textLength="458" lengthAdjust="spacing">生命以上の強力な刺激</tspan></text>
</svg>
