<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神と被造世界に関する完全な認識</title>

  <!-- 神から神霊・真理へ、人間から霊人体・肉身への線（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="8.5">
    <line x1="438" y1="156.2" x2="600" y2="101.3"/>
    <line x1="700" y1="103.3" x2="852.5" y2="153.8"/>
    <line x1="463" y1="357.2" x2="590" y2="300"/>
    <line x1="705" y1="302.8" x2="860" y2="372.5"/>
  </g>

  <!-- 神霊・真理から下への矢印 -->
  <g stroke="currentColor" stroke-width="8">
    <line x1="382.5" y1="201" x2="382.5" y2="313"/>
    <line x1="910.5" y1="201" x2="910.5" y2="313"/>
  </g>
  <polygon points="370.5,311 394.5,311 382.5,333.5"/>
  <polygon points="898.5,311 922.5,311 910.5,333.5"/>

  <!-- 霊人体と肉身のあいだの矢印 -->
  <g stroke="currentColor" stroke-width="7">
    <line x1="514" y1="379" x2="770" y2="379"/>
    <line x1="528" y1="404.5" x2="784" y2="404.5"/>
  </g>
  <polygon points="768,368 768,390.5 784.5,379"/>
  <polygon points="529.5,393.5 529.5,415.5 513.5,404.5"/>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="649" cy="94.5" rx="98" ry="41.5" fill="#fff" class="paper"/>
    <ellipse cx="647.5" cy="298" rx="98" ry="41.5" fill="#FCE5E3"/>
    <ellipse cx="384" cy="389.5" rx="100" ry="40.5" fill="#F98AEE"/>
    <ellipse cx="913" cy="386" rx="98" ry="42" fill="#A0F08A"/>
  </g>

  <!-- 灰色の太い矢印 -->
  <polygon points="646,434 657.5,434 657.5,511 668.5,511 651.75,536 635,511 646,511" fill="#8C949A"/>

  <rect x="278.5" y="553.5" width="743" height="78" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="647" y="95" font-size="56">神</text>
    <text x="379" y="167.5" font-size="49">神霊</text>
    <text x="910.5" y="164" font-size="49">真理</text>
    <g fill="#111">
      <text x="647.5" y="298" font-size="50" textLength="122" lengthAdjust="spacing">人間</text>
      <text x="385" y="389" font-size="51">霊人体</text>
      <text x="914" y="385.5" font-size="51" textLength="121" lengthAdjust="spacing">肉身</text>
      <text x="649" y="595" font-size="45.5" textLength="690" lengthAdjust="spacing">神と被造世界に関する完全な認識</text>
    </g>
    <g font-weight="400">
      <text x="286" y="260" font-size="39">霊的五官</text>
      <text x="385.5" y="468.5" font-size="45.5">霊的に認識</text>
      <text x="917" y="468" font-size="45.5">生理的に認識</text>
    </g>
  </g>
  <g font-size="39" font-weight="400" dominant-baseline="central">
    <text x="929" y="237">生理的な</text>
    <text x="929" y="283">感覚器官</text>
  </g>
</svg>
