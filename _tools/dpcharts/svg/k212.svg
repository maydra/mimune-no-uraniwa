<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>サタン屈伏の典型的路程</title>

  <!-- 題の箱 -->
  <rect x="210.5" y="14" width="405" height="49.5" rx="7" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="412" y="39" font-size="31.5" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="347" lengthAdjust="spacing">サタン屈伏の典型的路程</text>

  <!-- 大きい箱 -->
  <rect x="187" y="86.5" width="450.5" height="331.5" rx="10" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>

  <!-- 下向きの矢印 -->
  <g fill="#8C949A">
    <polygon points="379.5,144 387.5,144 387.5,158.5 394.5,158.5 383.5,172 372.5,158.5 379.5,158.5"/>
    <polygon points="379.5,217 387.5,217 387.5,233.5 394.5,233.5 383.5,247 372.5,233.5 379.5,233.5"/>
    <polygon points="379.5,291 387.5,291 387.5,307.5 394.5,307.5 383.5,321 372.5,307.5 379.5,307.5"/>
  </g>

  <g font-size="29" dominant-baseline="central">
    <text x="223.5" y="119.5" textLength="146" lengthAdjust="spacing">ヤコブ路程</text>
    <text x="223.5" y="194.5" textLength="146" lengthAdjust="spacing">モーセ路程</text>
    <text x="223" y="271" textLength="147" lengthAdjust="spacing">イエス路程</text>
    <text x="397" y="119.5" textLength="147" lengthAdjust="spacing">象徴的路程</text>
    <text x="397" y="194.5" textLength="147" lengthAdjust="spacing">形象的路程</text>
    <text x="397" y="271" textLength="147" lengthAdjust="spacing">実体的路程</text>
    <g text-anchor="middle">
      <text x="383.5" y="119.5">：</text>
      <text x="383.5" y="194.5">：</text>
      <text x="383.5" y="271">：</text>
    </g>
    <text x="223" y="343.5" textLength="348" lengthAdjust="spacing">イスラエル民族と全人類が</text>
    <text x="223" y="383" font-size="28" textLength="388" lengthAdjust="spacing">歩まなければならない表示路程</text>
  </g>
</svg>
