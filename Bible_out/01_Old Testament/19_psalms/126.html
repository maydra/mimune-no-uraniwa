<h1>詩篇 第126章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>主がシオンの繁栄を回復されたとき、われらは夢みる者のようであった。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>その時われらの口は笑いで満たされ、われらの舌は喜びの声で満たされた。その時「主は彼らのために大いなる事をなされた」と言った者が、もろもろの国民の中にあった。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>主はわれらのために大いなる事をなされたので、われらは喜んだ。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>主よ、どうか、われらの繁栄を、ネゲブの川のように回復してください。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>涙をもって種まく者は、喜びの声をもって刈り取る。</p>
<p id="v6"><sup><a href="#v6" class="verse-link">6</a></sup>種を携え、涙を流して出て行く者は、束を携え、喜びの声をあげて帰ってくるであろう。</p>
