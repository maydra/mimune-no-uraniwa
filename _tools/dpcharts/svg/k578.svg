<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ユダヤ民族捕虜および帰還時代と法王捕虜および帰還時代　ペルシャからユダヤへ三次帰還、南フランスからローマへ</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="128.5" y="26.5" width="276" height="66" rx="5"/>
    <rect x="415" y="26.5" width="276" height="66" rx="5"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="266.5" y="45" textLength="181" lengthAdjust="spacing">ユダヤ民族捕虜</text>
    <text x="267" y="75.5" textLength="182" lengthAdjust="spacing">および帰還時代</text>
    <text x="553" y="45.5" textLength="104" lengthAdjust="spacing">法王捕虜</text>
    <text x="554" y="75.5" textLength="182" lengthAdjust="spacing">および帰還時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="129" y="103" width="276" height="302" rx="6"/>
    <rect x="415.5" y="103" width="276" height="302" rx="6"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="153" cy="136" r="10.3"/>
    <circle cx="440" cy="135" r="10.3"/>
  </g>
  <g font-size="17" text-anchor="middle" dominant-baseline="central">
    <text x="153" y="136.5">1</text>
    <text x="440" y="135.5">2</text>
  </g>

  <!-- 帰還の矢印 -->
  <g fill="#8C949A">
    <polygon points="306,221.5 249,221.5 249,218 237,224.5 249,231 249,227.5 306,227.5"/>
    <polygon points="595,222 541,222 541,218.5 529,225 541,231.5 541,228 595,228"/>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central">
    <text x="266.5" y="155.5" textLength="45" lengthAdjust="spacing">三次</text>
    <text x="267" y="184" textLength="46" lengthAdjust="spacing">帰還</text>
  </g>

  <!-- 縦長の楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="199" cy="224.5" rx="30" ry="56.5" fill="#DCC4C4"/>
    <ellipse cx="335.5" cy="224.5" rx="30" ry="56.5" fill="#CF921C"/>
    <ellipse cx="489" cy="225.5" rx="30" ry="56.5" fill="#DCC4C4"/>
    <ellipse cx="624.5" cy="226" rx="30" ry="57" fill="#CF921C"/>
  </g>
  <g font-size="25" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="199" y="198">ユ</text>
    <text x="199" y="224">ダ</text>
    <text x="199" y="250.5">ヤ</text>
    <text x="335.5" y="185">ペ</text>
    <text x="335.5" y="211.5">ル</text>
    <text x="335.5" y="238.5">シ</text>
    <text x="339" y="261">ャ</text>
    <text x="489" y="200">ロ</text>
    <text x="489" y="253">マ</text>
  </g>
  <line x1="489" y1="215" x2="489" y2="237" stroke="#111" stroke-width="2.6"/>
  <g font-size="21" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="624.5" y="186">南</text>
    <text x="624.5" y="206.5">フ</text>
    <text x="624.5" y="226.5">ラ</text>
    <text x="624.5" y="246.5">ン</text>
    <text x="624.5" y="266.5">ス</text>
  </g>

  <!-- 下の字 -->
  <g font-size="24" dominant-baseline="central">
    <text x="160" y="307.5" textLength="76" lengthAdjust="spacingAndGlyphs">マラキ</text>
    <text x="282" y="307.5" textLength="103" lengthAdjust="spacingAndGlyphs">クロス王</text>
    <text x="217" y="355.5" font-size="25" textLength="37" lengthAdjust="spacingAndGlyphs">140</text>
    <text x="262" y="355.5" font-size="25" textLength="50" lengthAdjust="spacing">年間</text>
    <text x="488" y="309" font-size="26" textLength="131" lengthAdjust="spacing">法王権復帰</text>
    <text x="506" y="345.5" font-size="25" textLength="37" lengthAdjust="spacingAndGlyphs">140</text>
    <text x="551" y="345.5" font-size="25" textLength="49" lengthAdjust="spacing">年間</text>
  </g>
  <text y="376" font-size="21" text-anchor="middle" dominant-baseline="central"><tspan x="509.5">（</tspan><tspan x="526.5">〜</tspan><tspan x="568" textLength="42" lengthAdjust="spacingAndGlyphs">1517</tspan><tspan x="595.5">）</tspan></text>
</svg>
