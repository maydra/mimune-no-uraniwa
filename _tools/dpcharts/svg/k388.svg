<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>サタンはいかにしてイエスを試練する主体に立つようになったのであろうか</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="33" y="37.5" textLength="481" lengthAdjust="spacing">サタンはいかにしてイエスを試練する</text>
    <text x="298" y="75.5" textLength="482" lengthAdjust="spacing">主体に立つようになったのであろうか</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="33" y1="56.5" x2="515" y2="56.5"/>
    <line x1="298" y1="94.5" x2="779" y2="94.5"/>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="258,182 272,182 272,176 285.5,185.5 272,195 272,189 258,189"/>
    <polygon points="460,181.5 474,181.5 474,176 487,185 474,194.5 474,188.5 460,188.5"/>
    <polygon points="258,305 272,305 272,299 285.5,308.5 272,318 272,312 258,312"/>
    <polygon points="459,310 474,310 474,304 487,313.5 474,323 474,317 459,317"/>
  </g>

  <!-- モーセ・洗礼ヨハネ -->
  <g stroke="currentColor" stroke-width="2.4" fill="#F8F28F">
    <ellipse cx="191.5" cy="186" rx="54.3" ry="27.8"/>
    <ellipse cx="186.5" cy="309" rx="65.3" ry="26.8"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="192.5" y="185.5" font-size="29" textLength="92" lengthAdjust="spacing">モーセ</text>
    <text x="187" y="311.5" font-size="24" textLength="116" lengthAdjust="spacing">洗礼ヨハネ</text>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central">
    <text x="187.5" y="233.5" textLength="51" lengthAdjust="spacing">失敗</text>
    <text x="191.5" y="352.5" font-size="23" textLength="147" lengthAdjust="spacingAndGlyphs">責任完遂できず</text>
  </g>

  <!-- 箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3">
    <rect x="291.5" y="149.5" width="162" height="74"/>
    <rect x="492.5" y="148.5" width="199" height="75"/>
    <rect x="289.5" y="275.5" width="163" height="74"/>
    <rect x="491.5" y="274.5" width="199" height="75"/>
  </g>
  <g font-size="21" dominant-baseline="central">
    <text x="300" y="171" textLength="143" lengthAdjust="spacingAndGlyphs">二つの石板、磐石</text>
    <text x="300" y="204" textLength="125" lengthAdjust="spacing">サタンが取る</text>
    <text x="503" y="170.5" textLength="180" lengthAdjust="spacingAndGlyphs">サタンがイスラエルの</text>
    <text x="503" y="202.5" font-size="23" textLength="142" lengthAdjust="spacing">主体的な立場</text>
    <text x="300" y="294.5" font-size="22" textLength="70" lengthAdjust="spacing">民族が</text>
    <text x="300" y="327.5" textLength="140" lengthAdjust="spacing">不信仰、不従順</text>
    <text x="500" y="295.5" textLength="180" lengthAdjust="spacingAndGlyphs">サタンがイエス試練</text>
    <text x="500" y="327.5" textLength="127" lengthAdjust="spacing">主体的な立場</text>
  </g>
</svg>
