<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 創造原理の絶対性と完全無欠性のために</title>

  <text x="52" y="77" font-size="50">Ⅰ.</text>
  <text x="126.5" y="76" font-size="49" textLength="827" lengthAdjust="spacing">創造原理の絶対性と完全無欠性のために</text>
  <line x1="126" y1="87.5" x2="954" y2="87.5" stroke="currentColor" stroke-width="4"/>

