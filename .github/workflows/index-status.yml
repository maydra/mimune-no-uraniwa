# 毎日、調べてから6日以上たったページが Google に載っているかを Search Console の URL 検査で調べ、
# _tools/seo/index-status.md（本ごとの一覧）と index-status.json を書き直して commit する。
# URL 検査は1日 2,000 件までで、上限は太平洋時間の0時（日本時間の16〜17時）に戻るので、その後に回す。
# 1日 500 件ほどで、1週間に全ページを一回りする（_tools/root/search_console.py）。
# 鍵は secret の GSC_KEY（サービスアカウントの JSON の中身）。無ければ何もしない。
name: index-status

on:
  schedule:
    - cron: '0 9 * * *'  # 日本時間 毎日18時
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-status
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: inspect
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
        run: |
          if [ -z "$GSC_KEY" ]; then
            echo 'secret GSC_KEY がないので調べない'
            exit 0
          fi
          pip install -q google-auth requests
          python _tools/root/search_console.py inspect --limit 1800 --max-age 6
      - name: commit if changed
        run: |
          git add -A -- _tools/seo
          if git diff --cached --quiet; then
            echo 'nothing new'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index status: inspect pages in Search Console'
          git pull --rebase origin main
          git push origin HEAD:main
