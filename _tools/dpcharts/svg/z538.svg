<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>再臨者の協助と輪廻転生説</title>

  <!-- 霊人体と肉身の組（左は洗礼ヨハネ、中は地上人。中は左を 316 右へずらした形） -->
  <g>
    <!-- 地上の線（楕円より先に描く） -->
    <line x1="227" y1="320" x2="514" y2="320" stroke="currentColor" stroke-width="4"/>

    <!-- 協助の矢印 -->
    <g stroke="currentColor" stroke-width="6" fill="none">
      <line x1="307" y1="135" x2="362" y2="174.5"/>
      <line x1="356" y1="205.5" x2="300" y2="165.5"/>
    </g>
    <g fill="currentColor">
      <polygon points="372.5,182.5 366,168.5 357.5,180"/>
      <polygon points="289,157 304.5,160 296,171.5"/>
    </g>

    <g stroke="currentColor" stroke-width="4.5">
      <ellipse cx="423.75" cy="234" rx="48.75" ry="84.5" fill="#F98AEE"/>
      <ellipse cx="423.75" cy="403.75" rx="48.75" ry="84.25" fill="#A0F08A"/>
    </g>
    <g font-size="45" text-anchor="middle" dominant-baseline="central" fill="#111">
      <text x="424" y="187.5">霊</text>
      <text x="424" y="233.5">人</text>
      <text x="424" y="279.5">体</text>
    </g>

    <!-- 霊人体と肉身の授受の矢印 -->
    <g stroke="currentColor" stroke-width="5.5" fill="none">
      <path d="M374.5,342.5 Q357.9,320.5 369.75,301.25"/>
      <path d="M472.5,288 Q489.1,310 477.25,329.25"/>
    </g>
    <g fill="currentColor">
      <polygon points="377,289.5 363.9,297.65 375.6,304.85"/>
      <polygon points="470,341 483.1,332.85 471.4,325.65"/>
    </g>
  </g>
  <g transform="translate(316,0)">
    <line x1="227" y1="320" x2="514" y2="320" stroke="currentColor" stroke-width="4"/>
    <g stroke="currentColor" stroke-width="6" fill="none">
      <line x1="307" y1="135" x2="362" y2="174.5"/>
      <line x1="356" y1="205.5" x2="300" y2="165.5"/>
    </g>
    <g fill="currentColor">
      <polygon points="372.5,182.5 366,168.5 357.5,180"/>
      <polygon points="289,157 304.5,160 296,171.5"/>
    </g>
    <g stroke="currentColor" stroke-width="4.5">
      <ellipse cx="423.75" cy="234" rx="48.75" ry="84.5" fill="#F98AEE"/>
      <ellipse cx="423.75" cy="403.75" rx="48.75" ry="84.25" fill="#A0F08A"/>
    </g>
    <g font-size="45" text-anchor="middle" dominant-baseline="central" fill="#111">
      <text x="424" y="188">霊</text>
      <text x="424" y="233.5">人</text>
      <text x="424" y="279.5">体</text>
    </g>
    <g stroke="currentColor" stroke-width="5.5" fill="none">
      <path d="M374.5,342.5 Q357.9,320.5 369.75,301.25"/>
      <path d="M472.5,288 Q489.1,310 477.25,329.25"/>
    </g>
    <g fill="currentColor">
      <polygon points="377,289.5 363.9,297.65 375.6,304.85"/>
      <polygon points="470,341 483.1,332.85 471.4,325.65"/>
    </g>
  </g>

  <!-- 肉身の字（左と中で高さが少し違う） -->
  <g font-size="45" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="424" y="379">肉</text>
    <text x="424" y="428">身</text>
    <text x="740.5" y="375.5">肉</text>
    <text x="740.5" y="425">身</text>
  </g>

  <!-- エリヤと霊人 -->
  <g stroke="currentColor" stroke-width="4.5" fill="#F98AEE">
    <ellipse cx="245" cy="113" rx="40.5" ry="70"/>
    <ellipse cx="561" cy="113" rx="40.5" ry="70"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="38">
      <text x="245" y="76">エ</text>
      <text x="244.5" y="113.5">リ</text>
      <text x="244.5" y="150.5">ヤ</text>
    </g>
    <g font-size="45">
      <text x="561" y="90.5">霊</text>
      <text x="561" y="136">人</text>
    </g>
  </g>

  <g font-size="43" text-anchor="middle" dominant-baseline="central">
    <text x="380" y="121.5" textLength="86" lengthAdjust="spacing">協助</text>
    <text x="698" y="119.5" textLength="86" lengthAdjust="spacing">協助</text>
  </g>
  <g font-size="42" text-anchor="middle" dominant-baseline="central">
    <text x="423" y="523.5" textLength="206" lengthAdjust="spacingAndGlyphs">洗礼ヨハネ</text>
    <text x="739.5" y="524" textLength="124" lengthAdjust="spacingAndGlyphs">地上人</text>
    <text x="974" y="218" textLength="124" lengthAdjust="spacingAndGlyphs">再臨者</text>
  </g>

  <!-- 再臨者の一覧 -->
  <rect x="857" y="249.5" width="247.5" height="252.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <circle cx="882" cy="289" r="10"/>
  <circle cx="882" cy="347.5" r="10"/>
  <circle cx="882" cy="406.5" r="10"/>
  <circle cx="882" cy="464.5" r="10"/>
  <g font-size="37" dominant-baseline="central">
    <text x="899" y="288.5" textLength="190" lengthAdjust="spacingAndGlyphs">再臨のイエス</text>
    <text x="900" y="347.5" textLength="112" lengthAdjust="spacing">弥勒仏</text>
    <text x="900" y="405.5" textLength="74" lengthAdjust="spacing">釈迦</text>
    <text x="900" y="464" textLength="74" lengthAdjust="spacing">孔子</text>
  </g>

  <rect x="227.5" y="577.5" width="846.5" height="70" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="41" dominant-baseline="central" fill="#111">
    <text x="257" y="612.5" textLength="187" lengthAdjust="spacingAndGlyphs">輪廻転生説</text>
    <text x="462.5" y="612.5" text-anchor="middle">：</text>
    <text x="482" y="612.5" textLength="297" lengthAdjust="spacingAndGlyphs">原理を知らないで</text>
    <text x="780" y="612.5">、</text>
    <text x="819" y="612.5" textLength="225" lengthAdjust="spacingAndGlyphs">結果だけ判断</text>
  </g>
</svg>
