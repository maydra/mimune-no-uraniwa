<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスの証言：洗礼ヨハネはエリヤ</title>

  <!-- 矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="492,223.5 733.5,223.5 733.5,233.5 759.5,217.5 733.5,201.5 733.5,211.5 492,211.5"/>
    <polygon points="635.5,505 635.5,270.5 646,270.5 629.5,237 613,270.5 623.5,270.5 623.5,505"/>
  </g>
  <!-- × -->
  <path d="M592,328.5 L668.5,395.5 M665.5,328.5 L593.5,395.5" stroke="currentColor" stroke-width="9"/>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="317" cy="218" rx="122" ry="66" fill="#F8F28F"/>
    <ellipse cx="952" cy="218" rx="146" ry="66" fill="#F86D42"/>
    <ellipse cx="626" cy="561.5" rx="141" ry="60" fill="#FCE5E3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="317" y="218" font-size="48" textLength="144" lengthAdjust="spacing">イエス</text>
    <text x="952" y="218" font-size="49" textLength="245" lengthAdjust="spacing">洗礼ヨハネ</text>
    <text x="626" y="561" font-size="48" textLength="194" lengthAdjust="spacing">ユダヤ人</text>
  </g>

  <g dominant-baseline="central">
    <text x="464" y="101" font-size="41" textLength="332" lengthAdjust="spacingAndGlyphs">(マタイ 11:14、17:13)</text>
    <text x="582" y="173" font-size="46" textLength="96" lengthAdjust="spacing">証言</text>
    <text x="223" y="329" font-size="45" textLength="169" lengthAdjust="spacing">(メシヤ)</text>
    <text x="860" y="329" font-size="45" textLength="169" lengthAdjust="spacing">(エリヤ)</text>
  </g>
</svg>
