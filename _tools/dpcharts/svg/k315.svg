<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ロ 幕屋のための基台</title>

  <!-- 題 -->
  <circle cx="48.5" cy="36.5" r="13.8" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <text x="48.5" y="37" font-size="21" text-anchor="middle" dominant-baseline="central">ロ</text>
  <text x="73" y="36.5" font-size="31" dominant-baseline="central" textLength="251" lengthAdjust="spacing">幕屋のための基台</text>
  <line x1="73" y1="56" x2="324" y2="56" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="179.5,146 186.5,158.5 182.3,158.5 182.3,300 176.7,300 176.7,158.5 172.5,158.5"/>
    <polygon points="235.5,324 248.5,316.5 248.5,321.6 556,321.6 556,326.6 248.5,326.6 248.5,331.5"/>
  </g>

  <!-- 神 -->
  <circle cx="180" cy="110" r="31.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="179.5" y="110" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 信仰基台 -->
  <rect x="227.5" y="164.5" width="77" height="70" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="265" y="185.5" textLength="55" lengthAdjust="spacing">信仰</text>
    <text x="265" y="214.5" textLength="51" lengthAdjust="spacing">基台</text>
  </g>
  <path d="M340.5,158 H325 V242 H340.5 M305,199.5 H340.5" fill="none" stroke="#8C949A" stroke-width="5"/>
  <g font-size="28" dominant-baseline="central">
    <text x="351" y="159" textLength="113" lengthAdjust="spacing">中心人物</text>
    <text x="495" y="159" textLength="84" lengthAdjust="spacing">モーセ</text>
    <text x="350" y="198" textLength="114" lengthAdjust="spacing">条件物</text>
    <text x="494" y="198" textLength="115" lengthAdjust="spacing">神のみ言</text>
    <text x="350" y="238" textLength="113" lengthAdjust="spacing">蕩減期間</text>
    <text x="494.5" y="238" textLength="140" lengthAdjust="spacing">断食の祈り</text>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="479" y="159">：</text>
    <text x="479" y="198">：</text>
    <text x="479" y="238">：</text>
  </g>

  <!-- 実体基台 -->
  <rect x="336.5" y="272.5" width="142" height="39.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <text x="351" y="291" font-size="28" font-weight="400" dominant-baseline="central" textLength="113" lengthAdjust="spacing">実体基台</text>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="179" cy="324.5" rx="50.5" ry="24" fill="#F8F28F"/>
    <ellipse cx="624.5" cy="324" rx="69" ry="35.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="179" y="325" font-size="27" textLength="78" lengthAdjust="spacing">モーセ</text>
    <text x="626" y="311" font-size="26" textLength="120" lengthAdjust="spacing">イスラエル</text>
    <text x="626.5" y="340" font-size="26" textLength="61" lengthAdjust="spacing">民族</text>
  </g>

  <!-- 下の字 -->
  <text x="225" y="362" font-size="26" dominant-baseline="central" textLength="342" lengthAdjust="spacing">堕落性を脱ぐための蕩減条件</text>
  <circle cx="351.5" cy="396" r="6.8"/>
  <text x="366" y="396" font-size="26" dominant-baseline="central" textLength="105" lengthAdjust="spacing">従順屈伏</text>
</svg>
