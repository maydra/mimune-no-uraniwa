<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(2) 霊的な実体基台</title>

  <text x="44" y="37.5" font-size="30" dominant-baseline="central" textLength="55" lengthAdjust="spacingAndGlyphs">(2)</text>
  <text x="108" y="37.5" font-size="30" dominant-baseline="central" textLength="219" lengthAdjust="spacing">霊的な実体基台</text>
  <line x1="107" y1="56" x2="328" y2="56" stroke="currentColor" stroke-width="2.4"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="197,141.5 205.5,154.5 200.5,154.5 200.5,184 193.5,184 193.5,154.5 188.5,154.5"/>
    <polygon points="269.5,221.7 282,213.8 282,218.6 548,218.6 548,225.4 282,225.4 282,229.6"/>
    <polygon points="401,334.5 411,334.5 411,341.5 420.5,341.5 406.5,354.5 392.5,341.5 401,341.5"/>
  </g>

  <!-- 神 -->
  <circle cx="197" cy="105" r="31.7" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="196" y="106" font-size="35" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 実体基台 -->
  <rect x="342.3" y="167.3" width="125" height="41" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <text x="405" y="187.5" font-size="26" text-anchor="middle" dominant-baseline="central" font-weight="400" textLength="101" lengthAdjust="spacing">実体基台</text>

  <!-- 復活イエス・信徒 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="197" cy="221.5" rx="67.7" ry="37.2" fill="#F8F28F"/>
    <ellipse cx="619.5" cy="221.5" rx="72.2" ry="37.2" fill="#F86D42"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="195" y="206.5">復活</text>
    <text x="195" y="238" textLength="75" lengthAdjust="spacingAndGlyphs">イエス</text>
    <text x="597" y="222">信</text>
    <text x="642" y="222">徒</text>
  </g>

  <!-- 霊的（アベルの位置） -->
  <text x="197" y="283" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="49" lengthAdjust="spacing">霊的</text>
  <text x="197.5" y="309" font-size="20" text-anchor="middle" dominant-baseline="central" textLength="127" lengthAdjust="spacingAndGlyphs">（アベルの位置）</text>

  <!-- 出発のための摂理：○ -->
  <rect x="262.5" y="251.5" width="291" height="39.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="280" y="271.5" textLength="206" lengthAdjust="spacing">出発のための摂理</text>
    <text x="500.5" y="271.5" text-anchor="middle">：</text>
  </g>
  <circle cx="525.5" cy="270.5" r="10" fill="none" stroke="#111" stroke-width="3.2"/>

  <text x="406" y="313.5" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="150" lengthAdjust="spacingAndGlyphs">（奇跡の権威）</text>

  <!-- 霊的実体基台：○ -->
  <rect x="277.5" y="361.5" width="262" height="43" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="293" y="383.5" textLength="172" lengthAdjust="spacing">霊的実体基台</text>
    <text x="481" y="383.5" text-anchor="middle">：</text>
  </g>
  <circle cx="508.5" cy="383" r="10" fill="none" stroke="#111" stroke-width="3.2"/>
</svg>
