<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神と被造世界の二性性相的な関係</title>

  <text x="52" y="75" font-size="48" textLength="748" lengthAdjust="spacing">神と被造世界の二性性相的な関係</text>
  <line x1="52" y1="86" x2="802" y2="86" stroke="currentColor" stroke-width="3.5"/>

  <!-- 神 -->
  <ellipse cx="370.5" cy="190" rx="87" ry="73" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="369" y="190" font-size="68" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 上下の矢印 -->
  <g fill="#8C949A">
    <polygon points="348.5,282 361,307 353.5,307 353.5,391 343.5,391 343.5,307 336,307"/>
    <polygon points="392.5,391 405,366 397.5,366 397.5,281 387.5,281 387.5,366 380,366"/>
  </g>

  <!-- 完成された被造世界 -->
  <ellipse cx="374.5" cy="492.5" rx="134" ry="79" fill="#DCC4C4" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="42" dominant-baseline="central" fill="#111">
    <text x="271" y="468" textLength="210" lengthAdjust="spacing">完成された</text>
    <text x="290" y="527" textLength="172" lengthAdjust="spacing">被造世界</text>
  </g>
  <text x="410" y="622" font-size="54" text-anchor="middle" dominant-baseline="central">完全な有機体</text>

  <!-- 右の説明 -->
  <g font-size="50" dominant-baseline="central">
    <text x="544" y="152">性相的</text>
    <text x="719" y="152" text-anchor="middle">：</text>
    <text x="744" y="152">主体</text>
    <text x="544" y="215">男性格</text>
    <text x="544" y="454">形状的</text>
    <text x="719" y="454" text-anchor="middle">：</text>
    <text x="744" y="454">対象</text>
    <text x="544" y="517">女性格</text>
  </g>
  <text x="846" y="153" font-size="30" dominant-baseline="central">(コリントⅠ11:7)</text>

  <rect x="552" y="256" width="341" height="73" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g font-size="50" dominant-baseline="central">
    <text x="572" y="292">神の格位</text>
    <text x="796.5" y="292" text-anchor="middle">：</text>
    <text x="821" y="292">父</text>
  </g>
</svg>
