<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>裸を恥ずかしく思ったのが罪となった理由</title>
  <defs>
    <marker id="k125-a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 題 -->
  <text x="36" y="39" font-size="28" textLength="536" lengthAdjust="spacing" dominant-baseline="central">裸を恥ずかしく思ったのが罪となった理由</text>
  <line x1="35" y1="58.5" x2="573" y2="58.5" stroke="currentColor" stroke-width="2.5"/>

  <!-- サタンと存在の授受 -->
  <g stroke="currentColor" stroke-width="4.4" fill="none" marker-end="url(#k125-a)">
    <path d="M341,100 Q405,76 461,98"/>
    <path d="M468,119 Q405,140 347,121"/>
  </g>
  <ellipse cx="276" cy="110.5" rx="47" ry="34.5" fill="#50403D" stroke="currentColor" stroke-width="2.2"/>
  <text x="276" y="110.5" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>
  <ellipse cx="537" cy="111" rx="48" ry="36" fill="#FCE5E3" stroke="currentColor" stroke-width="2.2"/>
  <text x="537" y="110.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">存在</text>

  <!-- 罪が成立するまで -->
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="408.5" y="185" font-size="26" textLength="315" lengthAdjust="spacing">サタンが侵入できる条件</text>
    <text x="408" y="249" textLength="170" lengthAdjust="spacing">サタンの相対</text>
    <text x="407.5" y="311" textLength="169" lengthAdjust="spacing">サタンが活動</text>
  </g>
  <g fill="#8C949A">
    <polygon points="399,209 417,209 417,216 429,216 407.5,224.5 386,216 399,216"/>
    <polygon points="399,273 417,273 417,280 429,280 407.5,288.5 386,280 399,280"/>
    <polygon points="399,334 417,334 417,341 429,341 407.5,349.5 386,341 399,341"/>
  </g>
  <rect x="312.5" y="359.5" width="196" height="49" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="409" y="383.5" font-size="32" text-anchor="middle" dominant-baseline="central" fill="#111">罪が成立</text>
</svg>
