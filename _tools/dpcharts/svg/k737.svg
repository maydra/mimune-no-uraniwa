<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <!-- 元の矢印の字は「世界的に超える」。本文と同じ「越える」に直した（2026-10-31、ユーザー「誤表記は直そう」） -->
  <title>② イエスの第一次試練を世界的に越えさせる</title>

  <!-- 題 -->
  <g dominant-baseline="central" font-size="26">
    <text x="46" y="35" text-anchor="middle">②</text>
    <text x="69" y="35" textLength="496" lengthAdjust="spacing">イエスの第一次試練を世界的に越えさせる</text>
  </g>
  <line x1="68" y1="52" x2="566" y2="52" stroke="currentColor" stroke-width="2.5"/>

  <!-- 灰色の矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="231.5,159 231.5,219.5 238.5,219.5 227.5,238.5 216.5,219.5 223.5,219.5 223.5,159"/>
    <polygon points="552.5,160 552.5,219.5 560,219.5 548.5,238.5 537,219.5 544.5,219.5 544.5,160"/>
    <polygon points="275,193.5 488,193.5 488,187.5 504,196 488,204.5 488,198.5 275,198.5"/>
    <polygon points="541,331 555,331 555,340 567,340 548,349.5 529,340 541,340"/>
  </g>

  <!-- イエス・天の側地上人 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="228" cy="121" rx="53" ry="36" fill="#F8F28F"/>
    <ellipse cx="550" cy="121" rx="65" ry="38" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="227" y="121" font-size="27" textLength="85" lengthAdjust="spacing">イエス</text>
    <text x="550.5" y="106" font-size="26" textLength="78" lengthAdjust="spacing">天の側</text>
    <text x="550.5" y="134.5" font-size="26" textLength="78" lengthAdjust="spacing">地上人</text>
  </g>

  <!-- 箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="156.5" y="243.5" width="143" height="45"/>
    <rect x="432.5" y="242.5" width="233" height="45"/>
    <rect x="461.5" y="357.5" width="176" height="44"/>
  </g>
  <g font-size="28.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="227.5" y="267" textLength="116" lengthAdjust="spacing">第一試練</text>
    <text x="548.5" y="265.5" textLength="202" lengthAdjust="spacing">第一次世界大戦</text>
    <text x="548.5" y="378" textLength="144" lengthAdjust="spacing">再臨主誕生</text>
  </g>

  <!-- 地の上の字 -->
  <g font-size="26" dominant-baseline="central">
    <text x="386" y="175" text-anchor="middle" textLength="183" lengthAdjust="spacing">世界的に越える</text>
    <text x="141" y="314" textLength="52" lengthAdjust="spacing">勝利</text>
    <text x="206.5" y="314" text-anchor="middle">：</text>
    <text x="221" y="314" textLength="105" lengthAdjust="spacing">個性復帰</text>
    <text x="221" y="349" textLength="105" lengthAdjust="spacing">基台造成</text>
    <text x="549" y="309" text-anchor="middle" textLength="157" lengthAdjust="spacing">第一祝福復帰</text>
  </g>
</svg>
