    <text x="324" y="138.5" textLength="140" lengthAdjust="spacing">アマレクと</text>
    <text x="323" y="175.5" textLength="114" lengthAdjust="spacing">戦い勝利</text>
    <text x="521" y="59" textLength="142" lengthAdjust="spacing">永遠の命に</text>
