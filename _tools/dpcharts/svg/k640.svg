<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>中世社会：摂理の目的成就できなくなる　文芸復興・宗教改革　再臨のメシヤのための基台</title>

  <!-- 灰色の矢印（楕円の下に描く） -->
  <polygon points="303.5,140 313.5,140 313.5,314 319,314 308.5,331 298,314 303.5,314" fill="#8C949A"/>

  <!-- 枝分かれの線（楕円の下に描く） -->
  <polyline points="404,199.5 320,234 409,266" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linejoin="round"/>

  <!-- 中世社会 -->
  <ellipse cx="308.5" cy="93.5" rx="79" ry="45" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="310" y="94" font-size="31" text-anchor="middle" dominant-baseline="central" textLength="125" lengthAdjust="spacing">中世社会</text>

  <g dominant-baseline="central">
    <text x="403" y="91.5" font-size="27" text-anchor="middle">：</text>
    <text x="416" y="92" font-size="26.5" textLength="132.5" lengthAdjust="spacing">摂理の目的</text>
    <text x="426" y="127.5" font-size="28" textLength="230" lengthAdjust="spacing">成就できなくなる</text>
  </g>

  <!-- 文芸復興と宗教改革 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="489.5" cy="196" rx="89" ry="29.5" fill="#F86D42"/>
    <ellipse cx="493" cy="269.5" rx="86.5" ry="29" fill="#F8F28F"/>
  </g>
  <g font-size="34" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="493" y="196" textLength="137" lengthAdjust="spacing">文芸復興</text>
    <text x="493.5" y="270" textLength="137" lengthAdjust="spacing">宗教改革</text>
  </g>

  <!-- 再臨のメシヤのための基台 -->
  <rect x="201" y="342" width="392" height="59" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="396" y="372" font-size="29.5" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="360" lengthAdjust="spacing">再臨のメシヤのための基台</text>
</svg>
