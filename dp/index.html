<html lang="ja">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="原理講論 目次">
  <meta property="og:description" content="原理講論の目次ページ">
  <meta property="og:image" content="https://maydra.github.io/mimune-no-uraniwa/og-image.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700;900&family=Crimson+Pro:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif JP', 'Crimson Pro', serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
      font-size: 1.25rem;
      line-height: 1.9;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInDown 0.8s ease-out;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
      text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin-bottom: 1rem;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
      border-color: rgba(102, 126, 234, 0.5);
    }

    .random-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(102, 126, 234, 0.4);
      border-radius: 50px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      margin-top: 1rem;
    }

    .random-link:hover {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    .content-section {
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .section-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .section-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }

    .section-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(102, 126, 234, 0.3);
      box-shadow: 0 12px 40px rgba(102, 126, 234, 0.2);
    }

    .section-card:hover::before {
      transform: scaleX(1);
    }

    h2 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      letter-spacing: 0.05em;
    }

    h2::before {
      content: '◆';
      color: #667eea;
      font-size: 0.8em;
    }

    .intro-card {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
      border: 1px solid rgba(102, 126, 234, 0.3);
    }

    .intro-card h2 {
      background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .chapter {
      position: relative;
      padding-left: 1.6rem;
    }

    .chapter::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: #667eea;
      transition: transform 0.3s ease;
    }

    .chapter:hover::before {
      transform: translateX(3px);
    }

    .chapter a {
      color: #e0e0e0;
      text-decoration: none;
      font-size: 1.25rem;
      line-height: 1.9;
      transition: all 0.3s ease;
      display: inline-block;
      position: relative;
    }

    .chapter a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }

    .chapter a:hover {
      color: #fff;
      transform: translateX(3px);
    }

    .chapter a:hover::after {
      width: 100%;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem 0.75rem;
        font-size: 1.1rem;
      }

      .section-card {
        padding: 2rem;
      }

      h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
      }

      h2 {
        font-size: 1.8rem;
      }

      .chapter a {
        font-size: 1.15rem;
      }

      .back-link,
      .random-link {
        font-size: 1rem;
        padding: 0.75rem 1.5rem;
      }
    }

    @media (max-width: 480px) {
      body {
        font-size: 1rem;
      }

      h2 {
        font-size: 1.6rem;
      }

      .chapter a {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
