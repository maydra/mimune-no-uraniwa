<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理の目的・路程と時代的性格</title>

  <!-- 左の箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3">
    <rect x="125.5" y="72.5" width="229" height="46"/>
    <rect x="125.5" y="200.5" width="229" height="45"/>
    <rect x="126.5" y="337.5" width="227" height="46"/>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="139.5" y="95" textLength="203" lengthAdjust="spacing">復帰摂理の目的</text>
    <text x="138.5" y="222" textLength="204" lengthAdjust="spacing">復帰摂理の路程</text>
    <text x="167.5" y="359.5" textLength="144" lengthAdjust="spacing">時代的性格</text>
  </g>

  <!-- 右の字 -->
  <g font-size="28" dominant-baseline="central">
    <text x="369.5" y="93" text-anchor="middle">：</text>
    <text y="93" font-size="27"><tspan x="383">「</tspan><tspan x="397" textLength="221" lengthAdjust="spacingAndGlyphs">メシヤのための基台</tspan><tspan x="617">」</tspan></text>
    <text x="642" y="93" font-size="27" textLength="50" lengthAdjust="spacingAndGlyphs">復帰</text>

    <text x="369.5" y="222.5" text-anchor="middle">：</text>
    <text x="385" y="222.5" textLength="143" lengthAdjust="spacing">「象徴献祭」</text>
    <text x="528" y="222.5">、</text>
    <text x="548" y="222.5" textLength="145" lengthAdjust="spacing">「実体献祭」</text>
    <text x="392" y="259" textLength="174" lengthAdjust="spacing">蕩減復帰摂理</text>
    <text x="580" y="259" textLength="58" lengthAdjust="spacing">反復</text>

    <text x="369.5" y="358.5" text-anchor="middle">：</text>
    <text x="385" y="358.5" textLength="116" lengthAdjust="spacing">中心民族</text>
    <text x="529" y="358.5" textLength="174" lengthAdjust="spacing">中心史料理解</text>
  </g>
  <circle cx="514" cy="358.5" r="3.6"/>
</svg>
