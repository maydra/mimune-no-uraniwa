<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>どのようにして延長されるか？</title>

  <text x="35" y="37.5" font-size="30" dominant-baseline="central" textLength="434" lengthAdjust="spacing">どのようにして延長されるか？</text>
  <line x1="32" y1="56.5" x2="474" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 神から被造物へ（灰色の矢印） -->
  <polygon points="207.5,176 214.5,176 214.5,213 219.5,213 211,229.5 202.5,213 207.5,213" fill="#8C949A"/>

  <!-- 神 -->
  <circle cx="211" cy="135" r="40" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="210" y="134.5" font-size="38" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 被造物 -->
  <ellipse cx="211" cy="275" rx="49.5" ry="43.5" fill="#CF921C" stroke="currentColor" stroke-width="3"/>
  <text x="210.5" y="275" font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="86" lengthAdjust="spacing">被造物</text>

  <!-- 点線（・・・・・・） -->
  <g>
    <circle cx="278" cy="135" r="2.5"/>
    <circle cx="292" cy="135" r="2.5"/>
    <circle cx="306" cy="135" r="2.5"/>
    <circle cx="319.5" cy="135" r="2.5"/>
    <circle cx="333" cy="135" r="2.5"/>
    <circle cx="347" cy="135" r="2.5"/>
    <circle cx="278" cy="275" r="2.5"/>
    <circle cx="292" cy="275" r="2.5"/>
    <circle cx="306" cy="275" r="2.5"/>
    <circle cx="319.5" cy="275" r="2.5"/>
    <circle cx="333" cy="275" r="2.5"/>
    <circle cx="347" cy="275" r="2.5"/>
  </g>

  <g font-size="28" dominant-baseline="central">
    <text x="362" y="135" textLength="143" lengthAdjust="spacing">三数的存在</text>
    <text y="174.5"><tspan x="364">【</tspan><tspan x="376" textLength="115" lengthAdjust="spacing">創造原理</tspan><tspan x="491">】</tspan></text>
    <text x="371" y="278" textLength="115" lengthAdjust="spacing">三数過程</text>
  </g>
  <text y="315" font-size="27" font-weight="400" dominant-baseline="central"><tspan x="342">（</tspan><tspan x="355" textLength="106" lengthAdjust="spacing">存在様相</tspan><tspan x="462">、</tspan><tspan x="489" textLength="53" lengthAdjust="spacing">運動</tspan><tspan x="542">、</tspan><tspan x="570" textLength="107" lengthAdjust="spacing">成長過程</tspan><tspan x="676">）</tspan></text>

  <!-- 延長も三段階まで -->
  <rect x="268.5" y="353.5" width="289" height="50" rx="8" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="287" y="378.5" font-size="30" dominant-baseline="central" fill="#111" textLength="252" lengthAdjust="spacing">延長も三段階まで</text>
</svg>
