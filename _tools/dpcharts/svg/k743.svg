<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第二次世界大戦　1. 第二次世界大戦に対する摂理的概要</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="37" y="39" font-size="30">Ⅲ.</text>
    <text x="85" y="39" font-size="30" textLength="219" lengthAdjust="spacing">第二次世界大戦</text>
    <text x="322" y="41" font-size="25" textLength="163" lengthAdjust="spacingAndGlyphs">(1939 ～ 1945)</text>
    <text x="52" y="83" font-size="28">1.</text>
    <text x="84" y="83" font-size="28" textLength="460" lengthAdjust="spacing">第二次世界大戦に対する摂理的概要</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="84" y1="57.5" x2="305" y2="57.5"/>
    <line x1="82" y1="101" x2="545" y2="101"/>
  </g>

  <!-- アベル型・カイン型の札 -->
  <g stroke="currentColor" stroke-width="2.5">
    <rect x="175.5" y="168.5" width="160" height="42" fill="#F8F28F"/>
    <rect x="472.5" y="168.5" width="160" height="42" fill="#F86D42"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="255.5" y="190" textLength="121" lengthAdjust="spacing">アベル型</text>
    <text x="551" y="190" textLength="123" lengthAdjust="spacing">カイン型</text>
  </g>

  <!-- 民主主義と全体主義 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="256.5" cy="267" rx="95.5" ry="43" fill="#F8F28F"/>
    <ellipse cx="556" cy="267" rx="95.5" ry="43" fill="#F86D42"/>
  </g>
  <g font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="256.5" y="267" textLength="124" lengthAdjust="spacing">民主主義</text>
    <text x="556" y="267" textLength="125" lengthAdjust="spacing">全体主義</text>
  </g>

  <!-- 勝利の矢印 -->
  <text x="407" y="225.5" font-size="29" text-anchor="middle" dominant-baseline="central" textLength="58" lengthAdjust="spacing">勝利</text>
  <polygon points="375,265 424,265 424,260 441,269 424,278 424,272.5 375,272.5" fill="#8C949A"/>

  <text x="409" y="364" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="282" lengthAdjust="spacing">長成的勝利基盤造成</text>
</svg>
