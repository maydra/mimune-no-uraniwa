    <polygon points="316.5,119.9 296.8,126.6 310.8,139.1"/>
    <polygon points="385.5,168.3 405.2,161.6 391.2,149.1"/>
    <g stroke="currentColor" stroke-width="4.5">
      <circle cx="351.5" cy="86" r="47.5" fill="#fff" class="paper"/>
      <ellipse cx="351" cy="212.75" rx="66.25" ry="46.75" fill="#CDF8F7"/>
      <ellipse cx="351" cy="510" rx="61.25" ry="46.5" fill="#FCE5E3"/>
    </g>
    <polygon points="351,271 388.5,314.5 368.5,314.5 368.5,463.5 333.5,463.5 333.5,314.5 313.5,314.5" fill="#C4CCD3" stroke="currentColor" stroke-width="4"/>
    <g stroke="currentColor" stroke-width="7.5">
      <line x1="234" y1="265" x2="468" y2="265"/>
      <line x1="286" y1="330.5" x2="413" y2="330.5"/>
      <line x1="286" y1="393.5" x2="413" y2="393.5"/>
      <line x1="234" y1="459" x2="468" y2="459"/>
    </g>
    <g stroke="#111" stroke-width="7.5">
      <line x1="333.5" y1="330.5" x2="368.5" y2="330.5"/>
      <line x1="333.5" y1="393.5" x2="368.5" y2="393.5"/>
      <line x1="333.5" y1="459" x2="368.5" y2="459"/>
    </g>
    <g text-anchor="middle" dominant-baseline="central">
      <text x="350.5" y="85.5" font-size="52">神</text>
      <g fill="#111">
        <text x="319.5" y="212" font-size="45">完</text>
        <text x="383.5" y="212" font-size="45">人</text>
        <text x="350" y="510.5" font-size="46">人間</text>
      </g>
    </g>
    <circle cx="351" cy="212" r="5.5" fill="#111"/>
  </g>

  <!-- 未完成期 -->
  <g font-size="41" text-anchor="middle" dominant-baseline="central">
    <text x="445.5" y="300">未</text>
    <text x="445.5" y="341.5">完</text>
    <text x="445.5" y="383">成</text>
    <text x="445.5" y="424.5">期</text>
  </g>

  <!-- 干渉： -->
  <rect x="493" y="322" width="126.5" height="76.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="550" y="360" font-size="48" text-anchor="middle" dominant-baseline="central">干渉</text>
  <rect x="634" y="347.5" width="9" height="8.5"/>
  <rect x="634" y="366.5" width="9" height="8.5"/>
  <polyline points="689,138 662.5,172 662.5,486 687,518" fill="none" stroke="currentColor" stroke-width="8"/>

  <!-- 右の箱 -->
  <g fill="#8C949A">
    <polygon points="878.5,223.5 886.5,223.5 886.5,249.5 892.75,249.5 882.5,267.5 872.25,249.5 878.5,249.5"/>
    <polygon points="878.5,349.5 886.5,349.5 886.5,374 892.75,374 882.5,392.5 872.25,374 878.5,374"/>
  </g>
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4">
    <rect x="707.5" y="148" width="350" height="71.5"/>
    <rect x="707.5" y="273.5" width="350" height="71.5"/>
    <rect x="707.5" y="399" width="350" height="113.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="46">
      <text x="882.5" y="183">責任分担無視</text>
      <text x="882.5" y="308.5">創造原理無視</text>
    </g>
    <g font-size="41">
      <text x="876.5" y="431">原理の絶対性と</text>
      <text x="878.5" y="480.5">完全無欠性喪失</text>
