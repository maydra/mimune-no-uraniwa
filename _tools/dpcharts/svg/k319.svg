<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>二つの石板</title>

  <text x="400.5" y="51" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="142" lengthAdjust="spacing">二つの石板</text>

  <!-- 石板（左は桃、右は緑。奥の黒い面は8右・4上にずらした同じ形） -->
  <g>
    <g fill="#111" stroke="#111" stroke-width="4" stroke-linejoin="round">
      <path d="M312,155 V93 A26,17.5 0 0 1 364,93 V155 Z"/>
      <polygon points="354,159 364,155 364,148 354,148"/>
    </g>
    <path d="M304,159 V97 A26,17.5 0 0 1 356,97 V159 Z" fill="#F98AEE" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="#111" stroke-width="3.6" stroke-dasharray="3.6 3.4">
      <line x1="312.5" y1="97.7" x2="312.5" y2="150.3"/>
      <line x1="319.9" y1="97.7" x2="319.9" y2="150.3"/>
      <line x1="327.3" y1="97.7" x2="327.3" y2="150.3"/>
      <line x1="334.7" y1="97.7" x2="334.7" y2="150.3"/>
      <line x1="342.1" y1="97.7" x2="342.1" y2="150.3"/>
      <line x1="349.5" y1="97.7" x2="349.5" y2="150.3"/>
    </g>
  </g>
  <g transform="translate(144,1)">
    <g fill="#111" stroke="#111" stroke-width="4" stroke-linejoin="round">
      <path d="M312,155 V93 A26,17.5 0 0 1 364,93 V155 Z"/>
      <polygon points="354,159 364,155 364,148 354,148"/>
    </g>
    <path d="M304,159 V97 A26,17.5 0 0 1 356,97 V159 Z" fill="#A0F08A" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="#111" stroke-width="3.6" stroke-dasharray="3.6 3.4">
      <line x1="312.5" y1="97.7" x2="312.5" y2="150.3"/>
      <line x1="319.9" y1="97.7" x2="319.9" y2="150.3"/>
      <line x1="327.3" y1="97.7" x2="327.3" y2="150.3"/>
      <line x1="334.7" y1="97.7" x2="334.7" y2="150.3"/>
      <line x1="342.1" y1="97.7" x2="342.1" y2="150.3"/>
      <line x1="349.5" y1="97.7" x2="349.5" y2="150.3"/>
    </g>
  </g>

  <!-- 石板の名 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="331" y="188.5" font-size="28" textLength="84" lengthAdjust="spacing">イエス</text>
    <text x="474.5" y="188.5" font-size="28" textLength="57" lengthAdjust="spacing">聖霊</text>
    <text x="331" y="218.5" font-size="20">（後のアダム）</text>
    <text x="474.5" y="218.5" font-size="20">（後のエバ）</text>
  </g>

  <!-- 二つの石板を壊してしまう → -->
  <g font-size="26" dominant-baseline="central">
    <text x="140" y="274" textLength="130" lengthAdjust="spacing">二つの石板</text>
    <text x="139" y="315" textLength="156" lengthAdjust="spacing">壊してしまう</text>
    <text x="347" y="274" textLength="312" lengthAdjust="spacing">イエスが十字架で亡くなる</text>
    <text x="347" y="315.5" textLength="362" lengthAdjust="spacingAndGlyphs">イエスと聖霊が使命完遂できない</text>
  </g>
  <polygon points="283,269.5 297.5,269.5 297.5,264 310.5,273 297.5,282.5 297.5,276.5 283,276.5" fill="#8C949A"/>
  <circle cx="333.5" cy="273.5" r="6"/>
  <circle cx="333.5" cy="316.5" r="6"/>

  <!-- 一次幕屋のための基台：× -->
  <rect x="208.5" y="359.5" width="390" height="44" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="29" dominant-baseline="central" fill="#111">
    <text x="224.5" y="381" textLength="290" lengthAdjust="spacing">一次幕屋のための基台</text>
    <text x="528" y="381" text-anchor="middle">：</text>
  </g>
  <path d="M554,371.5 L571,390.5 M571,371.5 L554,390.5" stroke="#111" stroke-width="5" fill="none"/>
</svg>
