<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第二次世界的カナン復帰路程　信仰基台　イエスが洗礼ヨハネの使命を代理する</title>

  <!-- 題 -->
  <text x="38" y="34.5" font-size="30" dominant-baseline="central" textLength="34" lengthAdjust="spacing">Ⅱ.</text>
  <text x="79" y="34.5" font-size="30" dominant-baseline="central" textLength="413" lengthAdjust="spacing">第二次世界的カナン復帰路程</text>
  <line x1="80" y1="54" x2="490" y2="54" stroke="currentColor" stroke-width="2.4"/>
  <text x="50" y="78" font-size="27" dominant-baseline="central" textLength="22" lengthAdjust="spacing">1.</text>
  <text x="80" y="78" font-size="28" dominant-baseline="central" textLength="115" lengthAdjust="spacing">信仰基台</text>
  <line x1="80" y1="96.5" x2="195" y2="96.5" stroke="currentColor" stroke-width="2.2"/>
  <text x="52" y="118" font-size="26" dominant-baseline="central" textLength="37" lengthAdjust="spacing">(1)</text>
  <text x="98" y="118" font-size="26" dominant-baseline="central" textLength="449" lengthAdjust="spacing">イエスが洗礼ヨハネの使命を代理する</text>
  <line x1="99" y1="135" x2="545" y2="135" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="275,215.5 283,229 277.8,229 277.8,259 272.2,259 272.2,229 267,229"/>
    <polygon points="358,286.5 371,279 371,283 525,283 525,289 371,289 371,294"/>
    <polygon points="358,193.8 373.8,191.8 372.1,196.1 561,268.9 559,274.3 370.1,201.5 368.4,205.8"/>
  </g>

  <!-- イエス・洗礼ヨハネ・ユダヤ民族 -->
  <g stroke="currentColor" stroke-width="2.4">
    <ellipse cx="276.5" cy="186" rx="75.3" ry="26.8" fill="#fff" class="paper"/>
    <ellipse cx="273.5" cy="285" rx="75.3" ry="26.8" fill="#F8F28F"/>
    <ellipse cx="599.5" cy="285" rx="75.3" ry="26.8" fill="#F86D42"/>
  </g>
  <text x="274.5" y="185.5" font-size="32" text-anchor="middle" dominant-baseline="central" textLength="96" lengthAdjust="spacing">イエス</text>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="274.5" y="286" textLength="128" lengthAdjust="spacing">洗礼ヨハネ</text>
    <text x="609.5" y="285" textLength="122" lengthAdjust="spacing">ユダヤ民族</text>
  </g>

  <!-- × -->
  <g stroke="currentColor" stroke-width="4.5">
    <path d="M261,230 L289,254 M290,230 L262,254"/>
    <path d="M447,213.5 L460.5,246.5 M469.5,221 L437,240"/>
  </g>

  <!-- 添え書き -->
  <g font-size="23" dominant-baseline="central">
    <text x="134" y="238" textLength="117" lengthAdjust="spacing">疑う、逆らう</text>
    <text x="462.5" y="198.5" font-size="25" text-anchor="middle" textLength="51" lengthAdjust="spacing">不信</text>
    <text x="445.5" y="305.5" text-anchor="middle" textLength="91" lengthAdjust="spacing">信じ従う</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="176" cy="338.5" r="5"/>
    <circle cx="176" cy="369" r="5"/>
    <circle cx="176" cy="403" r="5"/>
  </g>
  <g font-size="24" dominant-baseline="central">
    <text x="190" y="336.5" textLength="213" lengthAdjust="spacing">復帰されたアダム型</text>
    <text x="193" y="371" textLength="232" lengthAdjust="spacing">「メシヤのための基台」</text>
    <text x="228" y="401" textLength="162" lengthAdjust="spacing">に従い侍るべき</text>
  </g>
  <circle cx="208.5" cy="402" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="207.5" y="402" font-size="21" text-anchor="middle" dominant-baseline="central">イ</text>
</svg>
