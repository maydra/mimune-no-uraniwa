<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>摂理的同時性の時代の２つの性格</title>

  <text x="34 65.5 97 128.5 160 191.5 223 254.5 286 317.5 349 380.5 412 443.5 475" y="35.5" font-size="30" dominant-baseline="central">摂理的同時性の時代の２つの性格</text>
  <line x1="33" y1="55" x2="508" y2="55" stroke="currentColor" stroke-width="2.8"/>

  <!-- メシヤのための基台 ＝ 実体基台 ＋ 信仰基台 -->
  <rect x="152" y="96" width="312" height="43" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="166" y="118" font-size="29" dominant-baseline="central" textLength="281" lengthAdjust="spacing">メシヤのための基台</text>
  <g stroke="currentColor" stroke-width="5">
    <line x1="231" y1="158" x2="231" y2="187"/>
    <line x1="245" y1="158" x2="245" y2="187"/>
    <line x1="235.5" y1="263" x2="235.5" y2="296" stroke-width="6"/>
    <line x1="219" y1="279" x2="252" y2="279"/>
  </g>
  <g stroke="currentColor" stroke-width="3" fill="#fff" class="paper">
    <rect x="153" y="203" width="164" height="43"/>
    <rect x="153" y="314" width="165" height="42"/>
  </g>
  <g font-size="29" dominant-baseline="central">
    <text x="173" y="224.5" textLength="125" lengthAdjust="spacing">実体基台</text>
    <text x="173" y="334" textLength="125" lengthAdjust="spacing">信仰基台</text>
  </g>

  <!-- 数理的蕩減期間 -->
  <line x1="318" y1="333.5" x2="353.5" y2="333.5" stroke="#8C949A" stroke-width="6"/>
  <g font-size="27" dominant-baseline="central">
    <text x="377" y="320" textLength="86" lengthAdjust="spacing">数理的</text>
    <text x="363" y="355" textLength="114" lengthAdjust="spacing">蕩減期間</text>
  </g>
  <polygon points="492,327.5 509,327.5 509,314 528.5,335 509,356.5 509,342.5 492,342.5" fill="#8C949A"/>

  <!-- 年数、代数の反復 -->
  <rect x="546" y="271" width="118" height="128" rx="4" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text y="295"><tspan x="561" textLength="58" lengthAdjust="spacing">年数</tspan><tspan x="619">、</tspan></text>
    <text x="561" y="335" textLength="86" lengthAdjust="spacing">代数の</text>
    <text x="561" y="374" textLength="58" lengthAdjust="spacing">反復</text>
  </g>
</svg>
