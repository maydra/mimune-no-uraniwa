<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>善主権と悪主権　第二祝福復帰</title>

  <g font-size="48" dominant-baseline="central">
    <text x="266.9" y="117" textLength="146.2" lengthAdjust="spacing">善主権</text>
    <text x="869.5" y="118" textLength="147.6" lengthAdjust="spacing">悪主権</text>
  </g>

  <!-- 善主権 -->
  <ellipse cx="347" cy="284.5" rx="156.2" ry="105.4" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <circle cx="236.5" cy="230.5" r="11"/>
  <circle cx="235" cy="291" r="10.5"/>
  <g font-size="41" dominant-baseline="central">
    <text x="255.1" y="231" textLength="164" lengthAdjust="spacing">真の父母</text>
    <text x="254.1" y="293" textLength="118" lengthAdjust="spacingAndGlyphs">真の父母</text>
  </g>
  <g font-size="43" text-anchor="middle" dominant-baseline="central">
    <text x="390.5" y="291">(</text>
    <text x="489" y="290">)</text>
  </g>
  <ellipse cx="440" cy="288" rx="40" ry="31" fill="#F8F28F" stroke="currentColor" stroke-width="3.5"/>
  <text x="439" y="287.5" font-size="40" font-weight="400" text-anchor="middle" dominant-baseline="central" textLength="58" lengthAdjust="spacingAndGlyphs" fill="#111">イエス</text>
  <text x="254.2" y="341" font-size="41" textLength="190.8" lengthAdjust="spacingAndGlyphs" dominant-baseline="central">仕える子女</text>

  <!-- 悪主権 -->
  <ellipse cx="948" cy="279.5" rx="155.7" ry="105.3" fill="#CF921C" stroke="currentColor" stroke-width="4.5"/>
  <g fill="#111">
    <circle cx="850" cy="245.5" r="10.5"/>
    <circle cx="849.5" cy="317.5" r="10.5"/>
    <g font-size="44" dominant-baseline="central">
      <text x="870.6" y="246.5" textLength="181.5" lengthAdjust="spacing">悪の父母</text>
      <text x="870.6" y="319" textLength="180.5" lengthAdjust="spacing">悪の子女</text>
    </g>
  </g>

  <!-- 人類歴史（悪主権から善主権へ） -->
  <polygon points="772.5,263.5 551.5,263.5 551.5,249.5 526.5,273 551.5,296.5 551.5,282.5 772.5,282.5" fill="#8C949A"/>
  <g font-size="45" dominant-baseline="central">
    <text x="562.6" y="210.5" textLength="180.3" lengthAdjust="spacing">人類歴史</text>
    <text x="537.7" y="339" textLength="226.4" lengthAdjust="spacing">内外両面の</text>
    <text x="538.1" y="396.5" textLength="226.7" lengthAdjust="spacing">サタン分立</text>
  </g>

  <rect x="448" y="509" width="423.5" height="85.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="499" y="553" font-size="54" textLength="322.5" lengthAdjust="spacingAndGlyphs" dominant-baseline="central" fill="#111">第二祝福復帰</text>
</svg>
