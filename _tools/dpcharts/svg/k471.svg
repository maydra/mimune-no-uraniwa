<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 縦からなる横的な蕩減復帰</title>

  <text x="35" y="37.5" font-size="30" dominant-baseline="central">Ⅲ.</text>
  <text x="83" y="37.5" font-size="30" dominant-baseline="central" textLength="375" lengthAdjust="spacing">縦からなる横的な蕩減復帰</text>
  <line x1="82" y1="56" x2="460" y2="56" stroke="currentColor" stroke-width="2.2"/>

  <!-- 白抜きの下向きの矢印（アダム・ノア） -->
  <polygon points="205,82 292,82 292,147 325,147 249.5,191 173,147 205,147" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="248.5" y="110" textLength="71" lengthAdjust="spacing">アダム</text>
    <text x="249" y="149.5" textLength="56" lengthAdjust="spacing">ノア</text>
  </g>

  <!-- アブラハム -->
  <ellipse cx="248.5" cy="222" rx="86" ry="22.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <text x="250" y="221.5" font-size="25" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="126" lengthAdjust="spacing">アブラハム</text>

  <!-- 「象徴献祭」失敗 -->
  <text y="223" font-size="27" dominant-baseline="central"><tspan x="354">「</tspan><tspan x="368" textLength="113" lengthAdjust="spacing">象徴献祭</tspan><tspan x="482">」</tspan><tspan x="513" textLength="54" lengthAdjust="spacing">失敗</tspan></text>

  <!-- 第三次：必ずみ旨を成し遂げなければならない -->
  <g font-size="26" dominant-baseline="central">
    <text x="210" y="277" textLength="67" lengthAdjust="spacingAndGlyphs">第三次</text>
    <text x="303" y="276.5" textLength="390" lengthAdjust="spacingAndGlyphs">必ずみ旨を成し遂げなければならない</text>
  </g>
  <text x="290" y="276.5" font-size="26" text-anchor="middle" dominant-baseline="central">：</text>

  <!-- 灰色の下向きの矢印 -->
  <polygon points="236,296 254.5,296 254.5,305 266.5,305 245,317.5 223.5,305 236,305" fill="#8C949A"/>

  <!-- 下の水色の箱 -->
  <rect x="141.5" y="329.5" width="548" height="76" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="157" y="350.5" textLength="118" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="303" y="350.5" textLength="218" lengthAdjust="spacingAndGlyphs">失敗しなかった立場</text>
    <text x="155" y="385" textLength="45" lengthAdjust="spacingAndGlyphs">摂理</text>
    <text x="226" y="385" textLength="163" lengthAdjust="spacingAndGlyphs">延長されないで</text>
    <text x="391" y="385">、</text>
    <text x="416" y="385" textLength="258" lengthAdjust="spacingAndGlyphs">横的蕩減復帰された立場</text>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="289.5" y="350.5">：</text>
    <text x="213" y="385">：</text>
  </g>
</svg>
