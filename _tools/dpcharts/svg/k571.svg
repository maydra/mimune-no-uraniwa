<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>南北王朝分立時代と東西王朝分立時代　内的な刷新運動と外的な粛清</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="130" y="64.5" width="276" height="54" rx="5"/>
    <rect x="415" y="64.5" width="276" height="54" rx="5"/>
  </g>
  <g font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="267.5" y="92" textLength="249" lengthAdjust="spacing">南北王朝分立時代</text>
    <text x="554" y="92" textLength="250" lengthAdjust="spacing">東西王朝分立時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="130" y="126.5" width="276" height="245" rx="6"/>
    <rect x="415" y="126.5" width="276" height="245" rx="6"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="149.5" cy="146" r="10.3"/>
    <circle cx="437.5" cy="145.5" r="10.3"/>
  </g>
  <g font-size="17" text-anchor="middle" dominant-baseline="central">
    <text x="149.5" y="146.5">1</text>
    <text x="437.5" y="146">2</text>
  </g>

  <!-- 箇条 -->
  <g stroke="currentColor" stroke-width="3.2">
    <line x1="160" y1="226.5" x2="171.5" y2="226.5"/>
    <line x1="160" y1="303" x2="171.5" y2="303"/>
    <line x1="449" y1="226.5" x2="460.5" y2="226.5"/>
    <line x1="449" y1="303" x2="460.5" y2="303"/>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="148" y="180" textLength="235" lengthAdjust="spacingAndGlyphs">イスラエル民族不信</text>
    <text x="188" y="227" textLength="181" lengthAdjust="spacingAndGlyphs">内的な刷新運動</text>
    <text x="187" y="304" textLength="130" lengthAdjust="spacingAndGlyphs">外的な粛清</text>
    <text x="434" y="180" textLength="130" lengthAdjust="spacing">法王庁腐敗</text>
    <text x="475" y="227" textLength="181" lengthAdjust="spacingAndGlyphs">内的な刷新運動</text>
    <text x="474" y="304" textLength="130" lengthAdjust="spacingAndGlyphs">外的な粛清</text>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="330.5" y="259">（預言者）</text>
    <text x="330.5" y="336">（異邦人）</text>
    <text x="617" y="258.5">（修道院）</text>
    <text x="604" y="335">（十字軍戦争）</text>
  </g>
</svg>
