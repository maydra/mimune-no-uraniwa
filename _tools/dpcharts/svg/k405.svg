<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第一：「信仰基台」蕩減復帰</title>

  <g font-size="27" dominant-baseline="central">
    <text y="71"><tspan x="138" textLength="58" lengthAdjust="spacing">第一</tspan><tspan x="203">：</tspan><tspan x="226">「</tspan><tspan x="239" textLength="115" lengthAdjust="spacing">信仰基台</tspan><tspan x="354">」</tspan><tspan x="384" textLength="116" lengthAdjust="spacing">蕩減復帰</tspan></text>
    <text x="138" y="138" textLength="230" lengthAdjust="spacing">摂理路程において</text>
    <text y="187"><tspan x="187">「</tspan><tspan x="200" textLength="115" lengthAdjust="spacing">信仰基台</tspan><tspan x="315">」</tspan><tspan x="338" textLength="114" lengthAdjust="spacing">のために</tspan></text>
    <text x="196" y="227" font-size="26" textLength="469" lengthAdjust="spacing">立てようとされたすべてのもの蕩減復帰</text>
    <text y="309"><tspan x="187">「</tspan><tspan x="199" textLength="29" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="238" textLength="229" lengthAdjust="spacing">日サタン分立基台</tspan><tspan x="467">」</tspan><tspan x="491">を</tspan></text>
    <text x="196" y="347.5" textLength="290" lengthAdjust="spacing">横的に一時に蕩減復帰</text>
  </g>

  <!-- 箇条の点 -->
  <circle cx="173" cy="185" r="6"/>
  <circle cx="172" cy="308" r="6"/>
</svg>
