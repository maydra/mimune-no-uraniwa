  <!-- 天の側・サタン側 -->
  <g font-size="26" dominant-baseline="central">
    <text x="204" y="111.5" textLength="85" lengthAdjust="spacing">天の側</text>
    <text x="348" y="111.5" textLength="90" lengthAdjust="spacing">アベル型</text>
    <text x="200" y="344" textLength="91" lengthAdjust="spacing">サタン側</text>
    <text x="348" y="343.5" textLength="90" lengthAdjust="spacing">カイン型</text>

    <text x="362" y="69" text-anchor="end">(</text>
    <text x="365" y="69" textLength="56" lengthAdjust="spacing">民主</text>
    <text x="421" y="69">)</text>
    <text x="362" y="385.5" text-anchor="end">(</text>
    <text x="365" y="385.5" textLength="56" lengthAdjust="spacing">共産</text>
    <text x="421" y="385.5">)</text>
  </g>

  <!-- 右の字 -->
  <g font-size="25" dominant-baseline="central">
    <text x="530" y="191.5" textLength="52" lengthAdjust="spacing">宗教</text>
    <text x="581" y="191.5">、</text>
    <text x="606" y="191.5" textLength="52" lengthAdjust="spacing">思想</text>
    <text x="529" y="225.5" textLength="53" lengthAdjust="spacing">政治</text>
    <text x="581" y="225.5">、</text>
    <text x="606" y="225.5" textLength="103" lengthAdjust="spacing">経済など</text>
