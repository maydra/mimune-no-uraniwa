<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>裸を恥ずかしがることがだれにとっても罪になるのであろうか</title>

  <!-- 問い -->
  <rect x="150" y="56" width="412.5" height="77.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3.4"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="163" y="76.5" textLength="383" lengthAdjust="spacing">裸を恥ずかしがることがだれに</text>
    <text x="165" y="113.5" textLength="365" lengthAdjust="spacing">とっても罪になるのであろうか</text>
  </g>

  <!-- 下へ -->
  <polygon points="329.5,147 338.5,147 338.5,324 344.5,324 334,342.5 323.5,324 329.5,324" fill="#8C949A"/>

  <!-- 説明 -->
  <g font-size="25" dominant-baseline="central">
    <text x="394" y="169" textLength="246" lengthAdjust="spacingAndGlyphs">アダムの家庭の立場を</text>
    <text x="392" y="206" textLength="274" lengthAdjust="spacingAndGlyphs">復帰するための蕩減条件</text>
    <text x="431" y="282.5" textLength="209" lengthAdjust="spacingAndGlyphs">恥ずかしがらない</text>
    <text x="431" y="319" textLength="130" lengthAdjust="spacingAndGlyphs">感性と行動</text>
  </g>
  <g stroke="currentColor" stroke-width="4" fill="none">
    <line x1="517.5" y1="232" x2="517.5" y2="255"/>
    <line x1="529" y1="232" x2="529" y2="255"/>
  </g>

  <!-- 答え -->
  <rect x="239" y="352" width="194" height="50" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="335.5" y="376" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="170" lengthAdjust="spacing" fill="#111">ノアの家庭だけ</text>
</svg>
