<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>３数、４数、７数の原理的意義</title>
  <defs>
    <marker id="k485-g" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.2" markerHeight="2.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <g font-size="31.5" dominant-baseline="central">
    <text x="49" y="39" text-anchor="middle">３</text>
    <text x="65.5" y="39">数、</text>
    <text x="133.5" y="39" text-anchor="middle">４</text>
    <text x="150.5" y="39">数、</text>
    <text x="219.5" y="39" text-anchor="middle">７</text>
    <text x="235.5" y="39" textLength="221" lengthAdjust="spacing">数の原理的意義</text>
  </g>
  <line x1="33" y1="58" x2="456" y2="58" stroke="currentColor" stroke-width="2.2"/>

  <!-- 被造物から三方向への灰色の矢印（円の下に描く） -->
  <g stroke="#8C949A" stroke-width="6" fill="none" marker-end="url(#k485-g)">
    <line x1="150.7" y1="222" x2="202.4" y2="150.4"/>
    <line x1="150" y1="231.5" x2="197.6" y2="231.5"/>
    <line x1="150" y1="240" x2="202.4" y2="312.6"/>
  </g>
  <circle cx="145.5" cy="230" r="28.3" fill="#FCE5E3" stroke="currentColor" stroke-width="2.4"/>
  <text x="144.5" y="231" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">被</text>

  <!-- 一列目 -->
  <g font-size="27" dominant-baseline="central">
    <text x="213" y="115.5" textLength="51" lengthAdjust="spacing">神と</text>
    <text x="213" y="150.5" textLength="56" lengthAdjust="spacing">一体</text>
    <text x="215" y="218.5" textLength="108" lengthAdjust="spacing">四位基台</text>
    <text x="215" y="253" textLength="54" lengthAdjust="spacing">造成</text>
    <text x="215" y="318.5"><tspan textLength="80" lengthAdjust="spacing">時間性</tspan><tspan x="295">、</tspan></text>
    <text x="214" y="349.5" textLength="108" lengthAdjust="spacing">空間性を</text>
    <text x="215" y="381.5" textLength="52" lengthAdjust="spacing">もつ</text>
  </g>

  <!-- 小さい灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="333,129.5 353,129.5 353,125.5 366,132 353,138.5 353,134.5 333,134.5"/>
    <polygon points="526,129.5 546,129.5 546,125.5 558,132 546,138.5 546,134.5 526,134.5"/>
    <polygon points="333,233 353,233 353,229 366,235.5 353,242 353,238 333,238"/>
    <polygon points="526,233 546,233 546,229 558,235.5 546,242 546,238 526,238"/>
    <polygon points="333,346 353,346 353,342 366,348.5 353,355 353,351 333,351"/>
    <polygon points="526,346 546,346 546,342 558,348.5 546,355 546,351 526,351"/>
  </g>

  <!-- 二列目 -->
  <g font-size="27" dominant-baseline="central">
    <text x="382" y="114.5" textLength="128" lengthAdjust="spacing">成長三期間</text>
    <text x="382" y="148.5" textLength="128" lengthAdjust="spacing">三対象目的</text>
    <text x="442" y="234" text-anchor="middle" textLength="85" lengthAdjust="spacing">四方性</text>
    <text x="445" y="349.5" text-anchor="middle" textLength="115" lengthAdjust="spacing">完成実体</text>
  </g>

  <!-- ３数＋４数＝７数 -->
  <g fill="#DCC4C4" stroke="currentColor" stroke-width="2.4">
    <rect x="574.2" y="114.2" width="84.6" height="35.6"/>
    <rect x="574.2" y="218.2" width="84.6" height="35.6"/>
    <rect x="575.2" y="331.2" width="82.6" height="34.6"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="603.5" y="131.5">３</text>
    <text x="630" y="131.5">数</text>
    <text x="602.5" y="235.5">４</text>
    <text x="630" y="235.5">数</text>
    <text x="603.5" y="348">７</text>
    <text x="630" y="348">数</text>
  </g>
  <g font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="582.5" y="167">(</text>
    <text x="618" y="167" textLength="60" lengthAdjust="spacing">天の数</text>
    <text x="653.5" y="167">)</text>
    <text x="582" y="271">(</text>
    <text x="617.5" y="271" textLength="61" lengthAdjust="spacing">地の数</text>
    <text x="653" y="271">)</text>
  </g>
  <!-- ＋ と 縦の ＝ -->
  <g stroke="currentColor" stroke-width="4.5">
    <line x1="607" y1="194.5" x2="627" y2="194.5"/>
    <line x1="617" y1="184" x2="617" y2="205"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <line x1="611.5" y1="294" x2="611.5" y2="313.5"/>
    <line x1="621.5" y1="294" x2="621.5" y2="313.5"/>
  </g>
</svg>
