<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>封建社会　宗教・政治・経済</title>

  <!-- 灰色の矢印と分かれの線（楕円・箱の下に描く） -->
  <g fill="#8C949A">
    <polygon points="199.5,95 206,95 206,134 210.5,134 202.5,148.5 194.5,134 199.5,134"/>
    <polygon points="199.5,220 206,220 206,347 210.5,347 202.5,361.5 194.5,347 199.5,347"/>
  </g>
  <path d="M280,194.5 H319.5 M340,104.5 H319.5 V284.5 H340" fill="none" stroke="#8C949A" stroke-width="6"/>

  <!-- 封建社会の楕円 -->
  <ellipse cx="202.5" cy="196" rx="86.5" ry="42" fill="#F8F28F" stroke="currentColor" stroke-width="2.8"/>
  <text x="202.5" y="195.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="127" lengthAdjust="spacing">封建社会</text>

  <!-- 宗教・政治・経済の札 -->
  <g stroke="currentColor" stroke-width="2.8">
    <rect x="337.5" y="70.5" width="41.5" height="67" rx="6" fill="#F98AEE"/>
    <rect x="337.5" y="161.5" width="41.5" height="68" rx="6" fill="#FCE5E3"/>
    <rect x="337.5" y="252.5" width="41.5" height="67" rx="6" fill="#A0F08A"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="359" y="90">宗</text>
    <text x="359" y="116.5">教</text>
    <text x="359" y="181.5">政</text>
    <text x="359" y="208">治</text>
    <text x="359" y="273">経</text>
    <text x="359" y="299">済</text>
  </g>

  <!-- 右の字 -->
  <g dominant-baseline="central">
    <text x="392.7" y="88" font-size="26" textLength="236" lengthAdjust="spacing">キリスト教封建社会</text>
    <text y="123.5" font-size="22"><tspan x="402.5" text-anchor="middle">－</tspan><tspan x="415" textLength="42" lengthAdjust="spacing">法王</tspan><tspan x="457">、</tspan><tspan x="479" textLength="64" lengthAdjust="spacing">教区長</tspan><tspan x="543">、</tspan><tspan x="564" textLength="64" lengthAdjust="spacing">大主教</tspan><tspan x="628">、</tspan><tspan x="649" textLength="43" lengthAdjust="spacing">主教</tspan></text>

    <text y="181.5" font-size="26"><tspan x="391.7" textLength="105.6" lengthAdjust="spacing">封建社会</tspan></text>
    <text y="181.5" font-size="25"><tspan x="508.5" text-anchor="middle">(</tspan><tspan x="514.5" textLength="23" lengthAdjust="spacingAndGlyphs">5C</tspan><tspan x="554.5" text-anchor="middle">～</tspan><tspan x="574.5" textLength="34" lengthAdjust="spacingAndGlyphs">17C</tspan></text>
    <text y="181.5" font-size="22"><tspan x="616" textLength="44.5" lengthAdjust="spacing">中葉</tspan></text>
    <text x="665.5" y="181.5" font-size="25" text-anchor="middle">)</text>
    <text y="217" font-size="23"><tspan x="402.5" text-anchor="middle" font-size="22">－</tspan><tspan x="415" textLength="260" lengthAdjust="spacing">領主と騎士間の主従関係</tspan></text>

    <text y="270.5" font-size="26"><tspan x="391.7" textLength="157.6" lengthAdjust="spacing">荘園制度社会</tspan></text>
    <text y="270.5" font-size="25"><tspan x="561.5" text-anchor="middle">(</tspan><tspan x="567.5" textLength="34" lengthAdjust="spacingAndGlyphs">15C</tspan><tspan x="619" text-anchor="middle">～</tspan><tspan x="639.5" textLength="33" lengthAdjust="spacingAndGlyphs">18C</tspan><tspan x="676.5" text-anchor="middle">)</tspan></text>
    <text y="307" font-size="22"><tspan x="402.5" text-anchor="middle">－</tspan><tspan x="418" textLength="91" lengthAdjust="spacing">自給自足</tspan></text>

    <text x="366.7" y="353" font-size="26" textLength="261.6" lengthAdjust="spacing">天の側王国建設の基台</text>
  </g>
  <circle cx="352" cy="353" r="7.5"/>
</svg>
