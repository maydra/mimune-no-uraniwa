<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>モーセの路程</title>
  <text x="34" y="38" font-size="31" dominant-baseline="central" textLength="188" lengthAdjust="spacing">モーセの路程</text>
  <line x1="33" y1="57" x2="223" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- モーセと「{」 -->
  <ellipse cx="181" cy="207.5" rx="57" ry="45.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="179.5" y="206" font-size="32" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="91" lengthAdjust="spacingAndGlyphs">モーセ</text>
  <path d="M272,120 H250 V295 H272 M250,178 H272 M250,236 H272" fill="none" stroke="#8C949A" stroke-width="6"/>

  <!-- 説明 -->
  <text x="279" y="116.5" font-size="31" dominant-baseline="central" textLength="189" lengthAdjust="spacing">ヤコブの子孫</text>
  <text x="279" y="176" font-size="31" dominant-baseline="central" textLength="395" lengthAdjust="spacingAndGlyphs">ヤコブの典型路程を、形象的に</text>
  <text x="280" y="236" font-size="31" dominant-baseline="central" textLength="280" lengthAdjust="spacing">ヨセフの基台の上に</text>
  <text x="279" y="296" font-size="31" dominant-baseline="central" textLength="251" lengthAdjust="spacing">イエスの表示路程</text>
  <text x="281" y="335" font-size="30" dominant-baseline="central" textLength="415" lengthAdjust="spacingAndGlyphs">(生い立ち、死、民族的カナン復帰路程)</text>
</svg>
