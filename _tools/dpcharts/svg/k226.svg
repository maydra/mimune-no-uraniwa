<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>④ 成長期間復帰 (3数、12数、70数)</title>
  <text x="48.5" y="39" font-size="29" text-anchor="middle" dominant-baseline="central">④</text>
  <text x="70" y="39" font-size="29" dominant-baseline="central" textLength="424" lengthAdjust="spacing">成長期間復帰 (3数、12数、70数)</text>
  <line x1="70" y1="55.5" x2="494" y2="55.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦の矢印（楕円の下に描く） -->
  <polygon points="208,141 214,141 214,169 218.5,169 211,181 203.5,169 208,169" fill="#8C949A"/>
  <polygon points="208,225 214,225 214,255 218.5,255 211,267 203.5,255 208,255" fill="#8C949A"/>
  <polygon points="208,310 214,310 214,341 218.5,341 211,353 203.5,341 208,341" fill="#8C949A"/>

  <!-- ア・エ → ヤコブ → モーセ → イエス -->
  <ellipse cx="211.5" cy="115.5" rx="62.5" ry="28.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <path d="M210.5,87 C184.5,90.5 182.5,108.5 211.5,115.5 C234.5,122 234.5,139.5 210.5,144" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="175.5" y="115.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">ア</text>
  <text x="247.5" y="115.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">エ</text>
  <ellipse cx="211" cy="205" rx="45" ry="23" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="211" y="204.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="72" lengthAdjust="spacingAndGlyphs">ヤコブ</text>
  <ellipse cx="211" cy="291" rx="45.5" ry="23" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="211" y="290.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="77" lengthAdjust="spacingAndGlyphs">モーセ</text>
  <ellipse cx="211" cy="378.5" rx="50" ry="24.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="211" y="378.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="77" lengthAdjust="spacingAndGlyphs">イエス</text>

  <!-- 説明 -->
  <text x="287" y="110.5" font-size="28" dominant-baseline="central" textLength="317" lengthAdjust="spacing">成長期間にサタンの侵入</text>
  <text x="287" y="202.5" font-size="28" dominant-baseline="central" textLength="364" lengthAdjust="spacing">三日期間、12子息、70人家族</text>
  <text x="287" y="288.5" font-size="28" dominant-baseline="central" textLength="364" lengthAdjust="spacing">三日期間、12部族、70人長老</text>
  <text x="287" y="377.5" font-size="28" dominant-baseline="central" textLength="364" lengthAdjust="spacing">三日期間、12弟子、70人門徒</text>
</svg>
