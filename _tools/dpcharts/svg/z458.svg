<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスと洗礼ヨハネ</title>

  <!-- 見出しの帯 -->
  <g stroke="currentColor" stroke-width="4">
    <rect x="200" y="68.5" width="432" height="63" fill="#F8F28F"/>
    <rect x="650" y="68.5" width="432" height="63" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="416" y="100" font-size="44" textLength="132" lengthAdjust="spacing">イエス</text>
    <text x="866" y="100" font-size="45" textLength="225" lengthAdjust="spacing">洗礼ヨハネ</text>
  </g>

  <!-- 中身の枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4">
    <rect x="200" y="142.5" width="432" height="487"/>
    <rect x="650" y="142.5" width="432" height="487"/>
  </g>

  <!-- 黒丸 -->
  <g>
    <circle cx="237.5" cy="207.5" r="10"/>
    <circle cx="237.5" cy="306" r="10"/>
    <circle cx="237.5" cy="404" r="10"/>
    <circle cx="237.5" cy="501" r="10"/>
    <circle cx="690" cy="207.5" r="10"/>
    <circle cx="690" cy="306" r="10"/>
    <circle cx="690" cy="404" r="10"/>
    <circle cx="690" cy="501" r="10"/>
  </g>

  <g font-size="45" dominant-baseline="central">
    <text x="260" y="208" textLength="226" lengthAdjust="spacing">大工の息子</text>
    <text x="260" y="306" textLength="318" lengthAdjust="spacing">律法を廃する人</text>
    <text x="260" y="404" textLength="273" lengthAdjust="spacing">罪人たちの友</text>
    <text x="260" y="502" textLength="346" lengthAdjust="spacingAndGlyphs">自分を神と同等な</text>
    <text x="260" y="564.5">立場に</text>
    <text x="710" y="208" textLength="272" lengthAdjust="spacing">祭司長の息子</text>
    <text x="710" y="306" textLength="274" lengthAdjust="spacing">出生時の奇跡</text>
    <text x="710" y="404" textLength="181" lengthAdjust="spacing">修道生活</text>
    <text x="710" y="502" textLength="347" lengthAdjust="spacingAndGlyphs">メシヤではないか</text>
    <text x="710" y="564.5">と問う</text>
  </g>
</svg>
