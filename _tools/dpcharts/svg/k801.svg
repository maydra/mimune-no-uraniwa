<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>② ルカ 18:8</title>

  <!-- ② ルカ 18:8 -->
  <g font-size="26" dominant-baseline="central">
    <text x="32" y="38">②</text>
    <text x="70" y="38" textLength="54" lengthAdjust="spacing">ルカ</text>
    <text x="136" y="38" textLength="59" lengthAdjust="spacing">18:8</text>
  </g>

  <!-- 聖句 -->
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="180" y="103.5" textLength="406" lengthAdjust="spacing">『…人の子が来るとき地上に信仰が</text>
    <text x="186" y="141" textLength="278" lengthAdjust="spacing">見られるであろうか…』</text>
  </g>

  <!-- 空中再臨・地上誕生 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="272.25" cy="204.5" rx="96.25" ry="31.5" fill="#fff" class="paper"/>
    <ellipse cx="272.5" cy="281.5" rx="96.75" ry="31.5" fill="#CDF8F7"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="272" y="204" textLength="123" lengthAdjust="spacing">空中再臨</text>
    <text x="272.5" y="283" textLength="124" lengthAdjust="spacing" fill="#111">地上誕生</text>
  </g>
  <g font-size="25" dominant-baseline="central">
    <text x="385" y="202" textLength="295" lengthAdjust="spacing">すべての信徒たちが信じる</text>
    <text x="388" y="261.5" textLength="257" lengthAdjust="spacing">キリスト教信徒たちも</text>
    <text x="388" y="295.5" textLength="286" lengthAdjust="spacing">ユダヤ人と同じく、不信</text>
  </g>

  <!-- 結論の箱 -->
  <rect x="257" y="348" width="299" height="48" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="406" y="372.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="249" lengthAdjust="spacing">イエスは地上誕生</text>
</svg>
