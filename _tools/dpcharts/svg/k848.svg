<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 東方のその国は、すなわち韓国である</title>

  <!-- 題 -->
  <g font-size="29" dominant-baseline="central">
    <text x="36" y="39" textLength="36" lengthAdjust="spacingAndGlyphs">Ⅲ.</text>
    <text x="84" y="39" textLength="208" lengthAdjust="spacing">東方のその国は</text>
    <text x="291" y="39">、</text>
    <text x="311" y="39" textLength="264" lengthAdjust="spacing">すなわち韓国である</text>
  </g>
  <line x1="84" y1="56" x2="576" y2="56" stroke="currentColor" stroke-width="2.5"/>

  <!-- 灰色の枝（楕円の下に描く） -->
  <g stroke="#8C949A" stroke-width="6" fill="none">
    <path d="M310,144.5 H288 V326 H310"/>
    <line x1="260" y1="235.5" x2="310" y2="235.5"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="199" cy="235" rx="68.5" ry="51" fill="#CDF8F7"/>
    <ellipse cx="361" cy="143.5" rx="56.5" ry="29" fill="#F8F28F"/>
    <ellipse cx="361" cy="235" rx="56.5" ry="29" fill="#CF921C"/>
    <ellipse cx="361" cy="327" rx="56.5" ry="29" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="199" y="235" font-size="28" textLength="114" lengthAdjust="spacing">東洋三国</text>
    <text x="361" y="142.5" font-size="30" textLength="61" lengthAdjust="spacing">韓国</text>
    <text x="362" y="235" font-size="30" textLength="59" lengthAdjust="spacing">日本</text>
    <text x="361" y="327.5" font-size="30" textLength="63" lengthAdjust="spacing">中国</text>
  </g>

  <!-- 右の字 -->
  <g dominant-baseline="central" font-size="27">
    <text x="434" y="127" textLength="230" lengthAdjust="spacing">再臨される東方の</text>
    <text x="434" y="164.5" textLength="85" lengthAdjust="spacing">その国</text>
    <text x="434" y="219" textLength="231" lengthAdjust="spacing">再臨期に全体主義</text>
    <text x="434" y="256" font-size="26" textLength="259" lengthAdjust="spacing">韓国のキリスト教迫害</text>
    <text x="434" y="327" textLength="172" lengthAdjust="spacing">共産化した国</text>
  </g>
</svg>
