<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 十字架の贖罪により救いの摂理は完成されただろうか</title>

  <text x="54.2" y="55" font-size="46" dominant-baseline="central">Ⅱ.</text>
  <text x="137" y="55" font-size="46" dominant-baseline="central" textLength="1104" lengthAdjust="spacing">十字架の贖罪により救いの摂理は完成されただろうか</text>
  <line x1="137" y1="85.5" x2="1241" y2="85.5" stroke="currentColor" stroke-width="4"/>

  <!-- 地上天国？ ＝＝＝＝ 信徒 -->
  <rect x="250.25" y="157.25" width="255.5" height="67.5" rx="13" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <g stroke="#8C949A" stroke-width="4" stroke-dasharray="17 9.67">
    <line x1="556" y1="183.5" x2="653" y2="183.5"/>
    <line x1="556" y1="198.5" x2="653" y2="198.5"/>
  </g>
  <ellipse cx="797" cy="191" rx="98.75" ry="38.75" fill="#FCE5E3" stroke="currentColor" stroke-width="4.5"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="369.5,290.5 385.5,290.5 385.5,269 396,269 377.5,241 359,269 369.5,269"/>
    <polygon points="786.5,246 799.5,246 799.5,279.5 811.5,279.5 793,302.5 774.5,279.5 786.5,279.5"/>
    <polygon points="369,536.5 385,536.5 385,511.5 395.5,511.5 377,484 358.5,511.5 369,511.5"/>
  </g>

  <!-- 十字架 -->
  <g transform="translate(330.0,312.0) scale(0.9400,0.8500)" stroke-width="3.352" fill="#7A5230" stroke="#111" stroke-linejoin="round">
    <path d="M40,0 H60 V42 H100 V60 H60 V180 H40 V60 H0 V42 H40 Z"/>
  </g>

  <ellipse cx="377" cy="578.5" rx="103.75" ry="39.25" fill="#CF921C" stroke="currentColor" stroke-width="4.5"/>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="379.5" y="192.5" font-size="45">地上天国？</text>
    <text x="794" y="191" font-size="48" fill="#111">信徒</text>
    <text x="375" y="578.5" font-size="40" fill="#111">堕落人間</text>
  </g>

  <!-- 右下の箱 -->
  <rect x="563" y="329" width="466" height="283" rx="7" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g font-size="40" dominant-baseline="central">
    <text y="377.5"><tspan x="583">①</tspan><tspan x="634" textLength="373.5" lengthAdjust="spacing">神と一体となれない</tspan></text>
    <text y="439.5"><tspan x="582">②</tspan><tspan x="634">贖罪、</tspan><tspan x="759">祈祷、</tspan></text>
    <text x="634" y="502.5" textLength="249" lengthAdjust="spacing">信仰生活必要</text>
    <text y="565"><tspan x="583">③</tspan><tspan x="634" textLength="166" lengthAdjust="spacing">原罪遺伝</tspan></text>
  </g>
</svg>
