  </g>
  <g transform="translate(447,514) rotate(2.3)">
    <ellipse rx="112" ry="66" fill="#A0F08A"/>
    <path d="M-112,0 Q-47.6,40 0,2.5 Q58.8,-44 112,0 A112,66 0 0 0 -112,0 Z" fill="#F98AEE"/>
