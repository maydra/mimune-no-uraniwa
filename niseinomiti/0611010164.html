      第一節　学校と先生<p>
一　学校とは何か
<p>
教会は天のためのものであり、学校は未来の子孫のためのものです。神様のみ旨は後世のため残すものです。個人を犠牲にし、より大きな後世を願うので、今は滅びても、後世により大きな国と世界が到来することを思い、そのためにあらゆる精誠を尽くすのです。（九六−三三）
<p>
</p></p></p></p>

<details id="typo-report" class="typo-box dark-theme">
  <summary class="typo-title">誤植・修正提案</summary>
  <p class="typo-desc">コメント感覚で送れます（匿名OK）。ページURLは自動で添付されます。</p>
  <form id="typoForm"
        action="https://script.google.com/macros/s/AKfycbzKaBDjVMe5wZgmZ1yQ5We6u3W3E3PGVLthOniv3TQvuopr2bWU_yrYQ1oQucz5NdwH8w/exec"
        method="POST"
        target="typoSink">

    <label class="typo-label" for="typoText">内容（必須）</label>
    <textarea id="typoText" name="typoText" class="typo-textarea" rows="4" required
      placeholder="例：誤字、脱字、年号違い…"></textarea>

    <label class="typo-label" for="typoQuote">該当箇所（任意）</label>
    <textarea id="typoQuote" name="typoQuote" class="typo-textarea" rows="2"
      placeholder="該当文をコピペ（任意）"></textarea>

    <input type="hidden" id="pageUrl" name="pageUrl">
    <input type="hidden" id="whenIso" name="whenIso">
    <input type="hidden" id="userAgent" name="userAgent">

    <label class="typo-label" for="replyEmail">返信が欲しい方は、メールアドレスを入力ください（任意）</label>
    <input type="email" id="replyEmail" name="replyEmail" class="typo-input" placeholder="例：name@example.com">

    <div class="typo-row">
      <button type="submit" id="typoSubmit" class="typo-btn">送信</button>
      <span id="typoStatus" class="typo-status" aria-live="polite"></span>
    </div>
  </form>
  <iframe name="typoSink" id="typoSink" style="display:none;"></iframe>
</details>

<link rel="stylesheet" href="../theme/pages/e631ced897.css?v=202610110220">

<script>
(() => {
  const root = document.querySelector("#typo-report.dark-theme") || document.getElementById("typo-report");
  if(!root) return;
  const form = root.querySelector("#typoForm");
  const sink = root.querySelector("#typoSink");
  const statusEl = root.querySelector("#typoStatus");
  const btn = root.querySelector("#typoSubmit");

  function fillHidden() {
    const pUrl = root.querySelector("#pageUrl");
    const wIso = root.querySelector("#whenIso");
    const uAgent = root.querySelector("#userAgent");
    
    if(pUrl) pUrl.value = location.href;
    if(wIso) wIso.value = new Date().toISOString();
    if(uAgent) uAgent.value = navigator.userAgent;
  }
  fillHidden();

  if(form) {
    form.addEventListener("submit", () => {
      fillHidden();
      if(btn) btn.disabled = true;
      if(statusEl) statusEl.textContent = "送信中…";
    });
  }

  if(sink) {
    sink.addEventListener("load", () => {
      if(btn) btn.disabled = false;
      if(statusEl) statusEl.textContent = "送信しました。ありがとうございます！";
      setTimeout(() => { if(form) form.reset(); }, 200);
    });
  }
})();
</script>
