<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>宗教が無能化したもう一つの主要な原因</title>

  <text x="49" y="80" font-size="48" textLength="900" lengthAdjust="spacing">宗教が無能化したもう一つの主要な原因</text>
  <line x1="49" y1="91.5" x2="949" y2="91.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 宗教から科学的解明追求へ -->
  <ellipse cx="299.3" cy="247" rx="81.8" ry="51" fill="#F98AEE" stroke="currentColor" stroke-width="4.5"/>
  <text x="300" y="247" font-size="48.5" text-anchor="middle" dominant-baseline="central" fill="#111">宗教</text>
  <polygon points="279,346 316,346 316,412.5 332.5,412.5 298.5,437 262,412.5 279,412.5" fill="#8C949A" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <rect x="247.5" y="479.5" width="431" height="87.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="463" y="523" font-size="53" textLength="377" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central" fill="#111">科学的解明追求</text>

  <!-- 箇条 -->
  <circle cx="423.5" cy="192.5" r="13.5"/>
  <circle cx="422.5" cy="293.5" r="13.5"/>
  <text x="451" y="192" font-size="48" textLength="550" lengthAdjust="spacing" dominant-baseline="central">教理の科学的解明が欠如</text>

  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4">
    <rect x="454" y="257" width="261.5" height="73" rx="12"/>
    <rect x="775.5" y="261.5" width="161" height="70" rx="12"/>
    <rect x="1002.5" y="260" width="121" height="70.5" rx="12"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="584" y="294" font-size="46.5" textLength="230" lengthAdjust="spacing">知る<tspan font-weight="400">(認識)</tspan></text>
    <text x="854" y="295.5" font-size="49">信ずる</text>
    <text x="1063.5" y="295" font-size="49.5">実践</text>
  </g>
  <g fill="#8C949A">
    <polygon points="728,287 742,287 742,281.5 768.5,294.5 742,307.5 742,302 728,302"/>
    <polygon points="947,289 964,289 964,283.5 990.5,296.5 964,309.5 964,304 947,304"/>
  </g>

  <g font-size="40.5" dominant-baseline="central">
    <text x="419" y="371" textLength="125.4" lengthAdjust="spacing">論理的</text>
    <text x="544.4" y="371">、</text>
    <text x="586.2" y="371" textLength="125.4" lengthAdjust="spacing">実証的</text>
  </g>
</svg>
