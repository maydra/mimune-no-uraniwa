<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>他宗教の霊人の再臨復活による宗教の統一（キリスト教中心）</title>

  <!-- 左の見出し（縦書き。右の列から読む：他宗教霊人／各宗教地上信徒） -->
  <g font-size="41" text-anchor="middle" dominant-baseline="central">
    <text x="307.5" y="181">他</text>
    <text x="307.5" y="222.5">宗</text>
    <text x="307.5" y="264">教</text>
    <text x="258" y="180.5">霊</text>
    <text x="258" y="222.5">人</text>
    <text x="304.5" y="375.5">各</text>
    <text x="304.5" y="417">宗</text>
    <text x="304.5" y="459">教</text>
    <text x="250" y="375.5">地</text>
    <text x="250" y="417">上</text>
    <text x="250" y="458.5">信</text>
    <text x="250" y="501">徒</text>
  </g>

  <!-- 地上の線と、霊人から地上信徒への矢印 -->
  <line x1="192" y1="319.5" x2="769" y2="319.5" stroke="currentColor" stroke-width="7"/>
  <g stroke="currentColor" stroke-width="8">
    <line x1="407.5" y1="304" x2="407.5" y2="333"/>
    <line x1="549.5" y1="304" x2="549.5" y2="333"/>
    <line x1="689.5" y1="304" x2="689.5" y2="333"/>
  </g>
  <g fill="currentColor">
    <polygon points="396,332 419,332 407.5,353"/>
    <polygon points="538,332 561,332 549.5,353"/>
    <polygon points="678,332 701,332 689.5,353"/>
  </g>

  <!-- 地上信徒から再臨主への弧（楕円より先に描き、始まりを楕円で隠す） -->
  <g stroke="currentColor" stroke-width="6" fill="none">
    <path d="M421,512 C566.4,659.8 849,582.7 862.43,424.93"/>
    <path d="M570,506 C714.1,551.1 815.4,502 834.23,422.5"/>
    <path d="M738,460 C782.1,462.8 797.1,434 804.82,415.55"/>
  </g>
  <g fill="currentColor">
    <polygon points="864,406.5 872.8,427.3 851.8,425.5"/>
    <polygon points="838.5,404.5 844.1,426.4 823.7,421.5"/>
    <polygon points="812,398.5 813.9,421 794.6,412.9"/>
  </g>

  <!-- 他宗教の霊人（灰桃）と各宗教の地上信徒（薄い桃） -->
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="407.25" cy="227.5" rx="47.25" ry="79" fill="#DCC4C4"/>
    <ellipse cx="549.5" cy="227.5" rx="49" ry="79" fill="#DCC4C4"/>
    <ellipse cx="689.5" cy="227.5" rx="49" ry="79" fill="#DCC4C4"/>
    <ellipse cx="407.25" cy="435.5" rx="48.75" ry="79" fill="#FCE5E3"/>
    <ellipse cx="549.5" cy="435.5" rx="49" ry="79" fill="#FCE5E3"/>
    <ellipse cx="689.5" cy="434.5" rx="49" ry="77.5" fill="#FCE5E3"/>
  </g>
  <g font-size="69" dominant-baseline="central" fill="#111">
    <text x="407.5" y="227" text-anchor="middle">A</text>
    <text x="549" y="227.5" text-anchor="middle">B</text>
    <text x="689" y="227.5" text-anchor="middle">C</text>
    <text><tspan x="407" y="438" text-anchor="middle">A</tspan><tspan x="414.9" y="421.8">′</tspan></text>
    <text><tspan x="549" y="439" text-anchor="middle">B</tspan><tspan x="555.4" y="421.8">′</tspan></text>
    <text><tspan x="689" y="436" text-anchor="middle">C</tspan><tspan x="700.9" y="417.3">′</tspan></text>
  </g>

  <!-- 再臨主 -->
  <ellipse cx="842.75" cy="310" rx="58.25" ry="85.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="46" text-anchor="middle" dominant-baseline="central">
    <text x="841.5" y="265.5">再</text>
    <text x="842" y="310.5">臨</text>
    <text x="841.5" y="356">主</text>
  </g>

  <polygon points="918,298.5 960,298.5 960,277.5 999,309.5 960,341.5 960,320.5 918,320.5" fill="#8C949A"/>

  <!-- 宗教の統一 -->
  <rect x="1008" y="163.5" width="73" height="281" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="1044.5" y="216.5">宗</text>
    <text x="1044.5" y="262.5">教</text>
    <text x="1044.5" y="310">の</text>
    <text x="1044.5" y="354">統</text>
    <text x="1044.5" y="400">一</text>
  </g>

  <!-- （キリスト教中心）。2行にまたがる括弧は線で描く -->
  <g stroke="currentColor" stroke-width="3.5" fill="none">
    <path d="M947.5,463.5 Q929.5,513 947.5,562.5"/>
    <path d="M1107.5,464 Q1126.5,514 1107.5,564.5"/>
  </g>
  <g font-size="40" text-anchor="middle" dominant-baseline="central">
    <text x="1029" y="490" textLength="152" lengthAdjust="spacingAndGlyphs">キリスト教</text>
    <text x="1030" y="536" textLength="79" lengthAdjust="spacingAndGlyphs">中心</text>
  </g>
</svg>
