<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>出発のための摂理　ラメセスからスコテへ</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="187,95.5 194.5,109 190,109 190,123 184,123 184,109 179.5,109"/>
    <polygon points="243.5,146.5 257,139 257,143.5 538,143.5 538,149.5 257,149.5 257,154"/>
    <polygon points="211.5,271 217.5,271 217.5,303.5 222.5,303.5 214.5,315 206.5,303.5 211.5,303.5"/>
    <polygon points="211.5,369 217.5,369 217.5,398.5 222.5,398.5 214.5,410 206.5,398.5 211.5,398.5"/>
    <polygon points="364.5,294 384.5,294 384.5,289.5 396.5,297 384.5,304.5 384.5,300 364.5,300"/>
    <polygon points="445.5,384.5 465.5,384.5 465.5,380 478,387.5 465.5,395 465.5,390.5 445.5,390.5"/>
  </g>

  <!-- 神 -->
  <circle cx="187.5" cy="63.5" r="28.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="187.5" y="63" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="187" cy="147.5" rx="51" ry="24" fill="#F8F28F"/>
    <ellipse cx="613.5" cy="146.5" rx="74.5" ry="36.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="187.5" y="148.5" font-size="29" textLength="78" lengthAdjust="spacing">モーセ</text>
    <text x="614.5" y="133" font-size="27" textLength="132" lengthAdjust="spacing">イスラエル</text>
    <text x="612.5" y="164.5" font-size="25" textLength="50" lengthAdjust="spacing">民族</text>
  </g>

  <!-- 実体基台・出発のための摂理 -->
  <rect x="326" y="89" width="132" height="42" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="392.5" y="111" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="113" lengthAdjust="spacing">実体基台</text>
  <rect x="277" y="158" width="241" height="43" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="398.5" y="180.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="210" lengthAdjust="spacing" fill="#111">出発のための摂理</text>

  <!-- ラメセス・スコテ -->
  <g fill="#DCC4C4" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="214.5" cy="245" rx="78.5" ry="25"/>
    <ellipse cx="215.5" cy="343" rx="78.5" ry="25"/>
  </g>
  <g font-size="33" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="214.5" y="245.5" textLength="130" lengthAdjust="spacing">ラメセス</text>
    <text x="214.5" y="343.5" textLength="92" lengthAdjust="spacing">スコテ</text>
  </g>

  <!-- 添え書き -->
  <g font-size="24" dominant-baseline="central">
    <text x="304" y="249.5" textLength="49" lengthAdjust="spacing">正月</text>
    <text x="365" y="249.5" textLength="24" lengthAdjust="spacingAndGlyphs">15</text>
    <text x="398" y="249.5">日</text>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="253" y="296.5" textLength="104" lengthAdjust="spacing">三日期間</text>
    <text x="404" y="296.5" textLength="261" lengthAdjust="spacing">イエスの復活三日期間</text>
    <text x="251" y="388" textLength="184" lengthAdjust="spacing">雲の柱、火の柱</text>
    <text x="489" y="388" textLength="157" lengthAdjust="spacing">イエス、聖霊</text>
  </g>
</svg>
