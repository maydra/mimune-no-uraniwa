<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>[創 11:7] バベルの塔　神は言語を混乱させてしまわれる</title>

  <text x="147" y="51" font-size="28" dominant-baseline="central" textLength="119" lengthAdjust="spacingAndGlyphs">[創 11:7]</text>

  <!-- 灰色の矢印（楕円・円の下に描く） -->
  <g stroke="#8C949A" stroke-width="6.5">
    <line x1="410.5" y1="160" x2="410.5" y2="127"/>
    <line x1="408.5" y1="273" x2="408.5" y2="250"/>
  </g>
  <g stroke="#8C949A" stroke-width="6">
    <line x1="307" y1="272" x2="360.6" y2="234.1"/>
    <line x1="510.5" y1="272" x2="456.9" y2="234.1"/>
  </g>
  <g fill="#8C949A">
    <polygon points="410.5,113 419,128.5 402,128.5"/>
    <polygon points="409,239.5 418,252 400,252"/>
    <polygon points="370,227.5 364.7,241.6 354.9,227.8"/>
    <polygon points="447.5,227.5 462.6,227.8 452.8,241.6"/>
  </g>

  <!-- サタン -->
  <ellipse cx="410.5" cy="78.5" rx="43.8" ry="28.8" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <text x="410" y="79" font-size="23" text-anchor="middle" dominant-baseline="central" fill="#fff">サタン</text>

  <!-- バベルの塔 -->
  <ellipse cx="409.5" cy="196" rx="52.8" ry="39.3" fill="#CF921C" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="407.5" y="184" font-size="25" textLength="78" lengthAdjust="spacing">バベル</text>
    <text x="408.5" y="213" font-size="26">の塔</text>
  </g>

  <!-- セム・ハム・ヤペテ -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="291.5" cy="300" rx="28.8" ry="25.3"/>
    <ellipse cx="408.5" cy="300" rx="28.8" ry="25.3"/>
    <ellipse cx="523.5" cy="300" rx="28.8" ry="25.3"/>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central">
    <text x="291.5" y="300.5">セム</text>
    <text x="408.5" y="300.5">ハム</text>
    <text x="523.5" y="300.5" textLength="48" lengthAdjust="spacingAndGlyphs">ヤペテ</text>
  </g>

  <!-- 入れ替わりの印を × で消す -->
  <g>
    <path d="M338.5,293 Q343.5,284 356.5,286" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <polygon points="360,282 367,291 354.5,291"/>
    <path d="M364.5,304 Q359.5,313 346.5,311" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <polygon points="343,315 336,306 348.5,306"/>
    <path d="M454.5,293 Q459.5,284 472.5,286" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <polygon points="476,282 483,291 470.5,291"/>
    <path d="M480.5,304 Q475.5,313 462.5,311" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <polygon points="459,315 452,306 464.5,306"/>
  </g>
  <g stroke="currentColor" stroke-width="3.5">
    <line x1="344" y1="276" x2="355.5" y2="326.5"/>
    <line x1="357" y1="276" x2="345" y2="326.5"/>
    <line x1="460" y1="276" x2="471.5" y2="326.5"/>
    <line x1="473" y1="276" x2="461" y2="326.5"/>
  </g>

  <text x="194" y="367" font-size="28" dominant-baseline="central" textLength="430" lengthAdjust="spacing">神は言語を混乱させてしまわれる</text>
</svg>
