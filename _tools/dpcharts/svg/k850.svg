<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>1. この国は蕩減復帰の民族的な基台を立てなければならない</title>

  <!-- 題 -->
  <g font-size="27.5" dominant-baseline="central">
    <text x="34" y="39" textLength="24" lengthAdjust="spacingAndGlyphs">1.</text>
    <text x="70" y="39" textLength="725" lengthAdjust="spacing">この国は蕩減復帰の民族的な基台を立てなければならない</text>
  </g>
  <line x1="67" y1="57.5" x2="799" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 韓国 -->
  <ellipse cx="184.5" cy="111" rx="52" ry="34" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <text x="184.5" y="110.5" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="60" lengthAdjust="spacing">韓国</text>

  <g font-size="27" dominant-baseline="central">
    <text x="258" y="110" text-anchor="middle">：</text>
    <text x="272" y="110" textLength="317" lengthAdjust="spacing">メシヤを迎え得る国か？</text>
    <text x="275" y="156" text-anchor="end">「</text>
    <text x="273" y="156" textLength="29" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="313" y="156" textLength="371" lengthAdjust="spacing">日サタン分立の民族的な基台</text>
    <text x="684" y="156">」</text>
    <text x="259" y="196" textLength="259" lengthAdjust="spacing">第三イスラエル選民</text>
  </g>

  <!-- 三つのイスラエル -->
  <g font-size="26" dominant-baseline="central">
    <text x="125" y="256.5" textLength="53" lengthAdjust="spacing">旧約</text>
    <text x="191.5" y="256.5" text-anchor="middle">：</text>
    <text x="207" y="256.5" textLength="218" lengthAdjust="spacing">アブラハムの子孫</text>
    <text x="123" y="315" textLength="125" lengthAdjust="spacing">復活イエス</text>
    <text x="261.5" y="315" text-anchor="middle">：</text>
    <text x="275" y="315" textLength="175" lengthAdjust="spacing">キリスト教信徒</text>
    <text x="123" y="373" textLength="87" lengthAdjust="spacing">再臨主</text>
    <text x="224" y="373" text-anchor="middle">：</text>
    <text x="239" y="373" textLength="116" lengthAdjust="spacing">韓国民族</text>
  </g>
  <g stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <line x1="434.5" y1="256.5" x2="486.5" y2="256.5" stroke-dasharray="0 7.43"/>
    <line x1="458.5" y1="315.5" x2="484" y2="315.5" stroke-dasharray="0 8.5"/>
    <line x1="360.5" y1="373.5" x2="484" y2="373.5" stroke-dasharray="0 7.265"/>
  </g>

  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="594.5" cy="256" rx="100" ry="23" fill="#DCC4C4"/>
    <ellipse cx="594.5" cy="315" rx="100" ry="23" fill="#F8F28F"/>
    <ellipse cx="594.5" cy="373.5" rx="100" ry="23" fill="#fff" class="paper"/>
  </g>
  <g font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="596" y="254.5" fill="#111" textLength="170" lengthAdjust="spacing">第一イスラエル</text>
    <text x="596" y="313.5" fill="#111" textLength="170" lengthAdjust="spacing">第二イスラエル</text>
    <text x="598" y="372" textLength="170" lengthAdjust="spacing">第三イスラエル</text>
  </g>
</svg>
