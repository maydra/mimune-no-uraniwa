<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑩ ルカ 17:33　地上誕生</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="34" y="38">⑩</text>
    <text x="73" y="38" textLength="57" lengthAdjust="spacing">ルカ</text>
    <text x="138" y="38" textLength="71" lengthAdjust="spacing">17:33</text>
  </g>

  <!-- 聖句（細字） -->
  <g font-size="26.5" font-weight="400" dominant-baseline="central">
    <text y="154"><tspan x="149">『</tspan><tspan x="162" textLength="374.2" lengthAdjust="spacing">自分の命を救おうとするものは</tspan><tspan x="536.3">、</tspan><tspan x="563" textLength="80.2" lengthAdjust="spacing">それを</tspan></text>
    <text y="194"><tspan x="159" textLength="51" lengthAdjust="spacing">失い</tspan><tspan x="212">、</tspan><tspan x="237" textLength="210" lengthAdjust="spacing">それを失うものは</tspan><tspan x="446">、</tspan><tspan x="472" textLength="167" lengthAdjust="spacing">保つのである』</tspan></text>
  </g>

  <!-- 地上誕生 -->
  <ellipse cx="225.5" cy="310.5" rx="86.5" ry="31" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="226" y="311" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="126" lengthAdjust="spacing">地上誕生</text>

  <!-- 右の字 -->
  <g font-size="29" dominant-baseline="central">
    <text x="330" y="268" textLength="289" lengthAdjust="spacing">彼は異端者としてしか</text>
    <text y="307.5"><tspan x="330" textLength="86" lengthAdjust="spacing">見えず</tspan><tspan x="416">、</tspan><tspan x="444.8" textLength="114.8" lengthAdjust="spacing">彼を信じ</tspan><tspan x="559.6">、</tspan></text>
    <text y="347"><tspan x="330" textLength="172.2" lengthAdjust="spacing">従うためには</tspan><tspan x="502.2">、</tspan><tspan x="531" textLength="114.8" lengthAdjust="spacing">死を覚悟</tspan></text>
  </g>
</svg>
