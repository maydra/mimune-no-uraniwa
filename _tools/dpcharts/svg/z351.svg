<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>み言で審判される理由</title>

  <text x="53" y="56" font-size="50" dominant-baseline="central" textLength="500" lengthAdjust="spacing">み言で審判される理由</text>
  <line x1="53" y1="86.5" x2="553" y2="86.5" stroke="currentColor" stroke-width="4"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="377,190 390,190 390,339.5 400.5,339.5 383.5,368 366.5,339.5 377,339.5"/>
    <polygon points="916,190 929,190 929,344 939,344 922.5,371.7 906,344 916,344"/>
    <polygon points="517,399.5 759.5,399.5 759.5,389.5 787.5,405 759.5,420.5 759.5,411 517,411"/>
    <polygon points="783,427 541,427 541,416.5 513,432.5 541,448.5 541,438 783,438"/>
  </g>

  <!-- 神 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5">
    <circle cx="383.5" cy="147" r="49.75"/>
    <circle cx="921.5" cy="146.5" r="49.75"/>
    <rect x="265" y="227.5" width="240" height="59.5"/>
    <rect x="781" y="227.5" width="285.5" height="58.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="58">
      <text x="384" y="146.5">神</text>
      <text x="920" y="146">神</text>
    </g>
    <g font-size="42">
      <text x="386" y="258.5">み言で創造</text>
      <text x="924" y="257.5">み言で再創造</text>
    </g>
  </g>
  <text y="312.5" font-size="34" dominant-baseline="central"><tspan x="396" textLength="118.5" lengthAdjust="spacingAndGlyphs">(ヨハネ </tspan><tspan x="514.5" textLength="62" lengthAdjust="spacingAndGlyphs">1:3)</tspan></text>

  <!-- 人間・堕落人間 -->
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="381.5" cy="412.5" rx="64.5" ry="39.5" fill="#FCE5E3"/>
    <ellipse cx="923.5" cy="414" rx="71.5" ry="40" fill="#CF921C"/>
  </g>
  <g font-size="44.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="379.5" y="413">人間</text>
    <text x="891 955.5" y="414">堕人</text>
  </g>
  <circle cx="923.5" cy="414" r="5.75" fill="#111"/>
  <text x="379.5" y="486.5" font-size="41.5" text-anchor="middle" dominant-baseline="central">み言の実体</text>

  <!-- 堕落・復帰摂理 -->
  <g font-size="37" text-anchor="middle" dominant-baseline="central">
    <text x="659" y="371">堕落</text>
    <text x="658.5" y="466">復帰摂理</text>
  </g>

  <!-- 結論 -->
  <rect x="255" y="532.5" width="819.5" height="127.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g fill="#111">
    <circle cx="288" cy="569" r="8.5"/>
    <circle cx="287" cy="623" r="8.5"/>
  </g>
  <g font-size="41.5" dominant-baseline="central" fill="#111">
    <text y="568"><tspan x="308.5" textLength="140" lengthAdjust="spacingAndGlyphs">イエスは</tspan><tspan x="447">、</tspan><tspan x="484" textLength="389" lengthAdjust="spacingAndGlyphs">み言の完成者として再臨</tspan><tspan x="880.5" font-size="36" textLength="102" lengthAdjust="spacingAndGlyphs">(ヨハネ </tspan><tspan x="982.5" font-size="36" textLength="68" lengthAdjust="spacingAndGlyphs">1:14)</tspan></text>
    <text x="307.5" y="622.5" font-size="41" textLength="248.5" lengthAdjust="spacing">審判もみ言で</text>
  </g>
</svg>
