<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人類を新しい世界へ、主義・思想・宗教と心と体・夫婦を統一へ</title>

  <!-- ● -->
  <g>
    <circle cx="245.5" cy="125.5" r="14"/>
    <circle cx="245.5" cy="353.5" r="14"/>
    <circle cx="245.5" cy="558.5" r="14"/>
  </g>

  <!-- 左 -->
  <ellipse cx="384.5" cy="125" rx="104" ry="66" fill="#FCE5E3" stroke="currentColor" stroke-width="4.5"/>
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="284.5" y="259.5" width="201.5" height="194.5" rx="8" fill="#CF921C"/>
    <rect x="283.5" y="487" width="201" height="141.5" rx="8" fill="#CF921C"/>
  </g>
  <g fill="#111" text-anchor="middle" dominant-baseline="central">
    <text x="385" y="126" font-size="53" textLength="108" lengthAdjust="spacing">人類</text>
    <g font-size="51">
      <text x="386.5" y="297" textLength="105" lengthAdjust="spacing">主義</text>
      <text x="386.5" y="356.5" textLength="105" lengthAdjust="spacing">思想</text>
      <text x="386.5" y="415.5" textLength="105" lengthAdjust="spacing">宗教</text>
      <text x="386" y="526.5" textLength="156" lengthAdjust="spacing">心と体</text>
      <text x="384" y="590" textLength="102" lengthAdjust="spacing">夫婦</text>
    </g>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="506,118.5 791,118.5 791,108 827,126 791,144 791,133.5 506,133.5"/>
    <polygon points="506,345.5 791,345.5 791,335 827,353 791,371 791,360.5 506,360.5"/>
    <polygon points="506,550.5 791,550.5 791,540 827,558 791,576 791,565.5 506,565.5"/>
  </g>

  <!-- ●唯心論 昇華 ／ ●唯物論 吸収 -->
  <g>
    <circle cx="528" cy="176.5" r="12.5"/>
    <circle cx="528" cy="237.5" r="12.5"/>
  </g>
  <g font-size="45" dominant-baseline="central">
    <text y="178.5"><tspan x="549">唯心論</tspan><tspan x="709">昇華</tspan></text>
    <text y="236.5"><tspan x="549">唯物論</tspan><tspan x="710">吸収</tspan></text>
  </g>

  <!-- 右 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="4.5">
    <rect x="847" y="64" width="213" height="123.5" rx="13"/>
    <rect x="847" y="292" width="213" height="123.5" rx="13"/>
    <rect x="847" y="496" width="213" height="123.5" rx="13"/>
  </g>
  <g fill="#111" text-anchor="middle" dominant-baseline="central">
    <g font-size="50">
      <text x="953.5" y="100" textLength="150" lengthAdjust="spacing">新しい</text>
      <text x="953.5" y="156.5" textLength="100" lengthAdjust="spacing">世界</text>
    </g>
    <g font-size="56">
      <text x="954" y="353.5" textLength="115" lengthAdjust="spacing">統一</text>
      <text x="953.5" y="557.5" textLength="115" lengthAdjust="spacing">統一</text>
    </g>
  </g>
</svg>
