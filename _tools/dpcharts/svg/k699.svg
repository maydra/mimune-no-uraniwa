<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>理想社会の構造（立法・司法・行政）と人間一人の構造（肺臓・心臓・胃腸）</title>

  <!-- 枝分かれの線（楕円の下に描く） -->
  <g stroke="#8C949A" stroke-width="5.5" fill="none">
    <line x1="227" y1="250" x2="167" y2="312"/>
    <line x1="261.5" y1="255" x2="261.5" y2="312"/>
    <line x1="296.5" y1="250" x2="356" y2="312"/>
    <line x1="529" y1="230" x2="464" y2="314"/>
    <line x1="562.5" y1="235" x2="562.5" y2="312"/>
    <line x1="588.5" y1="230" x2="659" y2="310"/>
  </g>

  <!-- 小さい矢印 -->
  <g fill="#8C949A">
    <polygon points="256,128 262,128 262,149 266,149 259,161.5 252,149 256,149"/>
    <polygon points="557,128 563,128 563,158 567,158 560,170.5 553,158 557,158"/>
  </g>

  <!-- 左向きの太い矢印 -->
  <polygon points="435.5,191.5 419,191.5 419,180.5 399.5,205.5 419,229 419,219 435.5,219" fill="#8C949A" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- 神・頭脳 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <circle cx="260.5" cy="99.5" r="32.2"/>
    <ellipse cx="560.5" cy="99" rx="40.2" ry="32.7"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="258.5" y="99.5" font-size="36">神</text>
    <text x="560" y="99" font-size="29" textLength="62" lengthAdjust="spacing">頭脳</text>
  </g>

  <!-- 信徒（政党）とキリスト、末梢神経 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="260.1" cy="213.5" rx="99.9" ry="49.5" fill="#F86D42"/>
    <ellipse cx="258.75" cy="189.75" rx="70.75" ry="26" fill="#F8F28F"/>
    <ellipse cx="562" cy="206" rx="79.8" ry="33.8" fill="#F86D42"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="258" y="190.5" font-size="25" text-anchor="middle" textLength="110" lengthAdjust="spacing">キリスト</text>
    <text y="234" font-size="28"><tspan x="188" textLength="59" lengthAdjust="spacing">信徒</tspan><tspan x="247">（</tspan><tspan x="261" textLength="58" lengthAdjust="spacing">政党</tspan><tspan x="319">）</tspan></text>
    <text x="562.5" y="205.5" font-size="29" text-anchor="middle" textLength="125" lengthAdjust="spacing">末梢神経</text>
  </g>

  <!-- 下の楕円 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="158.5" cy="331.75" rx="39.5" ry="25.25"/>
    <ellipse cx="260.5" cy="333" rx="39.5" ry="25"/>
    <ellipse cx="365" cy="334.25" rx="39.5" ry="25.25"/>
    <ellipse cx="461.5" cy="335.5" rx="38.5" ry="25.5"/>
    <ellipse cx="565.25" cy="333.5" rx="39.25" ry="24.5"/>
    <ellipse cx="664.5" cy="331.5" rx="39.5" ry="24.5"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="159" y="332" textLength="58" lengthAdjust="spacing">立法</text>
    <text x="261.5" y="333.5" textLength="57" lengthAdjust="spacing">司法</text>
    <text x="365.5" y="334.5" textLength="57" lengthAdjust="spacing">行政</text>
    <text x="462" y="336.5" textLength="58" lengthAdjust="spacing">肺臓</text>
    <text x="566" y="334" textLength="58" lengthAdjust="spacing">心臓</text>
    <text x="666" y="332" textLength="56" lengthAdjust="spacing">胃腸</text>
  </g>

  <!-- 間の回る矢印（右回りの弧2本） -->
  <g stroke="currentColor" stroke-width="2.6" fill="none">
    <g transform="translate(210,331)"><path d="M-9.5,-6.5 C-7,-11.5 1,-12.5 5,-8.5"/><path d="M9.5,6.5 C7,11.5 -1,12.5 -5,8.5"/></g>
    <g transform="translate(312.5,333)"><path d="M-9.5,-6.5 C-7,-11.5 1,-12.5 5,-8.5"/><path d="M9.5,6.5 C7,11.5 -1,12.5 -5,8.5"/></g>
    <g transform="translate(512.5,333)"><path d="M-9.5,-6.5 C-7,-11.5 1,-12.5 5,-8.5"/><path d="M9.5,6.5 C7,11.5 -1,12.5 -5,8.5"/></g>
    <g transform="translate(614.5,331) scale(0.8,1)"><path d="M-9.5,-6.5 C-7,-11.5 1,-12.5 5,-8.5"/><path d="M9.5,6.5 C7,11.5 -1,12.5 -5,8.5"/></g>
  </g>
  <g>
    <g transform="translate(210,331)"><polygon points="2,-7 8.5,-12.5 9.8,-4"/><polygon points="-2,7 -8.5,12.5 -9.8,4"/></g>
    <g transform="translate(312.5,333)"><polygon points="2,-7 8.5,-12.5 9.8,-4"/><polygon points="-2,7 -8.5,12.5 -9.8,4"/></g>
    <g transform="translate(512.5,333)"><polygon points="2,-7 8.5,-12.5 9.8,-4"/><polygon points="-2,7 -8.5,12.5 -9.8,4"/></g>
    <g transform="translate(614.5,331) scale(0.8,1)"><polygon points="2,-7 8.5,-12.5 9.8,-4"/><polygon points="-2,7 -8.5,12.5 -9.8,4"/></g>
  </g>
</svg>
