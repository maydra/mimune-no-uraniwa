<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヨシュアを中心とする実体基台　三日路程からギルガルへ</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="165.5,68.5 172,81 168.5,81 168.5,103 162.5,103 162.5,81 159,81"/>
    <polygon points="208,157.5 221,150.5 221,154.5 559,154.5 559,160.5 221,160.5 221,164.5"/>
    <polygon points="373.5,260 384.5,260 384.5,273.5 389.5,273.5 379,283 368.5,273.5 373.5,273.5"/>
    <polygon points="373.5,328 384.5,328 384.5,340.5 389.5,340.5 379,350 368.5,340.5 373.5,340.5"/>
    <polygon points="375.5,395 381.5,395 381.5,415 386.5,415 378.5,428.5 370.5,415 375.5,415"/>
  </g>

  <!-- 神 -->
  <circle cx="166.5" cy="40" r="24.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="166.5" y="40.5" font-size="30" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- モーセ・ヨシュア・内的イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="165.5" cy="119.5" rx="39" ry="18" fill="#F8F28F"/>
    <ellipse cx="165.5" cy="157.5" rx="39" ry="18" fill="#F8F28F"/>
    <ellipse cx="625.5" cy="157" rx="69" ry="48.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="164.5" y="119" font-size="21" textLength="60" lengthAdjust="spacing">モーセ</text>
    <text x="165" y="158" font-size="18" textLength="58" lengthAdjust="spacing">ヨシュア</text>
    <g font-size="24">
      <text x="627" y="131" textLength="48" lengthAdjust="spacing">内的</text>
      <text x="626.5" y="158" textLength="118" lengthAdjust="spacing">イスラエル</text>
      <text x="627" y="186" textLength="48" lengthAdjust="spacing">民族</text>
    </g>
  </g>

  <!-- 実体基台 -->
  <rect x="313" y="101" width="137" height="44" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="381.5" y="123" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="113" lengthAdjust="spacing">実体基台</text>

  <!-- 出発のための摂理：○ -->
  <rect x="245" y="168.5" width="271" height="39.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="24" dominant-baseline="central" fill="#111">
    <text x="261" y="188" textLength="190" lengthAdjust="spacing">出発のための摂理</text>
    <text x="463.5" y="188" text-anchor="middle">：</text>
  </g>
  <circle cx="488.5" cy="187.5" r="10" fill="none" stroke="#111" stroke-width="3"/>

  <!-- 三日路程・ヨルダン河・ギルガル -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="378.5" cy="238.5" rx="81" ry="21"/>
    <ellipse cx="378.5" cy="308" rx="81" ry="21"/>
    <ellipse cx="378.5" cy="375" rx="81" ry="21"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="382" y="238.5" font-size="26" textLength="100" lengthAdjust="spacing">三日路程</text>
    <text x="380.5" y="308.5" font-size="25" textLength="113" lengthAdjust="spacing">ヨルダン河</text>
    <text x="382" y="375.5" font-size="26" textLength="100" lengthAdjust="spacing">ギルガル</text>
  </g>

  <!-- 添え書き -->
  <g font-size="25" dominant-baseline="central">
    <text x="471" y="273" textLength="103" lengthAdjust="spacing">契約の箱</text>
    <text x="470" y="335.5" textLength="103" lengthAdjust="spacing">分かれる</text>
    <text x="476" y="400" textLength="24" lengthAdjust="spacingAndGlyphs">12</text>
    <text x="504" y="400" textLength="51" lengthAdjust="spacing">の石</text>
  </g>
</svg>
