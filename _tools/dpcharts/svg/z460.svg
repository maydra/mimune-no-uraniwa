<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ユダヤ人：洗礼ヨハネを信じ、イエスを不信</title>

  <!-- 矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="501,193.5 739.5,193.5 739.5,204 766.5,187.5 739.5,171 739.5,181.5 501,181.5"/>
    <polygon points="766,226 528.5,226 528.5,215.5 501,232 528.5,248.5 528.5,238 766,238"/>
    <polygon points="572,511.2 427,301.3 438.7,293.2 401,275.5 404.2,317.1 415.9,309 560.8,518.8"/>
    <polygon points="692.3,518.9 840.5,312.2 852.1,320.5 856,279 818,296 829.5,304.3 681.3,511.1"/>
  </g>
  <!-- × -->
  <path d="M612,208.5 L651,258.5 M651,208.5 L612,258.5" stroke="currentColor" stroke-width="8"/>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="324.5" cy="209.5" rx="122" ry="66" fill="#F8F28F"/>
    <ellipse cx="956" cy="209.5" rx="146" ry="66" fill="#F86D42"/>
    <ellipse cx="631.5" cy="551.5" rx="141" ry="60" fill="#FCE5E3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="324.5" y="209.5" font-size="48" textLength="144" lengthAdjust="spacing">イエス</text>
    <text x="956" y="209.5" font-size="49" textLength="245" lengthAdjust="spacing">洗礼ヨハネ</text>
    <text x="631.5" y="551" font-size="48" textLength="194" lengthAdjust="spacing">ユダヤ人</text>
  </g>

  <g dominant-baseline="central">
    <text x="584" y="140" font-size="46" textLength="96" lengthAdjust="spacing">証言</text>
    <text x="580" y="310" font-size="46" textLength="97" lengthAdjust="spacing">否認</text>
    <text x="243" y="317.5" font-size="48" textLength="145" lengthAdjust="spacing">妄言者</text>
    <text x="339" y="428" font-size="47" textLength="97" lengthAdjust="spacing">不信</text>
    <text x="837" y="419.5" font-size="47" text-anchor="middle">信</text>
  </g>
</svg>
