<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>実体基台（洗礼ヨハネとユダヤ民族）</title>

  <text x="39" y="36" font-size="28" dominant-baseline="central" textLength="31" lengthAdjust="spacing">2.</text>
  <text x="78" y="36" font-size="28" dominant-baseline="central" textLength="116" lengthAdjust="spacing">実体基台</text>
  <line x1="78" y1="54" x2="193" y2="54" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="205.5,152 212.5,162 209,162 209,191 203,191 203,162 199,162"/>
    <polygon points="290,230.5 302,223 302,227 549,227 549,233.5 302,233.5 302,238"/>
  </g>

  <!-- 神 -->
  <circle cx="206" cy="116" r="32" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <text x="205" y="115.5" font-size="37" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 洗礼ヨハネ・ユダヤ民族 -->
  <g stroke="currentColor" stroke-width="2.4">
    <ellipse cx="206" cy="230" rx="74.8" ry="27.8" fill="#F8F28F"/>
    <ellipse cx="620" cy="230" rx="70.3" ry="36.3" fill="#F86D42"/>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="206.5" y="231" textLength="124" lengthAdjust="spacing">洗礼ヨハネ</text>
    <text x="621" y="231" textLength="125" lengthAdjust="spacing">ユダヤ民族</text>
  </g>
  <text x="211.5" y="277" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="169" lengthAdjust="spacing">（モーセの立場）</text>

  <!-- 括弧と2行 -->
  <path d="M159,330.5 H142.8 V378.5 H159" fill="none" stroke="#8C949A" stroke-width="5.5"/>
  <g font-size="28" dominant-baseline="central">
    <text x="168.5" y="331.5" textLength="448" lengthAdjust="spacing">父母の立場：「信仰基台」蕩減復帰</text>
    <text x="168.5" y="378.5" textLength="433" lengthAdjust="spacing">子女の立場：アベルの立場を確立</text>
  </g>
</svg>
