<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神と被造世界との関係要約</title>
  <defs>
    <marker id="z073-g" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <text x="49" y="76" font-size="48" textLength="600" lengthAdjust="spacing">神と被造世界との関係要約</text>
  <line x1="49" y1="87.5" x2="649" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <text x="325" y="202" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="44" dominant-baseline="central">
    <text x="222" y="553" textLength="227" lengthAdjust="spacing">無形の主体</text>
    <text x="598" y="579" textLength="228" lengthAdjust="spacing">個性真理体</text>
    <text x="863" y="130" textLength="181" lengthAdjust="spacing">被造世界</text>
    <text x="869" y="632" textLength="180" lengthAdjust="spacing">実体対象</text>
  </g>

  <!-- 神の円（上が本性相、下が本形状） -->
  <path d="M212.5,389.5 c19.32,12.04 37.81,23.5 59.25,23.5 c21.44,0 39.93,-11.46 59.25,-23.5 c19.32,-12.04 37.81,-23.5 59.25,-23.5 c21.44,0 39.93,11.46 59.25,23.5 A118.5,118.5 0 0 0 212.5,389.5 Z" fill="#F98AEE"/>
