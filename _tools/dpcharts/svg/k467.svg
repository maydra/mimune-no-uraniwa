<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>例：② ヤコブ</title>

  <!-- 例：② ヤコブ -->
  <g font-size="28" dominant-baseline="central">
    <text x="129" y="36.5" textLength="28" lengthAdjust="spacingAndGlyphs">例</text>
    <text x="173" y="36.5" text-anchor="middle">：</text>
    <text x="201.5" y="36.5" font-size="20" text-anchor="middle">2</text>
    <text x="224" y="36.5" textLength="84" lengthAdjust="spacing">ヤコブ</text>
  </g>
  <circle cx="201.5" cy="36.5" r="12.5" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦的な蕩減条件（縦の札） -->
  <rect x="178.5" y="89.5" width="46" height="233" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="202" y="120">縦</text>
    <text x="202" y="149">的</text>
    <text x="202" y="178">な</text>
    <text x="202" y="207">蕩</text>
    <text x="202" y="236">減</text>
    <text x="202" y="265">条</text>
    <text x="202" y="294">件</text>
  </g>

  <!-- 白抜きの下向きの矢印（12代） -->
  <polygon points="272,131 340.5,131 340.5,244.5 358.5,244.5 306.5,290 256.5,244.5 272,244.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="305" y="183.5" font-size="32">12</text>
    <text x="306.5" y="215.5" font-size="30">代</text>
  </g>

  <!-- ノア・ヤコブ -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="306.7" cy="102.5" rx="53.7" ry="28"/>
    <ellipse cx="306" cy="323.2" rx="54.5" ry="27.3"/>
  </g>
  <g font-size="25" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="307.5" y="102" textLength="51" lengthAdjust="spacing">ノア</text>
    <text x="306" y="323" textLength="76" lengthAdjust="spacing">ヤコブ</text>
  </g>

  <!-- 白抜きの右向きの矢印（12人子息・12部族） -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <polygon points="362,293 459,293 459,280.5 499,318.5 459,357.5 459,344 362,344"/>
    <polygon points="501.5,292.5 599,292.5 599,279.5 639.5,318.5 599,357.5 599,343.5 501.5,343.5"/>
  </g>
  <g font-size="29" dominant-baseline="central">
    <text y="320"><tspan x="373" textLength="27" lengthAdjust="spacingAndGlyphs">12</tspan><tspan x="407" font-size="26" textLength="67" lengthAdjust="spacingAndGlyphs">人子息</tspan></text>
    <text y="319.5"><tspan x="513" textLength="29" lengthAdjust="spacingAndGlyphs">12</tspan><tspan x="551" font-size="27" textLength="56" lengthAdjust="spacing">部族</tspan></text>
  </g>

  <!-- 横的に蕩減復帰 -->
  <rect x="359.5" y="366.5" width="239" height="40" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="379" y="386.5" font-size="27" dominant-baseline="central" fill="#111" textLength="199" lengthAdjust="spacing">横的に蕩減復帰</text>
</svg>
