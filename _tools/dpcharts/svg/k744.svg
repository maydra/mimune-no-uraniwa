<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. 全体主義とは何か</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="33" y="40">2.</text>
    <text x="73" y="40" textLength="251" lengthAdjust="spacing">全体主義とは何か</text>
  </g>
  <line x1="72" y1="58.5" x2="324" y2="58.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 左の楕円と札 -->
  <ellipse cx="224" cy="118" rx="70.5" ry="36.5" fill="#CF921C" stroke="currentColor" stroke-width="2.5"/>
  <text x="225" y="118.5" font-size="29" text-anchor="middle" dominant-baseline="central" textLength="117" lengthAdjust="spacing" fill="#111">全体主義</text>
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="2.5">
    <rect x="184.5" y="218.5" width="76" height="46"/>
    <rect x="184.5" y="336.5" width="77" height="48"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="222" y="241.5" textLength="56" lengthAdjust="spacing">否定</text>
    <text x="222.5" y="360.5" textLength="56" lengthAdjust="spacing">主張</text>
  </g>

  <!-- 括弧 -->
  <g fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M324,75.5 H313 V166 H324"/>
    <path d="M323,201.5 H312 V279 H323"/>
    <path d="M323,327 H311 V398 H323"/>
  </g>

  <!-- 右の字 -->
  <g font-size="27" dominant-baseline="central">
    <text x="334" y="84.5">伊</text>
    <text x="375.5" y="84.5" text-anchor="middle">：</text>
    <text x="392" y="84.5" textLength="170" lengthAdjust="spacing">ムッソリーニ</text>
    <text x="334" y="122.5">独</text>
    <text x="375.5" y="122.5" text-anchor="middle">：</text>
    <text x="392" y="122.5" textLength="141" lengthAdjust="spacing">ヒットラー</text>
    <text x="336" y="161">日</text>
    <text x="375.5" y="161" text-anchor="middle">：</text>
    <text x="392" y="161" textLength="55" lengthAdjust="spacing">軍閥</text>
    <text x="334" y="205" font-size="29" textLength="269" lengthAdjust="spacing">民主主義政治思想：</text>
    <text x="334" y="326" font-size="29" textLength="143" lengthAdjust="spacing">政治理念：</text>
  </g>
  <g font-size="27" font-weight="400" dominant-baseline="central">
    <text x="333" y="243.5" textLength="298" lengthAdjust="spacing">個性尊重、自由・人権、</text>
    <text x="334" y="277.5" textLength="113" lengthAdjust="spacing">議会制度</text>
    <text x="334" y="364.5" textLength="286" lengthAdjust="spacing">全体だけが究極の実在</text>
    <text x="333" y="398.5" textLength="315" lengthAdjust="spacing">個人や団体は全体のため</text>
  </g>
</svg>
