<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>例：① アブラハム</title>

  <!-- 例：① アブラハム -->
  <g font-size="28" dominant-baseline="central">
    <text x="129" y="39" textLength="28" lengthAdjust="spacingAndGlyphs">例</text>
    <text x="173" y="39" text-anchor="middle">：</text>
    <text x="201.5" y="39" font-size="20" text-anchor="middle">1</text>
    <text x="226" y="39" textLength="138" lengthAdjust="spacing">アブラハム</text>
  </g>
  <circle cx="201.5" cy="38.5" r="12.5" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦的な蕩減条件（縦の札） -->
  <rect x="155.5" y="77.5" width="40" height="222" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="176" y="102">縦</text>
    <text x="176" y="130.8">的</text>
    <text x="176" y="159.6">な</text>
    <text x="176" y="188.4">蕩</text>
    <text x="176" y="217.2">減</text>
    <text x="176" y="246">条</text>
    <text x="176" y="274.8">件</text>
  </g>

  <!-- 白抜きの下向きの矢印 -->
  <polygon points="247,79.5 333,79.5 333,198.5 367,198.5 290,248 211,198.5 247,198.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="291.5" cy="115" rx="40" ry="24"/>
    <ellipse cx="289.5" cy="174" rx="40" ry="24"/>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="291" y="115" textLength="66" lengthAdjust="spacing">アダム</text>
    <text x="289.5" y="174.5" textLength="47" lengthAdjust="spacing">ノア</text>
  </g>

  <!-- 三つの供え物を一時に献祭 -->
  <text x="383" y="197.5" font-size="27" dominant-baseline="central" textLength="297" lengthAdjust="spacing">三つの供え物を一時に献祭</text>

  <!-- 白抜きの右向きの矢印 -->
  <polygon points="371,242.5 511,242.5 511,218 568,282 511,346 511,321 371,321" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>

  <!-- アブラハム -->
  <ellipse cx="289" cy="285.5" rx="77.5" ry="35.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <text x="289.5" y="285.5" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="127" lengthAdjust="spacing">アブラハム</text>

  <!-- 雌牛・羊・鳩 -->
  <line x1="395" y1="282.5" x2="501" y2="282.5" stroke="currentColor" stroke-width="3"/>
  <g fill="#CF921C" stroke="currentColor" stroke-width="2.5">
    <circle cx="395" cy="283.5" r="22.5"/>
    <circle cx="446" cy="281" r="23"/>
    <circle cx="501" cy="280" r="24.5"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="395" y="284" font-size="21" textLength="37" lengthAdjust="spacingAndGlyphs">雌牛</text>
    <text x="446" y="280.5">羊</text>
    <text x="500.5" y="279.5">鳩</text>
  </g>

  <!-- 一時に横的に蕩減復帰 -->
  <rect x="219.5" y="360.5" width="319" height="41" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="236" y="381" font-size="27" dominant-baseline="central" fill="#111" textLength="286" lengthAdjust="spacing">一時に横的に蕩減復帰</text>
</svg>
