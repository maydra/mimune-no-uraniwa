<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>象徴献祭と実体献祭の意義と目的</title>

  <!-- 題 -->
  <text x="35.5" y="38" font-size="31" textLength="471" lengthAdjust="spacing" dominant-baseline="central">象徴献祭と実体献祭の意義と目的</text>
  <line x1="35" y1="56.5" x2="507" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 括弧（灰色） -->
  <g fill="none" stroke="#8C949A" stroke-width="5">
    <path d="M309,148 H329 M350.5,119 H329 V178 H350.5"/>
    <path d="M311,316 H331 M352,269 H331 V365 H352"/>
  </g>

  <!-- 象徴献祭から実体献祭へ -->
  <polygon points="225,254 225,236.5 212.5,236.5 234.3,211 256.5,236.5 244,236.5 244,254" fill="#8C949A"/>

  <!-- 箱 -->
  <g stroke="currentColor" stroke-width="2.4">
    <rect x="161" y="124" width="147" height="48" fill="#FCE5E3"/>
    <rect x="163" y="295" width="147" height="49" fill="#DCC4C4"/>
  </g>
  <g font-size="31" dominant-baseline="central" fill="#111">
    <text x="172.5" y="147.5" textLength="125" lengthAdjust="spacing">実体献祭</text>
    <text x="174.5" y="319.5" textLength="125" lengthAdjust="spacing">象徴献祭</text>
  </g>

  <!-- 箇条 -->
  <g font-size="26" dominant-baseline="central">
    <text y="116"><tspan x="362">④</tspan><tspan x="391" textLength="236" lengthAdjust="spacing">父母復帰の蕩減条件</tspan></text>
    <text y="177.5"><tspan x="362">③</tspan><tspan x="391" textLength="236" lengthAdjust="spacing">子女復帰の蕩減条件</tspan></text>
    <text y="267"><tspan x="364">②</tspan><tspan x="392.5" textLength="235" lengthAdjust="spacing">人間復帰の象徴的な</tspan></text>
    <text x="390.5" y="306.5" textLength="104" lengthAdjust="spacing">蕩減条件</text>
    <text y="365"><tspan x="364">①</tspan><tspan x="392" textLength="236" lengthAdjust="spacing">万物復帰の蕩減条件</tspan></text>
  </g>
</svg>
