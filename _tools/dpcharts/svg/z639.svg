  </g>

  <!-- 神を中心とする三位一体 -->
  <g stroke="currentColor" stroke-width="4.5">
    <circle cx="410" cy="219.25" r="57" fill="#fff" class="paper"/>
    <ellipse cx="266.5" cy="367" rx="80.5" ry="42" fill="#F98AEE"/>
    <ellipse cx="553" cy="367" rx="80.5" ry="42" fill="#A0F08A"/>
    <ellipse cx="410" cy="520.75" rx="94.5" ry="59.75" fill="#FCE5E3"/>
  </g>
  <text x="409" y="216.9" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- サタンを中心とする三位一体 -->
  <g stroke="currentColor" stroke-width="4.5">
    <circle cx="892.25" cy="220" r="57" fill="#50403D"/>
    <ellipse cx="755.25" cy="368.75" rx="75.25" ry="39.25" fill="#CF921C"/>
    <ellipse cx="1034.25" cy="368.75" rx="75.25" ry="39.25" fill="#CF921C"/>
    <ellipse cx="894.5" cy="527.25" rx="90" ry="56.75" fill="#CF921C"/>
  </g>
  <text x="892.9" y="221" font-size="54" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>

  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="41">
      <text x="267.7" y="367.6" textLength="121" lengthAdjust="spacing">アダム</text>
      <text x="554.1" y="368.8" textLength="88" lengthAdjust="spacing">エバ</text>
      <text x="756.2" y="369.6" textLength="122" lengthAdjust="spacing">アダム</text>
      <text x="1035.6" y="370.8" textLength="89" lengthAdjust="spacing">エバ</text>
    </g>
    <g font-size="45">
      <text x="409.6" y="495.6" textLength="89" lengthAdjust="spacing">善の</text>
      <text x="409.2" y="546.1" textLength="90" lengthAdjust="spacing">子女</text>
      <text x="894.8" y="503" font-size="44" textLength="91" lengthAdjust="spacing">悪の</text>
      <text x="894.8" y="553.6" textLength="91" lengthAdjust="spacing">子女</text>
    </g>
  </g>

  <!-- 真の父・真の母・悪の父・悪の母（細字） -->
  <g font-size="38" font-weight="400" dominant-baseline="central">
    <text x="187" y="288.9" textLength="112" lengthAdjust="spacing">真の父</text>
    <text x="523" y="288.9" textLength="111" lengthAdjust="spacing">真の母</text>
    <text x="673.6" y="289.4" textLength="113" lengthAdjust="spacing">悪の父</text>
    <text x="1001.6" y="289.2" textLength="111" lengthAdjust="spacing">悪の母</text>
  </g>

