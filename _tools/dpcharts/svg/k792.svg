<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>聖書　文字にとらわれる／他の角度から聖書を詳しく調べる → 真の意味を把握</title>

  <!-- 聖書（z207・z213 と同じ形を、元の画像の大きさと傾きに合わせて置く） -->
  <g transform="matrix(0.6622,0.00777,0.0587,0.3739,190,-3)">
    <path d="M285,123 L398,126 Q418,129 420,152 L404,206 L389,241 L378,266 L369,295 L364,310 Q362,314 352,314 L285,311 L240,306 Q230,304 230,293 L232,278 L224,266 Z" fill="#3A3A3A" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <path d="M236,275 L350,279 L346,303 L240,299 Q234,298 234,290 Z" fill="#EDEDED"/>
    <g stroke="#111" stroke-width="3">
      <line x1="238" y1="282" x2="348" y2="286"/>
      <line x1="238" y1="288" x2="347" y2="292"/>
      <line x1="238" y1="294" x2="347" y2="298"/>
    </g>
    <polyline points="389,135 295,133 237,262 344,262" fill="none" stroke="#BDBDBD" stroke-width="4"/>
    <line x1="393" y1="133" x2="347" y2="267" stroke="#DADADA" stroke-width="7"/>
    <path d="M312,281 L329,283 L321,329 L304,329 Z" fill="#3A3A3A" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text transform="translate(413,69.5) skewX(-25)" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="54" lengthAdjust="spacingAndGlyphs">聖書</text>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="344.5,113.4 288.5,146.2 286.2,142.3 279.2,155 293.8,155.2 291.5,151.3 347.5,118.6"/>
    <polygon points="455.6,109.9 528.1,145.4 530,141.6 538,154.2 523.3,155.1 525.2,151.3 452.8,115.7"/>
    <polygon points="558,252 566,252 566,278 572,278 562,294 552,278 558,278"/>
    <polygon points="234.5,303 241,303 241,316 246.5,316 238,329 229.5,316 234.5,316"/>
  </g>

  <!-- 箱 -->
  <g stroke="currentColor" stroke-width="2.5">
    <rect x="146" y="171" width="217" height="50" rx="5" fill="#fff" class="paper"/>
    <rect x="434" y="170" width="252" height="82.5" rx="6" fill="#fff" class="paper"/>
    <rect x="449" y="298" width="228" height="70" rx="6" fill="#CDF8F7"/>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="155" y="195.5" textLength="197" lengthAdjust="spacing">文字にとらわれる</text>
    <text x="160" y="246" textLength="155" lengthAdjust="spacing">イエスが雲に</text>
    <text x="160" y="278" textLength="181" lengthAdjust="spacing">乗って来られる</text>
    <text x="151" y="352" textLength="182" lengthAdjust="spacing">現代人の知性で</text>
    <text x="150" y="386" textLength="157" lengthAdjust="spacing">理解できない</text>
    <text x="449" y="193" textLength="223" lengthAdjust="spacing">他の角度から聖書を</text>
    <text x="487" y="233" textLength="147" lengthAdjust="spacing">詳しく調べる</text>
    <text x="462" y="335" font-size="28" textLength="201" lengthAdjust="spacing" fill="#111">真の意味を把握</text>
  </g>
</svg>
