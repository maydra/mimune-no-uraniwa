<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 再臨復活による非宗教人の統一</title>

  <text x="77" y="57.5" font-size="46" text-anchor="middle" dominant-baseline="central">Ⅲ</text>
  <text x="103.6" y="57.5" font-size="46" dominant-baseline="central">.</text>
  <text x="134" y="56.5" font-size="49" dominant-baseline="central" textLength="697" lengthAdjust="spacing">再臨復活による非宗教人の統一</text>
  <line x1="133" y1="86.5" x2="834" y2="86.5" stroke="currentColor" stroke-width="3"/>

  <!-- 左の見出し（縦書き。右の列から読む：非宗教良心的霊人／良心的地上人） -->
  <g font-size="41" text-anchor="middle" dominant-baseline="central">
    <text x="346.5" y="150.5">非</text>
    <text x="346.5" y="192">宗</text>
    <text x="346.5" y="233">教</text>
    <text x="296.5" y="150">良</text>
    <text x="296.5" y="191.5">心</text>
    <text x="296.5" y="233">的</text>
    <text x="246" y="150">霊</text>
    <text x="246" y="192">人</text>
    <text x="343.5" y="339">良</text>
    <text x="343.5" y="380.5">心</text>
    <text x="343.5" y="422">的</text>
    <text x="293.5" y="339">地</text>
    <text x="293.5" y="380.5">上</text>
    <text x="293.5" y="422.5">人</text>
  </g>

  <!-- 地上の線と、霊人から地上人への矢印 -->
  <line x1="223" y1="287.5" x2="768.5" y2="287.5" stroke="currentColor" stroke-width="7"/>
  <g stroke="currentColor" stroke-width="8">
    <line x1="426.5" y1="275.5" x2="426.5" y2="299"/>
    <line x1="561" y1="275.5" x2="561" y2="299"/>
    <line x1="693.5" y1="275.5" x2="693.5" y2="299"/>
  </g>
  <g fill="currentColor">
    <polygon points="415,298 438,298 426.5,319"/>
    <polygon points="549.5,298 572.5,298 561,319"/>
    <polygon points="682,298 705,298 693.5,319"/>
  </g>

  <!-- 地上人から再臨主への弧（楕円より先に描き、始まりを楕円で隠す） -->
  <g stroke="currentColor" stroke-width="6" fill="none">
    <path d="M440,455 C606,602.2 850.9,496.1 855.78,369.99"/>
    <path d="M572,457 C697.7,508.1 809.1,454.3 823.43,381.65"/>
    <path d="M731,420 C774.7,425.4 795.5,397.7 802.22,378.9"/>
  </g>
  <g fill="currentColor">
    <polygon points="856.5,351.5 866.2,371.9 845.2,371.1"/>
    <polygon points="827,363.5 833.4,385.2 812.8,381.1"/>
    <polygon points="808.5,361.5 811.6,383.9 791.8,376.7"/>
  </g>

  <!-- 非宗教の良心的霊人と良心的地上人（茶） -->
  <g stroke="currentColor" stroke-width="4.5" fill="#CF921C">
    <ellipse cx="426.5" cy="200.5" rx="39" ry="63"/>
    <ellipse cx="560.75" cy="200.5" rx="39.25" ry="63"/>
    <ellipse cx="693.25" cy="200.5" rx="39.25" ry="63"/>
    <ellipse cx="426.25" cy="396.5" rx="39.25" ry="63"/>
    <ellipse cx="560.75" cy="396.5" rx="39.25" ry="63"/>
    <ellipse cx="693.25" cy="395.75" rx="39.25" ry="63.25"/>
  </g>
  <g font-size="59" dominant-baseline="central" fill="#111">
    <text x="426" y="200.5" text-anchor="middle">A</text>
    <text x="560.5" y="201" text-anchor="middle">B</text>
    <text x="693.5" y="201" text-anchor="middle">C</text>
    <text><tspan x="426" y="399" text-anchor="middle">A</tspan><tspan x="434.1" y="383.9">′</tspan></text>
    <text><tspan x="560.5" y="399.5" text-anchor="middle">B</tspan><tspan x="568.6" y="383.4">′</tspan></text>
    <text><tspan x="693.5" y="396.5" text-anchor="middle">C</tspan><tspan x="698.6" y="379.9">′</tspan></text>
  </g>

  <!-- 再臨主 -->
  <ellipse cx="838.25" cy="269.25" rx="46.75" ry="84.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="42" text-anchor="middle" dominant-baseline="central">
    <text x="838.5" y="229">再</text>
    <text x="838.5" y="269.5">臨</text>
    <text x="838" y="311.5">主</text>
  </g>

  <polygon points="909.5,267.5 950,267.5 950,247.5 986,278 950,308.5 950,288.5 909.5,288.5" fill="#8C949A"/>

  <!-- 非宗教人の統一 -->
  <rect x="999.5" y="120.5" width="68.5" height="316" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="42" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="1034.5" y="158">非</text>
    <text x="1034.5" y="199">宗</text>
    <text x="1034.5" y="240.5">教</text>
    <text x="1034.5" y="282.5">人</text>
    <text x="1034.5" y="324">の</text>
    <text x="1034.5" y="364.5">統</text>
    <text x="1034.5" y="405">一</text>
  </g>

  <!-- 聖句 -->
  <text x="204.3" y="521" font-size="34" dominant-baseline="central" textLength="199" lengthAdjust="spacing">マタイ 2:2～</text>
  <g font-size="34.5" font-weight="400" dominant-baseline="central">
    <text x="207.3" y="561">『</text>
    <text x="219" y="561" textLength="865" lengthAdjust="spacing">ユダヤ人の王としてお生まれになったかたはどこにおら</text>
    <!-- 2行目は句読点が全角の幅なので、句読点で区切って置く -->
    <text y="603"><tspan x="220.5">れますか</tspan><tspan x="356.6">。</tspan><tspan x="392.6" textLength="623.4" lengthAdjust="spacingAndGlyphs">わたしたちは東の方でその星を見たので</tspan><tspan x="1015.6">、</tspan><tspan x="1050.9">そ</tspan></text>
    <text x="219" y="644.5" textLength="381" lengthAdjust="spacingAndGlyphs">のかたを拝みにきました』</text>
  </g>
</svg>
