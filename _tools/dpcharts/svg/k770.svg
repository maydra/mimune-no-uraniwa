<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. 第三次世界大戦に対する摂理的な概要</title>

  <!-- 題 -->
  <g font-size="29.5" dominant-baseline="central">
    <text x="34" y="37">2.</text>
    <text x="71" y="37" textLength="533" lengthAdjust="spacing">第三次世界大戦に対する摂理的な概要</text>
  </g>
  <line x1="69" y1="55" x2="605" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 民主世界と共産世界 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="244" cy="127" rx="90.5" ry="41.5" fill="#F8F28F"/>
    <ellipse cx="565.5" cy="127" rx="90" ry="41.5" fill="#F86D42"/>
  </g>
  <g font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="244.5" y="127" textLength="124" lengthAdjust="spacing">民主世界</text>
    <text x="566" y="127" textLength="125" lengthAdjust="spacing">共産世界</text>
  </g>

  <!-- 屈伏させる -->
  <text x="403" y="97.5" font-size="24" text-anchor="middle" dominant-baseline="central" textLength="115" lengthAdjust="spacing">屈伏させる</text>
  <polygon points="345,122.5 450,122.5 450,116.5 465.5,126.5 450,136 450,130.5 345,130.5" fill="#8C949A"/>

  <!-- 箇条 -->
  <g>
    <circle cx="194" cy="203.5" r="7.5"/>
    <circle cx="194" cy="251" r="7.5"/>
    <circle cx="194" cy="297" r="7.5"/>
    <circle cx="194" cy="344" r="7.5"/>
  </g>
  <g font-size="27" dominant-baseline="central">
    <text x="211" y="203.5" textLength="172" lengthAdjust="spacing">理想世界復帰</text>
    <text x="212" y="250" textLength="344" lengthAdjust="spacing">民主主義の完成的基台造成</text>
    <text x="211" y="297" textLength="339" lengthAdjust="spacing">全人類を一つの世界に導く</text>
    <text x="212" y="344" textLength="458" lengthAdjust="spacing">サタンに奪われてきた全てのものを</text>
    <text x="211" y="383" textLength="346" lengthAdjust="spacing">横的蕩減復帰する最終戦争</text>
  </g>
</svg>
