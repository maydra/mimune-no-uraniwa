<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 愛の力と原理の力から見た堕落</title>

  <text x="55" y="79" font-size="46">Ⅰ.</text>
  <text x="132" y="78" font-size="48" textLength="698" lengthAdjust="spacing">愛の力と原理の力から見た堕落</text>
  <line x1="131" y1="89.5" x2="830" y2="89.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 創造目的完成 -->
  <ellipse cx="396" cy="197" rx="116.75" ry="63.25" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="43" text-anchor="middle" fill="#111">
    <text x="397" y="195.5">創造目的</text>
    <text x="397.5" y="241">完成</text>
  </g>

  <!-- 成長の矢印（原理軌道） -->
  <polygon points="396.5,269 479,326 436,326 436,511 356,511 356,326 314,326" fill="#C4CCD3" stroke="currentColor" stroke-width="4" stroke-linejoin="miter"/>
  <g stroke-width="6">
    <line x1="311" y1="348.5" x2="489" y2="348.5" stroke="currentColor"/>
    <line x1="311" y1="430.5" x2="489" y2="430.5" stroke="currentColor"/>
    <line x1="358" y1="348.5" x2="434" y2="348.5" stroke="#111"/>
    <line x1="358" y1="430.5" x2="434" y2="430.5" stroke="#111"/>
  </g>

  <!-- 人間 -->
  <ellipse cx="396" cy="568.25" rx="90.75" ry="53" fill="#FCE5E3" stroke="currentColor" stroke-width="3.5"/>
  <text x="395.5" y="569" font-size="52" text-anchor="middle" dominant-baseline="central" fill="#111">人 間</text>

  <g stroke="currentColor" stroke-width="6.5">
    <line x1="243" y1="267" x2="549" y2="267"/>
    <line x1="243" y1="511.5" x2="549" y2="511.5"/>
  </g>

  <g font-size="44" text-anchor="middle" dominant-baseline="central">
    <text x="274" y="322">原</text>
    <text x="274" y="367.5">理</text>
    <text x="274" y="413">軌</text>
    <text x="274" y="458.5">道</text>
  </g>

  <text x="560" y="382.5" font-size="44" textLength="179" lengthAdjust="spacing">原理の力</text>
  <text x="564" y="461.3" font-size="45" textLength="362" lengthAdjust="spacing">自体では堕落不可</text>

  <g>
    <circle cx="507" cy="568.5" r="4.25"/>
    <circle cx="523" cy="568.5" r="4.25"/>
    <circle cx="538.5" cy="568.5" r="4.25"/>
    <circle cx="554.5" cy="568.5" r="4.25"/>
    <circle cx="570.5" cy="568.5" r="4.25"/>
    <circle cx="586.5" cy="568.5" r="4.25"/>
  </g>
  <text x="603" y="586.5" font-size="44" textLength="367" lengthAdjust="spacing">原理をもって創造</text>
</svg>
