<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>四位基台：四数・三数の根本ほか</title>

  <rect x="257.5" y="49.5" width="221" height="65.5" rx="9" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="368.5" y="81.5" font-size="47" text-anchor="middle" dominant-baseline="central">四位基台</text>

  <!-- 番号 -->
  <g font-size="53" text-anchor="middle" dominant-baseline="central">
    <text x="426.5" y="165.5">①</text>
    <text x="426.5" y="252.5">②</text>
    <text x="426.5" y="340.5">③</text>
    <text x="426.5" y="427.5">④</text>
    <text x="426.5" y="515.5">⑤</text>
  </g>
  <circle cx="426" cy="603" r="23" fill="#8C949A"/>

  <g font-size="53" dominant-baseline="central">
    <text x="474" y="165.5">四数、</text>
    <text x="634" y="165.5" textLength="270" lengthAdjust="spacing">三数の根本</text>
    <text x="473" y="252.5" textLength="432" lengthAdjust="spacing">三段階原則の根本</text>
    <text x="473" y="340.5" textLength="324" lengthAdjust="spacing">十二数の根本</text>
    <text x="473" y="427.5" textLength="380" lengthAdjust="spacing">善の根本的基台</text>
    <text x="473" y="515.5" textLength="380" lengthAdjust="spacing">力の根本的基台</text>
    <text x="472" y="602.5" textLength="435" lengthAdjust="spacing">永遠なる創造目的</text>
  </g>
</svg>
