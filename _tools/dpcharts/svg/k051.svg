  <!-- 時代の名前 -->
  <g font-size="23.5" dominant-baseline="central">
    <text x="473" y="124.5">聖徒の</text>
    <text x="473" y="152.5">責任分担摂理時代</text>
    <text x="473" y="190">イエスと聖霊の</text>
    <text x="473" y="218.5">責任分担摂理時代</text>
    <text x="473" y="255.5">神の</text>
    <text x="473" y="284">責任分担摂理時代</text>
    <text x="425" y="328.5">責任分担基台摂理時代</text>
