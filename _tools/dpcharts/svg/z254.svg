<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>肉的堕落の結果</title>

  <text x="54" y="84" font-size="48" textLength="347" lengthAdjust="spacing">肉的堕落の結果</text>
  <line x1="51" y1="95.5" x2="400" y2="95.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 神とのつながり（円と楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="8.5">
    <line x1="822" y1="129.4" x2="350" y2="238"/>
    <line x1="838.7" y1="116" x2="649.5" y2="261.5"/>
    <line x1="812.2" y1="116" x2="986.8" y2="261.5"/>
  </g>
  <!-- 切れた所の × -->
  <g stroke="currentColor" stroke-width="7">
    <line x1="584" y1="163" x2="626" y2="197"/>
    <line x1="590" y1="201" x2="625" y2="160"/>
    <line x1="725" y1="176" x2="777.5" y2="194"/>
    <line x1="743" y1="210.5" x2="761" y2="157.5"/>
    <line x1="896" y1="155.5" x2="897.5" y2="210.5"/>
    <line x1="866.5" y1="186" x2="923.5" y2="183"/>
  </g>

  <circle cx="822" cy="116" r="57" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.5"/>
  <text x="820" y="115.5" font-size="62" text-anchor="middle" dominant-baseline="central">神</text>

  <g stroke="currentColor" stroke-width="3.5">
    <ellipse cx="307.5" cy="261.5" rx="101" ry="51" fill="#50403D"/>
    <ellipse cx="677.5" cy="261.5" rx="87" ry="51" fill="#CF921C"/>
    <ellipse cx="974.5" cy="261.5" rx="87" ry="51" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="307.5" y="259" font-size="48" textLength="170" lengthAdjust="spacingAndGlyphs" fill="#fff">ルーシェル</text>
    <text x="677" y="261" font-size="48" textLength="122" lengthAdjust="spacing" fill="#111">エ バ</text>
    <text x="975" y="261" font-size="50" textLength="134" lengthAdjust="spacingAndGlyphs" fill="#111">アダム</text>
  </g>

  <!-- 授受の矢印 -->
  <polygon points="442,239.5 548,239.5 548,232.5 572.5,245 548,257.5 548,250.5 442,250.5"/>
  <polygon points="569,272 463.5,272 463.5,265 439,277.5 463.5,290 463.5,283 569,283"/>
  <polygon points="771,239.5 857,239.5 857,232.5 881.5,245 857,257.5 857,250.5 771,250.5"/>
  <polygon points="879,272.5 794,272.5 794,265.5 769,278 794,290.5 794,283.5 879,283.5"/>

  <g font-size="41">
    <text x="646" y="358" textLength="372" lengthAdjust="spacing">ルーシェルの要素を</text>
    <text x="647" y="410" textLength="328" lengthAdjust="spacing">そのまま受け継ぐ</text>
  </g>
  <polygon points="821.5,420 833.5,420 833.5,436.5 843,436.5 827.5,462 812,436.5 821.5,436.5" fill="#8C949A"/>
  <rect x="686.75" y="467.75" width="279.5" height="63.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <text x="710" y="517.3" font-size="45" textLength="229" lengthAdjust="spacing" fill="#111">子孫に遺伝</text>

  <!-- 下の2行 -->
  <circle cx="253.5" cy="584.5" r="11"/>
  <text y="602" font-size="41"><tspan x="275" textLength="175" lengthAdjust="spacingAndGlyphs">アダムが、</tspan><tspan x="450" textLength="634" lengthAdjust="spacingAndGlyphs">罪を犯したエバを相手にしなかったなら</tspan></text>
  <polygon points="286,640 332,640 332,632.5 350.5,644 332,655.5 332,648 286,648" fill="#8C949A"/>
  <text x="379" y="656.5" font-size="41" textLength="290" lengthAdjust="spacing">復帰摂理は容易</text>
</svg>
