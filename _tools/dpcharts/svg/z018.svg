  <text x="413.5" y="604.5" font-size="50" text-anchor="middle" dominant-baseline="central" textLength="350" lengthAdjust="spacing">人生問題の解決</text>

  <g fill="#8C949A">
    <polygon points="561,311 589,311 589,295 625,324 589,353 589,338 561,338"/>
    <polygon points="850,417 878,417 878,445 894,445 864.5,481.5 835,445 850,445"/>
