<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. イエスはなぜ雲に乗って再臨されると言われたのか</title>

  <text x="37" y="37" font-size="30" dominant-baseline="central" textLength="32" lengthAdjust="spacingAndGlyphs">Ⅳ.</text>
  <text x="80" y="37" font-size="30" dominant-baseline="central" textLength="710" lengthAdjust="spacing">イエスはなぜ雲に乗って再臨されると言われたのか</text>
  <line x1="79" y1="56.5" x2="791" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <g font-size="26" dominant-baseline="central">
    <text x="168" y="123.5" textLength="28" lengthAdjust="spacingAndGlyphs">①</text>
    <text x="200" y="123.5" textLength="368" lengthAdjust="spacing">偽キリストの惑わしを防ぐため</text>
    <text x="168" y="185" textLength="28" lengthAdjust="spacingAndGlyphs">②</text>
    <text x="200" y="185" textLength="340" lengthAdjust="spacing">険しい信仰路程を歩いている</text>
    <text x="200" y="224.5" textLength="183" lengthAdjust="spacing">信徒たちを激励</text>
  </g>
  <text x="194" y="273.5" font-size="22" dominant-baseline="central" textLength="369" lengthAdjust="spacing">(ヨハネ 21:18 ～ 22、マタイ 16:28)</text>

  <circle cx="181" cy="319" r="6"/>
  <circle cx="181" cy="362" r="6"/>
  <g font-size="26" dominant-baseline="central">
    <text x="197" y="319" textLength="208" lengthAdjust="spacing">イエスの再臨熱望</text>
    <text x="198" y="362" textLength="470" lengthAdjust="spacing">ローマの圧政、迫害の中で初代教会創設</text>
  </g>
  <text x="562" y="340" font-size="14" text-anchor="middle" dominant-baseline="central" textLength="92" lengthAdjust="spacing">エクレシア</text>
</svg>
