<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. モーセ路程が見せてくれた教訓</title>

  <!-- 題 -->
  <text x="35" y="38.5" font-size="30" dominant-baseline="central" textLength="37" lengthAdjust="spacingAndGlyphs">Ⅲ.</text>
  <text x="82" y="38" font-size="30" dominant-baseline="central" textLength="438" lengthAdjust="spacing">モーセ路程が見せてくれた教訓</text>
  <line x1="80" y1="57" x2="521" y2="57" stroke="currentColor" stroke-width="2.6"/>

  <!-- ①②③④ -->
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="138.5" cy="114.5" r="12.6"/>
    <circle cx="138.5" cy="207.5" r="12.6"/>
    <circle cx="138.5" cy="304.5" r="12.6"/>
    <circle cx="138.5" cy="364" r="12.6"/>
  </g>
  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="138.5" y="115">1</text>
    <text x="138.5" y="208">2</text>
    <text x="138.5" y="305">3</text>
    <text x="138.5" y="364.5">4</text>
  </g>

  <!-- 括弧 -->
  <path d="M415,204 H403.5 V255 H415" fill="none" stroke="#8C949A" stroke-width="2.6"/>

  <g font-size="28" dominant-baseline="central">
    <text y="114.5"><tspan x="156.5" textLength="345" lengthAdjust="spacing">神は絶対的な目的を指向し</tspan><tspan x="502">、</tspan><tspan x="533" textLength="142" lengthAdjust="spacing">人類歴史を</tspan></text>
    <text x="154.5" y="151.5" textLength="200" lengthAdjust="spacing">導いてこられた</text>

    <text x="157" y="208" textLength="202" lengthAdjust="spacing">人間の責任分担</text>
    <text x="368" y="208" textLength="26" lengthAdjust="spacingAndGlyphs">…</text>
    <text x="423" y="204" textLength="230" lengthAdjust="spacing">神の予定成就決定</text>
    <text x="423" y="256.5" textLength="230" lengthAdjust="spacing">神は干渉されない</text>

    <text x="158" y="304.5" textLength="229" lengthAdjust="spacing">み旨に対する予定</text>
    <text x="404" y="304.5" textLength="26" lengthAdjust="spacingAndGlyphs">…</text>
    <text x="447" y="304.5" textLength="56" lengthAdjust="spacing">絶対</text>

    <text x="157" y="364" textLength="330" lengthAdjust="spacing">恩賜を賜ろうとするとき</text>
    <text x="492" y="364" textLength="26" lengthAdjust="spacingAndGlyphs">…</text>
    <text x="522" y="364" textLength="178" lengthAdjust="spacing">サタンの訴え</text>
    <text x="159" y="401" textLength="229" lengthAdjust="spacing">を防ぐための試練</text>
  </g>
</svg>
