<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>士師時代と教区長制キリスト教会時代　士師（預言者・祭司長・国王）と教区長（預言者・祭司長・国王（霊的））　ユダヤ教封建社会とキリスト教封建社会</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="130" y="88" width="276" height="54" rx="6"/>
    <rect x="415" y="88" width="276" height="54" rx="6"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="204.1" y="115" font-size="31" textLength="126.7" lengthAdjust="spacing">士師時代</text>
    <text x="423.3" y="115" font-size="28" textLength="86.4" lengthAdjust="spacingAndGlyphs">教区長制</text>
    <text x="510.3" y="115" font-size="28" textLength="82.4" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="594.3" y="115" font-size="28" textLength="87.4" lengthAdjust="spacingAndGlyphs">教会時代</text>
  </g>
  <!-- 白い枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="130" y="150.5" width="276" height="210" rx="8"/>
    <rect x="415" y="150.5" width="276" height="210" rx="8"/>
  </g>
  <!-- 括弧（線で描く） -->
  <g fill="none" stroke="#8C949A" stroke-width="5.5">
    <path d="M264,210 H250 V275 H266 M244,243 H265"/>
    <path d="M550,211 H535 V276 H551 M530,243.5 H550"/>
  </g>
  <!-- 士師・教区長 -->
  <ellipse cx="198.2" cy="242.5" rx="45.2" ry="27.5" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
  <ellipse cx="484" cy="243.5" rx="45" ry="27.5" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
  <g dominant-baseline="central" fill="#111">
    <text x="169.3" y="242" font-size="29" textLength="58.5" lengthAdjust="spacing">士師</text>
    <text x="443.4" y="243.5" font-size="26" textLength="75.1" lengthAdjust="spacingAndGlyphs">教区長</text>
  </g>
  <!-- 左：士師時代 -->
  <g dominant-baseline="central">
    <text x="150.5" y="170" font-size="22" text-anchor="middle">①</text>
    <text x="271.4" y="207.5" font-size="26" textLength="78.1" lengthAdjust="spacing">預言者</text>
    <text x="271.4" y="241.5" font-size="26" textLength="78.1" lengthAdjust="spacing">祭司長</text>
    <text x="272.4" y="277" font-size="26" textLength="51.1" lengthAdjust="spacing">国王</text>
    <text x="161.4" y="330" font-size="27" textLength="210.2" lengthAdjust="spacing">ユダヤ教封建社会</text>
  </g>
  <!-- 右：教区長制キリスト教会時代 -->
  <g dominant-baseline="central">
    <text x="438" y="169" font-size="24" text-anchor="middle">②</text>
    <text x="557.4" y="209.5" font-size="26" textLength="78.1" lengthAdjust="spacing">預言者</text>
    <text x="557.4" y="243.5" font-size="26" textLength="78.1" lengthAdjust="spacing">祭司長</text>
    <text x="558.4" y="278" font-size="26" textLength="48.1" lengthAdjust="spacingAndGlyphs">国王</text>
    <text x="621" y="278" font-size="26" text-anchor="middle">（</text>
    <text x="626.4" y="278" font-size="26" textLength="49.1" lengthAdjust="spacingAndGlyphs">霊的</text>
    <text x="680.5" y="278" font-size="26" text-anchor="middle">）</text>
    <text x="439.4" y="330.5" font-size="27" textLength="99.2" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="542.4" y="330.5" font-size="27" textLength="130.2" lengthAdjust="spacingAndGlyphs">教封建社会</text>
  </g>
</svg>
