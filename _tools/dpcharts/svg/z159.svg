<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>創造過程の六段階期間</title>

  <!-- 神から宇宙へ -->
  <polygon points="395.5,240 412.5,240 412.5,374 425,374 404,418 383,374 395.5,374" fill="#8C949A"/>
  <ellipse cx="404.5" cy="175" rx="98" ry="69.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="400" y="177" font-size="69" text-anchor="middle" dominant-baseline="central">神</text>
  <ellipse cx="404.5" cy="506.5" rx="175.5" ry="79" fill="#DCC4C4" stroke="currentColor" stroke-width="4.5"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="402" y="473" font-size="60">宇宙</text>
    <text x="402.5" y="536" font-size="46">（被造世界）</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="300.5" y="310" font-size="44">時間性</text>
    <text y="313" font-size="47"><tspan x="472">６</tspan><tspan x="517">日</tspan></text>
    <text y="370" font-size="40"><tspan x="455">（</tspan><tspan x="482">創</tspan><tspan x="523">1</tspan><tspan x="541.5">）</tspan></text>
  </g>

  <!-- 六段階期間 -->
  <line x1="557" y1="309.5" x2="760" y2="309.5" stroke="currentColor" stroke-width="5.5" stroke-dasharray="18 8.6"/>
  <rect x="760" y="226.5" width="323.5" height="172" rx="58" ry="43" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g font-size="52" text-anchor="middle" dominant-baseline="central">
    <text x="920" y="282">創造過程の</text>
    <text x="920.5" y="344.5">六段階期間</text>
  </g>
</svg>
