<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>良心作用</title>

  <text x="51" y="79" font-size="49" textLength="199" lengthAdjust="spacing">良心作用</text>
  <line x1="51" y1="90.5" x2="250" y2="90.5" stroke="currentColor" stroke-width="4"/>

  <!-- 主体：神、対象：良心 -->
  <circle cx="597.5" cy="158.5" r="57" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="596" y="158.5" font-size="64" text-anchor="middle" dominant-baseline="central">神</text>
  <ellipse cx="597.5" cy="420" rx="103" ry="45.5" fill="#FCE5E3" stroke="currentColor" stroke-width="4.5"/>
  <text x="597.5" y="418.5" font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111">良心</text>
  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="433" y="154">主体</text>
    <text x="429.5" y="417">対象</text>
  </g>

  <!-- 授受の矢印 -->
  <path d="M576,360 Q534.5,301 563,251 M622,233 Q665.25,292 633,342" fill="none" stroke="currentColor" stroke-width="11.5"/>
  <polygon points="578,227 550,243 579,256"/>
  <polygon points="620,367 648,352 619,338"/>

  <!-- 良心作用の力 -->
  <polygon points="601,289.5 690,289.5 690,279 722.5,294.5 690,310 690,299.5 601,299.5" fill="#8C949A"/>
  <text x="729" y="295.5" font-size="48" textLength="297" lengthAdjust="spacing" dominant-baseline="central">良心作用の力</text>

  <!-- 下の2行 -->
  <circle cx="211.5" cy="540.5" r="7.5"/>
  <text x="233" y="542" font-size="44" textLength="280" lengthAdjust="spacing" dominant-baseline="central">悪を行うとき</text>
  <polygon points="547,537 583,537 583,533.5 601.5,542.5 583,551.5 583,548 547,548" fill="#8C949A"/>
  <text x="650" y="542" font-size="44" textLength="229" lengthAdjust="spacing" dominant-baseline="central">良心の呵責</text>

  <circle cx="212.5" cy="614.5" r="7.5"/>
  <text x="231" y="613" font-size="44" textLength="426" lengthAdjust="spacingAndGlyphs" dominant-baseline="central">良心作用がないとすれば</text>
  <polygon points="687,608 720,608 720,603.5 740,613.5 720,623.5 720,619 687,619" fill="#8C949A"/>
  <text x="758" y="613" font-size="44" textLength="352" lengthAdjust="spacingAndGlyphs" dominant-baseline="central">神の復帰摂理不可能</text>
</svg>
