<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ 数多くの霊通人たちの神霊役事（使徒行伝 2:17）</title>
  <defs>
    <marker id="k869-g" viewBox="0 0 12 14" refX="6" refY="7" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="14" orient="auto">
      <path d="M0,0 L12,7 L0,14 z" fill="#8C949A"/>
    </marker>
  </defs>

  <!-- 題 -->
  <text x="32" y="35.5" font-size="28" dominant-baseline="central">③</text>
  <text x="72" y="35.5" font-size="28" dominant-baseline="central" textLength="350" lengthAdjust="spacingAndGlyphs">数多くの霊通人たちの神霊役事</text>
  <line x1="70" y1="53" x2="422" y2="53" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="26" dominant-baseline="central">
    <text x="427" y="36">（</text>
    <text x="437" y="36" textLength="88" lengthAdjust="spacingAndGlyphs">使徒行伝</text>
    <text x="531" y="36" textLength="44" lengthAdjust="spacingAndGlyphs">2:17</text>
    <text x="585" y="36" text-anchor="end">）</text>
  </g>

  <!-- 神から霊人へ -->
  <g stroke="#8C949A" stroke-width="7" fill="none" marker-end="url(#k869-g)">
    <line x1="395" y1="130.4" x2="271" y2="186.5"/>
    <line x1="407" y1="140" x2="407" y2="181"/>
    <line x1="419" y1="130" x2="544" y2="186.3"/>
    <line x1="236.5" y1="240" x2="236.5" y2="268"/>
    <line x1="407" y1="240" x2="407" y2="268"/>
    <line x1="577.5" y1="240" x2="577.5" y2="268"/>
  </g>

  <circle cx="407" cy="119" r="28.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="407" y="119" font-size="32" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 霊人と修道者 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="237" cy="216.5" rx="40" ry="26.5" fill="#CF921C"/>
    <ellipse cx="407" cy="216.5" rx="40" ry="26.5" fill="#DCC4C4"/>
    <ellipse cx="577.5" cy="216.5" rx="40" ry="26.5" fill="#F8F28F"/>
    <ellipse cx="236.5" cy="307" rx="53" ry="25.5" fill="#CF921C"/>
    <ellipse cx="407" cy="307" rx="53" ry="25.5" fill="#DCC4C4"/>
    <ellipse cx="577" cy="307" rx="53" ry="25.5" fill="#F8F28F"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="237" y="216.5" textLength="55" lengthAdjust="spacing">霊人</text>
    <text x="407" y="216.5" textLength="55" lengthAdjust="spacing">霊人</text>
    <text x="577.5" y="216.5" textLength="55" lengthAdjust="spacing">霊人</text>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="236.5" y="307" textLength="85" lengthAdjust="spacing">修道者</text>
    <text x="407" y="307" textLength="85" lengthAdjust="spacing">修道者</text>
    <text x="577" y="307" textLength="85" lengthAdjust="spacing">修道者</text>
  </g>

  <!-- 啓示 -->
  <rect x="150.5" y="351.5" width="515" height="46" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="408" y="374.5" font-size="32" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="471" lengthAdjust="spacing">主の韓国再臨に関する明確な啓示</text>
</svg>
