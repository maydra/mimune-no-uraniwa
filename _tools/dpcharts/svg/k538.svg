<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>各時代の性格を対照 → 神の公式的な摂理</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="232.5" y="86.5" width="182" height="82" rx="8"/>
    <rect x="420.5" y="86.5" width="182" height="82" rx="8"/>
  </g>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="266" y="111.5" textLength="116" lengthAdjust="spacing">復帰摂理</text>
    <text x="296" y="147" textLength="57" lengthAdjust="spacing">時代</text>
    <text x="454" y="111.5" textLength="116" lengthAdjust="spacing">復帰摂理</text>
    <text x="454" y="147" textLength="116" lengthAdjust="spacing">延長時代</text>
  </g>

  <!-- 対照の矢印 -->
  <path d="M326,192 V205 H506 V192" fill="none" stroke="#8C949A" stroke-width="3"/>
  <g fill="#8C949A">
    <polygon points="326,182 332.5,193 319.5,193"/>
    <polygon points="506,183 512.5,193 499.5,193"/>
  </g>

  <text x="269" y="253.5" font-size="30" textLength="283" lengthAdjust="spacing" dominant-baseline="central">各時代の性格を対照</text>

  <polygon points="406,293 422.5,293 422.5,308 429.5,308 414.25,321 399,308 406,308" fill="#8C949A"/>

  <text x="284" y="357.5" font-size="30" textLength="253" lengthAdjust="spacing" dominant-baseline="central">神の公式的な摂理</text>
</svg>
