<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>日と月が光を失い星が空から落ちる</title>

  <text x="52" y="89" font-size="50">5.</text>
  <text x="111" y="69" font-size="48" dominant-baseline="central" textLength="794" lengthAdjust="spacing">日と月が光を失い星が空から落ちる</text>
  <line x1="107" y1="99.5" x2="907" y2="99.5" stroke="currentColor" stroke-width="4"/>

  <text x="809" y="133" font-size="38" dominant-baseline="central" textLength="247" lengthAdjust="spacingAndGlyphs">【マタイ 24:29】</text>
  <g font-size="42" dominant-baseline="central">
    <text x="209" y="161">ヨセフの夢</text>
    <text x="419" y="161" textLength="220" lengthAdjust="spacingAndGlyphs">(創 37:9 ～)</text>
  </g>

  <!-- 日・月・星 -->
  <g stroke="currentColor" stroke-width="4" fill="#fff" class="paper">
    <circle cx="431" cy="248" r="40.5"/>
    <circle cx="652" cy="248" r="40.5"/>
    <circle cx="872.5" cy="248" r="40.5"/>
  </g>
  <g font-size="44" text-anchor="middle" dominant-baseline="central">
    <text x="431" y="248">日</text>
    <text x="652" y="248">月</text>
    <text x="872.5" y="248">星</text>
  </g>
  <g font-size="40" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="506" y="248">父</text>
    <text x="727" y="248">母</text>
    <text x="970" y="248">子女</text>
  </g>

  <!-- 新約 -->
  <text x="271.5" y="351" font-size="46" text-anchor="middle" dominant-baseline="central">新約</text>
  <line x1="875.5" y1="392" x2="875.5" y2="437" stroke="currentColor" stroke-width="12" stroke-dasharray="15 15"/>
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="433" cy="350" rx="66" ry="40" fill="#F98AEE"/>
    <ellipse cx="653" cy="350" rx="66" ry="40" fill="#A0F08A"/>
    <ellipse cx="874" cy="350" rx="66" ry="40" fill="#FCE5E3"/>
  </g>
  <g font-size="44" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="433" y="350">イエス</text>
    <text x="653" y="350">聖霊</text>
    <text x="874" y="350">信徒</text>
  </g>

  <!-- 新しいみ言 -->
  <g font-size="44" text-anchor="middle" dominant-baseline="central">
    <text x="271.5" y="444.5">新しい</text>
    <text x="272.5" y="493.5">み言</text>
  </g>
  <ellipse cx="438" cy="468" rx="93" ry="56" fill="#F8F28F" stroke="currentColor" stroke-width="4"/>
  <g font-size="40" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="437" y="447">再臨の</text>
    <text x="437.5" y="488.5">イエス</text>
  </g>

  <!-- 星が落ちる → ×（不信、つまずき落ちる） -->
  <polygon points="557,467.5 587,450.5 587,461.5 771,461.5 771,473.5 587,473.5 587,484.5" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="10.5">
    <line x1="651.3" y1="440.4" x2="695.7" y2="492.6"/>
    <line x1="694.2" y1="440.4" x2="649.8" y2="492.6"/>
  </g>
  <text x="891.5" y="466.5" font-size="42" text-anchor="middle" dominant-baseline="central">星が落ちる</text>
  <g font-size="38" dominant-baseline="central">
    <text x="551" y="509">不信、</text>
    <text x="552" y="554">つまずき落ちる</text>
  </g>

  <rect x="204.5" y="584" width="880.5" height="72.5" rx="7" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="226" y="619.5" font-size="38" dominant-baseline="central" textLength="838" lengthAdjust="spacing" fill="#111">日、月、光を失う：新約のみ言の使命期間終わる</text>
</svg>
