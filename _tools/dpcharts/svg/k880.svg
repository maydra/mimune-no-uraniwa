<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス当時（初臨）と今日（再臨）　ユダヤ教／キリスト教</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="131.5" y="78.5" width="279" height="54" rx="7"/>
    <rect x="418.5" y="78.5" width="279" height="54" rx="7"/>
  </g>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="144" y="105.5" textLength="156" lengthAdjust="spacing">イエス当時</text>
    <text x="306" y="105.5">（初臨）</text>
    <text x="478" y="105.5" textLength="57" lengthAdjust="spacing">今日</text>
    <text x="545" y="105.5">（再臨）</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="132.25" y="140.25" width="275.5" height="223.5" rx="8"/>
    <rect x="418.25" y="140.25" width="275.5" height="223.5" rx="8"/>
  </g>

  <!-- イエス当時 -->
  <g font-size="26" dominant-baseline="central">
    <text x="144" y="167">①</text>
    <text x="180" y="167" textLength="102" lengthAdjust="spacing">ユダヤ教</text>
  </g>
  <g>
    <circle cx="159.5" cy="207.5" r="5.5"/>
    <circle cx="159.5" cy="248" r="5.5"/>
    <circle cx="160" cy="289" r="5.5"/>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="174" y="207.5" textLength="183" lengthAdjust="spacing">律法主義の奴隷</text>
    <text x="175" y="248.5" textLength="129" lengthAdjust="spacing">心霊の腐敗</text>
    <text x="174" y="289.5" textLength="181" lengthAdjust="spacing">信徒はイエスに</text>
    <text x="174" y="331" textLength="48" lengthAdjust="spacing">従う</text>
  </g>

  <!-- 今日 -->
  <g font-size="26" dominant-baseline="central">
    <text x="430" y="167">②</text>
    <text x="466" y="167" textLength="128" lengthAdjust="spacing">キリスト教</text>
  </g>
  <g>
    <circle cx="436" cy="207.5" r="5.5"/>
    <circle cx="436" cy="248" r="5.5"/>
    <circle cx="436" cy="289" r="5.5"/>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="449" y="207.5" textLength="188" lengthAdjust="spacingAndGlyphs">教権と儀式の奴隷</text>
    <text x="449" y="248.5" textLength="210" lengthAdjust="spacingAndGlyphs">心霊が暗がりの中に</text>
    <text x="449" y="289.5" textLength="233" lengthAdjust="spacingAndGlyphs">信徒たちは新しい指導者を</text>
    <text x="449" y="330.5" textLength="207" lengthAdjust="spacingAndGlyphs">尋ねてさまよっている</text>
  </g>
</svg>
