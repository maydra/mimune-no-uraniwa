<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>宗教面　敬虔主義・メソジスト派・クェーカー派・天界の秘密から民主主義世界形成へ</title>

  <!-- 題 -->
  <text x="33" y="37.5" font-size="30" dominant-baseline="central" textLength="93" lengthAdjust="spacing">宗教面</text>
  <line x1="32" y1="56.5" x2="126" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="255,123 255,138 251,138 259,147.5 267,138 263,138 263,123"/>
    <polygon points="246,336 246,345 236.5,345 257,355.5 277.5,345 268,345 268,336"/>
  </g>

  <!-- 箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3">
    <rect x="150" y="74" width="216" height="44"/>
    <rect x="149.5" y="153" width="218.5" height="44"/>
    <rect x="149" y="219" width="218" height="44"/>
    <rect x="148" y="283" width="220" height="45"/>
  </g>
  <rect x="148" y="363.5" width="284" height="46.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>

  <!-- 箱の中の字 -->
  <g font-size="28" dominant-baseline="central">
    <g text-anchor="middle">
      <text x="186" y="96">敬</text>
      <text x="234" y="96">虔</text>
      <text x="282" y="96">主</text>
      <text x="330" y="96">義</text>
    </g>
    <text x="174" y="175" textLength="171" lengthAdjust="spacing">メソジスト派</text>
    <text x="174" y="241" textLength="170" lengthAdjust="spacing">クェーカー派</text>
    <text x="187" y="305.5" textLength="142" lengthAdjust="spacing">天界の秘密</text>
    <text x="175" y="386.5" textLength="230" lengthAdjust="spacing" fill="#111">民主主義世界形成</text>
  </g>

  <!-- 右の字 -->
  <g font-size="27" dominant-baseline="central">
    <text y="97.5"><tspan x="394" textLength="79" lengthAdjust="spacing">ドイツ</tspan><tspan x="489" text-anchor="middle">：</tspan><tspan x="507" textLength="169" lengthAdjust="spacing">シュペーネル</tspan></text>
    <text x="504" y="132" textLength="173" lengthAdjust="spacing">神秘的な体験</text>
    <text y="175"><tspan x="389" textLength="85" lengthAdjust="spacingAndGlyphs">イギリス</tspan><tspan x="489" text-anchor="middle">：</tspan><tspan x="507" textLength="178" lengthAdjust="spacing">ウェスレイ兄弟</tspan></text>
    <text y="241"><tspan x="402.5" text-anchor="middle">英</tspan><tspan x="460" text-anchor="middle">国</tspan><tspan x="489" text-anchor="middle">：</tspan><tspan x="507" textLength="139" lengthAdjust="spacing">フォックス</tspan></text>
    <text x="390" y="304" font-size="25" textLength="234" lengthAdjust="spacing">スウェーデンボルグ</text>
  </g>
</svg>
