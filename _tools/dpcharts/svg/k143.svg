<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アダム・ノア・アブラハム：復帰したアダム型の人物</title>

  <text x="466" y="68" font-size="22" dominant-baseline="central" textLength="233" lengthAdjust="spacing">復帰したアダム型の人物</text>

  <!-- 矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="254,125 302,125 302,119 321,128 302,137 302,131 254,131"/>
    <polygon points="452,125 504,125 504,119 523,128 504,137 504,131 452,131"/>
  </g>

  <g stroke="currentColor" stroke-width="2.2" fill="#F8F28F">
    <ellipse cx="188.5" cy="127.5" rx="65" ry="36"/>
    <ellipse cx="386.5" cy="127.5" rx="65" ry="36"/>
    <ellipse cx="588.5" cy="127.5" rx="65" ry="36"/>
  </g>
  <g dominant-baseline="central" text-anchor="middle" fill="#111">
    <text x="189" y="127" font-size="31" textLength="90" lengthAdjust="spacing">アダム</text>
    <text x="385" y="127.5" font-size="31" textLength="60" lengthAdjust="spacing">ノア</text>
    <text x="587" y="127" font-size="27" textLength="116" lengthAdjust="spacingAndGlyphs">アブラハム</text>
  </g>

  <!-- 点線 -->
  <g stroke="#8C949A" stroke-width="3" stroke-dasharray="10 7.5">
    <line x1="189" y1="183" x2="189" y2="298"/>
    <line x1="386" y1="183" x2="386" y2="298"/>
    <line x1="587" y1="183" x2="587" y2="298"/>
  </g>

  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="192.5" y="329" textLength="108" lengthAdjust="spacing">三大祝福</text>
    <text x="388" y="329" textLength="112" lengthAdjust="spacing">三大祝福</text>
    <text x="588" y="324" textLength="116" lengthAdjust="spacing">祝福の基</text>
    <text x="588" y="360" font-size="24" textLength="104" lengthAdjust="spacing">(創 12:2)</text>
  </g>
</svg>
