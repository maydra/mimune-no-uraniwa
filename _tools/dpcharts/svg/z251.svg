    <ellipse cx="654" cy="344.5" rx="87" ry="51" fill="#CF921C"/>
    <ellipse cx="1007" cy="344.5" rx="87" ry="51" fill="#F98AEE"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
