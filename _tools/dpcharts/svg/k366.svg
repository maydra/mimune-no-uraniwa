  <g font-size="28" dominant-baseline="central">
    <text x="138" y="286" textLength="84" lengthAdjust="spacing">象徴的</text>
    <text x="139" y="323" textLength="83" lengthAdjust="spacing">家庭的</text>
    <text x="262" y="309" textLength="84" lengthAdjust="spacing">形象的</text>
    <text x="262" y="346.5" textLength="84" lengthAdjust="spacing">民族的</text>
    <text x="376" y="351" textLength="83" lengthAdjust="spacing">実体的</text>
    <text x="375" y="388.5" textLength="84" lengthAdjust="spacing">世界的</text>
