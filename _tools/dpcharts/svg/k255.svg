<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>信仰基台：中心人物・条件物・蕩減期間</title>

  <!-- 神とモーセ -->
  <polygon points="178.5,246 178.5,133 173,133 181.5,117 190,133 184.5,133 184.5,246" fill="#8C949A"/>
  <circle cx="181.5" cy="75.5" r="35.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="181.5" y="76.5" font-size="40" text-anchor="middle" dominant-baseline="central">神</text>
  <ellipse cx="181.5" cy="274" rx="53.5" ry="27.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="181" y="274" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="81" lengthAdjust="spacing" fill="#111">モーセ</text>

  <!-- 信仰基台の札とかっこ -->
  <path d="M317,114 H298.5 V303.5 H317 M298.5,166.5 H317 M280,193.5 H298.5" fill="none" stroke="#8C949A" stroke-width="5.5"/>
  <rect x="206" y="157" width="73" height="64.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="242.5" y="176.5" textLength="51" lengthAdjust="spacing">信仰</text>
    <text x="242.5" y="205" textLength="51" lengthAdjust="spacing">基台</text>
  </g>

  <!-- 中身 -->
  <g font-size="28" dominant-baseline="central">
    <text x="328" y="111.5" textLength="115" lengthAdjust="spacing">中心人物</text>
    <text x="457.5" y="111.5" text-anchor="middle">：</text>
    <text x="473" y="111.5" textLength="85" lengthAdjust="spacing">モーセ</text>
    <text x="328" y="167.5" textLength="86" lengthAdjust="spacing">条件物</text>
    <text x="428.5" y="167.5" text-anchor="middle">：</text>
    <text x="444" y="167.5" textLength="115" lengthAdjust="spacing">選民教育</text>
    <text x="328" y="306.5" textLength="114" lengthAdjust="spacing">蕩減期間</text>
    <text x="457.5" y="306.5" text-anchor="middle">：</text>
    <text x="473" y="306.5" textLength="114" lengthAdjust="spacing">パロ宮中</text>
    <text x="595" y="306.5" textLength="28" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="632" y="306.5">年</text>
  </g>
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="395" y="210.5" textLength="302" lengthAdjust="spacing">選民の血統に対する忠節</text>
    <text x="396" y="250" textLength="228" lengthAdjust="spacing">パロ宮中から脱出</text>
  </g>

  <!-- 信仰基台：○ -->
  <rect x="326" y="349" width="241" height="51.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="34" dominant-baseline="central" fill="#111">
    <text x="347" y="375" textLength="136" lengthAdjust="spacing">信仰基台</text>
    <text x="500" y="375" text-anchor="middle">：</text>
  </g>
  <circle cx="533.5" cy="374.5" r="14" fill="none" stroke="#111" stroke-width="3.5"/>
</svg>
