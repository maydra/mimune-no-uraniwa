<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>メシヤ降臨準備時代とメシヤ再降臨準備時代　メシヤ迎える準備と再臨主迎える準備</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="127" y="51" width="277.5" height="54" rx="5"/>
    <rect x="413.5" y="51" width="277.5" height="54" rx="5"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="267" y="78" textLength="259" lengthAdjust="spacingAndGlyphs">メシヤ降臨準備時代</text>
    <text x="553.5" y="78" textLength="259" lengthAdjust="spacingAndGlyphs">メシヤ再降臨準備時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <rect x="129" y="113.5" width="275.5" height="278" rx="6"/>
    <rect x="415" y="113.5" width="275.5" height="278" rx="6"/>
  </g>

  <!-- ①② -->
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="150.5" cy="133.5" r="10.5"/>
    <circle cx="436" cy="133.5" r="10.5"/>
  </g>
  <g font-size="16" text-anchor="middle" dominant-baseline="central">
    <text x="150.5" y="134">1</text>
    <text x="436" y="134">2</text>
  </g>

  <!-- 灰色の括弧 -->
  <g fill="none" stroke="#8C949A" stroke-width="5.5">
    <path d="M177,150 H162 V183 H178"/>
    <path d="M176,211 H161 V271.5 H177"/>
  </g>

  <!-- 灰色の下向きの矢印 -->
  <g fill="#8C949A">
    <polygon points="261.5,289 272,289 272,295 277,295 266.75,301.5 256.5,295 261.5,295"/>
    <polygon points="261.5,339 272,339 272,345 277,345 266.75,351.5 256.5,345 261.5,345"/>
    <polygon points="548,273 559.5,273 559.5,281 565.5,281 553.75,289.5 542,281 548,281"/>
    <polygon points="548,333 559.5,333 559.5,341 565.5,341 553.75,349.5 542,341 548,341"/>
  </g>

  <!-- ① の字 -->
  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="182" y="148.5" textLength="143" lengthAdjust="spacing">預言者マラキ</text>
    <text x="182" y="179" textLength="166" lengthAdjust="spacing">ユダヤ教を刷新</text>
    <text x="183" y="210.5" textLength="68" lengthAdjust="spacing">インド</text>
    <text x="265" y="210.5" text-anchor="middle">：</text>
    <text x="277" y="210.5" textLength="94" lengthAdjust="spacing">釈迦牟尼</text>
    <text x="183" y="241" textLength="82" lengthAdjust="spacing">ギリシャ</text>
    <text x="277.5" y="241" text-anchor="middle">：</text>
    <text x="291" y="241" textLength="103" lengthAdjust="spacing">ソクラテス</text>
    <text x="182" y="272.5" textLength="47" lengthAdjust="spacing">東洋</text>
    <text x="241" y="272.5" text-anchor="middle">：</text>
    <text x="254" y="272.5" textLength="46" lengthAdjust="spacing">孔子</text>
    <text x="152" y="370.5" textLength="233" lengthAdjust="spacingAndGlyphs">キリスト教文化圏に統合</text>
  </g>
  <text x="173.5" y="319.5" font-size="24" dominant-baseline="central" textLength="189" lengthAdjust="spacing">メシヤ迎える準備</text>

  <!-- ② の字 -->
  <g font-size="26" dominant-baseline="central">
    <text x="439" y="188.5" textLength="104" lengthAdjust="spacing">文芸復興</text>
    <text x="556" y="188.5" text-anchor="middle">：</text>
  </g>
  <g font-size="23" font-weight="400" dominant-baseline="central">
    <text y="221.5"><tspan x="462" textLength="43" lengthAdjust="spacing">政治</tspan><tspan x="505">、</tspan><tspan x="526" textLength="43" lengthAdjust="spacing">経済</tspan><tspan x="569">、</tspan><tspan x="590" textLength="43" lengthAdjust="spacing">文化</tspan><tspan x="633">、</tspan></text>
    <text y="253.5"><tspan x="460" textLength="84" lengthAdjust="spacing">科学など</tspan><tspan x="545">、</tspan><tspan x="567" textLength="106" lengthAdjust="spacing">急激に発展</tspan></text>
    <text x="442" y="367.5" font-size="24" textLength="111" lengthAdjust="spacing">時代的背景</text>
    <text x="575" y="367.5" font-size="24" textLength="91" lengthAdjust="spacing">環境成熟</text>
  </g>
  <circle cx="563.5" cy="367.5" r="2.3"/>
  <text x="458.5" y="311" font-size="24" dominant-baseline="central" textLength="190" lengthAdjust="spacing">再臨主迎える準備</text>
</svg>
