<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>堕落性本性を脱ぐための蕩減条件</title>

  <!-- 題 -->
  <text x="34" y="31.5" font-size="31" textLength="472" lengthAdjust="spacing" dominant-baseline="central">堕落性本性を脱ぐための蕩減条件</text>
  <line x1="33" y1="50.5" x2="506" y2="50.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="234.5,152 234.5,134 239.5,134 231.5,121 223.5,134 228.5,134 228.5,152"/>
    <polygon points="530,174.5 311,174.5 311,169.5 298,177.5 311,185.5 311,180.5 530,180.5"/>
  </g>

  <!-- 神 -->
  <circle cx="231.5" cy="90" r="28" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="231" y="89.5" font-size="32" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- アベルとカイン -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="231.5" cy="177" rx="60" ry="25.5" fill="#F8F28F"/>
    <ellipse cx="588.5" cy="177.5" rx="60" ry="25.5" fill="#F86D42"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="232.5" y="178" textLength="83" lengthAdjust="spacing">アベル</text>
    <text x="588.5" y="178" textLength="83" lengthAdjust="spacing">カイン</text>
  </g>
  <g font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="231" y="217.5" textLength="142" lengthAdjust="spacing">（アダムの立場）</text>
    <text x="591.5" y="217.5" textLength="143" lengthAdjust="spacing">（天使長の立場）</text>
  </g>

  <!-- 蕩減条件 -->
  <rect x="184.5" y="241" width="438.5" height="175.5" rx="9" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <rect x="344" y="215" width="126" height="35.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="407.5" y="233" font-size="26" textLength="104" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central" fill="#111">蕩減条件</text>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text y="272"><tspan x="207">①</tspan><tspan x="239" textLength="179" lengthAdjust="spacing">アベルを愛する</tspan></text>
    <text y="309"><tspan x="207">②</tspan><tspan x="239" textLength="232" lengthAdjust="spacing">アベルを仲保とする</tspan></text>
    <text y="346"><tspan x="207">③</tspan><tspan x="239" textLength="284" lengthAdjust="spacing">アベルに従順に屈伏する</tspan></text>
    <text y="383"><tspan x="207">④</tspan><tspan x="239" textLength="362" lengthAdjust="spacing">アベルから善のみ言を伝え受ける</tspan></text>
  </g>
</svg>
