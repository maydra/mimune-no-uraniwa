<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>成長期間の三段階と三数の例</title>

  <!-- 成長期間の矢印と線 -->
  <polygon points="330,200 378.5,259 351,259 351,510 312,510 312,259 283,259" fill="#C4CCD3" stroke="currentColor" stroke-width="2.5"/>
  <g stroke="currentColor" stroke-width="6">
    <line x1="230" y1="197" x2="554" y2="197"/>
    <line x1="237" y1="510.5" x2="546" y2="510.5"/>
  </g>
  <g stroke="currentColor" stroke-width="5">
    <line x1="270" y1="306" x2="554.5" y2="306" stroke-dasharray="6.6 6.04"/>
    <line x1="270" y1="413" x2="550.5" y2="413" stroke-dasharray="6.6 5.85"/>
  </g>
  <g stroke="#111" stroke-width="5">
    <line x1="312" y1="306" x2="351" y2="306" stroke-dasharray="6.6 6.04" stroke-dashoffset="4.08"/>
    <line x1="312" y1="413" x2="351" y2="413" stroke-dasharray="6.6 5.85" stroke-dashoffset="4.65"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="330.5" cy="137" rx="109.5" ry="54" fill="#CDF8F7"/>
    <ellipse cx="330.5" cy="565.3" rx="104" ry="52.3" fill="#DCC4C4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="330.5" y="138" font-size="56">完成</text>
    <text x="329.5" y="566.5" font-size="53">被造物</text>
  </g>

  <text x="244.5" y="290" font-size="44" text-anchor="middle" dominant-baseline="central">成<tspan x="244.5" dy="44.2">長</tspan><tspan x="244.5" dy="44.2">期</tspan><tspan x="244.5" dy="44.2">間</tspan></text>
  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="466.5" y="254">完成期</text>
    <text x="465.5" y="360">長成期</text>
    <text x="465.5" y="466.5">蘇生期</text>
  </g>

  <!-- 三数の例 -->
  <g font-size="45" dominant-baseline="central">
    <text y="161" text-anchor="middle"><tspan x="607.5">［</tspan><tspan x="707.5">三数の例</tspan><tspan x="808">］</tspan></text>
    <text y="249"><tspan x="592">自然界</tspan><tspan x="749" text-anchor="middle">：</tspan><tspan x="772">鉱物、</tspan><tspan x="895">植物、</tspan><tspan x="1019">動物</tspan></text>
    <text y="332"><tspan x="592">物質</tspan><tspan x="704.5" text-anchor="middle">：</tspan><tspan x="727">気体、</tspan><tspan x="850">液体、</tspan><tspan x="976">固体</tspan></text>
    <text y="415.5"><tspan x="592">植物</tspan><tspan x="704.5" text-anchor="middle">：</tspan><tspan x="726">根、</tspan><tspan x="806">幹、</tspan><tspan x="885">葉</tspan></text>
    <text y="498.5"><tspan x="592">動物</tspan><tspan x="704.5" text-anchor="middle">：</tspan><tspan x="727">頭部、</tspan><tspan x="850">胴部、</tspan><tspan x="975">四肢</tspan></text>
  </g>
</svg>
