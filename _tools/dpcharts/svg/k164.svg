<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>鳩を裂かない：サタン侵入（荒い鳥が降りた→サタンが供え物に侵入）</title>

  <!-- 左の段 -->
  <g stroke="currentColor">
    <line x1="129" y1="50.5" x2="280" y2="50.5" stroke-width="3"/>
    <line x1="129" y1="126.5" x2="280" y2="126.5" stroke-width="2.5"/>
    <line x1="129" y1="206" x2="280" y2="206" stroke-width="3"/>
    <line x1="129" y1="287" x2="280" y2="287" stroke-width="3"/>
  </g>
  <line x1="203" y1="112" x2="203" y2="222" stroke="currentColor" stroke-width="2.5" stroke-dasharray="6 4.5"/>
  <g fill="#DCC4C4" stroke="currentColor" stroke-width="2.6">
    <rect x="157.3" y="65.3" width="91.7" height="45.8" rx="5"/>
    <rect x="157.3" y="142.3" width="91.7" height="46" rx="5"/>
    <rect x="157.3" y="222.3" width="91.7" height="46" rx="5"/>
  </g>
  <g font-size="30.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="201" y="88.5">雌牛</text>
    <text x="203.5" y="166">羊</text>
    <text x="204" y="246">鳩</text>
  </g>
  <path d="M290,51 Q298,52 298,64 L298,154 Q299,165 306,167.5 Q299,170 298,181 L298,272 Q298,285 290,286" fill="none" stroke="currentColor" stroke-width="2.8"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="320,160.5 335,160.5 335,153 346,167 335,181 335,175.5 320,175.5"/>
    <polygon points="507,179 523,190 515,190 515,205.5 499.5,205.5 499.5,190 491.5,190"/>
    <polygon points="368,383 382.5,383 382.5,379 394.5,387 382.5,395 382.5,391 368,391"/>
  </g>

  <!-- サタン侵入 -->
  <rect x="360.4" y="42.4" width="299.7" height="125.9" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <g dominant-baseline="central">
    <text x="377" y="69.5" font-size="28" textLength="146" lengthAdjust="spacing">サタン侵入</text>
    <text x="536.5" y="69.5" font-size="28" text-anchor="middle">：</text>
    <text x="408" y="105" font-size="25" textLength="236" lengthAdjust="spacing">みなサタンにささげた</text>
    <text x="408" y="142" font-size="25" textLength="116" lengthAdjust="spacing">結果となる</text>
  </g>

  <!-- 鳩を裂かない -->
  <rect x="315.4" y="219" width="385.6" height="129.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <g dominant-baseline="central">
    <text x="330" y="246" font-size="28" textLength="173" lengthAdjust="spacing">鳩を裂かない</text>
    <text x="517" y="246" font-size="28" text-anchor="middle">：</text>
    <text x="356" y="283.5" font-size="23.5" textLength="332" lengthAdjust="spacing">サタンのものをそのままささげたこと</text>
    <text x="356" y="323" font-size="23.5" textLength="315" lengthAdjust="spacing">サタンの所有物であることを確認</text>
  </g>
  <circle cx="345" cy="282" r="6.2"/>
  <circle cx="344.5" cy="323" r="6"/>

  <!-- 下の行 -->
  <circle cx="162" cy="387.5" r="6"/>
  <g font-size="26" dominant-baseline="central">
    <text x="173" y="387" textLength="181" lengthAdjust="spacing">荒い鳥が降りた</text>
    <text x="408" y="387.5" textLength="259" lengthAdjust="spacing">サタンが供え物に侵入</text>
  </g>
</svg>
