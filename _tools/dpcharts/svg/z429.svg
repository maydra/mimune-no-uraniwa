<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスの十字架と王国の預言（ルカ19:44、イザヤ書9章6節以下、ルカ1:31〜33）</title>

  <!-- 行頭の● -->
  <circle cx="161" cy="180.5" r="17.5"/>
  <circle cx="161" cy="554.5" r="17.5"/>
  <circle cx="161" cy="1511.5" r="17.5"/>

  <!-- 1つ目（細字） -->
  <g font-size="79" font-weight="400" dominant-baseline="central">
    <text y="180.5"><tspan x="193.7" textLength="991.6" lengthAdjust="spacing">イエスが預言されたように</tspan><tspan x="1222.5" text-anchor="middle">(</tspan><tspan x="1241.5" textLength="158" lengthAdjust="spacing">ルカ</tspan> <tspan x="1463.5" text-anchor="middle" textLength="76" lengthAdjust="spacingAndGlyphs">19</tspan><tspan x="1531" text-anchor="middle">：</tspan><tspan x="1600" text-anchor="middle" textLength="80" lengthAdjust="spacingAndGlyphs">44</tspan><tspan x="1654" text-anchor="middle">)</tspan><tspan x="1682">、</tspan><tspan x="1759.5" textLength="819" lengthAdjust="spacing">彼が亡くなられたのち</tspan><tspan x="2578.5">、</tspan><tspan x="2660.5">イ</tspan></text>
    <text y="297.5"><tspan x="196.4" textLength="1316.3" lengthAdjust="spacing">スラエル選民が衰亡したのを見ても</tspan><tspan x="1512.7">、</tspan><tspan x="1586.2" textLength="1156.5" lengthAdjust="spacing">イエスはユダヤ人たちの不信に</tspan></text>
    <text y="414"><tspan x="200" textLength="1427.4" lengthAdjust="spacing">よって十字架につけられたことが分かる</tspan><tspan x="1627.4">。</tspan></text>
  </g>

  <!-- 2つ目（イザヤ書の引用は太字） -->
  <text y="554" font-size="79" font-weight="400" dominant-baseline="central"><tspan x="201.2" textLength="870.1" lengthAdjust="spacing">イザヤ書９章６節以下に</tspan><tspan x="1071.3">、</tspan><tspan x="1168" text-anchor="end">『</tspan><tspan x="1168.2" font-size="76.5" font-weight="700" textLength="1532.6" lengthAdjust="spacing">ひとりのみどりごがわれわれのために生れた</tspan><tspan x="2700.8" font-size="76.5" font-weight="700">、</tspan></text>
  <g font-size="76.5" dominant-baseline="central">
    <text y="671"><tspan x="200" textLength="1386" lengthAdjust="spacing">ひとりの男の子がわれわれに与えられた</tspan><tspan x="1586">。</tspan><tspan x="1662.5" textLength="924.6" lengthAdjust="spacing">まつりごとはその肩にあり</tspan><tspan x="2587.1">、</tspan><tspan x="2664.1">そ</tspan></text>
    <text y="787.5"><tspan x="199.5" textLength="231" lengthAdjust="spacing">の名は</tspan><tspan x="434">、</tspan><tspan x="548" text-anchor="end">「</tspan><tspan x="550.3" textLength="470.4" lengthAdjust="spacing">霊妙なる議士</tspan><tspan x="1020.7">、</tspan><tspan x="1097.5" textLength="312" lengthAdjust="spacing">大能の神</tspan><tspan x="1409.5">、</tspan><tspan x="1487.75" textLength="471" lengthAdjust="spacing">とこしえの父</tspan><tspan x="1958.75">、</tspan><tspan x="2035.3" textLength="313.3" lengthAdjust="spacing">平和の君</tspan><tspan x="2348.6">」</tspan><tspan x="2427.8" textLength="313.3" lengthAdjust="spacing">ととなえ</tspan></text>
    <text y="904.5"><tspan x="201.5" textLength="231" lengthAdjust="spacing">られる</tspan><tspan x="432.5">。</tspan><tspan x="507.5" textLength="925" lengthAdjust="spacing">そのまつりごとと平和とは</tspan><tspan x="1432.5">、</tspan><tspan x="1508" textLength="770" lengthAdjust="spacing">増し加わって限りなく</tspan><tspan x="2278">、</tspan><tspan x="2357.2" textLength="383" lengthAdjust="spacing">ダビデの位</tspan></text>
    <text y="1021.5"><tspan x="200.1" textLength="307.3" lengthAdjust="spacing">に座して</tspan><tspan x="507.4">、</tspan><tspan x="584.5" textLength="462" lengthAdjust="spacing">その国を治め</tspan><tspan x="1046.5">、</tspan><tspan x="1123.4" textLength="308.7" lengthAdjust="spacing">今より後</tspan><tspan x="1432.1">、</tspan><tspan x="1509.05" textLength="1230.4" lengthAdjust="spacing">とこしえに公平と正義とをもってこ</tspan></text>
    <text y="1137.5"><tspan x="199.4" textLength="312.7" lengthAdjust="spacing">れを立て</tspan><tspan x="512">、</tspan><tspan x="587.3" textLength="548.3" lengthAdjust="spacing">これを保たれる</tspan><tspan x="1135.6">。</tspan><tspan x="1213.4" textLength="1486.8" lengthAdjust="spacing">万軍の主の熱心がこれをなされるのである</tspan><tspan x="2700.2" font-weight="400">』</tspan></text>
  </g>
  <text x="1100.5" y="730.5" font-size="37" font-weight="400" dominant-baseline="central" textLength="148" lengthAdjust="spacing">たいのう</text>
  <g font-size="79" font-weight="400" dominant-baseline="central">
    <text y="1254.5"><tspan x="200.3" textLength="1348.8" lengthAdjust="spacing">とイエスがダビデ王の位をもってきて</tspan><tspan x="1549.1">、</tspan><tspan x="1628.3" textLength="1110.9" lengthAdjust="spacing">永遠に滅びない王国を建てるこ</tspan></text>
    <text y="1371"><tspan x="200.5" textLength="632" lengthAdjust="spacing">とを預言している</tspan><tspan x="832.5">。</tspan></text>
  </g>

  <!-- 3つ目（ルカ1章の引用は太字） -->
  <text x="974.5" y="1451" font-size="37" font-weight="400" dominant-baseline="central" textLength="150" lengthAdjust="spacing">かいたい</text>
  <text y="1511.5" font-size="79" font-weight="400" dominant-baseline="central"><tspan x="200.8" textLength="397" lengthAdjust="spacing">それゆえに</tspan><tspan x="597.8">、</tspan><tspan x="647.7" textLength="956.2" lengthAdjust="spacing">イエスが懐胎されるときも</tspan><tspan x="1603.9">、</tspan><tspan x="1662" textLength="790" lengthAdjust="spacing">天使がマリヤに現れて</tspan><tspan x="2452">、</tspan><tspan x="2548" text-anchor="end">『</tspan><tspan x="2547.75" font-size="76.5" font-weight="700" textLength="155" lengthAdjust="spacing">見よ</tspan><tspan x="2702.75" font-size="76.5" font-weight="700">、</tspan></text>
  <g font-size="76.5" dominant-baseline="central">
    <text y="1628"><tspan x="199.5" textLength="1462.5" lengthAdjust="spacing">あなたはみごもって男の子を産むでしょう</tspan><tspan x="1662">、</tspan><tspan x="1740.5" textLength="1000.5" lengthAdjust="spacing">その子をイエスと名づけなさ</tspan></text>
    <text y="1744.5"><tspan x="200" textLength="1771" lengthAdjust="spacing">い…主なる神は彼に父ダビデの王座をお与えになり</tspan><tspan x="1971">、</tspan><tspan x="2048" textLength="692.4" lengthAdjust="spacing">彼はとこしえにヤコ</tspan></text>
    <text y="1861"><tspan x="201.6" textLength="558.6" lengthAdjust="spacing">ブの家を支配し</tspan><tspan x="755">、</tspan><tspan x="833.2" textLength="1195.2" lengthAdjust="spacing">その支配は限りなく続くでしょう</tspan><tspan x="2028.4" font-weight="400">』</tspan><tspan x="2145" font-size="66" font-weight="400" text-anchor="end">（</tspan><tspan x="2148" font-size="66" font-weight="400" textLength="132" lengthAdjust="spacing">ルカ</tspan> <tspan x="2302" font-size="66" font-weight="400">1</tspan><tspan x="2372" font-size="66" font-weight="400" text-anchor="middle">：</tspan><tspan x="2411" font-size="66" font-weight="400">31</tspan> <tspan x="2520" font-size="66" font-weight="400">～</tspan> <tspan x="2606" font-size="66" font-weight="400" textLength="93" lengthAdjust="spacingAndGlyphs">33</tspan><tspan x="2703" font-size="66" font-weight="400">）</tspan></text>
  </g>
  <text y="1978" font-size="79" font-weight="400" dominant-baseline="central"><tspan x="200.5" textLength="1028" lengthAdjust="spacing">というみ言を伝えたのである</tspan><tspan x="1228.5">。</tspan></text>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="1168" y1="610.5" x2="2702" y2="610.5"/>
    <line x1="1488" y1="843.5" x2="2349" y2="843.5"/>
    <line x1="1629" y1="1311.5" x2="2342" y2="1311.5"/>
    <line x1="1740" y1="1683.5" x2="2741" y2="1683.5"/>
    <line x1="201" y1="1800.5" x2="277" y2="1800.5"/>
    <line x1="2048" y1="1800.5" x2="2741" y2="1800.5"/>
    <line x1="201" y1="1917.5" x2="675" y2="1917.5"/>
  </g>
</svg>
