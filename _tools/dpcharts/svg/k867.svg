<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>② 各宗教の開祖たちの韓国再臨の啓示</title>
  <defs>
    <marker id="k867-g" viewBox="0 0 12 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <!-- 題 -->
  <text x="34" y="38.5" font-size="28" dominant-baseline="central">②</text>
  <text x="77" y="38.5" font-size="28" dominant-baseline="central" textLength="460" lengthAdjust="spacing">各宗教の開祖たちの韓国再臨の啓示</text>
  <line x1="76" y1="56.5" x2="538" y2="56.5" stroke="currentColor" stroke-width="2"/>

  <g font-size="28" dominant-baseline="central">
    <text x="176" y="107" textLength="144" lengthAdjust="spacing">キリスト教</text>
    <text x="332" y="107" text-anchor="middle">：</text>
    <text x="348" y="107" textLength="316" lengthAdjust="spacing">あらゆる宗教の目的完成</text>
  </g>

  <!-- 灰色の矢印 -->
  <polygon points="211,140 223,140 223,186 230,186 217,208 204,186 211,186" fill="#8C949A"/>
  <g stroke="#8C949A" stroke-width="4" fill="none" marker-end="url(#k867-g)">
    <line x1="389" y1="182" x2="283.4" y2="236.7"/>
    <line x1="389" y1="242" x2="286" y2="255.8"/>
    <line x1="389" y1="304" x2="284.8" y2="275.8"/>
    <line x1="393" y1="366" x2="281.2" y2="294.7"/>
  </g>

  <!-- 再臨主 -->
  <ellipse cx="217" cy="262" rx="50.5" ry="32.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <text x="217" y="262" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="81" lengthAdjust="spacing">再臨主</text>

  <!-- 開祖 -->
  <g fill="#DCC4C4" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="449" cy="180.5" rx="59.5" ry="23"/>
    <ellipse cx="446.5" cy="241.5" rx="60" ry="23"/>
    <ellipse cx="450.5" cy="304.5" rx="60" ry="23"/>
    <ellipse cx="453" cy="368" rx="59.5" ry="23"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="449.5" y="180.5" textLength="81" lengthAdjust="spacing">弥勒仏</text>
    <text x="449.5" y="241.5" textLength="74" lengthAdjust="spacing">真　人</text>
    <text x="450.5" y="304.5" textLength="83" lengthAdjust="spacing">崔水雲</text>
    <text x="453" y="368" textLength="83" lengthAdjust="spacing">正道令</text>
  </g>

  <!-- 宗教 -->
  <g stroke="currentColor" stroke-width="5.5">
    <line x1="524" y1="181.5" x2="557" y2="181.5"/>
    <line x1="524" y1="240.5" x2="557" y2="240.5"/>
    <line x1="524" y1="304.5" x2="557" y2="304.5"/>
    <line x1="524" y1="367" x2="557" y2="367"/>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="568" y="181" textLength="56" lengthAdjust="spacing">仏教</text>
    <text x="567" y="241" textLength="57" lengthAdjust="spacing">儒教</text>
    <text x="568" y="304" textLength="85" lengthAdjust="spacing">天道教</text>
    <text x="568" y="368" textLength="86" lengthAdjust="spacing">鄭鑑録</text>
  </g>
</svg>
