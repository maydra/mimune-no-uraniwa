<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第三の試練　『ひれ伏して拝むなら、皆あげよう』（マタイ 4:9）</title>

  <text x="35" y="37.5" font-size="30" dominant-baseline="central" textLength="157" lengthAdjust="spacing">第三の試練</text>
  <line x1="35" y1="56.5" x2="191" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text y="85.5"><tspan x="152">『</tspan><tspan x="169" textLength="226" lengthAdjust="spacing">ひれ伏して拝むなら</tspan><tspan x="398">、</tspan><tspan x="417" textLength="125" lengthAdjust="spacing">皆あげよう</tspan><tspan x="543">』</tspan></text>
    <text x="563" y="86" font-size="22" textLength="111" lengthAdjust="spacing">(マタイ 4:9)</text>
  </g>

  <!-- 山 -->
  <path d="M226,300 L234,284 L242,271 L246,253 L254,243 L262,221 L270,216 L282,207 L290,212 L294,217 L302,200 L306,186 L310,179 L318,173 L326,176 L334,184 L342,195 L350,202 L358,191 L364,189 L370,195 L378,207 L386,227 L394,236 L398,245 L402,265 L410,280 L414,292 L413,296 L404,295 L396,287 L386,287 L378,292 L366,293 L354,290 L346,295 L338,290 L326,292 L318,302 L313,292 L302,290 L290,287 L278,288 L266,289 L258,296 L250,292 L242,300 L230,301 Z" fill="#A0F08A"/>
  <path d="M362,192 L318,268 M281,211 L322,276 M313,180 L301,214 M371,201 L391,248 M262,226 L252,262" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

  <!-- イエス -->
  <ellipse cx="318.5" cy="143.5" rx="52" ry="25" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="318.5" y="143.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="81" lengthAdjust="spacing" fill="#111">イエス</text>

  <text x="393" y="138" font-size="28" dominant-baseline="central" textLength="232" lengthAdjust="spacing">被造世界の主管者</text>
  <text y="172" font-size="22" font-weight="400" dominant-baseline="central"><tspan x="397" textLength="100" lengthAdjust="spacing">(コリント</tspan><tspan x="511.5" text-anchor="middle">Ⅰ</tspan> <tspan x="538" textLength="68" lengthAdjust="spacing">15:27)</tspan></text>
  <circle cx="528" cy="172" r="2.2"/>

  <!-- 万物の主人公の立場から、サタンに屈伏せよ -->
  <rect x="248.5" y="323.5" width="325" height="80" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central">
    <text y="347.5"><tspan x="262" textLength="289" lengthAdjust="spacing">万物の主人公の立場から</tspan><tspan x="550">、</tspan></text>
    <text x="262" y="382" textLength="210" lengthAdjust="spacing">サタンに屈伏せよ</text>
  </g>
</svg>
