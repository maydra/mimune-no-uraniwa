<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第二の試練　『飛びおりよ』（マタイ 4:6）</title>

  <text x="36" y="38" font-size="30" dominant-baseline="central" textLength="157" lengthAdjust="spacing">第二の試練</text>
  <line x1="35" y1="57" x2="192" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text y="85"><tspan x="157">『</tspan><tspan x="170" textLength="133" lengthAdjust="spacing">飛びおりよ</tspan><tspan x="300">』</tspan></text>
    <text x="324" y="85" textLength="131" lengthAdjust="spacing">(マタイ 4:6)</text>
  </g>

  <!-- イエス -->
  <ellipse cx="216.5" cy="137.5" rx="52" ry="25" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="216.5" y="137.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="81" lengthAdjust="spacing" fill="#111">イエス</text>

  <!-- 神殿（白い建物に灰色の線） -->
  <g fill="#fff" stroke="#6E7D84" stroke-width="1.5" stroke-linejoin="round">
    <path d="M185,193 A30.5,19 0 0 1 246,193 Z"/>
    <rect x="181" y="193" width="69" height="5"/>
    <rect x="177" y="198" width="77" height="5"/>
    <rect x="173" y="203" width="85" height="5.5"/>
    <rect x="168" y="208.5" width="95" height="12"/>
    <rect x="152" y="224" width="127" height="14"/>
    <polygon points="172,224 215.5,207.5 259,224"/>
    <rect x="154" y="238" width="123" height="51"/>
    <polygon points="156,289 275,289 279,296 152,296"/>
    <rect x="131" y="296" width="166" height="11"/>
    <path d="M152,231H279" fill="none"/>
    <path d="M173,238V289M179,238V289M183,238V289M189,238V289M193,238V289M199,238V289M203,238V289M209,238V289M213,238V289M219,238V289M223,238V289M229,238V289M233,238V289M239,238V289M243,238V289M249,238V289M253,238V289M259,238V289M157,239V289M161,239V289M165,239V289M169,239V289M263,239V289M267,239V289M271,239V289M275,239V289" fill="none"/>
  </g>
  <text x="214" y="262.5" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="54" lengthAdjust="spacing" fill="#111">神殿</text>

  <!-- 神殿の主人公 -->
  <text x="298" y="138" font-size="27" dominant-baseline="central" textLength="172" lengthAdjust="spacing">神殿の主人公</text>
  <g font-size="24" dominant-baseline="central">
    <text x="298" y="176.5" textLength="77" lengthAdjust="spacing">イエス</text>
    <text x="297" y="247" font-size="26" textLength="79" lengthAdjust="spacing">信　徒</text>
    <text x="500" y="179.5" font-size="25" textLength="78" lengthAdjust="spacing">本神殿</text>
    <text x="500" y="247.5" font-size="25" textLength="78" lengthAdjust="spacing">分神殿</text>
    <text x="487" y="274.5" font-size="23" textLength="166" lengthAdjust="spacing">キリストの肢体</text>
  </g>
  <g font-size="22" font-weight="400" dominant-baseline="central">
    <text x="300" y="206.5" textLength="128" lengthAdjust="spacing">(ヨハネ 2:19)</text>
    <text y="277.5"><tspan x="300" textLength="80" lengthAdjust="spacing">(コリント</tspan><tspan x="392" text-anchor="middle">Ⅰ</tspan> <tspan x="417" textLength="45" lengthAdjust="spacing">3:16)</tspan></text>
    <text y="304"><tspan x="490" textLength="90" lengthAdjust="spacing">(コリント</tspan><tspan x="592.5" text-anchor="middle">Ⅰ</tspan> <tspan x="619" textLength="61" lengthAdjust="spacing">12:27)</tspan></text>
  </g>
  <circle cx="408.5" cy="277.5" r="2.2"/>
  <circle cx="609.5" cy="304" r="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="468,172 479,172 479,167.5 486.5,178.5 479,189.5 479,185 468,185"/>
    <polygon points="469,240.5 480,240.5 480,235.5 487.5,247 480,258.5 480,253.5 469,253.5"/>
  </g>

  <!-- 堕落人間の立場に戻るならば、 -->
  <rect x="209.5" y="336.5" width="394" height="77" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="25" dominant-baseline="central">
    <text y="359"><tspan x="230" textLength="342" lengthAdjust="spacing">堕落人間の立場に戻るならば</tspan><tspan x="572">、</tspan></text>
    <text x="229" y="392" textLength="357" lengthAdjust="spacing">サタンが神殿主管者の位置占領</text>
  </g>
</svg>
