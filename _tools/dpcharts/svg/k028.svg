<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>創造目的を完成するための二つの条件</title>

  <text x="35" y="35.5" font-size="28" dominant-baseline="central" textLength="479" lengthAdjust="spacing">創造目的を完成するための二つの条件</text>
  <line x1="34" y1="54.5" x2="515" y2="54.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 創造目的完成 ＝ 実体基台 ＋ 信仰基台 -->
  <rect x="137" y="91" width="209" height="45" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="241.5" y="113.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="171" lengthAdjust="spacing">創造目的完成</text>
  <g stroke="currentColor" stroke-width="3">
    <line x1="233.5" y1="162" x2="233.5" y2="183"/>
    <line x1="244.5" y1="162" x2="244.5" y2="183"/>
  </g>
  <rect x="154" y="209" width="170" height="45" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="237.5" y="232" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="137" lengthAdjust="spacing">実体基台</text>
  <g stroke="currentColor" stroke-width="4.5">
    <line x1="222" y1="289" x2="248" y2="289"/>
    <line x1="235" y1="276" x2="235" y2="302"/>
  </g>
  <rect x="156" y="325.5" width="167" height="46.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="239" y="349" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="138" lengthAdjust="spacing">信仰基台</text>

  <!-- 灰色の枝分かれ -->
  <g stroke="#8C949A" stroke-width="5" fill="none">
    <path d="M369,209 H347.5 V256 H369 M325,232 H347.5"/>
    <path d="M369,309.5 H347.5 V387 H369 M324,348.5 H369"/>
  </g>

  <!-- 右の字 -->
  <circle cx="377" cy="93.5" r="5" fill="currentColor"/>
  <circle cx="377" cy="140.5" r="5" fill="currentColor"/>
  <g font-size="25" dominant-baseline="central">
    <text x="389" y="92.5" textLength="184" lengthAdjust="spacing">み言の完成実体</text>
    <text x="389" y="139.5" textLength="261" lengthAdjust="spacing">個性完成者（第一祝福）</text>
    <text x="380" y="207" textLength="103" lengthAdjust="spacing">神と一体</text>
    <text x="381" y="254" textLength="207" lengthAdjust="spacing">「信仰基台」の上で</text>
    <text x="382" y="308" textLength="137" lengthAdjust="spacing">アダム（人物）</text>
    <text x="380" y="350" textLength="233" lengthAdjust="spacing">神のみ言守る（条件）</text>
    <text x="380" y="392" textLength="180" lengthAdjust="spacing">成長期間（期間）</text>
  </g>
</svg>
