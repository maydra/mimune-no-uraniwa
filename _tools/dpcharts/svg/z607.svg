<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神・イエス・完成人間（完成人間は神と一体）</title>

  <!-- 上下の対の矢印 -->
  <g>
    <polygon points="327.5,165 340.5,189 333,189 333,271 322,271 322,189 314.5,189"/>
    <polygon points="348,174 359,174 359,257 366.5,257 353.5,279 340.5,257 348,257"/>
    <polygon points="327.5,408.5 340.5,431 333,431 333,513 322,513 322,431 314.5,431"/>
    <polygon points="348,417 359,417 359,500 366.5,500 353.5,521.5 340.5,500 348,500"/>
  </g>

  <!-- 神・イエス・完成人間の楕円 -->
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="340" cy="97.5" rx="101.5" ry="52.5" fill="#fff" class="paper"/>
    <ellipse cx="340" cy="340.75" rx="101.5" ry="52.75" fill="#F8F28F"/>
    <ellipse cx="340.25" cy="583.25" rx="106.75" ry="52.75" fill="#fff" class="paper"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="338.5" y="98.5" font-size="62">神</text>
    <text x="339.5" y="341" font-size="50" textLength="153" lengthAdjust="spacing" fill="#111">イエス</text>
    <text x="340.5" y="583.5" font-size="45" textLength="184" lengthAdjust="spacing">完成人間</text>
  </g>

  <text x="438" y="221.5" font-size="54" dominant-baseline="central" textLength="488" lengthAdjust="spacing">完成人間は神と一体</text>

  <text y="463.5" font-size="50" dominant-baseline="central"><tspan x="440.5">『</tspan><tspan x="462.5" textLength="350" lengthAdjust="spacing">人なるキリスト</tspan><tspan x="825.5">・</tspan><tspan x="862.5" textLength="150" lengthAdjust="spacing">イエス</tspan><tspan x="1011.5">』</tspan></text>
  <text y="530" font-size="42" dominant-baseline="central"><tspan x="633">（</tspan><tspan x="651.5" textLength="168" lengthAdjust="spacing">テモテⅠ</tspan> <tspan x="827.5" textLength="63" lengthAdjust="spacingAndGlyphs">2:5</tspan><tspan x="890">）</tspan></text>
</svg>
