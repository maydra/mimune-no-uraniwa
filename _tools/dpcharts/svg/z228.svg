<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヨブ記 31：33～34　アダムは下部を隠した　下部：科 → 罪を犯す</title>

  <text y="96" font-size="48" dominant-baseline="central"><tspan x="223" textLength="146" lengthAdjust="spacing">ヨブ記</tspan> <tspan x="381" textLength="44" lengthAdjust="spacingAndGlyphs">31</tspan><tspan x="431.4">：</tspan><tspan x="457.1" textLength="49" lengthAdjust="spacingAndGlyphs">33</tspan> <tspan x="520.2">～</tspan> <tspan x="582.1" textLength="50" lengthAdjust="spacingAndGlyphs">34</tspan></text>

  <!-- 聖句（細字） -->
  <g font-size="44" font-weight="400" dominant-baseline="central">
    <text y="179.5"><tspan x="214.8">「</tspan><tspan x="237.2" textLength="264" lengthAdjust="spacing">わたしがもし</tspan><tspan x="505.8">（</tspan><tspan x="529.2" textLength="313" lengthAdjust="spacing">アダムのごとく</tspan><tspan x="832.5">）</tspan><tspan x="866" textLength="224" lengthAdjust="spacing">人々の前に</tspan></text>
    <text y="234"><tspan x="237.2" textLength="450" lengthAdjust="spacing">わたしのとがをおおい</tspan><tspan x="682">、</tspan><tspan x="728.2" textLength="357.6" lengthAdjust="spacing">わたしの悪事を胸</tspan></text>
    <text y="289"><tspan x="237.2" textLength="573" lengthAdjust="spacing">の中に隠したことがあるなら</tspan><tspan x="802.9">」</tspan></text>
  </g>

  <!-- アダム → 下部を隠した -->
  <ellipse cx="389.5" cy="406.5" rx="84.5" ry="56.5" fill="#F98AEE" stroke="currentColor" stroke-width="4"/>
  <text x="390.5" y="405" font-size="52" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="135" lengthAdjust="spacingAndGlyphs">アダム</text>
  <polygon points="513.5,395.5 548,395.5 548,379.5 578.5,406.5 548,434 548,417.5 513.5,417.5" fill="#8C949A"/>
  <text x="607" y="408.5" font-size="56" dominant-baseline="central" textLength="349" lengthAdjust="spacing">下部を隠した</text>

  <!-- 下部：科 → 罪を犯す -->
  <rect x="356" y="528" width="592" height="101" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text y="578.5" font-size="54" dominant-baseline="central" fill="#111"><tspan x="386" textLength="108" lengthAdjust="spacing">下部</tspan><tspan x="510.3">：</tspan><tspan x="552">科</tspan><tspan x="704" textLength="218" lengthAdjust="spacing">罪を犯す</tspan></text>
  <polygon points="634,572 657.5,572 657.5,564 678,580 657.5,596 657.5,588 634,588" fill="#8C949A" stroke="#111" stroke-width="1.8"/>
</svg>
