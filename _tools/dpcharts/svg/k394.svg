<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第一の試練の結果</title>

  <text x="35" y="39.5" font-size="30" dominant-baseline="central" textLength="251" lengthAdjust="spacing">第一の試練の結果</text>
  <line x1="34" y1="58.5" x2="286" y2="58.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="303,134.5 430,134.5 430,140.5 452,129.5 430,118.5 430,124.5 303,124.5"/>
    <polygon points="400.5,285 400.5,301 388.5,301 407,318.5 425.5,301 413.5,301 413.5,285"/>
  </g>

  <!-- イエス → 個性完成したメシヤの立場 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="231.5" cy="128.5" rx="58" ry="27" fill="#F8F28F"/>
    <ellipse cx="565.5" cy="129" rx="103" ry="42.5" fill="#fff" class="paper"/>
  </g>
  <text x="230.5" y="128.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="83" lengthAdjust="spacing" fill="#111">イエス</text>
  <g font-size="25" dominant-baseline="central">
    <text x="487" y="114.5" textLength="159" lengthAdjust="spacing">個性完成した</text>
    <text x="488" y="143.5" textLength="157" lengthAdjust="spacing">メシヤの立場</text>
  </g>
  <text y="179" font-size="23" dominant-baseline="central"><tspan x="124">（</tspan><tspan x="136" textLength="188" lengthAdjust="spacing">洗礼ヨハネの立場</tspan><tspan x="323">）</tspan></text>

  <!-- 最初の試練：勝利 -->
  <rect x="283.5" y="224.5" width="251" height="48" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text x="294" y="248.5" textLength="144" lengthAdjust="spacing">最初の試練</text>
    <text x="452.5" y="248.5" text-anchor="middle">：</text>
    <text x="467" y="248.5" textLength="57" lengthAdjust="spacing">勝利</text>
  </g>

  <!-- 第一祝福復帰の基台：造成 -->
  <rect x="198.5" y="337.5" width="418" height="47" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="219" y="360.5" textLength="283" lengthAdjust="spacing">第一祝福復帰の基台</text>
    <text x="518" y="360.5" text-anchor="middle">：</text>
    <text x="534" y="360.5" textLength="62" lengthAdjust="spacing">造成</text>
  </g>
</svg>
