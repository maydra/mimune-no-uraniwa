<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>エジプト苦役時代とローマ帝国迫害時代　十戒・み言（旧約聖書）と福音・使徒記録（新約聖書）</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="129" y="54" width="276" height="54" rx="6"/>
    <rect x="415.5" y="54" width="276" height="54" rx="6"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="152.3" y="81" font-size="29" textLength="231.5" lengthAdjust="spacing">エジプト苦役時代</text>
    <text x="438.3" y="81" font-size="29" textLength="232.5" lengthAdjust="spacingAndGlyphs">ローマ帝国迫害時代</text>
  </g>
  <!-- 白い枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="129" y="116" width="276" height="260" rx="8"/>
    <rect x="415.5" y="116" width="276" height="260" rx="8"/>
  </g>
  <!-- 左：エジプト苦役時代 -->
  <g dominant-baseline="central">
    <text x="150" y="138" font-size="27" text-anchor="middle">①</text>
    <text x="154.3" y="178" font-size="28" textLength="58.4" lengthAdjust="spacing">十戒</text>
    <text x="211" y="178" font-size="28">、</text>
    <text x="239.3" y="178" font-size="28" textLength="56.4" lengthAdjust="spacing">み言</text>
    <text x="273" y="218" font-size="27" text-anchor="middle">：</text>
    <text x="287.4" y="218" font-size="27" textLength="103.2" lengthAdjust="spacingAndGlyphs">旧約聖書</text>
    <text x="154.3" y="263" font-size="28" textLength="48.4" lengthAdjust="spacingAndGlyphs">石板</text>
    <text x="202" y="263" font-size="28">、</text>
    <text x="224.3" y="263" font-size="28" textLength="49.4" lengthAdjust="spacingAndGlyphs">幕屋</text>
    <text x="272" y="263" font-size="28">、</text>
    <text x="298.3" y="263" font-size="28" textLength="96.4" lengthAdjust="spacingAndGlyphs">契約の箱</text>
    <text x="195" y="308" font-size="27" text-anchor="middle">：</text>
    <text x="208.4" y="308" font-size="27" textLength="178.2" lengthAdjust="spacingAndGlyphs">メシヤを迎える</text>
    <text x="207.3" y="347" font-size="28" textLength="180.4" lengthAdjust="spacingAndGlyphs">ための神のみ旨</text>
  </g>
  <!-- 右：ローマ帝国迫害時代 -->
  <g dominant-baseline="central">
    <text x="437" y="138" font-size="27" text-anchor="middle">②</text>
    <text x="441.4" y="178" font-size="27" textLength="52.2" lengthAdjust="spacingAndGlyphs">福音</text>
    <text x="493" y="178" font-size="27">、</text>
    <text x="517.4" y="178" font-size="27" textLength="106.2" lengthAdjust="spacing">使徒記録</text>
    <text x="560" y="220" font-size="27" text-anchor="middle">：</text>
    <text x="572.4" y="220" font-size="27" textLength="105.2" lengthAdjust="spacing">新約聖書</text>
    <text x="441.4" y="265" font-size="27" textLength="47.2" lengthAdjust="spacingAndGlyphs">教会</text>
    <text x="501" y="265" font-size="27" text-anchor="middle">：</text>
    <text x="512.4" y="265" font-size="27" textLength="164.2" lengthAdjust="spacingAndGlyphs">再臨主を迎える</text>
    <text x="508.4" y="304.5" font-size="27" textLength="129.2" lengthAdjust="spacingAndGlyphs">ための基台</text>
  </g>
  <g>
    <circle cx="144" cy="177" r="5.5"/>
    <circle cx="144" cy="263" r="5.5"/>
    <circle cx="430.5" cy="178" r="5.5"/>
    <circle cx="430.5" cy="265" r="5.5"/>
  </g>
</svg>
