<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>新しい理念はどこから出るようになるのだろうか</title>

  <!-- 題 -->
  <text x="35" y="38" font-size="26" dominant-baseline="central" textLength="554" lengthAdjust="spacing">新しい理念はどこから出るようになるのだろうか</text>
  <line x1="34" y1="56.5" x2="589" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 民主主義世界 → 新しい真理 → 新しい理念 -->
  <g font-size="25.5" dominant-baseline="central">
    <text x="147" y="108.5" textLength="155" lengthAdjust="spacing">民主主義世界</text>
    <text x="356" y="108.5" textLength="131" lengthAdjust="spacing">新しい真理</text>
    <text x="541" y="108.5" textLength="129" lengthAdjust="spacing">新しい理念</text>
  </g>
  <g fill="#8C949A">
    <polygon points="315,105.5 333.5,105.5 333.5,101.5 345.5,109 333.5,116.5 333.5,112.5 315,112.5"/>
    <polygon points="498,104.5 515.5,104.5 515.5,100 528,107.5 515.5,115.5 515.5,110.5 498,110.5"/>
  </g>

  <!-- 下向きの矢印（円より先に描く） -->
  <g fill="#8C949A">
    <polygon points="233.5,230 240.5,230 240.5,269 245.5,269 237,281.5 228.5,269 233.5,269"/>
    <polygon points="584.5,230 591.5,230 591.5,267.5 595.5,267.5 588,281.5 580.5,267.5 584.5,267.5"/>
    <polygon points="347,325.5 468.5,325.5 468.5,321 481.5,329 468.5,337 468.5,332.5 347,332.5"/>
  </g>

  <!-- 神とサタン -->
  <circle cx="238.5" cy="209" r="28.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="586.5" cy="206" rx="34" ry="30.8" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="237" y="208.5" font-size="32">神</text>
    <text x="586" y="206" font-size="22" textLength="59" lengthAdjust="spacing" fill="#fff">サタン</text>
  </g>

  <!-- 二つの箱 -->
  <g fill="none" stroke="currentColor" stroke-width="2.5">
    <rect x="154.5" y="287.5" width="167" height="84"/>
    <rect x="501.5" y="289.5" width="166" height="80.5"/>
  </g>
  <g font-size="27" dominant-baseline="central">
    <text x="167" y="314" textLength="142" lengthAdjust="spacing">新しい完成</text>
    <text x="168" y="346" textLength="113" lengthAdjust="spacing">的な真理</text>
    <text x="525" y="312" textLength="113" lengthAdjust="spacing">弁証法的</text>
    <text x="526" y="346" textLength="84" lengthAdjust="spacing">唯物論</text>
  </g>

  <text x="407" y="300.5" font-size="24" text-anchor="middle" dominant-baseline="central" textLength="115" lengthAdjust="spacing">屈伏させる</text>
</svg>
