<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の予定を立てる聖句（ロマ 8:29～30、ロマ 9:15～16）</title>

  <text x="51" y="54" font-size="50" dominant-baseline="central" textLength="499" lengthAdjust="spacing">神の予定を立てる聖句</text>
  <line x1="52" y1="84.5" x2="551" y2="84.5" stroke="currentColor" stroke-width="4"/>

  <!-- ● -->
  <g>
    <circle cx="245.5" cy="168.5" r="12"/>
    <circle cx="245.5" cy="422.5" r="12"/>
  </g>

  <!-- ロマ 8:29～30 -->
  <text y="168.5" font-size="46" dominant-baseline="central"><tspan x="272" font-size="50" textLength="95" lengthAdjust="spacing">ロマ</tspan> <tspan x="381.5" font-size="49" textLength="25" lengthAdjust="spacingAndGlyphs">8</tspan><tspan x="411" font-size="49">:</tspan><tspan x="432" font-size="49" textLength="49" lengthAdjust="spacingAndGlyphs">29</tspan><tspan x="489.5">～</tspan><tspan x="543" font-size="49" textLength="49" lengthAdjust="spacingAndGlyphs">30</tspan></text>

  <!-- 神 → 定める → 召す → 義 → 栄光 -->
  <g fill="#8C949A">
    <polygon points="361,288 405,288 405,280 425.5,291.5 405,303 405,295 361,295"/>
    <polygon points="518,288 562,288 562,280 582.5,291.5 562,303 562,295 518,295"/>
    <polygon points="672,288 716,288 716,280 736.5,291.5 716,303 716,295 672,295"/>
    <polygon points="826,288 870,288 870,280 890.5,291.5 870,303 870,295 826,295"/>
  </g>
  <circle cx="299" cy="292" r="40.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="299.5" y="292" font-size="46">神</text>
    <text x="472" y="241.5">定</text>
    <text x="472" y="291.5">め</text>
    <text x="472" y="342.5">る</text>
    <text x="627.5" y="268">召</text>
    <text x="627.5" y="317.5">す</text>
    <text x="783" y="292">義</text>
    <text x="936.5" y="267">栄</text>
    <text x="936.5" y="317">光</text>
  </g>

  <!-- ロマ 9:15～16 -->
  <text y="421" font-size="38" dominant-baseline="central"><tspan x="272" font-size="42" textLength="80" lengthAdjust="spacing">ロマ</tspan> <tspan x="363.5" font-size="41" textLength="20" lengthAdjust="spacingAndGlyphs">9</tspan><tspan x="388" font-size="41">:</tspan><tspan x="405" font-size="41" textLength="41" lengthAdjust="spacingAndGlyphs">15</tspan><tspan x="452">～</tspan><tspan x="498.5" font-size="41" textLength="40" lengthAdjust="spacingAndGlyphs">16</tspan></text>

  <!-- 神 → あわれもうとする者・いつくしもうとする者 -->
  <g fill="#8C949A">
    <polygon points="337.0,543.8 451.6,514.5 453.5,521.9 472.0,505.3 447.8,499.6 449.7,507.0 335.0,536.2"/>
    <polygon points="335.0,563.8 449.7,593.1 447.8,600.5 472.0,594.8 453.5,578.2 451.7,585.6 337.0,556.2"/>
  </g>
  <circle cx="300.5" cy="550" r="40.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="299" y="550" font-size="46" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="50" dominant-baseline="central">
    <text x="487" y="506" textLength="448" lengthAdjust="spacing">あわれもうとする者</text>
    <text x="486.5" y="594" textLength="498" lengthAdjust="spacing">いつくしもうとする者</text>
  </g>
</svg>
