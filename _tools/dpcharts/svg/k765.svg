<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. 第三次世界大戦　1. 第三次世界大戦は必然的に起こるのであろうか</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="38" y="36" font-size="30" textLength="26" lengthAdjust="spacingAndGlyphs">Ⅳ</text>
    <text x="66" y="36" font-size="30">.</text>
    <text x="83" y="36" font-size="30" textLength="219" lengthAdjust="spacing">第三次世界大戦</text>
    <text x="50" y="81.5" font-size="25">1.</text>
    <text x="82" y="81.5" font-size="24.5" textLength="495" lengthAdjust="spacing">第三次世界大戦は必然的に起こるのであろうか</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="82" y1="55" x2="302" y2="55"/>
    <line x1="81" y1="98.5" x2="578" y2="98.5"/>
  </g>

  <!-- 黒い線（楕円より先に描く） -->
  <g stroke="currentColor" stroke-width="4.4">
    <line x1="195" y1="174.5" x2="225" y2="216.5"/>
    <line x1="200" y1="266" x2="228" y2="229.6"/>
  </g>
  <line x1="619.5" y1="175" x2="619.5" y2="210" stroke="currentColor" stroke-width="3.5"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="290.8,217.1 358.8,191.5 360.6,196.4 372,184.1 355.3,182.4 357.1,187.2 289.2,212.7"/>
    <polygon points="289.2,234.4 356.1,258.2 354.4,263.1 371,261.1 359.4,249 357.6,253.9 290.8,230"/>
    <polygon points="444.2,189 526.1,217.6 524.4,222.5 541,220.4 529.3,208.4 527.6,213.3 445.8,184.6"/>
    <polygon points="445.8,262.4 527.6,233.9 529.3,238.8 541,226.8 524.4,224.6 526.1,229.6 444.2,258"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="166" cy="172.5" rx="46.5" ry="20.5" fill="#F8F28F"/>
    <ellipse cx="165.5" cy="271.5" rx="46.3" ry="20.3" fill="#50403D"/>
    <ellipse cx="255" cy="223.5" rx="48.5" ry="21.3" fill="#DCC4C4"/>
    <ellipse cx="414" cy="184.5" rx="38.8" ry="24.3" fill="#F8F28F"/>
    <ellipse cx="414" cy="261.5" rx="38.8" ry="24.3" fill="#CF921C"/>
    <ellipse cx="619.5" cy="224.5" rx="75.3" ry="27.3" fill="#CDF8F7"/>
    <circle cx="619.5" cy="160.5" r="24.3" fill="#fff" class="paper"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="165" y="173" font-size="23" textLength="69" lengthAdjust="spacing">天の側</text>
    <text x="165.5" y="271.5" font-size="21" textLength="74" lengthAdjust="spacing" fill="#fff">サタン側</text>
    <text x="255" y="224" font-size="28" textLength="57" lengthAdjust="spacing">世界</text>
    <text x="414.5" y="185" font-size="28" textLength="56" lengthAdjust="spacing">民主</text>
    <text x="414.5" y="262" font-size="28" textLength="56" lengthAdjust="spacing">共産</text>
    <text x="619.5" y="225" font-size="28.5" textLength="114" lengthAdjust="spacing">統一世界</text>
    <text x="618.5" y="160.5" font-size="27" fill="currentColor">神</text>
  </g>

  <!-- 下の字 -->
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="311.5" y="297" textLength="112" lengthAdjust="spacing">分立する</text>
    <text x="313" y="329.5" textLength="127" lengthAdjust="spacing">ための戦い</text>
    <text x="518.5" y="297.5" textLength="112" lengthAdjust="spacing">統一する</text>
    <text x="520" y="329.5" textLength="141" lengthAdjust="spacing">ための戦い</text>
  </g>
  <g font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="311.5" y="366" textLength="66" lengthAdjust="spacing">第一次</text>
    <text x="311.5" y="394" textLength="66" lengthAdjust="spacing">第二次</text>
    <text x="519" y="364.5" textLength="68" lengthAdjust="spacing">第三次</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M273.5,356 Q257.5,380.5 273.5,405"/>
    <path d="M351.5,355 Q366,380 351.5,404.5"/>
    <path d="M481.5,354.5 Q471,364.5 481.5,374.5"/>
    <path d="M557,354.5 Q567,364.5 557,374.5"/>
  </g>
</svg>
