<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>②本心の自由復帰</title>

  <text x="53" y="58.5" font-size="48" dominant-baseline="central" textLength="406" lengthAdjust="spacing">②本心の自由復帰</text>

  <!-- 2つの箱と、上にかかる楕円の札 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="226.5" y="222.5" width="390" height="225.5" fill="#fff" class="paper"/>
    <rect x="686.5" y="222.5" width="390" height="225.5" fill="#fff" class="paper"/>
    <ellipse cx="421.5" cy="222.5" rx="92" ry="63" fill="#CF921C"/>
    <ellipse cx="881.5" cy="216" rx="89" ry="44" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="46">
      <text x="421.5" y="197">人間</text>
      <text x="421.5" y="248">堕落</text>
    </g>
    <text x="881.5" y="216" font-size="56">現世</text>
  </g>

  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="421.5" y="345" textLength="346" lengthAdjust="spacing">本心の自由拘束</text>
    <text x="881.5" y="345" textLength="346" lengthAdjust="spacing">本心の自由追求</text>
  </g>

  <text x="649" y="552" font-size="66" text-anchor="middle" dominant-baseline="central" textLength="358" lengthAdjust="spacing">現世 = 終末</text>
</svg>
