<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>蕩減復帰とはどういう意味なのであろうか</title>

  <!-- 題 -->
  <text x="36" y="35.5" font-size="28" dominant-baseline="central" textLength="536" lengthAdjust="spacing">蕩減復帰とはどういう意味なのであろうか</text>
  <line x1="34" y1="54.5" x2="573" y2="54.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 失う・復帰の矢印 -->
  <g fill="#8C949A">
    <polygon points="221.5,180 228.5,180 228.5,290 234,290 225,304 216,290 221.5,290"/>
    <polygon points="250.5,308 257.5,308 257.5,196 263,196 254,184 245,196 250.5,196"/>
    <rect x="346" y="243.5" width="36" height="6"/>
    <rect x="529" y="243.5" width="36" height="6"/>
  </g>

  <!-- 本然の位置・状態 -->
  <ellipse cx="243" cy="132" rx="84" ry="50" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="239" y="112.5" textLength="78" lengthAdjust="spacing">本然の</text>
    <text x="204" y="143.5" textLength="52" lengthAdjust="spacing">位置</text>
    <text x="283.5" y="143.5" textLength="53" lengthAdjust="spacing">状態</text>
  </g>
  <circle cx="241.7" cy="145" r="3.5"/>

  <!-- 堕落 -->
  <ellipse cx="243" cy="355" rx="85" ry="50" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="221" y="355.5">堕</text>
    <text x="265.5" y="355.5">落</text>
  </g>

  <!-- 蕩減 -->
  <rect x="582" y="220.5" width="100" height="49.5" rx="5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="611" y="245.5">蕩</text>
    <text x="650.5" y="245.5">減</text>
  </g>

  <!-- 字 -->
  <text x="175.5" y="249" font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="central" textLength="51" lengthAdjust="spacing">失う</text>
  <text x="300.5" y="249" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="55" lengthAdjust="spacing">復帰</text>
  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text x="445" y="212.5" textLength="90" lengthAdjust="spacing">何らかの</text>
    <text x="456" y="244.5" textLength="112" lengthAdjust="spacing">条件立てる</text>
  </g>
</svg>
