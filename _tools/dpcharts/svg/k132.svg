<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>裸を恥ずかしく思って覆う</title>

  <!-- サタンの侵入 -->
  <polygon points="382,91 388,91 388,122 392.5,122 385,132.5 377.5,122 382,122" fill="currentColor"/>
  <circle cx="384.5" cy="61" r="29.8" fill="#50403D" stroke="currentColor" stroke-width="2.4"/>
  <text x="384.5" y="61" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>
  <text x="342" y="109" font-size="27" text-anchor="middle" dominant-baseline="central">侵入</text>

  <!-- 三角形の線（円の下に描く） -->
  <path d="M273.3,257.5 L389.4,154.8 L508.1,257.5 Z" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- ノアの家庭 -->
  <g stroke="currentColor" stroke-width="2.2" fill="#CF921C">
    <ellipse cx="387.5" cy="159" rx="60.3" ry="23.8"/>
    <ellipse cx="238" cy="257.5" rx="75" ry="29.5"/>
    <ellipse cx="585" cy="226" rx="75" ry="29.5"/>
  </g>
  <text x="594.5" y="219" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">ヤペテ</text>
  <ellipse cx="521.5" cy="257.5" rx="75" ry="29.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="387" y="159.5" font-size="28">ノア</text>
    <text x="236" y="257" font-size="32">ハム</text>
    <text x="521.5" y="257" font-size="32">セム</text>
  </g>

  <!-- 説明 -->
  <circle cx="199" cy="325" r="7.3"/>
  <polygon points="243,396 255,396 255,391 262.5,400.8 255,410.5 255,405.5 243,405.5" fill="#8C949A"/>
  <g font-size="25" dominant-baseline="central">
    <text x="215" y="326.5" textLength="333" lengthAdjust="spacingAndGlyphs">裸を恥ずかしく思って覆う：</text>
    <text x="241" y="367" textLength="419" lengthAdjust="spacingAndGlyphs">堕落後のアダムの家庭と同様の立場</text>
    <text x="270" y="402.5" textLength="415" lengthAdjust="spacingAndGlyphs">サタンの血縁的な子孫であることを自証</text>
  </g>
</svg>
