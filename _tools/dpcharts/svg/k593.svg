<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人類歴史</title>

  <text x="32" y="37.5" font-size="30" dominant-baseline="central" textLength="125" lengthAdjust="spacing">人類歴史</text>
  <line x1="31" y1="56.5" x2="157" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 黒い矢印（サ→堕落人間→邪心） -->
  <g>
    <polygon points="185.9,120.6 233.8,154.1 230.5,158.8 249.5,160.5 241.4,143.3 238.2,147.9 190.2,114.4"/>
    <polygon points="305.2,203.9 343.2,233.1 339.1,238.4 359.0,240.5 351.9,221.8 347.8,227.1 309.8,197.8"/>
  </g>
  <!-- 白抜きの矢印（神→堕落人間→本心） -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3.2" stroke-linejoin="miter">
    <polygon points="179.4,265.0 238.1,222.4 241.1,226.6 250.0,209.0 230.6,212.0 233.6,216.2 175.0,258.8"/>
    <polygon points="297.6,173.7 343.7,140.2 346.7,144.4 356.0,126.5 336.1,129.8 339.2,134.0 293.1,167.5"/>
  </g>

  <!-- サ・神 -->
  <g stroke="currentColor" stroke-width="3">
    <circle cx="178" cy="109.5" r="31.5" fill="#50403D"/>
    <circle cx="175" cy="260" r="32" fill="#fff" class="paper"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="177.5" y="109.5" font-size="30" fill="#fff">サ</text>
    <text x="174" y="260.5" font-size="32">神</text>
  </g>

  <!-- 堕落人間・本心・邪心 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="286" cy="182.5" rx="46" ry="32" fill="#CF921C"/>
    <ellipse cx="377.5" cy="98.5" rx="42.5" ry="24.5" fill="#fff" class="paper"/>
    <ellipse cx="377.5" cy="264.5" rx="42.5" ry="25" fill="#50403D"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="286" y="182.5" font-size="25" fill="#111" textLength="84" lengthAdjust="spacingAndGlyphs">堕落人間</text>
    <text x="378" y="99" font-size="28" textLength="56" lengthAdjust="spacing">本心</text>
    <text x="378" y="264.5" font-size="28" fill="#fff" textLength="56" lengthAdjust="spacing">邪心</text>
  </g>
  <text x="256.5" y="259.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="57" lengthAdjust="spacing">摂理</text>

  <!-- 横の矢印 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8" stroke-linejoin="miter">
    <polygon points="433,95 454,95 454,90.5 470,99 454,107.5 454,102.5 433,102.5"/>
    <polygon points="547,95.5 566.5,95.5 566.5,91 583.5,99 566.5,107.5 566.5,102.5 547,102.5"/>
  </g>
  <polygon points="432,261.5 457,261.5 457,256 473.5,265 457,273.5 457,268.5 432,268.5"/>

  <!-- 善・天国・悪 -->
  <g stroke="currentColor" stroke-width="2.5">
    <rect x="482" y="73" width="52" height="52" rx="3" fill="#fff" class="paper"/>
    <rect x="596" y="74" width="80" height="51" fill="#fff" class="paper"/>
    <rect x="482" y="239" width="52" height="51" rx="3" fill="#50403D"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="508" y="98.5" font-size="30">善</text>
    <text x="636" y="99.5" font-size="28" textLength="56" lengthAdjust="spacing">天国</text>
    <text x="508" y="264.5" font-size="30" fill="#fff">悪</text>
  </g>

  <!-- 下の箱 -->
  <rect x="147" y="318" width="525" height="92" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="171" cy="343" r="7.5"/>
  <circle cx="171" cy="384.5" r="7.5"/>
  <g fill="#8C949A">
    <polygon points="494.5,340.5 510,340.5 510,337 524.5,345 510,353 510,349.5 494.5,349.5"/>
    <polygon points="409.5,382 426,382 426,378.5 441,386.5 426,394.5 426,391 409.5,391"/>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text y="344"><tspan x="192" textLength="57" lengthAdjust="spacing">闘争</tspan><tspan x="249">、</tspan><tspan x="278" textLength="57" lengthAdjust="spacing">戦争</tspan></text>
    <text x="349" y="344" text-anchor="middle">：</text>
    <text x="364" y="344" textLength="115" lengthAdjust="spacing">善悪分立</text>
    <text x="538" y="344" textLength="114" lengthAdjust="spacing">善の目的</text>
    <text x="190" y="383" textLength="57" lengthAdjust="spacing">歴史</text>
    <text x="262.5" y="383" text-anchor="middle">：</text>
    <text x="278" y="383" textLength="114" lengthAdjust="spacing">分立歴史</text>
    <text x="451" y="383" textLength="113" lengthAdjust="spacing">善を指向</text>
  </g>
</svg>
