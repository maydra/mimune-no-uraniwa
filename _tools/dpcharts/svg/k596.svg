<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 復帰摂理時代における歴史発展</title>

  <text x="49" y="37.5" font-size="30" text-anchor="middle" dominant-baseline="central">Ⅰ</text>
  <text x="65" y="37.5" font-size="30" text-anchor="middle" dominant-baseline="central">.</text>
  <text x="81" y="37.5" font-size="30" dominant-baseline="central" textLength="441" lengthAdjust="spacing">復帰摂理時代における歴史発展</text>
  <line x1="81" y1="56.5" x2="522" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 神・サタン -->
  <text x="244" y="103.5" font-size="32" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="567" y="104.5" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="84" lengthAdjust="spacing">サタン</text>

  <!-- 大きな楕円と中の楕円 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="247.5" cy="194" rx="111" ry="62.5" fill="#F8F28F"/>
    <ellipse cx="245" cy="156" rx="67.5" ry="25" fill="#F8F28F"/>
    <ellipse cx="570.5" cy="193.5" rx="110.5" ry="62.5" fill="#CF921C"/>
    <ellipse cx="567.5" cy="156" rx="67.5" ry="25" fill="#CF921C"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="244.5" y="156.5" textLength="104" lengthAdjust="spacing">完成人間</text>
    <text x="246.5" y="201" textLength="157" lengthAdjust="spacing">共生共栄共義</text>
    <text x="246.5" y="231.5" textLength="105" lengthAdjust="spacing">主義社会</text>
    <text x="568" y="156.5" textLength="104" lengthAdjust="spacing">堕落人間</text>
    <text x="571" y="205" textLength="158" lengthAdjust="spacing">原始共同社会</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="387,195 423,195 423,190 440.5,199.5 423,209 423,204 387,204"/>
    <polygon points="567,302 584,302 584,313 591,313 575.5,322.5 560,313 567,313"/>
  </g>

  <!-- 下の字 -->
  <g font-size="26" dominant-baseline="central">
    <text x="491.5" y="280" text-anchor="middle">（</text>
    <text x="497" y="280" textLength="158" lengthAdjust="spacing">非原理的社会</text>
    <text x="659" y="280" text-anchor="middle">）</text>
    <text x="485" y="346.5" textLength="183" lengthAdjust="spacing">闘いによる分裂</text>
  </g>
  <g font-size="23" dominant-baseline="central">
    <text x="476" y="384.5" text-anchor="middle">（</text>
    <text x="481" y="384.5" textLength="189" lengthAdjust="spacing">人間の本心の作用</text>
    <text x="674.5" y="384.5" text-anchor="middle">）</text>
  </g>
</svg>
