<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>終末はいつ来るのか？</title>

  <text x="53" y="59" font-size="48" dominant-baseline="central" textLength="497" lengthAdjust="spacing">終末はいつ来るのか？</text>
  <line x1="53" y1="89" x2="552" y2="89" stroke="currentColor" stroke-width="3.5"/>

  <!-- 聖句の箇条 -->
  <circle cx="271.5" cy="165" r="8"/>
  <circle cx="271.5" cy="254.5" r="8"/>
  <circle cx="271.5" cy="341.5" r="8"/>
  <g font-size="44" dominant-baseline="central">
    <text x="290" y="166" textLength="259" lengthAdjust="spacingAndGlyphs">ヨハネ 21:22</text>
    <text x="288" y="254" textLength="261" lengthAdjust="spacingAndGlyphs">マタイ 10:23</text>
    <text x="288" y="341" textLength="261" lengthAdjust="spacingAndGlyphs">マタイ 16:28</text>
  </g>

  <path d="M582,147 Q595.5,150 595.5,180 L595.5,228 Q597,253 610.5,257.5 Q597,262 595.5,290 L595.5,335 Q595.5,365 582,368.5" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="46" dominant-baseline="central">
    <text x="634" y="222">弟子たちが死ぬ前に</text>
    <text x="634" y="284" textLength="426" lengthAdjust="spacingAndGlyphs">人の子が来るであろう</text>
  </g>

  <!-- 弟子、信徒たち -->
  <rect x="291" y="410" width="736" height="231" rx="13" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g fill="#8C949A">
    <polygon points="354,515.5 384,515.5 384,510 404.5,520.5 384,531 384,525.5 354,525.5"/>
    <polygon points="354,585 384,585 384,579.5 404.5,590 384,600.5 384,595 354,595"/>
  </g>
  <g font-size="48" dominant-baseline="central" fill="#111">
    <text x="326" y="454" textLength="346" lengthAdjust="spacing">弟子、信徒たち</text>
    <text x="427" y="520.5" textLength="558" lengthAdjust="spacingAndGlyphs">自分の当代にイエスの再臨</text>
    <text x="426" y="588" textLength="449" lengthAdjust="spacing">終末に対する切迫感</text>
  </g>
</svg>
