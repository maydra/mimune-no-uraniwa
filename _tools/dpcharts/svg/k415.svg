<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(1) 霊的な信仰基台</title>

  <text x="45" y="37" font-size="30" dominant-baseline="central" textLength="52" lengthAdjust="spacingAndGlyphs">(1)</text>
  <text x="105" y="37" font-size="30" dominant-baseline="central" textLength="221" lengthAdjust="spacing">霊的な信仰基台</text>
  <line x1="105" y1="55" x2="326" y2="55" stroke="currentColor" stroke-width="2.4"/>

  <!-- 灰色の矢印と括弧 -->
  <polygon points="208,163 216.5,177.5 211.7,177.5 211.7,265 204.3,265 204.3,177.5 199.5,177.5" fill="#8C949A"/>
  <path d="M346,175.5 H328.5 V258.5 H346 M314,216.5 H346" fill="none" stroke="#8C949A" stroke-width="5.5"/>

  <!-- 神 -->
  <circle cx="209" cy="125" r="33.7" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="208" y="124.5" font-size="36" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 信仰基台 -->
  <rect x="236.3" y="180.3" width="76.5" height="74.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" font-weight="400">
    <text x="273" y="201.5" textLength="55" lengthAdjust="spacing">信仰</text>
    <text x="273" y="233" textLength="55" lengthAdjust="spacing">基台</text>
  </g>

  <!-- 三つの項目 -->
  <g font-size="26" dominant-baseline="central">
    <text x="356" y="174.5" textLength="102" lengthAdjust="spacing">中心人物</text>
    <text x="472" y="174.5" text-anchor="middle">：</text>
    <text x="486" y="174.5" textLength="181" lengthAdjust="spacing">復活したイエス</text>

    <text x="355" y="218.5" textLength="76" lengthAdjust="spacing">条件物</text>
    <text x="445.5" y="218.5" text-anchor="middle">：</text>
    <text x="459" y="218.5" textLength="26" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="504.5" y="218.5" text-anchor="middle">日</text>
    <text x="519" y="218.5" textLength="104" lengthAdjust="spacing">復活役事</text>

    <text x="355" y="261.5" textLength="102" lengthAdjust="spacing">蕩減期間</text>
    <text x="471.5" y="261.5" text-anchor="middle">：</text>
    <text x="485" y="261.5" textLength="26" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="531" y="261.5" text-anchor="middle">日</text>
    <text x="545" y="261.5" textLength="103" lengthAdjust="spacing">復活期間</text>
  </g>

  <!-- 霊的な信仰基台：○ -->
  <rect x="354.5" y="304.5" width="292" height="42" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="371" y="325.5" textLength="200" lengthAdjust="spacing">霊的な信仰基台</text>
    <text x="587" y="325.5" text-anchor="middle">：</text>
  </g>
  <circle cx="615.7" cy="325" r="11.9" fill="none" stroke="#111" stroke-width="3.5"/>

  <!-- 復活イエス -->
  <ellipse cx="208" cy="306.5" rx="68.7" ry="41.2" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="208" y="289.5" textLength="54" lengthAdjust="spacing">復活</text>
    <text x="207.5" y="324" textLength="81" lengthAdjust="spacing">イエス</text>
  </g>
  <text x="205" y="370" font-size="21" text-anchor="middle" dominant-baseline="central" font-weight="400" textLength="163" lengthAdjust="spacingAndGlyphs">（霊的洗礼ヨハネ）</text>
</svg>
