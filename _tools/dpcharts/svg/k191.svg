<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>実体基台を蕩減復帰</title>

  <text x="34" y="37.5" font-size="31" dominant-baseline="central" textLength="286" lengthAdjust="spacing">実体基台を蕩減復帰</text>
  <line x1="35" y1="56" x2="319" y2="56" stroke="currentColor" stroke-width="2.8"/>

  <!-- 神へ -->
  <polygon points="186,236 190,236 190,167 194.5,167 188,155 181.5,167 186,167" fill="#8C949A"/>
  <ellipse cx="188" cy="119.5" rx="30" ry="28.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="187" y="119.5" font-size="32" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- エサウからヤコブへ -->
  <polygon points="570,350.5 265,350.5 265,347.5 253,353.5 265,359.5 265,356.5 570,356.5" fill="#8C949A"/>
  <text y="322" font-size="28" dominant-baseline="central"><tspan x="383" textLength="54" lengthAdjust="spacing">愛し</tspan><tspan x="439">、</tspan><tspan x="469" textLength="58" lengthAdjust="spacing">歓迎</tspan></text>

  <!-- 三代とエサウ -->
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="188" cy="259.5" rx="54" ry="22.5" fill="#F8F28F"/>
    <ellipse cx="188" cy="304" rx="54" ry="19" fill="#F8F28F"/>
    <ellipse cx="187.5" cy="354" rx="56.5" ry="25" fill="#F8F28F"/>
    <ellipse cx="625.5" cy="354" rx="56.5" ry="25" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="188.5" y="260" font-size="22" textLength="93" lengthAdjust="spacing">アブラハム</text>
    <text x="187" y="304" font-size="25" textLength="74" lengthAdjust="spacing">イサク</text>
    <text x="187.5" y="354" font-size="26" textLength="75" lengthAdjust="spacing">ヤコブ</text>
    <text x="624.5" y="354" font-size="26" textLength="75" lengthAdjust="spacing">エサウ</text>
  </g>

  <!-- 蕩減条件と実体基台 -->
  <g fill="#8C949A">
    <polygon points="444.5,298 461.5,298 461.5,287 471,287 452.5,275 434,287 444.5,287"/>
    <polygon points="444.5,216 461.5,216 461.5,205 471,205 452.5,193 434,205 444.5,205"/>
  </g>
  <rect x="250" y="227" width="406.5" height="40" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="266" y="246" font-size="29" dominant-baseline="central" textLength="376" lengthAdjust="spacing">堕落性を脱ぐための蕩減条件</text>

  <rect x="341.5" y="139" width="222" height="47" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="31" dominant-baseline="central" fill="#111">
    <text x="361" y="161.5" textLength="125" lengthAdjust="spacing">実体基台</text>
    <text x="502" y="161.5" text-anchor="middle">：</text>
  </g>
  <circle cx="529.5" cy="162.5" r="12.3" fill="none" stroke="#111" stroke-width="4.5"/>
</svg>
