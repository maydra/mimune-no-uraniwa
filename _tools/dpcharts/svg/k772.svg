<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>3. 復帰摂理から見た第三次世界大戦の原因　① 三大祝福復帰の完成的な蕩減条件</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="34" y="37.5" font-size="28">3.</text>
    <text x="73" y="37.5" font-size="28" textLength="508" lengthAdjust="spacing">復帰摂理から見た第三次世界大戦の原因</text>
    <text x="63" y="81.5" font-size="25" text-anchor="middle">①</text>
    <text x="83" y="81.5" font-size="25" textLength="392" lengthAdjust="spacing">三大祝福復帰の完成的な蕩減条件</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="72" y1="56.5" x2="582" y2="56.5"/>
    <line x1="82" y1="98" x2="476" y2="98"/>
  </g>

  <!-- 灰色の矢印（円より先に描く） -->
  <g fill="#8C949A">
    <polygon points="240.5,180 247.5,180 247.5,245.5 251.5,245.5 244,259.5 236.5,245.5 240.5,245.5"/>
    <polygon points="567.5,180 574.5,180 574.5,241.5 579.5,241.5 571,255.5 563.5,241.5 567.5,241.5"/>
    <polygon points="524.5,213.5 305,213.5 305,206.5 289,217.5 305,228.5 305,221.5 524.5,221.5"/>
  </g>

  <!-- 神とサ -->
  <circle cx="244" cy="152" r="35.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="571" cy="149.5" r="36" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="242" y="151.5" font-size="33">神</text>
    <text x="570.5" y="150" font-size="32" fill="#fff">サ</text>
  </g>

  <!-- 矢印の脇の字 -->
  <g font-size="25" dominant-baseline="central">
    <text x="166" y="205" textLength="51" lengthAdjust="spacing">再臨</text>
    <text x="154" y="235" textLength="75" lengthAdjust="spacing">イエス</text>
    <text x="586" y="203" textLength="103" lengthAdjust="spacing">再臨主型</text>
    <text x="586" y="235" textLength="50" lengthAdjust="spacing">人物</text>
    <text x="408" y="194" text-anchor="middle" textLength="51" lengthAdjust="spacing">復帰</text>
    <text x="407.5" y="242" text-anchor="middle" textLength="182" lengthAdjust="spacing">完成的蕩減条件</text>
  </g>

  <!-- 点線 -->
  <line x1="407" y1="263" x2="407" y2="352" stroke="currentColor" stroke-width="5" stroke-dasharray="7 4.9"/>

  <!-- 三大祝福と三大祝福の完成級完成型 -->
  <ellipse cx="246" cy="306.5" rx="81.5" ry="41.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="571.5" cy="307" rx="88" ry="44.7" fill="#CF921C" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="246" y="306" font-size="27" textLength="113" lengthAdjust="spacing">三大祝福</text>
    <text x="571" y="286.5" font-size="24.5" textLength="115" lengthAdjust="spacing" fill="#111">三大祝福の</text>
    <text x="572" y="318.5" font-size="24.5" textLength="145" lengthAdjust="spacing" fill="#111">完成級完成型</text>
  </g>

  <!-- 水色の箱 -->
  <rect x="278.5" y="360.5" width="257.5" height="47.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="406.5" y="384.5" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="218" lengthAdjust="spacing" fill="#111">第三次世界大戦</text>
</svg>
