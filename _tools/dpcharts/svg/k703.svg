<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 産業革命の意義</title>

  <!-- 題 -->
  <g dominant-baseline="central" font-size="30">
    <text y="37"><tspan x="35">Ⅲ</tspan><tspan x="63">.</tspan></text>
    <text x="83" y="36.5" textLength="222" lengthAdjust="spacing">産業革命の意義</text>
  </g>
  <line x1="83" y1="55.5" x2="304" y2="55.5" stroke="currentColor" stroke-width="2.5"/>

  <!-- 灰色の括弧と矢印（楕円の下に描く） -->
  <g stroke="#8C949A" fill="none">
    <path d="M346,104 H326.5 V155 H346 M300,130 H326.5" stroke-width="6"/>
    <path d="M346,219 H326.5 V271 H346 M300,246 H326.5" stroke-width="6"/>
  </g>
  <g fill="#8C949A">
    <polygon points="224.5,165 231.5,165 231.5,190 236.5,190 228,203 219.5,190 224.5,190"/>
    <polygon points="224.5,282 231.5,282 231.5,309 236.5,309 228,322 219.5,309 224.5,309"/>
  </g>

  <!-- 神の創造理想・終末期 -->
  <ellipse cx="228.5" cy="129.5" rx="83.2" ry="40.2" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="228.5" cy="246" rx="83.2" ry="39.7" fill="#CF921C" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="27">
      <text x="227.5" y="109.5" textLength="57" lengthAdjust="spacing">神の</text>
      <text x="228" y="141" textLength="116" lengthAdjust="spacing">創造理想</text>
    </g>
    <text x="227.5" y="245.5" font-size="30" fill="#111" textLength="93" lengthAdjust="spacing">終末期</text>
  </g>

  <!-- 右の字 -->
  <g font-size="27" dominant-baseline="central">
    <text x="361" y="104" textLength="173" lengthAdjust="spacing">罪のない社会</text>
    <text x="361" y="153.5" textLength="202" lengthAdjust="spacing">幸福な社会環境</text>
    <text y="223.5"><tspan x="361" textLength="57" lengthAdjust="spacing">み言</tspan><tspan x="432.5" text-anchor="middle">：</tspan><tspan x="448" textLength="172" lengthAdjust="spacing">霊的無知除去</tspan></text>
    <text y="267.5"><tspan x="360" textLength="58" lengthAdjust="spacing">科学</tspan><tspan x="432.5" text-anchor="middle">：</tspan><tspan x="448" textLength="172" lengthAdjust="spacing">肉的無知除去</tspan></text>
  </g>

  <!-- 産業革命 -->
  <rect x="134" y="324.5" width="544.5" height="84.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g dominant-baseline="central" fill="#111">
    <text y="349.5" font-size="29"><tspan x="154" textLength="126" lengthAdjust="spacing">産業革命</tspan><tspan x="296" text-anchor="middle">：</tspan><tspan x="312" textLength="346" lengthAdjust="spacing">理想社会の生活環境復帰</tspan></text>
    <text y="385" font-size="27"><tspan x="180">（</tspan><tspan x="192" textLength="56" lengthAdjust="spacing">英国</tspan><tspan x="247">）</tspan></text>
  </g>
</svg>
