<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『聖書の 14 万 4 千の群れの意味』</title>

  <text x="571" y="56" font-size="48" text-anchor="middle" dominant-baseline="central" textLength="719" lengthAdjust="spacing">『聖書の 14 万 4 千の群れの意味』</text>

  <!-- 復帰摂理路程（縦書き） -->
  <g font-size="40" text-anchor="middle" dominant-baseline="central">
    <text x="224.5" y="145">復</text>
    <text x="224.5" y="187.5">帰</text>
    <text x="224.5" y="229">摂</text>
    <text x="224.5" y="270.5">理</text>
    <text x="224.5" y="312">路</text>
    <text x="224.5" y="354">程</text>
  </g>

  <!-- 白抜きの太い矢印（復帰摂理路程・一代） -->
  <g fill="#C4CCD3" stroke="currentColor" stroke-width="4">
    <polygon points="319,129.5 444.5,129.5 444.5,319 484,319 381.5,394 278,319 319,319"/>
    <polygon points="489,394.5 705.5,394.5 705.5,360 791,452.5 705.5,545 705.5,510.5 489,510.5"/>
  </g>

  <!-- サタンの侵入を受けた聖賢たち -->
  <g font-size="42" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="363" y="173">A</text>
    <text x="363" y="239.5">B</text>
    <text x="363" y="306.5">C</text>
  </g>
  <g stroke="#111" stroke-width="5.5">
    <path d="M390.5,157 L418.5,185 M390.5,185 L418.5,157"/>
    <path d="M390,225 L418,253 M390,253 L418,225"/>
    <path d="M389,293 L417,321 M389,321 L417,293"/>
  </g>

  <!-- 代理者へ（面の中は #111、地の上は currentColor） -->
  <g stroke-width="6">
    <g stroke="#111">
      <line x1="429" y1="175" x2="444.5" y2="192.2"/>
      <line x1="625.6" y1="394.5" x2="645.7" y2="416.3"/>
      <line x1="430" y1="240" x2="444.5" y2="257.6"/>
      <line x1="557.5" y1="394.5" x2="574.7" y2="415.9"/>
      <line x1="431" y1="309" x2="454.3" y2="340.7"/>
      <line x1="493" y1="394.5" x2="507.6" y2="415.2"/>
    </g>
    <g stroke="currentColor">
      <line x1="444.5" y1="192.2" x2="625.6" y2="394.5"/>
      <line x1="444.5" y1="257.6" x2="557.5" y2="394.5"/>
      <line x1="454.3" y1="340.7" x2="493" y2="394.5"/>
    </g>
  </g>
  <g fill="#111">
    <polygon points="657,429 652.4,410.3 639,422.3"/>
    <polygon points="585.5,429 581.6,410.2 567.7,421.6"/>
    <polygon points="517.5,429 514.9,409.9 500.3,420.5"/>
  </g>

  <!-- 再臨主から一代の線 -->
  <line x1="482" y1="447" x2="489" y2="447" stroke="currentColor" stroke-width="8.5"/>
  <line x1="489" y1="447" x2="656" y2="447" stroke="#2A3135" stroke-width="8.5"/>
  <g fill="#fff" stroke="#111" stroke-width="2.5">
    <circle cx="527" cy="446.5" r="14"/>
    <circle cx="597.5" cy="446.5" r="14"/>
    <circle cx="668.5" cy="446.5" r="14"/>
  </g>
  <g font-size="42" dominant-baseline="central" fill="#111">
    <text x="511" y="486">C′</text>
    <text x="584" y="486">B′</text>
    <text x="654" y="486">A′</text>
  </g>

  <ellipse cx="380.5" cy="447" rx="102" ry="46.5" fill="#F8F28F" stroke="currentColor" stroke-width="4"/>
  <text x="379.5" y="445" font-size="44" text-anchor="middle" dominant-baseline="central" fill="#111">再臨主</text>

  <text x="602.5" y="542.5" font-size="40" text-anchor="middle" dominant-baseline="central">一代</text>

  <g font-size="40" dominant-baseline="central">
    <text x="489" y="150" textLength="415" lengthAdjust="spacing">サタンの侵入を受けた</text>
    <text x="489" y="204.5" textLength="163" lengthAdjust="spacing">聖賢たち</text>
    <text x="811" y="398" textLength="247" lengthAdjust="spacing">蕩減復帰する</text>
    <text x="811" y="452" textLength="205" lengthAdjust="spacing">代理者たち</text>
    <text x="785" y="567" textLength="298" lengthAdjust="spacing">14 万 4 千の群れ</text>
  </g>
  <!-- ＝（縦） -->
  <g stroke="currentColor" stroke-width="7.5">
    <line x1="908.5" y1="488" x2="908.5" y2="520"/>
    <line x1="922.5" y1="488" x2="922.5" y2="520"/>
  </g>
  <text x="744" y="621.5" font-size="32" dominant-baseline="central" textLength="326" lengthAdjust="spacing">(黙 14:1 ～ 4) (黙 7:4)</text>
</svg>
