<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 三権分立の原理的意義</title>

  <!-- 題 -->
  <g dominant-baseline="central" font-size="30">
    <text y="38"><tspan x="42">Ⅱ</tspan><tspan x="66">.</tspan></text>
    <text x="88" y="38" textLength="315" lengthAdjust="spacing">三権分立の原理的意義</text>
  </g>
  <line x1="87" y1="56.5" x2="402" y2="56.5" stroke="currentColor" stroke-width="2.5"/>

  <!-- 三権分立 -->
  <rect x="171.5" y="133.5" width="151.5" height="50.5" fill="#CF921C" stroke="currentColor" stroke-width="2.5"/>
  <text x="248" y="160" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="125" lengthAdjust="spacing">三権分立</text>

  <!-- 箇条（細字） -->
  <circle cx="356" cy="113.5" r="7.5"/>
  <circle cx="355.5" cy="161.5" r="7.5"/>
  <circle cx="356" cy="208.5" r="7.5"/>
  <g font-size="29" font-weight="400" dominant-baseline="central">
    <text x="371" y="114.5" textLength="281" lengthAdjust="spacing">モンテスキュー提唱</text>
    <text x="371" y="161.5" textLength="219" lengthAdjust="spacing">国家権力の分散</text>
    <text y="209"><tspan x="370">「</tspan><tspan x="386" textLength="125" lengthAdjust="spacing">人権宣言</tspan><tspan x="510">」</tspan><tspan x="528" textLength="93" lengthAdjust="spacing">の宣布</tspan></text>
  </g>

  <!-- 矢印 -->
  <polygon points="241.5,200.5 253.5,200.5 253.5,275 264,275 247.5,303 231,275 241.5,275" fill="#8C949A" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- 天の側の理想社会の構造 -->
  <rect x="171.5" y="316.5" width="388" height="52" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="365.5" y="342.5" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="347" lengthAdjust="spacing">天の側の理想社会の構造</text>
</svg>
