<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>被造世界における人間の位置　①被造世界の主管者</title>
  <defs>
    <marker id="z180-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <text x="62" y="80" font-size="46">Ⅰ.</text>
  <text x="128" y="80" font-size="48" textLength="648" lengthAdjust="spacing">被造世界における人間の位置</text>
  <line x1="128" y1="93" x2="776" y2="93" stroke="currentColor" stroke-width="3.5"/>
  <text x="62" y="146" font-size="42">① 被造世界の主管者</text>

  <!-- 無形世界と有形世界 -->
  <path d="M437,412 A290,237 0 0 1 1017,412 Z" fill="#F98AEE"/>
  <path d="M437,412 A290,237 0 0 0 1017,412 Z" fill="#A0F08A"/>
  <ellipse cx="727" cy="412" rx="290" ry="237" fill="none" stroke="currentColor" stroke-width="3.5"/>
  <line x1="437" y1="412" x2="1017" y2="412" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="42" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="729" y="222">無形世界</text>
    <text x="729" y="607">有形世界</text>
  </g>

  <!-- 授受の矢印 -->
  <g stroke="#111" stroke-width="5" fill="none" marker-end="url(#z180-d)">
    <path d="M713,309 Q693,289 711,268"/>
    <path d="M741,268 Q761,289 743,309"/>
    <path d="M713,559 Q693,539 711,518"/>
    <path d="M741,518 Q761,539 743,559"/>
  </g>

  <!-- 霊人体と肉身 -->
  <g stroke="#8C949A" stroke-width="12" stroke-linecap="butt">
    <line x1="580" y1="402" x2="648" y2="375"/>
    <line x1="580" y1="432" x2="648" y2="458"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="3.5">
    <ellipse cx="725" cy="373" rx="83" ry="36"/>
    <ellipse cx="725" cy="460" rx="83" ry="36"/>
  </g>
  <g font-size="40" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="725" y="373">霊人体</text>
    <text x="725" y="460">肉　身</text>
  </g>

  <!-- 人（100×240 の型を置く） -->
  <g transform="translate(487,305)" fill="#FCE6E5" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
    <circle cx="50" cy="22" r="19"/>
  </g>

  <!-- 神から -->
  <circle cx="272" cy="413" r="58" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.5"/>
  <text x="272" y="413" font-size="50" text-anchor="middle" dominant-baseline="central">神</text>
  <polygon points="333,400 380,400 380,390 420,412 380,435 380,425 333,425" fill="#8C949A"/>
</svg>
