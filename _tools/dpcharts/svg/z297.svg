<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>自由と人間の堕落</title>

  <g font-size="48" text-anchor="middle">
    <text x="77" y="74">Ⅱ</text>
    <text x="108" y="74">.</text>
  </g>
  <text x="128.5" y="74" font-size="48" textLength="398" lengthAdjust="spacing">自由と人間の堕落</text>
  <line x1="127" y1="85" x2="527" y2="85" stroke="currentColor" stroke-width="3.5"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="466.5,233 521.5,185.5 525.5,190 535,167.5 511.5,174 515.5,178.5 460.5,225.5"/>
    <polygon points="460,247 514.5,247 514.5,253 536.5,242.5 514.5,232 514.5,238 460,238"/>
    <polygon points="460,263.5 513.5,309 510,313.5 533.5,320 523.5,297.5 519.5,302 466.5,256.5"/>
    <polygon points="672.5,168.5 738,216 735,221 759,225.5 747,204 744,208.5 678.5,160.5"/>
    <polygon points="672,244 736,244 736,250 758,239.5 736,229 736,235 672,235"/>
    <polygon points="679,321.5 742.5,275.5 745.5,280.5 757.5,259 733.5,263.5 737,268 673,314"/>
    <polygon points="369,287 369,334.5 360.5,334.5 375,366 389.5,334.5 381,334.5 381,287"/>
  </g>

  <rect x="314.5" y="200" width="125" height="85.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="377" y="243">自由</text>
    <text x="605" y="163.5">原理</text>
    <text x="605.5" y="243">責任</text>
    <text x="605.5" y="323">実績</text>
  </g>

  <rect x="769.5" y="174" width="124.5" height="119.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="44" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="832.5" y="206">善の</text>
    <text x="833.5" y="260.5">結果</text>
  </g>

  <rect x="272" y="384" width="558.5" height="77" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <text x="551" y="422.5" font-size="43" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="499" lengthAdjust="spacing">堕落することはできない</text>

  <!-- 黒丸 -->
  <circle cx="220.5" cy="547" r="9.5"/>
  <circle cx="220.5" cy="619.5" r="9.5"/>
  <g font-size="41">
    <text x="244" y="565.5" textLength="860" lengthAdjust="spacingAndGlyphs">本心の自由が非原理的な愛の力によって拘束された</text>
    <text x="245" y="635.5" textLength="451" lengthAdjust="spacing">堕落によって自由を失う</text>
  </g>
</svg>
