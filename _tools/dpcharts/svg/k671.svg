<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>カイン型の人生観から啓蒙思想へ　フランス革命の原動力</title>

  <!-- 灰色の矢印（楕円と箱より先に描く） -->
  <g fill="#8C949A">
    <polygon points="210,125 218,125 218,174 222,174 214,190.5 206,174 210,174"/>
    <polygon points="210,250 218,250 218,336 222,336 214,351.5 206,336 210,336"/>
  </g>

  <g fill="#F86D42" stroke="currentColor" stroke-width="2.8">
    <ellipse cx="214" cy="83.5" rx="73.6" ry="46.1"/>
    <ellipse cx="214" cy="223" rx="73.6" ry="31.6"/>
  </g>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="156.9" y="71" textLength="115" lengthAdjust="spacingAndGlyphs">カイン型の</text>
    <text x="170.9" y="102.5" textLength="88" lengthAdjust="spacing">人生観</text>
    <text x="155.9" y="222.5" textLength="116" lengthAdjust="spacing">啓蒙思想</text>
  </g>

  <!-- フランス革命の原動力 -->
  <rect x="142.4" y="353.2" width="344" height="48.4" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <text y="377" font-size="31" dominant-baseline="central" fill="#111"><tspan x="159.8" textLength="123" lengthAdjust="spacing">フランス</tspan><tspan x="283.8" textLength="186" lengthAdjust="spacing">革命の原動力</tspan></text>

  <!-- 箇条 -->
  <g>
    <circle cx="309" cy="56.5" r="7.6"/>
    <circle cx="309" cy="197" r="7.6"/>
    <circle cx="309" cy="243" r="7.6"/>
    <circle cx="309" cy="288.5" r="7.6"/>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="322.9" y="56.5" textLength="338" lengthAdjust="spacingAndGlyphs">サタンの側の道を開く人生観</text>
    <text x="325" y="197" font-size="30" textLength="43" lengthAdjust="spacingAndGlyphs">18C</text>
    <text x="382" y="197" text-anchor="middle">：</text>
    <text x="396.9" y="197" textLength="203" lengthAdjust="spacing">歴史と伝統打破</text>
    <text y="243.5"><tspan x="324.9" textLength="86" lengthAdjust="spacing">不合理</tspan><tspan x="409.5">、</tspan><tspan x="440.9" textLength="144" lengthAdjust="spacing">非現実排撃</tspan></text>
    <text x="324.9" y="289" textLength="115" lengthAdjust="spacing">神を否定</text>
  </g>

  <!-- 細字の副項目 -->
  <g stroke="currentColor" stroke-width="3">
    <line x1="332" y1="101.8" x2="356" y2="101.8"/>
    <line x1="332" y1="138.3" x2="356" y2="138.3"/>
  </g>
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text y="99.5"><tspan x="367" textLength="105" lengthAdjust="spacing">文芸復興</tspan><tspan x="472">、</tspan><tspan x="499" textLength="105" lengthAdjust="spacing">人文主義</tspan></text>
    <text x="368" y="136.5" textLength="259" lengthAdjust="spacing">外的な性向のみに従う</text>
  </g>
</svg>
