<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>中心民族＝神の選民</title>

  <!-- 数多くの民族史 -->
  <ellipse cx="216.5" cy="161" rx="80" ry="49.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="28" dominant-baseline="central">
    <text x="158.5" y="143" textLength="114" lengthAdjust="spacing">数多くの</text>
    <text x="173" y="178" textLength="87" lengthAdjust="spacing">民族史</text>
  </g>

  <!-- 灰色の矢印 -->
  <polygon points="323,151 344,151 344,138.5 358.5,160.5 344,182.5 344,170 323,170" fill="#8C949A"/>

  <!-- 神 -->
  <circle cx="447" cy="53.5" r="28.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="446" y="54" font-size="30" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 授受の矢印 -->
  <g fill="none" stroke="currentColor" stroke-width="6.5">
    <path d="M434,131 Q418,116 428,99"/>
    <path d="M458,91 Q474,106 464,123"/>
  </g>
  <polygon points="438.5,87 422.5,95 437,104.5"/>
  <polygon points="454.5,135 470.5,127 456,117.5"/>

  <!-- 中心民族 -->
  <rect x="381" y="140" width="134" height="47" fill="#F8F28F" stroke="currentColor" stroke-width="3.5"/>
  <text x="391" y="163" font-size="28" textLength="115" lengthAdjust="spacing" dominant-baseline="central" fill="#111">中心民族</text>

  <!-- ＝（縦） -->
  <g stroke="currentColor" stroke-width="5">
    <line x1="439" y1="195" x2="439" y2="218.5"/>
    <line x1="451.5" y1="195" x2="451.5" y2="218.5"/>
  </g>
  <text x="387" y="240.5" font-size="28" textLength="116" lengthAdjust="spacing" dominant-baseline="central">神の選民</text>

  <!-- 箇条 -->
  <g>
    <circle cx="333" cy="282" r="7"/>
    <circle cx="333.5" cy="321.5" r="7"/>
    <circle cx="333.5" cy="359.5" r="7"/>
    <circle cx="333.5" cy="398.5" r="7"/>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text y="282.5"><tspan x="350">「</tspan><tspan x="363" textLength="237" lengthAdjust="spacing">メシヤのための基台</tspan><tspan x="599">」</tspan><tspan x="626" textLength="53" lengthAdjust="spacing">造成</tspan></text>
    <text x="350" y="320.5" textLength="263" lengthAdjust="spacing">典型的な復帰摂理路程</text>
    <text x="350" y="358.5" textLength="132" lengthAdjust="spacing">天倫の中心</text>
    <text x="350" y="396.5" textLength="184" lengthAdjust="spacing">人類歴史を指導</text>
  </g>
</svg>
