    <ellipse cx="652.7" cy="236.1" rx="135.8" ry="41.9" fill="#F8F28F"/>
    <ellipse cx="652.7" cy="390.5" rx="105.2" ry="55" fill="#fff" class="paper"/>
    <ellipse cx="434.1" cy="531.5" rx="52.9" ry="41.8" fill="#FCE5E3"/>
    <ellipse cx="652.4" cy="532.3" rx="52.9" ry="41.8" fill="#FCE5E3"/>
    <ellipse cx="876.3" cy="532.4" rx="52.9" ry="41.8" fill="#FCE5E3"/>
  </g>

