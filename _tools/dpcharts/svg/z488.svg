<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>聖書の例　ヨハネ書Ⅰ 3:14『愛さない者は、死のうちにとどまっている』　ロマ 6:23『罪の支払う報酬は死である…』　ロマ 8:6『肉の思いは死であるが…』</title>

  <text x="50" y="52" font-size="48" dominant-baseline="central" textLength="199" lengthAdjust="spacing">聖書の例</text>
  <line x1="50" y1="80.5" x2="249" y2="80.5" stroke="currentColor" stroke-width="2.5"/>

  <!-- 書名と章節 -->
  <g font-size="44" dominant-baseline="central">
    <text y="198"><tspan x="208" textLength="175" lengthAdjust="spacing">ヨハネ書</tspan><tspan x="414" text-anchor="middle">Ⅰ</tspan> <tspan x="440" textLength="92" lengthAdjust="spacingAndGlyphs">3:14</tspan></text>
    <text y="380"><tspan x="208" textLength="86" lengthAdjust="spacing">ロマ</tspan> <tspan x="305" textLength="89" lengthAdjust="spacingAndGlyphs">6:23</tspan></text>
    <text y="496.5"><tspan x="208" textLength="86" lengthAdjust="spacing">ロマ</tspan> <tspan x="304" textLength="68" lengthAdjust="spacingAndGlyphs">8:6</tspan></text>
  </g>

  <!-- 聖句（元のとおり細字） -->
  <g font-size="45" font-weight="400" dominant-baseline="central">
    <text y="198"><tspan x="579" text-anchor="end">『</tspan><tspan x="578" textLength="284" lengthAdjust="spacing">愛さない者は</tspan><tspan x="862">、</tspan><tspan x="908" textLength="190" lengthAdjust="spacing">死のうち</tspan></text>
    <text y="258.5"><tspan x="579" textLength="373" lengthAdjust="spacing">にとどまっている</tspan><tspan x="948">』</tspan></text>
    <text y="380"><tspan x="444" text-anchor="end">『</tspan><tspan x="442" textLength="567" lengthAdjust="spacing">罪の支払う報酬は死である</tspan><tspan x="1048">』</tspan></text>
    <text y="496.5"><tspan x="438" text-anchor="end">『</tspan><tspan x="438" textLength="471" lengthAdjust="spacing">肉の思いは死であるが</tspan><tspan x="948">』</tspan></text>
  </g>
  <!-- … -->
  <g>
    <circle cx="1013" cy="380" r="2.7"/>
    <circle cx="1028.5" cy="380" r="2.7"/>
    <circle cx="1044" cy="380" r="2.7"/>
    <circle cx="914" cy="497" r="2.7"/>
    <circle cx="929" cy="497" r="2.7"/>
    <circle cx="944" cy="497" r="2.7"/>
  </g>
</svg>
