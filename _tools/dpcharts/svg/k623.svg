<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>5. 君主社会と帝国主義社会</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="34" y="37" font-size="30" textLength="25" lengthAdjust="spacingAndGlyphs">5.</text>
    <text x="70.5" y="36.5" font-size="29" textLength="319" lengthAdjust="spacing">君主社会と帝国主義社会</text>
  </g>
  <line x1="70" y1="55" x2="388" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印（箱の下に描く） -->
  <g fill="#8C949A">
    <polygon points="247.5,150 253.5,150 253.5,181 257.5,181 250.5,193.5 243.5,181 247.5,181"/>
    <polygon points="247.5,236 253.5,236 253.5,376 257.5,376 250.5,388.5 243.5,376 247.5,376"/>
  </g>

  <!-- ゲルマン民族とフランク王国 -->
  <g fill="#FCE5E3" stroke="currentColor" stroke-width="2.8">
    <rect x="169.5" y="112.5" width="162.5" height="44.5"/>
    <rect x="169.5" y="198.5" width="162.5" height="44.5"/>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="250.5" y="134" textLength="142.4" lengthAdjust="spacing">ゲルマン民族</text>
    <text x="251" y="220.5" textLength="139.4" lengthAdjust="spacing">フランク王国</text>
  </g>

  <!-- 右の字 -->
  <g>
    <circle cx="360" cy="215" r="7.5"/>
    <circle cx="360" cy="253.5" r="7.5"/>
    <circle cx="360" cy="291.5" r="7.5"/>
  </g>
  <g dominant-baseline="central" font-size="27">
    <text x="375.6" y="215" textLength="229" lengthAdjust="spacing">メロヴィング王朝</text>
    <text x="375.6" y="253.5" textLength="200" lengthAdjust="spacing">カロリング王朝</text>
    <text x="375.6" y="291.5" textLength="200" lengthAdjust="spacing">チャールズ大帝</text>
  </g>
  <g dominant-baseline="central" font-size="25">
    <text y="332.5"><tspan x="380" text-anchor="middle">－</tspan><tspan x="392.7" textLength="104.5" lengthAdjust="spacing">君主国家</tspan></text>
    <text y="366.5"><tspan x="380" text-anchor="middle">－</tspan><tspan x="393.7" textLength="235.5" lengthAdjust="spacing">中部ヨーロッパ統一</tspan></text>
  </g>
</svg>
