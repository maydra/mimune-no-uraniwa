  <!-- マタイ 7:12 -->
  <text x="222 263 304 326 347.5 368 387.5 409.5" y="601" font-size="40" text-anchor="middle" dominant-baseline="central">マタイ 7:12</text>
  <g font-size="41" font-weight="400" dominant-baseline="central">
    <text x="454.5 482.5 524 568 610 654 693.5 736.5 781 820.5 862.5 904.5 947 989.5 1031 1074.5" y="601" text-anchor="middle">『人々からしてほしいと望むことは</text>
    <text x="1097" y="601">、</text>
    <text x="482.5 523 566.5 607.5 649.5 690.5 732.5 775 815.5 858.5 899 940 968.5" y="656" text-anchor="middle">人々にもそのとおりにせよ』</text>
