    <line x1="355" y1="259.5" x2="383.4" y2="282.8"/>
    <line x1="292.5" y1="324" x2="316.6" y2="345.9"/>
    <line x1="383.5" y1="323.7" x2="358.1" y2="346.4"/>
    <line x1="573.5" y1="259" x2="548.7" y2="284"/>
    <line x1="608" y1="259.5" x2="634.1" y2="282.3"/>
    <line x1="544" y1="326.5" x2="569" y2="345.6"/>
