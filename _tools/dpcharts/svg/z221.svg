    <text x="338" y="632.5" font-size="40"><tspan textLength="394" lengthAdjust="spacingAndGlyphs">完成したアダムとエバ：</tspan><tspan x="732" textLength="359" lengthAdjust="spacingAndGlyphs">二つの木をもって比喩</tspan></text>
