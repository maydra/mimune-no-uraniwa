<h1>詩篇 第1章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>悪しき者のはかりごとに歩まず、罪びとの道に立たず、あざける者の座にすわらぬ人はさいわいである。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>このような人は主のおきてをよろこび、昼も夜もそのおきてを思う。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>このような人は流れのほとりに植えられた木の時が来ると実を結び、その葉もしぼまないように、そのなすところは皆栄える。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>悪しき者はそうでない、風の吹き去るもみがらのようだ。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>それゆえ、悪しき者はさばきに耐えない。罪びとは正しい者のつどいに立つことができない。</p>
<p id="v6"><sup><a href="#v6" class="verse-link">6</a></sup>主は正しい者の道を知られる。しかし、悪しき者の道は滅びる。</p>
