  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="174.5" cy="365.5" rx="45.5" ry="18.5" fill="#CF921C"/>
    <ellipse cx="215.5" cy="303.5" rx="62" ry="19" fill="#FCE5E3"/>
    <ellipse cx="294.5" cy="236.5" rx="50.5" ry="19" fill="#F8F28F"/>
