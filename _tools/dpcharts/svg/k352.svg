<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヨシュアを中心とする実体基台　出発のための摂理（磐石の水を中心）</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="205.5,105 212.5,117 208.5,117 208.5,145 202.5,145 202.5,117 198.5,117"/>
    <polygon points="261.5,219 274.5,212 274.5,216 533,216 533,222 274.5,222 274.5,226"/>
    <polygon points="391,321 405,321 405,334 412.5,334 398,347.5 383.5,334 391,334"/>
  </g>

  <!-- 神 -->
  <circle cx="206" cy="71.5" r="30" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="206" y="71.5" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- モーセ・ヨシュア・内的イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="205" cy="168" rx="51" ry="23.5" fill="#F8F28F"/>
    <ellipse cx="205" cy="219" rx="51" ry="23.5" fill="#F8F28F"/>
    <ellipse cx="600" cy="217" rx="69.5" ry="48.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="26">
      <text x="205.5" y="169" textLength="78" lengthAdjust="spacing">モーセ</text>
      <text x="205.5" y="220" textLength="88" lengthAdjust="spacing">ヨシュア</text>
    </g>
    <g font-size="24">
      <text x="600.5" y="192" textLength="50" lengthAdjust="spacing">内的</text>
      <text x="602" y="218.5" textLength="118" lengthAdjust="spacing">イスラエル</text>
      <text x="601" y="246" textLength="50" lengthAdjust="spacing">民族</text>
    </g>
  </g>

  <!-- 実体基台・出発のための摂理 -->
  <rect x="329" y="163" width="137" height="44" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="398" y="185" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="114" lengthAdjust="spacing">実体基台</text>
  <rect x="280" y="233" width="243" height="75" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="401.5" y="256" textLength="209" lengthAdjust="spacing">出発のための摂理</text>
    <text x="400.5" y="287.5" textLength="203" lengthAdjust="spacing">（磐石の水を中心）</text>
  </g>

  <!-- 蕩減条件 -->
  <g font-size="26" dominant-baseline="central">
    <text x="177" y="381" text-anchor="end">「</text>
    <text x="176" y="381" textLength="442" lengthAdjust="spacing">堕落性を脱ぐための民族的な蕩減条件</text>
    <text x="617" y="381">」</text>
  </g>
</svg>
