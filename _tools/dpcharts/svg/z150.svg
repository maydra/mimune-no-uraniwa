<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>忠・孝・烈</title>
  <defs>
    <marker id="z150-a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.5" markerHeight="2.5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 題 忠・孝・烈 -->
  <g font-size="46" text-anchor="middle" dominant-baseline="central">
    <text x="77.5" y="53.5">忠</text>
    <text x="177" y="53.5">孝</text>
    <text x="277" y="53.5">烈</text>
  </g>
  <circle cx="127.5" cy="53.5" r="6"/>
  <circle cx="227.5" cy="53.5" r="6"/>
  <line x1="53" y1="84" x2="302" y2="84" stroke="currentColor" stroke-width="3.5"/>

  <g stroke="currentColor" stroke-width="3.5">
    <ellipse cx="466.5" cy="186" rx="62.5" ry="65" fill="#F98AEE"/>
    <ellipse cx="825" cy="186" rx="63" ry="65.5" fill="#A0F08A"/>
    <ellipse cx="466.5" cy="384" rx="62.5" ry="57" fill="#F98AEE"/>
    <ellipse cx="825" cy="384" rx="62.5" ry="57" fill="#A0F08A"/>
    <ellipse cx="466.5" cy="575.5" rx="62.5" ry="57" fill="#F98AEE"/>
    <ellipse cx="825" cy="576" rx="62.5" ry="57" fill="#A0F08A"/>
  </g>
  <g fill="#111" text-anchor="middle" dominant-baseline="central">
    <g font-size="41">
      <text x="469" y="162.5">目上</text>
      <text x="467" y="212.5">の人</text>
      <text x="825.5" y="164">目下</text>
      <text x="824" y="213">の人</text>
    </g>
    <g font-size="48">
      <text x="467.5" y="384.5">父母</text>
      <text x="825" y="383.5">子女</text>
    </g>
    <text x="467" y="575" font-size="51">夫</text>
    <text x="825.5" y="575" font-size="52">妻</text>
  </g>

  <!-- 愛（上・右へ）と美（下・左へ） -->
  <g stroke="currentColor" stroke-width="7.5" fill="none" marker-end="url(#z150-a)">
    <g>
      <path d="M554,168.5 Q647.2,144.3 735.6,172.9"/>
      <path d="M735,194 Q646.2,218.6 556.7,188.9"/>
    </g>
    <g transform="translate(0,197)">
      <path d="M554,168.5 Q647.2,144.3 735.6,172.9"/>
      <path d="M735,194 Q646.2,218.6 556.7,188.9"/>
    </g>
    <g transform="translate(0,390.5)">
      <path d="M554,168.5 Q647.2,144.3 735.6,172.9"/>
      <path d="M735,194 Q646.2,218.6 556.7,188.9"/>
    </g>
  </g>

  <!-- 愛・美は元の画像のとおり細字 -->
  <g font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="641" y="123.5">愛</text>
    <text x="641" y="320.5">愛</text>
    <text x="645" y="513">愛</text>
    <text x="600.5" y="240">美</text>
    <text x="599.5" y="438.5">美</text>
    <text x="603.5" y="634">美</text>
  </g>
  <!-- （忠）（孝）（烈） -->
  <g dominant-baseline="central">
    <g font-size="45" text-anchor="end">
      <text x="655" y="240">（</text>
      <text x="654" y="438.5">（</text>
      <text x="657" y="634">（</text>
    </g>
    <g font-size="44" text-anchor="middle">
      <text x="675.5" y="240">忠</text>
      <text x="674" y="438.5">孝</text>
      <text x="677" y="634">烈</text>
    </g>
    <g font-size="45">
      <text x="695" y="240">）</text>
      <text x="695" y="438.5">）</text>
      <text x="698" y="634">）</text>
    </g>
  </g>
</svg>
