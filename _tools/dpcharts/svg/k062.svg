<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ．信仰基台　条件物</title>

  <!-- 題 -->
  <text x="49.5" y="36" font-size="30" text-anchor="middle" dominant-baseline="central">Ⅰ</text>
  <text x="66" y="48" font-size="30">.</text>
  <text x="82" y="36" font-size="31" textLength="124" lengthAdjust="spacing" dominant-baseline="central">信仰基台</text>
  <line x1="81" y1="55" x2="207" y2="55" stroke="currentColor" stroke-width="2.2"/>
  <text x="82" y="85" font-size="28" textLength="83" lengthAdjust="spacing" dominant-baseline="central">条件物</text>
  <line x1="80" y1="102.5" x2="166" y2="102.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印（上へ） -->
  <g fill="#8C949A">
    <polygon points="270,190 278.5,202 273.5,202 273.5,231 266.5,231 266.5,202 261.5,202"/>
    <polygon points="270,300 278.5,313 273.5,313 273.5,342 266.5,342 266.5,313 261.5,313"/>
    <polygon points="551,190 559.5,202 554.5,202 554.5,231 547.5,231 547.5,202 542.5,202"/>
    <polygon points="551,300 559.5,313 554.5,313 554.5,342 547.5,342 547.5,313 542.5,313"/>
    <!-- 蕩減復帰の太い矢印 -->
    <polygon points="356,256.5 436.5,256.5 436.5,242.5 467,265 436.5,287.5 436.5,273.5 356,273.5"/>
  </g>

  <!-- 神 -->
  <g stroke="currentColor" stroke-width="2.2" fill="#fff" class="paper">
    <ellipse cx="270" cy="156.5" rx="45" ry="28.8"/>
    <ellipse cx="552" cy="156.5" rx="45" ry="28.8"/>
  </g>
  <g font-size="35" text-anchor="middle" dominant-baseline="central">
    <text x="268" y="156">神</text>
    <text x="550" y="156">神</text>
  </g>

  <!-- み言・条件物 -->
  <g stroke="currentColor" stroke-width="2.2" fill="#CDF8F7">
    <ellipse cx="269.5" cy="266.5" rx="61.5" ry="29.5"/>
    <ellipse cx="551" cy="266.5" rx="61.5" ry="29.5"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="246" y="267">み</text>
    <text x="293" y="267">言</text>
    <text x="550.5" y="266.5" font-size="30" textLength="92" lengthAdjust="spacing">条件物</text>
  </g>

  <!-- み言の × （楕円の外は currentColor、中は #111） -->
  <g stroke-width="4" stroke-linecap="butt">
    <g stroke="currentColor">
      <line x1="247" y1="229" x2="251" y2="238"/>
      <line x1="280" y1="295" x2="286" y2="307"/>
      <line x1="288" y1="229" x2="284" y2="238"/>
      <line x1="253" y1="295" x2="249" y2="307"/>
    </g>
    <g stroke="#111">
      <line x1="251" y1="237.5" x2="280" y2="295.5"/>
      <line x1="284" y1="237.5" x2="253" y2="295.5"/>
    </g>
  </g>

  <!-- アダム・堕・ア -->
  <g stroke="currentColor" stroke-width="2.2" fill="#CF921C">
    <ellipse cx="271" cy="374.5" rx="59.5" ry="26.5"/>
    <ellipse cx="552" cy="374.5" rx="59.5" ry="26.5"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="271.5" y="374" textLength="88" lengthAdjust="spacing">アダム</text>
    <text x="526.5" y="374">堕</text>
    <text x="577.5" y="374">ア</text>
  </g>
  <circle cx="552" cy="374.5" r="3.5" fill="#111"/>

  <!-- 地の上の字 -->
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="163.5" y="266.5" textLength="56" lengthAdjust="spacing">不信</text>
    <text x="662.5" y="266.5" textLength="84" lengthAdjust="spacing">供え物</text>
    <text x="406" y="216" textLength="113" lengthAdjust="spacing">蕩減復帰</text>
  </g>
</svg>
