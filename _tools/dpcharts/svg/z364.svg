<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>①心霊の復帰</title>

  <text x="53" y="58.5" font-size="48" dominant-baseline="central" textLength="307" lengthAdjust="spacing">①心霊の復帰</text>

  <!-- 2つの箱と、上にかかる楕円の札 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="226.5" y="198.5" width="390" height="225.5" fill="#fff" class="paper"/>
    <rect x="686.5" y="198.5" width="390" height="225.5" fill="#fff" class="paper"/>
    <ellipse cx="421.5" cy="198.5" rx="92" ry="63" fill="#FCE5E3"/>
    <ellipse cx="881.5" cy="192" rx="89" ry="44" fill="#DCC4C4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="46">
      <text x="421.5" y="173">人間</text>
      <text x="421.5" y="224">完成</text>
    </g>
    <text x="881.5" y="192" font-size="56">現世</text>
  </g>

  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="421.5" y="300">心情一体</text>
    <text x="421.5" y="362">(一問一答)</text>
    <text x="881.5" y="300">霊通する</text>
    <text x="881.5" y="362">信徒たち</text>
  </g>

  <!-- 使徒 2:17 -->
  <g font-size="33" dominant-baseline="central">
    <text x="226" y="467.5" textLength="131" lengthAdjust="spacingAndGlyphs">使徒 2:17</text>
    <text x="358" y="467.5" font-weight="400" textLength="726" lengthAdjust="spacing">『あなたがたのむすこ娘は預言をし、若者たちは</text>
    <text x="389" y="513.5" font-weight="400">幻を見、老人たちは夢を見るであろう』</text>
  </g>

  <text x="649" y="621" font-size="66" text-anchor="middle" dominant-baseline="central" textLength="358" lengthAdjust="spacing">現世 = 終末</text>
</svg>
