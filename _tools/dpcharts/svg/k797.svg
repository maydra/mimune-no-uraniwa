<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>「ダニエル 7:13」 学者：イエス再臨の預言／当時のユダヤ人：イエス初臨のときの現象</title>

  <!-- 「ダニエル 7:13」の二つの見方 -->
  <g font-size="22" dominant-baseline="central">
    <text x="130" y="48.5" textLength="152" lengthAdjust="spacing">「ダニエル 7:13」</text>
    <text x="350" y="48.5" textLength="66" lengthAdjust="spacing">学　者</text>
    <text x="313" y="81.5" textLength="147" lengthAdjust="spacing">当時のユダヤ人</text>
    <text x="481" y="48.5" textLength="179" lengthAdjust="spacing">イエス再臨の預言</text>
    <text x="481" y="81.5" textLength="206" lengthAdjust="spacing">イエス初臨のときの現象</text>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central">
    <text x="470" y="48.5">：</text>
    <text x="470" y="81.5">：</text>
  </g>
  <circle cx="300.5" cy="49" r="6"/>
  <circle cx="299.5" cy="83.5" r="6"/>
  <text x="532" y="110.5" font-size="19" dominant-baseline="central" textLength="109" lengthAdjust="spacing">(マタイ 11:13)</text>

  <!-- 灰色の矢印 -->
  <g stroke="#8C949A" stroke-width="5" fill="#8C949A">
    <line x1="349" y1="186" x2="294.1" y2="219.3"/>
    <polygon points="283,226 290.8,211.9 299.1,225.6" stroke="none"/>
    <line x1="465" y1="186" x2="530.5" y2="220"/>
    <polygon points="542,226 525.9,226.6 533.3,212.4" stroke="none"/>
  </g>

  <!-- × -->
  <g stroke="currentColor" stroke-width="2.8">
    <line x1="303" y1="196.5" x2="340" y2="210"/>
    <line x1="315" y1="186" x2="328" y2="222"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="407" cy="174" rx="58.5" ry="41.5" fill="#F8F28F"/>
    <ellipse cx="238.5" cy="255.5" rx="100" ry="29" fill="#fff" class="paper"/>
    <ellipse cx="592.5" cy="256.5" rx="87.5" ry="26.5" fill="#fff" class="paper"/>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="406.5" y="162" textLength="92" lengthAdjust="spacing">イエスの</text>
    <text x="406.5" y="191" textLength="46" lengthAdjust="spacing">初臨</text>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="238" y="256" font-size="24" textLength="161" lengthAdjust="spacing">雲に乗って来る</text>
    <text x="592" y="257" font-size="26" textLength="103" lengthAdjust="spacing">地上誕生</text>
    <text x="237.5" y="309" font-size="25" textLength="186" lengthAdjust="spacing">信徒たちは信じる</text>
    <text x="593" y="309" font-size="25" textLength="45" lengthAdjust="spacing">実際</text>
  </g>

  <!-- 結論の箱 -->
  <rect x="237" y="345.5" width="355" height="47.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="259" y="369.5" textLength="51" lengthAdjust="spacing">再臨</text>
    <text x="323" y="369.5" text-anchor="middle">：</text>
    <text x="338" y="369.5" textLength="232" lengthAdjust="spacing">聖書を詳しく調べる</text>
  </g>
</svg>
