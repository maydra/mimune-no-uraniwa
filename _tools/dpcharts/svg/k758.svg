<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>② イエスの第二の試練を世界的に越えさせる</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="48.5" y="37" font-size="27" text-anchor="middle">②</text>
    <text x="69" y="37" font-size="26" textLength="494" lengthAdjust="spacing">イエスの第二の試練を世界的に越えさせる</text>
  </g>
  <line x1="67" y1="54" x2="566" y2="54" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印（楕円より先に描く） -->
  <g fill="#8C949A">
    <polygon points="227,150 235,150 235,221 241.5,221 231,240 220.5,221 227,221"/>
    <polygon points="550,150 558,150 558,221 564.5,221 554,240 543.5,221 550,221"/>
    <polygon points="279,193.5 496,193.5 496,188 510,196 496,204 496,198.5 279,198.5"/>
    <polygon points="547,335 563,335 563,345 572.5,345 555,355.5 537.5,345 547,345"/>
  </g>

  <!-- イエスと天の側地上人 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="230" cy="121" rx="52.5" ry="36" fill="#F8F28F"/>
    <ellipse cx="554.5" cy="120.5" rx="64" ry="37" fill="#F86D42"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="229.5" y="121" textLength="80" lengthAdjust="spacing">イエス</text>
    <text x="553.5" y="107.5" font-size="26" textLength="79" lengthAdjust="spacing">天の側</text>
    <text x="554" y="136" font-size="26" textLength="78" lengthAdjust="spacing">地上人</text>
  </g>

  <text x="389" y="174" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="181" lengthAdjust="spacing">世界的に越える</text>

  <!-- 水色の箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="2.5">
    <rect x="146.5" y="244.5" width="167" height="45"/>
    <rect x="437.5" y="243.5" width="232" height="45"/>
    <rect x="435.5" y="361.5" width="235" height="45.5"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="229" y="267.5" textLength="143" lengthAdjust="spacing">第二の試練</text>
    <text x="553" y="266" textLength="201" lengthAdjust="spacing">第二次世界大戦</text>
    <text x="554.5" y="385.5" font-size="26" textLength="208" lengthAdjust="spacing">天の側世界的基盤</text>
  </g>

  <!-- 箱の下の字 -->
  <g font-size="25" dominant-baseline="central">
    <text x="144" y="315" textLength="49" lengthAdjust="spacing">勝利</text>
    <text x="208" y="315" text-anchor="middle">：</text>
    <text x="223" y="315" textLength="103" lengthAdjust="spacing">子女復帰</text>
    <text x="223" y="352" textLength="103" lengthAdjust="spacing">基台造成</text>
    <text x="552" y="314.5" text-anchor="middle" textLength="155" lengthAdjust="spacing">第二祝福復帰</text>
  </g>
</svg>
