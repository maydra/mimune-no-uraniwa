<!DOCTYPE html>
<html lang="ja">
<head>
<!-- Google tag (gtag.js)。どの古いリンクから来たかをアナリティクスで見られるようにする -->

<meta charset="utf-8">

<title>ページが見つかりません | み旨の裏庭</title>

<!-- GitHub Pages はどの URL の 404 にもこのページを返すので、リンクと CSS は相対パスにしない -->
<style>
    :root {
        --bg: #ffffff; --ink: #222222; --muted: #666666;
        --card: #f5f5f7; --accent: #4a5bb0; --line: #c9cbd6;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #1a1a2e; --ink: #e0e0e0; --muted: #9aa0ad;
            --card: #24243e; --accent: #a5b4fc; --line: #3a3a5c;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 2rem 1rem; min-height: 100vh;
        background: var(--bg); color: var(--ink);
        font-family: "Hiragino Mincho ProN", "BIZ UDPMincho", "Yu Mincho", YuMincho, "Noto Serif CJK JP", "Noto Serif JP", serif;
        line-height: 1.9; display: flex; justify-content: center;
    }
    main { max-width: 34em; width: 100%; }
    h1 { font-size: 1.6rem; margin: 0 0 1rem; }
    p { margin: 0.6rem 0; }
    .muted { color: var(--muted); font-size: 0.95rem; word-break: break-all; }
    form { display: flex; gap: 0.5rem; margin: 1.2rem 0; }
    input {
        flex: 1; min-width: 0; padding: 0.6rem 0.8rem; font: inherit;
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--bg); color: var(--ink);
    }
    button {
        padding: 0.6rem 1.2rem; font: inherit; font-weight: 600;
        border: none; border-radius: 10px;
        background: var(--accent); color: var(--bg); cursor: pointer;
    }
    ul { list-style: none; padding: 0; margin: 1rem 0; }
    li a {
        display: block; padding: 0.8rem 1rem; margin-bottom: 0.6rem;
        background: var(--card); border-radius: 10px;
        color: var(--accent); text-decoration: none; font-weight: 600;
    }
</style>
</head>
<body>
<main>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは、場所が移ったか、URL が変わった可能性があります。</p>
    <p class="muted" id="where"></p>
    <form action="/mimune-no-uraniwa/search-all.html" method="get" role="search">
        <input type="search" name="q" placeholder="み言の言葉で探す" aria-label="全文検索">
        <button type="submit">検索</button>
    </form>
    <ul>
        <li><a href="/mimune-no-uraniwa/">み旨の裏庭のトップ（本の一覧）へ</a></li>
        <li><a href="/mimune-no-uraniwa/search-all.html">全部の本からくわしく検索する</a></li>
    </ul>
</main>
<script>
    // 開こうとした URL を見せる（打ち間違いに気づけるように）
    var path = location.pathname;
    try { path = decodeURI(path); } catch (e) { }
    document.getElementById('where').textContent = '開こうとした URL: ' + path;
</script>
</body>
</html>
