<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>愛　堕落の原因</title>

  <!-- 愛から三つへ（線は楕円より先に描き、楕円で隠す） -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="410" y1="245" x2="476" y2="157.6"/>
    <line x1="410" y1="266.5" x2="478" y2="266.5"/>
    <line x1="410" y1="288" x2="474.5" y2="379.6"/>
  </g>
  <ellipse cx="327" cy="266.5" rx="95.5" ry="53.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="5"/>
  <text x="322.5" y="264.5" font-size="68" text-anchor="middle" dominant-baseline="central">愛</text>

  <g font-size="48" dominant-baseline="central">
    <text x="497" y="116" textLength="561" lengthAdjust="spacingAndGlyphs">死ぬことを知っていながら</text>
    <text x="494" y="179" textLength="614" lengthAdjust="spacingAndGlyphs">乗り越えることのできる行動</text>
  </g>
  <g font-size="50" dominant-baseline="central">
    <text x="494" y="271.5"><tspan textLength="217" lengthAdjust="spacing">最も貴く</tspan>、<tspan x="764" textLength="270" lengthAdjust="spacing">聖なるもの</tspan></text>
    <text x="484" y="389.5" textLength="592" lengthAdjust="spacing">その行動を卑しく見なす</text>
  </g>

  <polygon points="310,347 310,448 298,448 316.5,488 335,448 323,448 323,347" fill="#8C949A"/>

  <rect x="211.5" y="514.5" width="380" height="93" fill="#CDF8F7" stroke="currentColor" stroke-width="5"/>
  <text x="399" y="560.5" font-size="60" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="308" lengthAdjust="spacing">堕落の原因</text>
</svg>
