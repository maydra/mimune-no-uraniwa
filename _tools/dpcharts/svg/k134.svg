<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ノアを中心とする復帰摂理：×</title>

  <!-- 箱 -->
  <g stroke="currentColor" stroke-width="3.4">
    <rect x="183.5" y="55.8" width="451.5" height="44.7" fill="#CDF8F7"/>
    <rect x="232.5" y="147.5" width="364.5" height="45.5" fill="#CDF8F7"/>
    <rect x="290" y="240" width="249" height="45" fill="#fff" class="paper"/>
    <rect x="291" y="335" width="248" height="45" fill="#fff" class="paper"/>
  </g>

  <!-- 字 -->
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="206" y="78" font-size="29" textLength="356" lengthAdjust="spacing">ノアを中心とする復帰摂理</text>
    <text x="576.5" y="78" text-anchor="middle">：</text>
    <text x="244" y="169.5" textLength="280" lengthAdjust="spacing">メシヤのための基台</text>
    <text x="541" y="169.5" text-anchor="middle">：</text>
  </g>
  <g font-size="30" dominant-baseline="central">
    <text x="321" y="262" textLength="124" lengthAdjust="spacing">実体基台</text>
    <text x="462" y="262" text-anchor="middle">：</text>
    <text x="320" y="357" textLength="125" lengthAdjust="spacing">信仰基台</text>
    <text x="462" y="357" text-anchor="middle">：</text>
  </g>

  <!-- × と ○ -->
  <g stroke="#111" stroke-width="5">
    <path d="M590,68 L610,88 M610,68 L590,88"/>
    <path d="M558,161 L578,181 M578,161 L558,181"/>
  </g>
  <g stroke="currentColor" stroke-width="5" fill="none">
    <path d="M486,252.5 L506,272.5 M506,252.5 L486,272.5"/>
    <circle cx="495.5" cy="356.5" r="12.8" stroke-width="4.4"/>
  </g>

  <!-- 上へ・等しい・足す -->
  <polygon points="406.5,139 406.5,125 400,125 410.3,108.5 420.5,125 414.5,125 414.5,139" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="4" fill="none">
    <line x1="404.5" y1="203" x2="404.5" y2="227"/>
    <line x1="416" y1="203" x2="416" y2="227"/>
  </g>
  <path d="M397,309 H425 M411,295 V323" stroke="currentColor" stroke-width="5" fill="none"/>
</svg>
