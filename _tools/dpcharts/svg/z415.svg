<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>十字架の犠牲は無為に帰したのであろうか？</title>

  <text x="53" y="57" font-size="45" dominant-baseline="central" textLength="900" lengthAdjust="spacing">十字架の犠牲は無為に帰したのであろうか？</text>
  <line x1="53" y1="87.5" x2="952" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <!-- 十字架 -->
  <g transform="translate(220.0,167.0) scale(1.3900,1.2556)" stroke-width="2.268" fill="#7A5230" stroke="#111" stroke-linejoin="round">
    <path d="M40,0 H60 V42 H100 V60 H60 V180 H40 V60 H0 V42 H40 Z"/>
  </g>

  <!-- 二つに分かれる矢印 -->
  <polyline points="479.65,230.16 391.5,292.5 479.65,354.84" fill="none" stroke="#8C949A" stroke-width="12.5"/>
  <g fill="#8C949A">
    <polygon points="502.5,214 470.4,217.1 488.9,243.2"/>
    <polygon points="502.5,371 470.4,367.9 488.9,341.8"/>
  </g>

  <g font-size="45" dominant-baseline="central">
    <text y="182.5"><tspan x="525" textLength="180" lengthAdjust="spacing">キリスト</tspan><tspan x="708" textLength="182" lengthAdjust="spacing">教の歴史</tspan></text>
    <text x="525" y="245.5" textLength="411" lengthAdjust="spacing">十字架の贖罪の恩賜</text>
    <text x="525" y="373.5" textLength="504" lengthAdjust="spacing">本然の人間に復帰できず</text>
    <text x="525" y="437" textLength="320" lengthAdjust="spacing">地上天国未完遂</text>
  </g>

  <rect x="373" y="543.5" width="657" height="82" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="405" y="584" font-size="52" dominant-baseline="central" fill="#111" textLength="590" lengthAdjust="spacing">十字架の贖罪の限界は？</text>
</svg>
