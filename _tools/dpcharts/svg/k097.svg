<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. アダムの家庭が見せてくれた教訓</title>

  <text x="36" y="37" font-size="29" dominant-baseline="central">Ⅳ.</text>
  <text x="88" y="36.5" font-size="31" textLength="466" lengthAdjust="spacing" dominant-baseline="central">アダムの家庭が見せてくれた教訓</text>
  <line x1="84" y1="55.5" x2="557" y2="55.5" stroke="currentColor" stroke-width="2"/>

  <!-- 番号と括弧 -->
  <g font-size="28" dominant-baseline="central">
    <text x="125" y="107">①</text>
    <text x="125" y="231">②</text>
    <text x="128" y="347">③</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
    <path d="M172,91 C166,93 164.5,97 164.5,103 L164.5,124 C164.5,128 163,130.5 159,131 C163,131.5 164.5,134 164.5,138 L164.5,160 C164.5,166 166.5,170 171,172"/>
    <path d="M173,213.5 C167,216 165.5,219 165.5,225 L165,247 C165,251 163,253.5 159,254 C163,254.5 165,257 165,261 L165,283 C165,289 167.5,292 173,294.5"/>
  </g>

  <!-- 点線 -->
  <g stroke="currentColor" stroke-width="3.5">
    <line x1="301" y1="108" x2="336.5" y2="108" stroke-dasharray="3.5 4.25"/>
    <line x1="355" y1="157" x2="382.5" y2="157" stroke-dasharray="3.5 4.5"/>
    <line x1="400" y1="232" x2="453.5" y2="232" stroke-dasharray="3.5 4.07"/>
    <line x1="400" y1="277" x2="453.5" y2="277" stroke-dasharray="3.5 4.07"/>
    <line x1="296" y1="346.5" x2="433.5" y2="346.5" stroke-dasharray="3.5 3.94"/>
  </g>

  <!-- 丸で囲んだ神と人 -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="365" cy="105.2" r="19.5"/>
    <circle cx="412.5" cy="157" r="19.5"/>
    <circle cx="560.8" cy="105.2" r="16.8"/>
    <circle cx="193.2" cy="156" r="16.8"/>
    <circle cx="191.8" cy="276.8" r="16.8"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="365" y="106" font-size="27">神</text>
    <text x="412.5" y="157.5" font-size="27">神</text>
    <text x="560.8" y="106" font-size="24">人</text>
    <text x="193.2" y="157" font-size="24">人</text>
    <text x="191.8" y="277.5" font-size="24">人</text>
  </g>

  <!-- ＋ -->
  <g stroke="currentColor" stroke-width="4">
    <line x1="515" y1="105" x2="535.5" y2="105"/>
    <line x1="525.2" y1="94.5" x2="525.2" y2="115.5"/>
  </g>

  <!-- 本文 -->
  <g font-size="28" dominant-baseline="central">
    <text x="177" y="107.5" textLength="114" lengthAdjust="spacing">み旨成就</text>
    <text x="390" y="106.5" textLength="114" lengthAdjust="spacingAndGlyphs">の責任分担</text>
    <text x="217" y="157.5" textLength="128" lengthAdjust="spacingAndGlyphs">の責任分担</text>
    <text x="439" y="157.5" textLength="259" lengthAdjust="spacingAndGlyphs">教示なさることができない</text>
    <text x="178" y="231" textLength="209" lengthAdjust="spacingAndGlyphs">み旨に対する予定</text>
    <text x="466" y="231" textLength="85" lengthAdjust="spacing">絶対的</text>
    <text x="217" y="277" textLength="169" lengthAdjust="spacing">に対する予定</text>
    <text x="465" y="274.5" textLength="86" lengthAdjust="spacing">相対的</text>
    <text x="172" y="346.5" textLength="113" lengthAdjust="spacing">堕落人間</text>
    <text x="445" y="345.5" textLength="235" lengthAdjust="spacingAndGlyphs">常にアベル的な存在</text>
    <text x="445" y="385" textLength="157" lengthAdjust="spacingAndGlyphs">求め従順屈伏</text>
  </g>
</svg>
