<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>歴史的勝利者</title>

  <text x="31" y="37" font-size="30" dominant-baseline="central" textLength="190" lengthAdjust="spacing">歴史的勝利者</text>
  <line x1="31" y1="56.5" x2="220" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 私と再臨主の間を行き来する矢印 -->
  <g fill="none" stroke="currentColor" stroke-width="6">
    <path d="M171.5,305 Q145.2,240.6 169.2,174.4"/>
    <path d="M226,168 Q249.6,233.1 228.6,298.1"/>
  </g>
  <polygon points="173,164 175.7,179 160.8,173.2"/>
  <polygon points="225,308.5 222.1,293.5 237.1,299.2"/>

  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="200.5" cy="125.5" rx="77" ry="31" fill="#F8F28F"/>
    <ellipse cx="200.5" cy="344.5" rx="77" ry="31" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="202.5" y="125.5" font-size="34">再臨主</text>
    <text x="200.5" y="345" font-size="38">私</text>
  </g>

  <!-- 歴史的勝利者になるには -->
  <g font-size="24" dominant-baseline="central">
    <text x="291" y="136.5">①</text>
    <text x="322" y="136.5" textLength="236" lengthAdjust="spacing">神の心情、目的、使命</text>
    <text x="315" y="173">知らなければ</text>
    <text x="291" y="223">②</text>
    <text x="322" y="223">再臨主を通してすべてを知り、</text>
    <text x="321" y="260" textLength="331" lengthAdjust="spacing">信じ、侍り奉り、一つになって</text>
    <text x="291" y="310">③</text>
    <text x="322" y="310" textLength="236" lengthAdjust="spacing">再臨主と共に、縦的な</text>
    <text x="322" y="347">蕩減条件立てなければ</text>
  </g>
</svg>
