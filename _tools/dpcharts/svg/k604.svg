<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イスラエル民主主義型社会　復帰摂理の目的：霊的にのみ達成</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="217,27 224,27 224,69 229,69 220.5,84 212,69 217,69"/>
    <polygon points="218,211 225,211 225,325 230,325 221.5,340 213,325 218,325"/>
    <polygon points="361.5,271.5 373.5,271.5 373.5,266 382.5,277.5 373.5,289 373.5,283.5 361.5,283.5"/>
  </g>

  <!-- イスラエルの楕円 -->
  <ellipse cx="221" cy="143.5" rx="97.7" ry="52.2" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="221.5" y="115.5" font-size="25" textLength="117" lengthAdjust="spacingAndGlyphs">イスラエル</text>
    <text x="221" y="144" font-size="26" textLength="130" lengthAdjust="spacing">民主主義型</text>
    <text x="220.5" y="173" font-size="26">社会</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="337.5" cy="78.5" r="7.3"/>
    <circle cx="337.5" cy="120" r="7.3"/>
    <circle cx="336.5" cy="158.5" r="7.3"/>
    <circle cx="336.5" cy="198.5" r="7.3"/>
  </g>
  <g font-size="25" dominant-baseline="central">
    <text x="350" y="78.5" textLength="235" lengthAdjust="spacing">ユダヤ王国を滅ぼす</text>
    <text x="350" y="118" textLength="335" lengthAdjust="spacing">民族の王位を空位にしておく</text>
    <text x="351" y="157.5" textLength="287" lengthAdjust="spacing">ギリシャ文明圏内に属国</text>
    <text x="350" y="197" font-size="24.5" textLength="322" lengthAdjust="spacing">民意によってメシヤを王位に</text>
  </g>

  <!-- ユダヤ人 → イエスを十字架で殺害 -->
  <g dominant-baseline="central">
    <text x="243" y="277" font-size="26" textLength="104" lengthAdjust="spacing">ユダヤ人</text>
    <text x="398" y="258.5" font-size="25" textLength="103" lengthAdjust="spacing">イエスを</text>
    <text x="397" y="290" font-size="26" textLength="158" lengthAdjust="spacing">十字架で殺害</text>
  </g>

  <!-- 結論の箱 -->
  <rect x="169.5" y="353.5" width="473" height="48" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="190" y="378.5" textLength="201" lengthAdjust="spacing">復帰摂理の目的</text>
    <text x="405.5" y="378.5" text-anchor="middle">：</text>
    <text x="421" y="378.5" textLength="202" lengthAdjust="spacing">霊的にのみ達成</text>
  </g>
</svg>
