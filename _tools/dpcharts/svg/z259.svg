<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>愛の力が原理の力より強い理由？</title>

  <text x="53" y="57.5" font-size="48" dominant-baseline="central" textLength="748" lengthAdjust="spacing">愛の力が原理の力より強い理由？</text>
  <line x1="52" y1="87.5" x2="801" y2="87.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 理由の二つ -->
  <rect x="310.5" y="130" width="686.5" height="165" rx="13" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <circle cx="347" cy="176" r="11.5"/>
  <circle cx="347" cy="244.5" r="11.5"/>
  <g font-size="48" dominant-baseline="central">
    <text x="372" y="177.5" textLength="350" lengthAdjust="spacing">愛によって主管</text>
    <text x="372" y="242" textLength="600" lengthAdjust="spacing">愛が愛らしく存在するため</text>
  </g>

  <polygon points="623,320 659,320 659,345 681,345 640,369 600,345 623,345" fill="#8C949A"/>

  <!-- 愛の力 ＞ 原理の力 -->
  <rect x="419.5" y="396" width="442.5" height="78.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="44" dominant-baseline="central" fill="#111">
    <text x="447" y="435.5" textLength="135" lengthAdjust="spacing">愛の力</text>
    <text x="654" y="435.5" textLength="185" lengthAdjust="spacing">原理の力</text>
  </g>
  <polyline points="607,416.5 634,435.5 607,454" fill="none" stroke="#111" stroke-width="6.5"/>

  <!-- もし、愛の力 ＜ 原理の力 -->
  <g font-size="40" dominant-baseline="central">
    <text x="415" y="553" textLength="248" lengthAdjust="spacing">もし、愛の力</text>
    <text x="725" y="553" textLength="166" lengthAdjust="spacing">原理の力</text>
    <text x="413.5" y="615.5" textLength="582" lengthAdjust="spacing">人間は神の愛よりも原理を追求</text>
  </g>
  <polyline points="703.5,532.5 687,552.5 703.5,572.5" fill="none" stroke="currentColor" stroke-width="6"/>
  <polygon points="373,602 392,602 392,596 405,613 392,630 392,624 373,624" fill="#8C949A"/>
</svg>
