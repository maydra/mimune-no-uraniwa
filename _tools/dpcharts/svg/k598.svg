<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人類罪悪史の発展過程</title>

  <text x="32" y="38.5" font-size="30" dominant-baseline="central" textLength="314" lengthAdjust="spacing">人類罪悪史の発展過程</text>
  <line x1="32" y1="57.5" x2="347" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 神・サタン -->
  <text x="249" y="95" font-size="31" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="564.5" y="88.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="83" lengthAdjust="spacing">サタン</text>
  <g font-size="23" dominant-baseline="central">
    <text x="478" y="118" text-anchor="middle">（</text>
    <text x="483" y="118" textLength="164" lengthAdjust="spacing">先に歩んできた</text>
    <text x="652.5" y="118" text-anchor="middle">）</text>
  </g>

  <!-- 下向きの灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="249.75,188 258.25,188 258.25,200.5 263.5,200.5 254,216.5 244.5,200.5 249.75,200.5"/>
    <polygon points="248.5,267 257,267 257,277.5 262.25,277.5 252.75,293 243.25,277.5 248.5,277.5"/>
    <polygon points="247.75,344 256.25,344 256.25,354.5 261.5,354.5 252,370.5 242.5,354.5 247.75,354.5"/>
    <polygon points="560.75,192 569.25,192 569.25,201.5 574.5,201.5 565,217 555.5,201.5 560.75,201.5"/>
    <polygon points="560.75,267 569.25,267 569.25,274.5 574.5,274.5 565,290.5 555.5,274.5 560.75,274.5"/>
    <polygon points="562.25,342 570.75,342 570.75,356.5 576,356.5 566.5,372 557,356.5 562.25,356.5"/>
  </g>

  <!-- 神の側の楕円 -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="3">
    <ellipse cx="256" cy="164.5" rx="87" ry="23.5"/>
    <ellipse cx="253" cy="243.5" rx="87" ry="22.5"/>
    <ellipse cx="252" cy="320.5" rx="87" ry="22.5"/>
    <ellipse cx="251" cy="398.5" rx="87.5" ry="22.5"/>
