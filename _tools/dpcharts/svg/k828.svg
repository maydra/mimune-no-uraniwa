<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス　雲の柱：民族の指導者／雲に乗って来られる</title>

  <!-- イエス（縦書き） -->
  <ellipse cx="186" cy="151" rx="32" ry="68" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="186" y="119">イ</text>
    <text x="186" y="151">エ</text>
    <text x="186" y="183">ス</text>
  </g>

  <g font-size="29" dominant-baseline="central">
    <text x="248.5" y="106.5" textLength="288" lengthAdjust="spacing">雲の柱：民族の指導者</text>
    <text x="248.5" y="193.5" textLength="278" lengthAdjust="spacing">雲に乗って来られる：</text>
    <text x="248.5" y="249.5" textLength="402" lengthAdjust="spacing">重生した信徒たちの群れの中で</text>
    <text x="248.5" y="294.5" textLength="374" lengthAdjust="spacing">キリスト教信徒たちの指導者</text>
    <text x="248.5" y="337" textLength="172" lengthAdjust="spacing">として現れる</text>
  </g>
</svg>
