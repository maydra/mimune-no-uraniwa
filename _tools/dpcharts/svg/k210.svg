<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>預言者の生涯記録 → 堕落人間が歩まなければならない道　ヤコブ、モーセの復帰摂理路程 → イエスの人類救済摂理路程</title>

  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="240" cy="118" rx="84" ry="60.5"/>
    <ellipse cx="557" cy="118" rx="127.5" ry="60.5"/>
    <ellipse cx="243.5" cy="312" rx="118" ry="60"/>
    <ellipse cx="563" cy="312" rx="91.5" ry="83.5"/>
  </g>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="350.5,115 394.5,115 394.5,109 411,118 394.5,127 394.5,122 350.5,122"/>
    <polygon points="384.5,308.5 430.5,308.5 430.5,303 447,312 430.5,321 430.5,315.5 384.5,315.5"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="31">
      <text x="240.5" y="98.5" textLength="127" lengthAdjust="spacing">預言者の</text>
      <text x="240.5" y="137.5" textLength="127" lengthAdjust="spacing">生涯記録</text>
    </g>
    <g font-size="25">
      <text x="557" y="98" textLength="200" lengthAdjust="spacing">堕落人間が歩まな</text>
      <text x="557.5" y="137.5" textLength="200" lengthAdjust="spacing">ければならない道</text>
    </g>
    <text x="244" y="335.5" font-size="28" textLength="171" lengthAdjust="spacing">復帰摂理路程</text>
    <g font-size="31">
      <text x="563" y="272.5" textLength="126" lengthAdjust="spacing">イエスの</text>
      <text x="563.5" y="311.5" textLength="126" lengthAdjust="spacing">人類救済</text>
      <text x="563" y="351.5" textLength="126" lengthAdjust="spacing">摂理路程</text>
    </g>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="142" y="298.5" font-size="27"><tspan textLength="81" lengthAdjust="spacing">ヤコブ</tspan><tspan>、</tspan></text>
    <text x="241" y="298.5" font-size="27" textLength="108" lengthAdjust="spacing">モーセの</text>
  </g>
</svg>
