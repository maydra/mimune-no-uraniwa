<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>メシヤ降臨準備時代とメシヤ再降臨準備時代　外的条件・外的苦難と内的条件・内的受難</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="127" y="43.5" width="277.5" height="53.5" rx="5"/>
    <rect x="413.5" y="43.5" width="277.5" height="53.5" rx="5"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="267" y="70" textLength="259" lengthAdjust="spacingAndGlyphs">メシヤ降臨準備時代</text>
    <text x="553" y="70" textLength="259" lengthAdjust="spacingAndGlyphs">メシヤ再降臨準備時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <rect x="129" y="105.5" width="275.5" height="283.5" rx="6"/>
    <rect x="415" y="105.5" width="275.5" height="283.5" rx="6"/>
  </g>

  <!-- ①② -->
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="148" cy="125" r="10.5"/>
    <circle cx="436.5" cy="124.5" r="10.5"/>
  </g>
  <g font-size="16" text-anchor="middle" dominant-baseline="central">
    <text x="148" y="125.5">1</text>
    <text x="436.5" y="125">2</text>
  </g>

  <!-- 箇条の点と見出し -->
  <g>
    <circle cx="150" cy="160" r="5.5"/>
    <circle cx="150" cy="250" r="5.5"/>
    <circle cx="438" cy="159" r="5.5"/>
    <circle cx="438" cy="290" r="5.5"/>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="162" y="160" textLength="104" lengthAdjust="spacing">外的条件</text>
    <text x="162" y="251.5" textLength="104" lengthAdjust="spacing">外的苦難</text>
    <text x="449" y="159.5" textLength="104" lengthAdjust="spacing">内的条件</text>
    <text x="449" y="290" textLength="104" lengthAdjust="spacing">内的受難</text>
  </g>

  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="185" y="197.5" textLength="118" lengthAdjust="spacing">律法、祭典</text>
    <text x="185" y="289.5" textLength="165" lengthAdjust="spacing">第一イスラエル</text>
    <text x="185" y="323.5" textLength="204" lengthAdjust="spacing">ペルシャ、ギリシャ</text>
    <text x="185" y="358.5" textLength="188" lengthAdjust="spacing">などの異邦に属国</text>
    <text x="472" y="196" textLength="141" lengthAdjust="spacing">イエスのみ言</text>
    <text x="472" y="234.5" textLength="117" lengthAdjust="spacing">祈り、信仰</text>
    <text x="472" y="328.5" textLength="165" lengthAdjust="spacing">第二イスラエル</text>
  </g>
</svg>
