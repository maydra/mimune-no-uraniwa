<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>聖書　神の救いの摂理 秘密［アモス 3:7］　神　摂理に対する原理を知らない →隠れた意味を悟ることができない</title>

  <!-- 聖書（z207 と同じ形を、元の画像の大きさと傾きに合わせて置く。しおりの紐は元に無いので描かない） -->
  <g transform="matrix(0.7771,-0.0008,-0.1030,0.6383,-7.15,5.92)">
    <path d="M285,123 L398,126 Q418,129 420,152 L404,206 L389,241 L378,266 L369,295 L364,310 Q362,314 352,314 L285,311 L240,306 Q230,304 230,293 L232,278 L224,266 Z" fill="#3A3A3A" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M236,275 L350,279 L346,303 L240,299 Q234,298 234,290 Z" fill="#EDEDED"/>
    <g stroke="#111" stroke-width="2">
      <line x1="238" y1="282" x2="348" y2="286"/>
      <line x1="238" y1="288" x2="347" y2="292"/>
      <line x1="238" y1="294" x2="347" y2="298"/>
    </g>
    <polyline points="389,135 295,133 237,262 344,262" fill="none" stroke="#BDBDBD" stroke-width="2.5"/>
    <line x1="393" y1="133" x2="347" y2="267" stroke="#DADADA" stroke-width="5"/>
  </g>
  <text transform="translate(230,114) skewX(-16)" font-size="39" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="84" lengthAdjust="spacingAndGlyphs">聖書</text>

  <!-- …… -->
  <g>
    <rect x="288" y="139" width="5" height="4"/>
    <rect x="299" y="139" width="5" height="4"/>
    <rect x="311.5" y="139" width="5" height="4"/>
    <rect x="323" y="139" width="5" height="4"/>
    <rect x="334" y="139" width="5" height="4"/>
  </g>

  <g font-size="28" dominant-baseline="central">
    <text x="346" y="140.5" textLength="202" lengthAdjust="spacing">神の救いの摂理</text>
    <text x="563" y="140.5" textLength="57" lengthAdjust="spacing">秘密</text>
  </g>
  <text x="350" y="180" font-size="21" font-weight="400" dominant-baseline="central" textLength="129" lengthAdjust="spacing">[アモス 3:7]</text>

  <!-- 神 -->
  <circle cx="163" cy="288" r="23" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="163" y="288" font-size="30" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="194" y="288.5" font-size="31" dominant-baseline="central" textLength="408" lengthAdjust="spacing">摂理に対する原理を知らない</text>

  <!-- 矢印 -->
  <polygon points="387,342 412,342 412,336.5 430,345.5 412,354.5 412,349 387,349" fill="#8C949A"/>
  <g font-size="28" dominant-baseline="central">
    <text x="444" y="344" textLength="232" lengthAdjust="spacing">隠れた意味を悟る</text>
    <text x="446" y="383" textLength="198" lengthAdjust="spacing">ことができない</text>
  </g>
</svg>
