<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イスラエルの意味</title>

  <text x="35" y="36" font-size="30" dominant-baseline="central" textLength="251" lengthAdjust="spacing">イスラエルの意味</text>
  <line x1="34" y1="55" x2="286" y2="55" stroke="currentColor" stroke-width="2.5"/>

  <!-- ヤコブから子孫へ -->
  <polygon points="212,179 217,179 217,282 222,282 214.5,295 207,282 212,282" fill="#8C949A"/>
  <ellipse cx="215" cy="135" rx="56" ry="31" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="214.5" cy="333" rx="56.5" ry="31.5" fill="#FCE5E3" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="29" text-anchor="middle" dominant-baseline="central">
    <text x="216" y="135.5" textLength="88" lengthAdjust="spacing">ヤコブ</text>
    <text x="215" y="333.5" fill="#111" textLength="61" lengthAdjust="spacing">子孫</text>
  </g>

  <g font-size="26" dominant-baseline="central">
    <text y="135.5"><tspan x="283" textLength="121" lengthAdjust="spacing">イスラエル</tspan><tspan x="410">：</tspan><tspan x="431" textLength="118" lengthAdjust="spacing">「勝利した」</tspan><tspan x="561" textLength="120" lengthAdjust="spacing">という意味</tspan></text>
    <text y="333.5"><tspan x="286" textLength="182" lengthAdjust="spacing">イスラエル選民</tspan><tspan x="474">：</tspan><tspan x="495" textLength="156" lengthAdjust="spacing">信仰をもって</tspan></text>
    <text x="495" y="373" textLength="157" lengthAdjust="spacing">勝利した民族</text>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="243" y="216.5" textLength="371" lengthAdjust="spacing">「メシヤのための家庭的基台」</text>
    <text x="241" y="251" textLength="57" lengthAdjust="spacing">造成</text>
  </g>
</svg>
