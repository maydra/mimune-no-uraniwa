<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑤ ルカ 17:21</title>

  <!-- ⑤ ルカ 17:21 -->
  <g font-size="26" dominant-baseline="central">
    <text x="34" y="39">⑤</text>
    <text x="73" y="39" textLength="53" lengthAdjust="spacing">ルカ</text>
    <text x="138" y="39" textLength="67" lengthAdjust="spacing">17:21</text>
  </g>

  <!-- 聖句 -->
  <text x="154" y="132" font-size="25" font-weight="400" dominant-baseline="central" textLength="519" lengthAdjust="spacing">『神の国は、あなたがたのただ中にあるのだ』</text>

  <!-- 地上誕生 -->
  <ellipse cx="228" cy="242.5" rx="87" ry="31.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="228" y="243" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="123" lengthAdjust="spacing">地上誕生</text>

  <g font-size="27" dominant-baseline="central">
    <text x="331" y="223.5" textLength="328" lengthAdjust="spacing">天国は彼らの心のうちに</text>
    <text x="331" y="263" textLength="141" lengthAdjust="spacing">つくられる</text>
  </g>

  <!-- 結論の箱 -->
  <rect x="159" y="335" width="497" height="49" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="407.5" y="359" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="438" lengthAdjust="spacing">イエスは雲に乗ってこられない</text>
</svg>
