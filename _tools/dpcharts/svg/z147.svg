    <ellipse cx="483" cy="387.5" rx="56.5" ry="54" fill="#F98AEE"/>
    <ellipse cx="892.5" cy="387.5" rx="56.5" ry="54" fill="#A0F08A"/>
    <ellipse cx="691" cy="571.5" rx="56.5" ry="54" fill="#DCC4C4"/>
