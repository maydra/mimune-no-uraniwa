<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ノアとハムの心情一体のための摂理</title>

  <!-- 題 -->
  <text x="38" y="37" font-size="30" textLength="500" lengthAdjust="spacing" dominant-baseline="central">ノアとハムの心情一体のための摂理</text>
  <line x1="34" y1="56" x2="539" y2="56" stroke="currentColor" stroke-width="2.5"/>
  <text x="486" y="75.5" font-size="24" text-anchor="middle" dominant-baseline="central">（創 9:20～26）</text>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="246,253 246,185 241,185 249.5,170 258,185 253,185 253,253"/>
    <polygon points="271.5,169 278.5,169 278.5,238 283.5,238 275,253 266.5,238 271.5,238"/>
    <polygon points="336,285 444,285 444,280 460,288.5 444,297 444,292 336,292"/>
  </g>

  <!-- ノア・ハム -->
  <g stroke="currentColor" stroke-width="2.2" fill="#F8F28F">
    <ellipse cx="259.5" cy="134.5" rx="75" ry="29.5"/>
    <ellipse cx="259.5" cy="288.5" rx="75" ry="29.5"/>
  </g>
  <g font-size="32" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="258" y="134">ノア</text>
    <text x="259" y="288">ハム</text>
  </g>
  <text x="362.5" y="134" font-size="32" text-anchor="middle" dominant-baseline="central">裸</text>

  <!-- ヤペテとセム（セムが手前） -->
  <ellipse cx="606.5" cy="256.5" rx="75" ry="29.5" fill="#F86D42" stroke="currentColor" stroke-width="2.2"/>
  <text x="612" y="250" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">ヤペテ</text>
  <ellipse cx="543" cy="288.5" rx="75" ry="29.5" fill="#F86D42" stroke="currentColor" stroke-width="2.2"/>
  <text x="543" y="288" font-size="32" text-anchor="middle" dominant-baseline="central" fill="#111">セム</text>

  <!-- 説明 -->
  <g font-size="22" dominant-baseline="central">
    <text x="117" y="185">恥ずかしく、</text>
    <text x="117" y="211.5">善くないこと</text>
    <text x="117" y="237.5">と考える</text>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="324" y="209">呪う</text>
    <text x="385.5" y="319">扇動</text>
  </g>
  <g font-size="24" dominant-baseline="central">
    <text x="481" y="344.5" textLength="178" lengthAdjust="spacing">恥ずかしく思う</text>
    <text x="482" y="376" textLength="125" lengthAdjust="spacing">着物で覆う</text>
  </g>
</svg>
