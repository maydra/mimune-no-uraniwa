<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ イエスの三大試練を世界的に越える</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="47" y="38" font-size="30" text-anchor="middle">③</text>
    <text x="70" y="38" font-size="28.5" textLength="457" lengthAdjust="spacing">イエスの三大試練を世界的に越える</text>
  </g>
  <line x1="67" y1="56" x2="531" y2="56" stroke="currentColor" stroke-width="2.5"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="209,198 217,198 217,273.5 223,273.5 213,291 203,273.5 209,273.5"/>
    <polygon points="552,197 561,197 561,273.5 566.5,273.5 556.5,290 546.5,273.5 552,273.5"/>
    <polygon points="264,231 496,231 496,226 508,234 496,241 496,237 264,237"/>
  </g>

  <!-- イエスと全人類 -->
  <ellipse cx="214" cy="154" rx="56.5" ry="38.25" fill="#F8F28F" stroke="currentColor" stroke-width="2.8"/>
  <ellipse cx="557" cy="154" rx="63" ry="36.25" fill="#FCE5E3" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="213.5" y="154.5" textLength="91" lengthAdjust="spacing">イエス</text>
    <text x="557" y="154.5" textLength="92" lengthAdjust="spacing">全人類</text>
  </g>

  <g font-size="26" dominant-baseline="central">
    <text x="291" y="179" textLength="180" lengthAdjust="spacing">三次にわたって</text>
    <text x="291" y="210.5" textLength="180" lengthAdjust="spacing">世界的に越える</text>
  </g>

  <!-- 三大試練と三次の世界大戦 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="2.8">
    <rect x="137.5" y="306.5" width="155" height="47"/>
    <rect x="429.5" y="307.5" width="254" height="47"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="214" y="329.5" textLength="124" lengthAdjust="spacing">三大試練</text>
    <text x="555.5" y="331.5" textLength="219" lengthAdjust="spacing">三次の世界大戦</text>
  </g>
</svg>
