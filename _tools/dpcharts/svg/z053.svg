<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>作者の性稟が作品に、神の神性が被造世界に実体展開する</title>

  <!-- 下向きの矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="404.5,257 419.5,257 419.5,397 429.5,397 412,432.5 394.5,397 404.5,397"/>
    <polygon points="913.5,257 928.5,257 928.5,394 938.5,394 921,431 903.5,394 913.5,394"/>
    <!-- 間の太い矢印 -->
    <polygon points="590,322.5 644.5,322.5 644.5,300.5 694,348 644.5,395.5 644.5,373.5 590,373.5"/>
  </g>

  <g stroke="currentColor" stroke-width="3.5">
    <ellipse cx="411.2" cy="178.6" rx="154.4" ry="78.1" fill="#fff" class="paper"/>
    <ellipse cx="920.7" cy="179.4" rx="154.4" ry="78" fill="#fff" class="paper"/>
    <ellipse cx="411.5" cy="515.6" rx="154.3" ry="78" fill="#DCC4C4"/>
    <ellipse cx="924.4" cy="515.8" rx="158.8" ry="78" fill="#DCC4C4"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="410.5" y="178" font-size="54">作者の性稟</text>
    <text x="920" y="179" font-size="56">神の神性</text>
    <g font-size="56" fill="#111">
      <text x="410.5" y="515" textLength="143" lengthAdjust="spacing">作 品</text>
      <text x="924.5" y="515">被造世界</text>
    </g>
  </g>

  <g font-size="52" dominant-baseline="central">
    <text x="211" y="316.5">実体的</text>
    <text x="211" y="371">展開</text>
    <text x="776" y="316.5">実体</text>
    <text x="776" y="371">展開</text>
  </g>
</svg>
