<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>堕落性本性が生じた根本動機</title>

  <text x="52" y="57" font-size="49.5" dominant-baseline="central" textLength="649" lengthAdjust="spacing">堕落性本性が生じた根本動機</text>
  <line x1="52" y1="87.5" x2="701" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <!-- 神とのつながり（円の下に描く） -->
  <g stroke="currentColor" stroke-width="8.5">
    <line x1="336" y1="323.6" x2="641" y2="184.3"/>
    <line x1="641" y1="184.6" x2="964.5" y2="319.2"/>
  </g>
  <!-- 天 → ア（嫉妬心） -->
  <polygon points="408.5,328.5 856.5,328.5 856.5,316.5 886,335 856.5,353.5 856.5,341.5 408.5,341.5"/>

  <g stroke="currentColor" stroke-width="5">
    <ellipse cx="641" cy="186.5" rx="60" ry="59.5" fill="#fff" class="paper"/>
    <ellipse cx="336" cy="329.5" rx="60" ry="59.5" fill="#50403D"/>
    <ellipse cx="964.5" cy="335" rx="59.5" ry="59.5" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="640.5" y="185.5" font-size="64">神</text>
    <text x="335.5" y="329.5" font-size="64" fill="#fff">天</text>
    <text x="965.5" y="336" font-size="66" fill="#111">ア</text>
    <text x="645.5" y="385.5" font-size="49">嫉妬心</text>
  </g>

  <!-- 創造本性 -->
  <g font-size="45.5" dominant-baseline="central">
    <text x="203.5" y="460.5">創造本性</text>
    <text y="532"><tspan x="293.7">知能</tspan><tspan x="407" text-anchor="middle">：</tspan><tspan x="431">比較、</tspan><tspan x="570.2">識別</tspan></text>
    <text y="602"><tspan x="293.7">欲望</tspan><tspan x="407" text-anchor="middle">：</tspan></text>
    <text x="431.5" y="602" textLength="311.6" lengthAdjust="spacingAndGlyphs">より大きな愛を願う</text>
    <text x="814.2" y="602" textLength="277" lengthAdjust="spacingAndGlyphs">嫉妬心生ぜしめる</text>
  </g>
  <polygon points="760.5,596.5 779.5,596.5 779.5,585.5 793.5,603 779.5,620.5 779.5,610.5 760.5,610.5" fill="#8C949A"/>
</svg>
