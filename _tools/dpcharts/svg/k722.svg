<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>② 三大祝福復帰の世界的な蕩減条件</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="48" y="38" font-size="30" text-anchor="middle">②</text>
    <text x="71" y="38" font-size="28.5" textLength="432" lengthAdjust="spacing">三大祝福復帰の世界的な蕩減条件</text>
  </g>
  <line x1="70" y1="56.5" x2="504" y2="56.5" stroke="currentColor" stroke-width="2.8"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="206,183 213,183 213,244 217,244 209.5,256 202,244 206,244"/>
    <polygon points="604.5,183 611.5,183 611.5,244 615.5,244 608,256 600.5,244 604.5,244"/>
    <polygon points="577,199 259,199 259,193.5 241,204 259,214.5 259,209 577,209"/>
    <rect x="363" y="185" width="4" height="38"/>
    <rect x="461" y="185" width="4" height="38"/>
  </g>

  <!-- 神とサタン -->
  <circle cx="209.5" cy="136" r="36" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="208.5" y="136" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>
  <circle cx="608" cy="136" r="36" fill="#50403D" stroke="currentColor" stroke-width="2.8"/>
  <text x="608" y="137" font-size="32" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>

  <!-- 蘇生・長成・完成 -->
  <g font-size="28" dominant-baseline="central">
    <text x="290" y="176.5" textLength="56" lengthAdjust="spacing">完成</text>
    <text x="389" y="176.5" textLength="56" lengthAdjust="spacing">長成</text>
    <text x="488" y="176.5" textLength="56" lengthAdjust="spacing">蘇生</text>
    <text x="288" y="231" textLength="55" lengthAdjust="spacing">三次</text>
    <text x="388" y="231" textLength="55" lengthAdjust="spacing">二次</text>
    <text x="486" y="231" textLength="55" lengthAdjust="spacing">一次</text>
  </g>

  <!-- 三大祝福 -->
  <ellipse cx="209.5" cy="306" rx="72" ry="41.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="209.5" y="305.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="103" lengthAdjust="spacing">三大祝福</text>
  <ellipse cx="607.5" cy="310.75" rx="70.5" ry="48.25" fill="#CF921C" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="606.5" y="299.5" textLength="103" lengthAdjust="spacing">三大祝福</text>
    <text x="608" y="330" textLength="82" lengthAdjust="spacing">完成型</text>
  </g>

  <!-- 蕩減条件と三次の世界大戦 -->
  <text x="349" y="280" font-size="28.5" dominant-baseline="central" textLength="114" lengthAdjust="spacing">蕩減条件</text>
  <line x1="405" y1="303" x2="405" y2="349.5" stroke="currentColor" stroke-width="4" stroke-dasharray="5 5.3"/>
  <rect x="285" y="353" width="240.5" height="45.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="407" y="376.5" font-size="28.5" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="200" lengthAdjust="spacing">三次の世界大戦</text>

  <!-- 原理世界・非原理世界 -->
  <g dominant-baseline="central">
    <g font-size="24">
      <text x="160" y="379.5" text-anchor="end">（</text>
      <text x="161" y="379.5" textLength="92" lengthAdjust="spacing">原理世界</text>
      <text x="254" y="379.5">）</text>
    </g>
    <g font-size="23.5">
      <text x="547" y="380.5" text-anchor="end">（</text>
      <text x="548" y="380.5" textLength="116" lengthAdjust="spacing">非原理世界</text>
      <text x="665" y="380.5">）</text>
    </g>
  </g>
</svg>
