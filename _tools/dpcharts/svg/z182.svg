<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>被造世界における人間の位置　③天宙を総合した実体相</title>
  <defs>
    <marker id="z182-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <text x="76" y="57" font-size="48" text-anchor="middle" dominant-baseline="central">③</text>
  <text x="128" y="57" font-size="48" dominant-baseline="central" textLength="494" lengthAdjust="spacing">天宙を総合した実体相</text>

  <!-- 無形世界と有形世界 -->
  <path d="M384,380.5 A360,262.5 0 0 1 1104,380.5 Z" fill="#F98AEE"/>
  <path d="M384,380.5 A360,262.5 0 0 0 1104,380.5 Z" fill="#A0F08A"/>
  <line x1="384" y1="380.5" x2="1104" y2="380.5" stroke="#111" stroke-width="4"/>
  <ellipse cx="744" cy="380.5" rx="360" ry="262.5" fill="none" stroke="currentColor" stroke-width="4.5"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="762.5" y="180" font-size="45">無形世界</text>
    <text x="763.5" y="587" font-size="48">有形世界</text>
  </g>

  <!-- 授受の矢印 -->
  <g stroke="#111" stroke-width="7" fill="none" marker-end="url(#z182-d)">
    <path d="M748,271 Q719.5,245.5 749,222"/>
    <path d="M776,219 Q804.25,245.2 775.5,262.6"/>
    <path d="M748.5,550 Q726.75,524 750,502"/>
    <path d="M775.5,496 Q799.25,520.2 774,543.6"/>
  </g>

  <!-- 人と霊人体・肉身をつなぐ灰色の線（人より先に描く） -->
  <g stroke="#8C949A" stroke-width="11">
    <line x1="539.4" y1="390" x2="621" y2="346.5"/>
    <line x1="537.3" y1="388" x2="623" y2="428.8"/>
  </g>

  <!-- 人（100×240 の型を置く） -->
  <g transform="translate(434.5,259.2) scale(1.2,1.127)" fill="#FCE6E5" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
    <circle cx="50" cy="22" r="19"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="494" y="332">小</text>
    <text x="494" y="364.5">宇</text>
    <text x="494" y="398.5">宙</text>
  </g>

  <!-- 霊人体と肉身 -->
  <g fill="none" stroke="#111" stroke-width="4">
    <ellipse cx="764" cy="330.5" rx="150" ry="47.5"/>
    <ellipse cx="768" cy="434" rx="146" ry="48"/>
  </g>
  <!-- 霊人体・肉身から性相・形状へ分かれる「＜」（字ではなく線で描く） -->
  <g fill="none" stroke="#111" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="801,313 781,332.5 801,352"/>
    <polyline points="801,418 781,437.5 801,457"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="42">
      <text x="704" y="330">霊人体</text>
      <text x="680.5" y="433">肉</text>
      <text x="740.5" y="432.5">身</text>
    </g>
    <g font-size="31">
      <text x="837.5" y="311">性相</text>
      <text x="838.5" y="349">形状</text>
      <text x="837.5" y="416">性相</text>
      <text x="838.5" y="454">形状</text>
    </g>
  </g>

  <!-- 天宙 -->
  <rect x="990.25" y="304.25" width="67.5" height="153.5" fill="#CDF8F7" stroke="#111" stroke-width="4.5"/>
  <g font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="1023.5" y="350.5">天</text>
    <text x="1024" y="412">宙</text>
  </g>

  <!-- 神から -->
  <circle cx="249" cy="382" r="59" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="246.5" y="381" font-size="60" text-anchor="middle" dominant-baseline="central">神</text>
  <polygon points="311,371 334,371 334,363 375.5,382.5 334,402 334,393.5 311,393.5" fill="#8C949A"/>
</svg>
