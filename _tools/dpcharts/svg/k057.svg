<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>先人たちの道・我々の道・復帰摂理の目的</title>

  <!-- 先人たちの道（下向きの矢印） -->
  <polygon points="218,48 382,48 382,81 415,81 299,133.5 187,81 218,81" fill="#DCC4C4" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="299.5" y="69" textLength="144" lengthAdjust="spacing">先人たちの</text>
    <text x="295" y="105.5">道</text>
  </g>

  <!-- 我々の道から下へ -->
  <polygon points="295.5,220 303.5,220 303.5,309 309.5,309 299.5,324 289.5,309 295.5,309" fill="#8C949A"/>
  <line x1="394" y1="186" x2="442" y2="186" stroke="#8C949A" stroke-width="3"/>

  <ellipse cx="298" cy="187" rx="81.5" ry="42.5" fill="#DCC4C4" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="297" y="170" textLength="93" lengthAdjust="spacing">我々の</text>
    <text x="297" y="204">道</text>
  </g>

  <g font-size="28.5" dominant-baseline="central">
    <text x="460" y="170" textLength="230" lengthAdjust="spacing">復帰原理を詳細に</text>
    <text x="460" y="209" textLength="174" lengthAdjust="spacing">知らなければ</text>
  </g>

  <!-- 復帰摂理の目的 -->
  <rect x="160" y="333" width="280" height="57" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="298.5" y="360" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="239" lengthAdjust="spacing">復帰摂理の目的</text>
</svg>
