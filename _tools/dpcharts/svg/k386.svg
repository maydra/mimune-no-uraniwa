<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>サタンが三大試練をするようになった目的（マタイ4：1～10）</title>

  <!-- 題 -->
  <text x="33" y="37.5" font-size="28" dominant-baseline="central" textLength="539" lengthAdjust="spacing">サタンが三大試練をするようになった目的</text>
  <line x1="32" y1="56.5" x2="571" y2="56.5" stroke="currentColor" stroke-width="2.2"/>
  <text x="584" y="42.5" font-size="20" dominant-baseline="central" textLength="160" lengthAdjust="spacingAndGlyphs">(マタイ 4：1～10)</text>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="260,170 269,187 263,187 263,287 257,287 257,187 251,187"/>
    <polygon points="556,158 563,158 563,265 568.5,265 559.5,279 550.5,265 556,265"/>
    <polygon points="333,317.5 348,310 348,314 498,314 498,321 348,321 348,325"/>
    <polygon points="304.8,288.1 314.2,270.5 317.7,276.1 533.2,144.4 536.8,150.2 321.3,281.9 324.8,287.5"/>
  </g>

  <!-- 創造目的成就 -->
  <rect x="197.5" y="80.5" width="134" height="83" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="264" y="106" textLength="114" lengthAdjust="spacing">創造目的</text>
    <text x="264" y="140" textLength="57" lengthAdjust="spacing">成就</text>
  </g>

  <!-- サ -->
  <circle cx="560" cy="128" r="31.8" fill="#50403D" stroke="currentColor" stroke-width="2.4"/>
  <text x="560.5" y="128" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>

  <!-- 三つの試練 -->
  <text x="411" y="197" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="128" lengthAdjust="spacing" transform="rotate(-30 411 197)">三つの試練</text>

  <!-- イエス・人間堕落 -->
  <g stroke="currentColor" stroke-width="2.4">
    <ellipse cx="260" cy="316.5" rx="65.8" ry="30.3" fill="#F8F28F"/>
    <ellipse cx="559.5" cy="317.5" rx="62.3" ry="31.3" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="259.5" y="316" font-size="28" textLength="91" lengthAdjust="spacing">イエス</text>
    <text x="559.5" y="314.5" font-size="27" textLength="111" lengthAdjust="spacing">人間堕落</text>
  </g>

  <!-- 下の説明 -->
  <g font-size="23" dominant-baseline="central">
    <text x="258" y="368.5" text-anchor="middle" textLength="140" lengthAdjust="spacing">三大祝福復帰</text>
    <text x="511" y="367.5" textLength="95" lengthAdjust="spacing">三大祝福</text>
    <text x="511" y="397.5" textLength="119" lengthAdjust="spacing">成就できず</text>
  </g>
</svg>
