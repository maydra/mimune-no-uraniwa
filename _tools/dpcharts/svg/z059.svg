<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>もっと根本的ないま一つの二性性相　性相と形状</title>

  <g font-size="49" dominant-baseline="central">
    <text x="83" y="62" text-anchor="end">『</text>
    <text x="83" y="62" textLength="797" lengthAdjust="spacing">もっと根本的ないま一つの二性性相</text>
    <text x="880" y="62">』</text>
  </g>

  <!-- 太い線（円・箱の下に描く） -->
  <g stroke="currentColor" stroke-width="9" fill="none">
    <line x1="320" y1="250.5" x2="380" y2="224.1"/>
    <line x1="320" y1="337.5" x2="380" y2="366.3"/>
    <polyline points="800,226.25 843.4,302.3 800,379.25"/>
  </g>

  <ellipse cx="278" cy="291.5" rx="77.5" ry="73" fill="#DCC4C4" stroke="currentColor" stroke-width="3.5"/>
  <text x="277.5" y="290.5" font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111">存在</text>

  <g stroke="currentColor" stroke-width="3.5">
    <rect x="376" y="151" width="184" height="86" rx="14" fill="#F98AEE"/>
    <rect x="638.5" y="151.5" width="184" height="86" rx="14" fill="#F98AEE"/>
    <rect x="375.5" y="350.5" width="184.5" height="86" rx="14" fill="#A0F08A"/>
    <rect x="638.5" y="350.5" width="184" height="86" rx="14" fill="#A0F08A"/>
  </g>
  <g font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="469" y="193">内性</text>
    <text x="729" y="194">性相</text>
    <text x="469" y="392.5">外形</text>
    <text x="730" y="392.5">形状</text>
  </g>

  <!-- ＝ -->
  <g>
    <rect x="575" y="184" width="49" height="7"/>
    <rect x="575" y="197" width="49" height="8"/>
    <rect x="575" y="383" width="49" height="7"/>
    <rect x="575" y="396" width="49" height="8"/>
  </g>

  <!-- 似る -->
  <g fill="#8C949A">
    <polygon points="461.5,247 474.5,247 474.5,305.5 486.5,305.5 468,341.5 449.5,305.5 461.5,305.5"/>
    <polygon points="724.5,247 736.5,247 736.5,305.5 748.5,305.5 730.5,341.5 712.5,305.5 724.5,305.5"/>
  </g>
  <text x="493" y="290.5" font-size="44" dominant-baseline="central">似る</text>

  <text x="870" y="302.5" font-size="56" dominant-baseline="central" textLength="228" lengthAdjust="spacing">二性性相</text>
  <text x="730" y="477" font-size="42" text-anchor="middle" dominant-baseline="central">第二の性相</text>

  <rect x="364" y="553.5" width="574.5" height="70.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <text x="382" y="588" font-size="52" dominant-baseline="central" fill="#111" textLength="535" lengthAdjust="spacing">性相と形状の二性性相</text>
</svg>
