<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の本性相・本形状と本陽性・本陰性の相対的関係</title>

  <!-- 「・」の字幅がフォントで変わっても語の位置が動かないよう、区切って置く -->
  <g font-size="50" dominant-baseline="central">
    <text x="51" y="59.5" textLength="250" lengthAdjust="spacing">神の本性相</text>
    <text x="325.5" y="59.5" text-anchor="middle">・</text>
    <text x="351" y="59.5" textLength="350" lengthAdjust="spacing">本形状と本陽性</text>
    <text x="725.5" y="59.5" text-anchor="middle">・</text>
    <text x="751" y="59.5" textLength="450" lengthAdjust="spacing">本陰性の相対的関係</text>
  </g>
  <line x1="51" y1="89.5" x2="1202" y2="89.5" stroke="currentColor" stroke-width="3.5"/>

  <text x="643" y="172" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 本性相（上）と本形状（下）。境の波線 -->
  <path d="M431.5,420 C523.4,458.7 556.1,458.7 648,420 C741.2,382 774.3,382 867.5,420 A218,208.5 0 0 0 431.5,420 Z" fill="#F98AEE"/>
  <path d="M431.5,420 C523.4,458.7 556.1,458.7 648,420 C741.2,382 774.3,382 867.5,420 A218,208.5 0 0 1 431.5,420 Z" fill="#A0F08A"/>
  <path d="M431.5,420 C523.4,458.7 556.1,458.7 648,420 C741.2,382 774.3,382 867.5,420" fill="none" stroke="#111" stroke-width="3.5"/>
  <ellipse cx="649.5" cy="420" rx="218" ry="208.5" fill="none" stroke="currentColor" stroke-width="3.5"/>

  <g fill="#111" dominant-baseline="central" text-anchor="middle">
    <g font-size="52">
      <text x="556" y="327.5">本性相</text>
      <text x="558" y="510.5">本形状</text>
    </g>
    <g font-size="46">
      <text x="732.5" y="294">本陽性</text>
      <text x="732.5" y="354">本陰性</text>
      <text x="736.5" y="480">本陽性</text>
      <text x="737" y="540">本陰性</text>
    </g>
  </g>
  <g fill="none" stroke="#111" stroke-width="6" stroke-linejoin="round">
    <polyline points="658,296 643.8,327.2 658,358.5"/>
    <polyline points="660,481 645.8,512.2 660,543.5"/>
  </g>
</svg>
