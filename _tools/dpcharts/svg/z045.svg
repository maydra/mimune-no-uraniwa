<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>文鮮明 先生　天倫の秘密を明らかにする</title>

  <rect x="450" y="41" width="396" height="83" fill="#F8F28F" stroke="currentColor" stroke-width="4.5"/>
  <text x="648.5" y="81" font-size="62" textLength="343" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central" fill="#111">文鮮明 先生</text>

  <!-- 左の字（右の写真は描かない） -->
  <circle cx="239" cy="193" r="12.5"/>
  <g font-size="41" dominant-baseline="central">
    <text x="262" y="190" textLength="247" lengthAdjust="spacing">人生・宇宙の</text>
    <text x="387" y="244" textLength="248" lengthAdjust="spacing">根本問題解決</text>
    <g text-anchor="middle">
      <text x="232" y="316.5">①</text>
      <text x="232" y="442.5">②</text>
      <text x="232" y="517">③</text>
    </g>
    <text x="258" y="316.5" textLength="377" lengthAdjust="spacing">霊界・肉界の億万の</text>
    <text x="254" y="370.5" textLength="377" lengthAdjust="spacing">サタンと闘い、勝利</text>
    <text x="256" y="442.5" textLength="461" lengthAdjust="spacing">イエス・聖賢たちと接触</text>
    <text x="256" y="517" textLength="168" lengthAdjust="spacing">神と霊交</text>
  </g>

  <rect x="294" y="576" width="700.5" height="75" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="323" y="613" font-size="54" textLength="653" lengthAdjust="spacing" dominant-baseline="central" fill="#111">天倫の秘密を明らかにする</text>
</svg>
