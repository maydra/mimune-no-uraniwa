<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>本心に従う生活と、パウロの慨嘆（ロマ書7章22節～24節）</title>

  <!-- 番号 -->
  <g font-size="100" dominant-baseline="central">
    <text x="156" y="191.5">1.</text>
    <text x="143" y="731.5">2.</text>
    <text x="143" y="1108.5">3.</text>
  </g>

  <g font-size="94" dominant-baseline="central">
    <!-- 1. -->
    <text x="280" y="192" font-weight="400" textLength="474" lengthAdjust="spacing">とりわけ、</text>
    <text x="803" y="192" font-weight="400" textLength="1943" lengthAdjust="spacing">このような本心の指向する欲望に従って、</text>
    <text x="282" y="356.5" textLength="983" lengthAdjust="spacing">善を行おうと身もだえ</text>
    <text x="1265" y="356.5" textLength="1472" lengthAdjust="spacing">する努力の生活こそ、修道者たち</text>
    <text x="282" y="520.5" textLength="658" lengthAdjust="spacing">の生活である。</text>

    <!-- 2. -->
    <text x="282" y="732.5" font-weight="400" textLength="376" lengthAdjust="spacing">しかし、</text>
    <text x="685" y="732.5" textLength="685" lengthAdjust="spacing">有史以来、その</text>
    <text x="1370" y="732.5" textLength="1371" lengthAdjust="spacing">本心のみに従って生きることの</text>
    <text x="282" y="897.5" textLength="490" lengthAdjust="spacing">できた人間</text>
    <text x="772" y="897.5" textLength="752" lengthAdjust="spacing">は一人もいない。</text>

    <!-- 3. -->
    <text x="282" y="1109" font-weight="400" textLength="1128" lengthAdjust="spacing">ロマ書7章22節～24節</text>
    <text x="1410" y="1109" font-weight="400" textLength="623" lengthAdjust="spacing">にパウロは『</text>
    <text x="2033" y="1109" textLength="710" lengthAdjust="spacing">わたしは、内な</text>
    <text x="282" y="1273.5" textLength="590" lengthAdjust="spacing">る人としては</text>
    <text x="872" y="1273.5" textLength="1083" lengthAdjust="spacing">神の律法を喜んでいるが</text>
    <text x="1955" y="1273.5" textLength="786" lengthAdjust="spacing">、わたしの肢体に</text>
    <text x="282" y="1438" textLength="2455" lengthAdjust="spacing">は別の律法があって、わたしの心の法則に対して戦いを</text>
    <text x="282" y="1603" textLength="1475" lengthAdjust="spacing">いどみ、そして、肢体に存在する</text>
    <text x="1757" y="1603" textLength="690" lengthAdjust="spacing">罪の法則の中に</text>
    <text x="2447" y="1603" textLength="294" lengthAdjust="spacing">、わた</text>
    <text x="282" y="1768.5" textLength="1927" lengthAdjust="spacing">しをとりこにしているのを見る。わたしは、</text>
    <text x="2249" y="1768.5" textLength="492" lengthAdjust="spacing">なんという</text>
    <text x="282" y="1931.5" textLength="1067" lengthAdjust="spacing">みじめな人間なのだろう</text>
    <text x="1349" y="1931.5" font-weight="400" textLength="196" lengthAdjust="spacing">』と</text>
    <text x="1545" y="1931.5" font-weight="400" textLength="857" lengthAdjust="spacing">慨嘆したのである。</text>
  </g>
  <!-- 慨嘆のルビ -->
  <text x="1547" y="1856" font-size="44" font-weight="400" dominant-baseline="central" textLength="198" lengthAdjust="spacing">がいたん</text>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="282" y1="419" x2="1266" y2="419"/>
    <line x1="1370" y1="795.5" x2="2742" y2="795.5"/>
    <line x1="282" y1="960" x2="767" y2="960"/>
    <line x1="282" y1="1173.5" x2="1408" y2="1173.5"/>
    <line x1="872" y1="1336.5" x2="1956" y2="1336.5"/>
    <line x1="1757" y1="1665.5" x2="2448" y2="1665.5"/>
    <line x1="2249" y1="1830.5" x2="2742" y2="1830.5"/>
    <line x1="282" y1="1994.5" x2="1349" y2="1994.5"/>
  </g>
</svg>
