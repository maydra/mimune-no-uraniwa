<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>① 現代（再臨のとき＝終末）　② 新約時代終わるころ（摂理的同時性時代の対照）</title>

  <!-- 上の字 -->
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="149.5" y="60">①</text>
    <text x="149.5" y="113">②</text>
  </g>
  <g font-size="30" dominant-baseline="central">
    <text x="170" y="60" textLength="57" lengthAdjust="spacing">現代</text>
    <text x="258" y="60" textLength="229" lengthAdjust="spacing">再臨のとき＝終末</text>
    <text x="170" y="113" textLength="257" lengthAdjust="spacing">新約時代終わるころ</text>
    <text x="176" y="148" font-size="26" textLength="287" lengthAdjust="spacing">摂理的同時性時代の対照</text>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="251" y="59">（</text>
    <text x="493" y="59">）</text>
    <text x="169.5" y="147" font-size="26">（</text>
    <text x="468.5" y="147" font-size="26">）</text>
  </g>

  <!-- 年表の帯（淡い緑）と線 -->
  <g fill="#B6E6D2">
    <rect x="187" y="234" width="478" height="6"/>
    <rect x="188" y="344" width="477" height="6"/>
  </g>
  <g stroke="currentColor" stroke-width="6">
    <line x1="184" y1="242.5" x2="667" y2="242.5"/>
    <line x1="185" y1="352.5" x2="667" y2="352.5"/>
    <!-- 旧約時代の区切り -->
    <line x1="186.5" y1="208" x2="186.5" y2="260.5"/>
    <line x1="267.5" y1="208" x2="267.5" y2="260.5"/>
    <line x1="348.5" y1="209" x2="348.5" y2="260.5"/>
    <line x1="420.5" y1="223" x2="420.5" y2="260.5"/>
    <line x1="501.5" y1="223" x2="501.5" y2="260.5"/>
    <line x1="583.5" y1="212" x2="583.5" y2="260.5"/>
    <line x1="664.5" y1="212" x2="664.5" y2="260.5"/>
    <!-- 新約時代の区切り -->
    <line x1="187.5" y1="320" x2="187.5" y2="375.5"/>
    <line x1="268.5" y1="320" x2="268.5" y2="375.5"/>
    <line x1="349.5" y1="320" x2="349.5" y2="375.5"/>
    <line x1="421.5" y1="336" x2="421.5" y2="374.5"/>
    <line x1="502.5" y1="336" x2="502.5" y2="374.5"/>
    <line x1="583.5" y1="320" x2="583.5" y2="375.5"/>
    <line x1="664.5" y1="320" x2="664.5" y2="375.5"/>
  </g>

  <!-- 人物の楕円 -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="186.5" cy="208" rx="36.5" ry="17"/>
    <ellipse cx="267.75" cy="208" rx="36.5" ry="17"/>
    <ellipse cx="348" cy="209" rx="34" ry="16"/>
    <ellipse cx="583.5" cy="212" rx="36.5" ry="17"/>
    <ellipse cx="664.25" cy="212.5" rx="36.5" ry="17"/>
    <ellipse cx="187.5" cy="319.5" rx="28.5" ry="18"/>
    <ellipse cx="268" cy="319.5" rx="32" ry="18"/>
    <ellipse cx="349.5" cy="320" rx="32.5" ry="18"/>
    <ellipse cx="584.5" cy="320" rx="28.5" ry="18"/>
    <ellipse cx="664.75" cy="320" rx="37.5" ry="18"/>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="186" y="208.5" textLength="62" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="267" y="208.5" textLength="60" lengthAdjust="spacingAndGlyphs">モーセ</text>
    <text x="347.5" y="209" textLength="59" lengthAdjust="spacingAndGlyphs">サウル</text>
    <text x="583" y="213.5" textLength="62" lengthAdjust="spacingAndGlyphs">マラキ</text>
    <text x="664" y="213" textLength="62" lengthAdjust="spacingAndGlyphs">イエス</text>
    <text x="187.5" y="320.5" textLength="47" lengthAdjust="spacingAndGlyphs">イエス</text>
    <text x="268" y="319.5" textLength="56" lengthAdjust="spacingAndGlyphs">アウグスチヌス</text>
    <text x="349.5" y="320" textLength="55" lengthAdjust="spacingAndGlyphs">チャールズ</text>
    <text x="584.5" y="320" textLength="49" lengthAdjust="spacingAndGlyphs">ルター</text>
    <text x="664.5" y="320" textLength="65" lengthAdjust="spacingAndGlyphs">再臨主</text>
  </g>

  <!-- 年数 -->
  <g font-size="22" text-anchor="middle" dominant-baseline="central">
    <text x="226" y="262.5" textLength="35" lengthAdjust="spacing">400</text>
    <text x="310" y="262.5" textLength="35" lengthAdjust="spacing">400</text>
    <text x="382.5" y="262.5" textLength="34" lengthAdjust="spacing">120</text>
    <text x="460" y="262.5" textLength="35" lengthAdjust="spacing">400</text>
    <text x="542.5" y="262.5" textLength="34" lengthAdjust="spacing">210</text>
    <text x="624" y="262.5" textLength="35" lengthAdjust="spacing">400</text>
    <text x="226" y="373.5" textLength="35" lengthAdjust="spacing">400</text>
    <text x="310" y="373.5" textLength="35" lengthAdjust="spacing">400</text>
    <text x="385.5" y="373.5" textLength="34" lengthAdjust="spacing">120</text>
    <text x="462" y="373.5" textLength="35" lengthAdjust="spacing">400</text>
    <text x="544.5" y="373.5" textLength="34" lengthAdjust="spacing">210</text>
    <text x="627" y="373.5" textLength="35" lengthAdjust="spacing">400</text>
  </g>

  <!-- 左右の札 -->
  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text x="148" y="240.5" textLength="45" lengthAdjust="spacing">旧約</text>
    <text x="148" y="267" textLength="45" lengthAdjust="spacing">時代</text>
    <text x="147.5" y="354" textLength="46" lengthAdjust="spacing">新約</text>
    <text x="148" y="380" textLength="45" lengthAdjust="spacing">時代</text>
    <text x="678.5" y="278" font-size="25" textLength="50" lengthAdjust="spacing">降臨</text>
    <text x="678" y="392" font-size="25" textLength="51" lengthAdjust="spacing">再臨</text>
    <text x="589" y="402.5" font-size="20" textLength="83" lengthAdjust="spacing">(1517 年)</text>
  </g>
</svg>
