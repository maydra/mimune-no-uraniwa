<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>罪の分類</title>

  <text x="53" y="57.5" font-size="49" dominant-baseline="central" textLength="198" lengthAdjust="spacing">罪の分類</text>
  <line x1="52" y1="87.5" x2="251" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <g dominant-baseline="central">
    <g font-size="54" text-anchor="middle">
      <text x="275.5" y="197">①</text>
      <text x="275.5" y="307.5">②</text>
      <text x="275.5" y="417.5">③</text>
      <text x="275.5" y="528">④</text>
    </g>
    <g font-size="53.5">
      <text x="310" y="198">原罪</text>
      <text x="310" y="307.5">遺伝的罪</text>
      <text x="310" y="418">連帯罪</text>
      <text x="310" y="527.5">自犯罪</text>
    </g>
    <g font-size="49.5" font-weight="400">
      <text x="428" y="197">（人間始祖の罪）</text>
      <text x="537" y="307">（祖先の罪）</text>
      <text x="479" y="417" textLength="569" lengthAdjust="spacingAndGlyphs">（イエスを十字架につけた罪）</text>
      <text x="483" y="527.5">（自身が犯した罪）</text>
    </g>
  </g>
</svg>
