<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『エジプト人を打ち殺した理由』</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="146" y="46" text-anchor="end">『</text>
    <text x="146" y="46" textLength="411" lengthAdjust="spacing">エジプト人を打ち殺した理由</text>
    <text x="555" y="46">』</text>
  </g>

  <!-- 箇条 -->
  <g font-size="28" dominant-baseline="central">
    <text x="169.5" y="137" text-anchor="middle">①</text>
    <text x="190" y="137" textLength="401" lengthAdjust="spacing">カインがアベルを殺したことを</text>
    <text x="185" y="177" textLength="520" lengthAdjust="spacing">天の側からサタンの側を打って蕩減復帰</text>
    <text x="169.5" y="250" text-anchor="middle">②</text>
    <text x="189" y="250" textLength="490" lengthAdjust="spacing">モーセがパロの宮中に対する未練を断つ</text>
    <text x="169.5" y="319.5" text-anchor="middle">③</text>
    <text x="185" y="319.5" textLength="317" lengthAdjust="spacing">民族に彼の愛国心を見せ</text>
    <text x="185" y="359" textLength="287" lengthAdjust="spacing">彼を信ずるようにする</text>
  </g>
</svg>
