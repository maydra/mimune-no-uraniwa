<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>み旨を善として予定　堕落は予定ではない（創 6:6、サムエル上 15:11）</title>

  <text x="53" y="55" font-size="50" dominant-baseline="central" textLength="450" lengthAdjust="spacing">み旨を善として予定</text>
  <line x1="52" y1="86" x2="502" y2="86" stroke="currentColor" stroke-width="3.5"/>

  <!-- 神 → み旨（予定） -->
  <polygon points="398,179 771,179 771,169 799.5,184.5 771,200 771,190 398,190" fill="#8C949A"/>
  <text x="581" y="144.5" font-size="45" text-anchor="middle" dominant-baseline="central" textLength="91" lengthAdjust="spacing">予定</text>

  <!-- 神 → 堕落（予定ではない） -->
  <line x1="375" y1="201" x2="621" y2="392.4" stroke="currentColor" stroke-width="12.5"/>
  <polygon points="609.5,406 645.5,410 630.5,378.5"/>
  <g stroke="currentColor" stroke-width="10">
    <line x1="521" y1="275" x2="518.5" y2="354"/>
    <line x1="481.5" y1="326.5" x2="557.5" y2="301.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4">
    <circle cx="340.75" cy="185.75" r="54.5" fill="#fff" class="paper"/>
    <ellipse cx="898.5" cy="184.75" rx="87.5" ry="51.25" fill="#CDF8F7"/>
    <ellipse cx="720.25" cy="446.75" rx="88.25" ry="48.25" fill="#CF921C"/>
  </g>
  <text x="338.5" y="184.5" font-size="60" text-anchor="middle" dominant-baseline="central">神</text>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="898" y="184.5" font-size="52" textLength="104" lengthAdjust="spacing">み旨</text>
    <text x="721.5" y="447" font-size="54" textLength="108" lengthAdjust="spacing">堕落</text>
  </g>
  <text x="1035" y="184" font-size="52" text-anchor="middle" dominant-baseline="central">善</text>

  <g font-size="45" dominant-baseline="central">
    <text x="238" y="286" textLength="183" lengthAdjust="spacing">善の主体</text>
    <text x="582" y="291.5" font-size="46" textLength="278.5" lengthAdjust="spacing">予定ではない</text>
  </g>

  <g font-size="42" dominant-baseline="central">
    <text y="446"><tspan x="828" textLength="83.5" lengthAdjust="spacing">審判</tspan><tspan x="925">・</tspan><tspan x="953" textLength="83.5" lengthAdjust="spacing">滅亡</tspan></text>
    <text y="530.5"><tspan x="616" textLength="168" lengthAdjust="spacing">神の嘆息</tspan> <tspan x="799" textLength="56" lengthAdjust="spacingAndGlyphs">(創</tspan> <tspan x="866" textLength="78" lengthAdjust="spacingAndGlyphs">6:6)</tspan></text>
    <text y="589"><tspan x="616" textLength="84" lengthAdjust="spacing">後悔</tspan> <tspan x="714" textLength="212" lengthAdjust="spacingAndGlyphs">(サムエル上</tspan> <tspan x="938" textLength="112" lengthAdjust="spacingAndGlyphs">15:11)</tspan></text>
  </g>
</svg>
