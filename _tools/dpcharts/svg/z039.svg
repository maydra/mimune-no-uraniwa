<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人類歴史の根本問題を解明</title>

  <circle cx="63" cy="58.5" r="13"/>
  <text x="87" y="59" font-size="49" textLength="599" lengthAdjust="spacing" dominant-baseline="central">人類歴史の根本問題を解明</text>
  <line x1="87" y1="89.5" x2="686" y2="89.5" stroke="currentColor" stroke-width="4"/>

  <!-- 人類罪悪歴史の解明 -->
  <rect x="376" y="158" width="526" height="152" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="49" dominant-baseline="central" fill="#111">
    <text x="413" y="201.5" textLength="447" lengthAdjust="spacing">人類罪悪歴史の解明</text>
    <text x="435" y="268" text-anchor="middle">：</text>
    <text y="268"><tspan x="463">出発、</tspan><tspan x="610">過程、</tspan><tspan x="757">終末</tspan></text>
  </g>

  <!-- － -->
  <g stroke="currentColor" stroke-width="9">
    <line x1="286" y1="397" x2="321" y2="397"/>
    <line x1="285" y1="486" x2="321" y2="486"/>
  </g>
  <g font-size="54" dominant-baseline="central">
    <text x="341" y="398">神</text>
    <text x="422.5" y="398" text-anchor="middle">：</text>
    <text x="449" y="398" textLength="380" lengthAdjust="spacing">復帰摂理の計画</text>
    <text x="339" y="487.5" textLength="543" lengthAdjust="spacing">歴史上のあらゆる史実</text>
    <text x="365" y="558" text-anchor="middle">：</text>
    <text x="392" y="558" textLength="706" lengthAdjust="spacing">救いのための神の心情の反映</text>
  </g>
</svg>
