  <g font-size="38" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="481.5" y="85.5">ヤコブ</text>
    <text x="482.5" y="242.5">モーセ</text>
    <text x="480" y="406.5">イエス</text>
    <text x="482" y="565">再臨主</text>
