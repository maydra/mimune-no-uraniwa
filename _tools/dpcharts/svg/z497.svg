<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 復活摂理はいかになされるか</title>

  <text x="51" y="73" font-size="50">Ⅰ.</text>
  <text x="126" y="73" font-size="49" textLength="650.5" lengthAdjust="spacing">復活摂理はいかになされるか</text>
  <line x1="126" y1="84" x2="776" y2="84" stroke="currentColor" stroke-width="3"/>

  <rect x="232" y="119.5" width="779" height="68.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="622" y="153.5" font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="734" lengthAdjust="spacing">復活摂理 ＝ 復帰摂理 ＝ 再創造摂理</text>

  <!-- 段の線と、堕落人間から創造本然の人間へ上る矢印 -->
  <g stroke="currentColor" stroke-width="3.5">
    <line x1="410" y1="302" x2="584" y2="302"/>
    <line x1="410" y1="389" x2="584" y2="389"/>
    <line x1="410" y1="476" x2="584" y2="476"/>
    <line x1="410" y1="562.5" x2="584" y2="562.5"/>
  </g>
  <rect x="491.5" y="328" width="11" height="236"/>
  <polygon points="497,303 482.5,330 511.5,330"/>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="499.5" cy="252.25" rx="181.5" ry="45.25" fill="#fff" class="paper"/>
    <ellipse cx="497" cy="605.5" rx="167" ry="39" fill="#CF921C"/>
  </g>
  <text x="499.5" y="256" font-size="45" text-anchor="middle" dominant-baseline="central" textLength="300" lengthAdjust="spacingAndGlyphs">創造本然の人間</text>
  <text x="496.5" y="605" font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">堕落人間</text>

  <g font-size="44" text-anchor="middle" dominant-baseline="central">
    <text x="367.5" y="411.5">復</text>
    <text x="367.5" y="459.5">活</text>
  </g>

  <g font-size="41.5" dominant-baseline="central">
    <text y="332.5"><tspan x="633">① </tspan><tspan x="682.75" textLength="207.5" lengthAdjust="spacing">時代的恵沢</tspan></text>
    <text y="398.5"><tspan x="633">② </tspan><tspan x="682.75" textLength="332" lengthAdjust="spacing">み言を信じ、実践</tspan></text>
    <text y="465.5"><tspan x="633">③ </tspan><tspan x="682.75" textLength="290.5" lengthAdjust="spacing">地上の肉身生活</tspan></text>
    <text y="532.5"><tspan x="633">④ </tspan><tspan x="682.75" textLength="249" lengthAdjust="spacing">秩序的三段階</tspan></text>
  </g>
</svg>
