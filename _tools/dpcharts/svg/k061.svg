<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アダムの家庭を中心とする復帰摂理　メシヤのための基台＝実体基台＋信仰基台</title>

  <!-- 題の箱 -->
  <rect x="166.5" y="35.5" width="497" height="43" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="412" y="57" font-size="29" textLength="450" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central">アダムの家庭を中心とする復帰摂理</text>

  <!-- 上へ向かう灰色の矢印 -->
  <polygon points="412.5,83 423,99 416.5,99 416.5,131 408.5,131 408.5,99 402,99" fill="#8C949A"/>

  <!-- メシヤのための基台 -->
  <rect x="247.5" y="136.5" width="333" height="55" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="416" y="163" font-size="31" textLength="279" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central" fill="#111">メシヤのための基台</text>

  <!-- ＝（縦） -->
  <g fill="currentColor">
    <rect x="402" y="204" width="7" height="32"/>
    <rect x="417" y="204" width="7" height="32"/>
  </g>

  <!-- 実体基台 -->
  <rect x="264.5" y="246.5" width="299" height="51" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="341.5" y="271.5">実</text>
    <text x="388.5" y="271.5">体</text>
    <text x="436" y="271.5">基</text>
    <text x="483.5" y="271.5">台</text>
  </g>

  <!-- ＋ -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="396" y1="327.5" x2="430" y2="327.5"/>
    <line x1="413" y1="311" x2="413" y2="345"/>
  </g>

  <!-- 信仰基台 -->
  <rect x="263.5" y="354.5" width="299" height="51" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="341.5" y="379.5">信</text>
    <text x="388.5" y="379.5">仰</text>
    <text x="436" y="379.5">基</text>
    <text x="483.5" y="379.5">台</text>
  </g>
</svg>
