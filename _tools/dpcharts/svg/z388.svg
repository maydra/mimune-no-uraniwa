    <path d="M644,182 Q631,165 642,148"/>
    <path d="M661,146 Q676.75,160.25 663.5,178.5"/>
    <path d="M645.5,326 Q632.5,309 643.5,292"/>
    <path d="M662.5,290 Q678.25,304.25 665,322.5"/>
    <path d="M505.5,525 Q534.15,511 566.2,520.5"/>
    <path d="M574.5,539.5 Q545.7,552.5 514.1,544.5"/>
    <path d="M727.5,525 Q756.15,511 788.2,520.5"/>
    <path d="M796.5,539.5 Q767.7,552.5 736.1,544.5"/>
