<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>新しい真理出現の必要性</title>
  <defs>
    <marker id="z029-g" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <text x="51" y="79" font-size="48" textLength="550" lengthAdjust="spacing">新しい真理出現の必要性</text>
  <line x1="51" y1="90.5" x2="601" y2="90.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 人から内的無知・外的無知へ（人と箱の下に描く） -->
  <g stroke="currentColor" stroke-width="14">
    <line x1="305" y1="303.6" x2="370" y2="243.1"/>
    <line x1="290" y1="392.5" x2="372" y2="468.4"/>
  </g>

  <!-- 人（z015・z017 と同じ大きさと位置） -->
  <g transform="translate(212.5,219) scale(1.27)" fill="#FCE6E5" stroke="#111" stroke-width="3.1" stroke-linejoin="round">
    <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
    <circle cx="50" cy="22" r="19"/>
  </g>

  <!-- 無知から知へ、内的知・外的知から新しい真理へ（箱の下に描く） -->
  <g fill="#8C949A">
    <polygon points="467,184.3 669,184.3 669,176 697,190.5 669,205 669,196.8 467,196.8"/>
    <polygon points="467,518.8 669,518.8 669,510.5 697,525 669,539.5 669,531.3 467,531.3"/>
    <rect x="765.5" y="247" width="16" height="216"/>
    <polygon points="872,348 898,348 898,336 915,355 898,374 898,362 872,362"/>
  </g>

  <g stroke="currentColor" stroke-width="4">
    <rect x="339.5" y="126" width="127.5" height="121" rx="21" fill="#F98AEE"/>
    <rect x="710" y="126" width="127.5" height="121" rx="21" fill="#F98AEE"/>
    <rect x="339.5" y="463" width="127.5" height="121" rx="21" fill="#A0F08A"/>
    <rect x="710" y="463" width="127.5" height="121" rx="21" fill="#A0F08A"/>
    <rect x="624" y="323" width="248" height="69" rx="13" fill="#CDF8F7"/>
  </g>
  <g font-size="44.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="403" y="161.5">内的</text>
    <text x="403" y="211">無知</text>
    <text x="403" y="499">外的</text>
    <text x="403" y="548">無知</text>
    <text x="774.5" y="161">内的</text>
    <text x="773.5" y="211">知</text>
    <text x="774" y="498">外的</text>
    <text x="773.5" y="547">知</text>
    <text x="748.5" y="357" font-size="45" textLength="233" lengthAdjust="spacing">新しい真理</text>
  </g>

  <!-- 本心の善の目的成就 -->
  <rect x="917" y="275" width="189" height="175" rx="9" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g font-size="42" dominant-baseline="central">
    <text x="925" y="313">本心の</text>
    <text x="925" y="362.5">善の目的</text>
    <text x="925" y="412.5">成就</text>
  </g>

  <!-- 宗教・科学と、その間を回る矢印 -->
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="565" cy="274" rx="78.5" ry="29.5" fill="#fff" class="paper"/>
    <ellipse cx="565" cy="443" rx="78.5" ry="29.5" fill="#fff" class="paper"/>
  </g>
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="565.5" y="274">宗教</text>
    <text x="565" y="444">科学</text>
  </g>
  <g fill="none" stroke="#8C949A" stroke-width="8.5" marker-end="url(#z029-g)">
    <path d="M549,400 Q535.5,352 544,331.3"/>
    <path d="M580,317 Q593.1,363.5 585.8,387.1"/>
  </g>
</svg>
