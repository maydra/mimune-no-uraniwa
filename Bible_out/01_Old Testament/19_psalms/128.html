<h1>詩篇 第128章</h1>
<div class="the-post-cont">

<p><sup>1</sup>すべて主をおそれ、主の道に歩む者はさいわいである。</p>
<p><sup>2</sup>あなたは自分の手の勤労の実を食べ、幸福で、かつ安らかであろう。</p>
<p><sup>3</sup>あなたの妻は家の奥にいて多くの実を結ぶぶどうの木のようであり、あなたの子供たちは食卓を囲んでオリブの若木のようである。</p>
<p><sup>4</sup>見よ、主をおそれる人は、このように祝福を得る。</p>
<p><sup>5</sup>主はシオンからあなたを祝福されるように。あなたは世にあるかぎりエルサレムの繁栄を見、</p>
<p><sup>6</sup>またあなたの子らの子を見るであろう。どうぞ、イスラエルの上に平安があるように。</p>
