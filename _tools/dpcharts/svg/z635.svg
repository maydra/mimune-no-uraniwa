<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>生命の木と善悪を知る木：イエスは真の父、聖霊は真の母</title>

  <!-- 神から（灰色の矢印は楕円の下に描く） -->
  <text x="655" y="50.9" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>
  <g fill="#8C949A">
    <polygon points="583.6,156.5 541.2,208.5 535.2,203.6 528.8,232.5 555.8,220.4 549.8,215.5 592.2,163.5"/>
    <polygon points="697,163.5 740.1,215.3 734,220.3 762,233 754.6,203.2 748.5,208.2 705.4,156.5"/>
  </g>

  <!-- 神（桃と緑が入れ違う楕円） -->
  <ellipse cx="651.2" cy="137" rx="100.1" ry="45.1" fill="#A0F08A"/>
  <path d="M645,92 C643.3,93 638.4,96.2 635,98 C631.6,99.8 627.2,101.2 624.5,103 C621.8,104.8 620.2,107 619,109 C617.8,111 616.8,113 617,115 C617.2,117 618.2,119 620,121 C621.8,123 624.7,125 628,127 C631.3,129 635.2,131 640,133 C644.8,135 651.7,137 656.5,139 C661.3,141 665.8,143 669,145 C672.2,147 674.1,149 675.5,151 C676.9,153 677.4,155 677.5,157 C677.6,159 677.2,161 676,163 C674.8,165 673.2,167 670.5,169 C667.8,171 663.8,172.8 660,175 C656.2,177.2 650,180.9 648,182.1 A100.1,45.1 0 0 1 551.1,137 A100.1,45.1 0 0 1 645,92 Z" fill="#F98AEE"/>
  <path d="M645,92 C643.3,93 638.4,96.2 635,98 C631.6,99.8 627.2,101.2 624.5,103 C621.8,104.8 620.2,107 619,109 C617.8,111 616.8,113 617,115 C617.2,117 618.2,119 620,121 C621.8,123 624.7,125 628,127 C631.3,129 635.2,131 640,133 C644.8,135 651.7,137 656.5,139 C661.3,141 665.8,143 669,145 C672.2,147 674.1,149 675.5,151 C676.9,153 677.4,155 677.5,157 C677.6,159 677.2,161 676,163 C674.8,165 673.2,167 670.5,169 C667.8,171 663.8,172.8 660,175 C656.2,177.2 650,180.9 648,182.1" fill="none" stroke="#111" stroke-width="4.5"/>
  <ellipse cx="651.2" cy="137" rx="100.1" ry="45.1" fill="none" stroke="currentColor" stroke-width="4.5"/>

  <!-- 生命の木・善悪を知る木から下への点線（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="5" stroke-dasharray="17 7">
    <line x1="491" y1="429" x2="491" y2="494"/>
    <line x1="815" y1="429" x2="815" y2="494"/>
  </g>

  <!-- アダム・エバ・イエス・聖霊 -->
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="489.64" cy="274.89" rx="94.19" ry="41.06" fill="#F98AEE"/>
    <ellipse cx="814.21" cy="274.86" rx="91.89" ry="41.12" fill="#A0F08A"/>
    <ellipse cx="489.68" cy="539.43" rx="94.05" ry="44.51" fill="#F98AEE"/>
    <ellipse cx="816.37" cy="539.43" rx="89.71" ry="44.52" fill="#A0F08A"/>
  </g>
  <g font-size="45" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="490.6" y="277.8" textLength="145" lengthAdjust="spacing">アダム</text>
    <text x="815.5" y="277" textLength="89" lengthAdjust="spacing">エバ</text>
    <text x="490.7" y="540.3" textLength="135" lengthAdjust="spacing">イエス</text>
    <text x="817.1" y="539.4" font-size="43" textLength="90" lengthAdjust="spacing">聖霊</text>
  </g>

  <!-- アダムとエバの授受の矢印 -->
  <g fill="none" stroke="currentColor" stroke-width="9.5">
    <path d="M604.5,262 C606.4,260.8 612.1,256.8 616,254.5 C619.9,252.2 624,250 628,248.5 C632,247 636.2,246.2 640,245.5 C643.8,244.8 647,244.5 650.5,244.5 C654,244.5 657.2,244.8 661,245.5 C664.8,246.2 669.8,247.8 673,249 C676.2,250.2 679.2,251.9 680.5,252.5"/>
    <path d="M696,286 C694.7,286.8 690.8,288.8 688,290.5 C685.2,292.2 682,294.5 679,296 C676,297.5 673.5,298.5 670,299.5 C666.5,300.5 662,301.7 658,302 C654,302.3 650,302.1 646,301.5 C642,300.9 637.6,299.9 634,298.5 C630.4,297.1 626.1,294.1 624.5,293.2"/>
  </g>
  <polygon points="685,240.5 704,262 676,264.5"/>
  <polygon points="629.5,281 603,284.5 619.5,305.5"/>

  <!-- 真の父・真の母（細字）、後のアダム・後のエバ -->
  <g font-size="40" font-weight="400" dominant-baseline="central">
    <text x="253" y="274.9" textLength="124" lengthAdjust="spacing">真の父</text>
    <text x="926" y="274.9" textLength="124" lengthAdjust="spacing">真の母</text>
  </g>
  <g dominant-baseline="central">
    <text x="199.5" y="539.4" font-size="40" textLength="185" lengthAdjust="spacing">後のアダム</text>
    <text x="922.5" y="540.3" font-size="41" textLength="166" lengthAdjust="spacing">後のエバ</text>
  </g>

  <!-- ＝（縦）と木 -->
  <rect x="483" y="331" width="6.5" height="39"/>
  <rect x="495.5" y="331" width="6.5" height="39"/>
  <rect x="806.5" y="331" width="6.5" height="39"/>
  <rect x="819" y="331" width="6.5" height="39"/>
  <g font-size="41" dominant-baseline="central">
    <text x="408.8" y="400.5" textLength="166" lengthAdjust="spacing">生命の木</text>
    <text x="692" y="398.6" textLength="249" lengthAdjust="spacing">善悪を知る木</text>
  </g>

  <!-- 真の父・真の母の札 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="370" y="594.5" width="240" height="65.5" fill="#F98AEE"/>
    <rect x="700.5" y="594.5" width="230.5" height="65.5" fill="#A0F08A"/>
  </g>
  <g font-size="49" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="490.6" y="627.3" textLength="148" lengthAdjust="spacing">真の父</text>
    <text x="817.1" y="627.3" textLength="148" lengthAdjust="spacing">真の母</text>
  </g>
</svg>
