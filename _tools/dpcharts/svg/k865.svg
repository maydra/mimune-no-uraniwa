<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>4. この国には預言者の証拠がなければならない　① 韓国民族のメシヤ思想</title>

  <!-- 題 -->
  <text x="33" y="38" font-size="29" dominant-baseline="central">4.</text>
  <text x="71" y="38" font-size="29" dominant-baseline="central" textLength="530" lengthAdjust="spacingAndGlyphs">この国には預言者の証拠がなければならない</text>
  <line x1="67" y1="56.5" x2="602" y2="56.5" stroke="currentColor" stroke-width="2"/>

  <text x="73" y="83" font-size="28" dominant-baseline="central">①</text>
  <text x="112" y="83" font-size="28" dominant-baseline="central" textLength="286" lengthAdjust="spacing">韓国民族のメシヤ思想</text>
  <line x1="111" y1="100.5" x2="399" y2="100.5" stroke="currentColor" stroke-width="2"/>

  <!-- 鄭鑑録 -->
  <g font-size="28" dominant-baseline="central">
    <text x="183" y="151" textLength="84" lengthAdjust="spacing">鄭鑑録</text>
    <text x="282" y="151" text-anchor="middle">：</text>
    <text x="298" y="151" textLength="84" lengthAdjust="spacing">義の王</text>
    <text x="393" y="151">（</text>
    <text x="406" y="151" textLength="85" lengthAdjust="spacing">正道令</text>
    <text x="506" y="151" text-anchor="middle">：</text>
    <text x="522" y="151" textLength="142" lengthAdjust="spacing">再臨イエス</text>
    <text x="677" y="151" text-anchor="end">）</text>

    <text x="196" y="190.5" textLength="55" lengthAdjust="spacing">信仰</text>
    <text x="296" y="190.5" textLength="171" lengthAdjust="spacing">千年王国建設</text>
    <text x="295" y="227" textLength="286" lengthAdjust="spacing">世界万邦の朝貢受ける</text>
  </g>

  <!-- 薄い灰色の矢印 -->
  <polygon points="210,217 233.5,217 233.5,296 245.5,296 222,320 198.5,296 210,296" fill="#C4CCD3"/>

  <!-- 韓国民族の再臨メシヤ思想 -->
  <text x="176" y="348" font-size="28" dominant-baseline="central" textLength="345" lengthAdjust="spacing">韓国民族の再臨メシヤ思想</text>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="178" y="382">（</text>
    <text x="190" y="382" textLength="207" lengthAdjust="spacing">メシヤの韓国再臨</text>
    <text x="408" y="382" text-anchor="end">）</text>
  </g>
</svg>
