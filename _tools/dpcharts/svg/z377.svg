<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>② 国家興亡史</title>

  <g font-size="48" dominant-baseline="central">
    <text x="77.5" y="63.5" text-anchor="middle">②</text>
    <text x="109.1" y="63.5" textLength="247.9" lengthAdjust="spacing">国家興亡史</text>
  </g>

  <rect x="244.5" y="133.5" width="360" height="77.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="290.2" y="172.5" font-size="54" textLength="270" lengthAdjust="spacing" dominant-baseline="central" fill="#111">歴史の目的</text>

  <!-- サタン分立 ⇒ 善主権復帰 -->
  <g font-size="48" dominant-baseline="central">
    <text x="198.9" y="271" textLength="248" lengthAdjust="spacing">サタン分立</text>
    <text x="595.8" y="272" textLength="247.5" lengthAdjust="spacing">善主権復帰</text>
  </g>
  <polygon points="487.5,265 531,265 531,251 553,272 531,293 531,279 487.5,279" fill="#8C949A"/>

  <!-- 聖賢と復帰摂理 -->
  <circle cx="263" cy="346" r="11.5"/>
  <circle cx="263" cy="423.5" r="11"/>
  <g stroke="currentColor" stroke-width="8.5">
    <line x1="498" y1="352" x2="551" y2="352"/>
    <line x1="500" y1="423" x2="553" y2="423"/>
  </g>
  <g font-size="48" dominant-baseline="central">
    <text y="351.5"><tspan x="309.9">聖</tspan><tspan x="390.6">賢</tspan></text>
    <text x="571.9" y="351.5">善、<tspan x="671.7" textLength="295.2" lengthAdjust="spacing">宗教を起こす</tspan></text>
    <text x="284.4" y="423.5" textLength="197.7" lengthAdjust="spacing">復帰摂理</text>
    <text x="572.2" y="423" textLength="395.9" lengthAdjust="spacing">闘争と戦争の過程</text>
  </g>

  <polygon points="595.5,466.5 626.5,466.5 626.5,484.5 640.5,484.5 611,500 581.5,484.5 595.5,484.5" fill="#8C949A"/>

  <rect x="253" y="521" width="740" height="128" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="45" dominant-baseline="central" fill="#111">
    <text x="279.3" y="559" textLength="319.7" lengthAdjust="spacing">国家の興亡盛衰</text>
    <text x="623" y="559" text-anchor="middle">：</text>
    <text x="280.9" y="613" textLength="684.2" lengthAdjust="spacing">善主権を復帰するための摂理路程</text>
  </g>
</svg>
