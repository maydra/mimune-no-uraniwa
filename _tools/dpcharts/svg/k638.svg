<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>再降臨準備時代：400年（1517～1918）</title>

  <!-- 題 -->
  <g dominant-baseline="central" font-size="31">
    <text x="129" y="38" textLength="221" lengthAdjust="spacing">再降臨準備時代</text>
    <text x="366" y="38" text-anchor="middle">：</text>
    <text x="449.5" y="38" text-anchor="middle">年</text>
    <text x="566" y="38" text-anchor="middle">～</text>
  </g>
  <g font-size="37">
    <text x="382" y="51" textLength="47" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="477" y="50" textLength="67" lengthAdjust="spacingAndGlyphs">(1517</text>
    <text x="590" y="50" textLength="66" lengthAdjust="spacingAndGlyphs">1918)</text>
  </g>

  <!-- 時期の帯 -->
  <rect x="253.5" y="105.5" width="422.5" height="247" fill="#CDF8F7"/>

  <!-- 縦の線と区切りの線 -->
  <line x1="249.5" y1="99.5" x2="249.5" y2="358.5" stroke="currentColor" stroke-width="8"/>
  <g stroke-width="6">
    <g stroke="currentColor">
      <line x1="220" y1="102.5" x2="281" y2="102.5"/>
      <line x1="220" y1="355.5" x2="281" y2="355.5"/>
      <line x1="220" y1="186.5" x2="253.5" y2="186.5"/>
      <line x1="220" y1="273.5" x2="253.5" y2="273.5"/>
      <g stroke-dasharray="11.6 5.63">
        <line x1="286" y1="102.5" x2="677" y2="102.5"/>
        <line x1="286" y1="355.5" x2="677" y2="355.5"/>
      </g>
    </g>
    <g stroke="#111">
      <line x1="253.5" y1="186.5" x2="281" y2="186.5"/>
      <line x1="253.5" y1="273.5" x2="281" y2="273.5"/>
      <g stroke-dasharray="11.6 5.63">
        <line x1="286" y1="186.5" x2="677" y2="186.5"/>
        <line x1="286" y1="273.5" x2="677" y2="273.5"/>
      </g>
    </g>
  </g>

  <!-- 年 -->
  <g font-size="28" font-style="italic">
    <text x="154" y="114" textLength="58" lengthAdjust="spacingAndGlyphs">1517</text>
    <text x="154" y="199" textLength="57" lengthAdjust="spacingAndGlyphs">1648</text>
    <text x="154" y="287" textLength="57" lengthAdjust="spacingAndGlyphs">1789</text>
    <text x="154" y="370" textLength="57" lengthAdjust="spacingAndGlyphs">1918</text>
  </g>

  <!-- 時期 -->
  <g dominant-baseline="central" fill="#111">
    <text x="272" y="144.5" font-size="31" textLength="157" lengthAdjust="spacing">宗教改革期</text>
    <text x="272" y="230" font-size="31" textLength="346" lengthAdjust="spacing">宗教および思想の闘争期</text>
    <text x="271" y="315" font-size="29.5" textLength="386" lengthAdjust="spacing">政治経済および思想の成熟期</text>
  </g>

  <!-- 第一次世界大戦終了 -->
  <g dominant-baseline="central" font-size="26.4" font-weight="400">
    <text x="339.5" y="383.5" text-anchor="middle">（</text>
    <text x="345" y="383.5" textLength="237.6" lengthAdjust="spacing">第一次世界大戦終了</text>
    <text x="586" y="383.5" text-anchor="middle">）</text>
  </g>
</svg>
