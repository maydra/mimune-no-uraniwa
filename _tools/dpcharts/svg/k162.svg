<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>鳩を裂かなかったことが、どうして罪になったのか？</title>

  <text x="34" y="36" font-size="29" dominant-baseline="central" textLength="574" lengthAdjust="spacing">鳩を裂かなかったことが、どうして罪になったのか？</text>
  <line x1="34" y1="54.5" x2="612" y2="54.5" stroke="currentColor" stroke-width="3"/>

  <!-- 裂く -->
  <ellipse cx="170" cy="237.3" rx="46" ry="29.3" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="168" y="237" font-size="32" text-anchor="middle" dominant-baseline="central">裂く</text>

  <!-- 灰色の括弧 -->
  <g stroke="#8C949A" stroke-width="5" fill="none">
    <path d="M247,128.5 H228.5 V344.5 H247"/>
    <path d="M228.5,200.5 H247 M228.5,274.5 H247"/>
  </g>

  <g font-size="25.5" dominant-baseline="central">
    <text x="255" y="129" textLength="149" lengthAdjust="spacing">アダムの家庭</text>
    <text x="255" y="201" textLength="149" lengthAdjust="spacing">ノアの家庭</text>
    <text x="255" y="273.5" textLength="149" lengthAdjust="spacing">サタン世界</text>
    <text x="255" y="346" textLength="149" lengthAdjust="spacing">サタンの血縁</text>
  </g>
  <g font-size="25.5" text-anchor="middle" dominant-baseline="central">
    <text x="416.5" y="129">：</text>
    <text x="416.5" y="201">：</text>
    <text x="416.5" y="273.5">：</text>
    <text x="416.5" y="346">：</text>
  </g>
  <g font-size="25.5" dominant-baseline="central">
    <text x="430" y="129" textLength="248" lengthAdjust="spacing">アベルとカインに分立</text>
    <text x="429" y="201" textLength="49" lengthAdjust="spacing">洪水</text>
    <text x="484" y="201" textLength="26" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="518" y="201" textLength="148" lengthAdjust="spacing">日で善悪分立</text>
    <text x="429" y="273.5" textLength="199" lengthAdjust="spacing">善主権世界に分立</text>
    <text x="429" y="346" textLength="249" lengthAdjust="spacing">死亡の血を流し、聖別</text>
  </g>
</svg>
