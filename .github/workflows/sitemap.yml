# push のたびにサイトマップを作り直し、変わっていたら commit する。
# ページを足した人は何もしなくていい（_tools/root/build_sitemap.py を参照）。
# この commit は GITHUB_TOKEN で push するので、ここから次のワークフローは起きない。
# 中身が変わったページは、最終更新日（lastmod）を新しくし、IndexNow で Bing などに知らせ、
# Search Console にサイトマップを送り直す。
name: sitemap

on:
  push:
    branches: [main]
    paths: ['**.html', '_tools/root/build_sitemap.py', '_tools/root/indexnow.py', '.github/workflows/sitemap.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python _tools/root/build_sitemap.py --stamp --changed "$RUNNER_TEMP/changed.txt"
      - name: commit if changed
        run: |
          git add -A -- sitemap-index.xml sitemap-index.txt sitemap.xml '*/sitemap.xml' _tools/root/sitemap-lastmod.json
          if git diff --cached --quiet; then
            echo 'sitemap unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'sitemap: regenerate after page changes'
          git pull --rebase origin main
          git push origin HEAD:main
      # 送れなくてもサイトマップの commit は済んでいるので、ここで失敗しても全体は止めない
      - name: tell Bing and others (IndexNow)
        continue-on-error: true
        run: python _tools/root/indexnow.py "$RUNNER_TEMP/changed.txt"
      # Google には、変わったページがあったときだけサイトマップを送り直す（secret の GSC_KEY が要る）。
      # 上で push したサイトマップが GitHub Pages に出るのを待ってから送る
      - name: tell Google (Search Console)
        continue-on-error: true
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
        run: |
          if [ -z "$GSC_KEY" ] || [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            echo 'skip'
            exit 0
          fi
          sleep 120
          pip install -q google-auth requests
          python _tools/root/search_console.py submit
