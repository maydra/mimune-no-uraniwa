<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>南北王朝分立時代と東西王朝分立時代　統一王国から南朝ユダと北朝イスラエル、キリスト王国から東フランクと西フランク</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="130" y="34" width="276" height="54" rx="5"/>
    <rect x="415" y="34" width="276" height="54" rx="5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="267.5" y="61" font-size="31" textLength="249" lengthAdjust="spacing">南北王朝分立時代</text>
    <text x="553.5" y="61.5" font-size="29" textLength="229" lengthAdjust="spacing">東西王朝分立時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="130" y="96" width="276" height="302.5" rx="6"/>
    <rect x="415" y="96" width="276" height="302.5" rx="6"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="152" cy="120.5" r="10.3"/>
    <circle cx="439" cy="120" r="10.3"/>
  </g>
  <g font-size="17" text-anchor="middle" dominant-baseline="central">
    <text x="152" y="121">1</text>
    <text x="439" y="120.5">2</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="240.2,190.3 208.3,244.4 203.8,241.8 203.5,259 218.4,250.4 213.9,247.7 245.8,193.7"/>
    <polygon points="284.7,193.7 317.5,247.8 313,250.6 328,259 327.5,241.8 323,244.5 290.3,190.3"/>
    <polygon points="527,190.3 494.6,243 490.1,240.3 489.5,257.5 504.6,249.2 500.1,246.4 532.6,193.7"/>
    <polygon points="574.5,193.7 606.9,246.4 602.4,249.2 617.5,257.5 616.9,240.3 612.4,243 580.1,190.3"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="268.5" cy="172.5" rx="65" ry="27" fill="#C4CCD3"/><!-- 元どおり薄い灰 -->
    <ellipse cx="552.5" cy="172.5" rx="65" ry="27" fill="#C4CCD3"/>
    <ellipse cx="190.5" cy="298" rx="52.5" ry="33.5" fill="#F8F28F"/>
    <ellipse cx="481.5" cy="298" rx="52.5" ry="33.5" fill="#F8F28F"/>
    <ellipse cx="340.5" cy="298" rx="52.5" ry="33.5" fill="#F86D42"/>
    <ellipse cx="627.5" cy="298" rx="52.5" ry="33.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="269" y="174" font-size="26" textLength="103" lengthAdjust="spacing">統一王国</text>
    <text x="551" y="163.5" font-size="22" textLength="90" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="551.5" y="184.5" font-size="22" textLength="44" lengthAdjust="spacing">王国</text>
  </g>
  <g font-size="23" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="190.5" y="286">南朝</text>
    <text x="190" y="310" textLength="45" lengthAdjust="spacingAndGlyphs">ユダ</text>
    <text x="340.5" y="286">北朝</text>
    <text x="340" y="309.5" font-size="21" textLength="82" lengthAdjust="spacingAndGlyphs">イスラエル</text>
    <text x="482.5" y="298" font-size="22" textLength="95" lengthAdjust="spacingAndGlyphs">東フランク</text>
    <text x="629" y="298" font-size="22" textLength="92" lengthAdjust="spacingAndGlyphs">西フランク</text>
  </g>

  <!-- アベルとカイン -->
  <g font-size="24" dominant-baseline="central">
    <text x="150" y="354.5" textLength="75" lengthAdjust="spacingAndGlyphs">アベル</text>
    <text x="304" y="354.5" textLength="74" lengthAdjust="spacingAndGlyphs">カイン</text>
    <text x="442" y="354.5" textLength="76" lengthAdjust="spacingAndGlyphs">アベル</text>
    <text x="591" y="354" textLength="74" lengthAdjust="spacingAndGlyphs">カイン</text>
  </g>
</svg>
