<h1>詩篇 第150章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>主をほめたたえよ。その聖所で神をほめたたえよ。その力のあらわれる大空で主をほめたたえよ。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>その大能のはたらきのゆえに主をほめたたえよ。そのすぐれて大いなることのゆえに主をほめたたえよ。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>ラッパの声をもって主をほめたたえよ。立琴と琴とをもって主をほめたたえよ。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>鼓と踊りとをもって主をほめたたえよ。緒琴と笛とをもって主をほめたたえよ。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>音の高いシンバルをもって主をほめたたえよ。鳴りひびくシンバルをもって主をほめたたえよ。</p>
<p id="v6"><sup><a href="#v6" class="verse-link">6</a></sup>息のあるすべてのものに主をほめたたえさせよ。主をほめたたえよ。</p>
