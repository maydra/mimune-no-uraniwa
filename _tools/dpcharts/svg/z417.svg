<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. イエスの十字架の死　①信徒たちの言行から見て</title>

  <text x="57.5" y="58.5" font-size="46" dominant-baseline="central">Ⅲ.</text>
  <text y="58.5" font-size="48" dominant-baseline="central"><tspan x="140" textLength="148" lengthAdjust="spacing">イエス</tspan><tspan x="292" textLength="297" lengthAdjust="spacing">の十字架の死</tspan></text>
  <line x1="140" y1="89" x2="589" y2="89" stroke="currentColor" stroke-width="3"/>

  <g font-size="45" dominant-baseline="central">
    <text y="211"><tspan x="55">①</tspan><tspan x="112" textLength="501" lengthAdjust="spacing">信徒たちの言行から見て</tspan></text>
    <text y="378"><tspan x="283" textLength="135" lengthAdjust="spacing">イエス</tspan><tspan x="420" textLength="318" lengthAdjust="spacing">の死を悲憤慷慨</tspan></text>
    <text y="535"><tspan x="283" textLength="408" lengthAdjust="spacing">ユダヤ人たちの無知</tspan><tspan x="716" text-anchor="middle">・</tspan><tspan x="740" textLength="228" lengthAdjust="spacing">不信に憤慨</tspan></text>
  </g>
  <circle cx="254" cy="378" r="10.5"/>
  <circle cx="254" cy="535" r="10.5"/>
</svg>
