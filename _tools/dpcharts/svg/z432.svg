<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. 十字架の贖罪による救いの限界とイエス再臨の目的</title>

  <text x="56" y="57" font-size="48" dominant-baseline="central">Ⅳ.</text>
  <text x="128.24" y="56.5" font-size="48.5" textLength="1116" lengthAdjust="spacing" dominant-baseline="central">十字架の贖罪による救いの限界とイエス再臨の目的</text>
  <line x1="128" y1="86.5" x2="1245" y2="86.5" stroke="currentColor" stroke-width="4"/>

  <!-- イエスから二つの摂理へ（楕円と箱より先に描き、楕円と箱で隠す） -->
  <g stroke="currentColor" stroke-width="12.6">
    <line x1="320" y1="337" x2="390" y2="284.5"/>
    <line x1="320" y1="383.5" x2="390" y2="428.3"/>
  </g>

  <ellipse cx="281.5" cy="358.25" rx="52" ry="136.75" fill="#F8F28F" stroke="currentColor" stroke-width="4"/>
  <g font-size="55" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="280.5" y="298.5">イ</text>
    <text x="281" y="356.5">エ</text>
    <text x="281.5" y="416">ス</text>
  </g>

  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4">
    <rect x="376.5" y="221.5" width="434" height="110" rx="8"/>
    <rect x="376.5" y="377" width="434" height="110" rx="8"/>
  </g>
  <g font-size="54" dominant-baseline="central">
    <text x="402.9" y="276" textLength="379.4" lengthAdjust="spacing">霊的救いの摂理</text>
    <text x="402.9" y="431.5" textLength="379.4" lengthAdjust="spacing">肉的救いの摂理</text>
  </g>

  <polygon points="844.5,348.5 904.5,348.5 904.5,336.5 941.5,357 904.5,377.5 904.5,365.5 844.5,365.5" fill="#8C949A"/>

  <rect x="971.5" y="207.5" width="91" height="306" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="57" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="1017.5" y="271.5">地</text>
    <text x="1018" y="330">上</text>
    <text x="1018" y="390">天</text>
    <text x="1017.5" y="447.5">国</text>
  </g>
