<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>②宗教と科学の動向</title>

  <g font-size="48" dominant-baseline="central">
    <text x="54.5" y="58.5" font-size="50">②</text>
    <text x="114.5" y="58.5" textLength="397" lengthAdjust="spacing">宗教と科学の動向</text>
  </g>

  <!-- 宗教・科学から「一つのところで相会う」へ（尾は楕円で隠す） -->
  <g fill="#8C949A">
    <polygon points="453.2,229.6 661.9,290.9 658.7,301.7 690,292.7 668.6,268.2 665.4,278.9 456.8,217.6"/>
    <polygon points="456.7,394.4 665.3,333.7 668.5,344.5 690,320 658.7,310.9 661.8,321.7 453.3,382.4"/>
  </g>
  <g stroke="currentColor" stroke-width="5">
    <ellipse cx="364.5" cy="207" rx="99" ry="56.5" fill="#F98AEE"/>
    <ellipse cx="364.5" cy="405" rx="99" ry="56.5" fill="#A0F08A"/>
    <ellipse cx="878" cy="307" rx="178" ry="75.5" fill="#CDF8F7"/>
  </g>
  <g font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text y="206"><tspan x="326.5">宗</tspan><tspan x="403">教</tspan></text>
    <text y="404.5"><tspan x="327">科</tspan><tspan x="402.5">学</tspan></text>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="871" y="285.5" font-size="41" textLength="290" lengthAdjust="spacing">一つのところで</text>
    <text x="870.5" y="340" font-size="45" textLength="140" lengthAdjust="spacing">相会う</text>
  </g>

  <!-- 人類歴史 ➡ 創造本然の世界 -->
  <rect x="301.25" y="530.25" width="691.5" height="78.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <polygon points="549,561 574.5,561 574.5,552 591,570.75 574.5,589.5 574.5,580.5 549,580.5" fill="#8C949A"/>
  <g font-size="48" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="424.5" y="569.5" textLength="200" lengthAdjust="spacing">人類歴史</text>
    <text x="788.5" y="570.5" textLength="350" lengthAdjust="spacing">創造本然の世界</text>
  </g>
</svg>
