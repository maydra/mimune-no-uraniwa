<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>新しい真理と神の啓示</title>

  <text x="51" y="58.5" font-size="49" textLength="499" lengthAdjust="spacing" dominant-baseline="central">新しい真理と神の啓示</text>
  <line x1="51" y1="89" x2="550" y2="89" stroke="currentColor" stroke-width="3"/>

  <circle cx="305.5" cy="216.5" r="16"/>
  <g stroke="#8C949A" stroke-width="8">
    <line x1="289" y1="310.5" x2="324" y2="310.5"/>
    <line x1="289" y1="398.5" x2="324" y2="398.5"/>
  </g>
  <g font-size="54" dominant-baseline="central">
    <text x="351" y="216" textLength="324" lengthAdjust="spacing">最終的な真理</text>
    <text x="352" y="308.5">教典、</text>
    <text x="515" y="308.5" textLength="379" lengthAdjust="spacing">文献の研究結果</text>
    <text x="353" y="403" textLength="380" lengthAdjust="spacing">人間の頭脳から</text>
  </g>
  <!-- × -->
  <g stroke="currentColor" stroke-width="10">
    <line x1="921" y1="286" x2="966" y2="331"/>
    <line x1="966" y1="286" x2="921" y2="331"/>
    <line x1="756.5" y1="381.5" x2="799.5" y2="424.5"/>
    <line x1="799.5" y1="381.5" x2="756.5" y2="424.5"/>
  </g>

  <!-- ⇨ 神の啓示 -->
  <polygon points="287.5,532.5 313.5,532.5 313.5,520.5 330.5,545.5 313.5,570.5 313.5,558.5 287.5,558.5" fill="#8C949A" stroke="currentColor" stroke-width="1.5"/>
  <text x="348" y="543.5" font-size="60" textLength="251" lengthAdjust="spacing" dominant-baseline="central">神の啓示</text>
  <text x="619" y="544" font-size="54" textLength="250" lengthAdjust="spacing" dominant-baseline="central">(黙 10:11)</text>
</svg>
