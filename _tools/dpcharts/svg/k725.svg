<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>④ 主権復帰のための世界的な蕩減条件</title>

  <!-- 題 -->
  <g dominant-baseline="central" font-size="29">
    <text x="46.5" y="37" text-anchor="middle">④</text>
    <text x="69" y="37" textLength="463" lengthAdjust="spacing">主権復帰のための世界的な蕩減条件</text>
  </g>
  <line x1="68" y1="54.6" x2="531" y2="54.6" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印（楕円の下に描く） -->
  <line x1="285" y1="168.6" x2="422" y2="233.8" stroke="#8C949A" stroke-width="8"/>
  <g fill="#8C949A">
    <polygon points="460.7,248 512.9,272.7 515.4,267.3 526.5,283.6 506.9,285.4 509.4,279.9 457.3,255.2"/>
    <polygon points="282.4,276.5 509.8,175.3 507.4,169.8 527,172 515.5,188.1 513.1,182.6 285.6,283.9"/>
    <polygon points="230,186 230,251 235.5,251 226.5,265 217.5,251 223,251 223,186"/>
    <polygon points="601.5,198 601.5,247 606,247 598,260 590,247 594.5,247 594.5,198"/>
  </g>

  <!-- 蕩減復帰の点線 -->
  <line x1="417" y1="271" x2="417" y2="361" stroke="currentColor" stroke-width="4.5" stroke-dasharray="6 6"/>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="226" cy="151" rx="52" ry="33" fill="#F86D42"/>
    <ellipse cx="225" cy="302.5" rx="51" ry="32.5" fill="#F8F28F"/>
    <ellipse cx="599" cy="154.5" rx="67" ry="42.2" fill="#F8F28F"/>
    <ellipse cx="600" cy="306.5" rx="70" ry="42.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="226" y="151" font-size="27" textLength="84" lengthAdjust="spacing">カイン</text>
    <text x="226" y="302.5" font-size="27" textLength="86" lengthAdjust="spacing">アベル</text>
    <g font-size="25">
      <text x="599.5" y="139" textLength="99" lengthAdjust="spacing">アベル型</text>
      <text x="599.5" y="168.5" textLength="100" lengthAdjust="spacing">天の世界</text>
      <text x="599.5" y="291" textLength="99" lengthAdjust="spacing">カイン型</text>
      <text x="599.5" y="320" textLength="119" lengthAdjust="spacing">サタン世界</text>
    </g>
  </g>

  <!-- 地の上の字 -->
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="601" y="88" textLength="105" lengthAdjust="spacing">主権復帰</text>
    <text x="190" y="225" textLength="52" lengthAdjust="spacing">殺す</text>
    <text x="638.5" y="229.5" textLength="52" lengthAdjust="spacing">打つ</text>
    <text x="222" y="357" textLength="105" lengthAdjust="spacing">主権喪失</text>
  </g>
  <text x="421.4" y="249.1" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="106" lengthAdjust="spacing" transform="rotate(-24.5 421.4 249.1)">蕩減復帰</text>

  <!-- 三次の世界大戦 -->
  <rect x="302.5" y="362" width="230" height="45.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="416.5" y="384.5" font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="203" lengthAdjust="spacing">三次の世界大戦</text>
</svg>
