    <text x="232" y="205.5" font-size="28" textLength="56" lengthAdjust="spacing">万物</text>
    <text x="231" y="280.5" font-size="23" textLength="70" lengthAdjust="spacing">指導者</text>
    <text x="231" y="309" font-size="23" textLength="46" lengthAdjust="spacing">親友</text>
    <text x="231.5" y="374.5" font-size="28" textLength="83" lengthAdjust="spacing">イエス</text>
    <text x="585.5" y="130.5" font-size="30">体</text>
    <g font-size="30">
      <text x="586" y="204" textLength="60" lengthAdjust="spacing">人間</text>
      <text x="585" y="291.5" textLength="60" lengthAdjust="spacing">人間</text>
      <text x="585.5" y="375.5" textLength="60" lengthAdjust="spacing">人間</text>
    </g>
