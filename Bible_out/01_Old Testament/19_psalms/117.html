<h1>詩篇 第117章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>もろもろの国よ、主をほめたたえよ。もろもろの民よ、主をたたえまつれ。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>われらに賜わるそのいつくしみは大きいからである。主のまことはとこしえに絶えることがない。主をほめたたえよ。</p>
