<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神主管圏とサタン主管圏　生きている者（ヨハネ 11:25）・死んだ者（黙 3:1）</title>

  <!-- 神主管圏・サタン主管圏 -->
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="404.5" cy="148" rx="115" ry="105.5" fill="#fff" class="paper"/>
    <ellipse cx="898.5" cy="148" rx="114.5" ry="105.5" fill="#50403D"/>
  </g>
  <g font-size="54" text-anchor="middle" dominant-baseline="central">
    <text x="404" y="108">神</text>
    <text x="404" y="175" textLength="165" lengthAdjust="spacing">主管圏</text>
  </g>
  <g font-size="50" text-anchor="middle" dominant-baseline="central" fill="#fff">
    <text x="897.5" y="116.5" textLength="154" lengthAdjust="spacing">サタン</text>
    <text x="898" y="178.5" textLength="151" lengthAdjust="spacing">主管圏</text>
  </g>

  <!-- 行き来の矢印 -->
  <g fill="#8C949A">
    <polygon points="517.0,238.8 595.4,320.0 590.0,325.2 614.6,333.4 607.2,308.5 601.9,313.7 523.4,232.6"/>
    <polygon points="593.4,344.8 515.3,264.3 520.7,259.1 496.1,250.9 503.5,275.8 508.9,270.5 587.0,351.0"/>
    <polygon points="709.5,333.5 786.6,254.0 792.0,259.3 799.4,234.4 774.8,242.6 780.2,247.8 703.1,327.3"/>
    <polygon points="816.8,252.9 739.5,332.0 734.1,326.8 726.6,351.6 751.3,343.5 745.9,338.3 823.2,259.1"/>
  </g>

  <!-- 人（100×240 の型を置く） -->
  <g transform="translate(579.5,332.9) scale(1.6,1.353)" fill="#FCE6E5" stroke="#111" stroke-width="2.8" stroke-linejoin="round">
    <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
    <circle cx="50" cy="22" r="19"/>
  </g>

  <!-- 生きている者・死んだ者 -->
  <g font-size="46" dominant-baseline="central">
    <text x="236" y="337" textLength="275" lengthAdjust="spacing">生きている者</text>
    <text x="813" y="337" textLength="184" lengthAdjust="spacing">死んだ者</text>
  </g>
  <g font-size="38" dominant-baseline="central">
    <text y="397.5"><tspan x="251" textLength="127" lengthAdjust="spacingAndGlyphs">(ヨハネ</tspan> <tspan x="389" textLength="106" lengthAdjust="spacingAndGlyphs">11:25)</tspan></text>
    <text y="393.5"><tspan x="818" textLength="59" lengthAdjust="spacingAndGlyphs">(黙</tspan> <tspan x="886" textLength="79" lengthAdjust="spacingAndGlyphs">3:1)</tspan></text>
  </g>
</svg>
