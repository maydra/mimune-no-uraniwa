<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>統一王国時代とキリスト王国時代　預言者・国王・祭司長（神の命令・統治・神殿を信奉）と修道院・国王・法王（ローマ教区長）</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="131" y="69" width="276" height="54" rx="6"/>
    <rect x="417" y="69" width="276" height="54" rx="6"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="166" y="95.5" font-size="34" textLength="206.1" lengthAdjust="spacing">統一王国時代</text>
    <text x="432" y="95.5" font-size="34" textLength="119.1" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="554" y="95.5" font-size="34" textLength="124.1" lengthAdjust="spacingAndGlyphs">王国時代</text>
  </g>
  <!-- 白い枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="131" y="131" width="276" height="231.5" rx="8"/>
    <rect x="417" y="131" width="276" height="231.5" rx="8"/>
  </g>
  <!-- 三角形の線（楕円の下に描く） -->
  <g fill="none" stroke="#8C949A" stroke-width="6" stroke-linejoin="round">
    <polygon points="191.25,282.5 267,224 342.5,282.5"/>
    <polygon points="478,282.5 554,224 629,282.5"/>
  </g>
  <g>
    <ellipse cx="267" cy="224" rx="51" ry="21" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="191.2" cy="282.5" rx="50.8" ry="20" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="342.5" cy="282.5" rx="50.5" ry="20" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="554" cy="224" rx="51" ry="21" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="478" cy="282.5" rx="51" ry="20" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="629" cy="282.5" rx="51" ry="20" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="231.6" y="224.5" font-size="24" textLength="70.9" lengthAdjust="spacing">預言者</text>
    <text x="175" y="282.5" font-size="24" text-anchor="middle">国</text>
    <text x="208" y="282.5" font-size="24" text-anchor="middle">王</text>
    <text x="306.6" y="282.5" font-size="24" textLength="70.9" lengthAdjust="spacing">祭司長</text>
    <text x="517.6" y="224.5" font-size="24" textLength="71.9" lengthAdjust="spacing">修道院</text>
    <text x="461.5" y="282.5" font-size="24" text-anchor="middle">国</text>
    <text x="495" y="282.5" font-size="24" text-anchor="middle">王</text>
    <text x="612.5" y="282.5" font-size="24" text-anchor="middle">法</text>
    <text x="646" y="282.5" font-size="24" text-anchor="middle">王</text>
  </g>
  <g dominant-baseline="central">
    <text x="152" y="147.5" font-size="22" text-anchor="middle">①</text>
    <text x="219.6" y="179.5" font-size="24" textLength="94.9" lengthAdjust="spacing">神の命令</text>
    <text x="167.6" y="323.5" font-size="24" textLength="46.9" lengthAdjust="spacing">統治</text>
    <text x="279.6" y="323.5" font-size="24" textLength="118.9" lengthAdjust="spacing">神殿を信奉</text>
    <text x="438" y="147.5" font-size="22" text-anchor="middle">②</text>
    <text x="540.5" y="323.5" font-size="24" text-anchor="middle">（</text>
    <text x="545.6" y="323.5" font-size="24" textLength="125.9" lengthAdjust="spacingAndGlyphs">ローマ教区長</text>
    <text x="675" y="323.5" font-size="24" text-anchor="middle">）</text>
  </g>
</svg>
