<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>①サタン分立路程　②メシヤを迎え、重生　③メシヤに従って更に成長　④創造目的を完成</title>
  <defs>
    <marker id="k006-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 横の線 -->
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="127.5" y1="151" x2="352" y2="151"/>
    <line x1="127.5" y1="210" x2="356" y2="210"/>
    <line x1="356" y1="210" x2="382" y2="210" stroke-dasharray="4 2.5"/>
    <line x1="127.5" y1="267.5" x2="352" y2="267.5"/>
    <line x1="127.5" y1="325.5" x2="352" y2="325.5"/>
  </g>

  <!-- 人間・堕落人間からの矢印 -->
  <g stroke="currentColor" stroke-width="3.2" fill="none" marker-end="url(#k006-a)">
    <line x1="160" y1="329" x2="160" y2="216"/>
    <line x1="160" y1="208" x2="160" y2="157" stroke-width="2.6" stroke-dasharray="5 1.5"/>
    <line x1="169" y1="215" x2="241" y2="352"/>
    <line x1="267.5" y1="360" x2="310" y2="225"/>
  </g>

  <!-- 神と授受の矢印 -->
  <g stroke="currentColor" stroke-width="2.6" fill="none" marker-end="url(#k006-a)">
    <path d="M141,98 Q126,88 142,79"/>
    <path d="M177,76 Q194,85 182,96"/>
    <path d="M293,98 Q278,88 294,79"/>
    <path d="M329,76 Q346,85 334,96"/>
  </g>
  <g stroke="currentColor" stroke-width="2.2" fill="#fff" class="paper">
    <circle cx="160" cy="49" r="25.5"/>
    <circle cx="311.5" cy="49" r="25.5"/>
    <ellipse cx="160" cy="126" rx="33" ry="22"/>
    <ellipse cx="312" cy="125" rx="33" ry="22"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="160" y="50" font-size="27">神</text>
    <text x="311.5" y="50" font-size="27">神</text>
    <text x="144" y="126" font-size="22">ア</text>
    <text x="177" y="126" font-size="22">エ</text>
    <text x="312" y="125" font-size="22">完成</text>
  </g>
  <circle cx="160.5" cy="126" r="2.3"/>

  <!-- 完成への白抜きの矢印 -->
  <polygon points="311.5,153 327,175 319,175 319,208 304,208 304,175 296,175" fill="#fff" class="paper" stroke="currentColor" stroke-width="3" stroke-linejoin="miter"/>
  <circle cx="311.5" cy="210" r="7.5"/>

  <!-- 人間・堕落人間 -->
  <ellipse cx="160" cy="351.5" rx="37.5" ry="22.5" fill="#FCE5E3" stroke="currentColor" stroke-width="2.2"/>
  <ellipse cx="258" cy="385" rx="57" ry="24.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="157" y="351" font-size="25">人間</text>
    <text x="256" y="386" font-size="23">堕落人間</text>
  </g>

  <!-- 右の括弧 -->
  <g stroke="currentColor" stroke-width="2.6" fill="none">
    <path d="M354,51 Q361,51 361,58 L361,87 Q361,93.5 368,93.5 Q361,93.5 361,100 L361,130 Q361,137 354,137"/>
    <path d="M354,154.5 Q361,154.5 361,161 L361,173 Q361,179.5 368,179.5 Q361,179.5 361,186 L361,197.5 Q361,204 354,204"/>
    <path d="M354,218 Q361,218 361,226 L361,303 Q361,311.5 369,311.5 Q361,311.5 361,320 L361,396 Q361,404 354,404"/>
  </g>

  <!-- 右の字 -->
  <g font-size="26" dominant-baseline="central">
    <text x="379" y="94">④</text>
    <text x="411" y="94" textLength="184" lengthAdjust="spacing">創造目的を完成</text>
    <text x="379" y="174">③</text>
    <text x="411" y="174" textLength="288" lengthAdjust="spacing">メシヤに従って更に成長</text>
    <text x="379" y="213.5">②</text>
    <text x="411" y="213.5" textLength="234" lengthAdjust="spacing">メシヤを迎え、重生</text>
    <text x="379" y="310">①</text>
    <text x="411" y="310" textLength="183" lengthAdjust="spacing">サタン分立路程</text>
  </g>
  <text x="407" y="251" font-size="21" font-weight="400" dominant-baseline="central" textLength="294" lengthAdjust="spacing">（原罪取り除く、堕落前の立場）</text>
</svg>
