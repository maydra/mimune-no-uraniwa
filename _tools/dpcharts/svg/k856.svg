<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>1905年乙巳（保護）条約から1945年解放まで</title>

  <!-- 箱 -->
  <g stroke="currentColor" stroke-width="2.5" fill="#CDF8F7">
    <rect x="163" y="60" width="426" height="57"/>
    <rect x="199.5" y="314" width="238" height="57"/>
  </g>
  <g font-size="35" dominant-baseline="central" fill="#111">
    <text x="187" y="87.5" textLength="71" lengthAdjust="spacingAndGlyphs">1905</text>
    <text x="264" y="87.5" textLength="112" lengthAdjust="spacing">年乙巳</text>
    <text x="396" y="87.5" text-anchor="end">（</text>
    <text x="395" y="87.5" textLength="74" lengthAdjust="spacing">保護</text>
    <text x="469" y="87.5">）</text>
    <text x="492" y="87.5" textLength="73" lengthAdjust="spacing">条約</text>
    <text x="226" y="343" textLength="71" lengthAdjust="spacingAndGlyphs">1945</text>
    <text x="302" y="343" textLength="111" lengthAdjust="spacing">年解放</text>
  </g>

  <!-- 下向きの灰色の矢印 -->
  <polygon points="277,160.5 304,160.5 304,236 317.5,236 290.5,274.5 263.5,236 277,236" fill="#8C949A" stroke="currentColor" stroke-width="1.2" stroke-linejoin="miter"/>

  <g font-size="29" dominant-baseline="central">
    <text x="358" y="193.5" textLength="31" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="393" y="193.5" textLength="127" lengthAdjust="spacing">年間迫害</text>
    <text x="360" y="236" textLength="121" lengthAdjust="spacing">キリスト</text>
    <text x="484" y="236" textLength="158" lengthAdjust="spacing">教信徒中心</text>
  </g>
</svg>
