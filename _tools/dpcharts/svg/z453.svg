<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ユダヤ人：メシヤを願い、エリヤ再臨を渇望</title>

  <!-- 矢印（楕円の下に描く）。渇望の矢印は元のとおり黒 -->
  <g fill="#8C949A">
    <polygon points="775.5,193.5 498.5,193.5 498.5,183.5 472,200 498.5,216.5 498.5,206.5 775.5,206.5"/>
    <polygon points="556.1,495.9 432.9,290.5 441.4,285.4 408.5,265.5 410.6,303.9 419.1,298.8 542.3,504.1"/>
  </g>
  <polygon points="705.1,504.4 832.4,296.8 842.2,302.9 845,260 808.1,281.9 817.9,288 690.7,495.6"/>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="329" cy="200" rx="122" ry="66" fill="#F8F28F"/>
    <ellipse cx="942" cy="200" rx="146" ry="66" fill="#F86D42"/>
    <ellipse cx="631.5" cy="534.5" rx="141" ry="60" fill="#FCE5E3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="329.5" y="200" font-size="51" textLength="154" lengthAdjust="spacing">メシヤ</text>
    <text x="943" y="200" font-size="47" textLength="235" lengthAdjust="spacing">エリヤ再臨</text>
    <text x="632" y="534" font-size="48" textLength="194" lengthAdjust="spacing">ユダヤ人</text>
  </g>

  <g dominant-baseline="central">
    <text x="353" y="388" font-size="47" textLength="97" lengthAdjust="spacing">願い</text>
    <text x="800" y="389.5" font-size="47" textLength="96" lengthAdjust="spacing">渇望</text>
    <text x="786" y="446" font-size="37" textLength="205" lengthAdjust="spacingAndGlyphs">(マラキ 4:5)</text>
  </g>
</svg>
