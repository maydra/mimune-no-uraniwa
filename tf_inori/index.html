<head><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta property="og:image" content="https://maydra.github.io/mimune-no-uraniwa/og-image.png">
    <link rel="icon" href="/mimune-no-uraniwa/favicon.png" type="image/png">










<meta charset="utf-8">
<title>父の祈り　目次</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700;900&family=Crimson+Pro:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif JP', 'Crimson Pro', serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
            font-size: 1.25rem;
            line-height: 1.9;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        }

        h1 a {
            text-decoration: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1.75rem;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            letter-spacing: 0.05em;
        }

        h2::before {
            content: '◆';
            color: #667eea;
            font-size: 0.8em;
        }

        p {
            margin: 1em 0;
            line-height: 1.9;
        }

        a {
            color: #667eea;
            text-decoration: none;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        a:hover {
            color: #f093fb;
            border-bottom-color: #f093fb;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin: 2em 0;
        }

        ul, ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        li {
            margin: 0.5em 0;
            line-height: 1.9;
        }

        b, strong {
            font-weight: 700;
            color: #fff;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            margin: 2rem 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .content-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .content-card:hover::before {
            transform: scaleX(1);
        }

        .links-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-left: 0;
        }

        .links-list li {
            position: relative;
            padding-left: 1.6rem;
        }

        .links-list li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #667eea;
            transition: transform 0.3s ease;
        }

        .links-list li:hover::before {
            transform: translateX(3px);
        }

        .links-list a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1.25rem;
            line-height: 1.9;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
            border-bottom: none;
        }

        .links-list a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .links-list a:hover {
            color: #fff;
            transform: translateX(3px);
        }

        .links-list a:hover::after {
            width: 100%;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.75rem;
                font-size: 1.1rem;
            }

            .content-card {
                padding: 2rem;
            }

            h1 {
                font-size: clamp(2rem, 6vw, 3.5rem);
            }

            h2 {
                font-size: 1.8rem;
            }

            .links-list a {
                font-size: 1.15rem;
            }
        }

        @media (max-width: 480px) {
            body {
                font-size: 1rem;
            }

            h2 {
                font-size: 1.6rem;
            }

            .links-list a {
                font-size: 1.05rem;
            }
        }

        /* 聖書の節リンク用スタイル（既存のものを保持） */
        a.verse-link {
            color: #e74c3c;
            text-decoration: none;
            font-weight: bold;
            border-bottom: none;
        }

        a.verse-link:hover {
            text-decoration: underline;
            color: #c0392b;
            border-bottom-color: transparent;
        }

        [id^="v"]:target {
            background-color: #fff3cd;
            padding: 0.1em 0.2em;
            border-radius: 3px;
            scroll-margin-top: 1em;
        }
    </style>
    
    <link rel="stylesheet" href="../theme/style.css">
</head>
