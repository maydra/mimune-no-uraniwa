<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 復帰摂理延長時代における歴史発展　1. 復帰摂理と西洋史</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="37" y="38.5" font-size="31">Ⅱ.</text>
    <text x="79.5" y="38.5" font-size="31" textLength="504" lengthAdjust="spacing">復帰摂理延長時代における歴史発展</text>
    <text x="46" y="87.5" font-size="29">1.</text>
    <text x="77" y="87.5" font-size="29" textLength="231" lengthAdjust="spacing">復帰摂理と西洋史</text>
  </g>
  <g stroke="currentColor">
    <line x1="79" y1="57.5" x2="584" y2="57.5" stroke-width="3"/>
    <line x1="77" y1="105" x2="309" y2="105" stroke-width="2.2"/>
  </g>

  <!-- イエス -->
  <ellipse cx="197" cy="233.5" rx="56.7" ry="28.2" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="197" y="233.5" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="92" lengthAdjust="spacing" fill="#111">イエス</text>
  <polygon points="263,230.5 320,230.5 320,226.5 336,233.5 320,240.5 320,236.5 263,236.5" fill="#8C949A"/>

  <!-- 世界・ローマ・エルサレム -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="509" cy="234" rx="169.5" ry="64.5" fill="#FCE5E3"/>
    <!-- 内側の楕円の縁は面の上なので #111 -->
    <ellipse cx="464" cy="234" rx="124" ry="45.5" fill="#CF921C" stroke="#111"/>
    <ellipse cx="401" cy="234" rx="60.5" ry="26.3" fill="#F8F28F" stroke="#111"/>
  </g>
  <g fill="#8C949A">
    <polygon points="444,231.5 474,231.5 474,228.5 484,233.5 474,238.5 474,235.5 444,235.5"/>
    <polygon points="560,231.5 587,231.5 587,226.5 600,233.5 587,240.5 587,235.5 560,235.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="393.5" y="233.5" font-size="24" textLength="90" lengthAdjust="spacingAndGlyphs">エルサレム</text>
    <text x="524" y="233.5" font-size="24" textLength="61" lengthAdjust="spacingAndGlyphs">ローマ</text>
    <text x="637" y="233.5" font-size="29" textLength="57" lengthAdjust="spacing">世界</text>
  </g>

  <text x="341" y="331.5" font-size="26" dominant-baseline="central" textLength="337" lengthAdjust="spacing">エルサレムを中心とする王国</text>
</svg>
