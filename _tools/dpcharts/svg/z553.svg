<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>陶器を造る者と土くれ（ロマ 9:21）、ヤコブとエサウ（ロマ 9:11～）</title>

  <!-- ● -->
  <g>
    <circle cx="231.5" cy="84.5" r="12"/>
    <circle cx="231.5" cy="339.5" r="12"/>
  </g>

  <!-- ロマ 9:21 -->
  <text y="84" font-size="46" dominant-baseline="central"><tspan x="258" textLength="88" lengthAdjust="spacing">ロマ</tspan> <tspan x="357" font-size="45" textLength="23" lengthAdjust="spacingAndGlyphs">9</tspan><tspan x="384.5" font-size="45">:</tspan><tspan x="404" font-size="45" textLength="43" lengthAdjust="spacingAndGlyphs">21</tspan></text>

  <!-- 陶器を造る者 → 土くれ → 尊い器・卑しい器 -->
  <g fill="#8C949A">
    <polygon points="469,190 511.5,190 511.5,182.5 534,193.5 511.5,204.5 511.5,197 469,197"/>
    <polygon points="742.3,168.3 755.5,147.5 731.0,149.4"/>
    <polygon points="730.9,236.7 755.5,238.0 741.8,217.6"/>
  </g>
  <path d="M738.4,157.8 L678,194 L738.1,228.1" fill="none" stroke="#8C949A" stroke-width="8"/>
  <ellipse cx="334.5" cy="193.5" rx="122" ry="51.5" fill="#FCE5E3" stroke="currentColor" stroke-width="4"/>
  <text x="228.5" y="191.5" font-size="37" dominant-baseline="central" textLength="211" lengthAdjust="spacingAndGlyphs" fill="#111">陶器を造る者</text>
  <g font-size="50" dominant-baseline="central">
    <text x="541" y="192" font-size="42" textLength="126" lengthAdjust="spacing">土くれ</text>
    <text x="773.5" y="144.5" textLength="149" lengthAdjust="spacing">尊い器</text>
    <text x="773.5" y="240.5" textLength="199.5" lengthAdjust="spacing">卑しい器</text>
  </g>

  <!-- ロマ 9:11～ -->
  <text y="339.5" font-size="46" dominant-baseline="central"><tspan x="258" textLength="88" lengthAdjust="spacing">ロマ</tspan> <tspan x="357" font-size="45" textLength="23" lengthAdjust="spacingAndGlyphs">9</tspan><tspan x="384.5" font-size="45">:</tspan><tspan x="404" font-size="45" textLength="39" lengthAdjust="spacingAndGlyphs">11</tspan><tspan x="456.5" textLength="55" lengthAdjust="spacingAndGlyphs">～</tspan></text>

  <!-- 神 → 胎中 → ヤコブ・エサウ -->
  <g fill="#8C949A">
    <polygon points="368,504 410,504 410,496.5 432,507.5 410,518.5 410,511 368,511"/>
    <polygon points="658.4,463.6 671.0,442.5 646.5,445.1"/>
    <polygon points="646.5,568.9 671.0,571.5 658.4,550.4"/>
    <polygon points="754,548 754,502 747.5,502 757.5,482.5 767.5,502 761,502 761,548"/>
  </g>
  <path d="M654.1,453.3 L570,507 L654.1,560.7" fill="none" stroke="#8C949A" stroke-width="8"/>
  <g stroke="currentColor" stroke-width="4">
    <circle cx="302.5" cy="507" r="44.5" fill="#fff" class="paper"/>
    <ellipse cx="757.5" cy="431" rx="75.5" ry="42.5" fill="#F8F28F"/>
    <ellipse cx="757.5" cy="588" rx="75.5" ry="42.5" fill="#F86D42"/>
  </g>
  <text x="302" y="506" font-size="50" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="42" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="759.5" y="431" textLength="124" lengthAdjust="spacing">ヤコブ</text>
    <text x="757.5" y="588" textLength="124" lengthAdjust="spacing">エサウ</text>
  </g>
  <g font-size="46" dominant-baseline="central">
    <text x="451" y="508.5" textLength="91" lengthAdjust="spacing">胎中</text>
    <text x="851" y="433" textLength="137" lengthAdjust="spacing">愛する</text>
    <text x="851" y="591" textLength="92" lengthAdjust="spacing">憎む</text>
    <text x="793" y="513" font-size="42" textLength="124" lengthAdjust="spacing">仕える</text>
  </g>
</svg>
