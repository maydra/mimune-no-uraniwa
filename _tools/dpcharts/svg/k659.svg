<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>本性の外的欲望追求から本性の内的欲望追求へ</title>

  <!-- 灰色の矢印（楕円より先に描く） -->
  <g fill="#8C949A">
    <polygon points="224,130 232,130 232,194 238,194 228,210 218,194 224,194"/>
    <polygon points="224,300 232,300 232,390 238,390 228,406 218,390 224,390"/>
  </g>

  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="227.5" cy="88.5" rx="88" ry="51.5" fill="#F86D42"/>
    <ellipse cx="227.5" cy="265.5" rx="87" ry="50.5" fill="#F8F28F"/>
  </g>
  <g font-size="29" dominant-baseline="central" fill="#111">
    <text x="155.8" y="75.5" textLength="143" lengthAdjust="spacing">本性の外的</text>
    <text x="169.8" y="109.5" textLength="115" lengthAdjust="spacing">欲望追求</text>
    <text x="155.8" y="252.5" textLength="143" lengthAdjust="spacing">本性の内的</text>
    <text x="169.8" y="286.5" textLength="115" lengthAdjust="spacing">欲望追求</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="338.5" cy="236" r="7.6"/>
    <circle cx="338.5" cy="291.5" r="7.6"/>
  </g>
  <g font-size="29" dominant-baseline="central">
    <text y="236.5"><tspan x="354.8" textLength="153" lengthAdjust="spacingAndGlyphs">初代キリスト</tspan><tspan x="510.8" textLength="182" lengthAdjust="spacingAndGlyphs">教精神への復古</tspan></text>
    <text x="355.8" y="291" textLength="258" lengthAdjust="spacing">中世ヘブライズムの</text>
    <text x="354.8" y="330.5" textLength="115" lengthAdjust="spacing">復古運動</text>
  </g>
</svg>
