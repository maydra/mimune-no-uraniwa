<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第二：イエス（洗礼ヨハネの立場→メシヤの立場）</title>

  <!-- 第二：イエス（洗礼ヨハネの立場→メシヤの立場）。元の図は「洗礼ヨハン」。誤記なので直した（2026-10-31、ユーザー「誤表記は直そう」） -->
  <g font-size="25" dominant-baseline="central">
    <text y="60"><tspan x="130" textLength="51" lengthAdjust="spacing">第二</tspan><tspan x="188">：</tspan><tspan x="209" textLength="73" lengthAdjust="spacing">イエス</tspan><tspan x="287">（</tspan><tspan x="298" textLength="199" lengthAdjust="spacing">洗礼ヨハネの立場</tspan></text>
    <text y="60"><tspan x="524" textLength="148" lengthAdjust="spacing">メシヤの立場</tspan><tspan x="672">）</tspan></text>
  </g>
  <polygon points="503,62.5 512,62.5 512,66.5 519.5,59.5 512,52.5 512,56.5 503,56.5" fill="#8C949A"/>

  <!-- 箇条の点 -->
  <g>
    <circle cx="157.5" cy="122.5" r="5.5"/>
    <circle cx="159" cy="216" r="5.5"/>
    <circle cx="158.5" cy="266.5" r="5.5"/>
  </g>

  <g font-size="27" dominant-baseline="central">
    <text x="175" y="122.5" textLength="320" lengthAdjust="spacing">神の三大祝福を成就して</text>
    <text x="176" y="162.5" textLength="231" lengthAdjust="spacing">四位基台蕩減復帰</text>
    <text x="175" y="216" textLength="260" lengthAdjust="spacing">献祭に成功した実体</text>
  </g>
  <text y="266.5" font-size="26" dominant-baseline="central"><tspan x="175" textLength="54" lengthAdjust="spacing">石板</tspan><tspan x="229">、</tspan><tspan x="252" textLength="54" lengthAdjust="spacing">幕屋</tspan><tspan x="306">、</tspan><tspan x="329" textLength="108" lengthAdjust="spacing">契約の箱</tspan><tspan x="438">、</tspan><tspan x="461" textLength="54" lengthAdjust="spacing">磐石</tspan><tspan x="515">、</tspan><tspan x="538" textLength="137" lengthAdjust="spacing">神殿の実体</tspan></text>

  <!-- 信仰基台：○ -->
  <rect x="298.5" y="316.5" width="219" height="47" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="315" y="340" textLength="126" lengthAdjust="spacing">信仰基台</text>
    <text x="456.5" y="340" text-anchor="middle">：</text>
  </g>
  <circle cx="485.5" cy="339.5" r="12" fill="none" stroke="#111" stroke-width="3"/>

  <text x="295" y="392" font-size="27" dominant-baseline="central" textLength="229" lengthAdjust="spacing">アベルの位置確立</text>
</svg>
