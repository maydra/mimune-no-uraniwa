<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人生・宇宙の根本問題から究極の原理、原因的存在である神へ</title>

  <!-- 原因的存在 -->
  <g font-size="56" dominant-baseline="central">
    <text x="887.5" y="180" textLength="170" lengthAdjust="spacing">原因的</text>
    <text x="887.5" y="242" textLength="170" lengthAdjust="spacing">存　在</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="454,382.5 484,382.5 484,361 510.5,406.5 484,452 484,430.5 454,430.5"/>
    <polygon points="784,380 813,380 813,356 838.5,406 813,456 813,432 784,432"/>
  </g>

  <g stroke="currentColor" stroke-width="3.5">
    <ellipse cx="319.5" cy="406.5" rx="119.5" ry="115.5" fill="#DCC4C4"/>
    <ellipse cx="646.5" cy="405.5" rx="119.5" ry="115.5" fill="#fff" class="paper"/>
    <ellipse cx="971.5" cy="405.5" rx="119.5" ry="115.5" fill="#fff" class="paper"/>
  </g>

  <g font-size="34" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="319.5" y="375">人生・宇宙の</text>
    <text x="319.5" y="437.5">根本問題？</text>
  </g>
  <g font-size="52" text-anchor="middle" dominant-baseline="central">
    <text x="646" y="374">究極の</text>
    <text x="646.5" y="440.5">原理</text>
  </g>
  <text x="968" y="404" font-size="76" text-anchor="middle" dominant-baseline="central">神</text>
</svg>
