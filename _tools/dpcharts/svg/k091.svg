<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アダムの家庭の象徴献祭と実体献祭</title>
  <defs>
    <marker id="k091-g" viewBox="0 0 15 19" refX="7" refY="9.5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="19" orient="auto">
      <path d="M0,0 L15,9.5 L0,19 z" fill="#8C949A"/>
    </marker>
  </defs>

  <!-- 灰色の矢印 -->
  <g stroke="#8C949A" stroke-width="6.5" fill="none" marker-end="url(#k091-g)">
    <line x1="252" y1="83" x2="383.1" y2="160"/>
    <line x1="613" y1="82.5" x2="481.8" y2="162.6"/>
    <line x1="343" y1="239.8" x2="246" y2="294.5"/>
    <line x1="519" y1="238.2" x2="611.2" y2="295.2"/>
    <line x1="599" y1="336" x2="276" y2="336"/>
    <line x1="225" y1="305" x2="225" y2="117"/>
  </g>
  <!-- アダムから下へ出る線の根元（中ほどは説明の字に隠れている） -->
  <g stroke="#8C949A" stroke-width="6.5">
    <line x1="408" y1="200" x2="380" y2="213.8"/>
    <line x1="456" y1="200" x2="483" y2="213.6"/>
  </g>
  <!-- サタンとカインの点線 -->
  <line x1="640.5" y1="102" x2="640.5" y2="311" stroke="#8C949A" stroke-width="6.5" stroke-dasharray="13 8"/>

  <!-- 神とサタン -->
  <circle cx="224.5" cy="71" r="30" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="224.5" y="71" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>
  <circle cx="641" cy="71" r="29.5" fill="#50403D" stroke="currentColor" stroke-width="2.2"/>
  <text x="641" y="71" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>

  <!-- 人物 -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="432" cy="182.5" rx="42" ry="24.5" fill="#CF921C"/>
    <ellipse cx="211" cy="330.5" rx="42.5" ry="25" fill="#F8F28F"/>
    <ellipse cx="641.5" cy="336" rx="42.5" ry="25" fill="#F86D42"/>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="432" y="183">アダム</text>
    <text x="211" y="331">アベル</text>
    <text x="641.5" y="336">カイン</text>
  </g>
  <text x="211" y="376" font-size="20" text-anchor="middle" dominant-baseline="central">（アダムの代わり）</text>

  <!-- 献祭の箱 -->
  <g fill="#DCC4C4" stroke="currentColor" stroke-width="2.2">
    <rect x="127" y="168.5" width="83" height="77.5"/>
    <rect x="371" y="351" width="132" height="46"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="168.5" y="189.5">象徴</text>
    <text x="168.5" y="226.5">献祭</text>
    <text x="437" y="374.5">実体献祭</text>
  </g>

  <!-- 説明 -->
  <circle cx="340.5" cy="225" r="7"/>
  <circle cx="339.5" cy="284" r="7"/>
  <g font-size="24" dominant-baseline="central">
    <text x="356" y="226.5">二人の主人対応：</text>
    <text x="356" y="256">非原理的立場</text>
    <text x="356" y="285">心情的な面：</text>
    <text x="356" y="314">罪悪の張本人</text>
  </g>
</svg>
