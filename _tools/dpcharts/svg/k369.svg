<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 第一次世界的カナン復帰路程　1. 信仰基台</title>

  <!-- 題 -->
  <text x="41" y="37" font-size="28" dominant-baseline="central" textLength="26" lengthAdjust="spacingAndGlyphs">Ⅰ.</text>
  <text x="77" y="36.5" font-size="29" dominant-baseline="central" textLength="374" lengthAdjust="spacing">第一次世界的カナン復帰路程</text>
  <line x1="76" y1="54.5" x2="451" y2="54.5" stroke="currentColor" stroke-width="2.2"/>
  <text x="46" y="81" font-size="28" dominant-baseline="central" textLength="22" lengthAdjust="spacingAndGlyphs">1.</text>
  <text x="77" y="81" font-size="28" dominant-baseline="central" textLength="114" lengthAdjust="spacing">信仰基台</text>
  <line x1="77" y1="99" x2="192" y2="99" stroke="currentColor" stroke-width="2.6"/>

  <!-- 中心人物 -->
  <g font-size="28" dominant-baseline="central">
    <text x="163" y="139" textLength="112" lengthAdjust="spacing">中心人物</text>
    <text x="291" y="139" text-anchor="middle">：</text>
    <text x="307" y="139" textLength="142" lengthAdjust="spacing">洗礼ヨハネ</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="193.5,229 199.5,229 199.5,249 203.5,249 196.5,261 189.5,249 193.5,249"/>
    <polygon points="193.5,313 199.5,313 199.5,334 203.5,334 196.5,346 189.5,334 193.5,334"/>
  </g>

  <!-- モーセ・エリヤ・洗礼ヨハネ -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="196" cy="202.5" rx="54" ry="24.5"/>
    <ellipse cx="196" cy="287" rx="54" ry="24"/>
    <ellipse cx="196" cy="378" rx="66" ry="30"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="196" y="202" textLength="75" lengthAdjust="spacing">モーセ</text>
    <text x="196.5" y="288" textLength="76" lengthAdjust="spacing">エリヤ</text>
    <text x="196.5" y="378" font-size="24" textLength="120" lengthAdjust="spacing">洗礼ヨハネ</text>
  </g>

  <!-- 右の説明 -->
  <g font-size="28" dominant-baseline="central">
    <text x="272" y="204">石板を壊す、</text>
    <text x="445" y="204" textLength="114" lengthAdjust="spacing">磐石二打</text>
    <text x="272" y="288.5" font-size="26" textLength="414" lengthAdjust="spacing">神殿理想のためのサタン分立の役割</text>
    <text x="272" y="378" font-size="27" textLength="148" lengthAdjust="spacing">サタン分立、</text>
    <text x="431" y="378" font-size="27" textLength="257" lengthAdjust="spacing">メシヤの道を直くする</text>
  </g>
  <g font-weight="400" dominant-baseline="central">
    <text x="274" y="239" font-size="22" textLength="405" lengthAdjust="spacing">(イエスの体を打ちうるという条件を許す)</text>
    <text x="275" y="324" font-size="23" textLength="394" lengthAdjust="spacing">(全体的な使命は、全て成就できない)</text>
  </g>
</svg>
