<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>南北王朝分立時代と東西王朝分立時代　両王朝国民捕虜と法王権失墜</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="130" y="85.5" width="276" height="54" rx="5"/>
    <rect x="415" y="85.5" width="276" height="54" rx="5"/>
  </g>
  <g font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="267.5" y="113" textLength="249" lengthAdjust="spacing">南北王朝分立時代</text>
    <text x="554" y="113" textLength="250" lengthAdjust="spacing">東西王朝分立時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="130" y="147.5" width="276" height="211.5" rx="6"/>
    <rect x="415" y="147.5" width="276" height="211.5" rx="6"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="149" cy="167" r="10.3"/>
    <circle cx="438" cy="166" r="10.3"/>
  </g>
  <g font-size="17" text-anchor="middle" dominant-baseline="central">
    <text x="149" y="167.5">1</text>
    <text x="438" y="166.5">2</text>
  </g>

  <!-- 箇条 -->
  <g stroke="currentColor" stroke-width="3">
    <line x1="168" y1="256" x2="184.5" y2="256"/>
    <line x1="459" y1="257.5" x2="475.5" y2="257.5"/>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="141" y="210.5" textLength="183" lengthAdjust="spacing">両王朝国民捕虜</text>
    <text x="189" y="256.5" font-size="23" textLength="117" lengthAdjust="spacingAndGlyphs">イスラエル</text>
    <text x="189" y="288" font-size="24" textLength="142" lengthAdjust="spacingAndGlyphs">君主社会崩壊</text>
    <text x="433" y="211" textLength="130" lengthAdjust="spacing">法王権失墜</text>
    <text x="481" y="257.5" font-size="25" textLength="128" lengthAdjust="spacingAndGlyphs">キリスト教</text>
    <text x="485" y="289" textLength="157" lengthAdjust="spacing">君主社会崩壊</text>
  </g>
</svg>
