<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>欲望（創造本性）が神のみ意を目的とすれば善、サタンの目的なら悪</title>

  <!-- 欲望から善・悪へ（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="373,338.3 410.4,344 405.1,351.6 568.1,464 559.9,476 396.9,363.6 391.6,371.2"/>
    <polygon points="910,338.3 872.6,344 877.9,351.6 714.9,464 723.1,476 886.1,363.6 891.4,371.2"/>
  </g>

  <g font-size="50" text-anchor="middle" dominant-baseline="central">
    <text x="315" y="148.5">神のみ意</text>
    <text x="962.5" y="149.5">サタンの目的</text>
  </g>

  <rect x="252.5" y="220.5" width="116" height="115.5" rx="12" fill="#fff" class="paper" stroke="currentColor" stroke-width="5"/>
  <rect x="917.5" y="220.5" width="116" height="116" rx="12" fill="#50403D" stroke="currentColor" stroke-width="5"/>
  <g font-size="68" text-anchor="middle" dominant-baseline="central">
    <text x="310.5" y="277">善</text>
    <text x="975" y="278" fill="#fff">悪</text>
  </g>

  <ellipse cx="641.5" cy="484.5" rx="94.5" ry="53.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="5"/>
  <text x="638.5" y="483.5" font-size="60" text-anchor="middle" dominant-baseline="central">欲望</text>
  <text x="636.5" y="580" font-size="45" text-anchor="middle" dominant-baseline="central">創造本性</text>
</svg>
