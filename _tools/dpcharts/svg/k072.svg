<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『聖書の実例』　出エ 12:29・創世記 25:23</title>
  <defs>
    <marker id="k072-g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.3" markerHeight="2.3" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <!-- 題 -->
  <text x="130" y="36.5" font-size="31" textLength="185" lengthAdjust="spacing" dominant-baseline="central">『聖書の実例』</text>

  <!-- 出エ 12:29 -->
  <circle cx="143.5" cy="87" r="6.5"/>
  <g font-size="28" dominant-baseline="central">
    <text x="160" y="86" textLength="54" lengthAdjust="spacing">出エ</text>
    <text x="225" y="86" font-size="32" textLength="70" lengthAdjust="spacing">12:29</text>
  </g>

  <!-- 神 → エジプト 初子 -->
  <polygon points="216,160.5 344,160.5 344,157 354.5,163.5 344,170 344,166.5 216,166.5" fill="#8C949A"/>
  <ellipse cx="187" cy="163" rx="28.4" ry="26.4" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="186.5" y="163" font-size="29" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="278" y="141" font-size="27" textLength="54" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central">撃つ</text>
  <ellipse cx="454.5" cy="163.5" rx="83" ry="30" fill="#F86D42" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="24" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="427.5" y="163.5" textLength="85" lengthAdjust="spacing">エジプト</text>
    <text x="502.5" y="163.5" textLength="42" lengthAdjust="spacing">初子</text>
  </g>

  <!-- 創世記 25:23 -->
  <circle cx="142" cy="255.5" r="6.5"/>
  <g font-size="28" dominant-baseline="central">
    <text x="158" y="255.5" textLength="82" lengthAdjust="spacing">創世記</text>
    <text x="247" y="255.5" font-size="32" textLength="68" lengthAdjust="spacing">25:23</text>
  </g>

  <!-- 神 → 腹中 → 長子 エサウ・次子 ヤコブ -->
  <polygon points="215,317.5 229,317.5 229,314 239.5,320.5 229,327 229,323.5 215,323.5" fill="#8C949A"/>
  <ellipse cx="186" cy="321" rx="28.4" ry="26.4" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="185.5" y="320.5" font-size="29" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="270" y="321" font-size="25" textLength="49" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central">腹中</text>
  <g stroke="#8C949A" stroke-width="5.5" fill="none" marker-end="url(#k072-g)">
    <line x1="310" y1="314.5" x2="364.5" y2="283.1"/>
    <line x1="311" y1="331" x2="360.8" y2="365"/>
  </g>
  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text transform="translate(325,284) rotate(-29)">憎む</text>
    <text transform="translate(322,362.5) rotate(33)">愛する</text>
  </g>

  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="453" cy="274" rx="78.5" ry="26.5" fill="#F86D42"/>
    <ellipse cx="453.5" cy="373" rx="78.5" ry="26.5" fill="#F8F28F"/>
  </g>
  <g font-size="23" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="413.5" y="274.5" textLength="44" lengthAdjust="spacing">長子</text>
    <text x="479.5" y="274.5" textLength="66" lengthAdjust="spacing">エサウ</text>
    <text x="414.5" y="373" textLength="44" lengthAdjust="spacing">次子</text>
    <text x="479.5" y="373" textLength="66" lengthAdjust="spacing">ヤコブ</text>
  </g>

  <!-- 立場 -->
  <g font-size="25.5" text-anchor="middle" dominant-baseline="central">
    <text x="621.5" y="163.5" textLength="154" lengthAdjust="spacing">カインの立場</text>
    <text x="618" y="271.5" textLength="155" lengthAdjust="spacing">カインの立場</text>
    <text x="618.5" y="373" textLength="154" lengthAdjust="spacing">アベルの立場</text>
  </g>
</svg>
