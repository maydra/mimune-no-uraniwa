    <path d="M847.75,472 c13.17,7.94 25.76,15.5 40.375,15.5 c14.615,0 27.205,-7.56 40.375,-15.5 c13.17,-7.94 25.76,-15.5 40.375,-15.5 c14.615,0 27.205,7.56 40.375,15.5"/>
    <circle cx="926.5" cy="282.5" r="80.75"/>
    <circle cx="928.5" cy="472" r="80.75"/>
  </g>
  <g font-size="48" text-anchor="middle" dominant-baseline="central" fill="#111">
