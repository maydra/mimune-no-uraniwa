<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>実体対象の運動様相と創造の造化の妙味</title>
  <defs>
    <marker id="z102-s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="839" y="29" font-size="22" textLength="97" lengthAdjust="spacing">みょうみ</text>
  <text x="51" y="77" font-size="48" textLength="899" lengthAdjust="spacing">実体対象の運動様相と創造の造化の妙味</text>
  <line x1="50" y1="88.5" x2="950" y2="88.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 平面回路（円形運動） -->
  <ellipse cx="446" cy="231" rx="198" ry="102" fill="none" stroke="currentColor" stroke-width="4"/>
  <polyline points="464.5,322.5 481,332.5 464.5,343.5" fill="none" stroke="currentColor" stroke-width="5"/>
  <circle cx="441" cy="216" r="47" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.5"/>
  <circle cx="383.5" cy="326" r="47" fill="#DCC4C4" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="57" text-anchor="middle" dominant-baseline="central">
    <text x="440" y="215">神</text>
    <text x="383.5" y="326" fill="#111">合</text>
  </g>

  <!-- 立体回路（球形運動）：線で描いた球 -->
  <g fill="none" stroke="currentColor">
    <circle cx="902" cy="250.5" r="149" stroke-width="4.5"/>
    <!-- 裏側の経線（点線） -->
    <g stroke-width="2.5" stroke-dasharray="3 4">
      <path d="M890,101 C929,140 959,196 962,253 C966,299 957,346 949,391"/>
      <path d="M830,119 C887,133 924,208 944,259 C962,314 971,348 928,393"/>
      <path d="M786,158 C845,156 910,206 943,251 C975,279 994,320 1001,361"/>
    </g>
    <!-- 表側の経線（合に集まる） -->
    <g stroke-width="2.5">
      <path d="M869,105 C823,139 825,230 836,281"/>
      <path d="M809,134 C796,183 806,239 831,282"/>
      <path d="M773,177 C771,216 793,257 823,282"/>
      <path d="M869.6,337.9 C896.9,360.4 929,378.5 964,387"/>
      <path d="M860.7,342.3 C876.7,365.7 911.8,394.5 932,397"/>
      <path d="M853,342.9 C861.1,363.2 870.9,388.8 888,399"/>
    </g>
    <g stroke-width="2.5" marker-end="url(#z102-s)">
      <path d="M856,326 C860.4,330.1 864.9,334.1 869.6,337.9"/>
      <path d="M854,330 C855.4,333.8 857.7,338 860.7,342.3"/>
      <path d="M849,333 C850.3,336.1 851.7,339.4 853,342.9"/>
    </g>
    <!-- 赤道 -->
    <ellipse cx="902.5" cy="252.75" rx="149.5" ry="54.5" stroke-width="3.5"/>
    <polyline points="881.5,300.5 892,307.5 881.5,314.5" stroke-width="4"/>
    <!-- 神から -->
    <g stroke-width="3.5">
      <line x1="841" y1="305" x2="895" y2="247.5"/>
      <line x1="895" y1="247.5" x2="946" y2="201"/>
    </g>
  </g>
  <circle cx="895" cy="247.5" r="27.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <circle cx="841" cy="305" r="24" fill="#A0F08A"/>
  <path d="M840,281 Q832,293 841,305 Q850,317 844,328.8 A24,24 0 1 1 840,281 Z" fill="#F98AEE"/>
  <circle cx="841" cy="305" r="24" fill="none" stroke="currentColor" stroke-width="3"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="895" y="248" font-size="42">神</text>
    <text x="841" y="305" font-size="40" fill="#111">合</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="300.5" cy="433.5" r="11.5"/>
    <circle cx="301.5" cy="502.5" r="11.5"/>
    <circle cx="825" cy="440" r="11.5"/>
    <circle cx="823.5" cy="504" r="11.5"/>
  </g>
  <g font-size="43" dominant-baseline="central">
    <text x="325" y="439">平面回路</text>
    <text x="325" y="501.5">円形運動</text>
    <text x="850" y="442">立体回路</text>
    <text x="850" y="504.5">球形運動</text>
  </g>

  <!-- 創造の造化の妙味 -->
  <g font-size="37" dominant-baseline="central">
    <text x="311.5" y="579.5" textLength="300" lengthAdjust="spacing">創造の造化の妙味</text>
    <text x="629.5" y="579.5" text-anchor="middle">：</text>
    <text x="650" y="579.5" textLength="148" lengthAdjust="spacing">円形運動</text>
    <text x="875" y="579.5" textLength="148" lengthAdjust="spacing">球形運動</text>
  </g>
  <polygon points="820,571 843,571 843,564 857,580 843,596 843,588 820,588" fill="#8C949A"/>
  <g font-size="35" dominant-baseline="central">
    <text x="333" y="633" text-anchor="end">（</text>
    <text x="333.5" y="633" textLength="186" lengthAdjust="spacing">回路の距離</text>
    <text x="520" y="633">、</text>
    <text x="547.5" y="633" textLength="73" lengthAdjust="spacing">様相</text>
    <text x="623" y="633">、</text>
    <text x="651.5" y="633" textLength="72" lengthAdjust="spacing">方向</text>
    <text x="726" y="633">、</text>
    <text x="755.5" y="633" textLength="73" lengthAdjust="spacing">角度</text>
    <text x="829" y="633">、</text>
    <text x="858.5" y="633" textLength="148" lengthAdjust="spacing">力の速度</text>
    <text x="1008" y="633">）</text>
  </g>
</svg>
