    <line x1="420" y1="232.5" x2="512.6" y2="295.6"/>
  </g>

  <!-- 神 -->
  <circle cx="565" cy="93.5" r="38" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="564" y="93.5" font-size="40" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- ヤコブ・モーセ・イエス -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="207.5" cy="205.5" rx="57.5" ry="29.5"/>
    <ellipse cx="383.5" cy="205.5" rx="60.5" ry="30"/>
    <ellipse cx="565" cy="205.5" rx="61" ry="30"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
