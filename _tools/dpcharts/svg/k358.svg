<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>エリコ城の崩壊とカナン入城</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="206,74 212,74 212,159.5 216,159.5 209,169 202,159.5 206,159.5"/>
    <polygon points="206,230 212,230 212,329.5 216,329.5 209,340.5 202,329.5 206,329.5"/>
  </g>

  <!-- エリコ・カナン -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="209" cy="202" rx="79.5" ry="22.5"/>
    <ellipse cx="209" cy="374" rx="79.5" ry="22.5"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="208" y="202" textLength="82" lengthAdjust="spacing">エリコ</text>
    <text x="209.5" y="374" textLength="82" lengthAdjust="spacing">カナン</text>
  </g>

  <!-- 箇条 -->
  <circle cx="309" cy="80" r="6.5"/>
  <circle cx="309" cy="201.5" r="6.5"/>
  <circle cx="311" cy="282" r="6.5"/>
  <circle cx="311" cy="371" r="6.5"/>
  <g font-size="25" dominant-baseline="central">
    <text x="322" y="81" textLength="259" lengthAdjust="spacing">過越の祭を守ってのち</text>
    <text x="322" y="115.5" textLength="156" lengthAdjust="spacing">エリコに進軍</text>
    <text x="323" y="201" textLength="77" lengthAdjust="spacing">六日間</text>
    <text x="414.5" y="201" text-anchor="middle">：</text>
    <text x="429" y="201" textLength="182" lengthAdjust="spacing">イスラエル民族</text>
    <text x="626" y="201" textLength="51" lengthAdjust="spacing">行軍</text>
    <text x="326" y="234" font-size="24" textLength="183" lengthAdjust="spacing">（一日に一度ずつ）</text>
    <text x="325" y="282" textLength="75" lengthAdjust="spacing">七日目</text>
    <text x="416" y="282" text-anchor="middle">：</text>
    <text x="431" y="282" textLength="104" lengthAdjust="spacing">エリコ城</text>
    <text x="548" y="282" textLength="52" lengthAdjust="spacing">崩壊</text>
    <text x="326" y="370" textLength="22" lengthAdjust="spacingAndGlyphs">31</text>
    <text x="353" y="370" textLength="78" lengthAdjust="spacing">王滅ぶ</text>
  </g>
</svg>
