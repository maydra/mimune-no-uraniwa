<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理＝再創造摂理 → 原理によって摂理 → 復帰原理</title>

  <!-- 復帰摂理・復帰原理 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="407.5" cy="56" rx="110" ry="30.5"/>
    <ellipse cx="407.5" cy="372.5" rx="110" ry="30.5"/>
  </g>
  <g font-size="34" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="408" y="57" textLength="146" lengthAdjust="spacing">復帰摂理</text>
    <text x="408" y="372" textLength="146" lengthAdjust="spacing">復帰原理</text>
  </g>

  <!-- 縦の等号 -->
  <g stroke="currentColor" stroke-width="5">
    <line x1="399.5" y1="94" x2="399.5" y2="122"/>
    <line x1="416" y1="94" x2="416" y2="122"/>
  </g>

  <!-- 箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <rect x="302.5" y="131.5" width="211" height="52" rx="7"/>
    <rect x="257.5" y="235.5" width="304" height="52" rx="7"/>
  </g>
  <g font-size="34" text-anchor="middle" dominant-baseline="central">
    <text x="407.5" y="156" textLength="170" lengthAdjust="spacing">再創造摂理</text>
    <text x="410" y="262" textLength="270" lengthAdjust="spacing">原理によって摂理</text>
  </g>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="404,192 411,192 411,213 417.5,213 407.5,230 397.5,213 404,213"/>
    <polygon points="404,296 411,296 411,317 417.5,317 407.5,334 397.5,317 404,317"/>
  </g>
</svg>
