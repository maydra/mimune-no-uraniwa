<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>聖書：死んだ信徒たちの肉身が再びよみがえる（テサロニケⅠ 4:16、マタイ 27:52）→ 現代人：納得できない → 復活論</title>

  <!-- 聖書（z207 と同じ形を、元の画像の大きさに合わせて置く） -->
  <g transform="matrix(1.1224,-0.0008,-0.0021,1.0803,-26.01,-11.04)">
    <path d="M285,123 L398,126 Q418,129 420,152 L404,206 L389,241 L378,266 L369,295 L364,310 Q362,314 352,314 L285,311 L240,306 Q230,304 230,293 L232,278 L224,266 Z" fill="#3A3A3A" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M236,275 L350,279 L346,303 L240,299 Q234,298 234,290 Z" fill="#EDEDED"/>
    <g stroke="#111" stroke-width="1.5">
      <line x1="238" y1="282" x2="348" y2="286"/>
      <line x1="238" y1="288" x2="347" y2="292"/>
      <line x1="238" y1="294" x2="347" y2="298"/>
    </g>
    <polyline points="389,135 295,133 237,262 344,262" fill="none" stroke="#BDBDBD" stroke-width="2"/>
    <line x1="393" y1="133" x2="347" y2="267" stroke="#DADADA" stroke-width="4"/>
    <path d="M312,281 L329,283 L321,329 L304,329 Z" fill="#3A3A3A" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text transform="translate(337,171) skewX(-10)" font-size="54" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="110" lengthAdjust="spacingAndGlyphs">聖經</text>

  <!-- 聖書の記述 -->
  <rect x="471" y="117.5" width="589.5" height="222" rx="18" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="46" dominant-baseline="central">
    <text x="500" y="167" textLength="506" lengthAdjust="spacing">死んだ信徒たちの肉身が</text>
    <text x="500" y="230" textLength="324" lengthAdjust="spacing">再びよみがえる</text>
  </g>
  <text y="288" font-size="33" font-weight="400" dominant-baseline="central"><tspan x="497" textLength="176" lengthAdjust="spacingAndGlyphs">(テサロニケ</tspan><tspan x="675" textLength="33" lengthAdjust="spacingAndGlyphs">Ⅰ</tspan> <tspan x="715" textLength="80" lengthAdjust="spacingAndGlyphs">4:16、</tspan><tspan x="806" textLength="96" lengthAdjust="spacingAndGlyphs">マタイ</tspan> <tspan x="912" textLength="96" lengthAdjust="spacingAndGlyphs">27:52)</tspan></text>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="592.5,368 603.5,368 603.5,449.5 618.5,449.5 598,487 577,449.5 592.5,449.5"/>
    <polygon points="732,531 775,531 775,519 812.5,539.5 775,560.5 775,548 732,548"/>
  </g>

  <text y="539" font-size="48" dominant-baseline="central"><tspan x="226" textLength="144" lengthAdjust="spacing">現代人</tspan><tspan x="392" text-anchor="middle">：</tspan><tspan x="416" textLength="288" lengthAdjust="spacing">納得できない</tspan></text>

  <!-- 復活論 -->
  <rect x="829" y="488.5" width="257.5" height="102" rx="23" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="957" y="538" font-size="66" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="200" lengthAdjust="spacing">復活論</text>
</svg>
