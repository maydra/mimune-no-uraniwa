<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. アベル型の人生観</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="36" y="47.5" font-size="30" textLength="23" lengthAdjust="spacingAndGlyphs">Ⅱ</text>
    <circle cx="67" cy="57" r="2.5"/>
    <text x="84" y="47" font-size="30" textLength="251" lengthAdjust="spacing">アベル型の人生観</text>
  </g>
  <line x1="82" y1="66" x2="334" y2="66" stroke="currentColor" stroke-width="2.5"/>

  <!-- 宗教改革運動 -->
  <ellipse cx="412.5" cy="134" rx="151" ry="30" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="413" y="133.5" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="186" lengthAdjust="spacing">宗教改革運動</text>

  <polygon points="407,176 407,200.5 403,200.5 410,212.5 417,200.5 413,200.5 413,176" fill="#8C949A"/>

  <!-- 箇条 -->
  <circle cx="147" cy="255" r="7.5"/>
  <circle cx="147" cy="340" r="7.5"/>
  <g font-size="31" dominant-baseline="central">
    <text x="164" y="254.5" textLength="473" lengthAdjust="spacing">創造本性を指向する立体的人生観</text>
    <text x="164" y="338.5" textLength="410" lengthAdjust="spacing">高次的に神を指向する人生観</text>
  </g>
</svg>
