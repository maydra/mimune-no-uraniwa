<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスの十字架の死　②神の摂理から見て</title>

  <text y="57.5" font-size="45" dominant-baseline="central"><tspan x="53">②</tspan><tspan x="105" textLength="363" lengthAdjust="spacing">神の摂理から見て</tspan></text>

  <!-- 下向きの矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="410.5,170 418.5,170 418.5,199.5 425.5,199.5 415,219.5 404.5,199.5 410.5,199.5"/>
    <polygon points="410.5,290 418.5,290 418.5,318.5 425.5,318.5 415,338.5 404.5,318.5 410.5,318.5"/>
    <polygon points="410.5,400 418.5,400 418.5,431.5 425.5,431.5 415,451.5 404.5,431.5 410.5,431.5"/>
    <polygon points="410.5,524 418.5,524 418.5,552.5 425.5,552.5 415,572.5 404.5,552.5 410.5,552.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="415" cy="141" rx="66.75" ry="34.75" fill="#fff" class="paper"/>
    <ellipse cx="415" cy="259" rx="159.75" ry="35.75" fill="#FCE5E3"/>
    <ellipse cx="414.5" cy="374.5" rx="91.25" ry="31.25" fill="#FCE5E3"/>
    <ellipse cx="414" cy="494" rx="138.75" ry="34.75" fill="#DCC4C4"/>
    <ellipse cx="414.5" cy="613" rx="139.25" ry="32.75" fill="#FCE5E3"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="411.5" y="139" font-size="52">神</text>
    <g fill="#111" font-size="41">
      <text x="416" y="258.5" font-size="42" textLength="264" lengthAdjust="spacingAndGlyphs">アブラハムの子孫</text>
      <text x="414" y="374">預言者</text>
      <text y="494"><tspan x="351">幕屋</tspan><tspan x="414.5">・</tspan><tspan x="477">神殿</tspan></text>
      <text x="413.5" y="613" textLength="206" lengthAdjust="spacing">洗礼ヨハネ</text>
    </g>
  </g>

  <!-- 右の説明 -->
  <g font-size="43" dominant-baseline="central">
    <text y="255"><tspan x="612" text-anchor="middle">：</tspan><tspan x="637" textLength="318" lengthAdjust="spacing">イスラエル選民</tspan></text>
    <text y="365"><tspan x="612" text-anchor="middle">：</tspan><tspan x="637" textLength="452" lengthAdjust="spacingAndGlyphs">メシヤを送ることを約束</tspan></text>
    <text y="490"><tspan x="612" text-anchor="middle">：</tspan><tspan x="637" textLength="406" lengthAdjust="spacing">メシヤを迎える準備</tspan></text>
    <text y="610"><tspan x="612" text-anchor="middle">：</tspan><tspan x="637" textLength="234" lengthAdjust="spacingAndGlyphs">メシヤの誕生</tspan><tspan x="894" text-anchor="middle">・</tspan><tspan x="917" textLength="194" lengthAdjust="spacingAndGlyphs">顕現を証す</tspan></text>
  </g>
</svg>
