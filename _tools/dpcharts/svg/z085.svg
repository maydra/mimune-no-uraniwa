    <text x="523" y="185.5">：</text>
    <text x="523" y="291">：</text>
    <text x="523" y="396">：</text>
    <text x="523" y="501.5">：</text>
    <text x="523" y="606.5">：</text>
  </g>

  <!-- 主体（桃）と対象（緑） -->
