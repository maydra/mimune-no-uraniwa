<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヨシュアを中心とする実体基台　モーセの代わりにヨシュアを立てる</title>

  <!-- 題 -->
  <circle cx="47.5" cy="35.5" r="14.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="47.5" y="36" font-size="20" text-anchor="middle" dominant-baseline="central">ロ</text>
  <text x="74" y="35.5" font-size="29" dominant-baseline="central" textLength="402" lengthAdjust="spacing">ヨシュアを中心とする実体基台</text>
  <line x1="71" y1="53.5" x2="477" y2="53.5" stroke="currentColor" stroke-width="2.2"/>
  <text x="74" y="86" font-size="26" dominant-baseline="central" textLength="417" lengthAdjust="spacing">モーセの代わりにヨシュアを立てる</text>
  <line x1="72" y1="102.5" x2="494" y2="102.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印と括弧 -->
  <polygon points="204.5,202 213,216 207.5,216 207.5,295 201.5,295 201.5,216 196,216" fill="#8C949A"/>
  <path d="M370,199 H352.5 V282 H370 M337,240.5 H352.5" fill="none" stroke="#8C949A" stroke-width="5"/>

  <!-- 神 -->
  <circle cx="205" cy="168" r="29.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="205" y="168" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 信仰基台 -->
  <rect x="250" y="200" width="85" height="82" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="290" y="223.5">信仰</text>
    <text x="290" y="260.5">基台</text>
  </g>

  <!-- モーセ・ヨシュア -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="204.5" cy="316" rx="51" ry="23.5"/>
    <ellipse cx="204.5" cy="367.5" rx="51" ry="22.5"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="205" y="317" textLength="78" lengthAdjust="spacing">モーセ</text>
    <text x="205" y="368" textLength="88" lengthAdjust="spacing">ヨシュア</text>
  </g>

  <!-- 中心人物・条件物 -->
  <g font-size="26" dominant-baseline="central">
    <text x="377" y="199" textLength="104" lengthAdjust="spacing">中心人物</text>
    <text x="493.5" y="199" text-anchor="middle">：</text>
    <text x="508" y="199" textLength="102" lengthAdjust="spacing">ヨシュア</text>
    <text x="376.5" y="284.5" textLength="78" lengthAdjust="spacing">条件物</text>
    <text x="467.5" y="284.5" text-anchor="middle">：</text>
    <text x="480.5" y="284.5" textLength="130" lengthAdjust="spacing">幕屋を信奉</text>
  </g>
  <text x="502" y="232" font-size="22" dominant-baseline="central" textLength="186" lengthAdjust="spacing">（民数 27:18 ～ 20）</text>
</svg>
