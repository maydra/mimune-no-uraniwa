<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>み旨の裏庭 | サイト内検索</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="/mimune-no-uraniwa/favicon.png" rel="icon" type="image/png"/>
<style>
  body {
    font-family: sans-serif;
    font-size: 18px;
    line-height: 1.7;
    max-width: 800px;
    margin: 1em auto;
    padding: 0 1em;
    color: #333;
  }
  h1 {
    font-size: 1.5em;
    margin-bottom: 0.5em;
  }
  .search-container {
    margin-bottom: 2em;
  }
  #search-input {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    box-sizing: border-box;
    border: 2px solid #ccc;
    border-radius: 4px;
  }
  #search-stats {
    margin-top: 0.5em;
    font-size: 0.9em;
    color: #666;
  }
  .result-item {
    margin-bottom: 2em;
    border-bottom: 1px solid #eee;
    padding-bottom: 1em;
  }
  .result-title {
    font-size: 1.2em;
    font-weight: bold;
    margin-bottom: 0.2em;
  }
  .result-title a {
    text-decoration: none;
    color: #0066cc;
  }
  .result-title a:hover {
    text-decoration: underline;
  }
  .result-snippet {
    font-size: 0.95em;
    color: #444;
  }
  mark {
    background-color: #fffacd;
    font-weight: bold;
    color: #000;
  }
  .loading {
    color: #888;
    font-style: italic;
  }
  .nav-link {
      display: inline-block;
      margin-bottom: 1em;
      text-decoration: none;
      color: #0066cc;
  }
</style>
</head>
<body>
<a class="nav-link" href="index.html">← トップページに戻る</a>
<h1 id="サイト内検索"><a href="#サイト内検索">サイト内検索</a></h1>
<div class="search-container">
<input autofocus="" id="search-input" placeholder="キーワードを入力 (スペースでAND検索)" type="text"/>
<div id="search-stats"></div>
</div>
<div id="search-results"></div>
<script src="search.js"></script>
</body>
</html>
