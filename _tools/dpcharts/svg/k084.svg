<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ．アダムの家庭におけるメシヤのための基台とその喪失</title>

  <!-- 題 -->
  <text x="49.5" y="38.5" font-size="30" text-anchor="middle" dominant-baseline="central">Ⅲ</text>
  <text x="69" y="38.5" font-size="30" text-anchor="middle" dominant-baseline="central">.</text>
  <text x="87.5" y="37.5" font-size="29.5" textLength="707" lengthAdjust="spacing" dominant-baseline="central">アダムの家庭におけるメシヤのための基台とその喪失</text>
  <line x1="85" y1="56.5" x2="795" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- メシヤのための基台 -->
  <rect x="188" y="108.5" width="303" height="47.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.4"/>
  <text x="200" y="133.5" font-size="30" textLength="280" lengthAdjust="spacing" dominant-baseline="central" fill="#111">メシヤのための基台</text>

  <!-- ＝（縦）と＋ -->
  <g stroke="currentColor" stroke-width="4">
    <line x1="289.5" y1="173" x2="289.5" y2="194"/>
    <line x1="302" y1="173" x2="302" y2="194"/>
    <line x1="284" y1="291.5" x2="307" y2="291.5"/>
    <line x1="295.5" y1="280" x2="295.5" y2="303"/>
  </g>

  <!-- 実体基台・信仰基台 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4">
    <rect x="208.5" y="209" width="176" height="59.5"/>
    <rect x="212" y="319" width="168" height="54"/>
  </g>
  <g font-size="31" dominant-baseline="central">
    <text x="234.5" y="239" textLength="124" lengthAdjust="spacing">実体基台</text>
    <text x="234" y="346" textLength="124" lengthAdjust="spacing">信仰基台</text>
    <text x="438.5" y="238" textLength="125" lengthAdjust="spacing">実体献祭</text>
    <text x="436.5" y="345.5" textLength="125" lengthAdjust="spacing">象徴献祭</text>
  </g>
  <!-- … -->
  <g>
    <circle cx="402" cy="238" r="2.6"/>
    <circle cx="412.5" cy="238" r="2.6"/>
    <circle cx="423" cy="238" r="2.6"/>
    <circle cx="400" cy="345.5" r="2.6"/>
    <circle cx="411" cy="345.5" r="2.6"/>
    <circle cx="421" cy="345.5" r="2.6"/>
  </g>
</svg>
