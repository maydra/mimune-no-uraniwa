<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>① 命を懸けて闘う試練に勝利</title>

  <!-- 題 -->
  <text x="47.5" y="38.5" font-size="30" text-anchor="middle" dominant-baseline="central">①</text>
  <text x="68" y="38.5" font-size="29" dominant-baseline="central" textLength="347" lengthAdjust="spacing">命を懸けて闘う試練に勝利</text>
  <line x1="68" y1="56" x2="416" y2="56" stroke="currentColor" stroke-width="2.5"/>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="198,196 203.5,196 203.5,259.5 208.5,259.5 200.75,272 193,259.5 198,259.5"/>
    <polygon points="522,166 544,166 544,162 554.5,169 544,175.5 544,171.5 522,171.5"/>
    <polygon points="502,314 524,314 524,310.5 535,317 524,323.5 524,319.5 502,319.5"/>
  </g>

  <!-- アとエ -->
  <g transform="translate(200,168.5)">
    <ellipse rx="62" ry="28.5" fill="#CF921C"/>
    <path d="M-8,-27.5 C-25,-21 -24,-7.3 -4,-0.5 C21,8 21,23 3,27.5" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <ellipse rx="62" ry="28.5" fill="none" stroke="currentColor" stroke-width="3"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="165" y="170.5">ア</text>
    <text x="232.5" y="167">エ</text>
  </g>

  <!-- ヤコブ -->
  <ellipse cx="200" cy="305.5" rx="44.75" ry="22.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <text x="199.5" y="307" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="76" lengthAdjust="spacing">ヤコブ</text>

  <!-- 右の字 -->
  <g font-size="29" dominant-baseline="central">
    <text x="278.5" y="169" textLength="232" lengthAdjust="spacing">天使長からの試練</text>
    <text x="568" y="169" textLength="57" lengthAdjust="spacing">堕落</text>
  </g>
  <text x="272" y="273" font-size="28.5" font-weight="400" dominant-baseline="central" textLength="317" lengthAdjust="spacing">家庭的カナン復帰完成者</text>
  <g font-size="27" dominant-baseline="central">
    <text x="271" y="315" textLength="137" lengthAdjust="spacing">天使と闘い</text>
    <text x="408" y="315">、</text>
    <text x="436" y="315" textLength="54" lengthAdjust="spacing">勝利</text>
    <text x="546" y="315" textLength="137" lengthAdjust="spacing">イスラエル</text>
  </g>
</svg>
