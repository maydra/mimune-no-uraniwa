  <g stroke="currentColor" stroke-width="4">
    <circle cx="578" cy="169.25" r="70.5" fill="#50403D"/>
    <ellipse cx="409" cy="363" rx="91.5" ry="64.5" fill="#F98AEE"/>
    <ellipse cx="749" cy="363" rx="91.5" ry="67" fill="#A0F08A"/>
    <ellipse cx="576.75" cy="556.75" rx="112.75" ry="58.25" fill="#50403D"/>
