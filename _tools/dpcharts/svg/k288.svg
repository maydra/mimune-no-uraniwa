<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>荒野路程の全期間</title>

  <!-- 題 -->
  <text x="35" y="36" font-size="30" dominant-baseline="central" textLength="247" lengthAdjust="spacing">荒野路程の全期間</text>
  <line x1="33" y1="54.5" x2="285" y2="54.5" stroke="currentColor" stroke-width="2"/>

  <!-- 民族的な実体基台 -->
  <rect x="268" y="105.5" width="233.5" height="49" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="280" y="129.5" font-size="27" dominant-baseline="central" textLength="207" lengthAdjust="spacing">民族的な実体基台</text>

  <!-- ⇧ -->
  <polygon points="383.5,166.5 402.5,175.5 391,175.5 391,181.5 376,181.5 376,175.5 364.5,175.5" fill="#8C949A"/>

  <!-- 堕落性を脱ぐための民族的な蕩減条件 -->
  <rect x="255" y="196.5" width="260.5" height="76.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text x="266" y="218" textLength="232" lengthAdjust="spacing">堕落性を脱ぐための</text>
    <text x="266" y="250" textLength="207" lengthAdjust="spacing">民族的な蕩減条件</text>
  </g>

  <!-- イスラエル民族 → モーセ -->
  <polygon points="482,302.5 283,302.5 283,295.5 265,305.5 283,315.5 283,308.5 482,308.5" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="198" cy="305.5" rx="61" ry="25.2" fill="#F8F28F"/>
    <ellipse cx="581.5" cy="306" rx="99.2" ry="28.7" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="195.5" y="305.5" font-size="32" textLength="91" lengthAdjust="spacing">モーセ</text>
    <text x="578.5" y="305.5" font-size="26" textLength="161" lengthAdjust="spacing">イスラエル民族</text>
  </g>
  <text x="274" y="335" font-size="27" dominant-baseline="central" textLength="207" lengthAdjust="spacing">全期間従順、屈伏</text>
  <g font-size="23" font-weight="400" dominant-baseline="central">
    <text x="154" y="352.5" textLength="93" lengthAdjust="spacing">（アベル）</text>
    <text x="536" y="354.5" textLength="93" lengthAdjust="spacing">（カイン）</text>
  </g>
</svg>
