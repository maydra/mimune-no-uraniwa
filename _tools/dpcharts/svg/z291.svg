<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>自由の原理的意義　①原理を離れた自由はない</title>

  <g font-size="48" text-anchor="middle">
    <text x="76" y="76">Ⅰ</text>
    <text x="106.5" y="76">.</text>
  </g>
  <text x="128" y="76" font-size="48" textLength="397" lengthAdjust="spacing">自由の原理的意義</text>
  <line x1="126" y1="87.5" x2="525" y2="87.5" stroke="currentColor" stroke-width="3.5"/>
  <text x="74" y="162" font-size="45">①<tspan x="127">原理を離れた自由はない</tspan></text>

  <!-- 楕円をつなぐ線（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="10">
    <line x1="418.5" y1="310" x2="645.5" y2="543"/>
    <line x1="882" y1="310" x2="657" y2="543"/>
  </g>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="420.5" cy="310" rx="128.5" ry="49" fill="#F98AEE"/>
    <ellipse cx="881" cy="310" rx="129" ry="49" fill="#A0F08A"/>
    <ellipse cx="650.5" cy="543" rx="169.5" ry="44" fill="#DCC4C4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="423" y="310" font-size="45">自由意志</text>
    <text x="882.5" y="310" font-size="45">自由行動</text>
    <text x="652" y="543" font-size="44">完全な自由</text>
  </g>

  <!-- 行き来の矢印 -->
  <polygon points="574,286.5 709,286.5 709,280.5 731.5,292 709,303.5 709,297.5 574,297.5"/>
  <polygon points="727.5,318.5 593,318.5 593,312.5 571.5,324 593,335.5 593,329.5 727.5,329.5"/>

  <g font-size="46" text-anchor="middle" dominant-baseline="central">
    <text x="417" y="400.5">性相</text>
    <text x="881" y="400">形状</text>
  </g>
