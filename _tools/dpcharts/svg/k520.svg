<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅵ. メシヤ降臨準備時代 400 年</title>

  <!-- 題 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text y="38" font-size="30"><tspan x="54.5" textLength="38" lengthAdjust="spacingAndGlyphs">Ⅵ.</tspan><tspan x="224" textLength="283" lengthAdjust="spacing">メシヤ降臨準備時代</tspan><tspan x="397" textLength="49" lengthAdjust="spacingAndGlyphs">400</tspan><tspan x="444">年</tspan></text>
  </g>
  <line x1="81" y1="57" x2="460" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- 年数の柱 -->
  <g>
    <rect x="245" y="146" width="5.5" height="202"/>
    <rect x="250.5" y="147" width="10.5" height="200" fill="#A0F08A"/>
    <path d="M231,147 H267 M231,347 H267" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <rect x="404" y="146" width="5.5" height="202"/>
    <rect x="409.5" y="147" width="10.5" height="200" fill="#A0F08A"/>
    <path d="M391,147 H427 M392,347 H427" fill="none" stroke="currentColor" stroke-width="2.2"/>
  </g>

  <!-- 人物と札 -->
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="340" cy="145.5" rx="52.5" ry="19.5" fill="#fff" class="paper"/>
    <ellipse cx="342" cy="348.5" rx="52.5" ry="19.5" fill="#F8F28F"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="341.5" textLength="85.6" lengthAdjust="spacing" y="145.5" font-size="26">マラキ</text>
    <text x="341.5" textLength="81.6" lengthAdjust="spacing" y="349" font-size="26" fill="#111">イエス</text>
  </g>
  <g stroke="currentColor" stroke-width="2.6">
    <rect x="127" y="113" width="105" height="65" fill="#fff" class="paper"/>
    <rect x="122" y="297" width="110" height="98" fill="#fff" class="paper"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="181" textLength="84.2" lengthAdjust="spacing" y="131.5" font-size="22">カナンへ</text>
    <text x="180" textLength="48.3" lengthAdjust="spacing" y="160" font-size="23">復帰</text>
    <text x="173" textLength="82.1" lengthAdjust="spacing" y="320.5" font-size="21">ヨセフを</text>
    <text x="172" textLength="84" lengthAdjust="spacing" y="347" font-size="21">訪ねて、</text>
    <text x="178" textLength="94" lengthAdjust="spacing" y="373.5" font-size="20">エジプトへ</text>
    <text x="221" textLength="35.1" lengthAdjust="spacingAndGlyphs" y="246.5" font-size="31">40</text>
    <text x="372.5" textLength="50" lengthAdjust="spacingAndGlyphs" y="247" font-size="30">400</text>
  </g>

  <!-- 説明の箱 -->
  <rect x="437" y="107" width="260" height="274" rx="7" fill="#fff" class="paper"/>
  <path d="M437,155.5 V114 Q437,107 444,107 H690 Q697,107 697,114 V155.5 Z" fill="#CDF8F7"/>
  <line x1="437" y1="155.5" x2="697" y2="155.5" stroke="currentColor" stroke-width="2.6"/>
  <rect x="437" y="107" width="260" height="274" rx="7" fill="none" stroke="currentColor" stroke-width="2.6"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="568.5" textLength="233.7" lengthAdjust="spacing" y="132" font-size="27" fill="#111">メシヤ降臨準備時代</text>
    <text x="523" textLength="106.6" lengthAdjust="spacing" y="195.5" font-size="26">神殿理想</text>
  </g>
  <g>
    <circle cx="456" cy="195.5" r="7"/>
    <circle cx="456.5" cy="317" r="7"/>
  </g>
  <path d="M466,218 Q442,246.5 466,275 M675,218 Q699,246.5 675,275" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <g text-anchor="middle" dominant-baseline="central" font-weight="400">
    <text x="571.5" textLength="209.1" lengthAdjust="spacing" y="231.5" font-size="21">モーセの第三次路程の</text>
    <text y="260" font-size="21"><tspan x="487.5" textLength="41.1" lengthAdjust="spacingAndGlyphs">荒野</tspan><tspan x="523" textLength="22.1" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="592.5" textLength="107.1" lengthAdjust="spacing">年横的復帰</tspan></text>
    <text x="563" textLength="184.6" lengthAdjust="spacing" y="317" font-size="26">サウル王の不信</text>
    <text x="550.5" textLength="155.6" lengthAdjust="spacing" y="349" font-size="26">によって失敗</text>
  </g>
</svg>
