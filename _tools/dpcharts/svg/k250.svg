<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>民族的な実体基台</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="175.5,181 175.5,123 171,123 179.5,107 188,123 183.5,123 183.5,181"/>
    <polygon points="552,209.5 258,209.5 258,204 242.5,213 258,222 258,216.5 552,216.5"/>
    <polygon points="391.5,315 402,315 402,326 412,326 396.5,338 381,326 391.5,326"/>
  </g>

  <!-- 神 -->
  <circle cx="180" cy="67" r="34.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="180" y="68" font-size="40" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- モーセとイスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="179.5" cy="212.5" rx="55.5" ry="31.5" fill="#F8F28F"/>
    <ellipse cx="620.5" cy="213" rx="68.5" ry="43" fill="#F86D42"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="179" y="213" textLength="84" lengthAdjust="spacing">モーセ</text>
    <text x="621" y="197.5" textLength="122" lengthAdjust="spacingAndGlyphs">イスラエル</text>
    <text x="621" y="234" textLength="58" lengthAdjust="spacing">民族</text>
  </g>

  <!-- 字 -->
  <g font-size="28" dominant-baseline="central">
    <text x="262" y="250.5" textLength="270" lengthAdjust="spacing">「堕落性を脱ぐための</text>
    <text x="269" y="284.5" textLength="245" lengthAdjust="spacing">民族的な蕩減条件」</text>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="127" y="284" textLength="101" lengthAdjust="spacing">（アベル）</text>
    <text x="567" y="284" textLength="102" lengthAdjust="spacing">（カイン）</text>
  </g>

  <!-- 民族的な実体基台 -->
  <rect x="256.5" y="358" width="285" height="47" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="274" y="381" font-size="31" dominant-baseline="central" textLength="251" lengthAdjust="spacing" fill="#111">民族的な実体基台</text>
</svg>
