<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスの審判のみ言と、一番弟子の位置を失った洗礼ヨハネ</title>

  <!-- 行頭の● -->
  <circle cx="163" cy="185" r="19.5"/>
  <circle cx="163" cy="1002" r="19.5"/>
  <circle cx="163" cy="1434.5" r="19.5"/>

  <!-- 本文（字ごとに元の位置へ。細字の所は font-weight 400、太字の所はゴシック） -->
  <g font-size="86" text-anchor="middle" dominant-baseline="central">
    <text y="184.5"><tspan x="246.5 339.0 425.5 517.0 605.0 697.0 783.5 872.5 960.5 1051.0 1140.5 1206.5 1313.5 1403.5 1493.0 1560.0 1652.0" font-weight="400">イエスの悲しい心情から、ついに、『</tspan><tspan x="1709.0 1796.0 1882.0 1967.5 2054.0 2137.5 2225.0 2311.0 2397.5 2483.0 2569.5 2653.0 2722.5" font-size="80">わたしにつまずかない者は、</tspan></text>
    <text y="313.5"><tspan x="249.5 336.5 423.0 511.0 596.5 685.5 772.5" font-size="80">さいわいである</tspan><tspan x="831.0 928.0 988.0 1071.5 1148.5 1189.0 1238.0 1277.5 1321.0 1371.0 1409.5 1524.0 1614.0 1704.0 1796.0 1884.5 1975.0 2065.0 2155.5 2246.0 2336.0 2427.0 2518.5 2607.0 2696.0" font-weight="400">』（マタイ 11：6）という審判のみ言が吐かれたの</tspan></text>
    <text y="441.5"><tspan x="252.0 341.0 430.5 500.5" font-weight="400">である。</tspan><tspan x="606.0 694.0 783.0 868.5 957.0 1041.0 1129.0 1217.5 1305.0 1392.0 1480.0 1566.5 1653.5 1742.0 1829.5 1917.0 1983.5 2088.0 2176.5 2262.5 2350.0 2436.5 2524.0 2611.5 2698.5" font-size="80">洗礼ヨハネは当時のユダヤ人たちが、メシヤと考えるく</tspan></text>
    <text y="569.5"><tspan x="251.5 337.0 424.5 512.0 599.5 687.5 775.0 861.5 951.0 1040.0 1127.0 1194.5 1300.0 1387.0 1476.0 1542.5 1648.0 1736.0 1825.5 1912.5 1999.5 2086.5 2172.5 2262.5 2351.0 2438.5 2525.5 2593.5 2698.5" font-size="80">らいに立派な人であった。しかし、そのような者であっても、自</tspan></text>
    <text y="698.5"><tspan x="248.5 356.0 420.0 509.0 598.0 662.5 772.0 860.0 946.5 1035.0 1123.5 1211.0 1298.5 1386.0 1472.0 1561.5 1649.0 1737.0 1825.0 1913.0 2000.0 2088.0 2174.0 2263.5 2352.0 2438.0 2506.0 2611.5 2698.5" font-size="80">分（イエス）につまずいた者には何の幸いがあるだろうか、と審</tspan></text>
    <text y="826.5"><tspan x="249.0 334.5 418.5 504.0 588.0 671.0 757.5 842.5 910.0" font-size="80">判されたのである。</tspan></text>
    <text y="1002.5"><tspan x="247.0 339.5 426.0 513.0 597.5 685.5 775.5 863.0 951.0 1037.0 1123.5 1211.5 1303.0 1386.0 1475.0 1563.0 1631.5 1739.5 1824.0 1913.0 2000.5 2088.5 2175.0 2262.0 2351.0 2437.0 2523.0 2611.5 2697.5" font-weight="400">メシヤを直接に証した洗礼ヨハネは、間接的に証言をしたいかな</tspan></text>
    <text y="1130.5"><tspan x="250.0 340.0 428.5 516.5 603.5 692.5 780.5 867.5 956.5 1046.0 1133.0 1220.5 1311.0 1378.5 1487.5 1574.5 1663.5 1728.5" font-weight="400">る預言者よりも偉大であった。しかし、</tspan><tspan x="1835.0 1922.5 2007.5 2093.5 2180.0 2267.0 2353.0 2440.0 2525.5 2613.5 2698.5" font-size="80">メシヤに仕えるという使</tspan></text>
    <text y="1259.0"><tspan x="249.0 334.0 421.0 503.5 588.0 673.5 757.5 825.0 927.0 1010.0 1097.0 1181.5 1266.5 1351.5 1436.0 1520.5 1603.5 1690.5 1777.5 1859.5 1944.5 2029.5 2114.5 2199.5 2284.0 2369.0 2454.0 2520.5" font-size="80">命から見たとき、彼は一番小さい者であらざるを得なかった。</tspan></text>
    <text y="1434.0"><tspan x="231.0" font-weight="400">『</tspan><tspan x="289.0 376.0 460.5 548.0 633.5 719.0 807.0 891.5 978.0 1064.0 1149.5 1236.0 1324.5 1407.5 1494.0 1580.0 1666.5 1751.5 1836.5 1906.5 2009.0 2095.5 2179.5 2268.0 2355.0 2439.5 2526.5 2612.0 2698.5" font-size="80">バプテスマのヨハネの時から今に至るまで、天国は激しく襲われ</tspan></text>
    <text y="1563.0"><tspan x="249.5 336.5 423.5 491.5 596.0 684.0 771.0 858.0 946.0 1031.5 1119.5 1208.0 1293.5 1381.0 1468.5 1557.0 1643.0 1730.5 1817.5 1905.0 1992.0 2079.0 2167.0 2255.0 2341.5 2428.5" font-size="80">ている。そして激しく襲う者たちがそれを奪い取っている</tspan><tspan x="2487.0 2606.0 2696.0" font-weight="400">』と記</tspan></text>
    <text y="1691.0"><tspan x="251.5 342.5 436.0 525.0 614.5 705.5 797.0 887.0 955.5 1070.0 1155.5 1248.0 1340.0 1406.5 1518.0 1609.5 1700.0 1791.5 1882.0 1972.5 2063.0 2155.0 2244.0 2337.0 2427.0 2519.0 2585.5 2692.0" font-weight="400">録されているのは、ヨハネが、使命を果たさなかったので、イ</tspan></text>
    <text y="1819.5"><tspan x="250.0 339.5 432.0 523.0 613.5 703.0 794.5 885.0 975.0 1066.5 1156.0 1247.5 1338.5 1428.5 1520.0 1608.5 1702.0 1793.5 1882.0 1974.0 2059.5 2152.0 2244.5 2334.0 2424.5 2514.5 2606.5 2696.0" font-weight="400">エスの一番弟子の位置はペテロに奪われてしまったということ</tspan></text>
    <text y="1948.5"><tspan x="252.0 339.5 427.5 513.0 600.5 670.0" font-weight="400">を意味する。</tspan></text>
    <!-- 襲のルビ -->
    <text y="1371" font-size="42"><tspan x="2505.5 2548">おそ</tspan></text>
  </g>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="5.5">
    <line x1="1748" y1="373.5" x2="2198" y2="373.5"/>
    <line x1="815" y1="757" x2="2481" y2="757"/>
    <line x1="1079" y1="1062.5" x2="1519" y2="1062.5"/>
    <line x1="1055" y1="1317.5" x2="1563" y2="1317.5"/>
    <line x1="814" y1="1621.5" x2="2472" y2="1621.5"/>
    <line x1="476" y1="1880" x2="1109" y2="1880"/>
  </g>
</svg>
