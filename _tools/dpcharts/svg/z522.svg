<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. キリスト教を信じて他界した霊人たちの再臨復活　(1) 長成再臨復活</title>
  <defs>
    <!-- 霊界の層の帯（下から上へ淡くなる） -->
    <linearGradient id="z522-sk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ECB970"/>
      <stop offset="0.5" stop-color="#F4D0A0"/>
      <stop offset="1" stop-color="#FEF1E0"/>
    </linearGradient>
    <clipPath id="z522-in"><rect x="169" y="313" width="963" height="175.5"/></clipPath>
    <marker id="z522-ak" viewBox="0 0 20 20" refX="17" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.5 L20,10 L0,19.5 z" fill="#111"/>
    </marker>
    <marker id="z522-ac" viewBox="0 0 20 20" refX="17" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.5 L20,10 L0,19.5 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="49.3" y="60" font-size="46" dominant-baseline="central">2.</text>
  <text x="109.5" y="58.2" font-size="48" dominant-baseline="central" textLength="844" lengthAdjust="spacingAndGlyphs">キリスト教を信じて他界した霊人たちの再臨復活</text>
  <line x1="107" y1="89" x2="954" y2="89" stroke="currentColor" stroke-width="3"/>
  <text x="101.7" y="127" font-size="44" dominant-baseline="central">（1）</text>
  <text x="185" y="126.3" font-size="43" dominant-baseline="central" textLength="272" lengthAdjust="spacing">長成再臨復活</text>
  <line x1="184" y1="156" x2="458" y2="156" stroke="currentColor" stroke-width="3"/>

  <!-- 霊界の層 -->
  <rect x="169" y="313" width="963" height="175.5" fill="url(#z522-sk)"/>
  <g stroke-width="4.5">
    <line x1="201" y1="185" x2="1094" y2="185" stroke="currentColor"/>
    <line x1="201" y1="285" x2="1094" y2="285" stroke="currentColor"/>
    <line x1="201" y1="385" x2="1094" y2="385" stroke="#111"/>
    <line x1="201" y1="486" x2="1094" y2="486" stroke="#111"/>
  </g>

  <!-- 札 -->
  <rect x="188" y="412" width="168" height="51" rx="5" fill="#FCE5E3"/>
  <text x="275.5" y="436.8" font-size="38" text-anchor="middle" dominant-baseline="central" fill="#111">霊形体級</text>
  <rect x="476" y="311" width="185" height="52" rx="5" fill="#F8F28F"/>
  <text x="570.5" y="336.3" font-size="40" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="166" lengthAdjust="spacing">生命体級</text>

  <!-- アブラハム -->
  <ellipse cx="406" cy="437" rx="37.5" ry="49" fill="#FCE5E3" stroke="#111" stroke-width="4"/>
  <line x1="406" y1="486" x2="406" y2="391" stroke="#111" stroke-width="6.5" marker-end="url(#z522-ak)"/>

  <!-- イエス（上の端は帯の外なので線を分ける） -->
  <ellipse cx="718.5" cy="386" rx="53" ry="100" fill="#F8F28F" stroke="currentColor" stroke-width="4.5"/>
  <ellipse cx="718.5" cy="386" rx="53" ry="100" fill="none" stroke="#111" stroke-width="4.5" clip-path="url(#z522-in)"/>
  <ellipse cx="718.75" cy="435" rx="20.25" ry="48" fill="#FCE5E3" stroke="#111" stroke-width="4"/>
  <line x1="718.5" y1="387" x2="718.5" y2="293" stroke="#111" stroke-width="6" marker-end="url(#z522-ak)"/>

  <!-- 霊人（△）と地上の聖徒（○） -->
  <g fill="#FCE5E3" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="461.5,392.5 450,405 473,405" stroke="#111"/>
    <polygon points="502,392.5 490.5,405 513.5,405" stroke="#111"/>
    <polygon points="854,293.5 842.5,306 865.5,306" stroke="currentColor"/>
    <polygon points="894.5,293.5 883,306 906,306" stroke="currentColor"/>
  </g>
  <g fill="#F8F28F" stroke-width="2.5">
    <circle cx="854" cy="322.5" r="7" stroke="#111"/>
    <circle cx="894" cy="322.5" r="7" stroke="#111"/>
    <circle cx="861" cy="504.5" r="7" stroke="currentColor"/>
    <circle cx="861" cy="527.5" r="7" stroke="currentColor"/>
  </g>

  <!-- 霊人が地上の聖徒に再臨する矢印（帯の中は #111、外は currentColor） -->
  <g stroke-width="6.5" fill="none">
    <line x1="462.5" y1="414.5" x2="842.1" y2="522.9" stroke="currentColor" marker-end="url(#z522-ac)"/>
    <line x1="503" y1="413.5" x2="843.1" y2="500.5" stroke="currentColor" marker-end="url(#z522-ac)"/>
    <line x1="854" y1="494" x2="854" y2="336" stroke="currentColor"/>
    <line x1="872" y1="494" x2="890.6" y2="336" stroke="currentColor"/>
    <g stroke="#111" clip-path="url(#z522-in)">
      <line x1="462.5" y1="414.5" x2="842.1" y2="522.9"/>
      <line x1="503" y1="413.5" x2="843.1" y2="500.5"/>
      <line x1="854" y1="494" x2="854" y2="336" marker-end="url(#z522-ak)"/>
      <line x1="872" y1="494" x2="890.6" y2="336" marker-end="url(#z522-ak)"/>
    </g>
  </g>

  <!-- （楽園）は帯の上の端にかかるので、帯の中だけ #111 で重ねる -->
  <text y="316.5" font-size="38" text-anchor="middle" dominant-baseline="central"><tspan x="926.5">（</tspan><tspan x="975.5">楽園</tspan><tspan x="1025">）</tspan></text>
  <text y="316.5" font-size="38" text-anchor="middle" dominant-baseline="central" fill="#111" clip-path="url(#z522-in)"><tspan x="926.5">（</tspan><tspan x="975.5">楽園</tspan><tspan x="1025">）</tspan></text>

  <g font-size="37" text-anchor="middle" dominant-baseline="central">
    <text x="855.5" y="569">長成</text>
    <text x="855.5" y="610.5">再臨復活</text>
  </g>

  <!-- 縦の札 -->
  <rect x="379.5" y="505.5" width="53" height="159" fill="#FCE5E3" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="407" y="529.5">ア</text>
    <text x="407" y="556.5">ブ</text>
    <text x="407" y="585.5">ラ</text>
    <text x="407" y="613.5">ハ</text>
    <text x="407" y="641">ム</text>
  </g>
  <rect x="694" y="506.5" width="49.5" height="113.5" fill="#F8F28F" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="32" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="718.5" y="529.5">イ</text>
    <text x="718.5" y="563">エ</text>
    <text x="718.5" y="597">ス</text>
  </g>
</svg>
