    </g>
  </g>

  <!-- 南韓と北韓 -->
  <g stroke="currentColor" stroke-width="2.5">
    <rect x="506" y="90" width="90" height="41.5" fill="#fff" class="paper"/>
    <rect x="505.5" y="320" width="90.5" height="43" fill="#fff" class="paper"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="549.5" y="110.5" textLength="61" lengthAdjust="spacing">南韓</text>
    <text x="549.5" y="341.5" textLength="61" lengthAdjust="spacing">北韓</text>
