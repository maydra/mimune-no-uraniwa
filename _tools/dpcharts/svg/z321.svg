<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>地獄　神と人間、人間どうしの関係が切れた地上地獄から天上地獄へ　隣人を害するような行為を行う</title>

  <!-- 神と人間、人間どうしをつなぐ線（円の下に描く） -->
  <g stroke="currentColor">
    <line x1="552.6" y1="118" x2="364.4" y2="428" stroke-width="9"/>
    <line x1="557" y1="118" x2="557" y2="428" stroke-width="9"/>
    <line x1="560" y1="118" x2="740.2" y2="428" stroke-width="9"/>
    <line x1="373" y1="426" x2="557" y2="426" stroke-width="9"/>
    <line x1="557" y1="428" x2="744" y2="428" stroke-width="13"/>
  </g>
  <!-- 切れたしるしの × -->
  <g stroke="currentColor" stroke-width="6.5">
    <line x1="410.5" y1="296.5" x2="486" y2="283.5"/>
    <line x1="428.5" y1="257.5" x2="467.5" y2="324"/>
    <line x1="530" y1="275.5" x2="585" y2="312.5"/>
    <line x1="530" y1="312" x2="585" y2="275"/>
    <line x1="624" y1="280.5" x2="693" y2="290.5"/>
    <line x1="676.5" y1="255.5" x2="640" y2="316.5"/>
    <line x1="445.5" y1="400.5" x2="480" y2="454.5"/>
    <line x1="479.5" y1="400" x2="446.5" y2="454.5"/>
    <line x1="635" y1="402.5" x2="664.5" y2="453.5"/>
    <line x1="665" y1="402.5" x2="635" y2="453.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="556.5" cy="118" rx="63.5" ry="61.5" fill="#fff" class="paper"/>
    <g fill="#CF921C">
      <ellipse cx="373" cy="428" rx="52" ry="46"/>
      <ellipse cx="557" cy="428" rx="52" ry="46"/>
      <ellipse cx="744" cy="428" rx="52" ry="46"/>
    </g>
  </g>
  <text x="553.5" y="116.5" font-size="70" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="41" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="373.5" y="428.5">人間</text>
    <text x="557.25" y="428">人間</text>
    <text x="744.5" y="428.5">人間</text>
  </g>
  <text x="257" y="429" font-size="50" text-anchor="middle" dominant-baseline="central">地獄</text>

  <!-- 地上地獄 → 天上地獄 -->
  <g font-size="58" dominant-baseline="central">
    <text x="863.4" y="129.5" textLength="232.8" lengthAdjust="spacing">天上地獄</text>
    <text x="863.4" y="428" textLength="232.8" lengthAdjust="spacing">地上地獄</text>
  </g>
  <polygon points="979.5,191.5 996,219 985.5,219 985.5,366.5 973.5,366.5 973.5,219 963,219" fill="#8C949A"/>

  <rect x="233" y="546" width="820" height="78" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="282.8" y="585" font-size="52" dominant-baseline="central" fill="#111" textLength="733.9" lengthAdjust="spacing">隣人を害するような行為を行う</text>
</svg>
