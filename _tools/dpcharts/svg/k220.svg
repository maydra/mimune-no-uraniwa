<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天使をサタンの立場に立てられ、ヤコブを試練　天使に対する主管性を復帰　天使世界も復帰されていく</title>

  <g font-size="26.8" dominant-baseline="central">
    <text x="128" y="80" textLength="376" lengthAdjust="spacing">天使をサタンの立場に立てられ</text>
    <text x="504" y="80">、</text>
    <text x="530.8" y="80" textLength="161" lengthAdjust="spacing">ヤコブを試練</text>
  </g>

  <!-- ● -->
  <circle cx="182" cy="188" r="6.5"/>
  <circle cx="182" cy="290" r="6.5"/>

  <g font-size="28.5" dominant-baseline="central">
    <text x="201" y="187" textLength="347" lengthAdjust="spacing">天使に対する主管性を復帰</text>
    <text x="200.5" y="290" textLength="201" lengthAdjust="spacing">天使世界も復帰</text>
    <text x="404.6" y="290" textLength="138" lengthAdjust="spacing">されていく</text>
  </g>
</svg>
