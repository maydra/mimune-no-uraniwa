<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>三大奇跡は、何を予示したのであろうか？　『第一の奇跡（出エ 4：3～5）』</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="33" y="37.5" textLength="150" lengthAdjust="spacing">三大奇跡は</text>
    <text x="182" y="37.5">、</text>
    <text x="212" y="37.5" textLength="360" lengthAdjust="spacing">何を予示したのであろうか</text>
    <text x="587" y="37.5" text-anchor="middle">？</text>
  </g>
  <line x1="32" y1="56.5" x2="601" y2="56.5" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="28" dominant-baseline="central">
    <text x="145" y="82.5" text-anchor="end">『</text>
    <text x="145" y="82.5" textLength="144" lengthAdjust="spacing">第一の奇跡</text>
    <text x="297" y="82.5" textLength="61" lengthAdjust="spacingAndGlyphs">(出エ</text>
    <text x="372" y="82.5" text-anchor="middle">4</text>
    <text x="388.5" y="82.5" text-anchor="middle">：</text>
    <text x="405" y="82.5" text-anchor="middle">3</text>
    <text x="431" y="82.5" text-anchor="middle">～</text>
    <text x="452" y="82.5" textLength="21" lengthAdjust="spacingAndGlyphs">5)</text>
    <text x="478" y="82.5">』</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="184.5,165 189.5,165 189.5,182 194,182 187,193.5 180,182 184.5,182"/>
    <polygon points="331,167 336,167 336,182 340.5,182 333.5,193.5 326.5,182 331,182"/>
    <polygon points="184,265 189,265 189,285 193.5,285 186.5,296.5 179.5,285 184,285"/>
    <polygon points="331,266 336,266 336,284 340.5,284 333.5,295.5 326.5,284 331,284"/>
    <polygon points="487,174 492,174 492,284 496.5,284 489.5,295.5 482.5,284 487,284"/>
    <polygon points="223,324 282,324 282,320 295.5,326.5 282,333 282,329 223,329"/>
    <polygon points="548,324.5 593,324.5 593,320 606.5,327 593,334 593,329.5 548,329.5"/>
    <polygon points="413.5,223.5 438,223.5 438,209 462,232.5 438,256 438,241.5 413.5,241.5"/>
  </g>

  <!-- モーセの側（白） -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="187" cy="145" rx="51.5" ry="20.5"/>
    <ellipse cx="186" cy="232" rx="58" ry="33"/>
    <circle cx="186.5" cy="324" r="24.5"/>
    <circle cx="489.5" cy="149.5" r="25"/>
    <ellipse cx="491" cy="325.5" rx="55.5" ry="22.5"/>
  </g>
  <!-- パロの側（茶） -->
  <g fill="#CF921C" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="334" cy="144.5" rx="52.5" ry="23"/>
    <ellipse cx="333.5" cy="233" rx="58" ry="33"/>
    <circle cx="333.5" cy="323.5" r="24.5"/>
    <ellipse cx="651.5" cy="326" rx="42" ry="37.5"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="185.5" y="144.5" font-size="26" textLength="74" lengthAdjust="spacing">モーセ</text>
    <text x="187.5" y="219.5" font-size="24" textLength="65" lengthAdjust="spacing">アロン</text>
    <text x="188" y="246.5" font-size="24" textLength="45" lengthAdjust="spacing">の杖</text>
    <text x="186" y="324.5" font-size="29">蛇</text>
    <text x="489.5" y="149.5" font-size="30">神</text>
    <text x="490" y="325.5" font-size="27" textLength="81" lengthAdjust="spacing">イエス</text>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="333" y="144" font-size="26" textLength="53" lengthAdjust="spacing">パロ</text>
    <text x="333.5" y="220.5" font-size="24" textLength="70" lengthAdjust="spacing">魔術師</text>
    <text x="334" y="247" font-size="24" textLength="45" lengthAdjust="spacing">の杖</text>
    <text x="333" y="322.5" font-size="29">蛇</text>
    <text x="651" y="316.5" font-size="24" textLength="69" lengthAdjust="spacing">サタン</text>
    <text x="651.5" y="341.5" font-size="24" textLength="46" lengthAdjust="spacing">世界</text>
  </g>

  <g font-size="20" dominant-baseline="central">
    <text x="210" y="301.5" textLength="97" lengthAdjust="spacing">のみ尽くす</text>
    <text x="543" y="297.5" textLength="62" lengthAdjust="spacing">滅ぼす</text>
  </g>

  <!-- 杖 -->
  <g font-size="28" dominant-baseline="central">
    <text x="130" y="397">杖</text>
    <text x="167" y="397" text-anchor="middle">(</text>
    <text x="174" y="397" textLength="86" lengthAdjust="spacing">支え人</text>
    <text x="258" y="397">、</text>
    <text x="287" y="397" textLength="86" lengthAdjust="spacing">保護者</text>
    <text x="373" y="397">、</text>
    <text x="402" y="397" textLength="115" lengthAdjust="spacing">道案内人</text>
    <text x="521.5" y="397" text-anchor="middle">)</text>
    <text x="544.5" y="397" text-anchor="middle">：</text>
    <text x="561" y="397" textLength="142" lengthAdjust="spacing">イエス象徴</text>
  </g>
</svg>
