<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>二番目の鳩：第二のアダム イエス象徴</title>

  <!-- 上と下の矢印 -->
  <g fill="#8C949A">
    <polygon points="226,67 233,67 233,107.5 238,107.5 229.5,120.5 221,107.5 226,107.5"/>
    <polygon points="226,211 233,211 233,352.5 238,352.5 229.5,365.5 221,352.5 226,352.5"/>
  </g>

  <!-- 二番目の鳩 -->
  <ellipse cx="229.5" cy="166.5" rx="98.5" ry="33" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="226" y="166.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">二番目の鳩</text>

  <text y="167" font-size="30" dominant-baseline="central"><tspan x="345" textLength="168" lengthAdjust="spacing">第二のアダム</tspan> <tspan x="530" textLength="141" lengthAdjust="spacing">イエス象徴</tspan></text>
  <g font-size="27" font-weight="400" dominant-baseline="central">
    <text y="220.5"><tspan x="267" textLength="190" lengthAdjust="spacing">オリーブの若葉</tspan>、<tspan x="476" textLength="208" lengthAdjust="spacing">箱舟に帰ってきた</tspan></text>
    <text x="311" y="268" textLength="340" lengthAdjust="spacing">十字架にかかって死なれ再臨</text>
  </g>
  <line x1="271" y1="268" x2="292" y2="268" stroke="currentColor" stroke-width="3"/>
</svg>
