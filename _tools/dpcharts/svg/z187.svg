<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>霊人体の構成とその機能</title>

  <text x="51" y="78" font-size="46">2.</text>
  <text x="112" y="79" font-size="48" textLength="549" lengthAdjust="spacing">霊人体の構成とその機能</text>
  <line x1="112" y1="89" x2="661" y2="89" stroke="currentColor" stroke-width="3"/>

  <!-- 霊人体から各項目へ -->
  <g stroke="#8C949A" stroke-width="10" fill="none">
    <path d="M496,169 H450.5 V496 H496"/>
    <path d="M496,248.5 H450.5 M385,332.5 H496 M496,417.5 H450.5"/>
  </g>

  <!-- 人（100×240 の型を置く） -->
  <g transform="translate(238.5,170.3) scale(1.58)" fill="#FCE6E5" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
    <circle cx="50" cy="22" r="19"/>
  </g>
  <text x="313" y="597" font-size="48" text-anchor="middle" dominant-baseline="central">霊人体</text>

  <g font-size="46" dominant-baseline="central">
    <text x="503" y="167">肉身の主体、霊感で感得</text>
    <text x="503" y="250.5">神と直接通ずる</text>
    <text x="503" y="334">無形実体としての実存体</text>
    <text x="503" y="417">肉身と同一の様相</text>
    <text x="503" y="501">無形世界で永存</text>
  </g>

  <rect x="473" y="553" width="319" height="79" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="630" y="592" font-size="48" text-anchor="middle" dominant-baseline="central" fill="#111">永存を念願</text>
</svg>
