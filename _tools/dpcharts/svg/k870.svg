<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>今日のキリスト教指導者たち</title>

  <!-- 題 -->
  <text x="49 80.5 112 143.5 175 206.5 238 269.5 301 332.5 364 395.5 427" y="36" font-size="30" text-anchor="middle" dominant-baseline="central">今日のキリスト教指導者たち</text>
  <line x1="33" y1="55" x2="443" y2="55" stroke="currentColor" stroke-width="3"/>

  <!-- キリスト教指導者 -->
  <ellipse cx="235.5" cy="200.5" rx="58.5" ry="56.5" fill="#F86D42" stroke="currentColor" stroke-width="3"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="237.5" y="183" textLength="94" lengthAdjust="spacingAndGlyphs">キリスト教</text>
    <text x="236" y="225" textLength="84" lengthAdjust="spacing">指導者</text>
  </g>

  <!-- かっこ -->
  <path d="M331,116.5 C320,119 315.5,122 315.5,130 L315.5,270 C315.5,278 320,281 331,283.5" fill="none" stroke="currentColor" stroke-width="4"/>

  <!-- 箇条 -->
  <g>
    <circle cx="339" cy="135" r="6.5"/>
    <circle cx="339" cy="179.5" r="6.5"/>
    <circle cx="339" cy="222.5" r="6.5"/>
    <circle cx="339" cy="266.5" r="6.5"/>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="352" y="134.5" textLength="142" lengthAdjust="spacing">霊的な無知</text>
    <text x="352" y="179" textLength="228" lengthAdjust="spacing">聖書の知識を誇る</text>
    <text x="352" y="223" textLength="230" lengthAdjust="spacing">職権の行使に満足</text>
    <text x="352" y="267" textLength="259" lengthAdjust="spacing">神の摂理は知らない</text>
  </g>

  <!-- 痛ましいこと -->
  <rect x="358" y="315" width="240" height="57" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="393.5 428 463 497 531 564.5" y="343.5" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#111">痛ましいこと</text>
</svg>
