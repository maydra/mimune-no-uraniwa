<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>a 第一次幕屋のための基台</title>

  <!-- 題 -->
  <circle cx="48.5" cy="36" r="13.8" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <text x="48.5" y="35" font-size="22" text-anchor="middle" dominant-baseline="central">a</text>
  <text x="73" y="36" font-size="31" dominant-baseline="central" textLength="345" lengthAdjust="spacing">第一次幕屋のための基台</text>
  <line x1="72" y1="55" x2="419" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="263,157 270.5,169.5 265.6,169.5 265.6,249 260.4,249 260.4,169.5 255.5,169.5"/>
    <polygon points="317.5,273 330.5,265.5 330.5,270.5 546,270.5 546,275.6 330.5,275.6 330.5,280.5"/>
  </g>

  <!-- 神 -->
  <circle cx="264" cy="120" r="31.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="263" y="119.5" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 信仰基台○ -->
  <rect x="147.5" y="165.5" width="95" height="69" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="156" y="185.5" textLength="56" lengthAdjust="spacing">信仰</text>
    <text x="159" y="215" textLength="51" lengthAdjust="spacing">基台</text>
  </g>
  <circle cx="225" cy="215" r="10" fill="none" stroke="currentColor" stroke-width="2.6"/>

  <!-- 40日断食 -->
  <g font-size="26" dominant-baseline="central">
    <text x="275" y="191" textLength="27" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="302" y="191">日</text>
    <text x="276" y="222" textLength="52" lengthAdjust="spacing">断食</text>
  </g>

  <!-- 実体基台：× -->
  <rect x="343.5" y="218.5" width="190" height="41" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="359" y="239" textLength="113" lengthAdjust="spacing">実体基台</text>
    <text x="481.5" y="239" text-anchor="middle">：</text>
  </g>
  <path d="M499,231 L514.5,247 M514.5,231 L499,247" stroke="currentColor" stroke-width="3" fill="none"/>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="263" cy="273" rx="50.5" ry="24" fill="#F8F28F"/>
    <ellipse cx="618" cy="272.5" rx="72.5" ry="36" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="261" y="273" font-size="27" textLength="78" lengthAdjust="spacing">モーセ</text>
    <text x="617" y="261" font-size="26" textLength="120" lengthAdjust="spacing">イスラエル</text>
    <text x="616.5" y="289" font-size="26" textLength="52" lengthAdjust="spacing">民族</text>
  </g>

  <!-- 箇条 -->
  <circle cx="296" cy="323.5" r="6.5"/>
  <circle cx="295" cy="361" r="6.5"/>
  <g font-size="26" dominant-baseline="central">
    <text x="312.5" y="323.5" textLength="205" lengthAdjust="spacing">不信（金の子牛）</text>
    <text x="312" y="361" textLength="338" lengthAdjust="spacing">モーセ　烈火のごとく憤る、</text>
    <text x="312" y="393" textLength="234" lengthAdjust="spacing">石板を壊してしまう</text>
  </g>
</svg>
