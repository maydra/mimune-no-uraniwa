<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅴ. 文芸復興に伴う宗教、政治および産業革命</title>

  <!-- 題 -->
  <g dominant-baseline="central" font-size="28">
    <text y="39"><tspan x="39" textLength="23" lengthAdjust="spacingAndGlyphs">Ⅴ</tspan><tspan x="66">.</tspan></text>
    <text x="83" y="39" textLength="520" lengthAdjust="spacing">文芸復興に伴う宗教、政治および産業革命</text>
  </g>
  <line x1="82" y1="57" x2="604" y2="57" stroke="currentColor" stroke-width="2.5"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="285,156 312,156 312,151 327,160 312,169 312,163 285,163"/>
    <polygon points="488,156 516,156 516,151 532,160 516,169 516,163 488,163"/>
    <polygon points="286,267 315,267 315,263 329,271 315,279 315,275 286,275"/>
    <polygon points="489,267 516,267 516,263 529,271 516,279 516,275 489,275"/>
  </g>

  <!-- 思想の箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="131.5" y="135.5" width="152" height="49"/>
    <rect x="334.5" y="135.5" width="152" height="49"/>
    <rect x="537.5" y="135.5" width="151" height="49"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="208" y="160" textLength="124" lengthAdjust="spacing">人本主義</text>
    <text x="410" y="160" textLength="124" lengthAdjust="spacing">啓蒙思想</text>
    <text x="613" y="160" textLength="124" lengthAdjust="spacing">共産主義</text>
  </g>

  <!-- 文芸復興の楕円 -->
  <g fill="#F86D42" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="207.5" cy="270.5" rx="76.75" ry="57.75"/>
    <ellipse cx="410.5" cy="270.5" rx="76.75" ry="57.75"/>
    <ellipse cx="613.5" cy="270.5" rx="76.75" ry="57.75"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="207.5" y="252.5" textLength="93" lengthAdjust="spacing">第一次</text>
    <text x="207.5" y="289" textLength="125" lengthAdjust="spacing">文芸復興</text>
    <text x="410" y="252.5" textLength="92" lengthAdjust="spacing">第二次</text>
    <text x="410" y="289" textLength="124" lengthAdjust="spacing">文芸復興</text>
    <text x="613" y="252.5" textLength="94" lengthAdjust="spacing">第三次</text>
    <text x="613" y="289" textLength="124" lengthAdjust="spacing">文芸復興</text>
  </g>
</svg>
