<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>創造本然の知情意と創造本然の真美善</title>

  <!-- 題（知 情 意・真 美 善 は元の画像のとおり字間を空ける） -->
  <g font-size="48" dominant-baseline="central">
    <text x="77" y="57" text-anchor="middle">Ⅱ</text>
    <text x="108" y="57" text-anchor="middle">.</text>
    <text x="127" y="56" textLength="268" lengthAdjust="spacing">創造本然の</text>
    <text x="604" y="56" textLength="315" lengthAdjust="spacing">と創造本然の</text>
    <g text-anchor="middle">
      <text x="428" y="56">知</text>
      <text x="496" y="56">情</text>
      <text x="563.5" y="56">意</text>
      <text x="953.5" y="56">真</text>
      <text x="1020.5" y="56">美</text>
      <text x="1088" y="56">善</text>
    </g>
  </g>
  <line x1="127" y1="87" x2="1117" y2="87" stroke="currentColor" stroke-width="3.5"/>

  <!-- 神から人へ -->
  <polygon points="285.5,250 297.5,250 297.5,349 306.5,349 291.5,377 276.5,349 285.5,349" fill="#8C949A"/>
  <!-- 人から心と体へ（円の下に描く） -->
  <polyline points="417.9,358.5 346,435.5 412.8,514" fill="none" stroke="currentColor" stroke-width="9"/>

  <g stroke="currentColor" stroke-width="3.5">
    <circle cx="291.5" cy="203" r="51" fill="#fff" class="paper"/>
    <circle cx="291.5" cy="435" r="51" fill="#FCE5E3"/>
    <circle cx="445.5" cy="358.5" r="51" fill="#F98AEE"/>
    <circle cx="445.5" cy="514" r="51" fill="#A0F08A"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="290" y="202.5" font-size="53">神</text>
    <g fill="#111" font-size="51">
      <text x="291" y="435" font-size="50">人</text>
      <text x="445.5" y="357">心</text>
      <text x="445.5" y="513.5">体</text>
    </g>
  </g>

  <!-- 点線 -->
  <g stroke="currentColor" stroke-width="8" fill="none">
    <line x1="352" y1="204.5" x2="610" y2="204.5" stroke-dasharray="9 8.79"/>
    <line x1="520" y1="358.5" x2="610" y2="358.5" stroke-dasharray="8.5 7.9"/>
    <line x1="520" y1="512.5" x2="610" y2="512.5" stroke-dasharray="8.5 7.9"/>
  </g>

  <!-- 知・情・意（主体） -->
  <g font-size="55" text-anchor="middle" dominant-baseline="central">
    <text x="649" y="203">知</text>
    <text x="763" y="203.5">情</text>
    <text x="877.5" y="203.5">意</text>
    <text x="649" y="359">知</text>
    <text x="763" y="360">情</text>
    <text x="877.5" y="359.5">意</text>
    <text x="650" y="516.5">真</text>
    <text x="763.5" y="516.5">美</text>
    <text x="877.5" y="516">善</text>
  </g>
  <g>
    <circle cx="705.5" cy="203.5" r="7"/>
    <circle cx="819.5" cy="204" r="7"/>
    <circle cx="705.5" cy="360.5" r="7"/>
    <circle cx="819.5" cy="360.5" r="7"/>
    <circle cx="705.5" cy="516.5" r="7"/>
    <circle cx="819.5" cy="516.5" r="7"/>
  </g>

  <!-- （主体）（感応）（行動） -->
  <g font-size="43" dominant-baseline="central">
    <g text-anchor="end">
      <text x="952" y="204">（</text>
      <text x="952" y="360">（</text>
      <text x="952" y="516.5">（</text>
    </g>
    <g text-anchor="middle">
      <text x="996.5" y="204">主体</text>
      <text x="996" y="360">感応</text>
      <text x="995.5" y="516.5">行動</text>
    </g>
    <g text-anchor="start">
      <text x="1039" y="204">）</text>
      <text x="1039" y="360">）</text>
      <text x="1039" y="516.5">）</text>
    </g>
  </g>

  <!-- ↓ -->
  <g>
    <polygon points="646.5,258 654.5,258 654.5,287 660.5,287 650.5,302 640.5,287 646.5,287"/>
    <polygon points="761,258 769,258 769,287 775,287 765,302 755,287 761,287"/>
    <polygon points="873,258 881,258 881,287 887,287 877,302 867,287 873,287"/>
    <polygon points="645.5,416 653.5,416 653.5,446 659.5,446 649.5,461 639.5,446 645.5,446"/>
    <polygon points="759.5,413 767.5,413 767.5,443 773.5,443 763.5,458 753.5,443 759.5,443"/>
    <polygon points="872.5,416 880.5,416 880.5,446 886.5,446 876.5,461 866.5,446 872.5,446"/>
  </g>

  <!-- （価 値） -->
  <g font-size="48" dominant-baseline="central">
    <text x="706" y="588.5" text-anchor="end">（</text>
    <text x="728.5" y="588.5" text-anchor="middle">価</text>
    <text x="803.5" y="588.5" text-anchor="middle">値</text>
    <text x="828" y="588.5">）</text>
  </g>
</svg>
