<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ロマ 8:29〜30　神の責任分担と人間の責任分担</title>

  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="252.5" y="95.5">ロマ</text>
    <text x="365.5" y="93.5" textLength="95" lengthAdjust="spacingAndGlyphs">8:29</text>
    <text x="446" y="93.5" font-size="50">〜</text>
    <text x="503.5" y="93.5" textLength="46" lengthAdjust="spacingAndGlyphs">30</text>
  </g>

  <!-- 上の大きな箱 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="206" y="159" width="238.5" height="226.5" fill="#fff" class="paper"/>
    <rect x="519" y="159.5" width="237.5" height="225.5" fill="#FCE5E3"/>
    <rect x="857" y="158.5" width="239.5" height="227.5" fill="#CDF8F7"/>
  </g>
  <g font-size="44" text-anchor="middle" dominant-baseline="central">
    <text x="324" y="209.5">知って</text>
    <text x="325" y="272">定め</text>
    <text x="323.5" y="335.5">召し</text>
  </g>
  <g font-size="44" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="636.5" y="272.5">義とし</text>
    <text x="975" y="210">栄光を</text>
    <text x="975" y="272">与えて</text>
    <text x="975" y="335.5">下さる</text>
  </g>
  <path d="M478,252H489V270H505V279H489V297H478V279H461V270H478Z"/>
  <polygon points="777,274 813,274 813,264 843,280.5 813,297 813,287 777,287"/>

  <!-- 下の小さな箱 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="203.5" y="398" width="245.5" height="73.5" fill="#fff" class="paper"/>
    <rect x="518" y="398" width="239.5" height="73.5" fill="#fff" class="paper"/>
    <rect x="857.5" y="398" width="238" height="73.5" fill="#CDF8F7"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="3.5">
    <circle cx="246" cy="436.25" r="27.75"/>
    <circle cx="562" cy="435.5" r="27.5"/>
  </g>
  <g font-size="38" text-anchor="middle" dominant-baseline="central">
    <text x="245" y="435.5">神</text>
    <text x="354.5" y="436">責任分担</text>
    <text x="562" y="435">人</text>
    <text x="671.5" y="434.5">責任分担</text>
  </g>
  <text x="977" y="435" font-size="41" text-anchor="middle" dominant-baseline="central" fill="#111">み旨成就</text>

  <rect x="286.5" y="543" width="728.5" height="79" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="650" y="582.5" font-size="45" text-anchor="middle" dominant-baseline="central" textLength="686" lengthAdjust="spacing" fill="#111">人間の責任分担に対するみ言省略</text>
</svg>
