<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>失う・条件（原状どおり名誉、地位、健康／愛しあっていた二人・憎みあう二人）</title>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="250.5,145 257.5,145 257.5,276 262.5,276 254,289 245.5,276 250.5,276"/>
    <polygon points="281.5,297 288.5,297 288.5,171 293.5,171 285,158 276.5,171 281.5,171"/>
    <polygon points="531.5,145 538.5,145 538.5,276 543.5,276 535,289 526.5,276 531.5,276"/>
    <polygon points="563.5,297 570.5,297 570.5,171 575.5,171 567,158 558.5,171 563.5,171"/>
  </g>

  <!-- 上の楕円 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="271" cy="103.5" rx="115" ry="45"/>
    <ellipse cx="546" cy="103.5" rx="115" ry="45.5"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="270.5" y="81" textLength="138" lengthAdjust="spacing">原状どおり</text>
    <text x="269" y="115" textLength="185" lengthAdjust="spacing">名誉、地位、健康</text>
    <text x="547" y="93" textLength="189" lengthAdjust="spacing">愛しあっていた</text>
    <text x="548" y="125.5" textLength="55" lengthAdjust="spacing">二人</text>
  </g>

  <!-- 下の楕円 -->
  <g fill="#CF921C" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="273.5" cy="340" rx="114.5" ry="46"/>
    <ellipse cx="551.5" cy="340.5" rx="114.5" ry="45.5"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="272" y="315.5" textLength="75" lengthAdjust="spacing">失った</text>
    <text x="273" y="350" textLength="185" lengthAdjust="spacing">名誉、地位、健康</text>
    <text x="550" y="323" textLength="111" lengthAdjust="spacing">憎みあう</text>
    <text x="552" y="356.5" textLength="55" lengthAdjust="spacing">二人</text>
  </g>

  <!-- 失う・条件 -->
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="202.5" y="209" textLength="51" lengthAdjust="spacing">失う</text>
    <text x="332" y="208.5" textLength="53" lengthAdjust="spacing">条件</text>
    <text x="613.5" y="205" textLength="52" lengthAdjust="spacing">条件</text>
  </g>
  <g font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="304.5" y="243">（</text>
    <text x="381.5" y="243" textLength="140" lengthAdjust="spacing">努力、財力</text>
    <text x="459.5" y="243">）</text>
    <text x="587.5" y="239.5">（</text>
    <text x="622" y="239.5" textLength="55" lengthAdjust="spacing">謝罪</text>
    <text x="656.5" y="239.5">）</text>
  </g>
</svg>
