<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第二次世界的カナン復帰路程の失敗</title>

  <text x="34" y="37.5" font-size="30" dominant-baseline="central" textLength="27" lengthAdjust="spacingAndGlyphs">3.</text>
  <text x="70" y="37.5" font-size="30" dominant-baseline="central" textLength="502" lengthAdjust="spacing">第二次世界的カナン復帰路程の失敗</text>
  <line x1="68" y1="56.5" x2="574" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="200,171 209,184.5 203.5,184.5 203.5,289 196.5,289 196.5,184.5 191.5,184.5"/>
    <polygon points="425.5,207.5 444.5,227.5 434.5,227.5 434.5,245.5 416.5,245.5 416.5,227.5 406.5,227.5"/>
    <polygon points="271.5,315.5 284.5,306.5 284.5,311.7 532,311.7 532,319.3 284.5,319.3 284.5,324.5"/>
  </g>

  <!-- 神 -->
  <circle cx="200.5" cy="136.5" r="30.7" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <text x="200.5" y="138" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- メシヤのための基台：× -->
  <rect x="251.5" y="145.5" width="346" height="44" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="265" y="167.5" textLength="257" lengthAdjust="spacing">メシヤのための基台</text>
    <text x="537.5" y="167.5" text-anchor="middle">：</text>
  </g>
  <path d="M557.5,157.5 L578,178 M578,157.5 L557.5,178" stroke="#111" stroke-width="4.5"/>

  <!-- 実体基台：× -->
  <rect x="333.5" y="257.5" width="183.5" height="40" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central" font-weight="400">
    <text x="345" y="278" textLength="107" lengthAdjust="spacing">実体基台</text>
    <text x="467.5" y="278" text-anchor="middle">：</text>
  </g>
  <path d="M482,268 L501.5,288 M501.5,268 L482,288" stroke="currentColor" stroke-width="4"/>

  <!-- イエス・ユダヤ民族 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="200" cy="315" rx="66.8" ry="24.8" fill="#F8F28F"/>
    <ellipse cx="613.5" cy="315" rx="81.2" ry="45.7" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="199.5" y="315.5" font-size="28" textLength="89" lengthAdjust="spacing">イエス</text>
    <text x="615" y="299.5" font-size="26" textLength="121" lengthAdjust="spacingAndGlyphs">ユダヤ民族</text>
    <text x="614.5" y="329.5" font-size="19" textLength="131" lengthAdjust="spacingAndGlyphs">（イスカリオテのユダ）</text>
  </g>

  <text x="422" y="343.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="51" lengthAdjust="spacing">不信</text>
  <text x="199" y="360.5" font-size="22" text-anchor="middle" dominant-baseline="central" font-weight="400" textLength="134" lengthAdjust="spacingAndGlyphs">（洗礼ヨハネ）</text>
</svg>
