<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑧ ルカ 17:24　地上誕生</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="34" y="38">⑧</text>
    <text x="72" y="38" textLength="57" lengthAdjust="spacing">ルカ</text>
    <text x="137" y="38" textLength="73" lengthAdjust="spacing">17:24</text>
  </g>

  <!-- 聖句（細字） -->
  <g font-size="26.5" font-weight="400" dominant-baseline="central">
    <text x="160" y="115.5" textLength="491" lengthAdjust="spacing">『いなずまが天の端からひかり出て天の端</text>
    <text y="155.5"><tspan x="171" textLength="293.5" lengthAdjust="spacing">へとひらめき渡るように</tspan><tspan x="464.5">、</tspan><tspan x="491.4" textLength="160" lengthAdjust="spacing">人の子もその</tspan></text>
    <text x="170" y="195" textLength="350" lengthAdjust="spacing">日には同じようであるだろう』</text>
  </g>

  <!-- 地上誕生 -->
  <ellipse cx="225" cy="296.5" rx="86.5" ry="31" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="225.5" y="297.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="126" lengthAdjust="spacing">地上誕生</text>

  <!-- 右の字 -->
  <g font-size="29" dominant-baseline="central">
    <text x="334" y="262" textLength="144" lengthAdjust="spacing">再臨の時に</text>
    <text x="334" y="302" textLength="299" lengthAdjust="spacing">交通と通信機関発達で</text>
    <text x="334" y="341" textLength="260" lengthAdjust="spacing">稲妻のように一瞬の</text>
    <text x="336" y="381" textLength="259" lengthAdjust="spacing">うちに東西間を往来</text>
  </g>
</svg>
