<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>預言者・烈士と復帰摂理担当人物（再現体・歴史的な結実体）</title>

  <!-- 白抜きの下向きの矢印（預言者・烈士） -->
  <polygon points="214,75.5 358.5,75.5 358.5,207 416.5,207 287,260 158.5,207 214,207" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="31" text-anchor="middle" dominant-baseline="central">
    <text x="286.5" y="118.5" textLength="100" lengthAdjust="spacing">預言者</text>
    <text x="286.5" y="163" textLength="66" lengthAdjust="spacing">烈士</text>
  </g>

  <!-- 復帰摂理担当人物 -->
  <ellipse cx="288.5" cy="315.5" rx="119.5" ry="45.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="288.5" y="297" textLength="113" lengthAdjust="spacing">復帰摂理</text>
    <text x="289" y="334" textLength="112" lengthAdjust="spacing">担当人物</text>
  </g>

  <!-- ● 再現体・歴史的な結実体 -->
  <circle cx="446.5" cy="283" r="7.5"/>
  <circle cx="446.5" cy="341" r="7.5"/>
  <g font-size="30" dominant-baseline="central">
    <text x="462" y="283" textLength="92" lengthAdjust="spacing">再現体</text>
    <text x="462" y="340.5" textLength="218" lengthAdjust="spacing">歴史的な結実体</text>
  </g>
</svg>
