<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 雲に乗って来られるという聖句は何を意味するのか　黙示録 1:7</title>

  <!-- 題 -->
  <text x="35" y="35.5" font-size="29.5" dominant-baseline="central">Ⅲ.</text>
  <text x="85" y="35.5" font-size="29.5" dominant-baseline="central" textLength="703" lengthAdjust="spacing">雲に乗って来られるという聖句は何を意味するのか</text>
  <line x1="85" y1="55" x2="788" y2="55" stroke="currentColor" stroke-width="2.5"/>

  <g font-size="28.5" dominant-baseline="central">
    <text x="147" y="108" textLength="87" lengthAdjust="spacing">黙示録</text>
    <text x="243" y="108" textLength="41" lengthAdjust="spacing">1:7</text>
  </g>

  <!-- 聖句（細字） -->
  <g font-size="26.5" font-weight="400" dominant-baseline="central">
    <text y="155.5"><tspan x="196">「</tspan><tspan x="211" textLength="50" lengthAdjust="spacing">見よ</tspan><tspan x="264">、</tspan><tspan x="291" textLength="243" lengthAdjust="spacing">雲に乗ってこられる</tspan><tspan x="535">。</tspan><tspan x="563" textLength="107" lengthAdjust="spacing">すべての</tspan></text>
    <text y="194.5"><tspan x="210" textLength="78" lengthAdjust="spacing">人の目</tspan><tspan x="291">、</tspan><tspan x="318" textLength="80" lengthAdjust="spacing">ことに</tspan><tspan x="399">、</tspan><tspan x="427" textLength="242" lengthAdjust="spacing">彼を刺しとおした者</tspan></text>
    <text y="234"><tspan x="210" textLength="81" lengthAdjust="spacing">たちは</tspan><tspan x="289">、</tspan><tspan x="316" textLength="260" lengthAdjust="spacing">彼を仰ぎ見るであろう</tspan><tspan x="578">。</tspan><tspan x="605" textLength="40" lengthAdjust="spacing">…」</tspan></text>
  </g>
  <g stroke="currentColor" stroke-width="2">
    <line x1="290" y1="172.5" x2="316" y2="172.5"/>
    <line x1="561" y1="172.5" x2="670" y2="172.5"/>
    <line x1="210" y1="212.5" x2="290" y2="212.5"/>
    <line x1="425" y1="212.5" x2="670" y2="212.5"/>
    <line x1="210" y1="251.5" x2="262" y2="251.5"/>
  </g>

  <!-- すべての人の目がみな見ることができる → 肉身をとって再臨 -->
  <circle cx="136" cy="312.5" r="7.5"/>
  <g font-size="23" dominant-baseline="central">
    <text x="150" y="312.5" textLength="347" lengthAdjust="spacingAndGlyphs">すべての人の目がみな見ることができる</text>
    <text x="536" y="312.5" textLength="154" lengthAdjust="spacingAndGlyphs">肉身をとって再臨</text>
  </g>
  <polygon points="504,308.5 517,308.5 517,304.5 531,312.5 517,320.5 517,316.5 504,316.5" fill="#8C949A"/>

  <!-- 雲 ＝ 比喩 -->
  <rect x="314" y="346" width="200" height="44" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="345" y="368">雲</text>
    <text x="384" y="368">＝</text>
    <text x="423" y="368" textLength="63" lengthAdjust="spacing">比喩</text>
  </g>
</svg>
