<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>羊：長成　神の小羊：イエス（長成使命出発者）</title>

  <!-- 矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="309,113.5 470.5,113.5 470.5,107.5 487.5,117 470.5,126.5 470.5,120.5 309,120.5"/>
    <polygon points="331,257.5 475.5,257.5 475.5,252.5 490.5,261 475.5,270 475.5,264.5 331,264.5"/>
    <polygon points="389.5,204.5 389.5,189.5 373.5,189.5 400.5,169.5 427,189.5 411.5,189.5 411.5,204.5"/>
  </g>

  <!-- 羊と神の小羊 -->
  <ellipse cx="247.5" cy="117" rx="63.5" ry="40" fill="#DCC4C4" stroke="currentColor" stroke-width="2.2"/>
  <text x="247.5" y="116.5" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#111">羊</text>
  <ellipse cx="241" cy="261" rx="92" ry="44" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="240.5" y="260.5" font-size="34" text-anchor="middle" dominant-baseline="central" textLength="136" lengthAdjust="spacing">神の小羊</text>

  <!-- 長成・イエス -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <rect x="497" y="92.5" width="132" height="49" rx="6"/>
    <rect x="499" y="237" width="132" height="48.5" rx="6"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="563" y="117" textLength="62" lengthAdjust="spacing">長成</text>
    <text x="563.5" y="261" textLength="92" lengthAdjust="spacing">イエス</text>
  </g>

  <!-- 下の字 -->
  <text x="343" y="282.5" font-size="21" dominant-baseline="central" textLength="113" lengthAdjust="spacingAndGlyphs">(ヨハネ 1:29)</text>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="544.5" y="327" font-size="28" textLength="201" lengthAdjust="spacing">長成使命出発者</text>
    <text x="545" y="362.5" font-size="26" textLength="256" lengthAdjust="spacingAndGlyphs">（長成新約摂理出発者）</text>
  </g>
</svg>
