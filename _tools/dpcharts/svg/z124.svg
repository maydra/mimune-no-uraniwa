  <polygon points="605,368.5 629,368.5 629,352 647.5,386 629,421 629,404 605,404" fill="#8C949A"/>

  <!-- 無形・実体、構想・作品 -->
  <g font-size="40" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="244" y="460.5">無形</text>
    <text x="244.5" y="562.5">実体</text>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <rect x="990.5" y="435" width="98" height="54.5" rx="3" fill="#fff" class="paper"/>
    <rect x="990.5" y="541" width="98" height="54.5" rx="3" fill="#fff" class="paper"/>
