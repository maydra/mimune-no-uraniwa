<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>マタイ 22:8～10　天国を望みながら地獄に行くようになる</title>

  <!-- 聖句 -->
  <g font-size="27" dominant-baseline="central">
    <text x="126" y="69" textLength="65" lengthAdjust="spacingAndGlyphs">マタイ</text>
    <text x="200" y="69" textLength="99" lengthAdjust="spacingAndGlyphs">22:8～10</text>
    <text x="315" y="68.5">『</text>
    <text x="328" y="68.5" textLength="362" lengthAdjust="spacing">…婚宴の用意はできている</text>
    <text x="329" y="110.5">が、</text>
    <text x="384" y="110.5" textLength="236" lengthAdjust="spacing">招かれていたのは、</text>
    <text x="638" y="110.5">ふさ</text>
    <text x="328" y="153" textLength="321" lengthAdjust="spacing">わしくない人々であった。</text>
    <text x="666" y="153">だ</text>
    <text x="328" y="194.5" textLength="65" lengthAdjust="spacing">から、</text>
    <text x="412" y="194.5" textLength="277" lengthAdjust="spacing">町の大通りに出て行っ</text>
    <text x="328" y="237">て、</text>
    <text x="385" y="237" textLength="308" lengthAdjust="spacing">出会った人はだれでも婚</text>
    <text x="328" y="279" textLength="293" lengthAdjust="spacing">宴に連れてきなさい…』</text>
  </g>
  <g stroke="currentColor" stroke-width="2">
    <line x1="412" y1="214" x2="693" y2="214"/>
    <line x1="328" y1="256.5" x2="665" y2="256.5"/>
  </g>

  <!-- 下の2行 -->
  <g font-size="26" dominant-baseline="central">
    <text x="187" y="348" textLength="470" lengthAdjust="spacing">天国を望みながら地獄に行くようになる</text>
    <text x="242" y="393" textLength="317" lengthAdjust="spacing">自分自身を反省しなければ</text>
  </g>
  <polygon points="191,388.5 218,388.5 218,384 230,391.5 218,399 218,394.5 191,394.5" fill="#8C949A"/>
</svg>
