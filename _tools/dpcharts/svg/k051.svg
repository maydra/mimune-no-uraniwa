    <line x1="297" y1="303" x2="341.7" y2="256.2"/>
    <line x1="361" y1="236" x2="403.4" y2="193"/>
    <line x1="423" y1="173" x2="423" y2="118"/>
  </g>
  <g>
    <polygon points="286.5,313.7 282,330.3 269.9,318.4"/>
    <polygon points="350.6,246.8 346.4,263.6 334.1,251.8"/>
    <polygon points="412.5,183.7 408,200.3 395.9,188.4"/>
    <polygon points="423,105 414.5,120 431.5,120"/>
