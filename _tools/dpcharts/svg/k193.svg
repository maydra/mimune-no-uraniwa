<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. メシヤのための基台</title>

  <text x="38" y="40" font-size="30" dominant-baseline="central" textLength="35" lengthAdjust="spacingAndGlyphs">Ⅲ.</text>
  <text x="82" y="40" font-size="31" dominant-baseline="central" textLength="286" lengthAdjust="spacing">メシヤのための基台</text>
  <line x1="83" y1="58.5" x2="367" y2="58.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- イサク家庭（縦書き） -->
  <ellipse cx="182.5" cy="144" rx="33.5" ry="63" fill="#F8F28F" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="21" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="182.5" y="101">イ</text>
    <text x="182.5" y="122.5">サ</text>
    <text x="182.5" y="143.5">ク</text>
    <text x="182.5" y="164.5">家</text>
    <text x="182.5" y="186">庭</text>
  </g>

  <!-- 家庭的基台 -->
  <rect x="256" y="92" width="285" height="77" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="29" dominant-baseline="central" fill="#111">
    <text x="299" y="114.5" textLength="198" lengthAdjust="spacing">メシヤのための</text>
    <text x="283" y="147" textLength="142" lengthAdjust="spacing">家庭的基台</text>
    <text x="441" y="147" text-anchor="middle">：</text>
    <text x="456" y="147" textLength="57" lengthAdjust="spacing">造成</text>
  </g>

  <polygon points="392,184 404,184 404,195.5 410.5,195.5 398,207.5 385.5,195.5 392,195.5" fill="#8C949A"/>

  <!-- 理由 -->
  <circle cx="181.5" cy="232.5" r="7"/>
  <circle cx="181.5" cy="277.5" r="7"/>
  <g font-size="24" dominant-baseline="central">
    <text y="232"><tspan x="199" textLength="69" lengthAdjust="spacing">アダム</tspan><tspan x="270">、</tspan><tspan x="289" textLength="167" lengthAdjust="spacing">ノアの家庭の時</tspan></text>
    <text x="467.5" y="232" text-anchor="middle">：</text>
    <text x="480" y="232" textLength="216" lengthAdjust="spacing">他の家庭がなかった</text>
    <text x="199" y="277" textLength="187" lengthAdjust="spacing">アブラハムの時代</text>
    <text x="397.5" y="277" text-anchor="middle">：</text>
    <text x="410" y="277" textLength="283" lengthAdjust="spacing">サタン中心とする民族形成</text>
  </g>

  <polygon points="392,305 403.5,305 403.5,325.5 409.5,325.5 397.75,341 386,325.5 392,325.5" fill="#8C949A"/>

  <rect x="150.5" y="352" width="496.5" height="46.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <text x="161" y="376.5" font-size="25" dominant-baseline="central" textLength="472" lengthAdjust="spacing" fill="#111">メシヤが降臨なさるわけにはいかなかった</text>
</svg>
