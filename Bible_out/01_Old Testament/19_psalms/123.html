<h1>詩篇 第123章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>天に座しておられる者よ、わたしはあなたにむかって目をあげます。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>見よ、しもべがその主人の手に目をそそぎ、はしためがその主婦の手に目をそそぐように、われらはわれらの神、主に目をそそいで、われらをあわれまれるのを待ちます。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>主よ、われらをあわれんでください。われらをあわれんでください。われらに侮りが満ちあふれています。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>思い煩いのない者のあざけりと、高ぶる者の侮りとは、われらの魂に満ちあふれています。</p>
