<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ 第一次世界大戦終了したあと（1918 年）　再臨期始まる</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="147.5" y="60" text-anchor="middle">③</text>
    <text x="174" y="60" textLength="371" lengthAdjust="spacing">第一次世界大戦終了したあと</text>
    <text x="556" y="60" textLength="115" lengthAdjust="spacing">(1918 年)</text>
  </g>

  <!-- 三つの段 -->
  <g font-size="28" dominant-baseline="central">
    <text x="134" y="121.5" textLength="345" lengthAdjust="spacing">サタン側アダム型カイゼル</text>
    <text x="494" y="121.5" text-anchor="middle">：</text>
    <text x="509" y="121.5" textLength="58" lengthAdjust="spacing">滅ぶ</text>

    <text x="133" y="198.5" textLength="318" lengthAdjust="spacingAndGlyphs">サタン側再臨主型スターリン</text>
    <text x="464.5" y="198.5" text-anchor="middle">：</text>
    <text x="477" y="198.5" textLength="219" lengthAdjust="spacingAndGlyphs">共産主義世界つくる</text>

    <text x="134" y="275" textLength="121" lengthAdjust="spacingAndGlyphs">イエス再臨</text>
    <text x="268" y="275" text-anchor="middle">：</text>
    <text x="281" y="275" textLength="415" lengthAdjust="spacingAndGlyphs">共生共栄共義主義世界見せてくださる</text>
  </g>

  <!-- 灰色の下向きの矢印 -->
  <g fill="#8C949A">
    <polygon points="212.75,142 219.75,142 219.75,161.5 224.5,161.5 216.25,174.5 208,161.5 212.75,161.5"/>
    <polygon points="212.75,221 219.75,221 219.75,240.5 224.5,240.5 216.25,253.5 208,240.5 212.75,240.5"/>
    <polygon points="212.75,303 219.75,303 219.75,322.5 224.5,322.5 216.25,335.5 208,322.5 212.75,322.5"/>
  </g>

  <!-- 再臨期始まる -->
  <rect x="129" y="348.5" width="209" height="52.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="147" y="375" font-size="28" dominant-baseline="central" textLength="171" lengthAdjust="spacing" fill="#111">再臨期始まる</text>
</svg>
