<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>理性論（デカルト）と経験論（ベーコン）</title>

  <!-- 理性論・経験論の札 -->
  <g fill="#F86D42" stroke="currentColor" stroke-width="2.8">
    <rect x="153.5" y="44.5" width="118" height="51"/>
    <rect x="156.5" y="212.5" width="119" height="51"/>
  </g>
  <g font-size="31" dominant-baseline="central" fill="#111">
    <text x="163.8" y="70" textLength="97" lengthAdjust="spacing">理性論</text>
    <text x="168.8" y="237.5" textLength="96" lengthAdjust="spacing">経験論</text>
  </g>

  <!-- デカルト -->
  <g font-size="27" dominant-baseline="central">
    <text x="306" y="56" textLength="112" lengthAdjust="spacing">フランス</text>
    <text x="433" y="56" text-anchor="middle">：</text>
    <text x="449" y="56" textLength="112" lengthAdjust="spacing">デカルト</text>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text y="87.5"><tspan x="395" textLength="68" lengthAdjust="spacing">(1596</tspan><tspan x="470.5" textLength="27.5" lengthAdjust="spacingAndGlyphs">～</tspan><tspan x="508" textLength="66" lengthAdjust="spacing">1650)</tspan></text>
  </g>
  <text y="138.5" font-size="29" dominant-baseline="central"><tspan x="322.5" textLength="118" lengthAdjust="spacing">「我思う、</tspan><tspan x="452.8" textLength="186" lengthAdjust="spacing">ゆえに我あり」</tspan></text>

  <!-- ベーコン -->
  <g font-size="27" dominant-baseline="central">
    <text x="306" y="223" textLength="112" lengthAdjust="spacing">イギリス</text>
    <text x="434.5" y="223" text-anchor="middle">：</text>
    <text x="450" y="223" textLength="114" lengthAdjust="spacing">ベーコン</text>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text y="255"><tspan x="396" textLength="64" lengthAdjust="spacing">(1561</tspan><tspan x="471.5" textLength="27.5" lengthAdjust="spacingAndGlyphs">～</tspan><tspan x="509" textLength="66" lengthAdjust="spacing">1626)</tspan></text>
  </g>
  <text x="325.8" y="292.5" font-size="31" dominant-baseline="central" textLength="347" lengthAdjust="spacing">実験と観察によって認識</text>

  <!-- 下向きの灰色の矢印 -->
  <polygon points="400,328.5 421,328.5 421,339.5 437,339.5 410.5,355.5 384,339.5 400,339.5" fill="#8C949A"/>

  <text x="242.8" y="387" font-size="29" dominant-baseline="central" textLength="344" lengthAdjust="spacing">自然と人間とを神から分離</text>
</svg>
