<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>哲学面　批判哲学と観念論</title>

  <!-- 題 -->
  <text x="33" y="38.5" font-size="30" dominant-baseline="central" textLength="93" lengthAdjust="spacing">哲学面</text>
  <line x1="33" y1="57.5" x2="127" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 批判哲学・観念論の札 -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="3">
    <rect x="127.5" y="98" width="155.5" height="52"/>
    <rect x="127.5" y="309" width="157.5" height="54"/>
  </g>
  <g font-size="33" dominant-baseline="central" fill="#111">
    <text x="138" y="123.5" textLength="134" lengthAdjust="spacing">批判哲学</text>
    <g text-anchor="middle">
      <text x="160" y="335.5">観</text>
      <text x="206" y="335.5">念</text>
      <text x="252.5" y="335.5">論</text>
    </g>
  </g>

  <!-- 点 -->
  <circle cx="306" cy="102" r="7.5"/>
  <circle cx="306" cy="148" r="7.5"/>
  <circle cx="307.5" cy="336.5" r="8"/>

  <!-- 批判哲学の説明 -->
  <g dominant-baseline="central">
    <text y="105" font-size="26"><tspan x="329" textLength="78" lengthAdjust="spacing">ドイツ</tspan><tspan x="424" text-anchor="middle">：</tspan><tspan x="440" textLength="81" lengthAdjust="spacing">カント</tspan></text>
    <text x="323" y="147" font-size="28" textLength="143" lengthAdjust="spacing">認識の成立</text>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text y="182"><tspan x="327.5" text-anchor="middle">：</tspan><tspan x="342" textLength="316" lengthAdjust="spacing">思惟能力（悟性の自発的な</tspan></text>
    <text x="341" y="222" textLength="260" lengthAdjust="spacing">作用）が対象からくる</text>
    <text x="342" y="261" textLength="210" lengthAdjust="spacing">感覚を統合、統一</text>
  </g>

  <!-- 観念論の説明 -->
  <g font-size="25" dominant-baseline="central">
    <text y="336"><tspan x="330" textLength="64" lengthAdjust="spacingAndGlyphs">ドイツ</tspan><tspan x="403.5" text-anchor="middle">：</tspan><tspan x="414" textLength="243" lengthAdjust="spacing">フィヒテ、シェリング、</tspan></text>
    <text x="325" y="368" textLength="94" lengthAdjust="spacing">ヘーゲル</text>
    <text x="565" y="368" textLength="93" lengthAdjust="spacing">（弁証法）</text>
  </g>
</svg>
