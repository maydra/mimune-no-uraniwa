<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理時代と復帰摂理延長時代の中心民族・中心史料</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="247.5" y="78.5" width="198" height="66" rx="8"/>
    <rect x="452.5" y="78.5" width="198" height="66" rx="8"/>
  </g>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="293.5" y="97" textLength="104" lengthAdjust="spacing">復帰摂理</text>
    <text x="321.5" y="126" textLength="51" lengthAdjust="spacing">時代</text>
    <text x="498.5" y="97" textLength="104" lengthAdjust="spacing">復帰摂理</text>
    <text x="498.5" y="126" textLength="104" lengthAdjust="spacing">延長時代</text>
  </g>

  <!-- 左の札（縦書き） -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3">
    <rect x="164.5" y="151.5" width="75" height="106" rx="10"/>
    <rect x="164.5" y="262.5" width="75" height="102" rx="10"/>
  </g>
  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text x="201.5" y="168">中</text>
    <text x="201.5" y="191.5">心</text>
    <text x="201.5" y="216">民</text>
    <text x="201.5" y="238.5">族</text>
    <text x="201.5" y="278">中</text>
    <text x="201.5" y="301">心</text>
    <text x="201.5" y="324.5">史</text>
    <text x="201.5" y="348.5">料</text>
  </g>

  <!-- 黄の箱 -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="3.5">
    <rect x="248.75" y="150.75" width="194.5" height="103.5" rx="8"/>
    <rect x="453.75" y="150.75" width="194.5" height="103.5" rx="8"/>
    <rect x="248.75" y="261.75" width="194.5" height="103.5" rx="8"/>
    <rect x="453.75" y="261.75" width="194.5" height="103.5" rx="8"/>
  </g>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="256" y="185" textLength="181" lengthAdjust="spacing">イスラエル選民</text>
    <text x="462" y="184.5" textLength="178" lengthAdjust="spacing">キリスト教信徒</text>
    <text x="274" y="296" textLength="145" lengthAdjust="spacing">イスラエル</text>
    <text x="303" y="330" textLength="86" lengthAdjust="spacing">民族史</text>
    <text x="466" y="313" textLength="171" lengthAdjust="spacing">キリスト教史</text>
  </g>
  <g font-size="20" dominant-baseline="central" fill="#111">
    <text x="263" y="223" textLength="166" lengthAdjust="spacing">（第一イスラエル）</text>
    <text x="467" y="223" textLength="166" lengthAdjust="spacing">（第二イスラエル）</text>
  </g>
</svg>
