<h1>詩篇 第15章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>主よ、あなたの幕屋にやどるべき者はだれですか、あなたの聖なる山に住むべき者はだれですか。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>直く歩み、義を行い、心から真実を語る者、</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>その舌をもってそしらず、その友に悪をなさず、隣り人に対するそしりを取りあげず、</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>その目は神に捨てられた者を卑しめ、主を恐れる者を尊び、誓った事は自分の損害になっても変えることなく、</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>利息をとって金銭を貸すことなく、まいないを取って罪のない者の不利をはかることをしない人である。これらの事を行う者はとこしえに動かされることはない。</p>
