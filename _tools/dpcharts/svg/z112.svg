<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人間は被造世界の性相的中心</title>
  <defs>
    <marker id="z112-a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="52" y="77" font-size="48" textLength="648" lengthAdjust="spacing">人間は被造世界の性相的中心</text>
  <line x1="50" y1="88" x2="700" y2="88" stroke="currentColor" stroke-width="3.5"/>

  <!-- 神から人間・被造物へ（灰色の線。形の下に描く） -->
  <g stroke="#8C949A" stroke-width="9">
    <line x1="650.5" y1="172.1" x2="392.5" y2="304.7"/>
    <line x1="650.5" y1="166.7" x2="911.5" y2="298.9"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <circle cx="650.5" cy="157" r="52" fill="#fff" class="paper"/>
    <ellipse cx="392.5" cy="297.5" rx="77.5" ry="42.5" fill="#FCE5E3"/>
    <ellipse cx="911.5" cy="298" rx="77.5" ry="43" fill="#DCC4C4"/>
  </g>
  <text x="649.5" y="156.5" font-size="53" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="43" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="361.5" y="297.5">人</text>
    <text x="419.5" y="297.5">間</text>
    <text x="911.5" y="298">被造物</text>
  </g>

  <!-- 精神的、霊的関係（行き来する矢印） -->
  <g stroke="currentColor" stroke-width="10" marker-end="url(#z112-a)">
    <line x1="492" y1="288" x2="788.2" y2="288"/>
    <line x1="807" y1="313.5" x2="511.3" y2="313.5"/>
  </g>
  <g font-size="41" dominant-baseline="central">
    <text x="482" y="356" textLength="124" lengthAdjust="spacing">精神的</text>
    <text x="607" y="356">、</text>
    <text x="649" y="356" textLength="166" lengthAdjust="spacing">霊的関係</text>
  </g>

  <!-- 知情意 -->
  <rect x="530" y="416" width="239" height="118.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g font-size="49" text-anchor="middle" dominant-baseline="central">
    <text x="581" y="475">知</text>
    <text x="649" y="475">情</text>
    <text x="716.5" y="475">意</text>
  </g>
  <g stroke="currentColor" stroke-width="7">
    <g stroke-dasharray="22.5 12">
      <line x1="468" y1="419.5" x2="525" y2="419.5"/>
      <line x1="468" y1="476.5" x2="525" y2="476.5"/>
      <line x1="467" y1="529" x2="524" y2="529"/>
    </g>
    <g stroke-dasharray="15.5 6.5">
      <line x1="779" y1="425" x2="816.5" y2="425"/>
      <line x1="778.5" y1="477.5" x2="816" y2="477.5"/>
      <line x1="780" y1="529" x2="817.5" y2="529"/>
    </g>
  </g>
  <circle cx="829" cy="424" r="8"/>
  <circle cx="828.5" cy="476.5" r="8"/>
  <circle cx="828.5" cy="530" r="8"/>
  <g font-size="37" dominant-baseline="central">
    <text x="275" y="419" textLength="186" lengthAdjust="spacing">生理的機能</text>
    <text x="275" y="475.5" textLength="78" lengthAdjust="spacing">物質</text>
    <text x="275" y="531.5" textLength="158" lengthAdjust="spacing">森羅万象</text>
    <text x="848" y="422" textLength="78" lengthAdjust="spacing">共鳴</text>
    <text x="848" y="476" textLength="157" lengthAdjust="spacing">共鳴要素</text>
    <text x="848" y="531" textLength="118" lengthAdjust="spacing">感応体</text>
  </g>

  <rect x="231.5" y="581.5" width="828" height="68" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="39" dominant-baseline="central" fill="#111">
    <text x="251" y="616" textLength="553" lengthAdjust="spacing">神と人間が合性一体化した位置</text>
    <text x="824.5" y="616" text-anchor="middle">：</text>
    <text x="845.5" y="616" textLength="196" lengthAdjust="spacing">天宙の中心</text>
  </g>
</svg>
