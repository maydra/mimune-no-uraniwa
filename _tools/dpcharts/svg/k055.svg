<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理歴史と「私」</title>

  <text x="35" y="38.5" font-size="30" dominant-baseline="central">Ⅲ.</text>
  <text x="82" y="38.5" font-size="30" dominant-baseline="central" textLength="287" lengthAdjust="spacing">復帰摂理歴史と「私」</text>
  <line x1="82" y1="57" x2="369" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- 復帰摂理歴史（白抜きの下向きの矢印） -->
  <polygon points="297.5,84 528,84 528,116 574,116 408,168.5 254.5,116 297.5,116" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
  <text x="413" y="107" font-size="34" text-anchor="middle" dominant-baseline="central">復帰摂理歴史</text>

  <!-- 蕩減条件の灰色の矢印（楕円の下から） -->
  <polygon points="402,280 411,280 411,330 417.5,330 406.5,352 395.5,330 402,330" fill="#8C949A"/>
  <text x="435" y="317.5" font-size="31" dominant-baseline="central" textLength="127" lengthAdjust="spacing">蕩減条件</text>

  <!-- 私（歴史の所産） -->
  <ellipse cx="408.5" cy="234" rx="152" ry="56.5" fill="#FCE5E3" stroke="currentColor" stroke-width="2.2"/>
  <text x="406" y="213.5" font-size="38" text-anchor="middle" dominant-baseline="central" fill="#111">私</text>
  <text x="406" y="253" font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="168" lengthAdjust="spacing">（歴史の所産）</text>

  <!-- 歴史の結実体 -->
  <rect x="269" y="356" width="275" height="50" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="406" y="380.5" font-size="38" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="232" lengthAdjust="spacing">歴史の結実体</text>
</svg>
