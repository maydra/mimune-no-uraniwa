<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アブラハムはイサク献祭をいかにささげたか？</title>

  <text x="35" y="37.5" font-size="30" dominant-baseline="central" textLength="551" lengthAdjust="spacingAndGlyphs">アブラハムはイサク献祭をいかにささげたか？</text>
  <line x1="34" y1="56.5" x2="590" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- モリヤ山（平たい緑の山） -->
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M337.5,393 C360,378 395,330 418,306 Q430,294 442,306 L451,313 Q466,294 485,288 Q493,286 498,291 L512,303 Q530,289 549,294 C576,304 600,345 625,372 L668.5,407 Q640,411 600,418 C582,415 566,405 540,404.5 C520,404 505,410 490,412 Q470,418 430,415.5 L365,410.5 Q380,406 385,398 L360,392 Z" fill="#A0F08A"/>
    <g fill="#4A5764">
      <polygon points="360,391.5 391,370 386,385 385,398 372,394.5"/>
      <polygon points="574,380 595,397 612,409 634,411 604,417 590,404"/>
    </g>
    <g fill="none">
      <line x1="451" y1="313" x2="463.5" y2="328"/>
      <line x1="512" y1="303" x2="527.5" y2="321"/>
      <line x1="420" y1="340" x2="391" y2="370"/>
      <line x1="561" y1="368" x2="576" y2="381"/>
    </g>
  </g>
  <text x="498.5" y="359.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">モリヤ</text>

  <!-- 矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="491,159 498,159 498,205 503,205 494.5,218 486,205 491,205"/>
    <polygon points="311,250.5 428,250.5 428,246 444,254 428,262 428,257.5 311,257.5"/>
  </g>

  <ellipse cx="496" cy="124.5" rx="36" ry="34" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="495" y="120.5" font-size="37" text-anchor="middle" dominant-baseline="central">神</text>

  <g stroke="currentColor" stroke-width="2.2" fill="#F8F28F">
    <ellipse cx="231.5" cy="254.5" rx="78" ry="33.5"/>
    <ellipse cx="495" cy="253.5" rx="49" ry="28.5"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="232" y="254" textLength="125" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="495.5" y="253" textLength="72" lengthAdjust="spacingAndGlyphs">イサク</text>
  </g>

  <g dominant-baseline="central">
    <text x="521" y="168.5" font-size="28" textLength="85" lengthAdjust="spacing">殺すな</text>
    <text x="517" y="198.5" font-size="21" textLength="94" lengthAdjust="spacingAndGlyphs">(創 22:12)</text>
    <text x="308.5" y="221" font-size="27" textLength="136" lengthAdjust="spacingAndGlyphs">殺そうとする</text>
  </g>
</svg>
