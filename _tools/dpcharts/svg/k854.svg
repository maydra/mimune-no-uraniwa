<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>韓国民族が苦難を受けるようになった経緯</title>

  <!-- 題 -->
  <text x="35" y="39" font-size="29" dominant-baseline="central" textLength="570" lengthAdjust="spacing">韓国民族が苦難を受けるようになった経緯</text>
  <line x1="35" y1="57.5" x2="603" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <g font-size="26" dominant-baseline="central">
    <!-- 1905 -->
    <text x="181" y="115" textLength="50" lengthAdjust="spacingAndGlyphs">1905</text>
    <text x="239" y="115">年</text>
    <text x="278" y="115" text-anchor="middle">：</text>
    <text x="293" y="115" textLength="53" lengthAdjust="spacing">乙巳</text>
    <text x="371" y="115" text-anchor="end">（</text>
    <text x="371" y="115" textLength="52" lengthAdjust="spacing">保護</text>
    <text x="424" y="115">）</text>
    <text x="450" y="115" textLength="52" lengthAdjust="spacing">条約</text>

    <!-- 1910 -->
    <text x="181" y="176.5" textLength="51" lengthAdjust="spacingAndGlyphs">1910</text>
    <text x="239" y="176.5">年</text>
    <text x="278" y="176.5" text-anchor="middle">：</text>
    <text x="293.5" y="176.5" textLength="104" lengthAdjust="spacing">日韓合併</text>

    <!-- 1919 -->
    <text x="181" y="238.5" textLength="50" lengthAdjust="spacingAndGlyphs">1919</text>
    <text x="239" y="238.5">年</text>
    <text x="278" y="238.5" text-anchor="middle">：</text>
    <text x="291.5" y="238.5" textLength="13" lengthAdjust="spacingAndGlyphs">3</text>
    <text x="310" y="238.5">月</text>
    <text x="345.5" y="238.5" textLength="9" lengthAdjust="spacingAndGlyphs">1</text>
    <text x="365.5" y="238.5" textLength="129" lengthAdjust="spacing">日独立運動</text>
    <text x="288" y="272.5" textLength="131" lengthAdjust="spacing">良民を殺戮</text>

    <text x="182" y="342" textLength="100" lengthAdjust="spacing">キリスト</text>
    <text x="286" y="342" textLength="288" lengthAdjust="spacing">教信徒に神社参拝を強要</text>
    <text x="180" y="381.5" textLength="131" lengthAdjust="spacing">信徒を投獄</text>
    <text x="311" y="381.5">、</text>
    <text x="338" y="381.5" textLength="52" lengthAdjust="spacing">虐殺</text>
  </g>
</svg>
