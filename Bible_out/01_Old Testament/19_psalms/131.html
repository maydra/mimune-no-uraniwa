<h1>詩篇 第131章</h1>
<div class="the-post-cont">

<p><sup>1</sup>主よ、わが心はおごらず、わが目は高ぶらず、わたしはわが力の及ばない大いなる事とくすしきわざとに関係いたしません。</p>
<p><sup>2</sup>かえって、乳離れしたみどりごが、その母のふところに安らかにあるように、わたしはわが魂を静め、かつ安らかにしました。わが魂は乳離れしたみどりごのように、安らかです。</p>
<p><sup>3</sup>イスラエルよ、今からとこしえに主によって望みをいだけ。</p>
