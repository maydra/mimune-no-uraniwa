<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の予定を否定する聖句（創 2:17、創 6:6）</title>

  <text x="51" y="55" font-size="50" dominant-baseline="central" textLength="550" lengthAdjust="spacing">神の予定を否定する聖句</text>
  <line x1="51" y1="85.5" x2="601" y2="85.5" stroke="currentColor" stroke-width="4"/>

  <!-- ● -->
  <g>
    <circle cx="220.5" cy="167.5" r="12"/>
    <circle cx="220.5" cy="456.5" r="12"/>
  </g>
  <g font-size="46" dominant-baseline="central">
    <text y="167.5"><tspan x="243">創</tspan> <tspan x="301" font-size="50" textLength="22" lengthAdjust="spacingAndGlyphs">2</tspan><tspan x="327" font-size="50">:</tspan><tspan x="347" font-size="50" textLength="45" lengthAdjust="spacingAndGlyphs">17</tspan></text>
    <text y="456.5"><tspan x="243">創</tspan> <tspan x="301" font-size="50" textLength="23" lengthAdjust="spacingAndGlyphs">6</tspan><tspan x="327" font-size="50">:</tspan><tspan x="347" font-size="50" textLength="23" lengthAdjust="spacingAndGlyphs">6</tspan></text>
  </g>

  <!-- 創 2:17　神 → 人 -->
  <g fill="#8C949A">
    <polygon points="369,261 651,261 651,253 671.5,264.5 651,276 651,268 369,268"/>
    <polygon points="368,557 655.5,557 655.5,549.5 676.5,560.5 655.5,571.5 655.5,564 368,564"/>
  </g>
  <g font-size="44" dominant-baseline="central">
    <text x="369" y="227" text-anchor="middle">“</text>
    <text x="378" y="226.5" textLength="273" lengthAdjust="spacingAndGlyphs">取って食べるな</text>
    <text x="659" y="227" text-anchor="middle">”</text>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <circle cx="294" cy="268" r="53.5" fill="#fff" class="paper"/>
    <circle cx="750" cy="268" r="53.5" fill="#FCE5E3"/>
    <circle cx="294" cy="561" r="53.5" fill="#fff" class="paper"/>
    <circle cx="750.5" cy="559" r="53.5" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="294" y="267" font-size="58">神</text>
    <text x="750.5" y="267" font-size="60" fill="#111">人</text>
    <text x="294" y="560.5" font-size="58">神</text>
    <text x="750.5" y="560" font-size="60" fill="#111">人</text>
  </g>
  <g font-size="41" dominant-baseline="central">
    <text x="822" y="270" textLength="82" lengthAdjust="spacing">堕落</text>
    <text x="925.5" y="270" text-anchor="middle">：</text>
  </g>
  <g font-size="38" dominant-baseline="central">
    <text x="664" y="365" textLength="301" lengthAdjust="spacing">神の予定ではなく</text>
    <text x="665" y="417.5" textLength="413.5" lengthAdjust="spacing">人間が従わなかった結果</text>
  </g>

  <!-- 創 6:6　神 → 人 -->
  <text x="395" y="519" font-size="46" dominant-baseline="central" textLength="230" lengthAdjust="spacing">創造を嘆息</text>
</svg>
