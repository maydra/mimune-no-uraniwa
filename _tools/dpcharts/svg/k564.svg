<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>統一王国時代とキリスト王国時代　①サウルとサムエル　②チャールズ大帝とレオ三世</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="130" y="55" width="276" height="54" rx="5"/>
    <rect x="415" y="55" width="276" height="54" rx="5"/>
  </g>
  <g font-size="34" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="268.5" y="82" textLength="203" lengthAdjust="spacing">統一王国時代</text>
    <text x="554" y="82" textLength="244" lengthAdjust="spacingAndGlyphs">キリスト王国時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="130" y="117" width="276" height="266.5" rx="6"/>
    <rect x="415" y="117" width="276" height="266.5" rx="6"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="151" cy="136" r="10.3"/>
    <circle cx="438.5" cy="136" r="10.3"/>
  </g>
  <g font-size="17" text-anchor="middle" dominant-baseline="central">
    <text x="151" y="136.5">1</text>
    <text x="438.5" y="136.5">2</text>
  </g>

  <!-- ① 統一王国時代 -->
  <g font-size="24" dominant-baseline="central">
    <text x="147" y="179.5" textLength="69" lengthAdjust="spacingAndGlyphs">サウル</text>
    <text x="289" y="179.5" textLength="93" lengthAdjust="spacingAndGlyphs">サムエル</text>
    <text x="143" y="306.5" textLength="69" lengthAdjust="spacingAndGlyphs">み言で</text>
    <text x="143" y="334.5" textLength="93" lengthAdjust="spacing">国家統治</text>
    <text x="280" y="306.5" textLength="116" lengthAdjust="spacingAndGlyphs">油を注いで</text>
    <text x="279" y="334.5" textLength="46" lengthAdjust="spacing">祝福</text>
  </g>
  <polygon points="262,236 237,236 237,232.5 225,239 237,245.5 237,242 262,242" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="181" cy="239.5" rx="39" ry="20.5" fill="#F8F28F"/>
    <ellipse cx="327.5" cy="240" rx="65" ry="39.5" fill="#fff" class="paper"/>
    <ellipse cx="302" cy="240" rx="39" ry="20.5" fill="#F86D42"/>
  </g>
  <g font-size="22" dominant-baseline="central" fill="#111">
    <text x="156" y="240.5" textLength="51" lengthAdjust="spacing">国王</text>
    <text x="272.5" y="240.5" textLength="60" lengthAdjust="spacingAndGlyphs">預言者</text>
  </g>
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <text x="361.5" y="228">国</text>
    <text x="361.5" y="251.5">民</text>
  </g>

  <!-- ② キリスト王国時代 -->
  <g font-size="24" dominant-baseline="central">
    <text x="424" y="176" font-size="22" textLength="114" lengthAdjust="spacingAndGlyphs">チャールズ大帝</text>
    <text x="567" y="177" textLength="89" lengthAdjust="spacingAndGlyphs">レオ三世</text>
    <text x="429" y="303.5" textLength="111" lengthAdjust="spacingAndGlyphs">法王の理想を</text>
    <text x="429" y="332.5" textLength="117" lengthAdjust="spacingAndGlyphs">奉じて統治</text>
    <text x="569" y="303.5" textLength="115" lengthAdjust="spacingAndGlyphs">金の王冠を</text>
    <text x="570" y="331.5" textLength="114" lengthAdjust="spacingAndGlyphs">かぶらせる</text>
  </g>
  <polygon points="548,234 523,234 523,230.5 511,237 523,243.5 523,240 548,240" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="467" cy="237" rx="39" ry="20.5" fill="#F8F28F"/>
    <ellipse cx="612.5" cy="238" rx="65" ry="39.5" fill="#fff" class="paper"/>
    <ellipse cx="587" cy="237.5" rx="39" ry="20.5" fill="#F86D42"/>
  </g>
  <g font-size="22" dominant-baseline="central" fill="#111">
    <text x="442" y="237.5" textLength="51" lengthAdjust="spacing">国王</text>
    <text x="561" y="238" textLength="53" lengthAdjust="spacing">法王</text>
  </g>
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <text x="646.5" y="228">国</text>
    <text x="646.5" y="251.5">民</text>
  </g>
</svg>
