<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天国と地獄</title>

  <text x="53" y="79" font-size="48" textLength="249" lengthAdjust="spacing">天国と地獄</text>
  <line x1="53" y1="89.5" x2="302" y2="89.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 霊人体 -->
  <ellipse cx="305.5" cy="365.5" rx="90.5" ry="156.5" fill="#F98AEE" stroke="currentColor" stroke-width="4"/>
  <text x="303" y="299" font-size="64" text-anchor="middle" dominant-baseline="central" fill="#111">霊<tspan x="303" dy="1.05em">人</tspan><tspan x="303" dy="1.05em">体</tspan></text>

  <!-- 説明 -->
  <g>
    <circle cx="450" cy="190" r="12"/>
    <circle cx="450" cy="372" r="12"/>
    <circle cx="450" cy="534" r="12"/>
  </g>
  <g font-size="49" dominant-baseline="central">
    <text x="476" y="189.5">天国、地獄に行くこと：</text>
    <text x="577" y="252.5">霊人体自身が決定</text>
    <text x="476" y="369.5">地獄：</text>
    <text x="628" y="369.5">神の愛を呼吸する</text>
    <text x="628" y="431.5">ことができない</text>
    <text x="476" y="535">繁殖：</text>
    <text x="628" y="535">肉身の繁殖に伴う</text>
  </g>
</svg>
