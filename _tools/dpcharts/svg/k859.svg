  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.5" fill="#FCE5E3">
    <ellipse cx="162.5" cy="224.5" rx="39.5" ry="31.5"/>
    <ellipse cx="309" cy="224.5" rx="40" ry="31.5"/>
    <ellipse cx="459" cy="224" rx="40" ry="31"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="23">
      <text x="162.5" y="211.5" textLength="47" lengthAdjust="spacing">人間</text>
      <text x="162.5" y="238.5" textLength="47" lengthAdjust="spacing">始祖</text>
    </g>
    <g font-size="28">
