<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アダムからアブラハムまでの2000年</title>

  <!-- アダムからアブラハムまで -->
  <line x1="189" y1="100" x2="189" y2="258" stroke="#8C949A" stroke-width="7"/>
  <ellipse cx="189" cy="74.25" rx="64" ry="26.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="190.5" y="75" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="83" lengthAdjust="spacing">アダム</text>

  <g stroke="currentColor" stroke-width="2.8" fill="#F8F28F">
    <ellipse cx="189" cy="284" rx="64" ry="26.5"/>
    <ellipse cx="189" cy="340" rx="64" ry="26.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="189" y="285" font-size="22" textLength="108" lengthAdjust="spacing">アブラハム</text>
    <text x="189.5" y="340" font-size="23" textLength="117" lengthAdjust="spacing">イサク家庭</text>
  </g>

  <!-- 説明 -->
  <g font-size="28" dominant-baseline="central">
    <text x="202" y="133.5" font-size="29" textLength="62" lengthAdjust="spacingAndGlyphs">2000</text>
    <text x="273" y="133.5" textLength="30" lengthAdjust="spacing">年</text>
    <text x="319" y="133.5" text-anchor="middle">：</text>
    <text y="173.5"><tspan x="280.5">「</tspan><tspan x="293" textLength="374" lengthAdjust="spacing">メシヤのための民族的な基台</tspan><tspan x="667.3">」</tspan></text>
    <text x="294" y="213" textLength="315" lengthAdjust="spacing">出発基台を造成する期間</text>
    <text y="322.5"><tspan x="280.5">「</tspan><tspan x="293" textLength="374" lengthAdjust="spacing">メシヤのための民族的な基台</tspan><tspan x="667.3">」</tspan></text>
    <text x="293" y="362" textLength="259" lengthAdjust="spacing">蕩減路程の出発基台</text>
  </g>
</svg>
