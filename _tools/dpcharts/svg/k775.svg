<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <!-- 元の題は「超えさせる」。本文と同じ「越えさせる」に直した（2026-10-31、ユーザー「誤表記は直そう」） -->
  <title>② イエスの第三次試練を世界的に越えさせる</title>

  <!-- 題 -->
  <g font-size="27" dominant-baseline="central">
    <text x="45.5" y="34.5" text-anchor="middle">②</text>
    <text x="66" y="34.5" textLength="494" lengthAdjust="spacing">イエスの第三次試練を世界的に越えさせる</text>
  </g>
  <line x1="64" y1="51" x2="563" y2="51" stroke="currentColor" stroke-width="2.5"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="220.5,150 229.5,150 229.5,204 236,204 225,221 214,204 220.5,204"/>
    <polygon points="543.5,152 552.5,152 552.5,204 559,204 548,220.5 537,204 543.5,204"/>
    <polygon points="275,175.5 491,175.5 491,171 503,178.5 491,186 491,181.5 275,181.5"/>
    <polygon points="541,314 554,314 554,324 560.5,324 547.5,332 534.5,324 541,324"/>
  </g>

  <!-- イエス・天の側の楕円 -->
  <ellipse cx="225" cy="118" rx="53" ry="35.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="549.5" cy="117.5" rx="65.5" ry="37.5" fill="#F86D42" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="225" y="119" font-size="28" textLength="82" lengthAdjust="spacing">イエス</text>
    <g font-size="26">
      <text x="549.5" y="102" textLength="75" lengthAdjust="spacing">天の側</text>
      <text x="549.5" y="133.5" textLength="75" lengthAdjust="spacing">地上人</text>
    </g>
  </g>
  <text x="380" y="155.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="180" lengthAdjust="spacing">世界的に越える</text>

  <!-- 水色の箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="2.5">
    <rect x="149.5" y="227" width="151.5" height="46"/>
    <rect x="439" y="225.5" width="218" height="46.5"/>
    <rect x="424" y="341" width="245" height="79.5"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="225.5" y="251" textLength="129" lengthAdjust="spacing">第三次試練</text>
    <text x="549" y="248.5" textLength="180" lengthAdjust="spacing">第三次世界大戦</text>
    <text x="545.5" y="366.5" textLength="207" lengthAdjust="spacing">被造世界全体に対</text>
    <text x="546" y="398.5" textLength="180" lengthAdjust="spacing">する主管性復帰</text>
  </g>

  <!-- 箱の下の字 -->
  <g font-size="26" dominant-baseline="central">
    <text x="139" y="299.5" textLength="49" lengthAdjust="spacing">勝利</text>
    <text x="203.5" y="299.5" text-anchor="middle">：</text>
    <text x="218" y="299.5" textLength="128" lengthAdjust="spacing">主管性復帰</text>
    <text x="218" y="331" textLength="102" lengthAdjust="spacing">基台造成</text>
    <text x="471" y="292.5" textLength="154" lengthAdjust="spacing">第三祝福復帰</text>
  </g>
</svg>
