<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>矛盾性は後天的　破滅状態＝堕落</title>

  <!-- 矛盾性 ― 後天的 -->
  <rect x="301.5" y="103.5" width="267.5" height="88.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="325.5" y="147" font-size="68" dominant-baseline="central" textLength="219.5" lengthAdjust="spacing">矛盾性</text>
  <line x1="615" y1="149" x2="723" y2="149" stroke="currentColor" stroke-width="9"/>
  <text x="774" y="151" font-size="64" dominant-baseline="central" textLength="195.5" lengthAdjust="spacing">後天的</text>

  <polygon points="422,252 451,252 451,323 468,323 436,376.5 404,323 422,323" fill="#8C949A"/>

  <!-- 破滅状態＝堕落 -->
  <text x="273" y="444.5" font-size="65" dominant-baseline="central" textLength="303.5" lengthAdjust="spacing">破滅状態</text>
  <g stroke="currentColor" stroke-width="8">
    <line x1="633" y1="432.5" x2="705" y2="432.5"/>
    <line x1="633" y1="454.5" x2="705" y2="454.5"/>
  </g>
  <rect x="765" y="398" width="203" height="94" fill="#50403D" stroke="currentColor" stroke-width="4"/>
  <text x="866.5" y="444" font-size="68" fill="#fff" text-anchor="middle" dominant-baseline="central">堕落</text>
  <text x="867" y="546.5" font-size="56" text-anchor="middle" dominant-baseline="central">（キリスト教）</text>
</svg>
