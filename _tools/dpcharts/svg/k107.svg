<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>箱舟：天宙</title>

  <!-- 箱舟（上が広い台形。上から薄い桃・灰桃・茶の3段） -->
  <polygon points="221.5,68 378,68 366.1,92.5 232.9,92.5" fill="#FCE5E3"/>
  <polygon points="232.9,92.5 366.1,92.5 355.9,113.5 242.6,113.5" fill="#DCC4C4"/>
  <polygon points="242.6,113.5 355.9,113.5 344.5,137 253.5,137" fill="#50403D"/>
  <line x1="232.9" y1="92.5" x2="366.1" y2="92.5" stroke="#111" stroke-width="1.2"/>
  <polygon points="221.5,68 378,68 344.5,137 253.5,137" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <text x="299" y="95" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">箱舟</text>

  <text x="406.5" y="105" font-size="35" text-anchor="middle" dominant-baseline="central">：</text>
  <text x="433" y="105" font-size="35" dominant-baseline="central">天宙</text>

  <!-- 象徴の対応 -->
  <g font-size="31" dominant-baseline="central">
    <text x="172" y="190">ノアの</text>
    <text x="279.5" y="190" text-anchor="middle">８</text>
    <text x="296" y="190">人家族</text>
    <text x="299" y="246">ノア</text>
    <text x="264" y="305">彼の家族</text>
    <text x="296" y="364.5">動物</text>
    <text x="422" y="190">アダムの</text>
    <text x="563" y="190" text-anchor="middle">８</text>
    <text x="580" y="190">人家族</text>
    <text x="422" y="246">神</text>
    <text x="422" y="305">全人類</text>
    <text x="422" y="364.5">万物世界全体</text>
  </g>
  <g font-size="31" text-anchor="middle" dominant-baseline="central">
    <text x="405" y="190">：</text>
    <text x="405" y="246">：</text>
    <text x="405" y="305">：</text>
    <text x="405" y="364.5">：</text>
  </g>
