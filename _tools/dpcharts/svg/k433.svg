<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>旧約前：僕の僕　旧約：僕　新約：養子</title>
  <defs>
    <marker id="k433-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 段の横線 -->
  <g stroke="currentColor" stroke-width="2.6">
    <line x1="130.5" y1="75" x2="691" y2="75"/>
    <line x1="130.5" y1="134" x2="691" y2="134"/>
    <line x1="130.5" y1="193" x2="691" y2="193"/>
    <line x1="130.5" y1="250" x2="691" y2="250"/>
  </g>

  <!-- 段の名 -->
  <g font-size="27" dominant-baseline="central">
    <text x="516" y="171.5" textLength="55" lengthAdjust="spacing">新約</text>
    <text x="587.5" y="171.5" text-anchor="middle">：</text>
    <text x="603" y="171.5" textLength="55" lengthAdjust="spacing">養子</text>
    <text x="482" y="229.5" textLength="57" lengthAdjust="spacing">旧約</text>
    <text x="555" y="229.5" text-anchor="middle">：</text>
    <text x="570" y="229.5">僕</text>
    <text x="426" y="295" textLength="85" lengthAdjust="spacing">旧約前</text>
    <text x="527" y="295" text-anchor="middle">：</text>
    <text x="543" y="295" textLength="84" lengthAdjust="spacing">僕の僕</text>
  </g>

  <!-- 上っていく線と矢印（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="4">
    <line x1="244" y1="351" x2="272" y2="328"/>
    <line x1="308.4" y1="295.8" x2="329.8" y2="278.2" marker-end="url(#k433-a)"/>
    <line x1="374.4" y1="238.3" x2="396.8" y2="219.7" marker-end="url(#k433-a)"/>
  </g>

  <!-- サと堕落人間の間の矢印 -->
  <g fill="currentColor">
    <polygon points="210,292 215.5,303 212.25,303 212.25,331 207.75,331 207.75,303 204.5,303"/>
    <polygon points="222.5,294 226.5,294 226.5,321 230,321 224.5,331.5 219,321 222.5,321"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="217" cy="271" rx="30" ry="16" fill="#50403D"/>
    <ellipse cx="217.5" cy="360" rx="40" ry="23.5" fill="#CF921C"/>
    <ellipse cx="290.5" cy="312" rx="40" ry="23.5" fill="#F8F28F"/>
    <ellipse cx="356.5" cy="254" rx="40" ry="23.5" fill="#F8F28F"/>
    <ellipse cx="418" cy="194" rx="40" ry="23.5" fill="#F8F28F"/>
  </g>
  <text x="218" y="270.5" font-size="21" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>
  <g font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="198.5" y="360" font-size="23.5">堕</text>
    <text x="236.5" y="360" font-size="23.5">人</text>
    <text x="291" y="311.5" textLength="47" lengthAdjust="spacing">ノア</text>
    <text x="357" y="253.5" textLength="68" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="418" y="194.5" textLength="67" lengthAdjust="spacing">イエス</text>
  </g>
  <circle cx="217.5" cy="360" r="2.8" fill="#111"/>
</svg>
