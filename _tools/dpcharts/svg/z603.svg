  <title>Ⅰ. 生命の木復帰から見た完成したアダムとイエス</title>

  <text x="77.5" y="52" font-size="44" text-anchor="middle" dominant-baseline="central">Ⅰ</text>
  <text x="103" y="52" font-size="44" dominant-baseline="central">.</text>
