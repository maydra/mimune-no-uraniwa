<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>十字架による霊的救いの摂理の基台がすべて終わる（ヨハネ19:30）</title>

  <text y="75" font-size="40" dominant-baseline="central"><tspan x="208.5" textLength="119" lengthAdjust="spacingAndGlyphs">ヨハネ</tspan> <tspan x="342" textLength="106" lengthAdjust="spacing">19:30</tspan></text>

  <!-- 十字架（型を置く） -->
  <g transform="translate(225.0,140.0) scale(1.6600,1.7556)" stroke-width="1.757" fill="#7A5230" stroke="#111" stroke-linejoin="round">
    <path d="M40,0 H60 V42 H100 V60 H60 V180 H40 V60 H0 V42 H40 Z"/>
  </g>

  <ellipse cx="525.5" cy="237.5" rx="115.5" ry="57" fill="#F8F28F" stroke="currentColor" stroke-width="4"/>
  <text x="525" y="237.5" font-size="52" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="168" lengthAdjust="spacing">イエス</text>

  <!-- …『すべてが終った』 -->
  <g>
    <circle cx="671" cy="237" r="4.5"/>
    <circle cx="688" cy="237" r="4.5"/>
    <circle cx="704" cy="237" r="4.5"/>
  </g>
  <text y="237" font-size="43.5" font-weight="400" dominant-baseline="central"><tspan x="744" text-anchor="end">『</tspan><tspan x="743.75" textLength="304.5" lengthAdjust="spacing">すべてが終った</tspan><tspan x="1048.5">』</tspan></text>

  <!-- 十字架による霊的救いの摂理の基台がすべて終わる -->
  <rect x="537" y="352" width="522.5" height="246" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="44" dominant-baseline="central" fill="#111">
    <text x="567" y="413" textLength="269" lengthAdjust="spacing">十字架による</text>
    <text x="566" y="476" textLength="467" lengthAdjust="spacingAndGlyphs">霊的救いの摂理の基台が</text>
    <text x="567.5" y="538.5" textLength="268" lengthAdjust="spacing">すべて終わる</text>
  </g>
</svg>
