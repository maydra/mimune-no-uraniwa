<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>最初の鳩：始めのアダム象徴</title>

  <!-- 下への矢印 -->
  <polygon points="227,182 234,182 234,289.5 239,289.5 230.5,302.5 222,289.5 227,289.5" fill="#8C949A"/>

  <!-- 最初の鳩 -->
  <ellipse cx="230.5" cy="137" rx="98.5" ry="33" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="230.5" y="137" font-size="33" text-anchor="middle" dominant-baseline="central" fill="#111">最初の鳩</text>

  <text x="349" y="137" font-size="35" textLength="293" lengthAdjust="spacing" dominant-baseline="central">始めのアダム象徴</text>
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="348" y="193.5" textLength="229" lengthAdjust="spacing">箱舟に帰ってくる</text>
    <text x="348" y="239" textLength="316" lengthAdjust="spacing">み旨理想を取り戻された</text>
  </g>
  <line x1="308" y1="238.5" x2="328" y2="238.5" stroke="currentColor" stroke-width="3"/>
