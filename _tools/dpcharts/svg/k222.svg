<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>② 肉と霊</title>
  <text x="48.5" y="38" font-size="29" text-anchor="middle" dominant-baseline="central">②</text>
  <text x="70" y="38" font-size="29" dominant-baseline="central" textLength="87" lengthAdjust="spacing">肉と霊</text>
  <line x1="70" y1="54.5" x2="157" y2="54.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦の矢印（楕円の下に描く） -->
  <polygon points="193,140 199,140 199,166 203.5,166 196,178 188.5,166 193,166" fill="#8C949A"/>
  <polygon points="193,224 199,224 199,253 203.5,253 196,265 188.5,253 193,253" fill="#8C949A"/>
  <polygon points="193,309 199,309 199,338 203.5,338 196,350 188.5,338 193,338" fill="#8C949A"/>

  <!-- ア・エ → ヤコブ → モーセ → イエス -->
  <ellipse cx="195.5" cy="114.5" rx="62.5" ry="28.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <path d="M194.5,86 C168.5,89.5 166.5,107.5 195.5,114.5 C218.5,121 218.5,138.5 194.5,143" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="159.5" y="114.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">ア</text>
  <text x="231.5" y="114.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">エ</text>
  <ellipse cx="195.5" cy="203.5" rx="45.5" ry="23.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="195.5" y="203" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="72" lengthAdjust="spacingAndGlyphs">ヤコブ</text>
  <ellipse cx="195.5" cy="289" rx="45.5" ry="23" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="195.5" y="288.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="77" lengthAdjust="spacingAndGlyphs">モーセ</text>
  <ellipse cx="196" cy="375.5" rx="50" ry="24.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="196" y="375.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="77" lengthAdjust="spacingAndGlyphs">イエス</text>

  <!-- 説明 -->
  <text x="272" y="114.5" font-size="28" dominant-baseline="central" textLength="258" lengthAdjust="spacing">肉と霊にサタン侵入</text>
  <polygon points="544,112.25 565,112.25 565,108.75 575,115 565,121.25 565,117.75 544,117.75" fill="#8C949A"/>
  <text x="589" y="114.5" font-size="28" dominant-baseline="central" textLength="86" lengthAdjust="spacing">堕落性</text>
  <text x="270" y="203" font-size="28" dominant-baseline="central" textLength="260" lengthAdjust="spacingAndGlyphs">パンとレンズ豆のあつもの</text>
  <polygon points="539,201.75 560,201.75 560,198.25 570,204.5 560,210.75 560,207.25 539,207.25" fill="#8C949A"/>
  <text x="577" y="203" font-size="28" dominant-baseline="central" textLength="108" lengthAdjust="spacingAndGlyphs">長子の嗣業</text>
  <text x="272" y="288" font-size="28" dominant-baseline="central" textLength="161" lengthAdjust="spacing">マナとうずら</text>
  <polygon points="445,286.75 466,286.75 466,283.25 476,289.5 466,295.75 466,292.25 445,292.25" fill="#8C949A"/>
  <text x="488" y="288" font-size="28" dominant-baseline="central" textLength="192" lengthAdjust="spacing">感謝、選民意識</text>
  <text x="272" y="375.5" font-size="28" dominant-baseline="central" textLength="85" lengthAdjust="spacing">肉と血</text>
  <polygon points="371,374.75 392,374.75 392,371.25 402,377.5 392,383.75 392,380.25 371,380.25" fill="#8C949A"/>
  <text x="415" y="375.5" font-size="28" dominant-baseline="central" textLength="58" lengthAdjust="spacing">生命</text>
</svg>
