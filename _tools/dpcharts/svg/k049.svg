<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 437" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(4) メシヤのための基台の範囲から見た時代区分</title>

  <text x="45.5" y="37.5" font-size="30" dominant-baseline="central" textLength="46" lengthAdjust="spacingAndGlyphs">(4)</text>
  <text x="100" y="37.5" font-size="30" dominant-baseline="central" textLength="524" lengthAdjust="spacing">メシヤのための基台の範囲から見た時代区分</text>
  <line x1="100" y1="56.5" x2="623" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 段の横線（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="105.5" y1="106" x2="711.5" y2="106"/>
    <line x1="105.5" y1="173" x2="711.5" y2="173"/>
    <line x1="105.5" y1="237.5" x2="711.5" y2="237.5"/>
    <line x1="105.5" y1="305" x2="711.5" y2="305"/>
  </g>

  <!-- 2000年の弧（字の所で切れる） -->
  <g fill="none" stroke="currentColor" stroke-width="2.2">
    <path d="M207,366 A63,61 0 0 0 241,356.3 M261.8,335 A63,61 0 0 0 270,305"/>
    <path d="M270,305 A62,67 0 0 0 307.1,291.7 M323.4,272 A62,67 0 0 0 332,238"/>
    <path d="M332,238 A63,63 0 0 0 364.5,228.9 M387.9,204.1 A63,63 0 0 0 395,175"/>
  </g>

  <!-- 2000年ずつ上る矢印 -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="207" y1="366" x2="249.9" y2="324.5"/>
    <line x1="270" y1="305" x2="313" y2="258.6"/>
    <line x1="332" y1="238" x2="375.2" y2="194.8"/>
    <line x1="395" y1="175" x2="395" y2="120"/>
  </g>
  <g>
    <polygon points="259.2,315.4 254.4,332 242.5,319.8"/>
    <polygon points="321.8,249 317.9,265.8 305.4,254.2"/>
    <polygon points="384.4,185.6 379.8,202.2 367.8,190.2"/>
    <polygon points="395,107 386.5,122 403.5,122"/>
  </g>

  <!-- アダム・アブラハム・イエス・再臨主 -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="140" cy="366.5" rx="45.5" ry="18.5" fill="#CF921C"/>
    <ellipse cx="189" cy="304" rx="62" ry="19" fill="#FCE5E3"/>
    <ellipse cx="260" cy="238.5" rx="50.5" ry="19" fill="#F8F28F"/>
    <ellipse cx="321.5" cy="174.5" rx="50.5" ry="19" fill="#fff" class="paper"/>
  </g>
  <g font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="140" y="366" fill="#111">アダム</text>
    <text x="189.5" y="303.5" fill="#111">アブラハム</text>
    <text x="258.5" y="237.5" fill="#111">イエス</text>
    <text x="322" y="174">再臨主</text>
  </g>

  <g>
    <circle cx="207" cy="366" r="8.5"/>
    <circle cx="270" cy="305" r="8.5"/>
    <circle cx="332" cy="238" r="8.5"/>
    <circle cx="395" cy="175" r="8.5"/>
  </g>
  <g font-size="21" font-weight="400" dominant-baseline="central">
    <text x="246.5" y="347.5" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
    <text x="312.5" y="284" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
    <text x="369.5" y="216.5" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
  </g>

  <!-- 時代の名前 -->
  <g font-size="23.5" dominant-baseline="central">
    <text x="450" y="126">メシヤのための</text>
    <text x="450" y="152.5">天宙的基台摂理完成時代</text>
    <text x="450" y="191">メシヤのための</text>
    <text x="450" y="219.5">世界的基台摂理時代</text>
    <text x="450" y="257">メシヤのための</text>
    <text x="450" y="285.5">民族的基台摂理時代</text>
    <text x="450" y="323">メシヤのための</text>
    <text x="450" y="351.5">家庭的基台摂理時代</text>
  </g>
</svg>
