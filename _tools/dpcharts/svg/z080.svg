<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>万有原力と授受作用を中心としてみた神</title>
  <defs>
    <marker id="z080-d" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <text x="50" y="75" font-size="48" textLength="897" lengthAdjust="spacing">万有原力と授受作用を中心としてみた神</text>
  <line x1="49" y1="86" x2="949" y2="86" stroke="currentColor" stroke-width="3.5"/>

  <text x="322" y="195" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 神（左が性相、右が形状） -->
  <path d="M546,201.75 c-33.81,29.96 -66,58.62 -66,91.875 c0,33.25 32.19,61.91 66,91.875 c30.74,29.96 60,58.62 60,91.875 c0,33.25 -29.26,61.91 -60,91.875 A312.25,183.75 0 0 1 546,201.75 Z" fill="#F98AEE"/>
  <path d="M546,201.75 c-33.81,29.96 -66,58.62 -66,91.875 c0,33.25 32.19,61.91 66,91.875 c30.74,29.96 60,58.62 60,91.875 c0,33.25 -29.26,61.91 -60,91.875 A312.25,183.75 0 0 0 546,201.75 Z" fill="#A0F08A"/>
  <ellipse cx="546" cy="385.5" rx="312.25" ry="183.75" fill="none" stroke="currentColor" stroke-width="4.5"/>

  <g stroke="#111" stroke-width="7">
    <line x1="477.5" y1="337" x2="416.5" y2="398.5"/>
    <line x1="617" y1="335.5" x2="676" y2="396.5"/>
  </g>
  <g stroke="#111" stroke-width="6" fill="none" marker-end="url(#z080-d)">
    <path d="M473,429.5 Q553.6,412.5 603.75,427.5"/>
    <path d="M618,459 Q539,477.6 488,463.75"/>
  </g>
  <g font-size="48" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="544.5" y="300">万有原力</text>
  </g>
  <g font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="378" y="445">本性相</text>
    <text x="715" y="445.5">本形状</text>
  </g>

  <!-- 右の説明 -->
  <path d="M896,358 Q885.5,359.5 885.5,369 L885.5,404 Q885.5,413 874,416 Q885.5,419 885.5,428 L885.5,463 Q885.5,472.5 896,474" fill="none" stroke="currentColor" stroke-width="5"/>
  <circle cx="914" cy="384.5" r="9"/>
  <circle cx="912.5" cy="449.5" r="9"/>
  <g font-size="44" dominant-baseline="central">
    <text x="935" y="386">永存</text>
    <text x="935" y="448">永遠の</text>
    <text x="935" y="507" textLength="179" lengthAdjust="spacing">授受作用</text>
  </g>
