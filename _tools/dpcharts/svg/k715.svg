<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『経済』</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="146" y="37" text-anchor="end">『</text>
    <text x="148" y="37" textLength="61" lengthAdjust="spacing">経済</text>
    <text x="210" y="37">』</text>
  </g>

  <!-- 産業革命の表 -->
  <rect x="150" y="70" width="523" height="201" fill="#DCC4C4" stroke="currentColor" stroke-width="3"/>
  <g stroke="#111" stroke-width="3">
    <line x1="323.5" y1="71.5" x2="323.5" y2="269.5"/>
    <line x1="498.5" y1="71.5" x2="498.5" y2="269.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="30">
      <text x="237.5" y="100" textLength="61" lengthAdjust="spacing">一次</text>
      <text x="411" y="100.5" textLength="60" lengthAdjust="spacing">二次</text>
      <text x="586" y="99" textLength="60" lengthAdjust="spacing">三次</text>
    </g>
    <g font-size="31">
      <text x="237" y="137" textLength="124" lengthAdjust="spacing">産業革命</text>
      <text x="410.5" y="137" textLength="125" lengthAdjust="spacing">産業革命</text>
      <text x="586" y="136" textLength="124" lengthAdjust="spacing">産業革命</text>
    </g>
  </g>
  <g dominant-baseline="central" fill="#111">
    <g font-size="27">
      <text x="174" y="193" textLength="56" lengthAdjust="spacing">蒸気</text>
      <text x="340" y="193.5" textLength="147" lengthAdjust="spacingAndGlyphs">電気、ガソリン</text>
      <text x="521" y="192.5" textLength="83" lengthAdjust="spacing">原子力</text>
    </g>
    <g font-size="26">
      <text x="185" y="228.5" text-anchor="end">（</text>
      <text x="186" y="228.5" textLength="102" lengthAdjust="spacing">イギリス</text>
      <text x="290" y="228.5">）</text>
      <text x="358" y="229" text-anchor="end">（</text>
      <text x="359" y="229" textLength="102" lengthAdjust="spacing">先進諸国</text>
      <text x="463" y="229">）</text>
      <text x="533" y="228.5" text-anchor="end">（</text>
      <text x="534" y="228.5" textLength="104" lengthAdjust="spacing">理想社会</text>
      <text x="639" y="228.5">）</text>
    </g>
  </g>

  <!-- 三分野、三次の革命 -->
  <rect x="208" y="297" width="403" height="111" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <polygon points="403,344 418,344 418,352 429,352 410.5,363 392,352 403,352" fill="#8C949A"/>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="411" y="321" textLength="258" lengthAdjust="spacing">三分野、三次の革命</text>
    <text x="411" y="381.5" textLength="374" lengthAdjust="spacing">理想社会実現への必然的過程</text>
  </g>
</svg>
