<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅴ. 聖書に対する我々の態度</title>

  <text x="59" y="60" font-size="46" dominant-baseline="central">Ⅴ.</text>
  <text y="58" font-size="50" dominant-baseline="central"><tspan x="132" textLength="550" lengthAdjust="spacing">聖書に対する我々の態度</tspan></text>
  <line x1="132" y1="89" x2="682" y2="89" stroke="currentColor" stroke-width="3.5"/>

  <!-- 聖書観 → 洗礼ヨハネ -->
  <polygon points="440,275.5 558,275.5 558,264.5 594,283 558,301.5 558,290.5 440,290.5" fill="#8C949A"/>
  <ellipse cx="331.75" cy="283.25" rx="124.75" ry="67.25" fill="#DCC4C4" stroke="currentColor" stroke-width="4"/>
  <text y="283" font-size="50" dominant-baseline="central" fill="#111"><tspan x="257" textLength="150" lengthAdjust="spacing">聖書観</tspan></text>

  <rect x="602.5" y="198" width="476" height="181.5" rx="26" fill="#F86D42" stroke="currentColor" stroke-width="4"/>
  <g font-size="50" dominant-baseline="central" fill="#111">
    <text y="256"><tspan x="637" textLength="250" lengthAdjust="spacing">洗礼ヨハネ</tspan><tspan x="911.5" text-anchor="middle">：</tspan></text>
    <text y="318.5"><tspan x="737" textLength="300" lengthAdjust="spacing">偉大な預言者</tspan></text>
  </g>

  <!-- ⇩ -->
  <polygon points="637.5,415.5 667.5,415.5 667.5,465.5 695,465.5 652.5,497 610,465.5 637.5,465.5" fill="#8C949A"/>

  <rect x="254.5" y="524.5" width="797" height="91.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text y="569.5" font-size="50" dominant-baseline="central" fill="#111"><tspan x="283" textLength="700" lengthAdjust="spacing">かたくなな信仰態度を捨てねば</tspan><tspan x="1007.5" text-anchor="middle">！</tspan></text>
</svg>
