<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>1. 第一次民族的カナン復帰路程　(1) 信仰基台</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="33" y="41">1.</text>
    <text x="71" y="41" textLength="409" lengthAdjust="spacing">第一次民族的カナン復帰路程</text>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="57" y="88" textLength="37" lengthAdjust="spacingAndGlyphs">(1)</text>
    <text x="110" y="88" textLength="115" lengthAdjust="spacing">信仰基台</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="70" y1="59.5" x2="480" y2="59.5"/>
    <line x1="110" y1="105.5" x2="225" y2="105.5"/>
  </g>

  <!-- ヤコブからモーセへ -->
  <polygon points="209.5,214 216.5,214 216.5,294 222,294 213.5,310 205,294 209.5,294" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="213" cy="179" rx="66" ry="34" fill="#F8F28F"/>
    <ellipse cx="213" cy="346" rx="66" ry="34" fill="#fff" class="paper"/>
  </g>
  <text x="213.5" y="178" font-size="32" text-anchor="middle" dominant-baseline="central" textLength="94" lengthAdjust="spacing" fill="#111">ヤコブ</text>
  <text x="213" y="346" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="90" lengthAdjust="spacing">モーセ</text>

  <!-- 字 -->
  <g font-size="29" dominant-baseline="central">
    <text x="299" y="180.5" textLength="202" lengthAdjust="spacing">イスラエル民族</text>
    <text x="236" y="255" textLength="201" lengthAdjust="spacing">民族的蕩減期間</text>
    <text x="445" y="255" textLength="43" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="496" y="255">年</text>
  </g>
  <g font-size="31" dominant-baseline="central">
    <text x="297" y="340" textLength="190" lengthAdjust="spacing">個人的に蕩減</text>
    <text x="341" y="387" textLength="43" lengthAdjust="spacingAndGlyphs">「40</text>
    <text x="395" y="387" textLength="261" lengthAdjust="spacing">日サタン分立基台」</text>
  </g>
  <polygon points="302,383.5 320,383.5 320,379.5 330.5,386 320,392.5 320,388.5 302,388.5" fill="#8C949A"/>
</svg>
