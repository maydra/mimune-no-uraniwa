<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>士師時代と教区長制キリスト教会時代　幕屋のみ旨・教会のみ旨：×　信仰の混乱</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="130.8" y="72" width="276" height="54" rx="6"/>
    <rect x="416.8" y="72" width="276" height="54" rx="6"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="201" y="98.5" font-size="34" textLength="138.1" lengthAdjust="spacing">士師時代</text>
    <text x="425.3" y="99" font-size="28" textLength="85.4" lengthAdjust="spacingAndGlyphs">教区長制</text>
    <text x="511.3" y="99" font-size="28" textLength="83.4" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="596.3" y="99" font-size="28" textLength="86.4" lengthAdjust="spacingAndGlyphs">教会時代</text>
  </g>
  <!-- 白い枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="130.8" y="134.5" width="276" height="224.5" rx="8"/>
    <rect x="416.8" y="134.5" width="276" height="224.5" rx="8"/>
  </g>
  <!-- 左：士師時代 -->
  <g dominant-baseline="central">
    <text x="150.5" y="156" font-size="24" text-anchor="middle">①</text>
    <text x="172.3" y="186" font-size="28" textLength="142.4" lengthAdjust="spacing">幕屋のみ旨</text>
    <text x="331" y="186" font-size="28" text-anchor="middle">：</text>
    <text x="174.3" y="227.5" font-size="28" textLength="82.4" lengthAdjust="spacing">カナン</text>
    <text x="258.3" y="227.5" font-size="28" textLength="58.4" lengthAdjust="spacing">七族</text>
    <text x="315" y="227.5" font-size="28">、</text>
    <text x="186.3" y="270" font-size="28" textLength="115.4" lengthAdjust="spacing">偶像崇拝</text>
    <text x="171.3" y="328" font-size="28" textLength="145.4" lengthAdjust="spacing">信仰の混乱</text>
  </g>
  <!-- 右：教区長制キリスト教会時代 -->
  <g dominant-baseline="central">
    <text x="437" y="156" font-size="24" text-anchor="middle">②</text>
    <text x="456.3" y="186" font-size="28" textLength="142.4" lengthAdjust="spacing">教会のみ旨</text>
    <text x="614.5" y="186" font-size="28" text-anchor="middle">：</text>
    <text x="456.3" y="230.5" font-size="28" textLength="172.4" lengthAdjust="spacing">ゲルマン民族</text>
    <text x="485.3" y="275.5" font-size="28" textLength="143.4" lengthAdjust="spacing">異教の影響</text>
    <text x="484.3" y="333.5" font-size="28" textLength="145.4" lengthAdjust="spacing">信仰の混乱</text>
  </g>
  <g>
    <circle cx="158" cy="186.5" r="5.5"/>
    <circle cx="158" cy="230" r="5.5"/>
    <circle cx="442.5" cy="186.5" r="5.5"/>
    <circle cx="442.5" cy="231" r="5.5"/>
  </g>
  <!-- × -->
  <path d="M351,177.5 L369,195.5 M369,177.5 L351,195.5" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M634,177.5 L652,195.5 M652,177.5 L634,195.5" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#8C949A">
    <polygon points="237,293 249,293 249,300 254,300 243,308.5 232,300 237,300"/>
    <polygon points="551.5,297 563.5,297 563.5,304 568.5,304 557.5,312.5 546.5,304 551.5,304"/>
  </g>
</svg>
