<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『ソ連はなぜ天の側に加担したのだろうか』</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="147" y="37" text-anchor="end">『</text>
    <text x="149" y="37" textLength="534" lengthAdjust="spacing">ソ連はなぜ天の側に加担したのだろうか</text>
    <text x="683" y="37">』</text>
  </g>

  <!-- 天の側国家・サタン側国家の札 -->
  <rect x="116.5" y="94.5" width="198" height="42" rx="6" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <rect x="408.5" y="93.5" width="196.5" height="41.5" rx="6" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="215.5" y="116.5" textLength="142" lengthAdjust="spacing">天の側国家</text>
    <text x="507" y="114" textLength="169" lengthAdjust="spacing" fill="#fff">サタン側国家</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="293,189 399,189 399,184 411.5,192 399,199.5 399,195 293,195"/>
    <polygon points="502,287 502,241 498,241 505.5,228 513,241 509,241 509,287"/>
    <!-- 民主主義からソ連へ -->
    <polygon points="268.4,228.4 443.8,290.9 445.6,286 457,298.5 440.2,301 442,296.1 266.6,233.6"/>
    <!-- ソ連から民主主義へ -->
    <polygon points="446.6,315.1 270.6,251.7 268.9,256.6 257.5,244 274.3,241.6 272.5,246.5 448.4,309.9"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="216" cy="191.5" rx="77.5" ry="30.5" fill="#F8F28F"/>
    <ellipse cx="502" cy="191" rx="76.5" ry="31" fill="#F86D42"/>
    <ellipse cx="507" cy="314" rx="42" ry="27" fill="#CF921C"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="214.5" y="192" textLength="124" lengthAdjust="spacing">民主主義</text>
    <text x="501.5" y="191.5" textLength="116" lengthAdjust="spacing">全体主義</text>
    <text x="508.5" y="314" textLength="54" lengthAdjust="spacing">ソ連</text>
  </g>

  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="346.5" y="169.5" textLength="50" lengthAdjust="spacing">打倒</text>
    <text x="461.5" y="260.5" textLength="50" lengthAdjust="spacing">打倒</text>
    <text x="507" y="361.5" textLength="103" lengthAdjust="spacing">共産世界</text>
  </g>
  <g font-size="21" dominant-baseline="central">
    <text x="580" y="175" textLength="126" lengthAdjust="spacing">サタン側が行</text>
    <text x="580" y="203.5" textLength="126" lengthAdjust="spacing">く道にも障害</text>
  </g>

  <!-- （神も一時的に許容） -->
  <circle cx="415" cy="391.5" r="17.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="25" dominant-baseline="central">
    <text x="384" y="392.5">(</text>
    <text x="414.5" y="391.5" font-size="22" text-anchor="middle">神</text>
    <text x="439" y="392.5" textLength="180" lengthAdjust="spacing">も一時的に許容</text>
    <text x="620" y="392.5">)</text>
  </g>
</svg>
