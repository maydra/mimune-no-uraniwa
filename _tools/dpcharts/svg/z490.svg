<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 復活の意義</title>

  <text x="52" y="74" font-size="50">Ⅲ.</text>
  <text x="131" y="74" font-size="49" textLength="246" lengthAdjust="spacing">復活の意義</text>
  <line x1="129" y1="85" x2="379" y2="85" stroke="currentColor" stroke-width="3"/>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="649.5" y="193" font-size="57" textLength="346" lengthAdjust="spacing">堕落による死</text>
  </g>
  <text y="260" font-size="50" font-weight="400" dominant-baseline="central"><tspan x="499" text-anchor="end">（</tspan><tspan x="499" textLength="300" lengthAdjust="spacing">今までの解釈</tspan><tspan x="799">）</tspan></text>
  <line x1="647.5" y1="296" x2="647.5" y2="366" stroke="currentColor" stroke-width="3.5" stroke-dasharray="18 8.5"/>

  <!-- 死と復活の矢印 -->
  <g fill="#8C949A">
    <polygon points="456,470.5 808,470.5 808,459 836,476 808,493 808,482.5 456,482.5"/>
    <polygon points="830,518.5 477,518.5 477,508 449,524.5 477,541 477,530.5 830,530.5"/>
  </g>
  <g font-size="56" text-anchor="middle" dominant-baseline="central">
    <text x="645.5" y="422.5">死</text>
    <text x="638" y="581">復活</text>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="323.75" cy="496.25" rx="97.25" ry="128.75" fill="#FCE5E3"/>
    <circle cx="961.75" cy="496" r="103.25" fill="#DCC4C4"/>
  </g>
  <g font-size="68" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="325" y="453.5">肉</text>
    <text x="325.5" y="537.5">身</text>
    <text x="963" y="493.5">土</text>
  </g>
</svg>
