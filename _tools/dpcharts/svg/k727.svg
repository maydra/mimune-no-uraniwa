<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 第一次世界大戦（1914～1918）　1. 第一次世界大戦に対する摂理的概要</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <g font-size="30" text-anchor="middle">
      <text x="48" y="39">Ⅱ</text>
      <text x="68" y="39">.</text>
    </g>
    <text x="81" y="38.5" font-size="31" textLength="220" lengthAdjust="spacing">第一次世界大戦</text>
    <g font-size="25">
      <text x="313" y="41" textLength="61" lengthAdjust="spacingAndGlyphs">(1914</text>
      <text x="394" y="41" text-anchor="middle">～</text>
      <text x="416" y="41" textLength="59" lengthAdjust="spacingAndGlyphs">1918)</text>
    </g>
    <g font-size="28" text-anchor="middle">
      <text x="53" y="82.5">1</text>
      <text x="67" y="82.5">.</text>
    </g>
    <text x="81" y="82" font-size="29" textLength="462" lengthAdjust="spacing">第一次世界大戦に対する摂理的概要</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="80" y1="57.6" x2="300" y2="57.6"/>
    <line x1="81" y1="100.6" x2="543" y2="100.6"/>
  </g>

  <!-- アベル・カインの札 -->
  <g stroke="currentColor" stroke-width="2.5">
    <rect x="250.5" y="122.5" width="156" height="42.5" fill="#F8F28F"/>
    <rect x="517.5" y="122.5" width="155" height="42.5" fill="#F86D42"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="327.5" y="143.5" textLength="92" lengthAdjust="spacing">アベル</text>
    <text x="594" y="143.5" textLength="91" lengthAdjust="spacing">カイン</text>
  </g>

  <!-- 政治・経済・思想の箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="127.5" y="177.5" width="92" height="54"/>
    <rect x="127.5" y="249.5" width="92" height="54"/>
    <rect x="127.5" y="321.5" width="92" height="54"/>
  </g>
  <g font-size="31" text-anchor="middle" dominant-baseline="central">
    <text x="173" y="203.5" textLength="63" lengthAdjust="spacing">政治</text>
    <text x="173.5" y="276" textLength="62" lengthAdjust="spacing">経済</text>
    <text x="173.5" y="348" textLength="62" lengthAdjust="spacing">思想</text>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <g fill="#F8F28F">
      <ellipse cx="329" cy="204.5" rx="92" ry="27.7"/>
      <ellipse cx="329" cy="276" rx="92" ry="27.2"/>
      <ellipse cx="329" cy="348" rx="92" ry="27.2"/>
    </g>
    <g fill="#F86D42">
      <ellipse cx="596" cy="204.5" rx="92" ry="27.7"/>
      <ellipse cx="596" cy="276" rx="92" ry="27.2"/>
      <ellipse cx="596" cy="348" rx="92" ry="27.2"/>
    </g>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111" font-weight="400">
    <g font-size="31">
      <text x="330" y="204" textLength="126" lengthAdjust="spacing">民主主義</text>
      <text x="596" y="204" textLength="126" lengthAdjust="spacing">全体主義</text>
    </g>
    <g font-size="22">
      <text x="329" y="266" textLength="75" lengthAdjust="spacing">天の側</text>
      <text x="329.5" y="286.5" textLength="106" lengthAdjust="spacing">帝国主義</text>
      <text x="596" y="266" textLength="99" lengthAdjust="spacing">サタン側</text>
      <text x="596.5" y="286.5" textLength="106" lengthAdjust="spacing">帝国主義</text>
    </g>
    <g font-size="25">
      <text x="330" y="347.5" textLength="155" lengthAdjust="spacingAndGlyphs">キリスト教国家</text>
      <text x="596" y="347.5" textLength="157" lengthAdjust="spacingAndGlyphs">反キリスト教国家</text>
    </g>
  </g>

  <!-- × -->
  <g stroke="currentColor" stroke-width="6.5">
    <path d="M446.5,187.5 L479.5,217.5 M479.5,187.5 L446.5,217.5"/>
    <path d="M446.5,259 L479.5,289 M479.5,259 L446.5,289"/>
    <path d="M446.5,330 L479.5,360 M479.5,330 L446.5,360"/>
  </g>

  <!-- 国の名（細字） -->
  <g font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="283" y="398.5">米</text>
    <text x="306.5" y="398.5">・</text>
    <text x="330.5" y="398.5">英</text>
    <text x="354" y="398.5">・</text>
    <text x="377.5" y="398.5">仏</text>
    <text x="484.5" y="398.5">独</text>
    <text x="503.5" y="398.5">・</text>
    <text x="569.5" y="398.5" textLength="112" lengthAdjust="spacingAndGlyphs">オーストリア</text>
    <text x="635.5" y="398.5">・</text>
    <text x="674.5" y="398.5" textLength="51" lengthAdjust="spacing">トルコ</text>
  </g>
</svg>
