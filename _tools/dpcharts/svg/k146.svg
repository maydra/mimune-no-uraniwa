    <text x="485" y="238.5" font-size="23" textLength="92" lengthAdjust="spacing">奪われる</text>
    <text x="488" y="308.5" font-size="23" textLength="94" lengthAdjust="spacing">取り戻す</text>
    <text x="590" y="320" font-size="20" textLength="94" lengthAdjust="spacing">エジプト王</text>
    <text x="270" y="359" font-size="25" textLength="118" lengthAdjust="spacing">[創 12:10]</text>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="429" y="327">妻</text>
    <text x="431" y="359" textLength="46" lengthAdjust="spacing">ロト</text>
    <text x="430.5" y="390" textLength="51" lengthAdjust="spacing">財物</text>
  </g>
  <path d="M465.5,314 Q473,315 473,325 L473,350 Q473,359 481,360 Q473,361 473,370 L473,397 Q473,406 465.5,407" fill="none" stroke="currentColor" stroke-width="3"/>
