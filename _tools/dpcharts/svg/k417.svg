<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神は、どのようにして罪悪人間を救うことができるのか？</title>

  <text transform="scale(0.85,1)" x="51.8 83.5 109.4 144.1 174.1 204.1 234.7 265.9 297.1 325.9 356.5 386.5 417.1 447.6 477.6 508.8 538.8 568.8 599.4 630.0 660.6 690.6 721.2 751.8 782.4 812.4" y="36.5" font-size="30" text-anchor="middle" dominant-baseline="central">神は、どのようにして罪悪人間を救うことができるのか？</text>
  <line x1="32" y1="55" x2="698" y2="55" stroke="currentColor" stroke-width="2.6"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="256.7,189.5 266.5,202.5 260.5,202.5 260.5,224 253,224 253,202.5 247,202.5"/>
    <polygon points="255.7,294.5 265.5,307.5 259.5,307.5 259.5,329 252,329 252,307.5 246,307.5"/>
    <polygon points="361.5,259.7 377.5,250 377.5,256 471.5,256 471.5,263.5 377.5,263.5 377.5,269.5"/>
    <polygon points="520.0,235.5 503.6,227.7 507.7,224.8 444.8,135.2 451.2,130.8 514.1,220.3 518.3,217.4"/>
    <polygon points="551.3,233.0 550.7,215.5 555.1,218.0 603.6,130.1 610.4,133.9 562.0,221.7 566.4,224.2"/>
  </g>

  <!-- 救い（重生） -->
  <rect x="213.5" y="108.5" width="89.5" height="76.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="260" y="130.5" font-size="28" textLength="56" lengthAdjust="spacing">救い</text>
    <text x="260.5" y="164" font-size="24" textLength="76" lengthAdjust="spacingAndGlyphs">（重生）</text>
  </g>

  <!-- 復活イエス -->
  <ellipse cx="257.5" cy="261" rx="91.2" ry="29.7" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="260.5" y="261.5" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="134" lengthAdjust="spacing">復活イエス</text>

  <!-- 全人類 -->
  <rect x="194.3" y="336.3" width="122.5" height="45.5" fill="#F86D42" stroke="currentColor" stroke-width="2.6"/>
  <text x="255.5" y="359.5" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="92" lengthAdjust="spacing">全人類</text>

  <!-- 神・サ -->
  <circle cx="448" cy="133" r="31.7" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <circle cx="607" cy="132" r="31.7" fill="#50403D" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="35" text-anchor="middle" dominant-baseline="central">
    <text x="447" y="133.5">神</text>
    <text x="607" y="132.5" fill="#fff">サ</text>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="439.5" y="194" font-size="27" textLength="56" lengthAdjust="spacing">復活</text>
    <text x="623" y="192.5" font-size="27" textLength="56" lengthAdjust="spacing">殺害</text>
  </g>

  <!-- 十字架とイエス -->
  <g transform="translate(490,211.5) scale(0.915,0.797)" fill="#7A5230" stroke="#111" stroke-width="2.34" stroke-linejoin="round">
    <path d="M40,0 H60 V42 H100 V60 H60 V180 H40 V60 H0 V42 H40 Z"/>
  </g>
  <ellipse cx="537" cy="298" rx="59.7" ry="23.6" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="536.5" y="298" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="89" lengthAdjust="spacing">イエス</text>
</svg>
