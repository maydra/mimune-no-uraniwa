<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <!-- 縦書きの括弧︵︶はフォント（図の字だけに絞った BIZ UDPゴシック）に無いので、（）を90度回して描く -->
  <title>Ⅳ. 洗礼ヨハネがエリヤになった理由</title>

  <text x="57" y="56" font-size="46" dominant-baseline="central">Ⅳ.</text>
  <text y="55" font-size="49" dominant-baseline="central"><tspan x="133" textLength="747" lengthAdjust="spacing">洗礼ヨハネがエリヤになった理由</tspan></text>
  <line x1="132" y1="85.5" x2="882" y2="85.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 使命の継承 -->
  <rect x="481" y="150" width="298" height="78.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="629.5" y="188" font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">使命の継承</text>
  <text x="533" y="263" font-size="38" dominant-baseline="central" textLength="183" lengthAdjust="spacingAndGlyphs">(ルカ 1:17)</text>
  <line x1="627" y1="309" x2="627" y2="434" stroke="currentColor" stroke-width="9" stroke-dasharray="23 11"/>

  <!-- ＝ -->
  <g stroke="currentColor">
    <line x1="554" y1="461.5" x2="701" y2="461.5" stroke-width="8"/>
    <line x1="554" y1="489" x2="701" y2="489" stroke-width="9"/>
  </g>

  <g stroke="currentColor" stroke-width="4" fill="#F86D42">
    <ellipse cx="398.5" cy="464.25" rx="95.5" ry="153.25"/>
    <ellipse cx="859.25" cy="464.25" rx="95.25" ry="153.25"/>
  </g>

  <!-- 縦書き（1字ずつ） -->
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="52">
      <text x="395.5" y="355.5">洗</text>
      <text x="395.5" y="410">礼</text>
      <text x="395.5" y="465">ヨ</text>
      <text x="395.5" y="519">ハ</text>
      <text x="395.5" y="573">ネ</text>
    </g>
    <g font-size="64">
      <text x="856.5" y="397.5">エ</text>
      <text x="856.5" y="465">リ</text>
      <text x="856.5" y="530.5">ヤ</text>
    </g>
  </g>
  <g font-size="49" text-anchor="middle" dominant-baseline="central">
    <text x="1007" y="379" transform="rotate(90 1007 379)">（</text>
    <text x="1007" y="416.5">再</text>
    <text x="1007" y="465.5">臨</text>
    <text x="1007" y="515.5">者</text>
    <text x="1007" y="553" transform="rotate(90 1007 553)">）</text>
  </g>
</svg>
