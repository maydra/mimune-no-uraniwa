      第一節　学校と先生<p>
一　学校とは何か
<p>
教会は天のためのものであり、学校は未来の子孫のためのものです。神様のみ旨は後世のため残すものです。個人を犠牲にし、より大きな後世を願うので、今は滅びても、後世により大きな国と世界が到来することを思い、そのためにあらゆる精誠を尽くすのです。（九六\三三）
<p>
