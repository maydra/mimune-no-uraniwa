  <g font-size="21" font-weight="400" dominant-baseline="central">
    <text x="276.5" y="346.5" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
    <text x="341.5" y="279.5" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
    <text x="397.5" y="213.5" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
