<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ 主権復帰の長成的な基台を造成</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="46" y="34.5" font-size="27" text-anchor="middle">③</text>
    <text x="66" y="34.5" font-size="26" textLength="366" lengthAdjust="spacing">主権復帰の長成的な基台を造成</text>
  </g>
  <line x1="64" y1="51" x2="432" y2="51" stroke="currentColor" stroke-width="2.2"/>

  <!-- 勝利の矢印（楕円より先に描く） -->
  <polygon points="272,170 280,170 280,286 287,286 276,303 265,286 272,286" fill="#8C949A"/>

  <!-- 天の側とサタン側 -->
  <ellipse cx="277.5" cy="135" rx="81" ry="42.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="277.5" cy="346.5" rx="81" ry="42.5" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="277" y="134.5" font-size="30" textLength="91" lengthAdjust="spacing">天の側</text>
    <text x="277.5" y="346.5" font-size="29" textLength="122" lengthAdjust="spacing" fill="#fff">サタン側</text>
  </g>

  <!-- 第二次世界大戦の箱 -->
  <rect x="125.5" y="194.5" width="134" height="76.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="192" y="215" textLength="85" lengthAdjust="spacing">第二次</text>
    <text x="192.5" y="249.5" textLength="114" lengthAdjust="spacing">世界大戦</text>
  </g>

  <!-- 勝利（縦書き） -->
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="306" y="221">勝</text>
    <text x="306" y="250">利</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="340" cy="191" r="7.5"/>
    <circle cx="340" cy="234" r="7.5"/>
    <circle cx="340" cy="279" r="7.5"/>
  </g>
  <g font-size="27" dominant-baseline="central">
    <text x="356" y="191" font-size="26" textLength="324" lengthAdjust="spacingAndGlyphs">民主と共産の二つの世界分離</text>
    <text x="355" y="235" textLength="201" lengthAdjust="spacing">各々長成的基盤</text>
    <text x="356" y="278.5" textLength="286" lengthAdjust="spacing">主権復帰の長成的基台</text>
  </g>
</svg>
