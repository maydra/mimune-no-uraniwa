<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>（3）40日断食と三大試練とをもってサタンを分立した結果</title>

  <g font-size="28" dominant-baseline="central">
    <text x="49" y="37.5" textLength="46" lengthAdjust="spacing">(3)</text>
    <text y="37.5"><tspan x="107" textLength="30" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="146" textLength="650" lengthAdjust="spacing">日断食と三大試練とをもってサタンを分立した結果</tspan></text>
  </g>
  <line x1="108" y1="56.5" x2="796" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 箇条の点 -->
  <g>
    <circle cx="133.5" cy="107.5" r="5.5"/>
    <circle cx="133.5" cy="205" r="5.5"/>
    <circle cx="133.5" cy="291.5" r="5.5"/>
    <circle cx="203" cy="151" r="3.2"/>
    <circle cx="255.5" cy="151" r="3.2"/>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="384,155.5 404,155.5 404,160 416.5,152 404,144 404,148.5 384,148.5"/>
    <polygon points="542,156 561,156 561,160.5 573.5,152.5 561,144.5 561,149 542,149"/>
    <polygon points="293,247.5 313,247.5 313,252 325.5,244 313,236 313,240.5 293,240.5"/>
    <polygon points="562,247.5 581,247.5 581,252 593.5,244 581,236 581,240.5 562,240.5"/>
    <polygon points="307,333 327,333 327,337.5 339.5,329.5 327,321.5 327,326 307,326"/>
    <polygon points="274,370.5 294,370.5 294,375 306.5,367 294,359 294,363.5 274,363.5"/>
  </g>

  <!-- 創造原理 -->
  <g font-size="27" dominant-baseline="central">
    <text x="150" y="107.5" textLength="116" lengthAdjust="spacing">創造原理</text>
    <text x="280" y="107.5" text-anchor="middle">：</text>
  </g>
  <g font-size="25" dominant-baseline="central">
    <text x="164" y="151">正</text>
    <text x="216" y="151">分</text>
    <text x="269" y="151" textLength="105" lengthAdjust="spacing">合三段階</text>
    <text x="427" y="151" textLength="105" lengthAdjust="spacing">四位基台</text>
    <text x="584" y="151" textLength="105" lengthAdjust="spacing">創造目的</text>
  </g>

  <!-- 復帰摂理路程 -->
  <g font-size="27" dominant-baseline="central">
    <text x="150" y="205" textLength="174" lengthAdjust="spacing">復帰摂理路程</text>
    <text x="338" y="205" text-anchor="middle">：</text>
  </g>
  <g font-size="24" dominant-baseline="central">
    <text x="164" y="243.5" textLength="118" lengthAdjust="spacing">三段階延長</text>
    <text y="243.5"><tspan x="334" textLength="24" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="365" textLength="187" lengthAdjust="spacing">日サタン分立基台</tspan></text>
    <text x="604" y="243.5" textLength="94" lengthAdjust="spacing">蕩減復帰</text>
  </g>

  <!-- イエス -->
  <g font-size="27" dominant-baseline="central">
    <text x="151" y="291.5" textLength="86" lengthAdjust="spacing">イエス</text>
    <text x="251" y="291.5" text-anchor="middle">：</text>
  </g>
  <g font-size="25" dominant-baseline="central">
    <text x="164" y="330" textLength="130" lengthAdjust="spacing">三段階試練</text>
    <text y="330"><tspan x="347" textLength="26" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="383" textLength="207" lengthAdjust="spacing">日サタン分立基台</tspan></text>
    <text x="315" y="367" textLength="367" lengthAdjust="spacing">すべての条件を一時に蕩減復帰</text>
  </g>
</svg>
