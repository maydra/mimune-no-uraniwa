<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 蕩減復帰摂理から見た世界大戦の原因</title>

  <!-- 題 -->
  <g dominant-baseline="central" font-size="30">
    <text y="39.5"><tspan x="49.5" text-anchor="middle">Ⅰ</tspan><tspan x="62">.</tspan></text>
    <text x="82" y="39.5" textLength="509" lengthAdjust="spacing">蕩減復帰摂理から見た世界大戦の原因</text>
  </g>
  <line x1="81" y1="58.5" x2="591" y2="58.5" stroke="currentColor" stroke-width="2.8"/>

  <!-- 灰色のつなぎ線（楕円・箱の下に描く） -->
  <g stroke="#8C949A" stroke-width="6.5">
    <line x1="250" y1="133" x2="287" y2="117"/>
    <line x1="250" y1="170" x2="287" y2="191"/>
    <line x1="250" y1="320" x2="288" y2="301"/>
    <line x1="250" y1="354" x2="288" y2="376"/>
  </g>
  <!-- 世界的衝突の矢印 -->
  <polygon points="196,292 202,292 202,209.5 206.5,209.5 199,197.5 191.5,209.5 196,209.5" fill="#8C949A"/>
  <text x="209" y="250.5" font-size="26" dominant-baseline="central" textLength="129" lengthAdjust="spacing">世界的衝突</text>

  <!-- 世界大戦と人間行動 -->
  <ellipse cx="200" cy="150.5" rx="68.25" ry="38.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <text x="200" y="150.5" font-size="28.5" text-anchor="middle" dominant-baseline="central" textLength="114" lengthAdjust="spacing">世界大戦</text>
  <ellipse cx="200" cy="336.5" rx="68.25" ry="38.75" fill="#FCE5E3" stroke="currentColor" stroke-width="2.5"/>
  <text x="200.5" y="336.5" font-size="28.5" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="113" lengthAdjust="spacing">人間行動</text>

  <!-- 外因・内因、外的・内的自由意志 -->
  <g stroke="currentColor" stroke-width="2.5">
    <rect x="283.5" y="94.5" width="106" height="45" rx="6" fill="#A0F08A"/>
    <rect x="283.5" y="165.5" width="106" height="45" rx="6" fill="#F98AEE"/>
    <rect x="284.5" y="280.5" width="193" height="45" rx="6" fill="#A0F08A"/>
    <rect x="284.5" y="351.5" width="193" height="45" rx="6" fill="#F98AEE"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="30">
      <text x="336.5" y="117" textLength="59" lengthAdjust="spacing">外因</text>
      <text x="337" y="188" textLength="58" lengthAdjust="spacing">内因</text>
    </g>
    <g font-size="28.5">
      <text x="381.5" y="303" textLength="171" lengthAdjust="spacing">外的自由意志</text>
      <text x="381" y="373.5" textLength="170" lengthAdjust="spacing">内的自由意志</text>
    </g>
  </g>

  <!-- 右の説明 -->
  <g font-size="28" dominant-baseline="central">
    <text x="400" y="99.5">政治、</text>
    <text x="478" y="99.5">経済、</text>
    <text x="556" y="99.5" textLength="55" lengthAdjust="spacing">思想</text>
    <text x="401" y="134.5" textLength="83" lengthAdjust="spacing">の衝突</text>
    <text x="493.5" y="303" text-anchor="middle">：</text>
    <text x="509" y="303" textLength="143" lengthAdjust="spacing">現実に対応</text>
    <text x="493.5" y="373.5" text-anchor="middle">：</text>
    <text x="508" y="373.5" font-size="26" textLength="182" lengthAdjust="spacing">神のみ旨に順応</text>
  </g>
</svg>
