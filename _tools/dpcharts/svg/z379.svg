<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>国家興亡史　サタン分立と現世（現世 = 終末）</title>

  <!-- 2つの箱（z375・z379・z382・z384 で位置と形をそろえる） -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="205.5" y="127.5" width="428" height="409" fill="#fff" class="paper"/>
    <rect x="665.5" y="127.5" width="428" height="409" fill="#fff" class="paper"/>
    <ellipse cx="414" cy="126" rx="105.6" ry="46.9" fill="#DCC4C4"/>
    <ellipse cx="879.5" cy="121.5" rx="89.6" ry="46" fill="#CF921C"/>
  </g>
  <g fill="#111" dominant-baseline="central">
    <text x="319.2" y="126.5" font-size="40" textLength="186.4" lengthAdjust="spacingAndGlyphs">サタン分立</text>
    <text x="879.5" y="121.5" font-size="57" text-anchor="middle">現世</text>
  </g>

  <!-- 左の箱：時代の移り変わり -->
  <g font-size="45" dominant-baseline="central">
    <text x="289" y="210" textLength="273" lengthAdjust="spacing">氏族主義時代</text>
    <text x="289" y="306" textLength="273" lengthAdjust="spacing">封建主義時代</text>
    <text x="289" y="402" textLength="273" lengthAdjust="spacing">君主主義時代</text>
    <text x="289" y="497.5" textLength="273" lengthAdjust="spacing">民主主義時代</text>
  </g>
  <g fill="#8C949A">
    <polygon points="406.5,247.5 430.5,247.5 430.5,254 449.5,254 418.5,268 387.5,254 406.5,254"/>
    <polygon points="406.5,341.5 430.5,341.5 430.5,348 449.5,348 418.5,362 387.5,348 406.5,348"/>
    <polygon points="406.5,440.5 430.5,440.5 430.5,447 449.5,447 418.5,461 387.5,447 406.5,447"/>
  </g>

  <!-- 右の箱 -->
  <g font-size="41" dominant-baseline="central">
    <text x="710.2" y="241" textLength="331.1" lengthAdjust="spacing">天の側の民主世界</text>
    <text x="710.2" y="323" textLength="335.1" lengthAdjust="spacingAndGlyphs">サタン側の共産世界</text>
    <text x="710.3" y="403.5">分立、<tspan x="835.5">交差</tspan></text>
  </g>

  <!-- 現世 = 終末 -->
  <g font-size="65" dominant-baseline="central">
    <text x="473.5" y="601" textLength="130" lengthAdjust="spacing">現世</text>
    <text x="651" y="601" text-anchor="middle">=</text>
    <text x="700.5" y="601" textLength="130" lengthAdjust="spacing">終末</text>
  </g>
</svg>
