<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(2) 実体基台</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="48" y="40" textLength="40" lengthAdjust="spacingAndGlyphs">(2)</text>
    <text x="103" y="40" textLength="125" lengthAdjust="spacing">実体基台</text>
  </g>
  <line x1="102" y1="59" x2="228" y2="59" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="192.5,209 192.5,164 186,164 195,148 204,164 197.5,164 197.5,209"/>
    <polygon points="481,231.5 280,231.5 280,227 264,234.5 280,242 280,238.5 481,238.5"/>
  </g>

  <!-- 神 -->
  <circle cx="196" cy="111" r="36.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="196" y="112" font-size="42" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- モーセとイスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="195.5" cy="235" rx="61.5" ry="25.5" fill="#F8F28F"/>
    <ellipse cx="582" cy="235" rx="101" ry="29" fill="#F86D42"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="195.5" y="236" textLength="90" lengthAdjust="spacing">モーセ</text>
    <text x="581.5" y="236" textLength="181" lengthAdjust="spacingAndGlyphs">イスラエル民族</text>
  </g>

  <!-- 実体基台の札 -->
  <rect x="308" y="181.5" width="137" height="39.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="319" y="201.5" font-size="28" font-weight="400" dominant-baseline="central" textLength="114" lengthAdjust="spacing">実体基台</text>

  <!-- 字 -->
  <g font-size="25" dominant-baseline="central">
    <text x="259" y="265.5" textLength="223" lengthAdjust="spacing">堕落性を脱ぐための</text>
    <text x="259" y="297.5" textLength="198" lengthAdjust="spacing">民族的な蕩減条件</text>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="142" y="281.5" textLength="103" lengthAdjust="spacing">（アベル）</text>
    <text x="535" y="285" textLength="104" lengthAdjust="spacing">（カイン）</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="202" cy="339.5" r="7"/>
    <circle cx="201.5" cy="378.5" r="7"/>
  </g>
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="216" y="340.5" textLength="115" lengthAdjust="spacing">従順屈伏</text>
    <text x="216" y="379.5" textLength="256" lengthAdjust="spacing">神のみ旨を継承して</text>
    <text x="472" y="379.5">、</text>
    <text x="505" y="379.5" textLength="115" lengthAdjust="spacing">善を繁殖</text>
  </g>
</svg>
