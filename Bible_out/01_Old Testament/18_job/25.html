<h1>ヨブ記 第25章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>そこでシュヒびとビルダデは答えて言った、</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>「大権と恐れとは神と共にある。彼は高き所で平和を施される。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>その軍勢は数えることができるか。何物かその光に浴さないものがあるか。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>それで人はどうして神の前に正しくありえようか。女から生れた者がどうして清くありえようか。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>見よ、月さえも輝かず、星も彼の目には清くない。</p>
<p id="v6"><sup><a href="#v6" class="verse-link">6</a></sup>うじのような人、虫のような人の子はなおさらである」。</p>
</div>
