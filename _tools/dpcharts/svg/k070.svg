<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>次子アベル・長子カイン　原理世界を先に占有→非原理的な原理型世界</title>
  <defs>
    <marker id="k070-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="2.5" markerHeight="2.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="k070-b" viewBox="0 0 13 18" refX="7" refY="9" markerWidth="2" markerHeight="2.77" orient="auto">
      <path d="M0,0 L13,9 L0,18 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 授受の矢印（楕円より先に描く） -->
  <g stroke="currentColor" stroke-width="5.5" fill="none" marker-end="url(#k070-a)">
    <line x1="205" y1="117.5" x2="276.4" y2="164.3"/>
    <line x1="274" y1="182.4" x2="200.6" y2="133.4"/>
    <line x1="350" y1="170.3" x2="416.9" y2="125.8"/>
    <line x1="448" y1="124" x2="373.1" y2="174"/>
  </g>
  <!-- アダムからアベル・カインへ -->
  <g stroke="currentColor" stroke-width="6.5" fill="none" marker-end="url(#k070-b)">
    <line x1="285" y1="223.2" x2="225.2" y2="270.8"/>
    <line x1="350" y1="223.9" x2="410.8" y2="271.3"/>
  </g>

  <!-- 神・サから下への点線の矢印 -->
  <g stroke="currentColor" stroke-width="5" stroke-dasharray="11.3 5.3">
    <line x1="176" y1="136" x2="176" y2="246"/>
    <line x1="463" y1="136" x2="463" y2="246"/>
  </g>
  <g fill="currentColor">
    <polygon points="166.5,245 186.5,245 176.5,264"/>
    <polygon points="453,245 473,245 463,264"/>
  </g>

  <!-- 人物 -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="176.5" cy="98" rx="40.5" ry="30" fill="#fff" class="paper"/>
    <ellipse cx="462" cy="98" rx="47" ry="30" fill="#50403D"/>
    <ellipse cx="316.5" cy="200.5" rx="57.5" ry="32.5" fill="#CF921C"/>
    <ellipse cx="177.5" cy="300.5" rx="57" ry="28.5" fill="#F8F28F"/>
    <ellipse cx="459.5" cy="299.5" rx="57" ry="27.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="175.5" y="98" font-size="35">神</text>
    <text x="461.5" y="98.5" font-size="34" fill="#fff">サ</text>
    <g font-size="25" fill="#111">
      <text x="316.5" y="200.5" textLength="74" lengthAdjust="spacing">アダム</text>
      <text x="178" y="301" textLength="75" lengthAdjust="spacing">アベル</text>
      <text x="459.5" y="298.5" textLength="72" lengthAdjust="spacing">カイン</text>
    </g>
  </g>

  <!-- 灰色の矢印（下へ） -->
  <polygon points="599.5,144 609.5,144 609.5,241 615.5,241 604.5,262 593.5,241 599.5,241" fill="#8C949A"/>

  <!-- 地の上の字 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="508.5" y="193.5" font-size="31" textLength="62" lengthAdjust="spacing">未練</text>
    <text x="180" y="357" font-size="28" textLength="55" lengthAdjust="spacing">次子</text>
    <text x="459" y="355.5" font-size="30" textLength="61" lengthAdjust="spacing">長子</text>
    <g font-size="26">
      <text x="605.5" y="82.5" textLength="104" lengthAdjust="spacing">原理世界</text>
      <text x="605.5" y="116.5" textLength="102" lengthAdjust="spacing">先に占有</text>
      <text x="604" y="289.5" textLength="129" lengthAdjust="spacing">非原理的な</text>
      <text x="604.5" y="324" textLength="130" lengthAdjust="spacing">原理型世界</text>
    </g>
  </g>
</svg>
