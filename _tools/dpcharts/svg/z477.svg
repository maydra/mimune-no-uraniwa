<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復活＝再び活きる　死と生に対する聖書的な概念 → 復活の意義</title>

  <!-- 灰色の矢印（楕円の下に描く） -->
  <polygon points="387.5,230 408,230 408,428.5 418.5,428.5 397.75,471 377,428.5 387.5,428.5" fill="#8C949A"/>

  <!-- 復活 -->
  <ellipse cx="397.5" cy="164.5" rx="131.5" ry="79.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="394" y="161.5" font-size="70" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="140" lengthAdjust="spacing">復活</text>

  <!-- ＝ -->
  <g>
    <rect x="590" y="149.5" width="73" height="8.5"/>
    <rect x="590" y="172.5" width="73" height="9"/>
  </g>
  <text x="703" y="164" font-size="62" dominant-baseline="central" textLength="316" lengthAdjust="spacing">再び活きる</text>

  <!-- 点線と箱 -->
  <line x1="429" y1="335.5" x2="596.5" y2="335.5" stroke="currentColor" stroke-width="8" stroke-dasharray="24.5 11.25"/>
  <rect x="612.5" y="265.5" width="467.5" height="148" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g font-size="58" dominant-baseline="central">
    <text x="641" y="305.5" textLength="412" lengthAdjust="spacing">死と生に対する</text>
    <text x="641" y="372" textLength="351" lengthAdjust="spacing">聖書的な概念</text>
  </g>

  <!-- 復活の意義 -->
  <rect x="210" y="480.5" width="375.5" height="119" rx="29" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="241" y="538" font-size="62" dominant-baseline="central" textLength="314" lengthAdjust="spacing">復活の意義</text>
</svg>
