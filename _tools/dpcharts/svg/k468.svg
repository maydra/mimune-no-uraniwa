<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>例：③ イエス</title>

  <!-- 例：③ イエス -->
  <g font-size="28" dominant-baseline="central">
    <text x="129" y="37.5" textLength="27" lengthAdjust="spacingAndGlyphs">例</text>
    <text x="172.5" y="37.5" text-anchor="middle">：</text>
    <text x="201.5" y="37.5" font-size="20" text-anchor="middle">3</text>
    <text x="224" y="37.5" textLength="81" lengthAdjust="spacing">イエス</text>
  </g>
  <circle cx="201.5" cy="37.5" r="12.5" fill="none" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦的な蕩減条件（縦の札） -->
  <rect x="176.5" y="89.5" width="47" height="233" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="200" y="120">縦</text>
    <text x="200" y="149">的</text>
    <text x="200" y="178">な</text>
    <text x="200" y="207">蕩</text>
    <text x="200" y="236">減</text>
    <text x="200" y="265">条</text>
    <text x="200" y="294">件</text>
  </g>

  <!-- 黒い下向きの矢印 -->
  <polygon points="294,142 318.5,142 318.5,152 334.5,152 306.5,163.5 279,152 294,152"/>
  <polygon points="296,245.5 320.5,245.5 320.5,255.5 336.5,255.5 308,266.5 280,255.5 296,255.5"/>

  <!-- ヤコブ・モーセ・イエス -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.8">
    <ellipse cx="307" cy="101" rx="53.5" ry="33.5"/>
    <ellipse cx="307" cy="204" rx="53.5" ry="33.5"/>
    <ellipse cx="309" cy="307" rx="53.5" ry="33.5"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="307" y="100.5" textLength="80" lengthAdjust="spacing">ヤコブ</text>
    <text x="307.5" y="204" textLength="81" lengthAdjust="spacing">モーセ</text>
    <text x="309" y="307" textLength="82" lengthAdjust="spacing">イエス</text>
  </g>

  <!-- 12 と 70 -->
  <g font-size="27" dominant-baseline="central">
    <text y="101"><tspan x="373" font-size="29" textLength="31" lengthAdjust="spacingAndGlyphs">12</tspan><tspan x="414" textLength="54" lengthAdjust="spacing">子息</tspan><tspan x="469">、</tspan><tspan x="499" font-size="29" textLength="31" lengthAdjust="spacingAndGlyphs">70</tspan><tspan x="533" textLength="84" lengthAdjust="spacing">人家族</tspan></text>
    <text y="204"><tspan x="373" font-size="29" textLength="31" lengthAdjust="spacingAndGlyphs">12</tspan><tspan x="414" textLength="55" lengthAdjust="spacing">部族</tspan><tspan x="469">、</tspan><tspan x="499" font-size="29" textLength="31" lengthAdjust="spacingAndGlyphs">70</tspan><tspan x="533" textLength="54" lengthAdjust="spacing">長老</tspan></text>
    <text y="287"><tspan x="373" font-size="29" textLength="31" lengthAdjust="spacingAndGlyphs">12</tspan><tspan x="414" textLength="54" lengthAdjust="spacing">弟子</tspan><tspan x="469">、</tspan><tspan x="499" font-size="29" textLength="31" lengthAdjust="spacingAndGlyphs">70</tspan><tspan x="533" textLength="84" lengthAdjust="spacing">人門徒</tspan></text>
    <text y="326.5"><tspan x="374">「</tspan><tspan x="388" font-size="29" textLength="31" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="423" textLength="140" lengthAdjust="spacing">日断食祈祷</tspan><tspan x="561">」</tspan></text>
  </g>

  <!-- 横的に蕩減復帰 -->
  <rect x="376.5" y="364.5" width="230" height="40" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="392" y="383.5" font-size="27" dominant-baseline="central" fill="#111" textLength="199" lengthAdjust="spacing">横的に蕩減復帰</text>
</svg>
