<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(3) 信仰の期間を蕩減復帰する摂理から見た時代区分</title>

  <text x="45.5" y="36.5" font-size="30" dominant-baseline="central" textLength="46" lengthAdjust="spacingAndGlyphs">(3)</text>
  <text x="100" y="36.5" font-size="30" dominant-baseline="central" textLength="689" lengthAdjust="spacing">信仰の期間を蕩減復帰する摂理から見た時代区分</text>
  <line x1="100" y1="55.5" x2="788" y2="55.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 段の横線（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="135" y1="121" x2="683.5" y2="121"/>
    <line x1="135" y1="188" x2="683.5" y2="188"/>
    <line x1="135" y1="252" x2="683.5" y2="252"/>
    <line x1="135" y1="319" x2="683.5" y2="319"/>
  </g>

  <!-- 2000年の弧（字の所で切れる） -->
  <g fill="none" stroke="currentColor" stroke-width="2.2">
    <path d="M234,382 A47,62 0 0 0 262,369.8 M276.3,347.1 A47,62 0 0 0 281,320"/>
    <path d="M281,320 A53,67 0 0 0 310.1,309 M327.5,285.1 A53,67 0 0 0 334,253"/>
    <path d="M334,253 A48,62 0 0 0 357.6,245 M376.4,220 A48,62 0 0 0 382,191"/>
  </g>

  <!-- 2000年ずつ上る矢印 -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="234" y1="382" x2="264.1" y2="342.3"/>
    <line x1="281" y1="320" x2="316.6" y2="275"/>
    <line x1="334" y1="253" x2="364.9" y2="213.1"/>
    <line x1="382" y1="191" x2="382" y2="135"/>
  </g>
  <g>
    <polygon points="271.9,332 269.7,349 256.1,338.8"/>
    <polygon points="324.7,264.8 322.1,281.8 308.7,271.3"/>
    <polygon points="372.8,202.9 370.4,219.9 356.9,209.5"/>
    <polygon points="382,122 373.5,137 390.5,137"/>
  </g>

  <!-- アダム・アブラハム・イエス・再臨主 -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="170.5" cy="381.5" rx="45.5" ry="18.5" fill="#CF921C"/>
    <ellipse cx="200.5" cy="319.5" rx="62" ry="19" fill="#FCE5E3"/>
    <ellipse cx="263" cy="254" rx="50.5" ry="19" fill="#F8F28F"/>
    <ellipse cx="310" cy="190" rx="50.5" ry="19" fill="#fff" class="paper"/>
  </g>
  <g font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="170.5" y="381.5" fill="#111">アダム</text>
    <text x="201" y="318.5" fill="#111">アブラハム</text>
    <text x="262.5" y="254" fill="#111">イエス</text>
    <text x="310" y="190">再臨主</text>
  </g>

  <g>
    <circle cx="234" cy="382" r="8.5"/>
    <circle cx="281" cy="320" r="8.5"/>
    <circle cx="334" cy="253" r="8.5"/>
    <circle cx="382" cy="191" r="8.5"/>
  </g>
  <g font-size="21" font-weight="400" dominant-baseline="central">
    <text x="267.5" y="359.5" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
    <text x="315.5" y="297" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
    <text x="362.5" y="232.5" textLength="70" lengthAdjust="spacingAndGlyphs">2000年</text>
  </g>

  <!-- 時代の名前 -->
  <g font-size="23.5" dominant-baseline="central">
    <text x="444" y="155.5">蕩減復帰摂理完成時代</text>
    <text x="444" y="221.5">蕩減復帰摂理延長時代</text>
    <text x="444" y="287.5">蕩減復帰摂理時代</text>
    <text x="444" y="352">蕩減復帰基台摂理時代</text>
  </g>
</svg>
