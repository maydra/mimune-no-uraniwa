<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>理想社会の経済機構</title>

  <!-- 縦書き「理想社会の / 経済機構」 -->
  <g font-size="29" text-anchor="middle" dominant-baseline="central">
    <text x="233.5" y="69.5">理</text>
    <text x="233.5" y="100.5">想</text>
    <text x="233.5" y="132.5">社</text>
    <text x="233.5" y="164.5">会</text>
    <text x="233.5" y="196.5">の</text>
    <text x="196" y="85.5">経</text>
    <text x="196" y="116.5">済</text>
    <text x="196" y="148.5">機</text>
    <text x="196" y="180">構</text>
  </g>

  <!-- 灰色の括弧 -->
  <path d="M285,72.5 H266.5 V188.5 H285 M266.5,131.5 H285" fill="none" stroke="#8C949A" stroke-width="6"/>

  <!-- 右の字 -->
  <g font-size="30" dominant-baseline="central">
    <text y="73"><tspan x="295" textLength="62" lengthAdjust="spacing">生産</tspan><tspan x="371.5" text-anchor="middle">（</tspan><tspan x="380" textLength="60" lengthAdjust="spacing">胃腸</tspan><tspan x="446.5" text-anchor="middle">）</tspan><tspan x="471.5" text-anchor="middle">：</tspan><tspan x="488" textLength="62" lengthAdjust="spacing">必要</tspan><tspan x="551">、</tspan><tspan x="583" textLength="62" lengthAdjust="spacing">十分</tspan></text>
    <text y="132"><tspan x="295" textLength="62" lengthAdjust="spacing">分配</tspan><tspan x="371.5" text-anchor="middle">（</tspan><tspan x="377" textLength="64" lengthAdjust="spacing">心臓</tspan><tspan x="446.5" text-anchor="middle">）</tspan><tspan x="471.5" text-anchor="middle">：</tspan><tspan x="488" textLength="62" lengthAdjust="spacing">公平</tspan></text>
    <text y="191.5"><tspan x="295" textLength="62" lengthAdjust="spacing">消費</tspan><tspan x="371.5" text-anchor="middle">（</tspan><tspan x="377" textLength="64" lengthAdjust="spacing">肺臓</tspan><tspan x="446.5" text-anchor="middle">）</tspan><tspan x="471.5" text-anchor="middle">：</tspan><tspan x="488" textLength="94" lengthAdjust="spacing">合理的</tspan></text>
  </g>
  <text y="232" font-size="28" dominant-baseline="central"><tspan x="303" text-anchor="middle">（</tspan><tspan x="309" textLength="231" lengthAdjust="spacing">有機的な授受関係</tspan><tspan x="546" text-anchor="middle">）</tspan></text>

  <!-- 矢印 -->
  <polygon points="205,240 218,240 218,259 230,259 211.5,281 193,259 205,259" fill="#8C949A" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- 産業革命 -->
  <rect x="156.5" y="302.5" width="504" height="93" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text y="329"><tspan x="176" textLength="116" lengthAdjust="spacing">産業革命</tspan><tspan x="306.5" text-anchor="middle">：</tspan><tspan x="321" textLength="289" lengthAdjust="spacing">大量生産で植民地開拓</tspan></text>
    <text y="368.5"><tspan x="306" text-anchor="middle">：</tspan><tspan x="320" textLength="320" lengthAdjust="spacing">福音伝播のための版図造成</tspan></text>
  </g>
</svg>
