<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. イエスの路程が見せてくれた教訓</title>

  <text x="34" y="37" font-size="30" dominant-baseline="central">Ⅳ.</text>
  <text x="81" y="37" font-size="31" dominant-baseline="central" textLength="470" lengthAdjust="spacing">イエスの路程が見せてくれた教訓</text>
  <line x1="79.5" y1="55.5" x2="552.5" y2="55.5" stroke="currentColor" stroke-width="2"/>

  <!-- 番号 -->
  <g font-size="29" dominant-baseline="central">
    <text x="131" y="115.5">①</text>
    <text x="131" y="190.5">②</text>
    <text x="131" y="263.5">③</text>
    <text x="131" y="370">④</text>
  </g>

  <!-- 本文 -->
  <g font-size="28.5" dominant-baseline="central">
    <text x="171" y="115.5" textLength="287" lengthAdjust="spacing">み旨に対する神の予定</text>
    <text x="517" y="115.5" textLength="86" lengthAdjust="spacing">絶対的</text>
    <text x="171" y="190.5" textLength="344" lengthAdjust="spacing">み旨成就に対する神の予定</text>
    <text x="575" y="190.5" textLength="86" lengthAdjust="spacing">相対的</text>
    <text x="170" y="263.5" textLength="201.5" lengthAdjust="spacing">人間の責任分担</text>
    <text y="263.5"><tspan x="431" textLength="143" lengthAdjust="spacing">干渉されず</tspan><tspan x="574">、</tspan></text>
    <text x="428" y="300.5" textLength="114" lengthAdjust="spacing">結果主管</text>
    <text x="170" y="370" textLength="285" lengthAdjust="spacingAndGlyphs">大きい使命を担った人物</text>
    <text x="513" y="370" textLength="171" lengthAdjust="spacing">試練も大きい</text>
  </g>

  <!-- … -->
  <g>
    <circle cx="478" cy="115" r="2.4"/>
    <circle cx="487.5" cy="115" r="2.4"/>
    <circle cx="497" cy="115" r="2.4"/>
    <circle cx="536" cy="190.5" r="2.4"/>
    <circle cx="545" cy="190.5" r="2.4"/>
    <circle cx="555" cy="190.5" r="2.4"/>
    <circle cx="391" cy="264" r="2.4"/>
    <circle cx="401" cy="264" r="2.4"/>
    <circle cx="410" cy="264" r="2.4"/>
    <circle cx="474" cy="370" r="2.4"/>
    <circle cx="483" cy="370" r="2.4"/>
    <circle cx="493" cy="370" r="2.4"/>
  </g>
</svg>
