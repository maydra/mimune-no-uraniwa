<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天使と人間との淫行</title>

  <text x="54" y="58.5" font-size="48" dominant-baseline="central">3.</text>
  <text x="116" y="57.5" font-size="48" dominant-baseline="central" textLength="450" lengthAdjust="spacing">天使と人間との淫行</text>
  <line x1="116" y1="88" x2="566" y2="88" stroke="currentColor" stroke-width="3.5"/>

  <!-- 人間・天使・淫行関係の箱 -->
  <g fill="#50403D" stroke="currentColor" stroke-width="4.5">
    <rect x="208.25" y="132.25" width="266.5" height="143.5"/>
    <rect x="818.25" y="132.25" width="267.5" height="133.5"/>
    <rect x="501.25" y="386.25" width="283.5" height="85.5"/>
  </g>
  <g font-size="45" dominant-baseline="central" fill="#fff">
    <text x="227" y="172" textLength="90" lengthAdjust="spacing">人間</text>
    <text x="338.5" y="172" text-anchor="middle">：</text>
    <text x="362" y="172" textLength="90" lengthAdjust="spacing">淫行</text>
    <text x="228" y="234.5" textLength="135" lengthAdjust="spacing">で堕落</text>
    <text x="840" y="168.5" textLength="90" lengthAdjust="spacing">天使</text>
    <text x="951.5" y="168.5" text-anchor="middle">：</text>
    <text x="975" y="168.5" textLength="90" lengthAdjust="spacing">淫行</text>
    <text x="841" y="231" textLength="135" lengthAdjust="spacing">で堕落</text>
  </g>
  <text x="532" y="428" font-size="53" dominant-baseline="central" fill="#fff" textLength="215" lengthAdjust="spacing">淫行関係</text>

  <!-- 行き来の矢印 -->
  <g>
    <polygon points="505,149 757,149 757,140 782,154.5 757,169 757,161 505,161"/>
    <polygon points="782,182 530,182 530,173 505,187.5 530,202 530,194 782,194"/>
  </g>
  <text x="545" y="244" font-size="48" dominant-baseline="central" textLength="200" lengthAdjust="spacing">情的関係</text>
  <polygon points="633,289 654,289 654,333 670,333 643.5,365 617,333 633,333" fill="#8C949A"/>

  <!-- 聖句 -->
  <g font-size="38" dominant-baseline="central">
    <text x="208" y="494.5" textLength="120" lengthAdjust="spacing">ヨハネ</text>
    <text x="339" y="494.5" textLength="85" lengthAdjust="spacing">8:44</text>
  </g>
  <g font-size="37" font-weight="400" dominant-baseline="central">
    <text x="263" y="547.5" text-anchor="end">『</text>
    <text x="263" y="547.5" textLength="430" lengthAdjust="spacing">あなたがたは自分の父、</text>
    <text x="693" y="547.5" textLength="195.5" lengthAdjust="spacing">すなわち、</text>
    <text x="888.5" y="547.5" textLength="195.5" lengthAdjust="spacing">悪魔から出</text>
    <text x="263" y="594" textLength="352" lengthAdjust="spacing">てきた者であって、</text>
    <text x="615" y="594" textLength="469" lengthAdjust="spacing">その父の欲望どおりを行お</text>
    <text x="263" y="640" textLength="262" lengthAdjust="spacing">うと思っている</text>
    <text x="523" y="640">』</text>
  </g>
</svg>
