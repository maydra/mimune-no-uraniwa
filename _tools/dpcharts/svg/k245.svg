<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ 延長された摂理期間を蕩減復帰する条件</title>

  <!-- 題 -->
  <g font-size="29" dominant-baseline="central">
    <text x="34" y="83">③</text>
    <text x="73" y="83" textLength="494" lengthAdjust="spacing">延長された摂理期間を蕩減復帰する条件</text>
  </g>

  <!-- 40 日サタン分立基台 -->
  <polygon points="211,119.5 228,119.5 228,115 241,122.5 228,130 228,125.5 211,125.5" fill="#8C949A"/>
  <g font-size="29" dominant-baseline="central">
    <text x="253" y="123.5" textLength="29" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="293" y="123.5" textLength="227" lengthAdjust="spacing">日サタン分立基台</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="259.5" cy="175" r="6.5"/>
    <circle cx="260" cy="222" r="6.5"/>
    <circle cx="260" cy="299.5" r="6.5"/>
  </g>
  <g font-size="27" dominant-baseline="central">
    <text x="276" y="174.5" textLength="128" lengthAdjust="spacing">ノアの箱舟</text>
    <text x="411" y="174.5" textLength="27" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="447" y="174.5">日</text>
    <text x="275" y="221.5" textLength="154" lengthAdjust="spacing">アブラハムの</text>
    <text x="437" y="221.5" textLength="40" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="484" y="221.5">年</text>
    <text x="274" y="300" textLength="323" lengthAdjust="spacing">イスラエル民族エジプト苦役</text>
    <text x="603" y="300" textLength="40" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="648" y="300">年</text>
  </g>
  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="270" y="253" textLength="61" lengthAdjust="spacing">（ノア</text>
    <text x="369" y="253" textLength="135" lengthAdjust="spacing">アブラハム）</text>
  </g>
  <polygon points="340,251 352,251 352,247 363,253.5 352,260 352,256 340,256" fill="#8C949A"/>

  <!-- 箱 -->
  <rect x="144" y="354" width="535" height="44" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="162" y="376.5" font-size="28" dominant-baseline="central" textLength="500" lengthAdjust="spacing" fill="#111">供え物の代わりにみ言で「信仰基台」復帰</text>
</svg>
