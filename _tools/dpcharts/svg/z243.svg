<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人間（霊人体）と天使の性的堕落は可能</title>

  <!-- 人間と天使 -->
  <g stroke="currentColor" stroke-width="6">
    <ellipse cx="396" cy="149.5" rx="98.5" ry="58" fill="#FCE5E3"/>
    <ellipse cx="906" cy="149.5" rx="98.5" ry="58" fill="#B9C2C6"/>
  </g>
  <g font-size="55" dominant-baseline="central" fill="#111">
    <text x="330" y="149.5" textLength="129" lengthAdjust="spacing">人間</text>
    <text x="840" y="149.5" textLength="131" lengthAdjust="spacing">天使</text>
  </g>
  <g font-size="42" dominant-baseline="central">
    <text x="316" y="245" textLength="156" lengthAdjust="spacing">(霊人体)</text>
    <text x="810" y="245" textLength="198" lengthAdjust="spacing">(霊的存在)</text>
  </g>

  <!-- 行き来の矢印と点線 -->
  <g>
    <polygon points="531,123.5 759,123.5 759,117.5 780,128 759,138.5 759,132.5 531,132.5"/>
    <polygon points="773,163.5 545,163.5 545,157.5 524.5,168 545,178.5 545,172.5 773,172.5"/>
  </g>
  <line x1="650.5" y1="193" x2="650.5" y2="348.5" stroke="currentColor" stroke-width="6" stroke-dasharray="8.5 7.83"/>

  <text x="230" y="393.5" font-size="47" dominant-baseline="central" textLength="844" lengthAdjust="spacingAndGlyphs">実体的存在の間における感性と異ならず</text>
  <polygon points="644,437 656,437 656,471 664,471 649.75,492.5 635.5,471 644,471" fill="#8C949A"/>

  <rect x="448.25" y="504.25" width="403.5" height="85.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="481" y="547.5" font-size="48" dominant-baseline="central" fill="#111" textLength="343" lengthAdjust="spacing">性的堕落は可能</text>
</svg>
