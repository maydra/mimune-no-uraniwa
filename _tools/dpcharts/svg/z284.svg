<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>堕落性本性</title>

  <text x="55" y="77.5" font-size="48">Ⅵ.</text>
  <text x="127" y="59" font-size="49.5" dominant-baseline="central" textLength="249" lengthAdjust="spacing">堕落性本性</text>
  <line x1="127" y1="89" x2="376" y2="89" stroke="currentColor" stroke-width="3"/>

  <!-- 神とのつながり（円の下に描く） -->
  <g fill="none" stroke="currentColor" stroke-width="9">
    <line x1="318.3" y1="314.9" x2="480" y2="189.8" stroke-dasharray="19 9" stroke-dashoffset="2"/>
    <line x1="499.7" y1="180.5" x2="622.7" y2="334.5"/>
    <line x1="480" y1="180.9" x2="939" y2="323.7"/>
  </g>
  <!-- 切れたことを示す × -->
  <g stroke="currentColor" stroke-width="10">
    <line x1="346" y1="257.3" x2="431" y2="256.8"/>
    <line x1="377.7" y1="216.1" x2="399" y2="299"/>
    <line x1="514.8" y1="256.8" x2="599.2" y2="252.5"/>
    <line x1="565.5" y1="212.6" x2="548.4" y2="295.9"/>
    <line x1="661.5" y1="272.3" x2="731.5" y2="225.2"/>
    <line x1="682.4" y1="209.3" x2="710.9" y2="288.6"/>
  </g>

  <!-- 天 → エ → ア -->
  <g>
    <polygon points="363.5,328.5 523.5,328.5 523.5,320.5 545.5,334 523.5,347.5 523.5,339.5 363.5,339.5"/>
    <polygon points="680.5,330.5 849.5,330.5 849.5,322.5 871.5,336 849.5,349.5 849.5,341.5 680.5,341.5"/>
  </g>

  <g stroke="currentColor" stroke-width="5">
    <ellipse cx="480" cy="180.5" rx="56" ry="53.5" fill="#fff" class="paper"/>
    <ellipse cx="297" cy="334.5" rx="57" ry="53.5" fill="#50403D"/>
    <ellipse cx="612" cy="334.5" rx="56" ry="53.5" fill="#CF921C"/>
    <ellipse cx="939" cy="334.5" rx="56" ry="53.5" fill="#CF921C"/>
  </g>
  <g font-size="64" text-anchor="middle" dominant-baseline="central">
    <text x="477.5" y="178.5">神</text>
    <text x="295.5" y="334" fill="#fff">天</text>
    <text x="611.5" y="333" fill="#111">エ</text>
    <text x="941" y="332.5" font-size="66" fill="#111">ア</text>
  </g>

  <!-- 堕落性本性 ⇒ -->
  <text x="319" y="470" font-size="45.5" text-anchor="middle" dominant-baseline="central">堕落性本性</text>
  <polygon points="459.5,455.5 479.5,455.5 479.5,442.5 500,471.5 479.5,500.5 479.5,487.5 459.5,487.5" fill="#8C949A"/>
  <rect x="527" y="426" width="548.5" height="203.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="41" dominant-baseline="central" fill="#111">
    <text x="552.5" y="471">堕落人間の</text>
    <text x="552.5" y="529">すべての堕落性を誘発する</text>
    <text x="552.5" y="587.5">根本的な性稟</text>
  </g>
</svg>
