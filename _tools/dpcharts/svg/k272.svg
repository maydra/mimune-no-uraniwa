<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『第三の奇跡（出エ 4:9）』</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="145" y="38" text-anchor="end">『</text>
    <text x="145" y="38" textLength="157" lengthAdjust="spacing">第三の奇跡</text>
    <text x="311" y="38" textLength="67" lengthAdjust="spacingAndGlyphs">(出エ</text>
    <text x="394" y="38" text-anchor="middle">4</text>
    <text x="408.5" y="38" text-anchor="middle">:</text>
    <text x="416" y="38" textLength="24" lengthAdjust="spacingAndGlyphs">9)</text>
    <text x="445" y="38">』</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="218,156 223,156 223,242 227.5,242 220.5,254.5 213.5,242 218,242"/>
    <polygon points="520.5,170 525.5,170 525.5,242 530,242 523,254.5 516,242 520.5,242"/>
    <polygon points="206,264.5 237,264.5 237,260 249.5,267 237,274 237,269.5 206,269.5"/>
    <polygon points="504,264.5 542,264.5 542,260 555.5,267 542,274 542,269.5 504,269.5"/>
    <polygon points="324,186 349,186 349,172 373.5,195 349,218 349,204 324,204"/>
  </g>

  <!-- 白い楕円 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="222.5" cy="132.5" rx="52" ry="24"/>
    <ellipse cx="523" cy="128" rx="62.5" ry="42.5"/>
    <ellipse cx="162" cy="267" rx="43.5" ry="28.5"/>
    <ellipse cx="286.5" cy="267" rx="28" ry="28.5"/>
  </g>
  <ellipse cx="442" cy="267" rx="62.5" ry="42.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <ellipse cx="622" cy="267" rx="62.5" ry="42.5" fill="#FCE5E3" stroke="currentColor" stroke-width="2.2"/>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="221" y="132.5" font-size="25" textLength="74" lengthAdjust="spacing">モーセ</text>
    <text x="523" y="115.5" font-size="26" textLength="101" lengthAdjust="spacing">イエスと</text>
    <text x="524" y="145.5" font-size="26" textLength="56" lengthAdjust="spacing">聖霊</text>
    <text x="161" y="266.5" font-size="24" textLength="70" lengthAdjust="spacing">川の水</text>
    <text x="286.5" y="266.5" font-size="29">血</text>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="442" y="268" font-size="25" textLength="103" lengthAdjust="spacing">堕落人間</text>
    <text x="602.5" y="268" font-size="26">子</text>
    <text x="640" y="268" font-size="26">女</text>
  </g>

  <!-- 下の字 -->
  <g font-size="25" dominant-baseline="central">
    <text x="123" y="342.5" textLength="78" lengthAdjust="spacing">無機物</text>
    <text x="246" y="342.5" textLength="78" lengthAdjust="spacing">有機物</text>
    <text x="359" y="342.5" textLength="157" lengthAdjust="spacing">命がない存在</text>
    <text x="540" y="342.5" textLength="158" lengthAdjust="spacing">命がある存在</text>
  </g>
</svg>
