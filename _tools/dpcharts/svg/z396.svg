<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>供え物・律法・福音と新しい真理</title>
  <defs>
    <linearGradient id="z396-o" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="742" y2="0">
      <stop offset="0" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
  </defs>

  <!-- 白から橙への三角形 -->
  <polygon points="262,477.5 742,477.5 742,125" fill="url(#z396-o)"/>

  <!-- 三角形の中の点線と破線 -->
  <g stroke="#111" fill="none">
    <line x1="434" y1="340.7" x2="434" y2="477" stroke-width="7.5" stroke-dasharray="8.5 7.8"/>
    <line x1="585.5" y1="239.6" x2="585.5" y2="477" stroke-width="8" stroke-dasharray="8.5 7.88"/>
    <line x1="741" y1="143" x2="741" y2="477" stroke-width="7" stroke-dasharray="16.5 7.73"/>
  </g>

  <!-- 神から右へ、下へ -->
  <polyline points="727,125.5 262.5,125.5 262.5,448" fill="none" stroke="currentColor" stroke-width="8"/>
  <polygon points="250.5,447 274.5,447 262.5,469"/>

  <!-- 今日へ（横の矢印） -->
  <line x1="262" y1="477.5" x2="804" y2="477.5" stroke="currentColor" stroke-width="8"/>
  <polygon points="803,459.5 803,493.5 837.5,477.5"/>

  <!-- 斜めの矢印 -->
  <line x1="262" y1="476.5" x2="711.1" y2="147.7" stroke="currentColor" stroke-width="8.5"/>
  <polygon points="704,138 734,131 718.2,157.4"/>

  <circle cx="741" cy="120" r="16" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <circle cx="262" cy="84" r="40" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>

  <!-- 下の楕円 -->
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="258" cy="564.5" rx="34" ry="76.5" fill="#CF921C"/>
    <ellipse cx="434" cy="564.5" rx="34" ry="76.5" fill="#FCE5E3"/>
    <ellipse cx="588" cy="564.5" rx="34" ry="76.5" fill="#F8F28F"/>
    <ellipse cx="743" cy="564.5" rx="34" ry="76.5" fill="#F8F28F"/>
  </g>

  <rect x="777.5" y="54" width="242" height="74" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="259" y="82" font-size="48">神</text>
    <text x="322.5" y="375" font-size="40" textLength="102" lengthAdjust="spacingAndGlyphs">供え物</text>
    <text x="437" y="292" font-size="41">律法</text>
    <text x="587.5" y="187.5" font-size="43">福音</text>
    <text x="856" y="523" font-size="43">今日</text>
    <text x="898" y="91" font-size="40" fill="#111" textLength="206" lengthAdjust="spacing">新しい真理</text>
    <!-- 縦書き（1字ずつ） -->
    <g font-size="40" fill="#111">
      <text x="258.5" y="533">人</text>
      <text x="258" y="588">間</text>
      <text x="434" y="523.5">モ</text>
      <text x="434.5" y="565">｜</text>
      <text x="433.5" y="605.5">セ</text>
      <text x="587" y="523.5">イ</text>
      <text x="588.5" y="565">エ</text>
      <text x="588.5" y="607.5">ス</text>
      <text x="743" y="524">再</text>
      <text x="743.5" y="565">臨</text>
      <text x="743" y="608">主</text>
    </g>
  </g>

  <g font-size="37.5" dominant-baseline="central">
    <text y="170.5"><tspan x="807.5" text-anchor="middle">①</tspan><tspan x="831" textLength="151" lengthAdjust="spacing">科学的な</tspan></text>
    <text x="831" y="216.5" textLength="151" lengthAdjust="spacing">表現方法</text>
    <text y="274.5"><tspan x="807.5" text-anchor="middle">②</tspan><tspan x="831" textLength="113" lengthAdjust="spacing">聖書の</tspan></text>
    <text x="831" y="321" textLength="226" lengthAdjust="spacing">根本内容解明</text>
  </g>
</svg>
