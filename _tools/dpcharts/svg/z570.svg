<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>み旨成就は、どの程度に予定されるのか？</title>

  <g font-size="49" dominant-baseline="central">
    <text x="51.5" y="55" textLength="276" lengthAdjust="spacing">み旨成就は、</text>
    <text x="330" y="55" textLength="639" lengthAdjust="spacing">どの程度に予定されるのか？</text>
  </g>
  <line x1="52" y1="85.5" x2="972" y2="85.5" stroke="currentColor" stroke-width="4"/>

  <!-- み旨成就＝神責任分担＋人間責任分担 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="227.25" y="150.25" width="238.5" height="166.5" rx="41" fill="#CDF8F7"/>
    <rect x="537.25" y="152.25" width="230.5" height="166.5" rx="41" fill="#fff" class="paper"/>
    <rect x="854.25" y="152.25" width="231.5" height="166.5" rx="41" fill="#FCE5E3"/>
    <rect x="243.25" y="342.25" width="206.5" height="86.5" rx="19" fill="#CDF8F7"/>
    <rect x="548.25" y="342.25" width="208.5" height="87.5" rx="19" fill="#fff" class="paper"/>
    <rect x="866.25" y="342.25" width="207.5" height="86.5" rx="19" fill="#FCE5E3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="346.5" y="232.5" font-size="49" textLength="200" lengthAdjust="spacing" fill="#111">み旨成就</text>
    <text x="651" y="206" font-size="50">神</text>
    <text x="652.5" y="266" font-size="45.5" textLength="183" lengthAdjust="spacing">責任分担</text>
    <text x="968.5" y="204.5" font-size="45" fill="#111">人間</text>
    <text x="969.5" y="266" font-size="45.5" textLength="183" lengthAdjust="spacing" fill="#111">責任分担</text>
  </g>
  <!-- ＝ と ＋ -->
  <g>
    <rect x="481" y="222" width="40" height="4"/>
    <rect x="481" y="245" width="40" height="4"/>
    <rect x="783" y="234" width="59" height="5"/>
    <rect x="810" y="212" width="5" height="49"/>
  </g>

  <!-- 割合 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="315" y="383.5" font-size="58" textLength="109" lengthAdjust="spacingAndGlyphs" fill="#111">100</text>
    <text x="404" y="382.5" font-size="48" fill="#111">％</text>
    <text x="620.5" y="383.5" font-size="58" textLength="72.5" lengthAdjust="spacingAndGlyphs">95</text>
    <text x="693" y="382.5" font-size="48">％</text>
    <text x="928.5" y="384" font-size="58" fill="#111">5</text>
    <text x="1002" y="382.5" font-size="48" fill="#111">％</text>
  </g>

  <rect x="278" y="491" width="745" height="86" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="49" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="550" y="532" textLength="500" lengthAdjust="spacing">み旨成就に対する予定</text>
    <text x="824.5" y="532">：</text>
    <text x="924.5" y="532" textLength="150" lengthAdjust="spacing">相対的</text>
  </g>
</svg>
