<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 信仰のための戒めが必要な期間</title>
  <defs>
    <marker id="z263-g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2" markerHeight="2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <text x="55" y="59" font-size="48" dominant-baseline="central">Ⅲ.</text>
  <text x="129" y="59" font-size="48" dominant-baseline="central" textLength="702" lengthAdjust="spacing">信仰のための戒めが必要な期間</text>
  <line x1="129" y1="89.5" x2="829" y2="89.5" stroke="currentColor" stroke-width="3.5"/>

  <rect x="305.5" y="114.5" width="286.5" height="58.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="323" y="144" font-size="40" dominant-baseline="central" textLength="250" lengthAdjust="spacing" fill="#111">第二祝福完成</text>

  <!-- 四位の線（円の下に描く） -->
  <g stroke="currentColor" stroke-width="7">
    <line x1="448" y1="220.5" x2="363.6" y2="295.5"/>
    <line x1="439" y1="220.5" x2="523.4" y2="295.5"/>
    <line x1="371" y1="295.5" x2="454.9" y2="370"/>
    <line x1="516" y1="295.5" x2="432.1" y2="370"/>
  </g>

  <!-- 授受作用の矢印 -->
  <g stroke="#8C949A" stroke-width="5.5" fill="none" marker-end="url(#z263-g)">
    <path d="M438,336 Q418,297 437.5,262"/>
    <path d="M451,258 Q471,296.5 452,332"/>
    <path d="M392,291 Q444.5,279.5 491.5,289"/>
    <path d="M496,300 Q444.5,313.5 398.5,302"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <circle cx="443.5" cy="220.5" r="31.5" fill="#fff" class="paper"/>
    <circle cx="355" cy="295.5" r="28.6" fill="#F98AEE"/>
    <circle cx="532.5" cy="295.5" r="28.7" fill="#A0F08A"/>
    <ellipse cx="443.5" cy="370" rx="47.75" ry="28" fill="#DCC4C4" stroke-width="4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="443.5" y="221" font-size="40">神</text>
    <g fill="#111">
      <text x="356" y="297.5" font-size="40">ア</text>
      <text x="533.5" y="296.5" font-size="40">エ</text>
      <text x="443" y="370" font-size="37">子女</text>
    </g>
  </g>

  <!-- 未完成期の矢印（灰色の面と縁） -->
  <polygon points="442.75,405 508.5,449.5 475,449.5 475,591.5 410,591.5 410,449.5 377,449.5" fill="#C4CCD3" stroke="currentColor" stroke-width="4.5"/>
  <g fill="#8C949A">
    <rect x="348" y="463.5" width="75" height="7"/>
    <rect x="463" y="463.5" width="75" height="7"/>
    <rect x="348" y="524.5" width="75" height="7"/>
    <rect x="463" y="524.5" width="75" height="7"/>
  </g>
  <g font-size="35" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="445" y="441">未</text>
    <text x="445" y="478.5">完</text>
    <text x="445" y="515.5">成</text>
    <text x="445" y="553.5">期</text>
  </g>

  <g stroke="currentColor">
    <line x1="318" y1="403" x2="984" y2="403" stroke-width="7"/>
    <line x1="318" y1="591.5" x2="984" y2="591.5" stroke-width="8"/>
  </g>

  <!-- アダムとエバ -->
  <path d="M437,599 A74.25,31.25 0 0 0 369.5,630 A74.25,31.25 0 0 0 451,661 C468,657.3 472.7,635.9 444,630 C415.3,624.1 420,602.7 437,599 Z" fill="#F98AEE"/>
  <path d="M437,599 A74.25,31.25 0 0 1 518,630 A74.25,31.25 0 0 1 451,661 C468,657.3 472.7,635.9 444,630 C415.3,624.1 420,602.7 437,599 Z" fill="#A0F08A"/>
  <path d="M437,599 C420,602.7 415.3,624.1 444,630 C472.7,635.9 468,657.3 451,661" fill="none" stroke="#111" stroke-width="4"/>
  <ellipse cx="443.75" cy="630" rx="74.25" ry="31.25" fill="none" stroke="currentColor" stroke-width="4"/>
  <g font-size="36" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="403.5" y="632">ア</text>
    <text x="486" y="630">エ</text>
  </g>

  <!-- 「：」は字の幅がフォントで違うので、前後を分けて置く -->
  <g font-size="40" dominant-baseline="central">
    <text x="592" y="297" textLength="250" lengthAdjust="spacing">取って食べる</text>
    <text x="862.5" y="297" text-anchor="middle">：</text>
    <text x="883" y="297" textLength="83" lengthAdjust="spacing">原理</text>
    <text x="566" y="497.5" textLength="252" lengthAdjust="spacing">食うべからず</text>
    <text x="837.5" y="497.5" text-anchor="middle">：</text>
    <text x="859" y="497.5" textLength="84" lengthAdjust="spacing">戒め</text>
  </g>
</svg>
