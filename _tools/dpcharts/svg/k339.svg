<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>命の水を出し得る磐石と水を出せない磐石　サタン一打・モーセ一打</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="322,137.5 466.5,137.5 466.5,131.5 482.5,141.5 466.5,150.5 466.5,145.5 322,145.5"/>
    <polygon points="217.5,190 225.5,190 225.5,244.5 230.5,244.5 221.5,261 212.5,244.5 217.5,244.5"/>
    <polygon points="334,165.5 353.5,166 342.5,181.5"/>
  </g>
  <path d="M483,172.5 Q408,203 347,173.5" fill="none" stroke="#8C949A" stroke-width="7.5"/>

  <!-- アダム・堕落したアダム -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="225.3" cy="144" rx="99.5" ry="48" fill="#F98AEE"/>
    <ellipse cx="588.5" cy="143.5" rx="102.5" ry="48" fill="#CF921C"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="224.5" y="123" font-size="27.5" textLength="110" lengthAdjust="spacing">命の水を</text>
    <text x="224.5" y="156.5" textLength="169" lengthAdjust="spacing">出し得る磐石</text>
    <text x="588.5" y="130.5" textLength="165" lengthAdjust="spacing">水を出せない</text>
    <text x="588" y="164" textLength="55" lengthAdjust="spacing">磐石</text>
  </g>

  <g font-size="28" dominant-baseline="central">
    <text x="180" y="70" textLength="82" lengthAdjust="spacing">アダム</text>
    <text x="484" y="67.5" textLength="199" lengthAdjust="spacing">堕落したアダム</text>
    <text x="335" y="107" textLength="142" lengthAdjust="spacing">サタン一打</text>
    <text x="334" y="218.5" textLength="141" lengthAdjust="spacing">モーセ一打</text>
  </g>

  <!-- 箇条 -->
  <circle cx="147" cy="285.5" r="6"/>
  <circle cx="147" cy="356.5" r="6"/>
  <g font-size="30" dominant-baseline="central">
    <text x="162" y="285.5" textLength="248" lengthAdjust="spacing">アダムを蕩減復帰</text>
    <text x="162" y="356.5" textLength="187" lengthAdjust="spacing">イエスを象徴</text>
    <text x="359.5" y="356.5" text-anchor="middle">(</text>
    <text x="369" y="356.5" textLength="82" lengthAdjust="spacing">ヨハネ</text>
    <text x="460" y="356.5" textLength="57" lengthAdjust="spacingAndGlyphs">4:14</text>
    <text x="523" y="356.5" text-anchor="middle">)</text>
  </g>
</svg>
