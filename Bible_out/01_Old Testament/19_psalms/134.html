<h1>詩篇 第134章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>見よ、夜、主の家に立って主に仕えるすべてのしもべよ、主をほめよ。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>聖所にむかってあなたがたの手をあげ、主をほめよ。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>どうぞ主、天と地を造られた者、シオンからあなたを祝福されるように。</p>
