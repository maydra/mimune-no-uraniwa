<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>再臨主と全人類　メシヤのための基台・血統的直系の子女・天国</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="190,151.5 198.5,164 193.5,164 193.5,305 186.5,305 186.5,164 181.5,164"/>
    <polygon points="259.5,329 273.5,321.5 273.5,325.5 560,325.5 560,332.5 273.5,332.5 273.5,336.5"/>
    <polygon points="414.5,155.5 428.5,167 420.5,167 420.5,177.5 408.5,177.5 408.5,167 400.5,167"/>
    <polygon points="414.5,227.5 428,239 420.5,239 420.5,248.5 408.5,248.5 408.5,239 401,239"/>
  </g>

  <!-- 天国 -->
  <rect x="265" y="36" width="299" height="114" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <line x1="265" y1="76" x2="564" y2="76" stroke="currentColor" stroke-width="3"/>
  <g font-size="29" text-anchor="middle" dominant-baseline="central">
    <text x="391" y="56.5">天</text>
    <text x="438" y="56.5">国</text>
  </g>
  <text y="97.5" font-size="25" dominant-baseline="central"><tspan x="277.5" textLength="47.5" lengthAdjust="spacingAndGlyphs">家庭</tspan><tspan x="325">、</tspan><tspan x="349.5" textLength="47.5" lengthAdjust="spacingAndGlyphs">氏族</tspan><tspan x="397">、</tspan><tspan x="420.5" textLength="48.5" lengthAdjust="spacingAndGlyphs">民族</tspan><tspan x="469">、</tspan><tspan x="492.5" textLength="47.5" lengthAdjust="spacingAndGlyphs">国家</tspan><tspan x="540">、</tspan></text>
  <text y="129.5" font-size="26" dominant-baseline="central"><tspan x="310" textLength="52.5" lengthAdjust="spacing">世界</tspan><tspan x="363">、</tspan><tspan x="389" textLength="130.5" lengthAdjust="spacing">天宙的基台</tspan></text>

  <!-- 血統的直系の子女 -->
  <rect x="298" y="185" width="233" height="37" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="310" y="203.5" font-size="25" dominant-baseline="central" textLength="209" lengthAdjust="spacing">血統的直系の子女</text>

  <!-- メシヤのための基台 -->
  <rect x="280" y="254" width="269.5" height="39" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="299" y="273.5" font-size="25.5" dominant-baseline="central" textLength="231" lengthAdjust="spacing" fill="#111">メシヤのための基台</text>

  <!-- 神 -->
  <circle cx="189.5" cy="115.5" r="28.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="189.5" y="116" font-size="30" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 再臨主・全人類 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="189.5" cy="329.5" rx="62.5" ry="26.5" fill="#F8F28F"/>
    <ellipse cx="625" cy="328.5" rx="65.5" ry="33" fill="#F86D42"/>
  </g>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="147" y="329" textLength="85" lengthAdjust="spacing">再臨主</text>
    <text x="582" y="329" textLength="86" lengthAdjust="spacing">全人類</text>
  </g>

  <!-- 出発のための摂理（み言中心） -->
  <rect x="299" y="342" width="240" height="73" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="315" y="364.5" font-size="25.5" dominant-baseline="central" textLength="208" lengthAdjust="spacing">出発のための摂理</text>
  <text y="394.5" font-size="22" dominant-baseline="central"><tspan x="361.5">（</tspan><tspan x="372.5" textLength="93" lengthAdjust="spacing">み言中心</tspan><tspan x="466">）</tspan></text>
</svg>
