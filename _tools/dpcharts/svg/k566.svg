<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>統一王国時代とキリスト王国時代　メシヤのための基台：×</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="130" y="41" width="276" height="54" rx="5"/>
    <rect x="415" y="41" width="276" height="54" rx="5"/>
  </g>
  <g font-size="34" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="268.5" y="68" textLength="203" lengthAdjust="spacing">統一王国時代</text>
    <text x="554.5" y="68" textLength="242" lengthAdjust="spacingAndGlyphs">キリスト王国時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="130" y="103.5" width="276" height="294" rx="6"/>
    <rect x="415" y="103.5" width="276" height="294" rx="6"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="159.5" cy="127" r="10.3"/>
    <circle cx="444.5" cy="127" r="10.3"/>
  </g>
  <g font-size="17" text-anchor="middle" dominant-baseline="central">
    <text x="159.5" y="127.5">1</text>
    <text x="444.5" y="127.5">2</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="204,203 204,177 201.5,177 206,166 210.5,177 208,177 208,203"/>
    <polygon points="489,203 489,177 486.5,177 491,166 495.5,177 493,177 493,203"/>
    <polygon points="318,284 269,284 269,281.5 258,286 269,290.5 269,288 318,288"/>
    <polygon points="606,282.5 554,282.5 554,280 543,284.5 554,289 554,286.5 606,286.5"/>
  </g>

  <!-- 神 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <circle cx="207" cy="143" r="21"/>
    <circle cx="491.5" cy="143.5" r="21"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="206.5" y="143">神</text>
    <text x="491" y="143.5">神</text>
  </g>

  <!-- 王たちの楕円 -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="206" cy="219" rx="47" ry="14.5"/>
    <ellipse cx="206" cy="252" rx="47" ry="14.5"/>
    <ellipse cx="206" cy="286" rx="47" ry="14.5"/>
    <ellipse cx="491" cy="219" rx="47" ry="14.5"/>
    <ellipse cx="491" cy="252" rx="47" ry="14.5"/>
    <ellipse cx="491" cy="285" rx="47" ry="14.5"/>
  </g>
  <g fill="#F86D42" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="356" cy="286" rx="38.5" ry="29.5"/>
    <ellipse cx="643.5" cy="282" rx="38.5" ry="22"/>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="205" y="220" font-size="21" textLength="58" lengthAdjust="spacingAndGlyphs">サウル</text>
    <text x="205" y="253" font-size="21" textLength="50" lengthAdjust="spacingAndGlyphs">ダビデ</text>
    <text x="206.5" y="286.5" font-size="21" textLength="68" lengthAdjust="spacingAndGlyphs">ソロモン</text>
    <text x="491" y="220" font-size="19" textLength="80" lengthAdjust="spacingAndGlyphs">チャールズ大帝</text>
    <text x="491" y="252.5" textLength="40" lengthAdjust="spacing">国王</text>
    <text x="491" y="285.5" textLength="40" lengthAdjust="spacing">国王</text>
    <text x="356.5" y="275" textLength="54" lengthAdjust="spacingAndGlyphs">ユダヤ</text>
    <text x="356.5" y="298" textLength="46" lengthAdjust="spacing">民族</text>
    <text x="643.5" y="273.5" font-size="18" textLength="58" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="643.5" y="292" font-size="18" textLength="38" lengthAdjust="spacing">教人</text>
  </g>

  <!-- 神殿建設：× -->
  <g font-size="23" dominant-baseline="central">
    <text x="259" y="217" textLength="90" lengthAdjust="spacing">神殿建設</text>
    <text x="355" y="217" text-anchor="middle">：</text>
  </g>

  <!-- メシヤのための基台：× -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="137" y="335" width="260" height="34"/>
    <rect x="423" y="335" width="261" height="34"/>
  </g>
  <g font-size="23" dominant-baseline="central" fill="#111">
    <text x="151" y="352.5" textLength="190" lengthAdjust="spacingAndGlyphs">メシヤのための基台</text>
    <text x="352" y="352.5" text-anchor="middle">：</text>
    <text x="437" y="352.5" textLength="190" lengthAdjust="spacingAndGlyphs">メシヤのための基台</text>
    <text x="638" y="352.5" text-anchor="middle">：</text>
  </g>

  <!-- × -->
  <g stroke="currentColor" stroke-width="4.5">
    <path d="M369,209 L384.5,224.5 M384.5,209 L369,224.5"/>
    <path d="M287,277 L302.5,292.5 M302.5,277 L287,292.5"/>
    <path d="M569,277 L583.5,291.5 M583.5,277 L569,291.5"/>
  </g>
  <g stroke="#111" stroke-width="4.5">
    <path d="M365,345 L380.5,360.5 M380.5,345 L365,360.5"/>
    <path d="M654,345 L668.5,359.5 M668.5,345 L654,359.5"/>
  </g>
</svg>
