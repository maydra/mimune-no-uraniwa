<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の予定であったならば（マタイ 26:39 三回も祈祷）</title>

  <rect x="211.5" y="66.5" width="519" height="70" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="229.6" y="101" font-size="46" textLength="481.25" lengthAdjust="spacingAndGlyphs" dominant-baseline="central">神の予定であったならば</text>

  <!-- 下向きの灰色の矢印 -->
  <polygon points="291.5,188.5 303.5,188.5 303.5,329.5 314.5,329.5 297.5,357.5 280.5,329.5 291.5,329.5" fill="#8C949A"/>

  <text y="200" font-size="42" dominant-baseline="central"><tspan x="340" textLength="123" lengthAdjust="spacingAndGlyphs">マタイ</tspan> <tspan x="475" textLength="104" lengthAdjust="spacingAndGlyphs">26:39</tspan>　<tspan x="621" textLength="208" lengthAdjust="spacingAndGlyphs">三回も祈祷</tspan></text>

  <!-- 聖句（1字 30 の等幅。細字は font-weight 400） -->
  <g font-size="33" dominant-baseline="central">
    <text y="258"><tspan x="343.5" font-weight="400">『</tspan><tspan x="354.5" font-weight="400" textLength="120" lengthAdjust="spacingAndGlyphs">わが父よ</tspan><tspan x="474.5" font-weight="400">、</tspan><tspan x="504.5" font-weight="400" textLength="60" lengthAdjust="spacingAndGlyphs">もし</tspan><tspan x="564.5" textLength="360" lengthAdjust="spacingAndGlyphs">できることでしたらどうか</tspan><tspan x="924.5">、</tspan><tspan x="954.5" textLength="120" lengthAdjust="spacingAndGlyphs">この杯を</tspan></text>
    <text y="312"><tspan x="351.5" textLength="450" lengthAdjust="spacingAndGlyphs">わたしから過ぎ去らせてください</tspan><tspan x="801.5">。</tspan><tspan x="831.5" textLength="90" lengthAdjust="spacingAndGlyphs">しかし</tspan><tspan x="921.5">、</tspan><tspan x="951.5" textLength="120" lengthAdjust="spacingAndGlyphs">わたしの</tspan></text>
    <text y="367" font-weight="400"><tspan x="352" textLength="270" lengthAdjust="spacingAndGlyphs">思いのままではなく</tspan><tspan x="622">、</tspan><tspan x="652" textLength="450" lengthAdjust="spacingAndGlyphs">みこころのままになさって下さい</tspan><tspan x="1100.5">』</tspan></text>
  </g>

  <!-- 十字架（型を 1.5 倍） -->
  <g transform="translate(235.0,389.0) scale(1.2300,1.3444)" stroke-width="2.331" fill="#7A5230" stroke="#111" stroke-linejoin="round">
    <path d="M40,0 H60 V42 H100 V60 H60 V180 H40 V60 H0 V42 H40 Z"/>
  </g>

  <circle cx="403" cy="461" r="10.5"/>
  <circle cx="403" cy="546" r="10.5"/>
  <g font-size="42" dominant-baseline="central">
    <text y="459"><tspan x="425" textLength="82" lengthAdjust="spacingAndGlyphs">4000</tspan> <tspan x="518.7" textLength="166.8" lengthAdjust="spacingAndGlyphs">年間摂理</tspan></text>
    <text y="459"><tspan x="768" textLength="167" lengthAdjust="spacingAndGlyphs">地上天国</tspan><tspan x="956" text-anchor="middle">：</tspan></text>
    <text x="422.1" y="546.5" textLength="584.2" lengthAdjust="spacingAndGlyphs">再臨されるまで苦難の歴史延長</text>
  </g>
  <polygon points="700.5,454.5 734.5,454.5 734.5,449.5 753.5,459 734.5,468.5 734.5,463.5 700.5,463.5" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="7.5">
    <line x1="977.65" y1="441.65" x2="1011.35" y2="475.35"/>
    <line x1="1011.35" y1="441.65" x2="977.65" y2="475.35"/>
  </g>
</svg>
