<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ユダヤ民族捕虜および帰還時代と法王捕虜および帰還時代　バビロニア捕虜と南フランス捕虜</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="127.5" y="25" width="276" height="66" rx="5"/>
    <rect x="413" y="25" width="276" height="66" rx="5"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="266" y="43.5" textLength="182" lengthAdjust="spacing">ユダヤ民族捕虜</text>
    <text x="266" y="73" textLength="182" lengthAdjust="spacing">および帰還時代</text>
    <text x="551" y="43.5" textLength="104" lengthAdjust="spacing">法王捕虜</text>
    <text x="551.5" y="73" textLength="183" lengthAdjust="spacing">および帰還時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="129" y="99.5" width="276" height="302.5" rx="6"/>
    <rect x="414.5" y="99.5" width="276" height="302.5" rx="6"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="153" cy="127.5" r="10.3"/>
    <circle cx="440" cy="128" r="10.3"/>
  </g>
  <g font-size="17" text-anchor="middle" dominant-baseline="central">
    <text x="153" y="128">1</text>
    <text x="440" y="128.5">2</text>
  </g>

  <!-- 捕虜の矢印 -->
  <g fill="#8C949A">
    <polygon points="228,208.5 291,208.5 291,205.5 303,211.5 291,217.5 291,214.5 228,214.5"/>
    <polygon points="514,209 571,209 571,206 583,212 571,218 571,215 514,215"/>
  </g>
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <text x="270.5" y="179.5" textLength="41" lengthAdjust="spacing">捕虜</text>
    <text x="553.5" y="180" textLength="41" lengthAdjust="spacing">捕虜</text>
  </g>

  <!-- 縦長の楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="197.5" cy="213" rx="30.5" ry="57" fill="#DCC4C4"/>
    <ellipse cx="343.5" cy="213" rx="30.5" ry="57" fill="#CF921C"/>
    <ellipse cx="483.5" cy="213" rx="30.5" ry="56" fill="#DCC4C4"/>
    <ellipse cx="624" cy="213" rx="30.5" ry="57" fill="#CF921C"/>
  </g>
  <g font-size="21" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="197.5" y="171">ユ</text>
    <text x="197.5" y="191.5">ダ</text>
    <text x="197.5" y="211.5">ヤ</text>
    <text x="197.5" y="232">民</text>
    <text x="197.5" y="252">族</text>
    <text x="343.5" y="171.5">バ</text>
    <text x="343.5" y="191.5">ビ</text>
    <text x="343.5" y="212.5">ロ</text>
    <text x="343.5" y="232">ニ</text>
    <text x="343.5" y="252.5">ア</text>
    <text x="483.5" y="188">法</text>
    <text x="483.5" y="212">王</text>
    <text x="483.5" y="235.5">庁</text>
    <text x="624" y="172.5">南</text>
    <text x="624" y="192.5">フ</text>
    <text x="624" y="213">ラ</text>
    <text x="624" y="233">ン</text>
    <text x="624" y="253">ス</text>
  </g>

  <!-- 下の字 -->
  <g font-size="22" dominant-baseline="central">
    <text x="148" y="294" textLength="134" lengthAdjust="spacingAndGlyphs">エホヤキム王、</text>
    <text x="307" y="294" textLength="72" lengthAdjust="spacingAndGlyphs">70年間</text>
    <text x="147" y="322" textLength="114" lengthAdjust="spacingAndGlyphs">政府の大臣、</text>
    <text x="148" y="349.5" textLength="83" lengthAdjust="spacingAndGlyphs">ユダヤ人</text>
    <text x="470" y="294" textLength="46" lengthAdjust="spacing">法王</text>
    <text x="595" y="294" textLength="72" lengthAdjust="spacingAndGlyphs">70年間</text>
    <text x="428" y="321" font-size="20" textLength="131" lengthAdjust="spacingAndGlyphs">（クレメンス五世）</text>
    <text x="590" y="321" font-size="20" textLength="83" lengthAdjust="spacingAndGlyphs">（1309 〜）</text>
    <text x="447" y="360.5" font-size="21" textLength="227" lengthAdjust="spacingAndGlyphs">法王と国王との衝突が激化</text>
  </g>
  <circle cx="433.5" cy="360" r="4.6"/>
</svg>
