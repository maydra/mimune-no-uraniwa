<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>生と死　復活（復帰の過程的現象）</title>

  <g font-size="56" text-anchor="middle" dominant-baseline="central">
    <text x="362" y="86.5">生</text>
    <text x="927.5" y="88">死</text>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="366.25" cy="249.75" rx="163.25" ry="114.75" fill="#fff" class="paper"/>
    <ellipse cx="930" cy="249.75" rx="163" ry="114.5" fill="#50403D"/>
  </g>
  <g font-size="53" text-anchor="middle" dominant-baseline="central">
    <text x="364.5" y="203">神の</text>
    <text x="365.5" y="274" textLength="271" lengthAdjust="spacing">直接主管圏</text>
  </g>
  <g font-size="53" text-anchor="middle" dominant-baseline="central" fill="#fff">
    <text x="929.5" y="213.5" textLength="159" lengthAdjust="spacing">サタン</text>
    <text x="930.5" y="284.5">主管圏</text>
  </g>

  <!-- 堕落と復帰の矢印 -->
  <g fill="#8C949A">
    <polygon points="547.5,220.5 718.5,220.5 718.5,211.5 747.5,226.5 718.5,241.5 718.5,232.5 547.5,232.5"/>
    <rect x="565" y="271.5" width="177.5" height="11"/>
    <polygon points="542.5,277 571.5,261.5 571.5,292.5"/>
    <polygon points="583.5,277 612.5,261.5 612.5,292.5"/>
    <polygon points="628.5,277 657.5,261.5 657.5,292.5"/>
    <polygon points="674.5,277 703.5,261.5 703.5,292.5"/>
  </g>
  <g font-size="50" text-anchor="middle" dominant-baseline="central">
    <text x="649.5" y="188">堕落</text>
    <text x="649" y="341">復帰</text>
  </g>

  <line x1="649.5" y1="379" x2="649.5" y2="453" stroke="currentColor" stroke-width="4" stroke-dasharray="14 6"/>
  <rect x="576.5" y="458" width="145.5" height="77" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="648" y="495" font-size="54" text-anchor="middle" dominant-baseline="central" fill="#111">復活</text>

  <text y="595.5" font-size="54" dominant-baseline="central"><tspan x="439" text-anchor="end">（</tspan><tspan x="435" textLength="434.4" lengthAdjust="spacing">復帰の過程的現象</tspan><tspan x="866.4">）</tspan></text>
