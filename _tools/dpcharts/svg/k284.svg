<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神がパロの心をかたくなにされた理由</title>

  <!-- 題 -->
  <text x="35" y="38" font-size="30" dominant-baseline="central" textLength="531" lengthAdjust="spacing">神がパロの心をかたくなにされた理由</text>
  <line x1="34" y1="56.5" x2="569" y2="56.5" stroke="currentColor" stroke-width="2"/>

  <g font-size="29" dominant-baseline="central">
    <!-- ① -->
    <text x="141" y="139" textLength="27" lengthAdjust="spacingAndGlyphs">①</text>
    <text x="177" y="139" textLength="285" lengthAdjust="spacing">パロとイスラエル民族</text>
    <text x="478.5" y="139" text-anchor="middle">：</text>
    <text x="495" y="139" textLength="139" lengthAdjust="spacing">神の能力を</text>
    <text x="496" y="179" textLength="138" lengthAdjust="spacing">見せられる</text>

    <!-- ② -->
    <text x="141" y="254" textLength="27" lengthAdjust="spacingAndGlyphs">②</text>
    <text x="177" y="254" textLength="52" lengthAdjust="spacing">パロ</text>
    <text x="247.5" y="254" text-anchor="middle">：</text>
    <text x="267" y="254" textLength="309" lengthAdjust="spacing">自己の無力を悟らしめる</text>

    <!-- ③ -->
    <text x="141" y="326" textLength="27" lengthAdjust="spacingAndGlyphs">③</text>
    <text x="178" y="326" textLength="140" lengthAdjust="spacing">イスラエル</text>
    <text x="334.5" y="326" text-anchor="middle">：</text>
    <text x="351" y="326" textLength="312" lengthAdjust="spacing">エジプトに対する未練を</text>
    <text x="351" y="365.5" textLength="225" lengthAdjust="spacing">断つようにさせる</text>
  </g>
</svg>
