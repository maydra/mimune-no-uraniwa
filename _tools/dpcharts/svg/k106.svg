<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>信仰基台を復帰するための条件物</title>

  <!-- 題 -->
  <text x="36" y="38" font-size="30" dominant-baseline="central">2.</text>
  <text x="74" y="38" font-size="30" textLength="470" lengthAdjust="spacing" dominant-baseline="central">信仰基台を復帰するための条件物</text>
  <line x1="74" y1="57" x2="546" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- ノアから神へ -->
  <polygon points="168,300 168,198 163.5,198 171.5,184 179.5,198 175,198 175,300" fill="#8C949A"/>

  <!-- 信仰基台から2つへ分かれる -->
  <path d="M294,247.5 H309.5 M328,196.5 H309.5 V293.5 H328" fill="none" stroke="#8C949A" stroke-width="6"/>

  <!-- 神 -->
  <circle cx="171" cy="151" r="30.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="170" y="152" font-size="35" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- ノア -->
  <ellipse cx="171.5" cy="322" rx="46" ry="25.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="171" y="322.5" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">ノア</text>

  <!-- 信仰基台 -->
  <rect x="203" y="203" width="90" height="83" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="247.5" y="227.5">信仰</text>
    <text x="247.5" y="264">基台</text>
  </g>

  <g font-size="26" dominant-baseline="central">
    <text x="339" y="195">中心人物</text>
    <text x="455.5" y="195" text-anchor="middle">：</text>
    <text x="470" y="195">ノア</text>
    <text x="456" y="228" font-size="24">（第二の人間始祖）</text>
    <text x="338" y="294.5">条件物</text>
    <text x="429" y="294.5" text-anchor="middle">：</text>
    <text x="443" y="294.5">箱舟</text>
    <text x="502" y="294.5">（新天宙）</text>
  </g>
</svg>
