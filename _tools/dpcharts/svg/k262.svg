<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(3) 第一次民族的カナン復帰路程の失敗</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="49" y="35.5" textLength="43" lengthAdjust="spacingAndGlyphs">(3)</text>
    <text x="100" y="35.5" textLength="504" lengthAdjust="spacing">第一次民族的カナン復帰路程の失敗</text>
  </g>
  <line x1="100" y1="55" x2="604" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 神 -->
  <circle cx="193.5" cy="108" r="32" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="193.5" y="108" font-size="36" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="193.5,146 201,161.5 196.5,161.5 196.5,185 190.5,185 190.5,161.5 186,161.5"/>
    <polygon points="472,207.5 277,207.5 277,203 261,211 277,219 277,214.5 472,214.5"/>
  </g>

  <!-- 実体基台：× -->
  <rect x="282.5" y="157.5" width="185" height="38.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="26" dominant-baseline="central">
    <text x="295" y="177" textLength="104" lengthAdjust="spacing">実体基台</text>
    <text x="412.5" y="177" text-anchor="middle">：</text>
  </g>
  <path d="M433.5,169.5 L450,185 M450,169.5 L433.5,185" stroke="currentColor" stroke-width="4" fill="none"/>

  <!-- モーセ・イスラエル民族 -->
  <ellipse cx="193.5" cy="210.5" rx="61" ry="25" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <ellipse cx="581" cy="211" rx="107.5" ry="28.5" fill="#F86D42" stroke="currentColor" stroke-width="2.2"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="191" y="210.5" font-size="30" textLength="88" lengthAdjust="spacing">モーセ</text>
    <text x="580" y="210.5" font-size="26" textLength="183" lengthAdjust="spacing">イスラエル民族</text>
  </g>

  <!-- エジプト人を打ち殺した -->
  <circle cx="227.5" cy="267" r="6"/>
  <text x="240" y="267" font-size="29" dominant-baseline="central" textLength="434" lengthAdjust="spacing">モーセがエジプト人を打ち殺した</text>
  <g fill="#8C949A">
    <polygon points="243,305.5 264,305.5 264,303 272,307 264,311 264,308.5 243,308.5"/>
    <polygon points="242,336.5 263,336.5 263,334 271,338 263,342 263,339.5 242,339.5"/>
  </g>
  <g font-size="23" font-weight="400" dominant-baseline="central">
    <text x="282" y="306.5" textLength="305.5" lengthAdjust="spacing">同胞が誤解、口に出して非難</text>
    <text x="282" y="337.5" textLength="404" lengthAdjust="spacing">パロがモーセを亡き者にしようとする</text>
  </g>

  <!-- 延長 -->
  <rect x="156.5" y="368.5" width="514" height="45" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="176" y="391" textLength="198" lengthAdjust="spacing">カナン復帰路程</text>
    <text x="392" y="391" textLength="258" lengthAdjust="spacing">二次、三次まで延長</text>
  </g>
</svg>
