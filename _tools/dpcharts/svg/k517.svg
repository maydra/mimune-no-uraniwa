<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅴ. ユダヤ民族捕虜および帰還時代 210 年</title>

  <!-- 題 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text y="37.5" font-size="30"><tspan x="53" textLength="37" lengthAdjust="spacingAndGlyphs">Ⅴ.</tspan><tspan x="294" textLength="429" lengthAdjust="spacing">ユダヤ民族捕虜および帰還時代</tspan><tspan x="538" textLength="47" lengthAdjust="spacingAndGlyphs">210</tspan><tspan x="584">年</tspan></text>
  </g>
  <line x1="79" y1="57" x2="600" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- 年数の柱（70 と 140 に分ける） -->
  <g>
    <rect x="225" y="130" width="5.5" height="262"/>
    <rect x="230.5" y="131" width="10.5" height="260" fill="#A0F08A"/>
    <path d="M206,131 H250 M206,223 H246 M206,391 H247" fill="none" stroke="currentColor" stroke-width="2.2"/>
  </g>
  <path d="M225,131 C212,150 212,203 225,222 M225,224 C210,256 210,358 225,390" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M268,109 H249 V150 H268" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <g fill="#8C949A">
    <polygon points="452,107 468,107 468,103 479,109.3 468,115.6 468,111.6 452,111.6"/>
    <polygon points="381,145.5 397,145.5 397,141.5 407,147.7 397,154 397,150 381,150"/>
  </g>
  <g>
    <circle cx="267.5" cy="272.5" r="7"/>
    <circle cx="266.5" cy="312" r="7"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="178" textLength="30.7" lengthAdjust="spacingAndGlyphs" y="175" font-size="27">70</text>
    <text x="170.5" textLength="45.7" lengthAdjust="spacingAndGlyphs" y="311" font-size="27">140</text>
    <text x="359" textLength="166.3" lengthAdjust="spacing" y="110.5" font-size="23">北朝イスラエル</text>
    <text x="584" textLength="188.3" lengthAdjust="spacing" y="110.5" font-size="23">アッシリヤへ捕虜</text>
    <text x="324" textLength="96.3" lengthAdjust="spacing" y="148.5" font-size="23">南朝ユダ</text>
    <text x="512.5" textLength="189.3" lengthAdjust="spacing" y="148.5" font-size="23">バビロニアへ捕虜</text>
    <text x="418" textLength="318.8" lengthAdjust="spacing" y="225" font-size="28">ペルシャ王によって解放</text>
    <text x="442" textLength="318.8" lengthAdjust="spacing" y="272.5" font-size="28" font-weight="400">長い期間にわたって帰還</text>
    <text y="312" font-size="28" font-weight="400"><tspan x="341.5" textLength="113.8" lengthAdjust="spacing">ネヘミヤ</tspan><tspan x="413">：</tspan><tspan x="485.5" textLength="115.8" lengthAdjust="spacing">城壁再建</tspan></text>
    <text y="391.5" font-size="28"><tspan x="297" textLength="84.8" lengthAdjust="spacing">マラキ</tspan><tspan x="354.5">：</tspan><tspan x="499.5" textLength="259.8" lengthAdjust="spacing">メシヤのための準備</tspan></text>
  </g>
</svg>
