<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(4) 第二次民族的カナン復帰路程の失敗</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="49" y="35.5" textLength="43" lengthAdjust="spacingAndGlyphs">(4)</text>
    <text x="103" y="35.5" textLength="504" lengthAdjust="spacing">第二次民族的カナン復帰路程の失敗</text>
  </g>
  <line x1="103" y1="55" x2="607" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="191.5,143.5 198.5,156.5 194.5,156.5 194.5,186 188.5,186 188.5,156.5 184.5,156.5"/>
    <polygon points="249,208.5 261.5,201.5 261.5,205.5 550,205.5 550,212.5 261.5,212.5 261.5,215.5"/>
  </g>

  <!-- 神 -->
  <circle cx="192.5" cy="112.5" r="28" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="192" y="112.5" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 実体基台：× -->
  <rect x="308.5" y="153.5" width="190" height="41" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="324" y="174" textLength="113" lengthAdjust="spacing">実体基台</text>
    <text x="447" y="174" text-anchor="middle">：</text>
  </g>
  <path d="M464,166 L479.5,182 M479.5,166 L464,182" stroke="currentColor" stroke-width="3" fill="none"/>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="191" cy="209" rx="50.5" ry="23.5" fill="#F8F28F"/>
    <ellipse cx="617.5" cy="209" rx="69" ry="35.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="190" y="209" font-size="27" textLength="78" lengthAdjust="spacing">モーセ</text>
    <text x="618.5" y="198.5" font-size="26" textLength="118" lengthAdjust="spacing">イスラエル</text>
    <text x="618.5" y="227.5" font-size="26" textLength="52" lengthAdjust="spacing">民族</text>
  </g>

  <!-- 一次・二次・三次幕屋のための基台：× -->
  <rect x="140.5" y="259.5" width="540" height="36" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="28" dominant-baseline="central">
    <text x="155.5" y="277" textLength="57" lengthAdjust="spacing">一次</text>
    <text x="241" y="277" textLength="57" lengthAdjust="spacing">二次</text>
    <text x="326.5" y="277" textLength="286" lengthAdjust="spacing">三次幕屋のための基台</text>
    <text x="226.5" y="277" text-anchor="middle">・</text>
    <text x="312" y="277" text-anchor="middle">・</text>
    <text x="627.5" y="277" text-anchor="middle">：</text>
  </g>
  <path d="M648,268.5 L665,285.5 M665,268.5 L648,285.5" stroke="currentColor" stroke-width="4.5" fill="none"/>

  <!-- 第二次21ヵ月荒野路程：× -->
  <rect x="209.5" y="311.5" width="393" height="41" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="28" dominant-baseline="central">
    <text x="226" y="332" textLength="85" lengthAdjust="spacing">第二次</text>
    <text x="320" y="332" textLength="24" lengthAdjust="spacingAndGlyphs">21</text>
    <text x="357" y="332" textLength="170" lengthAdjust="spacing">ヵ月荒野路程</text>
    <text x="543" y="332" text-anchor="middle">：</text>
  </g>
  <path d="M563,323.5 L581,340.5 M581,323.5 L563,340.5" stroke="currentColor" stroke-width="4.5" fill="none"/>

  <!-- 第三次40年荒野路程 延長 -->
  <rect x="220.5" y="366.5" width="371" height="42" fill="#CDF8F7" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="236" y="388" textLength="85" lengthAdjust="spacing">第三次</text>
    <text x="329" y="388" textLength="28" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="366" y="388" textLength="143" lengthAdjust="spacing">年荒野路程</text>
    <text x="525" y="388" textLength="56" lengthAdjust="spacing">延長</text>
  </g>
</svg>
