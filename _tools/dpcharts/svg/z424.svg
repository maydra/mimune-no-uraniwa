<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ユダヤ人の頑固と不信を嘆かれたイエス（マタイ福音書23章37節、ヨハネ福音書5章39～40節）</title>

  <g font-size="88" dominant-baseline="central">
    <text y="187"><tspan x="209" font-weight="400" textLength="752" lengthAdjust="spacing">それだけではなく</tspan><tspan x="961" font-weight="400">、</tspan><tspan x="1054.7" font-weight="400" textLength="567.6" lengthAdjust="spacing">マタイ福音書</tspan> <tspan x="1689.5" font-weight="400" text-anchor="middle" textLength="90" lengthAdjust="spacingAndGlyphs">23</tspan> <tspan x="1806" font-weight="400" text-anchor="middle">章</tspan> <tspan x="1920.5" font-weight="400" text-anchor="middle" textLength="90" lengthAdjust="spacingAndGlyphs">37</tspan> <tspan x="1987.7" font-weight="400" textLength="473" lengthAdjust="spacing">節を見ると</tspan><tspan x="2460.7" font-weight="400">、</tspan><tspan x="2551.6" font-weight="400" textLength="189.2" lengthAdjust="spacing">イエ</tspan></text>
    <text y="328.5"><tspan x="210" font-weight="400" textLength="190" lengthAdjust="spacing">スは</tspan><tspan x="400" font-weight="400">、</tspan><tspan x="503.6" font-weight="400">『</tspan><tspan x="539.1" textLength="187.6" lengthAdjust="spacing">ああ</tspan><tspan x="726.7">、</tspan><tspan x="820.5" textLength="469" lengthAdjust="spacing">エルサレム</tspan><tspan x="1289.5">、</tspan><tspan x="1383.3" textLength="469" lengthAdjust="spacing">エルサレム</tspan><tspan x="1852.3">、</tspan><tspan x="1946.1" textLength="750.4" lengthAdjust="spacing">預言者たちを殺し</tspan><tspan x="2696.5">、</tspan></text>
    <text y="470.5"><tspan x="208.4" textLength="2028.4" lengthAdjust="spacing">おまえにつかわされた人たちを石で打ち殺す者よ</tspan><tspan x="2236.8">。</tspan><tspan x="2329" textLength="368.8" lengthAdjust="spacing">ちょうど</tspan><tspan x="2697.8">、</tspan></text>
    <text y="612"><tspan x="208.3" textLength="1808.8" lengthAdjust="spacing">めんどりが翼の下にそのひなを集めるように</tspan><tspan x="2017.1">、</tspan><tspan x="2107.54" textLength="633.08" lengthAdjust="spacing">わたしはおまえ</tspan></text>
    <text y="753"><tspan x="208.77" textLength="1809.2" lengthAdjust="spacing">の子らを幾たび集めようとしたことであろう</tspan><tspan x="2017.97">。</tspan><tspan x="2108.43" textLength="452.3" lengthAdjust="spacing">それだのに</tspan><tspan x="2560.73">、</tspan><tspan x="2651.19" textLength="90.46" lengthAdjust="spacing">お</tspan></text>
    <text y="895.5"><tspan x="208.4" textLength="1337.7" lengthAdjust="spacing">まえたちは応じようとしなかった</tspan><tspan x="1543.8" font-weight="400">』</tspan><tspan x="1636.25" font-weight="400" textLength="555" lengthAdjust="spacing">と言いながら</tspan><tspan x="2191.25" font-weight="400">、</tspan><tspan x="2279.4" font-weight="400" textLength="461.25" lengthAdjust="spacing">彼らの頑固</tspan></text>
    <text y="1038"><tspan x="210.15" font-weight="400" textLength="733.6" lengthAdjust="spacing">と不信を嘆かれた</tspan><tspan x="943.75" font-weight="400">。</tspan></text>
    <text y="1225.5"><tspan x="208.6" font-weight="400" textLength="284.25" lengthAdjust="spacing">そして</tspan><tspan x="492.85" font-weight="400">、</tspan><tspan x="585.1" font-weight="400" textLength="568.8" lengthAdjust="spacing">ヨハネ福音書</tspan> <tspan x="1198.5" font-weight="400" text-anchor="middle">5</tspan> <tspan x="1291" font-weight="400" text-anchor="middle">章</tspan> <tspan x="1406.5" font-weight="400" text-anchor="middle" textLength="90" lengthAdjust="spacingAndGlyphs">39</tspan> <tspan x="1521.5" font-weight="400" text-anchor="middle">～</tspan> <tspan x="1636.5" font-weight="400" text-anchor="middle" textLength="92" lengthAdjust="spacingAndGlyphs">40</tspan> <tspan x="1704.1" font-weight="400" textLength="284.4" lengthAdjust="spacing">節では</tspan><tspan x="1988.5" font-weight="400">、</tspan><tspan x="2083.3" font-weight="400" textLength="379.2" lengthAdjust="spacing">イエスは</tspan><tspan x="2462.5" font-weight="400">、</tspan><tspan x="2557.3" font-weight="400" textLength="189.6" lengthAdjust="spacing">自分</tspan></text>
    <text y="1368"><tspan x="209.13" font-weight="400" textLength="1968.33" lengthAdjust="spacing">のために証している聖書を見ながらも信じない</tspan><tspan x="2177.46" font-weight="400">、</tspan><tspan x="2271.19" font-weight="400" textLength="468.65" lengthAdjust="spacing">彼らの無知</tspan></text>
    <text y="1509"><tspan x="209.5" font-weight="400" textLength="570" lengthAdjust="spacing">を責めながら</tspan><tspan x="779.5" font-weight="400">、</tspan><tspan x="878.6" font-weight="400">『</tspan><tspan x="912.25" textLength="549" lengthAdjust="spacing">あなたがたは</tspan><tspan x="1461.25">、</tspan><tspan x="1552.75" textLength="1189.5" lengthAdjust="spacing">聖書の中に永遠の命があると</tspan></text>
    <text y="1650.5"><tspan x="208.26" textLength="814.32" lengthAdjust="spacing">思って調べているが</tspan><tspan x="1022.58">、</tspan><tspan x="1113.06" textLength="452.4" lengthAdjust="spacing">この聖書は</tspan><tspan x="1565.46">、</tspan><tspan x="1655.94" textLength="1085.76" lengthAdjust="spacing">わたしについてあかしをす</tspan></text>
    <text y="1792.5"><tspan x="206.76" textLength="542.88" lengthAdjust="spacing">るものである</tspan><tspan x="749.64">。</tspan><tspan x="840.12" textLength="271.44" lengthAdjust="spacing">しかも</tspan><tspan x="1111.56">、</tspan><tspan x="1202.04" textLength="542.88" lengthAdjust="spacing">あなたがたは</tspan><tspan x="1744.92">、</tspan><tspan x="1835.4" textLength="904.8" lengthAdjust="spacing">命を得るためにわたし</tspan></text>
    <text y="1933.5"><tspan x="209.57" textLength="1066.32" lengthAdjust="spacing">のもとにこようともしない</tspan><tspan x="1272.8" font-weight="400">』</tspan><tspan x="1364.65" font-weight="400" textLength="550.2" lengthAdjust="spacing">と悲しまれた</tspan><tspan x="1914.85" font-weight="400">。</tspan></text>
  </g>

  <!-- 行頭の● -->
  <circle cx="164" cy="187" r="20"/>
  <circle cx="164" cy="1226" r="20"/>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="5">
    <line x1="1055" y1="249" x2="2081" y2="249"/>
    <line x1="210" y1="672.5" x2="2018" y2="672.5"/>
    <line x1="656" y1="955.5" x2="1546" y2="955.5"/>
    <line x1="583" y1="1288" x2="1797" y2="1288"/>
    <line x1="2552" y1="1429.5" x2="2739" y2="1429.5"/>
    <line x1="210" y1="1571.5" x2="490" y2="1571.5"/>
    <line x1="1294" y1="1711.5" x2="2560" y2="1711.5"/>
    <line x1="2470" y1="1853" x2="2741" y2="1853"/>
    <line x1="210" y1="1994.5" x2="1275" y2="1994.5"/>
  </g>
</svg>
