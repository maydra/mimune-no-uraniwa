<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅵ. 縦からなる横的蕩減復帰摂理時代</title>

  <text x="48.5" y="37.5" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="25" lengthAdjust="spacingAndGlyphs">Ⅵ</text>
  <text x="65" y="37.5" font-size="30" dominant-baseline="central">.</text>
  <text x="83" y="37.5" font-size="30" dominant-baseline="central" textLength="471" lengthAdjust="spacing">縦からなる横的蕩減復帰摂理時代</text>
  <line x1="82" y1="56" x2="555" y2="56" stroke="currentColor" stroke-width="2.2"/>

  <!-- アダムの家庭 → 中心人物 -->
  <line x1="187.5" y1="180" x2="187.5" y2="286" stroke="currentColor" stroke-width="6"/>
  <polygon points="179.5,285 195.5,285 187.5,300"/>
  <ellipse cx="187.5" cy="140" rx="51.5" ry="40" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
  <ellipse cx="187.5" cy="346" rx="51.5" ry="40" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="187.5" y="125" font-size="23" textLength="67" lengthAdjust="spacing">アダム</text>
    <text x="187.5" y="154" font-size="23" textLength="67" lengthAdjust="spacing">の家庭</text>
    <text x="188" y="331" font-size="27" textLength="54" lengthAdjust="spacing">中心</text>
    <text x="187" y="362.5" font-size="27" textLength="54" lengthAdjust="spacing">人物</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="254,136.5 411,136.5 411,131.5 426,139.5 411,147.5 411,142.5 254,142.5"/>
    <polygon points="254,344.5 411,344.5 411,340.5 426,348 411,355.5 411,350.5 254,350.5"/>
  </g>

  <!-- 失敗の × -->
  <g font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="310" y="106.5">失</text>
    <text x="362.5" y="106.5">敗</text>
  </g>
  <path d="M323,126 L345,154 M345,126 L323,154" stroke="currentColor" stroke-width="4"/>

  <!-- （象徴献祭／実体献祭） -->
  <g fill="none" stroke="currentColor" stroke-width="5">
    <path d="M272,160 Q256,190.5 272,221"/>
    <path d="M388,160 Q404,190.5 388,221"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="331" y="176.5" textLength="102" lengthAdjust="spacing">象徴献祭</text>
    <text x="331" y="205.5" textLength="102" lengthAdjust="spacing">実体献祭</text>
    <text x="342.5" y="380.5" textLength="155" lengthAdjust="spacing">信仰基台復帰</text>
  </g>

  <!-- 数理的な蕩減期間の箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="450" y="102" width="231" height="69"/>
    <rect x="449" y="313" width="231" height="69"/>
  </g>
  <g font-size="25" dominant-baseline="central" fill="#111">
    <text x="461" y="121" textLength="207" lengthAdjust="spacing">数理的な蕩減期間</text>
    <text y="152.5"><tspan x="478">(</tspan><tspan x="489" textLength="24" lengthAdjust="spacingAndGlyphs">12</tspan><tspan x="513">、</tspan><tspan x="535" textLength="12" lengthAdjust="spacingAndGlyphs">4</tspan><tspan x="548">、</tspan><tspan x="570" textLength="21" lengthAdjust="spacingAndGlyphs">21</tspan><tspan x="593">、</tspan><tspan x="616" textLength="26" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="643">)</tspan></text>
    <text x="460" y="333" textLength="208" lengthAdjust="spacing">数理的な蕩減期間</text>
    <text y="362"><tspan x="478">(</tspan><tspan x="489" textLength="24" lengthAdjust="spacingAndGlyphs">12</tspan><tspan x="513">、</tspan><tspan x="534" textLength="13" lengthAdjust="spacingAndGlyphs">4</tspan><tspan x="548">、</tspan><tspan x="569" textLength="22" lengthAdjust="spacingAndGlyphs">21</tspan><tspan x="593">、</tspan><tspan x="616" textLength="26" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="643">)</tspan></text>
  </g>

  <!-- 縦的な蕩減条件（点線の矢印） -->
  <line x1="565" y1="172" x2="565" y2="288" stroke="currentColor" stroke-width="7" stroke-dasharray="15 6"/>
  <polygon points="556.5,287 573.5,287 565,305"/>
  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="627.5" y="198">縦</text>
    <text x="627.5" y="224">的</text>
    <text x="627.5" y="250">な</text>
    <text x="596" y="198">蕩</text>
    <text x="596" y="224">減</text>
    <text x="596" y="250">条</text>
    <text x="596" y="276">件</text>
  </g>
</svg>
