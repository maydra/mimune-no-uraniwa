<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ノアの家庭：「信仰基台」の復帰</title>

  <!-- 下への矢印 -->
  <g fill="#8C949A">
    <polygon points="405,128 412,128 412,164.5 417,164.5 408.5,177.5 400,164.5 405,164.5"/>
    <polygon points="405,256 412,256 412,292.5 417,292.5 408.5,305.5 400,292.5 405,292.5"/>
  </g>

  <!-- ノアの家庭 -->
  <rect x="309" y="46" width="201" height="62" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="325" y="75" font-size="34" textLength="166" lengthAdjust="spacing" dominant-baseline="central" fill="#111">ノアの家庭</text>

  <text x="141" y="215" font-size="31" textLength="537" lengthAdjust="spacing" dominant-baseline="central">箱舟を神のみ意にかなうようにささげ</text>

  <!-- 「信仰基台」：復帰 -->
  <rect x="236" y="326" width="348" height="62" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text y="357.5" font-size="35" dominant-baseline="central" fill="#111"><tspan x="263">「</tspan><tspan x="279" textLength="146" lengthAdjust="spacing">信仰基台</tspan><tspan x="425">」</tspan><tspan x="462.5" text-anchor="middle">：</tspan><tspan x="482" textLength="72" lengthAdjust="spacing">復帰</tspan></text>
</svg>
