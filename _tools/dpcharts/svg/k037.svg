<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>実体基台＝堕落性を脱ぐための蕩減条件</title>

  <!-- 堕落と復帰の矢印 -->
  <g fill="currentColor">
    <polygon points="200,103 204,103 204,292 209,292 202,304 195,292 200,292"/>
    <polygon points="224,309 228,309 228,119 232.5,119 226,107.5 219.5,119 224,119"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="161.5" y="194">堕落</text>
    <text x="266" y="194">復帰</text>
  </g>

  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="212.5" cy="75" rx="80" ry="27.5" fill="#FCE5E3"/>
    <ellipse cx="215" cy="331.5" rx="59" ry="23.5" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="215" y="73" font-size="29" textLength="116" lengthAdjust="spacing">人間始祖</text>
    <text x="216" y="331.5" font-size="26" textLength="70" lengthAdjust="spacing">堕・人</text>
  </g>

  <!-- 点線 -->
  <g stroke="currentColor" stroke-width="4">
    <line x1="301" y1="76.5" x2="414" y2="76.5" stroke-dasharray="5 5.8"/>
    <line x1="264" y1="377.5" x2="398" y2="377.5" stroke-dasharray="5 5.75"/>
  </g>

  <text x="483" y="76" font-size="29" text-anchor="middle" dominant-baseline="central" textLength="122" lengthAdjust="spacing">創造本性</text>
  <polygon points="479,108 499,120.5 487,120.5 487,129 471,129 471,120.5 459,120.5" fill="#8C949A"/>
  <rect x="406" y="144" width="150" height="45.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="481.5" y="167" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="111" lengthAdjust="spacing">実体基台</text>
  <g stroke="currentColor" stroke-width="5">
    <line x1="472.5" y1="206" x2="472.5" y2="234"/>
    <line x1="485.5" y1="206" x2="485.5" y2="234"/>
  </g>
  <text x="495.5" y="262.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="395" lengthAdjust="spacing">「堕落性を脱ぐための蕩減条件」</text>
  <polygon points="479,291 490.5,311 482.5,311 482.5,350 475.5,350 475.5,311 467.5,311" fill="currentColor"/>

  <text x="177" y="379" font-size="28" dominant-baseline="central" textLength="76" lengthAdjust="spacingAndGlyphs">(原罪)</text>
  <text x="486" y="376.5" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="154" lengthAdjust="spacing">堕落性本性</text>
</svg>
