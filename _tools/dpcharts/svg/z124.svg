  </defs>

  <text x="54" y="56" font-size="46" dominant-baseline="central">Ⅱ.</text>
  <text x="128" y="56" font-size="48" textLength="598" lengthAdjust="spacing" dominant-baseline="central">神の喜びのための善の対象</text>
  <line x1="127" y1="87" x2="727" y2="87" stroke="currentColor" stroke-width="3.5"/>

