<h1>詩篇 第131章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>主よ、わが心はおごらず、わが目は高ぶらず、わたしはわが力の及ばない大いなる事とくすしきわざとに関係いたしません。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>かえって、乳離れしたみどりごが、その母のふところに安らかにあるように、わたしはわが魂を静め、かつ安らかにしました。わが魂は乳離れしたみどりごのように、安らかです。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>イスラエルよ、今からとこしえに主によって望みをいだけ。</p>
