<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>救いの摂理はすなわち復帰摂理である</title>

  <text x="56" y="74" font-size="46">Ⅱ.</text>
  <text x="128" y="74" font-size="47" textLength="802" lengthAdjust="spacing">救いの摂理はすなわち復帰摂理である</text>
  <line x1="126" y1="86" x2="934" y2="86" stroke="currentColor" stroke-width="3.5"/>

  <!-- 喜び・悲しみ（善の世界・罪悪世界から神へ。楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="341.2,409.9 561.7,221.5 567.5,228.3 578,199 547.4,204.8 553.3,211.6 332.8,400.1"/>
    <polygon points="957.2,400 735.3,211.5 741.1,204.7 710.5,199 721,228.3 726.9,221.4 948.8,410"/>
  </g>
  <g font-size="46" dominant-baseline="central">
    <text x="393" y="239">喜び</text>
    <text x="811" y="235">悲しみ</text>
  </g>

  <!-- 救い＝復帰（罪悪世界から善の世界へ）・堕落（善の世界から罪悪世界へ） -->
  <path d="M781,441 C729,385 580,385 521,431" fill="none" stroke="#8C949A" stroke-width="13"/>
  <polygon points="499,444 514,417 531,443" fill="#8C949A"/>
  <polygon points="502,474.8 767,474.8 767,485.5 796,468.5 767,451.5 767,462.2 502,462.2" fill="#8C949A"/>
  <text y="348" font-size="46" dominant-baseline="central"><tspan x="518">救い</tspan><tspan x="640.5" text-anchor="middle">＝</tspan><tspan x="672">復帰</tspan></text>
  <text x="643.5" y="511" font-size="46" text-anchor="middle" dominant-baseline="central">堕落</text>

  <!-- 神 -->
  <circle cx="644.5" cy="170" r="57" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="643" y="170" font-size="64" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 善の世界・罪悪世界 -->
  <ellipse cx="354" cy="445" rx="121" ry="48.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="944" cy="445" rx="120.5" ry="48.5" fill="#CF921C" stroke="currentColor" stroke-width="4"/>
  <g font-size="42" text-anchor="middle" dominant-baseline="central">
    <text x="354" y="446">善の世界</text>
    <text x="944" y="446.5" fill="#111">罪悪世界</text>
  </g>

  <rect x="366" y="573" width="556" height="77" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="642.5" y="611" font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">救いの摂理＝復帰摂理</text>
</svg>
