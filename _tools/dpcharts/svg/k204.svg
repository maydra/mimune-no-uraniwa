<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヤコブ路程はサタン屈伏の典型路程</title>

  <text x="34" y="38.5" font-size="31" dominant-baseline="central" textLength="507" lengthAdjust="spacing">ヤコブ路程はサタン屈伏の典型路程</text>
  <line x1="35" y1="57.5" x2="540" y2="57.5" stroke="currentColor" stroke-width="2"/>

  <g font-size="28" dominant-baseline="central">
    <text x="190.5" y="112.5" text-anchor="middle">①</text>
    <text x="209" y="112.5" textLength="86" lengthAdjust="spacing">個人的</text>
    <text x="311" y="112.5" textLength="144" lengthAdjust="spacing">長子の嗣業</text>
    <text x="469" y="112.5" textLength="58" lengthAdjust="spacing">復帰</text>

    <text x="190.5" y="176.5" text-anchor="middle">②</text>
    <text x="210" y="176.5" textLength="85" lengthAdjust="spacing">家庭的</text>
    <text x="311" y="176.5" textLength="144" lengthAdjust="spacing">長子の嗣業</text>
    <text x="469" y="176.5" textLength="58" lengthAdjust="spacing">復帰</text>

    <text x="190.5" y="238" text-anchor="middle">③</text>
    <text x="210" y="238" textLength="317" lengthAdjust="spacing">天使に対する主管性復帰</text>

    <text y="279"><tspan x="238" textLength="116" lengthAdjust="spacing">選民形成</tspan><tspan x="364">（</tspan><tspan x="378" textLength="143" lengthAdjust="spacing">イスラエル</tspan><tspan x="521">）</tspan></text>
  </g>
  <polygon points="194.5,277.5 213.5,277.5 213.5,272 226.5,280.5 213.5,288.5 213.5,283.5 194.5,283.5" fill="#8C949A"/>

  <rect x="138" y="337" width="523.5" height="52" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <text x="155" y="362" font-size="28" dominant-baseline="central" textLength="490" lengthAdjust="spacing" fill="#111">堕落性を脱ぐための蕩減条件を立てる</text>
</svg>
