<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>4. 復帰摂理から見た第三次世界大戦の結果</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="35" y="38" textLength="20" lengthAdjust="spacingAndGlyphs">4.</text>
    <text x="66" y="37.5" textLength="536" lengthAdjust="spacing">復帰摂理から見た第三次世界大戦の結果</text>
  </g>
  <line x1="64" y1="56.5" x2="603" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 左の大きな下向きの矢印 -->
  <polygon points="162,89.5 230.5,89.5 230.5,284.5 252.5,284.5 196.5,321 135.5,284.5 162,284.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
  <g font-size="24" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="210.5" y="111">三</text>
    <text x="210.5" y="135">段</text>
    <text x="210.5" y="158.5">階</text>
    <text x="210.5" y="182">ま</text>
    <text x="210.5" y="206">で</text>
    <text x="210.5" y="230">延</text>
    <text x="210.5" y="253.5">長</text>
    <text x="181.5" y="111">さ</text>
    <text x="181.5" y="135">れ</text>
    <text x="181.5" y="158.5">た</text>
    <text x="181.5" y="182">蕩</text>
    <text x="181.5" y="206">減</text>
    <text x="181.5" y="230">路</text>
    <text x="181.5" y="253.5">程</text>
  </g>

  <!-- 縦の軸（目盛りは灰色の帯の下） -->
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="262" y1="164.5" x2="300" y2="164.5"/>
    <line x1="262" y1="242.5" x2="300" y2="242.5"/>
  </g>
  <rect x="279" y="91" width="11" height="225" fill="#C4CCD3"/>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="278" y1="89.5" x2="278" y2="317.5"/>
    <line x1="258" y1="89.5" x2="297" y2="89.5"/>
    <line x1="258" y1="317.5" x2="679" y2="317.5"/>
  </g>
  <!-- 横の軸の目盛り -->
  <g stroke="#8C949A" stroke-width="2">
    <line x1="411.5" y1="310" x2="411.5" y2="326"/>
    <line x1="545.5" y1="310" x2="545.5" y2="326"/>
    <line x1="678.5" y1="310" x2="678.5" y2="327"/>
  </g>

  <!-- アダム家庭から世界まで -->
  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text x="360" y="94.5" textLength="102" lengthAdjust="spacing">アダム家庭</text>
    <text x="359" y="134" textLength="45" lengthAdjust="spacing">氏族</text>
    <text x="359.5" y="173" textLength="45" lengthAdjust="spacing">社会</text>
    <text x="359" y="211.5" textLength="45" lengthAdjust="spacing">民族</text>
    <text x="359.5" y="251" textLength="44" lengthAdjust="spacing">国家</text>
    <text x="359" y="290" textLength="45" lengthAdjust="spacing">世界</text>
  </g>
  <g fill="#8C949A">
    <polygon points="354,108 366,108 366,115 371,115 360,119 349,115 354,115"/>
    <polygon points="354,147 366,147 366,154 371,154 360,158 349,154 354,154"/>
    <polygon points="354,186 366,186 366,193 371,193 360,197 349,193 354,193"/>
    <polygon points="354,225 366,225 366,232 371,232 360,236 349,232 354,232"/>
    <polygon points="354,264 366,264 366,271 371,271 360,275 349,271 354,271"/>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="500,101.5 565,101.5 565,96.5 578.5,104 565,111.5 565,106.5 500,106.5"/>
    <polygon points="505,285.5 517.5,278 517.5,283 584,283 584,288 517.5,288 517.5,293"/>
  </g>

  <!-- カイン・アベル・共産・民主 -->
  <g stroke="currentColor" stroke-width="2.5">
    <g fill="#F86D42">
      <ellipse cx="461" cy="107.5" rx="41" ry="25.5"/>
      <ellipse cx="460" cy="285.5" rx="41" ry="25.5"/>
    </g>
    <g fill="#F8F28F">
      <ellipse cx="621.5" cy="104.5" rx="41" ry="25.5"/>
      <ellipse cx="622" cy="285.5" rx="41" ry="25.5"/>
    </g>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="461" y="108" textLength="66" lengthAdjust="spacing">カイン</text>
    <text x="622" y="105" textLength="66" lengthAdjust="spacing">アベル</text>
    <text x="460.5" y="286" textLength="49" lengthAdjust="spacing">共産</text>
    <text x="622.5" y="286" textLength="49" lengthAdjust="spacing">民主</text>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central">
    <text x="536.5" y="86" textLength="49" lengthAdjust="spacing">殺す</text>
    <text x="549" y="265" textLength="48" lengthAdjust="spacing">勝利</text>
    <text x="523" y="345" font-size="23" textLength="162" lengthAdjust="spacing">三次の世界大戦</text>
  </g>

  <!-- 下の大きな右向きの矢印 -->
  <polygon points="291,363 633.5,363 633.5,351 690,381.5 633.5,412.5 633.5,399.5 291,399.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
  <text x="380" y="382" font-size="23" dominant-baseline="central" textLength="163" lengthAdjust="spacing" fill="#111">全体蕩減復帰</text>
</svg>
