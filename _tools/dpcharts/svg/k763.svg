<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 821 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天の側とサタン側　再臨摂理の長成期始まる</title>

  <!-- 天の側・サタン側の楕円 -->
  <ellipse cx="237" cy="59" rx="66.5" ry="26.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="557" cy="59" rx="66.5" ry="26.5" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="236.5" y="59.5" textLength="84" lengthAdjust="spacing">天の側</text>
    <text x="556.5" y="60" textLength="102" lengthAdjust="spacing" fill="#fff">サタン側</text>
  </g>

  <!-- 二つの箱 -->
  <g fill="none" stroke="currentColor" stroke-width="2.5">
    <rect x="103.5" y="98.5" width="280.5" height="182.5"/>
    <rect x="446.5" y="98.5" width="234.5" height="181.5"/>
  </g>
  <g>
    <circle cx="121" cy="121.5" r="7"/>
    <circle cx="120.5" cy="194.5" r="7"/>
    <circle cx="473.5" cy="121.5" r="7"/>
    <circle cx="473.5" cy="194.5" r="7"/>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="134" y="123" textLength="156" lengthAdjust="spacing">霊的王国時代</text>
    <text x="134" y="154.5" textLength="75" lengthAdjust="spacing">過ぎる</text>
    <text x="134" y="193" textLength="234" lengthAdjust="spacing">再臨主を中心とした</text>
    <text x="134" y="225" textLength="235" lengthAdjust="spacing">新しい天、新しい地</text>
    <text x="489" y="122" textLength="152" lengthAdjust="spacing">ヒットラーと</text>
    <text x="489" y="154.5" textLength="153" lengthAdjust="spacing">その国滅びる</text>
    <text x="489" y="192.5" textLength="145" lengthAdjust="spacing">スターリン：</text>
    <text x="488" y="224.5" textLength="129" lengthAdjust="spacing">共産世界の</text>
    <text x="488" y="256.5" textLength="130" lengthAdjust="spacing">世界的基盤</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="432,185 418,185 418,178 400,190.5 418,203 418,196.5 432,196.5"/>
    <polygon points="374,385.5 357,385.5 357,381.5 344,389 357,396.5 357,392.5 374,392.5"/>
  </g>

  <!-- 水色の箱 -->
  <rect x="244.5" y="304.5" width="330.5" height="45.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="408.5" y="326.5" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="296" lengthAdjust="spacing" fill="#111">再臨摂理の長成期始まる</text>

  <!-- 下の行 -->
  <g font-size="25" dominant-baseline="central">
    <text x="119" y="389" textLength="216" lengthAdjust="spacing">既成宗教混乱、分裂</text>
    <text x="385" y="389" textLength="313" lengthAdjust="spacing">新しい真理による終末的現象</text>
  </g>
</svg>
