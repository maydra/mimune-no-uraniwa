<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天使の創造とその使命および人間との関係</title>

  <text x="53" y="61" font-size="46" dominant-baseline="central">Ⅰ.</text>
  <text x="126" y="60" font-size="47" dominant-baseline="central" textLength="836" lengthAdjust="spacingAndGlyphs">天使の創造とその使命および人間との関係</text>
  <line x1="126" y1="90.5" x2="962" y2="90.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 神 → 人間 → 天使（矢印を先に描き、楕円で隠す） -->
  <g fill="#8C949A">
    <polygon points="438,215 452,215 452,271 459,271 444.5,296 430,271 438,271"/>
    <polygon points="438,385 452,385 452,494 459,494 444.5,519 430,494 438,494"/>
  </g>
  <ellipse cx="444.5" cy="174" rx="60.25" ry="54.25" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <g stroke="currentColor" stroke-width="5">
    <ellipse cx="444.5" cy="348.5" rx="87.5" ry="48.5" fill="#FCE5E3"/>
    <ellipse cx="444.5" cy="571" rx="87.5" ry="48" fill="#B9C2C6"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="442" y="172" font-size="60">神</text>
    <text x="441.5" y="347" font-size="51" fill="#111">人間</text>
    <text x="442" y="570.5" font-size="52" fill="#111">天使</text>
    <text x="368.5" y="470.5" font-size="44">主管</text>
  </g>

  <!-- 人間について・天使について -->
  <g>
    <circle cx="583.5" cy="291.5" r="12"/>
    <circle cx="583.5" cy="353.5" r="12"/>
    <circle cx="583.5" cy="414.5" r="12"/>
    <circle cx="583.5" cy="512.5" r="12"/>
    <circle cx="583.5" cy="572.5" r="12"/>
    <circle cx="583.5" cy="629" r="12"/>
  </g>
  <g font-size="44" font-weight="400" dominant-baseline="central">
    <text x="608" y="292" textLength="320" lengthAdjust="spacing">子女として創造</text>
    <text x="607" y="352" textLength="320" lengthAdjust="spacing">被造世界主管権</text>
    <text x="608" y="412.5" textLength="228" lengthAdjust="spacing">天使も主管</text>
    <text x="608" y="512.5" textLength="182" lengthAdjust="spacing">先に創造</text>
    <text x="606" y="571" textLength="92" lengthAdjust="spacing">使い</text>
    <text x="698" y="571">、</text>
    <text x="744" y="571">僕</text>
    <text x="801" y="571" textLength="182" lengthAdjust="spacing">(黙 22:9)</text>
    <text x="607" y="629" textLength="411" lengthAdjust="spacing">頌栄をささげる存在</text>
  </g>
</svg>
