<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス：自分を信じることができるように語られ、行動</title>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="580.5" cy="99" rx="111" ry="63" fill="#F8F28F"/>
    <ellipse cx="579.5" cy="472" rx="110" ry="61.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="577.5" y="97.5" font-size="53" textLength="160" lengthAdjust="spacing">イエス</text>
    <text x="580" y="471.5" font-size="49">ユダヤ人</text>
  </g>

  <!-- ユダヤ人からイエスへ（ベルゼブルによる者：×）と、イエスからユダヤ人へ -->
  <g fill="#8C949A">
    <polygon points="548.75,397.5 548.75,203.5 537.5,203.5 555,173.5 572.5,203.5 561.25,203.5 561.25,397.5"/>
    <polygon points="601.75,181.5 614.25,181.5 614.25,373.5 625.5,373.5 608,403.5 590.5,373.5 601.75,373.5"/>
  </g>
  <g stroke="currentColor" stroke-width="12">
    <line x1="525.2" y1="261.2" x2="584.8" y2="320.8"/>
    <line x1="584.8" y1="261.2" x2="525.2" y2="320.8"/>
  </g>

  <g dominant-baseline="central">
    <text x="275" y="229.5" font-size="43" textLength="218" lengthAdjust="spacing">ベルゼブル</text>
    <text x="278" y="284.5" font-size="44">による者</text>
    <text x="274" y="341" font-size="34" textLength="217" lengthAdjust="spacingAndGlyphs">(マタイ 12:24)</text>
  </g>

  <circle cx="680.5" cy="225.5" r="12"/>
  <circle cx="678.5" cy="306.5" r="12"/>
  <g dominant-baseline="central">
    <text x="704" y="225" font-size="49">奇跡</text>
    <text x="704" y="305" font-size="46" textLength="366" lengthAdjust="spacingAndGlyphs">わざを信じるがよい</text>
    <text x="708" y="362.5" font-size="34" textLength="218" lengthAdjust="spacingAndGlyphs">(ヨハネ 10:38)</text>
  </g>

  <rect x="229.5" y="566.5" width="846.5" height="77.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text y="605" font-size="40" dominant-baseline="central" fill="#111"><tspan x="254" textLength="94" lengthAdjust="spacingAndGlyphs">イエス</tspan><tspan x="366" text-anchor="middle">：</tspan><tspan x="386" textLength="574" lengthAdjust="spacingAndGlyphs">自分を信じることができるように語られ</tspan><tspan x="958">、</tspan><tspan x="992" textLength="63" lengthAdjust="spacingAndGlyphs">行動</tspan></text>
</svg>
