<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>訓読 対訳ビューア</title>
<style>
  :root{
    --bg:#faf8f4; --panel:#fff; --ink:#1d1b17; --muted:#7a736c;
    --line:#e6e0d6; --accent:#8a5a2b; --mark:#fff4d6; --markline:#dfae55;
    --pad:20px; --fs:20px; --lh:1.9; --gap:26px;
  }
  html[data-theme="dark"]{
    --bg:#15140f; --panel:#1f1e17; --ink:#ece7dc; --muted:#9a9287;
    --line:#34312a; --accent:#dba867; --mark:#3b3118; --markline:#8b6c2b;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Malgun Gothic","Noto Sans KR",sans-serif}

  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);box-shadow:0 1px 10px rgba(0,0,0,.07)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px var(--pad)}
  .bar + .bar{padding-top:0}
  #tools.closed{display:none}
  .brand{font-weight:700;color:var(--accent);white-space:nowrap;letter-spacing:.05em}
  select,button,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;cursor:pointer}
  #sec{max-width:min(48vw,440px)}
  button:hover{border-color:var(--accent)}
  button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grp{display:flex;gap:6px;align-items:center}
  /* 画面の言語。本文の言語ボタンと取り違えないよう、地球の印と区切り線を付ける */
  .uigrp{padding-left:10px;border-left:1px solid var(--line)}
  .spacer{flex:1}
  .hint{color:var(--muted);font-size:13px}
  .pos{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}

  .sechead{padding:22px var(--pad) 10px;max-width:1600px;margin:0 auto}
  .sechead h1{font-size:clamp(19px,2.2vw,27px);margin:0 0 10px;line-height:1.4}
  .sechead .sub{color:var(--muted);font-size:14px;line-height:1.8}
  .sechead .sub > div{display:flex;gap:6px;align-items:baseline}
  .sechead .sub b{color:var(--accent);flex:0 0 auto}
  .sechead .sub span{flex:1 1 auto;min-width:0}
  .warn{display:inline-block;margin:10px 8px 0 0;padding:5px 12px;border-radius:999px;
    background:var(--mark);border:1px solid var(--markline);font-size:13px}
  /* 節ごと・言語ごとのリンクを配るボタン */
  .linkbtn{font-size:12px;line-height:1.5;padding:2px 9px;border-radius:999px;
    color:var(--muted);flex:0 0 auto;white-space:nowrap}
  .linkbtn:hover{color:var(--accent)}
  h1 .linkbtn{font-size:13px;margin-left:10px;vertical-align:middle}

  /* 対訳の本体は 1 枚のグリッド。英語は複数行にまたがる */
  main{padding:8px var(--pad) 50vh;max-width:1600px;margin:0 auto;
    display:grid;column-gap:var(--gap);align-items:start}
  .cell{font-size:var(--fs);line-height:var(--lh);white-space:pre-wrap;overflow-wrap:anywhere;
    padding:12px 12px 14px;border-top:1px solid var(--line);border-radius:8px}
  .cell .tag{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);
    font-weight:700;margin-bottom:5px}
  .cell.span{background:color-mix(in srgb,var(--panel) 55%,transparent)}
  .cell.on{background:var(--mark);box-shadow:inset 4px 0 0 var(--markline)}
  .rowno{font-size:11px;color:var(--muted);padding-top:14px;border-top:1px solid var(--line);
    font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  /* 段落ごとのリンク。ふだんは薄く、指で触る端末では触らなくても見えるようにする */
  .rowno .lk{cursor:pointer;font-size:11px;line-height:1;opacity:0;transition:opacity .15s;
    padding:2px 3px;border-radius:6px}
  .rowno:hover .lk,.rowno .lk:focus-visible{opacity:.85}
  .rowno.here .lk{opacity:.85}
  @media (pointer:coarse){ .rowno .lk{opacity:.45;padding:5px 7px;font-size:13px} }
  .empty{color:var(--muted)}
  /* 訳の無い所へ入れた参考訳。公式訳と取り違えないよう、薄い文字＋左の縦線＋札 */
  .cell.ai{color:var(--muted);border-left:3px solid var(--markline);
    border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--mark) 40%,transparent)}
  .cell.ai .tag{color:var(--markline)}
  body.hideai .cell.ai{display:none}
  .cell.gap{background:repeating-linear-gradient(135deg,transparent,transparent 7px,
    color-mix(in srgb,var(--markline) 16%,transparent) 7px,
    color-mix(in srgb,var(--markline) 16%,transparent) 14px)}
  /* 翻訳版の掲載順から動かして並べた所。目障りにならない程度の小さな断り */
  .mvtag{color:var(--markline);letter-spacing:0;cursor:help;margin-left:6px}

  /* 横3列（縦積み）: 1 行ぶんをひとかたまりにして、行の切れ目を太い線で見せる */
  .rowbox{border-top:2px solid var(--line);padding-top:2px;margin-top:14px;
    scroll-margin-top:calc(var(--headh,60px) + 12px)}
  .rowbox .rowno{padding:8px 12px 0;border-top:none;flex-direction:row;align-items:baseline;gap:10px}
  .rowbox .cell{border-top:none;padding-top:4px}

  #q{min-width:170px;cursor:text}
  .hits{position:absolute;top:100%;left:0;right:0;max-height:52vh;overflow:auto;
    background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .hit{padding:9px var(--pad);border-top:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.6}
  .hit:hover{background:var(--mark)}
  .hit b{color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
  .hit mark{background:var(--mark);color:inherit;font-weight:700;padding:0 2px}
  footer{padding:18px var(--pad);color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
  /* コピーしたことの知らせ。段落ごとのボタンは小さいので、その場で字を変えずここに出す */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
    background:var(--accent);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s;
    max-width:min(92vw,560px);text-align:center}
  .toast.on{opacity:1}
  a{color:var(--accent)}

  /* スマホ: 縦3列は1行2〜3字になって読めないので、初めて開いたときは横3列にして
     上のバーもたたんでおく（下の JS）。ここでは詰めて、指で押せる大きさにする */
  @media (max-width:760px){
    :root{--gap:0px;--pad:12px}
    .bar{gap:6px;padding:7px var(--pad)}
    select,button{padding:8px 11px}
    #sec{max-width:100%;flex:1 1 150px;min-width:0}
    #q{flex:1 1 140px;min-width:0}
    .uigrp{padding-left:8px}
    .sechead{padding:14px var(--pad) 6px}
    .warn{font-size:12px;padding:5px 10px}
    .cell{padding:10px 10px 12px}
    .rowbox .rowno{padding:8px 10px 0}
    .linkbtn{padding:4px 10px}
  }
  @media (max-width:480px){ .brand{display:none} }
  @media print{
    header,footer,.hint,.linkbtn{display:none}
    body{background:#fff;color:#000}
    .cell{break-inside:avoid}
    .cell.on{background:none;box-shadow:none}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand" id="brand">訓読 対訳</span>
    <select id="sec"></select>
    <button id="prev">◀</button>
    <button id="next">▶</button>
    <div class="spacer"></div>
    <span class="pos" id="pos"></span>
    <button id="toggle" aria-expanded="true">▴</button>
  </div>
  <div id="tools">
    <div class="bar">
      <div class="grp" id="langs"></div>
      <input id="q" autocomplete="off">
      <div class="spacer"></div>
      <div class="grp">
        <button id="layout">横3列</button>
        <button id="small">A−</button>
        <button id="big">A＋</button>
        <button id="theme">◐</button>
        <button id="ai">AI訳</button>
      </div>
      <div class="grp uigrp">
        <select id="ui">
          <option value="ja">🌐 日本語</option>
          <option value="ko">🌐 한국어</option>
          <option value="en">🌐 English</option>
        </select>
      </div>
    </div>
    <div class="bar">
      <span class="hint" id="hint"></span>
    </div>
  </div>
  <div class="hits" id="hits" hidden></div>
</header>

<div class="sechead">
  <h1 id="secTitle">…</h1>
  <div class="sub" id="secSub"></div>
  <div id="secWarn"></div>
</div>

<main id="body"></main>

<footer id="foot"></footer>

<script src="data.js"></script>
<script>
(() => {
  const LANGS = [
    { id: "ko", label: "한국어",  tag: "KO" },
    { id: "ja", label: "日本語",  tag: "JA" },
    { id: "en", label: "English", tag: "EN" },
  ];

  // ---- 画面の言葉。本文の言語（LANGS）とは別で、右上のプルダウンで選ぶ ----
  const UI = {
    ja: {
      title: "訓読 対訳ビューア", brand: "訓読 対訳",
      secSel: "節を選ぶ", prev: "前の節", next: "次の節",
      openT: "上のバーを出す", closeT: "上のバーをたたむ",
      langsT: "表示する言語", q: "全体から語句を探す",
      rows: "横3列", cols: "縦3列", layoutT: "縦3列（横並び） / 横3列（縦積み）",
      smallT: "文字を小さく", bigT: "文字を大きく", themeT: "配色",
      ai: "AI訳", aiT: "訳の無い所へ入れた参考訳を出し入れする",
      uiT: "画面の言語",
      hint: "段落をクリックで印 ／ ↑↓ で読み進める ／ ←→ で節を移動",
      hintTouch: "段落をタップで印 ／ ◀ ▶ で節を移動",
      pos: (i, n, p) => `${i} / ${n}　${p} 段落`,
      loading: "読み込み中…",
      nodata: "データがありません（python scripts/align.py を実行してください）",
      none: "（この節は未収録）",
      name: { ko: "韓国語", ja: "日本語", en: "英語" },
      chapter: (n) => `第${n}章`,
      link: "リンク", copied: "コピーしました", copyFail: "コピーできませんでした。アドレス欄のURLを使ってください",
      linkSecT: "この節を開くリンクをコピー",
      linkRowT: (n) => `${n} 段落目を開くリンクをコピー`,
      linkLangT: (l) => `${l}だけを出してこの節を開くリンクをコピー`,
      wPdf: (l) => `${l} はPDF添付のみで本文がありません`,
      wMismatch: (l, f) => `${l}の記事は別の内容が載っているようです（語の一致 ${f}）。対訳として当てにしないでください`,
      wShort: (l) => `${l}は投稿されていない部分があります。抜けている所は「—」と出ます`,
      wAisec: (l) => `${l}版はこの節が投稿されていません。${l}の欄は全文が韓国語からの AI 参考訳です（公式訳ではありません。「AI訳」ボタンで消せます）`,
      wMoved: "⇄印の英語は、対訳のため翻訳版の掲載順から移動してあります",
      spanTag: (n) => `・ ${n}段落ぶん`,
      mvTag: "⇄ 順番移動",
      mvTitle: "対訳のため、翻訳版に掲載されていた順番から移動してあります",
      noHit: "見つかりませんでした",
      foot: (links) => `出典: Daum カフェ「천일국 경전방」の各記事（${links}）。`
        + `段落の対応づけは文字数から機械的に推定したものです。ずれていたら元記事で確かめてください。`,
    },
    ko: {
      title: "훈독 대역 뷰어", brand: "훈독 대역",
      secSel: "절 고르기", prev: "이전 절", next: "다음 절",
      openT: "위 막대 펴기", closeT: "위 막대 접기",
      langsT: "표시할 언어", q: "전체에서 낱말 찾기",
      rows: "가로 3줄", cols: "세로 3단", layoutT: "세로 3단(나란히) / 가로 3줄(쌓기)",
      smallT: "글자 작게", bigT: "글자 크게", themeT: "배색",
      ai: "AI 번역", aiT: "번역이 없는 곳에 넣은 참고 번역을 보이거나 숨깁니다",
      uiT: "화면 언어",
      hint: "문단을 클릭하면 표시 ／ ↑↓ 로 읽어 나가기 ／ ←→ 로 절 이동",
      hintTouch: "문단을 누르면 표시 ／ ◀ ▶ 로 절 이동",
      pos: (i, n, p) => `${i} / ${n}　${p} 문단`,
      loading: "읽는 중…",
      nodata: "자료가 없습니다 (python scripts/align.py 을 실행하십시오)",
      none: "(이 절은 실려 있지 않습니다)",
      name: { ko: "한국어", ja: "일본어", en: "영어" },
      chapter: (n) => `제${n}장`,
      link: "링크", copied: "복사했습니다", copyFail: "복사하지 못했습니다. 주소창의 URL을 사용해 주십시오",
      linkSecT: "이 절을 여는 링크를 복사",
      linkRowT: (n) => `${n}번째 문단을 여는 링크를 복사`,
      linkLangT: (l) => `${l}만 켜고 이 절을 여는 링크를 복사`,
      wPdf: (l) => `${l}는 PDF 첨부만 있고 본문이 없습니다`,
      wMismatch: (l, f) => `${l} 글에는 다른 내용이 실려 있는 것 같습니다 (낱말 일치 ${f}). 대역으로 믿지 마십시오`,
      wShort: (l) => `${l}는 올라오지 않은 부분이 있습니다. 빠진 곳은 「—」로 나옵니다`,
      wAisec: (l) => `${l}판에는 이 절이 올라와 있지 않습니다. ${l} 칸은 전문이 한국어에서 옮긴 AI 참고 번역입니다 (공식 번역이 아닙니다. 「AI 번역」 단추로 숨길 수 있습니다)`,
      wMoved: "⇄ 표시가 붙은 영어는 대역을 맞추기 위해 번역판의 실린 순서에서 옮긴 것입니다",
      spanTag: (n) => `・ ${n}문단 분량`,
      mvTag: "⇄ 순서 이동",
      mvTitle: "대역을 맞추기 위해, 번역판에 실려 있던 순서에서 옮겼습니다",
      noHit: "찾지 못했습니다",
      foot: (links) => `출처: 다음 카페 「천일국 경전방」의 각 글 (${links}). `
        + `문단 짝짓기는 글자 수를 바탕으로 기계가 추정한 것입니다. 어긋나 보이면 원글에서 확인해 주십시오.`,
    },
    en: {
      title: "Hoondok Parallel Reader", brand: "Hoondok Parallel",
      secSel: "Choose a section", prev: "Previous section", next: "Next section",
      openT: "Show the toolbar", closeT: "Hide the toolbar",
      langsT: "Languages to show", q: "Search every section",
      rows: "3 rows", cols: "3 columns", layoutT: "3 columns (side by side) / 3 rows (stacked)",
      smallT: "Smaller text", bigT: "Larger text", themeT: "Color scheme",
      ai: "AI", aiT: "Show or hide the AI reference translations filled into missing paragraphs",
      uiT: "Interface language",
      hint: "Click a paragraph to mark it / ↑↓ to read on / ←→ to change section",
      hintTouch: "Tap a paragraph to mark it / ◀ ▶ to change section",
      pos: (i, n, p) => `${i} / ${n}　${p} paragraphs`,
      loading: "Loading…",
      nodata: "No data (run python scripts/align.py)",
      none: "(not posted for this section)",
      name: { ko: "Korean", ja: "Japanese", en: "English" },
      chapter: (n) => `Ch. ${n}`,
      link: "Link", copied: "Copied", copyFail: "Could not copy - use the URL in the address bar",
      linkSecT: "Copy a link that opens this section",
      linkRowT: (n) => `Copy a link that opens paragraph ${n}`,
      linkLangT: (l) => `Copy a link that opens this section with only ${l} showing`,
      wPdf: (l) => `The ${l} post has only a PDF attachment, with no body text`,
      wMismatch: (l, f) => `The ${l} post seems to carry different content (word match ${f}). Do not rely on it as a parallel text`,
      wShort: (l) => `Part of the ${l} text was never posted. Missing paragraphs show as "—"`,
      wAisec: (l) => `This section was never posted in ${l}. The whole ${l} column is an AI reference translation from the Korean (not the official text; hide it with the "AI" button)`,
      wMoved: "English cells marked ⇄ were moved out of the order of the translated post so that they line up",
      spanTag: (n) => `· ${n} paragraphs`,
      mvTag: "⇄ moved",
      mvTitle: "Moved out of the order in which it appeared in the translated post, so that it lines up",
      noHit: "Nothing found",
      foot: (links) => `Source: the posts in the Daum cafe "천일국 경전방" (${links}). `
        + `The paragraph pairing is estimated mechanically from text length; if it looks off, check the original post.`,
    },
  };
  // 参考訳の札だけは**その欄の言語**で出す。英語の欄を読んでいる人が読めなければ意味がない
  const AITAG = {
    ko: "AI 참고 번역 (한국어에서) · 공식 번역이 아닙니다",
    ja: "AI訳（韓国語から）・公式訳ではありません",
    en: "AI translation from Korean — not the official text",
  };

  const data = (window.HOONDOK || { sections: [] }).sections;
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const store = {
    get(k, d) { try { const v = localStorage.getItem("hoondok." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("hoondok." + k, JSON.stringify(v)); } catch {} },
  };
  const narrow = () => matchMedia("(max-width:760px)").matches;
  const touch  = () => matchMedia("(pointer:coarse)").matches;

  let on      = store.get("langs", ["ko", "ja", "en"]);
  let idx     = Math.min(Math.max(store.get("sec", 0), 0), Math.max(data.length - 1, 0));
  let fs      = store.get("fs", 20);
  // 縦3列か横3列かは**画面の広さごとに**覚える。既定はスマホが横3列、パソコンが縦3列。
  // 一つの憶えにすると、パソコンでの選択がスマホの既定まで動かしてしまう
  const layoutKey = () => (narrow() ? "stacked.narrow" : "stacked.wide");
  const readLayout = () => {
    const v = store.get(layoutKey(), null);
    return v === null ? narrow() : v;
  };
  {                                          // 昔の一つきりの憶えは、広い画面のぶんとして引き継ぐ
    const oldv = store.get("stacked", null);
    if (oldv !== null) {
      if (store.get("stacked.wide", null) === null) store.set("stacked.wide", oldv);
      try { localStorage.removeItem("hoondok.stacked"); } catch {}
    }
  }
  let stacked = readLayout();
  let tools   = store.get("tools", null);
  if (tools === null) tools = !narrow();    // スマホでは初めからたたんでおく
  let theme   = store.get("theme", "light");
  let showAI  = store.get("ai", true);      // 訳の無い所へ入れた参考訳を出すか
  // 画面の言葉は ?ui=en のようにリンクでも渡せる。強い順に「リンク → 憶え → 端末の言語」
  const qUi = new URLSearchParams(location.search).get("ui");
  if (UI[qUi]) store.set("ui", qUi);
  let ui = store.get("ui", null);
  // 自分で選んだ（か、リンクで渡された）ときだけ、配るリンクにも乗せる。
  // 既定のまま配ったリンクは、相手の端末の言語で開いてほしい
  let uiPicked = !!UI[ui];
  if (!uiPicked) ui = (navigator.language || "").slice(0, 2);
  if (!UI[ui]) ui = "ja";
  let cur     = -1;                         // いま読んでいる行
  const T = () => UI[ui];

  if (!on.length) on = ["ko"];
  // 本文の言語も、画面の言葉と同じ扱いにする。自分で選んだ（かリンクで渡された）ときだけ
  // 配るリンクに乗せる。既定の3つのまま配ったリンクは、相手の憶えのまま開いてほしい
  let langsPicked = store.get("langsPicked", false);
  const wantLangs = () => (langsPicked ? on : null);

  // ---- URL の #。`#6-4` で節、`#6-4-12` で段落、`#6-4-12/en` で言語まで指せる ----
  // 節の鍵は必ず「章-節」の2つ組なので、3つ目の数があれば、それが段落の番号（1始まり）
  function parseHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return null;
    const [k, l] = h.split("/");
    const langs = (l || "").split("+").filter((x) => LANGS.some((L) => L.id === x));
    let i = data.findIndex((s) => s.key === k), row = 0;
    if (i < 0) {
      const cut = k.lastIndexOf("-");
      const n = cut > 0 ? parseInt(k.slice(cut + 1), 10) : NaN;
      if (Number.isFinite(n)) {
        i = data.findIndex((s) => s.key === k.slice(0, cut));
        if (i >= 0) row = n;
      }
    }
    if (i < 0) {                                  // `#28` のような通し番号も受ける
      const n = parseInt(k, 10);
      if (Number.isFinite(n)) i = n - 1;
    }
    if (i < 0 || i >= data.length) return null;
    return { i, langs, row };
  }
  function applyHash(h) {
    if (!h) return false;
    if (h.langs.length) {
      on = LANGS.map((L) => L.id).filter((x) => h.langs.includes(x));
      store.set("langs", on);
      langsPicked = true; store.set("langsPicked", true);
    }
    return true;
  }
  let want = 0;                                   // 開いた直後に出したい段落（1始まり・0は無し）
  { const h = parseHash(); if (applyHash(h)) { idx = h.i; want = h.row; } }
  addEventListener("hashchange", () => {
    const h = parseHash();
    if (!h) return;
    const was = on.join("+");                     // 言語だけ違うリンクを開いたときは描き直す
    applyHash(h);
    if (h.i !== idx) { want = h.row; go(h.i); return; }
    if (h.row) cur = h.row - 1;
    if (on.join("+") !== was) paint(); else mark();
    if (h.row) showCur();
  });
  function showCur() {
    const cell = document.querySelector(".cell.on");
    if (!cell) return;
    // 横3列では行の頭（番号とリンク）から見せる。縦3列は段落が短いので真ん中でよい
    const box = cell.closest(".rowbox");
    (box || cell).scrollIntoView({ block: box ? "start" : "center" });
  }

  const pageURL = () => location.href.split("#")[0].split("?")[0];
  const uiQuery = () => (uiPicked ? "?ui=" + ui : "");
  function shareURL(key, langs, row) {
    return pageURL() + uiQuery() + "#" + key + (row ? "-" + row : "")
      + (langs && langs.length ? "/" + langs.join("+") : "");
  }
  function syncHash() {   // いま出しているものをアドレス欄に映す（そのままコピーして配れるように）
    const k = data[idx] && data[idx].key;
    if (!k) return;
    const url = shareURL(k, wantLangs(), cur >= 0 ? cur + 1 : 0);
    if (url === location.href) return;
    try { history.replaceState(null, "", url); } catch {}   // file:// で断られることがある
  }
  const toastEl = document.createElement("div");
  toastEl.className = "toast";
  let toastTimer = 0;
  function toast(msg) {
    document.body.appendChild(toastEl);
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 1500);
  }
  function copyLink(url) {
    const failed = () => {
      // コピーできないときは、せめてアドレス欄にその URL を出しておく（取り逃がさないため）
      try { history.replaceState(null, "", url); } catch {}
      toast(T().copyFail);
    };
    const byExec = () => {                // file:// では clipboard API が塞がれることがある
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.style.cssText = "position:fixed;top:-500px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
      if (ok) { toast(T().copied); } else { failed(); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => toast(T().copied), byExec);
    } else {
      byExec();
    }
  }

  // ---- 節の名前と一覧 ----
  function secLabel(s) {
    const m = /^(\d+)-(\d+)$/.exec(s.key || "");
    return m ? `${T().chapter(+m[1])} ${s.key}` : s.label;
  }
  function secTitle(s) {
    return s.titles[ui] || s.titles.ja || s.titles.ko || s.titles.en || s.label;
  }
  const sel = $("#sec");
  function fillSections() {
    sel.innerHTML = "";
    data.forEach((s, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = `${secLabel(s)}　${secTitle(s)}`;
      sel.appendChild(o);
    });
    sel.value = idx;
  }

  // ---- 本文の言語の出し入れ ----
  const langBox = $("#langs");
  LANGS.forEach((L) => {
    const b = document.createElement("button");
    b.textContent = L.label;
    b.dataset.lang = L.id;
    b.onclick = () => {
      on = on.includes(L.id) ? on.filter((x) => x !== L.id)
                             : LANGS.map((x) => x.id).filter((x) => on.includes(x) || x === L.id);
      if (!on.length) on = [L.id];
      store.set("langs", on);
      langsPicked = true; store.set("langsPicked", true);
      paint(); syncHash();
    };
    langBox.appendChild(b);
  });

  // ---- 画面の言葉を貼り替える ----
  function applyUI() {
    const t = T();
    document.documentElement.lang = ui;
    document.title = t.title;
    $("#brand").textContent = t.brand;
    $("#sec").title = t.secSel;
    $("#prev").title = t.prev;
    $("#next").title = t.next;
    $("#toggle").title = tools ? t.closeT : t.openT;
    $("#toggle").textContent = tools ? "▴" : "▾";
    $("#toggle").setAttribute("aria-expanded", String(tools));
    langBox.title = t.langsT;
    $("#q").placeholder = t.q;
    $("#layout").title = t.layoutT;
    $("#small").title = t.smallT;
    $("#big").title = t.bigT;
    $("#theme").title = t.themeT;
    $("#ai").textContent = t.ai;
    $("#ai").title = t.aiT;
    $("#ui").title = t.uiT;
    $("#ui").setAttribute("aria-label", t.uiT);
    $("#ui").value = ui;
    $("#hint").textContent = touch() ? t.hintTouch : t.hint;
  }

  function paint() {
    const t = T();
    applyUI();
    document.documentElement.dataset.theme = theme;
    document.body.classList.toggle("hideai", !showAI);
    $("#tools").classList.toggle("closed", !tools);
    $("#ai").setAttribute("aria-pressed", String(showAI));
    document.documentElement.style.setProperty("--fs", fs + "px");
    $("#layout").textContent = stacked ? t.cols : t.rows;
    $("#layout").setAttribute("aria-pressed", String(stacked));
    langBox.querySelectorAll("button").forEach((b) =>
      b.setAttribute("aria-pressed", String(on.includes(b.dataset.lang))));
    fillSections();

    const s = data[idx];
    const main = $("#body");
    main.innerHTML = "";
    if (!s) { $("#secTitle").textContent = t.nodata; return; }

    const shown = LANGS.filter((L) => on.includes(L.id));
    // 節の題と、節ぜんぶを開くリンク
    $("#secTitle").innerHTML = esc(secTitle(s))
      + `<button class="linkbtn" data-share="" title="${esc(t.linkSecT)}">🔗 ${esc(t.link)}</button>`;
    // 言語ごとの行。それぞれ「その言語だけを出して開く」リンクを配れる
    $("#secSub").innerHTML = LANGS.map((L) =>
      `<div><b>${L.tag}</b><span>${esc(s.titles[L.id] || t.none)}</span>`
      + `<button class="linkbtn" data-share="${L.id}" title="${esc(t.linkLangT(t.name[L.id]))}">🔗</button></div>`).join("");
    $(".sechead").querySelectorAll("[data-share]").forEach((b) => {
      b.onclick = () => copyLink(shareURL(s.key, b.dataset.share ? [b.dataset.share] : wantLangs()));
    });

    const NAME = t.name;
    const warn = [];
    if ((s.pdf || []).length)
      warn.push(t.wPdf(s.pdf.map((l) => NAME[l]).join(" / ")));
    (s.mismatch || []).forEach((l) => warn.push(t.wMismatch(NAME[l], s.fit?.[l] ?? "?")));
    (s.short || []).forEach((l) => {
      if (!(s.mismatch || []).includes(l)) warn.push(t.wShort(NAME[l]));
    });
    (s.aisec || []).forEach((l) => warn.push(t.wAisec(NAME[l])));
    if ((s.cells.en || []).some((c) => c.mv)) warn.push(t.wMoved);
    $("#secWarn").innerHTML = warn.map((w) => `<span class="warn">${esc(w)}</span>`).join(" ");

    const links = shown
      .map((L) => s.urls[L.id] ? `<a href="${s.urls[L.id]}" target="_blank" rel="noopener">${L.tag}</a>` : "")
      .filter(Boolean).join(" ・ ");
    $("#foot").innerHTML = t.foot(links);
    $("#pos").textContent = t.pos(idx + 1, data.length, s.n);

    if (stacked) {
      // 横3列: 1 行ぶんの各言語をひとかたまりにして上から並べる（スマホ・プロジェクタ用）
      main.style.gridTemplateColumns = "1fr";
      main.style.gridTemplateRows = "";
      for (let r = 0; r < s.n; r++) {
        const box = document.createElement("div");
        box.className = "rowbox";
        box.appendChild(rownoEl(s, r));
        shown.forEach((L) => {
          const c = (s.cells[L.id] || []).find((x) => x.r === r);
          if (c) box.appendChild(cellEl(L, c, r));
        });
        main.appendChild(box);
      }
    } else {
      main.style.gridTemplateColumns = `34px ${shown.map(() => "1fr").join(" ")}`;
      main.style.gridTemplateRows = `repeat(${s.n}, auto)`;
      for (let r = 0; r < s.n; r++) {
        const nm = rownoEl(s, r);
        nm.style.gridColumn = "1";
        nm.style.gridRow = String(r + 1);
        main.appendChild(nm);
      }
      shown.forEach((L, ci) => {
        (s.cells[L.id] || []).forEach((c) => {
          const el = cellEl(L, c, c.r);
          el.style.gridColumn = String(ci + 2);
          el.style.gridRow = `${c.r + 1} / span ${c.span}`;
          main.appendChild(el);
        });
      });
    }
    // 上のバーの高さ。寄せたとき行の頭がバーの下に隠れないように使う。
    // 段落数などを書き終えたあとで測る（バーの折り返しが変わって高さが動くため）
    document.documentElement.style.setProperty(
      "--headh", document.querySelector("header").offsetHeight + "px");
    mark();
  }

  // 行番号の欄。番号のとなりに、その段落を開くリンクを配るボタンを置く
  function rownoEl(s, r) {
    const el = document.createElement("div");
    el.className = "rowno";
    el.dataset.r = r;
    el.dataset.span = 1;
    const n = document.createElement("span");
    n.textContent = r + 1;
    const lk = document.createElement("span");
    lk.className = "lk";
    lk.textContent = "\u{1F517}";
    lk.tabIndex = 0;
    lk.title = T().linkRowT(r + 1);
    lk.onclick = (e) => { e.stopPropagation(); copyLink(shareURL(s.key, wantLangs(), r + 1)); };
    lk.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); lk.onclick(e); } };
    el.append(n, lk);
    el.onclick = () => { cur = (cur === r ? -1 : r); mark(); };
    return el;
  }

  function cellEl(L, c, r) {
    const t = T();
    const el = document.createElement("div");
    el.className = "cell" + (c.span > 1 ? " span" : "") + (c.t ? "" : " gap")
      + (c.ai ? " ai" : "");
    el.lang = L.id;
    el.dataset.r = c.r;
    el.dataset.span = c.span;
    el.innerHTML = `<span class="tag">${c.ai
        ? AITAG[L.id]
        : L.tag + (c.span > 1 ? ` ${t.spanTag(c.span)}` : "")
        + (c.mv ? `<span class="mvtag" title="${esc(t.mvTitle)}">${t.mvTag}</span>` : "")}</span>`
      + (c.t ? esc(c.t) : '<span class="empty">—</span>');
    el.onclick = () => { cur = (cur === r ? -1 : r); mark(); };
    return el;
  }

  function mark() {
    document.querySelectorAll(".cell, .rowno").forEach((el) => {
      const r = +el.dataset.r, sp = +el.dataset.span || 1;
      const here = el.classList.contains("rowno");
      el.classList.toggle(here ? "here" : "on", cur >= r && cur < r + sp);
      if (here) el.style.color = (r === cur) ? "var(--accent)" : "";
    });
    syncHash();
  }

  function go(n) {
    idx = Math.min(Math.max(n, 0), data.length - 1);
    cur = want ? want - 1 : -1;
    store.set("sec", idx);
    paint();
    if (want) { want = 0; showCur(); } else { scrollTo({ top: 0 }); }
  }
  function move(step) {
    const s = data[idx]; if (!s || !s.n) return;
    cur = Math.min(Math.max(cur + step, 0), s.n - 1);
    mark();
    showCur();
  }

  sel.onchange        = () => go(+sel.value);
  $("#prev").onclick  = () => go(idx - 1);
  $("#next").onclick  = () => go(idx + 1);
  $("#toggle").onclick= () => { tools = !tools; store.set("tools", tools); paint(); };
  $("#layout").onclick= () => { stacked = !stacked; store.set(layoutKey(), stacked); paint(); };
  $("#big").onclick   = () => { fs = Math.min(fs + 2, 40); store.set("fs", fs); paint(); };
  $("#small").onclick = () => { fs = Math.max(fs - 2, 13); store.set("fs", fs); paint(); };
  $("#theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; store.set("theme", theme); paint(); };
  $("#ai").onclick    = () => { showAI = !showAI; store.set("ai", showAI); paint(); };
  $("#ui").onchange   = () => {
    ui = $("#ui").value; uiPicked = true; store.set("ui", ui); search(); paint();
  };

  // ---- 語句を全節から探す ----
  const hits = $("#hits"), q = $("#q");
  let hitList = [];
  function search() {
    const t = q.value.trim();
    hitList = [];
    if (t.length < 2) { hits.hidden = true; return; }
    const low = t.toLowerCase();
    outer:
    for (let si = 0; si < data.length; si++) {
      const s = data[si];
      for (const L of LANGS) {
        for (const c of s.cells[L.id] || []) {
          const at = c.t.toLowerCase().indexOf(low);
          if (at >= 0) {
            hitList.push({ si, r: c.r, lang: L.tag, label: secLabel(s),
              snip: c.t.slice(Math.max(0, at - 30), at + t.length + 60), at: Math.min(at, 30), len: t.length });
            if (hitList.length >= 60) break outer;
          }
        }
      }
    }
    hits.innerHTML = hitList.length
      ? hitList.map((h, i) => {
          const a = esc(h.snip.slice(0, h.at)), b = esc(h.snip.slice(h.at, h.at + h.len)),
                c = esc(h.snip.slice(h.at + h.len));
          return `<div class="hit" data-i="${i}"><b>${esc(h.label)} ${h.lang} ${h.r + 1}</b>…${a}<mark>${b}</mark>${c}…</div>`;
        }).join("")
      : `<div class="hit">${esc(T().noHit)}</div>`;
    hits.hidden = false;
  }
  q.oninput = search;
  q.onfocus = () => { if (hitList.length) hits.hidden = false; };
  hits.onclick = (e) => {
    const el = e.target.closest(".hit"); if (!el || !el.dataset.i) return;
    const h = hitList[+el.dataset.i];
    hits.hidden = true;
    if (h.si !== idx) { want = h.r + 1; go(h.si); }
    cur = h.r; mark();
    showCur();
  };
  addEventListener("click", (e) => {
    if (!e.target.closest("#hits") && e.target !== q) hits.hidden = true;
  });

  addEventListener("keydown", (e) => {
    if (e.target === q) { if (e.key === "Escape") { q.blur(); hits.hidden = true; } return; }
    if (e.key === "/") {           // バーをたたんでいても探せるように、まず開く
      e.preventDefault();
      if (!tools) { tools = true; store.set("tools", tools); paint(); }
      q.focus(); q.select(); return;
    }
    if (e.target.tagName === "SELECT") return;
    const k = e.key;
    if (k === "ArrowDown") { e.preventDefault(); move(1); }
    else if (k === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (k === "ArrowRight") go(idx + 1);
    else if (k === "ArrowLeft") go(idx - 1);
    else if (k === "Home") { cur = -1; mark(); scrollTo({ top: 0 }); }
  });

  matchMedia("(max-width:760px)").addEventListener("change", () => {
    stacked = readLayout();
    paint();
  });

  paint();
  if (want) { cur = want - 1; want = 0; mark(); showCur(); }
})();
</script>
</body>
</html>
