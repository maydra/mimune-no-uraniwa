<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>5. 復帰摂理から見た第二次世界大戦の原因　① 三大祝福復帰の長成的な蕩減条件</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="35" y="39" font-size="29">5.</text>
    <text x="72" y="39" font-size="29" textLength="525" lengthAdjust="spacing">復帰摂理から見た第二次世界大戦の原因</text>
    <text x="64" y="80" font-size="25">①</text>
    <text x="98" y="80" font-size="26" textLength="393" lengthAdjust="spacing">三大祝福復帰の長成的な蕩減条件</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="71" y1="57" x2="598" y2="57"/>
    <line x1="97" y1="96.5" x2="491" y2="96.5"/>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="221.5,190 228.5,190 228.5,246 233.5,246 225,259.5 216.5,246 221.5,246"/>
    <polygon points="568.5,188 575.5,188 575.5,243 580,243 572,255.5 564,243 568.5,243"/>
    <polygon points="506,216 289,216 289,210.5 272.5,219.5 289,228.5 289,223 506,223"/>
  </g>

  <!-- 神とサ -->
  <circle cx="225" cy="153.5" r="36" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="572" cy="151" r="35.5" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="34" text-anchor="middle" dominant-baseline="central">
    <text x="224" y="153">神</text>
    <text x="572.5" y="151.5" fill="#fff">サ</text>
  </g>

  <g font-size="24" text-anchor="middle" dominant-baseline="central">
    <text x="177" y="222.5" textLength="75" lengthAdjust="spacing">イエス</text>
    <text x="393" y="195" font-size="26" textLength="55" lengthAdjust="spacing">復帰</text>
    <text x="393.5" y="244.5" font-size="25" textLength="182" lengthAdjust="spacing">長成的蕩減条件</text>
  </g>
  <g font-size="22" dominant-baseline="central">
    <text x="590" y="205" textLength="92" lengthAdjust="spacing">イエス型</text>
    <text x="590" y="233" textLength="45" lengthAdjust="spacing">人物</text>
  </g>

  <!-- 三大祝福の楕円 -->
  <ellipse cx="226.5" cy="307.5" rx="81" ry="41" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="572.5" cy="307.5" rx="88" ry="45" fill="#CF921C" stroke="currentColor" stroke-width="2.5"/>
  <text x="227" y="308" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="123" lengthAdjust="spacing">三大祝福</text>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="572" y="292" font-size="25" textLength="128" lengthAdjust="spacing">三大祝福の</text>
    <text x="572.5" y="324" font-size="23" textLength="139" lengthAdjust="spacing">長成級完成型</text>
  </g>

  <!-- 点線 -->
  <line x1="393" y1="265" x2="393" y2="355" stroke="currentColor" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- 第二次世界大戦 -->
  <rect x="267.5" y="361.5" width="252.5" height="43.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="394" y="383" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="219" lengthAdjust="spacing" fill="#111">第二次世界大戦</text>
</svg>
