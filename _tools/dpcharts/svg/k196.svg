<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アブラハムの「象徴献祭」の失敗による蕩減路程</title>

  <text y="38.5" font-size="27" dominant-baseline="central"><tspan x="37" textLength="156" lengthAdjust="spacing">アブラハムの</tspan><tspan x="200.8">「</tspan><tspan x="213" textLength="106" lengthAdjust="spacing">象徴献祭</tspan><tspan x="318.4">」</tspan><tspan x="338" textLength="265" lengthAdjust="spacing">の失敗による蕩減路程</tspan></text>
  <line x1="35" y1="57.5" x2="603" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- イサク → ヤコブ → ヤコブの家庭 -->
  <g fill="#8C949A">
    <polygon points="189.5,154 197.5,154 197.5,180.5 204,180.5 193.5,198.5 183,180.5 189.5,180.5"/>
    <polygon points="181.5,275 205,275 205,293.5 214.5,293.5 193,306.5 171.5,293.5 181.5,293.5"/>
  </g>
  <g stroke="currentColor" stroke-width="2.8" fill="#F8F28F">
    <ellipse cx="196" cy="119.75" rx="60" ry="27.75"/>
    <ellipse cx="193" cy="232.5" rx="60" ry="27.5"/>
    <ellipse cx="192" cy="353.75" rx="73" ry="31.25"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="195" y="120" font-size="28" textLength="81" lengthAdjust="spacing">イサク</text>
    <text x="192" y="232.5" font-size="28" textLength="81" lengthAdjust="spacing">ヤコブ</text>
    <text x="192.5" y="354" font-size="22" textLength="131" lengthAdjust="spacing">ヤコブの家庭</text>
  </g>

  <!-- ヤコブの説明 -->
  <circle cx="267.5" cy="205" r="6.8"/>
  <circle cx="267.5" cy="256.5" r="6.8"/>
  <g font-size="26" dominant-baseline="central">
    <text y="206"><tspan x="280.9">「</tspan><tspan x="294" textLength="103" lengthAdjust="spacing">実体献祭</tspan><tspan x="397.4">」</tspan><tspan x="426" textLength="77" lengthAdjust="spacing">の中心</tspan></text>
    <text x="516.5" y="206" text-anchor="middle">：</text>
    <text x="531" y="206" textLength="155" lengthAdjust="spacing">アベル型人物</text>
    <text x="281" y="256" textLength="261" lengthAdjust="spacing">サタン分立の典型路程</text>
  </g>

  <!-- ヤコブの家庭の説明 -->
  <g font-size="26" dominant-baseline="central">
    <text x="280.5" y="334.5" textLength="38.5" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="326" y="334.5" textLength="131" lengthAdjust="spacing">年蕩減路程</text>
    <text x="470.5" y="334.5" text-anchor="middle">：</text>
    <text x="281" y="376.5" textLength="366" lengthAdjust="spacing">イサクの家庭と同じ立場で出発</text>
  </g>
</svg>
