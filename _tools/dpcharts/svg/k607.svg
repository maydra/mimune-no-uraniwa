<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>摂理の典型路程　キリスト教史：復帰摂理延長時代の中心的史料</title>

  <!-- 十字架とイエス -->
  <!-- この図の十字架は型より太く横木が高いので、元の形に合わせて描いた（色は型と同じ） -->
  <path d="M173.5,114 H197.5 V132 H218 V153 H197.5 V271 H173.5 V153 H153 V132 H173.5 Z" fill="#7A5230" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="185" cy="213" rx="56.7" ry="28.2" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="185" y="213" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="92" lengthAdjust="spacing" fill="#111">イエス</text>
  <polygon points="248,209.5 306,209.5 306,204.5 321,212.5 306,220.5 306,215.5 248,215.5" fill="#8C949A"/>

  <!-- 西欧・西ローマ・ユダヤ -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="499.5" cy="213" rx="177.2" ry="66.7" fill="#FCE5E3"/>
    <!-- 内側の楕円の縁は面の上なので #111 -->
    <ellipse cx="453" cy="213" rx="129.8" ry="47.2" fill="#FCE5E3" stroke="#111"/>
    <ellipse cx="386.5" cy="213" rx="63.2" ry="26.7" fill="#CF921C" stroke="#111"/>
  </g>
  <g fill="#8C949A">
    <polygon points="427,211.5 452,211.5 452,205.5 466,213.5 452,221.5 452,215.5 427,215.5"/>
    <polygon points="557,209.5 580,209.5 580,205 594,213 580,221 580,216.5 557,216.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="378.5" y="212.5" font-size="28" textLength="85" lengthAdjust="spacing">ユダヤ</text>
    <text x="511.5" y="213.5" font-size="25" textLength="80" lengthAdjust="spacingAndGlyphs">西ローマ</text>
    <text x="631.5" y="213.5" font-size="28" textLength="57" lengthAdjust="spacing">西欧</text>
  </g>

  <!-- 点線（面の中は #111） -->
  <g fill="none" stroke-width="3.2" stroke-dasharray="4.5 3.2">
    <line x1="381.5" y1="106" x2="381.5" y2="162" stroke="currentColor"/>
    <line x1="381.5" y1="162" x2="381.5" y2="196" stroke="#111" stroke-dashoffset="56"/>
    <line x1="508.5" y1="106" x2="508.5" y2="145.5" stroke="currentColor"/>
    <line x1="508.5" y1="145.5" x2="508.5" y2="187" stroke="#111" stroke-dashoffset="39.5"/>
    <line x1="630.5" y1="233" x2="630.5" y2="260" stroke="#111"/>
    <line x1="630.5" y1="260" x2="630.5" y2="287" stroke="currentColor" stroke-dashoffset="27"/>
  </g>
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="380" y="85.5" text-anchor="middle" textLength="51" lengthAdjust="spacing">滅亡</text>
    <text x="482" y="85" textLength="51" lengthAdjust="spacing">敗亡</text>
    <text x="541" y="85" textLength="89" lengthAdjust="spacing">(AD 476)</text>
  </g>
  <text x="452" y="310.5" font-size="31" dominant-baseline="central" textLength="220" lengthAdjust="spacing">摂理の典型路程</text>

  <!-- 結論の箱 -->
  <rect x="122.5" y="355.5" width="577" height="45" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="138" y="377" textLength="154" lengthAdjust="spacing">キリスト教史</text>
    <text x="304.5" y="377" text-anchor="middle">：</text>
    <text x="318" y="377" textLength="365" lengthAdjust="spacing">復帰摂理延長時代の中心的史料</text>
  </g>
</svg>
