<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅵ. 十字架の死が必然的なもののように記録されている聖句（マタイ16:23）</title>

  <text x="57" y="60" font-size="48" dominant-baseline="central">Ⅵ.</text>
  <text x="139" y="59" font-size="46" dominant-baseline="central" textLength="1109" lengthAdjust="spacingAndGlyphs">十字架の死が必然的なもののように記録されている聖句</text>
  <line x1="138" y1="89.5" x2="1251" y2="89.5" stroke="currentColor" stroke-width="4"/>

  <text y="208" font-size="40" dominant-baseline="central"><tspan x="206.5" textLength="117" lengthAdjust="spacingAndGlyphs">マタイ</tspan> <tspan x="340" textLength="100" lengthAdjust="spacing">16:23</tspan></text>

  <!-- イエスとペテロのあいだの矢印 -->
  <g fill="#8C949A">
    <polygon points="349.5,475 358.5,475 358.5,373.5 367.5,373.5 354,351.5 340.5,373.5 349.5,373.5"/>
    <polygon points="386.5,340 396.5,340 396.5,441 405.5,441 391.5,463 377.5,441 386.5,441"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="374" cy="298.25" rx="105" ry="48.25" fill="#F8F28F"/>
    <ellipse cx="372.25" cy="516" rx="104.75" ry="48" fill="#CF921C"/>
  </g>
  <g font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="374" y="298" textLength="145" lengthAdjust="spacing">イエス</text>
    <text x="370.5" y="516.5" textLength="144" lengthAdjust="spacing">ペテロ</text>
  </g>

  <!-- …『サタンよ、引き下がれ』 -->
  <g>
    <circle cx="507" cy="298" r="4.5"/>
    <circle cx="524" cy="298" r="4.5"/>
    <circle cx="540" cy="298" r="4.5"/>
  </g>
  <text y="297.5" font-size="44" font-weight="400" dominant-baseline="central"><tspan x="587" text-anchor="end">『</tspan><tspan x="585.6" textLength="183.2" lengthAdjust="spacing">サタンよ</tspan><tspan x="771">、</tspan><tspan x="814.4" textLength="229" lengthAdjust="spacing">引き下がれ</tspan><tspan x="1045">』</tspan></text>

  <g dominant-baseline="central">
    <text x="198" y="408.5" font-size="42" textLength="132" lengthAdjust="spacing">止める</text>
    <text x="419" y="379" font-size="40" textLength="162" lengthAdjust="spacing">十字架の</text>
    <text x="418.5" y="432" font-size="40" textLength="81" lengthAdjust="spacing">預言</text>
  </g>

  <!-- 十字架による霊的救いの摂理妨害 -->
  <rect x="577" y="434.5" width="512" height="148" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="48" dominant-baseline="central" fill="#111">
    <text x="608" y="482.5" textLength="293" lengthAdjust="spacing">十字架による</text>
    <text x="610" y="537" textLength="448" lengthAdjust="spacing">霊的救いの摂理妨害</text>
  </g>
</svg>
