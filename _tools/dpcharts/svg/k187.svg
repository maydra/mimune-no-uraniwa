<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヤコブがアベルの立場を蕩減復帰するための摂理　①個人的に長子の嗣業を復帰</title>

  <text x="36" y="34.5" font-size="30" dominant-baseline="central" textLength="574" lengthAdjust="spacingAndGlyphs">ヤコブがアベルの立場を蕩減復帰するための摂理</text>
  <line x1="35" y1="54" x2="610" y2="54" stroke="currentColor" stroke-width="2.2"/>
  <text x="171.5" y="89.5" font-size="29" text-anchor="middle" dominant-baseline="central">①</text>
  <text x="190" y="90" font-size="29" dominant-baseline="central" textLength="346" lengthAdjust="spacingAndGlyphs">個人的に長子の嗣業を復帰</text>

  <!-- 神・サからの線（円と楕円の下に描く） -->
  <g fill="#8C949A">
    <rect x="247.5" y="185" width="7" height="75"/>
    <rect x="564.5" y="185" width="7" height="75"/>
  </g>

  <!-- ヤコブとエサウの間の矢印 -->
  <g>
    <polygon points="321,269.5 490,269.5 490,265.5 501.5,272.5 490,279.5 490,275.5 321,275.5"/>
    <polygon points="497.5,284.5 327.5,284.5 327.5,280.5 316,287 327.5,293.5 327.5,289.5 497.5,289.5"/>
  </g>

  <circle cx="251" cy="156" r="36" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <circle cx="568.5" cy="155.5" r="37" fill="#50403D" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="39" text-anchor="middle" dominant-baseline="central">
    <text x="249.5" y="156">神</text>
    <text x="569" y="156" font-size="37" fill="#fff">サ</text>
  </g>

  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="250.5" cy="280" rx="59.5" ry="28.5" fill="#F8F28F"/>
    <ellipse cx="568.5" cy="279.5" rx="59.5" ry="29" fill="#F86D42"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="252" y="279" textLength="77" lengthAdjust="spacingAndGlyphs">ヤコブ</text>
    <text x="568" y="279" textLength="81" lengthAdjust="spacing">エサウ</text>
  </g>

  <g font-size="25" dominant-baseline="central">
    <text x="129" y="221.5" textLength="111" lengthAdjust="spacingAndGlyphs">次子の立場</text>
    <text x="577" y="218.5" textLength="110" lengthAdjust="spacingAndGlyphs">長子の立場</text>
    <text x="307" y="218.5" textLength="197" lengthAdjust="spacingAndGlyphs">パンとレンズ豆の</text>
    <text x="357" y="250" textLength="97" lengthAdjust="spacingAndGlyphs">あつもの</text>
    <text x="338" y="313" font-size="26" textLength="130" lengthAdjust="spacingAndGlyphs">長子の嗣業</text>
    <text x="351" y="340.5" font-size="22" font-weight="400" textLength="105" lengthAdjust="spacingAndGlyphs">(創 25:34)</text>
  </g>

  <text y="390.5" font-size="30" dominant-baseline="central"><tspan x="175" textLength="315" lengthAdjust="spacingAndGlyphs">神はイサクに祝福させる</tspan><tspan x="500" font-size="27" font-weight="400" textLength="128" lengthAdjust="spacingAndGlyphs">(創 27:27)</tspan></text>
</svg>
