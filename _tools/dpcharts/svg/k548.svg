<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>士師時代と教区長制キリスト教会時代　士師：イスラエル指導、教区長：キリスト教信徒指導</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="127.5" y="72" width="276" height="54" rx="6"/>
    <rect x="414" y="72" width="276" height="54" rx="6"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="203.1" y="99" font-size="31" textLength="125.7" lengthAdjust="spacing">士師時代</text>
    <text x="421.3" y="99" font-size="28" textLength="86.4" lengthAdjust="spacingAndGlyphs">教区長制</text>
    <text x="508.3" y="99" font-size="28" textLength="82.4" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="592.3" y="99" font-size="28" textLength="87.4" lengthAdjust="spacingAndGlyphs">教会時代</text>
  </g>
  <!-- 白い枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="127.5" y="135" width="276" height="224" rx="8"/>
    <rect x="414" y="135" width="276" height="224" rx="8"/>
  </g>
  <!-- 左：士師時代 -->
  <g dominant-baseline="central">
    <text x="149" y="157.5" font-size="27" text-anchor="middle">①</text>
    <text x="155.3" y="196.5" font-size="28" textLength="57.4" lengthAdjust="spacing">士師</text>
    <text x="227" y="196.5" font-size="28" text-anchor="middle">：</text>
    <text x="182.3" y="238.5" font-size="28" textLength="143.4" lengthAdjust="spacing">イスラエル</text>
    <text x="326.3" y="238.5" font-size="28" textLength="57.4" lengthAdjust="spacing">指導</text>
  </g>
  <!-- 右：教区長制キリスト教会時代 -->
  <g dominant-baseline="central">
    <text x="435.5" y="157.5" font-size="27" text-anchor="middle">②</text>
    <text x="439.3" y="197" font-size="28" textLength="85.4" lengthAdjust="spacing">教区長</text>
    <text x="539.5" y="197" font-size="28" text-anchor="middle">：</text>
    <text x="466.3" y="236.5" font-size="28" textLength="110.4" lengthAdjust="spacing">キリスト</text>
    <text x="581.3" y="236.5" font-size="28" textLength="85.4" lengthAdjust="spacing">教信徒</text>
    <text x="468.3" y="276" font-size="28" textLength="56.4" lengthAdjust="spacing">指導</text>
  </g>
</svg>
