<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>摂理的同時性の時代の形成</title>

  <text x="34" y="37.5" font-size="30" dominant-baseline="central" textLength="377" lengthAdjust="spacing">摂理的同時性の時代の形成</text>
  <line x1="33" y1="56.2" x2="411" y2="56.2" stroke="currentColor" stroke-width="2.4"/>

  <!-- 灰色の線と矢印（楕円の下に描く） -->
  <line x1="200" y1="152" x2="200" y2="174" stroke="#8C949A" stroke-width="7"/>
  <polygon points="196.5,229 203.5,229 203.5,251.5 208.5,251.5 200,265.5 191.5,251.5 196.5,251.5" fill="#8C949A"/>

  <!-- 「メシヤのための基台」復帰摂理路程 -->
  <rect x="144.5" y="103.5" width="499" height="48" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text y="127" font-size="27" dominant-baseline="central"><tspan x="157">「</tspan><tspan x="172" textLength="258" lengthAdjust="spacing">メシヤのための基台</tspan><tspan x="430">」</tspan><tspan x="459" textLength="174" lengthAdjust="spacing">復帰摂理路程</tspan></text>

  <!-- 中心人物・代わりの人物 -->
  <g stroke="currentColor" stroke-width="3" fill="#F8F28F">
    <ellipse cx="200.5" cy="202" rx="60" ry="28.5"/>
    <ellipse cx="200.5" cy="296.5" rx="94" ry="29"/>
  </g>
  <g font-size="25" dominant-baseline="central" fill="#111">
    <text x="151" y="202" textLength="98" lengthAdjust="spacing">中心人物</text>
    <text x="125" y="295.5" textLength="149" lengthAdjust="spacing">代わりの人物</text>
  </g>

  <!-- 右の説明 -->
  <g font-size="26" dominant-baseline="central">
    <text x="308" y="202" text-anchor="middle">：</text>
    <text x="320" y="202" textLength="133" lengthAdjust="spacing">果たさない</text>
    <text x="504" y="202" textLength="105" lengthAdjust="spacing">その時代</text>
    <text x="621" y="202" textLength="78" lengthAdjust="spacing">終わる</text>
    <text x="308" y="295.5" text-anchor="middle">：</text>
    <text x="320" y="295.5" textLength="137" lengthAdjust="spacing">新しい時代</text>
    <text x="512" y="295.5" textLength="110" lengthAdjust="spacing">同じ路程</text>
    <text x="635" y="295.5" textLength="55" lengthAdjust="spacing">反復</text>
  </g>
  <g fill="#8C949A">
    <polygon points="462,198.5 481.5,198.5 481.5,193.5 494.5,202 481.5,210.5 481.5,205.5 462,205.5"/>
    <polygon points="469,291 488.5,291 488.5,286 501.5,294.5 488.5,303 488.5,298 469,298"/>
    <polygon points="455,322 470,322 470,336 480,336 462.5,351 445,336 455,336"/>
  </g>

  <!-- 摂理的同時性の時代 -->
  <rect x="319.5" y="360.5" width="287" height="48" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="332" y="383" font-size="27" dominant-baseline="central" fill="#111" textLength="260" lengthAdjust="spacing">摂理的同時性の時代</text>
</svg>
