  <circle cx="949" cy="302.75" r="22.6" fill="none" stroke="#111" stroke-width="3"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="986.5" y="88.5" font-size="36">指導者</text>
    <text x="946" y="303.5" font-size="33">イ</text>
    <text x="1010" y="303.5" font-size="33">弟子</text>
    <text x="986.5" y="507" font-size="40">選民</text>
  </g>
  <g font-size="38" text-anchor="middle" dominant-baseline="central">
    <text x="779" y="87">果たす</text>
    <text x="779" y="305">果たす</text>
    <text x="779" y="507">果たす</text>
  </g>

  <!-- 果たせなかったとき -->
  <circle cx="749.5" cy="606.75" r="28" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="832" y="193.5" font-size="38" textLength="211" lengthAdjust="spacingAndGlyphs">盤石二度打つ</text>
    <text x="1064" y="194" font-size="40">死ぬ</text>
    <text x="780.5" y="407.5" font-size="38" textLength="106" lengthAdjust="spacingAndGlyphs">できない</text>
    <text x="987" y="409.5" font-size="40">反逆者</text>
    <text x="747.5" y="607" font-size="41">イ</text>
    <text x="862" y="607.5" font-size="38">を十字架</text>
    <text x="1064.5" y="605" font-size="40">衰退</text>
  </g>
</svg>
