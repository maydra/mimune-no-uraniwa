<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人間をどの程度にまで予定なさるのだろうか</title>

  <text x="53" y="67" font-size="48" dominant-baseline="central" textLength="888" lengthAdjust="spacingAndGlyphs">人間をどの程度にまで予定なさるのだろうか</text>
  <line x1="51" y1="97.5" x2="942" y2="97.5" stroke="currentColor" stroke-width="4"/>

  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="388.5" y="163" textLength="368" lengthAdjust="spacing">人間責任分担完遂</text>
    <text x="594" y="162.5">：</text>
    <text x="732" y="163" textLength="228" lengthAdjust="spacing">必須的要件</text>
  </g>

  <!-- 灰色の矢印（楕円と箱の下に描く） -->
  <g fill="#8C949A">
    <polygon points="362,350.5 403.5,350.5 403.5,339.5 432.5,356 403.5,372.5 403.5,361.5 362,361.5"/>
    <polygon points="810,350.5 859.5,350.5 859.5,339.5 888.5,356 859.5,372.5 859.5,361.5 810,361.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="281" cy="355" rx="88.25" ry="66.25" fill="#FCE5E3"/>
    <ellipse cx="1000.5" cy="351.5" rx="109.75" ry="68.75" fill="#FCE5E3"/>
    <rect x="437.25" y="273.25" width="376.5" height="159.5" rx="10" fill="#fff" class="paper"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="280.5" y="354" font-size="49.5">人物</text>
    <text x="1000.5" y="351" font-size="45.5">使命者</text>
  </g>

  <!-- 箱：神の責任分担＋人間の責任分担（丸囲みの字は円と字に分ける） -->
  <g fill="none" stroke="currentColor" stroke-width="3.5">
    <circle cx="526.5" cy="310.5" r="28.25"/>
    <circle cx="524" cy="395.5" r="28.25"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" font-size="36" font-weight="400">
    <text x="526" y="310.5">神</text>
    <text x="525" y="393">人</text>
  </g>
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="658.5" y="310" textLength="184" lengthAdjust="spacing">責任分担</text>
    <text x="658.5" y="396" textLength="184" lengthAdjust="spacing">責任分担</text>
  </g>
  <!-- ＋ -->
  <rect x="643" y="353" width="30" height="6"/>
  <rect x="655" y="341" width="6" height="30"/>

  <rect x="294" y="508" width="673" height="91" rx="16" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="49" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="532.5" y="553" textLength="400" lengthAdjust="spacing">人間に対する予定</text>
    <text x="757.5" y="553">：</text>
    <text x="856.5" y="553" textLength="150" lengthAdjust="spacing">相対的</text>
  </g>
</svg>
