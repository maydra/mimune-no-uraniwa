    <polygon points="641.9,133.5 696.4,102.2 700.3,108.9 710.3,88.2 687.3,86.4 691.2,93.2 636.7,124.5"/>
    <polygon points="640.1,151.9 695.9,184.7 691.9,191.5 714.9,189.9 705.1,169.1 701.2,175.8 645.3,142.9"/>
    <polygon points="640.2,352.6 694.9,319.6 698.9,326.3 708.5,305.4 685.5,304.1 689.5,310.7 634.8,343.6"/>
    <polygon points="638.5,371.4 692.6,403.2 688.6,409.9 711.6,408.3 701.8,387.5 697.8,394.2 643.7,362.4"/>
    <polygon points="642.2,551.4 696.9,518.9 700.9,525.6 710.6,504.7 687.6,503.2 691.6,509.9 636.8,542.4"/>
    <polygon points="636.7,570 691.7,602.1 687.7,608.8 710.7,607.2 700.8,586.4 696.9,593.1 641.9,561"/>
    <polygon points="847,81 883,81 883,73 904,85.5 883,98 883,90 847,90"/>
    <polygon points="955,191 988,191 988,183 1009,195.5 988,208 988,200 955,200"/>
    <polygon points="847,299 882,299 882,291 903,303.5 882,316 882,308 847,308"/>
    <polygon points="847,404.5 882,404.5 882,396.5 903,409 882,421.5 882,413.5 847,413.5"/>
    <polygon points="847,502 882,502 882,494 903,506.5 882,519 882,511 847,511"/>
    <polygon points="951,602 985,602 985,594 1007,606.5 985,619 985,611 951,611"/>
  </g>

  <!-- 果たせなかった道の印（十） -->
  <g stroke="currentColor" stroke-width="7">
    <line x1="669" y1="139" x2="673" y2="185"/>
    <line x1="647" y1="164.6" x2="695" y2="160.3"/>
    <line x1="666.5" y1="359" x2="670" y2="405"/>
    <line x1="645" y1="384.5" x2="692" y2="379.5"/>
    <line x1="666" y1="558" x2="669.5" y2="604"/>
    <line x1="644" y1="583.5" x2="691" y2="579.5"/>
  </g>

  <!-- 人物の楕円 -->
  <g stroke="currentColor" stroke-width="4.5" fill="#FCE5E3">
    <ellipse cx="285" cy="138" rx="86.5" ry="55.5"/>
    <ellipse cx="286.5" cy="351.5" rx="86.5" ry="55.5"/>
    <ellipse cx="281.25" cy="558" rx="86.5" ry="55.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="285" y="137.5" font-size="40">モーセ</text>
    <text x="286.5" y="339.5" font-size="29" textLength="150" lengthAdjust="spacingAndGlyphs">イスカリオテ</text>
    <text x="287" y="377.5" font-size="29">のユダ</text>
    <text x="281.5" y="557.5" font-size="37">ユダヤ人</text>
  </g>

  <!-- 責任分担 -->
  <g stroke="currentColor" stroke-width="4.5" fill="#fff" class="paper">
    <rect x="444.5" y="102" width="177.5" height="72"/>
    <rect x="444.5" y="319.5" width="177.5" height="71.5"/>
    <rect x="444.5" y="520" width="177.5" height="72"/>
  </g>
  <g font-size="37" text-anchor="middle" dominant-baseline="central">
    <text x="533.5" y="138.5">責任分担</text>
    <text x="533.5" y="355.5">責任分担</text>
    <text x="533.5" y="556.5">責任分担</text>
  </g>

  <!-- 果たしたとき -->
  <g stroke="currentColor" stroke-width="4.5" fill="#F8F28F">
    <ellipse cx="987" cy="88.5" rx="72" ry="45"/>
    <ellipse cx="987" cy="303.25" rx="72" ry="45"/>
    <ellipse cx="987" cy="506" rx="72" ry="45"/>
