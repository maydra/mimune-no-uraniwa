<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第一次路程において不信に陥らなかったならば？</title>

  <!-- 題 -->
  <text x="35" y="37.5" font-size="30" dominant-baseline="central" textLength="583" lengthAdjust="spacing">第一次路程において不信に陥らなかったならば？</text>
  <line x1="34" y1="56.5" x2="617" y2="56.5" stroke="currentColor" stroke-width="2.4"/>

  <!-- モーセ -->
  <circle cx="192" cy="187.5" r="47.25" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="190.5" y="186" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="76" lengthAdjust="spacing" fill="#111">モーセ</text>

  <!-- 灰色の括弧 -->
  <g fill="#8C949A">
    <rect x="248.5" y="121.5" width="5" height="125"/>
    <rect x="248.5" y="121.5" width="23" height="6"/>
    <rect x="248.5" y="182.5" width="23" height="6"/>
    <rect x="248.5" y="241.5" width="23" height="5"/>
  </g>

  <g font-size="30" dominant-baseline="central">
    <text x="280" y="125.5" textLength="62" lengthAdjust="spacing">家庭</text>
    <text x="357" y="125.5" text-anchor="middle">：</text>
    <text x="374" y="125.5" textLength="62" lengthAdjust="spacing">幕屋</text>
    <text x="280" y="184" textLength="62" lengthAdjust="spacing">自身</text>
    <text x="357" y="184" text-anchor="middle">：</text>
    <text x="374" y="184" textLength="220" lengthAdjust="spacing">石板と契約の箱</text>
    <text x="280" y="243.5" textLength="62" lengthAdjust="spacing">家法</text>
    <text x="357" y="243.5" text-anchor="middle">：</text>
    <text x="374" y="243.5" textLength="62" lengthAdjust="spacing">天法</text>
  </g>

  <g font-size="30" dominant-baseline="central">
    <text y="336.5"><tspan x="156" textLength="62" lengthAdjust="spacing">石板</tspan><tspan x="234.5" text-anchor="middle">・</tspan><tspan x="251" textLength="62" lengthAdjust="spacing">幕屋</tspan><tspan x="329.5" text-anchor="middle">・</tspan><tspan x="346" textLength="124" lengthAdjust="spacing">契約の箱</tspan></text>
    <text x="487" y="336.5" text-anchor="middle">：</text>
    <text x="504" y="336.5" textLength="153" lengthAdjust="spacing">民族を救う</text>
    <text x="505" y="376.5" textLength="156" lengthAdjust="spacing">ための方便</text>
  </g>
</svg>
