<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヨシュアを中心とする実体基台　エリコ城偵察</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="182.5,86 190.5,99.5 185.5,99.5 185.5,126 179.5,126 179.5,99.5 174.5,99.5"/>
    <polygon points="238,198 251,190.5 251,195 546,195 546,201 251,201 251,205.5"/>
    <polygon points="398.5,362 408.5,362 408.5,372.5 418.5,372.5 403,383.5 387.5,372.5 398.5,372.5"/>
  </g>

  <!-- 神 -->
  <circle cx="184" cy="52" r="30" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="184" y="52" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- モーセ・ヨシュア・内的イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="182.5" cy="147" rx="51" ry="23.5" fill="#F8F28F"/>
    <ellipse cx="182.5" cy="198" rx="51" ry="23.5" fill="#F8F28F"/>
    <ellipse cx="614" cy="196" rx="69" ry="48.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="26">
      <text x="183" y="148" textLength="78" lengthAdjust="spacing">モーセ</text>
      <text x="183" y="199" textLength="88" lengthAdjust="spacing">ヨシュア</text>
    </g>
    <g font-size="24">
      <text x="615.5" y="171" textLength="50" lengthAdjust="spacing">内的</text>
      <text x="616" y="196.5" textLength="118" lengthAdjust="spacing">イスラエル</text>
      <text x="615.5" y="225" textLength="50" lengthAdjust="spacing">民族</text>
    </g>
  </g>

  <!-- 実体基台 -->
  <rect x="319" y="142" width="137" height="43" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="387.5" y="164" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="113" lengthAdjust="spacing">実体基台</text>

  <!-- 出発のための摂理：○ -->
  <rect x="233" y="231" width="319" height="44" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="250" y="254" textLength="229" lengthAdjust="spacing">出発のための摂理</text>
    <text x="494" y="254" text-anchor="middle">：</text>
  </g>
  <circle cx="522.5" cy="254" r="11" fill="none" stroke="#111" stroke-width="3.2"/>

  <!-- エリコ城偵察 -->
  <circle cx="208.5" cy="306.5" r="7"/>
  <g font-size="24" dominant-baseline="central">
    <text x="222" y="305" textLength="140" lengthAdjust="spacing">エリコ城偵察</text>
    <text x="375.5" y="305" text-anchor="middle">：</text>
    <text x="387" y="305" textLength="189" lengthAdjust="spacing">信仰をもって報告</text>
    <text x="387" y="336.5" textLength="188" lengthAdjust="spacing">イスラエルの子孫</text>
    <text x="587" y="336.5" textLength="69" lengthAdjust="spacing">信じる</text>
    <text x="222" y="404" textLength="236" lengthAdjust="spacing">二次路程の先祖の立場</text>
    <text x="470" y="404" textLength="47" lengthAdjust="spacing">復帰</text>
  </g>
</svg>
