<title>🔮 ランダムページに移動中...</title>
<link href="../theme/style.css?v=202610282236" rel="stylesheet"/>
<style>
body {
  font-family: "Hiragino Mincho ProN", "BIZ UDPMincho", "Yu Mincho", YuMincho, "Noto Serif CJK JP", "Noto Serif JP", serif;
  background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  min-height: 100vh;
  color: #e0e0e0;
  padding: 4rem 1rem;
  text-align: center;
}
h1 { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 900; }
</style>

<body class="dark-mode" data-pagefind-ignore>
<script id="theme-boot">(function(){try{var c=document.body.classList,t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';c.remove('light-mode','dark-mode');c.add(t+'-mode');var f=localStorage.getItem('reader.font');if(f)document.documentElement.style.fontSize=f}catch(e){}})()</script>
<div class="container">
<h1>🔮 ランダムなページを選んでいます…</h1>
</div>
<script>
  const wantRandomScroll = true;
  const currentDir = location.pathname.replace(/\/[^/]*$/, "/");

  fetch(currentDir + "pages.json")
    .then(res => res.json())
    .then(pages => {
      const randomPage = pages[Math.floor(Math.random() * pages.length)];
      location.href = currentDir + randomPage + (wantRandomScroll ? "?randomScroll=true" : "");
    })
    .catch(err => {
      console.error("ページ取得失敗:", err);
      document.body.innerHTML += "<p style='color:red;'>ページ取得に失敗しました。</p>";
    });
</script>
<script src="../theme/script.js?v=202610282236"></script>
</body>
