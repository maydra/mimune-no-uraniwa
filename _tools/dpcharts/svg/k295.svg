<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>紅海とシンの荒野</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="211.5,36 218.5,36 218.5,108.5 222.5,108.5 215,121.5 207.5,108.5 211.5,108.5"/>
    <polygon points="211.5,173 218.5,173 218.5,272.5 222.5,272.5 215,284.5 207.5,272.5 211.5,272.5"/>
    <polygon points="211.5,336 218.5,336 218.5,399.5 222.5,399.5 215,411.5 207.5,399.5 211.5,399.5"/>
    <polygon points="506,95 522,95 522,87.5 537,99.5 522,111.5 522,104 506,104"/>
    <polygon points="507,195.5 522,195.5 522,188 538,199.5 522,211 522,203.5 507,203.5"/>
    <polygon points="506,303 523,303 523,296 539,307.5 523,319 523,312 506,312"/>
  </g>

  <!-- 紅海・シンの荒野 -->
  <g fill="#DCC4C4" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="215.5" cy="148" rx="78.5" ry="25"/>
    <ellipse cx="216" cy="311" rx="78" ry="25"/>
  </g>
  <text y="147.5" font-size="31" dominant-baseline="central" fill="#111"><tspan x="175.5">紅</tspan><tspan x="222.5">海</tspan></text>
  <text x="216" y="311.5" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="128" lengthAdjust="spacing" fill="#111">シンの荒野</text>

  <!-- 箇条 -->
  <circle cx="315" cy="78" r="7.5"/>
  <circle cx="315" cy="175.5" r="7.5"/>
  <g font-size="28" dominant-baseline="central">
    <text x="332" y="79" textLength="57" lengthAdjust="spacing">杖で</text>
    <text x="331" y="115" textLength="114" lengthAdjust="spacing">分け渡る</text>
    <text x="331" y="175" textLength="144" lengthAdjust="spacing">エジプトの</text>
    <text x="331" y="210" textLength="142" lengthAdjust="spacing">馬と戦車と</text>
    <text x="330" y="244" textLength="171" lengthAdjust="spacing">騎兵は、水葬</text>
    <text x="546" y="62.5" textLength="115" lengthAdjust="spacing">イエスが</text>
    <text x="545" y="99.5" textLength="116" lengthAdjust="spacing">鉄の杖で</text>
    <text x="545" y="136.5" textLength="144" lengthAdjust="spacing">荒海を打つ</text>
    <text x="546" y="199.5" textLength="115" lengthAdjust="spacing">サタンは</text>
    <text x="545" y="239" textLength="144" lengthAdjust="spacing">滅ぼされる</text>
  </g>
  <g font-size="30" dominant-baseline="central">
    <text x="311" y="308" textLength="185" lengthAdjust="spacing">マナとうずら</text>
    <text x="546" y="308.5" textLength="124" lengthAdjust="spacing">イエスの</text>
    <text x="547" y="345" textLength="94" lengthAdjust="spacing">肉と血</text>
  </g>
</svg>
