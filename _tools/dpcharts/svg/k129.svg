<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ノアの家庭からアダムの家庭への蕩減復帰</title>

  <!-- 線（元の線の位置。円の下に描く） -->
  <g stroke="currentColor" stroke-width="5.5" fill="none" stroke-linejoin="round">
    <path d="M171.5,248.5 L237.3,110.6 L303.1,248.5 Z"/>
    <path d="M546.5,98 V188.5"/>
    <path d="M483.5,267.5 L547.5,188 L614,267.5 Z"/>
  </g>

  <!-- 創造本然のアダムの家庭 -->
  <g stroke="currentColor" stroke-width="2.4">
    <circle cx="237.5" cy="125.5" r="29.8" fill="#fff" class="paper"/>
    <circle cx="166.5" cy="245" r="29.8" fill="#F98AEE"/>
    <circle cx="309" cy="245" r="29.8" fill="#A0F08A"/>
  </g>
  <text x="237" y="125" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="32" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="166.5" y="246">ア</text>
    <text x="309" y="246">エ</text>
  </g>
  <text x="236.5" y="224" font-size="28" text-anchor="middle" dominant-baseline="central">裸体</text>

  <!-- 蕩減復帰 -->
  <text x="405.5" y="127.5" font-size="30" text-anchor="middle" dominant-baseline="central">蕩減復帰</text>
  <polygon points="448,181.5 394,181.5 394,173.5 364,189.5 394,205.5 394,197.5 448,197.5" fill="#8C949A"/>

  <!-- ノアの家庭 -->
  <g stroke="currentColor" stroke-width="2.4">
    <circle cx="547" cy="97.5" r="28.3" fill="#fff" class="paper"/>
    <ellipse cx="547" cy="188.5" rx="59.8" ry="23.3" fill="#fff" class="paper"/>
    <ellipse cx="476.5" cy="264.5" rx="35.3" ry="29.5" fill="#F8F28F"/>
    <ellipse cx="618" cy="264.5" rx="35.5" ry="29.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="547" y="97.5" font-size="32">神</text>
    <text x="546.5" y="189.5" font-size="30">ノア</text>
    <text x="630" y="188" font-size="27">裸</text>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="475.5" y="263.5">ハム</text>
    <text x="617" y="262.5">セム</text>
  </g>

  <!-- 説明 -->
  <circle cx="128" cy="341" r="7.3"/>
  <circle cx="437" cy="341" r="7.3"/>
  <circle cx="127" cy="379" r="7.3"/>
  <circle cx="435" cy="380" r="7.3"/>
  <circle cx="160.5" cy="378.5" r="16.8" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="160.5" y="379" font-size="21" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="25" dominant-baseline="central">
    <text x="143" y="340.5" textLength="265" lengthAdjust="spacingAndGlyphs">裸体を現していた汚れない姿</text>
    <text x="454" y="340.5" textLength="207" lengthAdjust="spacingAndGlyphs">恥ずかしがらない</text>
    <text x="184" y="379.5" textLength="155" lengthAdjust="spacingAndGlyphs">の喜びの心情</text>
    <text x="455" y="379.5" textLength="206" lengthAdjust="spacingAndGlyphs">隠れようとしない</text>
  </g>
</svg>
