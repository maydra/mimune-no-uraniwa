<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>予定説に対する神学的論争　信仰生活混乱の原因</title>

  <text x="207.5" y="84" font-size="50" dominant-baseline="central" textLength="598" lengthAdjust="spacing">予定説に対する神学的論争</text>
  <polygon points="220,153 256,153 256,144 271.5,159.5 256,175 256,166 220,166" fill="#8C949A"/>
  <text x="286" y="161" font-size="46" dominant-baseline="central" textLength="415" lengthAdjust="spacing">信仰生活混乱の原因</text>

  <!-- 神の予定 → ？ -->
  <rect x="249.5" y="392.5" width="177.5" height="144.5" rx="5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="54" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="337" y="432.5">神の</text>
    <text x="337" y="495">予定</text>
  </g>
  <polygon points="472,452 541,452 541,438 571,464.5 541,491 541,477 472,477" fill="#8C949A"/>
  <text x="627" y="463.5" font-size="70" text-anchor="middle" dominant-baseline="central">？</text>

  <!-- 聖書 -->
  <rect x="682.5" y="280.5" width="419" height="345.5" rx="20" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <rect x="821" y="241" width="142" height="59" rx="9" fill="#DCC4C4" stroke="currentColor" stroke-width="4.5"/>
  <text x="889" y="270.5" font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">聖書</text>

  <g>
    <circle cx="719.5" cy="347.5" r="12"/>
    <circle cx="719.5" cy="464.5" r="12"/>
    <circle cx="719.5" cy="581.5" r="12"/>
  </g>
  <g font-size="42" dominant-baseline="central">
    <text x="744" y="348" textLength="291" lengthAdjust="spacing">人生の栄枯盛衰</text>
    <text x="1035" y="348">、</text>
    <text x="744" y="394" textLength="166.5" lengthAdjust="spacing">幸・不幸</text>
    <text x="744" y="464.5" textLength="333" lengthAdjust="spacing">堕落人間の救いの</text>
    <text x="744" y="510" textLength="125" lengthAdjust="spacing">在り方</text>
    <text x="744" y="581" textLength="291" lengthAdjust="spacing">国家の興亡盛衰</text>
  </g>
</svg>
