<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ 主権復帰の完成的な基台を造成</title>

  <!-- 題 -->
  <g font-size="27" dominant-baseline="central">
    <text x="46" y="34.5" text-anchor="middle">③</text>
    <text x="66" y="34.5" textLength="365" lengthAdjust="spacing">主権復帰の完成的な基台を造成</text>
  </g>
  <line x1="65" y1="51" x2="432" y2="51" stroke="currentColor" stroke-width="2.5"/>

  <!-- 灰色の矢印 -->
  <polygon points="266.5,180 274.5,180 274.5,285 281,285 270.5,301.5 260,285 266.5,285" fill="#8C949A"/>

  <!-- 天の側・サタン側の楕円 -->
  <ellipse cx="271" cy="143" rx="81" ry="39.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="271.5" cy="343.5" rx="81.5" ry="39.5" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="271" y="143.5" textLength="82" lengthAdjust="spacing">天の側</text>
    <text x="271.5" y="344" textLength="111" lengthAdjust="spacing" fill="#fff">サタン側</text>
  </g>

  <!-- 第三次世界大戦の箱 -->
  <rect x="122" y="200" width="128" height="72" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="186" y="220.5" textLength="74" lengthAdjust="spacing">第三次</text>
    <text x="186" y="252.5" textLength="102" lengthAdjust="spacing">世界大戦</text>
  </g>

  <!-- 勝利（縦書き） -->
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="298.5" y="226">勝</text>
    <text x="298.5" y="253">利</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="332" cy="196" r="7.5"/>
    <circle cx="332" cy="240" r="7.5"/>
    <circle cx="332" cy="286" r="7.5"/>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="348" y="196.5" textLength="257" lengthAdjust="spacing">共産主義世界を壊滅</text>
    <text x="347" y="241.5" textLength="227" lengthAdjust="spacing">全ての主権を神に</text>
    <text x="348" y="286" textLength="314" lengthAdjust="spacing">天宙主義の理想世界実現</text>
  </g>
</svg>
