<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑪ ルカ 17:37　地上誕生</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="35" y="38">⑪</text>
    <text x="73" y="38" textLength="57" lengthAdjust="spacing">ルカ</text>
    <text x="138" y="38" textLength="72" lengthAdjust="spacing">17:37</text>
  </g>

  <!-- 聖句（細字） -->
  <g font-size="28.5" font-weight="400" dominant-baseline="central">
    <text y="140.5"><tspan x="142">『</tspan><tspan x="159.9" textLength="235.2" lengthAdjust="spacing">死体のある所には</tspan><tspan x="395">、</tspan><tspan x="424.5" textLength="235.2" lengthAdjust="spacing">またはげたかが集</tspan></text>
    <text x="153" y="180.5" textLength="212" lengthAdjust="spacing">まるものである』</text>
  </g>

  <!-- 地上誕生 -->
  <ellipse cx="225.5" cy="277.5" rx="86.5" ry="31" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="226" y="278.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="126" lengthAdjust="spacing">地上誕生</text>

  <!-- 右の字 -->
  <g font-size="29" dominant-baseline="central">
    <text x="331" y="258" textLength="346" lengthAdjust="spacing">主は信仰の篤い信徒たちの</text>
    <text x="331" y="298" textLength="144" lengthAdjust="spacing">中に現れる</text>
  </g>
</svg>
