<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 神のみ創造主であらせられるために</title>

  <text x="54" y="76.5" font-size="48">Ⅱ.</text>
  <text x="127.5" y="76" font-size="49" textLength="796" lengthAdjust="spacing">神のみ創造主であらせられるために</text>
  <line x1="127" y1="87.5" x2="926" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <!-- 神から干渉へ -->
  <polygon points="287.5,240 303.5,240 303.5,482.5 312,482.5 295.5,517.5 279,482.5 287.5,482.5" fill="#8C949A"/>
  <circle cx="295.5" cy="185" r="58.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="294" y="184" font-size="61" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="458.5" y="179" font-size="49" text-anchor="middle" dominant-baseline="central">創造主</text>

  <!-- 原理的・非原理的 -->
  <rect x="334.5" y="275" width="737.5" height="151" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g fill="#111">
    <circle cx="362.5" cy="320.5" r="9"/>
    <circle cx="362.5" cy="383.5" r="9"/>
  </g>
  <g stroke="#8C949A" stroke-width="7">
    <line x1="798" y1="320" x2="878" y2="320"/>
    <line x1="811" y1="383.5" x2="877" y2="383.5"/>
  </g>
  <circle cx="1020" cy="318.5" r="17.5" fill="none" stroke="#111" stroke-width="6"/>
  <g stroke="#111" stroke-width="7">
    <line x1="1002.5" y1="367" x2="1034.5" y2="399"/>
    <line x1="1034.5" y1="367" x2="1002.5" y2="399"/>
  </g>
  <g fill="#111" dominant-baseline="central">
    <g font-size="50">
      <text x="385.5" y="319">原理的存在、</text>
      <text x="685.5" y="319">行動</text>
      <text x="934" y="319.5" text-anchor="middle">干渉</text>
    </g>
    <g font-size="46">
      <text x="385.5" y="382">非原理的存在、</text>
      <text x="706" y="382">行動</text>
      <text x="934" y="382" text-anchor="middle">干渉</text>
    </g>
  </g>

  <!-- 干渉の意味 -->
  <rect x="239" y="551" width="122" height="79" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="300.5" y="590.5" font-size="49" text-anchor="middle" dominant-baseline="central">干渉</text>
  <polyline points="421,527 401.5,546.5 401.5,633.5 419.5,652" fill="none" stroke="currentColor" stroke-width="8"/>
  <circle cx="438.5" cy="556.5" r="9.25"/>
  <circle cx="438" cy="626.5" r="9.25"/>
  <g font-size="50" dominant-baseline="central">
    <text x="458.5" y="559" textLength="350" lengthAdjust="spacing">創造の価値賦与</text>
    <text x="458.5" y="627.5" textLength="550" lengthAdjust="spacing">原理的なものとして認定</text>
  </g>
</svg>
