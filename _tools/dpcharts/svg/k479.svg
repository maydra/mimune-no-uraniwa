<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>12数蕩減期間</title>
  <defs>
    <marker id="k479-a" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="k479-g" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.5" markerHeight="2.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
    <marker id="k479-m" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="33" y="36" font-size="30" dominant-baseline="central" textLength="191" lengthAdjust="spacing">12数蕩減期間</text>
  <line x1="33" y1="55" x2="225" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 左の箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4">
    <rect x="154.2" y="66.2" width="72.6" height="90.6" rx="5"/>
    <rect x="141.2" y="166.2" width="99.6" height="136.6" rx="5"/>
  </g>
  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text x="190.5" y="84" textLength="51" lengthAdjust="spacing">12数</text>
    <text x="189.5" y="111" textLength="47" lengthAdjust="spacing">完成</text>
    <text x="189.5" y="139" textLength="47" lengthAdjust="spacing">実体</text>
  </g>
  <g font-size="25" dominant-baseline="central">
    <text x="153" y="191.5" textLength="77" lengthAdjust="spacing">12数に</text>
    <text x="153" y="220" textLength="49" lengthAdjust="spacing">よる</text>
    <text x="153" y="249" textLength="50" lengthAdjust="spacing">信仰</text>
    <text x="153" y="278" textLength="50" lengthAdjust="spacing">基台</text>
  </g>

  <!-- 成長三段階（縦書き） -->
  <g font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="277.5" y="184">成</text>
    <text x="277.5" y="208">長</text>
    <text x="277.5" y="231.5">三</text>
    <text x="277.5" y="255.5">段</text>
    <text x="277.5" y="278">階</text>
  </g>

  <!-- 段の横線 -->
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="258" y1="165.5" x2="540" y2="165.5"/>
    <line x1="304" y1="209.5" x2="540" y2="209.5"/>
    <line x1="304" y1="254.5" x2="539" y2="254.5"/>
    <line x1="258" y1="299.5" x2="540" y2="299.5"/>
    <line x1="440" y1="374.5" x2="488" y2="374.5"/>
  </g>

  <!-- 矢印 -->
  <line x1="377" y1="208" x2="377" y2="173.6" stroke="#8C949A" stroke-width="4.4" stroke-dasharray="12 6" marker-end="url(#k479-g)"/>
  <g stroke="currentColor" stroke-width="5" fill="none" marker-end="url(#k479-a)">
    <line x1="377" y1="315" x2="377" y2="227.8"/>
    <line x1="380.5" y1="211.5" x2="457" y2="365.5"/>
    <line x1="465.5" y1="374" x2="527.6" y2="217.3"/>
  </g>

  <!-- 四位基台の印（上：12 対象目的） -->
  <g transform="translate(378,105.5)">
    <path d="M0,-33 L-36,0 L0,33 L36,0 Z" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <g stroke="currentColor" stroke-width="2.2" fill="none" marker-end="url(#k479-m)">
      <path d="M-19,-4.5 H15.8"/>
      <path d="M19,3.5 H-16.8"/>
      <path d="M-4,18 V-13.3"/>
      <path d="M4,-18 V13.3"/>
    </g>
    <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4">
      <circle cx="0" cy="-35" r="15.8"/>
      <circle cx="-38" cy="0" r="15.8"/>
      <circle cx="38" cy="0" r="15.8"/>
      <circle cx="0" cy="35" r="15.8"/>
    </g>
    <g font-size="17" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-35">神</text>
      <text x="-38" y="0">心</text>
      <text x="38" y="0">体</text>
      <text x="0" y="35">個</text>
    </g>
  </g>

  <!-- 四位基台の印（下：アダム・エバ） -->
  <g transform="translate(377.5,354)">
    <path d="M0,-33 L-36,0 L0,33 L36,0 Z" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <g stroke="currentColor" stroke-width="2.2" fill="none" marker-end="url(#k479-m)">
      <path d="M-19,-4.5 H15.8"/>
      <path d="M19,3.5 H-16.8"/>
      <path d="M-4,18 V-13.3"/>
      <path d="M4,-18 V13.3"/>
    </g>
    <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4">
      <circle cx="0" cy="-35" r="15.8"/>
      <circle cx="-38" cy="0" r="15.8"/>
      <circle cx="38" cy="0" r="15.8"/>
      <circle cx="0" cy="35" r="15.8"/>
    </g>
    <g font-size="17" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-35">神</text>
      <text x="-38" y="0">心</text>
      <text x="38" y="0">体</text>
      <text x="0" y="35">個</text>
    </g>
  </g>
  <text x="367.5" y="420" font-size="20" text-anchor="middle" dominant-baseline="central" textLength="124" lengthAdjust="spacing">アダム・エバ</text>

  <!-- 12 対象目的 -->
  <text x="447" y="96.5" font-size="27" dominant-baseline="central" textLength="31" lengthAdjust="spacingAndGlyphs">12</text>
  <text x="487" y="96" font-size="27" dominant-baseline="central" textLength="113" lengthAdjust="spacing">対象目的</text>
  <text y="129.5" font-size="22" font-weight="400" dominant-baseline="central"><tspan x="448">(</tspan><tspan x="459" textLength="86" lengthAdjust="spacing">四位基台</tspan><tspan x="550">×</tspan><tspan x="577" textLength="109" lengthAdjust="spacing">成長三段階</tspan><tspan x="687">)</tspan></text>

  <!-- 12数復帰蕩減期間 -->
  <rect x="555.2" y="215.2" width="130.6" height="73.6" rx="5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="25" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="620.5" y="236" textLength="105" lengthAdjust="spacing">12数復帰</text>
    <text x="620.5" y="267.5" textLength="101" lengthAdjust="spacing">蕩減期間</text>
  </g>
</svg>
