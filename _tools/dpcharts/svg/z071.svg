<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 神と被造世界との関係</title>
  <defs>
    <marker id="z071-g" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <text x="58" y="76" font-size="46">Ⅱ.</text>
  <text x="125" y="76" font-size="48" textLength="499" lengthAdjust="spacing">神と被造世界との関係</text>
  <line x1="125" y1="87.5" x2="624" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <g font-size="60" text-anchor="middle" dominant-baseline="central">
    <text x="298" y="243">神</text>
  </g>
  <text x="877" y="171" font-size="52" textLength="159" lengthAdjust="spacing" dominant-baseline="central">被造物</text>
  <text x="305" y="569" font-size="42" text-anchor="middle" dominant-baseline="central">無形の主体</text>

  <!-- 神の円（上が本性相、下が本形状） -->
  <path d="M202.25,412 c16.43,10.25 32.14,20 50.375,20 c18.235,0 33.945,-9.75 50.375,-20 c16.43,-10.25 32.14,-20 50.375,-20 c18.235,0 33.945,9.75 50.375,20 A100.75,100.75 0 0 0 202.25,412 Z" fill="#F98AEE"/>
  <path d="M202.25,412 c16.43,10.25 32.14,20 50.375,20 c18.235,0 33.945,-9.75 50.375,-20 c16.43,-10.25 32.14,-20 50.375,-20 c18.235,0 33.945,9.75 50.375,20 A100.75,100.75 0 0 1 202.25,412 Z" fill="#A0F08A"/>
  <path d="M202.25,412 c16.43,10.25 32.14,20 50.375,20 c18.235,0 33.945,-9.75 50.375,-20 c16.43,-10.25 32.14,-20 50.375,-20 c18.235,0 33.945,9.75 50.375,20" fill="none" stroke="#111" stroke-width="4.5"/>
  <circle cx="303" cy="412" r="100.75" fill="none" stroke="currentColor" stroke-width="4.5"/>

  <!-- 被造物の円（人間・万物） -->
  <path d="M878,307 c13.17,7.94 25.76,15.5 40.375,15.5 c14.615,0 27.205,-7.56 40.375,-15.5 c13.17,-7.94 25.76,-15.5 40.375,-15.5 c14.615,0 27.205,7.56 40.375,15.5 A80.75,80.75 0 0 0 878,307 Z" fill="#F98AEE"/>
  <path d="M878,307 c13.17,7.94 25.76,15.5 40.375,15.5 c14.615,0 27.205,-7.56 40.375,-15.5 c13.17,-7.94 25.76,-15.5 40.375,-15.5 c14.615,0 27.205,7.56 40.375,15.5 A80.75,80.75 0 0 1 878,307 Z" fill="#A0F08A"/>
  <path d="M882.25,506 c13.17,7.94 25.76,15.5 40.375,15.5 c14.615,0 27.205,-7.56 40.375,-15.5 c13.17,-7.94 25.76,-15.5 40.375,-15.5 c14.615,0 27.205,7.56 40.375,15.5 A80.75,80.75 0 0 0 882.25,506 Z" fill="#F98AEE"/>
  <path d="M882.25,506 c13.17,7.94 25.76,15.5 40.375,15.5 c14.615,0 27.205,-7.56 40.375,-15.5 c13.17,-7.94 25.76,-15.5 40.375,-15.5 c14.615,0 27.205,7.56 40.375,15.5 A80.75,80.75 0 0 1 882.25,506 Z" fill="#A0F08A"/>
  <g fill="none" stroke="#111" stroke-width="4.5">
    <path d="M878,307 c13.17,7.94 25.76,15.5 40.375,15.5 c14.615,0 27.205,-7.56 40.375,-15.5 c13.17,-7.94 25.76,-15.5 40.375,-15.5 c14.615,0 27.205,7.56 40.375,15.5"/>
    <path d="M882.25,506 c13.17,7.94 25.76,15.5 40.375,15.5 c14.615,0 27.205,-7.56 40.375,-15.5 c13.17,-7.94 25.76,-15.5 40.375,-15.5 c14.615,0 27.205,7.56 40.375,15.5"/>
  </g>
