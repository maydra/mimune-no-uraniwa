<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『サタン世界と対決できる民族的な版図』</title>

  <g font-size="31" dominant-baseline="central">
    <text x="144" y="38" text-anchor="end">『</text>
    <text x="145" y="38" textLength="533" lengthAdjust="spacing">サタン世界と対決できる民族的な版図</text>
    <text x="680" y="38">』</text>
  </g>

  <rect x="205.5" y="95" width="409.5" height="55" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <text x="225" y="121.5" font-size="29" dominant-baseline="central" textLength="373" lengthAdjust="spacing" fill="#111">メシヤのための家庭的な基台</text>

  <g fill="#8C949A">
    <polygon points="396.5,164 420.5,164 420.5,182.5 430.5,182.5 408.5,196.5 386.5,182.5 396.5,182.5"/>
    <polygon points="397.5,278 421.5,278 421.5,296.5 431.5,296.5 409.5,310 387.5,296.5 397.5,296.5"/>
  </g>

  <ellipse cx="414.5" cy="235.75" rx="145.5" ry="31.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="297" y="235.5" font-size="29" dominant-baseline="central" textLength="229" lengthAdjust="spacing">カナンの地で繁殖</text>

  <rect x="149" y="321" width="527" height="86" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="29" dominant-baseline="central" fill="#111">
    <text x="167" y="346" textLength="460" lengthAdjust="spacing">メシヤのための民族的な基台を造成</text>
    <text x="170" y="382.5" textLength="484" lengthAdjust="spacing">してのみメシヤを迎えることができる</text>
  </g>
</svg>
