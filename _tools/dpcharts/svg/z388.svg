    <g font-size="41" fill="#111">
      <text x="433.5" y="532.5">人間</text>
      <text x="651.5" y="532.5">人間</text>
      <text x="875.5" y="532.5">人間</text>
    </g>
  </g>

  <text x="500.5" y="623.5" font-size="48" textLength="297.4" lengthAdjust="spacing" dominant-baseline="central">一つの大家族</text>
