<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 983 729" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>聖書の例（マタイ 3:9、ロマ 2:28～29、ロマ 9:6）</title>

  <text x="49" y="65" font-size="33" dominant-baseline="central" textLength="139" lengthAdjust="spacing">聖書の例</text>

  <circle cx="55" cy="131" r="6.5"/>
  <circle cx="55" cy="346" r="6.5"/>
  <circle cx="55" cy="561" r="6.5"/>

  <!-- 本文（細字は font-weight 400） -->
  <g font-size="28" dominant-baseline="central">
    <text y="131.5"><tspan x="71" font-weight="400" textLength="302" lengthAdjust="spacing">マタイ福音書３章９節</tspan><tspan x="373" font-weight="400" textLength="503" lengthAdjust="spacing">に洗礼ヨハネは、ユダヤ人たちに、『</tspan><tspan x="876" textLength="58" lengthAdjust="spacing">自分</tspan></text>
    <text x="71" y="181.5" textLength="863" lengthAdjust="spacing">たちの父にはアブラハムがあるなどと、心の中で思ってもみるな。</text>
    <text y="230.5"><tspan x="71" textLength="357" lengthAdjust="spacing">おまえたちに言っておく、</tspan><tspan x="428" textLength="506" lengthAdjust="spacing">神はこれらの石ころからでも、アブラ</tspan></text>
    <text y="281"><tspan x="71" textLength="116" lengthAdjust="spacing">ハムの子</tspan><tspan x="187" textLength="319" lengthAdjust="spacing">を起すことができるのだ</tspan><tspan x="503" font-weight="400">』</tspan><tspan x="526" font-weight="400" textLength="146" lengthAdjust="spacing">と言った。</tspan></text>

    <text y="346.5"><tspan x="71" font-weight="400" textLength="153" lengthAdjust="spacing">のみならず</tspan><tspan x="225" font-weight="400" textLength="151" lengthAdjust="spacing">ロマ書２章</tspan><tspan x="384" font-weight="400" textLength="29" lengthAdjust="spacingAndGlyphs">28</tspan><tspan x="420" font-weight="400" textLength="62" lengthAdjust="spacing">節～</tspan><tspan x="490" font-weight="400" textLength="29" lengthAdjust="spacingAndGlyphs">29</tspan><tspan x="526" font-weight="400" textLength="31" lengthAdjust="spacing">節</tspan><tspan x="557" font-weight="400" textLength="199" lengthAdjust="spacing">にパウロは、『</tspan><tspan x="756" textLength="178" lengthAdjust="spacing">外見上のユダ</tspan></text>
    <text y="396.5"><tspan x="71" textLength="58" lengthAdjust="spacing">ヤ人</tspan><tspan x="129" textLength="507" lengthAdjust="spacing">がユダヤ人ではなく、また、外見上の</tspan><tspan x="636" textLength="208" lengthAdjust="spacing">肉における割礼</tspan><tspan x="844" textLength="90" lengthAdjust="spacing">が割礼</tspan></text>
    <text y="446"><tspan x="71" textLength="300" lengthAdjust="spacing">でもない。かえって、</tspan><tspan x="371" textLength="208" lengthAdjust="spacing">隠れたユダヤ人</tspan><tspan x="579" textLength="355" lengthAdjust="spacing">がユダヤ人であり、また、</tspan></text>
    <text y="495.5"><tspan x="71" textLength="289" lengthAdjust="spacing">文字によらず霊による</tspan><tspan x="360" textLength="115" lengthAdjust="spacing">心の割礼</tspan><tspan x="475" textLength="231" lengthAdjust="spacing">こそ割礼であって</tspan><tspan x="705" font-weight="400">』</tspan><tspan x="737" font-weight="400" textLength="145" lengthAdjust="spacing">と言った。</tspan></text>

    <text y="561.5"><tspan x="71" font-weight="400" textLength="89" lengthAdjust="spacing">また、</tspan><tspan x="160" font-weight="400" textLength="208" lengthAdjust="spacing">ロマ書９章６節</tspan><tspan x="368" font-weight="400" textLength="104" lengthAdjust="spacing">には、『</tspan><tspan x="472" textLength="462" lengthAdjust="spacing">イスラエルから出た者が全部イスラ</tspan></text>
    <text y="611.5"><tspan x="71" textLength="232" lengthAdjust="spacing">エルなのではない</tspan><tspan x="303" font-weight="400" textLength="451" lengthAdjust="spacing">』と証言したのであり、これは、</tspan><tspan x="754" font-weight="400" textLength="60" lengthAdjust="spacing">選民</tspan><tspan x="814" font-weight="400" textLength="120" lengthAdjust="spacing">であると</tspan></text>
    <text y="661.5"><tspan x="71" font-weight="400" textLength="209" lengthAdjust="spacing">うぬぼれている</tspan><tspan x="280" font-weight="400" textLength="418" lengthAdjust="spacing">ユダヤ人たちを、叱責したみ言</tspan><tspan x="698" font-weight="400" textLength="149" lengthAdjust="spacing">であった。</tspan></text>
  </g>
  <!-- 叱責のルビ -->
  <text x="521" y="638.5" font-size="13" font-weight="400" dominant-baseline="central" textLength="54" lengthAdjust="spacing">しっせき</text>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="2">
    <line x1="48" y1="90" x2="190" y2="90"/>
    <line x1="71" y1="152" x2="373" y2="152"/>
    <line x1="876" y1="152" x2="935" y2="152"/>
    <line x1="71" y1="201.5" x2="686" y2="201.5"/>
    <line x1="428" y1="251" x2="935" y2="251"/>
    <line x1="71" y1="301" x2="186" y2="301"/>
    <line x1="224" y1="367" x2="557" y2="367"/>
    <line x1="756" y1="367" x2="935" y2="367"/>
    <line x1="71" y1="416" x2="129" y2="416"/>
    <line x1="636" y1="416" x2="845" y2="416"/>
    <line x1="371" y1="466" x2="586" y2="466"/>
    <line x1="360" y1="516" x2="476" y2="516"/>
    <line x1="160" y1="582" x2="369" y2="582"/>
    <line x1="472" y1="582" x2="935" y2="582"/>
    <line x1="71" y1="631" x2="303" y2="631"/>
    <line x1="754" y1="631" x2="814" y2="631"/>
    <line x1="280" y1="682" x2="697" y2="682"/>
  </g>
</svg>
