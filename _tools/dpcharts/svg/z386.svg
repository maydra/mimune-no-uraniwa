<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>文化圏・国家・経済・交通、通信　人類：四海同胞の兄弟愛</title>

  <ellipse cx="352" cy="292" rx="150" ry="202.5" fill="#CF921C" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="41" dominant-baseline="central" fill="#111">
    <text x="437.5" y="158" text-anchor="end">文化圏</text>
    <text y="242"><tspan x="313.5">国</tspan><tspan x="397.2">家</tspan></text>
    <text y="325"><tspan x="315.1">経</tspan><tspan x="398.2">済</tspan></text>
    <text x="437.5" y="408" text-anchor="end" textLength="197.3" lengthAdjust="spacingAndGlyphs">交通、通信</text>
  </g>

  <!-- 矢印（楕円の縁の上に重なる） -->
  <g fill="#8C949A">
    <polygon points="452,156.5 541,156.5 541,149.5 560,160 541,170.5 541,163.5 452,163.5"/>
    <polygon points="452,238.5 541,238.5 541,231.5 560,242 541,252.5 541,245.5 452,245.5"/>
    <polygon points="452,321 541,321 541,314 560,324.5 541,335 541,328 452,328"/>
    <polygon points="452,404.5 541,404.5 541,397.5 560,408 541,418.5 541,411.5 452,411.5"/>
  </g>

  <g font-size="41" dominant-baseline="central">
    <text x="579.8" y="158" textLength="455.4" lengthAdjust="spacing">宗教中心の一つの文化圏</text>
    <text x="579" y="241.5" textLength="247.4" lengthAdjust="spacing">世界政府模索</text>
    <text x="579.8" y="325" textLength="289" lengthAdjust="spacing">一つの共同市場</text>
    <text x="579.8" y="408" textLength="205.6" lengthAdjust="spacing">一つの庭園</text>
  </g>

  <rect x="399.25" y="520.25" width="565.5" height="68.5" rx="8" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="45" dominant-baseline="central" fill="#111">
    <text x="426.6" y="553.5">人類</text>
    <text x="540" y="553.5" text-anchor="middle">：</text>
    <text x="564" y="553.5" textLength="364" lengthAdjust="spacing">四海同胞の兄弟愛</text>
  </g>
</svg>
