<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『例』イスラエル選民とイエス</title>

  <text y="44.5" font-size="31" dominant-baseline="central"><tspan x="131">『</tspan><tspan x="160.5" text-anchor="middle">例</tspan><tspan x="177">』</tspan></text>

  <!-- イスラエル選民と、罰を受けるイスラエル選民 -->
  <ellipse cx="359.5" cy="73.5" rx="101.5" ry="49.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="357" y="74" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="175" lengthAdjust="spacing">イスラエル選民</text>
  <ellipse cx="360.5" cy="350.5" rx="105.5" ry="49.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="360" y="338.5" textLength="183" lengthAdjust="spacing">イスラエル選民</text>
    <text x="359" y="372.5" textLength="130" lengthAdjust="spacing">罰を受ける</text>
  </g>

  <!-- 上下の矢印 -->
  <g fill="#8C949A">
    <polygon points="342.5,122 349.5,122 349.5,279 354.5,279 346,292 337.5,279 342.5,279"/>
    <polygon points="373,131.5 381.5,144.5 376.5,144.5 376.5,301 369.5,301 369.5,144.5 364.5,144.5"/>
  </g>

  <!-- 左：イを憎んで十字架につけた -->
  <g fill="none" stroke="currentColor" stroke-width="2.4">
    <circle cx="154" cy="179.5" r="16.8"/>
    <circle cx="416" cy="179" r="16.8"/>
  </g>
  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text x="152.5" y="180">イ</text>
    <text x="414.5" y="180">イ</text>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="179" y="179.5" textLength="113" lengthAdjust="spacing">を憎んで</text>
    <text x="141" y="219.5" font-size="27" textLength="191" lengthAdjust="spacing">十字架につけた</text>
    <text x="441" y="179.5" textLength="84" lengthAdjust="spacing">を愛し</text>
  </g>

  <!-- 右：イを愛し十字架を負う -->
  <text x="403" y="217.5" font-size="26" dominant-baseline="central" textLength="156" lengthAdjust="spacing">十字架を負う</text>
  <text x="567.5" y="218" font-size="21" dominant-baseline="central" textLength="117" lengthAdjust="spacing">(ルカ 14:27)</text>
  <polygon points="514,242 526,242 526,248 534,248 520,259 506,248 514,248" fill="#8C949A"/>
  <text y="282" font-size="26" dominant-baseline="central"><tspan x="405" textLength="130" lengthAdjust="spacing">キリスト教</tspan><tspan x="548" text-anchor="middle">：</tspan><tspan x="561" textLength="131" lengthAdjust="spacing">殉教の宗教</tspan></text>
</svg>
