<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アダムの家庭を中心とする復帰摂理：×</title>

  <!-- 箱 -->
  <g stroke="currentColor" stroke-width="2.2">
    <rect x="151" y="40" width="516" height="48.5" fill="#CDF8F7"/>
    <rect x="222" y="141" width="376" height="49.5" fill="#CDF8F7"/>
    <rect x="281" y="246" width="257" height="47" fill="#fff" class="paper"/>
    <rect x="281" y="347" width="257" height="47" fill="#fff" class="paper"/>
  </g>
  <g dominant-baseline="central">
    <text x="166" y="64" font-size="27" textLength="432" lengthAdjust="spacing" fill="#111">アダムの家庭を中心とする復帰摂理</text>
    <text x="239" y="167.5" font-size="31" textLength="282" lengthAdjust="spacing" fill="#111">メシヤのための基台</text>
    <text x="316" y="269.5" font-size="31" textLength="126" lengthAdjust="spacing">実体基台</text>
    <text x="315" y="370" font-size="31" textLength="126" lengthAdjust="spacing">信仰基台</text>
  </g>
  <g dominant-baseline="central" text-anchor="middle">
    <text x="612.5" y="64" font-size="27" fill="#111">：</text>
    <text x="536" y="167.5" font-size="31" fill="#111">：</text>
    <text x="457" y="269.5" font-size="31">：</text>
    <text x="456.5" y="370" font-size="31">：</text>
  </g>

  <!-- ×と○ -->
  <g stroke-width="5.5">
    <path d="M630.5,54.5 L649.5,73.5 M649.5,54.5 L630.5,73.5" stroke="#111"/>
    <path d="M556.5,155.5 L577.5,176.5 M577.5,155.5 L556.5,176.5" stroke="#111"/>
    <path d="M478.5,259.5 L498.5,279.5 M498.5,259.5 L478.5,279.5" stroke="currentColor"/>
  </g>
  <circle cx="492" cy="369" r="11.5" fill="none" stroke="currentColor" stroke-width="5"/>

  <!-- 上向きの矢印・＝・＋ -->
  <polygon points="407.5,99 416.5,114.5 411,114.5 411,128.5 404,128.5 404,114.5 398.5,114.5" fill="#8C949A"/>
  <g stroke="currentColor">
    <line x1="400.5" y1="207" x2="400.5" y2="231.5" stroke-width="4"/>
    <line x1="412.5" y1="207" x2="412.5" y2="231.5" stroke-width="4"/>
    <line x1="403" y1="306.5" x2="403" y2="334.5" stroke-width="5.5"/>
    <line x1="389" y1="320.5" x2="416.5" y2="320.5" stroke-width="5"/>
  </g>
