<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>堕落性本性</title>

  <text x="54" y="77" font-size="48" textLength="248" lengthAdjust="spacing">堕落性本性</text>
  <line x1="52" y1="88" x2="302" y2="88" stroke="currentColor" stroke-width="3.5"/>

  <g font-size="50">
    <text x="237" y="226.5">①<tspan x="291">神と同じ立場に立てない</tspan></text>
    <text x="237" y="341.5">②<tspan x="291">自己の位置を離れる</tspan></text>
    <text x="237" y="455.5">③<tspan x="291">主管性を転倒する</tspan></text>
    <text x="237" y="570.5">④<tspan x="291">犯罪行為を繁殖する</tspan></text>
  </g>
</svg>
