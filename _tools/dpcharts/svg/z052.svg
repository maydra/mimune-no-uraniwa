<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の二性性相　無形の神の神性と有形の被造世界（ロマ1:20）</title>

  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="78.5" y="57">Ⅰ</text>
    <text x="109.5" y="57">.</text>
  </g>
  <text x="129" y="57" font-size="48" dominant-baseline="central" textLength="299" lengthAdjust="spacing">神の二性性相</text>
  <line x1="129" y1="87" x2="428" y2="87" stroke="currentColor" stroke-width="3.5"/>

  <g font-size="48" dominant-baseline="central">
    <text x="206" y="254">無形</text>
    <text x="206" y="515.5">有形</text>
  </g>
  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="329.5" y="254">：</text>
    <text x="329.5" y="515.5">：</text>
  </g>

  <!-- 被造世界から神の神性へ -->
  <polygon points="522,339.5 541.5,377.5 530.5,377.5 530.5,442 513.5,442 513.5,377.5 502.5,377.5" fill="#8C949A"/>
  <g font-size="40" dominant-baseline="central">
    <text x="562" y="388">ロマ</text>
    <text x="647" y="388">1:20</text>
  </g>

  <g stroke="currentColor" stroke-width="3.5">
    <ellipse cx="522" cy="255.2" rx="150.7" ry="76.2" fill="#fff" class="paper"/>
    <ellipse cx="523.7" cy="517.1" rx="155.2" ry="76.2" fill="#DCC4C4"/>
  </g>
  <text x="521" y="254.5" font-size="56" text-anchor="middle" dominant-baseline="central">神の神性</text>
  <text x="523.5" y="520" font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111">被造世界</text>

  <!-- 聖句（元の画像で細字） -->
  <g font-size="36" font-weight="400" dominant-baseline="central">
    <text x="765" y="349" text-anchor="end">『</text>
    <text x="765" y="349" textLength="340" lengthAdjust="spacing">神の永遠の力と神性</text>
    <text x="765" y="403.5" textLength="340" lengthAdjust="spacing">とは、天地創造この</text>
    <text x="765" y="458" textLength="340" lengthAdjust="spacing">かた、被造物におい</text>
    <text x="765" y="512.5" textLength="340" lengthAdjust="spacing">て知られていて明ら</text>
    <text x="765" y="567" textLength="340" lengthAdjust="spacing">かに認められるから</text>
    <text x="765" y="621.5" textLength="151" lengthAdjust="spacing">である…</text>
    <text x="913" y="621.5">』</text>
  </g>
</svg>
