  <text x="49" y="39" font-size="19" text-anchor="middle" dominant-baseline="central">イ</text>
  <text x="68" y="38.5" font-size="30" dominant-baseline="central" textLength="520" lengthAdjust="spacingAndGlyphs">石板、幕屋、契約の箱などの意義とその目的</text>
  <line x1="68" y1="57.8" x2="588" y2="57.8" stroke="currentColor" stroke-width="2.5"/>

