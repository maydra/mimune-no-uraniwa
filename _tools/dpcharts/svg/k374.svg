<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>出発のための摂理（洗礼ヨハネとユダヤ民族）</title>

  <text x="35" y="37" font-size="30" dominant-baseline="central" textLength="251" lengthAdjust="spacing">出発のための摂理</text>
  <line x1="33" y1="56" x2="285" y2="56" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="202,177.5 208.5,190 205,190 205,240 199,240 199,190 195.5,190"/>
    <polygon points="286,274.5 300,268.5 300,271.5 537,271.5 537,277.5 300,277.5 300,280.5"/>
    <polygon points="518,134 535,134 535,130 548.5,137 535,144 535,140 518,140"/>
  </g>

  <!-- 神 -->
  <circle cx="202" cy="139.5" r="32" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <text x="201" y="139.5" font-size="35" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 括弧と2行 -->
  <path d="M301,118 Q287,120 287,134 V180 Q287,194 301,196" fill="none" stroke="currentColor" stroke-width="3.6"/>
  <g font-size="26" dominant-baseline="central">
    <text x="305" y="137.5" textLength="206" lengthAdjust="spacing">モーセ：エジプト</text>
    <text x="558" y="137.5" textLength="76" lengthAdjust="spacing">カナン</text>
    <text x="303" y="174.5" textLength="342" lengthAdjust="spacing">洗礼ヨハネ：ローマ帝国復帰</text>
  </g>
  <text x="435" y="208" font-size="22" dominant-baseline="central" textLength="208" lengthAdjust="spacing">（奇跡、修道の生活）</text>

  <!-- 洗礼ヨハネ・ユダヤ民族 -->
  <g stroke="currentColor" stroke-width="2.4">
    <ellipse cx="203.5" cy="276" rx="78.3" ry="36.8" fill="#F8F28F"/>
    <ellipse cx="613" cy="275" rx="76.8" ry="35.8" fill="#F86D42"/>
  </g>
  <g font-size="25" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="205" y="275.5" textLength="131" lengthAdjust="spacing">洗礼ヨハネ</text>
    <text x="619.5" y="273" textLength="122" lengthAdjust="spacing">ユダヤ民族</text>
  </g>
  <text x="417" y="296" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="103" lengthAdjust="spacing">信じ従う</text>

  <!-- 出発のための摂理：○ -->
  <rect x="263.5" y="323.5" width="319" height="45" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="280" y="347" textLength="230" lengthAdjust="spacing">出発のための摂理</text>
    <text x="524" y="347" text-anchor="middle">：</text>
  </g>
  <circle cx="552.5" cy="346.5" r="11.1" fill="none" stroke="#111" stroke-width="3.2"/>
</svg>
