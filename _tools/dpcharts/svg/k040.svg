<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理の路程（アダム・アブラハム・イエス・再臨主）</title>
  <defs>
    <marker id="k040-a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="k040-s" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 段の横線 -->
  <g stroke="currentColor" stroke-width="2.4">
    <line x1="136" y1="134" x2="686" y2="134"/>
    <line x1="136" y1="193" x2="686" y2="193"/>
    <line x1="136" y1="252" x2="686" y2="252"/>
    <line x1="136" y1="310.5" x2="686" y2="310.5"/>
  </g>

  <!-- 神とアの授受（丸い矢印） -->
  <g stroke="currentColor" stroke-width="2.2" fill="none" marker-end="url(#k040-s)">
    <path d="M162,98 Q150,89 163,80"/>
    <path d="M196,80 Q209,89 196,98"/>
    <path d="M614,98 Q602,89 615,80"/>
    <path d="M648,80 Q661,89 648,98"/>
  </g>

  <!-- 左：堕落の路 -->
  <g stroke="currentColor" stroke-width="5" fill="none" marker-end="url(#k040-a)">
    <line x1="179" y1="313" x2="179" y2="196"/>
    <line x1="179" y1="193" x2="179" y2="135" stroke-dasharray="14 5"/>
    <line x1="188" y1="193" x2="252" y2="347"/>
  </g>

  <!-- 2000年の弧 -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <path d="M352,368 C395,366 420,360 432,333 L438,318"/>
    <path d="M447.5,310 C490.5,308 515.5,302 527.5,275 L533.5,260"/>
    <path d="M542.5,251 C585.5,249 610.5,243 622.5,216 L628.5,201"/>
  </g>

  <!-- 右：復帰の路 -->
  <g stroke="currentColor" stroke-width="5" fill="none" marker-end="url(#k040-a)">
    <line x1="344.5" y1="369" x2="431.4" y2="316.2"/>
    <line x1="440" y1="311" x2="526.4" y2="257.3"/>
    <line x1="535" y1="252" x2="621.9" y2="198.3"/>
    <line x1="630.5" y1="193" x2="630.5" y2="134"/>
  </g>

  <!-- 丸 -->
  <g stroke="currentColor" stroke-width="2.2">
    <circle cx="178.5" cy="60" r="17" fill="#fff" class="paper"/>
    <circle cx="630.5" cy="60" r="17" fill="#fff" class="paper"/>
    <circle cx="179" cy="115" r="17" fill="#F98AEE"/>
    <circle cx="630.5" cy="115" r="17" fill="#fff" class="paper"/>
    <circle cx="179.5" cy="330.5" r="16.5" fill="#F98AEE"/>
  </g>
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <text x="178.5" y="60">神</text>
    <text x="630.5" y="60">神</text>
    <text x="630.5" y="115">ア</text>
    <text x="179" y="115" fill="#111">ア</text>
    <text x="179.5" y="330.5" fill="#111">ア</text>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="269.5" cy="372.5" rx="62" ry="19" fill="#CF921C"/>
    <ellipse cx="362" cy="308" rx="62" ry="19.5" fill="#FCE5E3"/>
    <ellipse cx="468.5" cy="249.5" rx="50.5" ry="19" fill="#F8F28F"/>
    <ellipse cx="560.5" cy="191.5" rx="51" ry="19" fill="#fff" class="paper"/>
  </g>
  <g font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="270" y="373" font-size="24" fill="#111" textLength="68" lengthAdjust="spacing">アダム</text>
    <text x="361" y="309" font-size="23" fill="#111" textLength="92" lengthAdjust="spacing">アブラハム</text>
    <text x="468.5" y="251" font-size="26" fill="#111" textLength="73" lengthAdjust="spacing">イエス</text>
    <text x="560" y="190" font-size="25" textLength="75" lengthAdjust="spacing">再臨主</text>
  </g>

  <!-- 点（線の上に置く） -->
  <g fill="currentColor">
    <circle cx="344.5" cy="369" r="8.5"/>
    <circle cx="440" cy="311" r="8"/>
    <circle cx="535" cy="252" r="8"/>
    <circle cx="630.5" cy="193" r="8"/>
  </g>

  <g font-size="21" font-weight="400" dominant-baseline="central">
    <text x="422" y="349.5" textLength="68" lengthAdjust="spacing">2000年</text>
    <text x="518" y="292" textLength="68" lengthAdjust="spacing">2000年</text>
    <text x="612" y="231.5" textLength="68" lengthAdjust="spacing">2000年</text>
  </g>
</svg>
