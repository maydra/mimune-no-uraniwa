<meta charset="utf-8"/>
<title>🔮 ランダムページに移動中...</title>
    
    <link rel="stylesheet" href="theme/style.css">
</head>
<body>
<h1 id="🔮-ランダムなページを選んでいます..."><a href="#🔮-ランダムなページを選んでいます...">🔮 ランダムなページを選んでいます...</a></h1>
<script>
  // 常に randomScroll=true を付けたいなら true 固定でもOK
  const wantRandomScroll = true;

  // JSONを取得してランダムページへ遷移
  fetch("pages.json")
    .then(res => res.json())
    .then(pages => {
      // 除外フィルター: indexを含む、はじめに/序文/目次、gacha/search などを除外
      const excludedPatterns = [
        /index/i,
        /hajimeni/i,
        /jyobunn/i,
        /mokuji/i,
        /search/i,
        /gacha/i,
        /^preview\//,
        /library\//
      ];

      const filteredPages = pages.filter(page => {
        return !excludedPatterns.some(pattern => pattern.test(page));
      });

      if (filteredPages.length === 0) {
        throw new Error("利用可能な本文ページが見つかりませんでした。");
      }

      const randomPage = filteredPages[Math.floor(Math.random() * filteredPages.length)];
      const basePath = "/mimune-no-uraniwa/";
      const fullURL = basePath + randomPage + (wantRandomScroll ? "?randomScroll=true" : "");
      location.href = fullURL;
    })
    .catch(err => {
      console.error("ページ取得失敗:", err);
      document.body.innerHTML += "<p style='color:red;'>ページ取得に失敗しました。</p>";
    });
</script>

<script src="theme/script.js"></script>
</body>
</html>
