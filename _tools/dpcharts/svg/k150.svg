<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>「象徴献祭」は何を意味するのか？</title>

  <!-- 題 -->
  <text x="47" y="37.5" font-size="31" dominant-baseline="central" textLength="469" lengthAdjust="spacing">「象徴献祭」は何を意味するのか？</text>
  <line x1="44" y1="56.5" x2="521" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 枝分かれの線（楕円の下に描く） -->
  <g fill="none" stroke="#8C949A" stroke-width="6">
    <path d="M263,131.5 H245.5 V189.5 H263 M210,160.5 H245.5"/>
    <path d="M263,299.5 H245.5 V357.5 H263 M210,328.5 H245.5"/>
  </g>

  <g stroke="currentColor" stroke-width="2.2" fill="#F8F28F">
    <ellipse cx="188" cy="161" rx="36" ry="70"/>
    <ellipse cx="188" cy="327.5" rx="36" ry="69.5"/>
  </g>

  <!-- 縦書き（1字ずつ） -->
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="24">
      <text x="188" y="114.5">ア</text>
      <text x="188" y="137">ダ</text>
      <text x="188" y="161.5">ム</text>
      <text x="188" y="184.5">家</text>
      <text x="188" y="208.5">庭</text>
    </g>
    <g font-size="25">
      <text x="188" y="287">ノ</text>
      <text x="188" y="314">ア</text>
      <text x="188" y="340">家</text>
      <text x="188" y="366">庭</text>
    </g>
  </g>

  <!-- 中身 -->
  <g font-size="28" dominant-baseline="central">
    <text x="271" y="131" textLength="71" lengthAdjust="spacingAndGlyphs">カイン</text>
    <text x="370" y="131" textLength="292" lengthAdjust="spacingAndGlyphs">アベルの献祭を中心とした</text>
    <text x="271" y="191" textLength="314" lengthAdjust="spacing">象徴的な条件物ささげる</text>
    <text x="270" y="297.5" textLength="229" lengthAdjust="spacing">箱舟を中心とした</text>
    <text x="270" y="358" textLength="315" lengthAdjust="spacing">象徴的な条件物ささげる</text>
  </g>
  <circle cx="355.5" cy="131" r="3.4"/>
</svg>
