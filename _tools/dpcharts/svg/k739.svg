<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ 主権復帰の蘇生的な基台を造成</title>

  <!-- 題 -->
  <g dominant-baseline="central" font-size="26">
    <text x="47" y="36.5" text-anchor="middle">③</text>
    <text x="67" y="36.5" textLength="368" lengthAdjust="spacing">主権復帰の蘇生的な基台を造成</text>
  </g>
  <line x1="67" y1="53.6" x2="434" y2="53.6" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印（楕円の下に描く） -->
  <polygon points="282.5,182 282.5,289.5 289.5,289.5 278.5,306.5 267.5,289.5 274.5,289.5 274.5,182" fill="#8C949A"/>

  <!-- 天の側・サタン側 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="279.5" cy="138" rx="81.5" ry="42" fill="#fff" class="paper"/>
    <ellipse cx="279.5" cy="350" rx="81.5" ry="42" fill="#50403D"/>
  </g>
  <text x="279" y="138" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="93" lengthAdjust="spacing">天の側</text>
  <text x="280" y="350" font-size="30" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="123" lengthAdjust="spacing">サタン側</text>

  <!-- 第一次世界大戦 -->
  <rect x="124.5" y="204.5" width="128" height="77" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="28.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="189.5" y="227" textLength="86" lengthAdjust="spacing">第一次</text>
    <text x="189.5" y="259" textLength="116" lengthAdjust="spacing">世界大戦</text>
  </g>

  <!-- 勝利（縦書き） -->
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="317.5" y="226">勝</text>
    <text x="317" y="255">利</text>
  </g>

  <!-- 箇条 -->
  <circle cx="376" cy="195" r="7.5"/>
  <circle cx="376" cy="241.5" r="7.5"/>
  <circle cx="376" cy="286.5" r="7.5"/>
  <g font-size="28" dominant-baseline="central">
    <text x="390" y="195" textLength="261" lengthAdjust="spacing">世界をキリスト教化</text>
    <text x="391" y="240" textLength="288" lengthAdjust="spacing">民主主義の蘇生的基台</text>
    <text x="391" y="284.5" textLength="288" lengthAdjust="spacing">主権復帰の蘇生的基台</text>
  </g>
</svg>
