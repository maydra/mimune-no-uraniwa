<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>み旨成就＝神の責任分担＋人間の責任分担</title>

  <!-- み旨（復帰摂理）……絶対的 -->
  <line x1="560" y1="76" x2="766" y2="76" stroke="currentColor" stroke-width="7" stroke-dasharray="9 8.9"/>
  <rect x="203.25" y="38.25" width="354.5" height="77.5" rx="52" ry="18" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="380.6" y="76.5" font-size="45.5" textLength="319" lengthAdjust="spacing">み旨（復帰摂理）</text>
    <text x="855" y="77.5" font-size="49">絶対的</text>
  </g>

  <!-- み旨成就＝神責任分担＋人間責任分担 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="202.25" y="177.25" width="227.5" height="140" rx="43" ry="30" fill="#CDF8F7"/>
    <rect x="525.25" y="180.25" width="226.5" height="139.5" rx="43" ry="30" fill="#fff" class="paper"/>
    <rect x="851.25" y="177.25" width="226.5" height="138.5" rx="43" ry="30" fill="#FCE5E3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="316" y="247" font-size="45.5" textLength="183" lengthAdjust="spacing" fill="#111">み旨成就</text>
    <text x="638" y="221" font-size="50">神</text>
    <text x="639.5" y="278" font-size="45.5" textLength="183" lengthAdjust="spacing">責任分担</text>
    <text x="964" y="219.5" font-size="45.5" fill="#111">人間</text>
    <text x="965" y="274" font-size="45.5" textLength="183" lengthAdjust="spacing" fill="#111">責任分担</text>
  </g>
  <!-- ＝ と ＋（細い） -->
  <g>
    <rect x="456" y="232" width="42" height="4"/>
    <rect x="456" y="252" width="42" height="4"/>
    <rect x="777" y="248" width="45" height="5"/>
    <rect x="797" y="229" width="5" height="43"/>
  </g>

  <!-- 2行の式（・は円、＝と＋は太い線で描く） -->
  <circle cx="219" cy="414" r="8.5"/>
  <circle cx="218" cy="576.5" r="8.5"/>
  <g>
    <rect x="461" y="403" width="36" height="7"/>
    <rect x="461" y="418" width="36" height="7"/>
    <rect x="771" y="424" width="44" height="8"/>
    <rect x="788" y="404" width="8" height="47"/>
    <rect x="465" y="568.5" width="36" height="6.5"/>
    <rect x="465" y="584" width="36" height="6.5"/>
    <rect x="767" y="599" width="44" height="8"/>
    <rect x="785" y="580" width="8" height="46"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="45.5">
      <text x="336.5" y="414" textLength="183" lengthAdjust="spacing">み旨成就</text>
      <text x="630" y="414" textLength="182" lengthAdjust="spacing">創造目的</text>
      <text x="337.5" y="576.5" textLength="183" lengthAdjust="spacing">み旨成就</text>
      <text x="631" y="576" textLength="184" lengthAdjust="spacing">復帰摂理</text>
      <text x="933" y="578" textLength="182" lengthAdjust="spacing">中心人物</text>
      <text x="978" y="632" textLength="274" lengthAdjust="spacing">責任分担遂行</text>
    </g>
    <text x="967" y="410" font-size="43" textLength="249" lengthAdjust="spacing">アダムとエバ</text>
    <text x="979" y="455" font-size="40.5" textLength="277" lengthAdjust="spacing">取って食べない</text>
    <text x="951" y="505" font-size="36.5" textLength="54" lengthAdjust="spacingAndGlyphs">（創</text>
    <text x="1033.3" y="505" font-size="36.5" textLength="93.3" lengthAdjust="spacingAndGlyphs">2:17）</text>
  </g>
</svg>
