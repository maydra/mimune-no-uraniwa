<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>宗教人が使命を全うすることができなくなった原因</title>
  <defs>
    <marker id="z025-k" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="2.3" markerHeight="2.3" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="49" y="78" font-size="48" textLength="1149" lengthAdjust="spacing">宗教人が使命を全うすることができなくなった原因</text>
  <line x1="49" y1="89.5" x2="1198" y2="89.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 人から心・体へ（人と楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="8">
    <line x1="320" y1="290" x2="385" y2="249.1"/>
    <line x1="300" y1="347.9" x2="385" y2="397.2"/>
    <line x1="838" y1="294" x2="905" y2="252.5"/>
    <line x1="818" y1="347" x2="910" y2="396"/>
  </g>

  <!-- 人（担当の図と同じ大きさ） -->
  <g fill="#FCE6E5" stroke="#111" stroke-width="3.1" stroke-linejoin="round">
    <g transform="translate(213.5,182.5) scale(1.27)">
      <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
      <circle cx="50" cy="22" r="19"/>
    </g>
    <g transform="translate(731,182.5) scale(1.27)">
      <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
      <circle cx="50" cy="22" r="19"/>
    </g>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="419" cy="237.5" rx="55" ry="38.5" fill="#F98AEE"/>
    <ellipse cx="418" cy="402.3" rx="55" ry="38.8" fill="#A0F08A"/>
    <ellipse cx="980.3" cy="229.8" rx="90.3" ry="54.3" fill="#F98AEE"/>
    <ellipse cx="985.5" cy="414.3" rx="91" ry="55.8" fill="#A0F08A"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="419.5" y="238" font-size="44">心</text>
    <text x="418" y="402.5" font-size="44">体</text>
    <g font-size="33">
      <text x="980" y="211.5">心霊的</text>
      <text x="980" y="249.5">喜び</text>
      <text x="985.5" y="395">肉身の</text>
      <text x="985.5" y="433">幸福蔑視</text>
    </g>
  </g>

  <!-- 心と体、本質と現象の間を回る矢印。右は授受が断たれて✕ -->
  <g fill="none" stroke="currentColor" stroke-width="7" marker-end="url(#z025-k)">
    <path d="M402,343 Q391.7,315.7 396.5,304.7"/>
    <path d="M431,294.3 Q441.3,321.6 436.5,332.6"/>
    <path d="M526,344.5 Q515.7,317.2 520.5,306.2"/>
    <path d="M555,295.8 Q565.3,323.1 560.5,334.1"/>
    <path d="M969.3,344.6 Q959,317.3 963.8,306.3"/>
    <path d="M998.3,295.9 Q1008.6,323.2 1003.8,334.2"/>
  </g>
  <g stroke="currentColor" stroke-width="7">
    <line x1="937" y1="302.5" x2="1031" y2="339"/>
    <line x1="937" y1="339" x2="1031" y2="302.5"/>
  </g>

  <g font-size="44.5" dominant-baseline="central">
    <text x="539" y="233" text-anchor="middle">本質</text>
    <text x="541.5" y="403.5" text-anchor="middle">現象</text>
    <text x="797.5" y="154.5" text-anchor="middle">宗教人</text>
    <text x="193.4" y="547.5" textLength="178" lengthAdjust="spacing">完全なる</text>
    <text x="193.4" y="602" textLength="89" lengthAdjust="spacing">人格</text>
    <text x="539.5" y="544.5" text-anchor="middle">理想</text>
    <text x="539.5" y="599.5" text-anchor="middle">世界</text>
    <text x="937.5" y="568" textLength="134" lengthAdjust="spacing">矛盾性</text>
    <text x="937.5" y="618" textLength="89.5" lengthAdjust="spacing">破滅</text>
  </g>
  <g font-size="41" dominant-baseline="central">
    <text x="789" y="512.5" text-anchor="middle">苦悩</text>
    <text x="641" y="567.5" textLength="211" lengthAdjust="spacing">修道の生活</text>
  </g>

  <g fill="#8C949A">
    <polygon points="625,307.5 647,307.5 647,288.5 674,321.5 647,354.5 647,335.5 625,335.5"/>
    <polygon points="882.5,562 898,562 898,557 925,570 898,583 898,577.5 882.5,577.5"/>
  </g>
</svg>
