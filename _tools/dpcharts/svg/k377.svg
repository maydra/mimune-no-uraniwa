<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第一次世界的カナン復帰路程の失敗</title>

  <text x="34" y="37.5" font-size="30" dominant-baseline="central" textLength="27" lengthAdjust="spacing">3.</text>
  <text x="70" y="37.5" font-size="30" dominant-baseline="central" textLength="505" lengthAdjust="spacing">第一次世界的カナン復帰路程の失敗</text>
  <line x1="70" y1="56" x2="574" y2="56" stroke="currentColor" stroke-width="2.4"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="207.5,130 215,142 210.2,142 210.2,163 204.8,163 204.8,142 200,142"/>
    <polygon points="207.5,218 215,231 210.2,231 210.2,265 204.8,265 204.8,231 200,231"/>
    <polygon points="291,292.5 303,284.5 303,289.7 541,289.7 541,295.3 303,295.3 303,300.5"/>
    <polygon points="413.5,203 429.5,215 421.5,215 421.5,226.5 405.5,226.5 405.5,215 397.5,215"/>
  </g>

  <!-- 神・イエス -->
  <circle cx="207.5" cy="97.5" r="28.3" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <text x="205" y="97.5" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>
  <ellipse cx="208" cy="189" rx="59.8" ry="25.8" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <text x="207" y="190" font-size="29" text-anchor="middle" dominant-baseline="central" textLength="86" lengthAdjust="spacing">イエス</text>

  <!-- 洗礼ヨハネからイエスへの × -->
  <path d="M194,234 L222,256 M222,234 L194,256" stroke="currentColor" stroke-width="5"/>

  <!-- 洗礼ヨハネ・ユダヤ民族 -->
  <g stroke="currentColor" stroke-width="2.4">
    <ellipse cx="207" cy="290.5" rx="70.8" ry="26.3" fill="#F8F28F"/>
    <ellipse cx="612.5" cy="292.5" rx="71.3" ry="26.3" fill="#F86D42"/>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="206.5" y="291" textLength="112" lengthAdjust="spacing">洗礼ヨハネ</text>
    <text x="612.5" y="292" textLength="112" lengthAdjust="spacing">ユダヤ民族</text>
  </g>

  <!-- メシヤのための基台：× -->
  <rect x="239.5" y="113.5" width="350" height="40" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="253" y="134" textLength="259" lengthAdjust="spacing">メシヤのための基台</text>
    <text x="526" y="134" text-anchor="middle">：</text>
  </g>
  <path d="M551.5,124.5 L569.5,142.5 M569.5,124.5 L551.5,142.5" stroke="#111" stroke-width="5"/>
  <text x="414" y="178" font-size="23" text-anchor="middle" dominant-baseline="central" textLength="231" lengthAdjust="spacing">（二次、三次まで延長）</text>

  <!-- 実体基台：× -->
  <rect x="321.5" y="239.5" width="191" height="39.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central">
    <text x="335" y="259" textLength="103" lengthAdjust="spacing">実体基台</text>
    <text x="451.5" y="259" text-anchor="middle">：</text>
  </g>
  <path d="M473.5,250.5 L490.5,267.5 M490.5,250.5 L473.5,267.5" stroke="currentColor" stroke-width="5"/>

  <!-- 下の説明 -->
  <g font-size="23" dominant-baseline="central">
    <text x="139" y="341.5" textLength="207" lengthAdjust="spacing">アベルの位置離れる</text>
    <text x="127" y="371.5" textLength="301" lengthAdjust="spacing">（イエスを疑い、エリヤ否認）</text>
    <text x="526" y="343" textLength="162" lengthAdjust="spacing">イエスに逆らう</text>
  </g>
</svg>
