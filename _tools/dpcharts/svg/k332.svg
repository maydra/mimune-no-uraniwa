<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(2) 実体基台　㋑ モーセを中心とする実体基台</title>

  <!-- 題 -->
  <text x="49" y="37.5" font-size="30" dominant-baseline="central" textLength="41" lengthAdjust="spacingAndGlyphs">(2)</text>
  <text x="104" y="37.5" font-size="31" dominant-baseline="central" textLength="121" lengthAdjust="spacing">実体基台</text>
  <circle cx="80" cy="81.5" r="12.3" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="80.5" y="82" font-size="18" text-anchor="middle" dominant-baseline="central">イ</text>
  <text x="105" y="81.5" font-size="28" dominant-baseline="central" textLength="371" lengthAdjust="spacing">モーセを中心とする実体基台</text>
  <g stroke="currentColor" stroke-width="2">
    <line x1="102" y1="56.5" x2="227" y2="56.5"/>
    <line x1="103" y1="99.5" x2="478" y2="99.5"/>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="194,177.5 201.5,189.5 197.5,189.5 197.5,296 190.5,296 190.5,189.5 186.5,189.5"/>
    <polygon points="251.5,319.5 263.5,311.5 263.5,316.5 550,316.5 550,322.5 263.5,322.5 263.5,327.5"/>
    <polygon points="390.5,215.5 409.5,227.5 397.5,227.5 397.5,235.5 383.5,235.5 383.5,227.5 371.5,227.5"/>
  </g>

  <!-- 神 -->
  <circle cx="195" cy="143.5" r="28.3" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="194.5" y="143.5" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 幕屋を信奉 -->
  <g font-size="22" dominant-baseline="central">
    <text x="117" y="224.5" textLength="66" lengthAdjust="spacing">幕屋を</text>
    <text x="117" y="253" textLength="45" lengthAdjust="spacing">信奉</text>
  </g>

  <!-- 幕屋のための基台・実体基台 -->
  <rect x="266.8" y="155" width="255.2" height="49.2" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <rect x="238.7" y="249.7" width="311.8" height="49.8" fill="#FCE5E3" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="280" y="179.5" textLength="224" lengthAdjust="spacing">幕屋のための基台</text>
    <text x="254" y="274" textLength="281" lengthAdjust="spacing">幕屋のための実体基台</text>
  </g>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="194.5" cy="318.5" rx="50.5" ry="24.5" fill="#F8F28F"/>
    <ellipse cx="618" cy="319.5" rx="70" ry="31.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="195.5" y="317.5" font-size="26" textLength="71" lengthAdjust="spacing">モーセ</text>
    <text x="619.5" y="307.5" font-size="24" textLength="96" lengthAdjust="spacing">イスラエル</text>
    <text x="616.5" y="334" font-size="24" textLength="48" lengthAdjust="spacing">民族</text>
  </g>

  <text x="345" y="345.5" font-size="27" dominant-baseline="central" textLength="114" lengthAdjust="spacing">従順屈伏</text>

  <g font-size="28" dominant-baseline="central">
    <text x="194" y="393" textLength="55" lengthAdjust="spacing">偵察</text>
    <text x="258" y="393" textLength="28" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="298" y="393" textLength="313" lengthAdjust="spacing">日に侵入したサタン分立</text>
  </g>
</svg>
