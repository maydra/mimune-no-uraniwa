    <text x="573.75" y="208.75">男性</text>
    <text x="573.75" y="309.25">雄</text>
    <text x="573.75" y="408.75" font-size="36" textLength="110" lengthAdjust="spacing">雄しべ</text>
    <text x="573.75" y="509.25">陽性</text>
    <text x="573.75" y="609.75">陽性</text>

