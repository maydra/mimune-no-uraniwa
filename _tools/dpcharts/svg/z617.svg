<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス ≠ 神御自身（ロマ 8:34・マタイ 27:46・ヨハネ 17:1）</title>

  <!-- 行頭の● -->
  <circle cx="219.5" cy="91" r="13"/>
  <circle cx="219.5" cy="189" r="13"/>
  <circle cx="219.5" cy="340" r="13"/>
  <circle cx="219.5" cy="442" r="13"/>

  <g font-size="45" dominant-baseline="central">
    <text y="91.5"><tspan x="243.6" textLength="90" lengthAdjust="spacing">ロマ</tspan> <tspan x="344.8" textLength="94.1" lengthAdjust="spacingAndGlyphs">8:34</tspan>　<tspan x="485.4" textLength="135.6" lengthAdjust="spacing">イエス</tspan><tspan x="620.8" textLength="228.3" lengthAdjust="spacing">は神に祈祷</tspan></text>
    <text y="189.5"><tspan x="244.6" textLength="131.3" lengthAdjust="spacingAndGlyphs">マタイ</tspan> <tspan x="390.1" textLength="117.5" lengthAdjust="spacingAndGlyphs">27:46</tspan>　<tspan x="552.4" textLength="273.8" lengthAdjust="spacing">神を父と呼ぶ</tspan></text>
    <text y="247"><tspan x="245.5" textLength="135" lengthAdjust="spacing">ヨハネ</tspan> <tspan x="392.2" textLength="92" lengthAdjust="spacingAndGlyphs">17:1</tspan></text>
    <text y="341.5"><tspan x="243.1" textLength="135.2" lengthAdjust="spacing">サタン</tspan><tspan x="381.1" textLength="136.2" lengthAdjust="spacing">の試練</tspan><tspan x="516.4">、</tspan><tspan x="564.1" textLength="135.2" lengthAdjust="spacing">サタン</tspan><tspan x="701.8" textLength="227.1" lengthAdjust="spacing">に追われる</tspan></text>
    <text y="439.5"><tspan x="244.6" textLength="131.3" lengthAdjust="spacingAndGlyphs">マタイ</tspan> <tspan x="390.1" textLength="117.5" lengthAdjust="spacingAndGlyphs">27:46</tspan>　<tspan x="554.7" textLength="546.8" lengthAdjust="spacing">どうしてわたしをお見捨て</tspan></text>
    <text x="552.8" y="494.5" textLength="365.5" lengthAdjust="spacing">になったのですか</text>
  </g>

  <!-- イエス ≠ 神御自身（≠ は字ではなく線で描く） -->
  <rect x="378" y="558" width="543.5" height="72.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g fill="#111">
    <text y="594.5" font-size="49" dominant-baseline="central"><tspan x="426.4" textLength="147.9" lengthAdjust="spacing">イエス</tspan> <tspan x="675.4" textLength="197.3" lengthAdjust="spacing">神御自身</tspan></text>
    <rect x="596" y="586" width="55" height="7"/>
    <rect x="596" y="599" width="55" height="7"/>
  </g>
  <line x1="609.9" y1="568.4" x2="634.7" y2="620.6" stroke="#111" stroke-width="6.5"/>
</svg>
