  </g>
  <!-- 大陸の海岸線と国境 -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M122,206 134,195 139,193 153,195 159,198 162,204 162,208 154,216 152,220 143,225 141,232 136,233 138,237 145,239 146,241 142,247 136,248 131,251 133,255 154,247 163,238 167,238 178,232 185,230 193,230 197,228 209,228 214,226"/>
    <path d="M360,160 363,161 367,159 368,151 376,152 381,147 380,145 387,137 388,133"/>
  </g>
  <!-- 38度線（太い線） -->
  <path d="M216,290.5 224,292 236,295.5 248,297 257,295 263,291 268,286 272,281 276,277.5 304,277.5 308,273 309,267 316,264 325,262" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <g font-size="25" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="261.5" y="222" textLength="51" lengthAdjust="spacing">共産</text>
    <text x="300" y="332" textLength="48" lengthAdjust="spacing">民主</text>
  </g>
  <g font-size="27" dominant-baseline="central">
    <text x="336" y="259" textLength="30" lengthAdjust="spacingAndGlyphs">38</text>
    <text x="368" y="259" textLength="59" lengthAdjust="spacing">度線</text>
  </g>

  <!-- 民族的供え物 -->
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="516.5" y="157" textLength="85" lengthAdjust="spacing">民族的</text>
    <text x="516" y="191.5" textLength="86" lengthAdjust="spacing">供え物</text>
  </g>

  <!-- 灰色の線（楕円と円の下に描く） -->
  <g stroke="#8C949A" stroke-width="7">
    <line x1="566" y1="244.1" x2="645" y2="192.75"/>
    <line x1="566" y1="278.55" x2="645" y2="331.9"/>
  </g>

  <!-- カインとアベル -->
  <path d="M444.5,261.5 A72,42 0 0 1 588.5,261.5 Z" fill="#F86D42"/>
  <path d="M444.5,261.5 A72,42 0 0 0 588.5,261.5 Z" fill="#F8F28F"/>
  <ellipse cx="516.5" cy="261.5" rx="72" ry="42" fill="none" stroke="currentColor" stroke-width="3"/>
  <line x1="444.5" y1="260.5" x2="588.5" y2="260.5" stroke="#111" stroke-width="3.5"/>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="515" y="240" textLength="92" lengthAdjust="spacing">カイン</text>
    <text x="517" y="279" textLength="96" lengthAdjust="spacing">アベル</text>
  </g>

  <!-- サと神 -->
  <circle cx="655.5" cy="192.5" r="23.5" fill="#50403D" stroke="currentColor" stroke-width="2"/>
  <circle cx="655.5" cy="332.5" r="23.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2"/>
  <g font-size="29" text-anchor="middle" dominant-baseline="central">
    <text x="655.5" y="192.5" fill="#fff">サ</text>
    <text x="655.5" y="332.5">神</text>
  </g>

  <g font-size="27" dominant-baseline="central">
    <text x="608" y="245.5" textLength="85" lengthAdjust="spacing">分けて</text>
    <text x="608" y="279.5" textLength="84" lengthAdjust="spacing">立てる</text>
  </g>
</svg>
