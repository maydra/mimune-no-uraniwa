<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 信仰のための戒めを下さった目的</title>

  <text x="61" y="57.5" font-size="48" dominant-baseline="central">Ⅱ.</text>
  <text x="132" y="57.5" font-size="48" dominant-baseline="central" textLength="751" lengthAdjust="spacing">信仰のための戒めを下さった目的</text>
  <line x1="132" y1="87.5" x2="882" y2="87.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 成長の矢印（灰色の面と縁） -->
  <polygon points="612.5,250.5 679.5,321 644.5,321 644.5,553.5 579.5,553.5 579.5,321 545,321" fill="#C4CCD3" stroke="currentColor" stroke-width="4"/>
  <g fill="#8C949A">
    <rect x="550" y="358.5" width="121" height="10"/>
    <rect x="550" y="452.5" width="121" height="10"/>
  </g>

  <circle cx="614" cy="194" r="53" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g stroke="currentColor">
    <line x1="486" y1="250" x2="748" y2="250" stroke-width="9"/>
    <line x1="480" y1="553.5" x2="743" y2="553.5" stroke-width="8"/>
  </g>

  <!-- 天使長の非原理的な愛の力（矢印の面の上は #111） -->
  <rect x="498" y="355.5" width="81.5" height="13"/>
  <polygon points="579.5,355.5 584,355.5 584,345 616,362 584,379 584,368.5 579.5,368.5" fill="#111"/>

  <!-- 堕落の可能性（点線の矢印。最初の一つは矢印の面の上） -->
  <line x1="616.2" y1="364.7" x2="635.1" y2="379.5" stroke="#111" stroke-width="10.5"/>
  <line x1="644.5" y1="386.9" x2="865.4" y2="560" stroke="currentColor" stroke-width="10.5" stroke-dasharray="24 12"/>
  <polygon points="873.5,549.4 886.3,576.9 857.3,570.6"/>

  <rect x="780" y="369" width="137.5" height="75" rx="9" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>

  <!-- アダムとエバ -->
  <path d="M607,560 A93,39.5 0 0 0 519,599.5 A93,39.5 0 0 0 617,639 C642,634 648,607 612,599.5 C576,592 582,565 607,560 Z" fill="#F98AEE"/>
  <path d="M607,560 A93,39.5 0 0 1 705,599.5 A93,39.5 0 0 1 617,639 C642,634 648,607 612,599.5 C576,592 582,565 607,560 Z" fill="#A0F08A"/>
  <path d="M607,560 C582,565 576,592 612,599.5 C648,607 642,634 617,639" fill="none" stroke="#111" stroke-width="4"/>
  <ellipse cx="612" cy="599.5" rx="93" ry="39.5" fill="none" stroke="currentColor" stroke-width="4"/>
  <g font-size="42" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="559" y="600">ア</text>
    <text x="664" y="598">エ</text>
  </g>

  <text x="613" y="194" font-size="60" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="44" dominant-baseline="central">
    <text x="290" y="154" textLength="184" lengthAdjust="spacing">神の直接</text>
    <text x="290" y="216" textLength="92" lengthAdjust="spacing">主管</text>
    <text x="797" y="619.5" textLength="281" lengthAdjust="spacing">堕落の可能性</text>
  </g>
  <g font-size="40" dominant-baseline="central">
    <text x="293" y="348.5" textLength="168" lengthAdjust="spacing">天使長の</text>
    <text x="293" y="400" textLength="209" lengthAdjust="spacing">非原理的な</text>
    <text x="293" y="451" textLength="125" lengthAdjust="spacing">愛の力</text>
  </g>
  <text x="797" y="407" font-size="52" dominant-baseline="central" textLength="104" lengthAdjust="spacing">戒め</text>
</svg>
