<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『今日のキリスト教国家』</title>

  <g font-size="46" dominant-baseline="central">
    <text x="227" y="69" text-anchor="end">『</text>
    <text x="227" y="69" textLength="460" lengthAdjust="spacing">今日のキリスト教国家</text>
    <text x="685.5" y="69">』</text>
  </g>

  <!-- 箇条 -->
  <circle cx="211.5" cy="158" r="11"/>
  <circle cx="211.5" cy="336.5" r="11"/>
  <polygon points="241,256 257.5,256 257.5,245 279.5,265.5 257.5,286 257.5,275.5 241,275.5" fill="#8C949A"/>
  <g font-size="41.5" dominant-baseline="central">
    <text x="239.7" y="158" textLength="458.7" lengthAdjust="spacing">皮膚の色が違う兄弟たち</text>
    <text x="719.5" y="158" text-anchor="middle">：</text>
    <text x="740.1" y="158" textLength="333.6" lengthAdjust="spacing">生活を同じくする</text>
    <text x="740.1" y="211.5" textLength="291.9" lengthAdjust="spacing">ことができない</text>
    <text x="303.2" y="266" textLength="457.6" lengthAdjust="spacing">み言の実践力が失われる</text>
    <text x="240.2" y="337" textLength="83.4" lengthAdjust="spacing">淫乱</text>
    <text x="344.5" y="337" text-anchor="middle">：</text>
    <text x="365.3" y="337" textLength="500.4" lengthAdjust="spacing">淪落を防ぐことができない</text>
  </g>

  <polygon points="636.5,400 669.5,400 669.5,429 690,429 653.5,467.5 617,429 636.5,429" fill="#8C949A"/>

  <rect x="402" y="481" width="509" height="172" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="41.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="657" y="536" textLength="457.6" lengthAdjust="spacing">現代人類の救いの摂理に</text>
    <text x="656.6" y="598" textLength="332.8" lengthAdjust="spacing">おいて無能な立場</text>
  </g>
</svg>
