<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>新しい歴史の賛同者となるためには</title>

  <rect x="218.5" y="144.5" width="862.5" height="85.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="252" y="190" font-size="49" dominant-baseline="central" fill="#111" textLength="797" lengthAdjust="spacing">新しい歴史の賛同者となるためには</text>

  <!-- 黒丸 -->
  <g>
    <circle cx="240.5" cy="302.5" r="12"/>
    <circle cx="240.5" cy="415" r="12"/>
    <circle cx="240.5" cy="521.5" r="12"/>
  </g>
  <g font-size="45" dominant-baseline="central">
    <text x="267" y="304.5" textLength="779" lengthAdjust="spacing">新しい歴史の中心を探しださなければ</text>
    <text x="268" y="413" textLength="778" lengthAdjust="spacing">古い時代の環境に執着してはならない</text>
    <text x="267" y="521" textLength="687" lengthAdjust="spacing">新しい時代の摂理に従わなければ</text>
  </g>
</svg>
