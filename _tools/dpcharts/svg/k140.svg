<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 信仰基台　1. 信仰基台を復帰すべき中心人物</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="49" y="36" text-anchor="middle">Ⅰ</text>
    <text x="64" y="36">.</text>
    <text x="81" y="36" textLength="126" lengthAdjust="spacing">信仰基台</text>
    <text x="47" y="83">1.</text>
    <text x="83" y="83" textLength="405" lengthAdjust="spacing">信仰基台を復帰すべき中心人物</text>
  </g>
  <g stroke="currentColor" stroke-width="2.6">
    <line x1="81" y1="55" x2="206" y2="55"/>
    <line x1="83" y1="101" x2="488" y2="101"/>
  </g>

  <!-- 蕩減条件の矢印 -->
  <text x="400" y="155" font-size="29" text-anchor="middle" dominant-baseline="central" textLength="114" lengthAdjust="spacing">蕩減条件</text>
  <polygon points="319,179 477,179 477,172 495.5,182.5 477,193 477,186 319,186" fill="#8C949A"/>

  <!-- ノアとアブラハム -->
  <g stroke="currentColor" stroke-width="2.2" fill="#F8F28F">
    <ellipse cx="229.5" cy="179.5" rx="65" ry="36"/>
    <ellipse cx="587.5" cy="177" rx="70" ry="37"/>
  </g>
  <g dominant-baseline="central" text-anchor="middle" fill="#111">
    <text x="229.5" y="180" font-size="31" textLength="60" lengthAdjust="spacing">ノア</text>
    <text x="586.5" y="175.5" font-size="29" textLength="114" lengthAdjust="spacingAndGlyphs">アブラハム</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="145" cy="246" r="7.5"/>
    <circle cx="145" cy="338.5" r="7.5"/>
    <circle cx="501" cy="246.5" r="7.5"/>
    <circle cx="501" cy="338.5" r="7.5"/>
  </g>
  <line x1="257" y1="246.5" x2="286" y2="246.5" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="29" dominant-baseline="central">
    <text x="160" y="246" textLength="83" lengthAdjust="spacing">アダム</text>
    <text x="305" y="246" textLength="53" lengthAdjust="spacing">ノア</text>
    <text x="161" y="286.5" font-size="27" textLength="219" lengthAdjust="spacing">(10 代、審判 40 日)</text>
    <text x="159" y="338.5" textLength="135" lengthAdjust="spacing">信仰の祖、</text>
    <text x="158" y="378" textLength="201" lengthAdjust="spacing">次子ハムの立場</text>
    <text x="518" y="246" textLength="110" lengthAdjust="spacing">ノアから</text>
    <text x="517" y="286.5" font-size="27" textLength="166" lengthAdjust="spacing">10 代、400 年</text>
    <text x="517" y="338.5" textLength="163" lengthAdjust="spacing">信仰と忠誠、</text>
    <text x="517" y="378" textLength="142" lengthAdjust="spacing">テラの長子</text>
  </g>
</svg>
