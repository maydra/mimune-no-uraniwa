<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑦ ルカ 17:23</title>

  <!-- ⑦ ルカ 17:23 -->
  <g font-size="26" dominant-baseline="central">
    <text x="33" y="38">⑦</text>
    <text x="71" y="38" textLength="54" lengthAdjust="spacing">ルカ</text>
    <text x="137" y="38" textLength="70" lengthAdjust="spacing">17:23</text>
  </g>

  <!-- 聖句 -->
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="139" y="124" textLength="514" lengthAdjust="spacing">「人々はあなたがたに、『見よ、あそこに』</text>
    <text x="154" y="160.5" textLength="497" lengthAdjust="spacing">『見よ、ここに』と言うだろう。しかし、</text>
    <text x="152" y="197.5" textLength="462" lengthAdjust="spacing">そちらへ行くな、彼らのあとを追うな」</text>
  </g>

  <!-- 地上誕生 -->
  <ellipse cx="213.75" cy="319.5" rx="87.25" ry="31.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="213.5" y="320" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="124" lengthAdjust="spacing">地上誕生</text>

  <g font-size="27" dominant-baseline="central">
    <text x="318" y="266.5" textLength="314" lengthAdjust="spacing">信徒たちは啓示を受ける</text>
    <text x="320" y="303" textLength="188" lengthAdjust="spacing">ようになるが、</text>
    <text x="320" y="340" textLength="312" lengthAdjust="spacing">自らを再臨主と自称する</text>
    <text x="320" y="377" textLength="138" lengthAdjust="spacing">ようになる</text>
  </g>
</svg>
