<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>エジプト苦役時代とローマ帝国迫害時代　① ② サタン分立生活</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="128.5" y="82.5" width="278" height="55" rx="8"/>
    <rect x="413.5" y="82.5" width="278" height="55" rx="8"/>
  </g>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="153" y="109" textLength="230" lengthAdjust="spacing">エジプト苦役時代</text>
    <text x="428" y="109" textLength="250" lengthAdjust="spacing">ローマ帝国迫害時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3">
    <rect x="130.5" y="143.5" width="276" height="217" rx="8"/>
    <rect x="414.5" y="143.5" width="276" height="217" rx="8"/>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central">
    <text x="153" y="163">①</text>
    <text x="437" y="163">②</text>
  </g>

  <g font-size="27" dominant-baseline="central">
    <text x="156" y="206" textLength="183" lengthAdjust="spacing">サタン分立生活</text>
    <text x="428" y="206" textLength="183" lengthAdjust="spacing">サタン分立生活</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="161" cy="244" r="5.5"/>
    <circle cx="161" cy="281" r="5.5"/>
    <circle cx="161" cy="318.5" r="5.5"/>
    <circle cx="433" cy="243" r="5.5"/>
    <circle cx="433" cy="281" r="5.5"/>
    <circle cx="433" cy="318" r="5.5"/>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="174" y="243" textLength="51" lengthAdjust="spacing">割礼</text>
    <text y="279.5"><tspan x="173" textLength="153" lengthAdjust="spacing">犠牲をささげ</tspan><tspan x="327">、</tspan></text>
    <text x="174" y="316.5" textLength="154" lengthAdjust="spacing">安息日を守る</text>
    <text y="243"><tspan x="445" textLength="78" lengthAdjust="spacing">聖餐式</tspan><tspan x="522">、</tspan><tspan x="550" textLength="52" lengthAdjust="spacing">洗礼</tspan></text>
    <text x="444" y="279.5" font-size="24" textLength="236" lengthAdjust="spacingAndGlyphs">信徒自身をいけにえの供え物</text>
    <text x="445" y="316.5" textLength="155" lengthAdjust="spacing">安息日を守る</text>
  </g>
</svg>
