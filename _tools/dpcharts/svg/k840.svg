<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>十字架までのイスラエル選民は？</title>

  <text x="35" y="37.5" font-size="30" dominant-baseline="central" textLength="466" lengthAdjust="spacing">十字架までのイスラエル選民は？</text>
  <line x1="34" y1="56" x2="507" y2="56" stroke="currentColor" stroke-width="2.5"/>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="2.5">
    <rect x="276" y="75" width="140" height="42"/>
    <rect x="477" y="75" width="204" height="42"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="345.5" y="96" textLength="114" lengthAdjust="spacing">選民資格</text>
    <text x="578" y="96.5" textLength="171" lengthAdjust="spacing">選民資格喪失</text>
  </g>

  <!-- 下への矢印 -->
  <g fill="#8C949A">
    <polygon points="184,181 189,181 189,197 193.5,197 186.5,209.5 179.5,197 184,197"/>
    <polygon points="184,297 189,297 189,314 194,314 186.5,327 179,314 184,314"/>
  </g>

  <!-- 楕円 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3">
    <ellipse cx="187" cy="148.5" rx="65.5" ry="31.5"/>
    <ellipse cx="186.5" cy="255" rx="65.5" ry="42"/>
    <ellipse cx="187" cy="360" rx="65.5" ry="31"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="187.5" y="148.5" font-size="24" textLength="109" lengthAdjust="spacingAndGlyphs">ヤコブの子孫</text>
    <text x="187" y="239" font-size="24" textLength="80" lengthAdjust="spacingAndGlyphs">モーセに</text>
    <text x="188.5" y="266.5" font-size="24" textLength="103" lengthAdjust="spacingAndGlyphs">従った子孫</text>
    <text x="187.5" y="359" font-size="28" textLength="102" lengthAdjust="spacingAndGlyphs">南朝ユダ</text>
    <text x="183" y="406" font-size="21" textLength="99" lengthAdjust="spacing">(ユダヤ人)</text>
  </g>

  <!-- ： -->
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="267" y="146">：</text>
    <text x="267" y="253">：</text>
    <text x="267" y="360">：</text>
  </g>

  <!-- 横の矢印 -->
  <g fill="#8C949A">
    <polygon points="442,145.5 464,145.5 464,141.5 474,148 464,154.5 464,150.5 442,150.5"/>
    <polygon points="442,255 464,255 464,251 474,257.5 464,264 464,260 442,260"/>
    <polygon points="442,357 464,357 464,353 474,359.5 464,366 464,362 442,362"/>
  </g>

  <g font-size="27" dominant-baseline="central">
    <text x="283" y="146" textLength="128" lengthAdjust="spacing">出エジプト</text>
    <text x="283" y="180" textLength="74" lengthAdjust="spacing">のとき</text>
    <text x="283" y="253" textLength="112" lengthAdjust="spacing">カナンに</text>
    <text x="283" y="359.5" font-size="25" textLength="145" lengthAdjust="spacingAndGlyphs">イエスを迎える</text>

    <text x="488" y="149" textLength="144" lengthAdjust="spacing">荒野で反逆</text>
    <text x="488" y="251" textLength="202" lengthAdjust="spacing">北朝イスラエル</text>
    <text x="488" y="292" textLength="109" lengthAdjust="spacing">神に背く</text>
    <text x="488" y="360" font-size="26" textLength="201" lengthAdjust="spacing">十字架に引き渡す</text>
  </g>
</svg>
