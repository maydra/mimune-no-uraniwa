  <rect x="123.5" y="307.5" width="572" height="45" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="141" y="330.5" font-size="23" dominant-baseline="central" textLength="536" lengthAdjust="spacing" fill="#111">パンで飢えをしのぐようになれば、サタンが石を所有</text>
