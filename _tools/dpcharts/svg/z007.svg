<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人間の矛盾性と堕落</title>

  <text x="50" y="79" font-size="48" textLength="450" lengthAdjust="spacing">人間の矛盾性と堕落</text>
  <line x1="50" y1="90" x2="500" y2="90" stroke="currentColor" stroke-width="3.5"/>

  <!-- 本心・邪心のハート -->
  <path d="M654,228 C640,216 616,188 592,188 C564,188 548,212 548,252 C548,317 584,362 654,380 Z" fill="#fff" class="paper"/>
  <path d="M654,228 C668,216 692,188 716,188 C744,188 760,212 760,252 C760,317 724,362 654,380 Z" fill="#50403D"/>
  <path d="M654,228 C640,216 616,188 592,188 C564,188 548,212 548,252 C548,317 584,362 654,380 C724,362 760,317 760,252 C760,212 744,188 716,188 C692,188 668,216 654,228 Z M654,228 L654,380" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  <g font-size="58" text-anchor="middle" dominant-baseline="central">
    <text x="610" y="252">本</text>
    <text x="610" y="314">心</text>
    <text x="702" y="250" fill="#fff">邪</text>
    <text x="702" y="313.5" fill="#fff">心</text>
  </g>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="301.5,283 323,268.5 323,275.5 354,275.5 354,290.5 323,290.5 323,297.5"/>
    <polygon points="462.5,283 484,268.5 484,275.5 515,275.5 515,290.5 484,290.5 484,297.5"/>
    <polygon points="797,275.5 828,275.5 828,268.5 849,283 828,297.5 828,290.5 797,290.5"/>
    <polygon points="949,275.5 980,275.5 980,268.5 1001,283 980,297.5 980,290.5 949,290.5"/>
    <polygon points="639.5,491 661.5,491 661.5,511 674,511 650.5,527.5 627,511 639.5,511"/>
  </g>

  <!-- 縦書き -->
  <g font-size="56" text-anchor="middle" dominant-baseline="central">
    <text x="254.5" y="260.5">幸</text>
    <text x="254.5" y="319">福</text>
    <text x="1043.5" y="255">不</text>
    <text x="1043.5" y="313.5">幸</text>
  </g>
  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="409.5" y="202">善</text>
    <text x="409.5" y="254">の</text>
    <text x="409.5" y="302.5">欲</text>
    <text x="409.5" y="352">望</text>
    <text x="894" y="204">悪</text>
    <text x="894" y="254">の</text>
    <text x="894" y="303.5">欲</text>
    <text x="894" y="353">望</text>
  </g>

  <!-- 矛盾性 → 破滅状態 -->
  <rect x="563.5" y="405.5" width="177" height="65" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.5"/>
  <text x="578" y="441" font-size="47" dominant-baseline="central" textLength="144" lengthAdjust="spacing">矛盾性</text>
  <text x="540.5" y="583.5" font-size="52" dominant-baseline="central" textLength="214" lengthAdjust="spacing">破滅状態</text>
</svg>
