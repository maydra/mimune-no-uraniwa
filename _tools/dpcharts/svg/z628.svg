<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス＝父</title>

  <!-- イエス = 父 -->
  <g stroke="currentColor" stroke-width="4" fill="#F98AEE">
    <ellipse cx="452" cy="106" rx="126" ry="58"/>
    <ellipse cx="838.5" cy="101.5" rx="121.5" ry="54.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="449.5" y="103.5" font-size="55" textLength="171" lengthAdjust="spacing">イエス</text>
    <text x="838.5" y="101" font-size="60">父</text>
  </g>
  <rect x="607" y="89" width="78" height="9"/>
  <rect x="607" y="111" width="78" height="9.5"/>

  <!-- 聖句 -->
  <circle cx="226.5" cy="241.5" r="12"/>
  <circle cx="226.5" cy="400.5" r="12"/>
  <circle cx="226.5" cy="497.5" r="12"/>
  <circle cx="226.5" cy="596" r="12"/>
  <g font-size="46" dominant-baseline="central">
    <text y="241"><tspan x="254" textLength="131" lengthAdjust="spacingAndGlyphs">ペテロ</tspan><tspan x="420" text-anchor="middle">Ⅰ</tspan> <tspan x="448" textLength="64" lengthAdjust="spacingAndGlyphs">1:3</tspan></text>
    <text y="399"><tspan x="258" textLength="161" lengthAdjust="spacingAndGlyphs">コリント</tspan><tspan x="452" text-anchor="middle">Ⅰ</tspan> <tspan x="476" textLength="110" lengthAdjust="spacingAndGlyphs">15:45</tspan></text>
    <text y="496.5"><tspan x="255" textLength="133" lengthAdjust="spacingAndGlyphs">イザヤ</tspan> <tspan x="400" textLength="68" lengthAdjust="spacingAndGlyphs">9:6</tspan></text>
    <text y="595"><tspan x="257" textLength="128" lengthAdjust="spacingAndGlyphs">マタイ</tspan> <tspan x="403" textLength="110" lengthAdjust="spacingAndGlyphs">16:27</tspan></text>
  </g>
  <g font-size="48" dominant-baseline="central">
    <text x="636" y="240" textLength="461" lengthAdjust="spacing">わたしたちを新たに</text>
    <text y="301"><tspan x="635" textLength="246" lengthAdjust="spacing">生れさせて</tspan><tspan x="887" textLength="46" lengthAdjust="spacingAndGlyphs">…</tspan></text>
    <text x="635" y="396.5" textLength="248" lengthAdjust="spacing">後のアダム</text>
    <text x="635" y="494.5" textLength="199" lengthAdjust="spacing">永遠の父</text>
    <text x="635" y="592.5" textLength="199" lengthAdjust="spacing">父の栄光</text>
  </g>
</svg>
