<h1>エステル記 第10章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>アハシュエロス王はその国および海に沿った国々にみつぎを課した。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>彼の権力と勢力によるすべての事業、および王がモルデカイを高い地位にのぼらせた事の詳しい話はメデアとペルシャの王たちの日誌の書にしるされているではないか。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>ユダヤ人モルデカイはアハシュエロス王に次ぐ者となり、ユダヤ人の中にあって大いなる者となり、その多くの兄弟に喜ばれた。彼はその民の幸福を求め、すべての国民に平和を述べたからである。</p>
