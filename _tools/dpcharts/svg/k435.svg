<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>メシヤのための霊的な基台：霊的メシヤが霊的子女を立てる</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="284.5,77 298,69.5 298,73.5 520,73.5 520,80.5 298,80.5 298,84.5"/>
    <polygon points="215,164.5 223,150.5 218.5,150.5 218.5,104 211.5,104 211.5,150.5 207,150.5"/>
    <polygon points="308,201 322,193 322,197.5 523,197.5 523,204.5 322,204.5 322,209"/>
    <polygon points="402,328 420,328 420,339.5 429.5,339.5 411,351.5 392.5,339.5 402,339.5"/>
    <polygon points="381,374 429,374 429,368.5 445,378 429,387.5 429,382 381,382"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="215.5" cy="76.5" rx="61.5" ry="26.5" fill="#F8F28F"/>
    <ellipse cx="602.75" cy="76.5" rx="83.25" ry="28.5" fill="#CF921C"/>
    <ellipse cx="215.5" cy="201.75" rx="85.5" ry="26.75" fill="#F8F28F"/>
    <ellipse cx="604" cy="201.75" rx="81" ry="34.75" fill="#F86D42"/>
  </g>
  <ellipse cx="571.5" cy="202" rx="46" ry="27" fill="none" stroke="#111" stroke-width="3"/>
  <ellipse cx="604" cy="201.75" rx="81" ry="34.75" fill="none" stroke="currentColor" stroke-width="3"/>

  <g dominant-baseline="central" fill="#111">
    <text x="171" y="76.5" font-size="27" textLength="85" lengthAdjust="spacing">イエス</text>
    <text x="533" y="77" font-size="25" textLength="141" lengthAdjust="spacingAndGlyphs">堕落した人類</text>
    <text x="150.5" y="202" font-size="25.5" textLength="128.5" lengthAdjust="spacing">復活イエス</text>
    <text x="530" y="202" font-size="24.5" textLength="79" lengthAdjust="spacingAndGlyphs">弟子たち</text>
    <text x="623" y="202" font-size="25" textLength="51" lengthAdjust="spacing">信徒</text>
  </g>

  <!-- 矢印の字 -->
  <g dominant-baseline="central">
    <text x="356" y="53.5" font-size="23" textLength="94" lengthAdjust="spacing">子女復帰</text>
    <text x="233" y="129.5" font-size="26" textLength="260" lengthAdjust="spacing">十字架で亡くなられた</text>
    <text y="223.5" font-size="23"><tspan x="351.5" textLength="47" lengthAdjust="spacing">信仰</tspan><tspan x="398">、</tspan><tspan x="423" textLength="46.5" lengthAdjust="spacing">忠節</tspan></text>
  </g>

  <!-- メシヤのための霊的な基台：○ -->
  <rect x="198" y="259" width="431.5" height="47" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="212" y="282.5" font-size="28" dominant-baseline="central" textLength="344" lengthAdjust="spacing" fill="#111">メシヤのための霊的な基台</text>
  <text x="571" y="282.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">：</text>
  <circle cx="598" cy="282.5" r="12.3" fill="none" stroke="#111" stroke-width="3.6"/>

  <!-- 霊的メシヤ → 霊的子女を立てる -->
  <g font-size="25.5" dominant-baseline="central">
    <text x="229" y="378.5" textLength="129" lengthAdjust="spacing">霊的メシヤ</text>
    <text x="466" y="378.5" textLength="207" lengthAdjust="spacing">霊的子女を立てる</text>
  </g>
</svg>
