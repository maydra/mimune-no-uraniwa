  <g stroke="currentColor" stroke-width="9" fill="none" marker-end="url(#z124-k)">
    <path d="M429,428 C417,405 416,370 424,345.5"/>
    <path d="M461,334.5 C468,352 474,395 464.3,420"/>
    <g transform="translate(396.5,-1)">
