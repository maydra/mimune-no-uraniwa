<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスは死ぬために降臨されたのではない</title>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="352" cy="139.5" rx="122" ry="66" fill="#F86D42"/>
    <ellipse cx="352" cy="385" rx="122" ry="66" fill="#F8F28F"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="352" y="139.5" font-size="46">信徒たち</text>
    <text x="352" y="385" font-size="48" textLength="144" lengthAdjust="spacing">イエス</text>
  </g>

  <g font-size="39" dominant-baseline="central">
    <text x="492" y="104" textLength="588" lengthAdjust="spacing">イエスは死の道を行かれるために</text>
    <text x="492" y="157.5" textLength="430" lengthAdjust="spacing">降臨されたと考えていた</text>
    <text x="559" y="243" textLength="497" lengthAdjust="spacing">メシヤの根本目的を知らず</text>
    <text x="491" y="380" textLength="331" lengthAdjust="spacing">人間の無知を慨嘆</text>
    <text x="834" y="380" font-size="37" textLength="182" lengthAdjust="spacingAndGlyphs">(ルカ 18:8)</text>
  </g>
  <polygon points="492,248.5 525,248.5 525,255.5 545.5,244 525,232.5 525,239.5 492,239.5" fill="#8C949A"/>

  <rect x="344.25" y="496.25" width="691.5" height="133.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="45" dominant-baseline="central" fill="#111">
    <text x="372" y="529" textLength="637" lengthAdjust="spacing">イエスは死ぬために降臨された</text>
    <text x="373" y="591.5" textLength="225" lengthAdjust="spacing">のではない</text>
  </g>
</svg>
