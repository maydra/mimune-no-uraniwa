<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. 信仰基台を復帰するための数理的な蕩減期間</title>
  <defs>
    <marker id="k477-a" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="k477-g" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.5" markerHeight="2.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
    <marker id="k477-s" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="35" y="39.5" font-size="29" dominant-baseline="central" textLength="36" lengthAdjust="spacingAndGlyphs">Ⅳ.</text>
  <text x="82" y="39.5" font-size="29" dominant-baseline="central" textLength="521" lengthAdjust="spacingAndGlyphs">信仰基台を復帰するための数理的な蕩減期間</text>
  <line x1="81" y1="58.5" x2="604" y2="58.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 左の箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4">
    <rect x="137.2" y="85.2" width="96.6" height="70.6" rx="6"/>
    <rect x="137.2" y="166.2" width="96.6" height="176.6" rx="9"/>
    <rect x="587.2" y="207.2" width="96.6" height="69.6" rx="6"/>
    <rect x="587.2" y="287.2" width="96.6" height="102.6" rx="7"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" font-weight="400">
    <text x="186.5" y="105" font-size="24" textLength="49" lengthAdjust="spacing">完成</text>
    <text x="186" y="136.5" font-size="24" textLength="49" lengthAdjust="spacing">実体</text>
    <text x="185" y="236" font-size="27" textLength="54" lengthAdjust="spacing">信仰</text>
    <text x="185" y="272.5" font-size="27" textLength="54" lengthAdjust="spacing">基台</text>
    <text x="635.5" y="226" font-size="24" textLength="49" lengthAdjust="spacing">実体</text>
    <text x="635" y="257.5" font-size="24" textLength="49" lengthAdjust="spacing">基台</text>
    <text x="634.5" y="322.5" font-size="24" textLength="49" lengthAdjust="spacing">信仰</text>
    <text x="634.5" y="353.5" font-size="24" textLength="49" lengthAdjust="spacing">基台</text>
  </g>

  <!-- 縦書き -->
  <g font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="256.5" y="184">数</text>
    <text x="256.5" y="208.5">理</text>
    <text x="256.5" y="232">的</text>
    <text x="256.5" y="255">成</text>
    <text x="256.5" y="279.5">長</text>
    <text x="256.5" y="303">期</text>
    <text x="256.5" y="327">間</text>
    <text x="546.5" y="248">数</text>
    <text x="546.5" y="271.5">理</text>
    <text x="546.5" y="295">的</text>
    <text x="546.5" y="318.5">蕩</text>
    <text x="546.5" y="342.5">減</text>
    <text x="546.5" y="366">期</text>
    <text x="546.5" y="390">間</text>
  </g>
  <path d="M563,220 Q571,222 571,238 L571,301 Q571,313 580,315 Q571,317 571,329 L571,395 Q571,409 563,411" fill="none" stroke="currentColor" stroke-width="2.4"/>

  <!-- 段の横線 -->
  <line x1="276" y1="167" x2="523" y2="167" stroke="currentColor" stroke-width="3"/>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="276" y1="222" x2="523" y2="222"/>
    <line x1="276" y1="282.5" x2="523" y2="282.5"/>
    <line x1="276" y1="342" x2="523" y2="342"/>
  </g>

  <!-- 矢印 -->
  <line x1="327.5" y1="223.5" x2="327.5" y2="177.6" stroke="#8C949A" stroke-width="4.4" stroke-dasharray="6 6" marker-end="url(#k477-g)"/>
  <g stroke="currentColor" stroke-width="5" fill="none" marker-end="url(#k477-a)">
    <line x1="327.5" y1="350" x2="327.5" y2="239.3"/>
    <line x1="330.5" y1="224" x2="413.5" y2="365.3"/>
    <line x1="429.6" y1="378" x2="472.1" y2="230.5"/>
    <line x1="474" y1="222" x2="474" y2="178.8"/>
  </g>

  <!-- 神と人間（数理的存在） -->
  <g stroke="currentColor" stroke-width="2.2" fill="none" marker-end="url(#k477-s)">
    <path d="M309.5,125 Q299,113 311,101.5"/>
    <path d="M348,100.5 Q358.5,112 346.5,124.5"/>
    <path d="M452.5,125 Q442,113 454,101.5"/>
    <path d="M491,100.5 Q501.5,112 489.5,124.5"/>
  </g>
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4">
    <circle cx="328.5" cy="86.5" r="19.3"/>
    <circle cx="471.5" cy="86.5" r="19.3"/>
    <ellipse cx="328" cy="144.5" rx="59" ry="18.5"/>
    <ellipse cx="472" cy="144.5" rx="28" ry="18.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="328" y="86" font-size="25">神</text>
    <text x="471.5" y="86.5" font-size="25">神</text>
    <text x="328.5" y="144.5" font-size="21" textLength="82" lengthAdjust="spacing">人間始祖</text>
    <text x="472" y="145" font-size="21" textLength="39" lengthAdjust="spacing">人間</text>
    <text x="399.5" y="75.5" font-size="23" textLength="67" lengthAdjust="spacing">数理的</text>
    <text x="399.5" y="101.5" font-size="23" textLength="45" lengthAdjust="spacing">存在</text>
  </g>

  <!-- 人間始祖と堕落人間 -->
  <g stroke="currentColor" stroke-width="2.4">
    <ellipse cx="328.5" cy="365.5" rx="59.3" ry="19.8" fill="#FCE5E3"/>
    <ellipse cx="429.5" cy="395.5" rx="49.3" ry="22.3" fill="#CF921C"/>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="329.5" y="365.5" textLength="84" lengthAdjust="spacing">人間始祖</text>
    <text x="429.5" y="395" textLength="64" lengthAdjust="spacing">堕・人</text>
  </g>
</svg>
