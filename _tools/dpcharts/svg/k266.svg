<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>モーセがサタンの側を打たなければならない理由</title>

  <!-- 題 -->
  <text x="34" y="38.5" font-size="26" dominant-baseline="central" textLength="565" lengthAdjust="spacing">モーセがサタンの側を打たなければならない理由</text>
  <line x1="32" y1="56.5" x2="597" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 箇条 -->
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="147" y="129.5">①</text>
    <text x="147" y="176">②</text>
    <text x="147" y="254">③</text>
    <text x="147" y="335">④</text>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="164" y="129.5" textLength="473" lengthAdjust="spacing">サタンが侵入した長子の立場を蕩減復帰</text>
    <text x="165" y="176" font-size="25" textLength="527" lengthAdjust="spacing">イスラエル民族がエジプトに対する未練を断つ</text>
    <text x="165" y="207" font-size="25" textLength="125" lengthAdjust="spacing">ようにする</text>
    <text x="165" y="254" textLength="524" lengthAdjust="spacing">モーセが神が送られた人であるということを</text>
    <text x="164" y="288" textLength="133" lengthAdjust="spacing">知らしめる</text>
    <text x="167" y="335" textLength="38" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="213" y="335" textLength="158" lengthAdjust="spacing">年の蕩減期間</text>
    <text x="370" y="335">、</text>
    <text x="397" y="335" textLength="158" lengthAdjust="spacing">その上になお</text>
    <text x="554" y="335">、</text>
    <text x="580" y="335" textLength="25" lengthAdjust="spacingAndGlyphs">30</text>
    <text x="613" y="335" textLength="80" lengthAdjust="spacing">年間の</text>
    <text x="167" y="368.5" textLength="443" lengthAdjust="spacing">苦役の嘆きが神の哀れみを呼び起こす</text>
  </g>
</svg>
