<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. モーセを中心とする復帰摂理の概観</title>
  <text x="49.5" y="38" font-size="31" text-anchor="middle" dominant-baseline="central">Ⅰ</text>
  <text x="65" y="38" font-size="31" dominant-baseline="central">.</text>
  <text x="81" y="38" font-size="31" dominant-baseline="central" textLength="505" lengthAdjust="spacing">モーセを中心とする復帰摂理の概観</text>
  <line x1="80" y1="57" x2="586" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- アブラハム → モーセ -->
  <polygon points="235.5,144 241.5,144 241.5,179 246,179 238.5,191 231,179 235.5,179" fill="#8C949A"/>
  <ellipse cx="239" cy="124" rx="72" ry="24" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="239" y="123" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="115" lengthAdjust="spacingAndGlyphs">アブラハム</text>
  <ellipse cx="239" cy="219" rx="57" ry="24" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="239" y="219" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="84" lengthAdjust="spacingAndGlyphs">モーセ</text>

  <!-- メシヤのための基台 -->
  <rect x="339" y="98" width="299" height="47" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <rect x="339" y="193" width="299" height="47" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="360" y="121.5" font-size="29" dominant-baseline="central" fill="#111" textLength="259" lengthAdjust="spacing">メシヤのための基台</text>
  <text x="360" y="216.5" font-size="29" dominant-baseline="central" fill="#111" textLength="259" lengthAdjust="spacing">メシヤのための基台</text>

  <!-- ＝（縦向き）と ＋ -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="480" y1="249" x2="480" y2="272"/>
    <line x1="492" y1="249" x2="492" y2="272"/>
  </g>
  <g stroke="currentColor" stroke-width="5">
    <line x1="485.5" y1="333" x2="485.5" y2="356"/>
    <line x1="475" y1="344.5" x2="497" y2="344.5"/>
  </g>

  <!-- 実体基台・信仰基台 -->
  <rect x="403" y="282" width="170" height="45" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <rect x="403" y="363" width="170" height="44" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="431" y="304.5" font-size="28" dominant-baseline="central" textLength="114" lengthAdjust="spacing">実体基台</text>
  <text x="431" y="385.5" font-size="28" dominant-baseline="central" textLength="114" lengthAdjust="spacing">信仰基台</text>

  <!-- 箇条 -->
  <circle cx="178" cy="282" r="7"/>
  <circle cx="178" cy="356" r="7"/>
  <text x="191" y="281.5" font-size="26" dominant-baseline="central" textLength="104" lengthAdjust="spacing">中心人物</text>
  <text x="190" y="314" font-size="26" dominant-baseline="central" textLength="77" lengthAdjust="spacing">代わる</text>
  <text x="190" y="356" font-size="26" dominant-baseline="central" textLength="78" lengthAdjust="spacing">民族的</text>
  <text x="189" y="387.5" font-size="26" dominant-baseline="central" textLength="158" lengthAdjust="spacing">範囲へと拡大</text>
</svg>
