  <g text-anchor="middle" dominant-baseline="central">
    <text x="651" y="85.5" font-size="52">神</text>
    <text x="650" y="235" font-size="41" textLength="221.5" lengthAdjust="spacingAndGlyphs" fill="#111">イエスの再臨</text>
    <text x="652" y="368" font-size="41">天宙的</text>
