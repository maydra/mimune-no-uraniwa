<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>石板と幕屋と契約の箱とを下し給うた目的</title>

  <!-- 題 -->
  <text x="34" y="37.5" font-size="30" dominant-baseline="central" textLength="569" lengthAdjust="spacing">石板と幕屋と契約の箱とを下し給うた目的</text>
  <line x1="34" y1="56.5" x2="602" y2="56.5" stroke="currentColor" stroke-width="2.4"/>

  <!-- ① -->
  <g font-size="28" dominant-baseline="central">
    <text x="125" y="134.5">①</text>
    <text x="158.5" y="134.5" textLength="544" lengthAdjust="spacingAndGlyphs">カナン復帰は必然的に成就しなければならない路程</text>
  </g>

  <!-- 箇条（細字） -->
  <circle cx="166" cy="207.5" r="7"/>
  <circle cx="166" cy="268.5" r="7"/>
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="181.5" y="206.5" textLength="432" lengthAdjust="spacing">荒野路程でイスラエル民族の不信</text>
    <text x="181.5" y="269.5" textLength="340" lengthAdjust="spacing">モーセまでが不信の行動？</text>
  </g>

  <!-- ② -->
  <g font-size="28" dominant-baseline="central">
    <text x="125" y="349.5">②</text>
    <text x="158.5" y="349.5" textLength="519" lengthAdjust="spacing">人間は変わっても変わることのできない</text>
    <text x="158" y="387.5" textLength="143" lengthAdjust="spacing">信仰の対象</text>
  </g>
</svg>
