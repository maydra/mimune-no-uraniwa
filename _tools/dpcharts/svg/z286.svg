<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>創造本性の欲望</title>

  <text x="52" y="74" font-size="48" textLength="347" lengthAdjust="spacing">創造本性の欲望</text>
  <line x1="51" y1="85" x2="401" y2="85" stroke="currentColor" stroke-width="3.5"/>

  <!-- 黒丸 -->
  <circle cx="194" cy="173.5" r="9.5"/>
  <circle cx="193" cy="285" r="9.5"/>

  <g font-size="42">
    <text x="215" y="190">嫉妬心<tspan x="356.5">：</tspan><tspan x="389" textLength="566" lengthAdjust="spacing">創造本性の不可避的な副産物</tspan></text>
    <text x="212" y="300" textLength="173" lengthAdjust="spacing">人間完成</text>
    <text x="431" y="300" textLength="667" lengthAdjust="spacingAndGlyphs">付随的な欲望で堕落することはできない</text>
  </g>
  <polygon points="395,278 411,278 411,272 421,285 411,297 411,292 395,292" fill="#8C949A"/>

  <!-- 灰色の横棒と細い字 -->
  <g fill="#8C949A">
    <rect x="282" y="369" width="36" height="8"/>
    <rect x="282" y="441" width="36" height="8"/>
  </g>
  <g font-weight="400">
    <text x="335" y="385.5" font-size="39" textLength="411" lengthAdjust="spacing">自己破滅の苦痛を実感</text>
    <text x="331" y="461.5" font-size="40" textLength="756" lengthAdjust="spacingAndGlyphs">全体は個体の破滅を放任することができない</text>
  </g>

  <rect x="190" y="534" width="916" height="83" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <text x="211" y="592" font-size="43" fill="#111">創造本性の欲望<tspan x="528">：</tspan><tspan x="562" textLength="521" lengthAdjust="spacing">堕落の要因とはなり得ない</tspan></text>
</svg>
