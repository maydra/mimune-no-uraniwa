<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>非原理的愛の力による堕落</title>

  <!-- 創造目的完成 -->
  <ellipse cx="645.5" cy="134.5" rx="121.25" ry="65.75" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="42" text-anchor="middle" fill="#111">
    <text x="645" y="128">創造目的</text>
    <text x="646" y="178">完成</text>
  </g>

  <!-- 原理の力の矢印 -->
  <polygon points="646,215 731.2,290 687,290 687,537.5 604,537.5 604,290 560.3,290" fill="#C4CCD3" stroke="currentColor" stroke-width="4" stroke-linejoin="miter"/>
  <g stroke-width="8">
    <line x1="583" y1="334" x2="707" y2="334" stroke="currentColor"/>
    <line x1="583" y1="441.5" x2="707" y2="441.5" stroke="currentColor"/>
    <line x1="606" y1="334" x2="685" y2="334" stroke="#111"/>
    <line x1="606" y1="441.5" x2="685" y2="441.5" stroke="#111"/>
  </g>
  <g font-size="43" text-anchor="middle" dominant-baseline="central" fill="#111" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">
    <text x="646" y="341.5">原</text>
    <text x="646" y="387">理</text>
    <text x="646" y="432.5">の</text>
    <text x="646" y="477.5">力</text>
  </g>

  <!-- 人間 -->
  <ellipse cx="643.5" cy="596.75" rx="94" ry="55.5" fill="#FCE5E3" stroke="currentColor" stroke-width="3.5"/>
  <text x="643" y="596" font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111">人 間</text>

  <g stroke="currentColor" stroke-width="7.5">
    <line x1="513" y1="207.5" x2="778" y2="207.5"/>
    <line x1="511" y1="537.5" x2="776" y2="537.5"/>
  </g>

  <!-- 非原理的愛の力 -->
  <text x="268" y="323.3" font-size="45" textLength="182" lengthAdjust="spacing">非原理的</text>
  <text x="285" y="384.5" font-size="46" textLength="145" lengthAdjust="spacing">愛の力</text>
  <polygon points="472,326.5 544,326.5 544,318 576,333 544,348 544,339.5 472,339.5" fill="#8C949A"/>

  <!-- 堕落 -->
  <line x1="725.6" y1="334" x2="937.2" y2="568" stroke="#8C949A" stroke-width="13"/>
  <polygon points="954,586.5 946.6,556.8 925.2,576.2" fill="#8C949A"/>
  <text x="899.5" y="410.5" font-size="52" text-anchor="middle" dominant-baseline="central">堕落</text>
</svg>
