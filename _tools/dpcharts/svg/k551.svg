<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>士師時代と教区長制キリスト教会時代　イスラエルの子孫・カナン・新しい選民・イスラエル封建社会と、ゲルマン民族・西ヨーロッパ・新しい選民・キリスト教封建社会</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="130.8" y="74" width="276" height="54" rx="6"/>
    <rect x="416.8" y="74" width="276" height="54" rx="6"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="206.1" y="101.5" font-size="32" textLength="126.8" lengthAdjust="spacing">士師時代</text>
    <text x="425.3" y="101" font-size="28" textLength="85.4" lengthAdjust="spacingAndGlyphs">教区長制</text>
    <text x="511.3" y="101" font-size="28" textLength="83.4" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="596.3" y="101" font-size="28" textLength="86.4" lengthAdjust="spacingAndGlyphs">教会時代</text>
  </g>
  <!-- 白い枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="130.8" y="136" width="276" height="225" rx="8"/>
    <rect x="416.8" y="136" width="276" height="225" rx="8"/>
  </g>
  <!-- 左：士師時代 -->
  <g dominant-baseline="central">
    <text x="150" y="157" font-size="24" text-anchor="middle">①</text>
    <text x="166.4" y="192.5" font-size="26" textLength="129.1" lengthAdjust="spacing">イスラエル</text>
    <text x="297.4" y="192.5" font-size="26" textLength="78.1" lengthAdjust="spacing">の子孫</text>
    <text x="166.4" y="231.5" font-size="26" textLength="75.1" lengthAdjust="spacingAndGlyphs">カナン</text>
    <text x="164.4" y="271.5" font-size="26" textLength="78.1" lengthAdjust="spacing">新しい</text>
    <text x="243.4" y="271.5" font-size="26" textLength="53.1" lengthAdjust="spacing">選民</text>
    <text x="166.4" y="311" font-size="26" textLength="123.1" lengthAdjust="spacingAndGlyphs">イスラエル</text>
    <text x="290.4" y="311" font-size="26" textLength="99.1" lengthAdjust="spacingAndGlyphs">封建社会</text>
  </g>
  <!-- 右：教区長制キリスト教会時代 -->
  <g dominant-baseline="central">
    <text x="437.5" y="157" font-size="24" text-anchor="middle">②</text>
    <text x="457.4" y="192.5" font-size="26" textLength="157.1" lengthAdjust="spacing">ゲルマン民族</text>
    <text x="457.4" y="232.5" font-size="26" textLength="157.1" lengthAdjust="spacing">西ヨーロッパ</text>
    <text x="457.4" y="271.5" font-size="26" textLength="77.1" lengthAdjust="spacing">新しい</text>
    <text x="536.4" y="271.5" font-size="26" textLength="52.1" lengthAdjust="spacing">選民</text>
    <text x="458.4" y="310.5" font-size="26" textLength="90.1" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="552.4" y="310.5" font-size="26" textLength="118.1" lengthAdjust="spacingAndGlyphs">教封建社会</text>
  </g>
  <g>
    <circle cx="152.5" cy="192" r="5.5"/>
    <circle cx="152.5" cy="233.5" r="5.5"/>
    <circle cx="152.5" cy="273.5" r="5.5"/>
    <circle cx="152.5" cy="313.5" r="5.5"/>
    <circle cx="444" cy="193.5" r="5.5"/>
    <circle cx="444" cy="233.5" r="5.5"/>
    <circle cx="444" cy="273.5" r="5.5"/>
    <circle cx="444" cy="313" r="5.5"/>
  </g>
</svg>
