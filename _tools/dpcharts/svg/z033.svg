<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>新しい真理の使命</title>

  <text x="50" y="61" font-size="48" textLength="400" lengthAdjust="spacing" dominant-baseline="central">新しい真理の使命</text>
  <line x1="50" y1="91" x2="450" y2="91" stroke="currentColor" stroke-width="3"/>

  <!-- ● -->
  <g>
    <circle cx="301.5" cy="194.5" r="14"/>
    <circle cx="301.5" cy="316.5" r="14"/>
    <circle cx="301.5" cy="521.5" r="14"/>
  </g>
  <g font-size="49" dominant-baseline="central">
    <text x="332" y="194" textLength="399" lengthAdjust="spacing">両面の無知を克服</text>
    <text x="331" y="315" textLength="299" lengthAdjust="spacing">矛盾性を克服</text>
  </g>

  <!-- 神が教えるもの -->
  <circle cx="383.5" cy="520" r="50" fill="none" stroke="currentColor" stroke-width="4.5"/>
  <text x="383" y="520" font-size="60" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="52" dominant-baseline="central">
    <text x="462" y="444.5" textLength="160" lengthAdjust="spacing">実在性</text>
    <text x="461" y="519.5" textLength="270" lengthAdjust="spacing">創造の心情</text>
    <text x="461" y="594.5" textLength="270" lengthAdjust="spacing">救いの心情</text>
  </g>
  <path d="M769,424 C777,426 780,433 780,447 L780,502 C780,514 783,520 790,522.5 C783,525 780,531 780,543 L780,598 C780,612 777,618 769,620" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="816" y="522.5" font-size="52" textLength="267" lengthAdjust="spacing" dominant-baseline="central">教えるもの</text>
</svg>
