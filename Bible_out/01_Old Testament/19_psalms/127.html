<h1>詩篇 第127章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>主が家を建てられるのでなければ、建てる者の勤労はむなしい。主が町を守られるのでなければ、守る者のさめているのはむなしい。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>あなたがたが早く起き、おそく休み、辛苦のかてを食べることは、むなしいことである。主はその愛する者に、眠っている時にも、なくてならぬものを与えられるからである。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>見よ、子供たちは神から賜わった嗣業であり、胎の実は報いの賜物である。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>壮年の時の子供は勇士の手にある矢のようだ。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>矢の満ちた矢筒を持つ人はさいわいである。彼は門で敵と物言うとき恥じることはない。</p>
