<h1>詩篇 第114章</h1>
<div class="the-post-cont">

<p><sup>1</sup>イスラエルがエジプトをいで、ヤコブの家が異言の民を離れたとき、</p>
<p><sup>2</sup>ユダは主の聖所となり、イスラエルは主の所領となった。</p>
<p><sup>3</sup>海はこれを見て逃げ、ヨルダンはうしろに退き、</p>
<p><sup>4</sup>山は雄羊のように踊り、小山は小羊のように踊った。</p>
<p><sup>5</sup>海よ、おまえはどうして逃げるのか、ヨルダンよ、おまえはどうしてうしろに退くのか。</p>
<p><sup>6</sup>山よ、おまえたちはどうして雄羊のように踊るのか、小山よ、おまえたちはどうして小羊のように踊るのか。</p>
<p><sup>7</sup>地よ、主のみ前におののけ、ヤコブの神のみ前におののけ。</p>
<p><sup>8</sup>主は岩を池に変らせ、石を泉に変らせられた。</p>
