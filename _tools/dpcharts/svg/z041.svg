<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>キリスト教の難解な問題を解明</title>

  <circle cx="61.5" cy="56" r="13"/>
  <text x="86" y="57" font-size="49" textLength="699" lengthAdjust="spacing" dominant-baseline="central">キリスト教の難解な問題を解明</text>
  <line x1="86" y1="87.5" x2="785" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <!-- － -->
  <g stroke="#8C949A" stroke-width="8">
    <line x1="296" y1="158.5" x2="331" y2="158.5"/>
    <line x1="296" y1="235.5" x2="331" y2="235.5"/>
    <line x1="296" y1="322.5" x2="331" y2="322.5"/>
    <line x1="296" y1="414.5" x2="331" y2="414.5"/>
    <line x1="296" y1="496.5" x2="331" y2="496.5"/>
  </g>
  <g font-size="49" dominant-baseline="central">
    <text x="358" y="159" textLength="199" lengthAdjust="spacing">三位一体</text>
    <text x="358" y="233.5" textLength="448" lengthAdjust="spacing">イエスの十字架の死</text>
    <text x="358" y="321" textLength="449" lengthAdjust="spacing">十字架の代贖の限界</text>
    <text x="358" y="415" textLength="298" lengthAdjust="spacing">イエスの再臨</text>
    <text x="357" y="499" textLength="300" lengthAdjust="spacing">聖書の難問題</text>
  </g>
  <text x="617" y="283.5" font-size="23" textLength="118" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central">だいしょく</text>

  <!-- ⇨ 教派分裂の必然性止揚、統一 -->
  <polygon points="260,585.5 288,585.5 288,576.5 303.5,599 288,621.5 288,612.5 260,612.5" fill="#8C949A" stroke="currentColor" stroke-width="1.5"/>
  <g font-size="54" dominant-baseline="central">
    <text x="315" y="598.5" textLength="596" lengthAdjust="spacing">教派分裂の必然性止揚、</text>
    <text x="911" y="598.5" textLength="108" lengthAdjust="spacing">統一</text>
  </g>
  <text y="557.5" font-size="26" text-anchor="middle" dominant-baseline="central"><tspan x="776">し</tspan><tspan x="829">よう</tspan></text>
</svg>
