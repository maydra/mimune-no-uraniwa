<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスの再臨（マタイ 16:27）　その日はだれも知らない／神は預言者に必ず知らせる</title>

  <!-- 矢印（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="7">
    <line x1="270" y1="205" x2="343" y2="164"/>
    <line x1="270" y1="218" x2="344" y2="256.5"/>
  </g>
  <g fill="currentColor">
    <polygon points="361,154 347.2,174.4 336.4,155.2"/>
    <polygon points="362,266.5 338,265.8 348,247.2"/>
  </g>

  <!-- イエスの再臨 -->
  <ellipse cx="215.5" cy="211.5" rx="86.5" ry="49.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="215" y="195" textLength="122" lengthAdjust="spacing">イエスの</text>
    <text x="215" y="234" textLength="60" lengthAdjust="spacing">再臨</text>
  </g>
  <text x="150" y="285" font-size="22" dominant-baseline="central" textLength="134" lengthAdjust="spacing">マタイ 16:27</text>

  <!-- 右の字 -->
  <g font-size="30" dominant-baseline="central">
    <text x="370" y="136.5" textLength="320" lengthAdjust="spacing">その日はだれも知らない</text>
    <text x="370" y="245" textLength="251" lengthAdjust="spacing">神は預言者に必ず</text>
    <text x="370" y="284.5" textLength="122" lengthAdjust="spacing">知らせる</text>
  </g>
  <g font-size="22" dominant-baseline="central">
    <text x="372" y="172" textLength="153" lengthAdjust="spacing">(マタイ 24:36)</text>
    <text x="372" y="320.5" textLength="130" lengthAdjust="spacing">(アモス 3:7)</text>
  </g>
</svg>
