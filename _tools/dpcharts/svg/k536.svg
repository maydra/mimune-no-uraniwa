<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理時代と復帰摂理延長時代の聖書（旧約・新約）</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="260.5" y="47.5" width="182" height="67" rx="8"/>
    <rect x="449.5" y="47.5" width="182" height="67" rx="8"/>
  </g>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="299" y="68" textLength="104" lengthAdjust="spacing">復帰摂理</text>
    <text x="326" y="97" textLength="51" lengthAdjust="spacing">時代</text>
    <text x="487" y="68" textLength="105" lengthAdjust="spacing">復帰摂理</text>
    <text x="487" y="97" textLength="105" lengthAdjust="spacing">延長時代</text>
  </g>

  <!-- 聖書の札 -->
  <rect x="184.5" y="123.5" width="69" height="249" rx="10" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="31" text-anchor="middle" dominant-baseline="central">
    <text x="219" y="194">聖</text>
    <text x="219" y="301.5">書</text>
  </g>

  <!-- 旧約・新約の枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3">
    <rect x="261.5" y="123.5" width="180" height="249" rx="8"/>
    <rect x="449.5" y="123.5" width="181" height="249" rx="8"/>
  </g>
  <g stroke="currentColor" stroke-width="3">
    <line x1="261.5" y1="175" x2="441.5" y2="175"/>
    <line x1="449.5" y1="175" x2="630.5" y2="175"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="319.5" y="149">旧</text>
    <text x="383" y="149">約</text>
    <text x="507.5" y="149">新</text>
    <text x="571" y="149">約</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="285.5" cy="196.5" r="9"/>
    <circle cx="285.5" cy="235.5" r="9"/>
    <circle cx="285.5" cy="301.5" r="9"/>
    <circle cx="285.5" cy="341" r="9"/>
    <circle cx="469.5" cy="196.5" r="9"/>
    <circle cx="469.5" cy="236.5" r="9"/>
    <circle cx="469.5" cy="302" r="9"/>
    <circle cx="469.5" cy="341.5" r="9"/>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="301" y="196.5" textLength="79" lengthAdjust="spacing">律法書</text>
    <text x="301" y="235.5" textLength="79" lengthAdjust="spacing">歴史書</text>
    <text x="301" y="301.5" textLength="79" lengthAdjust="spacing">詩文書</text>
    <text x="301" y="341" textLength="68" lengthAdjust="spacingAndGlyphs">預言書</text>
    <text x="484" y="196.5" textLength="80" lengthAdjust="spacing">福音書</text>
    <text x="484" y="236.5" textLength="105" lengthAdjust="spacing">使徒行伝</text>
    <text x="484" y="302" textLength="105" lengthAdjust="spacing">使徒書簡</text>
    <text x="487" y="341.5" textLength="133" lengthAdjust="spacingAndGlyphs">ヨハネ黙示録</text>
  </g>
  <g font-size="20" dominant-baseline="central">
    <text y="266.5"><tspan x="294">（</tspan><tspan x="305" textLength="41" lengthAdjust="spacingAndGlyphs">2000</tspan><tspan x="352" textLength="62" lengthAdjust="spacing">年歴史</tspan><tspan x="414">）</tspan></text>
    <text y="266.5"><tspan x="478">（</tspan><tspan x="489" textLength="123" lengthAdjust="spacing">＋キリスト教史</tspan><tspan x="611">）</tspan></text>
  </g>
</svg>
