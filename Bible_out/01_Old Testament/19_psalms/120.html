<h1>詩篇 第120章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>わたしが悩みのうちに、主に呼ばわると、主はわたしに答えられる。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>「主よ、偽りのくちびるから、欺きの舌から、わたしを助け出してください」。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>欺きの舌よ、おまえに何が与えられ、何が加えられるであろうか。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>ますらおの鋭い矢と、えにしだの熱い炭とである。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>わざわいなるかな、わたしはメセクにやどり、ケダルの天幕のなかに住んでいる。</p>
<p id="v6"><sup><a href="#v6" class="verse-link">6</a></sup>わたしは久しく平安を憎む者のなかに住んでいた。</p>
<p id="v7"><sup><a href="#v7" class="verse-link">7</a></sup>わたしは平安を願う、しかし、わたしが物言うとき、彼らは戦いを好む。</p>
