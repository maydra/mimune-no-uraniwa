<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理歴史の全期間</title>

  <text x="33" y="37.5" font-size="30" dominant-baseline="central" textLength="314" lengthAdjust="spacing">復帰摂理歴史の全期間</text>
  <line x1="32" y1="56.6" x2="349" y2="56.6" stroke="currentColor" stroke-width="2.4"/>

  <!-- 表の線 -->
  <g stroke="currentColor" stroke-width="2.6">
    <line x1="126" y1="141" x2="629" y2="141"/>
    <line x1="126" y1="208.5" x2="629" y2="208.5"/>
    <line x1="126" y1="276" x2="629" y2="276"/>
    <line x1="126" y1="343" x2="629" y2="343"/>
    <line x1="357" y1="141" x2="357" y2="343" stroke-width="3"/>
  </g>

  <!-- 人間から完・人へ（黒い矢印） -->
  <polygon points="223,349 230,349 230,159.5 235.5,159.5 226.5,143 217.5,159.5 223,159.5" fill="currentColor"/>

  <!-- 完・人 -->
  <ellipse cx="227" cy="114.5" rx="44" ry="23.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="205.5" y="114">完</text>
    <text x="248" y="114.5">人</text>
  </g>
  <circle cx="227" cy="114.5" r="3.2"/>

  <!-- 人間 -->
  <ellipse cx="226" cy="371" rx="41" ry="23" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
  <text x="198" y="371" font-size="27" dominant-baseline="central" fill="#111" textLength="56" lengthAdjust="spacing">人間</text>

  <!-- 表の字 -->
  <g font-size="27" dominant-baseline="central">
    <text x="144" y="175" textLength="57" lengthAdjust="spacing">完成</text>
    <text x="144" y="242" textLength="57" lengthAdjust="spacing">長成</text>
    <text x="144" y="309" textLength="57" lengthAdjust="spacing">蘇生</text>
    <text x="252" y="175" textLength="85" lengthAdjust="spacing">実体型</text>
    <text x="252" y="242" textLength="85" lengthAdjust="spacing">形象型</text>
    <text x="252" y="309" textLength="85" lengthAdjust="spacing">象徴型</text>
    <text x="376" y="175" textLength="231" lengthAdjust="spacing">復帰摂理延長時代</text>
    <text x="376" y="242" textLength="173" lengthAdjust="spacing">復帰摂理時代</text>
    <text x="376" y="309" textLength="231" lengthAdjust="spacing">復帰基台摂理時代</text>
  </g>

  <!-- 同時性時代（縦書き） -->
  <rect x="645" y="139" width="40" height="204" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="665.5" y="172.5">同</text>
    <text x="665.5" y="206.5">時</text>
    <text x="665.5" y="241">性</text>
    <text x="665.5" y="275.5">時</text>
    <text x="665.5" y="311">代</text>
  </g>
</svg>
