<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>求めよ、捜せ、たたけ（マタイ 7:7）、病んでいる者は祈ってもらうがよい（ヤコブ 5:14）　予定説から賛否両論へ</title>

  <!-- ● -->
  <g>
    <circle cx="212.5" cy="64.5" r="12"/>
    <circle cx="212.5" cy="323" r="12"/>
  </g>

  <!-- マタイ 7:7 -->
  <text y="64" font-size="43" dominant-baseline="central"><tspan x="239" textLength="121" lengthAdjust="spacing">マタイ</tspan> <tspan x="372" font-size="40" textLength="21" lengthAdjust="spacingAndGlyphs">7</tspan><tspan x="397" font-size="40">:</tspan><tspan x="414" font-size="40" textLength="21" lengthAdjust="spacingAndGlyphs">7</tspan></text>

  <!-- 神 → 人 → 求めよ・捜せ・たたけ -->
  <polygon points="339,181 377,181 377,173.5 396.5,185 377,196.5 377,189 339,189" fill="#8C949A"/>
  <g stroke="#8C949A" stroke-width="8">
    <line x1="488" y1="178.2" x2="554" y2="129.6"/>
    <line x1="488" y1="185" x2="556" y2="185"/>
    <line x1="488" y1="191.7" x2="554" y2="240.6"/>
    <line x1="689" y1="122.5" x2="735" y2="122.5"/>
    <line x1="689" y1="185.5" x2="735" y2="185.5"/>
    <line x1="689" y1="247.5" x2="735" y2="247.5"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <circle cx="279.5" cy="185" r="45" fill="#fff" class="paper"/>
    <circle cx="452.5" cy="185" r="45.5" fill="#FCE5E3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="280.5" y="184" font-size="54">神</text>
    <text x="451.5" y="183.5" font-size="56" fill="#111">人</text>
  </g>
  <g font-size="40" dominant-baseline="central">
    <text x="572" y="122.5" textLength="109" lengthAdjust="spacingAndGlyphs">求めよ</text>
    <text x="571.5" y="186" textLength="72" lengthAdjust="spacingAndGlyphs">捜せ</text>
    <text x="572" y="248" textLength="109" lengthAdjust="spacingAndGlyphs">たたけ</text>
    <text x="748.5" y="122.5" textLength="319" lengthAdjust="spacingAndGlyphs">与えられるであろう</text>
    <text x="749" y="186" textLength="283" lengthAdjust="spacingAndGlyphs">見いだすであろう</text>
    <text x="749" y="248" textLength="367" lengthAdjust="spacingAndGlyphs">あけてもらえるであろう</text>
  </g>

  <!-- ヤコブ 5:14 -->
  <text y="322" font-size="46" dominant-baseline="central"><tspan x="237" textLength="139" lengthAdjust="spacing">ヤコブ</tspan> <tspan x="385" font-size="45" textLength="22" lengthAdjust="spacingAndGlyphs">5</tspan><tspan x="411.5" font-size="45">:</tspan><tspan x="431" font-size="45" textLength="47" lengthAdjust="spacingAndGlyphs">14</tspan></text>
  <g font-size="46" dominant-baseline="central">
    <text x="522" y="323" textLength="598" lengthAdjust="spacing">病んでいる者は祈ってもらう</text>
    <text x="522" y="374" textLength="139" lengthAdjust="spacing">がよい</text>
    <text x="235" y="439" textLength="276" lengthAdjust="spacing">従来の予定説</text>
    <text x="533.5" y="439" text-anchor="middle">：</text>
    <text x="557" y="439" textLength="414" lengthAdjust="spacing">人間の努力は無意味</text>
  </g>

  <!-- 予定説 ⇒ 賛否両論 -->
  <rect x="287" y="531" width="204.5" height="86.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <polygon points="571,560 602,560 602,541 634,574.5 602,608 602,589 571,589" fill="#8C949A" stroke="currentColor" stroke-width="2.5"/>
  <rect x="702.5" y="531" width="281" height="86.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="54" text-anchor="middle" dominant-baseline="central">
    <text x="390.5" y="574" textLength="159" lengthAdjust="spacing">予定説</text>
    <text x="844" y="574" textLength="215" lengthAdjust="spacing" fill="#111">賛否両論</text>
  </g>
</svg>
