<h1>詩篇 第128章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>すべて主をおそれ、主の道に歩む者はさいわいである。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>あなたは自分の手の勤労の実を食べ、幸福で、かつ安らかであろう。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>あなたの妻は家の奥にいて多くの実を結ぶぶどうの木のようであり、あなたの子供たちは食卓を囲んでオリブの若木のようである。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>見よ、主をおそれる人は、このように祝福を得る。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>主はシオンからあなたを祝福されるように。あなたは世にあるかぎりエルサレムの繁栄を見、</p>
<p id="v6"><sup><a href="#v6" class="verse-link">6</a></sup>またあなたの子らの子を見るであろう。どうぞ、イスラエルの上に平安があるように。</p>
