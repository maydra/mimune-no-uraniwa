<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>3. メシヤのための基台</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="34" y="35.5">3.</text>
    <text x="72" y="35.5" textLength="281" lengthAdjust="spacing">メシヤのための基台</text>
  </g>
  <line x1="70" y1="54.5" x2="353" y2="54.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="212.5,320 212.5,174 208,174 216.5,158 225,174 220.5,174 220.5,320"/>
    <polygon points="463,342.5 302,342.5 302,338 285,346.5 302,355 302,350.5 463,350.5"/>
  </g>

  <!-- 神 -->
  <circle cx="216.5" cy="121" r="32.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="216.5" y="122" font-size="38" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 民族的信仰基台・民族的実体基台の札 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <rect x="121" y="202" width="82" height="86.5"/>
    <rect x="319" y="359" width="114.5" height="61"/>
  </g>
  <g font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="162" y="220.5" textLength="67" lengthAdjust="spacing">民族的</text>
    <text x="161.5" y="245.5" textLength="45" lengthAdjust="spacing">信仰</text>
    <text x="161.5" y="270.5" textLength="45" lengthAdjust="spacing">基台</text>
    <text x="375.5" y="377" textLength="70" lengthAdjust="spacing">民族的</text>
    <text x="375" y="403.5" textLength="93" lengthAdjust="spacing">実体基台</text>
  </g>

  <!-- モーセとイスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="217" cy="346.5" rx="61.5" ry="25.5" fill="#F8F28F"/>
    <ellipse cx="559" cy="346.5" rx="96.5" ry="26.5" fill="#F86D42"/>
  </g>
  <g font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="215" y="347" textLength="88" lengthAdjust="spacing">モーセ</text>
    <text x="557" y="347" textLength="170" lengthAdjust="spacingAndGlyphs">イスラエル民族</text>
  </g>

  <!-- メシヤのための民族的基台 -->
  <rect x="291" y="86" width="372" height="217" rx="7" fill="none" stroke="currentColor" stroke-width="2.6"/>
  <rect x="301" y="101" width="352" height="41" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="368" y="176.5" width="224" height="38.5"/>
    <rect x="368" y="251" width="224" height="38"/>
  </g>
  <text x="320" y="122" font-size="27" dominant-baseline="central" textLength="314" lengthAdjust="spacing" fill="#111">メシヤのための民族的基台</text>
  <g font-size="27" dominant-baseline="central">
    <text x="389" y="196.5" textLength="183" lengthAdjust="spacing">民族的実体基台</text>
    <text x="388" y="271" textLength="183" lengthAdjust="spacing">民族的信仰基台</text>
  </g>
  <!-- ‖ と ＋ -->
  <g stroke="currentColor" stroke-width="3.5">
    <line x1="472.5" y1="150" x2="472.5" y2="169"/>
    <line x1="482.5" y1="150" x2="482.5" y2="169"/>
    <line x1="468" y1="232" x2="491" y2="232"/>
    <line x1="479.5" y1="221" x2="479.5" y2="243"/>
  </g>
</svg>
