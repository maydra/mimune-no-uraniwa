<body>
<script id="theme-boot">(function(){try{var c=document.body.classList,t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';c.remove('light-mode','dark-mode');c.add(t+'-mode');var f=localStorage.getItem('reader.font');if(f)document.documentElement.style.fontSize=f}catch(e){}})()</script><div class="container">
<h1 id="🔮-ランダムなページを選んでいます...">🔮 ランダムなページを選んでいます...</h1>

</div>
<script>
  const wantRandomScroll = true;
  const currentDir = location.pathname.replace(/\/[^/]*$/, "/");

  fetch(currentDir + "pages.json")
    .then(res => res.json())
    .then(pages => {
      const randomPage = pages[Math.floor(Math.random() * pages.length)];
      const fullURL = currentDir + randomPage + (wantRandomScroll ? "?randomScroll=true" : "");
      location.href = fullURL;
    })
    .catch(err => {
      console.error("ページ取得失敗:", err);
      document.body.innerHTML += "<p style='color:red;'>ページ取得に失敗しました。</p>";
    });
</script>
<script src="../theme/script.js?v=202610241207"></script>
</body>
