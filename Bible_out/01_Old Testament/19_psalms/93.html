<h1>詩篇 第93章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>主は王となり、威光の衣をまとわれます。主は衣をまとい、力をもって帯とされます。まことに、世界は堅く立って、動かされることはありません。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>あなたの位はいにしえより堅く立ち、あなたはとこしえよりいらせられます。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>主よ、大水は声をあげました。大水はその声をあげました。大水はそのとどろく声をあげます。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>主は高き所にいらせられて、その勢いは多くの水のとどろきにまさり、海の大波にまさって盛んです。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>あなたのあかしはいとも確かです。主よ、聖なることはとこしえまでもあなたの家にふさわしいのです。</p>
