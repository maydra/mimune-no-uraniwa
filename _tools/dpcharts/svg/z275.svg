<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理過程の善の基準：相対的</title>

  <!-- 神の創造目的（地上天国）← 復帰摂理 ← サタンの目的（堕落世界） -->
  <ellipse cx="319.5" cy="197.5" rx="123.5" ry="110.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="5"/>
  <ellipse cx="972" cy="198" rx="119" ry="110.5" fill="#CF921C" stroke="currentColor" stroke-width="5"/>
  <g font-size="38" text-anchor="middle" dominant-baseline="central">
    <text x="319.5" y="178" textLength="214" lengthAdjust="spacingAndGlyphs">神の創造目的</text>
    <text x="319.5" y="240.5">地上天国</text>
    <text x="973.5" y="178" fill="#111" textLength="207" lengthAdjust="spacingAndGlyphs">サタンの目的</text>
    <text x="974" y="241" fill="#111">堕落世界</text>
  </g>
  <polygon points="835.5,191 503,191 503,178.5 461,200.5 503,222.5 503,210 835.5,210" fill="#8C949A" stroke="currentColor" stroke-width="2"/>
  <text x="659.5" y="155" font-size="45" text-anchor="middle" dominant-baseline="central">復帰摂理</text>

  <text y="368.5" font-size="45.5" dominant-baseline="central"><tspan x="303">復帰摂理過程の善の基準</tspan><tspan x="829" text-anchor="middle">：</tspan><tspan x="852">相対的</tspan></text>

  <!-- 主権者の理念・宗教の教理・思想 -->
  <g>
    <circle cx="306.5" cy="456" r="10.75"/>
    <circle cx="306.5" cy="525.5" r="10.75"/>
    <circle cx="306.5" cy="596" r="10.75"/>
    <circle cx="799" cy="487" r="10.5"/>
    <circle cx="799" cy="561" r="10.5"/>
  </g>
  <g font-size="45" dominant-baseline="central">
    <text x="330" y="456.5">主権者の理念</text>
    <text x="330" y="524.5">宗教の教理</text>
    <text x="330" y="594.5">思想</text>
    <text y="486"><tspan x="820">順応</tspan><tspan x="934" text-anchor="middle">：</tspan><tspan x="980" text-anchor="middle">善</tspan></text>
    <text y="559.5"><tspan x="820">反対</tspan><tspan x="934" text-anchor="middle">：</tspan><tspan x="980" text-anchor="middle">悪</tspan></text>
  </g>

  <!-- 括弧と矢印 -->
  <g fill="none" stroke="currentColor" stroke-width="8.5">
    <polyline points="638.2,429 652,443.7 652,600.7 638,619"/>
    <polyline points="779.2,455 765,468.3 765,575.5 778.5,589"/>
  </g>
  <polygon points="685.5,509.5 718.5,509.5 718.5,496.5 742.5,521.5 718.5,546.5 718.5,533.5 685.5,533.5" fill="#8C949A"/>
</svg>
