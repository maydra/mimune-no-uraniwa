<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス再臨の際</title>

  <!-- 題 -->
  <text x="32" y="37.5" font-size="30" dominant-baseline="central" textLength="220" lengthAdjust="spacing">イエス再臨の際</text>
  <line x1="31" y1="56.5" x2="252" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 神 → 全人類 -->
  <circle cx="216" cy="185.5" r="36" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <text x="215" y="184.5" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>
  <polygon points="268,181.7 501,181.7 501,175 518.5,185.7 501,196.5 501,189.7 268,189.7" fill="#8C949A"/>
  <ellipse cx="586" cy="185.75" rx="56" ry="36" fill="#FCE5E3" stroke="currentColor" stroke-width="2.5"/>
  <text x="586" y="186" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="84" lengthAdjust="spacing" fill="#111">全人類</text>

  <g font-size="28" dominant-baseline="central">
    <text x="324" y="155" font-size="27" textLength="122" lengthAdjust="spacing">使徒 2:17</text>
    <text x="323" y="217" textLength="121" lengthAdjust="spacing">霊を注ぐ</text>
  </g>

  <!-- 水色の箱 -->
  <rect x="143" y="315" width="532" height="53" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="157" y="341.5" font-size="30" dominant-baseline="central" textLength="504" lengthAdjust="spacing" fill="#111">光の中にいる信徒たちを通じて啓示</text>
</svg>
