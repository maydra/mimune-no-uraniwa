<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>善とは？悪とは？矛盾性とは？　無知を克服して善の生活へ</title>

  <!-- 本心・邪心のハート（z007 と同じ形） -->
  <g transform="translate(2.5,-113)">
    <path d="M654,228 C640,216 616,188 592,188 C564,188 548,212 548,252 C548,317 584,362 654,380 Z" fill="#fff" class="paper"/>
    <path d="M654,228 C668,216 692,188 716,188 C744,188 760,212 760,252 C760,317 724,362 654,380 Z" fill="#50403D"/>
    <path d="M654,228 C640,216 616,188 592,188 C564,188 548,212 548,252 C548,317 584,362 654,380 C724,362 760,317 760,252 C760,212 744,188 716,188 C692,188 668,216 654,228 Z M654,228 L654,380" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g font-size="58" text-anchor="middle" dominant-baseline="central">
    <text x="611" y="139">本</text>
    <text x="611" y="201">心</text>
    <text x="704.5" y="138" fill="#fff">邪</text>
    <text x="704.5" y="201" fill="#fff">心</text>
  </g>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="420,170 456,150.5 456,159.5 506.5,159.5 506.5,180.5 456,180.5 456,189.5"/>
    <polygon points="806,159.5 858.5,159.5 858.5,150.5 892.5,170 858.5,189.5 858.5,180.5 806,180.5"/>
    <polygon points="639,365 668,365 668,377 688.5,377 654,394 621,377 639,377"/>
    <polygon points="646.5,485 661.5,485 661.5,528.5 669.5,528.5 654,548.5 638.5,528.5 646.5,528.5"/>
  </g>

  <!-- 善？・悪？ -->
  <ellipse cx="291" cy="170" rx="56" ry="59" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.5"/>
  <ellipse cx="992" cy="170" rx="56" ry="59" fill="#50403D" stroke="currentColor" stroke-width="3.5"/>
  <g font-size="58" text-anchor="middle" dominant-baseline="central">
    <text x="290.5" y="170.5">善</text>
    <text x="991.5" y="171.5" fill="#fff">悪</text>
  </g>
  <g font-size="54" text-anchor="middle" dominant-baseline="central">
    <text x="382" y="168.5">？</text>
    <text x="1079" y="169.5">？</text>
    <text x="778" y="323.5">？</text>
  </g>

  <!-- 矛盾性 → 無知を克服 → 善の生活 -->
  <rect x="563.5" y="285.5" width="184" height="68" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.5"/>
  <text x="583" y="318.5" font-size="48" dominant-baseline="central" textLength="146.5" lengthAdjust="spacing">矛盾性</text>
  <rect x="502" y="406" width="306" height="65" rx="33" ry="16" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.5"/>
  <text x="533" y="438" font-size="48" dominant-baseline="central" textLength="244.5" lengthAdjust="spacing">無知を克服</text>
  <rect x="525.5" y="560.5" width="257" height="66" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <text x="556" y="593" font-size="48" fill="#111" dominant-baseline="central" textLength="196.5" lengthAdjust="spacing">善の生活</text>
</svg>
