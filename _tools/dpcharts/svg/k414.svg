<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『第三次世界的カナン復帰路程』</title>

  <g font-size="30" dominant-baseline="central">
    <text x="46" y="36.5">『</text>
    <text x="61" y="36.5" textLength="408" lengthAdjust="spacing">第三次世界的カナン復帰路程</text>
    <text x="469" y="36.5">』</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="425.5,158.5 438.5,150 438.5,155 530,155 530,162 438.5,162 438.5,167"/>
    <polygon points="424.5,331.5 437.5,323 437.5,328 530,328 530,335 437.5,335 437.5,340"/>
    <polygon points="341.8,222.5 350.2,222.5 350.2,249.5 356.5,249.5 346,269.5 335.5,249.5 341.8,249.5"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="345.5" cy="158.5" rx="75.3" ry="45.3" fill="#F8F28F"/>
    <ellipse cx="345.5" cy="331" rx="75.3" ry="45.8" fill="#F8F28F"/>
    <ellipse cx="602.5" cy="158.5" rx="72.3" ry="45.3" fill="#F86D42"/>
    <ellipse cx="602.5" cy="331.5" rx="72.3" ry="42.3" fill="#F86D42"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="349.5" y="141.5">復活</text>
    <text x="346" y="176.5" textLength="83" lengthAdjust="spacing">イエス</text>
    <text x="344" y="314.5" textLength="55" lengthAdjust="spacing">再臨</text>
    <text x="343.5" y="349.5" textLength="82" lengthAdjust="spacing">イエス</text>
    <text x="602.5" y="146" textLength="112" lengthAdjust="spacingAndGlyphs">キリスト教</text>
    <text x="606" y="181">信徒</text>
    <text x="582" y="331.5">信</text>
    <text x="623" y="331.5">徒</text>
  </g>

  <g font-size="27" dominant-baseline="central">
    <text x="131" y="159" textLength="113" lengthAdjust="spacing">霊的出発</text>
    <text x="131" y="331.5" textLength="113" lengthAdjust="spacing">霊肉完成</text>
    <text x="508" y="227" font-size="26" textLength="181" lengthAdjust="spacing">第二イスラエル</text>
