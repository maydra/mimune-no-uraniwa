<h1>詩篇 第93章</h1>
<div class="the-post-cont">

<p><sup>1</sup>主は王となり、威光の衣をまとわれます。主は衣をまとい、力をもって帯とされます。まことに、世界は堅く立って、動かされることはありません。</p>
<p><sup>2</sup>あなたの位はいにしえより堅く立ち、あなたはとこしえよりいらせられます。</p>
<p><sup>3</sup>主よ、大水は声をあげました。大水はその声をあげました。大水はそのとどろく声をあげます。</p>
<p><sup>4</sup>主は高き所にいらせられて、その勢いは多くの水のとどろきにまさり、海の大波にまさって盛んです。</p>
<p><sup>5</sup>あなたのあかしはいとも確かです。主よ、聖なることはとこしえまでもあなたの家にふさわしいのです。</p>
