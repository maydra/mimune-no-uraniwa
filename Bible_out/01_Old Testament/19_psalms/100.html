<h1>詩篇 第100章</h1>
<div class="the-post-cont">

<p><sup>1</sup>全地よ、主にむかって喜ばしき声をあげよ。</p>
<p><sup>2</sup>喜びをもって主に仕えよ。歌いつつ、そのみ前にきたれ。</p>
<p><sup>3</sup>主こそ神であることを知れ。われらを造られたものは主であって、われらは主のものである。われらはその民、その牧の羊である。</p>
<p><sup>4</sup>感謝しつつ、その門に入り、ほめたたえつつ、その大庭に入れ。主に感謝し、そのみ名をほめまつれ。</p>
<p><sup>5</sup>主は恵みふかく、そのいつくしみはかぎりなく、そのまことはよろず代に及ぶからである。</p>
