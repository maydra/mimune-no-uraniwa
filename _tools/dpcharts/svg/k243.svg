<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(2) 信仰基台を復帰するための条件物</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="48" y="39" textLength="40" lengthAdjust="spacingAndGlyphs">(2)</text>
    <text x="99" y="39" textLength="473" lengthAdjust="spacing">信仰基台を復帰するための条件物</text>
  </g>
  <line x1="99" y1="58" x2="572" y2="58" stroke="currentColor" stroke-width="2.2"/>

  <!-- 条件物 -->
  <g font-size="27" dominant-baseline="central">
    <text x="213" y="133" textLength="231" lengthAdjust="spacing">条件物：神のみ言</text>
    <text x="331" y="167.5" textLength="41" lengthAdjust="spacingAndGlyphs">「40</text>
    <text x="382" y="167.5" textLength="241" lengthAdjust="spacing">日サタン分立基台」</text>
  </g>

  <!-- モーセ -->
  <ellipse cx="181.5" cy="270.5" rx="56" ry="45.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="181.5" y="270" font-size="31" text-anchor="middle" dominant-baseline="central" textLength="91" lengthAdjust="spacing" fill="#111">モーセ</text>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="268,258 286,258 286,253.5 299,261 286,268.5 286,264 268,264"/>
    <polygon points="268,396.5 286,396.5 286,392 299,399.5 286,407 286,402.5 268,402.5"/>
  </g>

  <!-- 箇条 -->
  <g font-size="27" dominant-baseline="central">
    <text x="241" y="221.5">①</text>
    <text x="264" y="221.5" textLength="236" lengthAdjust="spacing">三次の象徴献祭成功</text>
    <text x="311" y="261.5" textLength="368" lengthAdjust="spacing">象徴献祭の摂理を完了した基台</text>
    <text x="241" y="320.5">②</text>
    <text x="264" y="320.5" textLength="428" lengthAdjust="spacing">供え物を中心とする復帰基台摂理時</text>
    <text x="263" y="359.5" textLength="156" lengthAdjust="spacing">代は過ぎさる</text>
    <text x="311" y="399.5" textLength="235" lengthAdjust="spacing">復帰摂理時代に入る</text>
  </g>
</svg>
