<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>統一王国時代とキリスト王国時代　預言者→国王（霊的な基台を準備・王を祝福・カインの立場）と法王→国王（霊的な基台を準備・王を祝福・王に従う）</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="129" y="54" width="276" height="54" rx="6"/>
    <rect x="414.5" y="54" width="276" height="54" rx="6"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="164" y="80.5" font-size="34" textLength="206.1" lengthAdjust="spacing">統一王国時代</text>
    <text x="433" y="81" font-size="33" textLength="116" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="552" y="81" font-size="33" textLength="121" lengthAdjust="spacingAndGlyphs">王国時代</text>
  </g>
  <!-- 白い枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="129" y="116.5" width="276" height="265" rx="8"/>
    <rect x="414.5" y="116.5" width="276" height="265" rx="8"/>
  </g>
  <!-- 灰色の矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="270,200 234,200 234,196.5 221,203.5 234,210.5 234,207 270,207"/>
    <polygon points="556,200 520,200 520,196.5 507,203.5 520,210.5 520,207 556,207"/>
  </g>
  <g>
    <ellipse cx="178" cy="204" rx="39" ry="21" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="327.2" cy="203.2" rx="64.5" ry="40.8" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="302.2" cy="204.5" rx="38.2" ry="21" fill="#F86D42" stroke="#111" stroke-width="3"/>
    <ellipse cx="464" cy="204" rx="39" ry="21" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="611" cy="202.5" rx="64.5" ry="40.8" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="586" cy="204" rx="38" ry="21" fill="#F86D42" stroke="#111" stroke-width="3"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="162.5" y="204" font-size="22" text-anchor="middle">国</text>
    <text x="192.5" y="204" font-size="22" text-anchor="middle">王</text>
    <text x="271.7" y="204.5" font-size="22" textLength="60.6" lengthAdjust="spacingAndGlyphs">預言者</text>
    <text x="362.5" y="193.5" font-size="20" text-anchor="middle">国</text>
    <text x="362" y="216.5" font-size="20" text-anchor="middle">民</text>
    <text x="448.5" y="204" font-size="22" text-anchor="middle">国</text>
    <text x="478.5" y="204" font-size="22" text-anchor="middle">王</text>
    <text x="561.6" y="203.5" font-size="23" textLength="46.8" lengthAdjust="spacing">法王</text>
    <text x="647" y="193.5" font-size="20" text-anchor="middle">国</text>
    <text x="647" y="216.5" font-size="20" text-anchor="middle">民</text>
  </g>
  <g dominant-baseline="central">
    <text x="150.5" y="135" font-size="24" text-anchor="middle">①</text>
    <text x="198.6" y="282.5" font-size="24" textLength="188.9" lengthAdjust="spacing">霊的な基台を準備</text>
    <text x="198.6" y="315.5" font-size="24" textLength="93.9" lengthAdjust="spacing">王を祝福</text>
    <text x="199.6" y="348" font-size="24" textLength="67.9" lengthAdjust="spacingAndGlyphs">カイン</text>
    <text x="270.6" y="348" font-size="24" textLength="68.9" lengthAdjust="spacingAndGlyphs">の立場</text>
    <text x="438.5" y="135" font-size="24" text-anchor="middle">②</text>
    <text x="483.6" y="282.5" font-size="24" textLength="188.9" lengthAdjust="spacing">霊的な基台を準備</text>
    <text x="483.6" y="315.5" font-size="24" textLength="93.9" lengthAdjust="spacing">王を祝福</text>
    <text x="483.6" y="348.5" font-size="24" textLength="44.9" lengthAdjust="spacingAndGlyphs">王に</text>
    <text x="530.6" y="348.5" font-size="24" textLength="43.9" lengthAdjust="spacingAndGlyphs">従う</text>
  </g>
  <g>
    <circle cx="187" cy="282" r="5.5"/>
    <circle cx="471" cy="282" r="5.5"/>
    <circle cx="187" cy="315" r="5.5"/>
    <circle cx="471" cy="315" r="5.5"/>
    <circle cx="187" cy="348" r="5.5"/>
    <circle cx="471" cy="348" r="5.5"/>
  </g>
</svg>
