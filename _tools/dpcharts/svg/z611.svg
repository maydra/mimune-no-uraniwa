<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. イエスは神御自身であられるのだろうか</title>

  <g font-size="104" dominant-baseline="central">
    <text y="193.5"><tspan x="142.0">Ⅲ</tspan><tspan x="242.1">.</tspan></text>
    <text y="193.5"><tspan x="312.5" textLength="312" lengthAdjust="spacing">イエス</tspan><tspan x="621.4" textLength="1561.7" lengthAdjust="spacing">は神御自身であられるのだろうか</tspan></text>
  </g>

  <!-- 行頭の● -->
  <circle cx="164.5" cy="392.5" r="20.5"/>
  <circle cx="164.5" cy="1148" r="20.5"/>
  <circle cx="164.5" cy="1478.5" r="20.5"/>
  <circle cx="164.5" cy="1809.5" r="20.5"/>

  <!-- 本文（細字は font-weight 400） -->
  <g font-size="88" dominant-baseline="central">
    <text y="392"><tspan x="216.3" font-weight="400" textLength="730.4" lengthAdjust="spacing">ピリポがイエスに</tspan><tspan x="948.3" font-weight="400">、</tspan><tspan x="1043.5" font-weight="400" textLength="1371.2" lengthAdjust="spacing">神を見せてくださいと言ったとき</tspan><tspan x="2425.3" font-weight="400">、</tspan><tspan x="2525.5" font-weight="400">『</tspan><tspan x="2565.4" textLength="176.0" lengthAdjust="spacing">わた</tspan></text>
    <text y="534"><tspan x="217.4" textLength="528.5" lengthAdjust="spacing">しを見た者は</tspan><tspan x="752.3">、</tspan><tspan x="842.5" textLength="720.2" lengthAdjust="spacing">父を見たのである</tspan><tspan x="1566.0">。</tspan><tspan x="1658.6" textLength="358.2" lengthAdjust="spacing">どうして</tspan><tspan x="2018.3">、</tspan><tspan x="2111.4" textLength="628.1" lengthAdjust="spacing">わたしたちに父</tspan></text>
    <text y="675.5"><tspan x="210.6" textLength="721.0" lengthAdjust="spacing">を示してほしいと</tspan><tspan x="933.3">、</tspan><tspan x="1024.8" textLength="357.8" lengthAdjust="spacing">言うのか</tspan><tspan x="1385.0">。</tspan><tspan x="1478.4" textLength="715.7" lengthAdjust="spacing">わたしが父におり</tspan><tspan x="2199.3">、</tspan><tspan x="2289.5" textLength="445.8" lengthAdjust="spacing">父がわたし</tspan></text>
    <text y="818"><tspan x="211.9" textLength="1619.8" lengthAdjust="spacing">におられることをあなたは信じないのか</tspan><tspan x="1826.6">』</tspan><tspan x="1892.4" font-weight="400">（</tspan><tspan x="1949.6" font-weight="400" textLength="242.2" lengthAdjust="spacingAndGlyphs">ヨハネ</tspan> <tspan x="2224.5" font-weight="400" textLength="178.8" lengthAdjust="spacingAndGlyphs">14:9</tspan><tspan x="2407.5" font-weight="400">〜</tspan><tspan x="2506.2" font-weight="400" textLength="89.1" lengthAdjust="spacingAndGlyphs">10</tspan><tspan x="2590.1" font-weight="400">）</tspan><tspan x="2653.1" font-weight="400">と</tspan></text>
    <text y="959.5" font-weight="400"><tspan x="212.2" textLength="453.6" lengthAdjust="spacing">答えられた</tspan><tspan x="668.8">。</tspan></text>

    <text y="1148"><tspan x="218.7" font-weight="400" textLength="172.3" lengthAdjust="spacingAndGlyphs">また</tspan><tspan x="392.8" font-weight="400">、</tspan><tspan x="467.8" font-weight="400" textLength="356.7" lengthAdjust="spacing">聖書には</tspan><tspan x="829.3" font-weight="400">、</tspan><tspan x="908.5" font-weight="400">『</tspan><tspan x="945.8" textLength="264.1" lengthAdjust="spacing">世は彼</tspan><tspan x="1244.4">（</tspan><tspan x="1292.8" textLength="260.8" lengthAdjust="spacingAndGlyphs">イエス</tspan><tspan x="1553.1">）</tspan><tspan x="1631.9" textLength="1061.2" lengthAdjust="spacing">によってできたのであるが</tspan><tspan x="2696.3">、</tspan></text>
    <text y="1289.5"><tspan x="210.8" textLength="885.6" lengthAdjust="spacing">世は彼を知らずにいた</tspan><tspan x="1089.6">』</tspan><tspan x="1178.4" font-weight="400">（</tspan><tspan x="1233.6" font-weight="400" textLength="239.1" lengthAdjust="spacingAndGlyphs">ヨハネ</tspan> <tspan x="1505.1" font-weight="400" textLength="179.3" lengthAdjust="spacingAndGlyphs">1:10</tspan><tspan x="1678.1" font-weight="400">）</tspan><tspan x="1766.8" font-weight="400" textLength="715.5" lengthAdjust="spacing">というみ言もある</tspan><tspan x="2489.2" font-weight="400">。</tspan></text>

    <text y="1478.5"><tspan x="222.4">『</tspan><tspan x="261.7" textLength="1322.6" lengthAdjust="spacing">アブラハムの生れる前からわたし</tspan><tspan x="1622.9">（</tspan><tspan x="1670.8" textLength="261.9" lengthAdjust="spacingAndGlyphs">イエス</tspan><tspan x="1932.1">）</tspan><tspan x="2007.4">は</tspan><tspan x="2097.8">、</tspan><tspan x="2162.7" textLength="530.0" lengthAdjust="spacing">いるのである</tspan><tspan x="2687.6">』</tspan></text>
    <text y="1620.5" font-weight="400"><tspan x="214.4">（</tspan><tspan x="269.6" textLength="239.1" lengthAdjust="spacingAndGlyphs">ヨハネ</tspan> <tspan x="537.4" textLength="182.8" lengthAdjust="spacingAndGlyphs">8:58</tspan><tspan x="713.6">）</tspan><tspan x="802.8" textLength="807.5" lengthAdjust="spacing">とも記録されている</tspan><tspan x="1617.2">。</tspan></text>

    <text y="1809" font-weight="400"><tspan x="220.8" textLength="1183.4" lengthAdjust="spacing">このような聖句を根拠として</tspan><tspan x="1405.8">、</tspan><tspan x="1500.2" textLength="1189.3" lengthAdjust="spacing">今までの多くの信仰者たちは</tspan><tspan x="2693.3">、</tspan></text>
    <text y="1950.5" font-weight="400"><tspan x="220.5" textLength="628.7" lengthAdjust="spacing">イエスを創造主</tspan><tspan x="851.3">、</tspan><tspan x="944.5" textLength="913.4" lengthAdjust="spacing">神であると信じてきた</tspan><tspan x="1860.2">。</tspan></text>
  </g>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="308" y1="263" x2="2183" y2="263"/>
    <line x1="2563" y1="453" x2="2742" y2="453"/>
    <line x1="210" y1="594.5" x2="1567" y2="594.5"/>
    <line x1="945" y1="1208" x2="2697" y2="1208"/>
    <line x1="259" y1="1539" x2="2697" y2="1539"/>
    <line x1="210" y1="2013" x2="1860" y2="2013"/>
  </g>
</svg>
