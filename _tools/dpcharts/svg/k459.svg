<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ.復帰摂理はなぜ延長されまたいかに延長されるか　なぜ延長されるのか？</title>

  <text x="49 68" y="31" font-size="30" text-anchor="middle" dominant-baseline="central">Ⅰ.</text>
  <text x="81 112.5 144 175.5 207 238.5 270 301.5 333 364.5 396 427.5 459 490.5 522 553.5 585 616.5 648 679.5 711 742.5" y="31" font-size="30" dominant-baseline="central">復帰摂理はなぜ延長されまたいかに延長されるか</text>
  <line x1="81" y1="50.2" x2="775.5" y2="50.2" stroke="currentColor" stroke-width="2.8"/>

  <text x="137 166 195 224 253 282 311 340 369 398" y="100" font-size="27" dominant-baseline="central">なぜ延長されるのか？</text>
  <line x1="136" y1="118.6" x2="396.5" y2="118.6" stroke="currentColor" stroke-width="2.2"/>

  <!-- み旨 ……絶対的に予定 -->
  <g stroke="currentColor" stroke-width="3" fill="#CDF8F7">
    <rect x="134" y="139" width="139" height="66" rx="7"/>
    <rect x="134" y="229" width="139" height="66" rx="7"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="189 219" y="172">み旨</text>
    <text x="160.5 190 218.5 247" y="261.5" font-size="26">み旨成就</text>
  </g>
  <g>
    <circle cx="290.5" cy="171.5" r="2"/>
    <circle cx="297.6" cy="171.5" r="2"/>
    <circle cx="304.7" cy="171.5" r="2"/>
    <circle cx="311.7" cy="171.5" r="2"/>
    <circle cx="318.8" cy="171.5" r="2"/>
    <circle cx="325.9" cy="171.5" r="2"/>
    <circle cx="333" cy="171.5" r="2"/>
  </g>
  <text x="345" y="173" font-size="27" dominant-baseline="central" textLength="173" lengthAdjust="spacing">絶対的に予定</text>

  <!-- み旨成就 ＝ 神の責任分担 ＋ 人間の責任分担 -->
  <g stroke="currentColor" stroke-width="3">
    <line x1="293" y1="258" x2="321" y2="258"/>
    <line x1="293" y1="267.5" x2="321" y2="267.5"/>
    <line x1="513" y1="248.5" x2="513" y2="276.5"/>
    <line x1="499" y1="262.5" x2="527" y2="262.5" stroke-width="3.6"/>
  </g>
  <rect x="340" y="228" width="143" height="68" rx="7" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <rect x="542" y="228" width="144" height="68" rx="7" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
  <g font-size="25" dominant-baseline="central">
    <text x="397.5 424" y="247" text-anchor="middle">神の</text>
    <text x="359" y="278" textLength="105" lengthAdjust="spacing">責任分担</text>
  </g>
  <g font-size="25" dominant-baseline="central" fill="#111">
    <text x="587.5 614.5 640.5" y="246.5" text-anchor="middle">人間の</text>
    <text x="562" y="278" textLength="104" lengthAdjust="spacing">責任分担</text>
  </g>

  <text x="125" y="319" font-size="25" dominant-baseline="central" textLength="157" lengthAdjust="spacing">相対的に予定</text>

  <!-- 人間の責任分担により復帰摂理延長 -->
  <rect x="161" y="353" width="499" height="49" rx="2" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="179 207.9 236.9 265.8 294.7 323.6 352.6 381.5 410.4 439.4 468.3 497.2 526.2 555.1 584 613" y="377" font-size="27" dominant-baseline="central" fill="#111">人間の責任分担により復帰摂理延長</text>
</svg>
