<!DOCTYPE html>

<html lang="ja">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXQ0QTBYTR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-XXQ0QTBYTR');
  </script>

  <meta charset="utf-8" />
  <title>み旨の裏庭 | サイト内一括検索</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <link href="/mimune-no-uraniwa/favicon.png" rel="icon" type="image/png" />
  <style>
    body {
      font-family: sans-serif;
      font-size: 18px;
      line-height: 1.7;
      max-width: 800px;
      margin: 1em auto;
      padding: 0 1em;
      color: #333;
    }

    h1 {
      font-size: 1.5em;
      margin-bottom: 0.5em;
    }

    .search-container {
      margin-bottom: 2em;
    }

    #search-input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 4px;
      background-color: #f9f9f9;
    }

    #search-stats {
      margin-top: 0.5em;
      font-size: 0.9em;
      color: #666;
    }

    .result-item {
      margin-bottom: 2em;
      border-bottom: 1px solid #eee;
      padding-bottom: 1em;
    }

    .result-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 0.2em;
    }

    .result-title a {
      text-decoration: none;
      color: #0066cc;
    }

    .result-title a:hover {
      text-decoration: underline;
    }

    .result-snippet {
      font-size: 0.95em;
      color: #444;
    }

    mark {
      background-color: #fffacd;
      font-weight: bold;
      color: #000;
    }

    .nav-link {
      display: inline-block;
      margin-bottom: 1em;
      text-decoration: none;
      color: #0066cc;
    }

    .warning {
      background-color: #fff3cd;
      color: #856404;
      padding: 0.5em;
      border-radius: 4px;
      margin-bottom: 1em;
      font-size: 0.9em;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    /* Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1a1a1a;
        color: #ffffff;
      }

      #search-input {
        background-color: #2a2a2a;
        color: #ffffff;
        border-color: #444;
      }

      #search-input::placeholder {
        color: #999;
      }

      #search-stats {
        color: #aaa;
      }

      .result-item {
        border-bottom-color: #333;
      }

      .result-title a {
        color: #66b3ff;
      }

      .result-title a:hover {
        color: #99ccff;
      }

      .result-snippet {
        color: #ccc;
      }

      mark {
        background-color: #8b7300;
        color: #fff;
      }

      .nav-link {
        color: #66b3ff;
      }

      .nav-link:hover {
        color: #99ccff;
      }

      .warning {
        background-color: #3d3416;
        color: #ffc107;
        border: 1px solid #665c1e;
      }

      button {
        background-color: #444;
        color: #fff;
        border: 1px solid #666;
      }

      button:hover {
        background-color: #555;
      }
    }
  </style>

  <link rel="stylesheet" href="theme/style.css">
</head>

<body style="color: #e0e0e0;">
  <a class="nav-link" href="index.html">← トップページに戻る</a>
  <h1 id="サイト内一括検索"><a href="#サイト内一括検索">サイト内一括検索</a></h1>
  <div class="warning">
    ⚠️ <strong>注意:</strong> この検索は全データを読み込むため、最初の検索時に通信量が多くなります(約50MB)。<br />
    動作が重くなる可能性があります。
  </div>
  <div class="search-container">
    <input autofocus="" id="search-input" placeholder="キーワードを入力してEnter または 検索ボタン" type="text" />
    <button id="search-btn">検索実行</button>
    <div id="search-stats"></div>
  </div>
  <div id="search-results"></div>
  <script src="search-all.js"></script>

  <script src="theme/script.js"></script>
</body>

</html>
