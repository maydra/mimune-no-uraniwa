<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 重生論　1. 重生の使命から見たイエスと聖霊</title>

  <g dominant-baseline="central">
    <text y="55" font-size="48"><tspan x="76" text-anchor="middle">Ⅰ</tspan><tspan x="95">.</tspan><tspan x="127" textLength="150" lengthAdjust="spacing">重生論</tspan></text>
    <text y="130" font-size="46"><tspan x="83" text-anchor="middle">1</tspan><tspan x="97">.</tspan><tspan x="125" font-size="44" textLength="410" lengthAdjust="spacing">重生の使命から見た</tspan><tspan x="538" font-size="44" textLength="274" lengthAdjust="spacing">イエスと聖霊</tspan></text>
  </g>
  <g stroke="currentColor">
    <line x1="126" y1="85.5" x2="276" y2="85.5" stroke-width="4"/>
    <line x1="124" y1="159.5" x2="812" y2="159.5" stroke-width="3.5"/>
  </g>

  <!-- 左：神を中心とした四位基台（線は円・楕円より先に描く） -->
  <g stroke="currentColor" stroke-width="10">
    <line x1="375" y1="254.5" x2="273" y2="390.5"/>
    <line x1="390" y1="254.5" x2="492" y2="390.5"/>
    <line x1="266.4" y1="390.5" x2="379.4" y2="552"/>
    <line x1="501.7" y1="390.5" x2="388.6" y2="552"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="380" cy="254.5" rx="50" ry="46.5" fill="#fff" class="paper"/>
    <ellipse cx="262.5" cy="390.5" rx="70.5" ry="40.5" fill="#F98AEE"/>
    <ellipse cx="503" cy="390.5" rx="67" ry="40.5" fill="#A0F08A"/>
    <ellipse cx="383" cy="552" rx="72" ry="54" fill="#FCE5E3"/>
  </g>

  <!-- 右：堕落した四位基台 -->
  <g stroke="currentColor" stroke-width="10">
    <line x1="912.1" y1="253.5" x2="812" y2="391.5"/>
    <line x1="924.9" y1="253.5" x2="1029.9" y2="393.5"/>
    <line x1="810" y1="391.5" x2="916" y2="550.5"/>
    <line x1="1038.2" y1="393.5" x2="933.5" y2="550.5"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="919" cy="253.5" rx="47" ry="44.5" fill="#50403D"/>
    <ellipse cx="803" cy="391.5" rx="70" ry="41.5" fill="#CF921C"/>
    <ellipse cx="1038" cy="393.5" rx="66" ry="39.5" fill="#CF921C"/>
    <ellipse cx="923" cy="550.5" rx="71" ry="53.5" fill="#CF921C"/>
  </g>

  <!-- アダムとエバの授受（左と右） -->
  <g>
    <path d="M349.5,373 Q375.9,357.5 405,368" fill="none" stroke="currentColor" stroke-width="8"/>
    <polygon points="409.5,358.5 419.5,374.5 401,377.5"/>
    <g transform="rotate(180 381 387.5)">
      <path d="M349.5,373 Q375.9,357.5 405,368" fill="none" stroke="currentColor" stroke-width="8"/>
      <polygon points="409.5,358.5 419.5,374.5 401,377.5"/>
    </g>
  </g>
  <g transform="translate(540.5,4.5)">
    <path d="M349.5,373 Q375.9,357.5 405,368" fill="none" stroke="currentColor" stroke-width="8"/>
    <polygon points="409.5,358.5 419.5,374.5 401,377.5"/>
    <g transform="rotate(180 381 387.5)">
      <path d="M349.5,373 Q375.9,357.5 405,368" fill="none" stroke="currentColor" stroke-width="8"/>
      <polygon points="409.5,358.5 419.5,374.5 401,377.5"/>
    </g>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="379" y="254" font-size="50">神</text>
    <text x="918" y="253.5" font-size="50" fill="#fff">神</text>
    <g fill="#111" font-size="38">
      <text x="263.5" y="390" textLength="109" lengthAdjust="spacing">アダム</text>
      <text x="503.5" y="391" textLength="83" lengthAdjust="spacing">エバ</text>
      <text x="382" y="529">善の</text>
      <text x="382.5" y="575">子女</text>
      <text x="803.5" y="391" textLength="109" lengthAdjust="spacing">アダム</text>
      <text x="1039" y="393" textLength="82" lengthAdjust="spacing">エバ</text>
      <text x="923" y="530.5">悪の</text>
      <text x="923.5" y="571.5">子女</text>
    </g>
  </g>

  <!-- 父・母の札（細字） -->
  <g font-size="37" font-weight="400" dominant-baseline="central">
    <text x="193" y="323" textLength="100" lengthAdjust="spacing">真の父</text>
    <text x="466" y="323" textLength="101" lengthAdjust="spacing">真の母</text>
    <text x="733" y="324" textLength="100" lengthAdjust="spacing">悪の父</text>
    <text x="1002" y="327" textLength="102" lengthAdjust="spacing">悪の母</text>
  </g>

  <!-- 堕落と重生 -->
  <g fill="#8C949A">
    <polygon points="595.5,383.5 691.5,383.5 691.5,374.5 722.5,389 691.5,403.5 691.5,394.5 595.5,394.5"/>
    <polygon points="506.5,562.5 539.5,547.5 539.5,556.5 785.5,556.5 785.5,568.5 539.5,568.5 539.5,577.5"/>
  </g>
  <g font-size="41" dominant-baseline="central">
    <text x="607" y="344" textLength="93" lengthAdjust="spacing">堕落</text>
    <text x="602" y="522" textLength="93" lengthAdjust="spacing">重生</text>
    <text x="549" y="605" textLength="207" lengthAdjust="spacing">生まれ直す</text>
  </g>
</svg>
