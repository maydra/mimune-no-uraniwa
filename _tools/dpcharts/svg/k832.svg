<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. イエスはユダヤ民族の内に再臨されるか</title>

  <text x="42" y="37" font-size="29" dominant-baseline="central">Ⅰ.</text>
  <text x="82" y="37" font-size="29" dominant-baseline="central" textLength="510" lengthAdjust="spacing">イエスはユダヤ民族の内に再臨されるか</text>
  <line x1="81" y1="56" x2="591" y2="56" stroke="currentColor" stroke-width="2.2"/>

  <circle cx="163.5" cy="100" r="6.5"/>
  <circle cx="163.5" cy="198" r="6.5"/>
  <circle cx="163.5" cy="290" r="6.5"/>

  <g font-size="24" dominant-baseline="central">
    <text x="181" y="103" textLength="71" lengthAdjust="spacingAndGlyphs">黙 7:4</text>
    <text x="333" y="103" textLength="323" lengthAdjust="spacingAndGlyphs">『イスラエルの子孫の中から、印を</text>
    <text x="343" y="140" textLength="330" lengthAdjust="spacingAndGlyphs">押される者が、14万4千人である』</text>

    <text x="181" y="196" textLength="134" lengthAdjust="spacingAndGlyphs">マタイ 10:23</text>
    <text x="333" y="196" textLength="320" lengthAdjust="spacingAndGlyphs">『イスラエルの町々を回り終わら</text>
    <text x="342" y="231" textLength="323" lengthAdjust="spacingAndGlyphs">ないうちに人の子が来るであろう』</text>

    <text x="181" y="288" textLength="135" lengthAdjust="spacingAndGlyphs">マタイ 16:28</text>
    <text x="333" y="288" textLength="293" lengthAdjust="spacingAndGlyphs">『人の子がその王権をもって</text>
    <text x="344" y="323" textLength="315" lengthAdjust="spacingAndGlyphs">こられるのを、見る者がいる』</text>

    <text x="333" y="378" textLength="283" lengthAdjust="spacingAndGlyphs">ユダヤ民族の内に再臨？</text>
  </g>
  <polygon points="283,373 302,373 302,366 319,378 302,390 302,383 283,383" fill="#8C949A"/>
</svg>
