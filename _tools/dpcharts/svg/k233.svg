<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑦ サタン世界から神の世界へ復帰</title>
  <text x="49.5" y="39" font-size="29" text-anchor="middle" dominant-baseline="central">⑦</text>
  <text x="73" y="39" font-size="29" dominant-baseline="central" textLength="405" lengthAdjust="spacing">サタン世界から神の世界へ復帰</text>
  <line x1="73" y1="56" x2="478" y2="56" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦の矢印（楕円の下に描く） -->
  <polygon points="212.5,160 218.5,160 218.5,200 223,200 215.5,212 208,200 212.5,200" fill="#8C949A"/>
  <polygon points="212.5,266 218.5,266 218.5,306 223,306 215.5,318 208,306 212.5,306" fill="#8C949A"/>

  <!-- ヤコブ → モーセ → イエス -->
  <ellipse cx="215.5" cy="137" rx="48.5" ry="25" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="215.5" y="136.5" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="72" lengthAdjust="spacingAndGlyphs">ヤコブ</text>
  <ellipse cx="215.5" cy="244" rx="48.5" ry="25" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="215.5" y="243.5" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="77" lengthAdjust="spacingAndGlyphs">モーセ</text>
  <ellipse cx="215.5" cy="351.5" rx="53.5" ry="26.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="215.5" y="352" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="77" lengthAdjust="spacingAndGlyphs">イエス</text>

  <!-- 説明 -->
  <text x="305" y="136.5" font-size="30" dominant-baseline="central" textLength="93" lengthAdjust="spacing">ハラン</text>
  <polygon points="414,134.25 437,134.25 437,130.75 447,137 437,143.25 437,139.75 414,139.75" fill="#8C949A"/>
  <text x="465" y="136.5" font-size="30" dominant-baseline="central" textLength="91" lengthAdjust="spacing">カナン</text>
  <text x="306" y="243" font-size="30" dominant-baseline="central" textLength="121" lengthAdjust="spacing">エジプト</text>
  <polygon points="445,242.75 468,242.75 468,239.25 478,245.5 468,251.75 468,248.25 445,248.25" fill="#8C949A"/>
  <text x="496" y="243" font-size="30" dominant-baseline="central" textLength="91" lengthAdjust="spacing">カナン</text>
  <text x="306" y="351.5" font-size="30" dominant-baseline="central" textLength="343" lengthAdjust="spacing">エジプトに避難し、戻る</text>
</svg>
