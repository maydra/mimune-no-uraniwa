<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>二次幕屋のための基台：×</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="226,102 233.5,114.5 229.5,114.5 229.5,199 222.5,199 222.5,114.5 218.5,114.5"/>
    <polygon points="283,222.5 295.5,214.5 295.5,219.6 557,219.6 557,225.4 295.5,225.4 295.5,230.5"/>
  </g>

  <!-- 神 -->
  <circle cx="227" cy="66" r="31.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="226.5" y="66.5" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 信仰基台○ -->
  <rect x="117.5" y="119.5" width="95" height="70" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="126" y="140" textLength="55" lengthAdjust="spacing">信仰</text>
    <text x="128" y="169.5" textLength="51" lengthAdjust="spacing">基台</text>
  </g>
  <circle cx="194" cy="169.5" r="10" fill="none" stroke="currentColor" stroke-width="2.6"/>

  <!-- 実体基台：× -->
  <rect x="325.5" y="169.5" width="189" height="41" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="340" y="190" textLength="113" lengthAdjust="spacing">実体基台</text>
    <text x="463.5" y="190" text-anchor="middle">：</text>
  </g>
  <path d="M480,182 L495.5,198 M495.5,182 L480,198" stroke="currentColor" stroke-width="3" fill="none"/>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="226" cy="222.5" rx="50.5" ry="24" fill="#F8F28F"/>
    <ellipse cx="626" cy="222" rx="69.5" ry="35.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="225.5" y="222.5" font-size="27" textLength="78" lengthAdjust="spacing">モーセ</text>
    <text x="627" y="211.5" font-size="26" textLength="120" lengthAdjust="spacing">イスラエル</text>
    <text x="626.5" y="240.5" font-size="26" textLength="52" lengthAdjust="spacing">民族</text>
  </g>

  <!-- 箇条 -->
  <circle cx="280.5" cy="252.5" r="7"/>
  <circle cx="280.5" cy="285" r="7"/>
  <circle cx="280.5" cy="318" r="7"/>
  <g font-size="24" dominant-baseline="central">
    <text x="295.5" y="252.5" textLength="96" lengthAdjust="spacing">従順屈伏</text>
    <text x="296" y="285" textLength="140" lengthAdjust="spacingAndGlyphs">幕屋を建てる</text>
    <text x="298" y="318" textLength="305" lengthAdjust="spacingAndGlyphs">シナイの荒野出発、再び不信</text>
  </g>

  <!-- 二次幕屋のための基台：× -->
  <rect x="237.5" y="347.5" width="395" height="46" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="29" dominant-baseline="central" fill="#111">
    <text x="260" y="371.5" textLength="288" lengthAdjust="spacing">二次幕屋のための基台</text>
    <text x="562.5" y="371.5" text-anchor="middle">：</text>
  </g>
  <path d="M586,362 L605,381 M605,362 L586,381" stroke="#111" stroke-width="5" fill="none"/>
</svg>
