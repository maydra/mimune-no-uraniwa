<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>霊通者の混乱をいかに防ぐか？</title>

  <text x="51" y="56" font-size="50" dominant-baseline="central" textLength="700" lengthAdjust="spacing">霊通者の混乱をいかに防ぐか？</text>
  <line x1="51" y1="86" x2="751" y2="86" stroke="currentColor" stroke-width="3"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="645.5,219 657.5,219 657.5,244 666.5,244 651.5,272.5 636.5,244 645.5,244"/>
    <polygon points="651.5,375.5 666.5,402 657.5,402 657.5,443.5 645.5,443.5 645.5,402 636.5,402"/>
    <polygon points="566,371 555.6,400.1 549.5,393.1 476.7,457 469.1,448.4 541.9,384.5 535.8,377.5"/>
    <polygon points="734,371 764,378.3 757.7,385.1 830.8,452.6 823,461 749.9,393.5 743.7,400.3"/>
  </g>

  <circle cx="652" cy="165" r="51.25" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="651" y="165" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>

  <ellipse cx="651" cy="324" rx="184.5" ry="46.5" fill="#CDF8F7" stroke="currentColor" stroke-width="5"/>
  <text x="651" y="324" font-size="40" text-anchor="middle" dominant-baseline="central" fill="#111">新しい真理のみ言</text>

  <!-- 霊通者 A・B・C -->
  <g fill="#FCE5E3" stroke="currentColor" stroke-width="4">
    <ellipse cx="437" cy="491.5" rx="52.5" ry="46"/>
    <ellipse cx="651" cy="491" rx="52.5" ry="46"/>
    <ellipse cx="867" cy="491.5" rx="52.5" ry="46"/>
  </g>
  <g font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="437.5" y="491">A</text>
    <text x="651.5" y="491">B</text>
    <text x="867" y="491">C</text>
  </g>

  <!-- 二本線と左向きの矢印 -->
  <g stroke="currentColor" stroke-width="8">
    <line x1="507" y1="480.5" x2="587" y2="480.5"/>
    <line x1="520" y1="502" x2="582" y2="502"/>
    <line x1="723" y1="480.5" x2="802" y2="480.5"/>
    <line x1="735" y1="502.5" x2="797" y2="502.5"/>
  </g>
  <polygon points="503,502 523,492.5 523,511.5"/>
  <polygon points="718,502.5 738,493 738,512"/>

  <g font-size="40" text-anchor="middle" dominant-baseline="central">
    <text x="651.5" y="573">霊通者</text>
    <text x="650" y="632" textLength="622" lengthAdjust="spacing">摂理的な使命と位置を正しく悟る</text>
  </g>
</svg>
