<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>間接主管圏</title>

  <text x="50" y="75" font-size="48">2.</text>
  <text x="109" y="75" font-size="48" textLength="249" lengthAdjust="spacing">間接主管圏</text>
  <line x1="108" y1="86" x2="358" y2="86" stroke="currentColor" stroke-width="3.5"/>

  <!-- 神と完成した被造物の授受 -->
  <circle cx="410.8" cy="158" r="47" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="410" y="159" font-size="53" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="482" y="159.5" font-size="41" dominant-baseline="central" textLength="247" lengthAdjust="spacing">原理の主管者</text>
  <g fill="none" stroke="currentColor" stroke-width="7">
    <path d="M378,253 Q356.5,229.5 371,212"/>
    <path d="M444,202.5 Q458.8,229.5 448.5,246.5"/>
  </g>
  <polygon points="363,208 384,200 379,216"/>
  <polygon points="441,242 436,260 456,251"/>

  <!-- 成長期間 -->
  <polygon points="411,361.5 458,401 431.5,401 431.5,559 392.5,559 392.5,401 364.5,401" fill="#C4CCD3" stroke="currentColor" stroke-width="3.5"/>
  <g stroke="currentColor" stroke-width="6.5">
    <line x1="331" y1="429" x2="495" y2="429" stroke-dasharray="8 7.6"/>
    <line x1="331" y1="495.5" x2="493" y2="495.5" stroke-dasharray="8 7.4"/>
  </g>
  <g stroke="#111" stroke-width="6.5">
    <line x1="392.5" y1="429" x2="431.5" y2="429" stroke-dasharray="8 7.6" stroke-dashoffset="14.7"/>
    <line x1="392.5" y1="495.5" x2="431.5" y2="495.5" stroke-dasharray="8 7.4" stroke-dashoffset="15.3"/>
  </g>
  <g stroke="currentColor" stroke-width="8">
    <line x1="258" y1="356.5" x2="841" y2="356.5"/>
    <line x1="258" y1="559.5" x2="841" y2="559.5"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="411" cy="305" rx="151.5" ry="43.5" fill="#CDF8F7"/>
    <ellipse cx="411.3" cy="606" rx="91.8" ry="40.5" fill="#DCC4C4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="412" y="305.5" font-size="49">被造物完成</text>
    <text x="412" y="607" font-size="52">被造物</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="287" y="394.7" font-size="40">成<tspan x="287" dy="42.2">長</tspan><tspan x="287" dy="42.2">期</tspan><tspan x="287" dy="42.2">間</tspan></text>
    <text x="554.5" y="434.5" font-size="47">原理</text>
    <text y="499.2" font-size="40"><tspan x="511.5">（</tspan><tspan x="582">主管性</tspan><tspan x="657">・</tspan><tspan x="734">自律性</tspan><tspan x="802">）</tspan></text>
    <text x="949.5" y="353.5" font-size="52">間<tspan x="949.5" dy="54.25">接</tspan><tspan x="949.5" dy="54.25">主</tspan><tspan x="949.5" dy="54.25">管</tspan><tspan x="949.5" dy="54.25">圏</tspan></text>
    <text x="1032.5" y="299" font-size="52">原<tspan x="1032.5" dy="54.25">理</tspan><tspan x="1032.5" dy="54.25">結</tspan><tspan x="1032.5" dy="54.25">果</tspan><tspan x="1032.5" dy="54.25">主</tspan><tspan x="1032.5" dy="54.25">管</tspan><tspan x="1032.5" dy="54.25">圏</tspan></text>
  </g>
  <path d="M852,351 C862,351.5 873,356 875,370 L876,438 C876.5,450 885,456 901,457 C885,458 876.5,464 876,476 L876,544 C875,557 863,562.5 852,563" fill="none" stroke="currentColor" stroke-width="7"/>
