<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>宗教改革　新教運動</title>

  <!-- 宗教改革 -->
  <ellipse cx="194" cy="64" rx="73.6" ry="31.6" fill="#F8F28F" stroke="currentColor" stroke-width="2.8"/>
  <text x="141.9" y="64" font-size="27" dominant-baseline="central" fill="#111" textLength="105" lengthAdjust="spacing">宗教改革</text>

  <!-- 新教運動 -->
  <circle cx="291.5" cy="62.5" r="7.6"/>
  <text x="306.8" y="62.5" font-size="31" dominant-baseline="central" textLength="126" lengthAdjust="spacing">新教運動</text>

  <!-- 人物の楕円 -->
  <g fill="#FCE5E3" stroke="currentColor" stroke-width="2.4">
    <ellipse cx="552" cy="101.5" rx="67.8" ry="20.3"/>
    <ellipse cx="553.5" cy="200.5" rx="68.3" ry="21.3"/>
    <ellipse cx="533" cy="290.5" rx="49.8" ry="20.8"/>
    <ellipse cx="551.5" cy="347" rx="67.8" ry="21.3"/>
  </g>
  <g font-size="22" font-weight="400" dominant-baseline="central" fill="#111">
    <text x="500" y="101.5" textLength="104" lengthAdjust="spacing">ウィクリフ</text>
    <text x="503" y="200.5" textLength="20" lengthAdjust="spacingAndGlyphs">M</text>
    <text x="543" y="200.5" textLength="60" lengthAdjust="spacing">ルター</text>
    <text x="492" y="290.5" textLength="82" lengthAdjust="spacingAndGlyphs">カルヴィン</text>
    <text x="495" y="347" textLength="110" lengthAdjust="spacingAndGlyphs">ツウィングリ</text>
  </g>
  <circle cx="532.5" cy="200.5" r="3" fill="#111"/>

  <!-- 「－」の印 -->
  <g stroke="currentColor" stroke-width="3.6">
    <line x1="261" y1="100.8" x2="276" y2="100.8"/>
    <line x1="261" y1="153.8" x2="276" y2="153.8"/>
    <line x1="261" y1="200.8" x2="276" y2="200.8"/>
    <line x1="261" y1="289.8" x2="276" y2="289.8"/>
    <line x1="261" y1="347.8" x2="276" y2="347.8"/>
    <line x1="260" y1="403.8" x2="275" y2="403.8"/>
  </g>

  <!-- コロン -->
  <g>
    <circle cx="463.5" cy="95.5" r="2.1"/>
    <circle cx="463.5" cy="106.5" r="2.1"/>
    <circle cx="463.5" cy="148.5" r="2.1"/>
    <circle cx="463.5" cy="159.5" r="2.1"/>
    <circle cx="463.5" cy="195" r="2.1"/>
    <circle cx="463.5" cy="206.5" r="2.1"/>
    <circle cx="463.5" cy="285" r="2.1"/>
    <circle cx="463.5" cy="296.5" r="2.1"/>
    <circle cx="463.5" cy="341.5" r="2.1"/>
    <circle cx="463.5" cy="352.5" r="2.1"/>
  </g>

  <g font-size="26" dominant-baseline="central">
    <text x="286.5" y="101.5" textLength="53" lengthAdjust="spacing">14C</text>
    <text x="356" y="101.5" textLength="52" lengthAdjust="spacing">英国</text>
    <text x="286.5" y="153.5" textLength="53" lengthAdjust="spacing">15C</text>
    <text x="356.5" y="153.5" textLength="82" lengthAdjust="spacing">イタリア</text>
    <text y="153.5"><tspan x="479" textLength="53" lengthAdjust="spacing">失敗</tspan><tspan x="531">、</tspan><tspan x="558" textLength="52" lengthAdjust="spacing">処刑</tspan></text>
    <text x="286.5" y="201" textLength="88" lengthAdjust="spacing">1517年</text>
    <text x="359.5" y="241" textLength="72" lengthAdjust="spacing">ドイツ</text>
    <text x="485" y="241" textLength="184" lengthAdjust="spacing">免罪符販売反対</text>
    <text x="289.5" y="290.5" textLength="102" lengthAdjust="spacing">フランス</text>
    <text x="288.5" y="347" textLength="76" lengthAdjust="spacing">スイス</text>
    <text y="403.5"><tspan x="288" textLength="112" lengthAdjust="spacingAndGlyphs">イギリス、</tspan><tspan x="401" textLength="294" lengthAdjust="spacingAndGlyphs">オランダなどの諸国へと拡大</tspan></text>
  </g>
</svg>
