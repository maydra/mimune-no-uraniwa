<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>②家庭と財物とを中心に、長子の嗣業を復帰　③実体で天使に対する主管性復帰</title>

  <text x="160" y="72.5" font-size="27" text-anchor="middle" dominant-baseline="central">②</text>
  <text y="72.5" font-size="27" dominant-baseline="central"><tspan x="178" textLength="260" lengthAdjust="spacing">家庭と財物とを中心に</tspan><tspan x="439">、</tspan><tspan x="466" textLength="210" lengthAdjust="spacing">長子の嗣業を復帰</tspan></text>

  <!-- カナンとハラン -->
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="237" cy="144" rx="71.5" ry="33.5" fill="#fff" class="paper"/>
    <ellipse cx="581" cy="146" rx="71.5" ry="34.5" fill="#CF921C"/>
  </g>
  <text x="237" y="144" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="89" lengthAdjust="spacing">カナン</text>
  <text x="581" y="146" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="90" lengthAdjust="spacing" fill="#111">ハラン</text>

  <!-- 行き来の矢印 -->
  <polygon points="323,134 489,134 489,130 500.5,136 489,142 489,138 323,138" />
  <polygon points="497,148.5 329,148.5 329,144.5 318.5,150.5 329,156.5 329,152.5 497,152.5" />
  <text x="315" y="177.5" font-size="24" dominant-baseline="central" textLength="186" lengthAdjust="spacing">天使との組み打ち</text>
  <text x="512" y="203" font-size="25" dominant-baseline="central" textLength="21" lengthAdjust="spacingAndGlyphs">21</text>
  <text x="544" y="203" font-size="26" dominant-baseline="central" textLength="104" lengthAdjust="spacing">年間苦労</text>

  <text x="160" y="251" font-size="27" text-anchor="middle" dominant-baseline="central">③</text>
  <text x="177" y="251" font-size="27" dominant-baseline="central" textLength="367" lengthAdjust="spacing">実体で天使に対する主管性復帰</text>

  <!-- 下へ -->
  <polygon points="408,287 420,287 420,301.5 429.5,301.5 414,313.5 398.5,301.5 408,301.5" fill="#8C949A"/>

  <rect x="212.5" y="338" width="405" height="43.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text x="232" y="359.5" textLength="78" lengthAdjust="spacing">ヤコブ</text>
    <text x="323.5" y="359.5" text-anchor="middle">：</text>
    <text x="338" y="359.5" textLength="261" lengthAdjust="spacing">アベルの立場蕩減復帰</text>
  </g>
</svg>
