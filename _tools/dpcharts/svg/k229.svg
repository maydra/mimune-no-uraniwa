<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑤ 杖 (メシヤの象徴)</title>
  <text x="48.5" y="38" font-size="29" text-anchor="middle" dominant-baseline="central">⑤</text>
  <text x="70" y="38" font-size="29" dominant-baseline="central" textLength="238" lengthAdjust="spacing">杖 (メシヤの象徴)</text>
  <line x1="70" y1="55" x2="308" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦の矢印（楕円の下に描く） -->
  <polygon points="211.5,160 217.5,160 217.5,199 222,199 214.5,211 207,199 211.5,199" fill="#8C949A"/>
  <polygon points="211.5,266 217.5,266 217.5,308 222,308 214.5,320 207,308 211.5,308" fill="#8C949A"/>

  <!-- ヤコブ → モーセ → イエス -->
  <ellipse cx="215" cy="137" rx="53" ry="26" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="215.5" y="136" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="72" lengthAdjust="spacingAndGlyphs">ヤコブ</text>
  <ellipse cx="215" cy="244" rx="53" ry="26" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="214.5" y="244" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="77" lengthAdjust="spacingAndGlyphs">モーセ</text>
  <ellipse cx="215" cy="352" rx="53" ry="26" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="214.5" y="352" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="77" lengthAdjust="spacingAndGlyphs">イエス</text>

  <!-- 説明 -->
  <text x="292" y="136" font-size="31" dominant-baseline="central">杖</text>
  <polygon points="329,133.75 353,133.75 353,130.25 363,136.5 353,142.75 353,139.25 329,139.25" fill="#8C949A"/>
  <text x="373" y="136" font-size="31" dominant-baseline="central" textLength="247" lengthAdjust="spacing">ヨルダン河を渡る</text>
  <text x="292" y="244" font-size="31" dominant-baseline="central">杖</text>
  <polygon points="329,241.75 353,241.75 353,238.25 363,244.5 353,250.75 353,247.25 329,247.25" fill="#8C949A"/>
  <text x="370" y="244" font-size="31" dominant-baseline="central" textLength="156" lengthAdjust="spacing">紅海を渡る</text>
  <text x="292" y="352" font-size="31" dominant-baseline="central" textLength="93" lengthAdjust="spacing">鉄の杖</text>
  <polygon points="393,348.75 416,348.75 416,345.25 426,351.5 416,357.75 416,354.25 393,354.25" fill="#8C949A"/>
  <text x="434" y="352" font-size="31" dominant-baseline="central" textLength="249" lengthAdjust="spacing">苦海の世界を渡る</text>
</svg>
