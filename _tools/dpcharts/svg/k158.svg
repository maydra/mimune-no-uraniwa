<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>三つの供え物は何を蕩減復帰するものか？</title>

  <text x="37" y="39" font-size="29" dominant-baseline="central" textLength="538" lengthAdjust="spacing">三つの供え物は何を蕩減復帰するものか？</text>
  <line x1="36" y1="58" x2="575" y2="58" stroke="currentColor" stroke-width="2.8"/>

  <!-- 縦的な摂理 -->
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="174" y="112.5">縦</text>
    <text x="174" y="141">的</text>
    <text x="174" y="169.5">な</text>
    <text x="174" y="199">摂</text>
    <text x="174" y="228">理</text>
  </g>
  <path d="M216,79 Q209,81 209,92 L208,163 Q207,171 200.5,172.5 Q207,174 208,182 L209,254 Q209,264 216,266" fill="none" stroke="currentColor" stroke-width="2.8"/>

  <!-- 縦をつなぐ点線（箱の下に描く） -->
  <g stroke="currentColor" stroke-width="2.6" stroke-dasharray="5 2.5">
    <line x1="295" y1="132" x2="295" y2="154"/>
    <line x1="295" y1="189" x2="295" y2="219"/>
    <line x1="430.5" y1="132" x2="430.5" y2="152"/>
    <line x1="430.5" y1="191" x2="430.5" y2="213"/>
    <line x1="575.5" y1="131" x2="575.5" y2="152"/>
    <line x1="575.5" y1="190" x2="575.5" y2="215"/>
  </g>

  <!-- 横の線 -->
  <g stroke="currentColor">
    <line x1="230" y1="84" x2="640" y2="84" stroke-width="3"/>
    <line x1="230" y1="142.5" x2="640" y2="142.5" stroke-width="3"/>
    <line x1="230" y1="201.5" x2="640" y2="201.5" stroke-width="3"/>
    <line x1="230" y1="264" x2="640" y2="264" stroke-width="4.5"/>
  </g>

  <!-- アブラハム・ノア・アダム -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8">
    <ellipse cx="294.5" cy="112" rx="59.5" ry="19.5"/>
    <ellipse cx="294.5" cy="171.5" rx="51" ry="17.5"/>
    <ellipse cx="294.5" cy="235.5" rx="51" ry="17.5"/>
    <rect x="391" y="93.5" width="79" height="38.5" rx="4"/>
    <rect x="391" y="152.5" width="79" height="39" rx="4"/>
    <rect x="391" y="213.5" width="79" height="40" rx="4"/>
    <rect x="538.5" y="93.5" width="74.5" height="37" rx="4"/>
    <rect x="538.5" y="153" width="74.5" height="37" rx="4"/>
    <rect x="538.5" y="215" width="74.5" height="37" rx="4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="295" y="112.5" font-size="22" textLength="90" lengthAdjust="spacing">アブラハム</text>
    <text x="295" y="172" font-size="24">ノア</text>
    <text x="294.5" y="235.5" font-size="23">アダム</text>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="430.5" y="112.5">完成</text>
    <text x="430.5" y="172">長成</text>
    <text x="430.5" y="233.5">蘇生</text>
    <text x="575.5" y="112">雌牛</text>
    <text x="575.5" y="171.5">羊</text>
    <text x="575.5" y="233">鳩</text>
  </g>

  <!-- 下の三つ -->
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="296.5" cy="309" rx="57" ry="44.5" fill="#CDF8F7"/>
    <ellipse cx="431" cy="309" rx="67.5" ry="44.5" fill="#fff" class="paper"/>
    <ellipse cx="577" cy="307.5" rx="61.5" ry="43" fill="#DCC4C4"/>
  </g>
  <g font-size="25.5" text-anchor="middle" dominant-baseline="central">
    <text x="294" y="297" fill="#111">み旨から</text>
    <text x="297" y="327" fill="#111">三代</text>
    <text x="430" y="293.5" font-size="24.5">三段階</text>
    <text x="429.5" y="323.5" font-size="24.5">成長期間</text>
    <text x="577" y="294" fill="#111">三つの</text>
    <text x="577" y="325" fill="#111">供え物</text>
  </g>

  <!-- 象徴献祭 -->
  <rect x="210.5" y="365.5" width="434.5" height="46.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="223" y="389" textLength="143" lengthAdjust="spacing">「象徴献祭」</text>
    <text x="383" y="389" text-anchor="middle">：</text>
    <text x="397" y="389" textLength="235" lengthAdjust="spacing">一時に横的に復帰</text>
  </g>
</svg>
