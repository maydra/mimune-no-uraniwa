<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理の終末期　神中心の社会主義社会</title>

  <!-- 題の箱 -->
  <rect x="155.5" y="35" width="274" height="46" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="165.5" y="58" font-size="30" dominant-baseline="central" textLength="252" lengthAdjust="spacing">復帰摂理の終末期</text>

  <!-- 神と人（線は円より先に描く） -->
  <g stroke="#8C949A" stroke-width="5" fill="none">
    <line x1="210.5" y1="140.5" x2="149" y2="241.5"/>
    <line x1="212" y1="140.5" x2="273" y2="241.5"/>
    <line x1="210.5" y1="140.5" x2="210.5" y2="241.5"/>
    <line x1="142" y1="240" x2="279" y2="240"/>
  </g>
  <g stroke="currentColor" stroke-width="2.8">
    <circle cx="210.5" cy="140.5" r="25" fill="#fff" class="paper"/>
    <circle cx="142" cy="241.5" r="21" fill="#FCE5E3"/>
    <circle cx="210.5" cy="241.5" r="21" fill="#FCE5E3"/>
    <circle cx="279.5" cy="241.5" r="21" fill="#FCE5E3"/>
  </g>
  <text x="210.5" y="139.5" font-size="30" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="142" y="242">人</text>
    <text x="210.5" y="242">人</text>
    <text x="279" y="242">人</text>
  </g>

  <!-- 創造理想と民意 -->
  <g font-size="28" dominant-baseline="central">
    <text x="264.6" y="138.5" textLength="116" lengthAdjust="spacing">創造理想</text>
    <text x="394.5" y="138" text-anchor="middle">：</text>
    <text x="409.6" y="138.5" textLength="145" lengthAdjust="spacing">均等な環境</text>
    <text x="409.6" y="178" textLength="203" lengthAdjust="spacing">平等な生活条件</text>
    <text x="318.6" y="241.5" textLength="58" lengthAdjust="spacing">民意</text>
    <text x="390" y="241.5" text-anchor="middle">：</text>
    <text x="404.6" y="241.5" textLength="261" lengthAdjust="spacing">民主主義的自由獲得</text>
    <text x="404.6" y="281" textLength="260" lengthAdjust="spacing">社会主義的生活体制</text>
  </g>

  <!-- 灰色の太い矢印 -->
  <polygon points="413,309 425,309 425,322 434.5,322 419,337.5 403.5,322 413,322" fill="#8C949A"/>

  <!-- 神中心の社会主義社会 -->
  <rect x="237.5" y="355.5" width="349" height="46" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <text x="253.5" y="378.5" font-size="31" dominant-baseline="central" fill="#111" textLength="316" lengthAdjust="spacing">神中心の社会主義社会</text>
</svg>
