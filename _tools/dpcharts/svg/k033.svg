<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>②条件物：み言の代わりとなる条件物　③数理的な蕩減期間</title>

  <rect x="141" y="49.5" width="505" height="45.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="168.5" y="72.5" font-size="27" text-anchor="middle" dominant-baseline="central">②</text>
  <text x="192" y="72.5" font-size="28" dominant-baseline="central" textLength="436" lengthAdjust="spacing">条件物：み言の代わりとなる条件物</text>

  <g fill="currentColor">
    <circle cx="169.5" cy="139.5" r="6"/>
    <circle cx="169.5" cy="205" r="6"/>
    <circle cx="168.5" cy="270.5" r="6"/>
  </g>
  <g font-size="25" dominant-baseline="central">
    <text x="185" y="139" textLength="363" lengthAdjust="spacing">旧約以前：万物（供え物、箱舟）</text>
    <text x="185" y="205" textLength="498" lengthAdjust="spacing">旧約時代：律法、契約の箱、神殿、中心人物</text>
    <text x="183" y="271" textLength="444" lengthAdjust="spacing">新約時代：福音、イエス（み言の実体）</text>
  </g>

  <rect x="141" y="320.5" width="295" height="45.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="168.5" y="343.5" font-size="27" text-anchor="middle" dominant-baseline="central">③</text>
  <text x="192" y="343.5" font-size="28" dominant-baseline="central" textLength="227" lengthAdjust="spacing">数理的な蕩減期間</text>
</svg>
