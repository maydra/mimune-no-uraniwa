<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 人間を万物の主管位に立たせるために</title>

  <text x="53" y="77" font-size="49">Ⅲ.</text>
  <text x="126.5" y="77" font-size="49" textLength="823" lengthAdjust="spacing">人間を万物の主管位に立たせるために</text>
  <line x1="126" y1="88" x2="950" y2="88" stroke="currentColor" stroke-width="3.5"/>

  <!-- 神・完成した人・成長期間・人間（z304 と同じ形を 0.936 倍） -->
  <g transform="translate(20.5,61.2) scale(0.936)">
    <g fill="none" stroke="currentColor" stroke-width="8">
      <path d="M307.85,170.2 Q284.2,144.7 303.8,132.85"/>
      <path d="M394.15,118 Q417.8,143.5 398.2,155.35"/>
    </g>
    <polygon points="316.5,119.9 296.8,126.6 310.8,139.1"/>
    <polygon points="385.5,168.3 405.2,161.6 391.2,149.1"/>
    <g stroke="currentColor" stroke-width="4.5">
      <circle cx="351.5" cy="86" r="47.5" fill="#fff" class="paper"/>
      <ellipse cx="351" cy="212.75" rx="66.25" ry="46.75" fill="#CDF8F7"/>
      <ellipse cx="351" cy="510" rx="61.25" ry="46.5" fill="#FCE5E3"/>
    </g>
    <polygon points="351,271 388.5,314.5 368.5,314.5 368.5,463.5 333.5,463.5 333.5,314.5 313.5,314.5" fill="#C4CCD3" stroke="currentColor" stroke-width="4"/>
    <g stroke="currentColor" stroke-width="7.5">
      <line x1="234" y1="265" x2="468" y2="265"/>
      <line x1="286" y1="330.5" x2="413" y2="330.5"/>
      <line x1="286" y1="393.5" x2="413" y2="393.5"/>
      <line x1="234" y1="459" x2="468" y2="459"/>
    </g>
    <g stroke="#111" stroke-width="7.5">
      <line x1="333.5" y1="330.5" x2="368.5" y2="330.5"/>
      <line x1="333.5" y1="393.5" x2="368.5" y2="393.5"/>
      <line x1="333.5" y1="459" x2="368.5" y2="459"/>
    </g>
    <g text-anchor="middle" dominant-baseline="central">
      <text x="350.5" y="85.5" font-size="52">神</text>
      <g fill="#111">
        <text x="319.5" y="212" font-size="45">完</text>
        <text x="383.5" y="212" font-size="45">人</text>
        <text x="350" y="510.5" font-size="46">人間</text>
      </g>
    </g>
    <circle cx="351" cy="212" r="5.5" fill="#111"/>
  </g>

  <!-- 創造性 → 万物主管位 -->
  <polygon points="581,244.5 615,244.5 615,236 641,250 615,264 615,255.5 581,255.5" fill="#8C949A"/>

  <!-- 干渉： -->
  <rect x="458.5" y="361" width="110.5" height="66" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <rect x="585.5" y="382.5" width="8" height="7"/>
  <rect x="585.5" y="399" width="8" height="7.5"/>
  <polyline points="633.5,296 615.5,320.5 615.5,523.5 632.5,546.5" fill="none" stroke="currentColor" stroke-width="8"/>

  <!-- 右の箱 -->
  <g fill="#8C949A">
    <polygon points="820.5,360 834.5,360 834.5,368.5 839.5,368.5 827.5,393.5 815.5,368.5 820.5,368.5"/>
    <polygon points="820.5,458.5 834.5,458.5 834.5,467.5 839.5,467.5 827.5,492.5 815.5,467.5 820.5,467.5"/>
  </g>
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5">
    <rect x="658.5" y="298" width="392.5" height="60" rx="4.5"/>
    <rect x="658.5" y="396.5" width="392.5" height="60" rx="4.5"/>
    <rect x="658.5" y="496" width="392.5" height="60"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central" font-size="41">
    <text x="499.5" y="249">創造性</text>
    <text x="764.5" y="249">万物主管位</text>
    <text x="511.5" y="396">干渉</text>
    <text x="854.5" y="328" textLength="363" lengthAdjust="spacingAndGlyphs">責任分担完遂できない</text>
    <text x="854.5" y="427">創造性もてない</text>
    <text x="854" y="526">万物主管資格なし</text>
  </g>

  <!-- 結論 -->
  <rect x="394.5" y="592.5" width="503.5" height="71.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="648" y="628" font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">堕落行為干渉できない</text>
</svg>
