<h1>詩篇 第126章</h1>
<div class="the-post-cont">

<p><sup>1</sup>主がシオンの繁栄を回復されたとき、われらは夢みる者のようであった。</p>
<p><sup>2</sup>その時われらの口は笑いで満たされ、われらの舌は喜びの声で満たされた。その時「主は彼らのために大いなる事をなされた」と言った者が、もろもろの国民の中にあった。</p>
<p><sup>3</sup>主はわれらのために大いなる事をなされたので、われらは喜んだ。</p>
<p><sup>4</sup>主よ、どうか、われらの繁栄を、ネゲブの川のように回復してください。</p>
<p><sup>5</sup>涙をもって種まく者は、喜びの声をもって刈り取る。</p>
<p><sup>6</sup>種を携え、涙を流して出て行く者は、束を携え、喜びの声をあげて帰ってくるであろう。</p>
