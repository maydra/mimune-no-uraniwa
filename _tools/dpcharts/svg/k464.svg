<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 縦的な蕩減条件と横的な蕩減復帰</title>
  <defs>
    <marker id="k464-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="36" y="36.5" font-size="30" dominant-baseline="central">Ⅱ.</text>
  <text x="85" y="36" font-size="30" dominant-baseline="central" textLength="470" lengthAdjust="spacing">縦的な蕩減条件と横的な蕩減復帰</text>
  <line x1="84" y1="55" x2="557" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦的な蕩減条件（縦の札） -->
  <rect x="178.5" y="83.5" width="41" height="223" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="199.5" y="108">縦</text>
    <text x="199.5" y="137">的</text>
    <text x="199.5" y="166">な</text>
    <text x="199.5" y="195">蕩</text>
    <text x="199.5" y="224">減</text>
    <text x="199.5" y="253">条</text>
    <text x="199.5" y="282">件</text>
  </g>

  <!-- 茶の太い下向きの矢印 -->
  <polygon points="282.5,86.5 362.5,86.5 362.5,200.5 396,200.5 322.5,244.5 249,200.5 282.5,200.5" fill="#CF921C" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter"/>
  <g font-size="33" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="307.5" y="113">A</text>
    <text x="307.5" y="145.5">B</text>
    <text x="307.5" y="178">C</text>
  </g>
  <!-- × -->
  <g stroke="#111" stroke-width="3.5" stroke-linecap="butt">
    <path d="M327,103 L346,122 M346,103 L327,122"/>
    <path d="M327.5,136 L346.5,155 M346.5,136 L327.5,155"/>
    <path d="M327,168.5 L346,187.5 M346,168.5 L327,187.5"/>
  </g>

  <!-- 白抜きの右向きの矢印 -->
  <polygon points="403,254 523,254 523,226.5 572,292 523,357.5 523,330 403,330" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>

  <!-- 中心人物から C′B′A′ へ -->
  <line x1="399" y1="284.5" x2="500.5" y2="284.5" stroke="currentColor" stroke-width="2.2"/>
  <ellipse cx="321" cy="284.3" rx="77.5" ry="35.7" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <text x="321.5" y="284.5" font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="111" lengthAdjust="spacing">中心人物</text>
  <g fill="#C4CCD3" stroke="currentColor" stroke-width="2.2">
    <circle cx="432.5" cy="284.5" r="9.5"/>
    <circle cx="466.5" cy="284.5" r="9.5"/>
    <circle cx="500.5" cy="284.5" r="9.5"/>
  </g>
  <text y="314" font-size="30" dominant-baseline="central"><tspan x="423">C</tspan><tspan x="445">′</tspan><tspan x="459">B</tspan><tspan x="478">′</tspan><tspan x="490">A</tspan><tspan x="509">′</tspan></text>

  <!-- A・B・C から A′・B′・C′ へ（茶の面の中は #111） -->
  <g stroke="#111" stroke-width="3.5">
    <line x1="352" y1="117" x2="363" y2="128.4"/>
    <line x1="353" y1="155.4" x2="363" y2="165.8"/>
    <line x1="351" y1="191" x2="373.1" y2="214.2"/>
  </g>
  <g stroke="currentColor" stroke-width="3.5" fill="none" marker-end="url(#k464-a)">
    <path d="M363,128.4 L495.6,265"/>
    <path d="M363,165.8 L460.2,265.8"/>
    <path d="M373.1,214.2 L425.2,268.3"/>
  </g>

  <!-- 横的な蕩減復帰 -->
  <rect x="365" y="371.5" width="232" height="41.5" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="383" y="392.5" font-size="28" dominant-baseline="central" fill="#111" textLength="199" lengthAdjust="spacing">横的な蕩減復帰</text>
</svg>
