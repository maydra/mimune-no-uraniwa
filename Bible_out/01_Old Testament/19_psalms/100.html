<h1>詩篇 第100章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>全地よ、主にむかって喜ばしき声をあげよ。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>喜びをもって主に仕えよ。歌いつつ、そのみ前にきたれ。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>主こそ神であることを知れ。われらを造られたものは主であって、われらは主のものである。われらはその民、その牧の羊である。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>感謝しつつ、その門に入り、ほめたたえつつ、その大庭に入れ。主に感謝し、そのみ名をほめまつれ。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>主は恵みふかく、そのいつくしみはかぎりなく、そのまことはよろず代に及ぶからである。</p>
