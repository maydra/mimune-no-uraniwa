    <circle cx="958.75" cy="307" r="80.75"/>
    <circle cx="963" cy="506" r="80.75"/>
  </g>

  <!-- 円の中の字 -->
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="32">
      <text x="278.5" y="364">本性相</text>
      <text x="279" y="460">本形状</text>
    </g>
    <g font-size="36">
      <text x="932" y="272">性相</text>
      <text x="936.5" y="344">形状</text>
      <text x="937" y="472.5">性相</text>
      <text x="940.5" y="543">形状</text>
    </g>
  </g>
  <!-- ＜（＋ と －） -->
  <g fill="none" stroke="#111" stroke-width="4.5" stroke-linejoin="round">
    <polyline points="344.5,348.5 339,363 344.5,377.5"/>
    <polyline points="344.5,443.5 339,458 344.5,472.5"/>
    <polyline points="982.5,261.5 977,271.5 982.5,281.5"/>
    <polyline points="982.5,335.5 977,345.5 982.5,355.5"/>
    <polyline points="987,459.5 981.5,469.5 987,479.5"/>
    <polyline points="987,534.5 981.5,544.5 987,554.5"/>
  </g>
  <g stroke="#111" stroke-width="4">
    <path d="M352,352 h20 M362,342 v20"/>
    <path d="M353,446 h20 M363,436 v20"/>
    <path d="M990,257 h21 M1000.5,246.5 v21"/>
    <path d="M990,333.5 h21 M1000.5,323 v21"/>
    <path d="M994,455 h22 M1005,444 v22"/>
    <path d="M994,532 h22 M1005,521 v22"/>
  </g>
  <g stroke="#111" stroke-width="4.5">
    <path d="M353,380 h20"/>
    <path d="M353,473.5 h20"/>
    <path d="M991,283.5 h21"/>
    <path d="M990,358.5 h21"/>
    <path d="M995,482 h22"/>
    <path d="M994,557 h21"/>
  </g>

  <!-- 神から実体対象へ -->
  <polygon points="414,401 438,401 438,389.5 471,406.5 438,423.5 438,412 414,412" fill="#8C949A"/>

  <!-- 実体対象 ＝ 個性真理体 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5">
    <rect x="483.25" y="291.25" width="75.5" height="233.5" rx="10"/>
    <rect x="631.25" y="259.25" width="75.5" height="294.5" rx="10"/>
  </g>
  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="521.5" y="333.5">実<tspan x="521.5" dy="50">体</tspan><tspan x="521.5" dy="50">対</tspan><tspan x="521.5" dy="50">象</tspan></text>
    <text x="669" y="307">個<tspan x="669" dy="50">性</tspan><tspan x="669" dy="50">真</tspan><tspan x="669" dy="50">理</tspan><tspan x="669" dy="50">体</tspan></text>
  </g>
  <rect x="579" y="392" width="37" height="8.5" fill="currentColor"/>
  <rect x="579" y="411.5" width="37" height="8.5" fill="currentColor"/>

  <!-- 形象的・象徴的 -->
  <polyline points="844.3,332 728.4,410.2 843.7,481.5" fill="none" stroke="#8C949A" stroke-width="11" marker-start="url(#z071-g)" marker-end="url(#z071-g)"/>
  <g font-size="40" text-anchor="middle" dominant-baseline="central">
    <text x="739" y="355.5">形</text>
    <text x="780" y="325.5">象</text>
    <text x="822.5" y="298.5">的</text>
    <text x="739" y="461.5">象</text>
    <text x="781" y="487.5">徴</text>
    <text x="822.5" y="513.5">的</text>
  </g>

  <!-- 人間・万物 -->
  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="1083.5" y="273">人<tspan x="1083.5" dy="51">間</tspan></text>
    <text x="1083.5" y="485">万<tspan x="1083.5" dy="49">物</tspan></text>
  </g>
</svg>
