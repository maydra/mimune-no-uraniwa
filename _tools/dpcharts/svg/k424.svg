<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. 再臨主を中心とする実体的カナン復帰路程　再臨主の誕生</title>

  <g dominant-baseline="central">
    <text x="34" y="38" font-size="30" textLength="25" lengthAdjust="spacingAndGlyphs">2.</text>
    <text x="69" y="38" font-size="30" textLength="533" lengthAdjust="spacingAndGlyphs">再臨主を中心とする実体的カナン復帰路程</text>
    <text x="68" y="84" font-size="28" textLength="173" lengthAdjust="spacing">再臨主の誕生</text>
  </g>
  <line x1="69" y1="56.5" x2="602" y2="56.5" stroke="currentColor" stroke-width="2.4"/>
  <line x1="67" y1="102" x2="241" y2="102" stroke="currentColor" stroke-width="2.4"/>

  <g font-size="28" dominant-baseline="central">
    <text x="150" y="149" textLength="114" lengthAdjust="spacing">霊的路程</text>
    <text x="379" y="149" textLength="113" lengthAdjust="spacing">実体路程</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="373.5,206 361,197.5 361,202.8 260,202.8 260,209.3 361,209.3 361,214.5"/>
    <polygon points="373.5,295.5 361,287 361,292.3 260,292.3 260,298.8 361,298.8 361,304"/>
    <polygon points="437,352.8 451.5,340.5 443.2,340.5 443.2,329 430.8,329 430.8,340.5 422.5,340.5"/>
  </g>

  <!-- モーセ → ヨシュア、イエス → 再臨主 -->
  <g stroke="currentColor" stroke-width="2.6" fill="#F8F28F">
    <ellipse cx="206" cy="206" rx="56.7" ry="24.7"/>
    <ellipse cx="434.5" cy="206" rx="56.2" ry="24.7"/>
    <ellipse cx="206" cy="295.5" rx="56.7" ry="25.2"/>
    <ellipse cx="434.5" cy="295.5" rx="56.2" ry="25.2"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="205.5" y="206.5" textLength="84" lengthAdjust="spacing">モーセ</text>
    <text x="434.5" y="206.5" textLength="92" lengthAdjust="spacingAndGlyphs">ヨシュア</text>
    <text x="205.5" y="296" textLength="84" lengthAdjust="spacing">イエス</text>
    <text x="434" y="295.5" font-size="28" textLength="87" lengthAdjust="spacing">再臨主</text>
  </g>

  <!-- ：カナン復帰・：地上天国 -->
  <g font-size="27" dominant-baseline="central">
    <text x="503" y="205.5" text-anchor="middle">：</text>
    <text x="519" y="205.5" textLength="142" lengthAdjust="spacing">カナン復帰</text>
    <text x="502" y="296" text-anchor="middle">：</text>
    <text x="516.5" y="295.5" font-size="28" textLength="115" lengthAdjust="spacing">地上天国</text>
  </g>

  <!-- 地上誕生 -->
  <rect x="358.5" y="359.5" width="159" height="42.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="436" y="380.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="115" lengthAdjust="spacing">地上誕生</text>
</svg>
