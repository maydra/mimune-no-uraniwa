<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>世界大戦の内的原因　① サタンの最後の発悪</title>

  <!-- 題 -->
  <text x="35" y="40" font-size="30" dominant-baseline="central" textLength="282" lengthAdjust="spacing">世界大戦の内的原因</text>
  <line x1="34" y1="58.5" x2="318" y2="58.5" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="28" dominant-baseline="central">
    <text x="79" y="85" font-size="30" text-anchor="middle">①</text>
    <text x="104" y="85" textLength="257" lengthAdjust="spacing">サタンの最後の発悪</text>
  </g>
  <line x1="102" y1="103" x2="363" y2="103" stroke="currentColor" stroke-width="2.5"/>

  <!-- 交わる灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="288.5,205.1 512.3,313.9 509.9,318.8 530.0,318.6 517.7,302.6 515.3,307.6 291.5,198.9"/>
    <polygon points="291.5,322.1 515.4,212.3 517.8,217.2 530.0,201.2 509.9,201.1 512.3,206.0 288.5,315.9"/>
    <polygon points="406,222 416,222 416,238 421,238 411,247.5 401,238 406,238"/>
  </g>
  <circle cx="410.5" cy="260" r="9.5"/>

  <!-- 再臨主 -->
  <ellipse cx="411" cy="168.5" rx="28.5" ry="53" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="410.5" y="140">再</text>
    <text x="410.5" y="168.5">臨</text>
    <text x="410.5" y="197">主</text>
  </g>

  <!-- サタンと神 -->
  <ellipse cx="232.5" cy="185.5" rx="53" ry="35" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <text x="232" y="185" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="82" lengthAdjust="spacing">サタン</text>
  <ellipse cx="232" cy="331.5" rx="53.5" ry="35" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <text x="229.5" y="331.5" font-size="36" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="28" dominant-baseline="central">
    <text x="161" y="247" textLength="143" lengthAdjust="spacing">非原理世界</text>
    <text x="176" y="394.5" textLength="113" lengthAdjust="spacing">原理世界</text>
    <text x="339" y="313.5" textLength="141" lengthAdjust="spacing">最後の発悪</text>
  </g>

  <!-- 善主権と悪主権 -->
  <rect x="537.5" y="159.5" width="122" height="54" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="598" y="186.5" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="92" lengthAdjust="spacing">善主権</text>
  <rect x="537.5" y="301.5" width="120" height="54" fill="#50403D" stroke="currentColor" stroke-width="2.8"/>
  <text x="597.5" y="328.5" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="91" lengthAdjust="spacing">悪主権</text>

  <!-- 世界大戦 -->
  <line x1="408.5" y1="332" x2="408.5" y2="362" stroke="currentColor" stroke-width="5" stroke-dasharray="6 6"/>
  <rect x="340.5" y="366.5" width="136" height="42" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <text x="408" y="388.5" font-size="28.5" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="114" lengthAdjust="spacing">世界大戦</text>
</svg>
