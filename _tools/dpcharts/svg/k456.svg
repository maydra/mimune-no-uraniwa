<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>実体献祭と象徴献祭　二つの献祭復帰のための摂理の反復</title>

  <!-- メシヤのための基台 ＝ 実体基台 ＋ 信仰基台 -->
  <rect x="137" y="62" width="310" height="43" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="151" y="84" font-size="29" dominant-baseline="central" textLength="281" lengthAdjust="spacing">メシヤのための基台</text>
  <g stroke="currentColor" stroke-width="5">
    <line x1="227" y1="124" x2="227" y2="152"/>
    <line x1="241" y1="124" x2="241" y2="152"/>
    <line x1="230.5" y1="239.5" x2="230.5" y2="272.5" stroke-width="6"/>
    <line x1="214" y1="255.5" x2="248" y2="255.5" stroke-width="6"/>
  </g>
  <g stroke="currentColor" stroke-width="3" fill="#fff" class="paper">
    <rect x="149" y="170" width="164" height="41"/>
    <rect x="149" y="302" width="164" height="41"/>
  </g>
  <g font-size="29" dominant-baseline="central">
    <text x="169" y="190.5" textLength="125" lengthAdjust="spacing">実体基台</text>
    <text x="168" y="322.5" textLength="126" lengthAdjust="spacing">信仰基台</text>
    <text x="343" y="190.5" textLength="126" lengthAdjust="spacing">実体献祭</text>
    <text x="345" y="322.5" textLength="126" lengthAdjust="spacing">象徴献祭</text>
  </g>
  <g stroke="#8C949A" stroke-width="6">
    <line x1="314" y1="191.5" x2="338.5" y2="191.5"/>
    <line x1="314" y1="321.5" x2="338.5" y2="321.5"/>
  </g>

  <polygon points="471,243.5 488.5,243.5 488.5,231 506.5,250.5 488.5,270 488.5,257 471,257" fill="#8C949A"/>

  <!-- 二つの献祭復帰のための摂理の反復 -->
  <rect x="517" y="170" width="172" height="178" rx="5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="547.5 579 611" y="200">二つの</text>
    <text x="546.5 574.5 603 631.5 659.5" y="239.5">献祭復帰の</text>
    <text x="546.5 574.5 602.5 631.5 660" y="278.5">ための摂理</text>
    <text x="548 579 610.5" y="318">の反復</text>
  </g>
</svg>
