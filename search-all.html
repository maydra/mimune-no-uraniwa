<!DOCTYPE html>

<html lang="ja">

<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="utf-8" />
  <title>み旨の裏庭 | サイト内一括検索</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="color-scheme" content="light dark">
  <link href="/mimune-no-uraniwa/favicon.png?v=202609191103" rel="icon" type="image/png" />
  <link rel="stylesheet" href="theme/style.css?v=202609191103">
  <style>
    :root {
      --bg: #ffffff;
      --text: #333333;
      --input-bg: #f9f9f9;
      --input-border: #cccccc;
      --input-text: #333333;
      --stats-color: #666666;
      --item-border: #eeeeee;
      --link-color: #0066cc;
      --link-hover: #004d99;
      --snippet-color: #444444;
      --mark-bg: #fffacd;
      --mark-text: #000000;
      --warning-bg: #fff3cd;
      --warning-text: #856404;
      --warning-border: transparent;
      --btn-bg: #f0f0f0;
      --btn-text: #333333;
      --btn-border: #cccccc;
    }

    /* System preference sync */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #ffffff;
        --input-bg: #2a2a2a;
        --input-border: #444444;
        --input-text: #ffffff;
        --stats-color: #aaaaaa;
        --item-border: #333333;
        --link-color: #66b3ff;
        --link-hover: #99ccff;
        --snippet-color: #e0e0e0;
        --mark-bg: #8b7300;
        --mark-text: #ffffff;
        --warning-bg: #3d3416;
        --warning-text: #ffda6a;
        --warning-border: #665c1e;
        --btn-bg: #444444;
        --btn-text: #ffffff;
        --btn-border: #666666;
      }
    }

    /* Manual toggle classes from script.js */
    body.light-mode {
      --bg: #ffffff !important;
      --text: #333333 !important;
      --input-bg: #f9f9f9 !important;
      --input-border: #cccccc !important;
      --input-text: #333333 !important;
      --stats-color: #666666 !important;
      --item-border: #eeeeee !important;
      --link-color: #0066cc !important;
      --link-hover: #004d99 !important;
      --snippet-color: #444444 !important;
      --mark-bg: #fffacd !important;
      --mark-text: #000000 !important;
      --warning-bg: #fff3cd !important;
      --warning-text: #856404 !important;
      --btn-bg: #f0f0f0 !important;
      --btn-text: #333333 !important;
    }

    body.dark-mode {
      --bg: #1a1a1a !important;
      --text: #ffffff !important;
      --input-bg: #2a2a2a !important;
      --input-border: #444444 !important;
      --input-text: #ffffff !important;
      --stats-color: #aaaaaa !important;
      --item-border: #333333 !important;
      --link-color: #66b3ff !important;
      --link-hover: #99ccff !important;
      --snippet-color: #e0e0e0 !important;
      --mark-bg: #8b7300 !important;
      --mark-text: #ffffff !important;
      --warning-bg: #3d3416 !important;
      --warning-text: #ffda6a !important;
      --warning-border: #665c1e !important;
      --btn-bg: #444444 !important;
      --btn-text: #ffffff !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      max-width: 800px;
      margin: 1em auto;
      padding: 0 1em;
      color: var(--text);
      background-color: var(--bg);
      background-image: none !important;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1 {
      font-size: 1.5em;
      margin-bottom: 0.5em;
    }

    .search-container {
      margin-bottom: 2em;
      background-color: var(--bg);
      forced-color-adjust: none;
    }

    #search-input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      box-sizing: border-box;
      border: 2px solid var(--input-border);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--input-text);
      transition: all 0.3s ease;
    }

    #search-input::placeholder {
      color: var(--stats-color);
      opacity: 0.7;
    }

    .search-mode {
      margin-top: 0.75em;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em 1.5em;
      font-size: 0.95em;
    }

    .search-mode label {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      cursor: pointer;
    }

    .search-mode input[type="radio"],
    .search-mode input[type="checkbox"] {
      width: 1.1em;
      height: 1.1em;
      accent-color: var(--link-color);
      cursor: pointer;
    }

    /* 聖書を外すチェックは AND/OR とは別の話なので、少し離して置く */
    .search-filter {
      margin-top: 0.5em;
      padding-top: 0.5em;
      border-top: 1px solid var(--btn-border);
    }

    .search-hint {
      margin-top: 0.75em;
      font-size: 0.85em;
      line-height: 1.6;
      color: var(--stats-color);
    }

    #search-stats {
      margin-top: 0.5em;
      font-size: 0.9em;
      color: var(--stats-color);
    }

    .result-item {
      margin-bottom: 2em;
      border-bottom: 1px solid var(--item-border);
      padding-bottom: 1em;
      background-color: var(--bg);
      forced-color-adjust: none;

      /* 結果は千件を超えることがある。画面の外に出ているぶんは組版しない。
         これが無いと 1,800 件で 2 秒以上固まる。高さの目安を添えて、
         スクロールバーが伸び縮みしないようにしておく。 */
      content-visibility: auto;
      contain-intrinsic-size: auto 150px;
    }

    .result-title {
      font-size: 1.25em;
      font-weight: 700;
      margin-bottom: 0.25em;
    }

    .result-title a {
      text-decoration: none;
      color: var(--link-color);
    }

    .result-title a:hover {
      text-decoration: underline;
      color: var(--link-hover);
    }

    .result-snippet {
      font-size: 0.95em;
      color: var(--snippet-color);
    }

    mark {
      background-color: var(--mark-bg);
      color: var(--mark-text);
      padding: 0 2px;
      border-radius: 2px;
      font-weight: 600;
    }

    .nav-link {
      display: inline-block;
      margin-bottom: 1.5em;
      text-decoration: none;
      color: var(--link-color);
      font-weight: 500;
    }

    .warning {
      background-color: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid var(--warning-border);
      padding: 1em;
      border-radius: 8px;
      margin-bottom: 1.5em;
      font-size: 0.9em;
    }

    button {
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    button:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    #search-results {
      color: var(--text);
    }

    /* .search-mode などは display を持っているので、hidden を効かせる */
    [hidden] {
      display: none !important;
    }

    /* 「1冊の中だけを探しています」の帯 */
    #search-scope {
      margin-bottom: 1.5em;
      padding: 0.7em 1em;
      border-radius: 8px;
      background-color: var(--input-bg);
      border: 1px solid var(--item-border);
      color: var(--stats-color);
      font-size: 0.9em;
    }

    #search-scope a {
      margin-left: 0.8em;
      color: var(--link-color);
      font-weight: 500;
    }
  </style>
</head>

<body>
  <a class="nav-link" href="index.html">← トップページに戻る</a>
  <h1 id="サイト内一括検索"><a href="#サイト内一括検索">サイト内一括検索</a></h1>
  <div id="search-scope" hidden></div>
  <div class="search-container">
    <input id="search-input" placeholder="キーワードを入力してEnter または 検索ボタン" type="text" />
    <div class="search-mode">
      <label><input type="radio" name="search-mode" value="and" checked /> すべての語を含む（AND）</label>
      <label><input type="radio" name="search-mode" value="or" /> どれかの語を含む（OR）</label>
    </div>
    <div class="search-mode search-filter">
      <label><input type="checkbox" id="exclude-bible" checked /> 聖書の検索結果を除く</label>
    </div>
    <button id="search-btn">検索実行</button>
    <div class="search-hint">打った文字列をそのまま探します。<br />
      語と語をスペースで区切ると、AND は全部を含むページ、OR はどれかを含むページが出ます。<br />
      「祝福 OR 家庭」「祝福 | 家庭」と書けば、選択に関係なく OR で検索します。</div>
    <div id="search-stats"></div>
  </div>
  <div id="search-results"></div>
  <script src="search-all.js?v=202609191103"></script>

  <script src="theme/script.js?v=202609191103"></script>
</body>

</html>
