<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 創造目的の完成から見た人間とイエス</title>

  <text x="75.5" y="57.5" font-size="46" text-anchor="middle" dominant-baseline="central">Ⅱ</text>
  <text x="101" y="57.5" font-size="46" dominant-baseline="central">.</text>
  <g font-size="47.5" dominant-baseline="central">
    <text x="130" y="56.5" textLength="526" lengthAdjust="spacing">創造目的の完成から見た</text>
    <text x="659" y="56.5" textLength="286" lengthAdjust="spacing">人間とイエス</text>
  </g>
  <line x1="131" y1="87" x2="946" y2="87" stroke="currentColor" stroke-width="3"/>

  <!-- 価値の箱 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4">
    <rect x="198" y="155.5" width="438" height="93"/>
    <rect x="737.5" y="155.5" width="362.5" height="93"/>
  </g>
  <g font-size="45" dominant-baseline="central">
    <text x="215" y="201.5" textLength="405" lengthAdjust="spacing">完成した男性の価値</text>
    <text x="770" y="202" textLength="298" lengthAdjust="spacing">イエスの価値</text>
  </g>
  <!-- ＝ -->
  <rect x="662" y="188" width="51" height="10"/>
  <rect x="662" y="207" width="51" height="10"/>

  <!-- 箱から人への点線 -->
  <g stroke="currentColor" stroke-width="6" stroke-dasharray="17 9">
    <line x1="403.5" y1="250" x2="403.5" y2="316" stroke-dashoffset="12"/>
    <line x1="921.5" y1="250" x2="921.5" y2="316" stroke-dashoffset="13"/>
  </g>

  <!-- 人（100×240 の型を桃色で置く） -->
  <g transform="translate(347.6,315.5) scale(1.108,0.9085)" fill="#F98AEE" stroke="#111" stroke-width="4.5" stroke-linejoin="round">
    <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
    <circle cx="50" cy="22" r="19"/>
  </g>
  <g transform="translate(867.6,315.5) scale(1.108,0.9085)" fill="#F98AEE" stroke="#111" stroke-width="4.5" stroke-linejoin="round">
    <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
    <circle cx="50" cy="22" r="19"/>
  </g>

  <!-- 縦書きの字（1字ずつ） -->
  <g font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="312" y="345.5">完</text>
    <text x="312.5" y="391">成</text>
    <text x="312" y="437">人</text>
    <text x="312.5" y="483.5">間</text>
    <text x="1021.5" y="368.5">イ</text>
    <text x="1023" y="414.5">エ</text>
    <text x="1023" y="461.5">ス</text>
  </g>

  <rect x="404" y="548.5" width="509" height="85" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="53" dominant-baseline="central" fill="#111">
    <text x="433" y="591" textLength="163.5" lengthAdjust="spacing">イエス</text>
    <text x="627.5" y="591" text-anchor="middle">＝</text>
    <text x="662" y="591" textLength="219" lengthAdjust="spacing">完成人間</text>
  </g>
</svg>
