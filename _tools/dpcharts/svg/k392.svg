<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第一の試練の答え　イエス：霊人体を生かすみ言の糧</title>

  <!-- 答え -->
  <rect x="126.5" y="24.5" width="68" height="37" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="160.5" y="43.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="54" lengthAdjust="spacing">答え</text>
  <g font-size="24" dominant-baseline="central">
    <text y="36" font-weight="400"><tspan x="205">『</tspan><tspan x="221.5" textLength="387" lengthAdjust="spacing">人はパンだけで生きるものではなく</tspan><tspan x="608">、</tspan></text>
    <text y="75.5" font-weight="400"><tspan x="219" textLength="292" lengthAdjust="spacing">神の言で生きるものである</tspan><tspan x="509">』</tspan></text>
    <text y="76" font-size="21"><tspan x="535">(</tspan><tspan x="544" textLength="96" lengthAdjust="spacing">マタイ4:4</tspan><tspan x="642">)</tspan></text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="217.5,150 217.5,173 213,173 221,185 229,173 224.5,173 224.5,150"/>
    <polygon points="415.5,150 415.5,180 410.5,180 418.5,192 426.5,180 421.5,180 421.5,150"/>
    <polygon points="299,227 321,227 321,232.5 337,222 321,211.5 321,217 299,217"/>
    <polygon points="216.5,248 216.5,286 212.5,286 220,297 227.5,286 223.5,286 223.5,248"/>
    <polygon points="396.5,243.3 285.1,295.9 282.9,291.4 273,305.5 290.2,306.8 288.1,302.3 399.5,249.7"/>
  </g>

  <!-- × -->
  <g stroke="currentColor" stroke-width="4.5">
    <line x1="206" y1="256" x2="236.5" y2="278.5"/>
    <line x1="206" y1="278.5" x2="236.5" y2="256"/>
  </g>

  <!-- 神 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <circle cx="221" cy="124.5" r="28"/>
    <circle cx="419" cy="123.5" r="28"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="220.5" y="124.5">神</text>
    <text x="418" y="123.5">神</text>
  </g>

  <!-- み言・イエス・堕人 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="222" cy="222" rx="54.5" ry="26.5" fill="#fff" class="paper"/>
    <ellipse cx="420" cy="223.5" rx="54.5" ry="27" fill="#F8F28F"/>
    <ellipse cx="221" cy="327" rx="58.5" ry="23.5" fill="#CF921C"/>
  </g>
  <text x="221.5" y="221.5" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="58" lengthAdjust="spacing">み言</text>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="420" y="223.5" textLength="82" lengthAdjust="spacing">イエス</text>
    <text x="198" y="327">堕</text>
    <text x="245" y="327">人</text>
  </g>
  <circle cx="221" cy="327" r="3.3" fill="#111"/>

  <g dominant-baseline="central">
    <text x="484" y="203.5" font-size="23" textLength="190" lengthAdjust="spacing">み言が肉身と化す</text>
    <text x="486" y="233.5" font-size="20" textLength="127" lengthAdjust="spacing">(ヨハネ 1:14)</text>
  </g>

  <!-- イエス：霊人体を生かすみ言の糧 -->
  <rect x="175.5" y="367.5" width="474" height="46" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text y="390.5"><tspan x="190" textLength="84" lengthAdjust="spacing">イエス</tspan><tspan x="284">：</tspan></text>
    <text x="320" y="390.5" textLength="318" lengthAdjust="spacing">霊人体を生かすみ言の糧</text>
  </g>
</svg>
