<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. イエスの再臨は地上誕生をもってなされる　① ルカ 17:24～25</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="39" y="39">Ⅱ.</text>
    <text x="81" y="39" textLength="507" lengthAdjust="spacing">イエスの再臨は地上誕生をもってなされる</text>
  </g>
  <line x1="81" y1="58" x2="590" y2="58" stroke="currentColor" stroke-width="2.6"/>

  <!-- ① ルカ 17:24～25 -->
  <g font-size="24" dominant-baseline="central">
    <text x="53" y="96.5">①</text>
    <text x="89" y="96.5" textLength="49" lengthAdjust="spacing">ルカ</text>
    <text x="149" y="96.5" textLength="121" lengthAdjust="spacing">17:24～25</text>
  </g>

  <!-- 聖句 -->
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="183" y="142.5" textLength="292" lengthAdjust="spacing">『…多くの苦しみを受け、</text>
    <text x="192" y="179.5" textLength="355" lengthAdjust="spacing">この時代の人々に捨てられ…』</text>
  </g>

  <!-- 空中再臨・地上誕生 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="243.5" cy="239" rx="96" ry="30.5" fill="#fff" class="paper"/>
    <ellipse cx="243.5" cy="311.5" rx="96" ry="31.5" fill="#CDF8F7"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="244" y="239" font-size="30" textLength="123" lengthAdjust="spacing">空中再臨</text>
    <text x="243.5" y="311.5" font-size="28" textLength="114" lengthAdjust="spacing" fill="#111">地上誕生</text>
  </g>
  <g dominant-baseline="central">
    <text x="359" y="239" font-size="28" textLength="229" lengthAdjust="spacing">すべての人が信奉</text>
    <text x="359" y="313" font-size="26" textLength="258" lengthAdjust="spacing">異端視され苦難受ける</text>
  </g>

  <!-- 結論の箱 -->
  <rect x="207" y="362.5" width="416" height="47.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="413" y="387" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="375" lengthAdjust="spacing">イエスは肉身をもって再臨</text>
</svg>
