<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第三次世界大戦　サタン側から天の側へ復帰</title>

  <!-- 灰色の矢印（サタン側の楕円の下から） -->
  <polygon points="289,97 311,86 311,92 500,92 500,102 311,102 311,108" fill="#8C949A"/>

  <!-- 天の側・サタン側の楕円 -->
  <ellipse cx="216" cy="97.5" rx="69.5" ry="30.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="558.5" cy="95" rx="70.5" ry="31" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="215" y="98" font-size="30" textLength="90" lengthAdjust="spacing">天の側</text>
    <text x="558" y="95.5" font-size="26" textLength="100" lengthAdjust="spacing" fill="#fff">サタン側</text>
  </g>

  <!-- 矢印の上下の字 -->
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="398.5" y="70.5" textLength="49" lengthAdjust="spacing">復帰</text>
    <text x="400.5" y="126.5" textLength="181" lengthAdjust="spacing">第三次世界大戦</text>
  </g>

  <!-- 左右の字 -->
  <g font-size="26" dominant-baseline="central">
    <text x="138" y="162" textLength="155" lengthAdjust="spacing">共生共栄共義</text>
    <text x="138" y="196.5" textLength="102" lengthAdjust="spacing">主義世界</text>
    <text x="434" y="172" textLength="259" lengthAdjust="spacing">三大祝福完成級完成型</text>
    <text x="489" y="203.5" textLength="148" lengthAdjust="spacingAndGlyphs">（非原理世界）</text>
  </g>

  <!-- 括弧 -->
  <path d="M344,237 Q332,240 332,252 V364 Q332,376 344,379" fill="none" stroke="currentColor" stroke-width="4.5"/>

  <!-- 箇条 -->
  <g font-size="26" dominant-baseline="central">
    <text x="357" y="255.5" textLength="103" lengthAdjust="spacing">再臨主型</text>
    <text x="357" y="295" textLength="128" lengthAdjust="spacing">子女繁殖型</text>
    <text x="358" y="366.5" textLength="127" lengthAdjust="spacing">万物主管型</text>
    <text x="516" y="255.5" textLength="126" lengthAdjust="spacing">スターリン</text>
    <text x="515" y="295" textLength="172" lengthAdjust="spacing">農漁民、労働者</text>
    <text x="515" y="327" textLength="97" lengthAdjust="spacing">大同団結</text>
    <text x="515" y="366.5" textLength="154" lengthAdjust="spacing">世界赤化政策</text>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="500.5" y="255.5">：</text>
    <text x="500.5" y="295">：</text>
    <text x="500.5" y="366.5">：</text>
  </g>
</svg>
