<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>再臨主の復帰摂理の目的完遂</title>

  <text x="34" y="36.5" font-size="30" dominant-baseline="central" textLength="408" lengthAdjust="spacing">再臨主の復帰摂理の目的完遂</text>
  <line x1="33" y1="55" x2="442" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 黒い太い矢印（再臨主から下へ） -->
  <rect x="401" y="140" width="11" height="168" fill="currentColor"/>
  <polygon points="392,307 420,307 406,327" fill="currentColor"/>

  <!-- 再臨主 -->
  <ellipse cx="406.5" cy="119" rx="75" ry="29.8" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
  <text x="406.5" y="119" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="91" lengthAdjust="spacing" fill="#111">再臨主</text>

  <!-- 三度目の摂理・民主主義時代 -->
  <rect x="291.5" y="187.5" width="227.5" height="84.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <circle cx="312" cy="210" r="6.3"/>
  <circle cx="312" cy="249.5" r="6.3"/>
  <g font-size="28" dominant-baseline="central">
    <text x="330" y="211" textLength="171" lengthAdjust="spacing">三度目の摂理</text>
    <text x="330" y="248" textLength="171" lengthAdjust="spacing">民主主義時代</text>
  </g>

  <!-- 復帰摂理の目的完遂 -->
  <rect x="255.5" y="335.5" width="301.5" height="46.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="277" y="359.5" font-size="28" dominant-baseline="central" textLength="259" lengthAdjust="spacing" fill="#111">復帰摂理の目的完遂</text>
</svg>
