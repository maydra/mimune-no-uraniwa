<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>み旨とは何であるか？　創造目的を復帰＝復帰摂理の目的</title>

  <text x="52" y="56" font-size="50" dominant-baseline="central" textLength="450" lengthAdjust="spacing">み旨とは何であるか</text>
  <text x="525.5" y="56" font-size="50" text-anchor="middle" dominant-baseline="central">？</text>
  <line x1="51" y1="86.5" x2="538" y2="86.5" stroke="currentColor" stroke-width="4"/>

  <!-- 神 → み旨、神 → 人間堕落 -->
  <g fill="#8C949A">
    <polygon points="510,176 697,176 697,164 732,182 697,200 697,188 510,188"/>
    <polygon points="443.5,236 455.5,236 455.5,433 466,433 449.5,461.5 433,433 443.5,433"/>
    <polygon points="497,359 553,359 553,349 583,365.5 553,382 553,372 497,372"/>
  </g>
  <!-- 創造目的を完成できない（×） -->
  <g stroke="currentColor" stroke-width="8">
    <line x1="426" y1="333" x2="475" y2="398.5"/>
    <line x1="475" y1="333" x2="426" y2="398.5"/>
  </g>
  <!-- み旨から下への点線 -->
  <line x1="839" y1="250" x2="839" y2="323" stroke="currentColor" stroke-width="9" stroke-dasharray="11 10"/>

  <g stroke="currentColor" stroke-width="4">
    <circle cx="451" cy="183" r="57" fill="#fff" class="paper"/>
    <ellipse cx="838.75" cy="181.75" rx="87.25" ry="51" fill="#CDF8F7"/>
    <ellipse cx="449.75" cy="538.25" rx="87.25" ry="63.25" fill="#CF921C"/>
  </g>
  <text x="447" y="181.5" font-size="57" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="52" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="838.5" y="181" textLength="104" lengthAdjust="spacing">み旨</text>
    <text x="448.5" y="511" font-size="46" textLength="92" lengthAdjust="spacing">人間</text>
    <text x="448.5" y="561.5" font-size="46" textLength="92" lengthAdjust="spacing">堕落</text>
  </g>

  <g font-size="42" text-anchor="middle" dominant-baseline="central">
    <text x="307" y="318" textLength="169" lengthAdjust="spacing">創造目的</text>
    <text x="307" y="372" textLength="169" lengthAdjust="spacing">完成でき</text>
    <text x="307.5" y="426" textLength="84.5" lengthAdjust="spacing">ない</text>
  </g>
  <text x="620.5" y="366.5" font-size="50" dominant-baseline="central" textLength="350" lengthAdjust="spacing">創造目的を復帰</text>

  <!-- ＝（縦） -->
  <rect x="821" y="419" width="10" height="35"/>
  <rect x="842" y="419" width="10" height="35"/>

  <rect x="634.5" y="492" width="404.5" height="76.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="836.5" y="532" font-size="50" text-anchor="middle" dominant-baseline="central" textLength="352" lengthAdjust="spacing" fill="#111">復帰摂理の目的</text>
</svg>
