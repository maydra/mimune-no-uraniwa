<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>「象徴献祭」をするための信仰</title>

  <!-- 題 -->
  <text x="47" y="36" font-size="31" dominant-baseline="central" textLength="411" lengthAdjust="spacing">「象徴献祭」をするための信仰</text>
  <line x1="45" y1="55" x2="458" y2="55" stroke="currentColor" stroke-width="2.6"/>

  <!-- 上への矢印（楕円の下に描く） -->
  <g>
    <polygon points="222,171 222,147 217.5,147 223.5,137.5 229.5,147 225,147 225,171"/>
    <polygon points="223,247 223,229.5 218.5,229.5 224.5,220.5 230.5,229.5 226,229.5 226,247"/>
  </g>

  <!-- 行き来の矢印 -->
  <g>
    <polygon points="298,265 370,265 370,261.5 379.5,267.5 370,273.5 370,270 298,270"/>
    <polygon points="377,280 305,280 305,276.5 295.5,282.5 305,288.5 305,285 377,285"/>
    <polygon points="494,263 566,263 566,259.5 575.5,265.5 566,271.5 566,268 494,268"/>
    <polygon points="573,278 500.5,278 500.5,274.5 491,280.5 500.5,286.5 500.5,283 573,283"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="224" cy="107" rx="44" ry="26" fill="#F98AEE"/>
    <ellipse cx="224" cy="193" rx="45" ry="22" fill="#F98AEE"/>
    <ellipse cx="225.5" cy="274.5" rx="66.5" ry="27.5" fill="#F98AEE"/>
    <ellipse cx="435.5" cy="272.5" rx="48.5" ry="27.5" fill="#A0F08A"/>
    <ellipse cx="638" cy="271.5" rx="53" ry="27.5" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="224.5" y="106.5" font-size="25" textLength="72" lengthAdjust="spacing">アダム</text>
    <text x="224.5" y="194" font-size="26" textLength="53" lengthAdjust="spacing">ノア</text>
    <text x="226" y="274" font-size="25" textLength="119" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="435" y="271.5" font-size="26" textLength="80" lengthAdjust="spacing">サライ</text>
    <text x="635.5" y="271.5" font-size="27" textLength="55" lengthAdjust="spacing">パロ</text>
