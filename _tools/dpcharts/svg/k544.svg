<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>エジプト苦役時代とローマ帝国迫害時代　① モーセ：三大奇跡、十災禍　② イエス：心霊的奇跡</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="129.5" y="75.5" width="278" height="55" rx="8"/>
    <rect x="415.5" y="75.5" width="278" height="55" rx="8"/>
  </g>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="153" y="102" textLength="230" lengthAdjust="spacing">エジプト苦役時代</text>
    <text x="433" y="102" textLength="244" lengthAdjust="spacing">ローマ帝国迫害時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="3">
    <rect x="131.5" y="137.5" width="276" height="226" rx="8"/>
    <rect x="416.5" y="137.5" width="276" height="226" rx="8"/>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central">
    <text x="150.5" y="158">①</text>
    <text x="436" y="159">②</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="146.5" cy="232" r="5.5"/>
    <circle cx="146.5" cy="269.5" r="5.5"/>
    <circle cx="429" cy="231" r="5.5"/>
    <circle cx="429" cy="265.5" r="5.5"/>
    <circle cx="429.5" cy="300" r="5.5"/>
  </g>

  <g font-weight="400" dominant-baseline="central">
    <!-- ① -->
    <g font-size="25">
      <text x="143" y="192" textLength="70" lengthAdjust="spacingAndGlyphs">モーセ</text>
      <text x="223" y="192" text-anchor="middle">：</text>
      <text x="235" y="192" textLength="84" lengthAdjust="spacingAndGlyphs">三大奇跡</text>
      <text x="318" y="192">、</text>
      <text x="333" y="192" textLength="63" lengthAdjust="spacingAndGlyphs">十災禍</text>
    </g>
    <g font-size="23">
      <text x="159" y="233.5" textLength="44" lengthAdjust="spacing">パロ</text>
      <text x="217.5" y="233.5" text-anchor="middle">：</text>
      <text x="230" y="233.5" textLength="46" lengthAdjust="spacing">屈伏</text>
      <text x="159" y="270" textLength="164" lengthAdjust="spacing">イスラエル選民</text>
      <text x="336" y="270" text-anchor="middle">：</text>
      <text x="167" y="306" textLength="212" lengthAdjust="spacing">エジプト→カナンに</text>
    </g>
    <!-- ② -->
    <g font-size="25">
      <text x="425" y="191.5" textLength="73" lengthAdjust="spacing">イエス</text>
      <text x="512" y="191.5" text-anchor="middle">：</text>
      <text x="526" y="191.5" textLength="124" lengthAdjust="spacing">心霊的奇跡</text>
    </g>
    <g font-size="22">
      <text x="443" y="230" textLength="157" lengthAdjust="spacingAndGlyphs">コンスタンチヌス</text>
      <text x="611.5" y="230" text-anchor="middle">：</text>
      <text x="622" y="230" textLength="40" lengthAdjust="spacingAndGlyphs">公認</text>
      <text x="442" y="265.5" textLength="125" lengthAdjust="spacingAndGlyphs">テオドシウス</text>
      <text x="578" y="265.5" text-anchor="middle">1</text>
      <text x="589" y="265.5">世</text>
      <text x="622" y="265.5" text-anchor="middle">：</text>
      <text x="633" y="265.5" textLength="41" lengthAdjust="spacingAndGlyphs">国教</text>
    </g>
    <text x="442" y="300.5" font-size="23" textLength="164" lengthAdjust="spacing">キリスト教信徒</text>
    <text x="618" y="300.5" font-size="23" text-anchor="middle">：</text>
    <text x="448" y="330" font-size="21" textLength="231" lengthAdjust="spacingAndGlyphs">サタン世界→霊的カナン</text>
  </g>
</svg>
