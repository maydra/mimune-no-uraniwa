<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(2) 実体基台</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="49" y="37.5" textLength="43" lengthAdjust="spacingAndGlyphs">(2)</text>
    <text x="107" y="37.5" textLength="124" lengthAdjust="spacing">実体基台</text>
  </g>
  <line x1="106" y1="56.5" x2="231" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 神 -->
  <circle cx="194.5" cy="132" r="32" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="194.5" y="132.5" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="194,168 201,181.5 196.5,181.5 196.5,208 191.5,208 191.5,181.5 187,181.5"/>
    <polygon points="477,228.5 274,228.5 274,223 258,231 274,239 274,234.5 477,234.5"/>
  </g>

  <!-- 実体基台 -->
  <rect x="311.5" y="179.5" width="123" height="38.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="372.5" y="198.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="104" lengthAdjust="spacing">実体基台</text>

  <!-- モーセ・イスラエル民族 -->
  <ellipse cx="194" cy="231" rx="58" ry="23.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <ellipse cx="579.5" cy="231" rx="102" ry="26.5" fill="#F86D42" stroke="currentColor" stroke-width="2.2"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="192.5" y="230.5" font-size="28" textLength="81" lengthAdjust="spacing">モーセ</text>
    <text x="579" y="230.5" font-size="23.5" textLength="164.5" lengthAdjust="spacing">イスラエル民族</text>
  </g>

  <!-- 出発のための摂理 -->
  <rect x="242.5" y="263.5" width="261" height="49" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="259" y="287" font-size="28" dominant-baseline="central" textLength="231" lengthAdjust="spacing" fill="#111">出発のための摂理</text>

  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="207.5" y="342" textLength="345.5" lengthAdjust="spacing">三大奇跡と十災禍の権能で</text>
    <text x="207.5" y="378.5" textLength="230.5" lengthAdjust="spacing">エジプト人を打つ</text>
  </g>
</svg>
