<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>真の父イエスと真の母聖霊（ヨハネ 3:5）</title>

  <!-- 四位の線（円・楕円より先に描く） -->
  <g stroke="currentColor" stroke-width="10">
    <line x1="596.4" y1="123.5" x2="449.4" y2="319.5"/>
    <line x1="618.1" y1="123.5" x2="765.1" y2="319.5"/>
    <line x1="441.7" y1="319.5" x2="603.4" y2="550.5"/>
    <line x1="777.4" y1="319.5" x2="615.7" y2="550.5"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <circle cx="604.5" cy="123.5" r="68.5" fill="#fff" class="paper"/>
    <ellipse cx="439.5" cy="319.5" rx="110.5" ry="58.5" fill="#F98AEE"/>
    <ellipse cx="781" cy="319.5" rx="112" ry="58.5" fill="#A0F08A"/>
    <ellipse cx="609" cy="550.5" rx="104" ry="78.5" fill="#FCE5E3"/>
  </g>

  <!-- イエスと聖霊の授受 -->
  <g fill="none" stroke="currentColor" stroke-width="10">
    <path d="M560.5,295.5 Q597.4,273.2 635,288.2"/>
    <path d="M662.5,341 C640.2,352.2 602.4,358.3 584,350.5"/>
  </g>
  <polygon points="640,275 663,299.5 630,301.5"/>
  <polygon points="590,336.4 557,339 578,364.6"/>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="601.5" y="122.5" font-size="70">神</text>
    <g fill="#111">
      <text x="439.5" y="318.5" font-size="54" textLength="171" lengthAdjust="spacing">イエス</text>
      <text x="781.5" y="317.5" font-size="58" textLength="123" lengthAdjust="spacing">聖霊</text>
      <text x="608.5" y="518" font-size="57">善の</text>
      <text x="609.5" y="581" font-size="57">子女</text>
    </g>
  </g>

  <g font-size="55" font-weight="400" dominant-baseline="central">
    <text x="311" y="206.5" textLength="172" lengthAdjust="spacing">真の父</text>
    <text x="739" y="210" textLength="173" lengthAdjust="spacing">真の母</text>
  </g>
  <text y="320" font-size="40" dominant-baseline="central"><tspan x="907" textLength="114" lengthAdjust="spacingAndGlyphs">(ヨハネ</tspan> <tspan x="1029" textLength="65" lengthAdjust="spacingAndGlyphs">3:5)</tspan></text>
</svg>
