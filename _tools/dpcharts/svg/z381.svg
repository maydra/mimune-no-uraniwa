<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 第三祝福復帰の現象</title>
  <defs>
    <marker id="z381-k" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-size="48" dominant-baseline="central">
    <text x="53.9" y="58">Ⅲ.</text>
    <text x="133.1" y="57" textLength="448.3" lengthAdjust="spacing">第三祝福復帰の現象</text>
  </g>
  <line x1="132" y1="87.5" x2="582" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <!-- 主管的な四位基台（線は円の下に描く） -->
  <g stroke="currentColor" stroke-width="9">
    <line x1="350.9" y1="186.3" x2="236.3" y2="346"/>
    <line x1="350.9" y1="186.3" x2="469.2" y2="343.5"/>
    <line x1="236.3" y1="346" x2="347" y2="504.6"/>
    <line x1="469.2" y1="343.5" x2="347" y2="504.6"/>
  </g>

  <!-- 授受作用の矢印 -->
  <g stroke="currentColor" stroke-width="4.5" fill="none" marker-end="url(#z381-k)">
    <path d="M341,432 Q320,343 341.2,268"/>
    <path d="M360.5,260 Q380,345 363.1,420.8"/>
    <path d="M291,336 Q349,321.5 398.3,332.8"/>
    <path d="M410,356 Q352,370.2 304.2,359.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="350.9" cy="186.3" rx="46.2" ry="58.5" fill="#fff" class="paper"/>
    <ellipse cx="236.3" cy="346" rx="46.2" ry="58.5" fill="#F98AEE"/>
    <ellipse cx="469.2" cy="343.5" rx="46.2" ry="58.5" fill="#A0F08A"/>
    <ellipse cx="347" cy="504.6" rx="46.2" ry="58.5" fill="#DCC4C4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="350" y="186" font-size="53">神</text>
    <g fill="#111" font-size="43">
      <text x="235.5" y="322">人</text>
      <text x="235.5" y="369">間</text>
      <text x="469.5" y="322.5">万</text>
      <text x="468.5" y="367">物</text>
    </g>
    <text x="346.5" y="504" font-size="53" fill="#111">被</text>
  </g>

  <text x="216.8" y="616" font-size="48" textLength="247.2" lengthAdjust="spacing" dominant-baseline="central">主管性完成</text>

  <!-- 現世 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="543.5" y="203.5" width="560.5" height="291.5" fill="#fff" class="paper"/>
    <ellipse cx="821.3" cy="201.4" rx="91.9" ry="47" fill="#CF921C"/>
  </g>
  <text x="819" y="202" font-size="57" text-anchor="middle" dominant-baseline="central" fill="#111">現世</text>

  <circle cx="576.5" cy="285.5" r="12"/>
  <circle cx="577.5" cy="441.5" r="12"/>
  <g font-size="44" dominant-baseline="central">
    <text x="597.8" y="286.5" textLength="481.5" lengthAdjust="spacingAndGlyphs">被造世界に対する主管性</text>
    <text x="598.8" y="349">（内的、<tspan x="757.5">外的）</tspan></text>
    <text x="597" y="440.5" textLength="364.2" lengthAdjust="spacing">両面の主管性復帰</text>
  </g>
</svg>
