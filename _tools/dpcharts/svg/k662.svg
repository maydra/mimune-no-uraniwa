<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>30年戦争　1648年 ウェストファリア条約</title>

  <circle cx="190.5" cy="64" r="7.6"/>
  <text x="209.8" y="63" font-size="31" dominant-baseline="central" textLength="133" lengthAdjust="spacing">30年戦争</text>

  <!-- 「－」の印 -->
  <g stroke="currentColor" stroke-width="3.6">
    <line x1="211" y1="111.8" x2="227" y2="111.8"/>
    <line x1="211" y1="327.8" x2="227" y2="327.8"/>
    <line x1="211" y1="372.8" x2="227" y2="372.8"/>
  </g>

  <g font-size="30" dominant-baseline="central">
    <text x="235.5" y="112.5" textLength="71" lengthAdjust="spacing">1648</text>
    <text x="314.8" y="112.5">年</text>
    <text x="363.8" y="112" textLength="281" lengthAdjust="spacing">ウェストファリア条約</text>
  </g>

  <!-- 北欧・南欧 -->
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="254.5" cy="171" rx="53" ry="26.6" fill="#F8F28F"/>
    <ellipse cx="256.5" cy="253.5" rx="54" ry="28" fill="#F86D42"/>
  </g>
  <g font-size="29" dominant-baseline="central" fill="#111">
    <text x="225.8" y="171" textLength="58" lengthAdjust="spacing">北欧</text>
    <text x="225.8" y="253.5" textLength="60" lengthAdjust="spacing">南欧</text>
  </g>

  <g font-size="29" dominant-baseline="central">
    <text x="322.8" y="170.5" textLength="174" lengthAdjust="spacing">ゲルマン民族</text>
    <text x="553.8" y="170.5" textLength="58" lengthAdjust="spacing">新教</text>
    <text x="322.8" y="252.5" textLength="142" lengthAdjust="spacing">ラテン民族</text>
    <text x="553.8" y="252.5" textLength="56" lengthAdjust="spacing">旧教</text>
  </g>
  <g fill="#8C949A">
    <polygon points="510,164 528,164 528,157 540,171.5 528,186 528,179 510,179"/>
    <polygon points="508,246 527,246 527,239 538,253.5 527,268 527,261 508,261"/>
  </g>

  <g font-size="30" dominant-baseline="central">
    <text x="236.8" y="328" textLength="290" lengthAdjust="spacing">新旧両教派同等の権限</text>
    <text x="236.8" y="373" textLength="203" lengthAdjust="spacing">領土問題を解決</text>
  </g>
</svg>
