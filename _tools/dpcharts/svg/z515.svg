<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>最初の復活</title>

  <text x="50" y="55" font-size="50" dominant-baseline="central">7.</text>
  <text x="110" y="55" font-size="50" dominant-baseline="central" textLength="249" lengthAdjust="spacing">最初の復活</text>
  <line x1="110" y1="84.5" x2="359" y2="84.5" stroke="currentColor" stroke-width="4"/>

  <!-- キリスト教信徒から再臨主へ -->
  <polygon points="369,214.5 383,237 373.5,237 373.5,532 364.5,532 364.5,237 355,237" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="5">
    <ellipse cx="372.5" cy="156.5" rx="102.5" ry="46.5" fill="#F8F28F"/>
    <ellipse cx="369" cy="584" rx="140" ry="49" fill="#FCE5E3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="372.5" y="154.5" font-size="44">再臨主</text>
    <text x="369.5" y="582" font-size="36">キリスト教信徒</text>
  </g>

  <!-- 最初の復活の箱と括弧 -->
  <rect x="409.5" y="326" width="148" height="124" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g font-size="40" text-anchor="middle" dominant-baseline="central">
    <text x="483" y="360">最初の</text>
    <text x="483" y="413.5">復活</text>
  </g>
  <line x1="560" y1="385" x2="602" y2="385" stroke="currentColor" stroke-width="6" stroke-dasharray="16 9"/>
  <path d="M634,95 L606.5,120 V636 L635,662" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- 段階 -->
  <rect x="665.5" y="128.5" width="314" height="80" fill="#CDF8F7" stroke="currentColor" stroke-width="5"/>
  <text x="822.5" y="169" font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">創造目的完成</text>

  <g fill="#8C949A">
    <polygon points="821.5,225 843,239 829,239 829,250.5 814,250.5 814,239 800,239"/>
    <polygon points="821.5,365 843,378.5 829,378.5 829,386.5 814,386.5 814,378.5 800,378.5"/>
    <polygon points="822,502 844,515.5 829.5,515.5 829.5,524.5 814.5,524.5 814.5,515.5 800,515.5"/>
  </g>

  <g font-size="38" dominant-baseline="central">
    <text x="636" y="284.5" textLength="252" lengthAdjust="spacing">③原罪を脱ぎ、</text>
    <text x="675" y="334" textLength="225" lengthAdjust="spacing">生霊体を完成</text>
    <text x="636" y="415.5" textLength="342" lengthAdjust="spacing">②世界的な蕩減条件</text>
    <text x="675" y="465.5" textLength="300" lengthAdjust="spacing">立てる聖業に協助</text>
    <text x="636" y="560" textLength="304" lengthAdjust="spacing">①最初に再臨主を</text>
    <text x="677" y="610" textLength="152" lengthAdjust="spacing">信じ侍る</text>
  </g>
</svg>
