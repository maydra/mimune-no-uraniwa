<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ローマの兵士はイエス再臨のときを見ない（黙 20:5）　刺しとおした者＝迫害するようになる者の比喩</title>

  <!-- イエス再臨のとき -->
  <rect x="122" y="54" width="190" height="47" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
  <text x="133" y="77.5" font-size="23.5" dominant-baseline="central" fill="#111" textLength="169" lengthAdjust="spacing">イエス再臨のとき</text>

  <!-- 灰色の矢印（上へ）と × -->
  <polygon points="213.5,221 213.5,123 208,123 217,106.5 226,123 220.5,123 220.5,221" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="5.5">
    <line x1="197.5" y1="154.5" x2="236.5" y2="186.5"/>
    <line x1="236" y1="153.5" x2="197" y2="186.5"/>
  </g>
  <text x="250" y="173" font-size="28" dominant-baseline="central" textLength="55" lengthAdjust="spacing">見る</text>

  <!-- 黙 20:5 -->
  <g font-size="27.5" dominant-baseline="central">
    <text x="320" y="127.5">黙</text>
    <text x="354" y="127.5" textLength="60" lengthAdjust="spacing">20:5</text>
    <text y="173.5"><tspan x="331">『</tspan><tspan x="344" textLength="313" lengthAdjust="spacing">最初に復活した人々以外は</tspan></text>
    <text x="341" y="213" textLength="353" lengthAdjust="spacing">千年王国時代を経たのち復活』</text>
  </g>

  <!-- ローマの兵士 ＝ 刺しとおした者 -->
  <text x="136" y="251.5" font-size="26.5" dominant-baseline="central" textLength="156" lengthAdjust="spacing">ローマの兵士</text>
  <g stroke="currentColor" stroke-width="6">
    <line x1="209" y1="281" x2="209" y2="307"/>
    <line x1="223" y1="281" x2="223" y2="307"/>
  </g>
  <rect x="131" y="327" width="171" height="46" fill="#CF921C" stroke="currentColor" stroke-width="3"/>
  <text x="141" y="349" font-size="26.5" dominant-baseline="central" fill="#111" textLength="150" lengthAdjust="spacingAndGlyphs">刺しとおした者</text>

  <!-- 比喩 → 迫害するようになる者 -->
  <polygon points="312,346.5 398,346.5 398,342.5 411,349.5 398,356.5 398,352.5 312,352.5" fill="#8C949A"/>
  <text x="329" y="325.5" font-size="26" dominant-baseline="central" textLength="53" lengthAdjust="spacing">比喩</text>
  <text x="428" y="349" font-size="27" dominant-baseline="central" textLength="262" lengthAdjust="spacing">迫害するようになる者</text>
</svg>
