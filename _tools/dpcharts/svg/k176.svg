<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>モリヤ山への三日期間</title>

  <!-- アブラハムからイサクへ（楕円の下に描く） -->
  <polygon points="312,125.5 507,125.5 507,121.5 521,129 507,136.5 507,132.5 312,132.5" fill="#8C949A"/>

  <g stroke="currentColor" stroke-width="2.2" fill="#F8F28F">
    <ellipse cx="238.5" cy="128.5" rx="74.5" ry="29.5"/>
    <ellipse cx="593" cy="126" rx="67" ry="30"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="237.5" y="128" font-size="27" textLength="124" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="591.5" y="125.5" font-size="30" textLength="90" lengthAdjust="spacing">イサク</text>
  </g>

  <text x="409" y="94" font-size="32" text-anchor="middle" dominant-baseline="central" textLength="131" lengthAdjust="spacing">モリヤ山</text>

  <!-- 三日期間 -->
  <line x1="412" y1="142" x2="412" y2="187" stroke="currentColor" stroke-width="5" stroke-dasharray="7 5.7"/>
  <rect x="331.5" y="197.5" width="163" height="61.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="409.5" y="229.5" font-size="33" text-anchor="middle" dominant-baseline="central" textLength="132" lengthAdjust="spacing">三日期間</text>

  <g font-size="31" dominant-baseline="central">
    <text x="192" y="317.5" textLength="438" lengthAdjust="spacing">新しい摂理路程を出発するとき</text>
    <text x="193" y="362" textLength="344" lengthAdjust="spacing">サタン分立に必要な期間</text>
  </g>
</svg>
