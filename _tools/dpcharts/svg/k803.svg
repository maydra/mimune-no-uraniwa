<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ マタイ 7:22～23</title>

  <!-- ③ マタイ 7:22～23 -->
  <g font-size="26" dominant-baseline="central">
    <text x="33" y="40">③</text>
    <text x="72" y="40" textLength="74" lengthAdjust="spacing">マタイ</text>
    <text x="156" y="40" textLength="118" lengthAdjust="spacing">7:22～23</text>
  </g>

  <!-- 聖句 -->
  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="131" y="116" textLength="546" lengthAdjust="spacing">『主よ、主よ、わたしたちはあなたの名によって…』</text>
    <text x="131" y="155.5" textLength="563" lengthAdjust="spacing">『あなたがたを全く知らない。不法を働く者どもよ、</text>
    <text x="141" y="190.5" textLength="159" lengthAdjust="spacing">行ってしまえ』</text>
  </g>

  <!-- 地上誕生 -->
  <ellipse cx="226.75" cy="269.5" rx="86.25" ry="31.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="226" y="270" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="123" lengthAdjust="spacing">地上誕生</text>

  <g font-size="24" dominant-baseline="central">
    <text x="330" y="270.5" textLength="164" lengthAdjust="spacing">信徒たちは排斥</text>
    <text x="541" y="270.5" textLength="138" lengthAdjust="spacing">見捨てられる</text>
  </g>
  <polygon points="505,267 516.5,267 516.5,261 527.5,270 516.5,279 516.5,273 505,273" fill="#8C949A"/>

  <!-- 結論の箱 -->
  <rect x="172" y="338" width="481" height="49" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="411.5" y="363" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="438" lengthAdjust="spacing">イエスは雲に乗って来られない</text>
</svg>
