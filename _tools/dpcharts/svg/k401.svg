<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第三の試練の答え　『神を拝し、仕えよ』（マタイ 4:10）</title>

  <!-- 答え -->
  <rect x="125.5" y="23.5" width="69" height="39" rx="5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="160" y="43" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="54" lengthAdjust="spacing">答え</text>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text y="45.5"><tspan x="207">『</tspan><tspan x="225" textLength="116" lengthAdjust="spacing">神を拝し</tspan><tspan x="341">、</tspan><tspan x="360" textLength="82" lengthAdjust="spacing">仕えよ</tspan><tspan x="446">』</tspan></text>
    <text y="45.5" font-size="24"><tspan x="475" textLength="77" lengthAdjust="spacing">(マタイ</tspan> <tspan x="561" textLength="56" lengthAdjust="spacing">4:10)</tspan></text>
  </g>

  <!-- イエスに屈伏して、拝し仕えるのが原理 -->
  <rect x="156.5" y="105.5" width="509" height="44" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="27" dominant-baseline="central">
    <text y="127.5"><tspan x="172" textLength="213" lengthAdjust="spacing">イエスに屈伏して</tspan><tspan x="385">、</tspan><tspan x="410" textLength="240" lengthAdjust="spacing">拝し仕えるのが原理</tspan></text>
  </g>

  <!-- 第三の試練：勝利 -->
  <rect x="291.5" y="177.5" width="240" height="43" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="307" y="199" textLength="131" lengthAdjust="spacing">第三の試練</text>
    <text x="451" y="199" text-anchor="middle">：</text>
    <text x="464" y="199" textLength="52" lengthAdjust="spacing">勝利</text>
  </g>

  <polygon points="402.5,241 402.5,257 389.5,257 409,274.5 428.5,257 415.5,257 415.5,241" fill="#8C949A"/>

  <text x="222" y="307.5" font-size="28" font-weight="400" dominant-baseline="central" textLength="377" lengthAdjust="spacing">被造世界に対する主管性復帰</text>

  <!-- 第三祝福復帰の基台：造成 -->
  <rect x="217.5" y="344.5" width="381" height="47" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="235" y="368" textLength="262" lengthAdjust="spacing">第三祝福復帰の基台</text>
    <text x="509" y="368" text-anchor="middle">：</text>
    <text x="524" y="368" textLength="58" lengthAdjust="spacing">造成</text>
  </g>
</svg>
