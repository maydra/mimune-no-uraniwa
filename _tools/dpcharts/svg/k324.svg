<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>c 第三次幕屋のための基台</title>

  <!-- 題 -->
  <circle cx="49.5" cy="36" r="13.3" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <text x="49.5" y="35" font-size="22" text-anchor="middle" dominant-baseline="central">c</text>
  <text x="74" y="36" font-size="31" dominant-baseline="central" textLength="345" lengthAdjust="spacing">第三次幕屋のための基台</text>
  <line x1="73" y1="55" x2="420" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="227.5,164 234.5,176.5 230.5,176.5 230.5,242 224.5,242 224.5,176.5 220.5,176.5"/>
    <polygon points="284.5,264.5 296.5,258.5 296.5,261.6 482,261.6 482,267.4 296.5,267.4 296.5,271.5"/>
  </g>

  <!-- 神 -->
  <circle cx="228" cy="128" r="31.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="227" y="127.5" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 信仰基台○ -->
  <rect x="117.5" y="165.5" width="95" height="69" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="126" y="186" textLength="55" lengthAdjust="spacing">信仰</text>
    <text x="128" y="215" textLength="51" lengthAdjust="spacing">基台</text>
  </g>
  <circle cx="194.5" cy="215" r="10" fill="none" stroke="currentColor" stroke-width="2.6"/>

  <!-- 変わらない信仰、忠誠 -->
  <g font-size="26" dominant-baseline="central">
    <text x="243" y="187" textLength="130" lengthAdjust="spacing">変わらない</text>
    <text x="243" y="218.5" textLength="131" lengthAdjust="spacing">信仰、忠誠</text>
  </g>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="227.5" cy="265" rx="50" ry="24" fill="#F8F28F"/>
    <ellipse cx="551.5" cy="264.5" rx="69" ry="35" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="227" y="265.5" font-size="27" textLength="78" lengthAdjust="spacing">モーセ</text>
    <text x="551" y="253.5" font-size="26" textLength="117" lengthAdjust="spacing">イスラエル</text>
    <text x="549" y="281.5" font-size="26" textLength="52" lengthAdjust="spacing">民族</text>
  </g>

  <!-- 箇条 -->
  <circle cx="380" cy="338" r="7"/>
  <circle cx="381" cy="380" r="7"/>
  <g font-size="26" dominant-baseline="central">
    <text x="395" y="338" textLength="26" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="421" y="338" textLength="208" lengthAdjust="spacing">日サタン分立基台</text>
    <text x="396" y="380" textLength="26" lengthAdjust="spacingAndGlyphs">12</text>
    <text x="422" y="380" textLength="156" lengthAdjust="spacing">名カナン偵察</text>
    <text x="581" y="380" textLength="27" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="608" y="380">日</text>
  </g>
</svg>
