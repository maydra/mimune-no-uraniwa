<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>10数、40数の意義</title>
  <defs>
    <marker id="k490-a" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-size="30" dominant-baseline="central">
    <text x="34" y="37" textLength="29" lengthAdjust="spacingAndGlyphs">10</text>
    <text x="64.5" y="37">数、</text>
    <text x="120" y="37" textLength="31" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="152.5" y="37" textLength="124" lengthAdjust="spacing">数の意義</text>
  </g>
  <line x1="32" y1="56" x2="277" y2="56" stroke="currentColor" stroke-width="2.2"/>

  <!-- 創造目的完成 ← 直接主管圏 ＝ 10段階 -->
  <g font-size="25" dominant-baseline="central">
    <text x="149" y="95.5" textLength="155" lengthAdjust="spacing">創造目的完成</text>
    <text x="157" y="155" textLength="128" lengthAdjust="spacing">直接主管圏</text>
  </g>
  <polygon points="216,134.5 216,124.5 211,124.5 220.5,117.5 230,124.5 225,124.5 225,134.5" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="4">
    <line x1="216" y1="178" x2="216" y2="194"/>
    <line x1="225" y1="178" x2="225" y2="194"/>
  </g>
  <g font-size="27" dominant-baseline="central">
    <text x="178" y="216.5" textLength="26" lengthAdjust="spacingAndGlyphs">10</text>
    <text x="205" y="216.5" textLength="56" lengthAdjust="spacing">段階</text>
    <text x="276" y="216.5" font-weight="400" text-anchor="middle">(</text>
    <text x="284" y="216.5" textLength="23" lengthAdjust="spacingAndGlyphs">10</text>
    <text x="320.5" y="216.5" text-anchor="middle">数</text>
    <text x="346.5" y="216.5" text-anchor="middle">：</text>
    <text x="362" y="216.5" textLength="77" lengthAdjust="spacing">帰一数</text>
    <text x="444" y="216.5" font-weight="400" text-anchor="middle">)</text>
  </g>

  <!-- 段の横線・目盛りと矢印 -->
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="152" y1="240.5" x2="319" y2="240.5"/>
    <line x1="181" y1="294.5" x2="258" y2="294.5"/>
    <line x1="181" y1="347.5" x2="258" y2="347.5"/>
    <line x1="178" y1="401.5" x2="255" y2="401.5"/>
  </g>
  <g stroke="currentColor" stroke-width="2.6">
    <line x1="209" y1="264" x2="225" y2="264"/>
    <line x1="209" y1="279" x2="225" y2="279"/>
    <line x1="209" y1="311.5" x2="225" y2="311.5"/>
    <line x1="209" y1="329.5" x2="225" y2="329.5"/>
    <line x1="209" y1="364" x2="225" y2="364"/>
    <line x1="209" y1="384" x2="225" y2="384"/>
  </g>
  <line x1="217" y1="402" x2="217" y2="247.3" stroke="currentColor" stroke-width="2.6" marker-end="url(#k490-a)"/>
  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="243" y="268">3</text>
    <text x="243" y="320">3</text>
    <text x="243" y="374">3</text>
    <text x="166" y="283.5">成</text>
    <text x="166" y="310.5">長</text>
    <text x="166" y="336.5">期</text>
    <text x="166" y="363.5">間</text>
    <text x="300.5" y="291.5" font-size="29">9</text>
    <text x="301" y="318">段</text>
    <text x="301.5" y="344">階</text>
  </g>
  <path d="M258,244.5 Q266,247 266,262 L266,306 Q266,318 275,321 Q266,324 266,336 L266,382 Q266,396 258,398" fill="none" stroke="currentColor" stroke-width="2.6"/>

  <!-- 40数完成実体基台 -->
  <rect x="398.2" y="139.2" width="270.6" height="46.6" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="28" dominant-baseline="central">
    <text x="416.5" y="162" textLength="28" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="450" y="162" textLength="199" lengthAdjust="spacing">数完成実体基台</text>
  </g>
  <polygon points="523,282 523,218.5 517.5,218.5 527,198.5 536.5,218.5 531,218.5 531,282"/>
  <g font-size="28" dominant-baseline="central">
    <text x="413" y="317" textLength="112" lengthAdjust="spacing">四位基台</text>
    <text x="542" y="317" text-anchor="middle">×</text>
    <text x="558.5" y="317" textLength="26" lengthAdjust="spacingAndGlyphs">10</text>
    <text x="587" y="317" textLength="56" lengthAdjust="spacing">段階</text>
  </g>

  <!-- 成長期間＝40数完成期間 -->
  <rect x="341.2" y="351.2" width="355.6" height="47.6" fill="#CDF8F7" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="357" y="375" textLength="112" lengthAdjust="spacing">成長期間</text>
    <text x="485.5" y="375" text-anchor="middle">＝</text>
    <text x="507.5" y="375" textLength="28" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="538" y="375" textLength="141" lengthAdjust="spacing">数完成期間</text>
  </g>
</svg>
