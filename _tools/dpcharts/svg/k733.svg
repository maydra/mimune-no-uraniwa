<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>3. 復帰摂理から見た第一次世界大戦の原因　① 三大祝福復帰の蘇生的な蕩減条件</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="33" y="37" font-size="28">3.</text>
    <text x="65" y="36.5" font-size="28.5" textLength="519" lengthAdjust="spacing">復帰摂理から見た第一次世界大戦の原因</text>
    <text x="68" y="79.5" font-size="26" text-anchor="middle">①</text>
    <text x="88" y="79.5" font-size="26" textLength="393" lengthAdjust="spacing">三大祝福復帰の蘇生的な蕩減条件</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="65" y1="54.6" x2="585" y2="54.6"/>
    <line x1="88" y1="96.6" x2="481" y2="96.6"/>
  </g>

  <!-- 灰色の矢印（丸と楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="215.5,197 215.5,219.5 220,219.5 212,232 204,219.5 208.5,219.5 208.5,197"/>
    <polygon points="590.5,199 590.5,219.5 595.5,219.5 587,232 578.5,219.5 583.5,219.5 583.5,199"/>
    <polygon points="506.5,213.5 278,213.5 278,219.5 261,210 278,200.5 278,206.5 506.5,206.5"/>
  </g>

  <!-- 点線 -->
  <line x1="398.5" y1="257" x2="398.5" y2="324" stroke="currentColor" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- 神・三大祝福 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="211.5" cy="160" rx="37.5" ry="36"/>
    <ellipse cx="212" cy="279" rx="90" ry="43"/>
  </g>
  <text x="210" y="159.5" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="212" y="278" font-size="29" text-anchor="middle" dominant-baseline="central" textLength="115" lengthAdjust="spacing">三大祝福</text>

  <!-- サタン・三大祝福の蘇生級完成型 -->
  <g stroke="currentColor" stroke-width="2.5">
    <circle cx="587.5" cy="161" r="37.5" fill="#50403D"/>
    <ellipse cx="587" cy="281" rx="97" ry="46.5" fill="#CF921C"/>
  </g>
  <text x="587.5" y="159" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="67" lengthAdjust="spacing">サタン</text>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="587" y="262" textLength="131" lengthAdjust="spacing">三大祝福の</text>
    <text x="587" y="293" textLength="157" lengthAdjust="spacing">蘇生級完成型</text>
  </g>

  <!-- 地の上の字 -->
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="662" y="195" textLength="93" lengthAdjust="spacing">アダム型</text>
    <text x="661" y="225" textLength="51" lengthAdjust="spacing">人物</text>
    <text x="399" y="187.5" font-size="25" textLength="52" lengthAdjust="spacing">復帰</text>
    <text x="399" y="234" textLength="184" lengthAdjust="spacing">蘇生的蕩減条件</text>
  </g>

  <!-- 第一次世界大戦 -->
  <rect x="270" y="335.5" width="258" height="50" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="399" y="360.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="221" lengthAdjust="spacing">第一次世界大戦</text>
</svg>
