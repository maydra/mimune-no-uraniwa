<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>エリヤの再臨を中心とするユダヤ人たちの心的動向</title>

  <text x="51" y="57" font-size="48" dominant-baseline="central">Ⅰ.</text>
  <text x="125" y="56" font-size="48" dominant-baseline="central" textLength="1122" lengthAdjust="spacing">エリヤの再臨を中心とするユダヤ人たちの心的動向</text>
  <line x1="123" y1="86" x2="1248" y2="86" stroke="currentColor" stroke-width="3.5"/>

  <!-- 矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="394.2,459.2 541.1,312.4 548.5,319.8 554.5,290.5 525.2,296.5 532.6,303.9 385.8,450.8"/>
    <polygon points="881.2,440.7 743.6,307.6 750.9,300 721.5,294.5 728,323.7 735.3,316.2 872.8,449.3"/>
    <polygon points="480,495.5 751.5,495.5 751.5,506 776.5,489.5 751.5,473 751.5,483.5 480,483.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="635.5" cy="231.5" rx="126" ry="65" fill="#fff" class="paper"/>
    <ellipse cx="367" cy="489.5" rx="122" ry="66" fill="#F86D42"/>
    <ellipse cx="929" cy="489.5" rx="146" ry="66" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="635.5" y="231.5" font-size="51" textLength="206" lengthAdjust="spacing">神殿理想</text>
    <text x="367" y="489.5" font-size="48" textLength="144" lengthAdjust="spacing" fill="#111">エリヤ</text>
    <text x="929" y="489.5" font-size="49" textLength="245" lengthAdjust="spacing" fill="#111">再臨エリヤ</text>
  </g>

  <g dominant-baseline="central">
    <text x="255" y="313.5" font-size="44" textLength="225" lengthAdjust="spacing">サタン分立</text>
    <text x="222" y="599" font-size="38" textLength="81" lengthAdjust="spacing">昇天</text>
    <!-- 元の図は「烈王下」。列王紀下の誤記なので直した（2026-10-31、ユーザー「誤表記は直そう」） -->
    <text x="320" y="598" font-size="36" textLength="191" lengthAdjust="spacingAndGlyphs">(列王下 2:11)</text>
    <text x="738" y="588" font-size="45" textLength="364" lengthAdjust="spacing">エリヤの使命継承</text>
