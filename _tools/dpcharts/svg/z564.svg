<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>み旨（創造目的）は絶対的、人物は身代わり</title>

  <!-- 灰色の矢印（円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="350,66.5 461,66.5 461,59.5 484.5,71.5 461,83.5 461,76.5 350,76.5"/>
    <polygon points="307.5,120 316.5,120 316.5,171 324,171 312,191.5 300,171 307.5,171"/>
    <polygon points="492.5,300 500.5,300 500.5,327.5 508.5,327.5 496.5,348 484.5,327.5 492.5,327.5"/>
    <polygon points="492.5,482 500.5,482 500.5,515.5 508.5,515.5 496.5,535.5 484.5,515.5 492.5,515.5"/>
  </g>

  <!-- 神 -->
  <circle cx="313.5" cy="78" r="49.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="310" y="75.5" font-size="53" text-anchor="middle" dominant-baseline="central">神</text>

  <g font-size="49" text-anchor="middle" dominant-baseline="central">
    <text x="553" y="70">み旨</text>
    <text x="741" y="70" textLength="245" lengthAdjust="spacing">（創造目的）</text>
    <text x="891" y="69.5">：</text>
    <text x="991" y="70" textLength="150" lengthAdjust="spacing">絶対的</text>
  </g>

  <!-- 人物・アダム・イエス・再臨主 -->
  <rect x="244.25" y="197.25" width="136.5" height="70.5" fill="#FCE5E3" stroke="currentColor" stroke-width="4.5"/>
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="497" cy="239" rx="104.75" ry="50.75" fill="#F98AEE"/>
    <ellipse cx="494" cy="414.5" rx="104.75" ry="56.25" fill="#F8F28F"/>
    <ellipse cx="496" cy="597" rx="104.75" ry="51.75" fill="#F8F28F"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="309.5" y="232" font-size="49">人物</text>
    <text x="497" y="239" font-size="47.5">アダム</text>
    <text x="492.5" y="394" font-size="46.5">イエス</text>
    <text x="492.5" y="433" font-size="32" textLength="155" lengthAdjust="spacingAndGlyphs">(後のアダム)</text>
    <text x="495.5" y="596" font-size="45">再臨主</text>
  </g>

  <!-- 身代わり -->
  <g font-size="38" text-anchor="middle" dominant-baseline="central">
    <text x="396.5" y="324">身代わり</text>
    <text x="397.5" y="508">身代わり</text>
  </g>

  <!-- 右の括弧書き（×は線で描く） -->
  <g font-size="49" text-anchor="middle" dominant-baseline="central">
    <text x="731" y="239" textLength="223" lengthAdjust="spacing">（創造目的</text>
    <text x="952" y="239">）</text>
    <text x="681" y="414.5" textLength="121" lengthAdjust="spacing">（み旨</text>
    <text x="842" y="414.5">）</text>
    <text x="817.5" y="598.5" textLength="396" lengthAdjust="spacing">（み旨を必ず完遂）</text>
  </g>
  <g stroke="currentColor" stroke-width="7.5" fill="none">
    <path d="M870.5,221.5 L908.5,259.5 M908.5,221.5 L870.5,259.5"/>
    <path d="M765.5,398 L803.5,436 M803.5,398 L765.5,436"/>
  </g>
</svg>
