<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理とは</title>

  <!-- 題 -->
  <ellipse cx="421" cy="76.5" rx="192.5" ry="36.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="420" y="77" font-size="38" textLength="230" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central" fill="#111">復帰摂理とは</text>

  <!-- 摂理・復帰の矢印 -->
  <g fill="#8C949A">
    <polygon points="415,209 425,209 425,258 435,258 420,289 405,258 415,258"/>
    <polygon points="560,297 370,297 370,289 350,301.5 370,314 370,306 560,306"/>
  </g>

  <!-- 神 -->
  <circle cx="420" cy="167" r="35.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="420" y="168" font-size="36" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 創造本然の人間 -->
  <ellipse cx="241" cy="301" rx="97" ry="62.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="31" text-anchor="middle" dominant-baseline="central">
    <text x="240" y="288">創造本然の</text>
    <text x="241" y="327">人間</text>
    <text x="469" y="227">摂理</text>
    <text x="444" y="330">復帰</text>
  </g>

  <!-- 堕落人間 -->
  <circle cx="601.5" cy="301" r="65.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="578" y="278">堕</text>
    <text x="624" y="278">落</text>
    <text x="579" y="328">人</text>
    <text x="623" y="328">間</text>
  </g>
</svg>
