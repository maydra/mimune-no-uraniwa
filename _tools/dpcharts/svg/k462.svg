<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>三段階に延長された例</title>

  <text x="33" y="38.5" font-size="30" dominant-baseline="central" textLength="314" lengthAdjust="spacing">三段階に延長された例</text>
  <line x1="32" y1="57.5" x2="347" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 点（●） -->
  <g>
    <circle cx="138" cy="119" r="6.5"/>
    <circle cx="138" cy="186.5" r="6.5"/>
    <circle cx="138" cy="249.5" r="6.5"/>
    <circle cx="138" cy="310.5" r="6.5"/>
    <circle cx="138" cy="379.5" r="6.5"/>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="297,116 324,116 324,112 336.5,119.5 324,127 324,123 297,123"/>
    <polygon points="470,116 497,116 497,112 509.5,119.5 497,127 497,123 470,123"/>
    <polygon points="312,182.5 337,182.5 337,178.5 349.5,186 337,193.5 337,189.5 312,189.5"/>
    <polygon points="455,183 482,183 482,179 494.5,186.5 482,194 482,190 455,190"/>
    <polygon points="254,375.5 280,375.5 280,371.5 292.5,379 280,386.5 280,382.5 254,382.5"/>
    <polygon points="397,375.5 424,375.5 424,371.5 436.5,379 424,386.5 424,382.5 397,382.5"/>
  </g>

  <g font-size="28" dominant-baseline="central">
    <!-- アダムの家庭 → ノアの家庭 → アブラハムの家庭（横に詰めた字） -->
    <text x="156" y="119" textLength="130" lengthAdjust="spacingAndGlyphs">アダムの家庭</text>
    <text x="345" y="119" textLength="114" lengthAdjust="spacingAndGlyphs">ノアの家庭</text>
    <text x="518" y="119" textLength="172" lengthAdjust="spacingAndGlyphs">アブラハムの家庭</text>

    <!-- アブラハム → イサク → ヤコブ -->
    <text x="157" y="186.5" textLength="142" lengthAdjust="spacing">アブラハム</text>
    <text x="359" y="186.5" textLength="83" lengthAdjust="spacing">イサク</text>
    <text x="503" y="186.5" textLength="87" lengthAdjust="spacing">ヤコブ</text>

    <!-- モーセ・イエス -->
    <text x="157" y="249.5" textLength="84" lengthAdjust="spacing">モーセ</text>
    <text x="256" y="249.5" text-anchor="middle">：</text>
    <text x="273" y="249.5" textLength="374" lengthAdjust="spacing">三次の民族的カナン復帰路程</text>
    <text x="156" y="312" textLength="85" lengthAdjust="spacing">イエス</text>
    <text x="256" y="312" text-anchor="middle">：</text>
    <text x="273" y="312" textLength="374" lengthAdjust="spacing">三次の世界的カナン復帰路程</text>

    <!-- アダム → イエス → 再臨主 -->
    <text x="157" y="379" textLength="84" lengthAdjust="spacing">アダム</text>
    <text x="301" y="379" textLength="84" lengthAdjust="spacing">イエス</text>
    <text x="444" y="379" textLength="87" lengthAdjust="spacing">再臨主</text>
  </g>
</svg>
