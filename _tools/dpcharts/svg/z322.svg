<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>サタン主権の世界　「この世の君」（ヨハネ 12:31）「この世の神」（コリントⅡ 4:4）</title>
  <defs>
    <marker id="z322-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 四位の線（円の下に描く） -->
  <g stroke="currentColor" stroke-width="9">
    <line x1="454" y1="131.1" x2="285.3" y2="314.5"/>
    <line x1="454" y1="131.1" x2="623.3" y2="315.1"/>
    <line x1="285.3" y1="314.5" x2="453.6" y2="497.4"/>
    <line x1="623.3" y1="315.1" x2="453.6" y2="497.4"/>
  </g>

  <!-- 授受作用の矢印 -->
  <g stroke="currentColor" stroke-width="7.5" fill="none" marker-end="url(#z322-a)">
    <path d="M445,420 Q418.6,317.2 441.9,214.3"/>
    <path d="M465,211 Q491.2,313.4 468.6,415.7"/>
    <path d="M375,305.5 Q457.4,278.6 539.7,303.4"/>
    <path d="M541,325.5 Q458.7,352.5 376.3,327.6"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <circle cx="452.5" cy="141" r="57.75" fill="#50403D"/>
    <g fill="#CF921C">
      <ellipse cx="295.5" cy="315" rx="62.25" ry="56.75"/>
      <ellipse cx="624.5" cy="314" rx="62.25" ry="56.75"/>
      <ellipse cx="454" cy="479.5" rx="57.75" ry="50.25"/>
    </g>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="452.5" y="139.5" font-size="70" fill="#fff">サ</text>
    <g font-size="50" fill="#111">
      <text x="295" y="314.5">人間</text>
      <text x="624" y="314">万物</text>
      <text x="453.5" y="480">世界</text>
    </g>
  </g>

  <!-- 聖句（・は円で描く。括弧は字の幅がフォントで違うので、内側の端で合わせる。元は横に詰めた字） -->
  <circle cx="565" cy="84" r="9.5"/>
  <circle cx="563" cy="180" r="9.5"/>
  <g font-size="48" dominant-baseline="central">
    <text x="603.2" y="91.5" text-anchor="end">「</text>
    <text x="603.2" y="91.5" textLength="213" lengthAdjust="spacingAndGlyphs">この世の君</text>
    <text x="816.3" y="91.5">」</text>
    <text x="603.2" y="186.5" text-anchor="end">「</text>
    <text x="603.2" y="186.5" textLength="213" lengthAdjust="spacingAndGlyphs">この世の神</text>
    <text x="816.3" y="186.5">」</text>
  </g>
  <g font-size="46" dominant-baseline="central">
    <text y="91"><tspan x="849" textLength="106" lengthAdjust="spacingAndGlyphs">ヨハネ</tspan> <tspan x="966" textLength="87" lengthAdjust="spacingAndGlyphs">12:31</tspan></text>
    <text y="186.5"><tspan x="849" textLength="175" lengthAdjust="spacingAndGlyphs">コリントⅡ</tspan> <tspan x="1037" textLength="58" lengthAdjust="spacingAndGlyphs">4:4</tspan></text>
  </g>

  <rect x="224" y="555.5" width="448" height="78" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="273.5 323.5 373.5 423.5 473.5 523.5 573.5 623.5" y="595" font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">サタン主権の世界</text>
</svg>
