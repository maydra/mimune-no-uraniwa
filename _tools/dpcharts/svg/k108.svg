<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>40日洪水審判の目的</title>

  <!-- 題 -->
  <text y="35" font-size="30" dominant-baseline="central"><tspan x="35" textLength="30" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="78" textLength="247" lengthAdjust="spacing">日洪水審判の目的</tspan></text>
  <line x1="35" y1="54.5" x2="325" y2="54.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 2つの目的 -->
  <circle cx="151" cy="166" r="7.5"/>
  <circle cx="151" cy="290" r="7.5"/>
  <g font-size="31" dominant-baseline="central" lengthAdjust="spacing">
    <text x="167" y="166.5" textLength="503">神だけが対応することのできる対象</text>
    <text x="167" y="290" textLength="377">サタン相対の全人類滅ぼす</text>
  </g>
</svg>
