<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>① 内的主管性復帰（心情的主管性復帰）</title>

  <g dominant-baseline="central">
    <text x="77" y="58" font-size="48" text-anchor="middle">①</text>
    <text x="109.4" y="58" font-size="48" textLength="348" lengthAdjust="spacing">内的主管性復帰</text>
    <text x="464.8" y="58.5" font-size="44" textLength="407.3" lengthAdjust="spacingAndGlyphs">（心情的主管性復帰）</text>
  </g>
  <line x1="108" y1="88" x2="458" y2="88" stroke="currentColor" stroke-width="3.5"/>

  <!-- 2つの箱（z375・z379・z382・z384 で位置と形をそろえる） -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="205.5" y="208" width="428" height="299" fill="#fff" class="paper"/>
    <rect x="665.5" y="208" width="428" height="299" fill="#fff" class="paper"/>
    <ellipse cx="419.5" cy="207.2" rx="90.1" ry="55.1" fill="#FCE5E3"/>
    <ellipse cx="879.5" cy="202" rx="89.6" ry="46" fill="#CF921C"/>
  </g>
  <g fill="#111" dominant-baseline="central" text-anchor="middle">
    <text x="419.5" y="183.5" font-size="46">人間</text>
    <text x="419.5" y="230.5" font-size="46">完成</text>
    <text x="879.5" y="202" font-size="57">現世</text>
  </g>

  <!-- 左の箱 -->
  <circle cx="249.5" cy="307.5" r="12"/>
  <circle cx="247.5" cy="448.5" r="12"/>
  <g font-size="45" dominant-baseline="central">
    <text x="272.5" y="308.5" textLength="318.4" lengthAdjust="spacing">神と同一の心情</text>
    <text x="267.6" y="447" textLength="271.5" lengthAdjust="spacing">心情的主管者</text>
  </g>

  <!-- 右の箱 -->
  <circle cx="708.5" cy="305.5" r="12"/>
  <circle cx="708.5" cy="444.5" r="12"/>
  <g font-size="45" dominant-baseline="central">
    <text x="730.5" y="307" textLength="328.6" lengthAdjust="spacing">神に対する心霊</text>
    <text x="731.2" y="361.5" textLength="225.7" lengthAdjust="spacing">明るくなる</text>
    <text x="729.6" y="444" textLength="272.5" lengthAdjust="spacing">心情的主管者</text>
  </g>

  <!-- 現代 = 終末 -->
  <g font-size="65" dominant-baseline="central">
    <text x="473.5" y="589" textLength="130" lengthAdjust="spacing">現代</text>
    <text x="651" y="589" text-anchor="middle">=</text>
    <text x="700.5" y="589" textLength="130" lengthAdjust="spacing">終末</text>
  </g>
</svg>
