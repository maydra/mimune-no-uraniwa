<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>完成人間：神のような価値（マタイ 5:48）</title>

  <g font-size="44" dominant-baseline="central">
    <text x="220" y="77.5" textLength="135" lengthAdjust="spacing">マタイ</text>
    <text x="367" y="77.5" textLength="92" lengthAdjust="spacing">5:48</text>
  </g>

  <!-- 神と人間 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5">
    <ellipse cx="632" cy="175.25" rx="123" ry="64.25"/>
    <ellipse cx="632" cy="434.25" rx="122" ry="63.25"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="630.5" y="174.5" font-size="66">神</text>
    <text x="628" y="434" font-size="62" textLength="124" lengthAdjust="spacing">人間</text>
  </g>
  <g font-size="48" dominant-baseline="central">
    <text x="778" y="175" textLength="97" lengthAdjust="spacing">完全</text>
    <text x="777.5" y="436.5" textLength="97" lengthAdjust="spacing">完全</text>
  </g>

  <!-- 授受の矢印 -->
  <g fill="none" stroke="currentColor" stroke-width="9.5">
    <path d="M614,344 Q590.9,303.25 608.25,277.5"/>
    <path d="M646,260 Q667.8,294.9 652.4,326.25"/>
  </g>
  <polygon points="620.6,258.4 597.3,270.5 619.2,284.5"/>
  <polygon points="641.7,346.3 663.8,332.4 641,320.1"/>

  <rect x="271" y="539.5" width="713.5" height="87.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="54" dominant-baseline="central" fill="#111">
    <text x="304" y="582" textLength="216" lengthAdjust="spacing">完成人間</text>
    <text x="546.5" y="582" text-anchor="middle">：</text>
    <text x="574" y="582" textLength="379" lengthAdjust="spacing">神のような価値</text>
  </g>
</svg>
