<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>雌牛→完成　雌牛の時代＝妻の時代＝完成成約時代（雌牛＝妻・士師14:18、妻＝再臨後信徒）</title>

  <!-- 雌牛から完成へ -->
  <polygon points="305,96 484,96 484,90 499,99.5 484,109 484,103 305,103" fill="#8C949A"/>
  <ellipse cx="243.5" cy="99.5" rx="60" ry="37" fill="#DCC4C4" stroke="currentColor" stroke-width="2.8"/>
  <rect x="504.5" y="76.5" width="124.5" height="46.5" rx="6" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="29" text-anchor="middle" dominant-baseline="central">
    <text x="243.5" y="100" fill="#111">雌牛</text>
    <text x="567" y="99.5" textLength="63" lengthAdjust="spacing">完成</text>
  </g>

  <!-- 上への矢印 -->
  <polygon points="408,132 435,153.5 420.5,153.5 420.5,169 397,169 397,153.5 381,153.5" fill="#8C949A"/>

  <!-- 三つの時代 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8">
    <ellipse cx="191.5" cy="235.5" rx="71" ry="46.5"/>
    <ellipse cx="409" cy="235.5" rx="71.5" ry="46.5"/>
    <ellipse cx="625.5" cy="235.5" rx="71" ry="46.5"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="191.5" y="221">雌牛の</text>
    <text x="192" y="254.5">時代</text>
    <text x="409" y="219">妻の</text>
    <text x="410" y="253">時代</text>
    <text x="625" y="214.5" font-size="25">完成</text>
    <text x="625" y="248.5" font-size="26">成約時代</text>
  </g>
  <g fill="currentColor">
    <rect x="288" y="227" width="25" height="5.5"/>
    <rect x="288" y="238" width="25" height="5.5"/>
    <rect x="506.5" y="227" width="24.5" height="5.5"/>
    <rect x="506.5" y="238" width="24.5" height="5.5"/>
  </g>

  <!-- 下からの小さい矢印 -->
  <g fill="#8C949A">
    <polygon points="300,269 311,287 305.5,287 305.5,299 295.5,299 295.5,287 289,287"/>
    <polygon points="519,269 530,287 524.5,287 524.5,299 514.5,299 514.5,287 508,287"/>
  </g>

  <!-- 下の字 -->
  <g font-size="28.5" dominant-baseline="central">
    <text x="232" y="333.5" textLength="116" lengthAdjust="spacing">雌牛＝妻</text>
    <text x="427" y="333" textLength="203" lengthAdjust="spacing">妻＝再臨後信徒</text>
  </g>
  <text x="223" y="371" font-size="22" dominant-baseline="central" textLength="134" lengthAdjust="spacing">（士師 14:18）</text>
</svg>
