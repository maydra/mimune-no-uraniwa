<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス初臨の際</title>

  <!-- 題 -->
  <text x="35" y="37.5" font-size="30" dominant-baseline="central" textLength="219" lengthAdjust="spacing">イエス初臨の際</text>
  <line x1="34" y1="56.5" x2="255" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 矢印（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="8">
    <line x1="214" y1="172.7" x2="351" y2="127"/>
    <line x1="209.5" y1="196.5" x2="345" y2="252.5"/>
  </g>
  <g fill="currentColor">
    <polygon points="368,121.3 354.1,136.5 347.7,117.5"/>
    <polygon points="362,260 340.6,262.1 348.2,243.5"/>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central">
    <text transform="translate(285,123.5) rotate(-15)" textLength="130" lengthAdjust="spacing">盗人のように</text>
    <text transform="translate(283,261.8) rotate(22.3)" font-size="21" textLength="166" lengthAdjust="spacing">前もって知らされる</text>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="186" cy="182" rx="53" ry="36" fill="#F8F28F"/>
    <ellipse cx="486.5" cy="112" rx="105" ry="51.5" fill="#50403D"/>
    <ellipse cx="524.25" cy="266.25" rx="157.25" ry="84.75" fill="#DCC4C4"/>
  </g>
  <text x="186" y="182" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="82" lengthAdjust="spacing" fill="#111">イエス</text>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#fff">
    <text x="486" y="92.5" textLength="82" lengthAdjust="spacing">祭司長</text>
    <text x="486" y="132.5" textLength="112" lengthAdjust="spacing">律法学者</text>
  </g>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="400" y="233.5" textLength="209" lengthAdjust="spacing">洗礼ヨハネの家庭</text>
    <text x="400" y="268" textLength="129" lengthAdjust="spacing">東方の博士</text>
    <text x="402" y="302" textLength="248" lengthAdjust="spacing">シメオン、アンナ、羊飼い</text>
  </g>

  <!-- 例 -->
  <g font-size="28" dominant-baseline="central">
    <text x="147" y="350.5" textLength="25" lengthAdjust="spacingAndGlyphs">例</text>
    <text x="186.5" y="350.5" text-anchor="middle">：</text>
    <text x="202" y="350.5" textLength="128" lengthAdjust="spacing">ノアの審判</text>
    <text x="203" y="392.5" textLength="417" lengthAdjust="spacing">ソドム、ゴモラ滅びる、メシヤ降臨</text>
  </g>
</svg>
