    <text x="382.5" y="205" textLength="81" lengthAdjust="spacing">モーセ</text>
    <text x="565" y="205" textLength="82" lengthAdjust="spacing">イエス</text>
  </g>

  <!-- サ -->
  <circle cx="567" cy="333" r="38" fill="#50403D" stroke="currentColor" stroke-width="2.6"/>
  <text x="566" y="333.5" font-size="42" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>

  <text x="581" y="255.5" font-size="24" dominant-baseline="central" textLength="113" lengthAdjust="spacing">申命 18:18</text>

  <!-- 象徴的・形象的・実体的 -->
  <g stroke="currentColor" stroke-width="2" stroke-dasharray="15 5" fill="none">
    <line x1="228.5" y1="283.5" x2="298.5" y2="253.5"/>
    <line x1="356.5" y1="302.5" x2="431.5" y2="258.5"/>
    <line x1="438.5" y1="331.5" x2="556.5" y2="253.5"/>
