<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. アブラハムの家庭が見せてくれた教訓</title>

  <text x="36" y="37" font-size="30" dominant-baseline="central" textLength="36" lengthAdjust="spacingAndGlyphs">Ⅳ.</text>
  <text x="84" y="36.5" font-size="30" dominant-baseline="central" textLength="506" lengthAdjust="spacing">アブラハムの家庭が見せてくれた教訓</text>
  <line x1="81" y1="56.5" x2="591" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <g font-size="28" dominant-baseline="central">
    <!-- ① -->
    <text x="161.5" y="112.5" text-anchor="middle">①</text>
    <text x="180" y="112.5" textLength="115" lengthAdjust="spacing">み旨成就</text>
    <text x="339" y="112.5" textLength="84" lengthAdjust="spacing">神の力</text>
    <text x="462" y="112.5" textLength="202" lengthAdjust="spacing">人間の責任分担</text>

    <!-- ② -->
    <text x="161.5" y="177.5" text-anchor="middle">②</text>
    <text x="180" y="177.5" font-size="26" textLength="209" lengthAdjust="spacing">人間に対する予定</text>

    <!-- ③ -->
    <text x="161.5" y="239.5" text-anchor="middle">③</text>
    <text x="180" y="239.5" textLength="375" lengthAdjust="spacing">人間が責任分担を果たせない</text>
    <text y="280"><tspan x="210" textLength="144" lengthAdjust="spacing">み旨は延長</tspan><tspan x="353.3">、</tspan><tspan x="385" textLength="255" lengthAdjust="spacing">より大きな蕩減条件</tspan></text>

    <!-- ④ -->
    <text x="161.5" y="344" text-anchor="middle">④</text>
    <text x="179" y="344" textLength="168" lengthAdjust="spacing">供え物を裂く</text>
    <text x="210" y="384" textLength="346" lengthAdjust="spacing">我々も各自を善と悪に分立</text>
  </g>

  <!-- … と ＋ -->
  <g>
    <circle cx="307" cy="113" r="2.6"/>
    <circle cx="317" cy="113" r="2.6"/>
    <circle cx="326" cy="113" r="2.6"/>
  </g>
  <path d="M432.5,112.5 H454.5 M443.5,102.5 V123.5" stroke="currentColor" stroke-width="4.6" fill="none"/>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="163,278.5 182.5,278.5 182.5,273.5 196,281.5 182.5,289.5 182.5,284.5 163,284.5"/>
    <polygon points="163,381.5 182.5,381.5 182.5,376.5 196,384.5 182.5,392.5 182.5,387.5 163,387.5"/>
  </g>
</svg>
