<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>無形実体世界（主体）と有形実体世界（対象・影）、霊人体（永住）と肉身（脱げば）</title>

  <!-- 境の線（矢印の下に描く） -->
  <line x1="257" y1="354" x2="1021" y2="354" stroke="currentColor" stroke-width="4"/>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="373.5,306 389.5,306 389.5,373.5 398.5,373.5 381.5,401.5 364.5,373.5 373.5,373.5"/>
    <polygon points="888.5,308 905.5,336.5 896.5,336.5 896.5,402 880.5,402 880.5,336.5 871.5,336.5"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="3.5">
    <ellipse cx="378" cy="173.5" rx="88.25" ry="114.75" fill="#F98AEE"/>
    <ellipse cx="381.5" cy="528" rx="93.75" ry="114.25" fill="#A0F08A"/>
    <ellipse cx="889.5" cy="178" rx="57.75" ry="107.25" fill="#F98AEE"/>
    <ellipse cx="890.5" cy="528" rx="57.75" ry="107.25" fill="#A0F08A"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="52">
      <text x="379" y="111.5">無形</text>
      <text x="379" y="174.5">実体</text>
      <text x="379" y="237.5">世界</text>
      <text x="381.5" y="465">有形</text>
      <text x="381.5" y="527.5">実体</text>
      <text x="381.5" y="590.5">世界</text>
    </g>
    <g font-size="54">
      <text x="891" y="119">霊</text>
      <text x="891" y="178">人</text>
      <text x="890.5" y="236.5">体</text>
      <text x="891.5" y="497">肉</text>
      <text x="892" y="558.5">身</text>
    </g>
  </g>

  <!-- 縦書きの言葉 -->
  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="62">
      <text x="536.5" y="139.5">主</text>
      <text x="536.5" y="207">体</text>
      <text x="536.5" y="494.5">対</text>
      <text x="536.5" y="561">象</text>
    </g>
    <g font-size="54">
      <text x="618.5" y="474.5">︵</text>
      <text x="618.5" y="528.5">影</text>
      <text x="618.5" y="582.5">︶</text>
    </g>
    <g font-size="55">
      <text x="997" y="148">永</text>
      <text x="996" y="206.5">住</text>
      <text x="997" y="470">脱</text>
      <text x="997" y="528.5">げ</text>
      <text x="997.5" y="586">ば</text>
    </g>
  </g>
</svg>
