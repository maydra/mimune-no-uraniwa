<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アとエ → ヤコブ → モーセ：民族的カナン復帰完成者、神が殺そうとする試練に勝利 → イエス：世界的カナン復帰完成者、荒野40日の試練においてサタンと闘い、勝利</title>

  <!-- 下向きの矢印 -->
  <g fill="#8C949A">
    <polygon points="180,98 185.5,98 185.5,118.5 189.5,118.5 182.75,130.5 176,118.5 180,118.5"/>
    <polygon points="180,180 185.5,180 185.5,205.5 189.5,205.5 182.75,218.5 176,205.5 180,205.5"/>
    <polygon points="180,266 185.5,266 185.5,322.5 189.5,322.5 182.75,335.5 176,322.5 180,322.5"/>
  </g>

  <!-- アとエ -->
  <g transform="translate(182.5,72)">
    <ellipse rx="61.75" ry="28" fill="#CF921C"/>
    <path d="M-8,-27.5 C-25,-21 -24,-7.3 -4,-0.5 C21,8 21,23 3,27.5" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <ellipse rx="61.75" ry="28" fill="none" stroke="currentColor" stroke-width="3"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="147" y="73">ア</text>
    <text x="217" y="72">エ</text>
  </g>

  <!-- ヤコブ・モーセ・イエス -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="183" cy="158" rx="45" ry="23"/>
    <ellipse cx="182.5" cy="244" rx="44.5" ry="22.5"/>
    <ellipse cx="182.5" cy="361.5" rx="49.5" ry="23.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="183" y="158.5" font-size="24" textLength="70" lengthAdjust="spacing">ヤコブ</text>
    <text x="181.5" y="244.5" font-size="24" textLength="72" lengthAdjust="spacing">モーセ</text>
    <text x="182" y="361.5" font-size="25" textLength="76" lengthAdjust="spacing">イエス</text>
  </g>

  <!-- モーセ -->
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="241" y="202" textLength="289" lengthAdjust="spacing">民族的カナン復帰完成者</text>
    <text x="241" y="339.5" textLength="289" lengthAdjust="spacing">世界的カナン復帰完成者</text>
  </g>
  <text x="240.5" y="240.5" font-size="29" dominant-baseline="central" textLength="377" lengthAdjust="spacing">神が殺そうとする試練に勝利</text>

  <!-- （神の方から試練 ⇨人間を愛しているから） -->
  <circle cx="270" cy="277" r="16" fill="#fff" class="paper" stroke="currentColor" stroke-width="2"/>
  <text x="269.5" y="276.5" font-size="22" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="21.5" font-weight="400" dominant-baseline="central">
    <text x="247.5" y="277.5" text-anchor="middle">（</text>
    <text x="291" y="277.5" textLength="126" lengthAdjust="spacing">の方から試練</text>
    <text x="450" y="277.5" textLength="216" lengthAdjust="spacing">人間を愛しているから</text>
    <text x="666.5" y="277.5" text-anchor="middle">）</text>
  </g>
  <polygon points="431.5,272.5 441.5,272.5 441.5,268.5 450.5,276.5 441.5,284.5 441.5,280.5 431.5,280.5" fill="#8C949A" stroke="currentColor" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- 荒野 40 日の試練において サ と闘い、勝利 -->
  <circle cx="529" cy="379.5" r="15.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2"/>
  <g font-size="23" dominant-baseline="central">
    <text x="241" y="379.5" textLength="46" lengthAdjust="spacing">荒野</text>
    <text x="292.5" y="379.5" textLength="24" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="324" y="379.5" textLength="184" lengthAdjust="spacing">日の試練において</text>
    <text x="528.5" y="380" font-size="21" text-anchor="middle">サ</text>
    <text x="551" y="379.5" textLength="68" lengthAdjust="spacing">と闘い</text>
    <text x="617.5" y="379.5">、</text>
    <text x="641" y="379.5" textLength="46" lengthAdjust="spacing">勝利</text>
  </g>
</svg>
