<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ イエス自身の言行から見て（ヨハネ福音書6章29節、ルカ福音書19章41節～44節）</title>

  <g font-size="88" dominant-baseline="central">
    <text y="187"><tspan x="184.5" font-weight="400" text-anchor="middle">③</tspan> <tspan x="249.5" textLength="1068" lengthAdjust="spacing">イエス自身の言行から見て</tspan><tspan x="1317.5" font-weight="400">、</tspan><tspan x="1409.8" font-weight="400" textLength="1005.95" lengthAdjust="spacing">調べてみることにしよう</tspan><tspan x="2415.75" font-weight="400">。</tspan></text>
    <text y="367.5"><tspan x="235.25" textLength="358" lengthAdjust="spacing">イエスは</tspan><tspan x="593.25">、</tspan><tspan x="682.75" textLength="716" lengthAdjust="spacing">ユダヤ人に対して</tspan><tspan x="1398.75">、</tspan><tspan x="1488.25" textLength="1253" lengthAdjust="spacing">自分をメシヤとして信ずること</tspan></text>
    <text y="500.5"><tspan x="238.6" textLength="798.75" lengthAdjust="spacing">ができるように語り</tspan><tspan x="1037.35">、</tspan><tspan x="1126.1" textLength="443.75" lengthAdjust="spacing">行動された</tspan><tspan x="1569.85">。</tspan></text>
    <text y="681.5"><tspan x="237.45" font-weight="400" textLength="570.6" lengthAdjust="spacing">ヨハネ福音書</tspan> <tspan x="852.5" font-weight="400" text-anchor="middle">6</tspan> <tspan x="945" font-weight="400" text-anchor="middle">章</tspan> <tspan x="1060.5" font-weight="400" text-anchor="middle" textLength="90" lengthAdjust="spacingAndGlyphs">29</tspan> <tspan x="1127.45" font-weight="400" textLength="190.2" lengthAdjust="spacing">節で</tspan><tspan x="1317.65" font-weight="400">、</tspan><tspan x="1408.4" font-weight="400" textLength="1333.22" lengthAdjust="spacing">弟子たちがいかにすれば神のみ</tspan></text>
    <text y="815"><tspan x="238.5" font-weight="400" textLength="1564.51" lengthAdjust="spacing">業を行うことができるかと聞いたとき</tspan><tspan x="1803.01" font-weight="400">、</tspan><tspan x="1905" font-weight="400">『</tspan><tspan x="1936.84" textLength="803.79" lengthAdjust="spacing">神がつかわされた者</tspan></text>
    <text y="948.5"><tspan x="237.6" textLength="621.53" lengthAdjust="spacing">を信じることが</tspan><tspan x="859.13">、</tspan><tspan x="947.92" textLength="621.53" lengthAdjust="spacing">神のわざである</tspan><tspan x="1567.8" font-weight="400">』</tspan><tspan x="1659.65" font-weight="400" textLength="550.2" lengthAdjust="spacing">と答えられた</tspan><tspan x="2209.85" font-weight="400">。</tspan></text>
    <text y="1129"><tspan x="240.05" font-weight="400" textLength="459.5" lengthAdjust="spacing">ルカ福音書</tspan> <tspan x="770" font-weight="400" text-anchor="middle" textLength="85" lengthAdjust="spacingAndGlyphs">19</tspan> <tspan x="882" font-weight="400" text-anchor="middle">章</tspan> <tspan x="993.5" font-weight="400" text-anchor="middle" textLength="86" lengthAdjust="spacingAndGlyphs">41</tspan> <tspan x="1111" font-weight="400" text-anchor="middle">節</tspan><tspan x="1203.5" font-weight="400" text-anchor="middle">～</tspan> <tspan x="1318.5" font-weight="400" text-anchor="middle" textLength="92" lengthAdjust="spacingAndGlyphs">44</tspan> <tspan x="1386.4" font-weight="400" textLength="461.25" lengthAdjust="spacing">節を見ると</tspan><tspan x="1847.65" font-weight="400">、</tspan><tspan x="1934.75" textLength="362" lengthAdjust="spacing">イエスは</tspan><tspan x="2296.75">、</tspan><tspan x="2384.4" textLength="356.68" lengthAdjust="spacing">ユダヤ人</tspan></text>
    <text y="1261.5"><tspan x="235.7" textLength="1282.12" lengthAdjust="spacing">たちの背信行為を痛ましく思い</tspan><tspan x="1517.8" font-weight="400">、</tspan><tspan x="1611.55" font-weight="400" textLength="751.2" lengthAdjust="spacing">訴えるところなく</tspan><tspan x="2362.75" font-weight="400">、</tspan><tspan x="2454.75" font-weight="400" textLength="286.5" lengthAdjust="spacing">都を見</tspan></text>
    <text y="1395"><tspan x="237.8" font-weight="400" textLength="762.88" lengthAdjust="spacing">渡して泣きながら</tspan><tspan x="996" font-weight="400">、</tspan><tspan x="1085.75" font-weight="400" textLength="191" lengthAdjust="spacing">神が</tspan> <tspan x="1392.5" font-weight="400" text-anchor="middle" textLength="182" lengthAdjust="spacingAndGlyphs">2000</tspan> <tspan x="1506" font-weight="400" textLength="1235.52" lengthAdjust="spacing">年間も苦労して愛し導いてこ</tspan></text>
    <text y="1529"><tspan x="241.6" font-weight="400" textLength="272.25" lengthAdjust="spacing">られた</tspan><tspan x="513.44" textLength="1158.69" lengthAdjust="spacing">全イスラエル選民はもとより</tspan><tspan x="1672.13">、</tspan><tspan x="1759.35" textLength="535.8" lengthAdjust="spacing">この城までも</tspan><tspan x="2295.15">、</tspan><tspan x="2384.6" textLength="355.32" lengthAdjust="spacing">一つの石</tspan></text>
    <text y="1662"><tspan x="237.08" textLength="2043.32" lengthAdjust="spacing">も他の石の上に残さず滅ぼされてしまうと嘆かれた</tspan><tspan x="2280.4">。</tspan></text>
    <text y="1806.5"><tspan x="232.9" font-weight="400" textLength="276.75" lengthAdjust="spacing">そして</tspan><tspan x="564.5" font-weight="400">『</tspan><tspan x="597.1" textLength="269.25" lengthAdjust="spacing">それは</tspan><tspan x="866.35">、</tspan><tspan x="954.84" textLength="1786.4" lengthAdjust="spacing">おまえが神のおとずれの時を知らないでいた</tspan></text>
    <text y="1941"><tspan x="232.8" textLength="442" lengthAdjust="spacing">からである</tspan><tspan x="673.8" font-weight="400">』</tspan><tspan x="811.5" font-weight="400" text-anchor="middle">と</tspan><tspan x="857.8" font-weight="400">、</tspan><tspan x="949.75" font-weight="400" textLength="1281" lengthAdjust="spacing">その無知を指摘されたのである</tspan><tspan x="2230.75" font-weight="400">。</tspan></text>
  </g>

  <!-- 行頭の● -->
  <circle cx="193" cy="367.5" r="20"/>
  <circle cx="193" cy="681.5" r="20"/>
  <circle cx="193" cy="1129" r="20"/>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="5">
    <line x1="253" y1="247.5" x2="1318" y2="247.5"/>
    <line x1="1490" y1="428" x2="2741" y2="428"/>
    <line x1="239" y1="561.5" x2="1304" y2="561.5"/>
    <line x1="328" y1="1008.5" x2="1304" y2="1008.5"/>
    <line x1="511" y1="1322.5" x2="1516" y2="1322.5"/>
    <line x1="1127" y1="1722.5" x2="2281" y2="1722.5"/>
    <line x1="1133" y1="2002.5" x2="1591" y2="2002.5"/>
  </g>
</svg>
