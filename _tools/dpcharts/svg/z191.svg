<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>霊人体の成長と完成</title>

  <text x="52" y="77" font-size="48" textLength="450" lengthAdjust="spacing">霊人体の成長と完成</text>
  <line x1="52" y1="87.5" x2="502" y2="87.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 生霊体・生命体・霊形体 -->
  <ellipse cx="803.75" cy="381.75" rx="194.25" ry="163.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="803.5" cy="437" rx="134" ry="108.5" fill="#F8F28F" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="803.5" cy="492.5" rx="94" ry="53" fill="#FCE5E3" stroke="#111" stroke-width="4"/>

  <!-- 三段階の線 -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="214" y1="218" x2="1083" y2="218"/>
    <line x1="214" y1="328.5" x2="1083" y2="328.5"/>
    <line x1="214" y1="435.5" x2="1083" y2="435.5"/>
    <line x1="214" y1="545.5" x2="1083" y2="545.5"/>
  </g>
  <line x1="669.5" y1="435.5" x2="937.5" y2="435.5" stroke="#111" stroke-width="6"/>

  <polygon points="274,543 274,252 264,252 281.5,219 299,252 289,252 289,543" fill="#8C949A"/>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="805" y="180" font-size="44">無形世界そのまま感じる</text>
    <g font-size="48">
      <text x="447" y="273.5">完成期</text>
      <text x="446.5" y="382">長成期</text>
      <text x="446.5" y="492.5">蘇生期</text>
      <text x="806" y="276.5">生霊体</text>
      <text x="806" y="387.5" fill="#111">生命体</text>
      <text x="805.5" y="491" fill="#111">霊形体</text>
    </g>
    <text x="801.5" y="585" font-size="44">肉身を土台として</text>
  </g>
</svg>
