<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>荒野の40年流浪期間</title>

  <g font-size="28" dominant-baseline="central">
    <text x="49.5" y="57.5" text-anchor="middle">『</text>
    <text x="57" y="57.5" textLength="85" lengthAdjust="spacing">荒野の</text>
    <text x="151" y="57.5" textLength="27" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="187" y="57.5" textLength="143" lengthAdjust="spacing">年流浪期間</text>
    <text x="337" y="57.5" text-anchor="middle">』</text>
  </g>

  <!-- 箇条 -->
  <circle cx="158.5" cy="168" r="5.5"/>
  <circle cx="158.5" cy="286" r="5.5"/>
  <g font-size="28" dominant-baseline="central">
    <text x="175" y="168" textLength="81" lengthAdjust="spacing">モーセ</text>
    <text x="272.5" y="168" text-anchor="middle">：</text>
    <text x="289" y="168" textLength="286" lengthAdjust="spacing">第三次路程の信仰基台</text>
    <text x="174" y="286">民</text>
    <text x="230" y="286">族</text>
    <text x="272.5" y="286" text-anchor="middle">：</text>
    <text x="289" y="286" textLength="382" lengthAdjust="spacing">第三次路程の出発のための摂理</text>
  </g>
</svg>
