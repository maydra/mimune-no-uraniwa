<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『今日の民主主義政体』『人間一人の構造』</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text y="53"><tspan x="127">『</tspan><tspan x="140" textLength="260" lengthAdjust="spacing">今日の民主主義政体</tspan><tspan x="400">』</tspan></text>
    <text y="54"><tspan x="450">『</tspan><tspan x="463" textLength="202" lengthAdjust="spacing">人間一人の構造</tspan><tspan x="665">』</tspan></text>
  </g>

  <!-- 灰色の線（楕円の下に描く） -->
  <g stroke="#8C949A" stroke-width="7" fill="none">
    <line x1="257.5" y1="150" x2="257.5" y2="215"/>
    <line x1="547" y1="150" x2="547" y2="215"/>
    <line x1="244.6" y1="240" x2="164" y2="315"/>
    <line x1="257.5" y1="240" x2="257.5" y2="315"/>
    <line x1="260.6" y1="240" x2="345" y2="315"/>
    <line x1="535.6" y1="240" x2="455" y2="315"/>
    <line x1="546" y1="240" x2="546" y2="315"/>
    <line x1="553" y1="240" x2="635.5" y2="315"/>
    <line x1="159" y1="325.5" x2="351" y2="325.5"/>
    <line x1="449" y1="326" x2="642" y2="326"/>
  </g>

  <!-- 神・頭脳 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <circle cx="257.5" cy="132" r="32.2"/>
    <ellipse cx="547" cy="132" rx="40.2" ry="32.7"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="256.5" y="131.5" font-size="36">神</text>
    <text x="547" y="132" font-size="29" textLength="62" lengthAdjust="spacing">頭脳</text>
  </g>

  <!-- × -->
  <g stroke="currentColor" stroke-width="5.7">
    <line x1="241.5" y1="169.5" x2="275" y2="197.5"/>
    <line x1="274" y1="169.5" x2="240.5" y2="197.5"/>
    <line x1="529.5" y1="169.5" x2="563" y2="197.5"/>
    <line x1="562" y1="169.5" x2="528.5" y2="197.5"/>
  </g>

  <!-- 茶の楕円 -->
  <g fill="#CF921C" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="257" cy="229" rx="39.7" ry="25.7"/>
    <ellipse cx="547.5" cy="229" rx="39.2" ry="25.7"/>
    <ellipse cx="159" cy="327" rx="37.7" ry="26.7"/>
    <ellipse cx="255" cy="327" rx="37.7" ry="26.7"/>
    <ellipse cx="351" cy="327" rx="37.7" ry="26.7"/>
    <ellipse cx="449" cy="327" rx="37.7" ry="26.7"/>
    <ellipse cx="545.5" cy="327" rx="37.2" ry="26.7"/>
    <ellipse cx="642" cy="327" rx="37.7" ry="26.7"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="256.5" y="228.5" textLength="57" lengthAdjust="spacing">政党</text>
    <text x="547.5" y="228.5" textLength="57" lengthAdjust="spacing">脊髄</text>
    <text x="159" y="326.5" textLength="58" lengthAdjust="spacing">立法</text>
    <text x="255.5" y="326.5" textLength="57" lengthAdjust="spacing">司法</text>
    <text x="351.5" y="326.5" textLength="57" lengthAdjust="spacing">行政</text>
    <text x="449" y="326.5" textLength="58" lengthAdjust="spacing">肺臓</text>
    <text x="545.5" y="326.5" textLength="59" lengthAdjust="spacing">心臓</text>
    <text x="643" y="326.5" textLength="56" lengthAdjust="spacing">胃腸</text>
  </g>

  <!-- 横の字 -->
  <g dominant-baseline="central">
    <g font-size="25">
      <text x="309" y="213" textLength="105" lengthAdjust="spacing">神のみ旨</text>
      <text x="309" y="244" textLength="105" lengthAdjust="spacing">知らない</text>
    </g>
    <g font-size="21.5">
      <text x="591" y="199" textLength="103" lengthAdjust="spacing">命令を伝達</text>
      <text x="591" y="227.5" textLength="103" lengthAdjust="spacing">することが</text>
      <text x="591" y="255.5" textLength="82" lengthAdjust="spacing">できない</text>
    </g>
    <text y="381.5" font-size="27"><tspan x="187" textLength="57" lengthAdjust="spacing">対立</tspan><tspan x="244">、</tspan><tspan x="266" textLength="57" lengthAdjust="spacing">衝突</tspan></text>
  </g>
</svg>
