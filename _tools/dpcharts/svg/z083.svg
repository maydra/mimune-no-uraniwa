<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の万有原力と被造物の性相・形状（相対基台・存在基台）</title>
  <defs>
    <marker id="z083-d" viewBox="0 0 20 14" refX="14" refY="7" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="14" orient="auto">
      <path d="M0,0 L20,7 L0,14 z" fill="#111"/>
    </marker>
  </defs>

  <!-- 神・万有原力 -->
  <text x="400" y="131.5" font-size="60" text-anchor="middle" dominant-baseline="central">神</text>
  <ellipse cx="577.5" cy="135" rx="122.75" ry="54.25" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="575.5" y="134.5" font-size="50" text-anchor="middle" dominant-baseline="central">万有原力</text>
  <text x="268.5" y="293" font-size="50" text-anchor="middle" dominant-baseline="central">被造物</text>

  <!-- 被造物の楕円：性相（桃）と形状（緑） -->
  <ellipse cx="584.5" cy="415" rx="276" ry="181.5" fill="#A0F08A"/>
  <path d="M584.5,233.5 C508,297 508,345 586,416 C652,476 652,528 590,596.4 A276,181.5 0 1 1 584.5,233.5 Z" fill="#F98AEE"/>
  <ellipse cx="584.5" cy="415" rx="276" ry="181.5" fill="none" stroke="currentColor" stroke-width="4"/>

  <!-- 万有原力から性相・形状へ（楕円の外は地の色、中は面の色） -->
  <g stroke-width="7">
    <line x1="546" y1="166" x2="470" y2="250.4" stroke="currentColor"/>
    <line x1="470" y1="250.4" x2="428" y2="297" stroke="#111"/>
    <line x1="604" y1="166" x2="683.4" y2="246" stroke="currentColor"/>
    <line x1="683.4" y1="246" x2="732" y2="295" stroke="#111"/>
  </g>

  <!-- 授受作用 -->
  <g stroke="#111" stroke-width="4.5" fill="none" marker-end="url(#z083-d)">
    <path d="M518,318 Q580,296 649,317"/>
    <path d="M648,346 Q583,368 519,347"/>
  </g>
  <g font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="438.5" y="336">性相</text>
    <text x="730.5" y="331.5">形状</text>
  </g>

  <!-- 相対基台・存在基台 -->
  <g fill="#8C949A" stroke="#111" stroke-width="1.5">
    <polygon points="569.75,378.75 601.25,378.75 601.25,393.5 615.25,393.5 584.5,413 554.75,393.5 569.75,393.5"/>
    <polygon points="568,479 599.5,479 599.5,494.5 613,494.5 582.5,515.5 552.5,494.5 568,494.5"/>
  </g>
  <g font-size="48" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="586" y="443">相対基台</text>
    <text x="582.5" y="545">存在基台</text>
  </g>

  <!-- 点線と括弧 -->
  <g stroke-width="7" stroke-dasharray="8 9.29">
    <line x1="693" y1="546" x2="771" y2="546" stroke="#111"/>
    <line x1="779.4" y1="546" x2="823" y2="546" stroke="currentColor"/>
  </g>
  <path d="M861,484 Q849.5,486 849.5,500 L849.5,530 Q849.5,541 840,543.5 Q849.5,546 849.5,557 L849.5,588 Q849.5,600 861,602" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="880.5" cy="511.5" r="8.5"/>
  <circle cx="879.5" cy="576.5" r="8.5"/>
  <g font-size="46" dominant-baseline="central">
    <text x="899" y="511.5">神の対象</text>
    <text x="899" y="574">存在</text>
  </g>
</svg>
