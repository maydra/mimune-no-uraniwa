<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 生命の木と善悪を知る木　善悪の果は木の果実か（①神 ②イエス）</title>

  <text x="55" y="58.5" font-size="46" dominant-baseline="central">Ⅰ.</text>
  <text x="133" y="57.5" font-size="50" dominant-baseline="central" textLength="550" lengthAdjust="spacing">生命の木と善悪を知る木</text>
  <line x1="133" y1="88" x2="683" y2="88" stroke="currentColor" stroke-width="3.5"/>

  <!-- 善悪の果 -->
  <g>
    <path d="M 302.6,170.3 C 311.2,161.8 321.4,157.9 333.0,157.9 C 356.2,157.9 376.1,177.4 376.1,211.5 C 376.1,242.7 364.9,271.1 347.5,285.3 C 341.7,291.7 333.0,295.9 321.4,295.9 C 314.1,296.7 308.4,299.5 302.6,299.5 C 295.3,299.5 289.5,295.9 282.2,295.9 C 275.0,295.9 269.2,294.5 261.9,288.1 C 243.1,273.9 231.5,245.5 231.5,214.3 C 231.5,183.1 246.0,161.8 267.8,161.2 C 280.8,160.8 292.4,163.2 302.6,170.3 Z" fill="#E8202A" stroke="#111" stroke-width="4.2" stroke-linejoin="round"/>
    <path d="M 301.1,170.3 C 300.4,156.1 296.8,143.3 288.1,133.4" fill="none" stroke="#111" stroke-width="6.6" stroke-linecap="round"/>
    <path d="M 301.1,170.3 C 300.4,156.1 296.8,143.3 288.1,133.4" fill="none" stroke="#8B5A2B" stroke-width="3.7" stroke-linecap="round"/>
    <path d="M 305.4,163.2 C 309.8,150.4 322.9,141.9 340.2,143.3 C 334.4,156.1 321.4,163.2 305.4,163.2 Z" fill="#4CAF50" stroke="#111" stroke-width="1.7" stroke-linejoin="round"/>
  </g>
  <text x="305.5" y="226" font-size="41" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="124" lengthAdjust="spacingAndGlyphs">善悪の果</text>

  <polygon points="429,222.5 467.5,222.5 467.5,207.5 505,229.5 467.5,251.5 467.5,236.5 429,236.5" fill="#8C949A" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>

  <rect x="558" y="189" width="322" height="79.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="589" y="229.5" font-size="53" dominant-baseline="central" fill="#111" textLength="272" lengthAdjust="spacing">木の果実？</text>

  <!-- ① 神 -->
  <text y="373.5" font-size="46" dominant-baseline="central"><tspan x="252">①</tspan><tspan x="316">神</tspan><tspan x="396.7">：</tspan><tspan x="432" textLength="598" lengthAdjust="spacing">取って食べて堕落する果実？</tspan></text>
  <text x="346" y="428" font-size="36" text-anchor="middle" dominant-baseline="central">（父母）</text>

  <!-- ② イエス -->
  <g font-size="46" dominant-baseline="central">
    <text y="508.5"><tspan x="249">②</tspan><tspan x="313" textLength="140" lengthAdjust="spacing">イエス</tspan><tspan x="460.7">：</tspan><tspan x="497.5">「</tspan><tspan x="518" textLength="469" lengthAdjust="spacing">口にはいるものは人を</tspan></text>
    <text y="571"><tspan x="518.6" textLength="368" lengthAdjust="spacing">汚すことはない…</tspan><tspan x="883.8">」</tspan></text>
  </g>
  <text y="624.5" font-size="33" dominant-baseline="central"><tspan x="846" textLength="112" lengthAdjust="spacingAndGlyphs">（マタイ</tspan> <tspan x="969.7" textLength="95" lengthAdjust="spacingAndGlyphs">15:11）</tspan></text>
</svg>
