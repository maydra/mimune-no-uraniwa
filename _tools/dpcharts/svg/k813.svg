<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑨ ルカ 17:26　地上で再臨</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="34" y="38">⑨</text>
    <text x="72" y="38" textLength="57" lengthAdjust="spacing">ルカ</text>
    <text x="137" y="38" textLength="72" lengthAdjust="spacing">17:26</text>
  </g>

  <!-- 聖句（細字） -->
  <g font-size="28.5" font-weight="400" dominant-baseline="central">
    <text y="129"><tspan x="157">『</tspan><tspan x="169" textLength="330" lengthAdjust="spacing">ノアの時にあったように</tspan><tspan x="499">、</tspan><tspan x="529" textLength="117" lengthAdjust="spacing">人の子の</tspan></text>
    <text x="166" y="168.5" textLength="445" lengthAdjust="spacing">時にも同様なことが起るであろう』</text>
  </g>

  <!-- 地上で再臨 -->
  <ellipse cx="220" cy="299.5" rx="86.5" ry="41" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="220.5" y="281" textLength="88" lengthAdjust="spacing">地上で</text>
    <text x="221" y="318.5" textLength="58" lengthAdjust="spacing">再臨</text>
  </g>

  <!-- 右の字 -->
  <g font-size="29" dominant-baseline="central">
    <text y="261.5"><tspan x="324" textLength="141.5" lengthAdjust="spacing">信徒たちは</tspan><tspan x="465.5">、</tspan><tspan x="493.8" textLength="198" lengthAdjust="spacing">地上から聞こえ</tspan></text>
    <text x="323" y="306" textLength="370" lengthAdjust="spacing">てくるそのみ言には一向耳を</text>
    <text y="350.5"><tspan x="324" textLength="85" lengthAdjust="spacing">傾けず</tspan><tspan x="409">、</tspan><tspan x="437.2" textLength="255" lengthAdjust="spacing">異端者であると排斥</tspan></text>
  </g>
</svg>
