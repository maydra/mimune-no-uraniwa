<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>堕落に関する問題を解明</title>

  <circle cx="63.5" cy="61" r="13"/>
  <text x="88" y="60" font-size="49" textLength="550" lengthAdjust="spacing" dominant-baseline="central">堕落に関する問題を解明</text>
  <line x1="88" y1="90.5" x2="638" y2="90.5" stroke="currentColor" stroke-width="4"/>

  <!-- － -->
  <g stroke="#8C949A" stroke-width="6">
    <line x1="202" y1="204.5" x2="237" y2="204.5"/>
    <line x1="202" y1="314.5" x2="237" y2="314.5"/>
    <line x1="202" y1="425.5" x2="237" y2="425.5"/>
    <line x1="202" y1="540.5" x2="237" y2="540.5"/>
  </g>

  <g font-size="48" dominant-baseline="central">
    <text y="201"><tspan x="281">堕</tspan><tspan x="376.5">落</tspan></text>
    <text x="253" y="314" textLength="192" lengthAdjust="spacing">人間創造</text>
    <text x="253" y="426" textLength="192" lengthAdjust="spacing">人間堕落</text>
    <text x="253" y="539" textLength="192" lengthAdjust="spacing">罪悪人間</text>
    <g text-anchor="middle">
      <text x="466" y="201">：</text>
      <text x="466" y="314">：</text>
      <text x="466" y="426">：</text>
      <text x="466" y="539">：</text>
    </g>
    <text x="490" y="201" textLength="576" lengthAdjust="spacing">善悪の果を取って食べる？</text>
    <text x="490" y="314" textLength="336" lengthAdjust="spacing">堕落の可能性？</text>
    <text x="490" y="426" textLength="624" lengthAdjust="spacing">食い止めることができない？</text>
    <text x="490" y="539" textLength="288" lengthAdjust="spacing">一時に救う？</text>
  </g>
</svg>
