<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. イエスの典型路程としてヤコブ路程とモーセ路程とを立てられた理由</title>

  <!-- 題 -->
  <text x="51" y="37.5" font-size="30" text-anchor="middle" dominant-baseline="central">Ⅰ</text>
  <text x="63" y="37.5" font-size="30" dominant-baseline="central">.</text>
  <text x="79.5" y="37.5" font-size="30" dominant-baseline="central" textLength="512" lengthAdjust="spacing">イエスの典型路程としてヤコブ路程と</text>
  <text x="367.5" y="79.5" font-size="30" dominant-baseline="central" textLength="420" lengthAdjust="spacing">モーセ路程とを立てられた理由</text>
  <g stroke="currentColor" stroke-width="2.5">
    <line x1="79" y1="57" x2="589" y2="57"/>
    <line x1="367" y1="99" x2="790" y2="99"/>
  </g>

  <!-- 復帰摂理の目的 -->
  <rect x="165" y="126" width="239" height="42" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="183" y="147" font-size="29" dominant-baseline="central" fill="#111" textLength="203" lengthAdjust="spacing">復帰摂理の目的</text>
  <g font-size="27" dominant-baseline="central">
    <text x="427" y="145.5" text-anchor="middle">：</text>
    <text x="438.5" y="145.5" textLength="189" lengthAdjust="spacing">人間がサタンを</text>
    <text x="442.5" y="181.5" textLength="104" lengthAdjust="spacingAndGlyphs">自然屈伏</text>
    <text x="569.5" y="181.5" textLength="54" lengthAdjust="spacing">主管</text>
  </g>
  <circle cx="558.5" cy="182.5" r="3.5"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="345.5,249 350.5,249 350.5,262.5 354,262.5 348,272.5 342,262.5 345.5,262.5"/>
    <polygon points="345.5,326 350.5,326 350.5,341 354,341 348,351 342,341 345.5,341"/>
    <!-- 従う -->
    <polygon points="532,298.3 424,298.3 424,294 412.5,300.7 424,307.4 424,303.1 532,303.1"/>
    <!-- 信徒からサへ -->
    <polygon points="585.3,315.6 401.1,372.3 399.8,368.2 389.5,378.2 403.6,380.8 402.5,377.1 586.7,320.4"/>
  </g>

  <!-- 神・イエス・サ・信徒 -->
  <g stroke="currentColor" stroke-width="2.5">
    <circle cx="347.5" cy="219" r="29.5" fill="#fff" class="paper"/>
    <ellipse cx="348" cy="300.3" rx="51.8" ry="24.8" fill="#F8F28F"/>
    <circle cx="347.5" cy="384" r="30" fill="#50403D"/>
    <ellipse cx="585.5" cy="297.5" rx="48.5" ry="22.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="347" y="219.5" font-size="34">神</text>
    <text x="348" y="300" font-size="26" fill="#111" textLength="78" lengthAdjust="spacing">イエス</text>
    <text x="346.5" y="384.5" font-size="31" fill="#fff">サ</text>
    <text x="584.5" y="297.5" font-size="29" fill="#111" textLength="58" lengthAdjust="spacing">信徒</text>
  </g>

  <g font-size="28" dominant-baseline="central">
    <text x="202" y="298.5" textLength="79" lengthAdjust="spacingAndGlyphs">メシヤ</text>
    <text x="442" y="278" font-size="29" textLength="58" lengthAdjust="spacing">従う</text>
    <text x="390.5" y="397" textLength="105" lengthAdjust="spacingAndGlyphs">自然屈伏</text>
  </g>
</svg>
