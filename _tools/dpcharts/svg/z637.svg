<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>3. イエスと聖霊による霊的重生</title>

  <g dominant-baseline="central">
    <text x="52.1" y="61.5" font-size="47" textLength="46" lengthAdjust="spacing">3.</text>
    <text x="116.4" y="60.9" font-size="50" textLength="648" lengthAdjust="spacing">イエスと聖霊による霊的重生</text>
  </g>
  <line x1="114" y1="90.5" x2="764" y2="90.5" stroke="currentColor" stroke-width="4"/>

  <!-- 四位の太い線（円と楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="10.5">
    <line x1="649.9" y1="169.5" x2="517.2" y2="299"/>
    <line x1="646.5" y1="169.5" x2="776" y2="299"/>
    <line x1="505.5" y1="299" x2="644.8" y2="438.3"/>
    <line x1="789" y1="299" x2="649.8" y2="438.3"/>
  </g>

  <!-- 信徒から下への灰色の矢印（信徒の楕円の下に描く） -->
  <polygon points="641.5,470 652.5,470 652.5,524 660.5,524 647,551.5 633.5,524 641.5,524" fill="#8C949A"/>

  <g stroke="currentColor" stroke-width="4.5">
    <circle cx="648" cy="169.5" r="51" fill="#fff" class="paper"/>
    <ellipse cx="493" cy="299" rx="86" ry="48.5" fill="#F98AEE"/>
    <ellipse cx="795.5" cy="299" rx="86" ry="48.5" fill="#A0F08A"/>
    <ellipse cx="647" cy="438.25" rx="120" ry="43.75" fill="#FCE5E3"/>
  </g>
  <text x="647.4" y="168.9" font-size="52" text-anchor="middle" dominant-baseline="central">神</text>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="494.2" y="299.8" font-size="45" textLength="136" lengthAdjust="spacing">イエス</text>
    <text x="796" y="298.9" font-size="46" textLength="110" lengthAdjust="spacing">聖霊</text>
    <text x="646" y="438.6" font-size="49" textLength="111" lengthAdjust="spacing">信徒</text>
  </g>

  <!-- イエスと聖霊の授受の矢印 -->
  <g fill="none" stroke="currentColor" stroke-width="6.5">
    <path d="M597.5,287.5 C598.8,286.9 602.2,285.2 605,284 C607.8,282.8 610.5,281.1 614,280 C617.5,278.9 622,278.2 626,277.5 C630,276.8 634,276.2 638,276 C642,275.8 646,275.8 650,276 C654,276.2 658.5,276.5 662,277 C665.5,277.5 668.2,278.4 671,279 C673.8,279.6 677.7,280.2 679,280.5"/>
    <path d="M698,313 C696.5,313.5 692,314.8 689,316 C686,317.2 683,318.9 680,320 C677,321.1 674.5,321.7 671,322.5 C667.5,323.3 663,324.4 659,325 C655,325.6 651,325.8 647,325.8 C643,325.8 638.5,325.4 635,325 C631.5,324.6 629.2,324.2 626,323.5 C622.8,322.8 617.2,321 615.5,320.5"/>
  </g>
  <polygon points="682.5,270 697,287.5 675,289.5"/>
  <polygon points="618.8,309.5 595,313.8 611.3,330.8"/>

  <!-- イエスと聖霊から信徒への灰色の矢印（授受の矢印の上に描く） -->
  <polygon points="642.5,297 653.5,297 653.5,361.5 663.5,361.5 648,392 632.5,361.5 642.5,361.5" fill="#8C949A"/>

  <!-- 霊的 真の父・霊的 真の母（細字） -->
  <g font-size="43" font-weight="400" dominant-baseline="central">
    <text x="283.9" y="270.2" textLength="90" lengthAdjust="spacing">霊的</text>
    <text x="259.9" y="323.9" textLength="136" lengthAdjust="spacing">真の父</text>
    <text x="920.9" y="266.7" textLength="90" lengthAdjust="spacing">霊的</text>
    <text x="896.9" y="320.9" textLength="136" lengthAdjust="spacing">真の母</text>
  </g>

  <!-- 聖句の出典（細字。数字は横に詰めた字） -->
  <g font-size="35" font-weight="400" dominant-baseline="central">
    <text x="789.9" y="392.6" textLength="134" lengthAdjust="spacing">コリント</text>
    <text x="947.5" y="392.5" text-anchor="middle">Ⅰ</text>
    <text x="972.9" y="392.5" textLength="76" lengthAdjust="spacingAndGlyphs">12:3</text>
  </g>

  <rect x="341" y="559.5" width="610.5" height="81" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="371.4" y="601.4" font-size="45" textLength="550" lengthAdjust="spacing" dominant-baseline="central" fill="#111">新しい霊的自我：霊的重生</text>
</svg>
