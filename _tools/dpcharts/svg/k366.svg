  <line x1="33" y1="51.5" x2="236" y2="51.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="540.1,91.2 273.4,179.6 272.0,175.3 262.0,186.5 276.7,189.5 275.3,185.3 541.9,96.8"/>
    <polygon points="539.3,91.5 425.2,167.3 422.7,163.6 416.0,177.0 431.0,176.1 428.5,172.3 542.7,96.5"/>
    <polygon points="562.5,131 562.5,161.5 558.5,161.5 565.5,173.5 572.5,161.5 568.5,161.5 568.5,131"/>
    <polygon points="266,208.5 306,208.5 306,212.5 318,205.5 306,198.5 306,202.5 266,202.5"/>
    <polygon points="445,208.5 485,208.5 485,212.5 497,205.5 485,198.5 485,202.5 445,202.5"/>
    <polygon points="562.5,236 562.5,279 558.5,279 565.5,291 572.5,279 568.5,279 568.5,236"/>
    <!-- 点線の矢印の矢じり -->
    <polygon points="503.1,327.1 519,324.5 508.7,312.1"/>
    <polygon points="508.1,302.2 525,304 517.1,289"/>
  </g>
  <g stroke="#8C949A" stroke-width="4.6" stroke-dasharray="13 10" fill="none">
