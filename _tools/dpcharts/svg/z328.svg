<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理の目的</title>

  <text x="56" y="74" font-size="46">Ⅱ.</text>
  <text x="128" y="74.5" font-size="48" textLength="349" lengthAdjust="spacing">復帰摂理の目的</text>
  <line x1="127" y1="86" x2="477" y2="86" stroke="currentColor" stroke-width="3.5"/>

  <!-- 創造目的 → 復帰摂理の目的 -->
  <rect x="231" y="173" width="255" height="83" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="358.5" y="214.5" font-size="54" text-anchor="middle" dominant-baseline="central">創造目的</text>
  <polygon points="523,222.5 603,222.5 603,232.5 631,216 603,199.5 603,209.5 523,209.5" fill="#8C949A"/>
  <rect x="666" y="173" width="409" height="83" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="870" y="214.5" font-size="54" text-anchor="middle" dominant-baseline="central" fill="#111">復帰摂理の目的</text>

  <!-- 縦の＝ -->
  <g>
    <rect x="341" y="292" width="11" height="57"/>
    <rect x="366" y="292" width="11" height="57"/>
    <rect x="853" y="292" width="11" height="57"/>
    <rect x="878" y="292" width="11" height="57"/>
  </g>

  <g font-size="48" text-anchor="middle" dominant-baseline="central">
    <text x="361" y="402.5" textLength="200" lengthAdjust="spacing">地上天国</text>
    <text x="875" y="402.5" textLength="300" lengthAdjust="spacing">地上天国復帰</text>
  </g>

  <!-- マタイ 6:10（聖句の本文は元のとおり細字） -->
  <g font-size="40" dominant-baseline="central">
    <text y="540"><tspan x="206" textLength="120" lengthAdjust="spacing">マタイ</tspan> <tspan x="339" textLength="84" lengthAdjust="spacingAndGlyphs">6:10</tspan></text>
    <text y="540" font-weight="400"><tspan x="468" text-anchor="end">『</tspan><tspan x="464" textLength="624" lengthAdjust="spacing">みこころが天に行われるとおり</tspan><tspan x="1089">、</tspan></text>
    <text y="602" font-weight="400"><tspan x="464" textLength="460" lengthAdjust="spacing">地にも行われますように</tspan><tspan x="921">』</tspan></text>
  </g>
</svg>
