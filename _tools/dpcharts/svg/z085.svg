    <text x="501" y="290.5">家庭</text>
    <text x="501" y="396">社会</text>
    <text x="501" y="501">国家</text>
    <text x="501" y="607">世界</text>
  </g>
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
