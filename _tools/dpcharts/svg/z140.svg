<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>創造本然の価値の決定とその価値の基準　創造本然の価値決定</title>

  <g font-size="46" dominant-baseline="central">
    <text x="76" y="56" text-anchor="middle">Ⅰ</text>
    <text x="106.5" y="56" text-anchor="middle">.</text>
    <text x="128" y="56" textLength="825" lengthAdjust="spacing">創造本然の価値の決定とその価値の基準</text>
    <text x="124" y="123" textLength="446" lengthAdjust="spacing">創造本然の価値決定</text>
  </g>
  <g stroke="currentColor" stroke-width="3.5">
    <line x1="126" y1="86" x2="953" y2="86"/>
    <line x1="123" y1="153" x2="572" y2="153"/>
  </g>

  <!-- 神の創造理想から人間と個性体へ（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="9">
    <line x1="631" y1="290" x2="501" y2="447"/>
    <line x1="668" y1="290" x2="802" y2="447"/>
  </g>

  <text x="653" y="201" font-size="50" text-anchor="middle" dominant-baseline="central">神</text>
  <g stroke="currentColor" stroke-width="3.5">
    <ellipse cx="652.5" cy="289.5" rx="99" ry="51" fill="#fff" class="paper"/>
    <ellipse cx="460.5" cy="447" rx="95" ry="58" fill="#F98AEE"/>
    <ellipse cx="813.5" cy="447" rx="95" ry="58" fill="#A0F08A"/>
  </g>
  <g font-size="40" text-anchor="middle" dominant-baseline="central">
    <text x="652.5" y="288" font-size="41">創造理想</text>
    <g fill="#111">
      <text x="458" y="420">価値</text>
      <text x="459" y="472">追求欲</text>
      <text x="813.5" y="447">存在目的</text>
    </g>
  </g>
  <g font-size="44" dominant-baseline="central">
    <text x="262" y="422">人間</text>
    <text x="262" y="474">主体</text>
    <text x="928" y="422">個性体</text>
    <text x="929" y="476">対象</text>
  </g>

  <!-- 授受の矢印 -->
  <polygon points="578,426 681,426 681,420 701,430.5 681,441 681,436 578,436"/>
  <polygon points="696,454 593,454 593,448 573,458.5 593,469 593,463 696,463"/>

  <!-- 個性体の創造本然の価値へ -->
  <g fill="#8C949A">
    <polygon points="612,467 624,467 624,543 633,543 618,565 603,543 612,543"/>
    <polygon points="637,543 668,543 652.5,565"/>
  </g>
  <line x1="652.5" y1="337" x2="652.5" y2="543" stroke="#8C949A" stroke-width="12" stroke-dasharray="13 11"/>

  <rect x="331" y="570" width="616" height="81" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <text x="639" y="611" font-size="48" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="546" lengthAdjust="spacing">個性体の創造本然の価値</text>
</svg>
