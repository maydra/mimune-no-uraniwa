<h1>詩篇 第125章</h1>
<div class="the-post-cont">

<p><sup>1</sup>主に信頼する者は、動かされることなくて、とこしえにあるシオンの山のようである。</p>
<p><sup>2</sup>山々がエルサレムを囲んでいるように、主は今からとこしえにその民を囲まれる。</p>
<p><sup>3</sup>これは悪しき者のつえが正しい者の所領にとどまることなく、正しい者がその手を不義に伸べることのないためである。</p>
<p><sup>4</sup>主よ、善良な人と、心の正しい人とに、さいわいを施してください。</p>
<p><sup>5</sup>しかし転じて自分の曲った道に入る者を主は、悪を行う者と共に去らせられる。イスラエルの上に平安があるように。</p>
