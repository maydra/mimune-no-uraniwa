<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>実体基台　出発のための摂理：ペリシテへの近道（21日路程）　不信：出発できない</title>

  <!-- 実体基台 -->
  <rect x="302" y="50" width="136" height="39.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="369" y="70" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="110" lengthAdjust="spacing">実体基台</text>

  <!-- 灰色の矢印 -->
  <polygon points="470,99.5 275,99.5 275,94 259,102.5 275,111 275,106 470,106" fill="#8C949A"/>

  <!-- モーセ・イスラエル民族 -->
  <ellipse cx="192" cy="103" rx="60.5" ry="25.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <ellipse cx="578.5" cy="103" rx="107" ry="28.5" fill="#F86D42" stroke="currentColor" stroke-width="2.2"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="192.5" y="102.5" font-size="28" textLength="81" lengthAdjust="spacing">モーセ</text>
    <text x="579" y="102.5" font-size="26" textLength="182" lengthAdjust="spacing">イスラエル民族</text>
  </g>

  <!-- 出発のための摂理 -->
  <rect x="241.5" y="158.5" width="281" height="47" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="383" y="182" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="248" lengthAdjust="spacing">出発のための摂理</text>

  <g font-size="28" dominant-baseline="central">
    <text x="147" y="235.5" textLength="402" lengthAdjust="spacing">モーセがエジプト人を打ち殺す</text>
    <text x="564" y="235.5" text-anchor="middle">：</text>
    <text x="580" y="235.5" textLength="85" lengthAdjust="spacing">同胞愛</text>
  </g>
  <polygon points="376,258 388,258 388,268.5 399,268.5 382.5,283 366,268.5 376,268.5" fill="#8C949A"/>
  <g font-size="30" dominant-baseline="central">
    <text x="173" y="307" textLength="252" lengthAdjust="spacing">ペリシテへの近道</text>
    <text x="437" y="307" textLength="38" lengthAdjust="spacingAndGlyphs">(21</text>
    <text x="491" y="307" textLength="102" lengthAdjust="spacing">日路程)</text>
  </g>

  <!-- 不信 -->
  <rect x="222.5" y="343.5" width="324" height="52" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="243" y="370" textLength="62" lengthAdjust="spacing">不信</text>
    <text x="321" y="370" text-anchor="middle">：</text>
    <text x="339" y="370" textLength="187" lengthAdjust="spacing">出発できない</text>
  </g>
</svg>
