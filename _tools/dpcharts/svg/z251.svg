    <text x="1007.5" y="344" font-size="50" textLength="134" lengthAdjust="spacingAndGlyphs" fill="#111">アダム</text>
  </g>

  <!-- ルーシェルとエバの授受、エバからアダムへ -->
  <polygon points="410,320.5 527,320.5 527,312 552.5,326 527,340 527,331.5 410,331.5"/>
  <polygon points="548,356.5 431.5,356.5 431.5,348 405.5,362 431.5,376 431.5,367.5 548,367.5"/>
  <polygon points="762,338.5 879,338.5 879,330 904.5,344 879,358 879,349.5 762,349.5"/>

  <circle cx="427" cy="474" r="9.5"/>
  <circle cx="426" cy="547" r="9.5"/>
  <g font-size="47">
    <text x="447" y="493" textLength="379" lengthAdjust="spacing">再び神の前に立ち</text>
    <text x="447" y="564" textLength="569" lengthAdjust="spacing">恐怖心から逃れたいと願う</text>
    <text x="491" y="635" textLength="284" lengthAdjust="spacing">アダムを誘惑</text>
  </g>
  <polygon points="434.5,611 462,611 462,599 476.5,617 462,635 462,623 434.5,623" fill="#8C949A"/>
