<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>磐石二打　外的な不信の行動と内的なる不変の心情</title>

  <!-- 枝分かれの線（磐石の楕円の下に描く） -->
  <g stroke="#8C949A" stroke-width="6.6">
    <line x1="198" y1="148.3" x2="257" y2="104"/>
    <line x1="194" y1="188.3" x2="257" y2="255.4"/>
  </g>

  <!-- 磐石 -->
  <ellipse cx="173.8" cy="166.5" rx="48.5" ry="27" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="174" y="166" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="55" lengthAdjust="spacing" fill="#111">磐石</text>
  <text x="144" y="223" font-size="27" dominant-baseline="central" textLength="55" lengthAdjust="spacing">二打</text>

  <!-- 外的な不信の行動・内的なる不変の心情 -->
  <rect x="256" y="64" width="228" height="73" fill="#CF921C" stroke="currentColor" stroke-width="2.6"/>
  <rect x="256" y="199" width="228" height="141" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <g fill="#111">
    <circle cx="274" cy="84" r="5"/>
    <circle cx="273" cy="220" r="5"/>
    <circle cx="274" cy="288.5" r="5"/>
  </g>
  <g font-size="25" dominant-baseline="central" fill="#111">
    <text x="287" y="84" textLength="174" lengthAdjust="spacing">モーセの外的な</text>
    <text x="286" y="118" textLength="124" lengthAdjust="spacing">不信の行動</text>
    <text x="285" y="220" textLength="185" lengthAdjust="spacing">モーセの内的なる</text>
    <text x="285" y="252" textLength="129" lengthAdjust="spacing">不変の心情</text>
    <text x="287" y="288.5" textLength="126" lengthAdjust="spacing">ヨシュアの</text>
    <text x="284" y="317" textLength="50" lengthAdjust="spacing">信仰</text>
    <text x="336" y="317">、</text>
    <text x="364" y="317" textLength="51" lengthAdjust="spacing">忠誠</text>
  </g>

  <!-- 白抜きの矢印 -->
  <g fill="#8C949A" stroke="currentColor" stroke-width="1.2">
    <polygon points="503.5,93 520.5,93 520.5,87.5 532.5,99.5 520.5,111.5 520.5,106 503.5,106"/>
    <polygon points="503.5,258.5 520.5,258.5 520.5,253.5 531.5,265 520.5,276.5 520.5,271.5 503.5,271.5"/>
  </g>

  <!-- 外的：サタンの侵入・内的：水を飲む -->
  <rect x="548" y="65" width="134" height="71.5" fill="#CF921C" stroke="currentColor" stroke-width="2.6"/>
  <rect x="547.8" y="230.7" width="135.7" height="70" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="25" dominant-baseline="central" fill="#111">
    <text x="558" y="87" textLength="50" lengthAdjust="spacing">外的</text>
    <text x="621.5" y="87" text-anchor="middle">：</text>
    <text x="557" y="118" font-size="24" textLength="120" lengthAdjust="spacing">サタンの侵入</text>
    <text x="560" y="250.5" textLength="49" lengthAdjust="spacing">内的</text>
    <text x="623.5" y="250.5" text-anchor="middle">：</text>
    <text x="559" y="282.5" textLength="102" lengthAdjust="spacing">水を飲む</text>
  </g>

  <text x="200" y="377.5" font-size="28" dominant-baseline="central" textLength="370" lengthAdjust="spacing">モーセは霊的にカナンに入る</text>
</svg>
