<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>蕩減条件の程度　①同一のものとしての蕩減条件</title>

  <text x="35" y="35" font-size="31" dominant-baseline="central" textLength="220" lengthAdjust="spacing">蕩減条件の程度</text>
  <line x1="34" y1="54" x2="256" y2="54" stroke="currentColor" stroke-width="2.2"/>
  <text x="53" y="93" font-size="28" text-anchor="middle" dominant-baseline="central">①</text>
  <text x="74" y="93" font-size="28" dominant-baseline="central" textLength="375" lengthAdjust="spacing">同一のものとしての蕩減条件</text>

  <!-- 本然の位置・状態 -->
  <ellipse cx="366.5" cy="166.5" rx="98.5" ry="44.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="365" y="147.5">本然の</text>
    <text x="325" y="181.5">位置<tspan x="365.5">・</tspan><tspan x="406">状態</tspan></text>
  </g>

  <!-- 復帰の矢印 -->
  <polygon points="364.5,213.5 374.5,230.5 368.5,230.5 368.5,311 360.5,311 360.5,230.5 354.5,230.5" fill="#8C949A"/>
  <text x="385" y="261.5" font-size="28" dominant-baseline="central">復帰</text>

  <!-- 同一なる価値 -->
  <ellipse cx="365" cy="354.5" rx="98" ry="42.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="366" y="353.5" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="156" lengthAdjust="spacing">同一なる価値</text>

  <text x="507.5" y="341.5" font-size="28" text-anchor="middle" dominant-baseline="central">報償<tspan x="550.5">・</tspan><tspan x="594">還償</tspan></text>
  <text x="474.5" y="378.5" font-size="22" dominant-baseline="central" textLength="181" lengthAdjust="spacing">(出エ 21:23～25)</text>
</svg>
