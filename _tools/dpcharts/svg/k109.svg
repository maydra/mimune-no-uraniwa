<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>審判期間を40日に定められた理由</title>

  <!-- 題 -->
  <text y="39" font-size="31" dominant-baseline="central"><tspan x="35" textLength="155" lengthAdjust="spacing">審判期間を</tspan><tspan x="200" textLength="31" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="243" textLength="280" lengthAdjust="spacing">日に定められた理由</tspan></text>
  <line x1="35" y1="58.5" x2="523" y2="58.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- アダムからノアまで10代 -->
  <polygon points="250,147 257,147 257,317 262,317 253.5,333 245,317 250,317"/>
  <g fill="none" stroke="currentColor" stroke-width="2.2">
    <path d="M262.5,148 A45,95 0 0 1 298,214"/>
    <path d="M297,274 A45,95 0 0 1 260,335"/>
  </g>
  <ellipse cx="253.5" cy="114.5" rx="40.4" ry="32.4" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="254" y="114.5" font-size="27" text-anchor="middle" dominant-baseline="central">アダム</text>
  <ellipse cx="252.5" cy="370" rx="36.5" ry="32" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="253.5" y="371" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">ノア</text>
  <text y="230" font-size="28" dominant-baseline="central"><tspan x="177" textLength="27" lengthAdjust="spacingAndGlyphs">10</tspan><tspan x="212">代</tspan></text>

  <!-- 理由 -->
  <g font-size="28" dominant-baseline="central">
    <text y="115"><tspan x="320">四位基台×</tspan><tspan x="465" textLength="27" lengthAdjust="spacingAndGlyphs">10</tspan><tspan x="500">数</tspan><tspan x="536">（</tspan><tspan x="549" textLength="87" lengthAdjust="spacing">帰一数</tspan><tspan x="636">）</tspan></text>
    <text y="152"><tspan x="367">（</tspan><tspan x="378" textLength="16" lengthAdjust="spacingAndGlyphs">4</tspan><tspan x="402">数</tspan><tspan x="434">×</tspan><tspan x="464" textLength="27" lengthAdjust="spacingAndGlyphs">10</tspan><tspan x="499">代</tspan><tspan x="528">）</tspan></text>
    <text y="220"><tspan x="310" textLength="29" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="347" textLength="229" lengthAdjust="spacing">数復帰の蕩減期間</tspan></text>
    <text x="296" y="254" font-size="25" textLength="337" lengthAdjust="spacing">（当時淫乱によってサタン侵入）</text>
  </g>

  <!-- 40日洪水審判 -->
  <polygon points="450,286 471,286 471,300 485.5,300 460.5,313 435.5,300 450,300" fill="#8C949A"/>
  <rect x="357" y="330" width="209.5" height="42" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text y="351" font-size="30" dominant-baseline="central" fill="#111"><tspan x="370" textLength="28" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="410">日</tspan><tspan x="436" textLength="114" lengthAdjust="spacing">洪水審判</tspan></text>
  <text y="393.5" font-size="25" dominant-baseline="central"><tspan x="360">（</tspan><tspan x="370" textLength="24" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="403.5" text-anchor="middle">：</tspan><tspan x="415" textLength="141" lengthAdjust="spacing">サタン分立数</tspan><tspan x="557">）</tspan></text>
</svg>
