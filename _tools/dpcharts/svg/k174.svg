<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イサク献祭の結果</title>

  <text x="35" y="38" font-size="30" dominant-baseline="central" textLength="251" lengthAdjust="spacing">イサク献祭の結果</text>
  <line x1="34" y1="57" x2="286" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- 箱 -->
  <g stroke="currentColor" stroke-width="3.4">
    <rect x="252" y="98" width="311" height="41" fill="#fff" class="paper"/>
    <rect x="160" y="181" width="491" height="40" fill="#fff" class="paper"/>
    <rect x="239" y="264" width="218" height="41" fill="#CDF8F7"/>
    <rect x="120" y="350" width="576" height="44" rx="6" fill="#CDF8F7"/>
  </g>
  <g font-size="29" dominant-baseline="central">
    <text x="266" y="118.5" textLength="205" lengthAdjust="spacingAndGlyphs">アブラハムの心情</text>
    <text x="484.5" y="118.5" text-anchor="middle">・</text>
    <text x="499.5" y="118.5" textLength="50" lengthAdjust="spacingAndGlyphs">行動</text>
  </g>
  <g font-size="27" dominant-baseline="central">
    <text x="168" y="201" textLength="314" lengthAdjust="spacingAndGlyphs">イサクを殺したという立場</text>
    <text x="495.5" y="201" text-anchor="middle">：</text>
    <text x="510" y="201" textLength="130" lengthAdjust="spacingAndGlyphs">サタン分離</text>
  </g>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="248" y="285" textLength="143" lengthAdjust="spacingAndGlyphs">イサク献祭</text>
    <text x="406" y="285" text-anchor="middle">：</text>
  </g>
  <g font-size="24" dominant-baseline="central" fill="#111">
    <text x="127" y="372" textLength="390" lengthAdjust="spacingAndGlyphs">アブラハムの家庭を中心とする復帰摂理</text>
    <text x="528" y="372" text-anchor="middle">：</text>
    <text x="540" y="372" textLength="150" lengthAdjust="spacingAndGlyphs">イサクを通じて</text>
  </g>
  <circle cx="432.5" cy="284" r="11.5" fill="none" stroke="#111" stroke-width="3"/>

  <!-- 下向きの矢印 -->
  <g fill="#8C949A">
    <polygon points="401,148 414,148 414,161 424,161 407.5,174 391,161 401,161"/>
    <polygon points="401,230 414,230 414,243 424,243 407.5,256 391,243 401,243"/>
    <polygon points="401,314 414,314 414,327 424,327 407.5,340.5 391,327 401,327"/>
  </g>

  <!-- 今知った（叱責・喜び） -->
  <polyline points="590,265 573,286 590,307" fill="none" stroke="#8C949A" stroke-width="6"/>
  <g dominant-baseline="central">
    <text x="468" y="284.5" font-size="24" textLength="93" lengthAdjust="spacingAndGlyphs">今知った</text>
    <text x="596" y="262" font-size="26" textLength="51" lengthAdjust="spacingAndGlyphs">叱責</text>
    <text x="596" y="311" font-size="26" textLength="52" lengthAdjust="spacingAndGlyphs">喜び</text>
  </g>
</svg>
