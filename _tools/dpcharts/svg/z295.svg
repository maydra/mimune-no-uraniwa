<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>②責任のない自由はない</title>
  <defs>
    <marker id="z295-a" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text y="74" font-size="45"><tspan x="52">②</tspan><tspan x="105" textLength="455" lengthAdjust="spacing">責任のない自由はない</tspan></text>

  <!-- 神と完成した人の間を回る矢印 -->
  <circle cx="420.5" cy="159" r="53" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="419" y="158" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>
  <g stroke="currentColor" stroke-width="6.5" fill="none" marker-end="url(#z295-a)">
    <path d="M362,266 Q341,237.5 361,210"/>
    <path d="M476.5,199 Q495.4,234.2 474.5,257"/>
  </g>
  <text x="519" y="254" font-size="56" textLength="229" lengthAdjust="spacing">創造目的</text>

  <ellipse cx="419.5" cy="316" rx="74.5" ry="52.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="45" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="386.5" y="316">完</text>
    <text x="456.5" y="316">人</text>
  </g>
  <circle cx="420" cy="315.5" r="5.5" fill="#111"/>

  <!-- 成長期間の矢印と線 -->
  <polygon points="420.5,378 458.5,422 438,422 438,549 402,549 402,422 382.5,422" fill="#C4CCD3" stroke="currentColor" stroke-width="4"/>
  <g stroke="currentColor" stroke-width="7">
    <line x1="301" y1="374" x2="539.5" y2="374"/>
    <line x1="301" y1="552.5" x2="539.5" y2="552.5"/>
    <line x1="340" y1="439.5" x2="404" y2="439.5"/>
    <line x1="436" y1="439.5" x2="497.5" y2="439.5"/>
    <line x1="340" y1="499" x2="404" y2="499"/>
    <line x1="436" y1="499" x2="497.5" y2="499"/>
  </g>
  <g stroke="#111" stroke-width="7">
    <line x1="404" y1="439.5" x2="436" y2="439.5"/>
    <line x1="404" y1="499" x2="436" y2="499"/>
  </g>
  <text y="483.5" font-size="52"><tspan x="519" textLength="214" lengthAdjust="spacing">責任分担</tspan><tspan x="743">（</tspan><tspan x="769" textLength="214" lengthAdjust="spacing">自由意志</tspan><tspan x="983">）</tspan></text>

  <ellipse cx="420" cy="609" rx="69" ry="52.5" fill="#FCE5E3" stroke="currentColor" stroke-width="4"/>
  <text x="421" y="609" font-size="49" text-anchor="middle" dominant-baseline="central" fill="#111">人間</text>
</svg>
