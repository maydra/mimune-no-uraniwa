<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス当時（初臨）と今日（再臨）　イエス／再臨主</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="124.5" y="67.5" width="279" height="54" rx="7"/>
    <rect x="410.5" y="67.5" width="279" height="54" rx="7"/>
  </g>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="137" y="95.5" textLength="156" lengthAdjust="spacing">イエス当時</text>
    <text x="299" y="95.5">（初臨）</text>
    <text x="470" y="95.5" textLength="57" lengthAdjust="spacing">今日</text>
    <text x="537" y="95.5">（再臨）</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="124.25" y="130.25" width="275.5" height="235.5" rx="8"/>
    <rect x="411.25" y="130.25" width="275.5" height="235.5" rx="8"/>
  </g>

  <!-- イエス当時 -->
  <g font-size="26" dominant-baseline="central">
    <text x="134" y="158.5">①</text>
    <text x="169" y="158.5" textLength="75" lengthAdjust="spacing">イエス</text>
  </g>
  <g>
    <circle cx="150.5" cy="201" r="5"/>
    <circle cx="150.5" cy="244" r="5"/>
    <circle cx="150" cy="286" r="5"/>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="164" y="201.5" textLength="208" lengthAdjust="spacing">旧約のみ言を成就</text>
    <text x="164" y="244" textLength="207" lengthAdjust="spacingAndGlyphs">新しいみ言をくださる</text>
    <text x="164" y="287" textLength="209" lengthAdjust="spacingAndGlyphs">祭司長、律法学者：</text>
    <text x="165" y="330" textLength="205" lengthAdjust="spacing">イエスを十字架に</text>
  </g>

  <!-- 今日 -->
  <g font-size="26" dominant-baseline="central">
    <text x="418" y="158.5">②</text>
    <text x="452" y="158.5" textLength="77" lengthAdjust="spacing">再臨主</text>
  </g>
  <g>
    <circle cx="429" cy="201" r="5"/>
    <circle cx="429" cy="244" r="5"/>
    <circle cx="430" cy="286" r="5"/>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="441" y="201.5" textLength="228" lengthAdjust="spacingAndGlyphs">新約の霊的救いの土台</text>
    <text x="441" y="244" textLength="230" lengthAdjust="spacingAndGlyphs">新しいみ言をくださる</text>
    <text x="442" y="287.5" textLength="205" lengthAdjust="spacing">キリスト教信徒：</text>
    <text x="448" y="330" textLength="129" lengthAdjust="spacing">再臨主迫害</text>
  </g>
</svg>
