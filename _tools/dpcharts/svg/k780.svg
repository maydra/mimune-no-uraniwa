<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>三次の世界大戦で天の側勝利　創造本然の理想世界実現</title>

  <!-- 上の楕円 -->
  <ellipse cx="411.5" cy="70" rx="248.5" ry="31" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="214" y="70.5" textLength="199" lengthAdjust="spacing">三次の世界大戦</text>
    <text x="460" y="70.5" textLength="139" lengthAdjust="spacing">天の側勝利</text>
  </g>
  <polygon points="426,65 436,65 436,61 447.5,70 436,79 436,74.5 426,74.5" fill="#8C949A"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="404.5,114 415.5,114 415.5,129.5 423.5,129.5 410,145.5 396.5,129.5 404.5,129.5"/>
    <polygon points="402,222 413,222 413,238 420,238 407.5,251.5 395,238 402,238"/>
    <polygon points="400,304 411,304 411,318 419,318 405.5,330.5 392,318 400,318"/>
    <polygon points="298,180.5 317,180.5 317,177 329,184 317,191 317,187.5 298,187.5"/>
    <polygon points="484,180.5 504,180.5 504,177 516,184 504,191 504,187.5 484,187.5"/>
  </g>

  <!-- 中の段 -->
  <g font-size="26" dominant-baseline="central">
    <text x="176" y="185.5" textLength="102" lengthAdjust="spacing">命のみ言</text>
    <text x="359" y="167.5" textLength="102" lengthAdjust="spacing">神の心情</text>
    <text x="359" y="199.5" textLength="49" lengthAdjust="spacing">復帰</text>
    <text x="535" y="185.5" textLength="102" lengthAdjust="spacing">神の血統</text>
  </g>

  <text x="181" y="279.5" font-size="28" dominant-baseline="central" textLength="459" lengthAdjust="spacing">復帰摂理のすべての基台を蕩減復帰</text>

  <!-- 下の箱 -->
  <rect x="204.5" y="348" width="404" height="50.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="235" y="373.5" font-size="30" dominant-baseline="central" textLength="343" lengthAdjust="spacing" fill="#111">創造本然の理想世界実現</text>
</svg>
