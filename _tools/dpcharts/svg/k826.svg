<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>雲＝信仰の篤い信徒・群衆／汚れた水＝堕落した人間</title>

  <!-- 蒸発の矢印 -->
  <polygon points="279,273 284,273 284,153 289,153 281.5,141 274,153 279,153" fill="#8C949A"/>
  <text x="329" y="199" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="55" lengthAdjust="spacing">蒸発</text>

  <!-- 楕円 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <ellipse cx="281.5" cy="96.5" rx="56.5" ry="31.5"/>
    <ellipse cx="282.5" cy="316.5" rx="84.5" ry="42.5"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="164" y="95">天</text>
    <text x="282" y="96.5">雲</text>
    <text x="158.5" y="316.5" textLength="57" lengthAdjust="spacing">地上</text>
    <text x="282.5" y="316.5" textLength="115" lengthAdjust="spacing">汚れた水</text>
  </g>

  <!-- 右の字 -->
  <circle cx="366.5" cy="94.5" r="6"/>
  <circle cx="366.5" cy="136" r="6"/>
  <g font-size="30" dominant-baseline="central">
    <text x="383" y="96.5" textLength="221" lengthAdjust="spacing">信仰の篤い信徒</text>
    <text y="135.5"><tspan x="383" textLength="63" lengthAdjust="spacing">群衆</tspan><tspan x="456" textLength="174" lengthAdjust="spacing">(ヘブル 12:1)</tspan></text>
  </g>
  <text y="317" font-size="26" dominant-baseline="central"><tspan x="383" textLength="157" lengthAdjust="spacing">堕落した人間</tspan><tspan x="548" textLength="120" lengthAdjust="spacing">(黙 17:15)</tspan></text>
</svg>
