<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>霊人の使命協助と輪廻転生した実体</title>

  <text x="472.5" y="77" font-size="45" text-anchor="middle" dominant-baseline="central" textLength="181" lengthAdjust="spacing">使命協助</text>

  <!-- 地上の線（楕円より先に描く） -->
  <line x1="202" y1="318" x2="1097" y2="318" stroke="currentColor" stroke-width="6"/>

  <!-- 霊人と霊人体のあいだの協助の矢印 -->
  <g stroke="currentColor" stroke-width="6" fill="none">
    <line x1="331.5" y1="145.5" x2="431" y2="193.3"/>
    <line x1="447.5" y1="231.5" x2="347.5" y2="183"/>
  </g>
  <g fill="currentColor">
    <polygon points="449,204 435,184.5 426.5,202"/>
    <polygon points="331,175 353,174.5 343.5,191.5"/>
  </g>

  <!-- 霊人・霊人体（桃）と肉身（緑） -->
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="272" cy="153.5" rx="45" ry="77.5" fill="#F98AEE"/>
    <ellipse cx="517.5" cy="223" rx="54" ry="92.5" fill="#F98AEE"/>
    <ellipse cx="517.5" cy="410.5" rx="54" ry="92.5" fill="#A0F08A"/>
  </g>
  <g font-size="47" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="272.5" y="128">霊</text>
    <text x="272.5" y="178.5">人</text>
    <text x="518" y="173">霊</text>
    <text x="518" y="223.5">人</text>
    <text x="518" y="273.5">体</text>
    <text x="517.5" y="385.5">肉</text>
    <text x="517.5" y="435">身</text>
  </g>

  <!-- 霊人体と肉身の授受の矢印 -->
  <g stroke="currentColor" stroke-width="6.5" fill="none">
    <path d="M463.5,342.5 Q444.4,318.5 457.75,298"/>
    <path d="M568.5,283 Q589.4,306 574.75,327.75"/>
  </g>
  <g fill="currentColor">
    <polygon points="468.5,281.5 449.6,292.7 465.9,303.3"/>
    <polygon points="564.5,343 583,333.3 566.5,322.2"/>
  </g>

  <text x="515" y="541" font-size="45" text-anchor="middle" dominant-baseline="central" textLength="136" lengthAdjust="spacing">地上人</text>

  <!-- 肉身から右へ延びる点線（緑の面の中は #111） -->
  <line x1="558" y1="374.5" x2="565" y2="374.5" stroke="#111" stroke-width="7"/>
  <line x1="565" y1="374.5" x2="688" y2="374.5" stroke="currentColor" stroke-width="7" stroke-dasharray="16 7" stroke-dashoffset="7"/>

  <circle cx="712" cy="377" r="12"/>
  <circle cx="712" cy="440" r="12"/>
  <g font-size="45" dominant-baseline="central">
    <text x="734.5" y="376.5" textLength="227" lengthAdjust="spacing">霊人の使命</text>
    <text x="734.5" y="438.5" textLength="272" lengthAdjust="spacing">霊人の再臨者</text>
  </g>

  <polygon points="867,474 879,474 879,505.5 890,505.5 873,534 856,505.5 867,505.5" fill="#8C949A"/>

  <rect x="690" y="541" width="370.5" height="79.5" rx="11" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="875.5" y="581" font-size="41" text-anchor="middle" dominant-baseline="central" textLength="333" lengthAdjust="spacing" fill="#111">輪廻転生した実体</text>
</svg>
