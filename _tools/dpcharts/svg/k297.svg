      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="208.5,38 214.5,38 214.5,72.5 218.5,72.5 211.5,86.5 204.5,72.5 208.5,72.5"/>
    <polygon points="208.5,139 214.5,139 214.5,374.5 218.5,374.5 211.5,387.5 204.5,374.5 208.5,374.5"/>
    <polygon points="475,72.5 491,72.5 491,64.5 508.5,77 491,89.5 491,81 475,81"/>
    <polygon points="475,150.5 491,150.5 491,142.5 508.5,155 491,167.5 491,159.5 475,159.5"/>
  </g>
  <polygon points="448,305 464.5,305 464.5,297 481,309.5 464.5,322 464.5,314.5 448,314.5" fill="#8C949A" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter"/>

  <!-- レピデム -->
  <ellipse cx="211.75" cy="113.75" rx="77.75" ry="24.75" fill="#DCC4C4" stroke="currentColor" stroke-width="2.6"/>
  <text x="213.5" y="114" font-size="31" text-anchor="middle" dominant-baseline="central" textLength="130" lengthAdjust="spacing" fill="#111">レピデム</text>

