<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>エリヤの再臨に関するユダヤ人たちの信仰</title>

  <text x="54" y="56" font-size="47" dominant-baseline="central" textLength="899" lengthAdjust="spacing">エリヤの再臨に関するユダヤ人たちの信仰</text>
  <line x1="52" y1="86.5" x2="954" y2="86.5" stroke="currentColor" stroke-width="3.5"/>

  <!-- 矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="426.9,504 580.7,295.2 591.8,303.3 596,263 558.7,279 569.8,287.2 416.1,496"/>
    <polygon points="715.8,244 873.8,457.9 862.7,466 900,482 895.7,441.7 884.6,449.8 726.6,236"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5" fill="#F86D42">
    <ellipse cx="668" cy="199" rx="122" ry="66"/>
    <ellipse cx="393" cy="546.5" rx="122" ry="66"/>
    <ellipse cx="943" cy="549" rx="122" ry="66"/>
  </g>
  <g font-size="48" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="668" y="199" textLength="144" lengthAdjust="spacing">エリヤ</text>
    <text x="393" y="546.5" textLength="144" lengthAdjust="spacing">エリヤ</text>
    <text x="943" y="549" textLength="144" lengthAdjust="spacing">エリヤ</text>
  </g>

  <g dominant-baseline="central">
    <text x="203" y="316.5" font-size="43" textLength="60" lengthAdjust="spacingAndGlyphs">900</text>
    <text x="274" y="316.5" font-size="44" textLength="246" lengthAdjust="spacingAndGlyphs">余年前に昇天</text>
    <text x="243" y="367" font-size="36" textLength="223" lengthAdjust="spacingAndGlyphs">(列王下 2:11)</text>
    <text x="846" y="309" font-size="42" textLength="243" lengthAdjust="spacingAndGlyphs">再び来るとき</text>
    <text x="849" y="363.5" font-size="42" textLength="198" lengthAdjust="spacingAndGlyphs">にも天から</text>
  </g>
</svg>
