<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>作品から作者の性稟を、被造万物の観察から神の神性を知る</title>

  <!-- 上向きの矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="393,254.5 412,291 400.5,291 400.5,442 385.5,442 385.5,291 374,291"/>
    <polygon points="897.5,257 915.5,293 904.5,293 904.5,442 889.5,442 889.5,293 879.5,293"/>
    <!-- 間の太い矢印 -->
    <polygon points="586,319.5 644.5,319.5 644.5,296.5 696.5,346.5 644.5,396.5 644.5,372.5 586,372.5"/>
  </g>

  <g stroke="currentColor" stroke-width="3.5">
    <ellipse cx="393.1" cy="167.4" rx="163.1" ry="82.5" fill="#fff" class="paper"/>
    <ellipse cx="894.2" cy="167.4" rx="163.1" ry="82.5" fill="#fff" class="paper"/>
    <ellipse cx="393.6" cy="524.1" rx="163.1" ry="82.4" fill="#DCC4C4"/>
    <ellipse cx="896.9" cy="524.4" rx="167.8" ry="82.5" fill="#DCC4C4"/>
  </g>

  <g font-size="56" text-anchor="middle" dominant-baseline="central">
    <text x="393" y="167">作者の性稟</text>
    <text x="894" y="166.5">神の神性</text>
    <g fill="#111">
      <text x="392.5" y="523" textLength="143" lengthAdjust="spacing">作 品</text>
      <text x="896" y="523.5">被造万物</text>
    </g>
    <text x="1005" y="389">観察</text>
  </g>
</svg>
