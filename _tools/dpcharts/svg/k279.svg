<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>十災禍の奇跡を行われた理由</title>

  <!-- 題 -->
  <text x="35" y="37" font-size="30" dominant-baseline="central" textLength="405" lengthAdjust="spacing">十災禍の奇跡を行われた理由</text>
  <line x1="33" y1="55.5" x2="443" y2="55.5" stroke="currentColor" stroke-width="2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="176.2,139 176.2,204 171.5,204 179,218 186.5,204 181.8,204 181.8,139"/>
    <polygon points="507.2,139 507.2,204 502.5,204 510,218 517.5,204 512.8,204 512.8,139"/>
    <polygon points="226,249.8 259.5,249.8 259.5,254 271.5,247 259.5,240 259.5,244.2 226,244.2"/>
    <polygon points="559,249.8 579.5,249.8 579.5,254 591.5,247 579.5,240 579.5,244.2 559,244.2"/>
  </g>

  <!-- 神 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <circle cx="179" cy="109.5" r="28"/>
    <circle cx="510" cy="109.5" r="28"/>
  </g>
  <g font-size="32" text-anchor="middle" dominant-baseline="central">
    <text x="178" y="110">神</text>
    <text x="509" y="111">神</text>
  </g>
  <text x="220" y="108" font-size="23" dominant-baseline="central" textLength="208" lengthAdjust="spacing">(出エ 7:10 ～ 12:36)</text>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="179.5" cy="246" rx="46.7" ry="24.2" fill="#F8F28F"/>
    <ellipse cx="335" cy="246.5" rx="58.2" ry="33.7" fill="#F86D42"/>
    <ellipse cx="510" cy="246.5" rx="48.7" ry="25.7" fill="#F8F28F"/>
    <ellipse cx="644" cy="246.5" rx="48.7" ry="25.7" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="178" y="247" font-size="24" textLength="66" lengthAdjust="spacing">モーセ</text>
    <text x="335.5" y="235.5" font-size="23" textLength="91" lengthAdjust="spacing">イスラエル</text>
    <text x="336.5" y="262" font-size="22" textLength="43" lengthAdjust="spacing">民族</text>
    <text x="510" y="247.5" font-size="24" textLength="66" lengthAdjust="spacing">イエス</text>
    <text x="645" y="248" font-size="24" textLength="56" lengthAdjust="spacing">選民</text>
  </g>

  <!-- ⇒ -->
  <polygon points="413,233.5 426.5,233.5 426.5,221.5 441,245.5 426.5,269.5 426.5,258.5 413,258.5" fill="#8C949A" stroke="currentColor" stroke-width="1.2" stroke-linejoin="miter"/>

  <!-- 添え書き -->
  <g font-size="22" dominant-baseline="central">
    <text x="194" y="177" textLength="122" lengthAdjust="spacing">エジプトから</text>
    <text x="194" y="201.5" textLength="123" lengthAdjust="spacing">救いだされた</text>
    <text x="536" y="209" textLength="80" lengthAdjust="spacing">救われる</text>
  </g>
  <g font-size="24" dominant-baseline="central">
    <text x="118" y="290.5" textLength="140" lengthAdjust="spacing">十災禍の奇跡</text>
    <text x="485" y="291.5" textLength="44" lengthAdjust="spacing">奇跡</text>
  </g>

  <!-- 箇条 -->
  <circle cx="149.5" cy="348.5" r="6"/>
  <circle cx="149.5" cy="389.5" r="6"/>
  <g font-size="27" dominant-baseline="central">
    <text x="164" y="349" textLength="128" lengthAdjust="spacing">ヤコブ路程</text>
    <text x="306.5" y="349" text-anchor="middle">：</text>
    <text x="323" y="349" textLength="200" lengthAdjust="spacing">ラバンが十回欺く</text>
    <text x="164" y="388.5" textLength="128" lengthAdjust="spacing">モーセ路程</text>
    <text x="306.5" y="388.5" text-anchor="middle">：</text>
    <text x="321" y="388.5" textLength="175" lengthAdjust="spacing">パロが十回欺く</text>
  </g>
</svg>
