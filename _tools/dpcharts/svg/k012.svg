<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アダム家庭（中間位置）　供え物＝復帰摂理をなし得る立場／カインがアベル殺害＝サタン侵入</title>

  <!-- 神・サへの矢印 -->
  <g fill="#8C949A">
    <polygon points="328,121 345.4,136.1 338.4,138.6 385.8,274.7 378.2,277.3 330.8,141.2 323.7,143.7"/>
    <polygon points="499,121 503.2,143.7 496.1,141.2 447.8,277.3 440.2,274.7 488.5,138.5 481.5,136"/>
  </g>

  <!-- 神・サ -->
  <circle cx="319" cy="80" r="36" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <circle cx="509" cy="80" r="36" fill="#50403D" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="36" text-anchor="middle" dominant-baseline="central">
    <text x="319" y="81">神</text>
    <text x="509" y="81" fill="#fff">サ</text>
  </g>

  <!-- アダム家庭 -->
  <ellipse cx="416" cy="310.5" rx="100" ry="39.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <text x="417" y="312" font-size="31" text-anchor="middle" dominant-baseline="central" textLength="156" lengthAdjust="spacing" fill="#111">アダム家庭</text>

  <!-- 左の字 -->
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="219" y="200" textLength="76" lengthAdjust="spacing">供え物</text>
    <text x="216.5" y="276" textLength="127" lengthAdjust="spacing">復帰摂理を</text>
    <text x="217.5" y="308" textLength="155" lengthAdjust="spacing">なし得る立場</text>
    <text x="591.7" y="206.5" textLength="220" lengthAdjust="spacing">カインがアベル殺害</text>
    <text x="593.3" y="282" textLength="127" lengthAdjust="spacing">サタン侵入</text>
  </g>

  <!-- 縦の等号 -->
  <g stroke="currentColor" stroke-width="4">
    <line x1="212" y1="226" x2="212" y2="251"/>
    <line x1="223.5" y1="226" x2="223.5" y2="251"/>
    <line x1="585" y1="231.5" x2="585" y2="257"/>
    <line x1="596.5" y1="231.5" x2="596.5" y2="257"/>
  </g>

  <text x="420" y="381" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="122" lengthAdjust="spacing">中間位置</text>
</svg>
