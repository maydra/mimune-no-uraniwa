<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イサク献祭のための信仰：アダムの家庭を復帰する象徴的な蕩減条件</title>

  <text x="35" y="35.5" font-size="30" dominant-baseline="central" textLength="345" lengthAdjust="spacing">イサク献祭のための信仰</text>
  <line x1="34" y1="55" x2="381" y2="55" stroke="currentColor" stroke-width="3"/>
  <g font-size="25" dominant-baseline="central">
    <text x="154.5" y="81" text-anchor="middle">：</text>
    <text x="169" y="81" textLength="498" lengthAdjust="spacing">アダムの家庭を復帰する象徴的な蕩減条件</text>
  </g>

  <!-- アブラハムからアダム家庭へ -->
  <polygon points="186.5,180.5 194.5,193 189.8,193 189.8,231 183.2,231 183.2,193 178.5,193" fill="#8C949A"/>

  <!-- 黒い矢印 -->
  <g fill="currentColor">
    <path d="M255,248 H357 V243.5 L367.5,250.2 L357,256.5 V252.5 H255 Z"/>
    <path d="M365,262.5 H263 V259.5 L253,265 L263,270.5 V267.5 H365 Z"/>
    <path d="M460,248 H551 V243.5 L561.5,250.2 L551,256.5 V252.5 H460 Z"/>
    <path d="M559,262.5 H467 V259.5 L457,265 L467,270.5 V267.5 H559 Z"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="186" cy="145.8" rx="62.8" ry="26.6" fill="#fff" class="paper"/>
    <ellipse cx="186" cy="257.5" rx="62.8" ry="27" fill="#F98AEE"/>
    <ellipse cx="412.5" cy="257" rx="39.5" ry="22" fill="#A0F08A"/>
    <ellipse cx="630" cy="257.5" rx="62.8" ry="27" fill="#CF921C"/>
    <!-- 元の図で奴隷は薄い桃、財物は灰桃 -->
    <ellipse cx="412.5" cy="313.5" rx="39.5" ry="22" fill="#FCE5E3"/>
    <ellipse cx="411.5" cy="366" rx="39.5" ry="22" fill="#DCC4C4"/>
  </g>
  <g font-size="23.5" text-anchor="middle" dominant-baseline="central">
    <text x="186.5" y="145.5" textLength="104" lengthAdjust="spacing">アダム家庭</text>
  </g>
  <g font-size="23.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="186.5" y="256.5" textLength="104" lengthAdjust="spacing">アブラハム</text>
    <text x="412" y="257" font-size="24" textLength="50" lengthAdjust="spacing">サラ</text>
    <text x="630.5" y="257" textLength="108" lengthAdjust="spacing">アビメレク</text>
    <text x="411.5" y="312.5" font-size="24">奴隷</text>
    <text x="411.5" y="366" font-size="24">財物</text>
  </g>

  <g font-size="22" dominant-baseline="central">
    <text x="248.5" y="224.5" textLength="117" lengthAdjust="spacing">兄妹の立場</text>
    <text x="261" y="287.5" textLength="93" lengthAdjust="spacing">妻の立場</text>
    <text x="460.5" y="224.5" textLength="92" lengthAdjust="spacing">奪われる</text>
    <text x="470" y="286" textLength="93" lengthAdjust="spacing">取り戻す</text>
    <text x="583" y="303.5" textLength="93" lengthAdjust="spacing">ゲラル王</text>
  </g>

  <!-- 奴隷・財物の括弧と聖句 -->
  <path d="M456,290.5 Q463.5,291 463.5,302 L463.5,328 Q464,337 472,338.5 Q464,340 463.5,349 L463,375 Q463,386 457,387" fill="none" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="22" dominant-baseline="central">
    <text x="481" y="339.5" textLength="32" lengthAdjust="spacing">（創</text>
    <text x="520" y="339.5" textLength="45" lengthAdjust="spacingAndGlyphs">20:1</text>
    <text x="582" y="339.5" text-anchor="middle">～</text>
    <text x="597" y="339.5" textLength="23" lengthAdjust="spacingAndGlyphs">16</text>
    <text x="619" y="339.5">）</text>
  </g>
</svg>
