<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>堕落による死＝善悪の果を取って食べる　「汝之を食ふ日には必ず死べければなり」（創 2:17）→ 肉身生活継続、子孫繁殖</title>

  <rect x="205.5" y="157.5" width="880" height="93" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="233" y="204" font-size="45" dominant-baseline="central" fill="#111" textLength="832" lengthAdjust="spacing">堕落による死＝善悪の果を取って食べる</text>

  <!-- 創 2:17 -->
  <g font-size="22" dominant-baseline="central">
    <text x="221" y="312.5" textLength="113" lengthAdjust="spacing">なんじこれ</text>
    <text x="386" y="312.5" textLength="42" lengthAdjust="spacing">くら</text>
    <text x="716" y="312.5" textLength="45" lengthAdjust="spacing">しぬ</text>
  </g>
  <text y="346.5" font-size="46" dominant-baseline="central"><tspan x="240" text-anchor="end">「</tspan><tspan x="241" textLength="795" lengthAdjust="spacing">汝之を食ふ日には必ず死べければなり</tspan><tspan x="1042">」</tspan></text>
  <text y="399.5" font-size="40" dominant-baseline="central"><tspan x="886" textLength="56" lengthAdjust="spacingAndGlyphs">(創</tspan> <tspan x="954" textLength="99" lengthAdjust="spacingAndGlyphs">2:17)</tspan></text>

  <polygon points="641.75,393 656.75,393 656.75,439.5 667,439.5 649.25,470.5 631.5,439.5 641.75,439.5" fill="#8C949A"/>

  <text y="527" font-size="48" dominant-baseline="central"><tspan x="386" textLength="297" lengthAdjust="spacing">肉身生活継続</tspan><tspan x="684">、</tspan><tspan x="719" textLength="198" lengthAdjust="spacing">子孫繁殖</tspan></text>
</svg>
