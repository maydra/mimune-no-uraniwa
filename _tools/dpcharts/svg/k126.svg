<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ノアを裸にしてハムを試練なさった理由</title>

  <!-- 題 -->
  <text x="41" y="38" font-size="28" textLength="505" lengthAdjust="spacing" dominant-baseline="central">ノアを裸にしてハムを試練なさった理由</text>
  <line x1="37" y1="56.5" x2="548" y2="56.5" stroke="currentColor" stroke-width="2.5"/>

  <!-- 点 -->
  <circle cx="143" cy="152" r="7.3"/>
  <circle cx="143.5" cy="274.5" r="7.3"/>

  <g font-size="27" dominant-baseline="central">
    <text x="157" y="152" textLength="528" lengthAdjust="spacingAndGlyphs">審判 40 日で箱舟（天宙）を立てた直後の事実</text>
    <text x="183" y="196" textLength="347" lengthAdjust="spacingAndGlyphs" font-weight="400">＝ 天地創造後に生ずる事実</text>
    <text x="157" y="275" textLength="324" lengthAdjust="spacingAndGlyphs">40 日審判後のノアの立場</text>
    <text x="183" y="320" textLength="380" lengthAdjust="spacingAndGlyphs" font-weight="400">＝ 天地創造後のアダムの立場</text>
  </g>
</svg>
