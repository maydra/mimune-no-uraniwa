<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>統一のための戦いの二つの道</title>

  <!-- 題 -->
  <text x="35" y="36.5" font-size="29" dominant-baseline="central" textLength="408" lengthAdjust="spacing">統一のための戦いの二つの道</text>
  <line x1="33" y1="55" x2="443" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 二つの道 -->
  <g font-size="27" dominant-baseline="central">
    <text x="145" y="92" text-anchor="middle">①</text>
    <text x="167" y="92" textLength="258" lengthAdjust="spacing">武器でサタン側屈服</text>
    <text x="145.5" y="237.5" text-anchor="middle">②</text>
    <text x="167" y="237.5" textLength="257" lengthAdjust="spacing">理念による内的戦い</text>
  </g>

  <!-- 矢印 -->
  <g>
    <polygon points="160,134.8 177,134.8 176,130 185.5,136.5 176,143 177,138.2 160,138.2"/>
    <polygon points="160,177.3 177,177.3 176,173 185.5,179 176,185.5 177,180.7 160,180.7"/>
    <polygon points="158,281.8 177,281.8 176,277 185.5,283.5 176,290 177,285.2 158,285.2"/>
    <polygon points="158,323.8 177,323.8 176,319 185.5,325.5 176,332 177,327.2 158,327.2"/>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text x="198" y="136" textLength="491" lengthAdjust="spacing">再び内的にも屈伏させて喜ばねばならない</text>
    <text x="198" y="179" textLength="459" lengthAdjust="spacing">完全無欠な理念がなくてはならない</text>
    <text x="198" y="283" textLength="142" lengthAdjust="spacing">理性で屈伏</text>
    <text x="198" y="326" textLength="286" lengthAdjust="spacing">完全な一つの世界可能</text>
  </g>

  <!-- 水色の箱 -->
  <rect x="138.5" y="357.5" width="547.5" height="57.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="154" y="385.5" font-size="30" dominant-baseline="central" textLength="517" lengthAdjust="spacing" fill="#111">人間責任分担遂行いかんによって決定</text>
</svg>
