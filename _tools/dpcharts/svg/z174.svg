<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>人間に対する神の直接主管とは？</title>
  <defs>
    <marker id="z174-g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <text x="53" y="57" font-size="48" dominant-baseline="central" textLength="748" lengthAdjust="spacing">人間に対する神の直接主管とは？</text>
  <line x1="52" y1="87" x2="801" y2="87" stroke="currentColor" stroke-width="3.5"/>

  <!-- 四位の線（円の下に描く） -->
  <g stroke="currentColor" stroke-width="9">
    <line x1="428" y1="166.5" x2="262.5" y2="332"/>
    <line x1="428" y1="166.5" x2="593.5" y2="327.5"/>
    <line x1="262.5" y1="332" x2="426" y2="492.5"/>
    <line x1="593.5" y1="327.5" x2="426" y2="492.5"/>
  </g>

  <!-- 授受作用の矢印 -->
  <g stroke="#8C949A" stroke-width="9.5" fill="none" marker-end="url(#z174-g)">
    <path d="M412,434 Q373,307.5 408,235.5"/>
    <path d="M447,226 Q487,337.5 451,423.5"/>
    <path d="M349,311.5 Q433,278.5 509,305.5"/>
    <path d="M516,338 Q430,372.5 353,344.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4">
    <circle cx="431.5" cy="161.5" r="52.5" fill="#fff" class="paper"/>
    <circle cx="277" cy="322" r="51" fill="#F98AEE"/>
    <circle cx="591" cy="321.5" r="52.5" fill="#A0F08A"/>
    <ellipse cx="428.5" cy="495" rx="56.5" ry="50" fill="#DCC4C4"/>
  </g>
  <g font-size="54" text-anchor="middle" dominant-baseline="central">
    <text x="429" y="160.5">神</text>
    <text x="278" y="322" fill="#111">ア</text>
    <text x="591" y="321" fill="#111">エ</text>
    <text x="428.5" y="494.5" fill="#111">合</text>
  </g>

  <!-- 直接主管の中身 -->
  <g>
    <circle cx="694.5" cy="255" r="8"/>
    <circle cx="694.5" cy="366.5" r="8"/>
    <circle cx="694.5" cy="481.5" r="8"/>
  </g>
  <g font-size="47" dominant-baseline="central">
    <text x="720" y="254">神と心情一体</text>
    <text x="720" y="366">愛と美</text>
    <text x="720" y="478.5">善の生活</text>
  </g>

  <rect x="237" y="570" width="383" height="80" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="429.5" y="610.5" font-size="46" text-anchor="middle" dominant-baseline="central" textLength="333" lengthAdjust="spacing" fill="#111">家庭的四位基台</text>
</svg>
