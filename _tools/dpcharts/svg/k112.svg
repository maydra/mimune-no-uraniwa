<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>カラスと鳩を通した摂理</title>

  <!-- 題 -->
  <text x="36" y="38" font-size="30" textLength="345" lengthAdjust="spacing" dominant-baseline="central">カラスと鳩を通した摂理</text>
  <line x1="35" y1="57.5" x2="381" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <circle cx="148" cy="126" r="7.5"/>
  <circle cx="148" cy="311" r="7.5"/>
  <g font-size="28" dominant-baseline="central">
    <text y="127"><tspan x="163">洪水後、</tspan><tspan x="279" textLength="258" lengthAdjust="spacing">カラスと鳩を放った</tspan></text>
    <text x="157" y="164" font-size="23" font-weight="400" textLength="335" lengthAdjust="spacing">（アモス 3:7 預言者に示される）</text>
    <text x="146.5" y="220.5" text-anchor="middle">：</text>
    <text x="163" y="220.5" textLength="461" lengthAdjust="spacing">神の天地創造後の全歴史路程を象徴</text>
    <text x="163" y="310" textLength="231" lengthAdjust="spacing">からすが飛びまわる</text>
    <text x="408.5" y="310" text-anchor="middle">：</text>
    <text x="422" y="310" textLength="233" lengthAdjust="spacing">サタンがノア家庭に</text>
    <text x="422" y="349.5" textLength="258" lengthAdjust="spacing">侵入する条件をねらう</text>
  </g>
</svg>
