<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>④ ルカ 17:20</title>

  <!-- ④ ルカ 17:20 -->
  <g font-size="26" dominant-baseline="central">
    <text x="34" y="38">④</text>
    <text x="73" y="38" textLength="54" lengthAdjust="spacing">ルカ</text>
    <text x="139" y="38" textLength="70" lengthAdjust="spacing">17:20</text>
  </g>

  <!-- 聖句 -->
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="167" y="140.5" textLength="377" lengthAdjust="spacing">『神の国は、見られるかたち</text>
    <text x="179" y="180.5" textLength="274" lengthAdjust="spacing">で来るものではない』</text>
  </g>

  <!-- 地上誕生 -->
  <ellipse cx="225.5" cy="292.5" rx="86.5" ry="31.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="225.5" y="293" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="124" lengthAdjust="spacing">地上誕生</text>

  <g font-size="26" dominant-baseline="central">
    <text x="327" y="268" textLength="348" lengthAdjust="spacing">再臨主を信ずることができず、</text>
    <text x="327" y="312.5" textLength="336" lengthAdjust="spacing">神の国を見ることができない</text>
  </g>
</svg>
