<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>幕屋　メシヤの象徴的な降臨と民族的実体基台</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="232.5,99.5 239.5,112.5 235.5,112.5 235.5,152 229.5,152 229.5,112.5 225.5,112.5"/>
    <polygon points="232.5,212.5 239.5,225.5 235.5,225.5 235.5,261.5 229.5,261.5 229.5,225.5 225.5,225.5"/>
    <polygon points="287.5,285.5 300.5,278.5 300.5,282.5 534,282.5 534,288.5 300.5,288.5 300.5,293.5"/>
  </g>

  <!-- 神・幕屋 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <circle cx="232" cy="64.5" r="32.5"/>
    <ellipse cx="232.5" cy="180.5" rx="53.5" ry="28.5"/>
  </g>
  <text x="231.5" y="64" font-size="36" text-anchor="middle" dominant-baseline="central">神</text>
  <text y="182" font-size="27" text-anchor="middle" dominant-baseline="central"><tspan x="210.5">幕</tspan><tspan x="254">屋</tspan></text>

  <g font-size="28" dominant-baseline="central">
    <text x="307" y="157.5" textLength="114" lengthAdjust="spacing">メシヤの</text>
    <text x="306" y="194" textLength="173" lengthAdjust="spacing">象徴的な降臨</text>
  </g>

  <!-- 民族的実体基台 -->
  <rect x="316.5" y="229" width="207" height="43" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="418" y="250.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="182" lengthAdjust="spacing">民族的実体基台</text>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="232" cy="285.75" rx="51" ry="24.25" fill="#F8F28F"/>
    <ellipse cx="603.75" cy="286" rx="69.25" ry="36" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="232.5" y="286" font-size="30" textLength="90" lengthAdjust="spacing">モーセ</text>
    <text x="604.5" y="270.5" font-size="26" textLength="118" lengthAdjust="spacing">イスラエル</text>
    <text y="304" font-size="25"><tspan x="585">民</tspan><tspan x="620.5">族</tspan></text>
  </g>

  <!-- 添え書き -->
  <circle cx="168" cy="343.5" r="6.5"/>
  <text x="181" y="342.5" font-size="28" dominant-baseline="central" textLength="142" lengthAdjust="spacing">幕屋を守る</text>
  <text x="150" y="379" font-size="26" dominant-baseline="central" textLength="307" lengthAdjust="spacing">（民族の中のある一人でも）</text>
</svg>
