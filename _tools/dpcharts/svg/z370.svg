<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>④本性の愛復帰</title>

  <text x="53" y="58.5" font-size="48" dominant-baseline="central" textLength="355" lengthAdjust="spacing">④本性の愛復帰</text>

  <!-- 2つの箱と、上にかかる楕円の札 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="207.5" y="197.5" width="428" height="280.5" fill="#fff" class="paper"/>
    <rect x="667.5" y="197.5" width="428" height="280.5" fill="#fff" class="paper"/>
    <ellipse cx="421.5" cy="197.5" rx="113.5" ry="63" fill="#DCC4C4"/>
    <ellipse cx="881.5" cy="191" rx="89" ry="44" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="42">
      <text x="421.5" y="172">完成した</text>
      <text x="421.5" y="223">世界</text>
    </g>
    <text x="881.5" y="191" font-size="56">現世</text>
  </g>

  <circle cx="703" cy="315" r="11"/>
  <circle cx="703" cy="384.5" r="11"/>
  <g font-size="41" dominant-baseline="central">
    <text x="231" y="316" textLength="289" lengthAdjust="spacing">神の愛によって</text>
    <text x="231" y="385.5" textLength="375" lengthAdjust="spacing">縦横に結ばれた世界</text>
    <text x="722" y="316" textLength="333" lengthAdjust="spacing">博愛主義思想高潮</text>
    <text x="722" y="385.5" textLength="331" lengthAdjust="spacing">本性愛探し求める</text>
  </g>

  <text x="649" y="573.5" font-size="66" text-anchor="middle" dominant-baseline="central" textLength="358" lengthAdjust="spacing">現代 = 終末</text>
</svg>
