<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑧ サタンを完全に滅ぼす</title>
  <text x="48" y="37" font-size="29" text-anchor="middle" dominant-baseline="central">⑧</text>
  <text x="72" y="37" font-size="29" dominant-baseline="central" textLength="290" lengthAdjust="spacing">サタンを完全に滅ぼす</text>
  <line x1="72" y1="55" x2="362" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦の矢印（楕円の下に描く） -->
  <polygon points="213.5,156 219.5,156 219.5,195 224,195 216.5,207 209,195 213.5,195" fill="#8C949A"/>
  <polygon points="213.5,261 219.5,261 219.5,301 224,301 216.5,313 209,301 213.5,301" fill="#8C949A"/>

  <!-- ヤコブ → モーセ → イエス -->
  <ellipse cx="216.5" cy="134" rx="48.5" ry="25" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="215.5" y="134.5" font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="79" lengthAdjust="spacingAndGlyphs">ヤコブ</text>
  <ellipse cx="216.5" cy="239.5" rx="48.5" ry="24.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="216" y="239" font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="81" lengthAdjust="spacingAndGlyphs">モーセ</text>
  <ellipse cx="216.5" cy="346" rx="53.5" ry="26" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="215" y="344.5" font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="86" lengthAdjust="spacingAndGlyphs">イエス</text>

  <!-- 説明 -->
  <text x="285" y="131.5" font-size="28" dominant-baseline="central" textLength="172" lengthAdjust="spacing">偶像を埋める</text>
  <text x="285" y="238.5" font-size="28" dominant-baseline="central" textLength="283" lengthAdjust="spacing">金の子牛の偶像を砕く</text>
  <text x="286" y="346" font-size="28" dominant-baseline="central" textLength="202" lengthAdjust="spacing">罪悪世界を壊滅</text>
</svg>
