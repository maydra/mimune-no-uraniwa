<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>4. 地上人間たちが引きあげられ空中で主に会う</title>

  <text x="54.5" y="60" font-size="46" dominant-baseline="central">4.</text>
  <text x="112" y="59" font-size="50" dominant-baseline="central" textLength="1003" lengthAdjust="spacing">地上人間たちが引きあげられ空中で主に会う</text>
  <line x1="112" y1="89.5" x2="1115" y2="89.5" stroke="currentColor" stroke-width="4"/>
  <text y="133" font-size="39" dominant-baseline="central"><tspan x="741.5" textLength="231.5" lengthAdjust="spacingAndGlyphs">【テサロニケⅠ </tspan><tspan x="973" textLength="87" lengthAdjust="spacingAndGlyphs">4:17】</tspan></text>

  <!-- 天・地 -->
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="357.5" cy="226" rx="59.5" ry="38" fill="#fff" class="paper"/>
    <ellipse cx="357.5" cy="343.5" rx="59.5" ry="38.5" fill="#CF921C"/>
    <line x1="431" y1="227.5" x2="530" y2="227.5"/>
    <line x1="433" y1="342.5" x2="531" y2="342.5"/>
  </g>
  <g font-size="46" text-anchor="middle" dominant-baseline="central">
    <text x="356" y="227.5">天</text>
    <text x="357" y="344.5" fill="#111">地</text>
  </g>
  <g font-size="45" dominant-baseline="central">
    <text x="551" y="229" textLength="410" lengthAdjust="spacing">罪なき善主権の世界</text>
    <text x="550" y="344" textLength="456" lengthAdjust="spacing">堕落した悪主権の世界</text>
  </g>

  <!-- 結論 -->
  <rect x="252.75" y="438" width="785" height="145" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="45" dominant-baseline="central" fill="#111">
    <text y="480"><tspan x="281.5" textLength="315" lengthAdjust="spacing">空中で主に会う</tspan><tspan x="612.75">：</tspan></text>
    <text x="281.5" y="542.5" textLength="727" lengthAdjust="spacing">善主権の世界で信徒たちが主と会う</text>
  </g>
</svg>
