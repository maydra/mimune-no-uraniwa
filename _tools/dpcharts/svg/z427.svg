<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>十字架は神の予定ではなく、ユダヤ人たちの無知と不信による（コリントⅠ 2:8）</title>

  <!-- 十字架（型を 2.14 倍） -->
  <g transform="translate(194.0,80.0) scale(1.7400,1.8944)" stroke-width="1.651" fill="#7A5230" stroke="#111" stroke-linejoin="round">
    <path d="M40,0 H60 V42 H100 V60 H60 V180 H40 V60 H0 V42 H40 Z"/>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="539.5,184 539.5,196.5 420.5,196.5 420.5,207.5 391.5,190.25 420.5,173 420.5,184"/>
    <polygon points="539.5,297.25 539.5,309.75 420.5,309.75 420.5,320.5 391.5,303.5 420.5,286.5 420.5,297.25"/>
  </g>
  <g stroke="currentColor" stroke-width="10">
    <line x1="450.5" y1="167.5" x2="499.5" y2="216.5"/>
    <line x1="499.5" y1="167.5" x2="450.5" y2="216.5"/>
  </g>

  <g dominant-baseline="central">
    <text x="550" y="190" font-size="50">神の予定</text>
    <text y="302" font-size="49"><tspan x="553" textLength="401" lengthAdjust="spacingAndGlyphs">ユダヤ人たちの無知</tspan><tspan x="955.6">、</tspan><tspan x="1000" textLength="92" lengthAdjust="spacingAndGlyphs">不信</tspan></text>
    <text y="412.5" font-size="40"><tspan x="342" textLength="158" lengthAdjust="spacingAndGlyphs">コリント</tspan><tspan x="525.5" text-anchor="middle">Ⅰ</tspan> <tspan x="557" textLength="63" lengthAdjust="spacingAndGlyphs">2:8</tspan></text>
  </g>

  <!-- 聖句（細字。1字 35 の等幅に合わせる。1行目だけ字の間が広い） -->
  <g font-size="35" font-weight="400" dominant-baseline="central">
    <text y="480.5"><tspan x="248">『</tspan><tspan x="260.5" textLength="464.75" lengthAdjust="spacing">この世の支配者たちのうちで</tspan><tspan x="725.25">、</tspan><tspan x="761" textLength="321.75" lengthAdjust="spacing">この知恵を知ってい</tspan></text>
    <text y="539"><tspan x="260.5" textLength="105" lengthAdjust="spacing">た者は</tspan><tspan x="365.5">、</tspan><tspan x="400.5" textLength="315" lengthAdjust="spacing">ひとりもいなかった</tspan><tspan x="715.5">。</tspan><tspan x="750.5" textLength="315" lengthAdjust="spacing">もし知っていたなら</tspan><tspan x="1065.5">、</tspan></text>
    <text y="598"><tspan x="260.5" textLength="735" lengthAdjust="spacing">栄光の主を十字架につけはしなかったであろう</tspan><tspan x="991.5">』</tspan></text>
  </g>
  <line x1="261" y1="624.2" x2="993" y2="624.2" stroke="currentColor" stroke-width="2.5"/>
</svg>
