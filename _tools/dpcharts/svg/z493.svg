<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>生命と死亡　復活（ヨハネ 5:24）</title>

  <g font-size="46" text-anchor="middle" dominant-baseline="central">
    <text x="393" y="83.5">生命</text>
    <text x="895" y="81.5">死亡</text>
  </g>

  <!-- 神とイエス・サタンと堕落人間の授受（右は×で断たれている） -->
  <g fill="currentColor" stroke="currentColor">
    <g>
      <path d="M374.5,286.5 Q360.5,264 372,246.5" fill="none" stroke-width="6.5"/>
      <polygon points="379.5,230.5 362.5,243.5 380.5,249.5" stroke="none"/>
      <path d="M398.5,232 Q412.5,254.5 401,272" fill="none" stroke-width="6.5"/>
      <polygon points="393.5,288 410.5,275 392.5,269" stroke="none"/>
    </g>
    <g transform="translate(506.5,0)">
      <path d="M374.5,286.5 Q360.5,264 372,246.5" fill="none" stroke-width="6.5"/>
      <polygon points="379.5,230.5 362.5,243.5 380.5,249.5" stroke="none"/>
      <path d="M398.5,232 Q412.5,254.5 401,272" fill="none" stroke-width="6.5"/>
      <polygon points="393.5,288 410.5,275 392.5,269" stroke="none"/>
    </g>
    <g stroke-width="5.5">
      <line x1="863" y1="242.5" x2="923" y2="274.5"/>
      <line x1="923" y1="242.5" x2="863" y2="274.5"/>
    </g>
  </g>

  <!-- 復活の矢印 -->
  <g fill="#8C949A">
    <rect x="520" y="341.5" width="232.5" height="12"/>
    <polygon points="502.5,347.5 532.5,330.5 532.5,364.5"/>
    <polygon points="557.5,347.5 587.5,330.5 587.5,364.5"/>
    <polygon points="616.5,347.5 646.5,330.5 646.5,364.5"/>
    <polygon points="675.5,347.5 705.5,330.5 705.5,364.5"/>
  </g>
  <text x="621.5" y="293" font-size="46" text-anchor="middle" dominant-baseline="central">復活</text>
  <text y="401" font-size="43" dominant-baseline="central"><tspan x="512">ヨハネ </tspan><tspan x="644" font-size="40" textLength="84" lengthAdjust="spacingAndGlyphs">5:24</tspan></text>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="390.5" cy="173" rx="90" ry="45.5" fill="#fff" class="paper"/>
    <ellipse cx="390.5" cy="348" rx="90" ry="45.5" fill="#fff" class="paper"/>
    <ellipse cx="894.5" cy="173" rx="80" ry="46.5" fill="#50403D"/>
    <ellipse cx="894.5" cy="348" rx="116" ry="46.5" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="388" y="171.5" font-size="56">神</text>
    <text x="390" y="347" font-size="47" textLength="141" lengthAdjust="spacing">イエス</text>
    <text x="894.5" y="171.5" font-size="44" fill="#fff">サタン</text>
    <text x="893" y="348" font-size="46" fill="#111">堕落人間</text>
  </g>

  <!-- ヨハネによる福音書 5:24 -->
  <g font-size="36" font-weight="400" dominant-baseline="central">
    <text y="477"><tspan x="271" text-anchor="end">『</tspan><tspan x="268.8" textLength="799.4" lengthAdjust="spacing">わたしの言葉を聞いて、わたしをつかわされたか</tspan></text>
    <text x="268.8" y="543.5" textLength="799.4" lengthAdjust="spacing">たを信じる者は、永遠の命を受け、またさばかれ</text>
    <text y="610"><tspan x="268.8" font-size="35" textLength="245" lengthAdjust="spacing">ることがなく、</tspan><tspan x="513.5" textLength="506" lengthAdjust="spacing">死から命に移っているのである</tspan><tspan x="1019.5">』</tspan></text>
  </g>
  <g stroke="currentColor" stroke-width="2.5">
    <line x1="557" y1="567.5" x2="705" y2="567.5"/>
    <line x1="514" y1="634.5" x2="1019" y2="634.5"/>
  </g>
</svg>
