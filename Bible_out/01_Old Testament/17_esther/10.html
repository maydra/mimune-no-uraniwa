<h1>エステル記 第10章</h1>
<div class="the-post-cont">

<p><sup>1</sup>アハシュエロス王はその国および海に沿った国々にみつぎを課した。</p>
<p><sup>2</sup>彼の権力と勢力によるすべての事業、および王がモルデカイを高い地位にのぼらせた事の詳しい話はメデアとペルシャの王たちの日誌の書にしるされているではないか。</p>
<p><sup>3</sup>ユダヤ人モルデカイはアハシュエロス王に次ぐ者となり、ユダヤ人の中にあって大いなる者となり、その多くの兄弟に喜ばれた。彼はその民の幸福を求め、すべての国民に平和を述べたからである。</p>
