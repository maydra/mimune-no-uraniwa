<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>聖霊＝真の母</title>

  <!-- 聖霊 ＝ 真の母 -->
  <g fill="#A0F08A" stroke="currentColor" stroke-width="4.5">
    <ellipse cx="456" cy="106.5" rx="110" ry="57.5"/>
    <ellipse cx="841.25" cy="104.25" rx="109.75" ry="57.25"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="459" y="106" font-size="57" textLength="115" lengthAdjust="spacing">聖霊</text>
    <text x="842" y="104.5" font-size="53" textLength="161" lengthAdjust="spacing">真の母</text>
  </g>
  <rect x="610" y="90" width="71" height="8"/>
  <rect x="610" y="112" width="71" height="8"/>

  <!-- 箇条書き（点は円で描く） -->
  <g>
    <circle cx="400.5" cy="249.5" r="12"/>
    <circle cx="400.5" cy="339.5" r="12"/>
    <circle cx="399.5" cy="509" r="12.5"/>
    <circle cx="399.5" cy="601" r="12.5"/>
  </g>
  <g dominant-baseline="central">
    <text x="431.4" y="250.5" font-size="49" textLength="389" lengthAdjust="spacing">後のエバ、女性神</text>
    <text x="431.2" y="342" font-size="48" textLength="387" lengthAdjust="spacing">慰労、感動の働き</text>
    <text x="431.1" y="507.5" font-size="49" textLength="398" lengthAdjust="spacing">罪の悔い改めの業</text>
    <text x="431.5" y="600" font-size="50" textLength="491" lengthAdjust="spacing">地において、業（役事）</text>
  </g>

  <!-- 聖句の出典（元は数字を横に詰めた字） -->
  <g font-size="42" dominant-baseline="central">
    <text x="581.9" y="405">(</text>
    <text x="603.6" y="405" textLength="159" lengthAdjust="spacing">コリント</text>
    <text x="788" y="405" text-anchor="middle">Ⅰ</text>
    <text x="820" y="405" textLength="85" lengthAdjust="spacingAndGlyphs">12:3</text>
    <text x="901" y="405">)</text>
  </g>
</svg>
