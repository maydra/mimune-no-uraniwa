<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>統一王国時代とキリスト王国時代　神殿→国王（王国）、イエス→王の王（王国）と、神国論（アウグスチヌス）→チャールズ大帝（キリスト王国）、再臨主→王の王（王国）</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="131" y="65" width="276" height="54" rx="6"/>
    <rect x="417.5" y="65" width="276" height="54" rx="6"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="167" y="91.5" font-size="34" textLength="206.1" lengthAdjust="spacing">統一王国時代</text>
    <text x="434" y="92" font-size="33" textLength="118" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="555" y="92" font-size="33" textLength="124" lengthAdjust="spacingAndGlyphs">王国時代</text>
  </g>
  <!-- 白い枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="131" y="127.5" width="276" height="254.5" rx="8"/>
    <rect x="417.5" y="127.5" width="276" height="254.5" rx="8"/>
  </g>
  <!-- 灰色の矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="215,217 243.5,217 243.5,213.5 256.5,220.5 243.5,227.5 243.5,224 215,224"/>
    <polygon points="217,323 243,323 243,319.5 256,326.5 243,333.5 243,330 217,330"/>
    <polygon points="500,222.5 526,222.5 526,219 539,226 526,233 526,229.5 500,229.5"/>
    <polygon points="501,325 528,325 528,321.5 541,328.5 528,335.5 528,332 501,332"/>
  </g>
  <!-- 神殿・イエス・神国論・再臨主 -->
  <g>
    <ellipse cx="182" cy="220.5" rx="39" ry="20.5" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="183.8" cy="326.5" rx="38.8" ry="21.5" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="465.5" cy="226" rx="40.5" ry="21" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="466.8" cy="328" rx="38.8" ry="21" fill="#F8F28F" stroke="currentColor" stroke-width="3"/>
  </g>
  <!-- 王国（薄い桃）と王（朱） -->
  <g>
    <ellipse cx="328" cy="227" rx="65" ry="39" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="300.8" cy="226.8" rx="37.8" ry="19.2" fill="#F86D42" stroke="#111" stroke-width="3"/>
    <ellipse cx="329.2" cy="325.5" rx="64.8" ry="39.5" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="301.8" cy="325.2" rx="37.2" ry="27.2" fill="#F86D42" stroke="#111" stroke-width="3"/>
    <ellipse cx="612.5" cy="226" rx="65" ry="39" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="584.8" cy="226" rx="37.2" ry="27" fill="#F86D42" stroke="#111" stroke-width="3"/>
    <ellipse cx="610" cy="328" rx="65" ry="39" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="582.5" cy="328.5" rx="37.5" ry="27" fill="#F86D42" stroke="#111" stroke-width="3"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="156.4" y="220" font-size="26" textLength="53.1" lengthAdjust="spacing">神殿</text>
    <text x="281.7" y="227.5" font-size="22" textLength="41.6" lengthAdjust="spacingAndGlyphs">国王</text>
    <text x="364" y="216" font-size="22" text-anchor="middle">王</text>
    <text x="364" y="240" font-size="22" text-anchor="middle">国</text>
    <text x="152.7" y="326.5" font-size="22" textLength="60.6" lengthAdjust="spacingAndGlyphs">イエス</text>
    <text x="271.7" y="325.5" font-size="22" textLength="60.6" lengthAdjust="spacingAndGlyphs">王の王</text>
    <text x="361" y="315" font-size="22" text-anchor="middle">王</text>
    <text x="361" y="339" font-size="22" text-anchor="middle">国</text>
    <text x="433.6" y="226.5" font-size="23" textLength="63.8" lengthAdjust="spacingAndGlyphs">神国論</text>
    <text x="554.9" y="219.5" font-size="18" textLength="57.2" lengthAdjust="spacingAndGlyphs">チャールズ</text>
    <text x="566.9" y="238.5" font-size="18" textLength="33.2" lengthAdjust="spacingAndGlyphs">大帝</text>
    <text x="622.9" y="213.5" font-size="19" textLength="44.3" lengthAdjust="spacingAndGlyphs">キリスト</text>
    <text x="627.9" y="238" font-size="18" textLength="33.2" lengthAdjust="spacingAndGlyphs">王国</text>
    <text x="436.6" y="328.5" font-size="23" textLength="60.8" lengthAdjust="spacingAndGlyphs">再臨主</text>
    <text x="551.7" y="328.5" font-size="22" textLength="60.6" lengthAdjust="spacingAndGlyphs">王の王</text>
    <text x="642.5" y="316" font-size="22" text-anchor="middle">王</text>
    <text x="642.5" y="340" font-size="22" text-anchor="middle">国</text>
  </g>
  <g dominant-baseline="central">
    <text x="154" y="152" font-size="24" text-anchor="middle">①</text>
    <text x="440" y="151" font-size="24" text-anchor="middle">②</text>
    <text x="426.7" y="188.5" font-size="21" textLength="113.5" lengthAdjust="spacingAndGlyphs">アウグスチヌス</text>
  </g>
</svg>
