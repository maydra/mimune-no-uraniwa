<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>アダムの家庭の立場を蕩減復帰する象徴的な条件</title>

  <!-- 題 -->
  <text x="36" y="37" font-size="30" dominant-baseline="central" textLength="568" lengthAdjust="spacingAndGlyphs">アダムの家庭の立場を蕩減復帰する象徴的な条件</text>
  <line x1="34" y1="56" x2="603" y2="56" stroke="currentColor" stroke-width="2.6"/>

  <!-- アブラハムからアダムへ（楕円の下に描く） -->
  <polygon points="186,264 186,166 180.5,166 188.5,151.5 196.5,166 191,166 191,264" fill="#8C949A"/>

  <!-- 線と矢印 -->
  <g>
    <rect x="259" y="122" width="114" height="5.5"/>
    <polygon points="485,122 561.5,122 561.5,119 572,124.5 561.5,130 561.5,127.5 485,127.5"/>
    <polygon points="270,279.5 371.5,279.5 371.5,276.5 381.5,282 371.5,287.5 371.5,284.5 270,284.5"/>
    <polygon points="379,293.5 277,293.5 277,290 267,296 277,302 277,298.5 379,298.5"/>
    <polygon points="486,279.5 555.5,279.5 555.5,276 566,282 555.5,288 555.5,284.5 486,284.5"/>
    <polygon points="565,293.5 495,293.5 495,290.5 484,296 495,301.5 495,298.5 565,298.5"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="188.5" cy="124.5" rx="44" ry="22.5" fill="#F98AEE"/>
    <ellipse cx="433.5" cy="124" rx="39.5" ry="21" fill="#A0F08A"/>
    <ellipse cx="635" cy="123.5" rx="51" ry="30" fill="#CF921C"/>
    <ellipse cx="434" cy="171" rx="44" ry="21" fill="#FCE5E3"/>
    <ellipse cx="433.5" cy="218" rx="59.5" ry="21" fill="#DCC4C4"/>
    <ellipse cx="188" cy="289" rx="61.5" ry="26" fill="#F98AEE"/>
    <ellipse cx="435.5" cy="289.5" rx="39.5" ry="21.5" fill="#A0F08A"/>
    <ellipse cx="634" cy="288" rx="51" ry="29" fill="#CF921C"/>
    <ellipse cx="435" cy="336" rx="40" ry="21" fill="#FCE5E3"/>
    <ellipse cx="434" cy="381.5" rx="40" ry="21.5" fill="#DCC4C4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="189.5" y="124" font-size="25" textLength="68" lengthAdjust="spacing">アダム</text>
    <text x="434" y="123.5" font-size="23" textLength="47" lengthAdjust="spacing">エバ</text>
    <text x="634.5" y="124" font-size="26" textLength="80" lengthAdjust="spacing">天使長</text>
    <text x="433" y="171" font-size="22" textLength="75" lengthAdjust="spacing">子女たち</text>
    <text x="434" y="218" font-size="24" textLength="95" lengthAdjust="spacing">万物世界</text>
    <text x="189" y="288.5" font-size="23" textLength="105" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="434.5" y="290" font-size="23" textLength="62" lengthAdjust="spacing">サライ</text>
    <text x="632.5" y="288.5" font-size="25" textLength="51" lengthAdjust="spacing">パロ</text>
    <text x="435" y="336" font-size="25" textLength="47" lengthAdjust="spacing">ロト</text>
    <text x="434" y="382" font-size="26" textLength="51" lengthAdjust="spacing">財物</text>
  </g>

  <!-- 字 -->
  <g font-size="23" dominant-baseline="central">
    <text x="257" y="104" textLength="118" lengthAdjust="spacing">兄妹の立場</text>
    <text x="481" y="104.5" textLength="92" lengthAdjust="spacing">奪われる</text>
    <text x="263" y="260.5" textLength="118" lengthAdjust="spacing">兄妹の立場</text>
    <text x="272" y="317.5" textLength="97" lengthAdjust="spacing">妻の立場</text>
    <text x="487" y="261.5" textLength="92" lengthAdjust="spacing">奪われる</text>
    <text x="491" y="316.5" textLength="93" lengthAdjust="spacing">取り返す</text>
    <text x="589" y="339" font-size="20" textLength="92" lengthAdjust="spacing">エジプト王</text>
  </g>
  <path d="M477.5,312 Q485,314 485,326 L485,349 Q485,357 491.5,358 Q485,359 485,367 L485,391 Q485,402 477.5,403" fill="none" stroke="currentColor" stroke-width="3"/>
