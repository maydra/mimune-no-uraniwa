<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヨセフのアベルの立場確立</title>

  <text x="37" y="38.5" font-size="31" dominant-baseline="central" textLength="376" lengthAdjust="spacing">ヨセフのアベルの立場確立</text>
  <line x1="34" y1="57.5" x2="413" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- ヤコブの家庭 → ヨセフ -->
  <polygon points="227.5,128 234,128 234,144 239.5,144 230.75,157.5 222,144 227.5,144" fill="#8C949A"/>
  <ellipse cx="231.25" cy="99.5" rx="82.75" ry="27.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <text x="232" y="99.5" font-size="23" text-anchor="middle" dominant-baseline="central" textLength="140" lengthAdjust="spacing">ヤコブの家庭</text>
  <ellipse cx="230.75" cy="189.5" rx="59.5" ry="27.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.8"/>
  <text x="231.5" y="189.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="80" lengthAdjust="spacing" fill="#111">ヨセフ</text>

  <!-- ヨセフの路程 -->
  <g font-size="28" dominant-baseline="central">
    <text x="332" y="125.5" textLength="246" lengthAdjust="spacing">エジプトで蕩減路程</text>
    <text x="332" y="165" textLength="108" lengthAdjust="spacing">夢で予示</text>
  </g>
  <text x="448" y="164.5" font-size="22" font-weight="400" dominant-baseline="central" textLength="153" lengthAdjust="spacingAndGlyphs">(創 37:5 ～ 11)</text>

  <g>
    <circle cx="344" cy="201.5" r="5.5"/>
    <circle cx="344" cy="238.5" r="5.5"/>
    <circle cx="344" cy="275.5" r="5.5"/>
    <circle cx="344" cy="312.5" r="5.5"/>
  </g>
  <g font-size="23" dominant-baseline="central">
    <text y="201.5"><tspan x="360" textLength="164" lengthAdjust="spacing">兄たちによって</tspan><tspan x="524.6">、</tspan><tspan x="549" textLength="117" lengthAdjust="spacing">エジプトに</tspan></text>
    <text x="359.5" y="238.5" textLength="23.5" lengthAdjust="spacingAndGlyphs">30</text>
    <text x="389" y="238.5" textLength="142" lengthAdjust="spacing">歳で総理大臣</text>
    <text x="360" y="275.5" textLength="236" lengthAdjust="spacing">腹違いの兄たちが屈伏</text>
    <text x="360" y="312.5" textLength="164" lengthAdjust="spacing">父母が導かれる</text>
  </g>

  <polygon points="434,338 456.5,338 456.5,346.5 465.5,346.5 445,358 424.5,346.5 434,346.5" fill="#8C949A"/>
  <rect x="222.5" y="365" width="448.5" height="44" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <text x="238" y="387" font-size="26" dominant-baseline="central" textLength="419" lengthAdjust="spacing" fill="#111">メシヤのための民族的蕩減路程出発</text>
</svg>
