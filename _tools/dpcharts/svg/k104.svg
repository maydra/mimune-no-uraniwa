<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 信仰基台　1. 信仰基台を復帰する中心人物</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="49.5" y="37.5" font-size="30" text-anchor="middle">Ⅰ</text>
    <text x="69" y="37.5" font-size="30" text-anchor="middle">.</text>
    <text x="81" y="37.5" font-size="31" textLength="126" lengthAdjust="spacing">信仰基台</text>
    <text x="54.5" y="86" font-size="29" text-anchor="middle">1</text>
    <text x="68" y="86" font-size="29" text-anchor="middle">.</text>
    <text x="81" y="86" font-size="28.5" textLength="374" lengthAdjust="spacing">信仰基台を復帰する中心人物</text>
  </g>
  <g stroke="currentColor" stroke-width="2">
    <line x1="81" y1="56.5" x2="207" y2="56.5"/>
    <line x1="81" y1="103.5" x2="456" y2="103.5"/>
  </g>

  <!-- ノアから6項目へ -->
  <path d="M231,157.5 V382 M229,160 H248 M231,200 H248 M231,245 H248 M231,290 H248 M231,334.5 H248 M229,379.5 H248 M214,269.5 H231" fill="none" stroke="currentColor" stroke-width="4.5"/>
  <ellipse cx="181" cy="269.2" rx="34" ry="60.2" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="40" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="180" y="248">ノ</text>
    <text x="180.5" y="289">ア</text>
  </g>

  <g font-size="26" dominant-baseline="central">
    <text x="254" y="157.5">①</text>
    <text x="254" y="202">②</text>
    <text x="254" y="247">③</text>
    <text x="254" y="291.5">④</text>
    <text x="254" y="336.5">⑤</text>
    <text x="254" y="381">⑥</text>
    <text x="287" y="157.5" textLength="156" lengthAdjust="spacing">アダム－ノア</text>
    <text x="452" y="157.5" textLength="182" lengthAdjust="spacingAndGlyphs">(1600 年、10 代)</text>
    <text x="287" y="202" textLength="182" lengthAdjust="spacing">第二の人間始祖</text>
    <text x="287" y="247" textLength="208" lengthAdjust="spacing">神に絶対的に服従</text>
    <text x="287" y="291.5" textLength="234" lengthAdjust="spacing">アベルの心情の基台</text>
    <text x="287" y="336.5" textLength="364" lengthAdjust="spacing">アベルの身代わりのセツの子孫</text>
    <text x="287" y="381" textLength="234" lengthAdjust="spacing">神の目から見て義人</text>
  </g>
</svg>
