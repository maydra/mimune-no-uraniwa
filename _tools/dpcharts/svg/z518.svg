  <g font-size="40" dominant-baseline="central">
    <text x="597" y="86" textLength="140" lengthAdjust="spacing">12 子息</text>
    <text x="597" y="246" textLength="481" lengthAdjust="spacing">12 部族 × 12 型 ＝ 144 数</text>
    <text x="597" y="405" textLength="140" lengthAdjust="spacing">12 弟子</text>
    <text x="847" y="405" textLength="123" lengthAdjust="spacing">144 数</text>
    <text x="841" y="457" font-size="45" textLength="181" lengthAdjust="spacing">霊的復帰</text>
    <text x="597" y="541" textLength="326" lengthAdjust="spacing">144 数の信徒たち</text>
    <text x="598" y="604" textLength="457" lengthAdjust="spacing">縦的摂理を霊肉共に復帰</text>
  </g>
