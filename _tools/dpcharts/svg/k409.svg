<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. 実体基台（イエスとユダヤ民族）</title>

  <g font-size="30" dominant-baseline="central">
    <text x="33" y="36.5" textLength="27" lengthAdjust="spacing">2.</text>
    <text x="74" y="36.5" textLength="124" lengthAdjust="spacing">実体基台</text>
  </g>
  <line x1="73" y1="55.5" x2="198" y2="55.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印（ユダヤ民族の矢印は円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="424.5,136.5 424.5,128 431.5,128 418,119.5 404.5,128 411.5,128 411.5,136.5"/>
    <polygon points="425,204.5 425,197 432,197 418.5,188.5 405,197 412,197 412,204.5"/>
    <polygon points="425.5,271.5 425.5,264 432.5,264 419,255.5 405.5,264 412.5,264 412.5,271.5"/>
    <polygon points="551,327.5 284.5,327.5 284.5,322.5 273,331 284.5,339.5 284.5,334.5 551,334.5"/>
    <polygon points="202.5,306 202.5,183 207.5,183 199.5,171 191.5,183 196.5,183 196.5,306"/>
  </g>

  <!-- 地上天国・神 -->
  <ellipse cx="418.5" cy="93" rx="103" ry="20.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="362" y="93" font-size="27" dominant-baseline="central" textLength="115" lengthAdjust="spacing">地上天国</text>
  <circle cx="200" cy="135" r="29.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="199" y="135" font-size="32" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 水色の箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="274.5" y="143.5" width="291" height="39"/>
    <rect x="289.5" y="212.5" width="258" height="37"/>
    <rect x="297.5" y="342.5" width="239" height="37"/>
  </g>
  <g font-size="25" dominant-baseline="central" fill="#111">
    <text x="288" y="163.5" textLength="77" lengthAdjust="spacing">イエス</text>
    <text x="378.5" y="163.5" text-anchor="middle">：</text>
    <text x="394" y="163.5" textLength="157" lengthAdjust="spacing">メシヤの立場</text>
    <text x="301" y="231" textLength="235" lengthAdjust="spacing">メシヤのための基台</text>
    <text x="312" y="360.5" textLength="208" lengthAdjust="spacing">出発のための摂理</text>
  </g>

  <!-- 実体基台 -->
  <rect x="356.5" y="280.5" width="126.5" height="39.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="368" y="299.5" font-size="25" font-weight="400" dominant-baseline="central" textLength="103" lengthAdjust="spacing">実体基台</text>

  <!-- イエス・ユダヤ民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="199.5" cy="331" rx="67" ry="24.5" fill="#F8F28F"/>
    <ellipse cx="623.5" cy="331" rx="72" ry="32.5" fill="#F86D42"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="199.5" y="331" font-size="27" text-anchor="middle" textLength="82" lengthAdjust="spacing">イエス</text>
    <text x="565" y="330.5" font-size="25" textLength="116" lengthAdjust="spacing">ユダヤ民族</text>
  </g>

  <g font-size="23" font-weight="400" dominant-baseline="central">
    <text y="374.5"><tspan x="129">（</tspan><tspan x="139" textLength="118" lengthAdjust="spacing">洗礼ヨハネ</tspan><tspan x="257">）</tspan></text>
    <text y="399.5"><tspan x="348">（</tspan><tspan x="359" textLength="118" lengthAdjust="spacing">み言と奇跡</tspan><tspan x="476">）</tspan></text>
  </g>
</svg>
