<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>④ユダヤ民族の衰亡と信徒たちの苦難から見て</title>

  <text x="76.5" y="57" font-size="48" text-anchor="middle" dominant-baseline="central">④</text>
  <text x="105.15" y="56.5" font-size="46" textLength="834" lengthAdjust="spacingAndGlyphs" dominant-baseline="central">ユダヤ民族の衰亡と信徒たちの苦難から見て</text>
  <line x1="105" y1="85.5" x2="939" y2="85.5" stroke="currentColor" stroke-width="4"/>
  <text x="353" y="22" font-size="22" textLength="92" lengthAdjust="spacing" dominant-baseline="central">すいぼう</text>

  <!-- 灰色の矢印（円と楕円より先に描き、円と楕円で隠す） -->
  <g fill="#8C949A">
    <polygon points="597.75,210 610.75,210 610.75,349.5 622.5,349.5 604.25,378.5 586,349.5 597.75,349.5"/>
    <polygon points="520,440.5 390.5,440.5 390.5,429 360.5,447 390.5,465 390.5,453.5 520,453.5"/>
    <polygon points="690,440.5 819.5,440.5 819.5,429 847.5,447 819.5,465 819.5,453.5 690,453.5"/>
  </g>

  <circle cx="604.5" cy="166.5" r="49" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="601" y="164.5" font-size="58" text-anchor="middle" dominant-baseline="central">神</text>

  <ellipse cx="604.5" cy="447" rx="98" ry="60.5" fill="#FCE5E3" stroke="currentColor" stroke-width="4"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="604" y="428.5" font-size="40" textLength="165" lengthAdjust="spacingAndGlyphs">イスラエル</text>
    <text x="603" y="475" font-size="44">選民</text>
  </g>

  <rect x="187.5" y="332.5" width="166" height="227" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g dominant-baseline="central">
    <text x="201.75" y="418.5" font-size="40" textLength="138" lengthAdjust="spacingAndGlyphs">永遠なる</text>
    <text x="229.25" y="474" font-size="40" textLength="83" lengthAdjust="spacing">王国</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="444" y="394" font-size="50">メシヤ</text>
    <text x="764" y="499.5" font-size="45">犯罪</text>
  </g>

  <!-- 十字架（型を 0.93 倍） -->
  <g transform="translate(724.0,274.0) scale(0.8900,0.8222)" stroke-width="3.504" fill="#7A5230" stroke="#111" stroke-linejoin="round">
    <path d="M40,0 H60 V42 H100 V60 H60 V180 H40 V60 H0 V42 H40 Z"/>
  </g>

  <rect x="855.5" y="290.5" width="239" height="314" fill="#CF921C" stroke="currentColor" stroke-width="4"/>
  <g fill="#111">
    <circle cx="878.5" cy="329.5" r="11"/>
    <circle cx="880" cy="510.5" r="10.5"/>
  </g>
  <g font-size="41" dominant-baseline="central" fill="#111">
    <text x="900.75" y="329" textLength="124.5" lengthAdjust="spacing">ユダヤ</text>
    <text x="900.75" y="379.5" textLength="124.5" lengthAdjust="spacing">民族の</text>
    <text x="900.5" y="429.5" textLength="83" lengthAdjust="spacing">衰亡</text>
    <text x="900.25" y="513" textLength="177.5" lengthAdjust="spacingAndGlyphs">信徒たちの</text>
    <text x="900.5" y="563" textLength="83" lengthAdjust="spacing">苦難</text>
  </g>
</svg>
