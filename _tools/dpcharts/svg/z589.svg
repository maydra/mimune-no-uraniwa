<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヤコブとエソウ（ロマ 9:10〜13）　復帰摂理のプログラムと人間の責任分担遂行</title>

  <!-- ロマ 9:10〜13 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="252" y="100.5" font-size="45">ロマ</text>
    <text x="369" y="99.5" font-size="42">9:10</text>
    <text x="453.5" y="98.5" font-size="48">〜</text>
    <text x="502" y="99.5" font-size="42">13</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="345,247 381,247 381,240 401,252 381,264 381,257 345,257"/>
    <polygon points="551.5,241 651.6,184.8 655.4,191.6 666.5,170.5 642.7,169 646.5,175.8 546.5,232"/>
    <polygon points="546.6,271.5 646.8,327.8 643,334.6 666.8,333 655.7,311.9 651.9,318.7 551.6,262.5"/>
    <polygon points="750,296 750,240 742.5,240 755,221 767.5,240 760,240 760,296"/>
  </g>

  <circle cx="284" cy="253" r="58.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="283" y="252" font-size="65" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="471" y="252.5" font-size="49" text-anchor="middle" dominant-baseline="central">腹中</text>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="755.25" cy="160.5" rx="76.75" ry="46.5" fill="#F8F28F"/>
    <ellipse cx="755" cy="344.25" rx="76.5" ry="46.25" fill="#F86D42"/>
  </g>
  <g font-size="42" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="756" y="159.5">ヤコブ</text>
    <text x="754" y="344.5">エソウ</text>
  </g>
  <g font-size="49" text-anchor="middle" dominant-baseline="central">
    <text x="926" y="159.5">愛する</text>
    <text x="871.5" y="252">仕える</text>
    <text x="902" y="343.5">憎む</text>
  </g>

  <g font-size="53" text-anchor="middle" dominant-baseline="central">
    <text x="621" y="455.5">復帰摂理</text>
    <text x="892" y="455.5" textLength="320" lengthAdjust="spacing">のプログラム</text>
    <text x="746.5" y="596.5" textLength="486" lengthAdjust="spacing">人間の責任分担遂行</text>
  </g>
  <line x1="754" y1="499" x2="754" y2="553" stroke="currentColor" stroke-width="8"/>
</svg>
