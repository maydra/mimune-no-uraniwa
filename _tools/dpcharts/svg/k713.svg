<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>『政治』</title>

  <!-- 題 -->
  <g font-size="30" dominant-baseline="central">
    <text x="146" y="36.5" text-anchor="end">『</text>
    <text x="148" y="36.5" textLength="61" lengthAdjust="spacing">政治</text>
    <text x="210" y="36.5">』</text>
  </g>

  <!-- 文芸復興と宗教改革の札 -->
  <g stroke="currentColor" stroke-width="2.5">
    <g fill="#F86D42">
      <rect x="153" y="63" width="167" height="37.5"/>
      <rect x="329" y="63" width="165" height="37.5"/>
      <rect x="502" y="63" width="165" height="37.5"/>
    </g>
    <g fill="#F8F28F">
      <rect x="153" y="100.5" width="167" height="38.5"/>
      <rect x="329" y="100.5" width="165" height="38.5"/>
      <rect x="502" y="100.5" width="165" height="38.5"/>
    </g>
  </g>
  <g font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="237" y="81.5" textLength="148" lengthAdjust="spacing">一次文芸復興</text>
    <text x="411.5" y="81.5" textLength="148" lengthAdjust="spacing">二次文芸復興</text>
    <text x="585.5" y="82" textLength="149" lengthAdjust="spacing">三次文芸復興</text>
    <text x="237" y="121.5" textLength="148" lengthAdjust="spacing">一次宗教改革</text>
    <text x="411.5" y="121.5" textLength="147" lengthAdjust="spacing">二次宗教改革</text>
    <text x="585.5" y="121.5" textLength="147" lengthAdjust="spacing">三次宗教改革</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="234,141 239,141 239,156 243,156 236.5,165 230,156 234,156"/>
    <polygon points="409.5,141 414.5,141 414.5,156 418.5,156 412,165 405.5,156 409.5,156"/>
    <polygon points="584,141 589,141 589,156 593,156 586.5,165 580,156 584,156"/>
  </g>

  <!-- 政治の表 -->
  <rect x="150" y="167" width="523" height="201" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
  <g stroke="#111" stroke-width="3">
    <line x1="323.5" y1="168.5" x2="323.5" y2="366.5"/>
    <line x1="498.5" y1="168.5" x2="498.5" y2="366.5"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="238" y="207.5" textLength="112" lengthAdjust="spacing">中世封建</text>
    <text x="237" y="246.5" textLength="114" lengthAdjust="spacing">社会崩壊</text>
    <text x="412.5" y="207.5" textLength="113" lengthAdjust="spacing">専制君主</text>
    <text x="412" y="246.5" textLength="114" lengthAdjust="spacing">社会崩壊</text>
    <text x="586.5" y="206.5" textLength="113" lengthAdjust="spacing">共産世界</text>
    <text x="586.5" y="240.5" textLength="57" lengthAdjust="spacing">屈伏</text>
    <text x="585.5" y="285.5" textLength="113" lengthAdjust="spacing">地上天国</text>
    <text x="586.5" y="319.5" textLength="55" lengthAdjust="spacing">統一</text>
  </g>
</svg>
