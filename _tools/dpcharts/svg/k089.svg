<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>「実体献祭」の意義と目的</title>

  <!-- 題 -->
  <text x="45" y="38" font-size="30" textLength="349" lengthAdjust="spacing" dominant-baseline="central">「実体献祭」の意義と目的</text>
  <line x1="45" y1="57" x2="394" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="266.2,292 266.2,152 271.5,152 263,137 254.5,152 259.8,152 259.8,292"/>
    <polygon points="598,313.8 326,313.8 326,309 312,317 326,325 326,320.2 598,320.2"/>
    <polygon points="281.8,112.2 389.6,173.3 387.4,177.2 403,178 394.3,165 392.1,168.9 284.2,107.8"/>
    <polygon points="424.7,207.9 296.7,285.1 294.4,281.3 286,294.5 301.6,293.3 299.3,289.4 427.3,212.1"/>
    <polygon points="464.8,212.2 596.6,286.8 594.4,290.7 610,291.5 601.3,278.5 599,282.4 467.2,207.8"/>
    <polygon points="445,277.5 445,271 438,271 451,262 464,271 456.5,271 456.5,277.5"/>
  </g>

  <!-- 神 -->
  <circle cx="262.5" cy="101" r="28.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="261.5" y="100.5" font-size="32" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- アダム・アベル・カイン -->
  <g stroke="currentColor" stroke-width="2.2">
    <ellipse cx="445" cy="194.5" rx="40.5" ry="24" fill="#CF921C"/>
    <ellipse cx="263" cy="315.5" rx="40.5" ry="24" fill="#F8F28F"/>
    <ellipse cx="637" cy="315.5" rx="40.5" ry="24" fill="#F86D42"/>
  </g>
  <g font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="445.5" y="195" textLength="62" lengthAdjust="spacing">アダム</text>
    <text x="264" y="316" textLength="62" lengthAdjust="spacing">アベル</text>
    <text x="637" y="316" textLength="62" lengthAdjust="spacing">カイン</text>
  </g>

  <!-- 父母復帰・子女復帰 -->
  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text x="451.5" y="246" textLength="94" lengthAdjust="spacing">父母復帰</text>
    <text x="451.5" y="294" textLength="94" lengthAdjust="spacing">子女復帰</text>
  </g>

  <!-- 象徴献祭：○ -->
  <rect x="133" y="176" width="114" height="74" fill="#DCC4C4" stroke="currentColor" stroke-width="2.4"/>
  <g font-size="25" dominant-baseline="central" fill="#111">
    <text x="145.5" y="195.5" textLength="52" lengthAdjust="spacing">象徴</text>
    <text x="145.5" y="230" textLength="52" lengthAdjust="spacing">献祭</text>
    <text x="207.5" y="230" text-anchor="middle">：</text>
  </g>
  <circle cx="229" cy="229.5" r="9" fill="none" stroke="#111" stroke-width="3"/>

  <!-- 実体献祭 -->
  <rect x="387" y="329" width="125" height="43" fill="#FCE5E3" stroke="currentColor" stroke-width="2.4"/>
  <text x="449" y="350.5" font-size="27" textLength="108" lengthAdjust="spacing" text-anchor="middle" dominant-baseline="central" fill="#111">実体献祭</text>

  <text x="278.5" y="400" font-size="26" textLength="345" lengthAdjust="spacing" dominant-baseline="central">堕落性を脱ぐための蕩減条件</text>
</svg>
