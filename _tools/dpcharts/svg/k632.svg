<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>7. 共生共栄共義主義と共産主義</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="32" y="37.5" font-size="30" textLength="27" lengthAdjust="spacingAndGlyphs">7.</text>
    <text x="69.5" y="37" font-size="29" textLength="376" lengthAdjust="spacing">共生共栄共義主義と共産主義</text>
  </g>
  <line x1="69" y1="55" x2="445" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 矢印（円・楕円の下に描く） -->
  <g>
    <polygon points="180.1,158.7 238.5,202.1 235.2,206.5 254.5,209.0 246.5,191.2 243.2,195.7 184.9,152.3"/>
    <polygon points="297.6,251.2 368.6,305.4 365.2,309.7 384.5,312.5 376.8,294.6 373.4,299.0 302.4,244.8"/>
  </g>
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8" stroke-linejoin="miter">
    <polygon points="189.8,325.6 250.1,278.9 253.2,282.8 262.0,264.0 241.6,267.8 244.6,271.8 184.2,318.4"/>
    <polygon points="297.7,237.6 372.8,180.2 375.6,183.8 384.0,166.0 364.6,169.5 367.4,173.0 292.3,230.4"/>
  </g>

  <!-- サ・神・人間 -->
  <g stroke="currentColor" stroke-width="2.8">
    <circle cx="182.5" cy="155.5" r="32.5" fill="#50403D"/>
    <circle cx="182" cy="322" r="32" fill="#fff" class="paper"/>
    <ellipse cx="291" cy="234" rx="46" ry="32" fill="#FCE5E3"/>
    <ellipse cx="464.5" cy="150.5" rx="75.5" ry="47" fill="#fff" class="paper"/>
    <ellipse cx="464.5" cy="328" rx="75.5" ry="48" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="182.5" y="156" font-size="31" fill="#fff">サ</text>
    <text x="179" y="321.5" font-size="32">神</text>
    <text x="289" y="234" font-size="32" fill="#111" textLength="68" lengthAdjust="spacing">人間</text>
    <text x="463" y="133" font-size="28" textLength="116" lengthAdjust="spacing">共生共栄</text>
    <text x="463.5" y="167" font-size="28" textLength="116" lengthAdjust="spacing">共義主義</text>
    <g font-size="29" fill="#111">
      <text x="464" y="310.5" textLength="88" lengthAdjust="spacing">科学的</text>
      <text x="464.5" y="345" textLength="116" lengthAdjust="spacing">社会主義</text>
    </g>
  </g>

  <!-- 右の字 -->
  <g font-size="28" dominant-baseline="central">
    <text x="560.6" y="133" textLength="116" lengthAdjust="spacing">理想世界</text>
    <text y="167"><tspan x="555" text-anchor="middle">（</tspan><tspan x="560.6" textLength="115" lengthAdjust="spacing">地上天国</tspan><tspan x="681.5" text-anchor="middle">）</tspan></text>
    <text x="560.6" y="308" textLength="116" lengthAdjust="spacing">共産主義</text>
    <text x="588.6" y="347.5" textLength="59" lengthAdjust="spacing">世界</text>
  </g>
</svg>
