<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天国＝完成個人　縦的命令と横的紐帯、頭脳の縦的命令と四肢五体　神の心情体恤</title>
  <defs>
    <marker id="z317-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 天国 ＝ 完成個人 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4">
    <rect x="322" y="65.5" width="229.5" height="76"/>
    <rect x="741.5" y="65.5" width="229.5" height="76"/>
  </g>
  <g font-size="50" text-anchor="middle" dominant-baseline="central">
    <text x="436.5" y="104">天国</text>
    <text x="856.5" y="103">完成個人</text>
  </g>
  <g stroke="currentColor" stroke-width="8">
    <line x1="608" y1="91.5" x2="683.5" y2="91.5"/>
    <line x1="608" y1="113.5" x2="683.5" y2="113.5"/>
  </g>

  <!-- 神と人間の間の縦的な矢印 -->
  <g stroke="currentColor" stroke-width="6" fill="none" marker-end="url(#z317-a)">
    <path d="M308,369 Q341.9,308.5 400.5,271.5"/>
    <path d="M408,280 Q375.5,341.7 315.8,377.7"/>
    <path d="M430,375 Q414.5,327.6 431,280.2"/>
    <path d="M445,277 Q459,324.9 443,372.8"/>
    <path d="M557,383 Q500.9,341.9 468.8,280.1"/>
    <path d="M481.5,274.5 Q537.3,313.2 569.4,373"/>
  </g>

  <!-- 人間どうしの横的な矢印（回る矢印。下の矢印は上の矢印を180度回したもの） -->
  <g>
    <path d="M335.5,418.5 Q362.25,397.95 372,412" fill="none" stroke="currentColor" stroke-width="6.5"/>
    <polygon points="376.5,404.5 387,418.5 369.5,419"/>
    <g transform="rotate(180,359.75,424.15)">
      <path d="M335.5,418.5 Q362.25,397.95 372,412" fill="none" stroke="currentColor" stroke-width="6.5"/>
      <polygon points="376.5,404.5 387,418.5 369.5,419"/>
    </g>
  </g>
  <g transform="translate(157.3,0)">
    <path d="M335.5,418.5 Q362.25,397.95 372,412" fill="none" stroke="currentColor" stroke-width="6.5"/>
    <polygon points="376.5,404.5 387,418.5 369.5,419"/>
    <g transform="rotate(180,359.75,424.15)">
      <path d="M335.5,418.5 Q362.25,397.95 372,412" fill="none" stroke="currentColor" stroke-width="6.5"/>
      <polygon points="376.5,404.5 387,418.5 369.5,419"/>
    </g>
  </g>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="436.5" cy="225" rx="40.5" ry="39" fill="#fff" class="paper"/>
    <ellipse cx="279" cy="424" rx="45" ry="39" fill="#FCE5E3"/>
    <ellipse cx="437" cy="424" rx="45" ry="39" fill="#FCE5E3"/>
    <ellipse cx="598.5" cy="424" rx="45" ry="39" fill="#FCE5E3"/>
  </g>
  <text x="436.5" y="225" font-size="46" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="37" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="279" y="424.5">人間</text>
    <text x="437" y="425">人間</text>
    <text x="598" y="425">人間</text>
  </g>
  <g font-size="42" dominant-baseline="central">
    <text x="206.4" y="224" textLength="165" lengthAdjust="spacing">縦的命令</text>
    <text x="353.2" y="498" textLength="166.7" lengthAdjust="spacing">横的紐帯</text>
  </g>

  <!-- 人（100×240 の型を置く） -->
  <g transform="translate(788,190.3) scale(1.37,1.15)" fill="#FCE6E5" stroke="#111" stroke-width="2.8" stroke-linejoin="round">
    <path d="M43,40 L43,48 C30,49 14,50 10,58 L4,130 Q3,140 9,141 Q15,141 15,132 L21,78 L23,124 L26,232 Q26,238 33,238 L41,238 Q47,238 47,232 L49,134 L51,134 L53,232 Q53,238 59,238 L67,238 Q74,238 74,232 L77,124 L79,78 L85,132 Q85,141 91,141 Q97,140 96,130 L90,58 C86,50 70,49 57,48 L57,40 Z"/>
    <circle cx="50" cy="22" r="19"/>
  </g>
  <g font-size="37.5" dominant-baseline="central">
    <text x="933.4" y="216" textLength="112" lengthAdjust="spacing">頭脳の</text>
    <text x="933.4" y="261" textLength="149.3" lengthAdjust="spacing">縦的命令</text>
  </g>
  <text x="771.6" y="503.5" font-size="42" dominant-baseline="central" textLength="167.3" lengthAdjust="spacing">四肢五体</text>

  <rect x="447" y="554" width="384" height="81.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="486.9" y="596" font-size="50" dominant-baseline="central" fill="#111" textLength="301" lengthAdjust="spacing">神の心情体恤</text>
</svg>
