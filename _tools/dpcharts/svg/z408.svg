<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. メシヤとして降臨されたイエスの目的</title>

  <text x="53.5" y="57" font-size="46" dominant-baseline="central">Ⅰ.</text>
  <text x="126" y="57" font-size="48" dominant-baseline="central" textLength="816" lengthAdjust="spacing">メシヤとして降臨されたイエスの目的</text>
  <line x1="126" y1="87.5" x2="942" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <!-- 堕落人間からイエス、完全なる救いへ（楕円の下に描く） -->
  <rect x="369" y="440" width="15" height="100" fill="#8C949A"/>
  <polygon points="369,380 384,380 384,309 396,309 376,273 356,309 369,309" fill="#8C949A"/>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="375.75" cy="201" rx="149.25" ry="55.5" fill="#fff" class="paper"/>
    <ellipse cx="375.75" cy="406.5" rx="133.25" ry="53" fill="#F8F28F"/>
    <ellipse cx="375.75" cy="574" rx="140.75" ry="52" fill="#CF921C" stroke-width="4.5"/>
    <rect x="585" y="156" width="264.5" height="86" fill="#fff" class="paper"/>
    <rect x="585" y="364" width="436" height="85" fill="#fff" class="paper"/>
  </g>

  <!-- 「：」と縦の「＝」 -->
  <g>
    <rect x="550" y="181" width="11" height="11"/>
    <rect x="550" y="207.5" width="11" height="11"/>
    <rect x="550" y="388" width="11" height="11"/>
    <rect x="550" y="415" width="11" height="11"/>
    <rect x="700" y="266" width="7" height="71"/>
    <rect x="721" y="266" width="7" height="71"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <text x="375.5" y="201" font-size="44">完全なる救い</text>
    <text x="375.5" y="406.5" font-size="52" fill="#111" textLength="158" lengthAdjust="spacing">イエス</text>
    <text x="375.5" y="573.5" font-size="52" fill="#111">堕落人間</text>
    <text x="716" y="199" font-size="52" textLength="213" lengthAdjust="spacing">地上天国</text>
    <text x="802.5" y="406" font-size="52" textLength="376" lengthAdjust="spacing">復帰摂理の目的</text>
  </g>
  <g dominant-baseline="central">
    <text x="739.5" y="309" font-size="45">天国人</text>
    <text x="879" y="308" font-size="40" textLength="190" lengthAdjust="spacingAndGlyphs">(マタイ 5:48)</text>
  </g>
</svg>
