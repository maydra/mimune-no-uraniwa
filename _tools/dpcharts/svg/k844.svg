<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <!-- 元の図は「子羊」。本文と同じ「小羊」に直した（2026-10-31、ユーザー「誤表記は直そう」） -->
  <title>Ⅱ. イエスは東の国に再臨される</title>

  <!-- 題 -->
  <text x="40" y="38" font-size="31" dominant-baseline="central" textLength="33" lengthAdjust="spacingAndGlyphs">Ⅱ.</text>
  <text x="83" y="38" font-size="31" dominant-baseline="central" textLength="408" lengthAdjust="spacing">イエスは東の国に再臨される</text>
  <line x1="82" y1="56" x2="491" y2="56" stroke="currentColor" stroke-width="2.5"/>

  <!-- 「実を結ぶ国」＝東の方 -->
  <g font-size="28" dominant-baseline="central">
    <text x="184" y="126" text-anchor="end">「</text>
    <text x="184" y="126" textLength="143" lengthAdjust="spacing">実を結ぶ国</text>
    <text x="326" y="126">」</text>
    <text x="397" y="126" textLength="87" lengthAdjust="spacing">東の方</text>
  </g>
  <g stroke="currentColor" stroke-width="3">
    <line x1="361" y1="122.5" x2="381" y2="122.5"/>
    <line x1="361" y1="129" x2="381" y2="129"/>
  </g>

  <!-- 黙示録 -->
  <g font-size="26" dominant-baseline="central">
    <text x="135" y="185.5">黙</text>
    <text x="166" y="185.5" textLength="38" lengthAdjust="spacing">5:1</text>
    <text x="241" y="185.5" text-anchor="end">『</text>
    <text x="240" y="185.5" textLength="132" lengthAdjust="spacing">神の右の手</text>
    <text x="423" y="185.5" textLength="210" lengthAdjust="spacing">七つの封印で封じ</text>
    <text x="426" y="222" textLength="129" lengthAdjust="spacing">られた巻物</text>
    <text x="554" y="222">』</text>

    <text x="135" y="274">黙</text>
    <text x="166" y="274" textLength="41" lengthAdjust="spacing">5:7</text>
    <text x="241" y="274" text-anchor="end">『</text>
    <text x="240" y="274" textLength="53" lengthAdjust="spacing">小羊</text>
    <text x="344" y="274" textLength="210" lengthAdjust="spacing">巻物を受けとって</text>
    <text x="554" y="274">』</text>

    <text x="135" y="361.5">黙</text>
    <text x="166" y="361.5" textLength="38" lengthAdjust="spacing">6:1</text>
    <text x="241" y="361.5" text-anchor="end">『</text>
  </g>
  <g font-size="24.5" dominant-baseline="central">
    <text x="240" y="361.5" textLength="423" lengthAdjust="spacing">その封印を一つずつ解きはじめられた</text>
    <text x="662" y="361.5">』</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="383,183.5 399,183.5 399,179 412,186 399,193 399,188.5 383,188.5"/>
    <polygon points="305,273 321,273 321,268.5 334,275.5 321,282.5 321,278 305,278"/>
  </g>
</svg>
