<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <!-- 縦書きの括弧︵︶はフォント（図の字だけに絞った BIZ UDPゴシック）に無いので、（）を90度回して描く -->
  <title>未完成期の堕落と警告のみ言</title>

  <!-- 神と完成した人間の授受 -->
  <ellipse cx="456" cy="107.5" rx="42.3" ry="38.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="455" y="109.5" font-size="53" text-anchor="middle" dominant-baseline="central">神</text>
  <g fill="none" stroke="currentColor" stroke-width="6.5">
    <path d="M436,210 Q409.5,186 429,170"/>
    <path d="M477,156 Q503.5,180 484,196"/>
  </g>
  <polygon points="420.5,165 442.5,155 437.5,174.5"/>
  <polygon points="492.5,201 470.5,211 475.5,191.5"/>

  <polyline points="535,57.5 516,63.5 516,151 535,157" fill="none" stroke="currentColor" stroke-width="6"/>
  <g font-size="36" dominant-baseline="central">
    <text x="543" y="82.5" textLength="506" lengthAdjust="spacing">全能性を信ずることができない</text>
    <text x="543" y="132.5" textLength="185" lengthAdjust="spacing">不完全な方</text>
  </g>
  <polygon points="694.5,183 722,197.5 707,197.5 707,215 682,215 682,197.5 667,197.5" fill="#8C949A"/>
  <text x="572" y="261" font-size="41" dominant-baseline="central" textLength="331" lengthAdjust="spacing">堕落したとすれば</text>

  <!-- 成長期間（未完成期） -->
  <rect x="437" y="396" width="40.5" height="157.5" fill="#C4CCD3" stroke="currentColor" stroke-width="3"/>
  <g stroke="currentColor" stroke-width="6.5" stroke-dasharray="8 8.7">
    <line x1="378" y1="396" x2="554" y2="396"/>
    <line x1="381" y1="476.5" x2="557" y2="476.5"/>
  </g>
  <line x1="437" y1="476.5" x2="477.5" y2="476.5" stroke="#111" stroke-width="6.5" stroke-dasharray="8 8.7" stroke-dashoffset="5.9"/>
  <polygon points="456.5,316 507,357 477.5,357 477.5,396 437,396 437,357 406.5,357" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g stroke="currentColor" stroke-width="9">
    <line x1="268" y1="310" x2="719" y2="310"/>
    <line x1="270" y1="553.5" x2="719" y2="553.5"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="456.8" cy="262.8" rx="93.3" ry="41.8" fill="#CDF8F7"/>
    <ellipse cx="457" cy="598.5" rx="88.5" ry="39" fill="#FCE5E3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text y="264.5" font-size="51"><tspan x="416.5">完</tspan><tspan x="455.5">・</tspan><tspan x="495.5">人</tspan></text>
    <text x="455" y="600.5" font-size="44">人間</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central" font-size="39">
    <text x="293" y="374.2">成<tspan x="293" dy="42">長</tspan><tspan x="293" dy="42">期</tspan><tspan x="293" dy="42">間</tspan></text>
    <text x="347" y="342" transform="rotate(90 347 342)">（</text><text x="347" y="374">未<tspan x="347" dy="42">完</tspan><tspan x="347" dy="42">成</tspan><tspan x="347" dy="42">期</tspan></text><text x="347" y="532" transform="rotate(90 347 532)">）</text>
  </g>
  <g font-size="41" dominant-baseline="central">
    <text x="579" y="395.5" textLength="289" lengthAdjust="spacing">長成期の完成級</text>
    <text x="620" y="466.5" textLength="205" lengthAdjust="spacing">警告のみ言</text>
    <text y="466.5" text-anchor="middle"><tspan x="840.5">（</tspan><tspan x="868.5">創</tspan><tspan x="911">2</tspan><tspan x="931.5">:</tspan><tspan x="951">1</tspan><tspan x="973.5">7</tspan><tspan x="991.5">）</tspan></text>
  </g>

  <!-- 堕落 -->
  <line x1="457" y1="401" x2="672" y2="599" stroke="#EA0000" stroke-width="8"/>
  <polygon points="665,606.3 679.2,591.7 687.5,613" fill="#EA0000"/>
  <text y="626.5" font-size="44" text-anchor="middle" dominant-baseline="central"><tspan x="727">堕</tspan><tspan x="784.5">落</tspan></text>
</svg>
