  <g fill="#CF921C" stroke="currentColor" stroke-width="3">
    <ellipse cx="566" cy="165" rx="87" ry="26.5"/>
    <ellipse cx="565" cy="243.5" rx="87" ry="22.5"/>
    <ellipse cx="566" cy="318.5" rx="86.5" ry="22.5"/>
    <ellipse cx="565.5" cy="398" rx="87" ry="22.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="256.5" y="165" font-size="26" textLength="131" lengthAdjust="spacing">善なる個体</text>
    <text x="253" y="243.5" font-size="22" textLength="146" lengthAdjust="spacing">善なる氏族社会</text>
    <text x="251.5" y="320.5" font-size="22" textLength="147" lengthAdjust="spacing">善なる封建社会</text>
    <text x="250.5" y="398" font-size="26" textLength="129" lengthAdjust="spacing">善なる王国</text>
    <text x="566" y="165" font-size="24" textLength="142" lengthAdjust="spacing">原始共同社会</text>
    <text x="565.5" y="243.5" font-size="26" textLength="105" lengthAdjust="spacing">氏族社会</text>
    <text x="566" y="318" font-size="28" textLength="116" lengthAdjust="spacing">封建社会</text>
    <text x="565.5" y="398" font-size="26" textLength="105" lengthAdjust="spacing">君主社会</text>
  </g>

  <!-- 括弧 -->
  <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M353,146.5 L362.5,153.5 V404.5 L352.5,414"/>
    <path d="M467,145.5 L458.5,154 V406 L468.5,414.5"/>
