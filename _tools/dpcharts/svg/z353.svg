<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>3. 墓から死体がよみがえる</title>

  <text x="51.5" y="53" font-size="46" dominant-baseline="central">3.</text>
  <text x="109" y="52" font-size="50" dominant-baseline="central" textLength="551" lengthAdjust="spacing">墓から死体がよみがえる</text>
  <line x1="109" y1="82.5" x2="660" y2="82.5" stroke="currentColor" stroke-width="4"/>
  <text y="63" font-size="39" dominant-baseline="central"><tspan x="680.5" textLength="198.5" lengthAdjust="spacingAndGlyphs">【テサロニケⅠ </tspan><tspan x="879" textLength="75" lengthAdjust="spacingAndGlyphs">4:16】</tspan></text>

  <!-- ● 墓が開け、… -->
  <circle cx="229.5" cy="204.5" r="11.75"/>
  <g font-size="44.5" font-weight="400" dominant-baseline="central">
    <text y="205.5"><tspan x="254" textLength="179" lengthAdjust="spacing">墓が開け</tspan><tspan x="436">、</tspan><tspan x="484" textLength="594" lengthAdjust="spacing">眠っている聖徒たちの死体が</tspan></text>
    <text x="254" y="260" textLength="225" lengthAdjust="spacing">生き返った</text>
    <text y="266" font-size="37"><tspan x="827.5" textLength="136.5" lengthAdjust="spacingAndGlyphs">(マタイ </tspan><tspan x="964" textLength="112" lengthAdjust="spacingAndGlyphs">27:52)</tspan></text>
  </g>

  <!-- 結論 -->
  <rect x="265.75" y="333" width="759" height="233" rx="14" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g fill="#111">
    <circle cx="307.5" cy="380.5" r="9"/>
    <circle cx="307.5" cy="523" r="9"/>
  </g>
  <line x1="384" y1="523" x2="445.5" y2="523" stroke="#111" stroke-width="4.5"/>
  <g dominant-baseline="central" fill="#111">
    <g font-size="41">
      <text x="331" y="378.5" textLength="664" lengthAdjust="spacing">旧約時代の霊人たちが再臨したのを</text>
      <text x="329" y="434.5" textLength="290" lengthAdjust="spacing">霊的に見て記録</text>
    </g>
    <text y="522.5" font-size="43"><tspan x="328.5">墓 </tspan><tspan x="461" textLength="435" lengthAdjust="spacing">霊形体級の霊人の世界</tspan></text>
  </g>
</svg>
