<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ノアの家庭を中心とする復帰摂理</title>

  <!-- 箱 -->
  <g stroke="currentColor" stroke-width="2.2">
    <rect x="162" y="30" width="503" height="49" fill="#CDF8F7"/>
    <rect x="252.5" y="134" width="320.5" height="55" fill="#CDF8F7"/>
    <rect x="267" y="244.5" width="288.5" height="55.5" fill="#fff" class="paper"/>
    <rect x="265" y="352" width="293" height="52" fill="#fff" class="paper"/>
  </g>
  <g font-size="31" dominant-baseline="central">
    <text x="179" y="55" textLength="470" lengthAdjust="spacing" fill="#111">ノアの家庭を中心とする復帰摂理</text>
    <text x="272" y="162.5" textLength="281" lengthAdjust="spacing" fill="#111">メシヤのための基台</text>
    <text x="338" y="272.5" font-size="30" textLength="148" lengthAdjust="spacing">実体基台</text>
    <text x="325" y="378.5" font-size="30" textLength="173" lengthAdjust="spacing">信仰基台</text>
  </g>

  <!-- 上向きの矢印・＝・＋ -->
  <polygon points="411,89.5 421,105 414.5,105 414.5,123.5 406.5,123.5 406.5,105 401.5,105" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="5">
    <line x1="402" y1="203" x2="402" y2="233.5"/>
    <line x1="417" y1="203" x2="417" y2="233.5"/>
    <line x1="409.5" y1="308" x2="409.5" y2="342.5" stroke-width="6"/>
    <line x1="393" y1="325" x2="426.5" y2="325"/>
  </g>
</svg>
