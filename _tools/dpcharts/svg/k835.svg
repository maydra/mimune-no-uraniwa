<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>マタイ 21:33～43『実を結ぶ他の国と民族に与える』　神の遺業（ぶどう園）</title>

  <g font-size="24" dominant-baseline="central">
    <text x="131" y="32.5" textLength="211" lengthAdjust="spacingAndGlyphs">マタイ 21:33 ～ 43</text>
    <text x="219" y="64" textLength="391" lengthAdjust="spacing">『実を結ぶ他の国と民族に与える』</text>
  </g>

  <!-- 神の遺業（ぶどう園） -->
  <ellipse cx="410.5" cy="312.5" rx="255.5" ry="101.5" fill="#FCE5E3" stroke="currentColor" stroke-width="2.5"/>

  <!-- 神から下への矢印（地の上） -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="366" y1="154" x2="344.5" y2="198.1"/>
    <line x1="452" y1="154" x2="473.5" y2="198.1"/>
  </g>
  <g fill="currentColor">
    <polygon points="337.5,212.5 352.1,201.8 336.9,194.4"/>
    <polygon points="480.5,212.5 481.1,194.4 465.9,201.8"/>
  </g>

  <!-- 神（主人） -->
  <ellipse cx="411.5" cy="120" rx="80.5" ry="35" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="410.5" y="105" font-size="36">神</text>
    <text y="140" font-size="25"><tspan x="367">(</tspan><tspan x="411">主人</tspan><tspan x="452">)</tspan></text>
  </g>

  <g font-size="23" text-anchor="middle" dominant-baseline="central">
    <text x="288.5" y="173" textLength="69" lengthAdjust="spacing">イエス</text>
    <text x="286" y="200.5" font-size="22" textLength="57" lengthAdjust="spacing">(息子)</text>
    <text x="524.5" y="171.5" textLength="71" lengthAdjust="spacing">預言者</text>
    <text x="524.5" y="200.5" font-size="22" textLength="36" lengthAdjust="spacing">(僕)</text>
  </g>

  <!-- 面の中 -->
  <g fill="#111" text-anchor="middle" dominant-baseline="central">
    <text x="411" y="235" font-size="26" textLength="104" lengthAdjust="spacing">神の遺業</text>
    <text x="411" y="264" font-size="24" textLength="111" lengthAdjust="spacing">(ぶどう園)</text>
    <text x="296.5" y="342.5" font-size="26" textLength="209" lengthAdjust="spacing">再臨主を迎える民</text>
    <text x="296" y="372.5" font-size="24" textLength="89" lengthAdjust="spacing">(異邦人)</text>
    <text x="542.5" y="342.5" font-size="26" textLength="182" lengthAdjust="spacing">イスラエル選民</text>
    <text x="542" y="369.5" font-size="24" textLength="63" lengthAdjust="spacing">(農夫)</text>
  </g>
  <g stroke="#111" stroke-width="4.5">
    <line x1="348" y1="265.5" x2="301.4" y2="314.3"/>
    <line x1="488.5" y1="265.5" x2="532.3" y2="313.6"/>
  </g>
  <g fill="#111">
    <polygon points="294.5,321 305.7,318.5 297.1,310.1"/>
    <polygon points="539,321 536.7,309.6 527.9,317.6"/>
  </g>
  <!-- × -->
  <g stroke="#111" stroke-width="3.5" stroke-linecap="round">
    <line x1="497.5" y1="291" x2="524" y2="289"/>
    <line x1="513.5" y1="276.5" x2="508" y2="304"/>
  </g>
</svg>
