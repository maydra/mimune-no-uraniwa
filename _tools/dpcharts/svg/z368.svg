<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③創造本然の価値性復帰</title>

  <text x="53" y="58.5" font-size="48" dominant-baseline="central" textLength="557" lengthAdjust="spacing">③創造本然の価値性復帰</text>

  <!-- 2つの箱と、上にかかる楕円の札 -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="207.5" y="197.5" width="428" height="280.5" fill="#fff" class="paper"/>
    <rect x="667.5" y="197.5" width="428" height="280.5" fill="#fff" class="paper"/>
    <ellipse cx="421.5" cy="197.5" rx="92" ry="63" fill="#FCE5E3"/>
    <ellipse cx="881.5" cy="191" rx="89" ry="44" fill="#CF921C"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="46">
      <text x="421.5" y="172">人間の</text>
      <text x="421.5" y="223">価値</text>
    </g>
