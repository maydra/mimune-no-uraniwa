<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>③ 死体のサタン分立</title>
  <text x="48.5" y="37" font-size="29" text-anchor="middle" dominant-baseline="central">③</text>
  <text x="69" y="37" font-size="29" dominant-baseline="central" textLength="232" lengthAdjust="spacing">死体のサタン分立</text>
  <line x1="69" y1="54" x2="301" y2="54" stroke="currentColor" stroke-width="2.2"/>

  <!-- 縦の矢印（楕円の下に描く） -->
  <polygon points="208,140 214,140 214,165 218.5,165 211,177 203.5,165 208,165" fill="#8C949A"/>
  <polygon points="208,222 214,222 214,251 218.5,251 211,263 203.5,251 208,251" fill="#8C949A"/>
  <polygon points="208,306 214,306 214,334 218.5,334 211,346 203.5,334 208,334" fill="#8C949A"/>

  <!-- ア・エ → ヤコブ → モーセ → イエス -->
  <ellipse cx="211" cy="114.5" rx="62.5" ry="28.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <path d="M210,86 C184,89.5 182,107.5 211,114.5 C234,121 234,138.5 210,143" fill="none" stroke="#111" stroke-width="2.2"/>
  <text x="175" y="114.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">ア</text>
  <text x="247" y="114.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">エ</text>
  <ellipse cx="211" cy="202" rx="45" ry="23" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="211.5" y="202" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="72" lengthAdjust="spacingAndGlyphs">ヤコブ</text>
  <ellipse cx="210.5" cy="287" rx="45.5" ry="23" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="211" y="286.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="77" lengthAdjust="spacingAndGlyphs">モーセ</text>
  <ellipse cx="211" cy="372" rx="50" ry="24" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="211" y="372.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="77" lengthAdjust="spacingAndGlyphs">イエス</text>

  <!-- 説明 -->
  <text x="287" y="111.5" font-size="28" dominant-baseline="central" textLength="318" lengthAdjust="spacing">死体までもサタンの侵入</text>
  <text x="287" y="200.5" font-size="28" dominant-baseline="central" textLength="381" lengthAdjust="spacing">死体に、40 日間防腐剤を塗る</text>
  <text x="287" y="284.5" font-size="28" dominant-baseline="central" textLength="344" lengthAdjust="spacing">死体をもってサタンと闘う</text>
  <text x="287" y="370.5" font-size="28" dominant-baseline="central" textLength="403" lengthAdjust="spacing">死体をめぐって、問題が起きる</text>
</svg>
