<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>火の蛇と青銅の蛇</title>

  <!-- 題 -->
  <text x="34" y="37.5" font-size="31" dominant-baseline="central" textLength="249" lengthAdjust="spacing">火の蛇と青銅の蛇</text>
  <line x1="32" y1="56.5" x2="284" y2="56.5" stroke="currentColor" stroke-width="2"/>

  <!-- 枝分かれの線（楕円の下に描く） -->
  <g stroke="#8C949A" stroke-width="5.8">
    <line x1="264" y1="133.5" x2="312.5" y2="117.5"/>
    <line x1="264" y1="173.3" x2="310.5" y2="186.6"/>
    <line x1="260" y1="315.7" x2="312" y2="302.2"/>
    <line x1="260" y1="352.9" x2="308.5" y2="370.4"/>
  </g>

  <!-- イスラエル民族・ユダヤ民族 -->
  <g fill="#F86D42" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="207.3" cy="153.5" rx="69.8" ry="41.5"/>
    <ellipse cx="207.5" cy="334.5" rx="70" ry="31.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="205" y="142.5" font-size="25" textLength="114" lengthAdjust="spacing">イスラエル</text>
    <text x="186" y="171.5" font-size="25">民</text>
    <text x="225" y="171.5" font-size="25">族</text>
    <text x="206.5" y="334" font-size="24" textLength="116" lengthAdjust="spacing">ユダヤ民族</text>
  </g>

  <!-- 下向きの矢印 -->
  <polygon points="198,235.5 218,235.5 218,250.5 236,250.5 208,266.5 180,250.5 198,250.5" fill="#8C949A" stroke="currentColor" stroke-width="1.2"/>

  <!-- 横の矢印 -->
  <g fill="#8C949A">
    <polygon points="381.5,114.5 407.5,114.5 407.5,111 417.5,117 407.5,123 407.5,119.5 381.5,119.5"/>
    <polygon points="381.5,187 407.5,187 407.5,183.5 417,189.5 407.5,195.5 407.5,192 381.5,192"/>
    <polygon points="385.5,301 410.5,301 410.5,297.5 421,303.5 410.5,309.5 410.5,306 385.5,306"/>
    <polygon points="509.5,369 535.5,369 535.5,365 544.5,371.5 535.5,377.5 535.5,374 509.5,374"/>
  </g>

  <g font-size="28" dominant-baseline="central">
    <text x="318" y="118" textLength="55" lengthAdjust="spacing">不信</text>
    <text x="431" y="118" textLength="256" lengthAdjust="spacing">火の蛇で死ぬように</text>
    <text x="431" y="152" textLength="111" lengthAdjust="spacing">せられる</text>
    <text x="317" y="189" textLength="53" lengthAdjust="spacing">悔い</text>
    <text x="430" y="189" textLength="268" lengthAdjust="spacing">青銅の蛇を仰いで見る</text>
    <text x="318" y="225.5" textLength="78" lengthAdjust="spacing">改める</text>
    <text x="430" y="225.5" textLength="112" lengthAdjust="spacing">救われる</text>
    <text x="318" y="303" textLength="56" lengthAdjust="spacing">不信</text>
    <text x="431" y="303" textLength="199" lengthAdjust="spacing">サタンに手渡す</text>
    <text x="318" y="370.5" textLength="141" lengthAdjust="spacing">悔い改める</text>
    <text x="461" y="370.5">、</text>
    <text x="557" y="370.5" textLength="100" lengthAdjust="spacing">救われる</text>
    <text x="319" y="404.5" textLength="198" lengthAdjust="spacing">十字架を信ずる</text>
  </g>
</svg>
