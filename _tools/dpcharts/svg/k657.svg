<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 宗教改革（Reformation）</title>

  <text y="38.5" font-size="30" dominant-baseline="central"><tspan x="36">Ⅱ</tspan><tspan x="61">.</tspan></text>
  <text x="82.8" y="38.5" font-size="31" dominant-baseline="central" textLength="125" lengthAdjust="spacing">宗教改革</text>
  <text x="214" y="39" font-size="26" dominant-baseline="central" textLength="166" lengthAdjust="spacingAndGlyphs">(Reformation)</text>
  <line x1="82" y1="57" x2="207" y2="57" stroke="currentColor" stroke-width="2.6"/>

  <!-- 灰色の矢印（楕円より先に描く） -->
  <polygon points="204.6,232 212.2,232 212.2,344 218.4,344 208.5,360.5 198.6,344 204.6,344" fill="#8C949A"/>

  <!-- 中世のキリスト教信徒 -->
  <ellipse cx="208.5" cy="189.5" rx="85.3" ry="46.3" fill="#FCE5E3" stroke="currentColor" stroke-width="2.6"/>
  <g fill="#111" dominant-baseline="central">
    <text x="166" y="167" font-size="29" textLength="86" lengthAdjust="spacing">中世の</text>
    <text x="138" y="201" font-size="27" textLength="142" lengthAdjust="spacingAndGlyphs">キリスト教信徒</text>
  </g>

  <!-- 法王政治に反抗 -->
  <rect x="126.5" y="366.5" width="237" height="44.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="142.8" y="389" font-size="29" dominant-baseline="central" fill="#111" textLength="203" lengthAdjust="spacing">法王政治に反抗</text>

  <!-- 箇条の箱 -->
  <rect x="304.8" y="97.3" width="383" height="231.4" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g>
    <circle cx="331" cy="126.5" r="7.6"/>
    <circle cx="330.5" cy="173" r="7.6"/>
    <circle cx="330.5" cy="220.5" r="7.6"/>
    <circle cx="330.5" cy="268" r="7.6"/>
  </g>
  <g font-size="29" dominant-baseline="central">
    <text x="347.8" y="125.5" textLength="289" lengthAdjust="spacing">宗教儀式と規範に反抗</text>
    <text x="347.8" y="172.5" textLength="318" lengthAdjust="spacing">封建制度と法王権に対抗</text>
    <text x="348.8" y="220.5" textLength="288" lengthAdjust="spacing">固陋な信仰生活に反発</text>
    <text y="267.5"><tspan x="347.8" textLength="115" lengthAdjust="spacing">遁世的、</tspan><tspan x="462.8" textLength="115" lengthAdjust="spacing">他界的、</tspan><tspan x="578.8" textLength="86" lengthAdjust="spacing">禁欲的</tspan></text>
    <text x="347.8" y="301.5" textLength="202" lengthAdjust="spacing">信仰態度を排撃</text>
  </g>
</svg>
