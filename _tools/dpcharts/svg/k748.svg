<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ドイツ・日本・イタリア</title>

  <!-- 国の札 -->
  <g fill="#CF921C" stroke="currentColor" stroke-width="2.5">
    <rect x="137.5" y="79.5" width="112" height="41"/>
    <rect x="137.5" y="210.5" width="111.5" height="41"/>
    <rect x="136.5" y="330.5" width="111.5" height="42"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="196" y="99.5" textLength="81" lengthAdjust="spacing">ドイツ</text>
    <text x="195" y="231.5" textLength="53" lengthAdjust="spacing">日本</text>
    <text x="191.5" y="352.5" textLength="100" lengthAdjust="spacingAndGlyphs">イタリア</text>
  </g>

  <!-- 点 -->
  <g>
    <circle cx="270.5" cy="59.5" r="6"/>
    <circle cx="270.5" cy="97.5" r="6"/>
    <circle cx="270.5" cy="134" r="6"/>
    <circle cx="270.5" cy="208.5" r="6"/>
    <circle cx="270.5" cy="247.5" r="6"/>
    <circle cx="270.5" cy="330" r="6"/>
    <circle cx="270.5" cy="369.5" r="6"/>
  </g>

  <g font-size="27" dominant-baseline="central">
    <text x="290" y="60.5" textLength="110" lengthAdjust="spacing">自由剥奪</text>
    <text x="401" y="60.5">、</text>
    <text x="434" y="60.5" textLength="110" lengthAdjust="spacing">思想統制</text>
    <text x="287" y="97" textLength="229" lengthAdjust="spacing">ゲルマン民族宗教</text>
    <text x="290" y="134" textLength="139" lengthAdjust="spacing">ヒットラー</text>
    <text x="439" y="134" textLength="41" lengthAdjust="spacingAndGlyphs">600</text>
    <text x="490" y="134" textLength="200" lengthAdjust="spacing">万ユダヤ人虐殺</text>
    <text x="287" y="208.5" textLength="170" lengthAdjust="spacing">神社参拝強制</text>
    <text x="288" y="247.5" textLength="315" lengthAdjust="spacing">キリスト教信徒たち投獄</text>
    <text x="603" y="247.5">、</text>
    <text x="634" y="247.5" textLength="56" lengthAdjust="spacing">殺傷</text>
    <text x="288" y="330.5" textLength="142" lengthAdjust="spacing">旧教を国教</text>
    <text x="287" y="369.5" textLength="258" lengthAdjust="spacing">神の復帰摂理に逆行</text>
  </g>
</svg>
