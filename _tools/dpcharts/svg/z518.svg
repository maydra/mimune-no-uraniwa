<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>家庭復帰・民族復帰・世界復帰と 144 数</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="477.5,128 485.5,128 485.5,179 493,179 481.5,198.5 470,179 477.5,179"/>
    <polygon points="477.5,290 485.5,290 485.5,341 493,341 481.5,360.5 470,341 477.5,341"/>
    <polygon points="477.5,451 485.5,451 485.5,500 493.5,500 482,519.5 470.5,500 477.5,500"/>
    <polygon points="753,398.5 807,398.5 807,392 822.5,402.5 807,413 807,406.5 753,406.5"/>
    <polygon points="937,536.5 991,536.5 991,530 1006.5,540.5 991,551 991,544.5 937,544.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="482.5" cy="85" rx="85" ry="42.5" fill="#DCC4C4"/>
    <ellipse cx="482.5" cy="244" rx="85" ry="42.5" fill="#DCC4C4"/>
    <ellipse cx="480" cy="406" rx="84.5" ry="42" fill="#F8F28F"/>
    <ellipse cx="482" cy="565" rx="85.5" ry="43" fill="#F8F28F"/>
