  <circle cx="243" cy="315" r="11.5"/>
  <circle cx="703" cy="315" r="11.5"/>
  <circle cx="703" cy="384.5" r="11.5"/>
  <g font-size="44" dominant-baseline="central">
    <text x="264" y="316" textLength="136" lengthAdjust="spacing">各個性</text>
    <text x="264" y="371.5" textLength="320" lengthAdjust="spacing">尊い天宙的価値</text>
    <text x="722" y="316" textLength="354" lengthAdjust="spacing">民主主義思想高潮</text>
