<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>再創造のための復帰摂理</title>

  <!-- 題 -->
  <text x="33" y="37.5" font-size="31" dominant-baseline="central" textLength="348" lengthAdjust="spacing">再創造のための復帰摂理</text>
  <line x1="33" y1="56.5" x2="381" y2="56.5" stroke="currentColor" stroke-width="2.5"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="182.5,287 182.5,239.5 176,239.5 187,221 198,239.5 191.5,239.5 191.5,287"/>
    <polygon points="308.5,287 308.5,240 302,240 313,223 324,240 317.5,240 317.5,287"/>
    <polygon points="236,238.5 245,238.5 245,228.5 257.5,246.5 245,264.5 245,254.5 236,254.5"/>
    <polygon points="355,238.5 363,238.5 363,228.5 375.5,246.5 363,264.5 363,254.5 355,254.5"/>
    <polygon points="512,192 512,164.5 505.5,164.5 516.5,145 527.5,164.5 521,164.5 521,192"/>
    <polygon points="511,309 511,267 504.5,267 515.5,248 526.5,267 520,267 520,309"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="187.5" cy="172.5" rx="46" ry="31" fill="#F98AEE"/>
    <ellipse cx="313" cy="172.5" rx="46.5" ry="31" fill="#F98AEE"/>
    <ellipse cx="187.5" cy="318" rx="46" ry="30.5" fill="#A0F08A"/>
    <ellipse cx="313.5" cy="318" rx="46" ry="30.5" fill="#A0F08A"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="187.5" y="172.5" textLength="80" lengthAdjust="spacingAndGlyphs">霊人体</text>
    <text x="313.5" y="172.5" textLength="56" lengthAdjust="spacing">内的</text>
    <text x="187" y="318" textLength="56" lengthAdjust="spacing">肉身</text>
    <text x="313.5" y="317.5" textLength="56" lengthAdjust="spacing">外的</text>
  </g>

  <!-- 創造・再創造摂理 -->
  <g font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="187" y="376" textLength="52" lengthAdjust="spacing">創造</text>
    <text x="316" y="376" textLength="132" lengthAdjust="spacing">再創造摂理</text>
  </g>

  <!-- 献祭とメシヤのための基台 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="375" y="91" width="295" height="48"/>
    <rect x="410" y="192" width="219" height="49"/>
    <rect x="410" y="309" width="218" height="48"/>
  </g>
  <g font-size="28.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="524" y="115.5" textLength="258" lengthAdjust="spacing">メシヤのための基台</text>
    <text x="521" y="216.5" textLength="172" lengthAdjust="spacing">内的実体献祭</text>
    <text x="520.5" y="333.5" textLength="172" lengthAdjust="spacing">外的象徴献祭</text>
  </g>
</svg>
