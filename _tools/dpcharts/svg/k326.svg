<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>三次幕屋のための基台：×</title>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="177.5,97.5 184.5,109.5 180.5,109.5 180.5,126 173.5,126 173.5,109.5 170.5,109.5"/>
    <polygon points="233.5,149 246.5,141.5 246.5,145.5 555,145.5 555,152.5 246.5,152.5 246.5,156.5"/>
    <polygon points="442,200.5 451.5,200.5 451.5,195.5 459,207 451.5,218.5 451.5,213.5 442,213.5"/>
    <polygon points="219,327.5 228.5,327.5 228.5,322.5 236.5,333 228.5,342.5 228.5,339.5 219,339.5"/>
  </g>
  <path d="M377.5,134 L404.5,164 M404.5,134 L377.5,164" stroke="currentColor" stroke-width="5" fill="none"/>

  <!-- 神 -->
  <circle cx="177" cy="65" r="27.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="175.5" y="65.5" font-size="32" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- モーセ・イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="177" cy="149" rx="50.5" ry="24" fill="#F8F28F"/>
    <ellipse cx="623.5" cy="149" rx="69" ry="35.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="175" y="149.5" font-size="27" textLength="78" lengthAdjust="spacing">モーセ</text>
    <text x="624" y="138.5" font-size="26" textLength="117" lengthAdjust="spacing">イスラエル</text>
    <text x="624" y="167.5" font-size="26" textLength="52" lengthAdjust="spacing">民族</text>
  </g>

  <!-- 箇条 -->
  <circle cx="199.5" cy="206.5" r="6"/>
  <circle cx="199" cy="251" r="6"/>
  <circle cx="198.5" cy="295.5" r="6"/>
  <g font-size="26" dominant-baseline="central">
    <text x="218" y="206.5" textLength="26" lengthAdjust="spacingAndGlyphs">10</text>
    <text x="246" y="206.5" textLength="183" lengthAdjust="spacing">名不信仰の報告</text>
    <text x="470" y="206.5" textLength="104" lengthAdjust="spacing">民族不信</text>
    <text x="216" y="251" textLength="14" lengthAdjust="spacingAndGlyphs">2</text>
    <text x="231" y="251" textLength="158" lengthAdjust="spacing">名信仰の報告</text>
    <text x="217" y="295.5" textLength="154" lengthAdjust="spacing">エホバの怒り</text>
  </g>
  <text x="395" y="251" font-size="24" dominant-baseline="central" textLength="211" lengthAdjust="spacingAndGlyphs">(ヨシュア、カレブ)</text>
  <text x="380" y="295.5" font-size="22" dominant-baseline="central" textLength="176" lengthAdjust="spacing">(民数14:31～34)</text>
  <g font-size="24" dominant-baseline="central">
    <text x="244" y="333" textLength="189" lengthAdjust="spacingAndGlyphs">イスラエル民族の</text>
    <text x="438" y="333" textLength="24" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="468" y="333" textLength="213" lengthAdjust="spacingAndGlyphs">年荒野で羊飼となる</text>
  </g>

  <!-- 三次幕屋のための基台：× -->
  <rect x="218.5" y="364.5" width="382" height="45" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="29" dominant-baseline="central" fill="#111">
    <text x="237" y="388" textLength="288" lengthAdjust="spacing">三次幕屋のための基台</text>
    <text x="540" y="388" text-anchor="middle">：</text>
  </g>
  <path d="M560,379 L577,397 M577,379 L560,397" stroke="#111" stroke-width="5" fill="none"/>
</svg>
