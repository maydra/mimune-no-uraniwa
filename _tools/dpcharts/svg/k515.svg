<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. 南北王朝分立時代 400 年</title>

  <!-- 題 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text y="39" font-size="30"><tspan x="54.5" textLength="38" lengthAdjust="spacingAndGlyphs">Ⅳ.</tspan><tspan x="208" textLength="253" lengthAdjust="spacing">南北王朝分立時代</tspan><tspan x="365" textLength="49" lengthAdjust="spacingAndGlyphs">400</tspan><tspan x="412.5">年</tspan></text>
  </g>
  <line x1="81" y1="58" x2="429" y2="58" stroke="currentColor" stroke-width="2.2"/>

  <!-- 年数の柱 -->
  <g>
    <rect x="245" y="122" width="5.5" height="202.5"/>
    <rect x="250.5" y="123" width="10.5" height="200.5" fill="#A0F08A"/>
    <path d="M234,123 H267 M232,323.5 H267" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <rect x="405" y="122" width="5.5" height="202.5"/>
    <rect x="410.5" y="123" width="10.5" height="200.5" fill="#A0F08A"/>
    <path d="M395,123 H428 M393,323.5 H428" fill="none" stroke="currentColor" stroke-width="2.2"/>
  </g>

  <!-- 人物と札 -->
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="182.5" cy="121" rx="52.5" ry="19.5" fill="#F8F28F"/>
    <ellipse cx="343.5" cy="121" rx="52.5" ry="19.5" fill="#F8F28F"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="182.5" textLength="79.6" lengthAdjust="spacing" y="122" font-size="26" fill="#111">ヤコブ</text>
    <text x="343.5" textLength="87.4" lengthAdjust="spacing" y="121.5" font-size="24" fill="#111">ソロモン</text>
  </g>
  <g stroke="currentColor" stroke-width="2.6">
    <rect x="131.5" y="299" width="101.5" height="96.5" fill="#fff" class="paper"/>
    <rect x="278.5" y="299" width="115.5" height="97.5" fill="#fff" class="paper"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text y="162" font-size="20" font-weight="400"><tspan x="128">(</tspan><tspan x="178.5" textLength="95" lengthAdjust="spacingAndGlyphs">長子の嗣業</tspan><tspan x="229.5">)</tspan></text>
    <text x="223.5" textLength="31.7" lengthAdjust="spacingAndGlyphs" y="218" font-size="27">40</text>
    <text x="376.5" textLength="45.7" lengthAdjust="spacingAndGlyphs" y="218" font-size="27">400</text>
    <text x="177.5" textLength="71.4" lengthAdjust="spacing" y="319" font-size="24">ヤコブ</text>
    <text x="176" textLength="70.4" lengthAdjust="spacing" y="348" font-size="24">ハラン</text>
    <text x="153.5" y="377" font-size="24">に</text>
    <text x="334.5" textLength="101.2" lengthAdjust="spacingAndGlyphs" y="320.5" font-size="22">ユダヤ民族</text>
    <text x="326" textLength="84.2" lengthAdjust="spacing" y="347.5" font-size="22">バビロン</text>
    <text x="294.5" y="376" font-size="22">に</text>
  </g>

  <!-- 説明の箱 -->
  <rect x="442" y="92" width="254" height="274.5" rx="6" fill="#fff" class="paper"/>
  <path d="M442,142 V98 Q442,92 448,92 H690 Q696,92 696,98 V142 Z" fill="#CDF8F7"/>
  <line x1="442" y1="142" x2="696" y2="142" stroke="currentColor" stroke-width="2.6"/>
  <rect x="442" y="92" width="254" height="274.5" rx="6" fill="none" stroke="currentColor" stroke-width="2.6"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="569.5" textLength="231.8" lengthAdjust="spacing" y="118" font-size="28" fill="#111">南北王朝分立時代</text>
  </g>
  <g>
    <circle cx="464.5" cy="185.5" r="7"/>
    <circle cx="464.5" cy="301" r="7"/>
  </g>
  <path d="M466,207 Q450,232.5 466,258 M677,207 Q693,232.5 677,258" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <g text-anchor="middle" dominant-baseline="central" font-weight="400">
    <text x="569.5" textLength="183.6" lengthAdjust="spacing" y="185.5" font-size="26">神殿建設の理想</text>
    <text y="219" font-size="22"><tspan x="498.5" textLength="63.2" lengthAdjust="spacing">モーセ</tspan><tspan x="548" textLength="24.2" lengthAdjust="spacingAndGlyphs">40</tspan><tspan x="621" textLength="108.2" lengthAdjust="spacing">日断食期間</tspan></text>
    <text x="570.5" textLength="95.3" lengthAdjust="spacing" y="247" font-size="23">横的復帰</text>
    <text x="583.5" textLength="209.6" lengthAdjust="spacing" y="301" font-size="26">サウル王の不信で</text>
    <text x="505" textLength="52.6" lengthAdjust="spacing" y="330" font-size="26">失敗</text>
  </g>
</svg>
