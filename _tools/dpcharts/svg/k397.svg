<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第二の試練の答え　『神を試みてはならない』（マタイ 4:7）</title>

  <!-- 答え -->
  <rect x="124.5" y="22.5" width="66" height="39" rx="5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="157.5" y="42.5" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="54" lengthAdjust="spacing">答え</text>
  <g font-size="26" font-weight="400" dominant-baseline="central">
    <text y="43.5"><tspan x="199">『</tspan><tspan x="216" textLength="268" lengthAdjust="spacing">神を試みてはならない</tspan><tspan x="484">』</tspan></text>
    <text x="503" y="43.5" textLength="124" lengthAdjust="spacing">(マタイ 4:7)</text>
  </g>

  <!-- 神の体であられるイエスを試練してはならない -->
  <rect x="149.5" y="86" width="521" height="42.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="159" y="107" font-size="24" dominant-baseline="central" textLength="504" lengthAdjust="spacing">神の体であられるイエスを試練してはならない</text>

  <!-- 第二の試練：勝利 -->
  <rect x="294.5" y="145" width="228" height="37" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="25" dominant-baseline="central" fill="#111">
    <text x="308" y="163.5" textLength="126" lengthAdjust="spacing">第二の試練</text>
    <text x="446.5" y="163.5" text-anchor="middle">：</text>
    <text x="459" y="163.5" textLength="50" lengthAdjust="spacing">勝利</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="399.5,194 399.5,202 388.5,202 407.5,212.5 426.5,202 415.5,202 415.5,194"/>
    <polygon points="398.5,260 398.5,268 387.5,268 406.5,278.5 425.5,268 414.5,268 414.5,260"/>
    <polygon points="398.5,323 398.5,331 387.5,331 406.5,341.5 425.5,331 414.5,331 414.5,323"/>
  </g>

  <g font-size="28" dominant-baseline="central">
    <text x="279" y="235" textLength="261" lengthAdjust="spacing">人類の真の親イエス</text>
    <text x="220" y="300.5" textLength="377" lengthAdjust="spacing">信徒たちを子女の立場に復帰</text>
  </g>

  <!-- 第二祝福復帰の基台：造成 -->
  <rect x="232.5" y="352.5" width="348" height="42" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="249" y="373" textLength="238" lengthAdjust="spacing">第二祝福復帰の基台</text>
    <text x="498" y="373" text-anchor="middle">：</text>
    <text x="512" y="373" textLength="53" lengthAdjust="spacing">造成</text>
  </g>
</svg>
