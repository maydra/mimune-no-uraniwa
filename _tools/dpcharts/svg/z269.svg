<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 人間世界に対するサタンの活動</title>
  <defs>
    <marker id="z269-g" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <text x="61" y="57" font-size="48" dominant-baseline="central">Ⅱ.</text>
  <text x="127" y="57" font-size="48" dominant-baseline="central" textLength="700" lengthAdjust="spacing">人間世界に対するサタンの活動</text>
  <line x1="127" y1="87" x2="826" y2="87" stroke="currentColor" stroke-width="3.5"/>

  <!-- 地上と霊界の境 -->
  <line x1="298" y1="387" x2="980" y2="387" stroke="currentColor" stroke-width="5.5"/>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="378.75" cy="217" rx="56.75" ry="100.5" fill="#50403D"/>
    <ellipse cx="630.5" cy="217" rx="57" ry="100.5" fill="#CF921C"/>
    <ellipse cx="871" cy="284.25" rx="56.5" ry="100.25" fill="#F98AEE"/>
    <ellipse cx="871" cy="488.25" rx="56.5" ry="99.75" fill="#A0F08A"/>
  </g>

  <!-- 縦書き（1字ずつ） -->
  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="50" fill="#fff">
      <text x="379.5" y="165">サ</text>
      <text x="378.5" y="219.5">タ</text>
      <text x="380.5" y="274.5">ン</text>
    </g>
    <g font-size="52" fill="#111">
      <text x="630" y="163">悪</text>
      <text x="630" y="217">霊</text>
      <text x="630" y="271">人</text>
      <text x="870.5" y="230">霊</text>
      <text x="870.5" y="285">人</text>
      <text x="870.5" y="338.5">体</text>
      <text x="872" y="460.5">肉</text>
      <text x="872" y="514">身</text>
    </g>
  </g>

  <!-- サタン ⇄ 悪霊人 ⇄ 霊人体 -->
  <g>
    <polygon points="461.5,195.5 531.5,195.5 531.5,189.5 552.5,200 531.5,210.5 531.5,204.5 461.5,204.5"/>
    <polygon points="553.5,221.5 481.5,221.5 481.5,215.5 461.5,225.5 481.5,235.5 481.5,229.5 553.5,229.5"/>
    <polygon points="713.1,192.7 772.2,229.1 775.4,224 790,246 763.8,242.8 767,237.7 707.9,201.3"/>
    <polygon points="790.1,273.6 729.3,233.9 732.6,228.9 706.5,225 720.6,247.3 723.9,242.3 784.7,282"/>
  </g>

  <!-- 霊人体と肉身の授受 -->
  <g stroke="#8C949A" stroke-width="7.5" fill="none" marker-end="url(#z269-g)">
    <path d="M805,430 Q793,388.75 803,360.5"/>
    <path d="M935,342 Q947.25,391 936.5,412"/>
  </g>

  <text x="776" y="629.5" font-size="46" dominant-baseline="central" textLength="195" lengthAdjust="spacing">地上人間</text>
</svg>
