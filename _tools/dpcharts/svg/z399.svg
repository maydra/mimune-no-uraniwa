<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 終末に際して我々がとるべき態度</title>
  <defs>
    <linearGradient id="z399-o" gradientUnits="userSpaceOnUse" x1="226.5" y1="0" x2="835" y2="0">
      <stop offset="0" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
  </defs>

  <text x="53" y="61" font-size="48" dominant-baseline="central">Ⅱ.</text>
  <text x="138" y="61" font-size="48" dominant-baseline="central" textLength="749" lengthAdjust="spacing">終末に際して我々がとるべき態度</text>
  <line x1="125" y1="89" x2="887" y2="89" stroke="currentColor" stroke-width="3.5"/>

  <!-- 古い時代の清算（白から橙）と新しい時代の摂理 -->
  <g stroke="currentColor" stroke-width="4">
    <polygon points="226.5,128 505.7,128 833,246.5 226.5,246.5" fill="url(#z399-o)"/>
    <polygon points="530.7,128 1076.5,128 1076.5,246.5 858,246.5" fill="#CDF8F7"/>
  </g>
  <g font-size="44" dominant-baseline="central" fill="#111">
    <text x="259" y="207" textLength="318" lengthAdjust="spacing">古い時代の清算</text>
    <text x="710" y="164.5">新しい時代の摂理</text>
  </g>

  <!-- 終末期の矢印 -->
  <g stroke="currentColor">
    <line x1="500.5" y1="264.5" x2="500.5" y2="314.5" stroke-width="6"/>
    <line x1="841" y1="264" x2="841" y2="314.5" stroke-width="7"/>
    <line x1="530" y1="285.5" x2="810" y2="285.5" stroke-width="10"/>
  </g>
  <polygon points="503.5,285.5 532.5,269.5 532.5,301.5"/>
  <polygon points="835,285.5 808,270 808,301"/>

  <g font-size="49" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="668" y="329.5">終末期</text>
    <text x="668" y="387.5">創始期</text>
  </g>

  <g font-size="50" dominant-baseline="central">
    <text y="453"><tspan x="393" textLength="100" lengthAdjust="spacing">内的</tspan><tspan x="517" text-anchor="middle">：</tspan><tspan x="543" textLength="400" lengthAdjust="spacing">理念と思想の欠乏</tspan></text>
    <text y="515.5"><tspan x="393" textLength="100" lengthAdjust="spacing">外的</tspan><tspan x="517" text-anchor="middle">：</tspan><tspan x="543" textLength="250" lengthAdjust="spacing">軋轢と闘争</tspan></text>
  </g>

  <rect x="330.5" y="580" width="662" height="78.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="48" dominant-baseline="central" fill="#111">
    <text y="621"><tspan x="362" textLength="249" lengthAdjust="spacing">新しい時代</tspan><tspan x="635.5" text-anchor="middle">：</tspan><tspan x="663" textLength="298" lengthAdjust="spacing">善主権の中心</tspan></text>
  </g>
</svg>
