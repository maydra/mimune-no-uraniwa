<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>割礼の意義と種類</title>

  <!-- 括弧（灰色） -->
  <g fill="none" stroke="#8C949A" stroke-width="5.5" stroke-linejoin="miter">
    <path d="M273,88.5 H254.5 V185 H273"/>
    <path d="M233,137 H273"/>
    <path d="M273,256 H254 V352 H273"/>
    <path d="M232,304 H273"/>
  </g>

  <!-- 左の見出し -->
  <g font-size="28" dominant-baseline="central">
    <text x="142" y="134.5" textLength="82" lengthAdjust="spacing">割礼の</text>
    <text x="142" y="168.5" textLength="54" lengthAdjust="spacing">意義</text>
    <text x="142" y="304" textLength="82" lengthAdjust="spacing">割礼の</text>
    <text x="141" y="338.5" textLength="56" lengthAdjust="spacing">種類</text>
  </g>

  <!-- 意義 -->
  <g font-size="28" dominant-baseline="central">
    <text x="282" y="90" textLength="343" lengthAdjust="spacing">死亡の血を流すという表示</text>
    <text x="282" y="137.5" textLength="418" lengthAdjust="spacingAndGlyphs">男子の主管性を復帰するという表示</text>
    <text x="281" y="185" textLength="316" lengthAdjust="spacing">本然の子女の立場を復帰</text>
  </g>

  <!-- 種類 -->
  <g font-size="28" dominant-baseline="central">
    <text x="282" y="257" textLength="112" lengthAdjust="spacing">心の割礼</text>
    <text x="283" y="304" textLength="111" lengthAdjust="spacing">肉身割礼</text>
    <text x="282" y="352" textLength="112" lengthAdjust="spacing">万物割礼</text>
  </g>
  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="400" y="257.5" textLength="143" lengthAdjust="spacing">(申命 10:16)</text>
    <text x="400" y="304.5" textLength="116" lengthAdjust="spacing">(創 17:10)</text>
    <text x="400" y="352.5" textLength="143" lengthAdjust="spacing">(レビ 19:23)</text>
  </g>
</svg>
