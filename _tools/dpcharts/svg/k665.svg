<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>宗教改革と文芸復興から民主世界と共産世界へ</title>

  <!-- 灰色の矢印（楕円と箱より先に描く） -->
  <g fill="#8C949A">
    <polygon points="272.4,100.7 314.8,124.1 312.6,128.1 329,127.4 320.9,113.2 318.7,117.1 276.2,93.7"/>
    <polygon points="540,91.5 497.6,116.1 495.3,112.2 487.5,126.6 503.9,126.9 501.6,123 544,98.5"/>
    <polygon points="353.2,189.3 304.4,219.2 302,215.3 294.5,229.9 310.9,229.8 308.5,226 357.4,196.1"/>
    <polygon points="466.7,198.1 513.6,223.9 511.4,227.8 527.8,227.1 519.6,212.9 517.5,216.9 470.5,191.1"/>
    <polygon points="218,290 226,290 226,326.5 230.2,326.5 222,341.8 213.8,326.5 218,326.5"/>
    <polygon points="595,290 603,290 603,323.5 607.2,323.5 599,337.5 590.8,323.5 595,323.5"/>
    <polygon points="530,365 318.5,365 318.5,359.5 304.6,369 318.5,378.5 318.5,373 530,373"/>
  </g>

  <!-- 楕円 -->
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="214.5" cy="76.5" rx="76.1" ry="44.1" fill="#F8F28F"/>
    <ellipse cx="602" cy="75.5" rx="76.6" ry="44.1" fill="#F86D42"/>
    <ellipse cx="409.5" cy="161.5" rx="94.1" ry="50.1" fill="#fff" class="paper"/>
    <ellipse cx="222" cy="252" rx="78.6" ry="46.6" fill="#F8F28F"/>
    <ellipse cx="599" cy="251" rx="78.6" ry="46.6" fill="#F86D42"/>
  </g>

  <!-- 箱 -->
  <g stroke="currentColor" stroke-width="2.8">
    <rect x="147.4" y="344.9" width="148.4" height="48.4" fill="#F8F28F"/>
    <rect x="525.4" y="343.4" width="148.4" height="48.2" fill="#F86D42"/>
    <rect x="336.2" y="316.2" width="149.6" height="39.8" fill="#fff" class="paper" stroke-width="2.4"/>
  </g>

  <!-- 面の上の字 -->
  <g font-size="28" dominant-baseline="central" fill="#111">
    <text x="156.9" y="76.5" textLength="115" lengthAdjust="spacing">宗教改革</text>
    <text x="543.9" y="75" textLength="116" lengthAdjust="spacing">文芸復興</text>
    <text x="158.9" y="240" textLength="127" lengthAdjust="spacing">アベル型の</text>
    <text x="178.9" y="273.5" textLength="87" lengthAdjust="spacing">人生観</text>
    <text x="534.9" y="238.5" textLength="128" lengthAdjust="spacing">カイン型の</text>
    <text x="555.9" y="272.5" textLength="87" lengthAdjust="spacing">人生観</text>
    <text x="163.9" y="369.5" textLength="116" lengthAdjust="spacing">民主世界</text>
    <text x="541.9" y="367.5" textLength="116" lengthAdjust="spacing">共産世界</text>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="330.9" y="150.5" textLength="156" lengthAdjust="spacing">信教と思想の</text>
    <text x="383.9" y="184.5" textLength="53" lengthAdjust="spacing">自由</text>
  </g>

  <!-- 細字 -->
  <g font-weight="400" dominant-baseline="central">
    <text x="336.9" y="241.5" font-size="28" textLength="143" lengthAdjust="spacing">分裂と戦い</text>
    <text x="353.9" y="336" font-size="27" textLength="114" lengthAdjust="spacing">実体基台</text>
    <text x="384" y="394" font-size="25" textLength="52" lengthAdjust="spacing">屈伏</text>
  </g>
</svg>
