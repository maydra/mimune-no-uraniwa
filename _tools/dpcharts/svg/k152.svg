<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>鳩と羊と雌牛は何を象徴したのだろうか？　鳩：蘇生</title>

  <!-- 題 -->
  <text x="35" y="36.5" font-size="30" dominant-baseline="central" textLength="537" lengthAdjust="spacing">鳩と羊と雌牛は何を象徴したのだろうか？</text>
  <line x1="35" y1="55.5" x2="574" y2="55.5" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="26" dominant-baseline="central">
    <text x="140" y="104" textLength="156" lengthAdjust="spacing">三つの供え物</text>
    <text x="308.5" y="104" text-anchor="middle">：</text>
    <text x="322" y="104" textLength="339" lengthAdjust="spacing">三段階で完成する天宙を象徴</text>
  </g>

  <!-- 矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="300,174.5 474.5,174.5 474.5,168.5 490.5,178 474.5,187.5 474.5,181.5 300,181.5"/>
    <polygon points="335,293.5 474.5,293.5 474.5,288 490.5,297.5 474.5,307 474.5,301.5 335,301.5"/>
    <polygon points="386.5,253.5 386.5,238.5 370.5,238.5 398.5,216.5 426.5,238.5 409.5,238.5 409.5,253.5"/>
  </g>

  <!-- 鳩と神のみ霊 -->
  <ellipse cx="245" cy="178" rx="58" ry="36.5" fill="#DCC4C4" stroke="currentColor" stroke-width="2.2"/>
  <text x="244.5" y="176.5" font-size="32" text-anchor="middle" dominant-baseline="central" fill="#111">鳩</text>
  <ellipse cx="245" cy="299" rx="93" ry="55" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="245.5" y="277" textLength="109" lengthAdjust="spacing">神のみ霊</text>
    <text x="244.5" y="317" textLength="136" lengthAdjust="spacing">鳩のように</text>
  </g>

  <!-- 蘇生・イエス -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <rect x="502" y="156" width="121" height="45.5" rx="6"/>
    <rect x="502" y="274" width="121" height="46" rx="6"/>
  </g>
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="562.5" y="178" textLength="62" lengthAdjust="spacing">蘇生</text>
    <text x="562.5" y="297" textLength="92" lengthAdjust="spacing">イエス</text>
  </g>

  <!-- 下の字 -->
  <text x="348" y="318.5" font-size="21" dominant-baseline="central" textLength="114" lengthAdjust="spacingAndGlyphs">(マタイ 3:16)</text>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="548.5" y="359" font-size="28" textLength="201" lengthAdjust="spacing">蘇生摂理完成者</text>
    <text x="548.5" y="392" font-size="26" textLength="256" lengthAdjust="spacingAndGlyphs">（蘇生旧約摂理完成者）</text>
  </g>
</svg>
