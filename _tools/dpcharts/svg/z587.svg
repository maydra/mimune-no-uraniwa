<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の人間選択と人間の取り扱い（ロマ 9:15〜16、9:21）</title>

  <!-- ロマ 9:15〜16 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="250" y="119" font-size="44">ロマ</text>
    <text x="351.5" y="117.5" font-size="45" textLength="95" lengthAdjust="spacingAndGlyphs">9:15</text>
    <text x="424.5" y="117.5" font-size="45">〜</text>
    <text x="476.5" y="117.5" font-size="45" textLength="46" lengthAdjust="spacingAndGlyphs">16</text>
  </g>

  <g stroke="currentColor" stroke-width="4" fill="#fff" class="paper">
    <circle cx="241.25" cy="235" r="44.6"/>
    <circle cx="241.25" cy="525.5" r="44.6"/>
  </g>
  <g font-size="53" text-anchor="middle" dominant-baseline="central">
    <text x="240.5" y="234.5">神</text>
    <text x="240.5" y="525">神</text>
  </g>
  <text x="410" y="235" font-size="45" text-anchor="middle" dominant-baseline="central">の人間選択</text>

  <polyline points="627,192.5 548,237.5 627,282.5" fill="none" stroke="currentColor" stroke-width="8.5" stroke-linejoin="miter"/>
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="758.5" y="145.5">神の権能と</text>
    <text x="693" y="199.5">恩寵</text>
    <text x="784" y="282.5">人間の意志や</text>
    <text x="784" y="337">努力ではない</text>
  </g>

  <!-- ロマ 9:21 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="245.5" y="413" font-size="42">ロマ</text>
    <text x="335.5" y="411.5" font-size="41" textLength="84" lengthAdjust="spacingAndGlyphs">9:21</text>
  </g>

  <g font-size="46" text-anchor="middle" dominant-baseline="central">
    <text x="446.5" y="525.5" textLength="297" lengthAdjust="spacingAndGlyphs">の人間の取り扱い</text>
    <text x="901.5" y="526" textLength="411" lengthAdjust="spacingAndGlyphs">不平を言ってはならない</text>
  </g>
  <line x1="609" y1="525.5" x2="674" y2="525.5" stroke="currentColor" stroke-width="9"/>
</svg>
