<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天の側とサタン側　第二次世界大戦　三大祝福長成級完成型</title>

  <!-- 復帰の矢印（サタン側の楕円の下に描く） -->
  <polygon points="492,88 303.5,88 303.5,81 283,92.5 303.5,104.5 303.5,98 492,98" fill="#8C949A"/>

  <!-- 天の側・サタン側の楕円 -->
  <ellipse cx="210" cy="94" rx="70.5" ry="30.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="553.5" cy="93" rx="70" ry="30.5" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="210" y="94.5" textLength="83" lengthAdjust="spacing">天の側</text>
    <text x="553.5" y="93" textLength="112" lengthAdjust="spacing" fill="#fff">サタン側</text>
  </g>

  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="391" y="68.5" textLength="51" lengthAdjust="spacing">復帰</text>
    <text x="393" y="120" font-size="24" textLength="173" lengthAdjust="spacing">第二次世界大戦</text>
    <text x="206.5" y="153" textLength="102" lengthAdjust="spacing">三大祝福</text>
    <text x="551.5" y="160" textLength="260" lengthAdjust="spacing">三大祝福長成級完成型</text>
    <text x="483" y="194.5">（</text>
    <text x="553" y="194.5" textLength="129" lengthAdjust="spacing">非原理世界</text>
    <text x="624" y="194.5">）</text>
  </g>

  <!-- 括弧 -->
  <path d="M346,228.5 Q336.5,232 336.5,242 V354 Q336.5,364 346,367.5" fill="none" stroke="currentColor" stroke-width="3.5"/>

  <g font-size="24" dominant-baseline="central">
    <text x="357" y="249" textLength="125" lengthAdjust="spacing">イエス型人物</text>
    <text x="494.5" y="249" text-anchor="middle">：</text>
    <text x="509" y="249" textLength="120" lengthAdjust="spacing">ヒットラー</text>
    <text x="357" y="297" textLength="124" lengthAdjust="spacing">子女繁殖型</text>
    <text x="494.5" y="297" text-anchor="middle">：</text>
    <text x="513" y="297" textLength="171" lengthAdjust="spacing">汎ゲルマン主義</text>
    <text x="357" y="346" textLength="124" lengthAdjust="spacing">万物主管型</text>
    <text x="494.5" y="346" text-anchor="middle">：</text>
    <text x="508" y="346" textLength="150" lengthAdjust="spacing">世界制覇政策</text>
  </g>
</svg>
