<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天の側とサタン側　再臨摂理の蘇生期始まる</title>

  <!-- 天の側・サタン側の楕円 -->
  <ellipse cx="253" cy="61.5" rx="66.5" ry="26" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="555.5" cy="61.5" rx="66" ry="26" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="253" y="62" textLength="87" lengthAdjust="spacing">天の側</text>
    <text x="556" y="62" textLength="110" lengthAdjust="spacing" fill="#fff">サタン側</text>
  </g>

  <!-- 二つの箱 -->
  <g fill="none" stroke="currentColor" stroke-width="2.5">
    <rect x="136.5" y="101" width="247" height="236.5"/>
    <rect x="430.5" y="101" width="260" height="236.5"/>
  </g>
  <g>
    <circle cx="155.5" cy="131.5" r="7"/>
    <circle cx="153.5" cy="219.5" r="7"/>
    <circle cx="450.5" cy="131.5" r="7"/>
    <circle cx="450" cy="216.5" r="7"/>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="169" y="135" textLength="113" lengthAdjust="spacing">再臨主の</text>
    <text x="169" y="172" textLength="113" lengthAdjust="spacing">誕生基台</text>
    <text x="169" y="218" textLength="103" lengthAdjust="spacing">再臨主：</text>
    <text x="169" y="255" font-size="26" textLength="207" lengthAdjust="spacingAndGlyphs">共生共栄共義主義</text>
    <text x="169" y="309" textLength="172" lengthAdjust="spacing">地上天国理想</text>
    <text x="469" y="133" textLength="199" lengthAdjust="spacing">カイゼルの敗北</text>
    <text x="467" y="218" textLength="132" lengthAdjust="spacing">再臨主型：</text>
    <text x="450" y="250" font-size="26" textLength="226" lengthAdjust="spacingAndGlyphs">スターリン－共産世界</text>
    <text x="467" y="309" textLength="201" lengthAdjust="spacing">地上天国型世界</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="387,214.5 405,201 405,209 424,209 424,221.5 405,221.5 405,228"/>
    <polygon points="247,275 260,275 260,281 267,281 253.5,288.5 240,281 247,281"/>
    <polygon points="560,271 573,271 573,278 580,278 566.5,286 553,278 560,278"/>
  </g>

  <!-- 下の水色の箱 -->
  <rect x="225.5" y="354.5" width="373" height="55" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <text x="411" y="381" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="343" lengthAdjust="spacing" fill="#111">再臨摂理の蘇生期始まる</text>
</svg>
