<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>頑固な予定説（カルヴィン）が生じて今日まで続いた流れ</title>

  <g fill="#CDF8F7" stroke="currentColor" stroke-width="4.5">
    <rect x="247.5" y="57" width="822.5" height="79"/>
    <rect x="243.5" y="215" width="822.5" height="78.5"/>
    <rect x="363" y="371.5" width="579" height="78.5"/>
    <rect x="360" y="533" width="579" height="79"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="658.5" y="94.5" font-size="46">神と人間の責任分担の関係知らず</text>
    <text x="394.5" y="254.5" font-size="46">み旨成就を、</text>
    <text x="792.5" y="254.5" font-size="46">神の単独行使として見る</text>
    <text x="536" y="411.5" font-size="41">頑固な予定説</text>
    <text x="782.5" y="411.5" font-size="41" textLength="222" lengthAdjust="spacing">（カルヴィン）</text>
    <text x="647" y="574" font-size="42">今日までそのまま認める</text>
  </g>

  <g fill="#8C949A">
    <polygon points="636,158 669,158 669,173 689,173 652.5,192 616,173 636,173"/>
    <polygon points="636,316 669,316 669,331 689,331 652.5,352 616,331 636,331"/>
    <polygon points="632,474 665,474 665,489 685,489 648.5,511 612,489 632,489"/>
  </g>
</svg>
