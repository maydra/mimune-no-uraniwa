<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 堕落による死　創造原理：霊人体 → 無形世界で永生、肉身 → 土に……永存できない</title>

  <text x="51" y="79" font-size="46">Ⅱ.</text>
  <text x="138" y="60" font-size="50" dominant-baseline="central" textLength="299" lengthAdjust="spacing">堕落による死</text>
  <line x1="137" y1="90.5" x2="437" y2="90.5" stroke="currentColor" stroke-width="3.5"/>

  <text y="156" font-size="50" dominant-baseline="central"><tspan x="250" textLength="199" lengthAdjust="spacing">創造原理</tspan><tspan x="475.5" text-anchor="middle">：</tspan></text>

  <!-- 霊人体と肉身 -->
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="342" cy="321" rx="44" ry="104" fill="#F98AEE"/>
    <ellipse cx="342" cy="532" rx="44" ry="103" fill="#A0F08A"/>
    <line x1="268.5" y1="427" x2="417.5" y2="427"/>
  </g>
  <g font-size="48" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="342.5" y="270">霊</text>
    <text x="342.5" y="320.5">人</text>
    <text x="342.5" y="370.5">体</text>
    <text x="342.5" y="507">肉</text>
    <text x="342.5" y="556.5">身</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="400,315.5 441,315.5 441,308.5 462.5,320.25 441,332 441,325.5 400,325.5"/>
    <polygon points="400,527.5 441,527.5 441,520.5 462.5,532 441,543.5 441,536.5 400,536.5"/>
  </g>

  <text x="489" y="317.5" font-size="50" dominant-baseline="central" textLength="346" lengthAdjust="spacing">無形世界で永生</text>
  <g font-size="53" dominant-baseline="central">
    <text x="484" y="529" textLength="106" lengthAdjust="spacing">土に</text>
    <text x="733" y="529" textLength="327" lengthAdjust="spacing">永存できない</text>
  </g>
  <!-- …… -->
  <g>
    <circle cx="617" cy="529.5" r="5"/>
    <circle cx="635.5" cy="529.5" r="5"/>
    <circle cx="653.5" cy="529.5" r="5"/>
    <circle cx="671.5" cy="529.5" r="5"/>
    <circle cx="689.5" cy="529.5" r="5"/>
    <circle cx="707.5" cy="529.5" r="5"/>
  </g>
</svg>
