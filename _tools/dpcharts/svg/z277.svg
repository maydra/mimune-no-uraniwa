<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>善の基準：絶対的（再臨主による天宙的理念）</title>

  <!-- 神主権 ← 人類歴史（闘争と革命） ← サタン主権 -->
  <rect x="200.5" y="99.5" width="276" height="146" rx="22" fill="#fff" class="paper" stroke="currentColor" stroke-width="5"/>
  <rect x="864" y="101" width="244" height="141" rx="18" fill="#50403D" stroke="currentColor" stroke-width="5"/>
  <polygon points="836.5,167.5 531.5,167.5 531.5,157.5 500,175.5 531.5,193.5 531.5,183.5 836.5,183.5" fill="#8C949A"/>
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="338" y="172" font-size="49">神主権</text>
    <text x="986" y="171.5" fill="#fff">サタン主権</text>
    <text x="683" y="132">人類歴史</text>
    <text x="683.5" y="223">闘争と革命</text>
  </g>

  <text y="285.5" font-size="45" dominant-baseline="central"><tspan x="226.5">理念、</tspan><tspan x="365">目的</tspan></text>
  <polygon points="329.5,360.5 355.5,360.5 355.5,394.5 367.5,394.5 342.5,419.5 317.5,394.5 329.5,394.5" fill="#8C949A"/>
  <text y="476" font-size="45.5" dominant-baseline="central"><tspan x="292">善の基準</tspan><tspan x="498" text-anchor="middle">：</tspan><tspan x="522">絶対的</tspan></text>

  <rect x="287" y="525.5" width="656.5" height="81.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="615.5" y="566" font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">再臨主による天宙的理念</text>
</svg>
