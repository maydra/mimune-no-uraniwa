<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>堕落による死：神の主管圏からサタン主管圏に落ちる（肉身の死には×）</title>

  <!-- 灰色の矢印（箱の下に描く） -->
  <g fill="#8C949A">
    <polygon points="471.7,376.9 620.9,231.9 628.9,240.1 638.6,205.6 603.8,214.3 611.8,222.5 462.6,367.6"/>
    <polygon points="462.8,381.2 612.6,526.7 604.6,534.9 639.4,543.6 629.7,509.1 621.7,517.3 471.9,371.9"/>
  </g>

  <!-- 堕落による死 -->
  <rect x="258.5" y="289.5" width="220" height="171" fill="#CF921C" stroke="currentColor" stroke-width="4"/>
  <g font-size="52" dominant-baseline="central" fill="#111">
    <text x="286" y="342" textLength="162" lengthAdjust="spacing">堕落に</text>
    <text x="289" y="405.5" textLength="160" lengthAdjust="spacing">よる死</text>
  </g>

  <!-- 肉身の死への矢印に打つ × -->
  <g stroke="currentColor" stroke-linecap="butt">
    <line x1="556" y1="416" x2="545" y2="495" stroke-width="11"/>
    <line x1="513" y1="459.5" x2="587" y2="447" stroke-width="10"/>
  </g>

  <g font-size="52" dominant-baseline="central">
    <text x="654" y="142" textLength="385" lengthAdjust="spacing">神の主管圏から</text>
    <text x="655" y="213" textLength="383" lengthAdjust="spacing">サタン主管圏に</text>
    <text x="655" y="283.5" textLength="165" lengthAdjust="spacing">落ちる</text>
    <text x="656" y="541" textLength="216" lengthAdjust="spacing">肉身の死</text>
  </g>
</svg>
