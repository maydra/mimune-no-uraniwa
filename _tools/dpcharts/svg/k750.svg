<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>4. 天の側とサタン側が各々三大国に対立した理由</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="32" y="37">4.</text>
    <text x="70" y="37" textLength="540" lengthAdjust="spacing">天の側とサタン側が各々三大国に対立した理由</text>
  </g>
  <line x1="68" y1="55.5" x2="611" y2="55.5" stroke="currentColor" stroke-width="2.2"/>

  <g font-size="25" dominant-baseline="central">
    <text x="173" y="84" textLength="129" lengthAdjust="spacing">三存在堕落</text>
    <text x="391" y="84" textLength="235" lengthAdjust="spacing">三大祝福完成されず</text>
    <text x="234" y="123" textLength="208" lengthAdjust="spacing">復帰も三存在関与</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="338,80.5 358,80.5 358,77 369.5,83 358,89 358,85.5 338,85.5"/>
    <polygon points="175,119.5 199,119.5 199,116 210.5,122 199,128 199,124.5 175,124.5"/>
    <polygon points="381,256.5 427,256.5 427,252 443.5,261 427,270 427,265.5 381,265.5"/>
  </g>
  <text x="412" y="226" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="55" lengthAdjust="spacing">勝利</text>

  <!-- 天の側国家・サタン側国家の札 -->
  <rect x="146.5" y="167.5" width="198" height="41.5" rx="6" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <rect x="476.5" y="165.5" width="196.5" height="41.5" rx="6" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="246.5" y="189" textLength="142" lengthAdjust="spacing">天の側国家</text>
    <text x="574" y="187" textLength="169" lengthAdjust="spacing" fill="#fff">サタン側国家</text>
  </g>

  <!-- 三国をつなぐ灰色の線（楕円の下に描く） -->
  <g stroke="#8C949A" stroke-width="5.5" fill="none">
    <line x1="164.5" y1="261.5" x2="325.5" y2="261.5"/>
    <line x1="164.5" y1="260.5" x2="235" y2="338"/>
    <line x1="325.5" y1="264.5" x2="246.5" y2="339.5"/>
    <line x1="498.5" y1="261.5" x2="659.5" y2="261.5"/>
    <line x1="498.5" y1="260.5" x2="569" y2="338"/>
    <line x1="659.5" y1="264.5" x2="580.5" y2="339.5"/>
  </g>

  <g stroke="currentColor" stroke-width="2.5">
    <g fill="#FCE5E3">
      <ellipse cx="164.5" cy="261" rx="30.5" ry="28"/>
      <ellipse cx="325.5" cy="261" rx="30.5" ry="28"/>
      <ellipse cx="246.5" cy="337" rx="41.5" ry="28"/>
    </g>
    <g fill="#CF921C">
      <ellipse cx="498.5" cy="261" rx="30.5" ry="28"/>
      <ellipse cx="659.5" cy="261" rx="30.5" ry="28"/>
      <ellipse cx="580" cy="337" rx="42" ry="28"/>
    </g>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="165" y="261.5">ア</text>
    <text x="326" y="261">エ</text>
    <text x="499" y="262">ア</text>
    <text x="660" y="261">エ</text>
    <text x="246" y="337" font-size="23" textLength="69" lengthAdjust="spacingAndGlyphs">天使長</text>
    <text x="580.5" y="337" font-size="23" textLength="69" lengthAdjust="spacingAndGlyphs">天使長</text>
  </g>

  <!-- 国名 -->
  <g font-size="29" text-anchor="middle" dominant-baseline="central">
    <text x="164" y="314">米</text>
    <text x="326" y="312">英</text>
    <text x="246.5" y="389">仏</text>
    <text x="498.5" y="316">独</text>
    <text x="660" y="316.5">日</text>
    <text x="580.5" y="387">伊</text>
  </g>
</svg>
