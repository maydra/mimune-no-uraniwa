<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. 信仰基台を復帰するための条件物　(1) アブラハムの象徴献祭</title>

  <!-- 題 -->
  <text x="37" y="39.5" font-size="31" dominant-baseline="central">2.</text>
  <text x="71" y="39.5" font-size="31" dominant-baseline="central" textLength="473" lengthAdjust="spacing">信仰基台を復帰するための条件物</text>
  <text x="55" y="84.5" font-size="29" dominant-baseline="central" textLength="36" lengthAdjust="spacing">(1)</text>
  <text x="105" y="84.5" font-size="29" dominant-baseline="central" textLength="287" lengthAdjust="spacing">アブラハムの象徴献祭</text>
  <g stroke="currentColor">
    <line x1="71" y1="58.5" x2="544" y2="58.5" stroke-width="2.2"/>
    <line x1="103" y1="103" x2="391" y2="103" stroke-width="2.6"/>
  </g>

  <!-- 上へ（楕円と円の下に描く） -->
  <polygon points="219,335 219,220 212.5,220 222,203 231.5,220 225,220 225,335" fill="#8C949A"/>

  <circle cx="222.5" cy="165" r="35.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="221" y="164" font-size="36" text-anchor="middle" dominant-baseline="central">神</text>

  <g stroke="currentColor" stroke-width="2.2" fill="#DCC4C4">
    <ellipse cx="221.5" cy="278.5" rx="68.5" ry="33.5"/>
    <ellipse cx="221.5" cy="368" rx="68.5" ry="34"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="222" y="278.5" font-size="26" textLength="104" lengthAdjust="spacing">象徴献祭</text>
    <text x="222" y="367.5" font-size="25" textLength="121" lengthAdjust="spacingAndGlyphs">アブラハム</text>
  </g>

  <!-- 条件物と信仰 -->
  <g font-size="31" dominant-baseline="central">
    <text x="302" y="278.5">鳩</text>
    <text x="366" y="278.5">羊</text>
    <text x="428" y="278.5" textLength="62" lengthAdjust="spacing">雌牛</text>
    <text x="302" y="367.5" font-size="30" textLength="240" lengthAdjust="spacingAndGlyphs">献祭するための信仰</text>
  </g>
  <circle cx="349" cy="278.5" r="3.8"/>
  <circle cx="412" cy="278.5" r="3.8"/>
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="500" y="279" textLength="104" lengthAdjust="spacingAndGlyphs">(創 15:9)</text>
    <text x="552" y="368" textLength="117" lengthAdjust="spacingAndGlyphs">(ロマ 1:17)</text>
  </g>
</svg>
