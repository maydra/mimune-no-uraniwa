<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>1. 天と地を滅ぼして新しい天と新しい地をつくられる</title>

  <text x="50" y="58.5" font-size="46" dominant-baseline="central">1.</text>
  <text x="110" y="57.5" font-size="46" dominant-baseline="central" textLength="1061" lengthAdjust="spacing">天と地を滅ぼして新しい天と新しい地をつくられる</text>
  <line x1="110" y1="88.5" x2="1171" y2="88.5" stroke="currentColor" stroke-width="4"/>

  <!-- 聖句 -->
  <g font-size="35" dominant-baseline="central">
    <text y="130"><tspan x="536" textLength="216" lengthAdjust="spacingAndGlyphs">【ペテロⅡ 3:12</tspan><tspan x="750">、</tspan><tspan x="781" textLength="119" lengthAdjust="spacingAndGlyphs">創 6:13】</tspan></text>
    <text y="182"><tspan x="536" textLength="116" lengthAdjust="spacingAndGlyphs">【黙 21:1</tspan><tspan x="654">、</tspan><tspan x="679" textLength="189" lengthAdjust="spacingAndGlyphs">ペテロⅡ 3:13</tspan><tspan x="865">、</tspan><tspan x="891" textLength="188" lengthAdjust="spacingAndGlyphs">イザヤ 66:22】</tspan></text>
  </g>

  <!-- ● -->
  <circle cx="213" cy="271" r="11.5"/>
  <circle cx="213" cy="351" r="11.5"/>
  <g font-size="41" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="246.5 277 319.5 359.5 401.5 444 485 527.5 568.5 609.5 640.5 684 727.5 756 776 796 818.5 839.5 857.5" y="268.5">「地は永遠に変らない」　(伝 1:4)</text>
    <text x="246.5 277 318.5 362.5 402 444 485 526 568.5 610 652.5 693.5 735" y="352.5">「とこしえに基を定められた</text>
    <text y="406"><tspan x="317 358 399 441.5 484 525 567 608.5 650.5 692 721.5 767.5 796 816">地のように建てられた」(詩 </tspan><tspan x="879" textLength="102" lengthAdjust="spacingAndGlyphs">78:69</tspan><tspan x="938.5">)</tspan></text>
  </g>

  <!-- 結論 -->
  <rect x="361.25" y="470.75" width="552" height="146.5" rx="8" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="45" dominant-baseline="central" fill="#111">
    <text y="512"><tspan x="408" textLength="408" lengthAdjust="spacing">サタン主権を滅ぼし</tspan><tspan x="818">、</tspan></text>
    <text x="406.5" y="575" textLength="458" lengthAdjust="spacing">神主権下の新天地復帰</text>
  </g>
</svg>
