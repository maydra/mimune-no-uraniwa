<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>復帰摂理の中心人物</title>

  <text x="52" y="68" font-size="48" dominant-baseline="central" textLength="448" lengthAdjust="spacing">復帰摂理の中心人物</text>
  <line x1="51" y1="98" x2="502" y2="98" stroke="currentColor" stroke-width="4"/>

  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="397" y="157.5">神の救いの摂理</text>
    <text x="580.5" y="157.5">：</text>
    <text x="718.5" y="157.5">完全に復帰</text>
  </g>

  <polygon points="249,236 294,236 294,225 322,242 294,259 294,248 249,248" fill="#8C949A"/>
  <g font-size="42" text-anchor="middle" dominant-baseline="central">
    <text x="558.5" y="239.5">堕落人間だれでもみな、</text>
    <text x="883" y="240">救い予定</text>
  </g>
  <text x="824.5" y="292" font-size="36" text-anchor="middle" dominant-baseline="central">（ペテロⅡ 3:9）</text>

  <!-- 一つ（中心人物）から全体へ -->
  <g fill="#8C949A">
    <polygon points="792,423 863,423 863,412 876,426 863,440 863,429 792,429"/>
    <polygon points="792,575 863,575 863,564 876,578 863,592 863,581 792,581"/>
  </g>
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="695.75" cy="424" rx="97.75" ry="51.5" fill="#F8F28F"/>
    <ellipse cx="694.75" cy="578.5" rx="96.75" ry="50.5" fill="#F8F28F"/>
    <ellipse cx="982.25" cy="423" rx="96.75" ry="50.5" fill="#fff" class="paper"/>
    <ellipse cx="982.25" cy="577.5" rx="96.75" ry="50.5" fill="#fff" class="paper"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="697" y="424" font-size="44" fill="#111">一つ</text>
    <text x="695.5" y="578.5" font-size="41" fill="#111">中心人物</text>
    <text x="982.5" y="423" font-size="44" textLength="97" lengthAdjust="spacing">全体</text>
    <text x="982.5" y="577.5" font-size="44" textLength="97" lengthAdjust="spacing">全体</text>
  </g>

  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="312.5" y="422.5">神の摂理</text>
    <text x="336" y="547">救いの摂理</text>
    <text x="359" y="601">のための予定</text>
  </g>
</svg>
