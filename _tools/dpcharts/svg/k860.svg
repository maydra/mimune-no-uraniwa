<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>3. この国は神の心情の対象とならなければならない　① 血、汗、涙の道を歩む</title>
  <defs>
    <marker id="k860-a" viewBox="0 0 12 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 題 -->
  <text x="34" y="38" font-size="29" dominant-baseline="central">3.</text>
  <text x="73" y="38" font-size="29" dominant-baseline="central" textLength="536" lengthAdjust="spacingAndGlyphs">この国は神の心情の対象とならなければならない</text>
  <line x1="69" y1="56.5" x2="609" y2="56.5" stroke="currentColor" stroke-width="2"/>

  <text x="139" y="111" font-size="28" dominant-baseline="central">①</text>
  <g font-size="28" dominant-baseline="central">
    <text x="181" y="111">血、</text>
    <text x="239" y="111">汗、</text>
    <text x="297" y="111" textLength="170" lengthAdjust="spacing">涙の道を歩む</text>
  </g>

  <!-- 神 -->
  <circle cx="326" cy="189.5" r="32" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <text x="326" y="189.5" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>
  <g font-size="28" dominant-baseline="central">
    <text x="209" y="189.5" textLength="56" lengthAdjust="spacing">父母</text>
    <text x="388" y="189.5" textLength="200" lengthAdjust="spacing">悲しまれる心情</text>
  </g>

  <!-- 上り下りの矢印 -->
  <g stroke="currentColor" stroke-width="4" fill="none" marker-end="url(#k860-a)">
    <path d="M309.5,311 Q289,274 309,240"/>
    <path d="M338,233 Q357,271 339,305"/>
  </g>

  <!-- 韓国民族 -->
  <ellipse cx="325.5" cy="359.5" rx="61" ry="31" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <text x="327" y="359.5" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="108" lengthAdjust="spacing">韓国民族</text>
  <g font-size="27" dominant-baseline="central">
    <text x="205" y="340" textLength="51" lengthAdjust="spacing">孝子</text>
    <text x="205" y="376.5" textLength="51" lengthAdjust="spacing">孝女</text>
  </g>
  <g font-size="28" dominant-baseline="central">
    <text x="399" y="339" textLength="201" lengthAdjust="spacing">悲惨な歴史路程</text>
    <text x="399" y="376" textLength="114" lengthAdjust="spacing">苦難の道</text>
  </g>
</svg>
