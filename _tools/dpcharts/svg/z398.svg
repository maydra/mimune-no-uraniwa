<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>新しい真理に関する聖句</title>

  <text x="142" y="195" font-size="103" dominant-baseline="central" textLength="1145" lengthAdjust="spacing">新しい真理に関する聖句</text>
  <line x1="142" y1="262.5" x2="1287" y2="262.5" stroke="currentColor" stroke-width="6"/>

  <!-- 黒丸 -->
  <g>
    <circle cx="188" cy="367" r="18.5"/>
    <circle cx="188" cy="983" r="18.5"/>
    <circle cx="188" cy="1599" r="18.5"/>
  </g>

  <!-- 本文（聖句は太字、地の文は細字 font-weight 400） -->
  <g font-size="80" dominant-baseline="central">
    <text y="369"><tspan x="228" font-size="83" font-weight="400" textLength="344" lengthAdjust="spacing">イエスは</tspan><tspan x="609" font-size="83" font-weight="400">『</tspan><tspan x="642.6" textLength="1453" lengthAdjust="spacing">わたしはこれらのことを比喩で話したが</tspan><tspan x="2095.6">、</tspan><tspan x="2176.3" textLength="565" lengthAdjust="spacing">もはや比喩では</tspan></text>
    <text y="489.5"><tspan x="229" textLength="405" lengthAdjust="spacing">話さないで</tspan><tspan x="634">、</tspan><tspan x="715" textLength="486" lengthAdjust="spacing">あからさまに</tspan><tspan x="1201">、</tspan><tspan x="1282" textLength="1458" lengthAdjust="spacing">父のことをあなたがたに話してきかせる</tspan></text>
    <text y="610.5"><tspan x="228.9" textLength="666.4" lengthAdjust="spacing">時が来るであろう</tspan><tspan x="894" font-size="83" font-weight="400">』</tspan><tspan x="980" textLength="600" lengthAdjust="spacingAndGlyphs">（ヨハネ 16：25）</tspan><tspan x="1623" font-size="83" font-weight="400" textLength="947.1" lengthAdjust="spacing">と言われることによって</tspan><tspan x="2570.1" font-size="83" font-weight="400">、</tspan><tspan x="2656.2" font-size="83" font-weight="400">終</tspan></text>
    <text y="731"><tspan x="229.7" font-size="83" font-weight="400" textLength="2513.1" lengthAdjust="spacing">末に至れば再び新しい真理のみ言を下さることを約束されたので</tspan></text>
    <text y="852.5"><tspan x="230" font-size="83" font-weight="400" textLength="166" lengthAdjust="spacing">ある</tspan><tspan x="396" font-size="83" font-weight="400">。</tspan></text>
    <text y="985"><tspan x="228" font-size="83" font-weight="400" textLength="344" lengthAdjust="spacing">イエスは</tspan><tspan x="609" font-size="83" font-weight="400">『</tspan><tspan x="642.6" textLength="1373.3" lengthAdjust="spacing">わたしが地上のことを語っているのに</tspan><tspan x="2015.9">、</tspan><tspan x="2096.6" textLength="646.2" lengthAdjust="spacing">あなたがたが信じ</tspan></text>
    <text y="1105.5"><tspan x="229.5" textLength="405.1" lengthAdjust="spacing">ないならば</tspan><tspan x="634.6">、</tspan><tspan x="715.7" textLength="891.3" lengthAdjust="spacing">天上のことを語った場合</tspan><tspan x="1607">、</tspan><tspan x="1688" textLength="1053.4" lengthAdjust="spacing">どうしてそれを信じるだろう</tspan></text>
    <text y="1226.5"><tspan x="230">か</tspan><tspan x="308" font-size="83" font-weight="400">』</tspan><tspan x="394" textLength="527" lengthAdjust="spacingAndGlyphs">（ヨハネ 3：12）</tspan><tspan x="963.7" font-size="83" font-weight="400" textLength="930.6" lengthAdjust="spacing">と話されたみ言のとおり</tspan><tspan x="1894.3" font-size="83" font-weight="400">、</tspan><tspan x="1978.9" font-size="83" font-weight="400" textLength="761.4" lengthAdjust="spacing">ユダヤ人たちの不信</tspan></text>
    <text y="1347.5"><tspan x="231.2" font-size="83" font-weight="400" textLength="334.4" lengthAdjust="spacing">によって</tspan><tspan x="565.6" font-size="83" font-weight="400">、</tspan><tspan x="649.2" font-size="83" font-weight="400" textLength="1086.8" lengthAdjust="spacing">語ろうとするみ言も語り得ず</tspan><tspan x="1736" font-size="83" font-weight="400">、</tspan><tspan x="1819.6" font-size="83" font-weight="400" textLength="919.6" lengthAdjust="spacing">十字架に亡くなられたの</tspan></text>
    <text y="1468.5"><tspan x="232" font-size="83" font-weight="400" textLength="249" lengthAdjust="spacing">である</tspan><tspan x="481" font-size="83" font-weight="400">。</tspan></text>
    <text y="1601"><tspan x="228" font-size="83" font-weight="400" textLength="602.7" lengthAdjust="spacing">それだけでなく</tspan><tspan x="830.7" font-size="83" font-weight="400">、</tspan><tspan x="916.8" font-size="83" font-weight="400" textLength="1033.2" lengthAdjust="spacing">イエスは弟子たちにまでも</tspan><tspan x="1950" font-size="83" font-weight="400">、</tspan><tspan x="2043" font-size="83" font-weight="400">『</tspan><tspan x="2073.2" textLength="668" lengthAdjust="spacing">あなたがたに言う</tspan></text>
    <text y="1721.5"><tspan x="228.8" textLength="988.1" lengthAdjust="spacing">べきことがまだ多くあるが</tspan><tspan x="1216.9">、</tspan><tspan x="1299.2" textLength="1399.8" lengthAdjust="spacing">あなたがたは今はそれに堪えられない</tspan><tspan x="2697" font-size="83" font-weight="400">』</tspan></text>
    <text y="1842"><tspan x="231" textLength="578" lengthAdjust="spacingAndGlyphs">（ヨハネ 16：12）</tspan><tspan x="852.6" font-size="83" font-weight="400">と</tspan><tspan x="938.5" font-size="83" font-weight="400">、</tspan><tspan x="1024.4" font-size="83" font-weight="400" textLength="772.9" lengthAdjust="spacing">心の中にあるみ言を</tspan><tspan x="1797.3" font-size="83" font-weight="400">、</tspan><tspan x="1883.2" font-size="83" font-weight="400" textLength="858.8" lengthAdjust="spacing">みな話すことのできな</tspan></text>
    <text y="1963"><tspan x="229.9" font-size="83" font-weight="400" textLength="1331.7" lengthAdjust="spacing">い悲しい心情を表わされたのである</tspan><tspan x="1561.6" font-size="83" font-weight="400">。</tspan></text>
  </g>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="5.5">
    <line x1="716" y1="545" x2="1201" y2="545"/>
    <line x1="230" y1="665.5" x2="561" y2="665.5"/>
    <line x1="834" y1="788.5" x2="1527" y2="788.5"/>
    <line x1="716" y1="1161" x2="1120" y2="1161"/>
    <line x1="1978" y1="1283.5" x2="2739" y2="1283.5"/>
    <line x1="1401" y1="1404.5" x2="2153" y2="1404.5"/>
    <line x1="2575" y1="1656.5" x2="2741" y2="1656.5"/>
    <line x1="230" y1="1777" x2="1134" y2="1777"/>
    <line x1="2205" y1="1777" x2="2698" y2="1777"/>
    <line x1="314" y1="2020.5" x2="1229" y2="2020.5"/>
  </g>
</svg>
