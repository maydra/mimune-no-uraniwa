<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエス当時（初臨）と今日（再臨）　知らせとみ言を受け入れる人</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="129.5" y="27.5" width="279" height="54" rx="7"/>
    <rect x="416.5" y="27.5" width="279" height="54" rx="7"/>
  </g>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="143" y="56.5" textLength="156" lengthAdjust="spacing">イエス当時</text>
    <text x="305" y="56.5">（初臨）</text>
    <text x="476" y="56" textLength="57" lengthAdjust="spacing">今日</text>
    <text x="543" y="56">（再臨）</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="130.25" y="99.25" width="275.5" height="314.5" rx="8"/>
    <rect x="416.25" y="99.25" width="275.5" height="314.5" rx="8"/>
  </g>

  <!-- イエス当時 -->
  <g font-size="24" dominant-baseline="central">
    <text x="138" y="123.5">①</text>
    <text x="167" y="123.5" textLength="140" lengthAdjust="spacing">初臨の知らせ</text>
    <text x="138" y="272">①</text>
    <text x="167" y="272" textLength="140" lengthAdjust="spacing">イエスの福音</text>
  </g>
  <g>
    <circle cx="156.5" cy="158.5" r="5.5"/>
    <circle cx="156" cy="305.5" r="5.5"/>
  </g>
  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="167" y="159.5" textLength="187" lengthAdjust="spacing">祭司長、律法学者</text>
    <text x="167" y="195.5" textLength="210" lengthAdjust="spacingAndGlyphs">ではない占星学者や</text>
    <text x="167" y="230.5" textLength="209" lengthAdjust="spacing">羊飼いに与えられる</text>
    <text x="167" y="306.5" textLength="187" lengthAdjust="spacing">ユダヤ教の指導者</text>
    <text x="167" y="341.5" textLength="163" lengthAdjust="spacing">ではない賤民や</text>
    <text x="167" y="375.5" textLength="209" lengthAdjust="spacingAndGlyphs">異邦人が受け入れる</text>
  </g>

  <!-- 今日 -->
  <g font-size="24" dominant-baseline="central">
    <text x="423" y="123.5">②</text>
    <text x="451" y="123.5" textLength="141" lengthAdjust="spacing">再臨の知らせ</text>
    <text x="423" y="273">②</text>
    <text x="451" y="273" textLength="118" lengthAdjust="spacing">再臨のみ言</text>
  </g>
  <g>
    <circle cx="439.5" cy="159" r="5.5"/>
    <circle cx="440" cy="305.5" r="5.5"/>
  </g>
  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="452" y="159.5" textLength="187" lengthAdjust="spacing">キリスト教指導者</text>
    <text x="451" y="195.5" textLength="187" lengthAdjust="spacing">ではない平信徒や</text>
    <text x="452" y="230.5" textLength="139" lengthAdjust="spacingAndGlyphs">異教徒に啓示</text>
    <text x="451" y="307.5" textLength="230" lengthAdjust="spacingAndGlyphs">キリスト教の指導者層ではない</text>
    <text x="451" y="342.5" textLength="226" lengthAdjust="spacingAndGlyphs">平信徒や非キリスト教徒が</text>
    <text x="452" y="376" textLength="186" lengthAdjust="spacingAndGlyphs">受け入れるようになる</text>
  </g>
</svg>
