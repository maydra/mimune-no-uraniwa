<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>正分合作用（正・分・合）</title>

  <!-- 分立と合成の矢印（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="8.5">
    <line x1="553" y1="244.5" x2="474.75" y2="304.25"/>
    <line x1="693.5" y1="242.5" x2="767.75" y2="304"/>
    <line x1="451" y1="417" x2="542" y2="496.5"/>
    <line x1="789" y1="417" x2="701" y2="494"/>
  </g>
  <g>
    <polygon points="459,316 468.5,296 481,312.5"/>
    <polygon points="782.5,317.5 774.5,296 761,312"/>
    <polygon points="557,510 549,488.5 535,504.5"/>
    <polygon points="685.5,508.5 694.5,486 707.5,502"/>
  </g>

  <!-- 神（正） -->
  <text x="351.5" y="159.5" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>
  <ellipse cx="616.5" cy="160.5" rx="212.5" ry="90.5" fill="#A0F08A"/>
  <path d="M612,70 C591,85 571,97 571,117 C571,152 656,168 656,203 C656,220 642,243 617,251 A212.5,90.5 0 1 1 612,70 Z" fill="#F98AEE"/>
  <ellipse cx="616.5" cy="160.5" rx="212.5" ry="90.5" fill="none" stroke="currentColor" stroke-width="4"/>
  <g stroke="#111" stroke-width="5.5">
    <line x1="542.5" y1="130" x2="516.5" y2="156"/>
    <line x1="701" y1="129" x2="726.5" y2="156"/>
  </g>
  <path d="M570.5,171 Q620,147 657,169 M668,189 Q622,215 584,192" fill="none" stroke="#111" stroke-width="5.5"/>
  <g fill="#111">
    <polygon points="660,162.5 671.5,176.5 654.5,176.5"/>
    <polygon points="569.5,185 586,184.5 581,200"/>
  </g>
  <g font-size="43" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="620.5" y="103.5">万有原力</text>
    <text x="489.5" y="179">本性相</text>
    <text x="746.5" y="179">本形状</text>
  </g>

  <g font-size="43" text-anchor="middle" dominant-baseline="central">
    <text x="426.5" y="265.5">分立</text>
    <text x="820" y="263.5">分立</text>
  </g>

  <!-- 主体と対象（分） -->
  <path d="M541,354 Q620,318 691,347 M707,388 Q630,421 553.5,394" fill="none" stroke="currentColor" stroke-width="7.5"/>
  <polygon points="695,337 710.5,355.5 688.5,357"/>
  <polygon points="536.5,386 556,385 551,403"/>
  <polygon points="608.75,280.75 633.75,280.75 633.75,460 645,460 620,492 596.5,460 608.75,460" fill="#8C949A" stroke="currentColor" stroke-width="1.5"/>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="404.5" cy="372.5" rx="92.5" ry="54.5" fill="#F98AEE"/>
    <ellipse cx="833.5" cy="372" rx="92.5" ry="54.5" fill="#A0F08A"/>
    <ellipse cx="620" cy="568" rx="123" ry="53" fill="#DCC4C4"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="405.5" y="371.5" font-size="50">主体</text>
    <text x="833.5" y="372" font-size="50">対象</text>
    <text x="620.5" y="567.5" font-size="48">合成一体</text>
  </g>
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="261" y="342">実体</text>
    <text x="260.5" y="396">対象</text>
  </g>

  <!-- 正・分・合 -->
  <g stroke="currentColor" stroke-width="4.5">
    <line x1="844" y1="155" x2="1012.5" y2="155" stroke-dasharray="13 9.07"/>
    <line x1="928" y1="370" x2="1018" y2="370" stroke-dasharray="14.5 10.5"/>
    <line x1="759" y1="570" x2="1011.5" y2="570" stroke-dasharray="14 9.8"/>
  </g>
  <g font-size="56" text-anchor="middle" dominant-baseline="central">
    <text x="1062" y="159">正</text>
    <text x="1062" y="365">分</text>
    <text x="1062.5" y="570">合</text>
  </g>
</svg>
