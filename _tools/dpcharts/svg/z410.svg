<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>創造目的を完成した人間</title>

  <text x="51" y="59.5" font-size="48" dominant-baseline="central" textLength="547" lengthAdjust="spacing">創造目的を完成した人間</text>
  <line x1="51" y1="89.5" x2="601" y2="89.5" stroke="currentColor" stroke-width="4"/>

  <!-- 神と完成人間の授受 -->
  <g stroke="currentColor" stroke-width="7" fill="none">
    <path d="M296,410 Q276,366 293,331"/>
    <path d="M327,320 Q347,364 330,402"/>
  </g>
  <polygon points="301,315 284.4,325.9 301.6,334.1"/>
  <polygon points="323.6,417.7 321.3,399.2 338.7,406.8"/>

  <circle cx="311" cy="239.75" r="52.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="312" cy="497.25" rx="117.75" ry="52.75" fill="#FCE5E3" stroke="currentColor" stroke-width="4.5"/>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="309" y="238.5" font-size="55">神</text>
    <text x="311" y="497.5" font-size="44" fill="#111">完成人間</text>
  </g>

  <!-- 右の箱 -->
  <rect x="445.25" y="155.5" width="658.25" height="469.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <polygon points="685,381 701.5,381 701.5,375.5 717,387.5 701.5,399.5 701.5,393.5 685,393.5" fill="#8C949A"/>
  <g font-size="42" dominant-baseline="central">
    <text y="221.5"><tspan x="468">①</tspan><tspan x="516">神と一体、</tspan><tspan x="724" textLength="168" lengthAdjust="spacing">心情体恤</tspan></text>
    <text x="641" y="284">不可分の生活</text>
    <text y="388.5"><tspan x="468">②</tspan><tspan x="516">原罪なし</tspan></text>
    <text x="729" y="388.5">贖罪、救世主、祈祷、</text>
    <text x="729" y="451">信仰生活不必要</text>
    <text y="554.5"><tspan x="468">③</tspan><tspan x="516">善の子孫繁殖</tspan></text>
  </g>
</svg>
