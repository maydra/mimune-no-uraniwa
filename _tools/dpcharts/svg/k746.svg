<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>3. 第二次世界大戦における天の側国家とサタン側国家</title>

  <!-- 題 -->
  <g font-size="28" dominant-baseline="central">
    <text x="34" y="38">3.</text>
    <text x="70" y="38" textLength="663" lengthAdjust="spacing">第二次世界大戦における天の側国家とサタン側国家</text>
  </g>
  <line x1="69" y1="55.5" x2="734" y2="55.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 天の側国家・サタン側国家の札 -->
  <rect x="151.5" y="95.5" width="197.5" height="41.5" rx="6" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <rect x="481.5" y="93.5" width="197" height="41.5" rx="6" fill="#50403D" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="251" y="117" textLength="143" lengthAdjust="spacing">天の側国家</text>
    <text x="579.5" y="115" textLength="170" lengthAdjust="spacing" fill="#fff">サタン側国家</text>
  </g>

  <!-- 三国をつなぐ灰色の線（円の下に描く） -->
  <g stroke="#8C949A" stroke-width="3.5" fill="none">
    <line x1="175.5" y1="174.5" x2="320.5" y2="174.5"/>
    <line x1="176" y1="189" x2="248" y2="258"/>
    <line x1="320.5" y1="190" x2="248" y2="256"/>
    <line x1="510" y1="174.5" x2="652.5" y2="174.5"/>
    <line x1="510" y1="187" x2="582.5" y2="261"/>
    <line x1="652.5" y1="197.5" x2="582.5" y2="266"/>
  </g>

  <g stroke="currentColor" stroke-width="2.5">
    <g fill="#fff" class="paper">
      <circle cx="175.5" cy="173" r="26.5"/>
      <circle cx="320.5" cy="173" r="26.5"/>
      <circle cx="248" cy="257" r="26.5"/>
    </g>
    <g fill="#CF921C">
      <circle cx="510" cy="173" r="26.5"/>
      <circle cx="652.5" cy="173" r="26.5"/>
      <circle cx="582.5" cy="257" r="26.5"/>
    </g>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central">
    <text x="175.5" y="173.5">米</text>
    <text x="320.5" y="173.5">英</text>
    <text x="248" y="257.5">仏</text>
    <g fill="#111">
      <text x="510" y="174.5">独</text>
      <text x="652.5" y="174">日</text>
      <text x="582.5" y="256.5">伊</text>
    </g>
  </g>

  <!-- × -->
  <g stroke="currentColor" stroke-width="4.5">
    <line x1="397" y1="162" x2="436" y2="200"/>
    <line x1="436" y1="162" x2="397" y2="200"/>
  </g>

  <!-- 民主主義・全体主義の札 -->
  <rect x="183.5" y="292" width="130" height="42" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <rect x="517.5" y="292.5" width="131.5" height="41.5" fill="#CF921C" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="249" y="313" textLength="113" lengthAdjust="spacing">民主主義</text>
    <text x="583.5" y="312.5" textLength="115" lengthAdjust="spacing" fill="#111">全体主義</text>
  </g>

  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="247" y="362" textLength="181" lengthAdjust="spacing">アベル型人生観</text>
    <text x="247" y="393.5" textLength="181" lengthAdjust="spacing">キリスト教国家</text>
    <text x="585.5" y="358" textLength="182" lengthAdjust="spacing">カイン型人生観</text>
    <text x="584.5" y="389.5" textLength="208" lengthAdjust="spacing">反キリスト教国家</text>
  </g>
</svg>
