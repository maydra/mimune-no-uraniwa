<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅱ. 再臨復活による他のすべての宗教の統一</title>

  <text x="77.5" y="57" font-size="46" text-anchor="middle" dominant-baseline="central">Ⅱ</text>
  <text x="101.1" y="57" font-size="46" dominant-baseline="central">.</text>
  <text x="128" y="55.5" font-size="49" dominant-baseline="central" textLength="809" lengthAdjust="spacingAndGlyphs">再臨復活による他のすべての宗教の統一</text>
  <line x1="127" y1="86" x2="938" y2="86" stroke="currentColor" stroke-width="4"/>

  <!-- 各宗教の中心から再臨主への矢印（楕円より先に描く） -->
  <g stroke="#8C949A" stroke-width="12">
    <line x1="598" y1="252.5" x2="706.3" y2="322"/>
    <line x1="603" y1="535.3" x2="705.8" y2="469.4"/>
  </g>
  <g fill="#8C949A">
    <polygon points="727.5,337 714.5,307.5 695.5,335"/>
    <polygon points="386,391 693.5,391 693.5,381 721,397 693.5,413 693.5,403 386,403"/>
    <polygon points="727.5,455.5 714.5,484 694.5,456.5"/>
  </g>

  <!-- 弥勒仏・真人・中心存在（薄い桃）と再臨主 -->
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="550.25" cy="233" rx="53.75" ry="90" fill="#FCE5E3"/>
    <ellipse cx="335.5" cy="395" rx="54" ry="90" fill="#FCE5E3"/>
    <ellipse cx="551.5" cy="534.25" rx="55" ry="103.25" fill="#FCE5E3"/>
    <ellipse cx="802.25" cy="395" rx="67.25" ry="98.5" fill="#fff" class="paper"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <g font-size="45">
      <text x="550.5" y="187">弥</text>
      <text x="550" y="233.5">勒</text>
      <text x="550.5" y="279">仏</text>
    </g>
    <g font-size="49">
      <text x="334.5" y="360">真</text>
      <text x="335" y="430">人</text>
    </g>
    <g font-size="42">
      <text x="551" y="469.5">中</text>
      <text x="551" y="511">心</text>
      <text x="551" y="552.5">存</text>
      <text x="551" y="594.5">在</text>
    </g>
  </g>
  <g font-size="50" text-anchor="middle" dominant-baseline="central">
    <text x="802.5" y="345.5">再</text>
    <text x="803.5" y="394.5">臨</text>
    <text x="802.5" y="443.5">主</text>
  </g>

  <!-- 左の宗教の名 -->
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="460.5" y="200">仏</text>
    <text x="461" y="268">教</text>
    <text x="244.5" y="360">儒</text>
    <text x="245" y="429">教</text>
    <text x="460" y="492.5">諸</text>
    <text x="459.5" y="538">宗</text>
    <text x="459.5" y="584">教</text>
  </g>

  <!-- キリスト教＝すべての宗教の目的成就 -->
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="912.5" y="304.5">キ</text>
    <text x="912.5" y="351">リ</text>
    <text x="912.5" y="397">ス</text>
    <text x="912.5" y="442">ト</text>
    <text x="912.5" y="488">教</text>
  </g>
  <g stroke="currentColor" stroke-width="9">
    <line x1="960" y1="389.5" x2="1002" y2="389.5"/>
    <line x1="960" y1="405.5" x2="1002" y2="405.5"/>
  </g>
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="1049" y="158.5">す</text>
    <text x="1049" y="205">べ</text>
    <text x="1049" y="251">て</text>
    <text x="1049" y="296">の</text>
    <text x="1049" y="341">宗</text>
    <text x="1049" y="387">教</text>
    <text x="1049" y="434">の</text>
    <text x="1049" y="480">目</text>
    <text x="1049" y="525">的</text>
    <text x="1049" y="570">成</text>
    <text x="1049" y="616.5">就</text>
  </g>
</svg>
