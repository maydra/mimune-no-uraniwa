<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅰ. 万有原力</title>
  <defs>
    <marker id="z076-g" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C949A"/>
    </marker>
  </defs>

  <text x="73" y="79" font-size="46" text-anchor="middle">Ⅰ</text>
  <text x="99" y="79" font-size="46">.</text>
  <text x="124" y="79" font-size="48" textLength="200" lengthAdjust="spacing">万有原力</text>
  <line x1="124" y1="92.5" x2="324" y2="92.5" stroke="currentColor" stroke-width="4"/>

  <!-- 神 -->
  <circle cx="291" cy="274.5" r="57.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="288.5" y="274" font-size="58" text-anchor="middle" dominant-baseline="central">神</text>
  <rect x="378" y="193" width="293" height="163" rx="12" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g fill="currentColor">
    <circle cx="411.5" cy="224" r="10"/>
    <circle cx="411.5" cy="274" r="10"/>
    <circle cx="411.5" cy="325" r="10"/>
  </g>
  <g font-size="40" dominant-baseline="central">
    <text x="434" y="224" textLength="124" lengthAdjust="spacing">創造主</text>
    <text x="434" y="274" textLength="83" lengthAdjust="spacing">永遠</text>
    <text x="538.5" y="274" text-anchor="middle">・</text>
    <text x="557" y="274" textLength="84" lengthAdjust="spacing">自存</text>
    <text x="434" y="324" textLength="124" lengthAdjust="spacing">絶対者</text>
  </g>

  <!-- 被造物 -->
  <ellipse cx="285.5" cy="488.5" rx="81.5" ry="51.5" fill="#DCC4C4" stroke="currentColor" stroke-width="4"/>
  <text x="285" y="488" font-size="44" text-anchor="middle" dominant-baseline="central" fill="#111">被造物</text>
  <rect x="379" y="431" width="292" height="116" rx="12" fill="#DCC4C4" stroke="currentColor" stroke-width="4"/>
  <g font-size="46" dominant-baseline="central" fill="#111">
    <text x="428" y="464" textLength="187" lengthAdjust="spacing">存在する</text>
    <text x="428" y="516" textLength="187" lengthAdjust="spacing">ための力</text>
  </g>

  <!-- 万有原力から -->
  <g stroke="#8C949A" stroke-width="12.5" fill="none" marker-end="url(#z076-g)">
    <path d="M801.5,360 L711.75,315.4"/>
    <path d="M801.5,410 L710.7,458.6"/>
  </g>
  <path d="M801.5,352 Q801.5,344.5 808,343.8 C845,337 1026,337 1063,343.8 Q1069.5,344.5 1069.5,352 L1069.5,428 Q1069.5,434.5 1063,435.2 C1026,442 845,442 808,435.2 Q801.5,434.5 801.5,428 Z" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="821" y="389" font-size="56" textLength="224" lengthAdjust="spacing" dominant-baseline="central" fill="#111">万有原力</text>

  <g font-size="37" dominant-baseline="central">
    <text x="793" y="301" textLength="74" lengthAdjust="spacing">永遠</text>
    <text x="873" y="301">.</text>
    <text x="900" y="301" textLength="74" lengthAdjust="spacing">自存</text>
    <text x="976" y="301">.</text>
    <text x="1001" y="301" textLength="74" lengthAdjust="spacing">絶対</text>
  </g>

  <!-- 縦書き -->
  <g font-size="40" text-anchor="middle" dominant-baseline="central">
    <text x="742" y="106">根<tspan x="742" dy="41.5">本</tspan><tspan x="742" dy="41.5">的</tspan><tspan x="742" dy="41.5">な</tspan><tspan x="742" dy="41.5">力</tspan></text>
    <text x="737" y="503">力<tspan x="737" dy="42">の</tspan><tspan x="737" dy="42">根</tspan><tspan x="737" dy="42">本</tspan></text>
  </g>
</svg>
