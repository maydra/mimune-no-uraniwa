  <g font-size="44" text-anchor="middle" dominant-baseline="central">
    <text x="294.5" y="384">成</text>
    <text x="294.5" y="431">長</text>
    <text x="294.5" y="475.5">期</text>
    <text x="294.5" y="522">間</text>
  </g>
  <path d="M487,361 Q501,367 502.5,384 L502.5,428 Q503,446 519,451 Q503,456 502.5,474 L502.5,520 Q501,537 487,545" fill="none" stroke="currentColor" stroke-width="5.5"/>

  <!-- 創造原理 -->
  <rect x="602" y="164" width="216" height="74.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <polygon points="695,291.5 748,291.5 748,286 768.5,296.5 748,307 748,301.5 695,301.5" fill="#8C949A"/>
