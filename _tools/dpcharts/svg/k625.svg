<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>君主社会、帝国主義社会　宗教・政治・経済</title>

  <!-- 灰色の矢印と分かれの線（楕円・箱の下に描く） -->
  <g fill="#8C949A">
    <polygon points="209.5,61 216.5,61 216.5,144 221.5,144 213,159.5 204.5,144 209.5,144"/>
    <polygon points="209.5,265 216.5,265 216.5,358 221.5,358 213,373.5 204.5,358 209.5,358"/>
  </g>
  <path d="M290,216.5 H317.5 M340,122.5 H317.5 V310.5 H340" fill="none" stroke="#8C949A" stroke-width="6"/>

  <!-- 君主社会、帝国主義社会の楕円 -->
  <ellipse cx="213.5" cy="217" rx="87" ry="55" fill="#F8F28F" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text y="194"><tspan x="153.7" textLength="106.5" lengthAdjust="spacing">君主社会</tspan><tspan x="258.5">、</tspan></text>
    <text x="212.5" y="231" font-size="25" text-anchor="middle" textLength="148.5" lengthAdjust="spacing">帝国主義社会</text>
  </g>

  <!-- 宗教・政治・経済の札 -->
  <g stroke="currentColor" stroke-width="2.8">
    <rect x="337.5" y="84.5" width="40.5" height="67" rx="6" fill="#F98AEE"/>
    <rect x="337.5" y="183.5" width="40.5" height="67" rx="6" fill="#FCE5E3"/>
    <rect x="337.5" y="281.5" width="40.5" height="67" rx="6" fill="#A0F08A"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="358" y="104">宗</text>
    <text x="358" y="130.5">教</text>
    <text x="358" y="203">政</text>
    <text x="358" y="229.5">治</text>
    <text x="358" y="301">経</text>
    <text x="358" y="327">済</text>
  </g>

  <!-- 右の字 -->
  <g dominant-baseline="central">
    <text x="396.6" y="82.5" font-size="28" textLength="259" lengthAdjust="spacing">キリスト教君主社会</text>
    <text y="114" font-size="25"><tspan x="401.5" text-anchor="middle">(</tspan><tspan x="406.5" textLength="23.5" lengthAdjust="spacingAndGlyphs">9C</tspan><tspan x="447" text-anchor="middle">～</tspan><tspan x="467.5" textLength="33.5" lengthAdjust="spacingAndGlyphs">16C</tspan><tspan x="505.5" text-anchor="middle">)</tspan></text>
    <text y="148.5" font-size="22"><tspan x="406.5" text-anchor="middle">－</tspan><tspan x="418" textLength="283" lengthAdjust="spacing">法王を中心とした霊的王国</tspan></text>

    <text x="393.6" y="200" font-size="28" textLength="173.5" lengthAdjust="spacing">専制君主社会</text>
    <text y="234.5" font-size="25"><tspan x="400.5" text-anchor="middle">(</tspan><tspan x="407.5" textLength="32.5" lengthAdjust="spacingAndGlyphs">17C</tspan></text>
    <text y="234.5" font-size="22"><tspan x="448" textLength="45.5" lengthAdjust="spacing">中葉</tspan></text>
    <text y="234.5" font-size="25"><tspan x="505.5" text-anchor="middle">～</tspan><tspan x="525.5" textLength="33.5" lengthAdjust="spacingAndGlyphs">18C</tspan></text>
    <text y="234.5" font-size="22"><tspan x="565" textLength="22.5" lengthAdjust="spacing">末</tspan></text>
    <text x="592.5" y="234.5" font-size="25" text-anchor="middle">)</text>

    <text x="394.7" y="292.5" font-size="26" textLength="157.6" lengthAdjust="spacing">資本主義社会</text>
    <text x="394.7" y="332" font-size="26" textLength="157.6" lengthAdjust="spacing">帝国主義社会</text>
    <g font-size="25">
      <text y="292.5"><tspan x="563.5" text-anchor="middle">(</tspan><tspan x="570.5" textLength="33.5" lengthAdjust="spacingAndGlyphs">17C</tspan></text>
      <text y="332"><tspan x="563.5" text-anchor="middle">(</tspan><tspan x="570.5" textLength="33.5" lengthAdjust="spacingAndGlyphs">19C</tspan></text>
      <text y="292.5"><tspan x="669" text-anchor="middle">～</tspan><tspan x="685" text-anchor="middle">)</tspan></text>
      <text y="332"><tspan x="669" text-anchor="middle">～</tspan><tspan x="685" text-anchor="middle">)</tspan></text>
    </g>
    <g font-size="22">
      <text x="611" y="292.5" textLength="45.5" lengthAdjust="spacing">中葉</text>
      <text x="611" y="332" textLength="45.5" lengthAdjust="spacing">中葉</text>
    </g>
  </g>
</svg>
