<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. ノアの家庭が見せてくれた教訓</title>

  <!-- 題 -->
  <text x="39" y="37.5" font-size="30" dominant-baseline="central">Ⅲ.</text>
  <text x="89" y="37.5" font-size="31" dominant-baseline="central" textLength="436" lengthAdjust="spacing">ノアの家庭が見せてくれた教訓</text>
  <line x1="86" y1="56.5" x2="526" y2="56.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 箇条 -->
  <g font-size="31" dominant-baseline="central">
    <text x="169.5" y="102.5" text-anchor="middle">①</text>
    <text x="192" y="102.5" textLength="125" lengthAdjust="spacing">神への道</text>
    <text x="230" y="147" textLength="252" lengthAdjust="spacing">謙虚、従順、忍耐</text>
    <text x="169.5" y="209.5" text-anchor="middle">②</text>
    <text x="193" y="209.5" textLength="312" lengthAdjust="spacing">み旨成就に対する予定</text>
    <text x="231" y="254" textLength="219" lengthAdjust="spacing">人間の責任分担</text>
    <text x="169.5" y="316.5" text-anchor="middle">③</text>
    <text x="192" y="316.5" textLength="250" lengthAdjust="spacing">人間に対する予定</text>
    <text x="231" y="363" textLength="364" lengthAdjust="spacing">責任を全うできなければ、</text>
    <text x="230" y="402.5" textLength="218" lengthAdjust="spacing">代身者をたてる</text>
  </g>

  <!-- … -->
  <g>
    <circle cx="194.5" cy="147" r="2.6"/>
    <circle cx="205" cy="147" r="2.6"/>
    <circle cx="215.5" cy="147" r="2.6"/>
    <circle cx="194.5" cy="254" r="2.6"/>
    <circle cx="205" cy="254" r="2.6"/>
    <circle cx="215.5" cy="254" r="2.6"/>
    <circle cx="194.5" cy="363" r="2.6"/>
    <circle cx="205" cy="363" r="2.6"/>
    <circle cx="215.5" cy="363" r="2.6"/>
  </g>
</svg>
