<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>4. 復帰摂理から見た第一次大戦の結果</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="33" y="39.5" font-size="30">4.</text>
    <text x="71" y="39.5" font-size="31" textLength="505" lengthAdjust="spacing">復帰摂理から見た第一次大戦の結果</text>
  </g>
  <line x1="71" y1="58.6" x2="575" y2="58.6" stroke="currentColor" stroke-width="2.2"/>

  <!-- 第一次大戦 → 天の側の勝利 -->
  <ellipse cx="408" cy="122.5" rx="249.5" ry="30.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28.5" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="298" y="122" textLength="145" lengthAdjust="spacing">第一次大戦</text>
    <text x="506.5" y="122" textLength="172" lengthAdjust="spacing">天の側の勝利</text>
  </g>
  <polygon points="385,118 395.5,118 395.5,113 407.5,122.5 395.5,132 395.5,127.5 385,127.5" fill="#8C949A"/>

  <!-- 箇条 -->
  <g font-size="29" text-anchor="middle" dominant-baseline="central">
    <text x="187" y="204.5">①</text>
    <text x="187" y="270">②</text>
    <text x="187" y="335.5">③</text>
  </g>
  <g font-size="28.5" dominant-baseline="central">
    <text x="208" y="204.5" textLength="404" lengthAdjust="spacing">三大祝福復帰の蘇生的蕩減条件</text>
    <text x="207" y="270" textLength="174" lengthAdjust="spacing">第一祝福復帰</text>
    <text x="207" y="335.5" textLength="289" lengthAdjust="spacing">主権復帰の蘇生的基台</text>
  </g>
</svg>
