    <polygon points="302,106.5 319,106.5 319,102.5 337,110.5 319,118.5 319,114.5 302,114.5"/>
    <polygon points="454,106.5 471,106.5 471,102.5 489,110.5 471,118.5 471,114.5 454,114.5"/>
    <polygon points="302,340 319,340 319,336 337,344 319,352 319,348 302,348"/>
    <polygon points="454,340 471,340 471,336 489,344 471,352 471,348 454,348"/>
