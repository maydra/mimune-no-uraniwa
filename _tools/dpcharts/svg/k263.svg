<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. 第二次民族的カナン復帰路程　(1) 信仰基台</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="33" y="36">2.</text>
    <text x="69" y="36" textLength="408" lengthAdjust="spacing">第二次民族的カナン復帰路程</text>
    <text x="61" y="82.5" textLength="40" lengthAdjust="spacingAndGlyphs">(1)</text>
    <text x="114" y="82.5" textLength="125" lengthAdjust="spacing">信仰基台</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="68" y1="55" x2="478" y2="55"/>
    <line x1="114" y1="102" x2="239" y2="102"/>
  </g>

  <!-- 神 -->
  <circle cx="187" cy="161" r="35.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="187" y="161" font-size="39" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 灰色の矢印 -->
  <polygon points="186.5,200 195,216 189.5,216 189.5,302 183.5,302 183.5,216 178,216" fill="#8C949A"/>

  <!-- 信仰基台 -->
  <rect x="220.5" y="208.5" width="84" height="81" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="262" y="231" textLength="54" lengthAdjust="spacing">信仰</text>
    <text x="262" y="268" textLength="54" lengthAdjust="spacing">基台</text>
  </g>
  <path d="M341,203.5 H322 V288.5 H341 M304.5,246 H341" fill="none" stroke="#8C949A" stroke-width="3.5"/>
  <g font-size="24" dominant-baseline="central">
    <text x="350" y="202.5" textLength="99" lengthAdjust="spacing">中心人物</text>
    <text x="475" y="202.5" textLength="73" lengthAdjust="spacing">モーセ</text>
    <text x="350" y="245.5" textLength="74" lengthAdjust="spacing">条件物</text>
    <text x="449" y="245.5" textLength="99" lengthAdjust="spacing">神のみ言</text>
    <text x="350" y="288.5" textLength="99" lengthAdjust="spacing">蕩減期間</text>
    <text x="476" y="288.5" textLength="148" lengthAdjust="spacing">ミデヤン荒野</text>
    <text x="629" y="288.5" textLength="23" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="654" y="288.5">年</text>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="central">
    <text x="460.5" y="202.5">：</text>
    <text x="435.5" y="245.5">：</text>
    <text x="460.5" y="288.5">：</text>
  </g>

  <!-- モーセ -->
  <ellipse cx="186.5" cy="336" rx="59" ry="33.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="186.5" y="336.5" font-size="30" text-anchor="middle" dominant-baseline="central" textLength="89" lengthAdjust="spacing" fill="#111">モーセ</text>

  <!-- 信仰基台：○ -->
  <rect x="345.5" y="331.5" width="226" height="49" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <g font-size="31" dominant-baseline="central" fill="#111">
    <text x="362" y="356" textLength="131" lengthAdjust="spacing">信仰基台</text>
    <text x="508.5" y="356" text-anchor="middle">：</text>
  </g>
  <circle cx="540.5" cy="356" r="12" fill="none" stroke="#111" stroke-width="3.2"/>
</svg>
