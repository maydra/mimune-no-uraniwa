<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(5) 責任分担から見た時代区分</title>

  <text x="44.5" y="36.5" font-size="30" dominant-baseline="central" textLength="46" lengthAdjust="spacingAndGlyphs">(5)</text>
  <text x="98" y="36.5" font-size="30" dominant-baseline="central" textLength="379" lengthAdjust="spacing">責任分担から見た時代区分</text>
  <line x1="98" y1="55.5" x2="476" y2="55.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 段の横線（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="136" y1="104" x2="684.5" y2="104"/>
    <line x1="136" y1="172" x2="684.5" y2="172"/>
    <line x1="136" y1="236" x2="684.5" y2="236"/>
    <line x1="136" y1="303" x2="684.5" y2="303"/>
  </g>

  <!-- 2000年の弧（字の所で切れる） -->
  <g fill="none" stroke="currentColor" stroke-width="2.2">
    <path d="M237,364 A60,61 0 0 0 271.1,353.2 M288.6,334.1 A60,61 0 0 0 297,303"/>
    <path d="M297,303 A64,67 0 0 0 336,289.1 M353.7,267 A64,67 0 0 0 361,236"/>
    <path d="M361,236 A62,63 0 0 0 394.6,226 M416.5,201 A62,63 0 0 0 423,173"/>
  </g>

