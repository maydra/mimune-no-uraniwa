<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>洗礼ヨハネを中心とする信仰基台</title>

  <!-- 灰色の矢印と括弧 -->
  <polygon points="211,150 220,167 214.5,167 214.5,297 207.5,297 207.5,167 202,167" fill="#8C949A"/>
  <path d="M358,161.5 H337.5 V293 H358 M314,221 H358" fill="none" stroke="#8C949A" stroke-width="5"/>

  <!-- 神 -->
  <circle cx="211.5" cy="106" r="35.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="210.5" y="105" font-size="38" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 洗礼ヨハネ -->
  <ellipse cx="211.5" cy="330" rx="66.5" ry="33.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <text x="211.5" y="331" font-size="25" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="120" lengthAdjust="spacing">洗礼ヨハネ</text>

  <!-- 信仰基台 -->
  <rect x="230" y="181" width="84" height="80" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="271" y="205" textLength="55" lengthAdjust="spacing">信仰</text>
    <text x="271" y="239" textLength="55" lengthAdjust="spacing">基台</text>
  </g>

  <!-- 中心人物・条件物・蕩減期間 -->
  <g font-size="28" dominant-baseline="central">
    <text x="368" y="161.5" textLength="112" lengthAdjust="spacing">中心人物</text>
    <text x="495" y="161.5" text-anchor="middle">：</text>
    <text x="511" y="161.5" textLength="142" lengthAdjust="spacing">洗礼ヨハネ</text>
    <text x="365" y="220" textLength="84" lengthAdjust="spacing">条件物</text>
    <text x="464" y="220" text-anchor="middle">：</text>
    <text x="480" y="220" textLength="141" lengthAdjust="spacing">天に対する</text>
    <text x="481" y="254" textLength="113" lengthAdjust="spacing">忠孝の道</text>
    <text x="365" y="294" textLength="113" lengthAdjust="spacing">蕩減期間</text>
    <text x="494" y="294" text-anchor="middle">：</text>
    <text x="510" y="294" textLength="170" lengthAdjust="spacing">荒野生活期間</text>
  </g>

  <!-- 信仰基台：○ -->
  <rect x="355" y="333" width="228" height="49" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="376" y="358.5" textLength="124" lengthAdjust="spacing">信仰基台</text>
    <text x="516" y="358.5" text-anchor="middle">：</text>
  </g>
  <circle cx="548" cy="358.5" r="12" fill="none" stroke="#111" stroke-width="3.2"/>
</svg>
