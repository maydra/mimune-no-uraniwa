<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅳ. 再臨復活から見た輪廻説</title>

  <text x="75.5" y="56.5" font-size="46" text-anchor="middle" dominant-baseline="central">Ⅳ</text>
  <text x="99.6" y="56.5" font-size="46" dominant-baseline="central">.</text>
  <text x="128" y="56" font-size="48" dominant-baseline="central" textLength="547" lengthAdjust="spacing">再臨復活から見た輪廻説</text>
  <line x1="125" y1="86.5" x2="676" y2="86.5" stroke="currentColor" stroke-width="4"/>

  <!-- 上の人物 -->
  <g font-size="44" text-anchor="middle" dominant-baseline="central">
    <text x="510" y="175" textLength="226" lengthAdjust="spacing">アブラハム</text>
    <text x="819.5" y="175" textLength="134" lengthAdjust="spacing">モーセ</text>
    <text x="1025.5" y="175" textLength="134" lengthAdjust="spacing">イエス</text>
  </g>

  <!-- 左の見出し -->
  <g font-size="48" dominant-baseline="central">
    <text x="218" y="277" textLength="101" lengthAdjust="spacing">個人</text>
    <text x="218" y="340" textLength="101" lengthAdjust="spacing">使命</text>
    <text x="218" y="496" textLength="101" lengthAdjust="spacing">復帰</text>
    <text x="218" y="559" textLength="101" lengthAdjust="spacing">摂理</text>
  </g>

  <line x1="192" y1="416.5" x2="1100" y2="416.5" stroke="currentColor" stroke-width="6"/>

  <!-- 個人使命（上）と復帰摂理（下） -->
  <g fill="#FCE5E3" stroke="currentColor" stroke-width="4.5">
    <ellipse cx="406.5" cy="308.5" rx="50.5" ry="90"/>
    <ellipse cx="612.5" cy="308.5" rx="50.5" ry="90"/>
    <ellipse cx="819.5" cy="308.5" rx="50.5" ry="90"/>
    <ellipse cx="1026" cy="308.5" rx="50.5" ry="90"/>
    <ellipse cx="406.5" cy="527.5" rx="50.5" ry="90"/>
    <ellipse cx="612.5" cy="527.5" rx="50.5" ry="90"/>
    <ellipse cx="819.5" cy="527.5" rx="50.5" ry="90"/>
    <ellipse cx="1026" cy="527.5" rx="50.5" ry="90"/>
  </g>
  <g font-size="42" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="405.5" y="266.5">個</text>
    <text x="405.5" y="309">人</text>
    <text x="405.5" y="349.5">型</text>
    <text x="612.5" y="266.5">家</text>
    <text x="612.5" y="309">庭</text>
    <text x="612.5" y="349.5">型</text>
    <text x="819" y="266.5">民</text>
    <text x="819" y="309">族</text>
    <text x="819" y="349.5">型</text>
    <text x="1025.5" y="266.5">世</text>
    <text x="1025.5" y="309">界</text>
    <text x="1025.5" y="349.5">型</text>
    <text x="405.5" y="485.5">個</text>
    <text x="405.5" y="569.5">人</text>
    <text x="612.5" y="485.5">家</text>
    <text x="612.5" y="569.5">庭</text>
    <text x="819" y="485.5">民</text>
    <text x="819" y="569.5">族</text>
    <text x="1025.5" y="485.5">世</text>
    <text x="1025.5" y="569.5">界</text>
  </g>

  <!-- 摂理の進む矢印 -->
  <g fill="#8C949A">
    <polygon points="479,524 520,524 520,516.5 541,527.75 520,539 520,532 479,532"/>
    <polygon points="686,524 727,524 727,516.5 748,527.75 727,539 727,532 686,532"/>
    <polygon points="894,524 935,524 935,516.5 956,527.75 935,539 935,532 894,532"/>
  </g>
</svg>
