<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>4. 封建社会</title>

  <!-- 題 -->
  <g dominant-baseline="central">
    <text x="33" y="35.5" font-size="30" textLength="26" lengthAdjust="spacingAndGlyphs">4.</text>
    <text x="69.5" y="35" font-size="29" textLength="116" lengthAdjust="spacing">封建社会</text>
  </g>
  <line x1="70" y1="53" x2="185" y2="53" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印とつなぎの線（楕円・箱の下に描く） -->
  <g fill="#8C949A">
    <polygon points="212,76 219,76 219,115 224.5,115 215.5,130 206.5,115 212,115"/>
    <polygon points="212,200 219,200 219,328 224.5,328 215.5,343.5 206.5,328 212,328"/>
  </g>
  <line x1="290" y1="176.5" x2="330" y2="176.5" stroke="#8C949A" stroke-width="6"/>

  <!-- 封建社会の楕円 -->
  <ellipse cx="215.5" cy="177.5" rx="86.5" ry="42" fill="#F8F28F" stroke="currentColor" stroke-width="2.8"/>
  <text x="215.5" y="176.5" font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="116" lengthAdjust="spacing">封建社会</text>

  <!-- 政治の札 -->
  <rect x="324.5" y="139.5" width="42.5" height="77" rx="6" fill="#FCE5E3" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="346" y="162.5">政</text>
    <text x="346" y="192">治</text>
  </g>

  <!-- 右の字 -->
  <g dominant-baseline="central">
    <text x="381.5" y="108.5" font-size="29" textLength="232" lengthAdjust="spacing">西ローマ帝国滅亡</text>
    <text x="381.5" y="177" font-size="28" textLength="116" lengthAdjust="spacing">封建社会</text>
  </g>
  <g>
    <circle cx="382" cy="228" r="7.5"/>
    <circle cx="382" cy="264.5" r="7.5"/>
    <circle cx="382" cy="301" r="7.5"/>
    <circle cx="382" cy="339" r="7.5"/>
    <circle cx="382" cy="376" r="7.5"/>
  </g>
  <g dominant-baseline="central" font-size="26">
    <text x="395.7" y="227.5" textLength="290" lengthAdjust="spacing">領主と騎士間の主従関係</text>
    <text x="395.7" y="264" textLength="105" lengthAdjust="spacing">地方分権</text>
    <text y="301"><tspan x="395.7" textLength="105" lengthAdjust="spacing">独立領地</tspan><tspan x="515.5" text-anchor="middle">(</tspan><tspan x="521.7" textLength="78.6" lengthAdjust="spacing">恩貸地</tspan><tspan x="604" text-anchor="middle">)</tspan></text>
    <text x="395.7" y="337.5" textLength="78.6" lengthAdjust="spacing">裁判権</text>
    <text x="395.7" y="374.5" textLength="52.6" lengthAdjust="spacing">荘園</text>
  </g>
</svg>
