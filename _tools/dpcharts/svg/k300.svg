<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(3) 幕屋を中心とする復帰摂理</title>

  <!-- 題 -->
  <g font-size="31" dominant-baseline="central">
    <text x="49" y="37" textLength="42" lengthAdjust="spacingAndGlyphs">(3)</text>
    <text x="106" y="37" textLength="379" lengthAdjust="spacing">幕屋を中心とする復帰摂理</text>
  </g>
  <line x1="106" y1="56" x2="484" y2="56" stroke="currentColor" stroke-width="2.4"/>

  <!-- 黒い矢印 -->
  <g fill="currentColor">
    <polygon points="197.5,64.5 203.5,64.5 203.5,88 207,88 200.5,100.5 194,88 197.5,88"/>
    <polygon points="197.5,150 203.5,150 203.5,335.5 207.5,335.5 200.5,348.5 193.5,335.5 197.5,335.5"/>
  </g>

  <!-- シナイの荒野 -->
  <ellipse cx="202" cy="127.75" rx="85.5" ry="24.75" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="201.5" y="127.5" font-size="25" text-anchor="middle" dominant-baseline="central" textLength="140" lengthAdjust="spacing" fill="#111">シナイの荒野</text>

  <!-- 一次・二次 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6">
    <rect x="214" y="186" width="75" height="37"/>
    <rect x="215" y="319" width="74" height="37"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="251.5" y="204" textLength="51" lengthAdjust="spacing">一次</text>
    <text x="252.5" y="338" textLength="51" lengthAdjust="spacing">二次</text>
  </g>

  <!-- 灰色の括弧 -->
  <g fill="#8C949A">
    <rect x="299.5" y="158.5" width="6" height="88"/>
    <rect x="299.5" y="158.5" width="24" height="6"/>
    <rect x="299.5" y="199.5" width="24" height="6"/>
    <rect x="299.5" y="240.5" width="24" height="6"/>
    <rect x="299.5" y="293.5" width="6" height="88"/>
    <rect x="299.5" y="293.5" width="24" height="6"/>
    <rect x="299.5" y="334.5" width="24" height="6"/>
    <rect x="299.5" y="375.5" width="24" height="6"/>
  </g>

  <!-- 一次の中身 -->
  <g font-size="27" dominant-baseline="central">
    <text x="328.5" y="160.5" textLength="116" lengthAdjust="spacing">40日断食</text>
    <text x="329" y="202.5" textLength="367" lengthAdjust="spacingAndGlyphs">契約の箱、幕屋、二つの石板（十戒）</text>
    <text x="329" y="244.5" textLength="368" lengthAdjust="spacingAndGlyphs">金の子牛拝む、石板投げつけ、壊す</text>
  </g>
  <!-- 二次の中身 -->
  <g font-size="28" dominant-baseline="central">
    <text x="328.5" y="297.5" font-size="27" textLength="116" lengthAdjust="spacing">40日断食</text>
    <text x="328.5" y="339.5" textLength="233" lengthAdjust="spacing">二つの石板（十戒）</text>
    <text x="329.5" y="382" textLength="340" lengthAdjust="spacing">モーセに仕える、幕屋建設</text>
  </g>
</svg>
