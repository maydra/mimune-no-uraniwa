<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神がアブラハムを再び立てられた理由</title>

  <text x="33" y="38" font-size="30" dominant-baseline="central" textLength="536" lengthAdjust="spacing">神がアブラハムを再び立てられた理由</text>
  <line x1="34" y1="57.5" x2="570" y2="57.5" stroke="currentColor" stroke-width="3"/>

  <!-- ①②③ -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="180" cy="131" r="14.2"/>
    <circle cx="179.5" cy="242" r="14.2"/>
    <circle cx="180" cy="356" r="14.2"/>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="179.5" y="132">1</text>
    <text x="179.5" y="243">2</text>
    <text x="180" y="357">3</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="274,170 300,170 300,162 316,174 300,186 300,178.3 274,178.3"/>
    <polygon points="273,281 299,281 299,273 315,285 299,297 299,289.3 273,289.3"/>
  </g>

  <g font-size="30" dominant-baseline="central">
    <text x="200" y="131" textLength="250" lengthAdjust="spacing">アブラハムの家庭</text>
    <text x="466" y="131" text-anchor="middle">：</text>
    <text x="482" y="131" textLength="189" lengthAdjust="spacing">第三次の摂理</text>
    <text x="325" y="174.5" textLength="157" lengthAdjust="spacing">原理的条件</text>
    <text x="199" y="242" textLength="92" lengthAdjust="spacing">サタン</text>
    <text x="308.5" y="242" text-anchor="middle">：</text>
    <text x="326" y="242" textLength="283" lengthAdjust="spacing">二代にわたって侵入</text>
    <text x="326" y="286" textLength="345" lengthAdjust="spacing">二代にわたって取り返す</text>
    <text x="198" y="356" textLength="283" lengthAdjust="spacing">歴史的な心情の基台</text>
  </g>
</svg>
