<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. 天と地を火をもって審判される</title>

  <text x="51.5" y="57.5" font-size="46" dominant-baseline="central">2.</text>
  <text x="113" y="57" font-size="50" dominant-baseline="central" textLength="701" lengthAdjust="spacing">天と地を火をもって審判される</text>
  <line x1="113" y1="87.5" x2="814" y2="87.5" stroke="currentColor" stroke-width="4"/>

  <text y="125" font-size="42" dominant-baseline="central"><tspan x="788" textLength="197" lengthAdjust="spacingAndGlyphs">【ペテロⅡ </tspan><tspan x="985" textLength="104" lengthAdjust="spacingAndGlyphs">3:12】</tspan></text>

  <!-- ● -->
  <circle cx="240.5" cy="213.5" r="11"/>
  <circle cx="237.5" cy="304.5" r="11"/>
  <circle cx="241.5" cy="479.5" r="11"/>
  <g font-size="45" font-weight="400" dominant-baseline="central">
    <text y="212.5"><tspan x="261" textLength="289" lengthAdjust="spacingAndGlyphs">イエスのときにも</tspan><tspan x="550.5">、</tspan><tspan x="590" textLength="255" lengthAdjust="spacingAndGlyphs">火をもって審判</tspan><tspan x="854.5" textLength="135.5" lengthAdjust="spacingAndGlyphs">(マラキ </tspan><tspan x="990" textLength="73.5" lengthAdjust="spacingAndGlyphs">4:1)</tspan></text>
    <text y="301"><tspan x="261" textLength="585" lengthAdjust="spacingAndGlyphs">イエスは火を地上に投じるために…</tspan><tspan x="854.5" textLength="98" lengthAdjust="spacingAndGlyphs">(ルカ </tspan><tspan x="952.5" textLength="111" lengthAdjust="spacingAndGlyphs">12:49)</tspan></text>
    <text y="477.5"><tspan x="261.5" font-size="44.5" textLength="268.5" lengthAdjust="spacing">舌は火である</tspan><tspan x="544.5" textLength="153.5" lengthAdjust="spacingAndGlyphs">(ヤコブ </tspan><tspan x="698" textLength="81.5" lengthAdjust="spacingAndGlyphs">3:6)</tspan></text>
  </g>

  <!-- ⇒ 火の審判の痕跡なし -->
  <polygon points="265,383 291.5,383 291.5,373 315.5,389.5 291.5,406 291.5,396 265,396" fill="#8C949A"/>
  <text x="329.5" y="389" font-size="45" dominant-baseline="central" textLength="407.5" lengthAdjust="spacing">火の審判の痕跡なし</text>

  <!-- 結論 -->
  <rect x="252.5" y="554.5" width="796.5" height="78.5" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="5"/>
  <text x="281.5" y="592.5" font-size="49" dominant-baseline="central" fill="#111" textLength="740" lengthAdjust="spacing">火の審判＝舌の審判＝み言の審判</text>
</svg>
