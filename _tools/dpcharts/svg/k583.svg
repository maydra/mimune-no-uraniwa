<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>メシヤ降臨準備時代とメシヤ再降臨準備時代　「信仰基台」復帰</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="127" y="45" width="277.5" height="53" rx="5"/>
    <rect x="413.5" y="45" width="277.5" height="53" rx="5"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="266" y="71.5" textLength="259" lengthAdjust="spacingAndGlyphs">メシヤ降臨準備時代</text>
    <text x="552" y="71.5" textLength="259" lengthAdjust="spacingAndGlyphs">メシヤ再降臨準備時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <rect x="129" y="106.5" width="275.5" height="286.5" rx="6"/>
    <rect x="415" y="106.5" width="275.5" height="286.5" rx="6"/>
  </g>

  <!-- ①② -->
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="150" cy="129" r="10.5"/>
    <circle cx="436.5" cy="127" r="10.5"/>
  </g>
  <g font-size="16" text-anchor="middle" dominant-baseline="central">
    <text x="150" y="129.5">1</text>
    <text x="436.5" y="127.5">2</text>
  </g>

  <!-- 見出しの字 -->
  <g font-size="26" dominant-baseline="central">
    <text x="145" y="162.5" textLength="182" lengthAdjust="spacing">イスラエル民族</text>
    <text x="340.5" y="162.5" text-anchor="middle">：</text>
    <text x="432" y="161.5" textLength="182" lengthAdjust="spacing">キリスト教信徒</text>
    <text x="627.5" y="161.5" text-anchor="middle">：</text>
  </g>

  <!-- 箇条の点 -->
  <g>
    <circle cx="152" cy="203" r="5.5"/>
    <circle cx="152" cy="245.5" r="5.5"/>
    <circle cx="152" cy="317" r="5.5"/>
    <circle cx="434.5" cy="201" r="5.5"/>
    <circle cx="434.5" cy="277" r="5.5"/>
    <circle cx="434.5" cy="317" r="5.5"/>
  </g>
  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="162" y="203.5" textLength="120" lengthAdjust="spacing">神殿を新築</text>
    <text x="162" y="245.5" textLength="205" lengthAdjust="spacing">マラキの指導による</text>
    <text x="162" y="277.5" textLength="112" lengthAdjust="spacing">律法の研究</text>
    <text x="162" y="316.5" textLength="120" lengthAdjust="spacing">信仰の刷新</text>
    <text x="447" y="200.5" textLength="141" lengthAdjust="spacing">ルターなどを</text>
    <text x="447" y="232.5" textLength="213" lengthAdjust="spacing">中心とする宗教改革</text>
    <text x="446" y="276.5" textLength="167" lengthAdjust="spacing">福音の光に従い</text>
    <text x="446" y="316.5" textLength="120" lengthAdjust="spacing">信仰の刷新</text>
  </g>

  <!-- 「信仰基台」復帰 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="145" y="346" width="241" height="34"/>
    <rect x="431" y="345" width="241" height="34"/>
  </g>
  <g font-size="26" font-weight="400" dominant-baseline="central" fill="#111">
    <text y="362.5"><tspan x="168">「</tspan><tspan x="181" textLength="104" lengthAdjust="spacing">信仰基台</tspan><tspan x="285">」</tspan><tspan x="312" textLength="52" lengthAdjust="spacing">復帰</tspan></text>
    <text y="361.5"><tspan x="454">「</tspan><tspan x="466" textLength="104" lengthAdjust="spacing">信仰基台</tspan><tspan x="571">」</tspan><tspan x="598" textLength="52" lengthAdjust="spacing">復帰</tspan></text>
  </g>
</svg>
