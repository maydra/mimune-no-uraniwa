<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <!-- 元の図は「使行 2:1～4」。本文と同じ「使徒」に直した（2026-10-31、ユーザー「誤表記は直そう」） -->
  <title>(3) メシヤのための霊的な基台</title>

  <text x="45" y="36.5" font-size="30" dominant-baseline="central" textLength="52" lengthAdjust="spacingAndGlyphs">(3)</text>
  <text x="106.5" y="36.5" font-size="30" dominant-baseline="central" textLength="375" lengthAdjust="spacing">メシヤのための霊的な基台</text>
  <line x1="104" y1="55.5" x2="483" y2="55.5" stroke="currentColor" stroke-width="2.4"/>

  <!-- メシヤのための霊的な基台：○ -->
  <rect x="207.5" y="74.5" width="394" height="39.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="224.5" y="94" textLength="312" lengthAdjust="spacing">メシヤのための霊的な基台</text>
    <text x="551.5" y="94" text-anchor="middle">：</text>
  </g>
  <circle cx="574" cy="93.5" r="10" fill="none" stroke="#111" stroke-width="3.2"/>

  <polygon points="402.5,121.5 413.5,121.5 413.5,130.5 420.5,130.5 408,139.5 395.5,130.5 402.5,130.5" fill="#8C949A"/>

  <!-- イエス：霊的メシヤの立場 -->
  <rect x="230.5" y="144.5" width="350.5" height="36.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" dominant-baseline="central">
    <text x="250.5" y="163" textLength="75" lengthAdjust="spacingAndGlyphs">イエス</text>
    <text x="340.5" y="163" text-anchor="middle">：</text>
    <text x="354.5" y="163" textLength="208" lengthAdjust="spacing">霊的メシヤの立場</text>
  </g>

  <!-- 霊的真の父・母、霊的重生の役事 -->
  <g font-size="23" text-anchor="middle" dominant-baseline="central" font-weight="400">
    <text x="263" y="209.5" textLength="117" lengthAdjust="spacing">霊的真の父</text>
    <text x="547.5" y="209.5" textLength="116" lengthAdjust="spacing">霊的真の母</text>
    <text x="407.5" y="399.5" textLength="164" lengthAdjust="spacing">霊的重生の役事</text>
  </g>

  <!-- 授受の矢印 -->
  <g fill="none" stroke="currentColor" stroke-width="3.6">
    <path d="M343,250.5 Q401.5,228.5 459,248"/>
    <path d="M467,266.5 Q409,288.75 351,270"/>
  </g>
  <g fill="currentColor">
    <polygon points="468.5,251.2 457.1,253.7 460.9,242.3"/>
    <polygon points="341.5,267.1 352.8,264.3 349.2,275.7"/>
  </g>

  <!-- 信徒へつなぐ線（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="4.5">
    <line x1="264" y1="263" x2="375" y2="337"/>
    <line x1="549" y1="259.5" x2="432" y2="340"/>
  </g>

  <!-- 霊的メシヤ・聖霊・信徒 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="264" cy="263" rx="64.8" ry="32.8" fill="#F98AEE"/>
    <ellipse cx="547" cy="259.5" rx="64.8" ry="33.2" fill="#A0F08A"/>
    <ellipse cx="406" cy="344" rx="64.8" ry="32.8" fill="#FCE5E3"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="263.5" y="249">霊的</text>
    <text x="264.5" y="277.5" textLength="74" lengthAdjust="spacingAndGlyphs">メシヤ</text>
  </g>
  <g font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="525.5" y="260">聖</text>
    <text x="569.5" y="260">霊</text>
    <text x="383" y="344.5">信</text>
    <text x="428" y="344.5">徒</text>
  </g>

  <text y="313" font-size="22" dominant-baseline="central"><tspan x="496.5">（使徒</tspan><tspan x="556">2:1</tspan><tspan x="596">～</tspan><tspan x="620" textLength="10" lengthAdjust="spacingAndGlyphs">4</tspan><tspan x="630">）</tspan></text>
</svg>
