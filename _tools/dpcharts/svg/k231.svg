<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑥ 母子協助でサタン分立</title>
  <text x="49.5" y="37" font-size="29" text-anchor="middle" dominant-baseline="central">⑥</text>
  <text x="70" y="37" font-size="29" dominant-baseline="central" textLength="290" lengthAdjust="spacing">母子協助でサタン分立</text>
  <line x1="70" y1="54.5" x2="360" y2="54.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- エバとカインをつなぐ線と、縦の矢印（楕円の下に描く） -->
  <line x1="311" y1="100" x2="311" y2="156" stroke="#8C949A" stroke-width="6"/>
  <polygon points="308,176 314,176 314,200 318.5,200 311,212 303.5,200 308,200" fill="#8C949A"/>
  <polygon points="308,256 314,256 314,274 318.5,274 311,286 303.5,274 308,274" fill="#8C949A"/>
  <polygon points="308,331 314,331 314,348 318.5,348 311,360 303.5,348 308,348" fill="#8C949A"/>

  <!-- エバ・カイン → ヤコブ → モーセ → イエス -->
  <ellipse cx="310.5" cy="100.5" rx="45.5" ry="23.5" fill="#CF921C" stroke="currentColor" stroke-width="2.2"/>
  <text x="310" y="100.5" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="47" lengthAdjust="spacingAndGlyphs">エバ</text>
  <ellipse cx="310.5" cy="156.5" rx="45.5" ry="23.5" fill="#F86D42" stroke="currentColor" stroke-width="2.2"/>
  <text x="310.5" y="156.5" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="69" lengthAdjust="spacingAndGlyphs">カイン</text>
  <ellipse cx="310.5" cy="236.5" rx="45.5" ry="23.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="310.5" y="237.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="71" lengthAdjust="spacingAndGlyphs">ヤコブ</text>
  <ellipse cx="310.5" cy="311.5" rx="45.5" ry="23.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="310" y="311" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="70" lengthAdjust="spacingAndGlyphs">モーセ</text>
  <ellipse cx="311" cy="386.5" rx="50" ry="24.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2"/>
  <text x="310.5" y="387" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="70" lengthAdjust="spacingAndGlyphs">イエス</text>

  <!-- 母・子と説明 -->
  <text x="236.5" y="101" font-size="28" text-anchor="middle" dominant-baseline="central">母</text>
  <text x="236.5" y="157" font-size="28" text-anchor="middle" dominant-baseline="central">子</text>
  <text x="393" y="100.5" font-size="28" dominant-baseline="central" textLength="87" lengthAdjust="spacing">罪の根</text>
  <text x="393" y="156.5" font-size="28" dominant-baseline="central" textLength="86" lengthAdjust="spacing">罪の実</text>
  <text x="393" y="236.5" font-size="28" dominant-baseline="central" textLength="115" lengthAdjust="spacing">母親協助</text>
  <text x="393" y="311.5" font-size="28" dominant-baseline="central" textLength="115" lengthAdjust="spacing">母親協助</text>
  <text x="393" y="386.5" font-size="28" dominant-baseline="central" textLength="115" lengthAdjust="spacing">母親協助</text>
</svg>
