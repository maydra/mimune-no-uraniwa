<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第二次民族的カナン復帰路程の出発</title>

  <!-- 題 -->
  <text x="34" y="38" font-size="30" dominant-baseline="central" textLength="501" lengthAdjust="spacing">第二次民族的カナン復帰路程の出発</text>
  <line x1="32" y1="56.5" x2="537" y2="56.5" stroke="currentColor" stroke-width="2"/>

  <!-- 実体基台 -->
  <rect x="302.5" y="85.5" width="139" height="45" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="371.5" y="108" font-size="28" text-anchor="middle" dominant-baseline="central" textLength="111" lengthAdjust="spacing">実体基台</text>

  <!-- イスラエル民族 → モーセ -->
  <polygon points="471,140.5 276,140.5 276,135 260,143.5 276,152 276,146.5 471,146.5" fill="#8C949A"/>
  <g stroke="currentColor" stroke-width="2.8">
    <ellipse cx="193" cy="142.5" rx="61" ry="25.5" fill="#F8F28F"/>
    <ellipse cx="578.5" cy="143.5" rx="107.5" ry="28.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="191" y="142.5" font-size="32" textLength="92" lengthAdjust="spacing">モーセ</text>
    <text x="579" y="143" font-size="27" textLength="178" lengthAdjust="spacing">イスラエル民族</text>
  </g>

  <!-- 出発のための摂理：○ -->
  <rect x="217.2" y="181" width="350.1" height="47.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g fill="#111" dominant-baseline="central">
    <text x="236" y="205" font-size="31" textLength="248" lengthAdjust="spacing">出発のための摂理</text>
    <text x="501" y="205" font-size="31" text-anchor="middle">：</text>
  </g>
  <circle cx="532.5" cy="205" r="12.5" fill="none" stroke="#111" stroke-width="3"/>

  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="392" y="255.5" textLength="206" lengthAdjust="spacing">三大奇跡、十災禍</text>
    <text x="393.5" y="324.5" textLength="227" lengthAdjust="spacing">モーセを信じ、従う</text>
  </g>
  <polygon points="385,280 397,280 397,292 407,292 391,304.5 375,292 385,292" fill="#8C949A" stroke="currentColor" stroke-width="1.2" stroke-linejoin="miter"/>

  <!-- 第二次カナン復帰路程：出発 -->
  <rect x="184" y="355" width="421.5" height="45.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <g font-size="29" dominant-baseline="central" fill="#111">
    <text x="208" y="376.5" textLength="286" lengthAdjust="spacing">第二次カナン復帰路程</text>
    <text x="510" y="376.5" text-anchor="middle">：</text>
    <text x="528" y="376.5" textLength="53" lengthAdjust="spacing">出発</text>
  </g>
</svg>
