<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>割礼の意味</title>

  <!-- 題 -->
  <text x="35" y="36" font-size="30" dominant-baseline="central" textLength="155" lengthAdjust="spacing">割礼の意味</text>
  <line x1="33" y1="55" x2="190" y2="55" stroke="currentColor" stroke-width="2.4"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="232.5,167 232.5,238 228.5,238 235.5,251 242.5,238 238.5,238 238.5,167"/>
    <polygon points="596.5,252 596.5,182.5 600.5,182.5 593.5,169.5 586.5,182.5 590.5,182.5 590.5,252"/>
    <polygon points="302,283.5 526,283.5 526,287.5 539,280.5 526,273.5 526,277.5 302,277.5"/>
  </g>

  <!-- サ・神 -->
  <circle cx="236" cy="134" r="32" fill="#50403D" stroke="currentColor" stroke-width="2.6"/>
  <text x="235" y="135" font-size="32" text-anchor="middle" dominant-baseline="central" fill="#fff">サ</text>
  <circle cx="594" cy="135.5" r="32" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="593" y="136" font-size="34" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 人間始祖・子女 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="234.5" cy="280" rx="66.2" ry="27.2" fill="#CF921C"/>
    <ellipse cx="595.5" cy="278.5" rx="48.7" ry="25.7" fill="#FCE5E3"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="235" y="281" textLength="107" lengthAdjust="spacing">人間始祖</text>
    <text x="595.5" y="279" textLength="55" lengthAdjust="spacing">子女</text>
  </g>

  <!-- 字 -->
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="417" y="253.5" textLength="54" lengthAdjust="spacing">割礼</text>
    <text x="634.5" y="210" textLength="55" lengthAdjust="spacing">復帰</text>
  </g>
  <g font-size="24" dominant-baseline="central">
    <text x="336" y="301.5" textLength="185" lengthAdjust="spacing">陽部の皮を切って</text>
    <text x="336" y="330.5" textLength="162" lengthAdjust="spacing">死亡の血を流す</text>
    <text x="160" y="332.5" textLength="138" lengthAdjust="spacing">陽部を通じて</text>
    <text x="159" y="361.5" textLength="186" lengthAdjust="spacing">死亡の血を受けた</text>
  </g>
</svg>
