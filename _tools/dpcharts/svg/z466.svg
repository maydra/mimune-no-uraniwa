<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>洗礼ヨハネの不信で霊的摂理が切れる</title>

  <!-- 授受の矢印（左が上向き、右が下向き） -->
  <g stroke="currentColor" stroke-width="9.5" fill="none">
    <path d="M354,255 Q330,224 347,194"/>
    <path d="M415.5,177 Q439,207 421.75,240.5"/>
    <g transform="translate(-3,233)">
      <path d="M354,255 Q330,224 347,194"/>
      <path d="M415.5,177 Q439,207 421.75,240.5"/>
    </g>
    <g transform="translate(507.5,3)">
      <path d="M354,255 Q330,224 347,194"/>
      <path d="M415.5,177 Q439,207 421.75,240.5"/>
    </g>
    <g transform="translate(506,232.5)">
      <path d="M354,255 Q330,224 347,194"/>
      <path d="M415.5,177 Q439,207 421.75,240.5"/>
    </g>
  </g>
  <polygon points="358,172 336,188.5 357.5,200"/>
  <polygon points="410,234 433.5,247 411,262"/>
  <g transform="translate(-3,233)">
    <polygon points="358,172 336,188.5 357.5,200"/>
    <polygon points="410,234 433.5,247 411,262"/>
  </g>
  <g transform="translate(507.5,3)">
    <polygon points="358,172 336,188.5 357.5,200"/>
    <polygon points="410,234 433.5,247 411,262"/>
  </g>
  <g transform="translate(506,232.5)">
    <polygon points="358,172 336,188.5 357.5,200"/>
    <polygon points="410,234 433.5,247 411,262"/>
  </g>

  <!-- 不信で切れた授受 -->
  <g stroke="currentColor" stroke-width="9.5">
    <line x1="810" y1="421.7" x2="973" y2="479.3"/>
    <line x1="812" y1="481.4" x2="972" y2="421.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4">
    <circle cx="387.5" cy="104.5" r="51" fill="#fff" class="paper"/>
    <circle cx="891.25" cy="104" r="51" fill="#fff" class="paper"/>
    <ellipse cx="385.75" cy="332.75" rx="103.25" ry="52.75" fill="#F8F28F"/>
    <ellipse cx="890.75" cy="333.75" rx="103.25" ry="52.75" fill="#F8F28F"/>
    <ellipse cx="381" cy="571.5" rx="133" ry="51.5" fill="#F86D42"/>
    <ellipse cx="891.5" cy="579.25" rx="138.5" ry="60.25" fill="#CF921C"/>
  </g>
  <g font-size="54" text-anchor="middle" dominant-baseline="central">
    <text x="386" y="104.5">神</text>
    <text x="889" y="103.5">神</text>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="385" y="332" font-size="48">イエス</text>
    <text x="889" y="332.5" font-size="48">イエス</text>
    <text x="382" y="571.5" font-size="46">洗礼ヨハネ</text>
    <text x="891" y="553" font-size="41">人間</text>
    <text x="894.5" y="600.5" font-size="42">洗礼ヨハネ</text>
  </g>

  <g font-size="44" text-anchor="middle" dominant-baseline="central">
    <text x="257" y="452.5">証す</text>
    <text x="1037" y="452.5">不信</text>
  </g>

  <!-- 霊的摂理が切れる -->
  <polygon points="544,446.5 705,446.5 705,435.5 734.5,452.5 705,470.5 705,458.5 544,458.5" fill="#8C949A"/>
  <g font-size="41" text-anchor="middle" dominant-baseline="central">
    <text x="629" y="500">霊的摂理</text>
    <text x="627.5" y="549.5">が切れる</text>
  </g>
</svg>
