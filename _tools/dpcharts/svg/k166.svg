<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>象徴献祭失敗の結果</title>

  <text x="35" y="36" font-size="30" dominant-baseline="central" textLength="283" lengthAdjust="spacing">象徴献祭失敗の結果</text>
  <line x1="34" y1="55" x2="318" y2="55" stroke="currentColor" stroke-width="3"/>

  <circle cx="145.5" cy="120.5" r="6.8"/>
  <circle cx="145.5" cy="320.5" r="6.8"/>
  <polygon points="164,218 179,218 179,214.5 191,221.5 179,228.5 179,225 164,225" fill="#8C949A"/>

  <g font-size="26" dominant-baseline="central">
    <text x="163" y="120.5" textLength="368" lengthAdjust="spacing">アブラハムの子孫がエジプトで</text>
    <text x="536" y="120.5" textLength="40" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="582" y="120.5" textLength="106" lengthAdjust="spacing">年間苦役</text>
    <text x="165" y="174" textLength="128" lengthAdjust="spacing">ノア以後の</text>
    <text x="300" y="174" textLength="40" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="347" y="174" textLength="313" lengthAdjust="spacing">年期間をサタンに奪われた</text>
    <text x="199" y="221" textLength="38" lengthAdjust="spacingAndGlyphs">400</text>
    <text x="243" y="221" textLength="425" lengthAdjust="spacing">年サタン分立期間を再び立てなければ</text>
    <text x="200" y="253.5" textLength="98" lengthAdjust="spacing">ならない</text>
    <text x="162" y="320" textLength="315" lengthAdjust="spacing">摂理は三代にわたって延長</text>
  </g>
</svg>
