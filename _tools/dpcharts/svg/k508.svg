<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 統一王国時代 120 年</title>

  <text x="49" y="37.5" font-size="30" text-anchor="middle" dominant-baseline="central">Ⅲ</text>
  <text x="65" y="37.5" font-size="30" dominant-baseline="central">.</text>
  <text y="37.5" font-size="30" dominant-baseline="central"><tspan x="88" textLength="187" lengthAdjust="spacing">統一王国時代</tspan><tspan x="287" textLength="43" lengthAdjust="spacingAndGlyphs">120</tspan><tspan x="340">年</tspan></text>
  <line x1="87" y1="57" x2="370" y2="57" stroke="currentColor" stroke-width="2.2"/>

  <!-- メシヤのための家庭的な基台・民族的な基台 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="221.5" y="84.5" width="163.5" height="60.5"/>
    <rect x="431" y="82.5" width="167" height="60.5"/>
  </g>
  <g font-size="22" dominant-baseline="central" fill="#111">
    <text x="231" y="102" textLength="145" lengthAdjust="spacing">メシヤのための</text>
    <text x="234" y="128" font-size="23" textLength="138" lengthAdjust="spacing">家庭的な基台</text>
    <text x="441" y="99" textLength="146" lengthAdjust="spacing">メシヤのための</text>
    <text x="445" y="125.5" font-size="23" textLength="138" lengthAdjust="spacing">民族的な基台</text>
  </g>

  <!-- 灰色の下向きの矢印 -->
  <g fill="#8C949A">
    <rect x="299.5" y="193" width="5" height="24"/>
    <polygon points="296.5,216 307.5,216 302,226"/>
    <rect x="299.5" y="265" width="5" height="25"/>
    <polygon points="296.5,289 307.5,289 302,298.5"/>
    <rect x="511.5" y="193" width="5" height="24"/>
    <polygon points="508.5,216 519.5,216 514,226"/>
    <rect x="511.5" y="265" width="5" height="25"/>
    <polygon points="508.5,289 519.5,289 514,298.5"/>
  </g>

  <!-- 人物 -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="3">
    <ellipse cx="302.5" cy="175.5" rx="53.5" ry="20"/>
    <ellipse cx="302.5" cy="247" rx="53.5" ry="20"/>
    <ellipse cx="302.5" cy="321" rx="53.5" ry="20"/>
    <ellipse cx="513.5" cy="175.5" rx="53.5" ry="20"/>
    <ellipse cx="513.5" cy="247" rx="53.5" ry="20"/>
    <ellipse cx="512.5" cy="321" rx="53.5" ry="20"/>
  </g>
  <g font-size="25" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="303" y="175" textLength="74" lengthAdjust="spacing">アダム</text>
    <text x="303.5" y="247.5" textLength="47" lengthAdjust="spacing">ノア</text>
    <text x="303" y="321" font-size="23" textLength="80" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="513.5" y="176" font-size="23" textLength="75" lengthAdjust="spacingAndGlyphs">アブラハム</text>
    <text x="514" y="247.5" textLength="74" lengthAdjust="spacing">モーセ</text>
    <text x="513" y="321" textLength="76" lengthAdjust="spacing">サウル</text>
  </g>

  <!-- ＝ -->
  <g stroke="currentColor" stroke-width="4.5">
    <path d="M395,171.5 H421 M395,181 H421"/>
    <path d="M397,242 H423 M397,252 H423"/>
    <path d="M396,314.5 H422 M396,324 H422"/>
  </g>

  <g font-size="25" dominant-baseline="central">
    <text y="172.5"><tspan x="579">（</tspan><tspan x="591" textLength="75" lengthAdjust="spacing">出発者</tspan><tspan x="665">）</tspan></text>
    <text y="322.5" font-size="27"><tspan x="127">（</tspan><tspan x="143" textLength="83" lengthAdjust="spacing">終結者</tspan><tspan x="226">）</tspan></text>
  </g>

  <g font-size="22" dominant-baseline="central">
    <text x="202" y="367" textLength="60" lengthAdjust="spacing">三回目</text>
    <text x="274" y="367" text-anchor="middle">：</text>
    <text x="287" y="367" textLength="83" lengthAdjust="spacing">必ず達成</text>
    <text x="205" y="395" textLength="186" lengthAdjust="spacing">しなければならない</text>
    <text x="435" y="366.5" textLength="60" lengthAdjust="spacing">三回目</text>
    <text x="507" y="366.5" text-anchor="middle">：</text>
    <text x="522" y="366.5" textLength="129" lengthAdjust="spacing">必ず成し遂げ</text>
    <text x="435" y="394.5" textLength="167" lengthAdjust="spacing">なければならない</text>
  </g>
</svg>
