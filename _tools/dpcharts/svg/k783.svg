<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスの再臨　盗人のように来るであろう／盗人のように不意に襲うことはないであろう</title>

  <!-- 矢印（楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="7">
    <line x1="225" y1="193" x2="288" y2="143.5"/>
    <line x1="225" y1="237" x2="290" y2="284"/>
  </g>
  <g fill="currentColor">
    <polygon points="302,132 293.1,153 279.5,135.8"/>
    <polygon points="305,295 282.3,292.1 295.3,274.3"/>
  </g>

  <!-- イエスの再臨 -->
  <ellipse cx="198.75" cy="213.5" rx="77.75" ry="49.5" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="200.5" y="197" textLength="121" lengthAdjust="spacing">イエスの</text>
    <text x="199" y="235.5" textLength="60" lengthAdjust="spacing">再臨</text>
  </g>

  <!-- 右の字 -->
  <g font-size="30" dominant-baseline="central">
    <text x="314" y="122.5" textLength="373" lengthAdjust="spacing">盗人のように来るであろう</text>
    <text x="313" y="300.5" textLength="341" lengthAdjust="spacing">盗人のように不意に襲う</text>
    <text x="315" y="335.5" textLength="260" lengthAdjust="spacing">ことはないであろう</text>
  </g>
  <g font-size="22" dominant-baseline="central">
    <text x="317" y="158" textLength="82" lengthAdjust="spacing">(黙 3:3)</text>
    <text x="314" y="370.5" textLength="197" lengthAdjust="spacing">(テサロニケⅠ 5:4)</text>
  </g>
</svg>
