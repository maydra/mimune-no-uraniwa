<h1>詩篇 第125章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>主に信頼する者は、動かされることなくて、とこしえにあるシオンの山のようである。</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>山々がエルサレムを囲んでいるように、主は今からとこしえにその民を囲まれる。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>これは悪しき者のつえが正しい者の所領にとどまることなく、正しい者がその手を不義に伸べることのないためである。</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>主よ、善良な人と、心の正しい人とに、さいわいを施してください。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>しかし転じて自分の曲った道に入る者を主は、悪を行う者と共に去らせられる。イスラエルの上に平安があるように。</p>
