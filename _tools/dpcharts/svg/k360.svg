<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>(3) メシヤのための基台</title>

  <!-- 題 -->
  <text x="53" y="36.5" font-size="28" dominant-baseline="central" textLength="39" lengthAdjust="spacingAndGlyphs">(3)</text>
  <text x="107" y="36" font-size="28" dominant-baseline="central" textLength="257" lengthAdjust="spacing">メシヤのための基台</text>
  <line x1="105" y1="54" x2="365" y2="54" stroke="currentColor" stroke-width="2.6"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="218,208.5 224.5,223 220.5,223 220.5,280 215.5,280 215.5,223 211.5,223"/>
    <polygon points="266,343 279,336 279,340.5 549,340.5 549,345.5 279,345.5 279,350"/>
    <polygon points="428,152.5 442.5,169.5 434.5,169.5 434.5,187 420.5,187 420.5,169.5 413.5,169.5"/>
    <polygon points="428,253.5 442.5,270.5 434.5,270.5 434.5,286 420.5,286 420.5,270.5 413.5,270.5"/>
    <polygon points="512.5,121.5 524.5,114.5 524.5,118.5 560,118.5 560,124.5 524.5,124.5 524.5,128.5"/>
  </g>

  <!-- メシヤ✕降臨 -->
  <rect x="324" y="102" width="178" height="38" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="26" dominant-baseline="central">
    <text x="332" y="121.5" textLength="76" lengthAdjust="spacing">メシヤ</text>
    <text x="437" y="121" textLength="51" lengthAdjust="spacing">降臨</text>
  </g>
  <path d="M411,93.5 L430.5,144 M430.5,93.5 L410.5,144" fill="none" stroke="currentColor" stroke-width="4"/>

  <!-- サタン側王国 -->
  <rect x="560.5" y="85.5" width="113.5" height="72.5" rx="9" fill="#50403D" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="24" text-anchor="middle" dominant-baseline="central" fill="#fff">
    <text x="616" y="106.5" textLength="92" lengthAdjust="spacing">サタン側</text>
    <text x="616" y="139" textLength="50" lengthAdjust="spacing">王国</text>
  </g>

  <!-- メシヤのための民族的な基台：○ -->
  <rect x="257" y="198" width="418" height="44" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="269" y="220" textLength="339" lengthAdjust="spacing">メシヤのための民族的な基台</text>
    <text x="622" y="220" text-anchor="middle">：</text>
  </g>
  <circle cx="648.5" cy="220.5" r="10.3" fill="none" stroke="#111" stroke-width="3"/>

  <!-- 神・信仰基台 -->
  <circle cx="218.5" cy="179.5" r="28" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <text x="218.5" y="179.5" font-size="33" text-anchor="middle" dominant-baseline="central">神</text>
  <rect x="140" y="211" width="59" height="62" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <text x="167.5" y="228.5" textLength="41" lengthAdjust="spacing">信仰</text>
    <text x="167.5" y="255.5" textLength="41" lengthAdjust="spacing">基台</text>
  </g>

  <!-- モーセ・ヨシュア・内的イスラエル民族 -->
  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="218" cy="299.5" rx="43.5" ry="19.5" fill="#F8F28F"/>
    <ellipse cx="218" cy="343" rx="43.5" ry="19.5" fill="#F8F28F"/>
    <ellipse cx="615.5" cy="342.5" rx="69" ry="47.5" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="218" y="300" font-size="22" textLength="66" lengthAdjust="spacing">モーセ</text>
    <text x="218" y="344" font-size="20" textLength="68" lengthAdjust="spacing">ヨシュア</text>
    <g font-size="24">
      <text x="616" y="315" textLength="49" lengthAdjust="spacing">内的</text>
      <text x="616" y="342" textLength="117" lengthAdjust="spacing">イスラエル</text>
      <text x="615.5" y="371.5" textLength="48" lengthAdjust="spacing">民族</text>
    </g>
  </g>

  <!-- 実体基台：○ -->
  <rect x="346" y="294" width="167" height="39" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="357" y="314" textLength="103" lengthAdjust="spacing">実体基台</text>
    <text x="469.5" y="314" text-anchor="middle">：</text>
  </g>
  <circle cx="489.5" cy="314" r="10" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- カナン入城 -->
  <ellipse cx="427" cy="375" rx="85.5" ry="19.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="421.5" y="375" font-size="24" text-anchor="middle" dominant-baseline="central" textLength="120" lengthAdjust="spacing" fill="#111">カナン入城</text>
</svg>
