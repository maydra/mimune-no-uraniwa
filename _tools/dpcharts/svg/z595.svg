<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>①神と完成した人間との二性性相的な関係</title>

  <text x="71.5" y="59.5" font-size="44" text-anchor="middle" dominant-baseline="central">①</text>
  <text x="97" y="59" font-size="41.5" dominant-baseline="central" textLength="750" lengthAdjust="spacing">神と完成した人間との二性性相的な関係</text>

  <!-- 楕円 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5">
    <ellipse cx="344.25" cy="175.25" rx="80.75" ry="50.25"/>
    <ellipse cx="341.75" cy="432.75" rx="80.75" ry="50.25"/>
    <ellipse cx="775.25" cy="178.75" rx="132.75" ry="52.75"/>
    <ellipse cx="775.25" cy="431" rx="133.25" ry="52.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="66">
      <text x="345" y="173.5">心</text>
      <text x="342.5" y="431.5">体</text>
      <text x="774" y="178">神</text>
    </g>
    <text x="774.5" y="430.5" font-size="49" textLength="197" lengthAdjust="spacing">完成人間</text>
  </g>

  <!-- 授受の矢印（左の組。右の組は同じ形をずらして置く） -->
  <g>
    <g fill="none" stroke="currentColor" stroke-width="9">
      <path d="M323,357 Q289.5,305.5 314,272"/>
      <path d="M359,251 Q394,302.5 369.5,337"/>
    </g>
    <polygon points="327,253 304.1,265.2 323.9,278.8"/>
    <polygon points="356.2,355.7 379.3,343.9 359.7,330.1"/>
  </g>
  <g transform="translate(432.5,2)">
    <g fill="none" stroke="currentColor" stroke-width="9">
      <path d="M323,357 Q289.5,305.5 314,272"/>
      <path d="M359,251 Q394,302.5 369.5,337"/>
    </g>
    <polygon points="327,253 304.1,265.2 323.9,278.8"/>
    <polygon points="356.2,355.7 379.3,343.9 359.7,330.1"/>
  </g>
  <text x="858" y="307" font-size="45" dominant-baseline="central" textLength="90" lengthAdjust="spacing">一体</text>

  <!-- 灰色の矢印 -->
  <polygon points="528,288.5 560,288.5 560,269.5 583,308.5 560,349 560,328.5 528,328.5" fill="#8C949A" stroke="currentColor" stroke-width="2"/>

  <!-- 下の説明 -->
  <g dominant-baseline="central">
    <text x="524" y="545" font-size="46" textLength="276" lengthAdjust="spacing">神の心情体恤</text>
    <text x="524" y="616" font-size="46" textLength="139" lengthAdjust="spacing">神の宮</text>
    <!-- 聖句の出典（元は横に詰めた字。括弧は内側の端で合わせる） -->
    <text x="685" y="616" font-size="42" text-anchor="end">(</text>
    <text x="688" y="616" font-size="40" textLength="125" lengthAdjust="spacingAndGlyphs">コリント</text>
    <text x="834" y="616" font-size="40" text-anchor="middle">Ⅰ</text>
    <text x="858" y="616" font-size="44" textLength="68" lengthAdjust="spacingAndGlyphs">3:16</text>
    <text x="925" y="616" font-size="42">)</text>
    <text x="941" y="616" font-size="44">、</text>
    <text x="971" y="616" font-size="43" textLength="86" lengthAdjust="spacing">神性</text>
  </g>
</svg>
