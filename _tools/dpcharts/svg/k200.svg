<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>出エ 3:6 アブラハム、イサク、ヤコブの神</title>

  <g font-size="29" dominant-baseline="central">
    <text x="129" y="39.5" textLength="57" lengthAdjust="spacing">出エ</text>
    <text x="195" y="39.5" textLength="44.5" lengthAdjust="spacingAndGlyphs">3:6</text>
    <text y="39.5"><tspan x="257" textLength="147" lengthAdjust="spacing">アブラハム</tspan><tspan x="404.2">、</tspan><tspan x="424" textLength="86" lengthAdjust="spacing">イサク</tspan><tspan x="512.2">、</tspan><tspan x="531" textLength="148" lengthAdjust="spacing">ヤコブの神</tspan></text>
  </g>

  <!-- 三代をくくる線 -->
  <path d="M401,109.5 H433.5 V296.5 H403 M403,203.5 H433.5" fill="none" stroke="#8C949A" stroke-width="5.5"/>

  <g stroke="currentColor" stroke-width="2.8" fill="#F8F28F">
    <ellipse cx="302.5" cy="109.5" rx="98.5" ry="25.5"/>
    <ellipse cx="304.75" cy="203.25" rx="98.25" ry="25.25"/>
    <ellipse cx="304.75" cy="296" rx="98.75" ry="23"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="303.5" y="108.5" textLength="142" lengthAdjust="spacing">アブラハム</text>
    <text x="304" y="203.5" textLength="82" lengthAdjust="spacing">イサク</text>
    <text x="304" y="296" textLength="82" lengthAdjust="spacing">ヤコブ</text>
  </g>

  <!-- 等しい（‖） -->
  <g stroke="currentColor" stroke-width="3.6">
    <line x1="299.5" y1="143" x2="299.5" y2="169.5"/>
    <line x1="309.5" y1="143" x2="309.5" y2="169.5"/>
    <line x1="300.5" y1="237" x2="300.5" y2="264.5"/>
    <line x1="310.5" y1="237" x2="310.5" y2="264.5"/>
  </g>

  <g font-size="30" dominant-baseline="central">
    <text x="467" y="181.5" textLength="63" lengthAdjust="spacing">個体</text>
    <text x="545" y="181.5" text-anchor="middle">：</text>
    <text x="562" y="181.5" textLength="125" lengthAdjust="spacing">異なるが</text>
    <text x="468" y="235" textLength="60" lengthAdjust="spacing">み旨</text>
    <text x="545" y="235" text-anchor="middle">：</text>
    <text x="562" y="235" textLength="63" lengthAdjust="spacing">一体</text>
  </g>

  <rect x="194.5" y="346.5" width="430" height="51" fill="#CDF8F7" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="220" y="372" textLength="62" lengthAdjust="spacing">三代</text>
    <text x="297" y="372" text-anchor="middle">：</text>
    <text x="314" y="372" textLength="284" lengthAdjust="spacing">み旨から見れば一代</text>
  </g>
</svg>
