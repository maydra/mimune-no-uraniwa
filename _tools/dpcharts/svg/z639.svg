<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神を中心とする三位一体とサタンを中心とする三位一体</title>

  <!-- 題（元は横に詰めた字） -->
  <g font-size="44" dominant-baseline="central">
    <text x="197.5" y="119.2" textLength="428" lengthAdjust="spacingAndGlyphs">神を中心とする三位一体</text>
    <text x="681.1" y="119.2" textLength="428" lengthAdjust="spacingAndGlyphs">サタンを中心とする三位一体</text>
  </g>

  <!-- 左右の仕切りの点線 -->
  <line x1="656.5" y1="77" x2="656.5" y2="605.5" stroke="currentColor" stroke-width="6" stroke-dasharray="9 7.77"/>

  <!-- 四位の線（円と楕円の下に描く） -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="384.1" y1="219.3" x2="262.5" y2="367"/>
    <line x1="432.4" y1="219.3" x2="554" y2="367"/>
    <line x1="261.2" y1="367" x2="381.3" y2="520.8"/>
    <line x1="573.9" y1="367" x2="426.6" y2="520.8"/>
