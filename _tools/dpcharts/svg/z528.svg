<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>霊人たちは地上人の協助を受けずには完成できない（ヘブル書 11 章 39 節以下・マタイ福音書 18 章 18 節・16 章 19 節）</title>

  <!-- 行頭の● -->
  <circle cx="162" cy="183" r="18.5"/>
  <circle cx="162" cy="1064" r="18.5"/>
  <circle cx="162" cy="1704" r="18.5"/>

  <!-- 本文（聖句は太字 700、地の文と括弧書きは 400） -->
  <text y="183.3" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="206.8" textLength="331.5" lengthAdjust="spacing">ヘブル書</tspan> <tspan x="560.3" font-size="76" textLength="81.4" lengthAdjust="spacingAndGlyphs">11</tspan> <tspan x="665.8">章</tspan> <tspan x="767.3" font-size="76" textLength="84.5" lengthAdjust="spacingAndGlyphs">39</tspan> <tspan x="872.8" textLength="327.5" lengthAdjust="spacing">節以下に</tspan><tspan x="1290.5" text-anchor="end">『</tspan><tspan x="1291.8" font-weight="700" textLength="153.5" lengthAdjust="spacingAndGlyphs">さて</tspan><tspan x="1449.9" font-weight="700">、</tspan><tspan x="1536.8" font-weight="700" textLength="475.5" lengthAdjust="spacingAndGlyphs">これらの人々</tspan><tspan x="2070.5" text-anchor="end">（</tspan><tspan x="2076.8" textLength="656.5" lengthAdjust="spacing">旧約時代の聖賢た</tspan></text>
  <text y="303.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="211.8">ち</tspan><tspan x="289.9">）</tspan><tspan x="380.8" font-weight="700" textLength="240.5" lengthAdjust="spacingAndGlyphs">はみな</tspan><tspan x="623.9" font-weight="700">、</tspan><tspan x="705.8" font-weight="700" textLength="1083.5" lengthAdjust="spacing">信仰によってあかしされたが</tspan><tspan x="1790.9" font-weight="700">、</tspan><tspan x="1874.8" font-weight="700" textLength="163.5" lengthAdjust="spacing">約束</tspan><tspan x="2091.5" text-anchor="end">（</tspan><tspan x="2096.8" textLength="596.5" lengthAdjust="spacing">天国に入る許可</tspan><tspan x="2696.9">）</tspan></text>
  <text y="424.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="205.8" font-weight="700" textLength="800.5" lengthAdjust="spacingAndGlyphs">のものは受けなかった</tspan><tspan x="1010.9">。</tspan><tspan x="1092.8" font-weight="700" textLength="560.5" lengthAdjust="spacingAndGlyphs">神はわたしたち</tspan><tspan x="1712.5" text-anchor="end">（</tspan><tspan x="1714.8" textLength="246.5" lengthAdjust="spacing">地上人</tspan><tspan x="1961.9">）</tspan><tspan x="2015.8" font-weight="700" textLength="314.5" lengthAdjust="spacingAndGlyphs">のために</tspan><tspan x="2337.9" font-weight="700">、</tspan><tspan x="2422.8" font-weight="700" textLength="317.5" lengthAdjust="spacingAndGlyphs">さらに良</tspan></text>
  <text y="545.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="206.8" font-weight="700" textLength="238.5" lengthAdjust="spacingAndGlyphs">いもの</tspan><tspan x="501.5" text-anchor="end">（</tspan><tspan x="504.8" textLength="161.5" lengthAdjust="spacingAndGlyphs">天国</tspan><tspan x="669.9">）</tspan><tspan x="726.8" font-weight="700" textLength="1381.5" lengthAdjust="spacing">をあらかじめ備えて下さっているので</tspan><tspan x="2112.9" font-weight="700">、</tspan><tspan x="2196.8" font-weight="700" textLength="399.5" lengthAdjust="spacingAndGlyphs">わたしたち</tspan><tspan x="2656.5" text-anchor="end">（</tspan><tspan x="2658.8">地</tspan></text>
  <text y="666.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="205.8" textLength="166.5" lengthAdjust="spacing">上人</tspan><tspan x="374.9">）</tspan><tspan x="432.8" font-weight="700" textLength="736.5" lengthAdjust="spacing">をほかにしては彼ら</tspan><tspan x="1229.5" text-anchor="end">（</tspan><tspan x="1232.8" textLength="330.5" lengthAdjust="spacing">霊人たち</tspan><tspan x="1574.9">）</tspan><tspan x="1632.8" font-weight="700" textLength="232.5" lengthAdjust="spacingAndGlyphs">が全う</tspan><tspan x="1930.5" text-anchor="end">（</tspan><tspan x="1934.8" textLength="251.5" lengthAdjust="spacing">天国人</tspan><tspan x="2188.9">）</tspan><tspan x="2248.8" font-weight="700" textLength="488.5" lengthAdjust="spacing">されることは</tspan></text>
  <text y="787.3" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="205.8" font-weight="700" textLength="157.5" lengthAdjust="spacingAndGlyphs">ない</tspan><tspan x="364.9">』</tspan><tspan x="467.8" textLength="911.5" lengthAdjust="spacing">と記録されているみ言は</tspan><tspan x="1384.9">、</tspan><tspan x="1470.8" textLength="416.5" lengthAdjust="spacing">霊人たちは</tspan><tspan x="1891.9">、</tspan><tspan x="1979.8" textLength="755.5" lengthAdjust="spacing">地上人の協助を受け</tspan></text>
  <text y="908.3" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="206.8" textLength="741.5" lengthAdjust="spacing">ずには完成できない</tspan><tspan x="952.9">、</tspan><tspan x="1051.8" textLength="1139.5" lengthAdjust="spacing">という原理を証したものである</tspan><tspan x="2202.9">。</tspan></text>

  <text y="1064.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="208.8" textLength="494.5" lengthAdjust="spacing">マタイ福音書</tspan> <tspan x="725.4" font-size="76" textLength="84.5" lengthAdjust="spacingAndGlyphs">18</tspan> <tspan x="829.8">章</tspan> <tspan x="932.4" font-size="76" textLength="84.5" lengthAdjust="spacingAndGlyphs">18</tspan> <tspan x="1034.8" textLength="737.5" lengthAdjust="spacing">節に記録されている</tspan><tspan x="1828.5" text-anchor="end">『</tspan><tspan x="1828.8" font-weight="700" textLength="395.5" lengthAdjust="spacingAndGlyphs">あなたがた</tspan><tspan x="2282.5" text-anchor="end">（</tspan><tspan x="2282.8" textLength="415.5" lengthAdjust="spacing">地上の聖徒</tspan><tspan x="2697.9">）</tspan></text>
  <text y="1185.3" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="205.8" font-weight="700" textLength="812.5" lengthAdjust="spacing">が地上でつなぐことは</tspan><tspan x="1021.9" font-weight="700">、</tspan><tspan x="1102.8" font-weight="700" textLength="654.5" lengthAdjust="spacing">天でも皆つながれ</tspan><tspan x="1758.9" font-weight="700">、</tspan><tspan x="1843.8" font-weight="700" textLength="885.5" lengthAdjust="spacingAndGlyphs">あなたがたが地上で解く</tspan></text>
  <text y="1306.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="209.8" font-weight="700" textLength="232.5" lengthAdjust="spacingAndGlyphs">ことは</tspan><tspan x="445.9" font-weight="700">、</tspan><tspan x="525.8" font-weight="700" textLength="1039.5" lengthAdjust="spacingAndGlyphs">天でもみな解かれるであろう</tspan><tspan x="1572.9">』</tspan><tspan x="1671.8" textLength="636.5" lengthAdjust="spacingAndGlyphs">と言われたみ言も</tspan><tspan x="2322.9">、</tspan><tspan x="2408.8" textLength="159.5" lengthAdjust="spacingAndGlyphs">結局</tspan><tspan x="2572.9">、</tspan><tspan x="2658.8">地</tspan></text>
  <text y="1426.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="205.8" textLength="1352.5" lengthAdjust="spacing">上の聖徒たちが解いてやらなければ</tspan><tspan x="1555.9">、</tspan><tspan x="1641.8" textLength="1098.5" lengthAdjust="spacing">霊人たちにつながれたものが</tspan></text>
  <text y="1547.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="203.8" textLength="1487.5" lengthAdjust="spacing">解かれないという事実を証したのである</tspan><tspan x="1702.9">。</tspan></text>

  <text y="1704.3" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="211.8" textLength="242.5" lengthAdjust="spacingAndGlyphs">ゆえに</tspan><tspan x="459.9">、</tspan><tspan x="551.8" textLength="513.5" lengthAdjust="spacing">マタイ福音書</tspan> <tspan x="1088.3" font-size="76" textLength="85.4" lengthAdjust="spacingAndGlyphs">16</tspan> <tspan x="1194.8">章</tspan> <tspan x="1298.3" font-size="76" textLength="85.4" lengthAdjust="spacingAndGlyphs">19</tspan> <tspan x="1402.8" textLength="597.5" lengthAdjust="spacing">節で見るように</tspan><tspan x="2005.9">、</tspan><tspan x="2095.8" textLength="592.5" lengthAdjust="spacing">天国の門の鍵を</tspan><tspan x="2697.9">、</tspan></text>
  <text y="1825.8" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="205.8" textLength="1428.5" lengthAdjust="spacing">地上の聖徒たちの代表ペテロに授けて</tspan><tspan x="1640.9">、</tspan><tspan x="1724.8" textLength="1012.5" lengthAdjust="spacing">彼をして天国の門を地上で</tspan></text>
  <text y="1945.3" font-size="81" font-weight="400" dominant-baseline="central"><tspan x="210.8" textLength="980.5" lengthAdjust="spacing">開くようにされたのである</tspan><tspan x="1202.9">。</tspan></text>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="6">
    <line x1="1872" y1="361" x2="2739" y2="361"/>
    <line x1="204" y1="481.5" x2="1011" y2="481.5"/>
    <line x1="1711" y1="723.5" x2="2741" y2="723.5"/>
    <line x1="204" y1="845.5" x2="366" y2="845.5"/>
    <line x1="1976" y1="845.5" x2="2485" y2="845.5"/>
    <line x1="285" y1="1242.5" x2="1022" y2="1242.5"/>
    <line x1="2332" y1="1242.5" x2="2741" y2="1242.5"/>
    <line x1="2090" y1="1762.5" x2="2611" y2="1762.5"/>
    <line x1="2063" y1="1883.5" x2="2739" y2="1883.5"/>
    <line x1="204" y1="2004.5" x2="370" y2="2004.5"/>
  </g>
</svg>
