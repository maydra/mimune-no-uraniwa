<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>第三次世界的カナン復帰路程　1. イエスを中心とする霊的カナン復帰路程</title>

  <g dominant-baseline="central">
    <text x="37" y="37.5" font-size="30" textLength="24" lengthAdjust="spacingAndGlyphs">Ⅲ</text>
    <text x="72" y="37.5" font-size="30">.</text>
    <text x="90" y="37.5" font-size="30" textLength="407" lengthAdjust="spacing">第三次世界的カナン復帰路程</text>
    <text x="56" y="78.5" font-size="27">1.</text>
    <text x="91" y="78.5" font-size="27" textLength="491" lengthAdjust="spacing">イエスを中心とする霊的カナン復帰路程</text>
  </g>
  <line x1="88" y1="55" x2="499" y2="55" stroke="currentColor" stroke-width="2.6"/>
  <line x1="89" y1="96" x2="584" y2="96" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="375.5,186.5 388.5,178.5 388.5,183 531,183 531,190 388.5,190 388.5,194.5"/>
    <polygon points="375.5,306.5 388.5,298.5 388.5,303 533,303 533,310 388.5,310 388.5,314.5"/>
  </g>

  <!-- 不信の × -->
  <path d="M442,290 L477,325 M477,290 L442,325" stroke="currentColor" stroke-width="4.5"/>
  <text x="457.5" y="266.5" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="55" lengthAdjust="spacing">不信</text>

  <!-- 左の見出し -->
  <g font-size="26" dominant-baseline="central">
    <text x="250" y="136.5" textLength="130" lengthAdjust="spacing">信仰の対象</text>
    <text x="131" y="169.5" textLength="76" lengthAdjust="spacing">第三次</text>
    <text x="131" y="204" textLength="103" lengthAdjust="spacing">民族路程</text>
    <text x="130" y="289.5" textLength="104" lengthAdjust="spacing">世界路程</text>
    <text x="130" y="323.5" textLength="104" lengthAdjust="spacingAndGlyphs">（第二次）</text>
    <text x="224" y="391" textLength="180" lengthAdjust="spacing">信仰対象を失う</text>
  </g>

  <!-- 幕屋 -->
  <ellipse cx="314" cy="186" rx="54.8" ry="24.8" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="27" text-anchor="middle" dominant-baseline="central">
    <text x="292.5" y="186.5">幕</text>
    <text x="333" y="186.5">屋</text>
  </g>

  <!-- 十字架とイエス -->
  <g transform="translate(274,236) scale(0.805,0.714)" fill="#7A5230" stroke="#111" stroke-width="2.63" stroke-linejoin="round">
    <path d="M40,0 H60 V42 H100 V60 H60 V180 H40 V60 H0 V42 H40 Z"/>
  </g>
  <ellipse cx="314" cy="315.8" rx="59.8" ry="23.6" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <text x="313.5" y="317" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="82" lengthAdjust="spacing">イエス</text>

  <!-- イスラエル民族・ユダヤ民族 -->
  <g stroke="currentColor" stroke-width="2.5" fill="#F86D42">
    <ellipse cx="605" cy="186.5" rx="75.8" ry="41.3"/>
    <ellipse cx="605" cy="307" rx="72.8" ry="28.8"/>
  </g>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="603.5" y="174" textLength="120" lengthAdjust="spacingAndGlyphs">イスラエル</text>
    <text x="604" y="205.5" textLength="55" lengthAdjust="spacing">民族</text>
    <text x="606" y="307.5" textLength="113" lengthAdjust="spacingAndGlyphs">ユダヤ民族</text>
  </g>
</svg>
