<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の救いの摂理と人間自身の過ち</title>

  <!-- 神の救いの摂理 -->
  <rect x="236" y="58" width="436" height="85" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="453.5" y="101.5" font-size="54" text-anchor="middle" dominant-baseline="central">神の救いの摂理</text>
  <circle cx="711" cy="68" r="10.5"/>
  <circle cx="711" cy="133.5" r="10.5"/>
  <g font-size="46" dominant-baseline="central">
    <text x="733" y="70">創造主の責任</text>
    <text x="734" y="132">永存なさる主体</text>
  </g>

  <!-- 点線 -->
  <g stroke="currentColor" stroke-width="8" stroke-dasharray="16 8">
    <line x1="576.5" y1="160" x2="576.5" y2="247"/>
    <line x1="576.5" y1="486" x2="576.5" y2="570"/>
  </g>

  <!-- 救い＝復帰（堕・人から人へ）・堕落（人から堕・人へ） -->
  <text x="575.5" y="284" font-size="45" text-anchor="middle" dominant-baseline="central">救い＝復帰</text>
  <path d="M692.5,347.3 C606.7,321.2 540.2,322.5 476,345.5" fill="none" stroke="currentColor" stroke-width="8.5"/>
  <polygon points="454,356 469.5,334 479,358"/>
  <polygon points="457,398.5 674,398.5 674,407 695,394 674,381 674,389.5 457,389.5"/>
  <text x="576" y="444" font-size="49" text-anchor="middle" dominant-baseline="central">堕落</text>

  <!-- 人・堕・人 -->
  <circle cx="381.5" cy="369.5" r="53" fill="#FCE5E3" stroke="currentColor" stroke-width="4"/>
  <text x="381" y="369" font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111">人</text>
  <text x="381" y="455" font-size="40" text-anchor="middle" dominant-baseline="central">（永遠性）</text>
  <ellipse cx="807" cy="369.5" rx="98.5" ry="48.5" fill="#CF921C" stroke="currentColor" stroke-width="4"/>
  <text y="369" font-size="56" text-anchor="middle" dominant-baseline="central" fill="#111"><tspan x="768.5">堕</tspan><tspan x="808.5">・</tspan><tspan x="849.5">人</tspan></text>

  <text x="572.5" y="612" font-size="54" text-anchor="middle" dominant-baseline="central">人間自身の過ち</text>
</svg>
