<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>2. この国は神の一線であると同時にサタンの一線でなければならない</title>

  <!-- 題 -->
  <g font-size="29.5" dominant-baseline="central">
    <text x="34" y="37.5" textLength="28" lengthAdjust="spacingAndGlyphs">2.</text>
    <text x="75" y="37.5" textLength="469" lengthAdjust="spacing">この国は神の一線であると同時に</text>
    <text x="305" y="79.5" textLength="472" lengthAdjust="spacing">サタンの一線でなければならない</text>
  </g>
  <g stroke="currentColor" stroke-width="2.2">
    <line x1="71" y1="56.5" x2="543" y2="56.5"/>
    <line x1="305" y1="98.5" x2="777" y2="98.5"/>
  </g>

