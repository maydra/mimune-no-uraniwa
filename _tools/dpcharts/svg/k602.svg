<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イスラエル君主社会　ソロモン堕落から君主社会崩壊へ</title>

  <!-- 灰色の矢印（楕円より先に描く） -->
  <g fill="#8C949A">
    <polygon points="222,42 229,42 229,115 234,115 225.5,131 217,115 222,115"/>
    <polygon points="222,222 229,222 229,362 234,362 225.5,377 217,362 222,362"/>
    <polygon points="430,299.5 441,299.5 441,294 450.5,305.5 441,317.5 441,311.5 430,311.5"/>
  </g>

  <!-- イスラエルの楕円 -->
  <ellipse cx="225.5" cy="181.5" rx="97.2" ry="44.7" fill="#F8F28F" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="226" y="164" textLength="143" lengthAdjust="spacing">イスラエル</text>
    <text x="226" y="199">君主社会</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="340.5" cy="150.5" r="7.3"/>
    <circle cx="340.5" cy="200.5" r="7.3"/>
  </g>
  <g font-size="26" dominant-baseline="central">
    <text x="354" y="150.5" textLength="156" lengthAdjust="spacing">統一王国時代</text>
    <text x="354" y="200.5" textLength="260" lengthAdjust="spacing">メシヤが王の王として</text>
    <text x="354" y="235.5" textLength="182" lengthAdjust="spacing">君臨される基台</text>
    <text x="544" y="235.5" textLength="150" lengthAdjust="spacing">(世界的版図)</text>
  </g>

  <!-- ソロモン堕落 → 君主社会崩壊 -->
  <g font-size="28" dominant-baseline="central">
    <text x="239" y="305.5" textLength="171" lengthAdjust="spacing">ソロモン堕落</text>
    <text x="468" y="305.5" textLength="173" lengthAdjust="spacing">君主社会崩壊</text>
  </g>
</svg>
