<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>磐石二打が罪となった理由</title>

  <!-- 題 -->
  <text x="35" y="37.5" font-size="31" dominant-baseline="central" textLength="374" lengthAdjust="spacing">磐石二打が罪となった理由</text>
  <line x1="33" y1="56.5" x2="411" y2="56.5" stroke="currentColor" stroke-width="2"/>

  <!-- 命の水を出し得る磐石 ‖ 復帰した石 ‖ イエス -->
  <g fill="#F98AEE" stroke="currentColor" stroke-width="2.6">
    <ellipse cx="224" cy="124.5" rx="89" ry="37.5"/>
    <ellipse cx="225" cy="221" rx="93" ry="29"/>
    <ellipse cx="223.5" cy="307.5" rx="72" ry="27.5"/>
  </g>
  <g stroke="currentColor" stroke-width="4.5">
    <line x1="216" y1="168" x2="216" y2="186.5"/>
    <line x1="229" y1="168" x2="229" y2="186.5"/>
    <line x1="215" y1="257" x2="215" y2="275.5"/>
    <line x1="228" y1="257" x2="228" y2="275.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="224" y="108.5" font-size="23" textLength="91" lengthAdjust="spacing">命の水を</text>
    <text x="225" y="134.5" font-size="23" textLength="133" lengthAdjust="spacing">出し得る磐石</text>
    <text x="226" y="221" font-size="29" textLength="143" lengthAdjust="spacing">復帰した石</text>
    <text x="222.5" y="308" font-size="30" textLength="90" lengthAdjust="spacing">イエス</text>
  </g>

  <!-- モーセ二打・サタンが出現し得るという条件成立 -->
  <g fill="#CF921C" stroke="currentColor" stroke-width="2.6">
    <rect x="351.3" y="197.3" width="199.7" height="42.7"/>
    <rect x="351.3" y="270.3" width="201.2" height="71.7"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="451.5" y="218" font-size="30" textLength="154" lengthAdjust="spacing">モーセ二打</text>
    <text x="452" y="289.5" font-size="23" textLength="185" lengthAdjust="spacing">サタンが出現し得る</text>
    <text x="453" y="323.5" font-size="23" textLength="143" lengthAdjust="spacing">という条件成立</text>
  </g>

  <!-- 小さい矢印 -->
  <g fill="#8C949A" stroke="currentColor" stroke-width="1.2" stroke-linejoin="miter">
    <polygon points="325.5,219.5 335.5,208.5 335.5,213.5 343.5,213.5 343.5,225.5 335.5,225.5 335.5,230.5"/>
    <polygon points="560.5,219.5 570.5,208.5 570.5,213.5 578.5,213.5 578.5,225.5 570.5,225.5 570.5,230.5"/>
    <polygon points="322,307 332,296 332,301 340.5,301 340.5,313 332,313 332,318"/>
    <polygon points="561.5,308 571.5,297 571.5,302 578.5,302 578.5,314 571.5,314 571.5,319"/>
  </g>

  <!-- イスラエル不信 -->
  <g font-size="25" dominant-baseline="central">
    <text x="584" y="203.5" textLength="123" lengthAdjust="spacing">イスラエル</text>
    <text x="620" y="235" textLength="51" lengthAdjust="spacing">不信</text>
    <text x="584" y="294" textLength="122" lengthAdjust="spacing">イスラエル</text>
    <text x="620" y="325.5" textLength="51" lengthAdjust="spacing">不信</text>
  </g>

  <!-- 磐石：石板、イエスの根 ⇒ 神を象徴 -->
  <rect x="135.5" y="366.7" width="547.8" height="51.8" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <g font-size="30" dominant-baseline="central" fill="#111">
    <text x="161" y="392.5" textLength="60" lengthAdjust="spacing">磐石</text>
    <text x="238" y="392.5" text-anchor="middle">：</text>
    <text x="256" y="392.5" textLength="61" lengthAdjust="spacing">石板</text>
    <text x="317" y="392.5">、</text>
    <text x="342" y="392.5" textLength="154" lengthAdjust="spacing">イエスの根</text>
    <text x="534" y="392.5" textLength="125" lengthAdjust="spacing">神を象徴</text>
  </g>
  <polygon points="507.5,387 516,387 516,383 525.5,392.5 516,402 516,398 507.5,398" fill="#8C949A" stroke="#111" stroke-width="1.2"/>
</svg>
