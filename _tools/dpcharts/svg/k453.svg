<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>摂理的同時性の時代を形成する原因</title>

  <text x="34" y="38.5" font-size="30" dominant-baseline="central" textLength="503" lengthAdjust="spacing">摂理的同時性の時代を形成する原因</text>
  <line x1="33" y1="58" x2="539" y2="58" stroke="currentColor" stroke-width="2.8"/>

  <!-- メシヤのための基台 ＝ 実体基台 ＋ 信仰基台 -->
  <rect x="152" y="86" width="308" height="46" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="165" y="109" font-size="29" dominant-baseline="central" textLength="281" lengthAdjust="spacing">メシヤのための基台</text>
  <g stroke="currentColor" stroke-width="5">
    <line x1="229" y1="149" x2="229" y2="177"/>
    <line x1="242.5" y1="149" x2="242.5" y2="177"/>
    <line x1="234" y1="265.5" x2="234" y2="297"/>
    <line x1="219" y1="281" x2="250" y2="281"/>
  </g>
  <g stroke="currentColor" stroke-width="3" fill="#fff" class="paper">
    <rect x="151" y="195" width="164" height="48"/>
    <rect x="151" y="316" width="164" height="48"/>
  </g>
  <g font-size="29" dominant-baseline="central">
    <text x="171" y="218.5" textLength="125" lengthAdjust="spacing">実体基台</text>
    <text x="170" y="340" textLength="126" lengthAdjust="spacing">信仰基台</text>
  </g>

  <!-- 灰色のつなぎ -->
  <g stroke="#8C949A" stroke-width="6">
    <line x1="316" y1="221.5" x2="356" y2="221.5"/>
    <line x1="316" y1="338.5" x2="356" y2="338.5"/>
  </g>

  <!-- ② 堕落性を脱ぐための蕩減条件 -->
  <rect x="356" y="174.8" width="319" height="81.2" rx="4" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <circle cx="382" cy="199.5" r="10.3" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="382" y="200" font-size="19" text-anchor="middle" dominant-baseline="central" fill="#111">2</text>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text x="401" y="199.5" textLength="259" lengthAdjust="spacing">堕落性を脱ぐための</text>
    <text x="404" y="231" textLength="116" lengthAdjust="spacing">蕩減条件</text>
  </g>

  <!-- ① 中心人物・条件物・数理的な期間 -->
  <rect x="356" y="280" width="319" height="122" rx="4" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <circle cx="382" cy="341" r="10.3" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="382" y="341.5" font-size="19" text-anchor="middle" dominant-baseline="central" fill="#111">1</text>
  <path d="M433,301 H414.5 V378.5 H433 M414.5,339.5 H433" fill="none" stroke="#8C949A" stroke-width="6.5"/>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text x="442" y="301" textLength="114" lengthAdjust="spacing">中心人物</text>
    <text x="442" y="340.5" textLength="85" lengthAdjust="spacing">条件物</text>
    <text x="441" y="380" textLength="173" lengthAdjust="spacing">数理的な期間</text>
  </g>
</svg>
