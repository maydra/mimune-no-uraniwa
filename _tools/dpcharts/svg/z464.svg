<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>神の直接教示によりイエスを証す洗礼ヨハネの使命</title>

  <!-- 神からイエス・洗礼ヨハネへ（円の下に描く） -->
  <g stroke="currentColor" stroke-width="11">
    <line x1="580" y1="177.9" x2="425.2" y2="253.3"/>
    <line x1="635" y1="175.3" x2="794.6" y2="249.2"/>
  </g>
  <polygon points="400,265.5 418.4,239.4 432,267.2"/>
  <polygon points="820,261 801.1,235.1 788.1,263.3"/>

  <circle cx="606.5" cy="145" r="56.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="604.5" y="145" font-size="56" text-anchor="middle" dominant-baseline="central">神</text>

  <text x="796.5" y="174" font-size="45" text-anchor="middle" dominant-baseline="central">直接教示</text>
  <text x="904" y="174" font-size="36" dominant-baseline="central" textLength="177" lengthAdjust="spacingAndGlyphs">(ヨハネ 1:33)</text>
  <text x="309.5" y="229" font-size="46" text-anchor="middle" dominant-baseline="central">メシヤ</text>

  <!-- イエスと洗礼ヨハネの間 -->
  <g fill="#8C949A">
    <polygon points="436,288.5 768.5,288.5 768.5,276.5 797.5,294.5 768.5,312.5 768.5,300.5 436,300.5"/>
    <polygon points="792.5,330.5 459,330.5 459,319.5 431,337 459,354.5 459,343.5 792.5,343.5"/>
  </g>

  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="315.5" cy="316.5" rx="99.5" ry="51" fill="#F8F28F"/>
    <ellipse cx="936.75" cy="313.25" rx="120.25" ry="50.75" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="314.5" y="316" font-size="48">イエス</text>
    <text x="937" y="313.5" font-size="42">洗礼ヨハネ</text>
  </g>

  <!-- 洗礼ヨハネの使命 -->
  <g>
    <circle cx="752.5" cy="410" r="9.5"/>
    <circle cx="752.5" cy="472" r="9.5"/>
    <circle cx="752.5" cy="536" r="9.5"/>
  </g>
  <g font-size="42" dominant-baseline="central">
    <text x="775" y="410" textLength="245" lengthAdjust="spacing">エリヤの使命</text>
    <text x="775" y="473" textLength="244" lengthAdjust="spacing">イエスを証す</text>
    <text x="774" y="535" textLength="243" lengthAdjust="spacing">従い、仕える</text>
  </g>
</svg>
