<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>再臨主の「メシヤのための実体的な基台」造成</title>

  <text y="36.5" font-size="26.5" dominant-baseline="central"><tspan x="34" textLength="106" lengthAdjust="spacing">再臨主の</tspan><tspan x="149">「</tspan><tspan x="163" textLength="345" lengthAdjust="spacing">メシヤのための実体的な基台</tspan><tspan x="505">」</tspan><tspan x="528" textLength="52" lengthAdjust="spacing">造成</tspan></text>
  <line x1="34" y1="55" x2="580" y2="55" stroke="currentColor" stroke-width="2.2"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="217,142 224.5,154 220.5,154 220.5,266 213.5,266 213.5,154 209.5,154"/>
    <polygon points="442.5,193 463,207 452.5,207 452.5,221.5 433,221.5 433,207 422,207"/>
    <polygon points="289,291 303,282.5 303,287.5 569,287.5 569,294.5 303,294.5 303,299.5"/>
  </g>

  <!-- 神 -->
  <circle cx="217.5" cy="105.5" r="28" fill="#fff" class="paper" stroke="currentColor" stroke-width="3"/>
  <text x="217" y="106" font-size="30" text-anchor="middle" dominant-baseline="central">神</text>

  <!-- 信仰基台 -->
  <rect x="131.5" y="173" width="72" height="66" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="22" font-weight="400" dominant-baseline="central">
    <text x="146" y="193.5" textLength="44" lengthAdjust="spacing">信仰</text>
    <text x="146" y="218.5" textLength="44" lengthAdjust="spacing">基台</text>
  </g>

  <!-- メシヤのための実体的な基台 -->
  <rect x="246" y="139" width="410" height="43" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="264" y="160.5" font-size="28" dominant-baseline="central" textLength="372" lengthAdjust="spacing" fill="#111">メシヤのための実体的な基台</text>

  <!-- 実体基台 -->
  <rect x="377.5" y="234.5" width="132.5" height="40.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <text x="387" y="254" font-size="27" font-weight="400" dominant-baseline="central" textLength="111" lengthAdjust="spacing">実体基台</text>

  <!-- 再臨主・信徒 -->
  <g stroke="currentColor" stroke-width="3">
    <ellipse cx="217" cy="290.5" rx="67.5" ry="25" fill="#F8F28F"/>
    <ellipse cx="631.5" cy="291" rx="62" ry="31.5" fill="#F86D42"/>
  </g>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="216.5" y="291" textLength="83" lengthAdjust="spacing">再臨主</text>
    <text x="611" y="291">信</text>
    <text x="652" y="291">徒</text>
  </g>

  <!-- 出発のための摂理 -->
  <rect x="319" y="309.5" width="246.5" height="44.5" fill="#CDF8F7" stroke="currentColor" stroke-width="3"/>
  <text x="339" y="331" font-size="26" dominant-baseline="central" textLength="207" lengthAdjust="spacing" fill="#111">出発のための摂理</text>

  <!-- 括弧書き -->
  <g font-weight="400" dominant-baseline="central">
    <text y="336.5" font-size="23"><tspan x="146">（</tspan><tspan x="159" textLength="116" lengthAdjust="spacing">み言の実体</tspan><tspan x="274">）</tspan></text>
    <text y="377.5" font-size="25"><tspan x="358">（</tspan><tspan x="372" textLength="128" lengthAdjust="spacing">み言を中心</tspan><tspan x="498">）</tspan></text>
  </g>
</svg>
