<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>新しい時代の摂理と終末に処している現代人</title>

  <rect x="392.5" y="51" width="503" height="85.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="427" y="94.5" font-size="52" dominant-baseline="central" fill="#111" textLength="433" lengthAdjust="spacing">新しい時代の摂理</text>

  <text x="359" y="226" font-size="49" dominant-baseline="central" textLength="200" lengthAdjust="spacing">堕落人間</text>
  <g>
    <circle cx="588.5" cy="197.5" r="12"/>
    <circle cx="587" cy="262.5" r="12"/>
  </g>
  <g font-size="40" dominant-baseline="central">
    <text x="613" y="200" textLength="290" lengthAdjust="spacing">古い真理観執着</text>
    <text x="613" y="262" textLength="417" lengthAdjust="spacing">感応することが難しい</text>
  </g>

  <!-- 灰色の太い矢印 -->
  <polygon points="619,317 667.5,317 667.5,336 689.5,336 643.5,352 597,336 619,336" fill="#8C949A"/>

  <rect x="314.5" y="379.5" width="657.5" height="91" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <text x="351" y="426" font-size="52" dominant-baseline="central" fill="#111" textLength="594" lengthAdjust="spacing">終末に処している現代人</text>

  <g>
    <circle cx="261.5" cy="530" r="12"/>
    <circle cx="258.5" cy="611.5" r="12"/>
  </g>
  <g fill="#8C949A">
    <rect x="418" y="525.5" width="201" height="9"/>
    <polygon points="618,519.5 618,541.5 637,530.5"/>
    <rect x="532" y="605.5" width="85" height="9"/>
    <polygon points="616,599 616,621 636,610"/>
  </g>
  <g font-size="44" dominant-baseline="central">
    <text x="287" y="532" textLength="91" lengthAdjust="spacing">祈祷</text>
    <text x="654" y="532" textLength="183" lengthAdjust="spacing">神霊感得</text>
    <text x="286" y="611" textLength="229" lengthAdjust="spacing">神霊に呼応</text>
    <text x="654" y="611" textLength="413" lengthAdjust="spacingAndGlyphs">新しい真理探し求める</text>
  </g>
</svg>
