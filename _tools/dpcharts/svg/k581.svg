<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>メシヤ降臨準備時代とメシヤ再降臨準備時代　400年　横的蕩減復帰</title>

  <!-- 見出しの箱 -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="129" y="29" width="276" height="54" rx="5"/>
    <rect x="415.5" y="29" width="276" height="54" rx="5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="268" y="56" font-size="29" textLength="258" lengthAdjust="spacingAndGlyphs">メシヤ降臨準備時代</text>
    <text x="554" y="56" font-size="28" textLength="258" lengthAdjust="spacingAndGlyphs">メシヤ再降臨準備時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5">
    <rect x="129.5" y="91" width="276" height="316" rx="6"/>
    <rect x="415.5" y="91" width="276" height="316" rx="6"/>
  </g>
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="2.5">
    <rect x="129.5" y="325" width="276" height="82" rx="6"/>
    <rect x="415.5" y="325" width="276" height="82" rx="6"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="153" cy="115.5" r="10.3"/>
    <circle cx="437" cy="115.5" r="10.3"/>
  </g>
  <g font-size="17" text-anchor="middle" dominant-baseline="central">
    <text x="153" y="116">1</text>
    <text x="437" y="116">2</text>
  </g>

  <!-- 400年の区間 -->
  <path d="M172,153 H203.5 M187.5,153 V272 M172,272 H203.5 M457,153 H488 M472,153 V272 M457,272 H488" fill="none" stroke="#8C949A" stroke-width="6"/>
  <g font-size="26" dominant-baseline="central">
    <text x="212" y="139" textLength="155" lengthAdjust="spacingAndGlyphs">エルサレムに</text>
    <text x="211" y="168.5" textLength="50" lengthAdjust="spacingAndGlyphs">戻る</text>
    <text x="212" y="269.5" font-size="25" textLength="76" lengthAdjust="spacingAndGlyphs">イエス</text>
    <text x="498" y="152.5" textLength="155" lengthAdjust="spacingAndGlyphs">ローマに帰還</text>
    <text x="495" y="270.5" textLength="79" lengthAdjust="spacing">再臨主</text>
  </g>
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="210" y="207.5"><tspan textLength="41" lengthAdjust="spacingAndGlyphs">400</tspan><tspan x="252">年</tspan></text>
    <text x="495" y="211.5"><tspan textLength="41" lengthAdjust="spacingAndGlyphs">400</tspan><tspan x="537">年</tspan></text>
  </g>

  <!-- 下の箱 -->
  <g fill="#8C949A">
    <polygon points="261.5,358 270.5,358 270.5,365 278.5,365 266,374 253.5,365 261.5,365"/>
    <polygon points="545,359 554,359 554,366 560.5,366 549.5,374.5 538.5,366 545,366"/>
  </g>
  <g font-size="24" dominant-baseline="central" fill="#111">
    <text x="184" y="343"><tspan textLength="47" lengthAdjust="spacingAndGlyphs">4000</tspan><tspan x="234" textLength="118" lengthAdjust="spacing">年復帰摂理</tspan></text>
    <text x="197" y="390.5" textLength="141" lengthAdjust="spacing">横的蕩減復帰</text>
    <text x="470" y="343.5"><tspan textLength="47" lengthAdjust="spacingAndGlyphs">6000</tspan><tspan x="520" textLength="118" lengthAdjust="spacing">年復帰摂理</tspan></text>
    <text x="483" y="391" textLength="141" lengthAdjust="spacing">横的蕩減復帰</text>
  </g>
</svg>
