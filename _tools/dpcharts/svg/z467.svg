<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2882 2138" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>洗礼ヨハネの質問とイエスの婉曲な返事（マタイ11:3～5）</title>

  <!-- 行頭の● -->
  <circle cx="163" cy="185" r="19.5"/>
  <circle cx="163" cy="931.5" r="19.5"/>
  <circle cx="163" cy="1678" r="19.5"/>

  <!-- 本文（字ごとに元の位置へ。細字の所は font-weight 400、太字の所はゴシック） -->
  <g font-size="86" text-anchor="middle" dominant-baseline="central">
    <text y="185.0"><tspan x="246.5 341.0 430.0 523.0 613.0 704.5 796.0 886.0 977.0 1067.0 1157.0 1249.5 1340.5 1429.5 1520.0 1614.5 1700.0 1792.0 1883.0 1974.0 2065.0 2154.0 2223.0 2334.0 2426.0 2516.0 2606.5 2695.5" font-weight="400">イエスのすべての言行は人間洗礼ヨハネの目には、一様に理解</tspan></text>
    <text y="323.0"><tspan x="252.0 341.5 432.5 522.5 613.5 704.0 795.0 888.0 977.5 1068.0 1156.0 1250.0 1340.5 1431.0 1520.5 1612.0 1701.5 1790.5 1860.5 1967.5 2063.5 2153.0 2243.0 2335.5 2425.5 2513.5 2604.5 2695.5" font-weight="400">できないものとして映ったばかりでなく、メシヤとして信ずる</tspan></text>
    <text y="459.0"><tspan x="251.5 338.5 427.0 514.5 600.5 688.5 777.0 862.0 952.0 1039.0 1127.0 1193.5 1297.5 1386.0 1472.0 1558.0 1646.5 1735.0 1822.5 1910.0 1992.0 2083.5 2169.0 2259.0 2346.5 2434.0 2523.0 2609.5 2695.0" font-weight="400">ことができなかったので、自分の弟子たちをイエスのもとに送っ</tspan></text>
    <text y="596.5"><tspan x="252.0 318.5 411.0" font-weight="400">て、『</tspan><tspan x="468.0 554.0 640.0 726.5 812.0 897.5 984.0 1067.0 1155.0 1241.5 1327.0 1412.5 1499.0 1582.5 1670.0 1756.0 1823.5 1927.0 2013.5 2099.0 2184.5 2252.0 2353.0 2441.0 2526.5 2612.0 2698.5" font-size="80">きたるべきかたはあなたなのですか。それとも、ほかにだれ</tspan></text>
    <text y="734.5"><tspan x="249.0 333.5 418.5 504.0 589.0 673.0 755.5 843.0 929.5 1013.0 1097.0" font-size="80">かを待つべきでしょうか</tspan><tspan x="1153.0 1239.0 1297.0 1378.0 1453.0 1493.0 1541.5 1581.5 1624.5 1675.5 1713.5 1799.0 1887.0 1975.0 2064.0 2150.0 2218.0" font-weight="400">』（マタイ 11：3）と質問した。</tspan></text>
    <text y="931.5"><tspan x="246.5 341.0 430.0 522.0 614.0 705.5 796.0 862.5 974.5 1066.0 1156.0 1242.5 1336.5 1429.0 1515.5 1604.5 1700.5 1790.0 1881.0 1970.0 2060.5 2152.0 2242.0 2334.0 2426.0 2516.5 2608.0 2695.5" font-weight="400">イエスは改めて、自分がまさしくメシヤであるとは答えられな</tspan></text>
    <text y="1069.0"><tspan x="252.0 340.0 433.0 500.5 591.0" font-weight="400">かった。『</tspan><tspan x="648.0 735.5 820.0 886.0 988.5 1074.0 1160.0 1245.5 1331.0 1417.0 1502.5 1587.5 1672.5 1759.5 1845.0 1930.0 2015.5 2100.0 2187.5 2272.5 2360.0 2443.5 2530.0 2614.5 2700.0" font-size="80">行って、あなたがたが見聞きしていることをヨハネに報</tspan></text>
    <text y="1206.5"><tspan x="247.5 333.5 417.5 503.0 587.5 653.5 755.0 839.5 922.0 1009.5 1094.5 1160.0 1262.0 1346.5 1431.5 1514.0 1601.5 1685.5 1752.0 1855.5 1938.5 2023.0 2107.5 2190.5 2277.0 2364.0 2445.5 2533.0 2598.0 2699.0" font-size="80">告しなさい。盲人は見え、足なえは歩き、らい病人はきよまり、耳</tspan></text>
    <text y="1344.0"><tspan x="248.5 331.0 412.0 497.0 580.0 646.0 705.5 788.5 869.5 954.5 1037.5 1120.5 1204.0 1288.0 1353.0 1412.0 1495.5 1578.5 1660.5 1744.5 1825.0 1911.0 1993.0 2076.5 2159.0 2242.5 2326.0 2409.0 2492.0 2574.5 2657.0" font-size="80">しいは聞え、死人は生きかえり、貧しい人々は福音を聞かされている</tspan><tspan x="2712.0" font-weight="400">』</tspan></text>
    <text y="1481.5"><tspan x="232.0 289.0 370.5 445.5 485.5 534.0 574.0 617.5 667.5 736.5 806.0 845.5 931.0 998.5 1106.5 1195.0 1281.0 1369.5 1456.5 1544.0 1631.5 1721.5 1807.0 1875.0" font-weight="400">（マタイ 11：4～5）と、婉曲な返事をされた。</tspan></text>
    <text y="1678.0"><tspan x="252.5 341.5 433.0 526.0 615.5 707.0 797.5 889.5 979.0 1068.0 1161.5 1251.0 1340.5 1433.0 1499.5 1609.5 1702.0 1791.5 1882.5 1977.0 2062.5 2155.0 2245.0 2313.5 2419.5 2514.0 2603.0 2697.5" font-weight="400">選民として呼ばれたユダヤ民族、特に洗礼ヨハネは、イエスに</tspan></text>
    <text y="1815.5"><tspan x="252.0 342.0 428.0 519.0 606.0 696.5 762.5 867.5 959.0 1046.5 1137.0 1226.0 1315.5 1404.0 1491.0 1560.5" font-weight="400">逆らったので、イエスは仕方なく、</tspan><tspan x="1666.5 1754.0 1839.0 1925.0 2011.0 2098.0 2183.5 2267.0 2355.0 2441.0 2527.0 2613.0 2698.5" font-size="80">貧しい者のうちで福音を受け</tspan></text>
    <text y="1953.5"><tspan x="249.0 333.5" font-size="80">る者</tspan><tspan x="422.0 509.0 597.0 685.5 773.5 859.5 946.0 1034.5 1120.5 1207.0 1297.0 1365.0" font-weight="400">を求められたのであった。</tspan></text>
  </g>

  <!-- 下線 -->
  <g stroke="currentColor" stroke-width="5.5">
    <line x1="1383" y1="245.5" x2="1835" y2="245.5"/>
    <line x1="1843" y1="795.5" x2="2017" y2="795.5"/>
    <line x1="207" y1="992" x2="475" y2="992"/>
    <line x1="1371" y1="1402.5" x2="2698" y2="1402.5"/>
    <line x1="1062" y1="1542" x2="1499" y2="1542"/>
    <line x1="1624" y1="1874.5" x2="2741" y2="1874.5"/>
    <line x1="207" y1="2011.5" x2="376" y2="2011.5"/>
  </g>
</svg>
