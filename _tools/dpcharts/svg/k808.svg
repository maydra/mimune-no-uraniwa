<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>⑥ ルカ 17:22</title>

  <!-- ⑥ ルカ 17:22 -->
  <g font-size="26" dominant-baseline="central">
    <text x="34" y="42">⑥</text>
    <text x="72" y="42" textLength="54" lengthAdjust="spacing">ルカ</text>
    <text x="138" y="42" textLength="70" lengthAdjust="spacing">17:22</text>
  </g>

  <!-- 聖句 -->
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="155" y="136.5" textLength="493" lengthAdjust="spacing">『人の子の日を一日でも見たいと願っても</text>
    <text x="166" y="175.5" textLength="461" lengthAdjust="spacing">見ることができない時が来るであろう』</text>
  </g>

  <!-- 地上誕生 -->
  <ellipse cx="217.5" cy="294.5" rx="87.5" ry="31.5" fill="#CDF8F7" stroke="currentColor" stroke-width="2.6"/>
  <text x="217.5" y="294.5" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="124" lengthAdjust="spacing">地上誕生</text>

  <g font-size="27" dominant-baseline="central">
    <text x="320" y="255.5" textLength="304" lengthAdjust="spacing">人の子の日は来ること、</text>
    <text x="319" y="295" textLength="363" lengthAdjust="spacing">信ずることができないので、</text>
    <text x="320" y="335" textLength="342" lengthAdjust="spacing">それをそのような日として</text>
    <text x="320" y="374.5" textLength="257" lengthAdjust="spacing">見ることができない</text>
  </g>
</svg>
