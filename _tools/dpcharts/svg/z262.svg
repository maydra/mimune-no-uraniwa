<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>戒めと責任分担完遂</title>

  <!-- 成長の矢印（灰色の面と縁） -->
  <polygon points="318,175.7 363,231 340.5,231 340.5,421 295.5,421 295.5,231 273,231" fill="#C4CCD3" stroke="currentColor" stroke-width="4"/>
  <g fill="#8C949A">
    <rect x="254.5" y="251.5" width="127" height="10"/>
    <rect x="254.5" y="332.5" width="127" height="9"/>
  </g>

  <circle cx="317.5" cy="116" r="53" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <g stroke="currentColor">
    <line x1="229" y1="172.5" x2="407" y2="172.5" stroke-width="8"/>
    <line x1="229" y1="421" x2="407" y2="421" stroke-width="9"/>
  </g>
  <ellipse cx="318" cy="474.5" rx="80.5" ry="45" fill="#FCE5E3" stroke="currentColor" stroke-width="4"/>
  <text x="317" y="114.5" font-size="60" text-anchor="middle" dominant-baseline="central">神</text>
  <text x="316" y="474" font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">人間</text>

  <!-- 戒め → 責任分担完遂 -->
  <rect x="415.5" y="253" width="141.5" height="78.5" rx="9" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="430.5" y="292" font-size="56" dominant-baseline="central" textLength="112" lengthAdjust="spacing">戒め</text>
  <polygon points="577.5,286 620,286 620,278 648.5,291.5 620,305 620,297 577.5,297" fill="#8C949A"/>
  <rect x="665.5" y="252" width="343" height="85" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="688" y="294" font-size="48" dominant-baseline="central" textLength="299" lengthAdjust="spacing">責任分担完遂</text>

  <!-- 理由 -->
  <g font-size="44" dominant-baseline="central">
    <text x="666" y="412.5">①</text>
    <text x="718" y="412.5" textLength="230" lengthAdjust="spacing">神の創造性</text>
    <text x="757" y="475" textLength="274" lengthAdjust="spacing">万物の主管性</text>
    <text x="666" y="563">②</text>
    <text x="719" y="563" textLength="229" lengthAdjust="spacing">天使も主管</text>
  </g>
  <polygon points="679,468.5 721,468.5 721,462 742,474 721,486 721,479.5 679,479.5" fill="#8C949A"/>
  <!-- 括弧は字の幅がフォントで違うので、内側の端で合わせる -->
  <g font-size="40" font-weight="400" dominant-baseline="central">
    <text x="727" y="623" text-anchor="end">（</text>
    <text x="729" y="623" textLength="206" lengthAdjust="spacing">資格と威信</text>
    <text x="936" y="623">）</text>
  </g>
</svg>
