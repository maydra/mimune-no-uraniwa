    <polygon points="299.5,303 292.5,294 305,294"/>
    <path d="M487.5,282.5 Q492.5,273.5 505.5,275.5" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <polygon points="509,271.5 516,280.5 503.5,280.5"/>
