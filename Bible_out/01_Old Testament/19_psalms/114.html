<h1>詩篇 第114章</h1>
<div class="the-post-cont">

<p id="v1"><sup><a href="#v1" class="verse-link">1</a></sup>イスラエルがエジプトをいで、ヤコブの家が異言の民を離れたとき、</p>
<p id="v2"><sup><a href="#v2" class="verse-link">2</a></sup>ユダは主の聖所となり、イスラエルは主の所領となった。</p>
<p id="v3"><sup><a href="#v3" class="verse-link">3</a></sup>海はこれを見て逃げ、ヨルダンはうしろに退き、</p>
<p id="v4"><sup><a href="#v4" class="verse-link">4</a></sup>山は雄羊のように踊り、小山は小羊のように踊った。</p>
<p id="v5"><sup><a href="#v5" class="verse-link">5</a></sup>海よ、おまえはどうして逃げるのか、ヨルダンよ、おまえはどうしてうしろに退くのか。</p>
<p id="v6"><sup><a href="#v6" class="verse-link">6</a></sup>山よ、おまえたちはどうして雄羊のように踊るのか、小山よ、おまえたちはどうして小羊のように踊るのか。</p>
<p id="v7"><sup><a href="#v7" class="verse-link">7</a></sup>地よ、主のみ前におののけ、ヤコブの神のみ前におののけ。</p>
<p id="v8"><sup><a href="#v8" class="verse-link">8</a></sup>主は岩を池に変らせ、石を泉に変らせられた。</p>
