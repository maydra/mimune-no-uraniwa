<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>十字架以後のイスラエル選民はだれであろうか？</title>

  <text x="35" y="34.5" font-size="26" dominant-baseline="central" textLength="571" lengthAdjust="spacing">十字架以後のイスラエル選民はだれであろうか？</text>
  <line x1="34" y1="54" x2="610" y2="54" stroke="currentColor" stroke-width="2.5"/>

  <!-- キリスト教信徒 -->
  <ellipse cx="184" cy="219" rx="61" ry="50" fill="#FCE5E3" stroke="currentColor" stroke-width="3"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="184" y="205.5" font-size="25" textLength="98" lengthAdjust="spacingAndGlyphs">キリスト教</text>
    <text x="183.5" y="240" font-size="27" textLength="52" lengthAdjust="spacing">信徒</text>
  </g>
  <text x="180" y="292" font-size="22" text-anchor="middle" dominant-baseline="central" textLength="103" lengthAdjust="spacing">(ロマ 11:11)</text>

  <!-- 括弧 -->
  <path d="M268.5,130 L258.5,140 L258.5,341 L268.5,351" fill="none" stroke="currentColor" stroke-width="4.5"/>

  <circle cx="282" cy="150.5" r="7.5"/>
  <circle cx="282" cy="250" r="7.5"/>
  <circle cx="282" cy="333" r="7.5"/>
  <g font-size="26" dominant-baseline="central">
    <text x="301" y="149.5" textLength="360" lengthAdjust="spacing">アブラハムの信仰を受け継ぎ、</text>
    <text x="300" y="184" textLength="131" lengthAdjust="spacing">使命を継承</text>
    <text x="302" y="251" textLength="390" lengthAdjust="spacing">「再臨されるメシヤのための基台」</text>
    <text x="300" y="284.5" textLength="52" lengthAdjust="spacing">造成</text>
    <text x="301" y="331.5" textLength="392" lengthAdjust="spacing">アブラハムの血統的子孫ではない</text>
  </g>
</svg>
