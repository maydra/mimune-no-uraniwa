<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>原理と人間の責任分担</title>

  <!-- 成長期間（点線は矢印と箱の下を通る） -->
  <g stroke="currentColor" stroke-width="8">
    <line x1="268" y1="293" x2="1103.5" y2="293" stroke-dasharray="8.5 8.04"/>
    <line x1="268" y1="411.5" x2="1106.5" y2="411.5" stroke-dasharray="8.5 8.1"/>
  </g>
  <g fill="#C4CCD3" stroke="currentColor" stroke-width="3">
    <polygon points="399,186.5 453,251 421.5,251 421.5,518 379,518 379,251 345.5,251"/>
    <polygon points="743.5,186.5 797,251 766,251 766,518 723.5,518 723.5,251 690.5,251"/>
  </g>
  <g stroke="currentColor" stroke-width="8">
    <line x1="194" y1="177.5" x2="1101" y2="177.5"/>
    <line x1="194" y1="518.5" x2="1107" y2="518.5"/>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <ellipse cx="399.3" cy="115" rx="102.3" ry="56" fill="#CDF8F7"/>
    <ellipse cx="744" cy="115" rx="102" ry="56" fill="#CDF8F7"/>
    <ellipse cx="399.3" cy="580.5" rx="102.3" ry="57" fill="#DCC4C4"/>
    <ellipse cx="744.3" cy="580.3" rx="102.3" ry="56.8" fill="#FCE5E3"/>
  </g>
  <g font-size="61" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="399.5" y="115.5">完成</text>
    <text x="744.5" y="116.5">完成</text>
    <text x="399" y="581">万物</text>
    <text x="743.5" y="582">人間</text>
  </g>

  <text x="232" y="273.5" font-size="47" text-anchor="middle" dominant-baseline="central">成<tspan x="232" dy="50.3">長</tspan><tspan x="232" dy="50.3">期</tspan><tspan x="232" dy="50.3">間</tspan></text>

  <!-- 原理 ＋ 人間の責任分担 -->
  <g stroke="currentColor">
    <rect x="441.5" y="323.5" width="125.5" height="66.5" fill="#fff" class="paper" stroke-width="4.5"/>
    <rect x="826.5" y="207.5" width="126" height="67" fill="#fff" class="paper" stroke-width="4"/>
    <rect x="796.5" y="345" width="193" height="104" fill="#CDF8F7" stroke-width="4.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="503.5" y="358" font-size="48">原理</text>
    <text x="889" y="243" font-size="48">原理</text>
    <g font-size="40" fill="#111">
      <text x="892.5" y="374">人間の</text>
      <text x="893" y="421.5">責任分担</text>
    </g>
    <text y="484" font-size="40"><tspan x="817">（</tspan><tspan x="845">創</tspan><tspan x="887.5">2</tspan><tspan x="908.5">:</tspan><tspan x="927.5">1</tspan><tspan x="950">7</tspan><tspan x="968.5">）</tspan></text>
  </g>
  <g stroke="currentColor" stroke-width="11">
    <line x1="871" y1="310" x2="909.5" y2="310"/>
    <line x1="890" y1="300" x2="890" y2="330.5"/>
  </g>
</svg>
