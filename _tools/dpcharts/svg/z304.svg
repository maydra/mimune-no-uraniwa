  <!-- 結論 -->
  <rect x="397" y="586.5" width="556" height="73.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="678" y="623" font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">堕落行為干渉できない</text>
</svg>
