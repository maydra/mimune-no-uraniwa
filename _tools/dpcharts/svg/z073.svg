  <path d="M212.5,389.5 c19.32,12.04 37.81,23.5 59.25,23.5 c21.44,0 39.93,-11.46 59.25,-23.5 c19.32,-12.04 37.81,-23.5 59.25,-23.5 c21.44,0 39.93,11.46 59.25,23.5" fill="none" stroke="#111" stroke-width="4.5"/>
  <circle cx="331" cy="389.5" r="118.5" fill="none" stroke="currentColor" stroke-width="4.5"/>

  <!-- 神から創造原理へ -->
  <polygon points="463,370 493.5,370 493.5,358 511.5,382.5 493.5,407 493.5,395 463,395" fill="#8C949A"/>
  <rect x="523" y="235" width="74" height="296" fill="#fff" class="paper" stroke="currentColor" stroke-width="4"/>
  <text x="559.5" y="300.5" font-size="46" text-anchor="middle" dominant-baseline="central">創<tspan x="559.5" dy="55">造</tspan><tspan x="559.5" dy="56">原</tspan><tspan x="559.5" dy="55">理</tspan></text>

  <!-- 形象的・分立・象徴的 -->
  <g stroke="#8C949A" stroke-width="12" fill="none" marker-end="url(#z073-g)">
    <path d="M602.3,378.5 L791.3,297.1"/>
    <path d="M602.3,378.5 L791,452.7"/>
  </g>
  <g font-size="40" text-anchor="middle" dominant-baseline="central">
    <text x="664" y="315.5">形</text>
    <text x="706" y="288">象</text>
    <text x="747.5" y="271.5">的</text>
    <text x="667.5" y="449">象</text>
    <text x="708.5" y="464">徴</text>
    <text x="750.5" y="480.5">的</text>
  </g>
  <text x="737" y="376.5" font-size="44" text-anchor="middle" dominant-baseline="central">分立</text>

