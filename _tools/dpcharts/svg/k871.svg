<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>5. この国であらゆる文明が結実されなければならない</title>
  <defs>
    <marker id="k871-g" viewBox="0 0 12 14" refX="6" refY="7" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="14" orient="auto">
      <path d="M0,0 L12,7 L0,14 z" fill="#8C949A"/>
    </marker>
  </defs>

  <!-- 題 -->
  <text x="33" y="38" font-size="29" dominant-baseline="central">5.</text>
  <text x="70" y="38" font-size="29" dominant-baseline="central" textLength="539" lengthAdjust="spacingAndGlyphs">この国であらゆる文明が結実されなければならない</text>
  <line x1="66" y1="56.5" x2="609" y2="56.5" stroke="currentColor" stroke-width="2"/>

  <!-- 灰色の矢印 -->
  <g stroke="#8C949A" stroke-width="7" fill="none" marker-end="url(#k871-g)">
    <line x1="253" y1="160" x2="253" y2="187"/>
    <line x1="251" y1="272" x2="251" y2="298"/>
    <line x1="465" y1="262" x2="507.4" y2="307.6"/>
    <line x1="619" y1="262" x2="576.6" y2="307.6"/>
  </g>

  <!-- 左：縦的な歴史路程 -->
  <g font-size="28" dominant-baseline="central">
    <text x="142" y="103" textLength="228" lengthAdjust="spacing">縦的な歴史路程の</text>
    <text x="171" y="137.5" textLength="170" lengthAdjust="spacing">すべての文明</text>
    <text x="181" y="215" textLength="142" lengthAdjust="spacing">再臨社会で</text>
    <text x="195" y="249.5" textLength="114" lengthAdjust="spacing">横的復帰</text>
  </g>
  <ellipse cx="251" cy="357" rx="78" ry="48" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central">
    <text x="250.5" y="338.5" textLength="112" lengthAdjust="spacing">最高度の</text>
    <text x="251" y="374.5" textLength="112" lengthAdjust="spacing">文明社会</text>
  </g>

  <!-- 右：宗教と科学 -->
  <ellipse cx="461.5" cy="152" rx="42" ry="29.5" fill="#F98AEE" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="620.5" cy="151.5" rx="42" ry="29.5" fill="#A0F08A" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="461.5" y="152" textLength="57" lengthAdjust="spacing">宗教</text>
    <text x="620" y="152" textLength="56" lengthAdjust="spacing">科学</text>
  </g>
  <g stroke="currentColor" stroke-width="4">
    <line x1="457" y1="190" x2="457" y2="209"/>
    <line x1="466.5" y1="190" x2="466.5" y2="209"/>
    <line x1="615.5" y1="190" x2="615.5" y2="209"/>
    <line x1="624.5" y1="190" x2="624.5" y2="209"/>
  </g>
  <rect x="397.5" y="221.5" width="128" height="42" fill="#F98AEE" stroke="currentColor" stroke-width="3"/>
  <rect x="556.5" y="221.5" width="128" height="42" fill="#A0F08A" stroke="currentColor" stroke-width="3"/>
  <g font-size="26" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="461.5" y="242.5" textLength="104" lengthAdjust="spacing">精神文明</text>
    <text x="620" y="242" textLength="104" lengthAdjust="spacing">物質文明</text>
  </g>

  <!-- 韓国・理想世界 -->
  <ellipse cx="541.5" cy="358.5" rx="72" ry="44" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.5"/>
  <ellipse cx="541.5" cy="335" rx="42" ry="21" fill="#F8F28F" stroke="currentColor" stroke-width="2.5"/>
  <text x="542.5" y="335.5" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#111" textLength="56" lengthAdjust="spacing">韓国</text>
  <text x="541.5" y="374" font-size="26" text-anchor="middle" dominant-baseline="central" textLength="104" lengthAdjust="spacing">理想世界</text>
</svg>
