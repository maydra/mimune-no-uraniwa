<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イエスの荒野40日の断食祈祷と三大試練　遠因と近因</title>

  <!-- 題 -->
  <text x="49" y="36.5" font-size="28" dominant-baseline="central" textLength="46" lengthAdjust="spacing">(2)</text>
  <g font-size="27" dominant-baseline="central">
    <text x="104" y="36.5" textLength="165" lengthAdjust="spacing">イエスの荒野</text>
    <text x="275" y="36.5" textLength="28" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="312" y="36.5" textLength="300" lengthAdjust="spacing">日の断食祈祷と三大試練</text>
  </g>
  <line x1="103" y1="55" x2="611" y2="55" stroke="currentColor" stroke-width="2.2"/>
  <text x="102" y="80" font-size="28" dominant-baseline="central" textLength="147" lengthAdjust="spacing">遠因と近因</text>
  <line x1="103" y1="98" x2="247" y2="98" stroke="currentColor" stroke-width="2.4"/>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="225.8,194 231.2,194 231.2,216 236,216 228.5,228.5 221,216 225.8,216"/>
    <polygon points="226.8,293 232.2,293 232.2,318 236.5,318 229.5,328.5 222.5,318 226.8,318"/>
  </g>

  <!-- モーセ・洗礼ヨハネ・イエス -->
  <g stroke="currentColor" stroke-width="2.4" fill="#F8F28F">
    <ellipse cx="228.5" cy="164.5" rx="66.3" ry="30.3"/>
    <ellipse cx="228.5" cy="262.5" rx="66.3" ry="30.3"/>
    <ellipse cx="228.5" cy="362.5" rx="66.3" ry="30.3"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="229.5" y="163.5" font-size="30" textLength="92" lengthAdjust="spacing">モーセ</text>
    <text x="229.5" y="262" font-size="21" textLength="101" lengthAdjust="spacing">洗礼ヨハネ</text>
    <text x="229.5" y="363" font-size="30" textLength="92" lengthAdjust="spacing">イエス</text>
  </g>

  <!-- 縦書きの遠因・近因 -->
  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="140.5" y="148">遠</text>
    <text x="140.5" y="175">因</text>
    <text x="139" y="246.5">近</text>
    <text x="139" y="273.5">因</text>
  </g>

  <!-- 右の説明 -->
  <g font-size="28" dominant-baseline="central">
    <text x="319" y="162.5" textLength="172" lengthAdjust="spacing">磐石二度打つ</text>
    <text x="322" y="246" textLength="58" lengthAdjust="spacing">不信</text>
    <text x="317" y="286.5" textLength="347" lengthAdjust="spacing">「信仰基台」にサタンが侵入</text>
    <text x="320" y="363" textLength="29" lengthAdjust="spacingAndGlyphs">40</text>
    <text x="352" y="363" textLength="229" lengthAdjust="spacing">日断食と三大試練</text>
  </g>
</svg>
