<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>イサク献祭の成功</title>

  <text x="36" y="38.5" font-size="30" dominant-baseline="central" textLength="250" lengthAdjust="spacing">イサク献祭の成功</text>
  <line x1="35" y1="57.5" x2="286" y2="57.5" stroke="currentColor" stroke-width="2.2"/>

  <!-- 下向きの矢印（楕円の下に描く） -->
  <g fill="#8C949A">
    <polygon points="226.5,135 234.5,135 234.5,186 240,186 230.5,203 221,186 226.5,186"/>
    <polygon points="221.5,311.5 239.5,311.5 239.5,331.5 247,331.5 230.5,345.5 214,331.5 221.5,331.5"/>
  </g>

  <ellipse cx="229.5" cy="115" rx="55.5" ry="24" fill="#F8F28F" stroke="currentColor" stroke-width="2.2"/>
  <text x="231" y="115" font-size="27" text-anchor="middle" dominant-baseline="central" textLength="86" lengthAdjust="spacing" fill="#111">イサク</text>

  <!-- み旨が理解できる年齢 -->
  <text x="300" y="101" font-size="27" dominant-baseline="central" textLength="262" lengthAdjust="spacingAndGlyphs">み旨が理解できる年齢</text>
  <circle cx="338.5" cy="137.5" r="6"/>
  <circle cx="338" cy="175" r="6"/>
  <g font-size="26" dominant-baseline="central">
    <text x="353" y="138" textLength="193" lengthAdjust="spacingAndGlyphs">薪を背負って行く</text>
    <text x="352" y="174" textLength="181" lengthAdjust="spacingAndGlyphs">燔祭を心配する</text>
  </g>
  <g font-size="21" dominant-baseline="central">
    <text x="555" y="137.5" textLength="84" lengthAdjust="spacingAndGlyphs">(創 22:6)</text>
    <text x="543" y="174.5" textLength="83" lengthAdjust="spacingAndGlyphs">(創 22:7)</text>
  </g>

  <!-- 父親に反抗したならば -->
  <rect x="163.5" y="214.5" width="450" height="86" rx="30" fill="#fff" class="paper" stroke="currentColor" stroke-width="3.4"/>
  <g font-size="27" dominant-baseline="central">
    <text x="191" y="239" textLength="263" lengthAdjust="spacingAndGlyphs">父親に反抗したならば</text>
    <text x="466.5" y="239" text-anchor="middle">：</text>
    <text x="221" y="276" textLength="366" lengthAdjust="spacingAndGlyphs">神はイサク献祭を受けられない</text>
  </g>

  <!-- アブラハムとイサクの忠誠 -->
  <rect x="165" y="359" width="475" height="39" fill="#CDF8F7" stroke="currentColor" stroke-width="3.4"/>
  <g font-size="26" dominant-baseline="central" fill="#111">
    <text x="180" y="378" textLength="282" lengthAdjust="spacingAndGlyphs">アブラハムとイサクの忠誠</text>
    <text x="473.5" y="378" text-anchor="middle">：</text>
    <text x="486" y="378" textLength="141" lengthAdjust="spacingAndGlyphs">サタンを分立</text>
  </g>
</svg>
