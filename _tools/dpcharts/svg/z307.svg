<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>干渉：創造の価値賦与・原理的なものとして認定・サタンが新しい原理創造・サタンも創造主の立場</title>

  <!-- 神から堕落行為へ -->
  <polygon points="323,140 337,140 337,371 349,371 330,406.5 311,371 323,371" fill="#8C949A"/>
  <circle cx="329.5" cy="92" r="52.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="328" y="91" font-size="61" text-anchor="middle" dominant-baseline="central">神</text>
  <ellipse cx="329.5" cy="475.5" rx="93" ry="66" fill="#CF921C" stroke="currentColor" stroke-width="5"/>
  <g font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="330" y="448">堕落</text>
    <text x="329" y="503">行為</text>
  </g>

  <!-- 干渉： -->
  <rect x="362.5" y="225.5" width="119.5" height="70.5" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <text x="418.5" y="261" font-size="45" text-anchor="middle" dominant-baseline="central">干渉</text>
  <rect x="498.5" y="246.5" width="8" height="8"/>
  <rect x="498.5" y="264.5" width="8" height="8"/>
  <polyline points="553,72 525.5,100 525.5,481 545.5,505" fill="none" stroke="currentColor" stroke-width="8"/>

  <!-- 右の箱 -->
  <g fill="#8C949A">
    <polygon points="810.5,170 818.5,170 818.5,189.5 823,189.5 814.5,204 806,189.5 810.5,189.5"/>
    <polygon points="810.5,270.5 818.5,270.5 818.5,289 823,289 814.5,308 806,289 810.5,289"/>
    <polygon points="810.5,375 818.5,375 818.5,392.5 823,392.5 814.5,410.5 806,392.5 810.5,392.5"/>
  </g>
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="4">
    <rect x="568.5" y="105.5" width="495" height="62.5"/>
    <rect x="568.5" y="206" width="495" height="62.5"/>
    <rect x="568.5" y="310.5" width="495" height="62.5"/>
    <rect x="568.5" y="412.5" width="495" height="62.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="815.5" y="137" font-size="43" textLength="306" lengthAdjust="spacing">創造の価値賦与</text>
    <g font-size="41">
      <text x="815.5" y="237" textLength="456" lengthAdjust="spacing">原理的なものとして認定</text>
      <text x="816" y="341" textLength="457" lengthAdjust="spacing">サタンが新しい原理創造</text>
      <text x="816.5" y="444" textLength="414" lengthAdjust="spacing">サタンも創造主の立場</text>
    </g>
  </g>

  <!-- 結論 -->
  <rect x="397" y="571.5" width="563.5" height="71.5" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text x="679" y="607" font-size="50" text-anchor="middle" dominant-baseline="central" fill="#111">堕落行為干渉できない</text>
</svg>
