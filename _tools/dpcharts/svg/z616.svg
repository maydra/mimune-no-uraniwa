<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>ヨハネ 8:58　イエス ≠ 神御自身（イエスとアブラハム）</title>

  <!-- 聖句 -->
  <g font-size="40" dominant-baseline="central">
    <text y="57"><tspan x="207.8" textLength="120.9" lengthAdjust="spacing">ヨハネ</tspan> <tspan x="339.0" textLength="85.5" lengthAdjust="spacingAndGlyphs">8:58</tspan><tspan x="448.4" font-weight="400">『</tspan><tspan x="467.7" font-weight="400" textLength="633.1" lengthAdjust="spacing">アブラハムの生れる前からわたし</tspan></text>
    <text y="111" font-weight="400"><tspan x="466.1">（</tspan><tspan x="488.3" textLength="123.8" lengthAdjust="spacing">イエス</tspan><tspan x="614.9">）</tspan><tspan x="644.1" textLength="126.0" lengthAdjust="spacing">はいた</tspan><tspan x="771.0">…</tspan><tspan x="808.5">』</tspan></text>
  </g>

  <!-- イエスとアブラハム -->
  <g stroke="currentColor" stroke-width="4.5">
    <ellipse cx="373" cy="240" rx="114.5" ry="49.5" fill="#F8F28F"/>
    <ellipse cx="373.5" cy="462.5" rx="114" ry="49" fill="#FCE5E3"/>
  </g>
  <g dominant-baseline="central" fill="#111">
    <text x="300.4" y="239.5" font-size="49" textLength="147" lengthAdjust="spacing">イエス</text>
    <text x="276.5" y="463" font-size="44" textLength="195.5" lengthAdjust="spacingAndGlyphs">アブラハム</text>
  </g>

  <!-- 上下の矢印 -->
  <polygon points="356,297.5 368,319 360,319 360,402 352,402 352,319 344,319"/>
  <polygon points="388,299 396,299 396,382 404,382 392,402.5 380,382 388,382"/>
  <g font-size="41" dominant-baseline="central">
    <text x="206" y="324.5" textLength="125.3" lengthAdjust="spacing">血統的</text>
    <text x="207.2" y="375" textLength="123.1" lengthAdjust="spacing">に子孫</text>
  </g>

  <!-- 重生・復帰摂理 -->
  <circle cx="521.5" cy="316" r="10.75"/>
  <circle cx="519" cy="391" r="10.5"/>
  <g font-size="41" dominant-baseline="central">
    <text y="315.5"><tspan x="565.0" textLength="82" lengthAdjust="spacing">重生</tspan> <tspan x="772.7" textLength="165.7" lengthAdjust="spacing">人間祖先</tspan></text>
    <text y="390.5"><tspan x="540.5" textLength="157.4" lengthAdjust="spacingAndGlyphs">復帰摂理</tspan> <tspan x="779.5" textLength="314.8" lengthAdjust="spacingAndGlyphs">アブラハムの祖先</tspan></text>
  </g>
  <rect x="675" y="313" width="66" height="6"/>
  <rect x="716" y="388" width="44" height="6"/>

  <!-- イエス ≠ 神御自身（≠ は字ではなく線で描く） -->
  <rect x="411" y="565" width="513" height="76" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <g fill="#111">
    <text y="603.5" font-size="49" dominant-baseline="central"><tspan x="447.4" textLength="147" lengthAdjust="spacing">イエス</tspan> <tspan x="695.4" textLength="197.3" lengthAdjust="spacing">神御自身</tspan></text>
    <rect x="611" y="595" width="57" height="6"/>
    <rect x="611" y="608" width="57" height="6"/>
  </g>
  <line x1="625.9" y1="576.5" x2="651.2" y2="630.5" stroke="#111" stroke-width="7"/>
</svg>
