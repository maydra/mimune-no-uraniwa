<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>再臨主の苦難路程と「信仰基台」造成</title>

  <text x="33" y="38" font-size="30" dominant-baseline="central" textLength="515" lengthAdjust="spacing">再臨主の苦難路程と「信仰基台」造成</text>
  <line x1="33" y1="56.5" x2="549" y2="56.5" stroke="currentColor" stroke-width="2.4"/>

  <!-- キリスト教信徒 → 再臨主（不信） -->
  <polygon points="326.5,119 340.5,110.5 340.5,115.8 486,115.8 486,122.4 340.5,122.4 340.5,127.5" fill="#8C949A"/>
  <path d="M388.5,100.5 L422.5,135.5 M422.5,100.5 L388.5,135.5" stroke="currentColor" stroke-width="5"/>
  <text x="406" y="167" font-size="28" text-anchor="middle" dominant-baseline="central">不信</text>

  <g stroke="currentColor" stroke-width="2.6">
    <ellipse cx="261" cy="117" rx="60.7" ry="27.7" fill="#F8F28F"/>
    <ellipse cx="547.5" cy="119" rx="63.2" ry="36.7" fill="#F86D42"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="261.5" y="118" font-size="28" textLength="87" lengthAdjust="spacing">再臨主</text>
    <text x="549.5" y="110" font-size="25" textLength="109" lengthAdjust="spacingAndGlyphs">キリスト教</text>
    <text x="548.5" y="138.5" font-size="26">信徒</text>
  </g>

  <!-- 点線 -->
  <line x1="262.5" y1="156.5" x2="262.5" y2="202" stroke="currentColor" stroke-width="4" stroke-dasharray="6.5 6.2"/>

  <!-- 枠の中 -->
  <rect x="155.5" y="206" width="502" height="188.5" rx="8" fill="#fff" class="paper" stroke="currentColor" stroke-width="2.8"/>
  <g font-size="28" dominant-baseline="central">
    <text x="179" y="234" textLength="431" lengthAdjust="spacing">霊的な苦難路程を実体的蕩減復帰</text>
    <text x="212" y="285" textLength="401" lengthAdjust="spacing">新しく第三イスラエルを立てる</text>
    <text x="211" y="327" textLength="260" lengthAdjust="spacing">洗礼ヨハネの立場で</text>
    <text x="471" y="327">、</text>
    <text x="213" y="368" font-size="26" textLength="316" lengthAdjust="spacingAndGlyphs">「信仰基台」を実体的に造成</text>
  </g>
  <circle cx="196" cy="283" r="7"/>
  <circle cx="196" cy="330" r="7"/>
</svg>
