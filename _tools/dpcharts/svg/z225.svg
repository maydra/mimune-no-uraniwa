<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 1080" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>Ⅲ. 天使の堕落と人間の堕落　1. 天使の犯罪（ユダ書6節から7節）</title>

  <text x="50.6" y="59" font-size="49" dominant-baseline="central">Ⅲ.</text>
  <text y="59" font-size="49" dominant-baseline="central"><tspan x="135.0" textLength="548.9" lengthAdjust="spacing">天使の堕落と人間の堕落</tspan></text>
  <text x="73" y="142" font-size="43" dominant-baseline="central">1.</text>
  <text y="142" font-size="43" dominant-baseline="central"><tspan x="132.0" textLength="218.0" lengthAdjust="spacing">天使の犯罪</tspan></text>

  <circle cx="105" cy="240.5" r="9"/>
  <text y="241" font-size="43" dominant-baseline="central"><tspan x="132.4" textLength="174.4" lengthAdjust="spacing">それでは</tspan><tspan x="306.8">、</tspan><tspan x="350.4" textLength="828.4" lengthAdjust="spacing">天使と人間がいかなる罪を犯したかという</tspan></text>
  <text y="303.5" font-size="43" dominant-baseline="central"><tspan x="132.4" textLength="523.2" lengthAdjust="spacing">ことについて調べてみよう</tspan><tspan x="655.6">。</tspan></text>
  <text y="390" font-size="43" dominant-baseline="central"><tspan x="133" textLength="130.8" lengthAdjust="spacing">ユダ書</tspan> <tspan x="273.6">6</tspan> <tspan x="318" textLength="130.8" lengthAdjust="spacing">節から</tspan> <tspan x="460">7</tspan> <tspan x="505" textLength="87.2" lengthAdjust="spacing">節に</tspan></text>

  <!-- ユダ書の引用（細字は font-weight 400） -->
  <text x="132.8" y="464.5" font-size="38.5" font-weight="400" dominant-baseline="central">『</text>
  <text y="464.5" font-size="38.5" dominant-baseline="central"><tspan x="147.0" font-weight="400" textLength="77.2" lengthAdjust="spacing">主は</tspan><tspan x="224.2" font-weight="400">、</tspan><tspan x="262.8" font-weight="400" textLength="579.0" lengthAdjust="spacing">自分たちの地位を守ろうとはせず</tspan><tspan x="841.8" font-weight="400">、</tspan><tspan x="880.4" textLength="308.8" lengthAdjust="spacing">そのおるべき所を</tspan></text>
  <text y="527" font-size="38.5" dominant-baseline="central"><tspan x="133.5" textLength="348.2" lengthAdjust="spacing">捨て去った御使たち</tspan><tspan x="481.7" font-weight="400" textLength="38.7" lengthAdjust="spacing">を</tspan><tspan x="520.4" font-weight="400">、</tspan><tspan x="559.1" font-weight="400" textLength="503.0" lengthAdjust="spacing">大いなる日のさばきのために</tspan><tspan x="1062.1" font-weight="400">、</tspan><tspan x="1100.8" font-weight="400" textLength="77.4" lengthAdjust="spacing">永久</tspan></text>
  <text y="589.5" font-size="38.5" dominant-baseline="central"><tspan x="133.4" font-weight="400" textLength="347.4" lengthAdjust="spacing">にしばりつけたまま</tspan><tspan x="480.8" font-weight="400">、</tspan><tspan x="519.4" font-weight="400" textLength="579.0" lengthAdjust="spacing">暗やみの中に閉じ込めておかれた</tspan><tspan x="1098.4" font-weight="400">。</tspan><tspan x="1137.0" textLength="38.6" lengthAdjust="spacing">ソ</tspan></text>
  <text y="652" font-size="38.5" dominant-baseline="central"><tspan x="134.0" textLength="77.0" lengthAdjust="spacing">ドム</tspan><tspan x="211.0">、</tspan><tspan x="249.5" textLength="115.5" lengthAdjust="spacing">ゴモラ</tspan><tspan x="365.0" font-weight="400" textLength="38.5" lengthAdjust="spacing">も</tspan><tspan x="403.5" font-weight="400">、</tspan><tspan x="442.0" font-weight="400" textLength="269.5" lengthAdjust="spacing">まわりの町々も</tspan><tspan x="711.5" font-weight="400">、</tspan><tspan x="750.0" font-weight="400" textLength="231.0" lengthAdjust="spacing">同様であって</tspan><tspan x="981.0" font-weight="400">、</tspan><tspan x="1019.5" textLength="154.0" lengthAdjust="spacing">同じよう</tspan></text>
  <text y="714.5" font-size="38.5" dominant-baseline="central"><tspan x="134.5" textLength="269.5" lengthAdjust="spacing">に淫行にふけり</tspan><tspan x="404.0" font-weight="400">、</tspan><tspan x="442.5" font-weight="400" textLength="462.0" lengthAdjust="spacing">不自然な肉欲に走ったので</tspan><tspan x="904.5" font-weight="400">、</tspan><tspan x="943.0" font-weight="400" textLength="231.0" lengthAdjust="spacing">永遠の火の刑</tspan></text>
  <text y="777.5" font-size="38.5" dominant-baseline="central"><tspan x="134.5" font-weight="400" textLength="154.0" lengthAdjust="spacing">罰を受け</tspan><tspan x="288.5" font-weight="400">、</tspan><tspan x="327.0" font-weight="400" textLength="500.5" lengthAdjust="spacing">人々の見せしめにされている</tspan><tspan x="827.5" font-weight="400">』</tspan><tspan x="858.0" font-weight="400" textLength="308.0" lengthAdjust="spacing">と記録されている</tspan></text>
  <text y="848" font-size="38.5" dominant-baseline="central"><tspan x="134.5" font-weight="400" textLength="192.5" lengthAdjust="spacing">のを見ると</tspan><tspan x="327.0" font-weight="400">、</tspan></text>

  <rect x="135.75" y="888" width="584.5" height="80" fill="#CDF8F7" stroke="currentColor" stroke-width="3.5"/>
  <text y="926.5" font-size="41" dominant-baseline="central" fill="#111"><tspan x="156.0" textLength="540.8" lengthAdjust="spacing">天使が姦淫によって堕落した</tspan></text>
  <line x1="156" y1="951.5" x2="697" y2="951.5" stroke="#111" stroke-width="2"/>

  <text y="1013" font-size="38.5" dominant-baseline="central"><tspan x="134.5" font-weight="400" textLength="539.0" lengthAdjust="spacing">という事実を知ることができる</tspan><tspan x="673.5" font-weight="400">。</tspan></text>

  <!-- 下線 -->
  <g stroke="currentColor">
    <line x1="135" y1="89" x2="684" y2="89" stroke-width="3.5"/>
    <line x1="132" y1="170.5" x2="350" y2="170.5" stroke-width="3.5"/>
    <line x1="612" y1="269" x2="830" y2="269" stroke-width="3"/>
    <line x1="133" y1="418" x2="592" y2="418" stroke-width="3"/>
    <line x1="327" y1="556.5" x2="481.7" y2="556.5" stroke-width="2"/>
    <line x1="1137" y1="616.5" x2="1176" y2="616.5" stroke-width="3"/>
    <line x1="134" y1="679" x2="365" y2="679" stroke-width="3"/>
    <line x1="173" y1="741.5" x2="404" y2="741.5" stroke-width="3"/>
  </g>
</svg>
