<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>文芸復興（ルネッサンス）</title>

  <!-- 灰色の矢印 -->
  <polygon points="237.5,63 245.5,63 245.5,148 251.5,148 241.5,165 231.5,148 237.5,148" fill="#8C949A"/>

  <!-- 文芸復興（ルネッサンス） -->
  <ellipse cx="241" cy="218.5" rx="79" ry="49.5" fill="#F86D42" stroke="currentColor" stroke-width="3"/>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="241" y="201.5" font-size="29" textLength="116" lengthAdjust="spacing">文芸復興</text>
    <text x="240.5" y="235" font-size="23" textLength="137" lengthAdjust="spacingAndGlyphs">（ルネッサンス）</text>
  </g>

  <!-- 箇条 -->
  <g>
    <circle cx="354.5" cy="115.5" r="7.5"/>
    <circle cx="354.5" cy="169.5" r="7.5"/>
    <circle cx="354.5" cy="219.5" r="7.5"/>
    <circle cx="354.5" cy="275" r="7.5"/>
  </g>
  <g font-size="28.5" dominant-baseline="central">
    <text y="114"><tspan x="373.5" textLength="172.5" lengthAdjust="spacing">ヘレニズムの</tspan><tspan x="546" textLength="115" lengthAdjust="spacing">復興運動</tspan></text>
    <text y="167.5"><tspan x="373.5" textLength="115" lengthAdjust="spacing">人本主義</tspan><tspan x="504" textLength="57.5" lengthAdjust="spacing">台頭</tspan></text>
    <text y="220"><tspan x="430.5" textLength="143.75" lengthAdjust="spacing">イタリアで</tspan><tspan x="574.25" textLength="57.5" lengthAdjust="spacing">胎動</tspan></text>
    <text x="373.5" y="272.5" textLength="287.5" lengthAdjust="spacing">封建社会全般に対する</text>
    <text x="373.5" y="312.5" textLength="115" lengthAdjust="spacing">革新運動</text>
  </g>
  <text x="375" y="231.5" font-size="32" textLength="41" lengthAdjust="spacingAndGlyphs">14C</text>
</svg>
