<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>① 文化圏発展史</title>

  <g font-size="48" dominant-baseline="central">
    <text x="75.5" y="66" text-anchor="middle">①</text>
    <text x="107.5" y="66" textLength="297.5" lengthAdjust="spacing">文化圏発展史</text>
  </g>

  <!-- 2つの箱（z375・z379・z382・z384 で位置と形をそろえる） -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="205.5" y="208" width="428" height="338.5" fill="#fff" class="paper"/>
    <rect x="665.5" y="208" width="428" height="338.5" fill="#fff" class="paper"/>
    <ellipse cx="424" cy="209" rx="117.8" ry="47" fill="#F8F28F"/>
    <ellipse cx="879.5" cy="202" rx="89.6" ry="46" fill="#CF921C"/>
  </g>
  <g fill="#111" dominant-baseline="central">
    <text x="327.8" y="207.5" font-size="43" textLength="191.6" lengthAdjust="spacingAndGlyphs">キリスト教</text>
    <text x="879.5" y="202" font-size="57" text-anchor="middle">現世</text>
  </g>

  <!-- 左の箱 -->
  <circle cx="247.5" cy="310.5" r="12"/>
  <circle cx="246.5" cy="414.5" r="12"/>
  <g font-size="41" dominant-baseline="central">
    <text y="311"><tspan x="272.1" textLength="146.9" lengthAdjust="spacingAndGlyphs">真の父母</tspan><tspan x="419.3">、</tspan><tspan x="458" textLength="146" lengthAdjust="spacingAndGlyphs">善の子女</tspan></text>
    <text x="272.6" y="415" textLength="289.4" lengthAdjust="spacing">神を中心とした</text>
    <text x="271.9" y="473" textLength="206.4" lengthAdjust="spacing">大家族世界</text>
  </g>

  <!-- 右の箱 -->
  <circle cx="697.5" cy="293.5" r="12"/>
  <circle cx="697.5" cy="438.5" r="12"/>
  <g font-size="41" dominant-baseline="central">
    <text x="718.9" y="294" textLength="352.1" lengthAdjust="spacingAndGlyphs">キリスト教中心とした</text>
    <text x="718.8" y="352.5" textLength="247.4" lengthAdjust="spacing">一つの文化圏</text>
    <text x="719.5" y="439.5" textLength="287.7" lengthAdjust="spacing">イエスと聖霊を</text>
    <text x="717.4" y="498.5" textLength="347.6" lengthAdjust="spacingAndGlyphs">中心とした善の子女</text>
  </g>

  <!-- 現代 = 終末 -->
  <g font-size="65" dominant-baseline="central">
    <text x="473.5" y="614" textLength="130" lengthAdjust="spacing">現代</text>
    <text x="651" y="614" text-anchor="middle">=</text>
    <text x="700.5" y="614" textLength="130" lengthAdjust="spacing">終末</text>
  </g>
</svg>
