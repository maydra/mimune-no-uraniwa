<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>悪人の統一　復帰摂理の究極の目的：全人類を救う</title>

  <!-- 左の見出し（縦書き。下は右の列から読む：地上の悪人） -->
  <g font-size="45" text-anchor="middle" dominant-baseline="central">
    <text x="280" y="115.5">悪</text>
    <text x="280" y="160.5">霊</text>
    <text x="280" y="206.5">人</text>
  </g>
  <g font-size="41" text-anchor="middle" dominant-baseline="central">
    <text x="301.5" y="322.5">地</text>
    <text x="301.5" y="364">上</text>
    <text x="301.5" y="407">の</text>
    <text x="251" y="323">悪</text>
    <text x="251" y="406">人</text>
  </g>

  <!-- 地上の線と、悪霊人から地上の悪人への矢印 -->
  <line x1="205" y1="257.5" x2="779.5" y2="257.5" stroke="currentColor" stroke-width="7"/>
  <g stroke="currentColor" stroke-width="8">
    <line x1="419" y1="243" x2="419" y2="271"/>
    <line x1="560.5" y1="243" x2="560.5" y2="271"/>
    <line x1="700" y1="243" x2="700" y2="271"/>
  </g>
  <g fill="currentColor">
    <polygon points="407.5,270 430.5,270 419,291"/>
    <polygon points="549,270 572,270 560.5,291"/>
    <polygon points="688.5,270 711.5,270 700,291"/>
  </g>

  <!-- 地上の悪人から再臨主への弧（楕円より先に描き、始まりを楕円で隠す） -->
  <g stroke="currentColor" stroke-width="6" fill="none">
    <path d="M432,449 C603.9,606.3 866.7,498.3 871.82,360.99"/>
    <path d="M583,441 C735.6,493.5 832.3,424.2 844.19,358.7"/>
    <path d="M746,397 C784.5,403 810.5,368.9 814.28,354.39"/>
  </g>
  <g fill="currentColor">
    <polygon points="872.5,342.5 882.3,362.9 861.3,362.1"/>
    <polygon points="847.5,340.5 854.3,362.1 833.6,358.3"/>
    <polygon points="819,336.5 824.1,358.5 803.7,353.2"/>
  </g>

  <!-- 悪霊人と地上の悪人（茶） -->
  <g stroke="currentColor" stroke-width="4.5" fill="#CF921C">
    <ellipse cx="419" cy="165.5" rx="47" ry="78"/>
    <ellipse cx="560.25" cy="165.5" rx="48.75" ry="78"/>
    <ellipse cx="700" cy="165.5" rx="48.5" ry="78"/>
    <ellipse cx="419" cy="372.5" rx="48.5" ry="78"/>
    <ellipse cx="560.25" cy="372.5" rx="48.75" ry="78"/>
    <ellipse cx="700" cy="371.25" rx="48.5" ry="76.75"/>
  </g>
  <g font-size="69" dominant-baseline="central" fill="#111">
    <text x="418.5" y="166" text-anchor="middle">A</text>
    <text x="560" y="166" text-anchor="middle">B</text>
    <text x="700" y="166.5" text-anchor="middle">C</text>
    <text><tspan x="418.5" y="374" text-anchor="middle">A</tspan><tspan x="425.4" y="359.3">′</tspan></text>
    <text><tspan x="560" y="375" text-anchor="middle">B</tspan><tspan x="564.9" y="359.3">′</tspan></text>
    <text><tspan x="700" y="371.5" text-anchor="middle">C</tspan><tspan x="710.4" y="354.3">′</tspan></text>
  </g>

  <!-- 再臨主 -->
  <ellipse cx="847.25" cy="254.75" rx="49.25" ry="74.75" fill="#fff" class="paper" stroke="currentColor" stroke-width="4.5"/>
  <g font-size="39" text-anchor="middle" dominant-baseline="central">
    <text x="846.5" y="216">再</text>
    <text x="847" y="254.5">臨</text>
    <text x="846" y="294">主</text>
  </g>

  <polygon points="927,236.5 970,236.5 970,215.5 1007.5,247.5 970,279.5 970,258.5 927,258.5" fill="#8C949A"/>

  <!-- 悪人の統一 -->
  <rect x="1022" y="115" width="72.5" height="266" rx="6" fill="#CDF8F7" stroke="currentColor" stroke-width="4"/>
  <g font-size="46" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="1058.5" y="160.5">悪</text>
    <text x="1058.5" y="205.5">人</text>
    <text x="1058.5" y="252">の</text>
    <text x="1058.5" y="297.5">統</text>
    <text x="1058.5" y="342">一</text>
  </g>

  <!-- 仮名は全角、数字は幅が狭いので、分けて幅を合わせる -->
  <text y="529" font-size="41" font-weight="400" dominant-baseline="central"><tspan x="222.3">「</tspan><tspan x="243.5" textLength="118" lengthAdjust="spacingAndGlyphs">マタイ</tspan><tspan x="365" textLength="96" lengthAdjust="spacingAndGlyphs"> 8:29</tspan><tspan x="459.1">」</tspan></text>

  <g font-size="45.5" dominant-baseline="central">
    <text x="259.1" y="617.5" textLength="456" lengthAdjust="spacing">復帰摂理の究極の目的</text>
    <text x="740.5" y="617.5" text-anchor="middle">：</text>
    <text x="764" y="617.5" textLength="267" lengthAdjust="spacingAndGlyphs">全人類を救う</text>
  </g>
</svg>
