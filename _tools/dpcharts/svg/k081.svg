<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>献祭の実例</title>

  <!-- 題 -->
  <text x="34.5" y="37" font-size="31" textLength="156" lengthAdjust="spacing" dominant-baseline="central">献祭の実例</text>
  <line x1="34" y1="55.5" x2="191" y2="55.5" stroke="currentColor" stroke-width="2.2"/>

  <g font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="233.5" y="85" textLength="156" lengthAdjust="spacing">アベルの立場</text>
    <text x="588.5" y="85" textLength="156" lengthAdjust="spacing">カインの立場</text>
  </g>

  <!-- 灰色の矢印 -->
  <g fill="#8C949A">
    <polygon points="522,127.5 325,127.5 325,122.5 312,130.5 325,138.5 325,133.5 522,133.5"/>
    <polygon points="523,201 326,201 326,196 313,204 326,212 326,207 523,207"/>
    <polygon points="522,288.5 327,288.5 327,283.5 314,291.5 327,299.5 327,294.5 522,294.5"/>
    <polygon points="522,372.5 327,372.5 327,367.5 314,375.5 327,383.5 327,378.5 522,378.5"/>
  </g>
  <g font-size="25" text-anchor="middle" dominant-baseline="central">
    <text x="425" y="151.5" textLength="130" lengthAdjust="spacing">修道の生活</text>
    <text x="424" y="226" textLength="52" lengthAdjust="spacing">献祭</text>
    <text x="426" y="314.5" textLength="154" lengthAdjust="spacing">求めて一体化</text>
    <text x="426" y="398.5" textLength="104" lengthAdjust="spacing">従順屈伏</text>
  </g>

  <!-- アベルの立場 -->
  <g fill="#F8F28F" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="231.5" cy="130.5" rx="63" ry="25"/>
    <ellipse cx="232.5" cy="205.5" rx="63" ry="25"/>
    <ellipse cx="230.5" cy="290.5" rx="63" ry="36"/>
    <ellipse cx="231.5" cy="374.5" rx="63" ry="25"/>
  </g>
  <!-- カインの立場 -->
  <g fill="#F86D42" stroke="currentColor" stroke-width="2.2">
    <ellipse cx="584.5" cy="130.5" rx="63" ry="25"/>
    <ellipse cx="585.5" cy="203.5" rx="63" ry="25"/>
    <ellipse cx="584.5" cy="291.5" rx="63" ry="25"/>
    <ellipse cx="585" cy="374.5" rx="63" ry="25"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#111">
