<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>メシヤ降臨準備時代とメシヤ再降臨準備時代　平面的基台造成と平面的版図造成</title>

  <!-- 見出し -->
  <g fill="#CDF8F7" stroke="currentColor" stroke-width="3">
    <rect x="127" y="27" width="277.5" height="54" rx="5"/>
    <rect x="413.5" y="27" width="277.5" height="54" rx="5"/>
  </g>
  <g font-size="29" text-anchor="middle" dominant-baseline="central" fill="#111">
    <text x="267" y="54" textLength="259" lengthAdjust="spacingAndGlyphs">メシヤ降臨準備時代</text>
    <text x="553" y="54" textLength="259" lengthAdjust="spacingAndGlyphs">メシヤ再降臨準備時代</text>
  </g>

  <!-- 枠 -->
  <g fill="#fff" class="paper" stroke="currentColor" stroke-width="2.2">
    <rect x="129" y="89" width="275.5" height="319.5" rx="6"/>
    <rect x="415" y="89" width="275.5" height="319.5" rx="6"/>
  </g>

  <!-- ①② -->
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="150.5" cy="108" r="10"/>
    <circle cx="434.5" cy="108" r="10"/>
  </g>
  <g font-size="15" text-anchor="middle" dominant-baseline="central">
    <text x="150.5" y="108.5">1</text>
    <text x="434.5" y="108.5">2</text>
  </g>

  <!-- 箇条の点 -->
  <g>
    <circle cx="155" cy="135" r="5.5"/>
    <circle cx="155" cy="215" r="5.5"/>
    <circle cx="155" cy="267" r="5.5"/>
    <circle cx="155" cy="318" r="5.5"/>
    <circle cx="441" cy="140" r="5.5"/>
    <circle cx="441" cy="202" r="5.5"/>
    <circle cx="441" cy="238" r="5.5"/>
    <circle cx="441" cy="306" r="5.5"/>
  </g>

  <!-- 灰色の下向きの矢印 -->
  <g fill="#8C949A">
    <polygon points="260.5,344 271.5,344 271.5,352 277,352 265.75,363 254.5,352 260.5,352"/>
    <polygon points="546.5,349 557,349 557,356 563,356 552,367 541,356 546.5,356"/>
  </g>

  <!-- ① の字 -->
  <g font-size="25" font-weight="400" dominant-baseline="central">
    <text x="171" y="135.5" textLength="222" lengthAdjust="spacing">ローマ帝国の広大な</text>
    <text x="170.5" y="167.5" textLength="129" lengthAdjust="spacing">政治的版図</text>
    <text x="170.5" y="216" textLength="51" lengthAdjust="spacing">交通</text>
    <text x="171" y="267" textLength="207" lengthAdjust="spacing">ギリシャ語文化圏</text>
    <text x="171" y="317.5" textLength="208" lengthAdjust="spacing">メシヤ思想が拡張</text>
    <text x="174" y="385.5" font-size="26" textLength="183" lengthAdjust="spacing">平面的基台造成</text>
  </g>

  <!-- ② の字 -->
  <g font-size="24" font-weight="400" dominant-baseline="central">
    <text x="453.5" y="138.5" textLength="117" lengthAdjust="spacing">民主主義の</text>
    <text x="453" y="170.5" textLength="118" lengthAdjust="spacing">世界的版図</text>
    <text y="201.5"><tspan x="454" textLength="47" lengthAdjust="spacing">交通</tspan><tspan x="501">、</tspan><tspan x="524" textLength="119" lengthAdjust="spacing">通信の発達</tspan></text>
    <text y="238.5"><tspan x="454" textLength="47" lengthAdjust="spacing">言語</tspan><tspan x="501">、</tspan><tspan x="525" textLength="141" lengthAdjust="spacing">文化の世界的</tspan></text>
    <text x="454" y="269.5" textLength="47" lengthAdjust="spacing">交流</text>
    <text x="455" y="306.5" font-size="23" textLength="210" lengthAdjust="spacingAndGlyphs">メシヤ再降臨のための</text>
    <text x="619" y="335.5" font-size="22" textLength="42" lengthAdjust="spacing">思潮</text>
    <text x="460" y="385" font-size="26" textLength="183" lengthAdjust="spacing">平面的版図造成</text>
  </g>
</svg>
