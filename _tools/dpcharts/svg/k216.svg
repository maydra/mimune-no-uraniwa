<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>使徒 3:22 モーセのような預言者一人 → イエスを表示　ヨハネ 5:19 父のなさることを子もする → モーセの表示路程をイエスも歩まれる　モーセ：イエスの模擬者</title>

  <!-- ● -->
  <circle cx="143" cy="76.5" r="7.5"/>
  <circle cx="142.5" cy="197" r="7.5"/>

  <g font-size="28" dominant-baseline="central">
    <text x="159" y="76.5" textLength="57" lengthAdjust="spacing">使徒</text>
    <text x="224.5" y="76.5" font-size="30" textLength="57" lengthAdjust="spacingAndGlyphs">3:22</text>
    <text x="160.5" y="197" font-size="25.5" textLength="76" lengthAdjust="spacing">ヨハネ</text>
    <text x="244" y="197" font-size="30" textLength="51" lengthAdjust="spacingAndGlyphs">5:19</text>
  </g>

  <g font-size="30" dominant-baseline="central">
    <text x="325" y="79" textLength="358" lengthAdjust="spacing">モーセのような預言者一人</text>
    <text x="409.5" y="123" textLength="181" lengthAdjust="spacing">イエスを表示</text>
    <text x="323.5" y="197" textLength="358" lengthAdjust="spacing">父のなさることを子もする</text>
  </g>
  <g font-size="28.5" dominant-baseline="central">
    <text x="407.5" y="276.5" textLength="257" lengthAdjust="spacing">モーセの表示路程を</text>
    <text x="406.5" y="313" textLength="229" lengthAdjust="spacing">イエスも歩まれる</text>
  </g>

  <!-- 矢印 -->
  <g fill="#8C949A">
    <polygon points="344,120 377,120 377,115.5 393,123.5 377,131.5 377,127 344,127"/>
    <polygon points="344,273 377,273 377,268.5 393,276.5 377,284.5 377,280 344,280"/>
  </g>

  <!-- モーセ：イエスの模擬者 -->
  <rect x="234" y="360" width="343" height="43" fill="#CDF8F7" stroke="currentColor" stroke-width="2.5"/>
  <g font-size="27" dominant-baseline="central" fill="#111">
    <text x="255.5" y="382.5" textLength="81" lengthAdjust="spacing">モーセ</text>
    <text x="350.5" y="382.5" text-anchor="middle">：</text>
    <text x="365" y="382.5" textLength="191" lengthAdjust="spacing">イエスの模擬者</text>
  </g>
</svg>
