<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>天の側とサタン側　三大祝福の蘇生級完成型（非原理世界）</title>

  <!-- 灰色の矢印 -->
  <polygon points="481,111.5 299,111.5 299,119.5 276,105.5 299,91.5 299,99.5 481,99.5" fill="#8C949A"/>

  <!-- 天の側・サタン側 -->
  <g stroke="currentColor" stroke-width="2.5">
    <ellipse cx="196.5" cy="105" rx="72.5" ry="32" fill="#fff" class="paper"/>
    <ellipse cx="562.5" cy="104" rx="72.5" ry="32" fill="#50403D"/>
  </g>
  <text x="198" y="105.5" font-size="31" text-anchor="middle" dominant-baseline="central" textLength="93" lengthAdjust="spacing">天の側</text>
  <text x="564.5" y="104.5" font-size="28" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#fff" textLength="114" lengthAdjust="spacing">サタン側</text>

  <!-- 地の上の字 -->
  <g text-anchor="middle" dominant-baseline="central">
    <text x="388.5" y="77.5" font-size="27" textLength="57" lengthAdjust="spacing">復帰</text>
    <text x="388.5" y="136" font-size="26" textLength="184" lengthAdjust="spacing">第一次世界大戦</text>
    <text x="192" y="176" font-size="26.5" textLength="105" lengthAdjust="spacing">三大祝福</text>
    <text x="570.5" y="176" font-size="26" textLength="260" lengthAdjust="spacing">三大祝福の蘇生級完成型</text>
    <text x="570.5" y="214" font-size="25" textLength="160" lengthAdjust="spacing">（非原理世界）</text>
  </g>

  <!-- 括弧 -->
  <path d="M351.5,250 L342.5,259 L342.5,379 L351.5,387" fill="none" stroke="currentColor" stroke-width="5"/>

  <!-- 箇条 -->
  <g font-size="26" dominant-baseline="central">
    <text x="368" y="268" textLength="131" lengthAdjust="spacing">個性完成型</text>
    <text x="368" y="319" textLength="131" lengthAdjust="spacing">子女繁殖型</text>
    <text x="368" y="369" textLength="131" lengthAdjust="spacing">万物主管型</text>
    <g text-anchor="middle">
      <text x="512" y="268">：</text>
      <text x="512" y="319">：</text>
      <text x="512" y="369">：</text>
    </g>
    <text x="527" y="268" textLength="104" lengthAdjust="spacing">カイゼル</text>
    <text x="525.5" y="319" textLength="175" lengthAdjust="spacing">汎ゲルマン主義</text>
    <text x="525.5" y="369" textLength="158" lengthAdjust="spacing">世界制覇政策</text>
  </g>
</svg>
