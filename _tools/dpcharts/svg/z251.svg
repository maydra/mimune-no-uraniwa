  <g stroke="currentColor" stroke-width="8.5">
    <line x1="843.5" y1="200" x2="330" y2="318.8"/>
    <line x1="844.6" y1="192" x2="661.6" y2="344.5"/>
    <line x1="832.5" y1="192" x2="1035.8" y2="344.5"/>
  </g>
  <!-- 切れた所の × -->
  <g stroke="currentColor" stroke-width="7">
    <line x1="581" y1="239" x2="627" y2="275"/>
    <line x1="589" y1="279" x2="622" y2="231"/>
    <line x1="734" y1="252.5" x2="790" y2="271.5"/>
