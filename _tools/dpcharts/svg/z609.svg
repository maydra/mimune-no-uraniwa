<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>聖書：イエスが人間であることを明示（ロマ 5:19・コリントⅠ 15:21・使徒 17:31・ルカ 17:26）</title>

  <g font-size="41" dominant-baseline="central">
    <text y="94"><tspan x="204.0" textLength="82.0" lengthAdjust="spacing">ロマ</tspan> <tspan x="296.1" textLength="86.2" lengthAdjust="spacingAndGlyphs">5:19</tspan></text>
    <text y="94"><tspan x="524.6">『</tspan><tspan x="541.9" textLength="458.3" lengthAdjust="spacing">…ひとりの従順によって</tspan><tspan x="999.9">』</tspan></text>

    <text y="161.5"><tspan x="205.7" textLength="181.7" lengthAdjust="spacingAndGlyphs">コリントⅠ</tspan> <tspan x="395.8" textLength="93.5" lengthAdjust="spacingAndGlyphs">15:21</tspan></text>
    <text y="161.5"><tspan x="522.6">『</tspan><tspan x="540.9" textLength="520.1" lengthAdjust="spacing">…死人の復活もひとりの人</tspan></text>
    <text y="211.5"><tspan x="544.2" textLength="165.0" lengthAdjust="spacing">によって</tspan><tspan x="707.9">』</tspan></text>

    <text y="279"><tspan x="203.5" textLength="82.0" lengthAdjust="spacing">使徒</tspan> <tspan x="297.6" textLength="103.4" lengthAdjust="spacingAndGlyphs">17:31</tspan></text>
    <text y="279"><tspan x="520.6">『</tspan><tspan x="539.3" textLength="516.8" lengthAdjust="spacing">お選びになったかたによっ</tspan></text>
    <text y="331"><tspan x="538.6" textLength="83.5" lengthAdjust="spacing">て…</tspan><tspan x="619.9">』</tspan></text>

    <text y="396.5"><tspan x="203.9" textLength="82.0" lengthAdjust="spacing">ルカ</tspan> <tspan x="297.7" textLength="104.8" lengthAdjust="spacingAndGlyphs">17:26</tspan></text>
    <text y="396.5"><tspan x="519.6">『</tspan><tspan x="542.9" textLength="519.2" lengthAdjust="spacing">ノアの時にあったように、</tspan></text>
    <text y="447"><tspan x="539.7" textLength="334.4" lengthAdjust="spacing">人の子の時にも…</tspan><tspan x="870.9">』</tspan></text>
  </g>

  <rect x="214.5" y="545.5" width="866" height="83" fill="#CDF8F7" stroke="currentColor" stroke-width="4.5"/>
  <text y="587" font-size="50" dominant-baseline="central" fill="#111"><tspan x="244.0" textLength="93.2" lengthAdjust="spacingAndGlyphs">聖書</tspan><tspan x="349.5">：</tspan><tspan x="388.4" textLength="664.1" lengthAdjust="spacingAndGlyphs">イエスが人間であることを明示</tspan></text>
</svg>
