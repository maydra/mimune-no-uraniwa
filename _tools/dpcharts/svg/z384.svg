<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1303 689" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>② 外的主管性復帰（科学的主管性復帰）</title>

  <g dominant-baseline="central">
    <text x="77.5" y="56" font-size="48" text-anchor="middle">②</text>
    <text x="111.3" y="56" font-size="48" textLength="346" lengthAdjust="spacing">外的主管性復帰</text>
    <text x="467.8" y="55" font-size="44" textLength="407.3" lengthAdjust="spacingAndGlyphs">（科学的主管性復帰）</text>
  </g>
  <line x1="109" y1="86" x2="458" y2="86" stroke="currentColor" stroke-width="3.5"/>

  <!-- 2つの箱（z375・z379・z382・z384 で位置と形をそろえる） -->
  <g stroke="currentColor" stroke-width="4.5">
    <rect x="205.5" y="208" width="428" height="270" fill="#fff" class="paper"/>
    <rect x="665.5" y="208" width="428" height="270" fill="#fff" class="paper"/>
    <ellipse cx="419.5" cy="207.2" rx="90.1" ry="55.1" fill="#FCE5E3"/>
    <ellipse cx="879.5" cy="202" rx="89.6" ry="46" fill="#CF921C"/>
  </g>
  <g fill="#111" dominant-baseline="central" text-anchor="middle">
    <text x="419.5" y="183.5" font-size="46">人間</text>
    <text x="419.5" y="230.5" font-size="46">完成</text>
    <text x="879.5" y="202" font-size="57">現世</text>
  </g>

  <!-- 左の箱 -->
  <circle cx="240" cy="310" r="12"/>
  <g font-size="41" dominant-baseline="central">
    <text x="256.7" y="311" textLength="289.6" lengthAdjust="spacing">人間の霊感発達</text>
    <text x="257.5" y="377" textLength="330.8" lengthAdjust="spacing">科学の最高度発達</text>
  </g>

  <!-- 右の箱 -->
  <circle cx="699" cy="310" r="12"/>
  <g font-size="41" dominant-baseline="central">
    <text x="719.5" y="312" textLength="330.8" lengthAdjust="spacing">科学の最高度発達</text>
    <text x="720" y="378" textLength="288.7" lengthAdjust="spacing">安楽な生活環境</text>
  </g>

  <!-- 現代 = 終末 -->
  <g font-size="65" dominant-baseline="central">
    <text x="473.5" y="541" textLength="130" lengthAdjust="spacing">現代</text>
    <text x="651" y="541" text-anchor="middle">=</text>
    <text x="700.5" y="541" textLength="130" lengthAdjust="spacing">終末</text>
  </g>
</svg>
