<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 435" class="dpc-svg" role="img" font-family="'BIZ UDPGothic','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-weight="700" fill="currentColor">
  <title>三番目の鳩：第三のアダム 再臨主象徴</title>

  <!-- 上からの矢印 -->
  <polygon points="230,31 237,31 237,103.5 242,103.5 233.5,116.5 225,103.5 230,103.5" fill="#8C949A"/>

  <!-- 三番目の鳩 -->
  <ellipse cx="234" cy="164" rx="98.5" ry="33" fill="#CDF8F7" stroke="currentColor" stroke-width="2.2"/>
  <text x="231.5" y="163.5" font-size="31" text-anchor="middle" dominant-baseline="central" fill="#111">三番目の鳩</text>

  <text y="162.5" font-size="30" dominant-baseline="central"><tspan x="345" textLength="176" lengthAdjust="spacing">第三のアダム</tspan> <tspan x="538" textLength="148" lengthAdjust="spacing">再臨主象徴</tspan></text>
  <g font-size="28" font-weight="400" dominant-baseline="central">
    <text x="346" y="223" textLength="316" lengthAdjust="spacing">箱舟に帰ってこなかった</text>
    <text x="204" y="271" textLength="459" lengthAdjust="spacing">その理想は取り除かれることはない</text>
  </g>
  <line x1="170" y1="270.5" x2="191" y2="270.5" stroke="currentColor" stroke-width="3"/>

  <text x="398" y="334" font-size="30" textLength="212" lengthAdjust="spacing" dominant-baseline="central">創造理想実現</text>
</svg>
